            '# ── 1. 큐 선언 (없으면 생성) ─────────────────────',
            'rabbitmqadmin declare queue name=task.queue durable=true',
            '',
            '# ── 2. default exchange 로 발행 (routing_key = 큐 이름) ─',
            'rabbitmqadmin publish \\',
            '  exchange="" \\',
            '  routing_key="task.queue" \\',
            '  payload="resize image #42"',
            '',
            '# ── 3. 큐에 실제로 들어갔는지 확인 ────────────────',
            'rabbitmqadmin get queue=task.queue count=1 ackmode=ack_requeue_true',
            '',
            '# ── 4. Direct Exchange 의 바인딩 목록 확인 ────────',
            'rabbitmqadmin list bindings source destination routing_key',
            '',
            '# 출력 예:',
            '#   source        destination    routing_key',
            '#   (default)     task.queue     task.queue     ← 자동 바인딩',
            '#   logs.direct   error.queue    log.error',
            '#   logs.direct   audit.queue    log.error',
            '#   logs.direct   info.queue     log.info',
            '',
            '# ── 정리 ────────────────────────────────────────',
            '#   • Direct = routing key 와 binding key 완전 일치',
            '#   • 하나의 key ↔ 여러 큐 / 여러 key ↔ 한 큐 가능',
            '#   • default("")는 큐 이름을 routing key 로 쓰는 Direct',
            '#   • 와일드카드가 필요하면 다음 장 Topic Exchange',
          ],
          highlight: [4, 5, 6, 11, 14, 15, 16, 17, 26, 27, 32, 33, 34, 35],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 라우팅 시뮬레이션
    // ─────────────────────────────────────────────────────
    const QUEUE_STATE = {
      idle:    { ring: 'border-slate-300',  bg: 'bg-slate-50',  text: 'text-slate-600',  badge: 'bg-slate-200 text-slate-700', label: '대기' },
      match:   { ring: 'border-green-400',  bg: 'bg-green-50',  text: 'text-green-800',  badge: 'bg-green-200 text-green-900', label: '✓ 매칭 — 전달' },
      nomatch: { ring: 'border-slate-300',  bg: 'bg-white',     text: 'text-slate-400',  badge: 'bg-slate-100 text-slate-400', label: '✗ 불일치 — 무시' },
    };

    const ALERT_TONE = {
      good: 'bg-green-50  border-green-300  text-green-900',
      info: 'bg-sky-50    border-sky-300    text-sky-900',
      warn: 'bg-amber-50  border-amber-300  text-amber-900',
      err:  'bg-red-50    border-red-300    text-red-900',
    };

    function QueueNode({ q }) {
      const s = QUEUE_STATE[q.state] || QUEUE_STATE.idle;
      return (
        <div className={`rounded-lg border-2 ${s.ring} ${s.bg} px-3 py-2 shadow-sm transition`}>
          <div className="flex items-center gap-2 flex-wrap">
            <span className={`text-sm font-bold ${s.text}`}>{q.name}</span>
            <span className={`ml-auto text-[10px] px-1.5 py-0.5 rounded ${s.badge}`}>{s.label}</span>
          </div>
          <div className={`mt-1 text-xs font-mono ${s.text}`}>binding key: {q.bindingKey}</div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      const queues = step.queues || [];
      const alertCls = ALERT_TONE[step.alert.tone] || ALERT_TONE.info;
      return (
        <div className="rounded-xl bg-white border-2 border-orange-200 shadow-md p-4 h-full flex flex-col">
          <div className="text-xs font-bold mb-3" style={{ color: BRAND_DARK }}>{step.actor}</div>

          {/* Producer → Exchange 헤더 */}
          <div className="rounded-lg border-2 px-3 py-2.5 mb-2 shadow-sm" style={{ borderColor: BRAND, backgroundColor: '#fff4eb' }}>
            <div className="flex items-center gap-2 flex-wrap text-xs">
              <span className="font-bold" style={{ color: BRAND_DARK }}>📤 Producer</span>
              <span className="text-slate-500">routing key:</span>
              <span className="font-mono font-bold px-2 py-0.5 rounded text-white" style={{ backgroundColor: step.routingKey ? BRAND : '#94a3b8' }}>
                {step.routingKey || '(발행 전)'}
              </span>
            </div>
          </div>

          <div className="flex items-center justify-center text-lg mb-1" style={{ color: BRAND }}>↓</div>

          {/* Direct Exchange */}
          <div className="rounded-lg border-2 px-3 py-2 mb-2 text-center shadow-sm" style={{ borderColor: BRAND_DARK, backgroundColor: '#ffe8d6' }}>
            <span className="text-xs font-bold" style={{ color: BRAND_DARK }}>🔀 Direct Exchange: {step.exchange}</span>
            <div className="text-[10px] text-slate-600 mt-0.5">routing key 와 binding key 를 문자열 완전 일치로 비교</div>
          </div>

          <div className="flex items-center justify-center text-lg mb-1" style={{ color: BRAND }}>↓</div>

          {/* 큐 목록 */}
          <div className="space-y-2 mb-3">
            {queues.map((q, i) => <QueueNode key={i} q={q} />)}
          </div>

          {/* 핵심 안내 */}
          <div className={`mt-auto rounded-lg border-2 ${alertCls} px-3 py-2 text-xs leading-relaxed`}>
            💡 {step.alert.text}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ stepIdx, total }) {
      const codeRef = useRef(null);
      const code = STEPS[stepIdx].code;

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 5탭 헤더 */}
          <div className="flex items-center gap-0 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {STEPS.map((s, i) => {
              const isActive = i === stepIdx;
              return (
                <div
                  key={i}
                  className={`px-3 py-2 text-[10px] font-mono whitespace-nowrap border-r border-slate-700 ${
                    isActive
                      ? 'bg-[#282c34] text-orange-300 border-t-2 border-t-orange-400'
                      : 'bg-slate-900 text-slate-500'
                  }`}
                >
                  {s.code.filename}
                </div>
              );
            })}
          </div>

          {/* 파일명 바 */}
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-amber-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>

          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>

          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: BRAND }}>II</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: BRAND_DARK }}>II-1-1. Direct Exchange</h1>
                <p className="text-sm" style={{ color: BRAND_DARK, opacity: 0.8 }}>routing key 정확 매칭으로 큐를 고른다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND_DARK }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? BRAND : '#fed7aa' }}
                />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-orange-50 px-5 py-4 shadow" style={{ backgroundColor: BRAND_DARK }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50"
                style={{ color: BRAND_DARK }}
                aria-label="처음으로"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: BRAND_DARK }}
                aria-label="이전 단계"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? BRAND_DARK : BRAND }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: BRAND_DARK }}
                aria-label="다음 단계"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: BRAND_DARK, opacity: 0.6 }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm" style={{ color: BRAND_DARK }}>
                <div className="font-bold mb-1">✅ Direct Exchange 학습 완료</div>
                Direct 는 routing key 와 binding key 의 완전 일치로 큐를 고른다. 하나의 key 에 여러 큐(멀티캐스트), 한 큐에 여러 key(OR 수신) 조합으로 로그 레벨·작업 종류 라우팅을 깔끔히 처리한다. default exchange("")도 큐 이름을 routing key 로 쓰는 Direct 다. 다음(II-1-2)은 와일드카드 패턴 매칭을 지원하는 Topic Exchange 를 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RabbitMQ', 'Direct-Exchange', 'routing-key', 'binding-key', 'queue_bind', '멀티캐스트', 'default-exchange', 'log-routing', 'pika', 'amqp-client', 'AMQP'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border border-orange-200" style={{ backgroundColor: '#fff4eb', color: BRAND_DARK }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND_DARK }}>
              <a href="../part1/I-1-4.html" className="underline hover:no-underline">← 이전: I-1-4</a>
              <a href="../index.html" className="underline hover:no-underline">목차</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
