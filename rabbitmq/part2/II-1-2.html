              패턴과 어떻게 매칭되어 여러 큐로 동시에 라우팅되는지 5단계로 학습한다.
    패턴: fastapi v1 — 좌(routing key ↔ binding 패턴 매칭 시뮬레이션) / 우(VSCode CodeViewer 5탭)

  -->

    // ─────────────────────────────────────────────────────
    // Topic 매칭 알고리즘 (RabbitMQ 의미론)
    //   - 단어는 점(.)으로 구분
    //   - '*' = 정확히 한 단어
    //   - '#' = 0개 이상 단어
    // ─────────────────────────────────────────────────────
    function matchTopic(patternWords, keyWords) {
      if (patternWords.length === 0) return keyWords.length === 0;
      const p = patternWords[0];
      const restP = patternWords.slice(1);
      if (p === '#') {
        for (let i = 0; i <= keyWords.length; i++) {
          if (matchTopic(restP, keyWords.slice(i))) return true;
        }
        return false;
      }
      if (keyWords.length === 0) return false;
      if (p === '*' || p === keyWords[0]) {
        return matchTopic(restP, keyWords.slice(1));
      }
      return false;
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — routing key ↔ 패턴 매칭 시뮬레이션
    // ─────────────────────────────────────────────────────
    const NODE_STATE = {
      idle:    { ring: 'border-slate-300',  bg: 'bg-slate-50',    text: 'text-slate-600',  dot: 'bg-slate-300'  },
      active:  { ring: 'border-orange-400', bg: 'bg-orange-50',   text: 'text-orange-800', dot: 'bg-orange-500' },
      success: { ring: 'border-green-400',  bg: 'bg-green-50',    text: 'text-green-800',  dot: 'bg-green-500'  },
      warn:    { ring: 'border-amber-400',  bg: 'bg-amber-50',    text: 'text-amber-800',  dot: 'bg-amber-500'  },
      error:   { ring: 'border-red-400',    bg: 'bg-red-50',      text: 'text-red-800',    dot: 'bg-red-500'    },
      info:    { ring: 'border-sky-400',    bg: 'bg-sky-50',      text: 'text-sky-800',    dot: 'bg-sky-500'    },
    };

    const ALERT_TONE = {
      good: 'bg-green-50  border-green-300  text-green-900',
      info: 'bg-sky-50    border-sky-300    text-sky-900',
      warn: 'bg-amber-50  border-amber-300  text-amber-900',
      err:  'bg-red-50    border-red-300    text-red-900',
    };

    function FlowNode({ node, idx, total }) {
      const s = NODE_STATE[node.state] || NODE_STATE.idle;
      return (
        <div className={`rounded-lg border-2 ${s.ring} ${s.bg} px-3 py-2 shadow-sm`}>
          <div className="flex items-center gap-2">
            <span className={`inline-block w-2 h-2 rounded-full ${s.dot}`}></span>
            <span className={`text-xs font-mono ${s.text}`}>#{idx + 1} / {total}</span>
            <span className={`ml-auto text-sm font-bold ${s.text}`}>{node.node}</span>
          </div>
          <div className="mt-1 text-xs text-slate-700 leading-relaxed">{node.detail}</div>
        </div>
      );
    }

    // 한 단어(word) 를 색으로 구분한 칩
    function WordChip({ word, kind }) {
      let cls = 'bg-slate-100 text-slate-700 border-slate-300';
      if (kind === 'star') cls = 'bg-amber-100 text-amber-900 border-amber-400 font-bold';
      else if (kind === 'hash') cls = 'bg-purple-100 text-purple-900 border-purple-400 font-bold';
      else if (kind === 'key') cls = 'bg-orange-100 text-orange-900 border-orange-400';
      return <span className={`px-1.5 py-0.5 rounded border text-[11px] font-mono ${cls}`}>{word}</span>;
    }

    function WordRow({ words, isPattern }) {
      return (
        <div className="flex items-center gap-1 flex-wrap">
          {words.map((w, i) => {
            let kind = 'literal';
            if (isPattern && w === '*') kind = 'star';
            else if (isPattern && w === '#') kind = 'hash';
            else if (!isPattern) kind = 'key';
            return (
              <React.Fragment key={i}>
                {i > 0 && <span className="text-slate-400 text-[11px]">.</span>}
                <WordChip word={w} kind={kind} />
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    function MatchBoard({ routingKey, bindings }) {
      const keyWords = routingKey.split('.');
      const matchedCount = bindings.filter((b) => matchTopic(b.pattern.split('.'), keyWords)).length;
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white px-3 py-3 shadow-sm">
          {/* routing key */}
          <div className="mb-3">
            <div className="text-[10px] font-bold text-orange-800 mb-1">📨 publish 된 routing key</div>
            <WordRow words={keyWords} isPattern={false} />
          </div>

          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-orange-800">🔗 binding 패턴 매칭</div>
            <div className="text-[10px] text-slate-500">{matchedCount} / {bindings.length} 큐 라우팅됨</div>
          </div>

          <div className="space-y-1.5">
            {bindings.map((b, i) => {
              const patWords = b.pattern.split('.');
              const matched = matchTopic(patWords, keyWords);
              const rowCls = matched
                ? 'border-green-300 bg-green-50'
                : 'border-red-200 bg-red-50/50';
              return (
                <div key={i} className={`rounded border ${rowCls} px-2 py-1.5`}>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-mono font-bold text-[11px] text-slate-800">{b.queue}</span>
                    {matched ? (
                      <span className="px-1.5 rounded bg-green-200 text-green-900 text-[10px] font-bold">✓ 라우팅됨</span>
                    ) : (
                      <span className="px-1.5 rounded bg-red-200 text-red-900 text-[10px] font-bold">✗ 매칭 안됨</span>
                    )}
                  </div>
                  <div className="mt-1">
                    <WordRow words={patWords} isPattern={true} />
                  </div>
                  <div className="mt-0.5 text-slate-600 text-[10px]">{b.note}</div>
                </div>
              );
            })}
          </div>

          {/* 범례 */}
          <div className="mt-2 flex items-center gap-2 flex-wrap text-[10px] text-slate-500">
            <span className="px-1.5 py-0.5 rounded border bg-amber-100 border-amber-400 font-mono">*</span>
            <span>정확히 1단어</span>
            <span className="px-1.5 py-0.5 rounded border bg-purple-100 border-purple-400 font-mono">#</span>
            <span>0개 이상 단어</span>
          </div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      const flow = step.flow || [];
      const alertCls = ALERT_TONE[step.alert.tone] || ALERT_TONE.info;
      return (
        <div className="rounded-xl bg-white border-2 border-orange-200 shadow-md p-4 h-full flex flex-col">
          <div className="text-xs font-bold text-orange-800 mb-2">{step.actor}</div>

          {/* 흐름 노드 */}
          <div className="space-y-2 mb-3">
            {flow.map((n, i) => <FlowNode key={i} node={n} idx={i} total={flow.length} />)}
          </div>

          {/* 패턴 매칭 보드 */}
          <MatchBoard routingKey={step.routingKey} bindings={step.bindings} />

          {/* 핵심 안내 */}
          <div className={`mt-3 rounded-lg border-2 ${alertCls} px-3 py-2 text-xs leading-relaxed`}>
            💡 {step.alert.text}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ stepIdx, total }) {
      const codeRef = useRef(null);
      const code = STEPS[stepIdx].code;

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 5탭 헤더 */}
          <div className="flex items-center gap-0 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {STEPS.map((s, i) => {
              const isActive = i === stepIdx;
              return (
                <div
                  key={i}
                  className={`px-3 py-2 text-[10px] font-mono whitespace-nowrap border-r border-slate-700 ${
                    isActive
                      ? 'bg-[#282c34] text-orange-300 border-t-2 border-t-orange-400'
                      : 'bg-slate-900 text-slate-500'
                  }`}
                >
                  {s.code.filename}
                </div>
              );
            })}
          </div>

          {/* 파일명 바 */}
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-amber-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>

          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>

          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: PRIMARY }}>II</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: DARK }}>II-1-2. Topic Exchange</h1>
                <p className="text-sm" style={{ color: DARK, opacity: 0.8 }}>와일드카드(* / #) 패턴으로 여러 큐를 유연하게 라우팅</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: DARK }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? PRIMARY : '#fed7aa' }}
                />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-orange-50 px-5 py-4 shadow" style={{ backgroundColor: DARK }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50"
                style={{ color: DARK }}
                aria-label="처음으로"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: DARK }}
                aria-label="이전 단계"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? DARK : PRIMARY }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: DARK }}
                aria-label="다음 단계"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: DARK, opacity: 0.6 }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm" style={{ color: DARK }}>
                <div className="font-bold mb-1">✅ 핵심 정리 — Topic Exchange</div>
                routing key는 점(.)으로 구분된 단어 계층이다. binding key에 * (정확히 한 단어)와 # (0개 이상 단어) 와일드카드를 써서 패턴으로 구독한다. 하나의 publish가 겹치는 여러 패턴에 동시에 복제되므로 Direct보다 유연하다. 실무에서는 domain.region.action, logs.level.service 처럼 자주 거르는 축을 앞 단어에 두고 계층을 얕게 유지하며, 고카디널리티 값은 payload에 둔다. 다음(II-1-3)은 Fanout/Headers Exchange로 이어진다.
              </div>
