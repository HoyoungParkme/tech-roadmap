  <!--
    RabbitMQ III-1-2 — Message TTL 메시지 만료 시간
    학습 목표: 큐 단위(x-message-ttl) vs 메시지 단위(properties.expiration) TTL,
              둘 다 있으면 더 작은 값 적용, 큐 헤드에서만 만료 판정,
              만료 시 삭제 또는 DLX 로 dead letter, TTL+DLX = 지연 큐 패턴.
    패턴: fastapi v1 — 좌(TTL 카운트다운 큐 시뮬레이션) / 우(VSCode CodeViewer 5탭)
    색상: orange (RabbitMQ 공식 #FF6600)
  -->

    const BRAND_DARK = '#a64200';

    // 5단계 시나리오
    //   1: 큐 단위 TTL (x-message-ttl) 선언
    //   2: 메시지 단위 TTL (properties.expiration) publish
    //   3: 둘 다 있으면 더 작은 값 적용 + 헤드에서만 만료 판정
    //   4: TTL 만료 → 삭제 또는 DLX 로 dead letter

            '      x-message-ttl: 5000                    # 5초 후 만료',
            '      x-dead-letter-exchange: dlx.exchange   # 만료 시 여기로',
            '      x-dead-letter-routing-key: orders.dead',
            '',
            'bindings:',
            '  - source: dlx.exchange',
            '    vhost: /',
            '    destination: orders.dead.queue',
            '    destination_type: queue',
            '    routing_key: orders.dead',
            '',
            '# ── 만료 후 x-death 헤더 (RabbitMQ 자동 주입) ────',
            '# x-death:',
            '#   - reason: expired          # ← TTL 만료',
            '#     count: 1',
            '#     queue: orders.pending',
            '#     time: 2026-05-20T10:24Z',
            '#     original-expiration: "5000"',
            '',
            '# 적용: rabbitmqctl import_definitions ttl_with_dlx.yaml',
          ],
          highlight: [3, 4, 5, 6, 15, 16, 17, 18, 19, 20, 22, 23, 24, 25, 26, 27, 28, 29, 38, 39, 40, 41, 42, 43],
        },
      },
      {
        title: 'Step 5. TTL + DLX = 지연 큐(Delayed Queue) 패턴',
        desc: '"5분 뒤 재시도", "30분 뒤 알림" 같은 지연 처리는 어떻게 구현할까? RabbitMQ 는 네이티브 지연 발송이 없지만, TTL + DLX 조합으로 만든다. ① 소비자가 없는 "대기 큐(wait queue)"에 x-message-ttl=지연시간 과 x-dead-letter-exchange=작업 exchange 를 건다. ② 메시지를 대기 큐에 넣으면 아무도 소비하지 않으니 TTL 이 지날 때까지 그대로 머문다. ③ TTL 만료 → DLX 를 타고 실제 "작업 큐"로 이동 → 그제서야 소비자가 처리. 결과적으로 "지연 시간만큼 뒤에 도착하는 메시지"가 된다. 지연 재시도(retry backoff)도 같은 원리다.',
        actor: '⏳ 지연 큐 패턴 — 대기 큐 TTL 만료 → 작업 큐',
        queueTtl: 5000,
        clockMs: 6000,
        queue: [
          { id: 'retry-1', ttl: 5000, src: 'queue', head: true, fate: 'dlx', note: '대기 큐에서 5초 대기 → 작업 큐로' },
          { id: 'retry-2', ttl: 5000, src: 'queue', fate: 'dlx', note: '소비자 없음 → TTL 만료 대기' },
        ],
        summary: true,
        alert: { tone: 'good', text: '지연 큐 = 소비자 없는 대기 큐(TTL) + DLX. 만료가 곧 "시간이 됐다"는 신호가 되어 작업 큐로 넘어간다. 지연 재시도, 예약 발송의 표준 레시피.' },
        code: {
          lang: 'bash',
          filename: 'delayed_queue.sh',
          lines: [
            '#!/usr/bin/env bash',
            '# delayed_queue.sh — TTL + DLX 로 지연 큐 만들기',
            '#',
            '# 구조:',
            '#   [wait.queue] --(TTL 만료)--> [work.exchange] --> [work.queue]',
            '#   소비자는 work.queue 만 소비 → 지연 후 처리 효과',
            'set -euo pipefail',
            '',
            '# 1) 실제 작업을 처리할 exchange / queue',
            'rabbitmqadmin declare exchange name=work.exchange type=direct durable=true',
            'rabbitmqadmin declare queue name=work.queue durable=true',
            'rabbitmqadmin declare binding source=work.exchange \\',
            '    destination=work.queue routing_key=job',
            '',
            '# 2) 대기 큐: 소비자 없음 + TTL 5초 + 만료 시 work.exchange 로',
            'rabbitmqadmin declare queue name=wait.queue durable=true \\',
            '    arguments=\'{"x-message-ttl":5000,\\',
            '                "x-dead-letter-exchange":"work.exchange",\\',
            '                "x-dead-letter-routing-key":"job"}\'',
            '',
            '# 3) 지연시킬 메시지는 wait.queue 에 넣는다',
            '#    아무도 소비 안 함 → 5초 뒤 TTL 만료 → work.exchange 로 dead letter',
            'rabbitmqadmin publish routing_key=wait.queue \\',
            '    payload=\'{"job":"send-reminder","user":42}\'',
            '',
            'echo "메시지는 5초 뒤 work.queue 에서 소비 가능해진다"',
            '',
            '# ── 지연 재시도(retry backoff) 응용 ──────────────',
            '#   실패 → wait.5s → 재시도 실패 → wait.30s → wait.5m ...',
            '#   단계별 TTL 다른 대기 큐를 두면 지수 백오프 완성',
            '#',
            '# ── 핵심 정리 ────────────────────────────────────',
            '#   • TTL 2방식: 큐(x-message-ttl) vs 메시지(expiration)',
            '#   • 둘 다면 더 작은 값 적용, 판정은 큐 헤드에서',
            '#   • 만료 → 삭제 또는 DLX(reason: expired)',
            '#   • TTL + DLX = 지연 큐 / 지연 재시도의 기반',
          ],
          highlight: [3, 4, 5, 6, 15, 16, 17, 18, 19, 27, 28, 29, 30, 31, 32, 33, 34, 35],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — TTL 카운트다운 큐 시뮬레이션
    // ─────────────────────────────────────────────────────
    const ALERT_TONE = {
      good: 'bg-green-50  border-green-300  text-green-900',
      info: 'bg-sky-50    border-sky-300    text-sky-900',
      warn: 'bg-amber-50  border-amber-300  text-amber-900',
      err:  'bg-red-50    border-red-300    text-red-900',
    };

    function SrcBadge({ msg }) {
      // 적용된 TTL 출처 배지
      const applied = msg.applied || msg.src;
      const label = applied === 'queue' ? '큐 TTL' : '메시지 TTL';
      const cls = applied === 'queue'
        ? 'bg-sky-100 text-sky-800'
        : 'bg-orange-100 text-orange-800';
      return <span className={`px-1.5 rounded text-[10px] ${cls}`}>{label} 적용</span>;
    }

    function MessageRow({ msg, remaining, clockMs }) {
      // remaining: 현재 남은 TTL(ms), 0 이면 만료
      const pct = Math.max(0, Math.min(100, (remaining / msg.ttl) * 100));
      const expired = remaining <= 0;
      const isDlx = expired && msg.fate === 'dlx';
      const isDrop = expired && msg.fate === 'drop';

      let ring = 'border-orange-300 bg-orange-50';
      let barColor = BRAND;
      if (pct < 35 && !expired) { ring = 'border-amber-400 bg-amber-50'; barColor = '#d97706'; }
      if (isDlx) { ring = 'border-sky-400 bg-sky-50'; }
      if (isDrop) { ring = 'border-red-300 bg-red-50'; }
      if (expired && !msg.fate) { ring = 'border-red-300 bg-red-50'; }

      return (
        <div className={`rounded-lg border-2 ${ring} px-3 py-2 shadow-sm transition`}>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-mono font-bold text-orange-900 text-sm">{msg.id}</span>
            {msg.head && <span className="px-1.5 rounded bg-orange-200 text-orange-900 text-[10px]">HEAD</span>}
            <SrcBadge msg={msg} />
            <span className="ml-auto font-mono text-[11px] text-slate-700">
              {expired ? '만료' : `${(remaining / 1000).toFixed(1)}s`}
            </span>
          </div>

          {/* TTL 진행 바 */}
          <div className="mt-1.5 h-2 w-full rounded-full bg-slate-200 overflow-hidden">
            <div
              className="h-full rounded-full transition-all"
              style={{ width: `${pct}%`, backgroundColor: expired ? '#cbd5e1' : barColor }}
            />
          </div>

          {/* 만료 결과 / 노트 */}
          <div className="mt-1 flex items-center gap-2 flex-wrap text-[11px]">
            {msg.msgTtl !== undefined && (
              <span className="font-mono text-slate-500">
                min(큐 {msg.queueTtl / 1000}s, 메시지 {msg.msgTtl / 1000}s)
              </span>
            )}
            {isDlx && <span className="px-1.5 rounded bg-sky-100 text-sky-800">→ DLX dead letter (reason: expired)</span>}
            {isDrop && <span className="px-1.5 rounded bg-red-100 text-red-800">→ 삭제(폐기)</span>}
            {expired && !msg.fate && <span className="px-1.5 rounded bg-red-100 text-red-800">→ 만료 처리</span>}
            {msg.note && !expired && <span className="text-slate-600">{msg.note}</span>}
          </div>
        </div>
      );
    }

    function QueueBoard({ step }) {
      // 가상 시계: step 진입 시 0 → clockMs 까지 흐른다 (약 6초 실시간)
      const [t, setT] = useState(0);
      const rafStart = useRef(null);
      const clockMs = step.clockMs || 5000;
      const RUN_MS = 5200; // 실제 애니메이션 지속(실시간)

      useEffect(() => {
        setT(0);
        rafStart.current = null;
        let raf;
        const tick = (now) => {
          if (rafStart.current === null) rafStart.current = now;
          const elapsed = now - rafStart.current;
          const virtual = Math.min(clockMs, (elapsed / RUN_MS) * clockMs);
          setT(virtual);
          if (elapsed < RUN_MS) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [step]);

      const aliveCount = step.queue.filter((m) => (m.ttl - t) > 0).length;

      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white px-3 py-3 shadow-sm">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-orange-800">
              📥 큐 상태 · 가상 시계 {(t / 1000).toFixed(1)}s
              {step.queueTtl ? ` · x-message-ttl=${step.queueTtl / 1000}s` : ' · 큐 TTL 없음'}
            </div>
            <div className="text-[10px] text-slate-500">살아있음 {aliveCount} / {step.queue.length}</div>
          </div>
          <div className="space-y-2">
            {step.queue.map((m, i) => (
              <MessageRow key={i} msg={m} remaining={m.ttl - t} clockMs={clockMs} />
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-500">
            진행 바가 줄어들다 0 이 되면 TTL 만료 — 삭제되거나 DLX 로 이동한다.
          </div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      const alertCls = ALERT_TONE[step.alert.tone] || ALERT_TONE.info;
      return (
        <div className="rounded-xl bg-white border-2 border-orange-200 shadow-md p-4 h-full flex flex-col">
          <div className="text-xs font-bold text-orange-800 mb-2">{step.actor}</div>

          <QueueBoard step={step} />

          <div className={`mt-3 rounded-lg border-2 ${alertCls} px-3 py-2 text-xs leading-relaxed`}>
            💡 {step.alert.text}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ stepIdx, total }) {
      const codeRef = useRef(null);
      const code = STEPS[stepIdx].code;

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 5탭 헤더 */}
          <div className="flex items-center gap-0 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {STEPS.map((s, i) => {
              const isActive = i === stepIdx;
              return (
                <div
                  key={i}
                  className={`px-3 py-2 text-[10px] font-mono whitespace-nowrap border-r border-slate-700 ${
                    isActive
                      ? 'bg-[#282c34] text-orange-300 border-t-2 border-t-orange-400'
                      : 'bg-slate-900 text-slate-500'
                  }`}
                >
                  {s.code.filename}
                </div>
              );
            })}
          </div>

          {/* 파일명 바 */}
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-amber-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>

          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>

          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: BRAND }}>III</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: BRAND_DARK }}>III-1-2. Message TTL</h1>
                <p className="text-sm" style={{ color: BRAND_DARK, opacity: 0.8 }}>메시지가 큐에서 일정 시간 뒤 자동 만료되는 길</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND_DARK }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? BRAND : '#fed7aa' }}
                />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-orange-50 px-5 py-4 shadow" style={{ backgroundColor: BRAND_DARK }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50"
                style={{ color: BRAND_DARK }}
                aria-label="처음으로"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: BRAND_DARK }}
                aria-label="이전 단계"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? BRAND_DARK : BRAND }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: BRAND_DARK }}
                aria-label="다음 단계"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: BRAND_DARK, opacity: 0.6 }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm" style={{ color: BRAND_DARK }}>
                <div className="font-bold mb-1">✅ Message TTL 핵심 정리</div>
                <ul className="list-disc pl-5 space-y-0.5 leading-relaxed">
                  <li>TTL 설정 2가지: 큐 단위 <code>x-message-ttl</code> vs 메시지 단위 <code>properties.expiration</code>(문자열)</li>
                  <li>두 값이 모두 있으면 <b>더 작은 값</b>을 적용한다</li>
                  <li>만료 판정은 <b>큐 헤드</b>에서만 — per-queue 는 즉시, per-message 는 헤드 도달 시</li>
                  <li>만료 메시지는 <b>삭제</b>되거나, DLX 가 있으면 <b>dead letter</b>(reason: expired)</li>
                  <li><b>TTL + DLX = 지연 큐</b> — 지연 발송·지연 재시도(backoff)의 기반</li>
                </ul>
                <div className="mt-2">다음 챕터(III-1-3)는 큐 길이/용량 제한(max-length)과 오버플로 정책을 다룬다.</div>
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RabbitMQ', 'Message-TTL', 'x-message-ttl', 'expiration', 'expired', 'DLX', 'delayed-queue', 'retry-backoff', 'pika', 'AMQP', 'rabbitmqadmin'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border border-orange-200" style={{ backgroundColor: '#fff4eb', color: BRAND_DARK }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND_DARK }}>
              <a href="../index.html" className="underline hover:no-underline">← 목차</a>
              <a href="./III-1-1.html" className="underline hover:no-underline">← 이전: III-1-1 DLX</a>
              <a href="./III-1-3.html" className="underline hover:no-underline">다음: III-1-3 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
