  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    RabbitMQ I-1-1 — Exchange / Queue / Binding
    학습 목표: producer → exchange → (binding) → queue → consumer 흐름 5단계 추적
              "왜 exchange가 따로 있는지", "binding이 라우팅을 어떻게 결정하는지" 이해
    패턴: fastapi v1 — 좌(LiveDataPane: AMQP 토폴로지 시각화) / 우(VSCode CodeViewer)
    색상: orange (rabbitmq 브랜드 #FF6600)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 — exchange/queue/binding 의 역할을 한 컷씩 분리
    //   producer  : { name, status, msg } — 최근 보낸 메시지
    //   exchange  : { name, type, status } — direct/topic/fanout/headers
    //   bindings  : [{ exchange, queue, routingKey, matched }]
    //   queues    : [{ name, depth, status }]  depth = 적체 수
    //   consumers : [{ queue, name, status, lastMsg }]
    //   alert     : 핵심 안내
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 가장 단순한 그림 — Producer → Queue → Consumer (직접 연결 X)',
        desc: '메시지 큐 입문 시 가장 흔한 오해는 "Producer가 Queue에 직접 보낸다"는 그림이다. 사실은 그렇지 않다. RabbitMQ에서 Producer는 항상 Exchange에 메시지를 던진다. Exchange가 Binding 규칙을 보고 어느 Queue에 넣을지 결정한다. 이 한 가지 사실이 RabbitMQ의 라우팅 유연성을 만든다. 먼저 잘못된 그림(Producer → Queue 직접)부터 보고, 실제 흐름과 비교한다.',
        actor: '❌ 잘못된 그림 — Producer가 Queue로 직접?',
        producer: { name: 'order-svc', status: 'idle', msg: '' },
        exchange: null,
        bindings: [],
        queues: [{ name: 'orders.q', depth: 0, status: 'idle' }],
        consumers: [{ queue: 'orders.q', name: 'worker-1', status: 'wait', lastMsg: '' }],
        showWrong: true,
        alert: { tone: 'warn', text: '이 그림은 틀렸다. Producer는 Queue 이름을 모른다. 모두 Exchange를 통한다.' },
        code: {
          lang: 'python',
          filename: 'wrong_model.py',
          lines: [
            '"""',
            'I-1-1 Step 1 — 입문자의 오해: "Producer가 Queue에 직접 보낸다"',
            '실제 RabbitMQ는 그렇게 동작하지 않는다. 모든 메시지는 Exchange를 거친다.',
            '"""',
            '',
            '# ── 흔히 잘못 그리는 그림 ─────────────────────────',
            '#',
            '#   [Producer] ───직접 push?──> [Queue] ──> [Consumer]',
            '#',
            '#   ↑ 이건 Kafka 의 그림이지 AMQP 의 그림이 아니다.',
            '#   AMQP 에서는 Producer 가 Queue 이름을 모른다.',
            '',
            '',
            '# ── 그래서 pika 의 publish API 를 보면 ───────────',
            'channel.basic_publish(',
            '    exchange="orders.ex",        # ← Exchange 이름이 들어간다',
            '    routing_key="orders.new",    # ← routing key 가 들어간다',
            '    body=b"{\\"id\\": 1042}",',
            ')',
            '# Queue 이름은 publish 인자에 없다.',
            '# Queue 는 Consumer 가 구독할 때만 필요하다.',
            '',
            '',
            '# ── 핵심 명제 ────────────────────────────────────',
            '# (1) Producer 는 Exchange 에만 던진다',
            '# (2) Exchange 는 Binding 규칙을 보고 Queue 를 고른다',
            '# (3) Consumer 는 Queue 를 구독한다',
            '# (4) Producer 와 Consumer 는 서로 모른다 (Exchange/Queue 만 안다)',
            '',
            '# → Step 2 에서 실제 흐름을 그려본다',
          ],
          highlight: [6, 7, 8, 9, 10, 11, 15, 16, 17, 18, 19, 20, 21, 22, 26, 27, 28, 29],
        },
      },
      {
        title: 'Step 2. 실제 그림 — Producer → Exchange → Binding → Queue → Consumer',
        desc: 'Producer는 "orders.ex"라는 Exchange에 메시지를 던지면서 routing key "orders.new"를 함께 보낸다. Exchange는 자기에게 묶인 Binding 목록을 본다. "orders.new" 라는 routing key와 일치하는 Binding이 있으면 그 Queue로 메시지를 넣는다. Queue에 들어간 메시지는 그곳을 구독하는 Consumer가 받아간다. 이 5개 부품 — Producer / Exchange / Binding / Queue / Consumer — 이 RabbitMQ의 전부다.',
        actor: '📨 order-svc → orders.ex (routing_key="orders.new")',
        producer: { name: 'order-svc', status: 'sent', msg: '{"id":1042,"amount":59000}' },
        exchange: { name: 'orders.ex', type: 'direct', status: 'routed' },
        bindings: [
          { exchange: 'orders.ex', queue: 'orders.q', routingKey: 'orders.new', matched: true },
        ],
        queues: [{ name: 'orders.q', depth: 1, status: 'enqueued' }],
        consumers: [{ queue: 'orders.q', name: 'worker-1', status: 'wait', lastMsg: '' }],
        alert: { tone: 'info', text: 'Exchange 가 Binding 규칙을 보고 Queue 를 골랐다. 이게 라우팅의 본질이다.' },
        code: {
          lang: 'python',
          filename: 'producer_basic.py',
          lines: [
            '"""',
            'I-1-1 Step 2 — Producer 가 Exchange 에 publish 하는 실제 흐름',
            'Exchange / Queue / Binding 3가지를 먼저 선언하고 메시지를 던진다.',
            '"""',
            'import pika',
            'import json',
            '',
            '# ── 1) 연결 ─────────────────────────────────────',
            'params = pika.ConnectionParameters(host="localhost", port=5672)',
            'conn = pika.BlockingConnection(params)',
            'channel = conn.channel()',
            '',
            '# ── 2) Exchange 선언 ──────────────────────────',
            'channel.exchange_declare(',
            '    exchange="orders.ex",',
            '    exchange_type="direct",   # routing_key 정확히 일치하는 Queue 로',
            '    durable=True,             # 브로커 재시작 후에도 살아남음',
            ')',
            '',
            '# ── 3) Queue 선언 ─────────────────────────────',
            'channel.queue_declare(queue="orders.q", durable=True)',
            '',
            '# ── 4) Binding — Exchange 와 Queue 를 routing key 로 연결 ─',
            'channel.queue_bind(',
            '    exchange="orders.ex",',
            '    queue="orders.q",',
            '    routing_key="orders.new",',
            ')',
            '',
            '# ── 5) publish — Exchange 에 메시지를 던진다 ─',
            'order = {"id": 1042, "amount": 59000}',
            'channel.basic_publish(',
            '    exchange="orders.ex",',
            '    routing_key="orders.new",',
            '    body=json.dumps(order).encode(),',
            '    properties=pika.BasicProperties(delivery_mode=2),  # 영속화',

    // ─────────────────────────────────────────────────────
    // 색상/스타일 토큰
    // ─────────────────────────────────────────────────────
    const PRIMARY = '#FF6600';
    const PRIMARY_DARK = '#cc5200';

    const NODE_STATUS = {
      idle:      { bg: 'bg-slate-50',   border: 'border-slate-300', text: 'text-slate-700',  label: 'IDLE' },
      sent:      { bg: 'bg-orange-50',  border: 'border-orange-500', text: 'text-orange-800', label: 'SENT' },
      routed:    { bg: 'bg-orange-50',  border: 'border-orange-600', text: 'text-orange-900', label: 'ROUTED' },
      enqueued:  { bg: 'bg-amber-50',   border: 'border-amber-500', text: 'text-amber-900',  label: 'ENQUEUED' },
      delivered: { bg: 'bg-emerald-50', border: 'border-emerald-400', text: 'text-emerald-800', label: 'DELIVERED' },
      wait:      { bg: 'bg-slate-50',   border: 'border-slate-300', text: 'text-slate-700',  label: 'WAIT' },
      ack:       { bg: 'bg-emerald-50', border: 'border-emerald-500', text: 'text-emerald-900', label: 'ACK' },
      busy:      { bg: 'bg-amber-50',   border: 'border-amber-500', text: 'text-amber-900',  label: 'BUSY' },
    };

    function NodeBox({ icon, title, sub, status, extra }) {
      const s = NODE_STATUS[status] || NODE_STATUS.idle;
      return (
        <div className={`rounded-lg border-2 ${s.bg} ${s.border} px-2 py-1.5`}>
          <div className={`text-[11px] font-bold ${s.text} flex items-center gap-1`}>
            <span>{icon}</span>
            <span className="truncate">{title}</span>
            <span className="ml-auto text-[9px] px-1 rounded bg-white/70 border border-current/20">{s.label}</span>
          </div>
          {sub && <div className="text-[10px] text-slate-600 truncate mt-0.5">{sub}</div>}
          {extra && <div className="text-[10px] font-mono text-slate-700 mt-0.5 truncate">{extra}</div>}
        </div>
      );
    }

    function Arrow({ label, broken }) {
      const color = broken ? 'text-red-500' : 'text-orange-600';
      return (
        <div className={`flex flex-col items-center justify-center px-1 ${color}`}>
          <span className="text-lg leading-none">{broken ? '✗' : '→'}</span>
          {label && <span className="text-[8px] mt-0.5">{label}</span>}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 잘못된 그림 박스 (Step 1)
    // ─────────────────────────────────────────────────────
    function WrongDiagram() {
      return (
        <div className="rounded-lg border-2 border-dashed border-red-400 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">❌ 잘못된 그림 — Producer가 Queue 직접 호출?</div>

            <NodeBox icon="📤" title="Producer" sub="order-svc" status="sent" />
            <Arrow label="direct?" broken />
            <NodeBox icon="📦" title="Queue" sub="orders.q" status="idle" />
            <Arrow label="pull" />
            <NodeBox icon="🛠" title="Consumer" sub="worker-1" status="wait" />
          </div>
          <div className="mt-2 text-[11px] text-red-800">

    // ─────────────────────────────────────────────────────
    // 정상 토폴로지 박스
    // ─────────────────────────────────────────────────────
    function TopologyDiagram({ state }) {
      const { producer, exchange, bindings, queues, consumers } = state;
      return (
        <div className="rounded-lg border-2 border-orange-400 bg-white overflow-hidden">
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2"
               style={{ background: `linear-gradient(to right, ${PRIMARY}, #ff9933)` }}>
            <span>🐰</span>
            <span>AMQP 토폴로지 (Producer → Exchange → Binding → Queue → Consumer)</span>
          </div>
          <div className="p-2 space-y-2">
            {/* Producer */}
            <NodeBox
              icon="📤"
              title={`Producer: ${producer.name}`}
              sub={producer.status === 'sent' ? `publish → exchange` : 'no traffic'}
              status={producer.status}
              extra={producer.msg}
            />
            {/* down arrow */}
            <div className="flex justify-center text-orange-600 text-xs">↓ basic_publish (exchange, routing_key)</div>
            {/* Exchange */}
            {exchange && (
              <NodeBox
                icon="🔀"
                title={`Exchange: ${exchange.name}`}
                sub={`type=${exchange.type}`}
                status={exchange.status}
              />
            )}
            {/* bindings → queues */}
            {exchange && (
              <div className="flex justify-center text-orange-600 text-xs">↓ binding match (routing_key)</div>
            )}
            <div className={`grid gap-2 ${queues.length > 1 ? 'grid-cols-2' : 'grid-cols-1'}`}>
              {queues.map((q, i) => {
                const binding = bindings.find((b) => b.queue === q.name);
                const consumer = consumers.find((c) => c.queue === q.name);
                return (
                  <div key={q.name} className="space-y-1">
                    {binding && (
                      <div className="text-[10px] font-mono text-orange-700 bg-orange-50 border border-orange-200 rounded px-1.5 py-0.5">
                        binding: key="{binding.routingKey}"
                      </div>
                    )}
                    <NodeBox
                      icon="📥"
                      title={`Queue: ${q.name}`}
                      sub={`depth=${q.depth}`}
                      status={q.status}
                    />
                    {consumer && (
                      <>
                        <div className="text-center text-orange-600 text-[10px]">↓ basic_consume</div>
                        <NodeBox
                          icon="🛠"
                          title={`Consumer: ${consumer.name}`}
                          sub={consumer.status === 'ack' ? 'ack sent' : consumer.status === 'busy' ? 'processing' : 'waiting'}
                          status={consumer.status}
                          extra={consumer.lastMsg}
                        />
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 5부품 요약 박스 (Step 5)
    // ─────────────────────────────────────────────────────
    function RecapBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-orange-500 bg-gradient-to-br from-orange-50 to-amber-50 p-4">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🎉</span>
            <span className="text-lg font-bold" style={{ color: PRIMARY_DARK }}>{box.title}</span>
          </div>
          <ul className="space-y-1.5">
            {box.features.map((f, i) => (
              <li key={i} className="text-sm text-orange-900 flex gap-2">
                <span className="text-orange-600 mt-0.5">✓</span>
                <span>{f}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: PRIMARY_DARK }}>RabbitMQ 토폴로지</h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.showWrong ? <WrongDiagram /> : <TopologyDiagram state={state} />}
          <RecapBox box={state.recapBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold"
                    style={{ background: PRIMARY }}>R</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: PRIMARY_DARK }}>I-1-1. Exchange / Queue / Binding</h1>
                <p className="text-sm" style={{ color: PRIMARY_DARK, opacity: 0.8 }}>
                  Producer → Exchange → Binding → Queue → Consumer 5부품의 역할 분리
                </p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: PRIMARY_DARK }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ background: i <= stepIdx ? PRIMARY : '#fed7aa' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-orange-50 px-5 py-4 shadow"
                 style={{ background: PRIMARY_DARK }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white hover:bg-orange-50"
                style={{ color: PRIMARY_DARK }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: PRIMARY_DARK }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ background: playing ? PRIMARY_DARK : PRIMARY }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: PRIMARY_DARK }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: PRIMARY_DARK, opacity: 0.6 }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Producer는 Exchange에만 메시지를 던지고, Exchange는 Binding 규칙으로 Queue를 고른다. Queue는 Consumer가 ack를 보낼 때까지 메시지를 보관한다. Exchange 타입(direct/topic/fanout/headers)을 바꾸면 같은 5부품으로 전혀 다른 라우팅을 만들 수 있다. 다음 챕터에서는 이 흐름을 옮기는 AMQP 0-9-1 프로토콜의 frame 구조를 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RabbitMQ', 'AMQP', 'Exchange', 'Queue', 'Binding', 'routingKey', 'ack', '느슨한결합'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: PRIMARY_DARK }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
