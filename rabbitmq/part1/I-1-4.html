<html lang="ko">

  <title>RabbitMQ 인터랙티브 학습 — I-1-4. Producer / Consumer + ack</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐰</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    RabbitMQ I-1-4 — Producer / Consumer + ack
    학습 목표: 메시지 발행/소비의 신뢰성 계약을 5단계로 익힌다.
      publish → deliver → (auto-ack vs manual ack) → prefetch 공정분배
      → publisher confirms → requeue/DLX → at-least-once + 멱등성
    패턴: fastapi v1 — 좌(메시지 흐름 + 큐/컨슈머 시뮬레이션) / 우(VSCode CodeViewer 5탭)
    색상: orange (RabbitMQ 공식 #FF6600)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   1: 기본 발행/소비        — producer → exchange → queue → consumer deliver
    //   2: ack 모드             — auto-ack(유실 위험) vs manual ack
    //   3: prefetch(QoS)        — 공정 분배(fair dispatch)
    //   4: publisher confirms   — 브로커 도착 보장 + mandatory
    //   5: at-least-once        — requeue vs DLX + 멱등성
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:'python', filename:'basic_flow.py', lines:[
        '"""',
        'basic_flow.py — RabbitMQ 기본 발행/소비 흐름 (pika)',
        '',
        '핵심:',
        '  - 프로듀서는 exchange 로 publish (큐를 직접 지정하지 않음)',
        '  - 컨슈머는 queue 를 구독하면 브로커가 push(deliver)',
        '  - 아직 ack 는 다루지 않음 (Step 2)',
        '"""',
        'import json',
        'import pika',
        '',
        '',
        'def connect() -> pika.BlockingConnection:',
        '    """로컬 브로커 연결을 생성한다',
        '',
        '    Returns:',
        '        BlockingConnection 인스턴스',
        '    """',
        '    return pika.BlockingConnection(',
        '        pika.ConnectionParameters(host="localhost", port=5672)',
        '    )',
        '',
        '',
        '# ── Producer: exchange 로 publish ─────────────────',
        'def publish_order(order_id: int, amount: int) -> None:',
        '    """주문 메시지를 orders exchange 로 발행한다',
        '',
        '    Args:',
        '        order_id: 주문 식별자',
        '        amount: 결제 금액(원)',
        '    """',
        '    conn = connect()',
        '    ch = conn.channel()',
        '    ch.exchange_declare("orders", exchange_type="direct", durable=True)',
        '    ch.queue_declare(queue="orders.queue", durable=True)',
        '    ch.queue_bind("orders.queue", "orders", routing_key="order.created")',
        '',
        '    body = json.dumps({"order_id": order_id, "amount": amount})',
        '    ch.basic_publish(',
        '        exchange="orders",',
        '        routing_key="order.created",',
        '        body=body,',
        '    )',
        '    print(f"[publish] order_id={order_id}")',
        '    conn.close()',
        '',
        '',
        '# ── Consumer: queue 구독 → deliver 수신 ───────────',
        'def consume() -> None:',
        '    """orders.queue 를 구독하고 메시지를 출력한다 (ack 는 Step 2)"""',
        '    conn = connect()',
        '    ch = conn.channel()',
        '',
        '    def on_message(ch, method, properties, body):',
        '        order = json.loads(body)',
        '        print(f"[deliver] {order}")  # 아직 ack 하지 않음',
        '',
        '    ch.basic_consume(queue="orders.queue", on_message_callback=on_message)',
        '    ch.start_consuming()',
        '',
        '',
        'if __name__ == "__main__":',
        '    publish_order(42, 19900)',
        '    consume()',
      ]},
      s2: {lang:'python', filename:'ack_modes.py', lines:[
        '"""',
        'ack_modes.py — auto-ack vs manual ack 비교',
        '',
        '핵심:',
        '  - auto_ack=True  → deliver 즉시 삭제 (유실 위험)',
        '  - auto_ack=False → 처리 후 basic_ack 해야 삭제 (권장)',
        '  - 성공 basic_ack / 재시도 basic_nack(requeue=True)',
        '  - 폐기 basic_nack(requeue=False) → DLX (Step 5)',
        '"""',
        'import json',
        'import pika',
        '',
        '',
        '# ── ❌ 위험: auto-ack (유실 가능) ─────────────────',
        'def consume_auto_ack(ch) -> None:',
        '    """받는 즉시 삭제 — 처리 중 죽으면 메시지 증발"""',
        '    def on_message(ch, method, properties, body):',
        '        process_payment(json.loads(body))  # 여기서 crash 하면?',
        '        # 이미 큐에서 지워졌다 → 복구 불가',
        '    ch.basic_consume(',
        '        queue="orders.queue",',
        '        on_message_callback=on_message,',
        '        auto_ack=True,   # ← 위험',
        '    )',
        '',
        '',
        '# ── ✅ 권장: manual ack ──────────────────────────',
        'def consume_manual_ack(ch) -> None:',

    const NODE_STATE = {
      idle:    { ring: 'border-slate-300',  bg: 'bg-slate-50',    text: 'text-slate-600',  dot: 'bg-slate-300'  },
      active:  { ring: 'border-orange-400', bg: 'bg-orange-50',   text: 'text-orange-800', dot: 'bg-orange-500' },

    const ALERT_TONE = {
      good: 'bg-green-50  border-green-300  text-green-900',
      info: 'bg-sky-50    border-sky-300    text-sky-900',
      warn: 'bg-amber-50  border-amber-300  text-amber-900',
      err:  'bg-red-50    border-red-300    text-red-900',
    };

    function FlowNode({ node, idx, total }) {
      const s = NODE_STATE[node.state] || NODE_STATE.idle;
      return (
        <div className={`rounded-lg border-2 ${s.ring} ${s.bg} px-3 py-2.5 shadow-sm`}>
          <div className="flex items-center gap-2">
            <span className={`inline-block w-2 h-2 rounded-full ${s.dot}`}></span>
            <span className={`text-xs font-mono ${s.text}`}>#{idx + 1} / {total}</span>
            <span className={`ml-auto text-sm font-bold ${s.text}`}>{node.node}</span>
          </div>
          <div className="mt-1 text-xs text-slate-700 leading-relaxed">{node.detail}</div>
        </div>
      );
    }

    function QueueBoard({ queue, consumers }) {
      const pending = queue.pending || [];
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white px-3 py-3 shadow-sm">
          {/* 큐 대기 메시지 */}
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-orange-800">📥 orders.queue — 대기 메시지</div>
            <div className="text-[10px] text-slate-500">ready {pending.length}건</div>
          </div>
          {pending.length === 0 ? (
            <div className="text-xs text-slate-500 py-1.5 italic">큐가 비어있음 (ready 0)</div>
          ) : (
            <div className="flex flex-wrap gap-1.5">
              {pending.map((id, i) => (
                <span key={i} className="px-2 py-1 rounded bg-orange-50 border border-orange-200 text-[11px] font-mono text-orange-900">
                  ✉️ {id}
                </span>
              ))}
            </div>
          )}

          {/* 컨슈머 카드 */}
          <div className="mt-3 grid grid-cols-2 gap-2">
            {consumers.map((c, i) => {
              const s = NODE_STATE[c.state] || NODE_STATE.idle;
              return (
                <div key={i} className={`rounded border-2 ${s.ring} ${s.bg} px-2 py-1.5`}>
                  <div className="flex items-center gap-1.5">
                    <span className={`inline-block w-2 h-2 rounded-full ${s.dot}`}></span>
                    <span className={`text-xs font-bold ${s.text}`}>Consumer {c.name}</span>
                  </div>
                  <div className="mt-1 flex gap-1 flex-wrap">
                    <span className="px-1.5 rounded bg-sky-100 text-sky-800 text-[10px]">prefetch: {c.prefetch}</span>
                    <span className="px-1.5 rounded bg-amber-100 text-amber-800 text-[10px]">unacked: {c.unacked}</span>
                  </div>
                  <div className="mt-1 text-[11px] text-slate-700 leading-snug">{c.detail}</div>
                </div>
              );
            })}
          </div>

          <div className="mt-2 text-[10px] text-slate-500">{queue.note}</div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      const flow = step.flow || [];
      const alertCls = ALERT_TONE[step.alert.tone] || ALERT_TONE.info;
      return (
        <div className="rounded-xl bg-white border-2 border-orange-200 shadow-md p-4 h-full flex flex-col">
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="text-xs font-bold text-orange-800 mb-2">{step.actor}</div>

          {/* 메시지 흐름 노드 */}
          <div className="space-y-2 mb-3">
            {flow.map((n, i) => <FlowNode key={i} node={n} idx={i} total={flow.length} />)}
          </div>

          {/* 큐 + 컨슈머 상태 보드 */}
          <QueueBoard queue={step.queue} consumers={step.consumers} />

          {/* 핵심 경고 / 안내 */}
          <div className={`mt-3 rounded-lg border-2 ${alertCls} px-3 py-2 text-xs leading-relaxed`}>
            💡 {step.alert.text}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸친다.
    const TABS = [...new Set(STEPS.map((s) => s.code.filename))];

    function CodeViewer({ stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      const code = STEPS[stepIdx].code;

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 5탭 헤더 */}
          <div className="flex items-center gap-0 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {TABS.map((t) => {
              const isActive = t === code.filename;
              return (
                <div
                  key={t}
                  className={`px-3 py-2 text-[10px] font-mono whitespace-nowrap border-r border-slate-700 ${
                    isActive
                      ? 'bg-[#282c34] text-orange-300 border-t-2 border-t-orange-400'
                      : 'bg-slate-900 text-slate-500'
                  }`}
                >
                  {t}
                </div>
              );
            })}
          </div>

          {/* 파일명 바 */}
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-amber-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>

          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>

          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF6600' }}>I</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: '#a64200' }}>I-1-4. Producer / Consumer + ack</h1>
                <p className="text-sm" style={{ color: '#a64200', opacity: 0.8 }}>발행·소비의 신뢰성 계약 — ack, prefetch, confirms, 멱등성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#a64200' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#FF6600' : '#fed7aa' }}
                />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-orange-50 px-5 py-4 shadow" style={{ backgroundColor: '#a64200' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50"
                style={{ color: '#a64200' }}
                aria-label="처음으로"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: '#a64200' }}
                aria-label="이전 단계"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#a64200' : '#FF6600' }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: '#a64200' }}
                aria-label="다음 단계"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#a64200', opacity: 0.6 }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm" style={{ color: '#a64200' }}>
                <div className="font-bold mb-1">✅ Producer / Consumer + ack 핵심 정리</div>
                발행/소비의 신뢰성은 두 구간의 계약으로 완성된다. ① 컨슈머 측: auto_ack=False + 처리 후 basic_ack, prefetch 로 공정 분배. ② 프로듀서 측: confirm_delivery + mandatory 로 도착 보장. 이 둘을 합치면 at-least-once 가 되고, 재전달로 인한 중복은 message_id 기반 멱등 처리로 흡수한다. exactly-once 를 좇지 말고 "재시도해도 안전한" 시스템을 설계하라.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RabbitMQ', 'producer', 'consumer', 'basic_ack', 'basic_nack', 'auto-ack', 'prefetch', 'QoS', 'fair-dispatch', 'publisher-confirms', 'mandatory', 'at-least-once', '멱등성', 'pika', 'AMQP'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border border-orange-200" style={{ backgroundColor: '#fff4eb', color: '#a64200' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#a64200' }}>
              <a href="./I-1-3.html" className="underline hover:no-underline">← 이전: I-1-3</a>
              <a href="../index.html" className="underline hover:no-underline">목차</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
