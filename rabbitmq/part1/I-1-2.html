  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐰</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    RabbitMQ I-1-2 — AMQP 0-9-1 프로토콜
    학습 목표: AMQP frame(method/header/body/heartbeat) 구조 → method class 7종 → handshake → publish 흐름
    패턴: fastapi v1 — 좌(LiveDataPane: AMQP frame 시각화) / 우(VSCode CodeViewer)
    색상: orange
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const PRIMARY = '#FF6600';
    const PRIMARY_DARK = '#cc5200';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:'yaml', filename:'amqp_spec.yaml', lines:[
            '# I-1-2 Step 1 — AMQP 0-9-1 스펙 요약',
            '',
            'protocol:',
            '  name: AMQP',
            '  version: "0-9-1"',
            '  published: 2008',
            '  status: stable',
            '  vs_amqp_1_0: 완전히 다른 스펙 (호환 X)',
            '',
            'transport:',
            '  layer: TCP',
            '  default_port: 5672          # 평문',
            '  tls_port: 5671              # TLS',
            '',
            'wire_format:',
            '  unit: frame                 # 모든 통신은 frame 단위',
            '  frame_types:',
            '    - method   (type=1)       # 동작 호출/응답',
            '    - header   (type=2)       # 메시지 메타데이터',
            '    - body     (type=3)       # 메시지 본문 (큰 메시지는 분할)',
            '    - heartbeat(type=8)       # keep-alive',
            '',
            'method_classes:',
            '  - connection                # 연결 협상',
            '  - channel                   # 채널 다중화',
            '  - exchange                  # exchange 선언/삭제',
            '  - queue                     # queue 선언/삭제/바인딩',
            '  - basic                     # publish/consume/ack',
            '  - tx                        # 트랜잭션',
            '  - confirm                   # publisher confirm',
            '',
            'implementations:',
            '  - RabbitMQ                  # 가장 널리 쓰이는 브로커',
            '  - Apache Qpid               # Apache 진영',
            '  - ActiveMQ Classic          # 5.x 까지 0-9-1 지원',
      ]},
      s2: {lang:'python', filename:'frame_layout.py', lines:[
            '"""',
            'I-1-2 Step 2 — AMQP 0-9-1 frame 의 바이트 레이아웃',
            '',
            '문서: https://www.rabbitmq.com/resources/specs/amqp0-9-1.pdf §2.3.5',
            '"""',
            'import struct',
            '',
            'FRAME_METHOD   = 1',
            'FRAME_HEADER   = 2',
            'FRAME_BODY     = 3',
            'FRAME_HEARTBEAT = 8',
            'FRAME_END      = 0xCE',
            '',
            '',
            'def build_frame(frame_type: int, channel: int, payload: bytes) -> bytes:',
            '    """',
            '    AMQP frame 1개를 바이트로 직렬화한다.',
            '',
            '    레이아웃:',
            '      [type:1] [channel:2] [size:4] [payload:size] [0xCE:1]',
            '',
            '    Args:',
            '        frame_type: 1=method / 2=header / 3=body / 8=heartbeat',
            '        channel:    채널 번호 (0 = 연결 단위)',
            '        payload:    프레임 본문 (method args, header props, body chunk)',
            '',
            '    Returns:',
            '        와이어로 보낼 바이트 시퀀스',
            '    """',
            '    header = struct.pack(">BHI", frame_type, channel, len(payload))',
            '    return header + payload + bytes([FRAME_END])',
            '',
            '',
            'def parse_frame(buf: bytes) -> tuple[int, int, bytes]:',
            '    """역직렬화 — type/channel/payload 반환."""',
            '    if len(buf) < 8:',
            '        raise ValueError("incomplete frame header")',
            '    frame_type, channel, size = struct.unpack(">BHI", buf[:7])',
            '    payload = buf[7 : 7 + size]',
            '    if buf[7 + size] != FRAME_END:',
            '        raise ValueError("FRAME_ERROR — missing 0xCE")',
            '    return frame_type, channel, payload',
            '',
            '',
            '# ── 핵심 ────────────────────────────────────────',
            '# (1) 모든 frame 은 8바이트 헤더로 시작',
            '# (2) payload 길이는 size 필드에 정확히 일치해야 함',
            '# (3) 끝의 0xCE 가 빠지면 broker 가 connection.close',
            '# (4) frame 단위로 channel 다중화 → I-2-1 에서 자세히',
      ]},
      s3: {lang:'python', filename:'method_mapping.py', lines:[
            '"""',
            'I-1-2 Step 3 — pika API 와 AMQP method class 의 1:1 매핑',
            '',
            '클라이언트 함수 호출 → AMQP method frame → 브로커 응답 method frame',
            '"""',
            'import pika',
            '',
            'channel = pika.BlockingConnection(pika.ConnectionParameters("localhost")).channel()',
            '',
            '# ── pika API   ────────  ↔  AMQP method ──────────',
            '',
            'channel.exchange_declare(',
            '    exchange="orders.ex", exchange_type="direct"',
            ')                              # → exchange.declare → exchange.declare-ok',
            '',
            'channel.queue_declare(queue="orders.q")',
            '                               # → queue.declare    → queue.declare-ok',

          { type: 'method', label: 'basic.publish', detail: 'exchange=orders.ex\\nrouting_key=orders.new', size: '~ 60B' },
          { type: 'header', label: 'content header', detail: 'body_size=300000\\ncontent_type="application/json"', size: '~ 80B' },
          { type: 'body', label: 'content body #1', detail: 'payload chunk 1 / 3', size: '128KB' },
          { type: 'body', label: 'content body #2', detail: 'payload chunk 2 / 3', size: '128KB' },
          { type: 'body', label: 'content body #3', detail: 'payload chunk 3 / 3', size: '~ 37KB' },
        ],
        alert: { tone: 'warn', text: '큰 메시지는 frame 수만큼 왕복 비용이 는다. 본문은 작게 유지하는 게 정석.' },
        code: { ...CODE.s5, highlight: [50, 51, 52] },
      },
      { ...S5,
        beat: {
          label: '왜 셋으로 나눴나',
          at: 'publish_frames.py L55–57',
          caption: '라우팅은 method+header 만으로 끝난다. body 를 안 읽고도 결정할 수 있어 스트리밍이 가능하다.',
          changes: [
            { mark: 'read', text: 'body 없이 라우팅 결정' },
            { mark: 'changed', text: '다시 기본 3 frame' },
          ],
        },
        actor: '📦 publish 1건 = 3 frame 흐름',
        view: 'publish',
        frames: [
          { type: 'method', label: 'basic.publish', detail: 'exchange="orders.ex"\\nrouting_key="orders.new"', size: '~ 60B' },
          { type: 'header', label: 'content header', detail: 'class=basic\\nbody_size=128\\ncontent_type="application/json"\\ndelivery_mode=2 (영속)', size: '~ 80B' },
          { type: 'body', label: 'content body', detail: '{"id":1042,"amount":59000,...}', size: '128B (1 frame)' },
        ],
        alert: { tone: 'info', text: '본문 128 KB 초과 시 body frame 이 자동 분할된다 (frame_max 협상값).' },
        code: { ...CODE.s5, highlight: [55, 56, 57] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 공통 UI 컴포넌트
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info: { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn: { bg: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50', border: 'border-red-300', text: 'text-red-900', icon: '🚨' },
      good: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 뷰별 시각화
    // ─────────────────────────────────────────────────────
    function IntroView({ layers }) {
      return (
        <div className="rounded-lg border-2 border-orange-400 bg-white overflow-hidden">
          <div className="px-3 py-1.5 text-xs font-bold text-white"
               style={{ background: `linear-gradient(to right, ${PRIMARY}, #ff9933)` }}>
            📜 OSI 7계층에서 AMQP 의 자리
          </div>
          <div className="p-3 space-y-1.5">
            {layers.map((l) => (
              <div key={l.name} className={`rounded border-2 ${l.color} px-3 py-2`}>
                <div className="text-xs font-bold text-slate-800">{l.name}</div>
                <div className="text-[11px] text-slate-700 mt-0.5">{l.sub}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FrameView({ frame }) {
      return (
        <div className="rounded-lg border-2 border-orange-400 bg-white overflow-hidden">
          <div className="px-3 py-1.5 text-xs font-bold text-white"
               style={{ background: `linear-gradient(to right, ${PRIMARY}, #ff9933)` }}>
            🧩 AMQP frame 바이트 레이아웃
          </div>
          <div className="p-3">
            <div className="flex flex-wrap gap-1">
              {frame.fields.map((f, i) => (
                <div key={i} className="border-2 border-orange-300 bg-orange-50 px-2 py-1.5 rounded flex-1 min-w-[80px]">
                  <div className="text-[10px] font-bold text-orange-900">{f.name}</div>
                  <div className="text-[10px] text-orange-700">{f.size}</div>
                  <div className="text-[10px] font-mono text-slate-700 mt-1 truncate" title={f.value}>{f.value}</div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{f.desc}</div>
                </div>
              ))}
            </div>
            <div className="mt-3 text-[11px] text-slate-700 font-mono">
              [ type ][ channel ][ size ][ payload ][ 0xCE ]<br/>
              <span className="text-orange-700">  1B      2B        4B       N B       1B</span>
            </div>
          </div>
        </div>
      );
    }

    function MethodView({ methods }) {
      return (
        <div className="rounded-lg border-2 border-orange-400 bg-white overflow-hidden">
          <div className="px-3 py-1.5 text-xs font-bold text-white"
               style={{ background: `linear-gradient(to right, ${PRIMARY}, #ff9933)` }}>
            📚 AMQP method class 7종 — 동작의 약속
          </div>
          <div className="p-2 space-y-1.5">
            {methods.map((m) => (
              <div key={m.cls} className="border border-orange-200 bg-orange-50/50 rounded px-2 py-1.5">
                <div className="flex items-baseline gap-2">
                  <span className="text-xs font-bold text-orange-900 font-mono">{m.cls}.*</span>
                  <span className="text-[10px] text-slate-600">— {m.desc}</span>
                </div>
                <div className="mt-1 flex flex-wrap gap-1">
                  {m.m.map((mm) => (
                    <span key={mm} className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white border border-orange-200 text-orange-800">
                      {mm}
                    </span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function HandshakeView({ steps }) {
      return (
        <div className="rounded-lg border-2 border-orange-400 bg-white overflow-hidden">
          <div className="px-3 py-1.5 text-xs font-bold text-white"
               style={{ background: `linear-gradient(to right, ${PRIMARY}, #ff9933)` }}>
            🤝 7단계 connection handshake
          </div>
          <div className="p-2">
            <div className="grid grid-cols-[60px_1fr_60px] gap-x-2 text-[11px]">
              <div className="font-bold text-center text-orange-800">Client</div>
              <div className="text-center text-slate-500">wire</div>
              <div className="font-bold text-center text-orange-800">Broker</div>
            </div>
            <div className="mt-1 space-y-1">
              {steps.map((s, i) => {
                const isCtoS = s.from === 'client';
                return (
                  <div key={i} className="grid grid-cols-[60px_1fr_60px] gap-x-2 items-center">
                    <div className={`h-8 border-r-2 ${isCtoS ? 'border-orange-500' : 'border-slate-300'}`}></div>
                    <div className={`text-center text-[10px] font-mono rounded px-1.5 py-1 border ${isCtoS ? 'bg-orange-50 border-orange-300 text-orange-900' : 'bg-emerald-50 border-emerald-300 text-emerald-900'}`}>
                      <span className="block">{isCtoS ? '→' : '←'} {s.label}</span>
                      <span className="block text-[9px] text-slate-600 mt-0.5">{s.note}</span>
                    </div>
                    <div className={`h-8 border-l-2 ${!isCtoS ? 'border-orange-500' : 'border-slate-300'}`}></div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function PublishView({ frames }) {
      const TYPE_COLOR = {
        method: 'border-orange-500 bg-orange-50 text-orange-900',
        header: 'border-amber-500 bg-amber-50 text-amber-900',
        body:   'border-emerald-500 bg-emerald-50 text-emerald-900',
      };
      return (
        <div className="rounded-lg border-2 border-orange-400 bg-white overflow-hidden">
          <div className="px-3 py-1.5 text-xs font-bold text-white"
               style={{ background: `linear-gradient(to right, ${PRIMARY}, #ff9933)` }}>
            📦 basic_publish 한 줄 = frame 3개
          </div>
          <div className="p-3 space-y-2">
            {frames.map((f, i) => (
              <div key={i} className={`border-2 rounded px-3 py-2 ${TYPE_COLOR[f.type]}`}>
                <div className="text-xs font-bold flex items-center justify-between">
                  <span>[{f.type.toUpperCase()}] {f.label}</span>
                  <span className="text-[10px] opacity-70">{f.size}</span>
                </div>
                <pre className="text-[10px] font-mono mt-1 whitespace-pre-wrap">{f.detail}</pre>
              </div>
            ))}
            <div className="text-[10px] text-slate-600 mt-1">
              ↑ 위에서 아래로 순서대로 wire 에 흐른다 (channel 다중화 + 순서 보장)
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: PRIMARY_DARK }}>AMQP 0-9-1 wire</h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {state.view === 'intro' && <IntroView layers={state.layers} />}
          {state.view === 'frame' && <FrameView frame={state.frame} />}
          {state.view === 'methods' && <MethodView methods={state.methods} />}
          {state.view === 'handshake' && <HandshakeView steps={state.steps} />}
          {state.view === 'publish' && <PublishView frames={state.frames} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold"
                    style={{ background: PRIMARY }}>R</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: PRIMARY_DARK }}>I-1-2. AMQP 0-9-1 프로토콜</h1>
                <p className="text-sm" style={{ color: PRIMARY_DARK, opacity: 0.8 }}>
                  frame · method class · handshake · publish 3 frame 분리
                </p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: PRIMARY_DARK }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition"
                     style={{ background: i <= stepIdx ? PRIMARY : '#fed7aa' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-orange-50 px-5 py-4 shadow" style={{ background: PRIMARY_DARK }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white hover:bg-orange-50"
                style={{ color: PRIMARY_DARK }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: PRIMARY_DARK }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }}
                aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ background: playing ? PRIMARY_DARK : PRIMARY }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white hover:bg-orange-50 disabled:opacity-40"
                style={{ color: PRIMARY_DARK }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: PRIMARY_DARK, opacity: 0.6 }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                AMQP 0-9-1은 frame(method/header/body/heartbeat) 단위로 흐르고, 7개 method class로 모든 동작을 표현한다. TCP 연결 직후 7단계 handshake로 인증/한도/heartbeat를 협상한다. basic_publish 한 줄도 wire 위에는 3개 frame으로 분리되어 흐르며, body는 frame_max를 넘으면 자동 분할된다. 다음 챕터에서는 한 TCP 연결 안에서 여러 channel을 다중화하는 구조를 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['AMQP', 'wireFormat', 'frame', 'methodClass', 'handshake', 'heartbeat', 'PLAIN', 'TLS5671'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: PRIMARY_DARK }}>
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
