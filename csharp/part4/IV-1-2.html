        actor: '🗺 제약(필드·async·박싱 ✗) · 수명 · 선택 지도',

    // ─────────────────────────────────────────────────────
    // Step 1 — 복사 기반 슬라이스의 GC 압박
    // ─────────────────────────────────────────────────────
    function ProblemView({ copy }) {
      const chars = copy.origin.split('');
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">📄 원본 문자열 (이미 메모리에 있음)</div>
            <div className="flex flex-wrap gap-0.5 font-mono">
              {chars.map((c, i) => {
                const inPick = i >= copy.highlightFrom && i < copy.highlightFrom + copy.highlightLen;
                return (
                  <span key={i} className={`text-[10px] w-4 h-5 flex items-center justify-center rounded ${inPick ? 'bg-fuchsia-200 text-fuchsia-900 border border-fuchsia-400' : 'bg-slate-100 text-slate-500 border border-slate-200'}`}>{c === ' ' ? '␣' : c}</span>
                );
              })}
            </div>
          </div>
          <div className="text-center text-violet-500 text-lg">▼ substring → 새 배열에 <b>복사</b></div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🐌 새로 할당된 복사본</div>
            <pre className="text-[11px] leading-5 font-mono text-red-800 bg-white rounded p-2 border border-red-200 overflow-auto whitespace-pre">"{copy.picked}"  ← 힙에 새 string 할당</pre>
            <div className="mt-2 space-y-1">
              {copy.allocs.map((a, i) => (
                <div key={i} className="text-[10px] font-mono rounded border px-2 py-1 flex justify-between bg-white border-red-200 text-red-800">
                  <span>{a.label}</span><span className="font-bold">{a.bytes}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — Span = 시작 포인터 + 길이 (창)
    // ─────────────────────────────────────────────────────
    function SpanView({ window }) {
      const chars = window.buffer.split('');
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🪟 같은 원본 위에 "창"만 연다 (복사 없음)</div>
            <div className="flex flex-wrap gap-0.5 font-mono relative">
              {chars.map((c, i) => {
                const inWin = i >= window.start && i < window.start + window.len;
                const isStart = i === window.start;
                return (
                  <span key={i} className={`text-[10px] w-4 h-5 flex items-center justify-center rounded ${inWin ? 'bg-violet-200 text-violet-900 border border-violet-500' : 'bg-slate-100 text-slate-400 border border-slate-200'} ${isStart ? 'ring-2 ring-fuchsia-400' : ''}`}>{c === ' ' ? '␣' : c}</span>
                );
              })}
            </div>
            <div className="mt-1.5 text-[10px] text-violet-700">🔺 fuchsia 테두리 = 창의 시작(ref), 보라 = 유효 구간(length)</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">📦 Span 의 정체는 필드 2개뿐</div>
            <div className="space-y-1">
              {window.fields.map((f, i) => (
                <div key={i} className="text-[10px] font-mono rounded border px-2 py-1 flex gap-2 bg-emerald-50 border-emerald-300 text-emerald-900">
                  <span className="font-bold w-20 shrink-0">{f.k}</span>
                  <span className="text-slate-700">{f.v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 3형제 용도 카드
    // ─────────────────────────────────────────────────────
    function FamilyView({ family }) {
      const TONE = {
        span: 'bg-violet-50 border-violet-400 text-violet-900',
        ro:   'bg-indigo-50 border-indigo-400 text-indigo-900',
        mem:  'bg-emerald-50 border-emerald-400 text-emerald-900',
      };
      return (
        <div className="space-y-2">
          {family.map((f, i) => (
            <div key={i} className={`rounded-lg border-2 p-3 ${TONE[f.tone]}`}>
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-[12px] font-mono font-bold">{f.name}</span>
                <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-white/70 border">{f.where}</span>
              </div>
              <div className="text-[11px] text-slate-700">{f.use}</div>
              <div className="text-[10px] font-mono mt-1 opacity-80">{f.can}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 겹 슬라이싱 + stackalloc + ArrayPool
    // ─────────────────────────────────────────────────────
    function SliceView({ slice }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">✂️ Slice — 창 위에 창, 할당 계속 0</div>
            <div className="space-y-1.5">
              {slice.cuts.map((c, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono font-bold w-24 shrink-0 text-violet-800">{c.label}</span>
                  <span className="text-[10px] font-mono flex-1 rounded border px-2 py-1 bg-violet-50 border-violet-300 text-violet-900">{c.text}</span>
                  <span className="text-[9px] font-bold text-emerald-700">alloc {c.alloc}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-1.5">🧵 stackalloc — 스택 버퍼 (GC 무관)</div>
            <pre className="text-[10px] leading-5 font-mono text-slate-700 bg-fuchsia-50 rounded p-2 border border-fuchsia-200 overflow-auto whitespace-pre-wrap">{slice.stack}</pre>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1.5">♻️ ArrayPool — 큰 버퍼는 빌려 쓰고 반납</div>
            <pre className="text-[10px] leading-5 font-mono text-amber-900 bg-white rounded p-2 border border-amber-200 overflow-auto whitespace-pre-wrap">{slice.pool}</pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 할당 없는 파싱
    // ─────────────────────────────────────────────────────
    function ParseView({ parse }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧮 "{parse.input}" → 창으로 잘라 바로 Parse</div>
            <div className="space-y-1.5">
              {parse.tokens.map((t, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono font-bold w-8 text-violet-800">{t.part}</span>
                  <span className="text-[10px] font-mono flex-1 rounded border px-2 py-1 bg-violet-50 border-violet-300 text-violet-900">{t.span}</span>
                  <span className="text-violet-400 text-xs">→</span>
                  <span className="text-[11px] font-mono font-bold rounded border px-2 py-1 bg-emerald-100 border-emerald-400 text-emerald-900">{t.val}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[10px] font-bold text-red-900">❌ before</div>
            <div className="text-[10px] font-mono text-red-800">{parse.before}</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2.5">
            <div className="text-[10px] font-bold text-emerald-900">✅ after</div>
            <div className="text-[10px] font-mono text-emerald-800">{parse.after}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 제약 표 + 선택 지도
    // ─────────────────────────────────────────────────────
    function MapView({ limits, pick }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚫 Span 이 못 하는 것 (ref struct 제약)</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-red-900 border-b border-red-200">
                  <th className="text-left py-0.5">하면 안 되는 것</th>
                  <th className="text-left py-0.5 pl-2">왜</th>
                </tr>
              </thead>
              <tbody>
                {limits.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 font-mono font-bold ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 pl-2 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-violet-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-violet-800 mb-1.5">🗺 {pick.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {pick.rows.map((r, i) => (
                  <tr key={i} className="border-t border-violet-100">
                    <td className="py-1 pr-2 font-mono font-bold text-violet-800 whitespace-nowrap align-top">{r.cmd}</td>
                    <td className="py-1 text-slate-700">{r.see}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      problem: { icon: '🐌', label: '복사의 GC 압박' },
      span:    { icon: '🪟', label: 'Span = 창' },
      family:  { icon: '👨‍👩‍👦', label: '3형제 선택' },
      slice:   { icon: '✂️', label: '슬라이싱·stackalloc' },
      parse:   { icon: '🧮', label: '할당 없는 파싱' },
      map:     { icon: '🗺', label: '제약·선택 지도' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.problem;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>Span·메모리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'problem' && <ProblemView copy={state.copy} />}
          {state.stage === 'span' && <SpanView window={state.window} />}
          {state.stage === 'family' && <FamilyView family={state.family} />}
          {state.stage === 'slice' && <SliceView slice={state.slice} />}
          {state.stage === 'parse' && <ParseView parse={state.parse} />}
          {state.stage === 'map' && <MapView limits={state.limits} pick={state.pick} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅳ. 컬렉션과 IO · IV-1-2</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">IV-1-2. Span·메모리 효율</h1>
                <p className="text-sm text-violet-800/80">할당 없이 연속 메모리를 다루는 Span&lt;T&gt;로 고성능 코드 작성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                substring·배열 슬라이스는 원본이 있는데도 새로 할당·복사해 뜨거운 경로에서 GC를 압박한다.
                Span&lt;T&gt;는 시작 포인터·길이만 든 값 타입이라 슬라이스해도 복사 0 — 원본 메모리의 "창"을 열 뿐이다.
                읽기만이면 ReadOnlySpan, 필드·async에 보관하려면 Memory&lt;T&gt;(→ .Span), 작은 임시 버퍼는 stackalloc, 큰 버퍼는 ArrayPool.
                파싱은 int.Parse(span)·IndexOf+Slice로 임시 문자열 0개를 만든다.
                단 Span은 ref struct라 필드·async·박싱 불가이고 원본보다 오래 살면 죽은 메모리를 가리킨다 — 무조건 Span이 답은 아니다.
                다음 장 IV-2-1에서 파일·스트림 IO를 판다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Span', 'ReadOnlySpan', 'Memory', 'ref-struct', 'Slice', 'stackalloc', 'ArrayPool', 'GC압박', '할당제로', 'Parse-span', '수명', 'IndexOf'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
