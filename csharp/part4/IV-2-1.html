          { lib: 'System.Text.Json', good: '내장·빠름·저메모리·엄격', use: '신규 기본값', tone: 'good' },
          { lib: 'Newtonsoft.Json', good: '유연·기능풍부·관대', use: '레거시·복잡 커스텀', tone: 'mid' },
        ],
        fails: {
          title: '데이터 처리에서 가장 자주 터지는 것들',
          rows: [
            { case: '대용량 전체 로드', why: 'ReadAllText+Deserialize → OutOfMemory', tone: 'bad' },
            { case: 'using 없는 스트림', why: '핸들 누수 → "파일 사용 중" 오류', tone: 'bad' },
            { case: '대소문자/이름 매핑', why: '조용히 null → CaseInsensitive·PropertyName', tone: 'bad' },
            { case: '동기 IO 블로킹', why: '서버 스레드 붙잡음 → Async 버전으로', tone: 'mid' },
          ],
        },
        alert: { tone: 'good', text: '요약: 파일은 using+async 스트림으로 나르고, System.Text.Json 으로 객체↔JSON 을 오간다. 대용량은 DeserializeAsync(stream)/Utf8JsonReader 로 흘려 읽어라. 신규는 STJ 가 기본, Newtonsoft 는 유연함이 필요한 레거시에서. 다음 장 IV-2-2 로 이어진다.' },
        code: {
          lang: 'csharp',
          filename: 'Program.cs — 대용량 스트리밍 & DTO 매핑',
          lines: [
            'using System.IO;',
            'using System.Text.Json;',
            '',
            '// 🚨 대용량을 이렇게 하면 메모리 폭발',
            '// var s = File.ReadAllText("huge.json");   // ❌ 전체 로드',
            '// var list = JsonSerializer.Deserialize<List<Coffee>>(s);',
            '',
            '// ✅ 스트림을 그대로 흘려 읽기 (저메모리)',
            'await using var fs = File.OpenRead("huge.json");',
            'var opts = new JsonSerializerOptions',
            '{ PropertyNameCaseInsensitive = true };',
            'var list = await JsonSerializer',
            '    .DeserializeAsync<List<Coffee>>(fs, opts);',
            '// => 파일을 통째로 안 올리고 객체 리스트로 매핑',
            '',
            '// 더 낮은 수준: Utf8JsonReader 로 토큰 단위 스캔',
            'byte[] bytes = File.ReadAllBytes("data.json");',
            'var reader = new Utf8JsonReader(bytes);',
            'while (reader.Read())',
            '{',
            '    if (reader.TokenType == JsonTokenType.PropertyName)',
            '        Console.WriteLine(reader.GetString());',
            '}',
            '',
            'record Coffee(int Id, string Name, int Price);',
            '// 다음 장 → IV-2-2',
          ],
          highlight: [4, 5, 8, 9, 12, 13, 16, 17, 18, 19],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 파일 API 카드 + Path 함정
    // ─────────────────────────────────────────────────────
    function FileView({ fileOps, pathBox }) {
      const TONE = {
        read: 'bg-violet-50 border-violet-300 text-violet-900',
        write: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">📄 자주 쓰는 File API — 열고·읽고·닫기를 한 줄로</div>
            <div className="space-y-1">
              {fileOps.map((o, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 flex gap-2 ${TONE[o.tone]}`}>
                  <span className="font-mono font-bold w-40 shrink-0">{o.api}</span>
                  <span className="text-slate-700">{o.role}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">🧭 경로 — 문자열 덧셈 금지, Path.Combine</div>
            <div className="text-[10px] font-mono rounded border border-red-300 bg-red-50 text-red-800 px-2 py-1 mb-1">❌ {pathBox.bad}</div>
            <div className="text-[10px] font-mono rounded border border-emerald-300 bg-emerald-50 text-emerald-800 px-2 py-1">✅ {pathBox.good}</div>
            <div className="mt-2 flex flex-wrap gap-1">
              {pathBox.helpers.map((h, i) => (
                <span key={i} className="text-[9px] font-mono rounded-full px-2 py-0.5 bg-violet-100 border border-violet-300 text-violet-900">{h}</span>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 통째 vs 스트림 비교 + using 수명 흐름
    // ─────────────────────────────────────────────────────
    function StreamView({ compare, usingFlow }) {
      const TONE = { good: 'text-emerald-700', mid: 'text-amber-700' };
      const FLOW = {
        open: 'bg-violet-50 border-violet-300 text-violet-900',
        work: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
        close: 'bg-emerald-100 border-emerald-400 text-emerald-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">⚖️ 통째로 읽기 vs 스트림</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-violet-900 border-b border-violet-200">
                  <th className="text-left py-0.5">방식</th>
                  <th className="text-left py-0.5">메모리</th>
                  <th className="text-left py-0.5">언제</th>
                </tr>
              </thead>
              <tbody>
                {compare.map((c, i) => (
                  <tr key={i} className="border-t border-violet-100 align-top">
                    <td className={`py-1 font-mono font-bold ${TONE[c.tone]}`}>{c.k}</td>
                    <td className="py-1 text-slate-700">{c.mem}</td>
                    <td className="py-1 text-slate-700">{c.use}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-2">🔁 using 의 자원 수명 — 블록 끝에서 자동 Dispose</div>
            <div className="flex flex-wrap items-center gap-1">
              {usingFlow.map((f, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-fuchsia-400 text-xs">→</span>}
                  <div className={`text-[10px] rounded border px-2 py-1 font-bold text-center ${FLOW[f.tone]}`}>
                    <div>{f.label}</div>
                    <div className="text-[9px] font-normal opacity-70">{f.sub}</div>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 객체 ↔ JSON 매핑 + 옵션
    // ─────────────────────────────────────────────────────
    function SerializeView({ objJson, options }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔄 C# 객체 ↔ JSON 문자열</div>
            <div className="text-[9px] font-mono text-slate-500 mb-1.5">{objJson.className}</div>
            <div className="grid grid-cols-[1fr_auto_1fr] gap-1.5 items-center">
              <div className="rounded border border-violet-300 bg-violet-50 p-2">
                <div className="text-[9px] font-bold text-violet-800 mb-1">C# 객체 (PascalCase)</div>
                {objJson.obj.map((o, i) => (
                  <div key={i} className="text-[10px] font-mono text-slate-700 flex justify-between">
                    <span className="text-violet-900 font-bold">{o.k}</span>
                    <span>{o.v}</span>
                  </div>
                ))}
              </div>
              <div className="text-center text-violet-500 text-[10px] font-bold leading-tight">
                Serialize<br/>◀ ▶<br/>Deserialize
              </div>
              <div className="rounded border border-fuchsia-300 bg-fuchsia-50 p-2">
                <div className="text-[9px] font-bold text-fuchsia-800 mb-1">JSON (camelCase)</div>
                <pre className="text-[9px] leading-4 font-mono text-slate-700 whitespace-pre overflow-auto">{objJson.json}</pre>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">⚙️ JsonSerializerOptions — 실무 3종</div>
            <div className="space-y-1">
              {options.map((o, i) => (
                <div key={i} className="text-[10px] rounded border border-indigo-200 bg-indigo-50 px-2 py-1">
                  <span className="font-mono font-bold text-indigo-900">{o.opt}</span>
                  <span className="text-slate-600"> — {o.eff}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — JSON 키 → 프로퍼티 매핑 표
    // ─────────────────────────────────────────────────────
    function MappingView({ mapRows, fixNote }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🏷 JSON 키 → C# 프로퍼티 이어 붙이기</div>
            <div className="space-y-1.5">
              {mapRows.map((r, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${r.ok ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                  <div className="flex items-center gap-2 text-[10px] font-mono">
                    <span className="font-bold text-slate-700">{r.json}</span>
                    <span className={r.ok ? 'text-emerald-600' : 'text-red-500'}>{r.ok ? '──▶' : '──✕─▶'}</span>
                    <span className="font-bold text-violet-900">{r.prop}</span>
                    <span className={`ml-auto text-[9px] font-bold ${r.ok ? 'text-emerald-700' : 'text-red-600'}`}>{r.ok ? '✓' : '⚠ null'}</span>
                  </div>
                  <div className="text-[9px] text-slate-600 mt-0.5">{r.via}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5">
            <div className="text-[10px] text-emerald-900">✅ {fixNote}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 스트리밍 체인 + 라이브러리 비교 + 실패 사례
    // ─────────────────────────────────────────────────────
    function StreamingView({ streamChain, libCompare, fails }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700' };
      const LTONE = { good: 'text-emerald-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-400 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🌊 대용량 — 통째로 말고 흘려 읽기</div>
            <div className="flex flex-wrap items-center gap-1">
              {streamChain.map((c, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-violet-400 text-xs">→</span>}
                  <span className={`text-[10px] rounded px-2 py-1 border font-bold ${i === streamChain.length - 1 ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-violet-50 border-violet-300 text-violet-900'}`}>{c}</span>
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">📚 System.Text.Json vs Newtonsoft</div>
            <table className="w-full text-[10px]">
              <tbody>
                {libCompare.map((r, i) => (
                  <tr key={i} className="border-t border-indigo-100 align-top">
                    <td className={`py-1 pr-2 font-mono font-bold whitespace-nowrap ${LTONE[r.tone]}`}>{r.lib}</td>
                    <td className="py-1 pr-2 text-slate-700">{r.good}</td>
                    <td className="py-1 text-slate-500 whitespace-nowrap">{r.use}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {fails.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {fails.rows.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 pr-2 font-bold whitespace-nowrap ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      file:      { icon: '📄', label: '파일 IO' },
      stream:    { icon: '🌊', label: '스트림·async' },
      serialize: { icon: '🔄', label: 'JSON 직렬화' },
      mapping:   { icon: '🏷', label: '이름 매핑' },
      streaming: { icon: '🗺', label: '대용량·지도' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.file;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>파일·JSON — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'file' && <FileView fileOps={state.fileOps} pathBox={state.pathBox} />}
          {state.stage === 'stream' && <StreamView compare={state.compare} usingFlow={state.usingFlow} />}
          {state.stage === 'serialize' && <SerializeView objJson={state.objJson} options={state.options} />}
          {state.stage === 'mapping' && <MappingView mapRows={state.mapRows} fixNote={state.fixNote} />}
          {state.stage === 'streaming' && <StreamingView streamChain={state.streamChain} libCompare={state.libCompare} fails={state.fails} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅳ. 컬렉션과 IO · IV-2-1</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">IV-2-1. 파일·json 처리</h1>
                <p className="text-sm text-violet-800/80">파일 IO와 System.Text.Json으로 데이터를 읽고 쓰기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                파일은 File.ReadAllText/WriteAllText 로 통째로, 큰 파일은 using StreamReader 로 한 줄씩 흘려 읽는다 —
                스트림·핸들은 반드시 using 으로 닫고, 서버에서는 ReadAllTextAsync 같은 async 버전으로 스레드를 붙잡지 않는다.
                데이터는 System.Text.Json.JsonSerializer 로 객체↔JSON 을 오가며, WriteIndented·CamelCase·null 제외 옵션을 맞춘다.
                역직렬화 사고의 대부분은 이름 매핑 실패이니 [JsonPropertyName] + PropertyNameCaseInsensitive 로 막고,
                대용량은 DeserializeAsync(stream)/Utf8JsonReader 로 흘려 읽는다. 신규는 STJ 가 기본, 유연함이 필요하면 Newtonsoft.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['File-IO', 'Path.Combine', 'StreamReader', 'using', 'async-IO', 'System.Text.Json', 'Serialize', 'Deserialize', 'camelCase', 'JsonPropertyName', 'CaseInsensitive', 'Utf8JsonReader', 'Newtonsoft'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
