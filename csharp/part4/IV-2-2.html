    @media (min-width: 768px) {

    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    C# IV-2-2 — HttpClient
    학습 목표: HttpClient 로 REST API 를 호출하는 기본 흐름(요청→상태코드→json 역직렬화)과,
              소켓 고갈을 피하는 수명 관리(재사용·IHttpClientFactory), 인증·타임아웃·취소·에러 처리를 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 요청/응답 흐름 + new 반복 vs 재사용 대비 애니메이션) / 우(VSCode CodeViewer: csharp)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 기본 호출 → 수명 관리(핵심) → Factory → 인증/헤더 → 타임아웃/취소/재시도 → 에러 처리 & 전체 지도
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 기본 호출 — GET 요청에서 json 객체까지',
        desc: 'REST API 호출의 뼈대는 세 박자다: 요청을 보내고(GetAsync) → 응답 상태를 확인하고(EnsureSuccessStatusCode) → 본문을 우리 타입으로 역직렬화한다(json). System.Net.Http.Json 의 GetFromJsonAsync 를 쓰면 이 세 박자를 한 줄로 줄여준다 — 내부에서 상태 확인과 System.Text.Json 역직렬화까지 해주기 때문이다. 여기서 초보가 가장 많이 빠지는 함정은 상태 확인을 건너뛰는 것이다. HTTP 는 404·500 을 받아도 예외를 던지지 않는다(응답을 "정상 수신"했으니까). EnsureSuccessStatusCode 를 부르지 않으면 서버가 에러 페이지(HTML)를 줬는데도 그걸 json 인 줄 알고 파싱하다 엉뚱한 곳에서 터진다. 그래서 "상태부터 확인"이 습관이어야 한다.',
        actor: '📡 GET /api/users/1 → 200 OK → User 객체',
        stage: 'basic',
        stageLabel: '요청 → 상태코드 → 역직렬화',
        flow: [
          { label: 'HttpClient', sub: 'GetAsync(url)', tone: 'src' },
          { label: '네트워크', sub: 'HTTP 요청', tone: 'mid' },
          { label: '서버', sub: 'REST API', tone: 'srv' },
        ],
        resp: {
          status: '200 OK',
          ok: true,
          body: '{ "id": 1, "name": "Ada", "email": "ada@x.io" }',
          typed: 'User { Id=1, Name="Ada", Email="ada@x.io" }',
        },
        alert: { tone: 'warn', text: 'HTTP 는 404·500 을 받아도 예외를 안 던진다 — "응답 수신 자체는 성공"이니까. EnsureSuccessStatusCode() 를 부르지 않으면 에러 응답(HTML)을 json 으로 파싱하다 엉뚱한 곳에서 터진다. 상태부터 확인하라.' },
        code: {
          lang: 'csharp',
          filename: 'BasicGet.cs — GET 요청과 역직렬화',
          lines: [
            'using System.Net.Http;',
            'using System.Net.Http.Json;   // GetFromJsonAsync 확장',
            '',
            'record User(int Id, string Name, string Email);',
            '',
            'var client = new HttpClient();',
            'client.BaseAddress = new Uri("https://api.example.com");',
            '',
            '// ① 저수준 — 상태 확인을 직접 한다',
            'HttpResponseMessage res = await client.GetAsync("/api/users/1");',
            'res.EnsureSuccessStatusCode();   // 4xx/5xx 면 예외',
            'User? u = await res.Content.ReadFromJsonAsync<User>();',
            'Console.WriteLine(u);',
            '// => User { Id = 1, Name = Ada, Email = ada@x.io }',
            '',
            '// ② 고수준 — 위 3줄을 한 줄로 (상태확인+역직렬화 내장)',
            'User? u2 = await client.GetFromJsonAsync<User>("/api/users/1");',
            '// => 200 이 아니면 HttpRequestException 을 던진다',
          ],
          highlight: [9, 10, 11, 12, 16, 17],
        },
      },
      {
        title: 'Step 2. 수명 관리 (핵심) — 매번 new 하면 소켓이 고갈된다',
        desc: '이 장에서 반드시 가져가야 할 한 가지다. HttpClient 는 IDisposable 이라 습관적으로 using(new HttpClient()) 로 감싸기 쉽지만, 이게 최악의 안티패턴이다. Dispose 해도 그 밑의 TCP 소켓은 곧바로 닫히지 않고 운영체제의 TIME_WAIT 상태로 수십 초~수 분 남는다. 요청 때마다 new 하면 이 좀비 소켓이 쌓여 결국 사용 가능한 포트가 바닥나고, "SocketException: 주소를 사용할 수 없습니다"로 서비스가 죽는다(고부하일수록 빨리). 정답은 재사용이다 — HttpClient 하나를 만들어 앱 수명 내내 공유한다. HttpClient 는 스레드 안전하므로 여러 스레드가 같은 인스턴스로 동시 요청해도 된다. 단, 정적(static) 인스턴스만 쓰면 DNS 변경을 못 따라가는 약점이 있는데, 그 해법이 다음 단계의 IHttpClientFactory 다.',
        actor: '💀 new 반복(소켓 고갈) vs ♻️ 재사용(안전)',
        stage: 'lifetime',
        stageLabel: '소켓 고갈 vs 재사용',
        alert: { tone: 'danger', text: 'using (var c = new HttpClient()) 를 요청마다 반복 = 소켓 고갈. Dispose 해도 소켓은 TIME_WAIT 로 남아 포트를 잡아먹는다 → SocketException 으로 서비스 다운. HttpClient 는 재사용하라(스레드 안전).' },
        code: {
          lang: 'csharp',

    function LifetimeView() {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, []);
      // 매번 new: 소켓이 계속 쌓임(TIME_WAIT). 재사용: 항상 1개.
      const badSockets = Math.min(12, (tick % 14) + 1);
      const isExhausted = badSockets >= 10;
      return (
        <div className="space-y-2">
          {/* ❌ 매번 new */}
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">💀 매번 new HttpClient() — 소켓이 쌓인다</div>
            <div className="flex flex-wrap gap-1 min-h-[46px] items-start">
              {Array.from({ length: badSockets }).map((_, i) => (
                <span
                  key={i}
                  className={`text-[9px] font-mono rounded px-1.5 py-1 border font-bold ${i >= 9 ? 'bg-red-200 border-red-500 text-red-900' : 'bg-amber-100 border-amber-400 text-amber-900'}`}
                >🔌 :{50000 + i}</span>
              ))}
            </div>
            <div className={`mt-1.5 text-[10px] font-bold ${isExhausted ? 'text-red-700' : 'text-amber-700'}`}>
              {isExhausted
                ? '🚨 포트 고갈! SocketException — TIME_WAIT 소켓이 포트를 다 잡음'
                : `TIME_WAIT 소켓 ${badSockets}개 누적 중… (Dispose 해도 안 닫힘)`}
            </div>
          </div>
          {/* ✅ 재사용 */}
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3">
            <div className="text-[11px] font-bold text-emerald-900 mb-1.5">♻️ static 재사용 — 소켓 1개를 재활용</div>
            <div className="flex items-center gap-2 min-h-[46px]">
              <span className="text-[10px] font-mono rounded px-2 py-1.5 border-2 bg-emerald-100 border-emerald-500 text-emerald-900 font-bold">🔌 :50000</span>
              <span className="text-emerald-500 text-lg animate-pulse">⇄</span>
              <span className="text-[10px] text-emerald-800">{(tick % 14) + 1}번째 요청도 같은 소켓 재사용</span>
            </div>
            <div className="mt-1.5 text-[10px] font-bold text-emerald-700">✅ 포트 고갈 없음 · HttpClient 는 스레드 안전</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — IHttpClientFactory: 핸들러 풀
    // ─────────────────────────────────────────────────────
    function FactoryView({ pool }) {
      const STATE = {
        active:   { chip: 'bg-emerald-50 border-emerald-300 text-emerald-900', tag: '● 활성' },
        expiring: { chip: 'bg-amber-50 border-amber-300 text-amber-900', tag: '⟳ 교체 예정' },
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🏭 IHttpClientFactory — 핸들러 풀 관리</div>
            <div className="flex items-center gap-1 flex-wrap mb-2 text-[10px] font-bold">
              <span className="rounded border px-2 py-1 bg-violet-50 border-violet-300 text-violet-900">CreateClient()</span>
              <span className="text-violet-400">→</span>
              <span className="rounded border px-2 py-1 bg-indigo-100 border-indigo-300 text-indigo-900">핸들러 풀에서 대여</span>
            </div>
            <div className="space-y-1.5">
              {pool.map((m, i) => {
                const s = STATE[m.state];
                return (
                  <div key={i} className={`rounded border px-2 py-1.5 ${s.chip}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-mono font-bold">{m.name}</span>
                      <span className="text-[9px] font-bold">{s.tag}</span>
                    </div>
                    <div className="text-[9px] opacity-80 mt-0.5">{m.note}</div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2.5">
            <div className="text-[10px] text-emerald-900 font-bold">✅ 소켓 재사용(고갈 방지) + 2분 주기 교체(DNS 반영)를 동시에</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 헤더/인증/POST: 요청 구성 시각화
    // ─────────────────────────────────────────────────────
    function AuthView({ req }) {
      const TONE = {
        auth: 'bg-violet-100 border-violet-400 text-violet-900',
        ct:   'bg-indigo-100 border-indigo-300 text-indigo-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[11px] font-mono font-bold rounded px-2 py-0.5 bg-fuchsia-600 text-white">{req.method}</span>
              <span className="text-[11px] font-mono text-slate-700">{req.path}</span>
            </div>
            <div className="text-[10px] font-bold text-violet-800 mb-1">🔐 요청 헤더</div>
            <div className="space-y-1">
              {req.headers.map((h, i) => (
                <div key={i} className={`text-[10px] font-mono rounded border px-2 py-1 flex gap-2 ${TONE[h.tone]}`}>
                  <span className="font-bold w-28 shrink-0">{h.k}</span>
                  <span className="opacity-80 truncate">{h.v}</span>
                </div>
              ))}
            </div>
            <div className="text-[10px] font-bold text-violet-800 mt-2 mb-1">📦 본문 (PostAsJsonAsync 가 직렬화)</div>
            <pre className="text-[10px] leading-4 font-mono text-slate-700 bg-fuchsia-50 rounded p-1.5 border border-fuchsia-200 overflow-auto whitespace-pre">{req.body}</pre>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2.5">
            <div className="text-[10px] font-mono font-bold text-emerald-900">↩ 응답: {req.res}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 타임아웃/취소/재시도: Polly 백오프 + 데드락 경고
    // ─────────────────────────────────────────────────────
    function ResilienceView({ retry, deadlock }) {
      const STATE = {
        fail: { chip: 'bg-red-50 border-red-300 text-red-900', tag: '✗ 실패' },
        ok:   { chip: 'bg-emerald-50 border-emerald-300 text-emerald-900', tag: '✓ 성공' },
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔁 Polly 재시도 — 지수 백오프</div>
            <div className="space-y-1.5">
              {retry.map((r, i) => {
                const s = STATE[r.state];
                return (
                  <div key={i} className={`rounded border px-2 py-1.5 ${s.chip}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-mono font-bold">{r.n}</span>
                      <span className="text-[9px] font-bold">{s.tag}</span>
                    </div>
                    <div className="text-[9px] opacity-80 mt-0.5">{r.note}</div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 동기 대기 = 데드락</div>
            <div className="text-[10px] font-mono rounded border border-red-300 bg-white px-2 py-1 text-red-700 line-through">{deadlock.bad}</div>
            <div className="text-[9px] text-red-800 mt-1">{deadlock.why}</div>
            <div className="text-[10px] font-mono rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-emerald-800 mt-1.5">✅ {deadlock.fix}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 예외 3종 + 실패 4대장 + 정답 공식
    // ─────────────────────────────────────────────────────
    function ErrorsView({ exceptions, fails, formula }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">⚠ 잡아야 할 예외 3종</div>
            <div className="space-y-1">
              {exceptions.map((e, i) => (
                <div key={i} className="rounded border border-violet-200 bg-violet-50 px-2 py-1.5">
                  <div className={`text-[11px] font-mono font-bold ${TONE[e.tone]}`}>{e.name}</div>
                  <div className="text-[9px] text-slate-600 mt-0.5">{e.when}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {fails.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {fails.rows.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 pr-2 font-mono font-bold whitespace-nowrap ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2.5">
            <div className="text-[10px] font-bold text-emerald-900 mb-1">✅ REST 호출 정답 공식</div>
            <div className="text-[10px] text-emerald-800 leading-relaxed">{formula}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      basic:      { icon: '📡', label: '기본 호출' },
      lifetime:   { icon: '♻️', label: '수명 관리' },
      factory:    { icon: '🏭', label: 'Factory' },
      auth:       { icon: '🔐', label: '헤더·인증' },
      resilience: { icon: '⏱', label: '타임아웃·재시도' },
      errors:     { icon: '🗺', label: '에러 처리' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.basic;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>HttpClient — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'basic' && <BasicView flow={state.flow} resp={state.resp} />}
          {state.stage === 'lifetime' && <LifetimeView />}
          {state.stage === 'factory' && <FactoryView pool={state.pool} />}
          {state.stage === 'auth' && <AuthView req={state.req} />}
          {state.stage === 'resilience' && <ResilienceView retry={state.retry} deadlock={state.deadlock} />}
          {state.stage === 'errors' && <ErrorsView exceptions={state.exceptions} fails={state.fails} formula={state.formula} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅳ. 컬렉션과 IO · IV-2-2</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">IV-2-2. HttpClient</h1>
                <p className="text-sm text-violet-800/80">HttpClient로 REST API를 호출하고 올바르게 관리하기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                REST 호출의 뼈대는 "요청 → 상태 확인(EnsureSuccessStatusCode) → json 역직렬화"이고, GetFromJsonAsync/PostAsJsonAsync 가 이를 한 줄로 줄여준다.
                가장 중요한 건 수명 관리다 — using(new HttpClient()) 반복은 소켓을 고갈시키니, HttpClient 는 재사용하거나 IHttpClientFactory 로 주입받아라.
                여기에 짧은 타임아웃, CancellationToken 취소, Polly 재시도, 그리고 끝까지 async/await(.Result 금지)를 얹으면 실무에서 안정적이다.
                실패 4대장(소켓 고갈·EnsureSuccess 생략·타임아웃 미설정·.Result 데드락)만 피해도 절반은 성공이다. 다음 장 V-1-1로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['HttpClient', 'GetFromJsonAsync', 'PostAsJsonAsync', 'EnsureSuccessStatusCode', 'IHttpClientFactory', '소켓고갈', 'Bearer인증', 'Timeout', 'CancellationToken', 'Polly재시도', 'HttpRequestException', 'async-await'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
