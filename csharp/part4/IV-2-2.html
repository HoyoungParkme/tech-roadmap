  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    C# IV-2-2 — HttpClient
    학습 목표: HttpClient 로 REST API 를 호출하는 기본 흐름(요청→상태코드→json 역직렬화)과,
              소켓 고갈을 피하는 수명 관리(재사용·IHttpClientFactory), 인증·타임아웃·취소·에러 처리를 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 요청/응답 흐름 + new 반복 vs 재사용 대비 애니메이션) / 우(VSCode CodeViewer: csharp)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 기본 호출 → 수명 관리(핵심) → Factory → 인증/헤더 → 타임아웃/취소/재시도 → 에러 처리 & 전체 지도
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      basicGet: {lang:"csharp", filename:"BasicGet.cs — GET 요청과 역직렬화", lines:[
        "using System.Net.Http;",
        "using System.Net.Http.Json;   // GetFromJsonAsync 확장",
        "",
        "// 응답 타입 User 는 파일 맨 아래 (형식은 최상위 문 뒤에)",
        "",
        "var client = new HttpClient();",
        "client.BaseAddress = new Uri(\"https://api.example.com\");",
        "",
        "// ① 저수준 — 상태 확인을 직접 한다",
        "HttpResponseMessage res = await client.GetAsync(\"/api/users/1\");",
        "res.EnsureSuccessStatusCode();   // 4xx/5xx 면 예외",
        "User? u = await res.Content.ReadFromJsonAsync<User>();",
        "Console.WriteLine(u);",
        "// => User { Id = 1, Name = Ada, Email = ada@x.io }",
        "",
        "// ② 고수준 — 위 3줄을 한 줄로 (상태확인+역직렬화 내장)",
        "User? u2 = await client.GetFromJsonAsync<User>(\"/api/users/1\");",
        "// => 200 이 아니면 HttpRequestException 을 던진다",
        "",
        "record User(int Id, string Name, string Email);",
      ]},
      lifetime: {lang:"csharp", filename:"Lifetime.cs — new 반복 vs 재사용", lines:[
        "// ❌ 안티패턴 — 요청마다 new + using",
        "for (int i = 0; i < 10_000; i++)",
        "{",
        "    using var bad = new HttpClient();   // 매번 새 소켓",
        "    await bad.GetAsync(\"https://api.example.com/ping\");",
        "}   // Dispose 해도 소켓은 TIME_WAIT 로 남는다",
        "// => SocketException: 주소를 사용할 수 없습니다 (포트 고갈)",

    const S2 = { title: "Step 2. 수명 관리 (핵심) — 매번 new 하면 소켓이 고갈된다", desc: "이 장에서 반드시 가져가야 할 한 가지다. HttpClient는 IDisposable이라 습관적으로 using(new HttpClient())로 감싸기 쉽지만, 이게 최악의 안티패턴이다. Dispose 해도 그 밑의 TCP 소켓은 곧바로 닫히지 않고 운영체제의 TIME_WAIT 상태로 수십 초~수 분 남는다. 요청 때마다 new 하면 이 좀비 소켓이 쌓여 결국 사용 가능한 포트가 바닥나고, \"SocketException: 주소를 사용할 수 없습니다\"로 서비스가 죽는다(고부하일수록 빨리). 정답은 재사용이다 — HttpClient 하나를 만들어 앱 수명 내내 공유한다. HttpClient는 스레드 안전하므로 여러 스레드가 같은 인스턴스로 동시 요청해도 된다. 단, 정적(static) 인스턴스만 쓰면 DNS 변경을 못 따라가는 약점이 있는데, 그 해법이 다음 단계의 IHttpClientFactory다." };
    const S3 = { title: "Step 3. IHttpClientFactory — DI 시대의 정답", desc: "정적 HttpClient 하나만 쓰면 소켓 고갈은 막지만 반대 문제가 생긴다: 연결 핸들러를 영원히 붙들고 있어 DNS가 바뀌어도(배포·페일오버로 서버 IP 변경) 옛 주소로 계속 붙는다. IHttpClientFactory는 이 둘 사이의 균형을 잡아준다. 내부의 연결 핸들러를 풀(pool)로 관리하며 일정 주기(기본 2분)마다 갈아끼워, 소켓은 재사용하면서도 DNS 변화는 반영한다. ASP.NET Core에서는 AddHttpClient()로 등록하고 생성자에서 주입받아 CreateClient()로 꺼내 쓴다. \"이름 있는 클라이언트\"나 \"타입 있는 클라이언트\"로 서비스별 BaseAddress·기본 헤더를 미리 세팅해두면, 호출부는 비즈니스 로직만 남아 깔끔하다. 실무의 기본값은 \"직접 new 하지 말고 Factory를 주입받는다\"이다." };
    const S4 = { title: "Step 4. 헤더 · 인증 · POST — 실전 요청 꾸미기", desc: "REST API는 대부분 인증을 요구한다. 가장 흔한 방식이 Bearer 토큰으로, Authorization 헤더에 \"Bearer <token>\"을 담아 보낸다. 요청 하나에만 붙일 땐 HttpRequestMessage를 직접 만들어 Headers에 넣고, 모든 요청에 공통으로 붙일 땐 DefaultRequestHeaders에 한 번만 세팅한다. 데이터를 보낼 때(생성/수정)는 PostAsJsonAsync가 편하다 — 객체를 json으로 직렬화하고 Content-Type: application/json까지 자동으로 붙여준다. 여기서 주의할 실무 포인트: 인증 토큰이나 콘텐츠 타입을 손으로 문자열 조립하다 오타·중복으로 401이 나는 경우가 잦다. 전용 프로퍼티(AuthenticationHeaderValue, PostAsJsonAsync)를 쓰면 이런 실수를 원천 차단한다. 응답 역시 상태 확인 후 역직렬화하는 규칙은 그대로다." };

      },
      { ...S6,
        beat: {
          label: "타임아웃과 취소를 구분",
          at: "ErrorHandling.cs L14–16",
          caption: "TaskCanceledException은 취소와 타임아웃 둘 다에서 온다. 우리 cts가 취소되지 않았는데 났다면 http.Timeout이 터진 것이다. 실제로 재 보면 InnerException이 TimeoutException이다.",
          changes: [{"mark":"new","text":"catch (TaskCanceledException)"},{"mark":"changed","text":"when 절로 타임아웃만 분리"}],
        },
        actor: "⏱ TaskCanceledException — 시간 초과",
        stage: "errors",
        stageLabel: "예외 ② 타임아웃 (취소와 구분)",
        exceptions: [{"name":"HttpRequestException","when":"DNS 실패·연결 거부·EnsureSuccess 상태 이상","tone":"bad"},{"name":"TaskCanceledException","when":"타임아웃 초과 (OperationCanceled 하위)","tone":"mid"}],
        fails: {"title":"HttpClient 실무 실패 4대장","rows":[{"case":"using(new HttpClient()) 반복","why":"소켓 고갈 → SocketException","tone":"bad"},{"case":"EnsureSuccess 생략","why":"에러 응답을 정상으로 파싱","tone":"bad"}]},
        formula: "짧은 Timeout + 상태 확인 + 예외 구분",
        alert: {"tone":"warn","text":"when 절이 없으면 \"사용자 취소\"와 \"서버가 느림\"이 한 덩어리로 묶여 원인 파악이 안 된다."},

        fails: {"title":"HttpClient 실무 실패 4대장","rows":[{"case":"using(new HttpClient()) 반복","why":"소켓 고갈 → SocketException","tone":"bad"},{"case":"EnsureSuccess 생략","why":"에러 응답을 정상으로 파싱","tone":"bad"},{"case":"Timeout 미설정","why":"죽은 서버를 100초 대기","tone":"bad"}]},

        fails: {"title":"HttpClient 실무 실패 4대장","rows":[{"case":"using(new HttpClient()) 반복","why":"소켓 고갈 → SocketException","tone":"bad"},{"case":"EnsureSuccess 생략","why":"에러 응답을 정상으로 파싱","tone":"bad"},{"case":"Timeout 미설정","why":"죽은 서버를 100초 대기","tone":"bad"},{"case":".Result / .Wait() 동기 대기","why":"데드락(UI·옛 ASP.NET) · 스레드 풀 고갈(ASP.NET Core)","tone":"bad"}]},

    // ── RefPanel ── 예전 왼쪽 패널에만 있던 응답 표·핸들러 상태·요청 구성·재시도 기록·예외 표·실패 4대장 (anim/lesson.jsx 가 "표·정리 보기" 상자에 넣는다)
    function RefPanel({ step }) {
      const out = [];
      if (step.stage === 'basic') out.push(
        <div key="b"><h4>📡 응답 상태</h4>
          <table><tbody>
            <tr><td>상태</td><td className="font-mono font-bold">{step.resp.status}</td></tr>
            <tr><td>본문</td><td className="font-mono">{step.resp.body}</td></tr>
            <tr><td>타입</td><td className="font-mono">{step.resp.typed}</td></tr>
          </tbody></table></div>);
      if (step.stage === 'lifetime') out.push(
        <div key="l"><h4>♻️ 수명 비교</h4>
          <table><tbody>
            <tr><td className="font-bold">매번 new HttpClient()</td><td>요청마다 새 소켓 → 닫혀도 TIME_WAIT 로 남아 포트가 쌓인다</td></tr>
            <tr><td className="font-bold">하나를 재사용</td><td>연결을 다시 쓴다 → 포트 고갈 없음 · HttpClient 는 스레드 안전</td></tr>
          </tbody></table></div>);
      if (step.stage === 'factory' && step.pool.length) out.push(
        <div key="f"><h4>🏭 핸들러 상태</h4>
          <table><tbody>{step.pool.map((h, i) => (<tr key={i}><td className="font-mono font-bold">{h.name}</td><td>{h.state === 'expiring' ? '만료' : '사용 중'}</td><td>{h.note}</td></tr>))}</tbody></table></div>);
      if (step.stage === 'auth') out.push(
        <div key="a"><h4>✉️ 요청 구성</h4>
          <table><tbody>
            <tr><td>메서드·경로</td><td className="font-mono">{step.req.method} {step.req.path}</td></tr>
            {step.req.headers.map((h, i) => (<tr key={i}><td>헤더</td><td className="font-mono">{h.k}: {h.v}</td></tr>))}
            <tr><td>본문</td><td className="font-mono">{step.req.body}</td></tr>
            <tr><td>응답</td><td className="font-mono">{step.req.res}</td></tr>
          </tbody></table></div>);
      if (step.stage === 'resilience') {
        if (step.retry.length) out.push(<div key="r"><h4>🔁 재시도 기록 (응답은 예시)</h4>
          <table><tbody>{step.retry.map((r, i) => (<tr key={i}><td className="font-bold">{r.n}</td><td>{r.state === 'ok' ? '✅' : '❌'}</td><td>{r.note}</td></tr>))}</tbody></table></div>);
        out.push(<div key="d"><h4>⚠️ 하지 말 것 → 대신</h4><p className="font-mono">❌ {step.deadlock.bad}</p><p>{step.deadlock.why}</p><p className="font-mono">✅ {step.deadlock.fix}</p></div>);
      }
      if (step.stage === 'errors') {
        if (step.exceptions.length) out.push(<div key="e"><h4>🧯 예외 구분</h4>
          <table><tbody>{step.exceptions.map((x, i) => (<tr key={i}><td className="font-mono font-bold">{x.name}</td><td>{x.when}</td></tr>))}</tbody></table></div>);
        if (step.fails.rows.length) out.push(<div key="f"><h4>🚨 {step.fails.title}</h4>
          <table><tbody>{step.fails.rows.map((x, i) => (<tr key={i}><td className="font-bold">{x.case}</td><td>{x.why}</td></tr>))}</tbody></table></div>);
        out.push(<p key="fm">📌 {step.formula}</p>);
        if (step.fails.rows.length >= 4) out.push(<p key="nx">다음 장: <a href="../part5/V-1-1.html">V-1-1 ASP.NET Core 최소 API 맛보기 →</a></p>);
      }
      return out.length ? <div>{out}</div> : null;
    }
    // ── /RefPanel ──

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
