  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

  <!--
    C# II-2-2 — 예외 처리
    학습 목표: try/catch/finally·using·예외 계층·throw vs throw ex(스택 보존)·커스텀 예외까지
              "견고한 에러 전략"을 6단계로 추적한다. 흐름제어 남용·삼키기·자원 누수 같은 실무 사고 포함.
    패턴: fastapi v1 — 좌(LiveDataPane: 예외 전파·try/catch/finally 실행 순서·계층 매칭 시뮬레이션) / 우(VSCode CodeViewer: C#)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — try/catch/finally → 계층 매칭 → 예외 필터 → throw vs throw ex → 커스텀·비용 → 전체 지도
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"csharp", filename:"Program.cs — try/catch/finally 와 using", lines:[
        "using System;",
        "using System.IO;",
        "",
        "// ── 기본 뼈대 ───────────────────────────",
        "try",
        "{",
        "    int[] data = { 1, 2, 3 };",
        "    Console.WriteLine(data[10]);   // 경계 초과!",
        "}",
        "catch (IndexOutOfRangeException ex)",
        "{",
        "    Console.WriteLine($\"잡음: {ex.Message}\");",
        "    // => 잡음: Index was outside the bounds of the array.",
        "}",
        "finally",
        "{",
        "    Console.WriteLine(\"finally 는 무조건 실행\");",
        "}",
        "",
        "// ── using: 정리를 컴파일러에 위임 ─────────",
        "using (var file = File.OpenRead(\"data.bin\"))",
        "{",
        "    // 블록이 끝나면(예외로 끝나도) Dispose() 자동 호출",
        "}   // 파일 핸들 확정 해제 — finally 를 손으로 안 써도 됨",
      ]},
      s2: {lang:"csharp", filename:"Program.cs — 계층과 catch 순서", lines:[
        "try",
        "{",
        "    ProcessOrder(order);",
        "}",
        "// ✅ 구체적인 예외부터 (아래로 갈수록 일반)",
        "catch (ArgumentNullException ex)",
        "{",
        "    Console.WriteLine($\"필수 값 누락: {ex.ParamName}\");",
        "}",
        "catch (ArgumentException ex)",
        "{",
        "    Console.WriteLine($\"인자 오류: {ex.Message}\");",
        "}",
        "catch (Exception ex)   // 최후의 그물 — 맨 아래",
        "{",
        "    Console.WriteLine($\"예상 못한 오류: {ex.Message}\");",
        "    throw;   // 모르는 건 삼키지 말고 다시 던진다",
        "}",
        "",
        "// 🚫 잘못된 순서 — 컴파일 경고 CS0160",
        "// catch (Exception) { }        // 먼저 다 잡아버려서",
        "// catch (ArgumentException) {} // ← 절대 도달 못 함(죽은 코드)",
      ]},
      s3: {lang:"csharp", filename:"Program.cs — 예외 필터 when", lines:[
        "try",
        "{",
        "    await httpClient.SendAsync(request);",
        "}",
        "// ✅ 429(과다 요청)일 때만 잡아서 재시도",
        "catch (HttpRequestException ex) when (ex.StatusCode == 429)",
        "{",
        "    await Task.Delay(backoff);",
        "    return await RetryAsync(request);",
        "}",
        "// 그 외 상태코드는 이 catch 를 통과 → 위로 전파",
        "catch (HttpRequestException ex) when (ex.StatusCode >= 500)",
        "{",
        "    logger.LogError(ex, \"서버 오류 {Code}\", ex.StatusCode);",
        "    throw;",
        "}",
        "",
        "// 🔧 잡지 않고 로깅만 하는 트릭 (when 은 부수효과 가능)",
        "catch (Exception ex) when (Log(ex))   // Log 는 false 반환",
        "{",
        "    // 여기는 절대 실행 안 됨 — 로깅만 하고 예외는 계속 전파",
        "}",
      ]},
      s4: {lang:"csharp", filename:"Program.cs — 재던지기와 스택 보존", lines:[
        "try",
        "{",
        "    repository.Load(id);   // 여기서 최초 예외 발생",
        "}",
        "catch (SqlException ex)",
        "{",

    const S2 = { title: "Step 2. 예외 계층 — 구체적인 것을 먼저 잡아라", desc: "모든 예외는 System.Exception 을 뿌리로 하는 트리다. ArgumentNullException 은 ArgumentException 의 자식이고, 그 위에 SystemException, 다시 그 위에 Exception 이 있다. catch 는 위에서 아래로 훑어 \"타입이 맞는 첫 블록\"을 고르므로, 넓은 catch(Exception) 를 위에 두면 아래의 구체적 catch 는 영영 실행되지 않는다(컴파일 경고도 뜬다). 그래서 규칙은 항상 \"구체 → 일반\" 순서다. 너무 넓게 catch(Exception) 하나로 다 잡으면 정말 잡아야 할 버그(NullReference 등 프로그래밍 실수)까지 삼켜서 문제를 숨긴다 — 잡을 수 있고 복구할 계획이 있는 예외만 구체적으로 잡는 게 원칙이다." };

        alert: { tone: 'danger', text: '가장 위험한 안티패턴은 빈 catch 다. 버그가 로그도 없이 사라져 아무도 모른다.' },
        code: { ...CODE.s6, highlight: [15, 16, 17, 18] },
      },
      { ...S6,
        beat: {
          label: '예외가 나도 연결은 닫힌다',
          at: 'Program.cs L19–21',
          caption: 'throw 로 메서드를 빠져나가도 await using 이 conn 을 해제한다 — 누수 경로가 남지 않는다.',
          changes: [
            { mark: 'gone', text: '연결 누수 경로 없음' },
            { mark: 'read', text: '예외 경로에서도 DisposeAsync 호출' },
          ],
        },
        actor: '🗺 예외 경로에서도 확정 해제',
        stage: 'pipeline',
        stageLabel: '실패 경로까지 자원이 닫힌다',
        antipatterns: [
          { bad: 'throw ex;', fix: 'throw; (스택 보존)', tone: 'bad' },
          { bad: '빈 catch { } — 삼키기', fix: '최소 로깅 후 재던지기', tone: 'bad' },
          { bad: 'using 없이 자원 누수', fix: 'using / await using / Dispose', tone: 'bad' },
          { bad: '너무 넓은 catch(Exception)', fix: '복구 가능한 구체 예외만', tone: 'bad' },
        ],
        principles: [
          '① 복구 계획 있는 구체 예외만 잡기',
          '② 잡으면 반드시 로깅 (재던질 땐 throw;)',
          '③ 자원은 using/Dispose 로 확정 해제',
        ],
        alert: { tone: 'good', text: '정상 흐름과 실패 흐름 양쪽에서 자원이 닫히는가 — 이 질문에 예라고 답할 수 있어야 한다.' },
        code: { ...CODE.s6, highlight: [19, 20, 21] },
      },
      { ...S6, ...L6,
        beat: {
          label: '세 가지가 동시에 지켜진다',
          at: 'Program.cs L22',
          caption: '삼키지 않고, 로깅하고, 자원을 확정 해제한다 — 견고한 에러 전략의 3원칙이 한 메서드에 모였다.',
          changes: [
            { mark: 'changed', text: '안티패턴 5개 모두 회피' },
            { mark: 'read', text: '3원칙 동시 적용' },
          ],
        },
        code: { ...CODE.s6, highlight: [22] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — try/catch/finally 블록 흐름 + using
    // ─────────────────────────────────────────────────────
    function TryCatchView({ blocks, usingNote }) {
      const TONE = {
        try:     'bg-violet-50 border-violet-300 text-violet-900',
        catch:   'bg-amber-50 border-amber-300 text-amber-900',
        finally: 'bg-emerald-50 border-emerald-300 text-emerald-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧩 실행 흐름 — try 에서 예외 → catch → finally</div>
            <div className="space-y-1.5">
              {blocks.map((b, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-violet-400 text-xs leading-none">▼</div>}
                  <div className={`rounded border px-2 py-1.5 ${TONE[b.tone]}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-mono font-bold">{b.name}</span>
                      <span className="text-[10px] font-bold">{b.role}</span>
                    </div>
                    <div className="text-[9px] opacity-80 mt-0.5">{b.note}</div>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1">♻ using (IDisposable 자동 정리)</div>
            <div className="text-[10px] text-slate-700">{usingNote}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 예외 계층 트리 + catch 순서
    // ─────────────────────────────────────────────────────
    function HierarchyView({ tree, order }) {
      const TONE = {
        root: 'bg-violet-100 border-violet-400 text-violet-900',
        mid:  'bg-indigo-50 border-indigo-300 text-indigo-900',
        leaf: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🌳 예외 계층 (System.Exception 이 뿌리)</div>
            <div className="space-y-1">
              {tree.map((t, i) => (
                <div key={i} style={{ marginLeft: `${t.depth * 16}px` }}
                     className={`text-[10px] rounded border px-2 py-1 ${TONE[t.tone]}`}>
                  <span className="font-mono font-bold">{t.depth > 0 ? '└ ' : ''}{t.name}</span>
                  <span className="opacity-70 ml-1">— {t.note}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">✅ 올바른 catch 순서 (구체 → 일반)</div>
            <div className="space-y-1">
              {order.good.map((g, i) => (
                <div key={i} className="text-[10px] font-mono rounded border px-2 py-1 bg-emerald-50 border-emerald-300 text-emerald-900">
                  <span className="text-slate-400 mr-1">{i + 1}.</span>{g}
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-[10px] text-red-800 bg-red-50 border border-red-200 rounded px-2 py-1">🚫 {order.bad}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 예외 필터 when 시나리오
    // ─────────────────────────────────────────────────────
    function FilterView({ filter }) {
      const TONE = {
        good: 'bg-emerald-50 border-emerald-300 text-emerald-900',
        bad:  'bg-slate-50 border-slate-300 text-slate-600',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔎 catch (…) when (조건) — 잡기 전에 평가</div>
            <div className="space-y-1.5">
              {filter.scenarios.map((s, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${TONE[s.tone]}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-mono font-bold">when ({s.cond})</span>
                    <span className="text-[10px] font-bold">{s.match ? '✓ 매칭 → 잡음' : '✗ 통과 → 전파'}</span>
                  </div>
                  <div className="text-[9px] opacity-80 mt-0.5">{s.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-1">🧵 스택 보존</div>
            <div className="text-[10px] text-slate-700">{filter.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — throw vs throw ex + 스택 비교
    // ─────────────────────────────────────────────────────
    function RethrowView({ rethrow, stack }) {
      const TONE = {
        good: 'bg-emerald-50 border-emerald-300 text-emerald-900',
        bad:  'bg-red-50 border-red-300 text-red-900',
        mid:  'bg-indigo-50 border-indigo-300 text-indigo-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧵 재던지기 3가지 — 스택 보존 여부</div>
            <div className="space-y-1.5">
              {rethrow.map((r, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${TONE[r.tone]}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-mono font-bold">{r.code}</span>
                    <span className="text-[10px] font-bold">{r.keep ? '스택 보존 ✓' : '스택 유실 ✗'}</span>
                  </div>
                  <div className="text-[9px] opacity-80 mt-0.5">{r.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-emerald-400 bg-white p-2">
              <div className="text-[10px] font-bold text-emerald-800 mb-1">throw; (보존)</div>
              <pre className="text-[9px] leading-4 font-mono text-slate-700 whitespace-pre-wrap">{stack.before.join('\n')}</pre>
            </div>
            <div className="rounded-lg border-2 border-red-400 bg-white p-2">
              <div className="text-[10px] font-bold text-red-800 mb-1">throw ex; (유실)</div>
              <pre className="text-[9px] leading-4 font-mono text-slate-700 whitespace-pre-wrap">{stack.afterBad.join('\n')}</pre>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 예외 vs 반환값 결정 표
    // ─────────────────────────────────────────────────────
    function CustomView({ decision }) {
      const TONE = { good: 'text-emerald-700', bad: 'text-red-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">⚖ 예외 vs 반환값 — 무엇을 던질까</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-violet-900 border-b border-violet-200">
                  <th className="text-left py-0.5">상황</th>
                  <th className="text-left py-0.5 pl-2">선택</th>
                  <th className="text-left py-0.5 pl-2">왜</th>
                </tr>
              </thead>
              <tbody>
                {decision.map((d, i) => (
                  <tr key={i} className="border-t border-violet-100 align-top">
                    <td className="py-1 text-slate-700">{d.sit}</td>
                    <td className={`py-1 pl-2 font-bold ${TONE[d.tone]}`}>{d.pick}</td>
                    <td className="py-1 pl-2 text-slate-600">{d.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5 text-[10px] text-amber-900">
            💰 예외는 스택 추적 수집 때문에 비용이 크다 — "자주 나는 정상적 실패"에는 쓰지 마라.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 안티패턴 5 + 견고한 전략 3원칙
    // ─────────────────────────────────────────────────────
    function PipelineView({ antipatterns, principles }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 반복되는 안티패턴 → 해법</div>
            <table className="w-full text-[10px]">
              <tbody>
                {antipatterns.map((a, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className="py-1 pr-2 font-mono font-bold text-red-700 whitespace-nowrap">{a.bad}</td>
                    <td className="py-1 text-emerald-800">→ {a.fix}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-violet-400 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🛡 견고한 에러 전략 3원칙</div>
            <div className="space-y-1">
              {principles.map((p, i) => (
                <div key={i} className="text-[10px] rounded px-2 py-1 border font-bold bg-violet-50 border-violet-300 text-violet-900">{p}</div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      trycatch:  { icon: '🧩', label: 'try/catch/finally' },
      hierarchy: { icon: '🌳', label: '예외 계층' },
      filter:    { icon: '🔎', label: '예외 필터' },
      rethrow:   { icon: '🧵', label: '스택 보존' },
      custom:    { icon: '🏗', label: '커스텀·설계' },
      pipeline:  { icon: '🗺', label: '전략 지도' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.trycatch;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>예외 처리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'trycatch' && <TryCatchView blocks={state.blocks} usingNote={state.usingNote} />}
          {state.stage === 'hierarchy' && <HierarchyView tree={state.tree} order={state.order} />}
          {state.stage === 'filter' && <FilterView filter={state.filter} />}
          {state.stage === 'rethrow' && <RethrowView rethrow={state.rethrow} stack={state.stack} />}
          {state.stage === 'custom' && <CustomView decision={state.decision} />}
          {state.stage === 'pipeline' && <PipelineView antipatterns={state.antipatterns} principles={state.principles} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅱ. 객체지향 · II-2-2</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">II-2-2. 예외 처리</h1>
                <p className="text-sm text-violet-800/80">try/catch/finally·예외 계층·커스텀 예외와 견고한 에러 전략</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                예외 처리의 뼈대는 try/catch/finally 이고, 자원 정리는 finally 를 손으로 쓰기보다 using(IDisposable)에 맡긴다.
                catch 는 "구체 → 일반" 순서로, 복구 계획이 있는 예외만 잡는다. when 필터로 조건부 매칭하면 스택이 보존된다.
                재던질 땐 언제나 throw; (throw ex; 는 최초 발생 지점을 지운다), 의미를 바꿔 올릴 땐 원본을 InnerException 으로 감싼다.
                예외는 비싸니 "자주 나는 정상적 실패"는 반환값(TryParse·nullable·Result)으로 표현하고, 커스텀 예외는 Exception 을 상속해 만든다.
                최악의 안티패턴은 빈 catch 로 삼키는 "조용한 실패"다. 다음 장 III-1-1 에서 제네릭·컬렉션으로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['try-catch-finally', 'using', 'IDisposable', '예외계층', 'when필터', 'throw', 'throw-ex', '스택추적', 'InnerException', '커스텀예외', 'TryParse', '삼키기금지'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
