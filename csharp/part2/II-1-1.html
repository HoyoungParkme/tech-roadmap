  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C# II-1-1 — 클래스·상속·인터페이스
    학습 목표: 클래스/생성자/상속(: Base)·base·단일상속, virtual/override/sealed/abstract,
              인터페이스(계약·다중구현·명시적·기본구현), 다형성(가상 디스패치), is/as/패턴매칭 캐스팅을
              5단계로 추적하고 실무 실패 사례까지 본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 클래스 계층·다형 디스패치 시뮬레이션) / 우(VSCode CodeViewer: csharp)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 클래스/상속 → 다형 재정의 → 인터페이스 → 다형성(가상 디스패치) → 캐스팅
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(class/override/interface/poly/cast)에 따라 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      animals: {lang:"csharp", filename:"Animals.cs — 클래스와 상속", lines:[
        "public class Animal",
        "{",
        "    public string Name { get; }",
        "",
        "    // 부모 생성자",
        "    public Animal(string name) => Name = name;",
        "",
        "    public void Eat() =>",
        "        Console.WriteLine($\"{Name} 이(가) 먹는다\");",
        "}",
        "",
        "// Dog 은 Animal 을 상속 (단일 상속)",
        "public class Dog : Animal",
        "{",
        "    public string Breed { get; }",
        "",
        "    // : base(name) → 부모 생성자 먼저 호출",
        "    public Dog(string name, string breed)",
        "        : base(name)",
        "    {",
        "        Breed = breed;",
        "    }",
        "",
        "    public void Fetch() =>",
        "        Console.WriteLine($\"{Name}({Breed}) 공을 문다\");",
        "}",
        "",
        "var d = new Dog(\"바둑이\", \"진돗개\");",
        "d.Eat();    // => 바둑이 이(가) 먹는다  (부모 메서드 상속)",
        "d.Fetch();  // => 바둑이(진돗개) 공을 문다",
      ]},
      shapes: {lang:"csharp", filename:"Shapes.cs — virtual / override / abstract", lines:[
        "// abstract 클래스 → 직접 new 불가, 설계도 역할",
        "public abstract class Shape",
        "{",
        "    // abstract 메서드 → 본문 없음, 자식이 반드시 구현",
        "    public abstract double Area();",
        "",
        "    // virtual → 자식이 원하면 재정의 가능",
        "    public virtual string Describe() => $\"넓이 {Area():F1}\";",
        "}",
        "",
        "public class Circle : Shape",
        "{",
        "    public double R { get; init; }",
        "    // abstract 를 구현 → override 필수",
        "    public override double Area() => Math.PI * R * R;",
        "}",
        "",
        "public sealed class Square : Shape",
        "{",
        "    public double Side { get; init; }",
        "    public override double Area() => Side * Side;",
        "    // sealed override → 이 아래로는 재정의 봉인",
        "    public override string Describe() => $\"정사각형 {Area():F1}\";",
        "}",
        "",
        "// var s = new Shape();   // ❌ 컴파일 에러: abstract",
        "Shape c = new Circle { R = 2 };",
        "Console.WriteLine(c.Describe());  // => 넓이 12.6",
      ]},
      logging: {lang:"csharp", filename:"Logging.cs — interface & 다중 구현", lines:[
        "public interface ILogger",
        "{",
        "    void Log(string msg);",
        "    // C# 8+ 기본 구현 — 구현체가 생략하면 이 코드 사용",
        "    void LogError(string msg) => Log($\"[ERROR] {msg}\");",
        "}",
        "",
        "public interface IDisposable { void Dispose(); }",
        "",
        "// 클래스 하나 + 인터페이스 여러 개 (다중 구현)",
        "public class FileLogger : ILogger, IDisposable",
        "{",
        "    public void Log(string msg) =>",
        "        Console.WriteLine($\"[FILE] {msg}\");",
        "",
        "    // 명시적 구현 → IDisposable 로 캐스팅해야만 보임",
        "    void IDisposable.Dispose() =>",
        "        Console.WriteLine(\"파일 핸들 닫음\");",
        "}",
        "",

    const S1 = { title:"Step 1. 클래스·생성자·상속 — : Base 와 base", desc:"클래스는 데이터(필드/프로퍼티)와 행동(메서드)을 한 덩어리로 묶은 설계도다. 상속은 `class Dog : Animal` 문법으로 부모의 멤버를 그대로 물려받아 재사용하는 것으로, C#은 클래스의 다중 상속을 금지하고 오직 단일 상속만 허용한다(대신 인터페이스를 여러 개 구현). 자식 객체가 생성될 때는 부모 생성자가 먼저 돌아야 부모 쪽 필드가 초기화되므로, 자식 생성자에서 `: base(...)`로 부모 생성자에 인자를 넘겨 호출한다 — 생략하면 컴파일러가 부모의 매개변수 없는 생성자를 자동 호출하는데, 부모에 그런 생성자가 없으면 컴파일 에러가 난다. 실무 초심자가 가장 자주 막히는 지점이 바로 이 \"부모 생성자 체이닝\"이다." };
    const S2 = { title:"Step 2. virtual / override / sealed · abstract", desc:"부모의 메서드를 자식이 \"다르게\" 동작시키려면 부모에서 `virtual`로 재정의를 허용하고 자식에서 `override`로 새 구현을 준다 — 이 짝이 맞아야 다형성이 켜진다(Step 4에서 확인). virtual 없이 자식이 같은 이름의 메서드를 `new`로 선언하면 재정의가 아니라 \"숨김(hiding)\"이라, 부모 타입 참조로 부를 때 여전히 부모 메서드가 불려 버그가 된다 — C# 컴파일러가 경고를 주는데도 실무에서 자주 무시하는 대표 함정이다. `abstract` 클래스는 그 자체로는 인스턴스화할 수 없는 \"미완성 설계도\"로, `abstract` 메서드는 본문 없이 시그니처만 두고 자식이 반드시 override 하게 강제한다. 더 이상의 재정의를 막고 싶으면 `sealed override`로 상속 사슬을 여기서 끊는다." };
    const S3 = { title:"Step 3. 인터페이스 — 계약 · 다중 구현 · 기본 구현", desc:"인터페이스는 \"무엇을 할 수 있어야 한다\"는 계약(메서드 시그니처의 목록)만 정의하고 구현은 담지 않는다. 클래스는 부모 클래스는 하나뿐이지만 인터페이스는 여러 개를 동시에 구현할 수 있어, C#의 단일 상속 제약을 우회하는 조합 수단이 된다(`class FileLogger : IDisposable, ILogger`). 서로 다른 두 인터페이스가 같은 이름의 메서드를 요구해 충돌하거나 그 메서드를 평소엔 숨기고 싶을 때는 `void IFoo.Do()`처럼 명시적 구현(explicit implementation)을 쓰면 해당 인터페이스 타입으로 캐스팅해야만 호출된다. C# 8부터는 인터페이스에 기본 구현(default implementation)을 넣어, 이미 배포된 인터페이스에 새 메서드를 추가해도 기존 구현체를 깨지 않고 확장할 수 있다. \"구현을 물려받고 싶으면 추상 클래스, 능력(계약)만 규정하려면 인터페이스\"가 선택 기준이다." };
    const S4 = { title:"Step 4. 다형성 — 부모 타입 참조, 자식 구현 호출", desc:"다형성(polymorphism)은 여러 자식 객체를 \"부모 타입\" 또는 \"인터페이스 타입\" 하나로 담아 두고, 같은 메서드 호출이 각 객체의 실제 구현으로 갈라져 실행되는 것이다. 핵심은 컴파일러가 아니라 런타임이 \"변수에 실제로 담긴 객체\"를 보고 호출할 메서드를 고르는 가상 디스패치(virtual dispatch)에 있다 — `Animal a = new Dog(); a.Speak();`는 변수 타입이 Animal이어도 실제 객체가 Dog이므로 Dog.Speak()가 불린다(단, Speak가 virtual/override일 때만!). 덕분에 `List<Animal>`에 개·고양이를 섞어 담고 `foreach`로 한 번에 순회하며 각자의 소리를 내게 할 수 있어, if/switch로 타입을 일일이 분기하던 코드가 사라진다. 새 동물을 추가할 때 기존 반복문을 건드리지 않아도 되는 이 확장성이 OOP의 가장 큰 실전 이점이다." };
    const S5 = { title:"Step 5. 캐스팅 — is / as / 패턴 매칭 & 안티패턴", desc:"부모 타입으로 다루던 객체에서 자식만의 멤버가 필요하면 아래로 형변환(다운캐스팅)해야 한다. 이때 `(Dog)a`처럼 직접 캐스팅하면 실제 타입이 아닐 때 `InvalidCastException`으로 프로그램이 죽으므로, 안전하게는 `is`(맞으면 true)와 `as`(맞으면 객체, 아니면 null)를 쓴다 — 특히 `as` 뒤 null 검사를 빼먹으면 다음 줄에서 NullReferenceException으로 터지는 게 흔한 사고다. C# 7+의 패턴 매칭 `if (a is Dog d)`는 타입 검사와 변수 바인딩을 한 줄로 합쳐 가장 깔끔하고, `switch` 식의 타입 패턴으로 여러 갈래를 표현식으로 정리할 수 있다. 다만 여기서 한 걸음 물러설 필요가 있다: 코드 곳곳에 `is/as`로 타입을 캐내 분기하고 있다면 그건 대개 \"다형성을 제대로 안 썼다\"는 신호다 — Step 4처럼 virtual 메서드로 각 타입이 알아서 행동하게 만들면 캐스팅 자체가 사라진다." };

          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-2">⛓ 생성자 체이닝 — 부모부터 초기화</div>
            <div className="space-y-1">
              {ctorChain.map((c, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-fuchsia-400 text-xs leading-3">↓</div>}
                  <div className={`text-[10px] font-mono rounded border px-2 py-1 ${TONE[c.tone]}`}>{c.step}</div>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 재정의 키워드 표 + new 함정
    // ─────────────────────────────────────────────────────
    function OverrideView({ keywords, trap }) {
      const TONE = {
        ok: 'bg-emerald-50 border-emerald-300 text-emerald-900',
        bad: 'bg-red-50 border-red-300 text-red-900',
        mid: 'bg-amber-50 border-amber-300 text-amber-900',
        seal: 'bg-slate-50 border-slate-300 text-slate-700',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔁 재정의 키워드 — 짝이 맞아야 다형성 ON</div>
            <div className="space-y-1.5">
              {keywords.map((k, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${TONE[k.tone]}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-mono font-bold">{k.k}</span>
                    <span className="text-[9px] opacity-70">{k.where}</span>
                  </div>
                  <div className="text-[10px] opacity-90 mt-0.5">{k.mean}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {trap.title}</div>
            <div className="space-y-1">
              {trap.rows.map((r, i) => (
                <div key={i} className={`text-[10px] font-mono rounded px-2 py-1 border ${r.ok ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-white border-red-200 text-red-800'}`}>
                  {r.ok ? '✓ ' : '✗ '}{r.code}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 인터페이스 계약 & 다중 구현 + 비교표
    // ─────────────────────────────────────────────────────
    function InterfaceView({ iface, compare }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">📜 계약(인터페이스) → 클래스가 다중 구현</div>
            <div className="flex gap-2 justify-center flex-wrap mb-2">
              {iface.contracts.map((c, i) => (
                <div key={i} className="rounded-lg border-2 border-dashed border-indigo-400 bg-indigo-50 p-2 min-w-[110px]">
                  <div className="text-[10px] font-bold text-indigo-900 text-center border-b border-indigo-300 pb-0.5 mb-0.5">«interface»<br/>{c.name}</div>
                  {c.members.map((m, j) => (
                    <div key={j} className="text-[9px] font-mono text-indigo-700 text-center">{m}</div>
                  ))}
                </div>
              ))}
            </div>
            <div className="text-center text-violet-500 text-lg leading-4">▲ implements</div>
            <div className="rounded-lg border-2 border-violet-400 bg-violet-50 p-2 mx-auto max-w-[220px] mt-0.5">
              <div className="text-[11px] font-bold text-violet-900 text-center">{iface.impl.name}</div>
              <div className="text-[9px] text-violet-600 text-center mb-1">{iface.impl.note}</div>
              {iface.impl.has.map((m, i) => (
                <div key={i} className="text-[9px] font-mono text-violet-800 text-center">✓ {m}</div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-1.5">⚖ {compare.title}</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-fuchsia-900 border-b border-fuchsia-200">
                  <th className="text-left py-0.5"></th>
                  <th className="text-left py-0.5 pl-1">추상 클래스</th>
                  <th className="text-left py-0.5 pl-1">인터페이스</th>
                </tr>
              </thead>
              <tbody>
                {compare.rows.map((r, i) => (
                  <tr key={i} className="border-t border-fuchsia-100 align-top">
                    <td className="py-1 font-bold text-slate-700 whitespace-nowrap">{r.axis}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.abs}</td>
                    <td className="py-1 pl-1 text-violet-800 font-medium">{r.ifc}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 가상 디스패치: 변수 타입 vs 실제 객체
    // ─────────────────────────────────────────────────────
    function PolyView({ dispatch, loopNote }) {
      const TONE = {
        dog: 'bg-violet-50 border-violet-300 text-violet-900',
        cat: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
        base: 'bg-slate-50 border-slate-300 text-slate-600',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🎭 같은 변수 타입 ({dispatch.varType}), 다른 실행</div>
            <div className="space-y-1.5">
              {dispatch.rows.map((r, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${TONE[r.tone]}`}>
                  <div className="text-[10px] font-mono font-bold">{r.varRef}</div>
                  <div className="flex items-center gap-1.5 mt-1 text-[9px]">
                    <span className="rounded-full px-1.5 py-0.5 bg-white/70 border border-current">실제: {r.real}</span>
                    <span className="opacity-60">→</span>
                    <span className="font-mono font-bold">{r.calls}</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-violet-700 bg-violet-50 border border-violet-200 rounded px-2 py-1">
              🧠 {dispatch.note}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1">🔁 확장성</div>
            <div className="text-[10px] text-emerald-900 bg-emerald-50 border border-emerald-200 rounded px-2 py-1">✅ {loopNote}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 캐스팅 3방식 위험도 + 안티패턴
    // ─────────────────────────────────────────────────────
    function CastView({ casts, antipattern }) {
      const TONE = {
        bad: 'bg-red-50 border-red-300 text-red-900',
        mid: 'bg-amber-50 border-amber-300 text-amber-900',
        ok: 'bg-emerald-50 border-emerald-300 text-emerald-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔀 다운캐스트 3방식 — 위험도 순</div>
            <div className="space-y-1.5">
              {casts.map((c, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${TONE[c.tone]}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-mono font-bold">{c.way}</span>
                    <span className="text-[9px] opacity-70">{c.how}</span>
                  </div>
                  <div className="text-[10px] opacity-90 mt-0.5">{c.risk}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {antipattern.title}</div>
            <div className="text-[10px] font-mono rounded px-2 py-1 border bg-white border-red-200 text-red-800 whitespace-pre-wrap mb-1">✗ {antipattern.bad}</div>
            <div className="text-[10px] font-mono rounded px-2 py-1 border bg-emerald-50 border-emerald-300 text-emerald-900 whitespace-pre-wrap">✓ {antipattern.good}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      class:     { icon: '🧱', label: '클래스·상속' },
      override:  { icon: '🔁', label: '재정의' },
      interface: { icon: '📜', label: '인터페이스' },
      poly:      { icon: '🎭', label: '다형성' },
      cast:      { icon: '🔀', label: '캐스팅' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.class;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>C# 객체지향 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'class' && <ClassView hierarchy={state.hierarchy} ctorChain={state.ctorChain} />}
          {state.stage === 'override' && <OverrideView keywords={state.keywords} trap={state.trap} />}
          {state.stage === 'interface' && <InterfaceView iface={state.iface} compare={state.compare} />}
          {state.stage === 'poly' && <PolyView dispatch={state.dispatch} loopNote={state.loopNote} />}
          {state.stage === 'cast' && <CastView casts={state.casts} antipattern={state.antipattern} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅱ. 객체지향 · II-1-1</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">II-1-1. 클래스·상속·인터페이스</h1>
                <p className="text-sm text-violet-800/80">클래스 상속과 인터페이스로 다형성을 구현하는 C#의 객체지향</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                클래스는 단일 상속(: Base)만 되고 생성자는 base 로 부모부터 초기화된다. 부모의 virtual 메서드를 자식이 override 해야
                다형성이 켜진다 — new 로 숨기면 부모 타입 참조에서 부모 것이 불려 버그가 된다. 인터페이스는 계약만 규정해 여러 개를
                동시에 구현할 수 있고(단일 상속 우회), 명시적 구현·기본 구현(C# 8+)으로 충돌과 확장을 다룬다. 다형성은 부모/인터페이스
                타입 참조 + 런타임 가상 디스패치이며, 캐스팅은 (T) 대신 is 패턴 매칭이 안전하다. is/as 분기가 늘면 virtual 로
                리팩터링하라. 다음 장 II-1-2로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['클래스', '상속', 'base', 'virtual', 'override', 'sealed', 'abstract', '인터페이스', '다중구현', '기본구현', '다형성', '가상디스패치', 'is/as', '패턴매칭'].map((k) => (
