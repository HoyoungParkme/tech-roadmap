  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    C# V-2-1 — 단위 테스트(xUnit)
    학습 목표: xUnit으로 테스트를 작성하고 [Fact]·[Theory]·Assert 로 검증하는 흐름을
              AAA(Arrange-Act-Assert) 관점에서 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: AAA 실행·pass/fail·[Theory] 확장·모킹 시각화) / 우(VSCode CodeViewer: xUnit 테스트 + dotnet test)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — [Fact]/AAA → [Theory] → Assert → 픽스처 → 모킹(Moq) → 전체 지도
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(fact/theory/assert/fixture/mock/pipeline)에 따라 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. [Fact] 와 AAA — 테스트 한 개의 뼈대',
        desc: '단위 테스트는 "이 코드가 정말 내가 기대한 값을 내놓는가"를 코드로 못 박는 안전망이다. xUnit에서 인자 없는 단일 테스트는 [Fact] 특성을 붙인 public 메서드 하나다. 좋은 테스트는 예외 없이 AAA 세 구획으로 읽힌다 — Arrange(입력·객체 준비), Act(테스트 대상 딱 한 번 호출), Assert(결과 검증). 이 세 줄이 눈에 바로 들어와야 6개월 뒤의 내가 "무엇을 왜 검증하는지" 안다. 실무 실패 1순위는 Act 없이 Assert만 있거나, 반대로 Assert가 아예 없어 "그냥 안 터지면 통과"가 되어버리는 테스트다 — 그건 아무것도 검증하지 않는다.',
        actor: '🧪 CalculatorTests.Add_ReturnsSum — [Fact]',
        stage: 'fact',
        stageLabel: 'AAA 로 실행되는 단일 테스트',
        aaa: [
          { tag: 'Arrange', kr: '준비', line: 'var calc = new Calculator();', tone: 'a', note: '입력·대상 객체를 만든다' },
          { tag: 'Act', kr: '실행', line: 'var result = calc.Add(2, 3);', tone: 'b', note: '테스트 대상을 딱 한 번 호출' },
          { tag: 'Assert', kr: '검증', line: 'Assert.Equal(5, result);', tone: 'c', note: '기대값과 실제값을 비교' },
        ],
        verdict: { pass: true, expected: '5', actual: '5', label: 'Add(2, 3)' },
        alert: { tone: 'info', text: '[Fact] = 인자 없는 단일 테스트. Arrange→Act→Assert 세 구획이 한눈에 보여야 좋은 테스트다. Assert 없는 테스트는 "안 터지면 통과" — 아무것도 검증하지 못하는 가짜 초록불이다.' },
        code: {
          lang: 'csharp',
          filename: 'CalculatorTests.cs — 첫 [Fact] 테스트',
          lines: [
            'using Xunit;',
            '',
            'public class CalculatorTests',
            '{',
            '    [Fact]   // 인자 없는 단일 테스트',
            '    public void Add_TwoNumbers_ReturnsSum()',
            '    {',
            '        // Arrange — 입력과 대상 준비',
            '        var calc = new Calculator();',
            '',
            '        // Act — 테스트 대상을 "딱 한 번" 호출',
            '        var result = calc.Add(2, 3);',
            '',
            '        // Assert — 기대값 == 실제값',
            '        Assert.Equal(5, result);   // => pass',
            '    }',
            '}',
            '',
            '// 테스트 명명: 메서드_상황_기대결과',
            '//   Add_TwoNumbers_ReturnsSum 처럼 읽으면',
            '//   실패 리포트만 봐도 무엇이 깨졌는지 안다.',
          ],
          highlight: [4, 5, 7, 8, 10, 11, 13, 14],
        },
      },
      {
        title: 'Step 2. [Theory] + [InlineData] — 한 논리, 여러 입력',
        desc: '같은 논리를 입력만 바꿔 여러 번 검증하고 싶을 때 [Fact]를 복붙하면 안 된다 — 중복은 유지보수 지옥이다. xUnit은 [Theory]에 [InlineData(...)]를 여러 개 달아 하나의 테스트 메서드를 케이스마다 자동 반복 실행한다. 각 InlineData는 독립된 테스트로 카운트되어, 3개를 붙이면 결과 창에 3개의 초록/빨강이 뜬다. 그래서 경계값(0, 음수, 최대값)과 대표 케이스를 한 곳에 모아 표처럼 관리할 수 있다. 복잡한 객체나 계산이 필요한 입력은 [MemberData]/[ClassData]로 넘긴다. 실무 함정: InlineData에는 컴파일 타임 상수만 들어가므로 new나 런타임 값은 못 쓴다 — 그럴 땐 MemberData다.',
        actor: '🧪 IsEven_Theory — [Theory] × 4 InlineData',
        stage: 'theory',
        stageLabel: '[Theory] 가 케이스마다 확장 실행',
        theory: {
          signature: 'IsEven(int n) → bool',
          cases: [
            { input: '2', expected: 'true', pass: true },
            { input: '7', expected: 'false', pass: true },
            { input: '0', expected: 'true', pass: true },
            { input: '-4', expected: 'true', pass: true },
          ],
        },
        alert: { tone: 'info', text: '[Theory]+[InlineData] 하나가 케이스 수만큼 독립 테스트로 펼쳐진다 → 경계값(0·음수·최대)을 표처럼 모아 관리. 단, InlineData 는 컴파일 상수만 — new/런타임 값은 [MemberData] 로 넘겨라.' },
        code: {

    // Step 1 — [Fact] AAA 실행 흐름 + pass/fail 판정
    // ─────────────────────────────────────────────────────
    function FactView({ aaa, verdict }) {
      const TONE = {
        a: 'bg-violet-50 border-violet-300 text-violet-900',
        b: 'bg-indigo-50 border-indigo-300 text-indigo-900',
        c: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧪 AAA — 테스트 한 개의 세 구획</div>
            <div className="space-y-1.5">
              {aaa.map((a, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-violet-400 text-xs leading-none">▼</div>}
                  <div className={`rounded border px-2 py-1.5 ${TONE[a.tone]}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold">{a.tag} <span className="opacity-60 font-normal">· {a.kr}</span></span>
                      <span className="text-[9px] opacity-70">{a.note}</span>
                    </div>
                    <pre className="mt-1 text-[10px] font-mono text-slate-700 whitespace-pre-wrap">{a.line}</pre>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className={`rounded-lg border-2 p-3 ${verdict.pass ? 'border-emerald-400 bg-emerald-50' : 'border-red-400 bg-red-50'}`}>
            <div className={`text-[11px] font-bold mb-2 ${verdict.pass ? 'text-emerald-800' : 'text-red-800'}`}>
              {verdict.pass ? '✅ PASS' : '❌ FAIL'} — {verdict.label}
            </div>
            <div className="flex items-center gap-2 text-[11px] font-mono">
              <span className="rounded border border-slate-300 bg-white px-2 py-1">expected: <b>{verdict.expected}</b></span>
              <span className="text-slate-400">{verdict.pass ? '==' : '≠'}</span>
              <span className={`rounded border px-2 py-1 ${verdict.pass ? 'border-emerald-300 bg-white text-emerald-900' : 'border-red-300 bg-white text-red-900'}`}>actual: <b>{verdict.actual}</b></span>
            </div>
          </div>
        </div>
      );
    }

        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-1">🧪 [Theory] 메서드 하나</div>
            <pre className="text-[11px] font-mono text-slate-700 bg-violet-50 rounded p-2 border border-violet-200">{theory.signature}</pre>
            <div className="mt-1 text-center text-violet-500 text-lg leading-none">▼ InlineData 마다 독립 테스트로 확장</div>
          </div>
          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-2">📊 케이스 = 각각 독립 테스트</div>
            <table className="w-full text-[11px]">
              <thead>
                <tr className="text-fuchsia-900 border-b border-fuchsia-200">
                  <th className="text-left py-0.5">입력 n</th>
                  <th className="text-left py-0.5">기대</th>
                  <th className="text-left py-0.5">판정</th>
                </tr>
              </thead>
              <tbody>
                {theory.cases.map((c, i) => (
                  <tr key={i} className="border-t border-fuchsia-100">
                    <td className="py-1 font-mono font-bold text-slate-800">{c.input}</td>
                    <td className="py-1 font-mono text-slate-700">{c.expected}</td>
                    <td className="py-1">
                      <span className={`text-[10px] font-bold rounded-full px-2 py-0.5 ${c.pass ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-red-100 text-red-800 border border-red-300'}`}>
                        {c.pass ? '✓ pass' : '✗ fail'}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-2 text-[10px] text-fuchsia-900 bg-fuchsia-50 border border-fuchsia-200 rounded px-2 py-1">
              → 결과 창에 {theory.cases.length}개의 초록/빨강이 개별로 뜬다
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — Assert 종류 표 + 실패 비교
    // ─────────────────────────────────────────────────────
    function AssertView({ asserts, compare }) {
      const TONE = {
        core: 'bg-violet-50 border-violet-300 text-violet-900',
        mid: 'bg-slate-50 border-slate-300 text-slate-700',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔬 목적별 Assert — 가장 구체적인 걸 골라라</div>
            <div className="space-y-1">
              {asserts.map((a, i) => (
                <div key={i} className={`rounded border px-2 py-1 ${TONE[a.tone]}`}>
                  <div className="text-[10px] font-mono font-bold">{a.fn}</div>
                  <div className="text-[9px] opacity-80">{a.use}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-400 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">❌ 실패 시 Assert.Equal 이 찍어주는 것</div>
            <pre className="text-[10px] font-mono text-slate-700 bg-white rounded p-2 border border-red-200 mb-2 whitespace-pre-wrap">{compare.label}</pre>
            <div className="flex items-center gap-2 text-[11px] font-mono">
              <span className="rounded border border-slate-300 bg-white px-2 py-1">Expected: <b>{compare.expected}</b></span>
              <span className="text-red-400">≠</span>
              <span className="rounded border border-red-300 bg-white px-2 py-1 text-red-900">Actual: <b>{compare.actual}</b></span>
            </div>
            <div className="mt-2 text-[10px] text-slate-600">→ 구체 Assert 라 "무엇이 왜 틀렸는지"가 리포트에 그대로 남는다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 테스트 라이프사이클(생성자→Dispose) + 격리 표
    // ─────────────────────────────────────────────────────
    function FixtureView({ lifecycle, isolation }) {
      const TONE = {
        a: 'bg-violet-50 border-violet-300 text-violet-900',
        b: 'bg-indigo-50 border-indigo-300 text-indigo-900',
        c: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
      };
      const ROW = { ok: 'text-emerald-700', bad: 'text-red-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">♻️ 테스트마다 반복되는 생명주기</div>
            <div className="flex items-center gap-1 flex-wrap">
              {lifecycle.map((l, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-violet-400 text-xs">→</span>}
                  <div className={`text-[10px] rounded border px-2 py-1 font-bold text-center ${TONE[l.tone]}`}>
                    <div className="font-mono">{l.step}</div>
                    <div className="text-[9px] font-normal opacity-70">{l.role}</div>
                  </div>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 space-y-0.5">
              {lifecycle.map((l, i) => (
                <div key={i} className="text-[9px] text-slate-600">· <b>{l.step}</b> — {l.desc}</div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">🛡 {isolation.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {isolation.rows.map((r, i) => (
                  <tr key={i} className="border-t border-indigo-100 align-top">
                    <td className={`py-1 pr-2 font-mono font-bold whitespace-nowrap ${ROW[r.tone]}`}>{r.k}</td>
                    <td className="py-1 text-slate-700">{r.v}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 모킹: 실제 의존 → 가짜(mock) 교체
    // ─────────────────────────────────────────────────────
    function MockView({ mock }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🎭 의존을 가짜로 갈아끼운다</div>
            <div className="grid grid-cols-1 gap-2">
              <div className="rounded border-2 border-red-300 bg-red-50 p-2">
                <div className="text-[10px] font-bold text-red-800">❌ 실제 의존 (통합·느림)</div>
                <div className="text-[11px] font-mono font-bold text-slate-800 mt-0.5">{mock.real.impl}</div>
                <div className="text-[9px] text-red-700 mt-0.5">{mock.real.danger}</div>
              </div>
              <div className="text-center text-violet-500 text-xs leading-none">↓ Moq 로 대체 ↓</div>
              <div className="rounded border-2 border-emerald-400 bg-emerald-50 p-2">
                <div className="text-[10px] font-bold text-emerald-800">✅ 가짜 mock (단위·빠름)</div>
                <div className="text-[11px] font-mono font-bold text-slate-800 mt-0.5">{mock.fake.impl}</div>
                <div className="text-[9px] text-emerald-700 mt-0.5">{mock.fake.good}</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-2">💉 DI 주입 & 검증</div>
            <div className="flex items-center gap-1 flex-wrap text-[10px] font-bold">
              <span className="rounded border border-emerald-300 bg-emerald-50 text-emerald-900 px-2 py-1">{mock.fake.label}</span>
              <span className="text-fuchsia-400 text-xs">→ 주입 →</span>
              <span className="rounded border border-violet-300 bg-violet-50 text-violet-900 px-2 py-1">{mock.target}</span>
            </div>
            <div className="mt-2 rounded bg-fuchsia-50 border border-fuchsia-200 px-2 py-1 text-[10px] font-mono text-fuchsia-900">
              🔎 {mock.verify}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 전체 파이프라인 + TDD + 3원칙 + 실패 사례
    // ─────────────────────────────────────────────────────
    function PipelineView({ pipeline, principles, fails }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-400 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🗺 단위 테스트 흐름</div>
            <div className="flex flex-wrap items-center gap-1">
              {pipeline.chain.map((c, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-violet-400 text-xs">→</span>}
                  <span className={`text-[10px] rounded px-2 py-1 border font-bold ${i === pipeline.chain.length - 1 ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-violet-50 border-violet-300 text-violet-900'}`}>{c}</span>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 flex items-center gap-1.5 flex-wrap">
              <span className="text-[10px] text-slate-500">TDD 리듬:</span>
              {pipeline.tdd.map((t, i) => (
                <span key={i} className="text-[10px] rounded-full px-2 py-0.5 bg-fuchsia-100 border border-fuchsia-300 text-fuchsia-900 font-bold">{t}</span>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">✅ {principles.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {principles.rows.map((r, i) => (
                  <tr key={i} className="border-t border-emerald-100 align-top">
                    <td className="py-1 pr-2 font-bold text-emerald-800 whitespace-nowrap">{r.k}</td>
                    <td className="py-1 text-slate-700">{r.v}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {fails.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {fails.rows.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 pr-2 font-bold whitespace-nowrap ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      fact:     { icon: '🧪', label: '[Fact]·AAA' },
      theory:   { icon: '📊', label: '[Theory] 확장' },
      assert:   { icon: '🔬', label: 'Assert 검증' },
      fixture:  { icon: '♻️', label: '셋업·격리' },
      mock:     { icon: '🎭', label: '모킹(Moq)' },
      pipeline: { icon: '🗺', label: '전체 지도' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.fact;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>xUnit — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'fact' && <FactView aaa={state.aaa} verdict={state.verdict} />}
          {state.stage === 'theory' && <TheoryView theory={state.theory} />}
          {state.stage === 'assert' && <AssertView asserts={state.asserts} compare={state.compare} />}
          {state.stage === 'fixture' && <FixtureView lifecycle={state.lifecycle} isolation={state.isolation} />}
          {state.stage === 'mock' && <MockView mock={state.mock} />}
          {state.stage === 'pipeline' && <PipelineView pipeline={state.pipeline} principles={state.principles} fails={state.fails} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅴ. 현장 투입 · V-2-1</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">V-2-1. 단위 테스트(xUnit)</h1>
                <p className="text-sm text-violet-800/80">xUnit으로 테스트를 작성하고 [Fact]·[Theory]·Assert로 검증</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                xUnit에서 단일 테스트는 [Fact], 파라미터화는 [Theory]+[InlineData]다. 모든 테스트는 Arrange-Act-Assert로 읽히게 짜고,
                목적에 맞는 가장 구체적인 Assert(Equal·Throws·Collection 등)를 골라 검증한다. xUnit은 테스트마다 클래스를 새로 만들어
                생성자(준비)·Dispose(정리)로 격리를 강제하고, DB·API 같은 의존은 Moq로 대체해 로직만 격리한다. 좋은 테스트는 독립·빠름·명확이며,
                TDD는 Red→Green→Refactor로 돈다. 커버리지 숫자보다 "Assert가 정말 검증하는가"가 중요하다. 다음 장 V-2-2에서 CI 자동 실행으로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['xUnit', 'Fact', 'Theory', 'InlineData', 'Assert', 'AAA', 'Moq', '모킹', 'IDisposable', 'IClassFixture', 'dotnet-test', 'TDD', '커버리지'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
