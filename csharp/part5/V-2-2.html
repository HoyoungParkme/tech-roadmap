  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C# V-2-2 — 종합: REST API 미니 서비스
    학습 목표: 앞서 배운 조각(최소 API·DI·record·async·json·테스트)을 하나로 합쳐
              Todo CRUD REST 서비스를 완성한다. CRUD 요청이 엔드포인트→서비스(DI)→저장소를
              거쳐 처리·응답되는 흐름을 단계별로 추적하고, 각 단계가 어떤 챕터 개념을 합치는지 잇는다.
    패턴: fastapi v1 — 좌(LiveDataPane: 요청→엔드포인트→서비스(DI)→저장소 흐름 + 챕터 개념 배지)
                       우(VSCode CodeViewer: Program.cs / TodoService.cs / xUnit 테스트, 언어 csharp)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 종합 실전: Todo CRUD REST API
    //   Step1 뼈대+record  → Step2 DI 배선 → Step3 GET/POST(async·Results·json)
    //   → Step4 PUT/DELETE+검증·에러 → Step5 단위 테스트 + 전체 지도
    //   각 STEP = { title, desc, stage, flow(요청 흐름 하이라이트), concepts(챕터 배지), code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      scaffold: {lang:"csharp", filename:"Program.cs — 앱 뼈대 & record 계약", lines:[
        "var builder = WebApplication.CreateBuilder(args);",
        "// (Step 2 에서 여기 서비스 등록)",
        "var app = builder.Build();",
        "",
        "// ── 데이터 계약: 전부 record (불변·자동 동등성) ──",
        "// 저장 모델 — 서버가 Id·Done 을 통제한다",
        "record Todo(int Id, string Title, bool Done);",
        "",
        "// 생성 요청 — 클라이언트는 Title 만 보낸다",
        "record CreateTodoDto(string Title);",
        "",
        "// 수정 요청 — Title·Done 만",
        "record UpdateTodoDto(string Title, bool Done);",
        "",
        "// (Step 3~4 에서 여기 CRUD 엔드포인트 매핑)",
        "app.Run();",
        "// => http://localhost:5000 에서 대기",
      ]},
      di: {lang:"csharp", filename:"Program.cs — DI 등록 / TodoService.cs", lines:[
        "// ── Program.cs : DI 컨테이너에 계층 등록 ──",
        "builder.Services.AddSingleton<ITodoRepository,",
        "                              InMemoryTodoRepository>();",
        "builder.Services.AddScoped<TodoService>();",
        "",
        "// ── TodoService.cs : 로직 계층 ──",
        "// 저장소를 \"인터페이스\"로 주입받는다 (생성자 주입)",
        "class TodoService(ITodoRepository repo)",
        "{",
        "    public Task<List<Todo>> ListAsync() => repo.GetAllAsync();",
        "    public Task<Todo?> GetAsync(int id) => repo.FindAsync(id);",
        "    public Task<Todo> AddAsync(CreateTodoDto dto)",
        "        => repo.InsertAsync(new Todo(0, dto.Title, false));",
        "}",
        "",
        "// ── 저장소 계약 — 나중에 EF Core 로 교체 가능 ──",
        "interface ITodoRepository",
        "{",
        "    Task<List<Todo>> GetAllAsync();",
        "    Task<Todo?> FindAsync(int id);",
        "    Task<Todo> InsertAsync(Todo todo);",
        "}",
      ]},
      readwrite: {lang:"csharp", filename:"Program.cs — GET / POST 엔드포인트", lines:[
        "var todos = app.MapGroup(\"/todos\");",
        "",
        "// GET /todos — 전체 목록 (200 OK)",
        "todos.MapGet(\"/\", async (TodoService svc) =>",
        "    Results.Ok(await svc.ListAsync()));",
        "",
        "// GET /todos/{id} — 하나 조회 (200 or 404)",
        "todos.MapGet(\"/{id:int}\", async (int id, TodoService svc) =>",
        "{",
        "    var todo = await svc.GetAsync(id);",
        "    return todo is null ? Results.NotFound()",
        "                        : Results.Ok(todo);",
        "});",
        "",
        "// POST /todos — 생성 (201 Created + Location)",
        "todos.MapPost(\"/\", async (CreateTodoDto dto,",
        "                          TodoService svc) =>",
        "{",
        "    var created = await svc.AddAsync(dto);",
        "    return Results.Created($\"/todos/{created.Id}\", created);",
        "});",
        "// => 201  Location: /todos/1",
        "// =>      { \"id\":1, \"title\":\"우유 사기\", \"done\":false }",
      ]},
      update: {lang:"csharp", filename:"Program.cs — PUT / DELETE + 검증", lines:[
        "// PUT /todos/{id} — 검증 후 갱신 (400/404/200)",
        "todos.MapPut(\"/{id:int}\", async (int id,",
        "        UpdateTodoDto dto, TodoService svc) =>",
        "{",

    const S1 = { title:"Step 1. 뼈대 — 최소 API + record DTO/모델", desc:"REST 서비스의 첫 벽돌은 \"최소 API\"와 \"record\"다. 최소 API는 컨트롤러 클래스 없이 Program.cs 몇 줄로 라우트를 등록하는 방식이라, 미니 서비스에서는 이보다 가벼운 출발점이 없다. 도메인 모델과 요청/응답 DTO는 record로 만든다 — record는 불변이라 값이 중간에 바뀌지 않고, 생성자·동등성·ToString이 자동이라 보일러플레이트가 사라진다. 생성 요청(CreateTodoDto)과 저장 모델(Todo)을 굳이 나누는 이유는, 클라이언트가 Id·완료여부까지 마음대로 보내는 것을 막고 서버가 그 값을 통제하기 위해서다. 이 한 조각이 뒤 단계의 엔드포인트·저장소가 주고받을 \"데이터 계약\"을 확정한다." };
    const S2 = { title:"Step 2. DI — 엔드포인트→서비스→저장소 배선", desc:"엔드포인트에 비즈니스 로직과 데이터 접근을 다 때려넣으면 테스트도 못 하고 재사용도 안 된다. 그래서 로직은 TodoService, 데이터 보관은 ITodoRepository로 나누고, 이 둘을 DI 컨테이너에 등록해 필요한 곳에 자동 주입한다. 여기서 수명(lifetime) 선택이 실무 함정이다 — 인메모리 저장소는 앱 전체가 한 인스턴스를 공유해야 데이터가 유지되므로 Singleton, 요청마다 상태가 없어야 하는 서비스는 보통 Scoped로 둔다. 인터페이스(ITodoRepository)에 의존하게 만드는 진짜 이유는 나중에 EF Core DB 저장소로 갈아끼울 때 엔드포인트·서비스 코드를 한 줄도 안 고치기 위해서다. 이 배선이 CRUD 요청이 흐를 \"길\"을 만든다." };
    const S3 = { title:"Step 3. 읽기·생성 — GET/POST · async · Results · json", desc:"이제 실제 요청을 받는다. GET /todos, POST /todos를 최소 API로 매핑하고, 핸들러는 async로 만들어 저장소의 비동기 호출을 await한다 — DB나 파일 I/O가 붙을 미래를 대비해 처음부터 async로 두는 게 정석이다. 반환은 Results 헬퍼로 상태코드를 명시한다: 목록 조회는 Results.Ok(200), 생성 성공은 Results.Created(201)에 새 리소스 위치(Location)까지 담는다 — 이게 REST가 요구하는 \"생성됐고 여기 있다\"는 신호다. 요청 본문 CreateTodoDto와 응답 Todo의 JSON 직렬화/역직렬화는 ASP.NET Core가 System.Text.Json으로 자동 처리하므로, record 프로퍼티가 그대로 JSON 키가 된다. 계약(record)·배선(DI)·async·상태코드·json이 여기서 한꺼번에 맞물린다." };
    const S4 = { title:"Step 4. 수정·삭제 + 검증 · 에러 · 상태코드", desc:"CRUD의 U와 D를 채우고, 여기서 처음으로 \"잘못된 입력\"과 \"없는 리소스\"를 정면으로 다룬다. 검증부터: 빈 제목처럼 규칙을 어긴 요청은 저장소까지 내려보내기 전에 Results.ValidationProblem(400)으로 즉시 막는다 — 이렇게 하면 오류 응답도 표준 problem+json 형식으로 일관된다. PUT /todos/{id}는 대상이 있으면 갱신(200), 없으면 404를 돌려주고, DELETE는 성공 시 본문 없는 204 No Content가 정석이다. 200·201·204·400·404를 상황에 맞게 골라 쓰는 것이 REST 서비스의 품질을 가른다 — 전부 200으로 뭉개면 클라이언트가 성공/실패를 구분할 수 없다. 검증·에러 처리가 앞의 async·Results·json 위에 얹히며 서비스가 견고해진다." };
    const S5 = { title:"Step 5. 검증 — 단위 테스트 + 전체 지도", desc:"마지막 조각은 테스트다. DI로 계층을 나눠 둔 덕분에 서비스를 웹 서버 없이 그대로 새로 만들고, 저장소만 인메모리 구현으로 주입해 로직을 직접 검증할 수 있다 — 이것이 처음부터 인터페이스에 의존시킨 보상이다. xUnit으로 \"생성하면 Id가 붙는다\", \"없는 id 수정은 null\" 같은 규칙을 못박아 두면, 나중에 저장소를 EF Core로 바꿔도 같은 테스트가 계약을 지켜준다. 통합 흐름을 통째로 확인하고 싶으면 WebApplicationFactory로 실제 HTTP 요청을 쏴 상태코드까지 검사하는 방법도 있다. 이렇게 최소 API(라우팅)·record(계약)·DI(배선)·async(비동기)·json(직렬화)·테스트(검증)가 하나의 CRUD 서비스로 합쳐졌다. 이 뼈대에 인증·DB·페이징을 얹으면 그대로 실무 서비스가 된다 — 이 장으로 C# 여정을 마친다." };

    function ConceptBadges({ concepts }) {

            <span
              key={i}

          ))}

      );
    }

    // ─────────────────────────────────────────────────────
    // CRUD 요청 흐름 다이어그램 — 요청→엔드포인트→(검증)→서비스(DI)→저장소→응답
    //   flow.active 에 든 노드만 강조. 단계마다 다른 요청/응답 라벨.
    // ─────────────────────────────────────────────────────
    function FlowDiagram({ flow }) {
      const NODES = [
        { id: 'endpoint', icon: '🌐', label: '엔드포인트', sub: '최소 API' },
        { id: 'guard', icon: '🛡', label: '검증', sub: 'Validation' },
        { id: 'service', icon: '⚙️', label: '서비스', sub: 'DI 주입' },
        { id: 'repo', icon: '🗄', label: '저장소', sub: '인메모리/EF' },
      ];
      const active = new Set(flow.active || []);
      // guard 노드는 Step4에서만 사슬에 낀다
      const chain = NODES.filter((n) => n.id !== 'guard' || active.has('guard'));
      const reqOn = active.has('req');
      const resOn = active.has('res');
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2">🔄 요청 흐름 — 엔드포인트 → 서비스(DI) → 저장소</div>
          <div className="flex items-center gap-1 flex-wrap justify-center">
            {/* 요청 */}
            <div className={`text-[10px] rounded px-2 py-1.5 border font-bold text-center min-w-[62px] ${
              reqOn ? 'bg-sky-100 border-sky-400 text-sky-900' : 'bg-slate-50 border-slate-200 text-slate-400'
            }`}>
              <div>📨 요청</div>
              <div className="text-[9px] font-mono font-normal">{flow.reqLabel || '—'}</div>
            </div>
            <span className={reqOn ? 'text-violet-500 text-xs' : 'text-slate-300 text-xs'}>→</span>
            {/* 처리 사슬 */}
            {chain.map((n, i) => {
              const on = active.has(n.id);
              const dim = flow.dim && on;
              return (
                <React.Fragment key={n.id}>
                  {i > 0 && <span className={on ? 'text-violet-500 text-xs' : 'text-slate-300 text-xs'}>→</span>}
                  <div className={`text-[10px] rounded px-2 py-1.5 border font-bold text-center min-w-[58px] ${
                    n.id === 'guard'
                      ? 'bg-amber-100 border-amber-400 text-amber-900'
                      : on
                        ? (dim ? 'bg-violet-50 border-violet-300 text-violet-800' : 'bg-violet-100 border-violet-400 text-violet-900')
                        : 'bg-slate-50 border-slate-200 text-slate-400'
                  }`}>
                    <div>{n.icon} {n.label}</div>
                    <div className="text-[9px] font-normal opacity-70">{n.sub}</div>
                  </div>
                </React.Fragment>
              );
            })}
            <span className={resOn ? 'text-emerald-500 text-xs' : 'text-slate-300 text-xs'}>→</span>
            {/* 응답 */}
            <div className={`text-[10px] rounded px-2 py-1.5 border font-bold text-center min-w-[62px] ${
              resOn ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-slate-50 border-slate-200 text-slate-400'
            }`}>
              <div>📤 응답</div>
              <div className="text-[9px] font-mono font-normal">{flow.resLabel || '—'}</div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-violet-700 bg-violet-50 border border-violet-200 rounded px-2 py-1">{flow.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — record 데이터 계약 표
    // ─────────────────────────────────────────────────────
    function RecordsView({ records }) {
      const TONE = {
        model: 'bg-violet-50 border-violet-300 text-violet-900',
        in: 'bg-indigo-50 border-indigo-300 text-indigo-900',
      };
      return (
        <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
          <div className="text-[11px] font-bold text-fuchsia-800 mb-2">📦 {records.title}</div>
          <div className="space-y-1.5">
            {records.rows.map((r, i) => (
              <div key={i} className={`rounded border px-2 py-1.5 ${TONE[r.tone]}`}>
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-mono font-bold">record {r.name}</span>
                  <span className="text-[9px] font-bold rounded-full px-2 py-0.5 bg-white/60 border border-current">{r.kind}</span>
                </div>
                <div className="text-[10px] font-mono opacity-80 mt-0.5">{r.fields}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-emerald-800 bg-emerald-50 border border-emerald-200 rounded px-2 py-1">✅ {records.why}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — DI 등록 표 (수명)
    // ─────────────────────────────────────────────────────
    function DiView({ di }) {
      const TONE = {
        singleton: 'text-fuchsia-700',
        scoped: 'text-indigo-700',
      };
      return (
        <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
          <div className="text-[11px] font-bold text-fuchsia-800 mb-2">🔌 {di.title}</div>
          <div className="space-y-1.5">
            {di.rows.map((r, i) => (
              <div key={i} className="rounded border border-violet-200 bg-violet-50 px-2 py-1.5">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-[10px] font-mono font-bold text-violet-900">{r.svc}</span>
                  <span className={`text-[9px] font-bold rounded-full px-2 py-0.5 bg-white border border-current shrink-0 ${TONE[r.tone]}`}>{r.life}</span>
                </div>
                <div className="text-[10px] text-slate-600 mt-0.5">{r.why}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-emerald-800 bg-emerald-50 border border-emerald-200 rounded px-2 py-1">♻️ {di.swap}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3·4 — HTTP 메서드 / 상태코드 표
    // ─────────────────────────────────────────────────────
    function StatusView({ statuses }) {
      const TONE = {
        ok: 'bg-emerald-50 border-emerald-300 text-emerald-800',
        created: 'bg-violet-50 border-violet-300 text-violet-800',
        bad: 'bg-red-50 border-red-300 text-red-800',
      };
      return (
        <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
          <div className="text-[11px] font-bold text-fuchsia-800 mb-2">📊 HTTP 메서드 → 상태코드 계약</div>
          <div className="space-y-1.5">
            {statuses.map((s, i) => (
              <div key={i} className={`rounded border px-2 py-1.5 ${TONE[s.tone]}`}>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-mono font-bold rounded bg-white/70 border border-current px-1.5 py-0.5 w-16 text-center shrink-0">{s.verb}</span>
                  <span className="text-[10px] font-mono text-slate-700">{s.path}</span>
                  <span className="ml-auto text-[10px] font-bold shrink-0">{s.code}</span>
                </div>
                <div className="text-[9px] font-mono text-slate-600 mt-1 pl-[70px]">↳ {s.body}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 종합 요약 표
    // ─────────────────────────────────────────────────────
    function SummaryView({ summary }) {
      return (
        <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
          <div className="text-[11px] font-bold text-emerald-800 mb-2">🎯 {summary.title}</div>
          <table className="w-full text-[10px]">
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-t border-emerald-100">
                  <td className="py-1 pr-2 font-mono font-bold text-[#3a1f9e] whitespace-nowrap align-top">{r.k}</td>
                  <td className="py-1 text-slate-700">{r.v}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 text-[10px] text-emerald-900 bg-emerald-50 border border-emerald-200 rounded px-2 py-1 font-bold">🚀 {summary.next}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 챕터 배지 + 요청 흐름 + stage별 상세 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      scaffold: { icon: '📄', label: '뼈대·record' },
      di:       { icon: '🔌', label: 'DI 배선' },
      read:     { icon: '📥', label: 'GET·POST' },
      update:   { icon: '✏️', label: 'PUT·DELETE' },
      test:     { icon: '🧪', label: '테스트·종합' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.scaffold;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>REST 서비스 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>

          {/* 이 STEP이 합치는 챕터 개념 배지 */}
          <ConceptBadges concepts={state.concepts} />

          {/* 요청 흐름 다이어그램 (전 단계 공통) */}
          <FlowDiagram flow={state.flow} />

          {/* stage별 상세 */}
          <div className="mt-2">
            {state.stage === 'scaffold' && <RecordsView records={state.records} />}
            {state.stage === 'di' && <DiView di={state.di} />}
            {state.stage === 'read' && <StatusView statuses={state.statuses} />}
            {state.stage === 'update' && <StatusView statuses={state.statuses} />}
            {state.stage === 'test' && <SummaryView summary={state.summary} />}
          </div>

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅴ. 현장 투입 · V-2-2</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">V-2-2. 종합: REST API 미니 서비스</h1>
                <p className="text-sm text-violet-800/80">앞서 배운 최소 API·DI·record·async·json·테스트를 합쳐 REST 서비스 완성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                REST 미니 서비스는 여섯 조각의 합이다. 최소 API로 라우트를 등록하고, record로 불변 데이터 계약(모델·DTO)을 못박고,
                DI로 엔드포인트→서비스→저장소를 인터페이스에 의존시켜 배선하고, 핸들러는 async로 I/O를 논블로킹 처리한다.
                응답은 Results로 200·201·204·400·404 상태코드를 정확히 골라 주고, 요청/응답 JSON은 System.Text.Json이 자동 직렬화한다.
                마지막으로 계층을 나눈 덕에 서비스를 웹 서버 없이 xUnit으로 단위 테스트해 계약을 고정한다.
                이 뼈대에 인증·EF Core DB·페이징을 얹으면 그대로 실무 서비스가 된다 — 이 장으로 C# 여정을 마친다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['REST', '최소API', 'CRUD', 'record', 'DI', 'async', 'Results', 'json', '상태코드', '검증', 'xUnit', '종합'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 (csharp 마지막 장 — 다음도 챕터 목록) */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록으로 (C# 완주) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
