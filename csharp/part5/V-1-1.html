  <!-- 필기노트 공통 스킨 (본문 폰트: Pretendard — 가독성 우선) / 강조색: C# .NET 보라 #512BD4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C# V-1-1 — ASP.NET Core 최소 API 맛보기
    학습 목표: 최소 API(Minimal API)로 몇 줄 만에 REST 엔드포인트를 만들고,
              HTTP 요청이 MapGet/MapPost 라우트에 매칭되어 핸들러가 실행되고
              응답(상태코드 + json)이 돌아오는 흐름을 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: HTTP 요청→라우트 매칭→바인딩→핸들러→응답 시뮬레이션) / 우(VSCode CodeViewer: Program.cs)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 최소 API 뼈대 → 라우팅/바인딩 → Results/상태코드 → JSON·검증·Swagger → 컨트롤러 대비·실무 사고
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(hello/routing/results/json/compare)에 따라 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      hello: {lang:"csharp", filename:"Program.cs — 최소 API 뼈대", lines:[
        "// .NET 8 최소 API — 파일 한 개가 곧 웹 서버",
        "var builder = WebApplication.CreateBuilder(args);",
        "var app = builder.Build();",
        "",
        "// 경로 \"/\" 로 GET 이 오면 이 람다가 실행된다",
        "app.MapGet(\"/\", () => \"Hello, World!\");",
        "// => 200 OK  \"Hello, World!\"",
        "",
        "// Kestrel 웹서버를 켜고 요청을 받기 시작",
        "app.Run();",
        "",
        "// 실행:",
        "//   $ dotnet run",
        "//   $ curl http://localhost:5000/",
        "//   Hello, World!",
      ]},
      routing: {lang:"csharp", filename:"Program.cs — 라우팅 & 바인딩", lines:[
        "var app = builder.Build();",
        "",
        "// {id} 는 경로에서, verbose 는 쿼리스트링에서 자동 바인딩",
        "app.MapGet(\"/users/{id}\", (int id, bool verbose) =>",
        "{",
        "    return new { id, verbose };",
        "});",
        "// GET /users/42?verbose=true",
        "// => 200 OK  { \"id\": 42, \"verbose\": true }",
        "",
        "// 복합 타입(record)은 요청 본문 json 으로 바인딩",
        "app.MapPost(\"/users\", (CreateUser dto) =>",
        "{",
        "    return Results.Ok(dto.Name);",
        "});",
        "",
        "// 출처가 애매하면 특성으로 못 박는다",
        "app.MapGet(\"/search\",",
        "    ([FromQuery] string q) => $\"검색: {q}\");",
        "",
        "app.Run();",
        "",
        "record CreateUser(string Name, string Email);",
      ]},
      results: {lang:"csharp", filename:"Program.cs — Results 로 상태코드 제어", lines:[
        "var products = new Dictionary<int, string>",
        "{ [1] = \"키보드\", [2] = \"마우스\" };",
        "",
        "// 있으면 200 + json, 없으면 404",
        "app.MapGet(\"/products/{id}\", (int id) =>",
        "    products.TryGetValue(id, out var name)",
        "        ? Results.Ok(new { id, name })   // 200",
        "        : Results.NotFound());           // 404",
        "// GET /products/999  => 404 Not Found",
        "",
        "// 생성 성공은 201 + Location 헤더",
        "app.MapPost(\"/products\", (CreateProduct dto) =>",
        "{",
        "    var id = products.Count + 1;",
        "    products[id] = dto.Name;",
        "    return Results.Created($\"/products/{id}\",",
        "                           new { id, dto.Name });",
        "});",
        "// => 201 Created  Location: /products/3",
        "",
        "record CreateProduct(string Name);",
      ]},
      json: {lang:"csharp", filename:"Program.cs — JSON·검증·Swagger", lines:[
        "using System.ComponentModel.DataAnnotations;",
        "",
        "// Swagger(OpenAPI) 자동 문서화 등록",
        "builder.Services.AddEndpointsApiExplorer();",
        "builder.Services.AddSwaggerGen();",
        "var app = builder.Build();",
        "app.UseSwagger();",
        "app.UseSwaggerUI();   // /swagger 에서 UI 제공",
        "",
        "// 본문 json → CreateUser 자동 역직렬화",
        "app.MapPost(\"/users\", (CreateUser dto) =>",
        "{",
        "    // ⚠ 검증은 자동이 아니다 — 직접 호출",
        "    var ctx = new ValidationContext(dto);",
        "    var errors = new List<ValidationResult>();",
        "    if (!Validator.TryValidateObject(",
        "            dto, ctx, errors, true))",
        "        return Results.BadRequest(errors);",

    const S1 = { title: "Step 1. 최소 API — 몇 줄로 도는 웹 서버", desc: "ASP.NET Core 최소 API(Minimal API)는 클래스·컨트롤러·복잡한 설정 없이 파일 한 개로 REST 서버를 띄운다. `WebApplication.CreateBuilder(args)`가 DI 컨테이너·로깅·설정을 담은 빌더를 만들고, `builder.Build()`가 실제 앱을 조립한다. 그 다음 `app.MapGet(\"/\", () => \"Hello\")`처럼 경로와 람다 핸들러를 짝지어 등록하고, `app.Run()`이 Kestrel 웹서버를 켜서 요청을 받기 시작한다. 왜 이렇게 짧아졌나? .NET 6부터 상용구(boilerplate)를 최대한 걷어내 \"요청 → 핸들러\" 라는 본질만 남겼기 때문이다. 프로토타입·마이크로서비스·작은 API에 특히 잘 맞는다." };
    const S2 = { title: "Step 2. 라우팅 & 매개변수 바인딩 — 값은 어디서 오나", desc: "핸들러가 값을 받는 출처는 세 곳이다: 경로(route), 쿼리스트링(query), 요청 본문(body·json). 최소 API는 매개변수 이름과 타입을 보고 자동으로 어디서 꺼낼지 정한다 — 경로 템플릿 `\"/users/{id}\"`에 `int id`가 있으면 경로에서, 원시 타입(int·string)이면 쿼리에서, 복합 객체(클래스·record)면 본문 json에서 바인딩한다. 여기서 실무 최대 함정이 바인딩 소스 혼동이다: 본문으로 받아야 할 객체를 경로에서 찾으려 하거나, 그 반대로 하면 값이 비거나 400이 난다. 애매하면 `[FromRoute] [FromQuery] [FromBody]`로 출처를 명시해 모호함을 없애라." };
    const S3 = { title: "Step 3. Results & 상태코드 — 성공/실패를 제대로 말하기", desc: "문자열이나 객체를 그냥 반환하면 200 OK가 되지만, 실무 REST API는 상황에 맞는 상태코드를 정확히 돌려줘야 한다. 그래서 `Results`(또는 타입 힌트가 붙는 `TypedResults`) 헬퍼를 쓴다: 조회 성공은 `Results.Ok(data)`(200), 없는 리소스는 `Results.NotFound()`(404), 생성 성공은 `Results.Created(uri, data)`(201 + Location 헤더), 잘못된 입력은 `Results.BadRequest()`(400)다. 왜 중요한가? 클라이언트·프록시·모니터링은 상태코드로 성공/실패를 판단한다 — 삭제 실패를 200으로 숨기면 프론트가 오작동하고, 없는 리소스에 200을 주면 캐시가 잘못 쌓인다. 상태코드 누락·오용이 두 번째로 흔한 실무 사고다." };
    const S4 = { title: "Step 4. JSON 직렬화 · 모델 검증 · Swagger", desc: "최소 API는 객체를 반환하면 자동으로 System.Text.Json으로 직렬화해 `application/json`으로 내보내고, 요청 본문 json도 자동으로 역직렬화해 매개변수에 담는다 — 우리가 손으로 파싱할 일이 없다. 입력값이 규칙(필수·길이·형식)을 지키는지 확인하는 모델 검증은 자동이 아니라는 점이 중요하다: DataAnnotations(`[Required]`, `[EmailAddress]`)를 붙여도 최소 API는 기본적으로 안 돌리므로, 핸들러에서 직접 `Validator.TryValidateObject`를 호출하거나 검증 필터/라이브러리를 붙여야 한다(검증 누락 = 흔한 보안·품질 구멍). 마지막으로 Swashbuckle을 추가하면 등록된 라우트를 훑어 OpenAPI 문서를 자동 생성하고 Swagger UI로 브라우저에서 바로 호출·테스트할 수 있다." };
    const S5 = { title: "Step 5. 컨트롤러와 대비 · DI · 실무 실패 사례", desc: "최소 API는 간결하지만 \"무조건 우월\"은 아니다. 컨트롤러(MVC) 방식은 클래스·특성·규약으로 구조를 강제해 엔드포인트가 수십 개로 커져도 폴더·필터·모델바인딩이 질서를 잡아준다 — 반대로 최소 API는 자유로운 만큼 커지면 Program.cs가 라우트 등록으로 뒤엉킨다. 그래서 대규모에 최소 API를 남용하면 구조 부족으로 유지보수가 무너진다(라우트를 확장 메서드로 파일 분리하는 것이 최소 대응책). DI는 양쪽 공통이다 — 핸들러 매개변수에 서비스 타입을 적으면 컨테이너가 자동 주입한다. 기억할 실무 사고 4가지: ①라우트 충돌(같은 경로+메서드 중복 등록) ②바인딩 소스 혼동 ③상태코드/에러 처리 누락 ④대규모에 최소 API 남용. 규모가 작고 빠르게 만들 땐 최소 API, 팀·규모·복잡한 규약이 필요하면 컨트롤러를 택하라." };

      { ...S5,

          changes: [{"mark":"new","text":"바인딩 혼동 · 상태코드 누락 사례 추가"},{"mark":"changed","text":"선택 기준 3줄로 정리"}],
        },

        di: "app.MapGet(\"/x\", (IClock clock) => clock.Now); // 매개변수 = 자동 DI 주입",
        fails: {"title":"최소 API 실무 사고 4선","rows":[{"case":"라우트 충돌","why":"같은 경로+메서드 중복 등록 → 요청이 엉뚱한 핸들러로","tone":"bad"},{"case":"바인딩 소스 혼동","why":"본문↔경로↔쿼리 착각 → 값 비거나 400","tone":"bad"},{"case":"상태코드/에러 누락","why":"실패를 200으로 숨김 → 프론트·캐시 오작동","tone":"bad"},{"case":"대규모에 남용","why":"구조 부족 → Program.cs 뒤엉킴 (확장 메서드로 분리)","tone":"mid"}]},

    // ─────────────────────────────────────────────────────
    // 공통 — HTTP 요청/응답 카드 (모든 stage 상단에 표시)
    // ─────────────────────────────────────────────────────
    const METHOD_TONE = {
      GET: 'bg-emerald-100 border-emerald-400 text-emerald-900',
      POST: 'bg-violet-100 border-violet-400 text-violet-900',
    };
    const RES_TONE = {
      ok: 'bg-emerald-50 border-emerald-300 text-emerald-900',
      err: 'bg-red-50 border-red-300 text-red-900',
    };

    function HttpExchange({ req, res }) {
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2">🌐 HTTP 요청 → 응답</div>
          <div className="flex items-stretch gap-2">
            <div className="flex-1 rounded border border-slate-300 bg-slate-50 p-2">
              <div className="flex items-center gap-1.5 mb-1">
                <span className={`text-[10px] font-mono font-bold rounded px-1.5 py-0.5 border ${METHOD_TONE[req.method] || METHOD_TONE.GET}`}>{req.method}</span>
                <span className="text-[10px] font-mono text-slate-700 break-all">{req.path}</span>
              </div>
              {req.body && (
                <pre className="text-[9px] leading-4 font-mono text-slate-600 bg-white rounded p-1 border border-slate-200 overflow-auto whitespace-pre-wrap">{req.body}</pre>
              )}
            </div>
            <div className="flex items-center text-violet-500 text-lg font-bold">→</div>
            <div className={`flex-1 rounded border p-2 ${RES_TONE[res.tone]}`}>
              <div className="flex items-center gap-1.5 mb-1">
                <span className="text-[10px] font-mono font-bold rounded px-1.5 py-0.5 border border-current">{res.code}</span>
                <span className="text-[9px] font-bold">응답</span>
              </div>
              <pre className="text-[9px] leading-4 font-mono bg-white/60 rounded p-1 overflow-auto whitespace-pre-wrap">{res.body}</pre>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 최소 API 뼈대 4줄
    // ─────────────────────────────────────────────────────
    function HelloView({ skeleton }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧱 최소 API 뼈대 — 위에서 아래로</div>
            <div className="space-y-1.5">
              {skeleton.map((s, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-violet-400 text-xs leading-3">▼</div>}
                  <div className="flex items-start gap-2 rounded border border-violet-200 bg-violet-50 px-2 py-1.5">
                    <span className="text-[10px] font-mono font-bold text-violet-900 w-40 shrink-0">{s.k}</span>
                    <span className="text-[10px] text-slate-600">{s.v}</span>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 매개변수 바인딩 3소스
    // ─────────────────────────────────────────────────────
    function RoutingView({ bindings }) {
      const TONE = {
        route: 'bg-emerald-50 border-emerald-300 text-emerald-900',
        query: 'bg-amber-50 border-amber-300 text-amber-900',
        body: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
      };
      const LABEL = { route: '경로 route', query: '쿼리 query', body: '본문 body(json)' };
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2">🧭 매개변수 바인딩 — 값의 출처 3곳</div>
          <div className="space-y-1.5">
            {bindings.map((b, i) => (
              <div key={i} className={`rounded border px-2 py-1.5 ${TONE[b.tone]}`}>
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-mono font-bold">{b.param}</span>
                  <span className="text-[9px] font-bold rounded-full px-2 py-0.5 border border-current">{LABEL[b.tone]}</span>
                </div>
                <div className="text-[9px] opacity-80 mt-0.5">← {b.from}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-600 bg-slate-50 border border-slate-200 rounded px-2 py-1">
            규칙: 원시 타입 → 쿼리 · 경로 템플릿에 있으면 → 경로 · 복합 객체 → 본문 json
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — Results ↔ 상태코드 표
    // ─────────────────────────────────────────────────────
    function ResultsView({ results }) {
      const TONE = {
        ok: 'bg-emerald-50 border-emerald-300 text-emerald-900',
        err: 'bg-red-50 border-red-300 text-red-900',
      };
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2">📮 Results 헬퍼 ↔ HTTP 상태코드</div>
          <div className="space-y-1.5">
            {results.map((r, i) => (
              <div key={i} className={`rounded border px-2 py-1.5 ${TONE[r.tone]}`}>
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-mono font-bold">{r.fn}</span>
                  <span className="text-[9px] font-mono font-bold rounded px-1.5 py-0.5 border border-current">{r.code}</span>
                </div>
                <div className="text-[9px] opacity-80 mt-0.5">{r.when}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — JSON·검증·Swagger 3기능
    // ─────────────────────────────────────────────────────
    function JsonView({ features }) {
      const TONE = {
        ok: 'bg-emerald-50 border-emerald-300',
        warn: 'bg-amber-50 border-amber-300',
      };
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2">📦 최소 API 가 대신 해주는 것 (과 아닌 것)</div>
          <div className="space-y-1.5">
            {features.map((f, i) => (
              <div key={i} className={`flex items-start gap-2 rounded border px-2 py-1.5 ${TONE[f.tone]}`}>
                <span className="text-base">{f.icon}</span>
                <div>
                  <div className="text-[11px] font-bold text-slate-800">{f.name}</div>
                  <div className="text-[10px] text-slate-600">{f.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 컨트롤러 대비 + DI + 실패 4선
    // ─────────────────────────────────────────────────────
    function CompareView({ compare, di, fails }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">⚖ 최소 API vs 컨트롤러</div>
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded border border-violet-300 bg-violet-50 p-2">
                <div className="text-[10px] font-bold text-violet-900 mb-1">🟣 Minimal API</div>
                <ul className="space-y-0.5">
                  {compare.minimal.map((c, i) => (
                    <li key={i} className="text-[9px] text-slate-700">• {c}</li>
                  ))}
                </ul>
              </div>
              <div className="rounded border border-indigo-300 bg-indigo-50 p-2">
                <div className="text-[10px] font-bold text-indigo-900 mb-1">🔷 Controller (MVC)</div>
                <ul className="space-y-0.5">
                  {compare.controller.map((c, i) => (
                    <li key={i} className="text-[9px] text-slate-700">• {c}</li>
                  ))}
                </ul>
              </div>
            </div>
            <div className="mt-2 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-[9px] font-mono text-emerald-900">💉 {di}</div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {fails.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {fails.rows.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 pr-2 font-bold whitespace-nowrap ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      hello:   { icon: '🚀', label: '최소 API 뼈대' },
      routing: { icon: '🧭', label: '라우팅·바인딩' },
      results: { icon: '📮', label: 'Results·상태코드' },
      json:    { icon: '📦', label: 'JSON·검증·Swagger' },
      compare: { icon: '🗺', label: '대비·실무 지도' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.hello;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>ASP.NET Core 최소 API — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          <div className="space-y-2">
            {state.req && <HttpExchange req={state.req} res={state.res} />}
            {state.stage === 'hello' && <HelloView skeleton={state.skeleton} />}
            {state.stage === 'routing' && <RoutingView bindings={state.bindings} />}
            {state.stage === 'results' && <ResultsView results={state.results} />}
            {state.stage === 'json' && <JsonView features={state.features} />}
            {state.stage === 'compare' && <CompareView compare={state.compare} di={state.di} fails={state.fails} />}
          </div>
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅴ. 현장 투입 · V-1-1</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">V-1-1. ASP.NET Core 최소 API 맛보기</h1>
                <p className="text-sm text-violet-800/80">최소 API로 몇 줄 만에 REST 엔드포인트를 만드는 ASP.NET Core</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                ASP.NET Core 최소 API는 `WebApplication.CreateBuilder` → `MapGet/MapPost` → `app.Run()`으로 몇 줄 만에 REST 서버를 띄운다.
                매개변수는 경로·쿼리·본문 json에서 자동 바인딩되고(소스 혼동 주의), `Results.Ok/NotFound/Created`로 상태코드를 정확히 말한다.
                JSON 직렬화·역직렬화는 자동이지만 모델 검증은 자동이 아니라 직접 호출해야 하며, Swashbuckle로 Swagger 문서를 자동 생성한다.
                간결함이 강점이지만 대규모엔 컨트롤러가 낫다 — 라우트 충돌·바인딩 혼동·상태코드 누락·대규모 남용이 4대 사고다.
                다음 장 V-1-2에서 미들웨어 파이프라인을 판다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['MinimalAPI', 'MapGet', 'MapPost', 'WebApplication', '라우팅', '모델바인딩', 'Results', '상태코드', 'JSON직렬화', '모델검증', 'Swagger', 'DI', '컨트롤러대비'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
