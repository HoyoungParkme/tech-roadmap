            { case: 'new 로 직접 생성', why: '컨테이너 우회 → 수명·교체 무력화, 주입 사슬 끊김', fix: '항상 컨테이너로 등록·주입', tone: 'bad' },
            { case: '서비스 로케이터', why: 'GetService<T>() 남발 → 의존이 다시 숨음', fix: '생성자 주입으로 명시', tone: 'mid' },
            { case: '순환 의존 A↔B', why: '컨테이너 조립 중 예외', fix: '중개 인터페이스로 끊기·설계 분리', tone: 'bad' },
          ],
          summary: 'DI 는 은탄환이 아니다 — 수명을 맞추고, 항상 주입으로 받고, 사슬을 끊지 마라.',
        },
        alert: { tone: 'warn', text: '가장 잦은 사고: Singleton 에 Scoped 주입(captive dependency)으로 DbContext 가 앱 내내 하나로 굳는 것. 개발 모드 ValidateScopes 가 예외로 잡아주니 켜두고, new·서비스 로케이터로 사슬을 끊지 마라.' },
        code: {
          lang: 'csharp',
          filename: 'Program.cs — 안티패턴과 교정',
          lines: [
            '// 🚨 1) captive dependency',
            '//   Singleton 이 Scoped(DbContext)를 물면 앱 내내 하나로 굳는다',
            'builder.Services.AddSingleton<CacheService>();  // Scoped Db 주입 시 위험',
            '//   → 개발 모드에서 컨테이너가 예외로 잡아준다:',
            '//   InvalidOperationException: Cannot consume scoped service',
            '',
            '// ✅ 스코프 검증을 켜서 조기에 잡는다',
            'builder.Host.UseDefaultServiceProvider(o =>',
            '{',
            '    o.ValidateScopes = true;',
            '    o.ValidateOnBuild = true;',
            '});',
            '',
            '// 🚨 2) DI 우회 — 등록해놓고 new 로 만들면 사슬이 끊긴다',
            'var svc = new OrderService(new SmtpEmailSender()); // ❌',
            '',
            '// 🚨 3) 서비스 로케이터 — 의존이 다시 숨는다',
            'var s = provider.GetService<IEmailSender>();       // ❌ 남발 금지',
            '',
            '// ✅ 항상 생성자로 받는다: OrderService(IEmailSender sender)',
          ],
          highlight: [1, 2, 3, 7, 8, 9, 10, 11, 14, 15, 17, 18],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 강결합 뷰 (직접 new 의 문제)
    // ─────────────────────────────────────────────────────
    function ProblemView({ problem }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">👤 클래스가 의존을 직접 만든다</div>
            <div className="flex items-center justify-center gap-2">
              <div className="text-[11px] rounded border-2 border-violet-400 bg-violet-50 px-3 py-2 font-bold text-violet-900 text-center">{problem.consumer}</div>
              <span className="text-red-500 text-lg font-bold">🔒→</span>
              <div className="text-[11px] rounded border-2 border-red-400 bg-red-50 px-3 py-2 font-mono font-bold text-red-800 text-center">{problem.dep}</div>

            <div className="mt-1 text-center text-[10px] text-red-700">콘크리트 타입에 못 박힘 (강결합)</div>

            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 강결합이 낳는 3가지 고통</div>
            <div className="space-y-1">
              {problem.reasons.map((r, i) => (
                <div key={i} className="text-[10px] rounded border px-2 py-1 flex gap-2 bg-white border-red-200">

                  <span className="text-slate-700">{r.v}</span>

            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 인터페이스 주입 뷰 (IoC)
    // ─────────────────────────────────────────────────────
    function InjectView({ inject }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">⚙️ 계약(인터페이스)에 의존 — 구현은 갈아끼움</div>
            <div className="flex flex-col items-center gap-1.5">
              <div className="text-[11px] rounded border-2 border-violet-400 bg-violet-100 px-3 py-1.5 font-mono font-bold text-violet-900">{inject.iface}</div>
              <span className="text-violet-400 text-sm">▲ 구현</span>
              <div className="flex gap-1.5 flex-wrap justify-center">
                {inject.impls.map((im, i) => (
                  <span key={i} className={`text-[10px] rounded border px-2 py-1 font-mono font-bold ${i === 2 ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900'}`}>{im}</span>
                ))}
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">🧩 생성자로 "받는다"</div>
            <div className="text-[11px] font-mono rounded bg-indigo-50 border border-indigo-200 px-2 py-1.5 text-indigo-900 text-center">{inject.consumer}</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">✅ 얻는 것</div>
            <div className="space-y-1">
              {inject.benefits.map((b, i) => (
                <div key={i} className="text-[10px] rounded border px-2 py-1 flex gap-2 bg-emerald-50 border-emerald-300">
                  <span className="font-bold w-20 shrink-0 text-emerald-800">{b.k}</span>
                  <span className="text-slate-700">{b.v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 세 수명(lifetime) 뷰
    // ─────────────────────────────────────────────────────
    function LifetimeView({ lifetime }) {
      const TONE = {
        tr: 'bg-sky-50 border-sky-300 text-sky-900',
        sc: 'bg-violet-50 border-violet-300 text-violet-900',
        si: 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🚀 세 가지 수명 — 인스턴스 공유 범위</div>
            <div className="space-y-1.5">
              {lifetime.rows.map((r, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${TONE[r.tone]}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-mono font-bold">{r.name}</span>
                    <span className="text-[9px] font-bold">{r.scope}</span>
                  </div>
                  <div className="text-[9px] opacity-80 mt-0.5">{r.when} · 쓰임: {r.use}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🔁 요청/앱 범위에서의 인스턴스</div>
            <div className="flex items-stretch gap-1.5 text-center">
              <div className="flex-1 rounded border border-sky-300 bg-sky-50 p-1.5">
                <div className="text-[10px] font-bold text-sky-800">요청마다 새로</div>
                <div className="text-[9px] text-sky-700 mt-0.5">🆕 🆕 🆕 Transient</div>
              </div>
              <div className="flex-1 rounded border border-violet-300 bg-violet-50 p-1.5">
                <div className="text-[10px] font-bold text-violet-800">요청당 1개</div>
                <div className="text-[9px] text-violet-700 mt-0.5">🔵 =1/req Scoped</div>
              </div>
              <div className="flex-1 rounded border border-fuchsia-300 bg-fuchsia-50 p-1.5">
                <div className="text-[10px] font-bold text-fuchsia-800">앱당 1개</div>
                <div className="text-[9px] text-fuchsia-700 mt-0.5">⭐ =1/app Singleton</div>
              </div>
            </div>
            <div className="mt-2 rounded bg-amber-100 border border-amber-300 px-2 py-1 text-[10px] text-amber-900">🧭 {lifetime.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 테스트 교체 & 옵션 패턴 뷰
    // ─────────────────────────────────────────────────────
    function TestView({ test }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧪 테스트에서 구현만 교체</div>
            <div className="flex items-center justify-center gap-2">
              <div className="text-[10px] rounded border-2 border-slate-300 bg-slate-50 px-2 py-1.5 font-mono font-bold text-slate-500 text-center line-through">{test.swap.real}</div>
              <span className="text-emerald-500 text-lg font-bold">⇒</span>
              <div className="text-[10px] rounded border-2 border-emerald-400 bg-emerald-50 px-2 py-1.5 font-mono font-bold text-emerald-800 text-center">{test.swap.fake}</div>
            </div>
            <div className="mt-1.5 text-center text-[10px] text-emerald-700">{test.swap.why}</div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">⚙️ 옵션 패턴 — 설정을 주입</div>
            <div className="space-y-1">
              {test.options.map((o, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-indigo-400 text-xs leading-none">▼</div>}
                  <div className="text-[10px] rounded border px-2 py-1 bg-indigo-50 border-indigo-200">
                    <span className="font-bold font-mono text-indigo-800">{o.k}</span>
                    <span className="text-slate-700"> — {o.v}</span>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 실패 사례 뷰
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfall }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 DI 를 써도 밟는 지뢰 4가지</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-red-900 border-b border-red-200">
                  <th className="text-left py-0.5">안티패턴</th>
                  <th className="text-left py-0.5 pl-2">왜 / 교정</th>
                </tr>
              </thead>
              <tbody>
                {pitfall.rows.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 font-mono font-bold ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 pl-2 text-slate-700">
                      <div>{r.why}</div>
                      <div className="text-emerald-800 mt-0.5">✅ {r.fix}</div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-[#512BD4] bg-white p-2.5 text-[11px] text-[#3a1f9e] font-bold">
            🧭 {pitfall.summary}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      problem:  { icon: '🔒', label: '강결합 문제' },
      inject:   { icon: '⚙️', label: '인터페이스 주입' },
      lifetime: { icon: '🚀', label: '세 수명' },
      test:     { icon: '🧪', label: '테스트·옵션' },
      pitfall:  { icon: '🗺', label: '실무 실패' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.problem;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>의존성 주입 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'problem' && <ProblemView problem={state.problem} />}
          {state.stage === 'inject' && <InjectView inject={state.inject} />}
          {state.stage === 'lifetime' && <LifetimeView lifetime={state.lifetime} />}
          {state.stage === 'test' && <TestView test={state.test} />}
          {state.stage === 'pitfall' && <PitfallView pitfall={state.pitfall} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅴ. 현장 투입 · V-1-2</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">V-1-2. 의존성 주입</h1>
                <p className="text-sm text-violet-800/80">DI 컨테이너로 의존성을 외부에서 주입해 결합도를 낮추고 테스트를 쉽게</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                의존을 직접 new 하면 콘크리트 타입에 못 박혀 교체·테스트가 막힌다(강결합).
                해법은 인터페이스에 의존하고 그 구현을 생성자로 "받는" 것 — 생성 책임이 밖으로 넘어가는 제어 역전(IoC)이며 SOLID 의 D 다.
                ASP.NET Core DI 는 Add(Scoped/Singleton/Transient)로 매핑을 등록하고, 수명은 "상태 공유 범위"로 고른다.
                느슨한 결합의 보상은 테스트에서 FakeSender 를 넣어 검증하고 설정을 IOptions 로 주입하는 것.
                단 DI 도 은탄환은 아니다 — captive dependency(Singleton↔Scoped), new 우회, 서비스 로케이터, 순환 의존을 피하라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['DI', 'IoC', '생성자주입', '인터페이스', 'Scoped', 'Singleton', 'Transient', '수명', 'IOptions', 'mock테스트', 'captive-dependency', '서비스로케이터', 'SOLID-D'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
