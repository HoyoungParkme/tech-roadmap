  <!-- 필기노트 공통 스킨 (본문 폰트: Pretendard — 가독성 우선) / 강조색: C# .NET 보라 #512BD4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C# I-1-1 — .NET 런타임 구조(CLR)
    학습 목표: C# 소스가 IL 바이트코드로 컴파일되고, CLR이 JIT로 기계어로 바꿔 실행하는
              "관리 런타임"의 구조(JIT·GC·타입 시스템·예외)를 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 소스→IL→JIT→기계어·CLR 내부 시뮬레이션) / 우(VSCode CodeViewer: Program.cs + dotnet 셸)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 소스 → IL → JIT/기계어 → 관리 런타임(GC·타입·예외) → 전체 지도
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(source/il/jit/runtime/pipeline)에 따라 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      src: {lang:"csharp", filename:"Program.cs — 관리 코드 (C# 소스)", lines:[
        "// .NET 6+ 최상위 문(top-level statements)",
        "// Main 메서드를 생략해도 컴파일러가 자동 생성한다.",
        "var name = \"World\";",
        "Console.WriteLine($\"Hello, {name}!\");",
        "// => Hello, World!",
        "",
        "// 위 두 줄을 컴파일러는 아래처럼 \"풀어서\" 감싼다:",
        "//",
        "//   internal class Program",
        "//   {",
        "//       static void Main(string[] args)",
        "//       {",
        "//           var name = \"World\";",
        "//           Console.WriteLine($\"Hello, {name}!\");",
        "//       }",
        "//   }",
        "//",
        "// 핵심: 이 코드는 CPU가 직접 못 읽는다.",
        "//   C# 소스 → (컴파일) → IL 바이트코드 → (CLR JIT) → 기계어",
        "//   이렇게 CLR의 \"관리\"를 받으며 도는 코드 = 관리 코드.",
      ]},
      il: {lang:"bash", filename:"terminal — dotnet CLI 로 빌드", lines:[
        "# 프로젝트 만들고 빌드하기",
        "$ dotnet new console -n HelloApp",
        "$ cd HelloApp",
        "$ dotnet build -c Release",
        "",
        "# 산출물: 어셈블리(.dll) — IL + 메타데이터가 든 한 덩어리",
        "  bin/Release/net8.0/HelloApp.dll",
        "",
        "# IL 을 직접 열어보기 (ildasm / ilspy)",
        "$ ilspycmd bin/Release/net8.0/HelloApp.dll",
        "  .method static void Main() cil managed {",
        "    ldstr      \"World\"",
        "    stloc.0",
        "    ldstr      \"Hello, {0}!\"",
        "    call       void Console::WriteLine(string)",
        "    ret",
        "  }",
        "",
        "# .csproj 안의 TFM(대상 런타임)이 실행 버전을 결정한다",
        "  <TargetFramework>net8.0</TargetFramework>",
      ]},
      jit: {lang:"bash", filename:"terminal — 실행과 JIT", lines:[
        "$ dotnet run",
        "  Hello, World!",
        "",
        "# 방금 무슨 일이 일어났나:",
        "#  1) CLR 이 HelloApp.dll 을 메모리에 로드",
        "#  2) 진입점 Main() 이 처음 호출됨",
        "#  3) JIT 가 Main 의 IL 을 \"이 CPU\"의 기계어로 번역",
        "#  4) 번역된 기계어를 캐시 → 다음 호출부터 재사용",
        "",
        "# 시작 속도가 중요하면 미리 컴파일(AOT):",
        "$ dotnet publish -c Release -r linux-x64 \\",
        "      -p:PublishAot=true",
        "  # IL→기계어를 빌드 시점에 끝내 둠 → JIT 워밍업 없음",
        "",
        "# 정리:",
        "#   IL(CPU 독립)  ── JIT ──▶  기계어(이 CPU 전용)",
        "#   느린 첫 호출 한 번 → 이후엔 네이티브에 가깝다.",
      ]},
      runtime: {lang:"csharp", filename:"Program.cs — 관리 런타임의 빛과 그림자", lines:[
        "using System;",
        "",
        "// ✅ GC 자동 회수 — free() 가 없다",
        "var buffer = new byte[1_000_000];   // 힙에 할당",
        "buffer = null;   // 참조 끊김 → 언젠가 GC 가 회수",
        "",
        "// ✅ 타입 안전 — 런타임이 막는다",
        "object o = \"text\";",

    const S1 = { title: "Step 1. C# 소스 — \"관리 코드\"의 출발점", desc: "우리가 쓰는 것은 사람이 읽는 C# 텍스트다. 이 코드는 CPU가 곧바로 실행하지 못한다 — CPU는 기계어(0/1)만 안다. 그래서 C#은 곧장 기계어가 되는 대신, 먼저 .NET이 정한 중간 형태로 번역될 준비를 한다. 이렇게 \"런타임(CLR)의 관리를 받으며 도는\" 코드를 관리 코드(managed code)라 부른다. .NET 6+부터는 최상위 문(top-level statements)으로 Main 메서드조차 생략하고 바로 문장을 쓸 수 있지만, 컴파일러가 내부적으로 Main을 만들어 감싸므로 진입점이 사라진 것은 아니다. Java에 익숙하다면 이 그림이 낯설지 않다 — C#의 CLR은 Java의 JVM과 거의 같은 자리에 있다." };
    const S2 = { title: "Step 2. 컴파일 — C#을 IL 바이트코드로", desc: "`dotnet build`를 실행하면 Roslyn(C# 컴파일러)이 소스를 IL(Intermediate Language, 중간언어)로 번역한다. IL은 특정 CPU에 묶이지 않은 스택 기반 바이트코드라, x64든 ARM이든 같은 IL 하나면 된다 — 이것이 .NET 크로스플랫폼의 뿌리다. 결과물은 어셈블리(.dll 또는 .exe) 한 덩어리로 묶이는데, 그 안에는 IL 명령뿐 아니라 메타데이터(타입·메서드·네임스페이스 정보)가 함께 들어간다. 이 메타데이터 덕분에 런타임이 타입을 검사하고 리플렉션이 동작한다. 여기서 실무 함정 하나: 어떤 런타임 버전을 겨냥하는지(TFM, 예: net8.0)가 .csproj에 박히므로, 팀원과 SDK 버전이 어긋나면 빌드/실행이 갈린다." };
    const S3 = { title: "Step 3. CLR 로드 & JIT — IL을 기계어로", desc: "IL은 아직 CPU가 못 읽는다. 프로그램을 실행하면 CLR(Common Language Runtime)이 어셈블리를 메모리에 로드하고, 메서드가 \"처음 호출되는 순간\" JIT(Just-In-Time) 컴파일러가 그 메서드의 IL을 지금 이 CPU의 기계어로 번역한다. 한 번 번역된 기계어는 캐시되어 다음 호출부터는 곧바로 재사용되므로, 초기 몇 번만 느리고 이후엔 네이티브에 가깝다(\"워밍업\"). 미리 전부 번역하지 않고 필요할 때만 하는 이유는, 실제로 실행되지 않는 코드까지 번역하는 낭비를 피하고 지금 CPU에 맞춰 최적화하기 위해서다. Java의 HotSpot JVM이 하는 일과 사실상 같다. (시작을 더 빠르게 하려면 AOT/ReadyToRun으로 미리 컴파일하는 선택지도 있다.)" };
    const S4 = { title: "Step 4. 관리 런타임 — GC · 타입 안전 · 예외", desc: "CLR이 \"관리 런타임\"인 이유는 실행만 시켜주는 게 아니라 메모리·타입·예외까지 대신 돌봐주기 때문이다. GC(가비지 컬렉터)가 더 이상 참조되지 않는 객체를 자동으로 회수하므로 C/C++처럼 일일이 free할 필요가 없다. 타입 시스템은 잘못된 타입 접근·경계를 넘는 배열 접근을 런타임이 막아 메모리 안전을 보장하고, 예외는 구조적 try/catch로 전파된다. 하지만 \"관리 코드니까 메모리 걱정 끝\"은 위험한 착각이다 — GC는 \"참조가 살아있는\" 객체는 절대 못 지운다. 대표 사고가 이벤트 핸들러(+=)를 구독만 하고 해제(-=)하지 않아, 구독자가 게시자에 붙들려 영영 수거되지 않는 관리 메모리 누수다. static 컬렉션에 계속 담기만 하는 경우도 같다." };
    const S5 = { title: "Step 5. 전체 파이프라인 — 한 장의 지도", desc: "여정 전체를 잇는다: C# 소스 →(Roslyn 컴파일)→ IL+메타데이터(어셈블리) →(CLR 로드)→ JIT →기계어→ 실행, 그리고 실행 내내 GC·타입 시스템·예외가 돌본다. 이 모든 것을 묶는 실무 도구가 dotnet CLI다 — `dotnet new/build/run/publish`로 프로젝트(.csproj)를 다루고, NuGet으로 외부 패키지를 당겨온다. 여기서 가장 흔한 두 사고를 기억하자. 첫째 TFM 불일치: .csproj의 net8.0을 8.0 SDK 없는 머신에서 돌리면 실행이 막힌다. 둘째 NuGet 버전 충돌: 서로 다른 패키지가 같은 라이브러리의 다른 버전을 요구하면 런타임에 MissingMethodException 등으로 터진다 — 해법은 중앙 버전 관리와 `dotnet list package --vulnerable/--outdated`로의 점검이다. 다음 장 I-1-2에서는 이 위에서 도는 C#의 타입 체계(값 타입 vs 참조 타입)를 파고든다." };

          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-1.5">📜 IL 바이트코드 (CPU 독립 · 스택 기반)</div>
            <pre className="text-[10px] leading-5 font-mono text-slate-700 bg-fuchsia-50 rounded p-2 border border-fuchsia-200 overflow-auto whitespace-pre">{ilSample.join('\n')}</pre>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">📦 {assembly.title}</div>
            <div className="space-y-1">
              {assembly.parts.map((p, i) => (
                <div key={i} className="text-[10px] font-mono rounded border px-2 py-1 flex gap-2 bg-emerald-50 border-emerald-300 text-emerald-900">
                  <span className="font-bold w-16 shrink-0">{p.k}</span>
                  <span className="text-slate-700">{p.v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — JIT: 메서드별 상태 + 흐름
    // ─────────────────────────────────────────────────────
    function JitView({ jit }) {
      const STATE = {
        jitted:  { chip: 'bg-emerald-50 border-emerald-300 text-emerald-900', tag: '✓ JIT 완료' },
        jitting: { chip: 'bg-amber-50 border-amber-300 text-amber-900', tag: '⟳ 번역 중' },
        cold:    { chip: 'bg-slate-50 border-slate-300 text-slate-500', tag: '· 미실행' },
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🚀 메서드별 JIT 상태 — "처음 호출될 때만" 번역</div>
            <div className="space-y-1.5">
              {jit.methods.map((m, i) => {
                const s = STATE[m.state];
                return (
                  <div key={i} className={`rounded border px-2 py-1.5 ${s.chip}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-mono font-bold">{m.name}</span>
                      <span className="text-[9px] font-bold">{s.tag}</span>
                    </div>
                    <div className="text-[9px] opacity-80 mt-0.5">{m.note}</div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">
            <div className="text-[11px] font-bold text-fuchsia-800 mb-2">🔁 JIT 흐름</div>
            <div className="flex flex-wrap items-center gap-1">
              {jit.flow.map((f, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-fuchsia-400 text-xs">→</span>}
                  <span className={`text-[10px] rounded px-2 py-1 border font-bold ${i === jit.flow.length - 1 ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-fuchsia-50 border-fuchsia-300 text-fuchsia-900'}`}>{f}</span>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — CLR 관리 서비스 + 누수 표
    // ─────────────────────────────────────────────────────
    function RuntimeView({ services, leak }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700', good: 'text-emerald-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧩 CLR 이 대신 돌보는 3가지</div>
            <div className="space-y-1.5">
              {services.map((s, i) => (
                <div key={i} className="flex items-start gap-2 rounded border border-violet-200 bg-violet-50 px-2 py-1.5">
                  <span className="text-base">{s.icon}</span>
                  <div>
                    <div className="text-[11px] font-bold text-violet-900">{s.name}</div>
                    <div className="text-[10px] text-slate-600">{s.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {leak.title}</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-red-900 border-b border-red-200">
                  <th className="text-left py-0.5">사고 유형</th>
                  <th className="text-left py-0.5 pl-2">왜 안 지워지나</th>
                </tr>
              </thead>
              <tbody>
                {leak.rows.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 font-mono font-bold ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 pl-2 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[10px] text-emerald-800 bg-emerald-50 border border-emerald-200 rounded px-2 py-1">✅ {leak.fix}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 전체 파이프라인 지도 + dotnet CLI + 실패 사례
    // ─────────────────────────────────────────────────────
    function PipelineView({ pipeline, tooling, fails }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-400 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🗺 .NET 실행 파이프라인</div>
            <div className="flex flex-wrap items-center gap-1">
              {pipeline.chain.map((c, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-violet-400 text-xs">→</span>}
                  <span className={`text-[10px] rounded px-2 py-1 border font-bold ${i === pipeline.chain.length - 1 ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-violet-50 border-violet-300 text-violet-900'}`}>{c}</span>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 flex items-center gap-1.5 flex-wrap">
              <span className="text-[10px] text-slate-500">실행 내내 관리:</span>
              {pipeline.services.map((s, i) => (
                <span key={i} className="text-[10px] rounded-full px-2 py-0.5 bg-fuchsia-100 border border-fuchsia-300 text-fuchsia-900 font-bold">{s}</span>
              ))}
            </div>
            <div className="mt-2 rounded bg-amber-100 border border-amber-300 px-2 py-1 text-[10px] text-amber-900">
              ☕ {pipeline.jvmNote}
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">🛠 {tooling.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {tooling.rows.map((r, i) => (
                  <tr key={i} className="border-t border-indigo-100">
                    <td className="py-1 pr-2 font-mono font-bold text-indigo-800 whitespace-nowrap align-top">{r.cmd}</td>
                    <td className="py-1 text-slate-700">{r.see}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {fails.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {fails.rows.map((r, i) => (
                  <tr key={i} className="border-t border-red-100 align-top">
                    <td className={`py-1 pr-2 font-bold whitespace-nowrap ${TONE[r.tone]}`}>{r.case}</td>
                    <td className="py-1 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      source:   { icon: '👤', label: 'C# 소스' },
      il:       { icon: '⚙️', label: '컴파일·IL' },
      jit:      { icon: '🚀', label: 'JIT·기계어' },
      runtime:  { icon: '🧠', label: '관리 런타임' },
      pipeline: { icon: '🗺', label: '파이프라인 지도' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.source;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>.NET 런타임 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'source' && <SourceView source={state.source} />}
          {state.stage === 'il' && <IlView pipeline2={state.pipeline2} ilSample={state.ilSample} assembly={state.assembly} />}
          {state.stage === 'jit' && <JitView jit={state.jit} />}
          {state.stage === 'runtime' && <RuntimeView services={state.services} leak={state.leak} />}
          {state.stage === 'pipeline' && <PipelineView pipeline={state.pipeline} tooling={state.tooling} fails={state.fails} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅰ. .NET과 기초 · I-1-1</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">I-1-1. .NET 런타임 구조(CLR)</h1>
                <p className="text-sm text-violet-800/80">C# 소스→IL→CLR JIT 실행, 관리 런타임(GC·타입 안전)의 구조</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                C# 소스는 CPU가 못 읽는다. Roslyn이 CPU 독립적인 IL 바이트코드로 컴파일해 어셈블리(.dll/메타데이터)로 묶고,
                실행 시 CLR이 로드해 JIT가 IL을 이 CPU의 기계어로 번역·캐시한다. 실행 내내 GC(자동 메모리)·타입 시스템·예외가 코드를 관리해
                "관리 런타임"이 된다 — 단, 참조가 살아있는 객체(이벤트 핸들러 미해제 등)는 GC도 못 지우니 누수는 여전히 가능하다.
                이 모든 흐름은 dotnet CLI + NuGet으로 다루며, 배포 사고 1순위는 TFM 불일치와 NuGet 버전 충돌이다.
                구조는 JVM과 판박이다. 다음 장 I-1-2에서 값 타입 vs 참조 타입을 판다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['CLR', 'IL', 'JIT', 'GC', '관리코드', '어셈블리', '메타데이터', 'dotnet-CLI', 'NuGet', 'TFM', 'AOT', 'JVM비교'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
