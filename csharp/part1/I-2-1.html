  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    C# I-2-1 — 제어문·메서드
    학습 목표: 조건·반복문(특히 switch문 vs switch식)과 메서드 정의·매개변수 수식어(ref/out/in/params)·
              오버로딩을 6단계로 추적한다. "문(statement)"과 "식(expression)"의 차이를 몸으로 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: switch식 패턴 분기·인자→매개변수 매핑·오버로딩 후보 선택 시뮬레이션)
                     / 우(VSCode CodeViewer: C# 코드 + 단계별 하이라이트)
    색상: C# .NET 보라 (#512BD4 / 라벤더 #e0d7f5 / 다크보라 #3a1f9e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 조건문 → 반복문 → 널/삼항 → 메서드 정의 → 매개변수 수식어 → 오버로딩
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 조건문 — switch "문" vs switch "식"',
        desc: 'if/else는 조건대로 "실행 흐름을 가른다". switch는 두 얼굴이 있다: 예전부터 있던 switch 문(statement)은 각 case에서 반드시 break를 붙여 흐름을 끊어야 하고 값을 돌려주지 않는다. C# 8부터의 switch 식(expression)은 `code switch { 패턴 => 값 }` 형태로 패턴에 맞는 값 하나를 반환한다 — break가 없고 `=>`로 바로 값을 준다. 실무 실패 1순위가 여기다: switch 문에서 break를 빠뜨리면(C#은 C/Java와 달리 자동 fall-through를 금지해 컴파일 에러로 잡아주지만) 무심코 goto case로 흐르게 짜다 버그를 만든다. 값을 계산해 대입하려는 상황이라면 switch 식이 훨씬 안전하다 — 모든 경우를 다루지 않으면 컴파일러가 경고하고, `_`(discard)로 기본값을 강제하기 때문이다.',
        actor: '🔀 if / else · switch 문 · switch 식(패턴)',
        stage: 'cond',
        stageLabel: '조건 분기 — 문 vs 식',
        switchExpr: {
          input: 404,
          fn: 'string Describe(int code) => code switch { … };',
          arms: [
            { pat: '200', ret: '"OK"', match: false },
            { pat: '404', ret: '"Not Found"', match: true },
            { pat: '>= 500', ret: '"Server Error"', match: false },
            { pat: '_', ret: '"Unknown"', match: false },
          ],
          result: '"Not Found"',
        },
        compare: [
          { k: 'switch 문', v: 'case 마다 break 필요 · 값 반환 X (흐름 제어)', tone: 'stmt' },
          { k: 'switch 식', v: '`패턴 => 값` · 하나의 값 반환 (표현식)', tone: 'expr' },
        ],
        alert: { tone: 'info', text: 'C#은 switch 문의 자동 fall-through를 금지한다 → break/return/goto 없이 다음 case로 못 넘어간다(컴파일 에러). "값을 골라 대입"하려면 switch 식을 써라 — 누락 case를 컴파일러가 잡아준다.' },
        code: {
          lang: 'csharp',
          filename: 'Control.cs — 조건문 세 가지',
          lines: [
            '// 1) if / else — 실행 흐름을 가른다',
            'if (code >= 500)      Log.Error(code);',
            'else if (code >= 400) Log.Warn(code);',
            'else                  Log.Info(code);',
            '',
            '// 2) switch 문 — case 마다 break 필수 (값 반환 X)',
            'switch (code)',
            '{',
            '    case 200:',
            '        Console.WriteLine("OK");',
            '        break;              // 빠뜨리면 컴파일 에러',
            '    case 404:',
            '        Console.WriteLine("Not Found");',
            '        break;',
            '    default:',
            '        Console.WriteLine("Unknown");',
            '        break;',
            '}',
            '',
            '// 3) switch 식 — 패턴 => 값, break 없음',
            'string Describe(int code) => code switch',
            '{',
            '    200      => "OK",',
            '    404      => "Not Found",',
            '    >= 500   => "Server Error",   // 관계 패턴',
            '    _        => "Unknown",        // 기본값(누락 방지)',
            '};',
            '// => Describe(404) 는 "Not Found"',
          ],
          highlight: [20, 21, 22, 23, 24, 25, 26, 27, 28],
        },
      },

    // ─────────────────────────────────────────────────────
    // Step 1 — 조건문: switch 식 패턴 분기 + 문 vs 식 비교
    // ─────────────────────────────────────────────────────
    function CondView({ switchExpr, compare }) {
      const CT = { stmt: 'bg-amber-50 border-amber-300 text-amber-900', expr: 'bg-emerald-50 border-emerald-300 text-emerald-900' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔀 switch 식 — 입력이 패턴을 타고 값으로</div>
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[10px] text-slate-500">입력</span>
              <span className="text-sm font-mono font-bold rounded bg-violet-100 border border-violet-300 text-violet-900 px-2 py-0.5">code = {switchExpr.input}</span>
            </div>
            <div className="text-[10px] font-mono text-slate-500 mb-1.5">{switchExpr.fn}</div>
            <div className="space-y-1">
              {switchExpr.arms.map((a, i) => (
                <div key={i} className={`flex items-center gap-2 text-[11px] font-mono rounded border px-2 py-1 ${a.match ? 'bg-emerald-100 border-emerald-400 text-emerald-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                  <span className="w-16 shrink-0">{a.pat}</span>
                  <span className="text-violet-400">=&gt;</span>
                  <span>{a.ret}</span>
                  {a.match && <span className="ml-auto text-[9px]">✓ 매칭</span>}
                </div>
              ))}
            </div>
            <div className="mt-2 flex items-center gap-2 text-[11px]">
              <span className="text-slate-500">반환</span>
              <span className="font-mono font-bold rounded bg-emerald-100 border border-emerald-400 text-emerald-900 px-2 py-0.5">{switchExpr.result}</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">⚖ 문(statement) vs 식(expression)</div>
            <div className="space-y-1.5">
              {compare.map((c, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1.5 ${CT[c.tone]}`}>

          </div>

    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 반복문: 4종 카드 + 순회 중 수정 트레이스
    // ─────────────────────────────────────────────────────
    function LoopView({ loops, trace }) {
      const TT = { ok: 'text-emerald-700', bad: 'text-red-700', err: 'text-red-800 font-bold', fix: 'text-emerald-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔁 네 가지 반복문 — 언제 도는가</div>
            <div className="grid grid-cols-2 gap-1.5">
              {loops.map((l, i) => (
                <div key={i} className="rounded border border-violet-200 bg-violet-50 px-2 py-1.5">
                  <div className="text-[11px] font-mono font-bold text-violet-900">{l.name}</div>
                  <div className="text-[9px] text-slate-600 mt-0.5">{l.when}</div>
                  <div className="text-[9px] mt-1 flex gap-1 flex-wrap">
                    <span className="rounded-full bg-white border border-violet-200 px-1.5 py-0.5 text-violet-700">{l.check}</span>
                    <span className="rounded-full bg-white border border-violet-200 px-1.5 py-0.5 text-violet-700">최소 {l.min}</span>

                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-900 mb-1.5">🚨 {trace.title}</div>

        </div>

    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 널/삼항 연산자: 카드 + 체인 평가
    // ─────────────────────────────────────────────────────
    function NullOpView({ ops, chain }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">

              {chain.rows.map((r, i) => (
                <div key={i} className={`flex items-center gap-2 text-[10px] font-mono rounded border px-2 py-1 ${r.fin ? 'bg-emerald-100 border-emerald-400 text-emerald-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-700'}`}>
                  <span className="w-24 shrink-0 font-bold">{r.expr}</span>
                  <span className="text-fuchsia-500 w-16 shrink-0">{r.val}</span>
                  <span className="opacity-80">{r.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 메서드 정의 해부 + 호출 방법
    // ─────────────────────────────────────────────────────
    function MethodView({ anatomy, calls }) {
      const PT = {
        mod: 'bg-slate-100 border-slate-300 text-slate-700',
        ret: 'bg-amber-100 border-amber-300 text-amber-900',
        name: 'bg-violet-100 border-violet-400 text-violet-900',
        req: 'bg-indigo-100 border-indigo-300 text-indigo-900',
        opt: 'bg-emerald-100 border-emerald-300 text-emerald-900',
      };
      const CT = { ok: 'bg-emerald-50 border-emerald-300 text-emerald-900' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧩 메서드 시그니처 해부</div>
            <div className="flex flex-wrap items-stretch gap-1 mb-2">
              {anatomy.parts.map((p, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 text-center ${PT[p.tone]}`}>
                  <div className="font-mono font-bold">{p.t}</div>
                  <div className="text-[8px] font-normal opacity-80 mt-0.5">{p.role}</div>

          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">📞 {calls.title}</div>
            <div className="space-y-1">
              {calls.rows.map((r, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 flex gap-2 items-center ${CT[r.tone]}`}>
                  <span className="font-mono font-bold w-44 shrink-0">{r.call}</span>
                  <span className="text-slate-700 opacity-90">{r.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 매개변수 수식어: 인자→매개변수 매핑 + 4수식어 표
    // ─────────────────────────────────────────────────────
    function ParamsView({ mappingCall, mods, mapRows }) {
      const MT = {
        val: 'bg-slate-100 border-slate-300 text-slate-700',
        ref: 'bg-violet-100 border-violet-300 text-violet-900',
        out: 'bg-emerald-100 border-emerald-300 text-emerald-900',
        in: 'bg-sky-100 border-sky-300 text-sky-900',
        params: 'bg-amber-100 border-amber-300 text-amber-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">📤 인자 → 매개변수 매핑</div>
            <div className="text-[10px] font-mono text-slate-500 mb-2 rounded bg-slate-50 border border-slate-200 px-2 py-1 overflow-auto whitespace-pre">{mappingCall}</div>
            <div className="space-y-1">
              {mapRows.map((r, i) => (
                <div key={i} className="flex items-center gap-1.5 text-[10px]">
                  <span className={`font-mono font-bold rounded border px-2 py-1 w-28 shrink-0 text-center ${MT[r.tone]}`}>{r.arg}</span>
                  <span className="text-violet-400">→</span>
                  <span className="font-mono rounded border border-slate-200 bg-white px-2 py-1 flex-1">{r.to}</span>

          <div className="rounded-lg border-2 border-fuchsia-300 bg-white p-3">

            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-fuchsia-900 border-b border-fuchsia-200">
                  <th className="text-left py-0.5">수식어</th>
                  <th className="text-left py-0.5">방향</th>
                  <th className="text-left py-0.5">초기화</th>

              <tbody>
                {mods.map((m, i) => (
                  <tr key={i} className="border-t border-fuchsia-100 align-top">

            <div className="mt-1.5 space-y-0.5">
              {mods.map((m, i) => (

          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 오버로딩 후보 선택 + 해석 표
    // ─────────────────────────────────────────────────────
    function OverloadView({ candidates, resolveCall, resolveWhy, resolveRows }) {
      const TT = { ok: 'text-emerald-700', mid: 'text-amber-700', bad: 'text-red-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🎯 호출 <span className="font-mono text-fuchsia-800">{resolveCall}</span> → 후보 선택</div>
            <div className="space-y-1">
              {candidates.map((c, i) => (
                <div key={i} className={`flex items-center gap-2 text-[11px] font-mono rounded border px-2 py-1 ${c.hit ? 'bg-emerald-100 border-emerald-400 text-emerald-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                  <span>{c.sig}</span>
                  {c.hit && <span className="ml-auto text-[9px]">✓ 선택 (most specific)</span>}

          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">📋 여러 호출의 해석 결과</div>
            <table className="w-full text-[10px]">
              <tbody>
                {resolveRows.map((r, i) => (
                  <tr key={i} className="border-t border-indigo-100 align-top">
                    <td className="py-1 pr-2 font-mono font-bold text-indigo-800 whitespace-nowrap">{r.call}</td>
                    <td className={`py-1 pr-2 font-mono font-bold whitespace-nowrap ${TT[r.tone]}`}>{r.pick}</td>
                    <td className="py-1 text-slate-600">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      cond:     { icon: '🔀', label: '조건문' },
      loop:     { icon: '🔁', label: '반복문' },
      nullop:   { icon: '❓', label: '널·삼항' },
      method:   { icon: '🧩', label: '메서드 정의' },
      params:   { icon: '📤', label: '매개변수 수식어' },
      overload: { icon: '🎯', label: '오버로딩' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.cond;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>제어문·메서드 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'cond' && <CondView switchExpr={state.switchExpr} compare={state.compare} />}
          {state.stage === 'loop' && <LoopView loops={state.loops} trace={state.trace} />}
          {state.stage === 'nullop' && <NullOpView ops={state.ops} chain={state.chain} />}
          {state.stage === 'method' && <MethodView anatomy={state.anatomy} calls={state.calls} />}
          {state.stage === 'params' && <ParamsView mappingCall={state.mappingCall} mods={state.mods} mapRows={state.mapRows} />}
          {state.stage === 'overload' && <OverloadView candidates={state.candidates} resolveCall={state.resolveCall} resolveWhy={state.resolveWhy} resolveRows={state.resolveRows} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-sm">C#</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-violet-100 text-[#3a1f9e] border border-violet-300 mb-1">Ⅰ. .NET과 기초 · I-2-1</div>
                <h1 className="text-2xl font-bold text-[#3a1f9e]">I-2-1. 제어문·메서드</h1>
                <p className="text-sm text-violet-800/80">조건·반복문과 메서드 정의·매개변수 수식어·오버로딩</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3a1f9e] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#3a1f9e] text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#3a1f9e] text-white' : 'bg-[#512BD4] text-white hover:bg-[#3a1f9e]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-[#3a1f9e] hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#512BD4] bg-white px-4 py-3 text-sm text-[#3a1f9e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                제어문은 "문(흐름 제어)"과 "식(값 반환)"으로 나뉜다 — switch 식은 패턴에 맞는 값 하나를 `=&gt;`로 돌려주고, 누락 case를 컴파일러가 잡아준다.
                반복문은 for/foreach/while/do-while이 "언제 도느냐"로 갈리고, foreach 순회 중 컬렉션 수정은 예외를 부른다.
                메서드는 "이름 + 매개변수 타입"이 시그니처라 반환형만 다른 오버로딩은 불가하고, ref/out/in/params가 인자 전달 방식을 바꾼다(out은 초기화 불필요·대입 필수, params는 남용 주의).
                오버로딩은 컴파일러가 "가장 구체적인" 후보를 고르되 변환 비용이 동률이면 CS0121 모호성 에러다.
                다음 장 I-2-2에서 클래스와 객체를 판다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['if-else', 'switch식', '패턴매칭', 'for', 'foreach', 'while', '삼항연산자', '널병합', '널조건', '메서드', '시그니처', 'ref', 'out', 'in', 'params', '기본값', '명명인자', '오버로딩', 'CS0121'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-[#3a1f9e] border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#3a1f9e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
