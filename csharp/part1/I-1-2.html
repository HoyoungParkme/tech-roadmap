    // ─────────────────────────────────────────────────────
    // 공통 조각 — 스택 슬롯 / 힙 객체 박스
    // ─────────────────────────────────────────────────────
    function StackSlot({ slot }) {
      const isRef = slot.kind === 'ref';
      return (
        <div className={`rounded border-2 px-2 py-1.5 ${isRef ? 'bg-sky-50 border-sky-300' : 'bg-violet-50 border-violet-300'}`}>
          <div className="flex items-center gap-2">
            <span className="text-[11px] font-mono font-bold text-slate-800 w-6">{slot.name}</span>
            {isRef ? (
              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-sky-100 border border-sky-300 text-sky-900">→ {slot.ref}</span>
            ) : (
              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-violet-100 border border-violet-300 text-violet-900">{slot.inline}</span>
            )}
          </div>
          <div className="text-[9px] text-slate-500 mt-0.5 ml-8">{slot.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 스택/힙 저장 위치
    // ─────────────────────────────────────────────────────
    function StoreView({ stack, heap }) {
      return (
        <div className="flex gap-2 items-stretch">
          <div className="flex-1 rounded-lg border-2 border-violet-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🧱 스택 (Stack) — 변수 자리</div>
            <div className="space-y-2">
              {stack.map((s, i) => <StackSlot key={i} slot={s} />)}
            </div>
          </div>
          <div className="flex items-center text-violet-400 text-xl font-bold">→</div>
          <div className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-2">🗄 힙 (Heap) — 객체</div>
            <div className="space-y-2">
              {heap.map((h, i) => (
                <div key={i} className="rounded border-2 border-sky-300 bg-sky-50 px-2 py-1.5">
                  <div className="text-[10px] font-mono font-bold text-sky-900">{h.id}</div>
                  <div className="text-[10px] font-mono text-sky-800">{h.title}</div>
                  <div className="text-[10px] font-mono text-slate-600 mt-0.5">{h.body}</div>
                </div>
              ))}
              <div className="text-[9px] text-slate-500">값 타입 p 는 힙에 없다 — 스택 안에 통째로 있다</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 대입: 값 복제 vs 참조 공유
    // ─────────────────────────────────────────────────────
    function AssignView({ assign }) {
      const Card = ({ d, good }) => (
        <div className={`rounded-lg border-2 p-2.5 ${good ? 'border-violet-300 bg-white' : 'border-red-300 bg-white'}`}>
          <div className={`text-[11px] font-bold mb-1.5 ${good ? 'text-violet-800' : 'text-red-700'}`}>{d.title}</div>
          <div className="space-y-1 text-[10px] font-mono">
            <div className="rounded bg-slate-50 border border-slate-200 px-2 py-1 text-slate-600">{d.before}</div>
            <div className="text-center text-slate-400">▼ {d.action}</div>
            <div className={`rounded px-2 py-1 border ${good ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-700'}`}>{d.aResult}</div>
            <div className="rounded bg-slate-50 border border-slate-200 px-2 py-1 text-slate-600">{d.bResult}</div>
          </div>
          <div className={`mt-1.5 text-[10px] font-bold ${good ? 'text-emerald-700' : 'text-red-600'}`}>{good ? '✓' : '✗'} {d.verdict}</div>
        </div>
      );
      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <Card d={assign.value} good={true} />
          <Card d={assign.reference} good={false} />
        </div>

    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 매개변수 전달 방식 표
    // ─────────────────────────────────────────────────────
    function ParamView({ params }) {
      return (

    // ─────────────────────────────────────────────────────
    // Step 4 — 박싱/언박싱
    // ─────────────────────────────────────────────────────
    function BoxingView({ boxing }) {
      return (
        <div className="space-y-2">
          <div className="flex items-center gap-2">

              <div className="text-[9px] text-sky-500 font-bold">{boxing.boxed.where}</div>
              <div className="text-[11px] font-mono font-bold text-sky-900 mt-1">{boxing.boxed.label}</div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-slate-200 bg-white p-2.5 space-y-1">
            {boxing.steps.map((s, i) => (
              <div key={i} className="flex items-start gap-2 text-[10px]">

                <span className="text-slate-600">— {s.d}</span>

          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 px-2.5 py-2 text-[10px] text-emerald-900 font-bold">
            ✓ {boxing.fix}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 동등성 표 + nullable/불변/record
    // ─────────────────────────────────────────────────────
    function EqualityView({ equality }) {
      const TONE = { bad: 'text-red-600', good: 'text-emerald-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-violet-800 mb-1.5">⚖ "같다"의 의미 — 참조 동등 vs 값 동등</div>
            <table className="w-full text-[10px]">
              <tbody>
                {equality.rows.map((r, i) => (
                  <tr key={i} className="border-t border-slate-100 align-top">
                    <td className="py-1 font-mono font-bold text-slate-700 whitespace-nowrap pr-2">{r.expr}</td>
                    <td className="py-1 pr-2 text-slate-500 whitespace-nowrap">{r.kind}</td>
                    <td className={`py-1 font-bold ${TONE[r.tone]}`}>{r.result}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
            {equality.extras.map((e, i) => (
              <div key={i} className="rounded-lg border-2 border-sky-200 bg-white p-2">
                <div className="text-[11px] font-bold text-sky-900 flex items-center gap-1"><span>{e.icon}</span>{e.title}</div>
                <div className="text-[9px] text-slate-600 mt-1">{e.desc}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (보라 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      store:    { icon: '🧭', label: '저장 위치' },
      assign:   { icon: '🔀', label: '대입 복사' },
      param:    { icon: '📨', label: '인자 전달' },
      boxing:   { icon: '📦', label: '박싱/언박싱' },
      equality: { icon: '⚖', label: '동등성·불변' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.store;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>값 vs 참조 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-3 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'store' && <StoreView stack={state.stack} heap={state.heap} />}
          {state.stage === 'assign' && <AssignView assign={state.assign} />}
          {state.stage === 'param' && <ParamView params={state.params} />}
          {state.stage === 'boxing' && <BoxingView boxing={state.boxing} />}
          {state.stage === 'equality' && <EqualityView equality={state.equality} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/20 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-purple-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#512BD4] text-white font-bold text-xs">Ⅰ. .NET과 기초</span>
              <div>
                <div className="text-[11px] font-mono font-bold text-[#3a1f9e]">I-1-2</div>
                <h1 className="text-2xl font-bold" style={{ color: '#3a1f9e' }}>타입 시스템 — 값 vs 참조</h1>
                <p className="text-sm" style={{ color: '#57534a' }}>struct(값 타입)와 class(참조 타입)의 메모리·복사·동등성 차이</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#3a1f9e' }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#512BD4]' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-violet-50 px-5 py-4 shadow" style={{ backgroundColor: '#3a1f9e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold text-white ${playing ? 'bg-violet-900' : 'bg-[#512BD4] hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm" style={{ color: '#3a1f9e' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                값 타입(struct·int·enum)은 값이 변수 자리에 그대로 들어가 대입·전달 시 통째로 복사된다. 참조 타입(class·string·배열)은 힙에 객체가 있고 변수엔 주소만 있어, 대입하면 같은 객체를 공유한다 —
                "복사했다"는 착각이 대표 버그다. 전달 방식은 ref(양방향)·out(TryParse)·in(큰 struct 읽기 전용)으로 뒤집을 수 있다. 값을 object로 다루면 박싱(힙 할당)이 일어나 루프에서 성능을 갉아먹으니 제네릭으로 없앤다.
                "같다"는 class 기본 == 가 참조 동등, 값 타입/string은 값 동등이며, 값 동등이 필요하면 record struct로 자동 생성하면 된다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['값타입', '참조타입', 'struct', 'class', '스택', '힙', '복사vs공유', 'ref', 'out', 'in', '박싱', '언박싱', '동등성', 'nullable', 'record struct', 'string불변'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 border border-violet-200" style={{ color: '#3a1f9e' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#3a1f9e' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
