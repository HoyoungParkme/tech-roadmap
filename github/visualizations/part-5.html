  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

                    {c.line > 0 && <span className="text-slate-400 font-normal"> · line {c.line}</span>}
                  </div>
                  {c.text}
                </div>
              ))}
            </div>
          )}

          {/* Checks + Merge bar */}
          <div className="border-t border-slate-200 px-4 py-2 bg-white">
            {pr.checks && pr.checks.length > 0 && (
              <div className="flex flex-wrap gap-2 mb-2">
                {pr.checks.map((c, i) => (
                  <span key={i} className={`text-[10px] px-2 py-0.5 rounded font-mono border
                    ${c.status === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-700' :
                      c.status === 'pending' ? 'bg-amber-50 border-amber-300 text-amber-700 pulse-ring' :
                      'bg-red-50 border-red-300 text-red-700'}`}>
                    {c.status === 'success' && '✓ '}
                    {c.status === 'pending' && '⏳ '}
                    {c.name}
                  </span>
                ))}
              </div>
            )}
            <button disabled={phase !== 'approved'} className={`w-full text-xs font-bold py-2 rounded transition-all
              ${phase === 'approved' ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow' :
                phase === 'merged'   ? 'bg-violet-600 text-white' :
                'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
              {phase === 'merged' ? '✓ Merged' :
               phase === 'approved' ? 'Merge pull request' :
               phase === 'pushed' ? 'Open a pull request first' :
               'Merge pull request (대기)'}
            </button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════
    // 우측 — VSCode 스타일 CodeViewer (5개 파일 탭)
    // ═══════════════════════════════════════════════
    function CodeViewer({ files, activeIdx, onSelect, stepHi, stepTab }) {
      const codeRef = useRef(null);
      // 강조는 스텝(=beat)이 든다. 추천 파일을 보고 있을 때만 그 강조를 쓴다.
      const baseFile = files[activeIdx];
      const file = React.useMemo(
        () => (stepHi && activeIdx === stepTab ? { ...baseFile, highlight: stepHi } : baseFile),
        [baseFile, stepHi, activeIdx, stepTab],
      );

      // hljs 는 숨은 pre 만 하이라이팅하고, 그 결과를 줄마다 입힌다
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = file.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [activeIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg flex flex-col h-full">
          {/* macOS dot + 파일 탭 */}
          <div className="bg-[#21252b] px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5 mr-2">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <div className="flex gap-1 overflow-x-auto">
              {files.map((f, i) => (
                <button key={i} onClick={() => onSelect(i)}
                  className={`text-[10px] px-2 py-1 rounded-t font-mono whitespace-nowrap transition-all
                    ${i === activeIdx
                      ? 'bg-[#282c34] text-slate-100 border-t border-x border-slate-600'
                      : 'bg-[#1c1f25] text-slate-500 hover:text-slate-300'}`}>
                  {f.name}
                </button>
              ))}
            </div>
          </div>

          {/* 코드 + 라인 번호 */}
          <div className="overflow-auto text-xs flex-1 min-h-[260px] max-h-[28rem]">
            <pre ref={codeRef} className={`hidden language-${file.lang}`}>{file.lines.join('\n')}</pre>
            <pre className="p-0 m-0">
              <code className={`text-slate-200 language-${file.lang} block`}>
{file.lines.map((line, i) => {
  const highlighted = file.highlight && file.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════
    // 메인 App
    // ═══════════════════════════════════════════════
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [activeFile, setActiveFile] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const playRef = useRef(null);

      const step = STEPS[stepIdx];
      const isEnd = stepIdx === STEPS.length - 1;

      // step 변경 시 자동 파일 탭 전환
      useEffect(() => {
        setActiveFile(STEPS[stepIdx].activeFile);
      }, [stepIdx]);

      const handleNext = () => {
        setStepIdx(prev => {
          if (prev < STEPS.length - 1) return prev + 1;
          setIsPlaying(false);
          return prev;
        });
      };
      const handleNextRef = useRef(handleNext);
      handleNextRef.current = handleNext;
      const handlePrev = () => {
        if (stepIdx > 0) { setStepIdx(prev => prev - 1); setIsPlaying(false); }
      };
      const handleFirst = () => { setStepIdx(0); setIsPlaying(false); };
      const togglePlay = () => {
        if (isEnd) setStepIdx(0);
        setIsPlaying(prev => !prev);
      };

      // 자동 재생 3000ms
      useEffect(() => {
        if (isPlaying) {
          playRef.current = setInterval(() => handleNextRef.current(), 3000);
        } else {
          clearInterval(playRef.current);
        }
        return () => clearInterval(playRef.current);
      }, [isPlaying]);

      // 키보드 ←/→
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') handleNext();
          else if (e.key === 'ArrowLeft') handlePrev();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [stepIdx]);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-4">
            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 bg-slate-700 text-white flex items-center justify-center rounded-full font-bold text-sm">V</div>
                  <div>
                    <h1 className="text-xl font-bold text-slate-800">Part V. Pull Request &amp; Code Review</h1>
                    <p className="text-xs text-slate-500">feature 브랜치 → PR 생성 → 리뷰 → 변경 반영 → Merge 까지 5 단계 시뮬레이션</p>
                  </div>
                </div>
                <a href="../index.html" className="text-xs text-slate-600 hover:underline font-medium">← 전체 목차</a>
              </div>
            </header>

            {/* 단계 인디케이터 */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-1 flex gap-1 overflow-x-auto">
              {STEPS.map((s, i) => (
                <button key={i} onClick={() => { setStepIdx(i); setIsPlaying(false); }}
                  aria-label={`Step ${i + 1} — ${s.label} 로 이동`}
                  className={`flex-1 min-w-[120px] px-2 py-2 rounded-lg text-xs font-medium transition-all
                    ${i === stepIdx
                      ? 'bg-slate-700 text-white shadow-sm'
                      : i < stepIdx
                        ? 'text-slate-700 bg-slate-100 hover:bg-slate-200'
                        : 'text-slate-500 hover:bg-slate-100'}`}>
                  <div className="font-bold">Step {i + 1}</div>
                  <div className={`mt-0.5 text-[10px] ${i === stepIdx ? 'text-slate-300' : 'text-slate-400'}`}>
                    {s.label}
                  </div>
                </button>
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="bg-slate-700 text-white p-4 rounded-xl shadow-sm border border-slate-800 min-h-[80px] flex flex-col justify-center">
              <h3 className="text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">
                {step.title}
              </h3>
              <p className="text-sm md:text-base font-medium leading-relaxed">{step.desc}</p>
            </div>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              {/* 좌 — GitHub PR UI mock */}
              <div className="min-h-[480px]">
                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">
                  GitHub Pull Request UI
                </div>
                <PrUiMock pr={step.pr} phase={step.pr.phase} beat={step.beat} />
              </div>

              {/* 우 — VSCode 코드 뷰어 (파일 5개 탭) */}
              <div className="min-h-[480px]">
                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">
                  파일 — feature-push.sh / create-pr.md / review.md / address-changes.sh / merge.md
                </div>
                <CodeViewer files={FILES} activeIdx={activeFile} stepHi={step.highlight} stepTab={step.activeFile} onSelect={setActiveFile} />
              </div>
            </div>

            {/* 컨트롤 */}
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-2">
                {/* 처음 */}
                <button aria-label="처음으로" onClick={handleFirst} disabled={stepIdx === 0}
                  className="p-2 rounded bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 transition">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
                  </svg>
                </button>
                {/* 이전 */}
                <button aria-label="이전 단계" onClick={handlePrev} disabled={stepIdx === 0}
                  className="p-2 rounded bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 transition">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polygon points="15 18 9 12 15 6 15 18"/>
                  </svg>
                </button>
                {/* 자동 재생 */}
                <button aria-label={isPlaying ? '정지' : '자동 실행'} onClick={togglePlay}
                  className="flex items-center px-4 py-2 rounded bg-slate-700 hover:bg-slate-800 text-white font-medium transition shadow-sm w-32 justify-center">
                  {isPlaying ? (
                    <><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="mr-2">
                      <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                    </svg>정지</>
                  ) : (
                    <><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="mr-2">
                      <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>자동 실행</>
                  )}
                </button>
                {/* 다음 */}
                <button aria-label="다음 단계" onClick={handleNext} disabled={isEnd}
                  className="p-2 rounded bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 transition">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polygon points="9 18 15 12 9 6 9 18"/>
                  </svg>
                </button>
              </div>
              <div className="flex items-center gap-3">
                <div className="text-sm font-medium text-slate-500 bg-slate-50 px-3 py-1 rounded-full border border-slate-100">
                  Step {stepIdx + 1} / {STEPS.length}
                </div>
                <div className="flex gap-1">
                  {STEPS.map((_, i) => (
                    <button key={i} onClick={() => { setStepIdx(i); setIsPlaying(false); }}
                      aria-label={`Step ${i + 1} 로 이동`}
                      className={`w-2.5 h-2.5 rounded-full transition-all
                        ${i === stepIdx ? 'bg-slate-700 scale-125' :
                          i < stepIdx ? 'bg-slate-400' : 'bg-slate-200'}`}/>
                  ))}
                </div>
              </div>
            </div>

            <footer className="text-center text-xs text-slate-400 py-2">
              Git &amp; GitHub 사다리형 학습 커리큘럼 — Part V · PR &amp; Code Review · 키보드 ← → 로 단계 이동
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>  <script src="sidebar.js"></script>
</body>
</html>
