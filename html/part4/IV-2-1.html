  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    HTML IV-2-1 — 웹 표준 · W3C validator
    학습 목표: "브라우저가 어떻게든 그려주니까 대충 써도 된다"는 착각을 깨고,
              WHATWG HTML Living Standard라는 표준이 왜 존재하는지,
              validator(validator.w3.org)가 어떤 오류/경고를 잡는지,
              브라우저의 관용적 교정(tag soup)이 왜 예측 불가를 만드는지,
              DOCTYPE·표준모드, 그리고 HTMLHint·CI 통합까지 5단계로 추적한다.
    패턴: v1 — 좌(LiveDataPane: 오류 스니펫→validator 판정→브라우저 DOM 교정→수정 후 초록 체크)
                / 우(VSCode CodeViewer: 오류 HTML / 수정 HTML / validator 메시지 / .htmlhintrc / CI)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   1) 웹 표준이란 무엇이고 왜 중요한가 (WHATWG Living Standard)
    //   2) validator가 잡는 대표 오류 5종 (오류 스니펫 → 판정)
    //   3) 브라우저의 오류 관용 — tag soup 자동 교정과 DOM 변형
    //   4) 파싱 에러 vs 접근성 경고, DOCTYPE / 표준모드 vs 쿼크모드
    //   5) 실무 통합 — HTMLHint 에디터 린트 + CI 검증 (빨강 X → 초록 체크)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 웹 표준이란 — 모두가 같은 규칙을 볼 때 웹이 동작한다',
        desc: 'HTML의 문법 규칙은 어느 한 회사가 정하는 게 아니라 WHATWG가 관리하는 "HTML Living Standard"라는 하나의 살아있는 표준 문서에 적혀 있다. 이 표준이 있기 때문에 크롬·사파리·파이어폭스가 같은 <table>을 같은 방식으로 해석하고, 같은 화면을 그린다 — 표준이 없으면 브라우저마다 다른 웹이 되어 "내 컴퓨터에선 되는데"가 일상이 된다. 유효한(valid) 마크업은 단순히 규칙을 지키는 자기만족이 아니라 세 가지 실무 가치로 직결된다: 스크린리더가 구조를 정확히 읽는 접근성, 검색엔진이 제목·본문 구조를 신뢰하는 SEO, 그리고 어느 브라우저에서든 동일하게 동작하는 크로스브라우저 안정성이다. 그래서 "브라우저가 알아서 그려주니까"가 아니라 "표준대로 쓰면 예측 가능하니까" 유효성을 챙긴다. 이 예측 가능성을 사람 대신 기계가 검사해주는 도구가 바로 validator다.',
        actor: '📜 WHATWG HTML Living Standard · 브라우저 3사가 함께 구현',
        stage: 'standard',
        stageLabel: '웹 표준과 유효성의 가치',
        pillars: [
          { icon: '♿', title: '접근성 (a11y)', text: '올바른 구조여야 스크린리더가 제목·목록·폼을 정확히 읽는다', tone: 'emerald' },
          { icon: '🔍', title: 'SEO', text: '검색엔진이 heading 구조·시맨틱을 신뢰하고 색인한다', tone: 'sky' },
          { icon: '🌐', title: '크로스브라우저', text: '표준을 지키면 어느 브라우저에서든 같은 DOM·같은 화면', tone: 'orange' },
        ],
        bodies: [
          { name: 'WHATWG', role: 'HTML Living Standard 관리 (Apple·Google·Mozilla·MS)' },
          { name: 'W3C', role: '접근성(WCAG)·CSS 등 표준화, validator 서비스 운영' },
          { name: '브라우저 엔진', role: 'Blink · WebKit · Gecko — 표준을 실제로 구현' },
        ],
        alert: { tone: 'info', text: '표준은 "정답지"다. validator(validator.w3.org)는 내 HTML을 이 정답지와 대조해 어긋난 곳을 짚어준다 — 사람이 눈으로 놓치는 오류를 기계가 잡는다.' },
        code: {
          lang: 'html',
          filename: 'valid.html — 표준을 지킨 최소 문서',
          lines: [
            '<!DOCTYPE html>',
            '<html lang="ko">',
            '  <head>',
            '    <meta charset="UTF-8" />',
            '    <title>주문 내역</title>',
            '  </head>',
            '  <body>',
            '    <h1>주문 내역</h1>',
            '',
            '    <!-- 시맨틱 구조: 스크린리더·검색엔진이 이해한다 -->',
            '    <main>',
            '      <ul>',
            '        <li>티셔츠 x 2</li>',
            '        <li>양말 x 3</li>',
            '      </ul>',
            '      <img src="thumb.png" alt="주문한 상품 미리보기" />',
            '    </main>',
            '  </body>',
            '</html>',
            '',
            '<!--',
            '  이 문서가 "valid" 한 이유:',
            '    · <!DOCTYPE html> 로 표준 모드 선언',
            '    · lang 속성으로 언어 명시 (접근성/SEO)',
            '    · 모든 태그가 올바르게 열리고 닫힘',
            '    · <ul> 직속 자식은 <li> 뿐',
            '    · <img> 에 alt 필수 속성 존재',
            '  → validator.w3.org 결과: 초록 체크 (0 errors)',
            '-->',
          ],
          highlight: [1, 2, 4, 11, 12, 13, 14, 16, 23, 24, 25, 26, 27],
        },

          ],
          highlight: [1, 5, 7, 9, 13, 16, 22, 23, 25, 26],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 표준 조직 + 유효성 3대 가치
    // ─────────────────────────────────────────────────────
    const PILLAR_TONE = {
      emerald: 'border-emerald-300 bg-emerald-50 text-emerald-900',
      sky: 'border-sky-300 bg-sky-50 text-sky-900',
      orange: 'border-orange-300 bg-orange-50 text-orange-900',
    };
    function StandardView({ pillars, bodies }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">📜 웹 표준을 만드는 곳 — 한 회사가 아니다</div>
            <div className="space-y-1.5">
              {bodies.map((b, i) => (
                <div key={i} className="flex items-start gap-2 text-[10px]">
                  <span className="rounded border border-orange-400 bg-orange-100 px-2 py-1 font-mono font-bold text-orange-900 w-24 text-center shrink-0">{b.name}</span>
                  <span className="text-slate-700 pt-1">{b.role}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="text-center text-orange-500 text-sm">▼ 유효한 마크업이 주는 실무 가치</div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
            {pillars.map((p, i) => (
              <div key={i} className={`rounded-lg border-2 p-2.5 ${PILLAR_TONE[p.tone]}`}>
                <div className="text-lg">{p.icon}</div>
                <div className="text-[11px] font-bold mt-0.5">{p.title}</div>
                <div className="text-[10px] mt-1 leading-snug opacity-90">{p.text}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — validator 오류 리포트 (줄 번호 배지)
    // ─────────────────────────────────────────────────────
    function ValidateView({ issues }) {
      const errCount = issues.filter((x) => x.kind === 'error').length;
      const warnCount = issues.filter((x) => x.kind === 'warn').length;
      return (
        <div className="rounded-lg border-2 border-red-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-[11px] font-bold text-red-800">🧪 validator.w3.org — 검사 결과</div>
            <div className="flex gap-1.5 text-[10px] font-bold">
              <span className="rounded-full bg-red-100 border border-red-300 text-red-800 px-2 py-0.5">✗ {errCount} errors</span>
              <span className="rounded-full bg-amber-100 border border-amber-300 text-amber-800 px-2 py-0.5">△ {warnCount} warnings</span>
            </div>
          </div>
          <div className="space-y-1.5">
            {issues.map((x, i) => {
              const isErr = x.kind === 'error';
              return (
                <div key={i} className={`rounded border px-2 py-1.5 flex items-start gap-2 ${isErr ? 'bg-red-50 border-red-200' : 'bg-amber-50 border-amber-200'}`}>
                  <span className={`shrink-0 text-[10px] font-bold ${isErr ? 'text-red-600' : 'text-amber-600'}`}>{isErr ? '✗' : '△'}</span>
                  <span className="shrink-0 text-[9px] font-mono rounded bg-slate-700 text-white px-1.5 py-0.5">L{x.line}</span>
                  <div className="min-w-0">
                    <div className={`text-[11px] font-bold ${isErr ? 'text-red-900' : 'text-amber-900'}`}>{x.title}</div>
                    <div className="text-[10px] text-slate-600 leading-snug">{x.detail}</div>
                    <div className="text-[9px] font-mono text-slate-400 mt-0.5">rule: {x.rule}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 브라우저 자동 교정: 작성 코드 vs 실제 DOM
    // ─────────────────────────────────────────────────────
    function BrowserFixupView({ fixups }) {
      return (
        <div className="space-y-3">
          {fixups.map((f, i) => (
            <div key={i} className="rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
              <div className="text-[11px] font-bold text-amber-900 mb-2">🔧 {f.title}</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                  <div className="text-[9px] font-bold text-slate-500 mb-1">작성한 HTML</div>
                  <pre className="text-[10px] leading-4 font-mono text-slate-700 bg-white rounded p-2 border border-slate-200 whitespace-pre overflow-auto">{f.written}</pre>
                </div>
                <div>
                  <div className="text-[9px] font-bold text-red-500 mb-1">실제 만들어진 DOM ⚠️</div>
                  <pre className="text-[10px] leading-4 font-mono text-red-800 bg-white rounded p-2 border border-red-200 whitespace-pre overflow-auto">{f.dom}</pre>
                </div>
              </div>
              <div className="mt-2 text-[10px] text-amber-900 bg-amber-100 border border-amber-200 rounded px-2 py-1">{f.note}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 오류 2축 분류 + 렌더링 모드
    // ─────────────────────────────────────────────────────
    function ModeView({ classify, modes }) {
      const AXIS = {
        red: 'border-red-300 bg-red-50',
        amber: 'border-amber-300 bg-amber-50',
      };
      const AXIS_TXT = { red: 'text-red-800', amber: 'text-amber-800' };
      return (
        <div className="space-y-3">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            {classify.map((c, i) => (
              <div key={i} className={`rounded-lg border-2 p-2.5 ${AXIS[c.color]}`}>
                <div className="flex items-center justify-between mb-1.5">
                  <span className={`text-[11px] font-bold ${AXIS_TXT[c.color]}`}>{c.axis}</span>
                  <span className={`text-[9px] font-mono font-bold rounded px-1.5 py-0.5 ${c.color === 'red' ? 'bg-red-600 text-white' : 'bg-amber-500 text-white'}`}>{c.level}</span>
                </div>
                <div className="flex flex-wrap gap-1 mb-1.5">
                  {c.items.map((it, j) => (
                    <span key={j} className="text-[9px] font-mono rounded bg-white border border-slate-200 text-slate-700 px-1.5 py-0.5">{it}</span>
                  ))}
                </div>
                <div className={`text-[10px] leading-snug ${AXIS_TXT[c.color]}`}>{c.impact}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🧭 DOCTYPE 한 줄이 렌더링 모드를 정한다</div>
            <div className="space-y-1.5">
              {modes.map((m, i) => {
                const good = m.tone === 'good';
                return (
                  <div key={i} className={`rounded border px-2 py-1.5 ${good ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                    <div className="flex items-center gap-2">
                      <span className={`text-[10px] font-bold ${good ? 'text-emerald-800' : 'text-red-800'}`}>{good ? '✓' : '✗'} {m.name}</span>
                      <span className="text-[9px] font-mono rounded bg-slate-700 text-white px-1.5 py-0.5">{m.trigger}</span>
                    </div>
                    <div className="text-[10px] text-slate-600 mt-0.5">{m.box}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 수정 전후 대비 + 검증 파이프라인 3층
    // ─────────────────────────────────────────────────────
    function CiView({ beforeAfter, layers }) {
      const { before, after } = beforeAfter;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🎯 수정 전 → 후: validator 판정이 바뀐다</div>
            <div className="flex items-center gap-2">
              <div className="flex-1 rounded border border-red-300 bg-red-50 p-2 text-center">
                <div className="text-[10px] font-mono text-slate-600">{before.label}</div>
                <div className="text-[11px] font-bold text-red-700 mt-1">{before.result}</div>
              </div>
              <div className="text-orange-500 text-xl font-bold shrink-0">→</div>
              <div className="flex-1 rounded border border-emerald-400 bg-emerald-50 p-2 text-center">
                <div className="text-[10px] font-mono text-slate-600">{after.label}</div>
                <div className="text-[11px] font-bold text-emerald-700 mt-1">{after.result}</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">🛡️ 검증 안전망 3층 — 겹겹이 쌓는다</div>
            <div className="space-y-1.5">
              {layers.map((l, i) => (
                <div key={i} className="flex items-start gap-2 rounded border border-emerald-200 bg-emerald-50 px-2 py-1.5">
                  <span className="text-base shrink-0">{l.icon}</span>
                  <div className="min-w-0">
                    <div className="text-[11px] font-bold text-emerald-900">{l.name} <span className="font-mono text-[9px] text-emerald-600">· {l.tool}</span></div>
                    <div className="text-[10px] text-slate-600 leading-snug">{l.text}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      standard: { icon: '📜', label: '웹 표준' },
      validate: { icon: '🧪', label: 'validator 판정' },
      browser:  { icon: '🔧', label: '브라우저 교정' },
      mode:     { icon: '🧭', label: '분류·모드' },
      ci:       { icon: '🛡️', label: '검증 자동화' },
    };
    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.standard;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>웹 표준 · validator — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'standard' && <StandardView pillars={state.pillars} bodies={state.bodies} />}
          {state.stage === 'validate' && <ValidateView issues={state.issues} />}
          {state.stage === 'browser' && <BrowserFixupView fixups={state.fixups} />}
          {state.stage === 'mode' && <ModeView classify={state.classify} modes={state.modes} />}
          {state.stage === 'ci' && <CiView beforeAfter={state.beforeAfter} layers={state.layers} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-sm">HTML</span>
              <div>
                <div className="text-[11px] font-bold text-orange-700 mb-0.5">Ⅳ. 실무 마크업 패턴 · IV-2-1</div>
                <h1 className="text-2xl font-bold text-orange-900">웹 표준 · W3C validator</h1>
                <p className="text-sm text-orange-800/80">유효한 마크업이 왜 중요한가 — 표준·브라우저 관용·validator로 오류 잡기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                HTML 문법은 WHATWG의 살아있는 표준이 정하고, 브라우저 3사가 그걸 함께 구현한다. 유효한 마크업은 접근성·SEO·크로스브라우저로 직결된다.
                validator는 닫지 않은 태그·잘못된 중첩·중복 id·필수 속성 누락·폐기 태그를 줄 번호로 잡아준다. 브라우저는 틀린 HTML도 관용적으로 교정하지만,
                그 결과가 작성한 코드와 달라 예측 불가를 만들기에 표준 준수가 가장 안전하다. 파싱 에러(DOM 파괴)를 먼저, 접근성 경고를 반드시 처리하고,
                문서 첫 줄엔 예외 없이 &lt;!DOCTYPE html&gt;을 둔다. 마지막으로 HTMLHint 에디터 린트와 CI로 검증을 자동화해 "안 지키면 머지가 막히게" 만든다.
                다음 장 IV-2-2에서는 이 검증된 마크업 위에 시맨틱 구조를 설계한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['웹표준', 'WHATWG', 'LivingStandard', 'W3Cvalidator', '유효성', '접근성', 'SEO', '크로스브라우저', 'tagsoup', 'DOCTYPE', '쿼크모드', 'HTMLHint', 'CI'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
