<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />

  <title>HTML 학습 — V-2-2. 종합 프로젝트 — 이력서 페이지</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌐</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    HTML V-2-2 — 종합 프로젝트: 이력서(포트폴리오) 페이지
    학습 목표: 앞서 배운 시맨틱 구조·접근성·SEO·성능·폼을 한 페이지에 모두 합쳐
              실전에 바로 올릴 수 있는 이력서 페이지를 5단계로 조립한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 이력서 섹션을 단계별로 시맨틱 조립 + 개선 배지 + 랜드마크 개요)
                       우(VSCode CodeViewer: resume.html — 시맨틱 + 메타 + 폼)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 시맨틱 골격 → 콘텐츠 → 접근성 → SEO/공유 → 성능·폼(완성)
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 이력서가 조립되는 과정을 서로 다른 뷰로 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      skeleton: {lang:"html", filename:"resume.html — 시맨틱 골격", lines:[
        "<!DOCTYPE html>",
        "<html lang=\"ko\">",
        "<head>",
        "  <meta charset=\"UTF-8\" />",
        "  <title>홍길동 — 프론트엔드 개발자</title>",
        "</head>",
        "<body>",
        "  <!-- banner: 페이지 대표 머리말 -->",
        "  <header>",
        "    <h1>홍길동</h1>",
        "    <p>프론트엔드 개발자</p>",
        "  </header>",
        "",
        "  <!-- navigation: 섹션 목차 -->",
        "  <nav aria-label=\"섹션 이동\">...</nav>",
        "",
        "  <!-- main: 페이지당 딱 하나 -->",
        "  <main>",
        "    <section id=\"about\">...</section>",
        "    <section id=\"experience\">...</section>",
        "    <section id=\"skills\">...</section>",
        "    <section id=\"projects\">...</section>",
        "  </main>",
        "",
        "  <!-- contentinfo: 꼬리말 -->",
        "  <footer>...</footer>",
        "</body>",
        "</html>",
      ]},
      content: {lang:"html", filename:"resume.html — 섹션 콘텐츠", lines:[
        "<main>",
        "  <section id=\"about\">",
        "    <h2>소개</h2>",
        "    <p>사용자 경험을 코드로 옮기는 프론트엔드",
        "       개발자입니다. 접근성과 성능을 중요하게",
        "       생각합니다.</p>",
        "  </section>",
        "",
        "  <section id=\"experience\">",
        "    <h2>경력</h2>",
        "    <article>",
        "      <h3>토스 — 프론트엔드</h3>",
        "      <p><time datetime=\"2022-03\">2022.03</time> ~ 현재</p>",
        "      <ul><li>결제 위젯 리뉴얼, LCP 40% 개선</li></ul>",
        "    </article>",
        "    <article>",
        "      <h3>네이버 — 웹 개발</h3>",
        "      <p><time datetime=\"2020-01\">2020.01</time> ~ 2022.02</p>",
        "    </article>",
        "  </section>",
        "",
        "  <section id=\"skills\">",
        "    <h2>기술</h2>",
        "    <ul>",
        "      <li>HTML · CSS · 접근성</li>",
        "      <li>React · TypeScript</li>",
        "    </ul>",
        "  </section>",
        "</main>",
      ]},
      a11y: {lang:"html", filename:"resume.html — 접근성", lines:[
        "<body>",
        "  <!-- 평소엔 화면 밖, Tab 하면 나타나는 바로가기 -->",
        "  <a href=\"#main\" class=\"skip-link\">본문 바로가기</a>",
        "",
        "  <header>",
        "    <img src=\"me.jpg\"",
        "         alt=\"홍길동 프로필 사진, 정면\"",
        "         width=\"96\" height=\"96\" />",
        "    <h1>홍길동</h1>",
        "  </header>",
        "",
        "  <main id=\"main\">...</main>",
        "",
        "  <style>",
        "    /* 화면 밖에 숨겼다가 포커스되면 보이게 */",
        "    .skip-link {",
        "      position: absolute;",
        "      left: -9999px;",
        "    }",
        "    .skip-link:focus {",
        "      left: 8px; top: 8px;",
        "    }",
        "    /* 포커스 링을 지우지 말 것! */",
        "    a:focus, button:focus, input:focus {",
        "      outline: 2px solid #E34F26;",
        "    }",
        "  </style>",

    const S1 = { title:"Step 1. 시맨틱 골격 — 랜드마크로 페이지 뼈대를 세운다", desc:"이력서는 결국 \"누가·무슨 경력·무슨 기술·무슨 프로젝트·어떻게 연락\"의 묶음이다. 이걸 <div>만으로 쌓으면 사람 눈엔 같아 보여도 스크린 리더·검색봇에는 그냥 이름 없는 상자 더미다. 그래서 I-2(시맨틱)에서 배운 대로 header(이름·연락)·nav(섹션 이동)·main>section(소개·경력·기술·프로젝트)·footer로 뼈대부터 세운다. 이 다섯 태그는 브라우저가 자동으로 \"랜드마크\"로 인식해서, 보조기기 사용자가 랜드마크 목록만으로 페이지를 건너뛰며 훑을 수 있게 해준다. 즉 골격을 시맨틱하게 잡는 것만으로 접근성·SEO의 절반이 공짜로 따라온다 — 그래서 스타일보다 구조가 먼저다." };
    const S2 = { title:"Step 2. 콘텐츠와 heading 위계 — 목차가 되는 제목 트리", desc:"골격에 살을 붙인다. 각 section 은 자기 제목(h2)을 갖고, 그 아래 세부 항목은 h3 로 내려간다 — h1 은 페이지에 하나(이름), h2 는 섹션, h3 는 하위. 이 heading 위계가 곧 문서의 목차이고, 스크린 리더 사용자는 \"제목 목록\"만 뽑아 페이지 전체를 1초 만에 파악한다. 흔한 실무 실수가 \"글자를 크게 보이려고\" h1 을 여러 번 쓰거나, 반대로 굵은 <div> 로 제목을 흉내 내는 것인데, 둘 다 목차를 망가뜨린다. 크기는 CSS 로 조절하고 위계는 의미로 정한다가 원칙이다. 경력·프로젝트처럼 반복되는 항목은 각각을 하나의 덩어리(article 이나 li)로 묶어 \"이건 독립적으로 읽히는 단위\"임을 알려준다." };

    const S4 = { title:"Step 4. SEO와 공유 — 검색·공유에 잘 노출되게", desc:"V-1(SEO)에서 배운 메타 정보를 <head> 에 채운다. title 은 검색 결과의 파란 링크, meta description 은 그 아래 회색 요약문이 된다 — 클릭률을 좌우하니 사람이 읽는 문장으로 쓴다. 링크를 카톡·슬랙·링크드인에 붙였을 때 뜨는 미리보기 카드는 Open Graph(og:title·og:description·og:image) 가 만든다. 여기서 한 걸음 더, 검색엔진이 \"이 페이지는 사람(이력서)에 관한 것\"이라고 구조적으로 이해하게 JSON-LD 로 schema.org 의 Person 을 심는다 — 이러면 구글이 이름·직함·소속을 리치 결과로 뽑아낼 수 있다. 요점은 사람이 보는 화면은 그대로 두고, 기계가 읽는 메타 레이어를 별도로 얹는다는 것이다." };
    const S5 = { title:"Step 5. 성능·폼 그리고 완성 — 실전 배포 상태로", desc:"마지막으로 V(성능)와 III(폼)을 얹어 배포 가능한 상태로 만든다. 프로필 이미지는 srcset 으로 화면 크기별 적정 해상도를 주고 아래쪽 이미지는 loading=\"lazy\" 로 미룬다. <img> 에 width·height 를 박아 두면 브라우저가 자리를 미리 잡아 CLS(레이아웃이 덜컹 밀리는 현상)를 막는다. 스크립트는 defer 로 파싱을 막지 않게 한다. 연락 폼은 input type 을 의미대로(email·tel) 골라 모바일 키보드·기본 유효성 검사를 공짜로 얻고, 각 필드엔 label 을 연결한다. 이제 다섯 챕터(시맨틱·폼·SEO·접근성·성능)가 한 페이지에서 만난다 — 오른쪽 랜드마크 개요가 그 결과물의 뼈대를 한눈에 보여준다. 이걸로 HTML 여정을 마친다." };

            {mark:"new", text:"label for=\"msg\" + textarea"},
            {mark:"new", text:"submit 버튼"},
            {mark:"read", text:"required — 브라우저 기본 검증"},
          ],
        },
        actor: "⚡ textarea · submit — JS 없이도 제출",
        stage: "perf",
        stageLabel: "폼 2 — 메시지·제출",
        chapters: ["V 성능","III 폼"],
        perf: [{"label":"srcset","note":"화면 크기별 이미지 → 모바일에 큰 파일 안 보냄"},{"label":"loading=\"lazy\"","note":"뷰포트 밖 이미지는 나중에 로드 → 초기 속도↑"},{"label":"width/height","note":"자리 미리 확보 → CLS(덜컹임) 방지"}],
        landmarks: [{"tag":"header","role":"banner"},{"tag":"nav","role":"navigation"},{"tag":"main","role":"main","children":["about","experience","skills","projects","contact(form)"]},{"tag":"footer","role":"contentinfo"}],
        alert: {"tone":"good","text":"label 이 연결돼 있으면 글자를 눌러도 해당 입력으로 포커스가 간다."},
        code:{...CODE.perf, highlight:[17,18,19,20,21]},
      },
      { ...S5,
        beat:{
          label:"스크립트는 defer 로",
          at:"resume.html L24–25",
          caption:"defer 를 붙이면 HTML 파싱을 막지 않고 문서를 다 읽은 뒤 실행된다. 다섯 챕터가 여기서 만난다.",
          changes:[
            {mark:"new", text:"script defer"},
            {mark:"gone", text:"파싱 도중 멈춤"},
            {mark:"read", text:"랜드마크 개요 완성"},
          ],
        },
        actor: "⚡ srcset · lazy · defer · CLS 방지 · 연락 폼",
        stage: "perf",
        stageLabel: "성능·폼 + 완성 랜드마크 개요",
        chapters: ["V 성능","III 폼","전체 종합"],
        perf: [{"label":"srcset","note":"화면 크기별 이미지 → 모바일에 큰 파일 안 보냄"},{"label":"loading=\"lazy\"","note":"뷰포트 밖 이미지는 나중에 로드 → 초기 속도↑"},{"label":"width/height","note":"자리 미리 확보 → CLS(덜컹임) 방지"},{"label":"script defer","note":"HTML 파싱 안 막고 뒤늦게 실행"}],
        landmarks: [{"tag":"header","role":"banner"},{"tag":"nav","role":"navigation"},{"tag":"main","role":"main","children":["about","experience","skills","projects","contact(form)"]},{"tag":"footer","role":"contentinfo"}],
        alert: {"tone":"good","text":"완성! 시맨틱 골격 + heading 위계 + 접근성 마감 + SEO 메타 + 성능/폼 = 실전 이력서. input type=\"email/tel\" 은 모바일 키보드와 기본 검증을 공짜로 준다. width/height 는 옛날 습관이 아니라 CLS 방어의 정석이다."},
        code:{...CODE.perf, highlight:[24,25]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 챕터 연결 배지 — 이 단계가 어떤 챕터 개념을 합치는지
    // ─────────────────────────────────────────────────────
    function ChapterTags({ chapters }) {
      if (!chapters) return null;
      return (
        <div className="flex flex-wrap gap-1 mb-2">
          {chapters.map((c, i) => (
            <span key={i} className="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 border border-amber-300 text-amber-900 font-bold">📚 {c}</span>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 시맨틱 랜드마크 골격 (빈 뼈대)
    // ─────────────────────────────────────────────────────
    function SkeletonView({ blocks }) {
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white p-3 space-y-1.5">
          <div className="text-[11px] font-bold text-orange-800 mb-1">🏗 페이지 랜드마크 — 스타일 전에 구조부터</div>
          {blocks.map((b, i) => (
            <div key={i} className="rounded border-2 border-orange-300 bg-orange-50 px-2 py-1.5">
              <div className="flex items-center gap-2">
                <span className="text-[11px] font-mono font-bold text-orange-900 px-1.5 py-0.5 rounded bg-orange-100 border border-orange-300">&lt;{b.tag}&gt;</span>
                <span className="text-[9px] font-mono text-slate-500">role="{b.role}"</span>
              </div>
              <div className="text-[10px] text-slate-600 mt-0.5">{b.desc}</div>
              {b.children && (
                <div className="mt-1 flex flex-wrap gap-1">
                  {b.children.map((c, j) => (
                    <span key={j} className="text-[9px] font-mono px-1.5 py-0.5 rounded border border-dashed border-orange-300 bg-white text-orange-800">&lt;{c}&gt;</span>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — heading 위계 트리 (h1/h2/h3)
    // ─────────────────────────────────────────────────────
    function OutlineView({ outline }) {
      const COLOR = {
        1: 'bg-orange-200 border-orange-500 text-orange-900 font-bold',
        2: 'bg-orange-100 border-orange-300 text-orange-900',
        3: 'bg-amber-50 border-amber-300 text-amber-900',
      };
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-[11px] font-bold text-orange-800 mb-2">🌳 문서 개요 — 제목이 곧 목차다</div>
          <div className="space-y-1">
            {outline.map((o, i) => (
              <div key={i} className={`text-[10px] rounded border px-2 py-1 ${COLOR[o.level]}`}
                style={{ marginLeft: (o.level - 1) * 18 + 'px' }}>
                <span className="font-mono mr-1.5 opacity-70">h{o.level}</span>{o.text}
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500">스크린 리더는 이 제목 목록만 뽑아 페이지 전체를 훑는다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 접근성 체크리스트
    // ─────────────────────────────────────────────────────
    function A11yView({ checks }) {
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-[11px] font-bold text-orange-800 mb-2">♿ 접근성 마감 체크리스트</div>
          <div className="space-y-1.5">
            {checks.map((c, i) => (
              <div key={i} className={`flex items-start gap-2 rounded border px-2 py-1.5 ${c.ok ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                <span className="text-xs">{c.ok ? '✅' : '🚫'}</span>
                <div>
                  <div className={`text-[11px] font-mono font-bold ${c.ok ? 'text-emerald-800' : 'text-red-700'}`}>{c.label}</div>
                  <div className="text-[10px] text-slate-600">{c.note}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 공유 카드 미리보기 + 메타 표
    // ─────────────────────────────────────────────────────
    function SeoView({ og, metas }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-sky-800 mb-2">🔗 공유 미리보기 카드 (Open Graph)</div>
            <div className="rounded-lg border border-slate-300 overflow-hidden max-w-xs">
              <div className="h-20 bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center text-white text-2xl font-bold">og:image</div>
              <div className="p-2 bg-white">
                <div className="text-[11px] font-bold text-slate-800">{og.title}</div>
                <div className="text-[10px] text-slate-600 leading-snug">{og.desc}</div>
                <div className="text-[9px] text-slate-400 mt-0.5 uppercase">{og.url}</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">🏷 head 메타 — 기계가 읽는 레이어</div>
            <table className="w-full text-[10px]">
              <tbody>
                {metas.map((m, i) => (
                  <tr key={i} className="border-t border-orange-100 align-top">
                    <td className="py-1 pr-2 font-mono font-bold text-orange-800 whitespace-nowrap">{m.key}</td>
                    <td className="py-1 pr-2 text-slate-700">{m.val}</td>
                    <td className="py-1 text-slate-400 whitespace-nowrap">{m.role}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 성능 개선 + 완성 랜드마크 개요
    // ─────────────────────────────────────────────────────
    function PerfDoneView({ perf, landmarks }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">⚡ 성능 개선 적용</div>
            <div className="grid grid-cols-2 gap-1.5">
              {perf.map((p, i) => (
                <div key={i} className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1">
                  <div className="text-[10px] font-mono font-bold text-emerald-800">{p.label}</div>
                  <div className="text-[9px] text-slate-600 leading-snug">{p.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">🗺 완성된 이력서 — 랜드마크 개요</div>
            <div className="space-y-1">
              {landmarks.map((l, i) => (
                <div key={i}>
                  <div className="flex items-center gap-2 rounded border border-orange-300 bg-orange-50 px-2 py-1">
                    <span className="text-[11px] font-mono font-bold text-orange-900">&lt;{l.tag}&gt;</span>
                    <span className="text-[9px] font-mono text-slate-500">{l.role}</span>
                  </div>
                  {l.children && (
                    <div className="ml-4 mt-1 flex flex-wrap gap-1">
                      {l.children.map((c, j) => (
                        <span key={j} className="text-[9px] font-mono px-1.5 py-0.5 rounded border border-dashed border-orange-300 bg-white text-orange-800">§ {c}</span>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      skeleton: { icon: '🏗', label: '시맨틱 골격' },
      content:  { icon: '🌳', label: '콘텐츠·위계' },
      a11y:     { icon: '♿', label: '접근성' },
      seo:      { icon: '🔎', label: 'SEO·공유' },
      perf:     { icon: '⚡', label: '성능·폼·완성' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.skeleton;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>이력서 조립 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          <ChapterTags chapters={state.chapters} />
          {state.stage === 'skeleton' && <SkeletonView blocks={state.skeleton} />}
          {state.stage === 'content' && <OutlineView outline={state.outline} />}
          {state.stage === 'a11y' && <A11yView checks={state.checks} />}
          {state.stage === 'seo' && <SeoView og={state.og} metas={state.metas} />}
          {state.stage === 'perf' && <PerfDoneView perf={state.perf} landmarks={state.landmarks} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2.5 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-xs whitespace-nowrap">Ⅴ. 성능·배포</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">V-2-2. 종합 프로젝트 — 이력서 페이지</h1>
                <p className="text-sm text-orange-800/80">시맨틱·폼·SEO·접근성·성능을 모두 합쳐 실전 이력서(포트폴리오) 페이지를 완성한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ HTML 여정 완주 — 다섯 챕터가 한 페이지에서 만났다</div>
                시맨틱 골격(header·nav·main·footer)으로 뼈대를 세우고, heading 위계로 목차를 만들고, alt·label·skip link·대비·키보드로 접근성을 마감했다.
                거기에 title·description·OG·JSON-LD(Person)로 검색·공유 노출을 얹고, srcset·lazy·defer·width/height 로 성능(CLS 방지)을,
                의미에 맞는 input type 의 연락 폼으로 마무리했다. 화면은 그대로 두되 기계가 읽는 메타·구조 레이어를 겹겹이 쌓는 것 — 이것이 실전 HTML 이다.
                이걸로 HTML 학습을 마친다. 수고했다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['종합프로젝트', '이력서', '시맨틱', '랜드마크', 'heading위계', '접근성', 'skiplink', 'SEO', 'OpenGraph', 'JSON-LD', 'srcset', 'lazyloading', 'CLS', '폼'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록으로 (HTML 마지막 장) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
