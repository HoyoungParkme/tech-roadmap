<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성능·배포 학습 — V-1-1. 이미지 최적화 — srcset·lazy</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🖼️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    성능·배포 V-1-1 — 이미지 최적화 — srcset·lazy
    학습 목표: 반응형 이미지(srcset·sizes·picture), 최신 포맷(WebP/AVIF), 지연 로딩(loading=lazy),
              CLS 방지(width/height·aspect-ratio), LCP 최적화(fetchpriority·preload)까지
              Core Web Vitals를 개선하는 이미지 실무를 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 뷰포트별 srcset 선택·lazy 로드·전후 지표 시뮬) / 우(VSCode CodeViewer: index.html)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 문제 인식 → srcset → picture/포맷 → lazy → CLS/LCP → 실패사례 종합
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      before: {
        lang: 'html', filename: 'before.html — 흔한 안티패턴',
        lines: [
          '<!-- ❌ 원본 4000px 한 장을 모든 화면에 그대로 -->',
          '<img src="hero-4000.jpg" alt="히어로 이미지" />',
          '',
          '<!--',
          '  문제 진단:',
          '  1) 모바일(360px)에도 4000px · 2.0MB 를 전송',
          '     → 보이지도 않는 화소를 위해 데이터 낭비',
          '  2) width/height 가 없어 이미지 도착 전 높이 0',
          '     → 도착 순간 아래 콘텐츠가 밀림 (CLS 폭발)',
          '  3) JPEG 만 사용 → WebP/AVIF 대비 30~50% 큼',
          '  4) 첫 화면 LCP 이미지인데 우선순위 지정 없음',
          '     → 늦게 도착 → LCP 4.2s',
          '',
          '  목표 (Core Web Vitals "Good"):',
          '    LCP  ≤ 2.5s',
          '    CLS  ≤ 0.1',
          '    전송  최소화 (뷰포트에 맞는 해상도만)',
          '-->',
          '',
          '<!-- 앞으로 5단계에 걸쳐 이 <img> 를 고쳐나간다 -->',
        ],
      },
      srcset: {
        lang: 'html', filename: 'index.html — srcset + sizes',
        lines: [
          '<!-- ✅ 같은 그림의 4가지 실제 픽셀 폭을 후보로 제공 -->',
          '<img',
          '  src="photo-800.jpg"          <!-- 구형 브라우저 폴백 -->',
          '  srcset="',
          '    photo-400.jpg   400w,',
          '    photo-800.jpg   800w,',
          '    photo-1200.jpg 1200w,',
          '    photo-1600.jpg 1600w"',
          '  sizes="(max-width: 600px) 100vw,',
          '         (max-width: 1024px) 50vw,',
          '         800px"',
          '  alt="반응형 사진"',
          '  width="800" height="600" />',
          '',
          '<!--',
          '  동작 원리:',
          '  1) sizes 로 "지금 뷰포트에서 이 img 의 CSS 폭" 결정',
          '     예) 뷰포트 360px → 첫 조건 매칭 → 100vw = 360px',
          '  2) 필요 픽셀 = CSS폭 × DPR (레티나면 ×2)',
          '     예) 360 × 2 = 720px 필요',
          '  3) srcset 후보 중 720px 이상인 가장 작은 것',
          '     → photo-800.jpg 선택 (1600은 과함, 400은 부족)',
          '',
          '  ⚠ sizes 를 빠뜨리면 100vw 로 가정 → 큰 화면에서',
          '     불필요하게 1600w 를 받아 낭비.',
          '-->',
        ],
      },
      picture: {
        lang: 'html', filename: 'index.html — <picture> 포맷 폴백',
        lines: [
          '<!-- ✅ 효율 좋은 포맷을 위에, JPEG 를 최후 폴백으로 -->',
          '<picture>',
          '  <!-- 1순위: AVIF (가장 작음) -->',
          '  <source',
          '    type="image/avif"',
          '    srcset="photo-400.avif 400w, photo-800.avif 800w"',
          '    sizes="(max-width: 600px) 100vw, 800px" />',
          '',
          '  <!-- 2순위: WebP (넓은 지원) -->',
          '  <source',
          '    type="image/webp"',
          '    srcset="photo-400.webp 400w, photo-800.webp 800w"',
          '    sizes="(max-width: 600px) 100vw, 800px" />',
          '',
          '  <!-- 최후 폴백: JPEG (절대 생략 금지!) -->',
          '  <img',
          '    src="photo-800.jpg"',
          '    alt="반응형 사진"',
          '    width="800" height="600" />',

    // ─────────────────────────────────────────────────────
    // Step 2 — srcset 후보 선택 시뮬레이터 (뷰포트 슬라이더 인터랙션)
    // ─────────────────────────────────────────────────────
    const CANDIDATES = [400, 800, 1200, 1600];
    function pickCandidate(neededPx) {
      // 필요 px 이상인 가장 작은 후보 (없으면 가장 큰 것)
      for (const c of CANDIDATES) if (c >= neededPx) return c;
      return CANDIDATES[CANDIDATES.length - 1];
    }
    function cssWidthFor(vw) {
      // sizes: (max-width:600) 100vw, (max-width:1024) 50vw, else 800px
      if (vw <= 600) return vw;
      if (vw <= 1024) return Math.round(vw * 0.5);
      return 800;
    }
    function SrcsetView() {
      const [vw, setVw] = useState(360);
      const [dpr, setDpr] = useState(2);
      const cssW = cssWidthFor(vw);
      const needed = cssW * dpr;
      const chosen = pickCandidate(needed);
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🔀 뷰포트를 바꾸면 선택 파일이 바뀐다</div>
            <label className="block text-[10px] text-slate-600 mb-1">뷰포트 폭: <b className="text-orange-800">{vw}px</b></label>
            <input type="range" min="320" max="1440" step="20" value={vw}
              onChange={(e) => setVw(Number(e.target.value))}
              aria-label="뷰포트 폭 조절"
              className="w-full accent-orange-500 mb-2" />
            <div className="flex gap-1.5 mb-1">
              {[1, 2].map((d) => (
                <button key={d} onClick={() => setDpr(d)}
                  aria-label={"화소밀도 " + d + "배"}
                  className={`text-[10px] px-2 py-0.5 rounded border font-bold ${dpr === d ? 'bg-orange-500 text-white border-orange-500' : 'bg-white text-orange-700 border-orange-300'}`}>
                  DPR {d}x
                </button>
              ))}
              <span className="text-[9px] text-slate-500 self-center ml-1">화소밀도(레티나=2x)</span>
            </div>
            <div className="text-[10px] font-mono text-slate-600 bg-orange-50 rounded px-2 py-1 border border-orange-200">
              sizes 계산 → CSS폭 {cssW}px × DPR {dpr} = <b className="text-orange-900">{needed}px</b> 필요
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">후보 4장 중 선택</div>
            <div className="space-y-1">
              {CANDIDATES.map((c) => {
                const isChosen = c === chosen;
                const enough = c >= needed;
                return (
                  <div key={c} className={`flex items-center gap-2 text-[10px] font-mono rounded border px-2 py-1 ${isChosen ? 'bg-emerald-50 border-emerald-400 text-emerald-900 font-bold' : enough ? 'bg-white border-slate-200 text-slate-500' : 'bg-red-50 border-red-200 text-red-400 line-through'}`}>
                    <span className="w-4">{isChosen ? '✓' : enough ? '·' : '✗'}</span>
                    <span className="w-24">photo-{c}.jpg</span>
                    <span className="text-slate-400">{c}w</span>
                    {isChosen && <span className="ml-auto text-emerald-600">← 다운로드</span>}
                    {!enough && <span className="ml-auto text-red-400">부족</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 포맷 폴백 체인 + 용량 막대
    // ─────────────────────────────────────────────────────
    function PictureView({ formats, chain }) {
      const TONE = { good: 'bg-emerald-500', bad: 'bg-red-400' };
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🎯 폴백 체인 — 지원되는 첫 포맷 선택</div>
            <div className="flex flex-wrap items-center gap-1">
              {chain.map((c, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-orange-400 text-xs">→</span>}
                  <span className={`text-[10px] rounded px-2 py-1 border font-bold ${i === chain.length - 1 ? 'bg-amber-100 border-amber-400 text-amber-900' : 'bg-orange-50 border-orange-300 text-orange-900'}`}>{c}</span>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">위에서부터 디코딩 가능한 첫 포맷을 쓰고, 다 안 되면 &lt;img&gt; JPEG 로 폴백</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">같은 사진, 포맷별 용량</div>
            <div className="space-y-2">
              {formats.map((f, i) => (
                <div key={i}>
                  <div className="flex justify-between text-[10px] mb-0.5">
                    <span className="font-bold text-slate-700">{f.name}</span>
                    <span className="font-mono text-slate-600">{f.size}</span>
                  </div>
                  <div className="h-3.5 bg-slate-100 rounded overflow-hidden border border-slate-200">
                    <div className={`h-full ${TONE[f.tone]}`} style={{ width: f.pct + '%' }}></div>
                  </div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{f.note}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — lazy 스크롤 로드 시뮬레이션 (자동 진행)
    // ─────────────────────────────────────────────────────
    function LazyView() {
      const [scroll, setScroll] = useState(0); // 0~4, 몇 번째 이미지까지 뷰포트에 들어왔나
      useEffect(() => {
        const t = setInterval(() => setScroll((s) => (s + 1) % 6), 900);
        return () => clearInterval(t);
      }, []);
      const imgs = [
        { name: 'hero (첫 화면)', lazy: false },
        { name: 'thumb-1', lazy: true },
        { name: 'thumb-2', lazy: true },
        { name: 'thumb-3', lazy: true },
        { name: 'thumb-4', lazy: true },
      ];
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[11px] font-bold text-orange-800">⏬ 스크롤에 따라 lazy 로드</span>
              <span className="text-[9px] text-slate-500 font-mono">스크롤 위치 {scroll}/5</span>
            </div>
            <div className="space-y-1.5">
              {imgs.map((im, i) => {
                const inView = i <= scroll;
                const loaded = im.lazy ? inView : true; // eager 는 항상 로드
                return (
                  <div key={i} className={`flex items-center gap-2 rounded border px-2 py-1.5 text-[10px] transition ${loaded ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-dashed border-slate-300'}`}>
                    <span className={`w-10 h-6 rounded flex items-center justify-center text-[9px] font-bold ${loaded ? 'bg-emerald-400 text-white' : 'bg-slate-200 text-slate-400'}`}>
                      {loaded ? '🖼️' : '⋯'}
                    </span>
                    <span className="font-mono text-slate-700">{im.name}</span>
                    {im.lazy
                      ? <span className="text-[9px] px-1.5 py-0.5 rounded bg-orange-100 text-orange-700 border border-orange-200">lazy</span>
                      : <span className="text-[9px] px-1.5 py-0.5 rounded bg-red-100 text-red-700 border border-red-200">eager (즉시)</span>}
                    <span className="ml-auto text-[9px] text-slate-500">{loaded ? '로드됨' : '대기 (뷰포트 밖)'}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5 text-[10px] text-red-800">
            <b>🚫 첫 화면 hero 는 eager</b> — 여기에 lazy 를 걸면 LCP 이미지 로딩이 지연돼 지표가 나빠진다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — CLS 시프트 전/후 + 우선순위 표
    // ─────────────────────────────────────────────────────
    function ClsView({ clsDemo, priority }) {
      const [t, setT] = useState(0); // 0: 도착전, 1: 도착후
      useEffect(() => {
        const iv = setInterval(() => setT((v) => (v + 1) % 2), 1400);
        return () => clearInterval(iv);
      }, []);
      const arrived = t === 1;
      const TONE = { good: 'text-emerald-700', mid: 'text-amber-700' };
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">📐 CLS — 자리 예약 있음 vs 없음</div>
            <div className="grid grid-cols-2 gap-2">
              {/* 없음 */}
              <div className="border border-red-200 rounded p-1.5">
                <div className="text-[9px] text-red-600 font-bold mb-1">width/height 없음</div>
                <div className="relative h-24 bg-slate-50 rounded overflow-hidden text-[8px]">
                  {arrived && <div className="bg-red-300 h-10 flex items-center justify-center text-white font-bold">이미지 (뒤늦게 도착)</div>}
                  <div className={`bg-amber-100 border-t border-amber-300 px-1 py-0.5 text-amber-900 transition-all ${arrived ? '' : 'mt-0'}`}>본문 텍스트 ↓ 밀림</div>
                </div>
                <div className="text-[8px] text-red-500 mt-1">{arrived ? '⚠ 텍스트가 아래로 점프!' : '텍스트가 위에 있음…'}</div>
              </div>
              {/* 있음 */}
              <div className="border border-emerald-200 rounded p-1.5">
                <div className="text-[9px] text-emerald-600 font-bold mb-1">width/height 있음</div>
                <div className="relative h-24 bg-slate-50 rounded overflow-hidden text-[8px]">
                  <div className={`h-10 flex items-center justify-center font-bold border border-dashed ${arrived ? 'bg-emerald-300 text-white border-emerald-400' : 'bg-slate-100 text-slate-400 border-slate-300'}`}>
                    {arrived ? '이미지 도착' : '예약된 자리 (비율 유지)'}
                  </div>
                  <div className="bg-emerald-100 border-t border-emerald-300 px-1 py-0.5 text-emerald-900">본문 텍스트 (고정)</div>
                </div>
                <div className="text-[8px] text-emerald-600 mt-1">✓ 자리 예약됨 → 시프트 0</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">두 축의 무기</div>
            <table className="w-full text-[10px]">
              <tbody>
                {priority.map((p, i) => (
                  <tr key={i} className="border-t border-slate-100 align-top">
                    <td className="py-1 font-mono text-slate-700 pr-2">{p.tech}</td>
                    <td className={`py-1 font-bold pr-2 ${TONE[p.tone]}`}>{p.effect}</td>
                    <td className="py-1 text-[9px] text-slate-500">{p.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실패 사례 → 처방 + 체크리스트
    // ─────────────────────────────────────────────────────
    function SummaryView({ fails, checklist }) {
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🔧 5대 실패 → 처방</div>
            <div className="space-y-1.5">
              {fails.map((f, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span>{f.icon}</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-1.5 py-1 text-red-700 line-through">{f.bad}</span>
                  <span className="text-orange-400">→</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-300 px-1.5 py-1 text-emerald-800 font-mono">{f.fix}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">✅ 배포 전 체크리스트</div>
            <div className="space-y-1">
              {checklist.map((c, i) => (
                <div key={i} className="flex items-start gap-2 text-[10px] text-slate-700">
                  <span className="text-emerald-500 mt-0.5">☑</span>
                  <span>{c}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      intro:   { icon: '📊', label: '전후 지표' },
      srcset:  { icon: '🔀', label: 'srcset 선택' },
      picture: { icon: '🎯', label: '포맷 폴백' },
      lazy:    { icon: '⏬', label: '지연 로딩' },
      cls:     { icon: '📐', label: 'CLS·LCP' },
      summary: { icon: '✅', label: '실패사례 종합' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.intro;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>이미지 최적화 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'intro' && <MetricsView metrics={state.metrics} />}
          {state.stage === 'srcset' && <SrcsetView />}
          {state.stage === 'picture' && <PictureView formats={state.formats} chain={state.chain} />}
          {state.stage === 'lazy' && <LazyView />}
          {state.stage === 'cls' && <ClsView clsDemo={state.clsDemo} priority={state.priority} />}
          {state.stage === 'summary' && <SummaryView fails={state.fails} checklist={state.checklist} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-sm">Ⅴ. 성능·배포</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">V-1-1. 이미지 최적화 — srcset·lazy</h1>
                <p className="text-sm text-orange-800/80">반응형 이미지·최신 포맷·지연 로딩으로 페이지 로딩 속도와 Core Web Vitals 개선</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                이미지 최적화의 다섯 무기 — (1) srcset+sizes 로 뷰포트에 맞는 해상도만 보내고, (2) &lt;picture&gt;+&lt;source&gt; 로 AVIF/WebP 를 쓰되 JPEG &lt;img&gt; 폴백을 남기고,
                (3) 첫 화면 밖 이미지에만 loading="lazy"+decoding="async" 를 걸고, (4) width/height 또는 aspect-ratio 로 자리를 예약해 CLS 를 막고,
                (5) LCP 이미지엔 fetchpriority="high"/preload 로 우선순위를 준다. 이 다섯을 지키면 전송 용량·LCP·CLS 가 함께 개선된다. 다음 장 V-1-2 에서 번들·렌더 성능으로 범위를 넓힌다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['srcset', 'sizes', 'picture', 'WebP', 'AVIF', 'lazy로딩', 'decoding', 'CLS', 'LCP', 'fetchpriority', 'preload', 'CoreWebVitals'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
