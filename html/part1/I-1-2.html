        desc: '<body>에는 실제로 화면에 보이는 모든 것 — 제목·문단·이미지·버튼 — 이 들어간다. 핵심은 브라우저가 body를 위에서 아래로 순서대로 읽으며 화면을 만든다는 점이다. 그래서 <script>의 위치가 중요하다: head나 body 중간에 그냥 <script>를 두면 그 지점에서 HTML 파싱이 멈추고 스크립트가 먼저 실행되는데, 이때 아직 만들어지지 않은 아래쪽 요소를 건드리면 null이 잡힌다. 해결은 두 가지 — script를 </body> 직전에 두거나, head에 두되 defer를 붙여 "HTML을 다 읽은 뒤 실행"하게 하는 것. 이제 문서의 뼈대가 완성됐다. 다음 장 I-1-3(시맨틱)에서는 이 body 안을 <div> 덩어리 대신 <header>·<nav>·<main>·<article>처럼 "의미가 있는 태그"로 짜는 법을 다룬다.',
        actor: '📄 body = 보이는 콘텐츠 · 위→아래 로딩 · script 위치',
        stage: 'body',
        stageLabel: 'body — 콘텐츠·로딩 순서 완성',
        skeleton: ['doctype', 'html', 'head', 'body'],
        loadOrder: [
          { n: 1, el: '<h1>제목</h1>', note: '먼저 읽혀 먼저 그려짐' },
          { n: 2, el: '<p>문단</p>', note: '그다음 순서대로' },
          { n: 3, el: '<img src="..">', note: '요청 시작(자리 잡고 나중에 채움)' },
          { n: 4, el: '<script>...', note: '여기서 파싱 멈추고 실행!' },
        ],
        scriptPos: [
          { where: '<head> 안 그냥 <script>', tone: 'bad', note: '아래 요소가 아직 없음 → getElementById null' },
          { where: '<head> + defer', tone: 'good', note: 'HTML 다 읽은 뒤 실행 → 안전' },
          { where: '</body> 직전 <script>', tone: 'good', note: '요소가 다 만들어진 뒤 → 안전(전통적 방법)' },
        ],
        alert: { tone: 'good', text: 'body 는 위→아래로 읽힌다. <script>를 중간에 두면 그 지점에서 파싱이 멈추고, 아직 없는 아래 요소는 null 이 된다. 해결: </body> 직전에 두거나 head 에 defer. 다음 장 I-1-3 에서 body 를 "의미 있는 태그"로 짠다.' },
        code: {
          lang: 'html',
          filename: 'index.html — body 완성 + script 위치',
          lines: [
            '<!DOCTYPE html>',
            '<html lang="ko">',
            '  <head>',
            '    <meta charset="UTF-8" />',
            '    <meta name="viewport"',
            '          content="width=device-width, initial-scale=1.0" />',
            '    <title>내 첫 페이지</title>',
            '    <link rel="stylesheet" href="style.css" />',
            '    <script src="app.js" defer><\/script>',
            '    <!-- ↑ defer: HTML 다 읽은 뒤 실행 → 안전 -->',
            '  </head>',
            '',
            '  <body>',
            '    <h1>안녕하세요</h1>       <!-- 위에서부터 -->',
            '    <p>첫 문단입니다.</p>     <!-- 순서대로 -->',
            '    <img src="hero.png" alt="대표 이미지" />',
            '',
            '    <!-- 전통적 방법: script 를 body 끝에 둬도 안전 -->',
            '    <script src="last.js"><\/script>',
            '  </body>',
            '</html>',
            '',
            '<!--',
            '  뼈대 완성! 다음 장 I-1-3 (시맨틱)에서는',
            '  이 <body> 안을 <div> 대신',
            '  <header>·<nav>·<main>·<article> 로 짠다.',
            '-->',
          ],
          highlight: [9, 10, 13, 14, 15, 18, 19, 24, 25, 26],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 공통 — 지금까지 쌓인 문서 뼈대 조립도 (skeleton 배열)
    //   각 단계마다 한 겹씩 채워지는 애니메이션 느낌을 색으로 표현
    // ─────────────────────────────────────────────────────
    const SKEL_META = {
      doctype: { label: '<!DOCTYPE html>', role: '표준 모드 선언', indent: 0 },
      html:    { label: '<html lang="ko">', role: '루트 요소', indent: 0 },
      head:    { label: '<head> … </head>', role: '보이지 않는 설정', indent: 1 },
      body:    { label: '<body> … </body>', role: '보이는 콘텐츠', indent: 1 },
    };

    function SkeletonView({ skeleton, activeStage }) {
      const order = ['doctype', 'html', 'head', 'body'];
      // stage 이름과 skeleton 키 매핑: viewport 단계는 head 를 활성으로 본다
      const activeKey = activeStage === 'viewport' ? 'head' : activeStage;
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-[11px] font-bold text-orange-800 mb-2 flex items-center gap-1.5">
            <span>🧱</span><span>지금까지 조립된 문서 뼈대</span>
          </div>
          <div className="space-y-1 font-mono">
            {order.map((k) => {
              const has = skeleton.includes(k);
              const isActive = k === activeKey;
              const m = SKEL_META[k];
              return (
                <div
                  key={k}
                  className={`flex items-center gap-2 rounded px-2 py-1 border transition ${
                    !has ? 'border-dashed border-slate-300 bg-slate-50 opacity-40'
                    : isActive ? 'border-orange-400 bg-orange-100'
                    : 'border-orange-200 bg-orange-50'
                  }`}
                  style={{ marginLeft: m.indent * 18 }}
                >
                  <span className={`text-[11px] font-bold ${has ? 'text-orange-900' : 'text-slate-400'}`}>
                    {has ? m.label : '· · ·'}
                  </span>
                  {has && <span className="text-[9px] text-slate-500 ml-auto">{m.role}</span>}
                  {isActive && <span className="text-[9px] text-orange-600 font-bold">← 지금</span>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 표준 모드 vs 쿼크 모드
    // ─────────────────────────────────────────────────────
    function ModeView({ modes }) {
      return (
        <div className="space-y-2">
          {modes.map((m, i) => (
            <div key={i} className={`rounded-lg border-2 p-3 ${m.on ? 'border-emerald-400 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
              <div className="flex items-center gap-2 mb-1">
                <span className={`text-[11px] font-bold px-2 py-0.5 rounded ${m.on ? 'bg-emerald-600 text-white' : 'bg-red-500 text-white'}`}>
                  {m.on ? '✓ ' : '✗ '}{m.name}
                </span>
                <span className="text-[10px] font-mono text-slate-600">{m.box}</span>
              </div>
              <div className={`text-[10px] ${m.on ? 'text-emerald-900' : 'text-red-800'}`}>{m.note}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — lang 이득 칩 + head/body 2분할
    // ─────────────────────────────────────────────────────
    function SplitView({ split }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">🏷 lang="ko" 하나가 주는 이득</div>
            <div className="space-y-1">
              {split.langChips.map((c, i) => (
                <div key={i} className="text-[10px] rounded border border-orange-200 bg-orange-50 px-2 py-1">
                  <span className="font-bold text-orange-900">{c.who}</span>
                  <span className="text-slate-600"> — {c.gain}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="text-center text-orange-500 text-lg">▼ &lt;html&gt; 안은 2분할</div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-sky-800 mb-1">&lt;head&gt;</div>
              <div className="text-[10px] text-slate-600">{split.head}</div>
              <div className="mt-1 text-[9px] text-sky-600">🙈 화면엔 안 보임</div>
            </div>
            <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
              <div className="text-[11px] font-bold text-emerald-800 mb-1">&lt;body&gt;</div>
              <div className="text-[10px] text-slate-600">{split.body}</div>

    // ─────────────────────────────────────────────────────
    // Step 3 — head 구성 요소 목록 + charset 깨짐 데모
    // ─────────────────────────────────────────────────────
    function HeadView({ headItems, charsetDemo }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">🗄 &lt;head&gt; 안에 들어가는 것</div>
            <div className="space-y-1">
              {headItems.map((h, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 ${h.key ? 'border-orange-400 bg-orange-100' : 'border-orange-200 bg-orange-50'}`}>
                  <div className={`font-mono font-bold ${h.key ? 'text-orange-900' : 'text-orange-800'}`}>{h.tag}{h.key && ' ⭐'}</div>
                  <div className="text-slate-600">{h.role}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1.5">⚡ charset 을 놓치면 (인코딩 불일치)</div>
            <div className="space-y-1 text-[10px] font-mono">
              <div className="flex items-center gap-2">
                <span className="w-14 text-emerald-600 font-bold">UTF-8 ✓</span>
                <span className="flex-1 rounded bg-white border border-emerald-200 px-2 py-1 text-slate-700">{charsetDemo.ok}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-14 text-red-600 font-bold">깨짐 ✗</span>
                <span className="flex-1 rounded bg-white border border-red-200 px-2 py-1 text-red-700">{charsetDemo.broken}</span>
              </div>
            </div>
            <div className="mt-1.5 text-[10px] text-amber-900">같은 바이트를 다른 인코딩으로 읽으면 이렇게 깨진다. 그래서 charset 을 head 맨 앞에 둔다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — viewport 유무 모바일 비교 (폰 목업)
    // ─────────────────────────────────────────────────────
    function ViewportView({ phones }) {
      return (
        <div className="grid grid-cols-2 gap-3">
          {phones.map((p, i) => (
            <div key={i} className={`rounded-lg border-2 p-2.5 ${p.ok ? 'border-emerald-400 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
              <div className={`text-[11px] font-bold mb-2 flex items-center gap-1 ${p.ok ? 'text-emerald-800' : 'text-red-700'}`}>
                <span>📱</span><span>{p.title}</span>
              </div>
              {/* 폰 목업 */}
              <div className="mx-auto w-full max-w-[130px] rounded-lg border-4 border-slate-700 bg-white overflow-hidden" style={{ aspectRatio: '9 / 16' }}>
                <div className="h-full p-1 flex flex-col gap-1 items-start justify-start overflow-hidden">
                  <div className="bg-orange-500 rounded-sm" style={{ fontSize: 9 * p.scale, height: 14 * p.scale, width: '90%' }}></div>
                  <div className="bg-slate-300 rounded-sm w-full" style={{ height: 6 * p.scale }}></div>
                  <div className="bg-slate-300 rounded-sm w-full" style={{ height: 6 * p.scale }}></div>
                  <div className="bg-slate-300 rounded-sm" style={{ height: 6 * p.scale, width: '70%' }}></div>
                  <div className="mt-1 text-orange-900 font-bold" style={{ fontSize: 11 * p.scale }}>
                    {p.ok ? '읽기 좋은 크기' : '개미만 한 글자'}
                  </div>
                </div>
              </div>
              <div className="mt-2 text-[9px] font-mono text-slate-600">{p.label}</div>
              <div className={`mt-1 text-[10px] ${p.ok ? 'text-emerald-900' : 'text-red-800'}`}>{p.note}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — body 로딩 순서 + script 위치 표
    // ─────────────────────────────────────────────────────
    function BodyView({ loadOrder, scriptPos }) {
      const TONE = { bad: 'text-red-700', good: 'text-emerald-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">📥 브라우저는 body 를 위→아래로 읽는다</div>
            <div className="space-y-1">
              {loadOrder.map((l, i) => (
                <div key={i} className={`flex items-center gap-2 text-[10px] rounded border px-2 py-1 ${l.n === 4 ? 'border-amber-400 bg-amber-100' : 'border-orange-200 bg-orange-50'}`}>
                  <span className="w-5 h-5 flex items-center justify-center rounded-full bg-orange-500 text-white font-bold text-[10px]">{l.n}</span>
                  <span className="font-mono font-bold text-orange-900">{l.el}</span>
                  <span className="text-slate-500 ml-auto">{l.note}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">📍 &lt;script&gt; 를 어디 둘까</div>
            <div className="space-y-1">
              {scriptPos.map((s, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 flex items-center gap-2 ${s.tone === 'good' ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                  <span>{s.tone === 'good' ? '✓' : '✗'}</span>
                  <span className={`font-mono font-bold ${TONE[s.tone]}`}>{s.where}</span>
                  <span className="text-slate-500 ml-auto text-right">{s.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      doctype:  { icon: '⚙️', label: 'doctype' },
      html:     { icon: '🌳', label: 'html·lang' },
      head:     { icon: '🗄', label: 'head' },
      viewport: { icon: '📱', label: 'viewport' },
      body:     { icon: '📄', label: 'body' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.doctype;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>문서 뼈대 해부 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>

          {/* 항상 위에 뼈대 조립도 */}
          <SkeletonView skeleton={state.skeleton} activeStage={state.stage} />

          <div className="mt-2">
            {state.stage === 'doctype' && <ModeView modes={state.modes} />}
            {state.stage === 'html' && <SplitView split={state.split} />}
            {state.stage === 'head' && <HeadView headItems={state.headItems} charsetDemo={state.charsetDemo} />}
            {state.stage === 'viewport' && <ViewportView phones={state.phones} />}
            {state.stage === 'body' && <BodyView loadOrder={state.loadOrder} scriptPos={state.scriptPos} />}
          </div>
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-sm">HTML</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">I-1-2. 문서 해부 — doctype·head·meta·body</h1>
                <p className="text-sm text-orange-800/80">모든 HTML 문서의 뼈대 — 각 부분이 왜 그 자리에 있나</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                모든 HTML 문서는 같은 뼈대를 쓴다: 맨 위 &lt;!DOCTYPE html&gt;로 표준 모드를 켜고, 루트 &lt;html lang="ko"&gt; 안을
                &lt;head&gt;(보이지 않는 설정)와 &lt;body&gt;(보이는 콘텐츠)로 나눈다. head 맨 앞엔 charset(한글 안 깨지게), 그다음
                viewport(모바일 렌더링의 전제)·title·CSS/JS 링크가 온다. body 는 위→아래로 읽히므로 &lt;script&gt;는 defer 를 붙이거나
                &lt;/body&gt; 직전에 둔다. 다음 장 I-1-3에서는 이 body 를 &lt;div&gt; 대신 시맨틱 태그로 짜는 법을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['doctype', '표준모드', '쿼크모드', 'html', 'lang', 'head', 'charset', 'viewport', 'body', 'defer', '접근성', 'SEO'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1</a>
              <a href="./I-1-3.html" className="underline hover:no-underline">다음: I-1-3 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
