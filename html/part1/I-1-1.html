<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 학습 — I-1-1. 브라우저가 HTML을 그리기까지</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌐</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    HTML I-1-1 — 브라우저가 HTML을 그리기까지
    학습 목표: 서버가 보낸 것은 그냥 "태그가 든 텍스트 한 장"이라는 사실에서 출발해,
              토큰화→DOM 트리→CSSOM→렌더 트리→레이아웃→페인트→합성까지
              브라우저 렌더링 파이프라인 전체를 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 텍스트→DOM→렌더트리→픽셀 시뮬레이션) / 우(VSCode CodeViewer: index.html + render_notes.md)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 텍스트 → DOM → 렌더 트리 → 레이아웃/페인트 → 전체 지도
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(text/dom/render/paint/pipeline)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      raw: {lang:"html", filename:"index.html — 서버가 보낸 원본", lines:[
        "<!DOCTYPE html>",
        "<html lang=\"ko\">",
        "  <head>",
        "    <meta charset=\"UTF-8\" />",
        "    <title>My Page</title>",
        "    <link rel=\"stylesheet\" href=\"style.css\" />",
        "  </head>",
        "  <body>",
        "    <h1>안녕하세요</h1>",
        "    <p class=\"lead\">첫 문단입니다</p>",
        "  </body>",
        "</html>",
        "",
        "<!--",
        "  브라우저가 이 파일을 받는 순간에는",
        "  아직 \"화면\"이 아니라 그냥 글자(bytes)일 뿐이다.",
        "",
        "  네트워크 응답 헤더:",
        "    HTTP/1.1 200 OK",
        "    Content-Type: text/html; charset=UTF-8",
        "    Content-Length: 512",
        "",
        "  이 텍스트를 어떻게 그림으로 바꾸나?",
        "  → 다음 단계: 파싱(parse) 해서 DOM 트리를 만든다.",
        "-->",
      ]},
      parse: {lang:"html", filename:"render_notes.md — 파싱 과정", lines:[
        "## 1) 바이트 → 문자 → 토큰",
        "",
        "\"<h1>안녕</h1>\" 라는 텍스트를 파서가 이렇게 자른다:",
        "",
        "  StartTag(h1)  ·  Text(\"안녕\")  ·  EndTag(h1)",
        "",
        "## 2) 토큰 → 노드 → 트리",
        "",
        "토큰을 순서대로 읽으며 부모-자식으로 엮는다:",
        "",
        "  html",
        "  ├─ head",
        "  │   └─ title → \"My Page\"",
        "  └─ body",
        "      ├─ h1 → \"안녕하세요\"",
        "      └─ p.lead → \"첫 문단입니다\"",
        "",
        "## 3) 파서의 관용성 (error recovery)",
        "",
        "  입력:  <p>첫 문단 <b>굵게</p>   ← </b> 없음",
        "  결과:  <p>첫 문단 <b>굵게</b></p>  ← 자동 교정",
        "",
        "  → HTML 파서는 절대 멈추지 않는다. 어떻게든",
        "    유효한 트리를 만들어낸다(그래서 웹은 잘 안 죽는다).",
        "  → 단, 교정 결과가 의도와 다를 수 있으니",
        "    닫는 태그·중첩은 직접 정확히 쓰는 습관이 안전하다.",
      ]},
      cssom: {lang:"css", filename:"style.css — CSSOM 재료", lines:[
        "/* 이 CSS도 HTML처럼 파싱되어",
        "   CSSOM(CSS Object Model) 트리가 된다. */",
        "",
        "body {",
        "  font: 16px/1.6 Pretendard, sans-serif;",
        "  margin: 0;",
        "}",
        "",
        "h1 {",
        "  color: #E34F26;   /* HTML 브랜드 오렌지 */",
        "  font-size: 28px;",
        "}",
        "",
        "p.lead {",
        "  color: #333;",
        "}",
        "",
        "/* 렌더 트리에서 통째로 빠지는 요소 */",
        ".hidden {",
        "  display: none;    /* 그릴 대상 아님 → 공간 X */",

                 "text": "JS가 파이프라인의 스위치다 — <script>는 파싱을 멈추고(그래서 defer/body 끝), DOM·CSSOM을 바꾸면 레이아웃·페인트가 다시 돈다. 다음 장 I-1-2에서 <!DOCTYPE>·<html>·<head>·<body>를 해부한다."
               },
        code: {...CODE.pipeline, highlight: [31,32]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 원본 텍스트 뷰 (아직 "그림"이 아님을 강조)
    // ─────────────────────────────────────────────────────
    function RawTextView({ raw }) {
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-[11px] font-bold text-orange-800 mb-2 flex items-center gap-1.5">
            <span>📄</span><span>브라우저가 받은 그대로 — 글자(bytes)일 뿐</span>
          </div>
          <pre className="text-[11px] leading-5 font-mono text-slate-700 bg-orange-50 rounded p-2 border border-orange-200 overflow-auto whitespace-pre">{raw}</pre>
          <div className="mt-2 text-[10px] text-orange-900">이 안 어디에도 "제목 그림"은 없다. &lt;h1&gt;라는 글자만 있을 뿐. → 파싱해서 구조로 바꿔야 한다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — DOM 트리 (재귀 렌더)
    // ─────────────────────────────────────────────────────
    function TreeNode({ node, depth }) {
      const isText = node.type === 'text';
      return (
        <div className="ml-3">
          <div className="flex items-center gap-1.5 py-0.5">
            <span className="text-orange-400 text-[10px] select-none">{depth === 0 ? '▸' : '└'}</span>
            <span className={`text-[11px] px-1.5 py-0.5 rounded border font-mono ${isText ? 'bg-amber-50 border-amber-300 text-amber-800' : 'bg-orange-100 border-orange-300 text-orange-900 font-bold'}`}>
              {isText ? node.label : `<${node.label}>`}
            </span>
            {!isText && <span className="text-[9px] text-slate-400">element node</span>}
            {isText && <span className="text-[9px] text-slate-400">text node</span>}
          </div>
          {node.children && node.children.map((c, i) => <TreeNode key={i} node={c} depth={depth + 1} />)}
        </div>
      );
    }

    function DomTreeView({ tree, fixup }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-1">🌳 DOM 트리 — 태그 = 노드, 중첩 = 부모/자식</div>
            <div className="mt-1"><TreeNode node={tree} depth={0} /></div>
          </div>
          {fixup && (
            <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
              <div className="text-[11px] font-bold text-amber-900 mb-1.5">🩹 {fixup.title}</div>
              <div className="space-y-1 text-[10px] font-mono">
                <div className="flex items-center gap-2">
                  <span className="w-10 text-red-600 font-bold">입력</span>
                  <span className="flex-1 rounded bg-white border border-red-200 px-2 py-1 text-slate-700">{fixup.before}</span>
                </div>
                <div className="text-center text-amber-500">▼ 파서 자동 교정</div>
                <div className="flex items-center gap-2">
                  <span className="w-10 text-emerald-600 font-bold">결과</span>
                  <span className="flex-1 rounded bg-white border border-emerald-200 px-2 py-1 text-slate-700">{fixup.after}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[10px] text-amber-900">{fixup.note}</div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — DOM + CSSOM = 렌더 트리 (display:none 제외)
    // ─────────────────────────────────────────────────────
    function RenderTreeView({ merge }) {
      const Chip = ({ children, tone }) => (
        <div className={`text-[10px] font-mono rounded border px-2 py-1 ${tone}`}>{children}</div>
      );
      return (
        <div className="space-y-2">
          <div className="flex gap-2 items-stretch">
            <div className="flex-1 rounded-lg border-2 border-orange-300 bg-white p-2">
              <div className="text-[10px] font-bold text-orange-800 mb-1">DOM (구조)</div>
              <div className="space-y-1">
                {merge.dom.map((d, i) => <Chip key={i} tone="bg-orange-50 border-orange-200 text-orange-900">{d}</Chip>)}
              </div>
            </div>
            <div className="flex items-center text-orange-500 text-xl font-bold">⨝</div>
            <div className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2">
              <div className="text-[10px] font-bold text-sky-800 mb-1">CSSOM (스타일)</div>
              <div className="space-y-1">
                {merge.css.map((c, i) => <Chip key={i} tone="bg-sky-50 border-sky-200 text-sky-900">{c}</Chip>)}
              </div>
            </div>
          </div>
          <div className="text-center text-orange-500 text-lg">▼ 결합 =</div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">🎨 렌더 트리 — 화면에 그려질 것만</div>
            <div className="space-y-1">
              {merge.render.map((r, i) => (
                <div key={i} className={`text-[10px] font-mono rounded border px-2 py-1 flex items-center gap-2 ${r.kept ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-red-50 border-red-300 text-red-700 line-through opacity-70'}`}>
                  <span>{r.kept ? '✓' : '✗'}</span>
                  <span>{r.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 레이아웃 박스 미리보기 + 성능 표
    // ─────────────────────────────────────────────────────
    function LayoutPaintView({ boxes, cost }) {
      const TONE = { bad: 'text-red-700', mid: 'text-amber-700', good: 'text-emerald-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">📐 레이아웃 → 🖌 페인트 (뷰포트 안에 배치)</div>
            <div className="relative rounded border-2 border-dashed border-slate-300 bg-slate-50 h-28 overflow-hidden">
              {boxes.map((b, i) => (
                <div key={i}
                  className="absolute rounded-sm flex items-center px-1.5 text-white text-[10px] font-bold shadow"
                  style={{ left: b.x + '%', top: b.y + '%', width: b.w + '%', height: b.h + '%', backgroundColor: b.color }}>
                  {b.text}
                </div>
              ))}
            </div>
            <div className="mt-1 text-[9px] text-slate-500 font-mono">각 요소의 x·y·w·h 가 픽셀로 확정 → 그 안을 색·글자로 칠함</div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1.5">⚡ {cost.title}</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-amber-900 border-b border-amber-200">
                  <th className="text-left py-0.5">바꾸는 속성</th>
                  <th className="text-left py-0.5 pl-2">다시 도는 단계</th>
                </tr>
              </thead>
              <tbody>
                {cost.rows.map((r, i) => (
                  <tr key={i} className="border-t border-amber-100 align-top">
                    <td className="py-1 font-mono text-slate-700">{r.change}</td>
                    <td className={`py-1 pl-2 font-bold ${TONE[r.tone]}`}>
                      {r.pipe}
                      <div className="text-[9px] font-normal text-slate-500">{r.note}</div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 전체 파이프라인 지도 + 개발자도구 표
    // ─────────────────────────────────────────────────────
    function PipelineView({ pipeline, devtools }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🗺 렌더링 파이프라인 — 입력 2개가 하나로</div>
            <div className="space-y-1.5">
              {pipeline.inputs.map((inp, i) => (
                <div key={i} className="flex items-center gap-1.5 text-[10px]">
                  <span className="rounded border border-orange-300 bg-orange-50 px-2 py-1 font-mono text-orange-900 w-24 text-center">{inp.label}</span>
                  <span className="text-orange-500">──{inp.arrow}→</span>
                  <span className="rounded border border-orange-400 bg-orange-100 px-2 py-1 font-mono font-bold text-orange-900">{inp.out}</span>
                </div>
              ))}
            </div>
            <div className="text-center text-orange-500 text-lg my-1">▼ 결합 → 이어지는 흐름</div>
            <div className="flex flex-wrap items-center gap-1">
              {pipeline.chain.map((c, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-orange-400 text-xs">→</span>}
                  <span className={`text-[10px] rounded px-2 py-1 border font-bold ${i === pipeline.chain.length - 1 ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-orange-50 border-orange-300 text-orange-900'}`}>{c}</span>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 rounded bg-amber-100 border border-amber-300 px-2 py-1 text-[10px] text-amber-900">
              ⚙️ {pipeline.jsNote}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">🔎 {devtools.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {devtools.rows.map((r, i) => (
                  <tr key={i} className="border-t border-sky-100">
                    <td className="py-1 pr-2 font-mono font-bold text-sky-800 whitespace-nowrap align-top">{r.tab}</td>
                    <td className="py-1 text-slate-700">{r.see}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      text:     { icon: '📄', label: '원본 텍스트' },
      dom:      { icon: '🌳', label: 'DOM 파싱' },
      render:   { icon: '🎨', label: '렌더 트리' },
      paint:    { icon: '🖌', label: '레이아웃·페인트' },
      pipeline: { icon: '🗺', label: '파이프라인 지도' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.text;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>렌더링 파이프라인 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'text' && <RawTextView raw={state.rawHtml} />}
          {state.stage === 'dom' && <DomTreeView tree={state.tree} fixup={state.fixup} />}
          {state.stage === 'render' && <RenderTreeView merge={state.merge} />}
          {state.stage === 'paint' && <LayoutPaintView boxes={state.boxes} cost={state.cost} />}
          {state.stage === 'pipeline' && <PipelineView pipeline={state.pipeline} devtools={state.devtools} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-sm">HTML</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">I-1-1. 브라우저가 HTML을 그리기까지</h1>
                <p className="text-sm text-orange-800/80">텍스트 파일 한 장이 화면이 되는 과정 — 파싱부터 렌더까지</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                브라우저가 받는 것은 그림이 아니라 태그가 든 텍스트다. 그 텍스트를 파싱해 DOM 트리를, CSS를 파싱해 CSSOM을 만들고,
                둘을 합쳐 "보이는 것만" 담은 렌더 트리를 만든다. 렌더 트리로 각 요소의 위치·크기를 계산(레이아웃)하고 픽셀로 칠한 뒤(페인트)
                레이어를 겹쳐(합성) 화면이 완성된다. JavaScript가 DOM·CSSOM을 바꾸면 이 흐름이 되돌아 다시 흐르므로, 크기 변경(reflow)은 비싸고 transform·opacity는 싸다.
                다음 장 I-1-2에서는 이 DOM의 뼈대 — &lt;!DOCTYPE&gt;·&lt;html&gt;·&lt;head&gt;·&lt;body&gt;를 해부한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['렌더링파이프라인', '파싱', 'DOM', 'CSSOM', '렌더트리', '레이아웃', 'reflow', '페인트', '합성', '개발자도구'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
