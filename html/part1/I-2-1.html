<!DOCTYPE html>

<head>

  <title>HTML 학습 — I-2-1. 시맨틱 태그 지도</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏷️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    HTML I-2-1 — 시맨틱 태그 지도
    학습 목표: "모든 게 div"인 마크업이 왜 기계(스크린리더·검색엔진)와 사람 모두에게
              나쁜지에서 출발해, 랜드마크 태그(header·nav·main·aside·footer) →
              콘텐츠 태그(article·section·figure·time·mark) → 접근성 이득(암묵적 ARIA) →
              실전 마크업까지 5단계로 "의미 있는 태그"의 가치를 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: div수프 vs 시맨틱 비교 · 랜드마크 다이어그램 · 스크린리더 시뮬) / 우(VSCode CodeViewer: semantic.html)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — div수프 → 랜드마크 → 콘텐츠 → 접근성 → 실전
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(soup/landmark/content/a11y/practice)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      soup: {lang:"html", filename:"semantic.html — ① div 버전 (안티패턴)", lines:[
        "<!-- 전부 div — 화면엔 멀쩡하지만 \"의미\"가 없다 -->",
        "<div class=\"header\">",
        "  <div class=\"logo\">내 블로그</div>",
        "</div>",
        "",
        "<div class=\"nav\">",
        "  <div class=\"menu-item\">홈</div>",
        "  <div class=\"menu-item\">글</div>",
        "</div>",
        "",
        "<div class=\"content\">",
        "  <div class=\"post-title\">첫 글</div>",
        "  <div class=\"post-body\">본문입니다...</div>",
        "</div>",
        "",
        "<div class=\"sidebar\">추천 글</div>",
        "<div class=\"footer\">© 2026</div>",
        "",
        "<!--",
        "  문제 1) 스크린리더: 전부 \"그룹\"으로만 읽힘",
        "          → 머리글/본문/메뉴 구분 불가",
        "  문제 2) 검색엔진: 어디가 핵심 본문인지 모름",
        "  문제 3) 개발자: class 이름에 의존해 구조 추측",
        "  → class=\"nav\"는 CSS용 이름일 뿐, 의미가 아니다.",
        "-->",
      ]},
      landmark: {lang:"html", filename:"semantic.html — ② 랜드마크로 골격 잡기", lines:[
        "<!-- 같은 페이지를 \"의미 있는 골격\"으로 -->",
        "<header>              <!-- role=banner -->",
        "  <h1>내 블로그</h1>",
        "</header>",
        "",
        "<nav aria-label=\"주요 메뉴\">  <!-- role=navigation -->",
        "  <a href=\"/\">홈</a>",
        "  <a href=\"/posts\">글</a>",
        "</nav>",
        "",
        "<main>                <!-- role=main · 페이지당 1개 -->",
        "  <h2>첫 글</h2>",
        "  <p>본문입니다...</p>",
        "</main>",
        "",
        "<aside aria-label=\"추천 글\">  <!-- role=complementary -->",
        "  ...",
        "</aside>",
        "",
        "<footer>              <!-- role=contentinfo -->",
        "  <small>© 2026 내 블로그</small>",
        "</footer>",
        "",
        "<!--",
        "  같은 nav가 여러 개면 aria-label로 구분한다.",
        "  (예: \"주요 메뉴\" vs \"바닥글 메뉴\")",
        "-->",
      ]},
      content: {lang:"html", filename:"semantic.html — ③ 콘텐츠 태그로 채우기", lines:[
        "<main>",
        "  <!-- article: 떼어내도 독립적인 글 하나 -->",
        "  <article>",
        "    <h2>시맨틱 태그 입문</h2>",
        "    <p>작성: <time datetime=\"2026-08-07\">8월 7일</time></p>",
        "",
        "    <!-- section: 글 안의 소주제 묶음 -->",
        "    <section>",
        "      <h3>왜 중요한가</h3>",
        "      <p>핵심은 <mark>기계 가독성</mark>이다.</p>",
        "    </section>",
        "",
        "    <section>",
        "      <h3>예시</h3>",
        "      <figure>",

    const S1 = { title: "Step 1. div 수프 — 기계도 사람도 구조를 못 읽는다", desc: "<div>는 아무 의미가 없는 \"그냥 상자\"다. 화면에 보이는 결과만 놓고 보면 div로 짜든 시맨틱 태그로 짜든 똑같아 보이지만, 그 차이는 눈에 안 보이는 곳에서 갈린다. 스크린리더는 태그 이름으로 \"여기가 머리글, 여기가 본문\"을 판단하는데 전부 div면 페이지가 그냥 밋밋한 글자 더미로 읽힌다. 검색엔진 크롤러도 어디가 핵심 본문인지 몰라 SEO가 나빠지고, 동료 개발자는 class=\"header-wrapper\" 같은 이름에 의존해 구조를 추측해야 한다. 즉 div 수프는 \"보이지만 이해할 수 없는\" 페이지다." };
    const S2 = { title: "Step 2. 랜드마크 태그 — 페이지의 큰 골격을 의미로", desc: "랜드마크(landmark) 태그는 페이지를 큰 영역으로 나누는 \"이정표\"다. header(머리글)·nav(주요 탐색)·main(핵심 본문)·aside(곁다리 콘텐츠)·footer(바닥글) 다섯이 뼈대다. 이 태그들이 중요한 건, 스크린리더 사용자가 랜드마크 목록을 열어 \"본문으로 바로 이동\", \"탐색 메뉴로 점프\"처럼 페이지를 건너뛰며 다닐 수 있기 때문이다. 시각장애 사용자에게 이건 사이트를 한 줄씩 다 듣지 않아도 되게 해주는 결정적 편의다. 규칙 하나만 기억하자: main은 페이지에 딱 하나, 그 페이지의 진짜 주제여야 한다. header·nav·footer는 여러 번 나올 수 있다." };
    const S3 = { title: "Step 3. 콘텐츠 태그 — article vs section, 그리고 중첩 규칙", desc: "랜드마크가 큰 골격이라면, 콘텐츠 태그는 본문 안쪽을 의미로 채운다. 헷갈리는 핵심은 article vs section이다. article은 \"그것만 떼어내도 말이 되는 독립 콘텐츠\"다 — 블로그 글 하나, 댓글 하나, 상품 카드 하나. section은 \"주제로 묶은 문단 묶음\"으로 보통 제목(h2 등)을 동반한다. 판단 기준은 간단하다: RSS 피드에 넣거나 다른 곳에 퍼가도 말이 되면 article, 그냥 문서를 주제별로 나눈 거면 section이다. figure는 이미지·도표에 figcaption 설명을 묶고, time은 날짜를 datetime 속성으로 기계가 읽게 하며, mark는 형광펜처럼 강조한다. 이 태그들은 자유롭게 중첩되지만 \"의미가 맞을 때만\" 넣는 게 원칙이다." };
    const S4 = { title: "Step 4. 접근성 이득 — 태그가 공짜로 주는 ARIA 역할", desc: "시맨틱 태그의 가장 큰 실무 이득은 \"암묵적 ARIA 역할(implicit role)\"을 공짜로 얻는다는 점이다. <nav>를 쓰면 자동으로 role=\"navigation\"이 붙고, <button>은 role=\"button\" + 키보드 포커스 + 엔터/스페이스 동작까지 브라우저가 알아서 준다. 반대로 <div onclick>으로 버튼을 흉내 내면 이 모든 걸 손으로 다시 붙여야 한다 — tabindex, role, onKeyDown까지. 즉 올바른 태그를 고르는 것만으로 접근성의 90%가 해결되고, ARIA 속성은 시맨틱 태그로 표현 못 하는 나머지를 메우는 \"보조 수단\"일 뿐이다. ARIA의 제1규칙도 \"쓸 수 있는 시맨틱 태그가 있으면 ARIA 대신 그걸 써라\"이다." };
    const S5 = { title: "Step 5. 실전 — 블로그를 시맨틱으로, div는 언제 쓰나", desc: "이제 배운 걸 실제 페이지 하나에 전부 적용한다: header에 사이트 제목, nav에 메뉴, main 안에 article(글)과 그 안의 section(소주제), aside에 추천 글, footer에 저작권. 그렇다면 div는 이제 안 쓰나? 아니다 — div는 \"순수하게 레이아웃/스타일용 래퍼\"일 때 여전히 옳은 선택이다. 예를 들어 flex로 두 칸을 나누려고 감싸는 상자, 특정 영역에 padding을 주려는 컨테이너는 의미가 없으니 div(또는 span)가 정답이다. 규칙은 딱 하나: \"이 덩어리에 의미가 있으면 시맨틱 태그, 순전히 보기용이면 div\". 다음 장(I-2-2)에서는 이 구조 안을 채우는 텍스트·링크 태그 — 제목 계층(h1~h6), 문단, 리스트, 앵커(a)를 다룬다." };

        stage: "practice",
        stageLabel: "실전 마크업 + div의 올바른 자리",
        practice: {
                    "layout": [
                                {"tag":"header","label":"🏷 로고 · 사이트명","indent":0},
                                {"tag":"nav","label":"🧭 홈 · 글 · 소개","indent":0},
                                {"tag":"main","label":"📄 핵심 본문 시작","indent":0},
                                {"tag":"article","label":"📰 글 하나 (독립적)","indent":1},
                                {"tag":"section","label":"🔖 소주제 묶음","indent":2},
                                {"tag":"aside","label":"💡 추천 글 (곁다리)","indent":0},
                                {"tag":"footer","label":"© 저작권 · 연락처","indent":0}
                              ],
                    "divRules": [
                                  {"ok":true,"case":"flex/grid 레이아웃 래퍼","why":"순수 배치용 — 의미 없음"},
                                  {"ok":true,"case":"padding·배경 주는 컨테이너","why":"스타일 목적뿐"},
                                  {"ok":false,"case":"머리글·메뉴·본문 영역","why":"→ header·nav·main 써야"},
                                  {"ok":false,"case":"클릭 가능한 버튼/링크","why":"→ button·a 써야"}
                                ]
                  },
        alert: {
                 "tone": "good",
                 "text": "핵심 규칙: 의미 있으면 시맨틱 태그, 순전히 보기용이면 div. div는 죄가 없다 — \"의미 있는 곳에 div를 쓰는 것\"이 잘못일 뿐. 다음 장 I-2-2에서 텍스트·링크 태그로."
               },
        code: {...CODE.practice, highlight: [29,30]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — div 수프 vs 시맨틱 (같은 화면, 다른 속)
    // ─────────────────────────────────────────────────────
    function SoupView({ soup }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-700 mb-2 flex items-center gap-1.5">
              <span>🍲</span><span>div 수프 — 기계가 보는 것: 그냥 상자 5개</span>
            </div>
            <div className="space-y-1">
              {soup.divBlocks.map((b, i) => (
                <div key={i} className="text-[10px] font-mono rounded border border-red-200 bg-red-50 text-red-700 px-2 py-1 flex items-center gap-2">
                  <span className="opacity-60">&lt;div class="{b.cls}"&gt;</span>
                  <span className="ml-auto text-[9px] text-slate-400">의미: 없음</span>
                </div>
              ))}
            </div>
          </div>
          <div className="text-center text-orange-500 text-lg">▼ 같은 화면, 태그만 바꾸면 =</div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2 flex items-center gap-1.5">
              <span>🏷️</span><span>시맨틱 — 기계가 보는 것: 의미가 붙은 구조</span>
            </div>
            <div className="space-y-1">
              {soup.semanticBlocks.map((b, i) => (
                <div key={i} className="text-[10px] font-mono rounded border border-emerald-300 bg-emerald-50 text-emerald-900 px-2 py-1 flex items-center gap-2">
                  <span className="font-bold">&lt;{b.tag}&gt;</span>
                  <span className="text-slate-500">{b.label}</span>
                  <span className="ml-auto text-[9px] text-emerald-600">의미: 있음 ✓</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 랜드마크 골격 다이어그램
    // ─────────────────────────────────────────────────────
    function LandmarkView({ landmark }) {
      const R = landmark.regions;
      const full = (tag) => R.find((r) => r.tag === tag);
      const Block = ({ r, extra }) => (
        <div className={`rounded border-2 px-2 py-1.5 ${extra || ''}`} style={{ borderColor: r.color, backgroundColor: r.color + '14' }}>
          <div className="flex items-center gap-1.5">
            <span className="text-[11px] font-bold font-mono" style={{ color: r.color }}>&lt;{r.tag}&gt;</span>
            <span className="text-[9px] font-mono px-1 rounded" style={{ backgroundColor: r.color + '22', color: r.color }}>role={r.role}</span>
          </div>
          <div className="text-[10px] text-slate-600 mt-0.5">{r.desc}</div>
        </div>
      );
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-[11px] font-bold text-orange-800 mb-2">🧭 랜드마크 골격 — 페이지를 의미 영역으로</div>
          <div className="space-y-1.5">
            <Block r={full('header')} />
            <Block r={full('nav')} />
            <div className="flex gap-1.5 items-stretch">
              <div className="flex-[2]"><Block r={full('main')} extra="h-full" /></div>
              <div className="flex-1"><Block r={full('aside')} extra="h-full" /></div>
            </div>
            <Block r={full('footer')} />
          </div>
          <div className="mt-2 text-[9px] text-slate-500 font-mono">↑ 스크린리더는 이 목록을 열어 원하는 영역으로 바로 점프한다</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — article vs section 판별 + 콘텐츠 태그
    // ─────────────────────────────────────────────────────
    function ContentView({ content }) {
      return (
        <div className="space-y-2">
          <div className="flex gap-2 items-stretch">
            {content.compare.map((c, i) => (
              <div key={i} className="flex-1 rounded-lg border-2 bg-white p-2.5" style={{ borderColor: c.color }}>
                <div className="text-[11px] font-bold font-mono mb-1" style={{ color: c.color }}>&lt;{c.tag}&gt;</div>
                <div className="text-[10px] text-slate-700 mb-1">{c.q}</div>
                <div className="text-[9px] text-slate-500 rounded px-1.5 py-1" style={{ backgroundColor: c.color + '12' }}>예: {c.yes}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">📰 자주 쓰는 콘텐츠 태그</div>
            <div className="space-y-1">
              {content.tags.map((t, i) => (
                <div key={i} className="text-[10px] rounded border border-orange-200 bg-orange-50 px-2 py-1">
                  <span className="font-mono font-bold text-orange-900">&lt;{t.tag}&gt;</span>
                  <span className="text-slate-600 ml-1.5">{t.use}</span>
                  <div className="font-mono text-[9px] text-slate-400 mt-0.5">{t.ex}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border border-amber-300 bg-amber-50 px-2 py-1.5 text-[10px] text-amber-900">
            🔁 중첩: {content.nesting}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 스크린리더 탐색 시뮬레이션 + div vs 시맨틱 표
    // ─────────────────────────────────────────────────────
    function A11yView({ a11y }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🔊 스크린리더가 읽는 순서 (랜드마크 탐색)</div>
            <div className="space-y-1">
              {a11y.screenReader.map((s, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold text-violet-700 w-40 shrink-0">{s.landmark}</span>
                  <span className="flex-1 rounded bg-violet-50 border border-violet-200 px-2 py-1 text-slate-700 italic">{s.voice}</span>
                  {s.jump && <span className="text-[9px] text-emerald-600 shrink-0">↵ 점프가능</span>}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">♿ div 흉내 vs 시맨틱 태그</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-slate-600 border-b border-emerald-200">
                  <th className="text-left py-0.5">얻는 것</th>
                  <th className="text-left py-0.5 pl-2">div (수동)</th>
                  <th className="text-left py-0.5 pl-2">시맨틱 (공짜)</th>
                </tr>
              </thead>
              <tbody>
                {a11y.divVsSemantic.map((r, i) => (
                  <tr key={i} className="border-t border-emerald-100 align-top">
                    <td className="py-1 font-bold text-slate-700">{r.attr}</td>
                    <td className="py-1 pl-2 text-red-600 font-mono">{r.div}</td>
                    <td className="py-1 pl-2 text-emerald-700 font-mono">{r.sem} ✓</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실전 마크업 트리 + div 규칙표
    // ─────────────────────────────────────────────────────
    function PracticeView({ practice }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🛒 완성형 시맨틱 마크업 (블로그 페이지)</div>
            <div className="space-y-1">
              {practice.layout.map((l, i) => (
                <div key={i} className="flex items-center gap-1.5" style={{ marginLeft: l.indent * 16 }}>
                  {l.indent > 0 && <span className="text-orange-300 text-[10px]">└</span>}
                  <span className="text-[10px] font-mono font-bold text-orange-900 rounded bg-orange-100 border border-orange-300 px-1.5 py-0.5">&lt;{l.tag}&gt;</span>
                  <span className="text-[10px] text-slate-600">{l.label}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1.5">🧩 그럼 div는 언제? — "의미 없으면 div"</div>
            <div className="space-y-1">
              {practice.divRules.map((r, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 flex items-center gap-2 ${r.ok ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                  <span>{r.ok ? '✅' : '🚫'}</span>
                  <span className={r.ok ? 'text-emerald-900 font-bold' : 'text-red-700 font-bold'}>{r.case}</span>
                  <span className="ml-auto text-[9px] text-slate-500">{r.why}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      soup:      { icon: '🍲', label: 'div 수프' },
      landmark:  { icon: '🧭', label: '랜드마크' },
      content:   { icon: '📰', label: '콘텐츠 태그' },
      a11y:      { icon: '♿', label: '접근성' },
      practice:  { icon: '🛒', label: '실전' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.soup;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>시맨틱 태그 지도 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'soup' && <SoupView soup={state.soup} />}
          {state.stage === 'landmark' && <LandmarkView landmark={state.landmark} />}
          {state.stage === 'content' && <ContentView content={state.content} />}
          {state.stage === 'a11y' && <A11yView a11y={state.a11y} />}
          {state.stage === 'practice' && <PracticeView practice={state.practice} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-sm">HTML</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">I-2-1. 시맨틱 태그 지도</h1>
                <p className="text-sm text-orange-800/80">div만 쓰면 안 되는 이유 — 의미가 있는 태그가 접근성·SEO·유지보수를 살린다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                div는 의미 없는 상자라, 전부 div로 짜면 화면은 멀쩡해도 스크린리더·검색엔진·동료 개발자가 구조를 읽지 못한다.
                header·nav·main·aside·footer로 페이지 골격을, article·section·figure·time·mark로 본문 속을 "의미"로 채우면
                암묵적 ARIA 역할과 키보드 동작까지 공짜로 딸려온다. article은 떼어내도 독립적인 것, section은 주제로 묶은 것으로 구분한다.
                div는 죄가 없다 — 순수 레이아웃 래퍼일 때만 쓰면 된다. 다음 장 I-2-2에서는 이 구조를 채우는 텍스트·링크 태그(h1~h6·p·ul·a)를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['시맨틱', 'div수프', '랜드마크', 'header', 'nav', 'main', 'article', 'section', '접근성', '암묵적ARIA', 'SEO', '스크린리더'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
