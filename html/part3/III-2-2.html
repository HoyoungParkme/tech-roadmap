        alert: { tone: 'danger', text: '실패는 도구 탓이 아니라 "요구에 안 맞는 도구 선택" 탓. 실시간 대량→Canvas, 확대·접근성→SVG. Canvas는 접근성 대체텍스트를 반드시 별도 제공.' },
        code: {
          lang: 'javascript',
          filename: 'decide.js — 선택 로직(가이드와 동일)',
          lines: [
            '// 4가지 요구를 점수로 환산해 승자를 고른다.',
            'function decide({ manyShapes, needZoom,',
            '                  needInteract, realtimeAnim }) {',
            '  let svg = 0, canvas = 0;',
            '',
            '  // 확대·개별 상호작용/접근성 → SVG 유리',
            '  if (needZoom)     svg += 2;',
            '  if (needInteract) svg += 2;',
            '',
            '  // 대량 도형·실시간 애니메이션 → Canvas 유리',
            '  if (manyShapes)    canvas += 2;',
            '  if (realtimeAnim)  canvas += 2;',
            '',
            '  if (svg === canvas) return "상황에 따라(둘 다 가능)";',
            '  return svg > canvas ? "SVG" : "Canvas";',
            '}',
            '',
            '// 실패 사례 방지: Canvas를 쓰면 접근성 대체를 잊지 말 것',
            '//   <canvas aria-label="월 매출 추이"> 또는 인접 <table>',
          ],
          highlight: [7, 8, 11, 12, 14, 15, 18, 19],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — SVG 개념: 실제 SVG + 요소 트리
    // ─────────────────────────────────────────────────────
    function SvgConceptView({ svgTree }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-sky-800 mb-2">🖼 실제 렌더 (벡터 — 확대해도 선명)</div>
            <svg viewBox="0 0 100 60" width="100%" height="90" className="rounded border border-sky-200 bg-sky-50">
              <rect x="8" y="10" width="30" height="30" fill="#38bdf8" rx="4" />
              <circle cx="70" cy="25" r="18" fill="#E34F26" />
              <path d="M10 55 L90 55" stroke="#2b2b2b" strokeWidth="2" />
            </svg>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">🌳 요소 트리 — 도형 하나 = DOM 노드 하나</div>
            <div className="space-y-1">
              {svgTree.map((n, i) => (
                <div key={i} className="flex items-center gap-2" style={{ marginLeft: n.depth * 14 }}>
                  <span className="text-sky-400 text-[10px] select-none">{n.depth === 0 ? '▸' : '└'}</span>
                  <span className="text-[10px] font-mono px-1.5 py-0.5 rounded border bg-sky-50 border-sky-300 text-sky-900">&lt;{n.tag}&gt;</span>
                  <span className="text-[9px] text-emerald-700">{n.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — Canvas 개념: 실제 canvas + 명령 목록
    // ─────────────────────────────────────────────────────
    function CanvasConceptView({ canvasCmds }) {
      const ref = useRef(null);
      useEffect(() => {
        const c = ref.current;
        if (!c) return;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(16, 20, 60, 60);
        ctx.fillStyle = '#E34F26';
        ctx.beginPath();
        ctx.arc(140, 50, 36, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2b2b2b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(20, 110);
        ctx.lineTo(180, 110);
        ctx.stroke();
      }, []);
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">🖼 실제 렌더 (픽셀 비트맵)</div>
            <canvas ref={ref} width="200" height="120" className="w-full rounded border border-violet-200 bg-violet-50" />
            <div className="mt-1.5 text-[9px] text-violet-900">→ 화면엔 &lt;canvas&gt; 하나뿐. 위 원·사각형은 개별 요소가 아니라 "칠해진 픽셀".</div>
          </div>
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-1.5">📜 명령 목록 — 위에서 아래로 실행되고 끝</div>
            <div className="space-y-1 font-mono text-[10px]">
              {canvasCmds.map((cmd, i) => (
                <div key={i} className="flex items-center gap-2 rounded bg-violet-50 border border-violet-200 px-2 py-1 text-violet-900">
                  <span className="text-violet-400">{i + 1}</span>
                  <span>{cmd}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 성능 비교: 요소 개수 슬라이더 → SVG 노드 vs Canvas 1노드
    // ─────────────────────────────────────────────────────
    function CompareView() {
      const [count, setCount] = useState(200);
      const svgHeavy = count > 500;
      const barPct = Math.min(100, (count / 3000) * 100);
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🎚 그릴 도형 개수: <span className="font-mono">{count.toLocaleString()}</span></div>
            <input
              type="range" min="10" max="3000" step="10" value={count}
              onChange={(e) => setCount(Number(e.target.value))}
              aria-label="도형 개수 조절"
              className="w-full accent-orange-500"
            />
            <div className="flex justify-between text-[9px] text-slate-500 font-mono"><span>10</span><span>500</span><span>3,000</span></div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div className={`rounded-lg border-2 p-2.5 ${svgHeavy ? 'border-red-300 bg-red-50' : 'border-sky-300 bg-white'}`}>
              <div className="text-[10px] font-bold text-sky-800">SVG</div>
              <div className="text-[10px] text-slate-600 mb-1">DOM 노드 = <span className="font-mono font-bold">{count.toLocaleString()}</span>개</div>
              <div className="h-2 rounded-full bg-slate-200 overflow-hidden">
                <div className={`h-full ${svgHeavy ? 'bg-red-500' : 'bg-sky-400'}`} style={{ width: barPct + '%' }} />
              </div>
              <div className={`mt-1 text-[10px] font-bold ${svgHeavy ? 'text-red-700' : 'text-emerald-700'}`}>
                {svgHeavy ? '⚠️ 노드 과다 — 버벅일 수 있음' : '✓ 여유 있음'}
              </div>
            </div>
            <div className="rounded-lg border-2 border-violet-300 bg-white p-2.5">
              <div className="text-[10px] font-bold text-violet-800">Canvas</div>
              <div className="text-[10px] text-slate-600 mb-1">DOM 노드 = <span className="font-mono font-bold">1</span>개</div>
              <div className="h-2 rounded-full bg-slate-200 overflow-hidden">
                <div className="h-full bg-violet-400" style={{ width: '3%' }} />
              </div>
              <div className="mt-1 text-[10px] font-bold text-emerald-700">✓ 개수와 무관하게 가벼움</div>
            </div>
          </div>
          <div className="rounded-lg bg-amber-50 border border-amber-300 px-2.5 py-1.5 text-[10px] text-amber-900">
            대략 <b>500개</b>를 넘으면 SVG의 DOM 부담이 눈에 띈다 — 이 지점이 Canvas로 갈아탈 신호다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 문법 맛보기: 실제 SVG path + 실제 canvas arc 나란히
    // ─────────────────────────────────────────────────────
    function SyntaxView() {
      const ref = useRef(null);
      useEffect(() => {
        const c = ref.current;
        if (!c) return;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(60, 60, 40, 0, Math.PI * 2);
        ctx.stroke();
      }, []);
      return (
        <div className="grid grid-cols-2 gap-2">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-sky-800 mb-2">① SVG &lt;path&gt;</div>
            <svg viewBox="0 0 100 100" width="100%" height="100" className="rounded border border-sky-200 bg-sky-50">
              <path d="M20 80 Q50 10 80 80 Z" fill="none" stroke="#38bdf8" strokeWidth="3" />
            </svg>
            <div className="mt-1.5 text-[9px] font-mono text-slate-600">d="M20 80 Q50 10 80 80 Z"<br/>M이동 · Q곡선 · Z닫기</div>
          </div>
          <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
            <div className="text-[11px] font-bold text-violet-800 mb-2">② Canvas ctx.arc</div>
            <canvas ref={ref} width="120" height="100" className="w-full rounded border border-violet-200 bg-violet-50" />
            <div className="mt-1.5 text-[9px] font-mono text-slate-600">ctx.arc(60,60,40,0,2π)<br/>getContext→arc→stroke</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 인터랙티브 선택 가이드 (토글 + 확대 데모)
    // ─────────────────────────────────────────────────────
    function SelectionGuide({ failures }) {
      const [manyShapes, setManyShapes] = useState(false);
      const [needZoom, setNeedZoom] = useState(false);
      const [needInteract, setNeedInteract] = useState(false);
      const [realtimeAnim, setRealtimeAnim] = useState(false);
      const [zoom, setZoom] = useState(1);
      const rasterRef = useRef(null);

      // 저해상도 캔버스(40x40)에 원을 그려두고 CSS로 확대 → 픽셀 뭉개짐 시연
      useEffect(() => {
        const c = rasterRef.current;
        if (!c) return;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#a855f7';
        ctx.beginPath();
        ctx.arc(20, 20, 14, 0, Math.PI * 2);
        ctx.fill();
      }, []);

      let svg = 0, canvas = 0;
      if (needZoom) svg += 2;
      if (needInteract) svg += 2;
      if (manyShapes) canvas += 2;
      if (realtimeAnim) canvas += 2;
      const verdict = svg === canvas
        ? (svg === 0 ? '요구를 켜보세요' : '상황에 따라 (둘 다 가능)')
        : (svg > canvas ? 'SVG' : 'Canvas');
      const verdictTone = verdict === 'SVG' ? 'bg-sky-600' : verdict === 'Canvas' ? 'bg-violet-600' : 'bg-slate-500';

      const Toggle = ({ on, set, label, hint, side }) => (
        <button
          onClick={() => set(!on)}
          aria-pressed={on}
          className={`text-left rounded-lg border-2 px-2.5 py-1.5 transition ${on ? (side === 'svg' ? 'border-sky-400 bg-sky-50' : 'border-violet-400 bg-violet-50') : 'border-slate-200 bg-white'}`}
        >
          <div className="flex items-center gap-1.5">
            <span className={`w-3.5 h-3.5 rounded-sm border ${on ? (side === 'svg' ? 'bg-sky-500 border-sky-500' : 'bg-violet-500 border-violet-500') : 'border-slate-300'} flex items-center justify-center text-white text-[9px]`}>{on ? '✓' : ''}</span>
            <span className="text-[11px] font-bold text-slate-800">{label}</span>
          </div>
          <div className="text-[9px] text-slate-500 ml-5">{hint}</div>
        </button>
      );

      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🎯 요구를 토글하면 승자가 계산된다</div>
            <div className="grid grid-cols-2 gap-2">
              <Toggle on={needZoom} set={setNeedZoom} side="svg" label="확대 필요" hint="로고·지도·차트" />
              <Toggle on={needInteract} set={setNeedInteract} side="svg" label="개별 상호작용/접근성" hint="클릭·hover·스크린리더" />
              <Toggle on={manyShapes} set={setManyShapes} side="canvas" label="도형 수백~수천 개" hint="파티클·점 지도" />
              <Toggle on={realtimeAnim} set={setRealtimeAnim} side="canvas" label="실시간 애니메이션" hint="게임·60fps 루프" />
            </div>
            <div className={`mt-2.5 rounded-lg ${verdictTone} text-white px-3 py-2 flex items-center justify-between`}>
              <span className="text-[11px] font-bold">추천</span>
              <span className="text-sm font-bold">{verdict}</span>
              <span className="text-[10px] font-mono opacity-90">SVG {svg} : {canvas} Canvas</span>
            </div>
          </div>

          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🔍 확대 데모 — 벡터 vs 래스터 (배율 {zoom}×)</div>
            <input type="range" min="1" max="6" step="1" value={zoom} onChange={(e) => setZoom(Number(e.target.value))} aria-label="확대 배율 조절" className="w-full accent-orange-500 mb-2" />
            <div className="grid grid-cols-2 gap-2 items-start">
              <div className="rounded border border-sky-200 bg-sky-50 p-2 overflow-hidden">
                <div className="text-[9px] font-bold text-sky-800 mb-1">SVG (벡터) — 선명 유지</div>
                <div className="h-20 flex items-center justify-center overflow-hidden">
                  <svg width="40" height="40" viewBox="0 0 40 40" style={{ transform: `scale(${zoom})` }}>
                    <circle cx="20" cy="20" r="14" fill="#38bdf8" />
                  </svg>
                </div>
              </div>
              <div className="rounded border border-violet-200 bg-violet-50 p-2 overflow-hidden">
                <div className="text-[9px] font-bold text-violet-800 mb-1">Canvas (래스터) — 픽셀 뭉개짐</div>
                <div className="h-20 flex items-center justify-center overflow-hidden">
                  <canvas ref={rasterRef} width="40" height="40" style={{ transform: `scale(${zoom})`, imageRendering: 'pixelated' }} />
                </div>
              </div>
            </div>
          </div>

          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 실무 실패 사례</div>
            <div className="space-y-1.5">
              {failures.map((f, i) => (
                <div key={i} className="text-[10px] rounded bg-white border border-red-200 px-2 py-1">
                  <div className="font-bold text-red-700">✗ {f.bad}</div>
                  <div className="text-slate-600">→ {f.why}</div>
                  <div className="text-emerald-700">✓ 해결: {f.fix}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      svg:     { icon: '🧭', label: 'SVG · 벡터' },
      canvas:  { icon: '🎛', label: 'Canvas · 래스터' },
      compare: { icon: '⚖️', label: '성능 분기' },
      syntax:  { icon: '🔤', label: '문법 맛보기' },
      guide:   { icon: '🎯', label: '선택 가이드' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.svg;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>SVG vs Canvas — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'svg' && <SvgConceptView svgTree={state.svgTree} />}
          {state.stage === 'canvas' && <CanvasConceptView canvasCmds={state.canvasCmds} />}
          {state.stage === 'compare' && <CompareView />}
          {state.stage === 'syntax' && <SyntaxView />}
          {state.stage === 'guide' && <SelectionGuide failures={state.failures} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2.5 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-xs">Ⅲ. 구조와 임베드</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900"><span className="font-mono text-base text-orange-600">III-2-2</span> svg·canvas 언제 뭘 쓰나</h1>
                <p className="text-sm text-orange-800/80">벡터(SVG·DOM·선언형) vs 래스터(Canvas·픽셀·명령형)의 원리 차이와 선택 기준</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                SVG는 벡터·DOM·선언형이라 확대에 선명하고 도형마다 CSS·이벤트·접근성을 쓸 수 있지만, 도형이 수백을 넘으면 DOM이 무거워진다.
                Canvas는 픽셀·명령형·비트맵이라 도형을 수천 개 그려도 노드는 &lt;canvas&gt; 하나뿐이라 가볍고 실시간·GPU에 유리하지만, 개별 요소가 없어 클릭·접근성을 직접 보완해야 한다.
                선택 기준: <b>확대·상호작용·접근성이면 SVG</b>, <b>대량 도형·실시간 애니메이션·이미지 처리면 Canvas</b>. 애매하면 "각 도형을 개별로 다뤄야 하나?"를 먼저 물어라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['SVG', 'Canvas', '벡터', '래스터', 'viewBox', 'path', 'getContext', 'arc', '선언형', '명령형', 'DOM', '접근성', 'requestAnimationFrame'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: IV-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
