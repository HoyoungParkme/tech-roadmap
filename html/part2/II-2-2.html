<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 학습 — II-2-2. label·aria 접근성 기본기</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌐</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    HTML II-2-2 — label·aria 접근성 기본기
    학습 목표: 눈으로 보이는 폼과 "스크린리더가 읽는 폼"은 다르다는 사실에서 출발해,
              label 연결 → fieldset/legend 그룹 → aria-* 보강 → 에러 접근성 → 실패 사례까지
              접근성 트리(accessibility tree) 관점으로 5단계 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 접근성 속성 토글 → 스크린리더 낭독 문장 비교) / 우(VSCode CodeViewer: 접근 가능한 form HTML)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — label 연결 → 그룹 → aria 보강 → 에러 → 실패사례
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 "접근성 속성 ON/OFF"를 토글하면 스크린리더가
    //   읽는 문장이 어떻게 달라지는지(접근성 트리 관점)를 보여준다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      label: { lang: "html", filename: "signup.html — label 연결", lines: [
        "<!-- ✗ 나쁨: label 없음 → 스크린리더 \"편집창\" -->",
        "<input type=\"email\" name=\"email\" placeholder=\"이메일\">",
        "",
        "<!-- ✓ 명시적 연결 (실무 기본값) -->",
        "<label for=\"email\">이메일</label>",
        "<input type=\"email\" id=\"email\" name=\"email\">",
        "",
        "<!-- ✓ 암시적 연결 (label이 input을 감쌈) -->",
        "<label>",
        "  이메일",
        "  <input type=\"email\" name=\"email\">",
        "</label>",
        "",
        "<!--",
        "  핵심: id 는 문서에서 유일(unique) 해야 for 가",
        "  정확히 그 input 을 가리킨다.",
        "  연결되면 label 클릭 → input 포커스(클릭영역 확대).",
        "-->",
      ] },
      group: { lang: "html", filename: "checkout.html — 그룹 묶기", lines: [
        "<!-- ✗ 나쁨: 그룹 제목이 컨트롤과 연결 안 됨 -->",
        "<p>배송 방법</p>",
        "<label><input type=\"radio\" name=\"ship\" value=\"fast\"> 빠른배송</label>",
        "<label><input type=\"radio\" name=\"ship\" value=\"std\"> 일반배송</label>",
        "",
        "<!-- ✓ fieldset + legend 로 그룹화 -->",
        "<fieldset>",
        "  <legend>배송 방법</legend>",
        "",
        "  <label>",
        "    <input type=\"radio\" name=\"ship\" value=\"fast\"> 빠른배송",
        "  </label>",
        "  <label>",
        "    <input type=\"radio\" name=\"ship\" value=\"std\"> 일반배송",
        "  </label>",
        "</fieldset>",
        "",
        "<!--",
        "  legend 는 fieldset 의 첫 자식이어야 한다.",
        "  스크린리더: \"배송 방법, 그룹. 빠른배송, 라디오...\"",
        "-->",
      ] },
      aria: { lang: "html", filename: "form.html — aria 보강", lines: [
        "<!-- 아이콘 버튼: 보이는 글자가 없다 → aria-label -->",
        "<button type=\"submit\" aria-label=\"검색\">",
        "  <svg aria-hidden=\"true\"><!-- 돋보기 --></svg>",
        "</button>",
        "",
        "<!-- 이름 재사용 + 도움말 연결 + 상태 -->",
        "<span id=\"pw-label\">비밀번호</span>",
        "<input",
        "  type=\"password\"",
        "  aria-labelledby=\"pw-label\"",
        "  aria-describedby=\"pw-help\"",
        "  aria-required=\"true\"",
        "  aria-invalid=\"false\">",
        "<p id=\"pw-help\">영문·숫자 포함 8자 이상</p>",
        "",
        "<!--",
        "  aria-labelledby : 이름을 \"가리켜\" 재사용(중복 방지)",
        "  aria-describedby: 설명을 이름 뒤에 이어 읽음",
        "  aria-hidden     : 장식용 아이콘은 낭독에서 제외",
        "-->",
      ] },
      error: { lang: "html", filename: "form.html — 접근 가능한 에러", lines: [
        "<label for=\"email\">이메일</label>",
        "<input",
        "  type=\"email\"",
        "  id=\"email\"",
        "  aria-describedby=\"email-error\"",
        "  aria-invalid=\"true\">",
        "",
        "<!-- 색이 아니라 \"텍스트\"로 이유를 쓴다 -->",

          { bad: "에러를 색(빨강)으로만", why: "색각 이상·스크린리더가 실패를 놓침", fix: "텍스트 메시지 + aria-describedby + aria-invalid" },

        ],
        note: { off: "세 가지 실패는 모두 \"눈으로는 멀쩡해 보이지만\" 접근성 트리에는 이름·상태·조작 정보가 비어 있다.", on: "label·aria·네이티브 요소로 고치면 접근성 트리가 채워져, 스크린리더·키보드 사용자도 동일하게 폼을 완성할 수 있다." },
        alert: { tone: "good", text: "체크리스트: 모든 input에 연결된 label / 그룹은 fieldset·legend / 아이콘 버튼엔 aria-label / 에러는 텍스트+aria-describedby+aria-live / 커스텀보다 네이티브. 다음 장 III-1-1에서 이 폼을 CSS로 꾸민다." },

    ];

    // ─────────────────────────────────────────────────────
    // 공통 — 스크린리더 낭독 비교 카드 (OFF vs ON)
    // ─────────────────────────────────────────────────────
    function ScreenReaderAnnounce({ on, srBefore, srAfter, note }) {
      return (
        <div className="rounded-lg border-2 border-slate-700 bg-slate-900 p-3">
          <div className="text-[11px] font-bold text-slate-200 mb-2 flex items-center gap-1.5">
            <span>🔊</span><span>스크린리더가 읽는 문장 {on ? '(ON)' : '(OFF)'}</span>
          </div>
          <div className={`rounded px-3 py-2 text-[12px] font-mono border ${on ? 'bg-emerald-900/40 border-emerald-500 text-emerald-100' : 'bg-red-900/40 border-red-500 text-red-100'}`}>
            <span className="select-none mr-1">{on ? '✓' : '✗'}</span>
            "{on ? srAfter : srBefore}"
          </div>
          <div className={`mt-2 text-[10px] ${on ? 'text-emerald-300' : 'text-red-300'}`}>
            {on ? note.on : note.off}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — label ↔ input 연결 (접근성 트리 관점)
    // ─────────────────────────────────────────────────────
    function LabelLinkView({ state, on }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🔗 접근성 트리 — label과 input의 연결</div>
            <div className="flex items-center gap-2">
              <div className={`flex-1 rounded border px-2 py-1.5 text-[11px] font-mono text-center ${on ? 'bg-orange-100 border-orange-400 text-orange-900 font-bold' : 'bg-slate-100 border-slate-300 text-slate-400 line-through'}`}>
                &lt;label for="email"&gt;
              </div>
              <div className={`text-lg font-bold ${on ? 'text-emerald-500' : 'text-slate-300'}`}>{on ? '⟷' : '···'}</div>
              <div className="flex-1 rounded border px-2 py-1.5 text-[11px] font-mono text-center bg-white border-orange-300 text-orange-900">
                &lt;input id="email"&gt;
              </div>
            </div>
            <div className={`mt-2 text-center text-[10px] ${on ? 'text-emerald-700' : 'text-red-600'}`}>
              {on ? 'for="email" ↔ id="email" 로 묶임 → 이름이 input에 전달됨' : '연결 없음 → input의 접근 가능한 이름(accessible name)이 비어 있음'}
            </div>
          </div>
          <ScreenReaderAnnounce on={on} srBefore={state.srBefore} srAfter={state.srAfter} note={state.note} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — fieldset/legend 그룹
    // ─────────────────────────────────────────────────────
    function GroupView({ state, on }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">📦 radio 그룹의 접근성 구조</div>
            <div className={`rounded-lg p-2.5 ${on ? 'border-2 border-orange-400' : 'border-2 border-dashed border-slate-300'}`}>
              <div className={`text-[11px] font-bold mb-2 inline-block px-2 rounded ${on ? 'bg-orange-100 text-orange-900' : 'text-slate-400 line-through'}`}>
                {on ? '⟨legend⟩ ' + state.legend : state.legend + ' (연결 안 됨)'}
              </div>
              <div className="space-y-1">
                {state.radios.map((r, i) => (
                  <div key={i} className="flex items-center gap-2 text-[11px] text-slate-700">
                    <span className="w-3 h-3 rounded-full border-2 border-orange-400 inline-block"></span>
                    <span>{r}</span>
                    <span className="text-[9px] text-slate-400 ml-auto">radio {i + 1}/{state.radios.length}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className={`mt-2 text-center text-[10px] ${on ? 'text-emerald-700' : 'text-red-600'}`}>
              {on ? 'fieldset가 선택지를 감싸고 legend가 그룹 이름 → 함께 낭독' : '그룹 제목이 선택지와 연결되지 않음 → 문맥 손실'}
            </div>
          </div>
          <ScreenReaderAnnounce on={on} srBefore={state.srBefore} srAfter={state.srAfter} note={state.note} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — aria 속성 표
    // ─────────────────────────────────────────────────────
    function AriaView({ state, on }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🏷 aria 속성 — 이름·설명·상태 보강</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b border-orange-200">
                  <th className="text-left py-0.5">속성</th>
                  <th className="text-left py-0.5 pl-2">쓰는 상황</th>
                </tr>
              </thead>
              <tbody>
                {state.ariaRows.map((r, i) => (
                  <tr key={i} className={`border-t border-orange-100 align-top ${on ? '' : 'opacity-30 line-through'}`}>
                    <td className="py-1 font-mono text-orange-800 whitespace-nowrap pr-2">{r.attr}</td>
                    <td className="py-1 pl-2 text-slate-600">{r.use}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className={`mt-2 text-center text-[10px] ${on ? 'text-emerald-700' : 'text-red-600'}`}>
              {on ? 'aria로 이름·설명·상태가 접근성 트리에 채워짐' : 'aria 없음 → 아이콘 버튼은 "버튼", 도움말은 미연결'}
            </div>
          </div>
          <ScreenReaderAnnounce on={on} srBefore={state.srBefore} srAfter={state.srAfter} note={state.note} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 에러 접근성
    // ─────────────────────────────────────────────────────
    function ErrorView({ state, on }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🚨 검증 실패 — 어떻게 알리나</div>
            <div className="rounded p-2.5 border-2 border-red-400 bg-white">
              <div className="text-[10px] text-slate-500 mb-1">{state.errorField}</div>
              <div className="h-7 rounded border-2 border-red-500 bg-red-50 mb-1.5"></div>
              {on ? (
                <div className="text-[11px] text-red-700 font-bold flex items-center gap-1">
                  <span>⚠️</span><span>{state.errorMsg}</span>
                  <span className="ml-auto text-[9px] font-mono text-slate-400">aria-describedby</span>
                </div>
              ) : (
                <div className="text-[10px] text-slate-400 italic">(텍스트 메시지 없음 — 빨간 테두리 색만)</div>
              )}
            </div>
            <div className="mt-2 grid grid-cols-2 gap-1 text-[9px]">
              {['색', '텍스트', 'aria-describedby', 'aria-live'].map((k, i) => {
                const active = on || i === 0; // OFF일 때는 '색'만 켜짐
                return (
                  <div key={k} className={`rounded px-1.5 py-1 border text-center font-mono ${active ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-red-50 border-red-200 text-red-500 line-through'}`}>
                    {active ? '✓' : '✗'} {k}
                  </div>
                );
              })}
            </div>
            <div className={`mt-2 text-center text-[10px] ${on ? 'text-emerald-700' : 'text-red-600'}`}>
              {on ? '색+텍스트+연결+실시간 = 네 겹 모두 → 누구나 실패를 인지' : '색 한 겹뿐 → 색각 이상·스크린리더 사용자는 무음'}
            </div>
          </div>
          <ScreenReaderAnnounce on={on} srBefore={state.srBefore} srAfter={state.srAfter} note={state.note} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실패 사례 3종
    // ─────────────────────────────────────────────────────
    function PitfallsView({ state, on }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">⚠️ 흔한 실패 3종 {on ? '→ 수정' : ''}</div>
            <div className="space-y-2">
              {state.pitfalls.map((p, i) => (
                <div key={i} className={`rounded border-2 p-2 ${on ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                  <div className="flex items-center gap-1.5 text-[11px] font-bold">
                    <span>{on ? '✅' : '🚫'}</span>
                    <span className={on ? 'text-emerald-800' : 'text-red-700'}>{on ? p.fix : p.bad}</span>
                  </div>
                  <div className="text-[10px] text-slate-600 mt-0.5 pl-5">{on ? '고침 · 접근성 트리 채워짐' : p.why}</div>
                </div>
              ))}
            </div>
          </div>
          <ScreenReaderAnnounce on={on} srBefore={state.srBefore} srAfter={state.srAfter} note={state.note} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 접근성 속성 ON/OFF 토글 + stage별 시각화
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      label:    { icon: '🔗', label: 'label 연결' },
      group:    { icon: '📦', label: 'fieldset 그룹' },
      aria:     { icon: '🏷', label: 'aria 보강' },
      error:    { icon: '🚨', label: '에러 접근성' },
      pitfalls: { icon: '⚠️', label: '실패 사례' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.label;
      // 단계가 바뀌면 항상 OFF(문제 상태)에서 시작해 대비를 보여준다
      const [on, setOn] = useState(false);
      useEffect(() => { setOn(false); }, [state.stage]);

      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>접근성 트리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>

          {/* 접근성 속성 토글 스위치 */}
          <button
            onClick={() => setOn((v) => !v)}
            aria-pressed={on}
            aria-label={`${state.toggleLabel} ${on ? '끄기' : '켜기'}`}
            className={`mb-3 flex items-center justify-between rounded-lg border-2 px-3 py-2 transition ${on ? 'bg-emerald-50 border-emerald-400' : 'bg-red-50 border-red-300'}`}
          >
            <span className={`text-[11px] font-bold ${on ? 'text-emerald-800' : 'text-red-700'}`}>
              {state.toggleLabel}: {on ? 'ON (접근 가능)' : 'OFF (문제 상태)'}
            </span>
            <span className={`w-9 h-5 rounded-full relative transition ${on ? 'bg-emerald-500' : 'bg-slate-300'}`}>
              <span className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-all ${on ? 'left-4' : 'left-0.5'}`}></span>
            </span>
          </button>

          {state.stage === 'label' && <LabelLinkView state={state} on={on} />}
          {state.stage === 'group' && <GroupView state={state} on={on} />}
          {state.stage === 'aria' && <AriaView state={state} on={on} />}
          {state.stage === 'error' && <ErrorView state={state} on={on} />}
          {state.stage === 'pitfalls' && <PitfallsView state={state} on={on} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-sm">HTML</span>
              <div>
                <div className="text-[11px] font-bold text-orange-700 mb-0.5">Ⅱ. 폼 — 데이터를 서버로 · II-2-2</div>
                <h1 className="text-2xl font-bold text-orange-900">label·aria 접근성 기본기</h1>
                <p className="text-sm text-orange-800/80">label 연결·fieldset/legend·aria-*·에러 연결로 스크린리더가 읽을 수 있는 폼 만들기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 토글로 ON/OFF 비교</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                눈에 보이는 폼과 스크린리더가 읽는 폼은 다르다. 모든 input에는 연결된 &lt;label&gt;을, radio·checkbox 그룹에는 &lt;fieldset&gt;+&lt;legend&gt;를 붙인다.
                보이는 글자가 없으면 aria-label로 이름을, 도움말·에러는 aria-describedby로 필드에 연결하고, 상태는 aria-required·aria-invalid로 알린다.
                에러는 색만이 아니라 텍스트+연결+aria-live로 안내한다. placeholder는 label의 대체가 아니고, 커스텀 컨트롤보다 네이티브 요소가 먼저다.
                다음 장 III-1-1에서는 이 폼을 CSS로 실제로 꾸민다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['접근성', 'label', 'for-id', 'fieldset', 'legend', 'aria-label', 'aria-describedby', 'aria-invalid', 'aria-live', '스크린리더'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
