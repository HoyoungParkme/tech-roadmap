<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 학습 — II-1-1. form 동작 원리 (GET vs POST)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📮</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    HTML II-1-1 — form 동작 원리 (GET vs POST)
    학습 목표: <form>이 name=value를 어떻게 수집·인코딩해 HTTP 요청으로 만드는지,
              method(GET/POST)와 enctype에 따라 "요청 라인·헤더·바디"가 실제로 어떻게
              달라지는지를 인터랙티브하게 추적한다. 실무 실패 사례(비밀번호 URL 노출,
              파일 업로드 enctype 누락, POST 새로고침 재제출/PRG)까지 5단계로 다룬다.
    패턴: fastapi v1 — 좌(LiveDataPane: method/enctype 토글 → 실시간 HTTP 요청 시각화)
                       / 우(VSCode CodeViewer: 실전 HTML form + FastAPI 수신 코드)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 제출 흐름 → GET → POST → enctype → 실무 함정/PRG
    //   각 STEP = { title, desc, stage, 좌측 패널 기본값(method/enctype/action/fields),
    //               우측 code 하이라이트 }
    //   좌측 LiveDataPane 은 method/enctype 를 토글하면 실제 만들어지는
    //   HTTP 요청(요청라인·헤더·바디)을 실시간으로 다시 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      login: { lang: "html", filename: "login.html — 로그인 form", lines: [
        "<!-- form의 세 축: action · method · enctype -->",
        "<form action=\"/login\" method=\"post\">",
        "",
        "  <label>이메일",
        "    <input type=\"email\" name=\"email\" />",
        "  </label>",
        "",
        "  <label>비밀번호",
        "    <input type=\"password\" name=\"password\" />",
        "  </label>",
        "",
        "  <!-- name 없는 입력 → 전송 목록에서 제외됨 -->",
        "  <input type=\"text\" placeholder=\"메모(전송 안 됨)\" />",
        "",
        "  <button type=\"submit\">로그인</button>",
        "</form>",
        "",
        "<!--",
        "  제출 시 브라우저가 하는 일:",
        "  1) name 있는 입력만 수집 → [email=..., password=...]",
        "  2) enctype 규칙으로 인코딩",
        "  3) method(post)로 /login 에 요청 전송",
        "-->",
      ] },
      search: { lang: "html", filename: "search.html — 검색 form (GET이 적합)", lines: [
        "<!-- 조회/검색 = 읽기 전용 → GET 이 정석 -->",
        "<form action=\"/search\" method=\"get\">",
        "  <input type=\"search\" name=\"q\"    value=\"노트북\" />",
        "  <input type=\"number\" name=\"page\" value=\"2\" />",
        "  <button>검색</button>",
        "</form>",
        "",
        "<!--",
        "  제출 결과 (브라우저가 만드는 요청):",
        "    GET /search?q=%EB%85%B8%ED%8A%B8%EB%B6%81&page=2",
        "",
        "  → 이 요청 전체가 하나의 URL 이다:",
        "    · 북마크/공유/캐시 가능",
        "    · 새로고침해도 안전(멱등·부수효과 없음)",
        "    · 뒤로가기 눌러도 재제출 경고 없음",
        "",
        "  왜 로그인은 GET 이면 안 되나?",
        "    GET /login?password=hunter2   ← 주소창·로그에 그대로",
        "    → 비밀번호가 히스토리/접근로그에 평문으로 박힌다.",
        "-->",
      ] },
      post: { lang: "python", filename: "main.py — FastAPI로 POST 받기", lines: [
        "from fastapi import FastAPI, Form",
        "",
        "app = FastAPI()",
        "",
        "# form 필드는 Form(...) 으로 받는다",
        "# (JSON 이 아니라 x-www-form-urlencoded 바디)",
        "@app.post(\"/login\")",
        "def login(email: str = Form(...),",
        "          password: str = Form(...)):",
        "    # 여기서 인증 → 세션/토큰 발급 (부수효과!)",
        "    if not verify(email, password):",
        "        # 실패 응답",
        "        return {\"ok\": False}",
        "    # 성공: 곧바로 데이터를 응답하지 말고",
        "    # 리다이렉트하라 → 새로고침 이중제출 방지 (PRG)",
        "    return RedirectResponse(\"/dashboard\", status_code=303)",
        "",

          good: ["① POST /order", "② 303 See Other → Location: /order/ok", "③ 브라우저가 GET /order/ok 재요청"],
        },
        alert: { tone: "good", text: "303 See Other 는 \"결과는 다른 주소에서 GET 으로 받아 가라\"는 뜻이다. PRG 의 핵심 코드다." },
        code: { ...CODE.prg, highlight: [15, 16, 17, 18] },
      },
      { ...S5,
        beat: {
          label: "도착지는 안전한 GET",
          at: "main.py L21–23",
          caption: "리다이렉트가 도착하는 곳은 GET 핸들러다. 새로고침해도 이 GET 만 반복되어 중복이 사라진다.",
          changes: [
            { mark: "new", text: "GET /order/{id}/ok" },
            { mark: "gone", text: "이중 결제" },
          ],
        },
        actor: "🗺 GET/POST 선택 · enctype · PRG · 서버 검증",
        stage: "map",
        stageLabel: "form 실무 결정 지도",
        method: "POST",
        enctype: "application/x-www-form-urlencoded",
        action: "/order",
        decision: {
          rows: [
            { q: "서버 상태를 바꾸나?", no: "아니오 → GET (검색·필터·조회)", yes: "예 → POST (로그인·결제·글쓰기)" },
            { q: "비밀번호·개인정보?", no: "노출 무관 → GET 가능", yes: "반드시 POST (URL 노출 금지)" },
            { q: "파일을 올리나?", no: "urlencoded 기본값", yes: "POST + multipart/form-data" },
            { q: "POST 후 새로고침?", no: "문제 없음", yes: "PRG — 303 리다이렉트로 방지" },
          ],
        },
        prg: {
          bad: ["① POST /order", "② 서버가 결과 HTML 직접 응답", "③ 새로고침 → 같은 POST 재전송", "④ 💥 이중 결제"],
          good: [
            "① POST /order",
            "② 303 See Other → Location: /order/ok",
            "③ 브라우저가 GET /order/ok 재요청",
            "④ 새로고침해도 안전한 GET 반복",
          ],
        },
        alert: {
          tone: "good",
          text: "PRG = Post → Redirect(303) → Get. POST 처리 후 리다이렉트하면 새로고침의 마지막 요청이 안전한 GET이 되어 중복 제출이 사라진다. 그리고 프런트 검증은 편의, 서버 검증이 진짜 방어선. 다음 장 II-1-2로.",
        },
        code: { ...CODE.prg, highlight: [21, 22, 23] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 요청 빌더 — method/enctype/action + 필드값으로 실제 HTTP 요청 문자열 생성
    //   GET: 값이 URL 쿼리스트링에 · 바디 없음
    //   POST + urlencoded: 바디에 key=value&…
    //   POST + multipart: 바디를 boundary 파트로
    //   text/plain: key=value 를 줄바꿈으로(거의 인코딩 안 함)
    // ─────────────────────────────────────────────────────
    const FILE_FIELD = 'avatar';
    const FILE_VALUE = 'cat.png';

    // application/x-www-form-urlencoded 인코딩 (공백 → +)
    const urlEncode = (k, v) =>
      encodeURIComponent(k).replace(/%20/g, '+') + '=' + encodeURIComponent(v).replace(/%20/g, '+');

    function buildRequest(method, enctype, action, fields) {
      const entries = Object.entries(fields);
      const isGet = method === 'GET';
      const hasFile = entries.some(([k]) => k === FILE_FIELD);

      if (isGet) {
        // GET 은 enctype 을 무시하고 항상 쿼리스트링. 파일은 이름만 실린다.
        const qs = entries.map(([k, v]) => urlEncode(k, v)).join('&');
        return {
          requestLine: `GET ${action}?${qs} HTTP/1.1`,
          headers: [['Host', 'shop.example.com']],
          body: null,
          bodyNote: '바디 없음 — 값은 위 URL(쿼리스트링)에 모두 노출됨',
          exposeInUrl: true,
          fileWarn: hasFile ? 'GET은 파일 내용을 못 보낸다 — 파일명만 URL에 붙음' : null,
        };
      }

      // POST
      if (enctype === 'multipart/form-data') {
        const boundary = '----WebKitFormBoundaryAbC123';
        const parts = [];
        entries.forEach(([k, v]) => {
          if (k === FILE_FIELD) {
            parts.push(`--${boundary}`);
            parts.push(`Content-Disposition: form-data; name="${k}"; filename="${v}"`);
            parts.push('Content-Type: image/png');
            parts.push('');
            parts.push('<…실제 PNG 바이트 4837개…>');
          } else {
            parts.push(`--${boundary}`);
            parts.push(`Content-Disposition: form-data; name="${k}"`);
            parts.push('');
            parts.push(v);
          }
        });
        parts.push(`--${boundary}--`);
        const bodyStr = parts.join('\n');
        return {
          requestLine: `POST ${action} HTTP/1.1`,
          headers: [
            ['Host', 'shop.example.com'],
            ['Content-Type', `multipart/form-data; boundary=${boundary}`],
            ['Content-Length', String(bodyStr.length + 4700)],
          ],
          body: bodyStr,
          bodyNote: '각 파트에 이름/파일명 + 원본 바이트 → 파일 업로드 가능',
          exposeInUrl: false,
          fileWarn: null,
        };
      }

      if (enctype === 'text/plain') {
        const bodyStr = entries.map(([k, v]) => `${k}=${v}`).join('\n');
        return {
          requestLine: `POST ${action} HTTP/1.1`,
          headers: [
            ['Host', 'shop.example.com'],
            ['Content-Type', 'text/plain'],
            ['Content-Length', String(bodyStr.length)],
          ],
          body: bodyStr,
          bodyNote: '인코딩 거의 없음 → 디버깅용, 실무 전송엔 부적합',
          exposeInUrl: false,
          fileWarn: hasFile ? 'text/plain은 파일 바이너리를 못 담는다' : null,
        };
      }

      // application/x-www-form-urlencoded (기본)
      const bodyStr = entries
        .map(([k, v]) => urlEncode(k, k === FILE_FIELD ? v : v))
        .join('&');
      return {
        requestLine: `POST ${action} HTTP/1.1`,
        headers: [
          ['Host', 'shop.example.com'],
          ['Content-Type', 'application/x-www-form-urlencoded'],
          ['Content-Length', String(bodyStr.length)],
        ],
        body: bodyStr,
        bodyNote: '짧은 텍스트에 적합 — 파일이 있으면 이름만 실린다',
        exposeInUrl: false,
        fileWarn: hasFile ? 'urlencoded는 파일 내용을 못 담아 이름만 전송됨' : null,
      };
    }

    // ─────────────────────────────────────────────────────
    // HTTP 요청 카드 — 요청라인/헤더/바디를 색으로 구분
    // ─────────────────────────────────────────────────────
    function HttpRequestCard({ req, secret }) {
      return (
        <div className="rounded-lg border-2 border-slate-700 bg-[#282c34] p-3 font-mono text-[11px] leading-5 overflow-auto">
          <div className="text-slate-400 text-[9px] mb-1.5">↑ 브라우저가 서버로 보내는 실제 요청</div>
          {/* 요청 라인 */}
          <div className={`px-2 py-1 rounded ${req.exposeInUrl ? 'bg-red-500/20 border border-red-500/40' : 'bg-orange-400/15 border border-orange-400/40'}`}>
            <span className="text-emerald-300 font-bold">{req.requestLine.split(' ')[0]}</span>
            <span className={req.exposeInUrl ? 'text-red-300' : 'text-sky-300'}> {req.requestLine.split(' ').slice(1, -1).join(' ')}</span>
            <span className="text-slate-500"> {req.requestLine.split(' ').slice(-1)}</span>
          </div>
          {/* 헤더 */}
          <div className="mt-1.5">
            {req.headers.map(([k, v], i) => (
              <div key={i} className="whitespace-pre-wrap break-all">
                <span className="text-purple-300">{k}</span>
                <span className="text-slate-500">: </span>
                <span className="text-amber-200">{v}</span>
              </div>
            ))}
          </div>
          {/* 바디 */}
          {req.body !== null ? (
            <div className="mt-2">
              <div className="text-slate-500 text-[9px] mb-0.5">─ 빈 줄 뒤 = 요청 바디(body) ─</div>
              <pre className="whitespace-pre-wrap break-all text-emerald-200 bg-black/20 rounded p-1.5">{req.body}</pre>
            </div>
          ) : (
            <div className="mt-2 text-slate-500 text-[10px] italic">(요청 바디 없음)</div>
          )}
          <div className={`mt-2 text-[10px] rounded px-2 py-1 ${req.exposeInUrl ? 'bg-red-500/15 text-red-200' : 'bg-slate-700/50 text-slate-300'}`}>
            {req.exposeInUrl ? '🔓 ' : 'ℹ️ '}{req.bodyNote}
          </div>
          {req.exposeInUrl && secret && (
            <div className="mt-1 text-[10px] rounded px-2 py-1 bg-red-600/25 text-red-100 border border-red-500/40">
              🚨 위 URL 안에 <b>{secret}</b> 이(가) 평문으로 노출됨 → 히스토리·접근로그에 그대로 기록
            </div>
          )}
          {req.fileWarn && (
            <div className="mt-1 text-[10px] rounded px-2 py-1 bg-amber-500/20 text-amber-100 border border-amber-500/40">
              ⚠️ {req.fileWarn}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 토글 버튼 (aria-pressed 로 상태 표시)
    // ─────────────────────────────────────────────────────
    function Toggle({ options, value, onChange, labelPrefix }) {
      return (
        <div className="flex gap-1 flex-wrap">
          {options.map((opt) => {
            const active = opt.value === value;
            return (
              <button
                key={opt.value}
                onClick={() => onChange(opt.value)}
                aria-pressed={active}
                aria-label={`${labelPrefix} ${opt.label}`}
                className={`px-2.5 py-1 text-[11px] rounded border font-bold transition ${active
                  ? 'bg-[#E34F26] text-white border-orange-600'
                  : 'bg-white text-orange-800 border-orange-300 hover:bg-orange-50'}`}
              >{opt.label}</button>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 결정 지도 + PRG 비교
    // ─────────────────────────────────────────────────────
    function DecisionMap({ decision, prg }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🧭 GET vs POST · enctype 결정 지도</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b border-orange-200">
                  <th className="text-left py-0.5">질문</th>
                  <th className="text-left py-0.5 pl-2">아니오</th>
                  <th className="text-left py-0.5 pl-2">예</th>
                </tr>
              </thead>
              <tbody>
                {decision.rows.map((r, i) => (
                  <tr key={i} className="border-t border-orange-100 align-top">
                    <td className="py-1 font-bold text-slate-700">{r.q}</td>
                    <td className="py-1 pl-2 text-sky-700">{r.no}</td>
                    <td className="py-1 pl-2 text-orange-700 font-bold">{r.yes}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">🔁 PRG 패턴 — 이중 제출 막기</div>
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded border border-red-300 bg-red-50 p-2">
                <div className="text-[10px] font-bold text-red-700 mb-1">❌ PRG 없이</div>
                <ol className="space-y-0.5">
                  {prg.bad.map((s, i) => (
                    <li key={i} className="text-[10px] text-red-800 font-mono">{s}</li>
                  ))}
                </ol>
              </div>
              <div className="rounded border border-emerald-300 bg-emerald-50 p-2">
                <div className="text-[10px] font-bold text-emerald-700 mb-1">✅ PRG 적용</div>
                <ol className="space-y-0.5">
                  {prg.good.map((s, i) => (
                    <li key={i} className="text-[10px] text-emerald-800 font-mono">{s}</li>
                  ))}
                </ol>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — method/enctype 토글 → 실시간 HTTP 요청 (orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      flow:    { icon: '📮', label: '제출 흐름' },
      get:     { icon: '🔗', label: 'GET 전송' },
      post:    { icon: '📦', label: 'POST 전송' },
      enctype: { icon: '🧬', label: 'enctype' },
      map:     { icon: '🗺', label: '결정 지도' },
    };

    // 단계별 기본 필드셋 (검색 단계는 q/page, 업로드 단계는 파일 포함)
    function fieldsForStep(stage) {
      if (stage === 'get') return { q: '노트북', page: '2' };
      if (stage === 'enctype') return { title: '내 고양이', avatar: FILE_VALUE };
      if (stage === 'map') return { item: 'SSD-1TB', qty: '2' };
      return { email: 'alice@shop.com', password: 'hunter2' };
    }

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.flow;
      const [method, setMethod] = useState(state.method);
      const [enctype, setEnctype] = useState(state.enctype);

      // 단계가 바뀌면 그 단계의 권장 기본값으로 토글 동기화
      useEffect(() => {
        setMethod(state.method);
        setEnctype(state.enctype);
      }, [state.stage]);

      const fields = fieldsForStep(state.stage);
      const req = useMemo(
        () => buildRequest(method, enctype, state.action, fields),
        [method, enctype, state.action, state.stage]
      );
      // 비밀번호 등 민감값이 URL 에 실렸는지
      const secret = fields.password ? `password=${fields.password}` : null;

      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>form → HTTP 요청 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>

          {state.stage === 'map' ? (
            <DecisionMap decision={state.decision} prg={state.prg} />
          ) : (
            <div className="space-y-3">
              {/* 인터랙티브 토글 */}
              <div className="rounded-lg border-2 border-orange-300 bg-orange-50 p-2.5 space-y-2">
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold text-orange-800 w-16">method</span>
                  <Toggle
                    labelPrefix="method"
                    value={method}
                    onChange={setMethod}
                    options={[{ value: 'GET', label: 'GET' }, { value: 'POST', label: 'POST' }]}
                  />
                </div>
                <div className="flex items-start gap-2">
                  <span className="text-[10px] font-bold text-orange-800 w-16 pt-1">enctype</span>
                  <Toggle
                    labelPrefix="enctype"
                    value={enctype}
                    onChange={setEnctype}
                    options={[
                      { value: 'application/x-www-form-urlencoded', label: 'urlencoded' },
                      { value: 'multipart/form-data', label: 'multipart' },
                      { value: 'text/plain', label: 'text/plain' },
                    ]}
                  />
                </div>
                <div className="text-[9px] text-orange-700">
                  같은 입력이지만 토글에 따라 아래 요청이 실시간으로 바뀐다
                  {method === 'GET' && <span className="text-red-600 font-bold"> · GET은 enctype 무시(항상 쿼리스트링)</span>}
                </div>
                {/* 입력값 미리보기 */}
                <div className="flex flex-wrap gap-1 pt-1 border-t border-orange-200">
                  {Object.entries(fields).map(([k, v]) => (
                    <span key={k} className={`text-[9px] font-mono rounded px-1.5 py-0.5 border ${k === 'password' ? 'bg-red-50 border-red-300 text-red-700' : k === FILE_FIELD ? 'bg-sky-50 border-sky-300 text-sky-700' : 'bg-white border-orange-200 text-orange-800'}`}>
                      {k}={v}{k === FILE_FIELD ? ' 📎' : ''}
                    </span>
                  ))}
                </div>
              </div>

              {/* 실시간 요청 */}
              <HttpRequestCard req={req} secret={secret} />
            </div>
          )}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-[11px] text-center leading-tight">Ⅱ. 폼<br/>데이터 전송</span>
              <div>
                <div className="text-[11px] text-orange-700 font-bold mb-0.5">Ⅱ. 폼 — 데이터를 서버로 · II-1-1</div>
                <h1 className="text-2xl font-bold text-orange-900">form 동작 원리 (GET vs POST)</h1>
                <p className="text-sm text-orange-800/80">form이 데이터를 어떻게 인코딩해 서버로 보내는가 — GET·POST·enctype의 실무 기준</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 토글로 method/enctype 직접 실험</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                form은 name=value를 모아 HTTP 요청으로 직렬화한다. 읽기(검색·조회)는 GET으로 URL 쿼리스트링에,
                상태를 바꾸는 작업(로그인·결제·글쓰기)은 POST로 바디에 담는다. 비밀번호·개인정보는 URL·로그에 남으므로 GET 금지.
                파일 업로드는 POST + enctype="multipart/form-data" 세트가 필수다(안 붙이면 파일명만 전송). POST의 이중 제출은
                PRG(303 리다이렉트)로 막고, 프런트 검증은 편의일 뿐 최종 방어선은 서버 검증이다.
                다음 장 II-1-2에서는 이 name=value가 서버에서 어떻게 파싱·검증되는지를 이어서 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['form', 'GET', 'POST', '쿼리스트링', 'enctype', 'urlencoded', 'multipart', '멱등성', 'PRG', '서버검증'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
