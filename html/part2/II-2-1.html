  <div id="root"></div>

  <!--
    HTML 폼 II-2-1 — 브라우저 내장 유효성 검증 (Constraint Validation)
    학습 목표: required·pattern·min/max·type 같은 속성만으로 JS 없이 입력을 검증하고,
              :invalid/:user-invalid 로 스타일링하며, Constraint Validation API
              (checkValidity·reportValidity·setCustomValidity·validity 객체)로
              디자인에 맞는 커스텀 검증까지 만든다.
    패턴: fastapi v1 — 좌(LiveDataPane: 실시간 입력 → validity 객체 시뮬레이션 + 제출 포커스)
                       우(VSCode CodeViewer: signup.html + form.css + validate.js)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────
    // 검증 엔진 — 브라우저 Constraint Validation 을 순수 함수로 재현
    //   각 필드 규칙에 따라 validity 객체(valueMissing·typeMismatch…)와
    //   validationMessage 를 계산한다. 실제 브라우저 동작과 동일한 우선순위.
    // ─────────────────────────────────────────────────────
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const URL_RE = /^https?:\/\/[^\s.]+\.[^\s]+$/;

    const FIELDS = [
      { name: 'email',    label: '이메일',   type: 'email',  required: true,  attrs: 'type="email" required' },
      { name: 'username', label: '아이디',   type: 'text',   required: true,  minlength: 3, pattern: '[a-z0-9_]+',
        attrs: 'required minlength="3" pattern="[a-z0-9_]+"' },
      { name: 'age',      label: '나이',     type: 'number', required: true,  min: 18, max: 99,
        attrs: 'type="number" required min="18" max="99"' },
      { name: 'website',  label: '홈페이지', type: 'url',    required: false, attrs: 'type="url"  (선택)' },
    ];

    // 빈 validity — 모든 제약을 통과한 상태
    const OK = { valueMissing: false, typeMismatch: false, patternMismatch: false, tooShort: false, rangeUnderflow: false, rangeOverflow: false, badInput: false };

    function validateField(field, raw) {
      const value = raw == null ? '' : String(raw);
      const v = { ...OK };
      // 1) required — 값 자체가 비었는지 (다른 무엇보다 먼저)
      if (field.required && value.trim() === '') v.valueMissing = true;

      // 값이 있을 때만 형식 제약을 따진다 (브라우저와 동일: 빈 선택 필드는 valid)
      if (value.trim() !== '') {
        if (field.type === 'email' && !EMAIL_RE.test(value)) v.typeMismatch = true;
        if (field.type === 'url' && !URL_RE.test(value)) v.typeMismatch = true;
        if (field.pattern && !new RegExp('^(?:' + field.pattern + ')$').test(value)) v.patternMismatch = true;
        if (field.minlength && value.length < field.minlength) v.tooShort = true;
        if (field.type === 'number') {
          const n = Number(value);
          if (Number.isNaN(n)) v.badInput = true;
          else {
            if (field.min != null && n < field.min) v.rangeUnderflow = true;
            if (field.max != null && n > field.max) v.rangeOverflow = true;
          }
        }
      }
      const valid = !Object.values(v).some(Boolean);
      return { ...v, valid, message: valid ? '' : messageFor(field, v) };
    }

    // 브라우저 기본 말풍선과 비슷한 한국어 메시지 (validity 우선순위대로)
    function messageFor(field, v) {
      if (v.valueMissing) return '이 필드를 입력해 주세요.';
      if (v.badInput) return '숫자를 입력해 주세요.';
      if (v.typeMismatch) return field.type === 'email' ? "'@'를 포함한 이메일 형식이 아닙니다." : 'http(s):// 로 시작하는 URL이 아닙니다.';
      if (v.tooShort) return `${field.minlength}자 이상 입력해 주세요.`;
      if (v.patternMismatch) return '요청한 형식과 일치하지 않습니다.';
      if (v.rangeUnderflow) return `${field.min} 이상이어야 합니다.`;
      if (v.rangeOverflow) return `${field.max} 이하여야 합니다.`;
      return '값이 올바르지 않습니다.';
    }

    // 각 validity 플래그의 사람이 읽는 라벨
    const FLAG_LABEL = {
      valueMissing: 'valueMissing',
      typeMismatch: 'typeMismatch',
      patternMismatch: 'patternMismatch',
      tooShort: 'tooShort',
      rangeUnderflow: 'rangeUnderflow',
      rangeOverflow: 'rangeOverflow',
      badInput: 'badInput',
    };

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        stage: 'attrs',
        title: 'Step 1. 속성 하나로 검증이 켜진다 — Constraint Validation',
        desc: 'HTML5는 입력 검증을 JavaScript 없이 태그 속성만으로 켤 수 있게 만들었다. required(필수)·minlength/maxlength(길이)·min/max/step(숫자 범위)·pattern(정규식)·type="email"/"url"을 붙이는 순간, 브라우저가 그 필드에 "제약(constraint)"을 걸고 값을 자동으로 검사한다. 이 내장 검증을 Constraint Validation이라 부르며, 스크립트를 한 줄도 안 짜도 제출을 막아 준다. 왼쪽 폼에 직접 입력해 보면 각 필드가 required·type·pattern 같은 제약을 갖고 있음을 볼 수 있다 — 이 속성들이 다음 단계에서 validity 상태로 바뀐다.',
        actor: '📝 <form> — 4개 필드에 내장 제약이 걸려 있다',
        alert: { tone: 'info', text: '검증 로직을 JS로 짜기 전에, 먼저 HTML 속성으로 표현할 수 있는지 보라. required·type·min/max·pattern 만으로 대부분의 기본 검증이 공짜로 끝난다.' },
        focus: 'attrs',
        code: {
          lang: 'html', filename: 'signup.html — 내장 제약 속성',
          lines: [

            '  <label>이메일',
            '    <input name="email" type="email" required />',
            '  </label>',
            '',
            '  <label>아이디',
            '    <input name="username" required',
            '           minlength="3" pattern="[a-z0-9_]+" />',
            '  </label>',
            '',
            '  <label>나이',
            '    <input name="age" type="number"',
            '           required min="18" max="99" />',
            '  </label>',
            '',
            '  <label>홈페이지 (선택)',
            '    <input name="website" type="url" />',
            '  </label>',
            '',
            '  <button type="submit">가입</button>',
            '</form>',
            '',
            '<!--',
            '  required        : 빈 값이면 제출 차단',
            '  type=email/url  : 형식이 맞아야 통과',
            '  minlength=3     : 3자 미만이면 tooShort',
            '  pattern=...     : 정규식 불일치면 patternMismatch',
            '  min/max         : 범위를 벗어나면 rangeUnder/Overflow',
            '-->',
          ],
          highlight: [4, 8, 9, 13, 14, 18],
        },
      },
      {
        stage: 'pseudo',
        title: 'Step 2. :valid / :invalid — CSS 의사클래스로 스타일링',
        desc: '제약이 걸린 필드는 값 상태에 따라 CSS 의사클래스를 자동으로 얻는다: 조건을 만족하면 :valid, 어기면 :invalid, required가 붙었으면 :required가 항상 매칭된다. 덕분에 border-color: red 한 줄로 잘못된 필드를 빨갛게 칠할 수 있다 — 여기까지도 JS는 없다. 그런데 함정이 하나 있다: :invalid는 "페이지가 열리는 순간부터" 빈 필수 필드에 매칭돼서, 사용자가 아무것도 안 했는데 폼이 온통 빨갛게 된다. 그래서 최신 브라우저는 :user-invalid를 제공한다 — 사용자가 그 필드를 건드리고(blur) 나서야 빨개진다. 왼쪽 폼에서 아직 안 만진 필드는 회색, 건드린 뒤 틀리면 빨강으로 바뀌는 것을 확인해 보라.',
        actor: '🎨 :valid ✅ / :invalid ❌ / :user-invalid 🕗',
        alert: { tone: 'warn', text: ':invalid 는 로드 직후부터 빈 required 필드를 빨갛게 만든다(사용자는 아직 아무 것도 안 했는데!). 실무에서는 :user-invalid 를 쓰거나, JS로 "touched" 상태를 관리해 건드린 뒤에만 빨갛게 하라.' },
        focus: 'pseudo',
        code: {
          lang: 'css', filename: 'form.css — 검증 의사클래스',
          lines: [
            '/* 값이 조건을 만족하면 자동으로 :valid,',
            '   어기면 :invalid 가 매칭된다 — JS 불필요 */',
            '',
            'input:valid {',
            '  border-color: #10b981;   /* emerald: 통과 */',
            '}',
            '',
            'input:invalid {',

            '}',
            '',
            'input:required {',

            '  background: #fffbeb;',
            '}',
            '',
            '/* ⚠️ 함정: :invalid 는 로드 직후부터 빨개진다',
            '   → 사용자가 아직 아무 것도 안 했는데 온통 빨강 */',
            '',
            '/* ✅ 해법: :user-invalid — 사용자가 필드를',
            '   건드리고(blur) 나서야 매칭된다 */',
            'input:user-invalid {',
            '  border-color: #ef4444;',
            '  background: #fef2f2;',

            'input:user-valid {',
            '  border-color: #10b981;',
            '}',
          ],
          highlight: [4, 5, 8, 9, 22, 23, 24, 25],
        },
      },
      {
        stage: 'api',
        title: 'Step 3. Constraint Validation API — validity 객체 읽기',
        desc: '스타일만이 아니라 "왜 틀렸는지"를 코드로 알아야 할 때가 있다. 모든 폼 컨트롤은 checkValidity()(통과 여부를 boolean으로 반환)와 reportValidity()(검사 + 첫 오류에 브라우저 말풍선 표시)를 제공한다. 무엇이 틀렸는지는 input.validity 객체로 읽는다 — valueMissing·typeMismatch·patternMismatch·tooShort·rangeUnderflow·rangeOverflow·badInput 같은 boolean 플래그와, 사람이 읽는 input.validationMessage가 들어 있다. 왼쪽 폼의 각 필드 아래에 지금 켜진 validity 플래그가 실시간으로 표시된다 — 값을 바꾸면 어떤 플래그가 켜지고 꺼지는지 눈으로 따라가 보라. 이 객체가 커스텀 검증 UI의 데이터 소스다.',
        actor: '🔬 input.validity { valueMissing, typeMismatch, … }',
        alert: { tone: 'info', text: 'checkValidity()는 조용히 boolean만 반환하고, reportValidity()는 추가로 첫 오류 필드에 포커스+말풍선을 띄운다. 무엇이 틀렸는지는 validity 객체로, 메시지는 validationMessage 로 읽는다.' },
        focus: 'validity',
        code: {
          lang: 'javascript', filename: 'validate.js — Constraint Validation API',
          lines: [

            '  // 폼 전체가 제약을 만족하는가? (boolean)',
            '  if (!form.checkValidity()) {',

            '      const v = input.validity;   // ValidityState',

          ],
          highlight: [5, 9, 13, 14, 16, 17, 18, 22],
        },
      },
      {

        alert: { tone: 'warn', text: 'setCustomValidity(msg) 로 오류를 걸었다면, 조건이 해소됐을 때 반드시 setCustomValidity("") 로 지워야 한다. 안 지우면 그 필드는 영원히 :invalid 로 남아 제출이 안 되는 버그가 된다.' },

        stage: 'submit',
        title: 'Step 5. 제출 흐름과 실무 함정 — 그리고 서버 검증',
        desc: '제출을 누르면 브라우저는 위에서부터 훑어 첫 번째 invalid 필드로 포커스를 옮기고 말풍선을 띄운 뒤 제출을 멈춘다(왼쪽 "제출" 버튼으로 이 이동을 직접 확인해 보라). 여기서 실무 함정 세 가지를 기억하자. (1) 기본 말풍선이 디자인과 안 맞음 → novalidate + 커스텀 UI. (2) :invalid가 로드부터 빨개짐 → :user-invalid 또는 touched 관리. (3) 가장 중요 — pattern·required는 클라이언트 편의일 뿐, 사용자가 DevTools로 속성을 지우거나 curl로 요청을 직접 보내면 전부 무력화된다. 클라이언트 검증은 UX용이고, 진짜 방어선은 항상 서버 검증이다. 두 곳 모두에서 검증하는 것이 정답이다. 다음 장 II-2-2에서는 이 값들이 실제로 서버로 어떻게 전송되는지(GET/POST·인코딩)를 다룬다.',
        actor: '🚀 submit → 첫 invalid 포커스 · 그리고 서버가 최종 방어선',
        alert: { tone: 'danger', text: 'pattern·required 만 믿고 서버 검증을 생략하면 보안 구멍이 된다. 클라이언트 검증은 우회가 쉽다(DevTools·curl). 반드시 서버에서도 동일하게 검증하라 — 클라이언트는 UX, 서버는 방어선.' },
        focus: 'submit',
        code: {
          lang: 'javascript', filename: 'submit_notes.md — 제출 흐름 & 서버 검증',
          lines: [
            '## 제출 시 브라우저 동작 (기본)',
            '',
            '  1. 폼의 모든 컨트롤을 문서 순서로 검사',
            '  2. 첫 invalid 필드로 포커스 이동 + 말풍선',
            '  3. submit 이벤트를 발생시키지 않고 중단',
            '',
            '## 실무 함정 3가지',
            '',
            '  (1) 기본 말풍선이 디자인과 안 맞음',
            '      → novalidate + 커스텀 UI (Step 4)',
            '  (2) :invalid 가 로드부터 빨개짐',
            '      → :user-invalid / touched 관리 (Step 2)',
            '  (3) 클라이언트 검증은 우회가 쉽다  ← 가장 중요',
            '      → DevTools 로 required 삭제, curl 직접 요청',
            '',
            '## 서버도 반드시 검증한다 (예: FastAPI)',
            '',
            '  from pydantic import BaseModel, EmailStr, Field',
            '',
            '  class SignUp(BaseModel):',
            '      email: EmailStr',
            '      username: str = Field(min_length=3,',
            '                            pattern=r"^[a-z0-9_]+$")',
            '      age: int = Field(ge=18, le=99)',
            '',
            '  # 클라이언트 검증 = UX,  서버 검증 = 방어선',
            '  # 두 곳 모두에서 같은 규칙을 검증한다.',
            '',
            '  # 다음 장 → II-2-2. 폼 데이터가 서버로 가는 길',
          ],
          highlight: [3, 4, 5, 13, 14, 20, 21, 22, 23, 25],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 필드 하나 — 실제 상태 배지 + validity 플래그 (stage 에 따라 강조 다름)
    // ─────────────────────────────────────────────────────
    function FieldRow({ field, value, touched, submitted, result, focused, focus, customMsg }) {
      // 시각 상태 결정: 커스텀 메시지가 있으면 그것을 우선
      const effectiveInvalid = !result.valid || !!customMsg;
      // :user-invalid 규칙 — 건드렸거나(touched) 제출했을 때만 빨강
      const showInvalid = effectiveInvalid && (touched || submitted);
      const showValid = result.valid && !customMsg && (touched || submitted) && value.trim() !== '';

      let ring = 'border-slate-300 bg-white';
      if (showInvalid) ring = 'border-red-400 bg-red-50';
      else if (showValid) ring = 'border-emerald-400 bg-emerald-50';
      if (focused) ring += ' ring-2 ring-orange-400';

      const activeFlags = Object.keys(FLAG_LABEL).filter((k) => result[k]);
      const message = customMsg || result.message;

      return (
        <div className={`rounded-lg border-2 px-2.5 py-2 transition ${ring}`}>
          <div className="flex items-center gap-2">
            <span className="text-[11px] font-bold text-slate-700 w-14 shrink-0">{field.label}</span>
            <span className="flex-1 text-[11px] font-mono text-slate-800 truncate">{value === '' ? <span className="text-slate-400">(비어 있음)</span> : value}</span>
            {/* 상태 아이콘 */}
            {showValid && <span className="text-emerald-600 text-xs font-bold">✅ valid</span>}
            {showInvalid && <span className="text-red-600 text-xs font-bold">❌ invalid</span>}
            {!showValid && !showInvalid && <span className="text-slate-400 text-[10px]">🕗 아직 안 건드림</span>}
          </div>

          {/* Step 1: 걸린 제약 속성 */}
          {focus === 'attrs' && (
            <div className="mt-1 text-[10px] font-mono text-orange-800 bg-orange-50 border border-orange-200 rounded px-1.5 py-0.5">
              {field.attrs}
            </div>
          )}

          {/* Step 3: validity 플래그 실시간 */}
          {focus === 'validity' && (
            <div className="mt-1.5 flex flex-wrap gap-1">
              {activeFlags.length === 0
                ? <span className="text-[9px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300 font-mono">valid: true</span>
                : activeFlags.map((k) => (
                    <span key={k} className="text-[9px] px-1.5 py-0.5 rounded bg-red-100 text-red-800 border border-red-300 font-mono">{FLAG_LABEL[k]}: true</span>
                  ))}
            </div>
          )}

          {/* Step 2: 어떤 의사클래스가 매칭되나 */}
          {focus === 'pseudo' && (
            <div className="mt-1 flex flex-wrap gap-1 text-[9px] font-mono">
              {field.required && <span className="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">:required</span>}
              {showInvalid && <span className="px-1.5 py-0.5 rounded bg-red-100 text-red-800 border border-red-300">:user-invalid</span>}
              {showValid && <span className="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300">:user-valid</span>}
              {!touched && !submitted && effectiveInvalid && <span className="px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 border border-slate-300">:invalid (로드부터 — 아직 안 빨감)</span>}
            </div>
          )}

          {/* Step 4/5: 인라인 커스텀 메시지 (기본 말풍선 대체) */}
          {(focus === 'custom' || focus === 'submit') && showInvalid && message && (
            <div className="mt-1 text-[10px] text-red-700 flex items-center gap-1">
              <span>⚠️</span><span>{message}</span>
              {focused && <span className="ml-auto text-orange-600 font-bold">← 포커스 이동</span>}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 실시간 입력 폼 + validity 시뮬레이션
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      attrs:  { icon: '📝', label: '내장 제약 속성' },
      pseudo: { icon: '🎨', label: 'CSS 의사클래스' },
      api:    { icon: '🔬', label: 'validity 객체' },
      custom: { icon: '🛠', label: '커스텀 검증' },
      submit: { icon: '🚀', label: '제출 & 포커스' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.attrs;
      const focus = state.focus;

      // 실시간 입력값 — 초기값은 일부러 일부 invalid (하지만 touched 전이라 안 빨감)
      const [values, setValues] = useState({ email: 'kim@', username: 'A B', age: '12', website: '' });
      const [touched, setTouched] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [customOn, setCustomOn] = useState(false);
      const [focusedField, setFocusedField] = useState(null);

      // 각 필드 검증 결과
      const results = useMemo(() => {
        const out = {};
        FIELDS.forEach((f) => { out[f.name] = validateField(f, values[f.name]); });
        return out;
      }, [values]);

      // 커스텀 제약 (Step 4/5): 사내 메일 차단 데모
      const customMsgFor = (name) => {
        if (!customOn) return '';
        if (name === 'email' && values.email.endsWith('@test.com')) return '사내 메일(@test.com)은 쓸 수 없습니다.';
        return '';
      };

      // 첫 invalid 필드 이름 (커스텀 포함) — 제출 포커스용
      const firstInvalid = FIELDS.find((f) => !results[f.name].valid || customMsgFor(f.name))?.name || null;

      const onChange = (name, v) => {
        setValues((s) => ({ ...s, [name]: v }));
        setFocusedField(null);
      };
      const onBlur = (name) => setTouched((s) => ({ ...s, [name]: true }));

      const onSubmit = () => {
        setSubmitted(true);
        setTouched(Object.fromEntries(FIELDS.map((f) => [f.name, true])));
        setFocusedField(firstInvalid);   // reportValidity() 의 포커스 이동 시뮬레이션
      };

      const allValid = FIELDS.every((f) => results[f.name].valid && !customMsgFor(f.name));

      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>회원가입 폼 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 text-right max-w-[45%]">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            직접 입력해 보세요 — 값에 따라 validity 가 실시간으로 바뀝니다
          </div>

          {/* 실제 입력 필드 */}
          <div className="space-y-2">
            {FIELDS.map((f) => (
              <div key={f.name}>
                <div className="flex items-center gap-2 mb-1">
                  <label className="text-[10px] font-bold text-slate-600 w-14 shrink-0">{f.label}</label>
                  <input
                    type={f.type === 'number' ? 'text' : 'text'}
                    value={values[f.name]}
                    onChange={(e) => onChange(f.name, e.target.value)}
                    onBlur={() => onBlur(f.name)}
                    placeholder={f.attrs}
                    className="flex-1 text-[11px] font-mono px-2 py-1 rounded border border-slate-300 focus:border-orange-400 focus:outline-none focus:ring-1 focus:ring-orange-300"
                  />
                </div>
                <FieldRow
                  field={f}
                  value={values[f.name]}
                  touched={!!touched[f.name]}
                  submitted={submitted}
                  result={results[f.name]}
                  focused={focusedField === f.name}
                  focus={focus}
                  customMsg={customMsgFor(f.name)}
                />
              </div>
            ))}
          </div>

          {/* 커스텀 UI 토글 (Step 4/5) */}
          {(focus === 'custom' || focus === 'submit') && (
            <label className="mt-3 flex items-center gap-2 text-[11px] text-slate-700 cursor-pointer">
              <input type="checkbox" checked={customOn} onChange={(e) => setCustomOn(e.target.checked)} className="accent-orange-500" />
              <span><b>커스텀 UI 모드</b> (novalidate + setCustomValidity) — 기본 말풍선 대신 인라인 메시지 + 사내메일 차단</span>
            </label>
          )}

          {/* 제출 버튼 (Step 3 이후 등장) */}
          {(focus === 'validity' || focus === 'custom' || focus === 'submit') && (
            <div className="mt-3 flex items-center gap-2">
              <button
                onClick={onSubmit}
                className="px-3 py-1.5 text-xs rounded font-bold bg-[#E34F26] text-white hover:bg-orange-700"
              >가입 제출 (checkValidity)</button>
              {submitted && (allValid
                ? <span className="text-[11px] text-emerald-700 font-bold">✅ 모두 통과 → 서버 전송</span>
                : <span className="text-[11px] text-red-700 font-bold">❌ 첫 오류: {firstInvalid} 로 포커스 이동</span>)}
            </div>
          )}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-[11px] whitespace-nowrap">Ⅱ. 폼</span>
              <div>
                <div className="text-[11px] text-orange-700/80 font-bold mb-0.5">Ⅱ. 폼 — 데이터를 서버로 · II-2-1</div>
                <h1 className="text-2xl font-bold text-orange-900">브라우저 내장 유효성 검증</h1>
                <p className="text-sm text-orange-800/80">required·pattern·min/max·type이 만드는 Constraint Validation — JS 없이 검증하고 :invalid로 스타일링</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`} />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-stretch">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40">← 이전</button>
              <button
                onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                required·pattern·min/max·type 속성만으로 브라우저가 입력을 자동 검증한다(Constraint Validation). 상태는 :valid/:invalid/:user-invalid 로 스타일링하고,
                checkValidity()·reportValidity()·validity 객체·setCustomValidity() 로 세밀하게 제어한다. 기본 말풍선이 안 맞으면 novalidate + 커스텀 UI 로 바꾼다.
                그러나 클라이언트 검증은 우회가 쉬우므로 진짜 방어선은 항상 서버 검증이다 — 두 곳 모두에서 같은 규칙을 검증하라.
                다음 장 II-2-2에서는 통과한 이 값들이 실제로 서버로 전송되는 방식(GET/POST·인코딩)을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['ConstraintValidation', 'required', 'pattern', 'type=email', 'min/max', ':invalid', ':user-invalid', 'checkValidity', 'validity객체', 'setCustomValidity', 'novalidate', '서버검증'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
