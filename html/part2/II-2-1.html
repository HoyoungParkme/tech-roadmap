<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 폼 학습 — II-2-1. 브라우저 내장 유효성 검증</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>✅</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    HTML 폼 II-2-1 — 브라우저 내장 유효성 검증 (Constraint Validation)
    학습 목표: required·pattern·min/max·type 같은 속성만으로 JS 없이 입력을 검증하고,
              :invalid/:user-invalid 로 스타일링하며, Constraint Validation API
              (checkValidity·reportValidity·setCustomValidity·validity 객체)로
              디자인에 맞는 커스텀 검증까지 만든다.
    패턴: fastapi v1 — 좌(LiveDataPane: 실시간 입력 → validity 객체 시뮬레이션 + 제출 포커스)
                       우(VSCode CodeViewer: signup.html + form.css + validate.js)
    색상: orange (HTML 브랜드 #E34F26)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────
    // 검증 엔진 — 브라우저 Constraint Validation 을 순수 함수로 재현
    //   각 필드 규칙에 따라 validity 객체(valueMissing·typeMismatch…)와
    //   validationMessage 를 계산한다. 실제 브라우저 동작과 동일한 우선순위.
    // ─────────────────────────────────────────────────────
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const URL_RE = /^https?:\/\/[^\s.]+\.[^\s]+$/;

    const FIELDS = [
      { name: 'email',    label: '이메일',   type: 'email',  required: true,  attrs: 'type="email" required' },
      { name: 'username', label: '아이디',   type: 'text',   required: true,  minlength: 3, pattern: '[a-z0-9_]+',
        attrs: 'required minlength="3" pattern="[a-z0-9_]+"' },
      { name: 'age',      label: '나이',     type: 'number', required: true,  min: 18, max: 99,
        attrs: 'type="number" required min="18" max="99"' },
      { name: 'website',  label: '홈페이지', type: 'url',    required: false, attrs: 'type="url"  (선택)' },
    ];

    // 빈 validity — 모든 제약을 통과한 상태
    const OK = { valueMissing: false, typeMismatch: false, patternMismatch: false, tooShort: false, rangeUnderflow: false, rangeOverflow: false, badInput: false };

    function validateField(field, raw) {
      const value = raw == null ? '' : String(raw);
      const v = { ...OK };
      // 1) required — 값 자체가 비었는지 (다른 무엇보다 먼저)
      if (field.required && value.trim() === '') v.valueMissing = true;

      // 값이 있을 때만 형식 제약을 따진다 (브라우저와 동일: 빈 선택 필드는 valid)
      if (value.trim() !== '') {
        if (field.type === 'email' && !EMAIL_RE.test(value)) v.typeMismatch = true;
        if (field.type === 'url' && !URL_RE.test(value)) v.typeMismatch = true;
        if (field.pattern && !new RegExp('^(?:' + field.pattern + ')$').test(value)) v.patternMismatch = true;
        if (field.minlength && value.length < field.minlength) v.tooShort = true;
        if (field.type === 'number') {
          const n = Number(value);
          if (Number.isNaN(n)) v.badInput = true;
          else {
            if (field.min != null && n < field.min) v.rangeUnderflow = true;
            if (field.max != null && n > field.max) v.rangeOverflow = true;
          }
        }
      }
      const valid = !Object.values(v).some(Boolean);
      return { ...v, valid, message: valid ? '' : messageFor(field, v) };
    }

    // 브라우저 기본 말풍선과 비슷한 한국어 메시지 (validity 우선순위대로)
    function messageFor(field, v) {
      if (v.valueMissing) return '이 필드를 입력해 주세요.';
      if (v.badInput) return '숫자를 입력해 주세요.';
      if (v.typeMismatch) return field.type === 'email' ? "'@'를 포함한 이메일 형식이 아닙니다." : 'http(s):// 로 시작하는 URL이 아닙니다.';
      if (v.tooShort) return `${field.minlength}자 이상 입력해 주세요.`;
      if (v.patternMismatch) return '요청한 형식과 일치하지 않습니다.';
      if (v.rangeUnderflow) return `${field.min} 이상이어야 합니다.`;
      if (v.rangeOverflow) return `${field.max} 이하여야 합니다.`;
      return '값이 올바르지 않습니다.';
    }

    // 각 validity 플래그의 사람이 읽는 라벨
    const FLAG_LABEL = {
      valueMissing: 'valueMissing',
      typeMismatch: 'typeMismatch',
      patternMismatch: 'patternMismatch',
      tooShort: 'tooShort',
      rangeUnderflow: 'rangeUnderflow',
      rangeOverflow: 'rangeOverflow',
      badInput: 'badInput',
    };

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      attrs: { lang: "html", filename: "signup.html — 내장 제약 속성", lines: [
        "<!-- JS 한 줄 없이, 속성만으로 검증이 켜진다 -->",
        "<form id=\"signup\">",
        "  <label>이메일",
        "    <input name=\"email\" type=\"email\" required />",
        "  </label>",
        "",

        code: { ...CODE.submit, highlight: [7,8,9,10,11,12] },
      },
      { ...S5,
        beat: {
          label: "함정 3 — 우회가 쉽다",
          at: "submit_notes.md L13–14",
          caption: "DevTools 로 required 를 지우거나 curl 로 요청을 직접 보내면 클라이언트 검증은 통째로 무력화된다.",
          changes: [
            { mark: "gone", text: "required / pattern 의 강제력" },
            { mark: "read", text: "curl 은 폼을 거치지도 않음" },
          ],
        },
        stage: "submit",
        focus: "submit",
        actor: "🚀 함정 3 — 클라이언트 검증은 우회된다",
        alert: { tone: "danger", text: "브라우저에서 도는 코드는 사용자가 바꿀 수 있다. 클라이언트 검증을 보안 장치로 세면 안 된다." },
        code: { ...CODE.submit, highlight: [13,14] },
      },
      { ...S5,
        beat: {
          label: "서버에 스키마로 다시",
          at: "submit_notes.md L16–21",
          caption: "같은 규칙을 서버 스키마로 선언한다. type=\"email\" 은 EmailStr 로, 필드 정의가 곧 검증이 된다.",
          changes: [
            { mark: "new", text: "Pydantic SignUp 모델" },
            { mark: "changed", text: "type=\"email\" → EmailStr" },
          ],
        },
        stage: "submit",
        focus: "submit",
        actor: "🚀 서버 — SignUp(BaseModel) 선언",
        alert: { tone: "info", text: "서버에서도 선언으로 검증한다. 두 곳 다 \"코드\"가 아니라 \"선언\"이면 규칙이 어긋나기 어렵다." },
        code: { ...CODE.submit, highlight: [16,17,18,19,20,21] },
      },
      { ...S5,
        beat: {
          label: "같은 제약을 그대로",
          at: "submit_notes.md L22–24",
          caption: "minlength·pattern 은 Field(min_length, pattern) 으로, min/max 는 ge/le 로 1:1 옮겨진다.",
          changes: [
            { mark: "changed", text: "minlength / pattern → Field(...)" },
            { mark: "changed", text: "min / max → ge / le" },
          ],
        },
        stage: "submit",
        focus: "submit",
        actor: "🚀 서버 — 클라이언트와 같은 제약",
        alert: { tone: "good", text: "이름만 다를 뿐 제약은 같다. 한쪽만 고치면 어긋나므로 규칙 변경은 항상 두 곳을 함께 본다." },
        code: { ...CODE.submit, highlight: [22,23,24] },
      },
      { ...S5,
        beat: {
          label: "두 곳 모두에서 검증",
          at: "submit_notes.md L26–29",
          caption: "클라이언트 검증은 UX, 서버 검증은 방어선이다. 둘 중 하나만 있으면 각각 다른 이유로 부족하다.",
          changes: [
            { mark: "read", text: "클라이언트 = UX, 서버 = 방어선" },
          ],
        },
        stage: "submit",
        focus: "submit",
        actor: "🚀 submit → 첫 invalid 포커스 · 그리고 서버가 최종 방어선",
        alert: { tone: "danger", text: "pattern·required 만 믿고 서버 검증을 생략하면 보안 구멍이 된다. 클라이언트 검증은 우회가 쉽다(DevTools·curl). 반드시 서버에서도 동일하게 검증하라 — 클라이언트는 UX, 서버는 방어선." },
        code: { ...CODE.submit, highlight: [26,27,28,29] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 필드 하나 — 실제 상태 배지 + validity 플래그 (stage 에 따라 강조 다름)
    // ─────────────────────────────────────────────────────
    function FieldRow({ field, value, touched, submitted, result, focused, focus, customMsg }) {
      // 시각 상태 결정: 커스텀 메시지가 있으면 그것을 우선
      const effectiveInvalid = !result.valid || !!customMsg;
      // :user-invalid 규칙 — 건드렸거나(touched) 제출했을 때만 빨강
      const showInvalid = effectiveInvalid && (touched || submitted);
      const showValid = result.valid && !customMsg && (touched || submitted) && value.trim() !== '';

      let ring = 'border-slate-300 bg-white';
      if (showInvalid) ring = 'border-red-400 bg-red-50';
      else if (showValid) ring = 'border-emerald-400 bg-emerald-50';
      if (focused) ring += ' ring-2 ring-orange-400';

      const activeFlags = Object.keys(FLAG_LABEL).filter((k) => result[k]);
      const message = customMsg || result.message;

      return (
        <div className={`rounded-lg border-2 px-2.5 py-2 transition ${ring}`}>
          <div className="flex items-center gap-2">
            <span className="text-[11px] font-bold text-slate-700 w-14 shrink-0">{field.label}</span>
            <span className="flex-1 text-[11px] font-mono text-slate-800 truncate">{value === '' ? <span className="text-slate-400">(비어 있음)</span> : value}</span>
            {/* 상태 아이콘 */}
            {showValid && <span className="text-emerald-600 text-xs font-bold">✅ valid</span>}
            {showInvalid && <span className="text-red-600 text-xs font-bold">❌ invalid</span>}
            {!showValid && !showInvalid && <span className="text-slate-400 text-[10px]">🕗 아직 안 건드림</span>}
          </div>

          {/* Step 1: 걸린 제약 속성 */}
          {focus === 'attrs' && (
            <div className="mt-1 text-[10px] font-mono text-orange-800 bg-orange-50 border border-orange-200 rounded px-1.5 py-0.5">
              {field.attrs}
            </div>
          )}

          {/* Step 3: validity 플래그 실시간 */}
          {focus === 'validity' && (
            <div className="mt-1.5 flex flex-wrap gap-1">
              {activeFlags.length === 0
                ? <span className="text-[9px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300 font-mono">valid: true</span>
                : activeFlags.map((k) => (
                    <span key={k} className="text-[9px] px-1.5 py-0.5 rounded bg-red-100 text-red-800 border border-red-300 font-mono">{FLAG_LABEL[k]}: true</span>
                  ))}
            </div>
          )}

          {/* Step 2: 어떤 의사클래스가 매칭되나 */}
          {focus === 'pseudo' && (
            <div className="mt-1 flex flex-wrap gap-1 text-[9px] font-mono">
              {field.required && <span className="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">:required</span>}
              {showInvalid && <span className="px-1.5 py-0.5 rounded bg-red-100 text-red-800 border border-red-300">:user-invalid</span>}
              {showValid && <span className="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300">:user-valid</span>}
              {!touched && !submitted && effectiveInvalid && <span className="px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 border border-slate-300">:invalid (로드부터 — 아직 안 빨감)</span>}
            </div>
          )}

          {/* Step 4/5: 인라인 커스텀 메시지 (기본 말풍선 대체) */}
          {(focus === 'custom' || focus === 'submit') && showInvalid && message && (
            <div className="mt-1 text-[10px] text-red-700 flex items-center gap-1">
              <span>⚠️</span><span>{message}</span>
              {focused && <span className="ml-auto text-orange-600 font-bold">← 포커스 이동</span>}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 실시간 입력 폼 + validity 시뮬레이션
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      attrs:  { icon: '📝', label: '내장 제약 속성' },
      pseudo: { icon: '🎨', label: 'CSS 의사클래스' },
      api:    { icon: '🔬', label: 'validity 객체' },
      custom: { icon: '🛠', label: '커스텀 검증' },
      submit: { icon: '🚀', label: '제출 & 포커스' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.attrs;
      const focus = state.focus;

      // 실시간 입력값 — 초기값은 일부러 일부 invalid (하지만 touched 전이라 안 빨감)
      const [values, setValues] = useState({ email: 'kim@', username: 'A B', age: '12', website: '' });
      const [touched, setTouched] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [customOn, setCustomOn] = useState(false);
      const [focusedField, setFocusedField] = useState(null);

      // 각 필드 검증 결과
      const results = useMemo(() => {
        const out = {};
        FIELDS.forEach((f) => { out[f.name] = validateField(f, values[f.name]); });
        return out;
      }, [values]);

      // 커스텀 제약 (Step 4/5): 사내 메일 차단 데모
      const customMsgFor = (name) => {
        if (!customOn) return '';
        if (name === 'email' && values.email.endsWith('@test.com')) return '사내 메일(@test.com)은 쓸 수 없습니다.';
        return '';
      };

      // 첫 invalid 필드 이름 (커스텀 포함) — 제출 포커스용
      const firstInvalid = FIELDS.find((f) => !results[f.name].valid || customMsgFor(f.name))?.name || null;

      const onChange = (name, v) => {
        setValues((s) => ({ ...s, [name]: v }));
        setFocusedField(null);
      };
      const onBlur = (name) => setTouched((s) => ({ ...s, [name]: true }));

      const onSubmit = () => {
        setSubmitted(true);
        setTouched(Object.fromEntries(FIELDS.map((f) => [f.name, true])));
        setFocusedField(firstInvalid);   // reportValidity() 의 포커스 이동 시뮬레이션
      };

      const allValid = FIELDS.every((f) => results[f.name].valid && !customMsgFor(f.name));

      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>회원가입 폼 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 text-right max-w-[45%]">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            직접 입력해 보세요 — 값에 따라 validity 가 실시간으로 바뀝니다
          </div>

          {/* 실제 입력 필드 */}
          <div className="space-y-2">
            {FIELDS.map((f) => (
              <div key={f.name}>
                <div className="flex items-center gap-2 mb-1">
                  <label className="text-[10px] font-bold text-slate-600 w-14 shrink-0">{f.label}</label>
                  <input
                    type={f.type === 'number' ? 'text' : 'text'}
                    value={values[f.name]}
                    onChange={(e) => onChange(f.name, e.target.value)}
                    onBlur={() => onBlur(f.name)}
                    placeholder={f.attrs}
                    className="flex-1 text-[11px] font-mono px-2 py-1 rounded border border-slate-300 focus:border-orange-400 focus:outline-none focus:ring-1 focus:ring-orange-300"
                  />
                </div>
                <FieldRow
                  field={f}
                  value={values[f.name]}
                  touched={!!touched[f.name]}
                  submitted={submitted}
                  result={results[f.name]}
                  focused={focusedField === f.name}
                  focus={focus}
                  customMsg={customMsgFor(f.name)}
                />
              </div>
            ))}
          </div>

          {/* 커스텀 UI 토글 (Step 4/5) */}
          {(focus === 'custom' || focus === 'submit') && (
            <label className="mt-3 flex items-center gap-2 text-[11px] text-slate-700 cursor-pointer">
              <input type="checkbox" checked={customOn} onChange={(e) => setCustomOn(e.target.checked)} className="accent-orange-500" />
              <span><b>커스텀 UI 모드</b> (novalidate + setCustomValidity) — 기본 말풍선 대신 인라인 메시지 + 사내메일 차단</span>
            </label>
          )}

          {/* 제출 버튼 (Step 3 이후 등장) */}
          {(focus === 'validity' || focus === 'custom' || focus === 'submit') && (
            <div className="mt-3 flex items-center gap-2">
              <button
                onClick={onSubmit}
                className="px-3 py-1.5 text-xs rounded font-bold bg-[#E34F26] text-white hover:bg-orange-700"
              >가입 제출 (checkValidity)</button>
              {submitted && (allValid
                ? <span className="text-[11px] text-emerald-700 font-bold">✅ 모두 통과 → 서버 전송</span>
                : <span className="text-[11px] text-red-700 font-bold">❌ 첫 오류: {firstInvalid} 로 포커스 이동</span>)}
            </div>
          )}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2 h-10 rounded-lg bg-[#E34F26] text-white font-bold text-[11px] whitespace-nowrap">Ⅱ. 폼</span>
              <div>
                <div className="text-[11px] text-orange-700/80 font-bold mb-0.5">Ⅱ. 폼 — 데이터를 서버로 · II-2-1</div>
                <h1 className="text-2xl font-bold text-orange-900">브라우저 내장 유효성 검증</h1>
                <p className="text-sm text-orange-800/80">required·pattern·min/max·type이 만드는 Constraint Validation — JS 없이 검증하고 :invalid로 스타일링</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E34F26]' : 'bg-orange-200'}`} />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-stretch">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40">← 이전</button>
              <button
                onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E34F26] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                required·pattern·min/max·type 속성만으로 브라우저가 입력을 자동 검증한다(Constraint Validation). 상태는 :valid/:invalid/:user-invalid 로 스타일링하고,
                checkValidity()·reportValidity()·validity 객체·setCustomValidity() 로 세밀하게 제어한다. 기본 말풍선이 안 맞으면 novalidate + 커스텀 UI 로 바꾼다.
                그러나 클라이언트 검증은 우회가 쉬우므로 진짜 방어선은 항상 서버 검증이다 — 두 곳 모두에서 같은 규칙을 검증하라.
                다음 장 II-2-2에서는 통과한 이 값들이 실제로 서버로 전송되는 방식(GET/POST·인코딩)을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['ConstraintValidation', 'required', 'pattern', 'type=email', 'min/max', ':invalid', ':user-invalid', 'checkValidity', 'validity객체', 'setCustomValidity', 'novalidate', '서버검증'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
