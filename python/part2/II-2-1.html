  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Python II-2-1 — 모듈·패키지·가상환경(venv·pip)
    학습 목표: import 가 sys.path 를 따라 모듈을 찾고 캐시에 1회만 올리는 동작 원리에서 출발해,
              절대/상대 임포트와 순환 임포트 함정, venv 로 프로젝트별 의존성을 격리하는 이유,
              pip·requirements.txt·버전 고정으로 재현 가능한 환경을 만드는 실무를 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: sys.path 탐색·모듈 캐시·venv 격리 상자) / 우(VSCode CodeViewer: python + 셸)
    색상: Python 파랑 #3776AB · 형광펜 노랑 #FFD43B · 글자/링크 파랑다크 #1e4c6e
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 모듈/패키지 → sys.path·캐시 → 절대/상대·순환 → venv 격리 → pip 고정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(module/syspath/circular/venv/pip)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      modules: {lang: "python", filename: "main.py — 모듈 import 3형식", lines: [
        "# utils/math_tools.py 안에 def add(a, b): return a + b 가 있다고 하자",
        "",
        "# 1) 모듈 전체 가져오기 — 전체 경로로 접근",
        "import utils.math_tools",
        "print(utils.math_tools.add(1, 2))    # => 3",
        "",
        "# 2) 필요한 이름만 콕 집기",
        "from utils.math_tools import add",
        "print(add(10, 20))                   # => 30",
        "",
        "# 3) 별칭(as) — 이름이 길거나 충돌할 때",
        "import utils.text_tools as txt",
        "print(txt.shout(\"hi\"))               # => \"HI!\"",
        "",
        "# 4) 직접 실행할 때만 도는 블록",
        "def main():",
        "    print(\"run as script\")",
        "",
        "if __name__ == \"__main__\":",
        "    main()      # `python main.py` 로 실행 시에만 호출",
        "                # 다른 파일에서 import 하면 실행 안 됨",
      ]},
      search: {lang: "python", filename: "search.py — sys.path 와 캐시 확인", lines: [
        "import sys",
        "",
        "# 1) import 가 뒤지는 경로 목록 (앞에서부터 탐색)",
        "for p in sys.path:",
        "    print(p)",
        "# => \"\" (스크립트 폴더) / .../lib / .../site-packages ...",
        "",
        "# 2) 이미 로드된 모듈 캐시",
        "import json",
        "print(\"json\" in sys.modules)   # => True (로드됨)",
        "",
        "# 3) 모듈은 프로세스당 1번만 실행됨을 확인",
        "#    greet.py 최상단에 print(\"loading greet\") 가 있다고 하자",
        "import greet     # => \"loading greet\"  (여기서 1번만 출력)",
        "import greet     # (출력 없음 — 캐시에서 반환)",
        "",
        "# 4) 강제로 다시 로드해야 한다면",
        "import importlib",
        "importlib.reload(greet)   # => \"loading greet\" (재실행)",
      ]},
      imports: {lang: "python", filename: "imports.py — 절대/상대 & 순환 해결", lines: [
        "# 패키지 구조: myproject/{__init__.py, service.py, utils.py}",
        "",
        "# 1) 절대 임포트 (실무 표준 — 어디서 봐도 명확)",
        "from myproject.utils import add",
        "",
        "# 2) 상대 임포트 (. = 현재 패키지, .. = 한 단계 위)",
        "from .utils import add          # service.py 안에서",
        "# 주의: `python service.py` 로 직접 실행하면",
        "#   ImportError: attempted relative import ...",
        "#   → `python -m myproject.service` 로 실행해야 함",
        "",
        "# 3) 순환 임포트 회피 — 지연 import",
        "# a.py 와 b.py 가 서로를 필요로 할 때,",

        code: {...CODE.deps, highlight: [17, 18]},
      },
      { ...S5,
        beat: {
          label: "버전을 고정한다",
          at: "deps.sh L20–22",
          caption: "이름만 적으면 깔 때마다 최신이 온다 — == 로 못 박아야 언제 누가 깔아도 같은 버전이다.",
          changes: [{mark: "gone", text: "미고정 표기(재현 불가)"}, {mark: "changed", text: "== 로 버전 고정"}],
        },
        actor: "📌 pip freeze · requirements.txt · == 고정",
        stage: "pip",
        stageLabel: "requirements.txt 로 재현 가능한 환경",
        reqFile: [
          { pkg: "requests==2.31.0", mean: "정확히 이 버전만 (권장·재현 보장)", tone: "good" },
          { pkg: "fastapi>=0.100,<1.0", mean: "0.100 이상 1.0 미만 (범위)", tone: "ok" },
          { pkg: "pydantic~=2.5.0", mean: "2.5.x 패치까지 허용", tone: "ok" },
          { pkg: "numpy", mean: "버전 미고정 → 매번 최신 (위험·재현 불가)", tone: "bad" }
        ],
        pipFlow: [
          { cmd: "pip install requests", note: "설치" },
          { cmd: "pip freeze > requirements.txt", note: "현재 버전 그대로 기록" },
          { cmd: "pip install -r requirements.txt", note: "다른 머신에서 동일 복원" }
        ],
        alert: {
          tone: "danger",
          text: "재현 불가 사고의 1순위 원인이 \"버전 미고정\"이다. 라이브러리를 requests 로만 적으면 오늘·내일 깔리는 버전이 달라진다 — 반드시 ==(또는 lock)로 고정하라. \"내 로컬에선 되는데 서버에선 터진다\"의 대부분이 여기서 온다. requirements.txt 는 커밋하되 .venv/ 는 커밋하지 않는다."
        },
        code: {...CODE.deps, highlight: [20, 21, 22]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 패키지 트리 + import 3형식
    // ─────────────────────────────────────────────────────
    function ModuleView({ packageTree, importForms }) {
      const KIND = {
        entry: { icon: '▶', cls: 'text-emerald-700' },
        pkg:   { icon: '📁', cls: 'text-[#3776AB] font-bold' },
        init:  { icon: '⚙', cls: 'text-amber-700' },
        mod:   { icon: '📄', cls: 'text-[#1e4c6e]' },
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">📦 패키지 구조 <span className="font-mono">{packageTree.root}</span></div>
            <div className="space-y-1">
              {packageTree.nodes.map((n, i) => {
                const k = KIND[n.kind] || KIND.mod;
                return (
                  <div key={i} className="flex items-center gap-2 text-[11px]" style={{ paddingLeft: `${n.depth * 18}px` }}>
                    <span>{k.icon}</span>
                    <span className={`font-mono ${k.cls}`}>{n.name}</span>
                    <span className="text-slate-400 text-[9px]">— {n.note}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">🔌 import 3형식</div>
            <table className="w-full text-[10px]">
              <tbody>
                {importForms.map((f, i) => (
                  <tr key={i} className="border-t border-blue-100 align-top">
                    <td className="py-1 font-mono font-bold text-[#3776AB] pr-2 whitespace-nowrap">{f.form}</td>
                    <td className="py-1 font-mono text-emerald-700 pr-2 whitespace-nowrap">{f.use}</td>
                    <td className="py-1 text-slate-500">{f.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — sys.path 순차 탐색 + 캐시 흐름
    // ─────────────────────────────────────────────────────
    function SysPathView({ searchPath, cacheDemo }) {
      const TONE = { run: 'border-amber-300 bg-amber-50 text-amber-900', cache: 'border-blue-300 bg-blue-50 text-[#1e4c6e]', hit: 'border-emerald-300 bg-emerald-50 text-emerald-900' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🔎 sys.path 탐색 순서 (위 → 아래, 먼저 찾으면 끝)</div>
            <div className="space-y-1">
              {searchPath.map((p, i) => (
                <div key={i} className={`flex items-center gap-2 text-[10px] rounded border px-2 py-1.5 ${p.hit ? 'border-emerald-400 bg-emerald-50' : 'border-blue-200 bg-blue-50'}`}>
                  <span className="font-mono font-bold w-4 text-[#3776AB]">{p.idx}</span>
                  <span className={`flex-1 ${p.hit ? 'text-emerald-800 font-bold' : 'text-[#1e4c6e]'}`}>{p.label}</span>
                  <span className="text-slate-400 text-[9px]">{p.note}</span>
                  {p.hit && <span className="text-emerald-600 font-bold">✓ 찾음</span>}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">💾 모듈 캐시 (import <span className="font-mono">{cacheDemo.target}</span> — 1회만 실행)</div>
            <div className="space-y-1.5">
              {cacheDemo.steps.map((s, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 text-[10px] ${TONE[s.tone]}`}>
                  <div className="font-mono font-bold">{s.n}</div>
                  <div className="text-[9px] opacity-90 mt-0.5">{s.act}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 절대/상대 임포트 비교 + 순환 다이어그램
    // ─────────────────────────────────────────────────────
    function CircularView({ importCompare, circular }) {
      const TONE = { good: 'border-emerald-400 bg-emerald-50', warn: 'border-amber-400 bg-amber-50' };
      const TXT = { good: 'text-emerald-700', warn: 'text-amber-800' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🔗 절대 vs 상대 임포트</div>
            <div className="space-y-2">
              {importCompare.map((c, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${TONE[c.tone]}`}>
                  <div className="flex items-center justify-between">
                    <span className={`text-[10px] font-bold ${TXT[c.tone]}`}>{c.kind}</span>
                    <span className="text-[9px] text-slate-500">{c.pros}</span>
                  </div>
                  <div className="font-mono text-[10px] text-slate-700 mt-0.5">{c.code}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-2">♻ 순환 임포트 (Circular Import)</div>
            <div className="flex items-center justify-center gap-3 my-2">
              <span className="px-3 py-1.5 rounded border-2 border-red-400 bg-white font-mono text-xs font-bold text-red-700">{circular.nodes[0]}</span>
              <div className="flex flex-col items-center text-red-500 text-[9px]">
                <span className="text-base leading-none">⇄</span>
                <span>서로 import</span>
              </div>
              <span className="px-3 py-1.5 rounded border-2 border-red-400 bg-white font-mono text-xs font-bold text-red-700">{circular.nodes[1]}</span>
            </div>
            <div className="text-[10px] text-red-600 text-center">{circular.badNote}</div>
            <div className="mt-2 text-[10px] text-emerald-800 bg-emerald-50 border border-emerald-300 rounded px-2 py-1.5">{circular.fix}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 전역 오염 vs venv 격리 상자
    // ─────────────────────────────────────────────────────
    function VenvView({ venvCompare }) {
      const g = venvCompare.global, iso = venvCompare.isolated;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-2">{g.title}</div>
            <div className="rounded border-2 border-red-400 bg-white px-2 py-1 text-center text-[10px] font-mono font-bold text-red-700 mb-2">{g.store}</div>
            <div className="space-y-1">
              {g.rows.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] rounded border border-red-200 bg-white px-2 py-1">
                  <span className="font-bold text-slate-700 w-24">{r.proj}</span>
                  <span className="text-red-500">↘</span>
                  <span className="font-mono text-slate-600">{r.need}</span>
                </div>
              ))}
            </div>
            <div className="text-[9px] text-red-600 mt-1.5">{g.note}</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3">
            <div className="text-[11px] font-bold text-emerald-700 mb-2">{iso.title}</div>
            <div className="grid grid-cols-2 gap-2">
              {iso.rows.map((r, i) => (
                <div key={i} className="rounded border-2 border-emerald-300 bg-white p-2 text-center">
                  <div className="text-[10px] font-bold text-emerald-800">{r.proj}</div>
                  <div className="text-[9px] text-slate-400 my-0.5">전용 site-packages</div>
                  <div className="font-mono text-[10px] text-[#1e4c6e]">{r.need}</div>
                </div>
              ))}
            </div>
            <div className="text-[9px] text-emerald-700 mt-1.5">{iso.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — requirements.txt 버전 표기 + pip 흐름
    // ─────────────────────────────────────────────────────
    function PipView({ reqFile, pipFlow }) {
      const TONE = { good: 'border-emerald-300 bg-emerald-50 text-emerald-800', ok: 'border-blue-200 bg-blue-50 text-[#1e4c6e]', bad: 'border-red-300 bg-red-50 text-red-700' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">📄 requirements.txt — 버전 표기법</div>
            <div className="space-y-1">
              {reqFile.map((r, i) => (
                <div key={i} className={`flex items-center gap-2 text-[10px] rounded border px-2 py-1.5 ${TONE[r.tone]}`}>
                  <span className="font-mono font-bold w-40 shrink-0">{r.pkg}</span>
                  <span className="opacity-90">{r.mean}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">⚙ pip 재현 흐름</div>
            <div className="space-y-1.5">
              {pipFlow.map((s, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-4 h-4 rounded-full bg-[#3776AB] text-white text-[9px] font-bold flex items-center justify-center shrink-0">{i + 1}</span>
                  <span className="font-mono text-[10px] text-[#1e4c6e] flex-1">{s.cmd}</span>
                  <span className="text-[9px] text-slate-400">{s.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      module:   { icon: '📦', label: '모듈·패키지' },
      syspath:  { icon: '🔎', label: 'import 원리' },
      circular: { icon: '🔗', label: '절대/상대·순환' },
      venv:     { icon: '🧪', label: 'venv 격리' },
      pip:      { icon: '📌', label: 'pip 관리' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.module;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>모듈·패키지·가상환경 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'module' && <ModuleView packageTree={state.packageTree} importForms={state.importForms} />}
          {state.stage === 'syspath' && <SysPathView searchPath={state.searchPath} cacheDemo={state.cacheDemo} />}
          {state.stage === 'circular' && <CircularView importCompare={state.importCompare} circular={state.circular} />}
          {state.stage === 'venv' && <VenvView venvCompare={state.venvCompare} />}
          {state.stage === 'pip' && <PipView reqFile={state.reqFile} pipFlow={state.pipFlow} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅱ. 객체와 모듈</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">II-2-1</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">모듈·패키지·가상환경(venv·pip)</h1>
                <p className="text-sm text-[#1e4c6e]/80">import 동작 원리와 프로젝트별 의존성 격리(venv)·pip 의존성 관리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                모듈은 .py 파일 하나, 패키지는 폴더(+__init__.py)다. import 는 sys.modules 캐시를 먼저 보고 없으면
                sys.path 를 앞에서부터 뒤지며(내 파일을 표준 모듈과 같은 이름으로 짓지 말 것), 모듈은 프로세스당 1회만 실행된다.
                임포트는 절대 임포트를 기본으로 쓰고 순환 의존은 구조 분리로 푼다. 프로젝트마다 venv 하나로 site-packages 를 격리해
                버전 충돌을 없애고, pip freeze / requirements.txt 로 버전을 ==로 고정해야 "내 로컬에선 되는" 재현 불가 문제를 막는다.
                다음 장 II-2-2에서는 클래스와 객체지향으로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['모듈', '패키지', '__init__', 'import', 'sys.path', '모듈캐시', '절대임포트', '순환임포트', 'venv', 'pip', 'requirements.txt', '버전고정'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
