  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Python II-2-2 — 예외 처리 설계
    학습 목표: try/except/else/finally 각 블록의 역할과 실행 순서에서 출발해,
              예외 전파(호출 스택 되감기)·예외 계층·구체적 예외부터 잡기·raise from 체이닝·
              커스텀 예외·EAFP vs LBYL·안티패턴까지 실무에서 견고한 에러 처리를 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 블록 실행 순서·스택 되감기·예외 계층 트리 React) / 우(VSCode CodeViewer: python)
    색상: Python 파랑 #3776AB · 형광펜 노랑 #FFD43B · 글자/링크 파랑다크 #1e4c6e
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 블록 역할 → 전파 → 계층 → 체이닝 → 커스텀/EAFP → 안티패턴
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(flow/propagate/hierarchy/chaining/custom/antipattern)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      blocks: {lang: "python", filename: "blocks.py — 4블록의 실행 순서", lines: [
        "def parse(raw: str) -> int:",
        "    f = open(\"audit.log\", \"a\")   # 정리 대상 리소스",
        "    try:",
        "        value = int(raw)         # 실패 가능 지점만 최소로",
        "    except ValueError:",
        "        print(\"변환 실패, 0으로 대체\")",
        "        return 0",
        "    else:",
        "        # try 가 예외 없이 끝났을 때만 실행",
        "        print(\"변환 성공:\", value)",
        "        return value",
        "    finally:",
        "        # 성공/실패/return 무관하게 항상 실행",
        "        f.close()                # => 리소스 정리 보장",
        "",
        "print(parse(\"10\"))    # => 변환 성공: 10 / (finally) / 10",
        "print(parse(\"oops\"))  # => 변환 실패, 0으로 대체 / (finally) / 0",
      ]},
      propagate: {lang: "python", filename: "propagate.py — 스택 되감기", lines: [
        "def low(raw):",
        "    return int(raw)          # raw=\"x\" → ValueError 발생",
        "",
        "def mid(raw):",
        "    return low(raw) * 2      # except 없음 → 그대로 위로 전파",
        "",
        "def high(raw):",
        "    try:",
        "        return mid(raw)      # low 에서 난 예외가 여기로 올라옴",
        "    except ValueError as e:",
        "        print(\"high 에서 복구:\", e)   # => 잡아서 전파 멈춤",
        "        return -1",
        "",
        "print(high(\"x\"))            # => high 에서 복구: ... / -1",
        "",
        "# 아무도 안 잡으면? → 트레이스백이 호출 경로 전체를 출력",
        "# Traceback (most recent call last):",
        "#   File ..., in high  ->  mid  ->  low",
        "# ValueError: invalid literal for int() with base 10: 'x'",
      ]},
      hierarchy: {lang: "python", filename: "hierarchy.py — 순서와 튜플", lines: [
        "config = {\"port\": \"8080\"}",
        "",
        "try:",
        "    port = int(config[\"prot\"])   # 오타 키 → KeyError",
        "except KeyError as e:",
        "    print(\"설정 키 없음:\", e)      # => 설정 키 없음: 'prot'",
        "except (ValueError, TypeError) as e:",
        "    print(\"값 형식 오류:\", e)      # 튜플로 여러 예외 묶기",
        "except Exception as e:",
        "    print(\"그 외:\", e)            # 넓은 그물은 맨 아래",
        "",
        "# 순서 규칙: 구체 → 넓은",
        "try:",
        "    x = int(\"oops\")",
        "except Exception:",
        "    print(\"여기서 다 잡힘\")",
        "except ValueError:",
        "    print(\"도달 불가 — 죽은 코드!\")  # 위 Exception 이 먼저 잡음",
      ]},

            title: "① 빈 except — 에러 삼키기",
            bad: "try:\n    save(order)\nexcept:\n    pass          # 모든 실패 은폐",
            badOut: "버그가 흔적 없이 사라짐",
            good: "try:\n    save(order)\nexcept DBError:\n    log.exception(\"저장 실패\")\n    raise         # 최소한 흔적+전파"
          },
          {
            title: "② 너무 넓은 except",
            bad: "try:\n    total = prise * qty   # 오타!\nexcept Exception:\n    total = 0",
            badOut: "NameError(오타)까지 삼킴",
            good: "try:\n    total = price * qty\nexcept (TypeError, ValueError):\n    total = 0    # 의도한 예외만"
          },
          {
            title: "③ 예외를 흐름 제어로 남용",
            bad: "try:\n    while True:\n        x = next(it)\nexcept StopIteration:\n    ...  # 세밀히 제어 시 남용 주의",
            badOut: "느리고 의도가 흐려짐",
            good: "for x in it:\n    ...          # 파이썬이 알아서 종료"
          }
        ],
        alert: {
          tone: "danger",
          text: "3원칙: (1) 잡을 예외는 최대한 좁게, (2) 삼킬 거면 logging.exception 으로 흔적을, (3) 복구 못 할 예외는 잡지 말고 전파. \"실패는 조용히 사라지는 것보다 시끄럽게 드러나는 게 낫다.\""
        },
        code: {...CODE.antipattern, highlight: [19, 20, 21, 22]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — try/except/else/finally 블록 실행 순서
    // ─────────────────────────────────────────────────────
    function FlowView({ flow }) {
      const [mode, setMode] = useState('normal');
      const rows = flow[mode];
      const BLOCK_COLOR = {
        try: 'border-[#3776AB] bg-blue-50 text-[#1e4c6e]',
        except: 'border-red-400 bg-red-50 text-red-800',
        else: 'border-emerald-400 bg-emerald-50 text-emerald-800',
        finally: 'border-amber-400 bg-amber-50 text-amber-900',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-[11px] font-bold text-[#1e4c6e]">🧱 실행 순서 시뮬레이션</div>
              <div className="flex gap-1">
                {[['normal', '정상 (try 성공)'], ['error', '예외 발생']].map(([m, lbl]) => (
                  <button
                    key={m}
                    onClick={() => setMode(m)}
                    aria-label={lbl}
                    className={`text-[10px] rounded px-2 py-1 border ${mode === m ? 'bg-[#3776AB] text-white border-[#3776AB]' : 'bg-white text-[#1e4c6e] border-blue-300 hover:bg-blue-50'}`}
                  >{lbl}</button>
                ))}
              </div>
            </div>
            <div className="space-y-1.5">
              {rows.map((r, i) => (
                <div key={i} className={`flex items-center gap-2 rounded border-2 px-2 py-1.5 ${BLOCK_COLOR[r.block]} ${r.run ? '' : 'opacity-35'}`}>
                  <span className={`w-5 h-5 shrink-0 flex items-center justify-center rounded-full text-white text-[10px] font-bold ${r.run ? 'bg-[#1e4c6e]' : 'bg-slate-300'}`}>{r.order != null ? r.order : '·'}</span>
                  <span className="font-mono font-bold text-[11px] w-14 shrink-0">{r.block}</span>
                  <span className="font-mono text-[10px] flex-1">{r.label}</span>
                  <span className="text-[9px] font-bold">{r.run ? '실행' : '건너뜀'}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">읽는 법: </span>번호 = 실행 순서. <span className="font-mono">else</span> 는 try 성공 시에만, <span className="font-mono">except</span> 는 예외 시에만. <span className="font-mono">finally</span> 는 <b>항상</b> 마지막.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 호출 스택 되감기(unwinding)
    // ─────────────────────────────────────────────────────
    function PropagateView({ propagate }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-3">📉 예외가 호출 스택을 타고 올라감</div>
            <div className="space-y-0">
              {propagate.frames.map((f, i) => (
                <div key={i}>
                  <div className={`flex items-center gap-2 rounded-lg border-2 px-3 py-2 ${f.caught ? 'border-emerald-400 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                    <span className="font-mono font-bold text-[12px] text-[#1e4c6e] w-16 shrink-0">{f.fn}</span>
                    <span className="text-[10px] text-slate-600 flex-1">{f.role}</span>
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${f.caught ? 'bg-emerald-500 text-white' : 'bg-red-400 text-white'}`}>{f.caught ? '✓ 잡음' : '통과'}</span>
                  </div>
                  <div className="text-[9px] text-slate-500 ml-2 my-0.5">{f.note}</div>
                  {i < propagate.frames.length - 1 && (
                    <div className="text-center text-red-500 text-lg leading-none">▲</div>
                  )}
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-center text-red-600 font-bold">raise 지점(low) → 위로 되감기 → high 에서 정지</div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            각 프레임의 <span className="font-mono">finally</span> 는 빠져나가는 길에 실행되어 정리가 보장된다. 아무도 안 잡으면 최상단까지 → 트레이스백 출력 후 종료.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 예외 계층 트리 + 매칭
    // ─────────────────────────────────────────────────────
    function HierarchyView({ hierarchy }) {
      const KIND = {
        root: 'border-slate-400 bg-slate-100 text-slate-700',
        system: 'border-purple-300 bg-purple-50 text-purple-800',
        base: 'border-[#3776AB] bg-blue-50 text-[#1e4c6e]',
        concrete: 'border-blue-200 bg-white text-slate-600',
        match: 'border-emerald-500 bg-emerald-100 text-emerald-900',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🌳 예외 계층 — <span className="font-mono text-emerald-700">raise {hierarchy.raised}</span> 매칭</div>
            <div className="space-y-1">
              {hierarchy.tree.map((n, i) => (
                <div key={i} className="flex items-center" style={{ paddingLeft: `${n.depth * 20}px` }}>
                  {n.depth > 0 && <span className="text-slate-400 font-mono text-xs mr-1">└</span>}
                  <span className={`font-mono text-[11px] font-bold rounded border-2 px-2 py-0.5 ${KIND[n.kind]}`}>{n.name}</span>
                  {n.kind === 'match' && <span className="ml-2 text-[9px] font-bold text-emerald-700">← except ValueError 로 잡힘</span>}
                  {n.kind === 'base' && <span className="ml-2 text-[9px] text-[#3776AB]">← except Exception 은 이 하위 전부</span>}
                  {n.kind === 'system' && <span className="ml-2 text-[9px] text-purple-600">Exception 밖 (안 잡힘)</span>}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">규칙: </span>구체(ValueError) → 넓은(Exception) 순서로 <span className="font-mono">except</span> 배치. 넓은 걸 위에 두면 아래 구체 절은 <b>죽은 코드</b>.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 예외 체이닝(__cause__)
    // ─────────────────────────────────────────────────────
    function ChainingView({ chaining }) {
      const TONE = {
        domain: 'border-[#3776AB] bg-blue-50 text-[#1e4c6e]',
        cause: 'border-red-400 bg-red-50 text-red-800',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-3">🔗 예외 번역 + 원인 보존</div>
            {chaining.chain.map((c, i) => (
              <div key={i}>
                <div className={`rounded-lg border-2 px-3 py-2 ${TONE[c.tone]}`}>
                  <div className="flex items-center gap-2">
                    <span className="text-[9px] font-mono text-slate-500 w-24 shrink-0">{c.layer}</span>
                    <span className="font-mono font-bold text-[12px]">{c.ex}</span>
                  </div>
                  <div className="text-[10px] text-slate-600 mt-0.5 ml-26">{c.desc}</div>
                </div>
                {i < chaining.chain.length - 1 && (
                  <div className="text-center text-[10px] text-slate-500 my-1">
                    <span className="font-mono bg-yellow-100 border border-yellow-300 rounded px-1.5 py-0.5">raise ... from e</span>
                    <div className="text-slate-400 text-lg leading-none">▼</div>
                  </div>
                )}
              </div>
            ))}
            <div className="mt-2 text-[10px] text-[#1e4c6e] bg-blue-50 border border-blue-200 rounded px-2 py-1.5">
              트레이스백: "위 예외 처리 도중(<span className="font-mono">The above ... direct cause</span>) 아래 예외 발생" 으로 인과가 남는다.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 커스텀 예외 트리 + EAFP vs LBYL
    // ─────────────────────────────────────────────────────
    function CustomView({ custom }) {
      const KIND = {
        base: 'border-[#3776AB] bg-blue-50 text-[#1e4c6e]',
        domain: 'border-indigo-400 bg-indigo-50 text-indigo-800',
        leaf: 'border-emerald-400 bg-emerald-50 text-emerald-800',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🏗 도메인 예외 계층</div>
            <div className="space-y-1">
              {custom.tree.map((n, i) => (
                <div key={i} className="flex items-center" style={{ paddingLeft: `${n.depth * 20}px` }}>
                  {n.depth > 0 && <span className="text-slate-400 font-mono text-xs mr-1">└</span>}
                  <span className={`font-mono text-[11px] font-bold rounded border-2 px-2 py-0.5 ${KIND[n.kind]}`}>{n.name}</span>
                  {n.kind === 'domain' && <span className="ml-2 text-[9px] text-indigo-600">← except OrderError 로 하위 전부</span>}
                </div>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-slate-300 bg-white p-2">
              <div className="text-[10px] font-bold text-slate-600 mb-1">{custom.compare.lbyl.title}</div>
              <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{custom.compare.lbyl.lines.join('\n')}</pre>
            </div>
            <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2">
              <div className="text-[10px] font-bold text-emerald-700 mb-1">{custom.compare.eafp.title}</div>
              <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{custom.compare.eafp.lines.join('\n')}</pre>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 안티패턴 3종 카드
    // ─────────────────────────────────────────────────────
    function AntipatternView({ antipattern }) {
      return (
        <div className="space-y-2">
          {antipattern.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-blue-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">{p.title}</div>
              <div className="grid grid-cols-2 gap-2">
                <div className="rounded bg-red-50 border border-red-200 p-1.5">
                  <div className="text-[9px] font-bold text-red-600 mb-0.5">✗ 나쁨</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.bad}</pre>
                  <div className="text-[9px] text-red-500 mt-1 whitespace-pre-wrap">{p.badOut}</div>
                </div>
                <div className="rounded bg-emerald-50 border border-emerald-200 p-1.5">
                  <div className="text-[9px] font-bold text-emerald-600 mb-0.5">✓ 좋음</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.good}</pre>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      flow:        { icon: '🧱', label: '블록 순서' },
      propagate:   { icon: '📉', label: '스택 전파' },
      hierarchy:   { icon: '🌳', label: '예외 계층' },
      chaining:    { icon: '🔗', label: '예외 체이닝' },
      custom:      { icon: '🏗', label: '커스텀·EAFP' },
      antipattern: { icon: '🚫', label: '안티패턴' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.flow;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>예외 처리 설계 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'flow' && <FlowView flow={state.flow} />}
          {state.stage === 'propagate' && <PropagateView propagate={state.propagate} />}
          {state.stage === 'hierarchy' && <HierarchyView hierarchy={state.hierarchy} />}
          {state.stage === 'chaining' && <ChainingView chaining={state.chaining} />}
          {state.stage === 'custom' && <CustomView custom={state.custom} />}
          {state.stage === 'antipattern' && <AntipatternView antipattern={state.antipattern} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅱ. 객체와 모듈</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">II-2-2</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">예외 처리 설계</h1>
                <p className="text-sm text-[#1e4c6e]/80">try/except/else/finally와 예외 계층·커스텀 예외로 견고한 에러 처리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                예외 처리의 뼈대는 try/except/else/finally다 — try 는 좁게, else 로 성공 후속을 분리하고, finally(또는 with)로 정리를 보장한다.
                안 잡힌 예외는 호출 스택을 되감으며 전파되므로 "가장 잘 대응할 계층"에서 잡고, except 는 구체 → 넓은 순서로 배치한다.
                저수준 예외는 raise ... from e 로 도메인 예외로 번역하되 원인을 보존하고, 커스텀 예외는 Exception 을 상속해 계층으로 설계한다.
                파이썬은 EAFP 를 선호하며, 안티패턴 3종(빈 except·너무 넓은 except·예외를 흐름제어로 남용)만 피해도 시스템이 견고해진다.
                다음 장 III-1-1에서는 이 위에 함수·데코레이터 설계를 얹는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['try', 'except', 'else', 'finally', '예외전파', '예외계층', 'raise from', '체이닝', '커스텀예외', 'EAFP', 'LBYL', '안티패턴'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
