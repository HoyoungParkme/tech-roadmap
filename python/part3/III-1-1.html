  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Python III-1-1 — 이터레이터·제너레이터
    학습 목표: for가 도는 진짜 원리(이터레이터 프로토콜: __iter__/__next__/StopIteration)에서
              출발해, yield로 값을 하나씩 생산하며 상태를 보존하는 제너레이터, 리스트 vs
              제너레이터의 메모리 차이, itertools·yield from 파이프라인, 그리고 1회 소비·
              메모리 폭발 같은 실무 함정까지 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: for의 iter()/next() 애니메이션·yield 일시정지/재개·메모리 대비) / 우(VSCode CodeViewer: python)
    색상: Python 파랑 #3776AB · 형광펜 노랑 #FFD43B · 글자/링크 파랑다크 #1e4c6e
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 프로토콜 → for 원리 → yield → 메모리 → 파이프라인 → 함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(proto/forloop/gen/memory/pipeline/pitfalls)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      protocol: {lang: "python", filename: "protocol.py — 프로토콜 확인", lines: [
        "# 이터러블: __iter__ 로 이터레이터를 만들 수 있는 것",
        "nums = [10, 20, 30]",
        "print(hasattr(nums, \"__iter__\"))   # => True  (이터러블)",
        "print(hasattr(nums, \"__next__\"))   # => False (이터레이터 아님)",
        "",
        "# iter() 로 별도의 이터레이터 객체를 생성",
        "it = iter(nums)",
        "print(type(it))          # => <class 'list_iterator'>",
        "print(hasattr(it, \"__next__\"))     # => True",
        "",
        "# next() 로 값을 하나씩 꺼낸다",
        "print(next(it))          # => 10",
        "print(next(it))          # => 20",
        "print(next(it))          # => 30",
        "",
        "# 더 없으면 StopIteration",
        "# print(next(it))        # StopIteration!",
        "",
        "# 이터레이터의 __iter__ 는 자기 자신을 반환",
        "print(iter(it) is it)    # => True",
      ]},
      forloop: {lang: "python", filename: "forloop.py — for를 손으로 풀어쓰기", lines: [
        "nums = [10, 20, 30]",
        "",
        "# (A) 우리가 쓰는 for 문",
        "for x in nums:",
        "    print(x)             # => 10, 20, 30",
        "",
        "# (B) 파이썬이 내부에서 실제로 하는 일",
        "it = iter(nums)          # ① iter() 는 딱 한 번",
        "while True:",
        "    try:",
        "        x = next(it)     # ② 매 반복 next()",
        "    except StopIteration:",
        "        break            # ③ 여기서 조용히 종료",
        "    print(x)             # => 10, 20, 30",
        "",
        "# (A) 와 (B) 는 완전히 동일하게 동작한다",
        "# → 프로토콜(__iter__/__next__)만 지키면",
        "#   무엇이든 for 로 순회할 수 있다",
      ]},
      generator: {lang: "python", filename: "generator.py — yield 상태 보존", lines: [
        "# yield 가 있으면 \"제너레이터 함수\"",
        "def countdown(n):",
        "    while n > 0:",
        "        yield n          # 여기서 값 내주고 멈춤",
        "        n -= 1           # 재개되면 이 줄부터",
        "",
        "# 호출해도 몸통은 아직 실행되지 않는다",
        "gen = countdown(3)",
        "print(type(gen))         # => <class 'generator'>",
        "",
        "# next() 마다 yield 까지 실행 후 멈춤 (상태 유지)",
        "print(next(gen))         # => 3",
        "print(next(gen))         # => 2",
        "print(next(gen))         # => 1",
        "# print(next(gen))       # StopIteration (n==0)",
        "",
        "# 보통은 for 로 소비 — StopIteration 자동 처리",
        "for x in countdown(3):",
        "    print(x)             # => 3, 2, 1",
        "",

        ],
        alert: { tone: "warn", text: "PEP 479(파이썬 3.7+) 이후, 제너레이터 밖으로 새어 나간 StopIteration 은 RuntimeError 가 된다." },

          {

            good: "data = list(x for x in range(3))\n# 또는 itertools.tee / 매번 새로 생성"
          },
          {
            title: "③ StopIteration 누수 → RuntimeError",
            bad: "def gen(it):\n    while True:\n        yield next(it)  # 누수!",

          }
        ],
        alert: {
          tone: "danger",
          text: "핵심 습관: 큰 데이터는 for-라인 제너레이터로, 두 번 쓸 값은 list()로 물질화, 직접 next()는 기본값 또는 try/except. 이 3종만 피해도 이터레이터 버그의 대부분이 사라진다."
        },

      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 이터러블 → iter() → 이터레이터 관계도 + 표
    // ─────────────────────────────────────────────────────
    function ProtoView({ proto }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-3">🔁 iter() 가 놓는 다리</div>
            <div className="flex items-center gap-2">
              <div className="flex-1 rounded-lg border-2 border-[#3776AB] bg-blue-50 p-2.5 text-center">
                <div className="text-[11px] font-mono font-bold text-[#1e4c6e]">{proto.iterable.label}</div>
                <div className="text-[9px] text-[#3776AB] mt-1">이터러블 · {proto.iterable.has}</div>
              </div>
              <div className="flex flex-col items-center px-1">
                <span className="text-[9px] text-slate-500 font-mono">iter()</span>
                <span className="text-blue-400 text-lg">──▶</span>
              </div>
              <div className="flex-1 rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5 text-center">
                <div className="text-[11px] font-mono font-bold text-amber-900">{proto.iterator.label}</div>
                <div className="text-[9px] text-amber-700 mt-1">이터레이터 · {proto.iterator.has}</div>
              </div>
            </div>
            <div className="mt-3 flex items-center justify-center gap-1.5 text-[10px]">
              <span className="font-mono rounded px-2 py-1 bg-[#3776AB] text-white">next()</span>
              <span className="text-slate-500">→ 값 하나씩 · 소진 시</span>
              <span className="font-mono rounded px-2 py-1 bg-red-100 text-red-700 border border-red-300">StopIteration</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">🧭 무엇이 어느 쪽인가</div>
            <table className="w-full text-[10px]">
              <tbody>
                {proto.rows.map((r, i) => (
                  <tr key={i} className="border-t border-blue-100">
                    <td className="py-1 font-mono font-bold text-slate-700 whitespace-nowrap pr-2">{r.obj}</td>
                    <td className={`py-1 font-bold pr-2 whitespace-nowrap ${r.kind === '이터레이터' ? 'text-amber-800' : 'text-[#3776AB]'}`}>{r.kind}</td>
                    <td className="py-1 font-mono text-slate-500 pr-2 whitespace-nowrap">{r.has}</td>
                    <td className="py-1 text-slate-500">{r.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — for 루프 애니메이션 (iter → next 반복 → StopIteration)
    // ─────────────────────────────────────────────────────
    function ForLoopView({ forloop }) {
      const seq = forloop.seq;
      // phase: 0=iter(), 1..n=next()가 seq[phase-1] 반환, n+1=StopIteration
      const [phase, setPhase] = useState(0);
      useEffect(() => {
        const t = setInterval(() => {
          setPhase((p) => (p >= seq.length + 1 ? 0 : p + 1));
        }, 1100);
        return () => clearInterval(t);
      }, []);

      const cursor = phase - 1; // 현재 next()가 가리키는 인덱스
      const done = phase === seq.length + 1;
      const collected = seq.slice(0, Math.max(0, Math.min(phase, seq.length)));

      let statusText, statusTone;
      if (phase === 0) { statusText = 'it = iter(nums) — 이터레이터 생성 (딱 한 번)'; statusTone = 'bg-blue-100 text-[#1e4c6e] border-blue-300'; }
      else if (done) { statusText = 'next(it) → StopIteration ⛔ — for가 잡아서 루프 종료'; statusTone = 'bg-red-100 text-red-700 border-red-300'; }
      else { statusText = `next(it) → ${seq[cursor]} — x 에 담고 본문 실행`; statusTone = 'bg-emerald-100 text-emerald-800 border-emerald-300'; }

      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-3">⚙️ for x in [10, 20, 30] 내부 재생</div>
            <div className="flex gap-1.5 justify-center mb-3">
              {seq.map((v, i) => {
                const isCursor = i === cursor && !done && phase !== 0;
                const isPast = i < cursor || (i <= cursor && phase !== 0);
                return (
                  <div key={i} className="flex flex-col items-center">
                    <div className={`w-12 h-12 flex items-center justify-center rounded-lg border-2 font-mono font-bold text-sm transition
                      ${isCursor ? 'bg-[#FFD43B] border-[#3776AB] text-[#1e4c6e] scale-110 shadow'
                        : isPast ? 'bg-emerald-50 border-emerald-300 text-emerald-700'
                        : 'bg-blue-50 border-blue-200 text-[#1e4c6e]'}`}>
                      {v}
                    </div>
                    {isCursor && <span className="text-[9px] text-[#3776AB] mt-0.5 font-bold">next↑</span>}
                    {!isCursor && <span className="text-[9px] text-slate-400 mt-0.5">[{i}]</span>}
                  </div>
                );
              })}
              <div className="flex flex-col items-center">
                <div className={`w-12 h-12 flex items-center justify-center rounded-lg border-2 border-dashed font-mono text-[9px] transition
                  ${done ? 'bg-red-100 border-red-400 text-red-600 scale-110' : 'bg-slate-50 border-slate-300 text-slate-400'}`}>
                  Stop
                </div>
                <span className="text-[9px] text-slate-400 mt-0.5">끝</span>
              </div>
            </div>
            <div className={`text-[10px] font-mono rounded px-2 py-1.5 border text-center ${statusTone}`}>{statusText}</div>
            <div className="mt-2 text-[10px] text-slate-500">
              <span className="font-bold text-[#1e4c6e]">지금까지 출력: </span>
              <span className="font-mono text-emerald-700">{collected.length ? collected.join(', ') : '—'}</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">핵심: </span>iter()는 <span className="font-mono">1번</span>, next()는 <span className="font-mono">원소 수만큼</span>, StopIteration은 for가 <span className="font-mono">대신 잡아</span> 준다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 제너레이터 yield 일시정지/재개 애니메이션
    // ─────────────────────────────────────────────────────
    function GenView({ gen }) {
      const steps = gen.steps;
      const [i, setI] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setI((p) => (p >= steps.length - 1 ? 0 : p + 1)), 1200);
        return () => clearInterval(t);
      }, []);
      const cur = steps[i];
      const isStop = cur.out === 'StopIteration';
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-3">🌱 def countdown(n): yield n</div>
            <div className="flex items-center gap-3">
              <div className={`flex-1 rounded-lg border-2 p-3 text-center transition
                ${cur.paused ? 'border-[#FFD43B] bg-yellow-50' : isStop ? 'border-red-300 bg-red-50' : 'border-blue-200 bg-blue-50'}`}>
                <div className="text-[9px] text-slate-500 mb-1">실행 위치 (PC)</div>
                <div className={`text-sm font-mono font-bold ${cur.paused ? 'text-[#1e4c6e]' : isStop ? 'text-red-600' : 'text-slate-400'}`}>
                  {cur.pc ? cur.pc : '— 미실행 —'}
                </div>
                <div className="mt-1 text-[10px]">
                  {cur.paused ? <span className="text-[#3776AB] font-bold">⏸ yield 에서 멈춤</span>
                    : isStop ? <span className="text-red-600 font-bold">⛔ 함수 종료</span>
                    : <span className="text-slate-400">▶ 대기</span>}
                </div>
              </div>
              <div className="w-24 shrink-0 rounded-lg border-2 border-[#3776AB] bg-white p-2 text-center">
                <div className="text-[9px] text-slate-500">보존된 상태</div>
                <div className="text-lg font-mono font-bold text-[#1e4c6e]">n = {cur.n}</div>
                <div className="text-[8px] text-[#3776AB]">next() 사이 유지</div>
              </div>
            </div>
            <div className="mt-3 rounded bg-[#282c34] p-2.5 font-mono text-xs">
              <div className="text-slate-400">&gt;&gt;&gt; {cur.call}</div>
              <div className={`mt-1 ${isStop ? 'text-red-400' : 'text-yellow-300'}`}>{cur.out}</div>
            </div>
          </div>
          <div className="flex gap-1 justify-center">
            {steps.map((_, k) => (
              <div key={k} className={`h-1.5 w-8 rounded-full transition ${k === i ? 'bg-[#3776AB]' : 'bg-blue-100'}`} />
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 리스트 vs 제너레이터 메모리 대비
    // ─────────────────────────────────────────────────────
    function MemoryView({ memory }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setTick((p) => (p + 1) % 8), 700);
        return () => clearInterval(t);
      }, []);
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1">💥 {memory.list.title}</div>
            <div className="flex gap-1 flex-wrap mb-1.5">
              {memory.list.cells.map((c, i) => (
                <span key={i} className="w-8 h-8 flex items-center justify-center rounded bg-white border-2 border-red-300 text-[10px] font-mono font-bold text-red-700">{c}</span>
              ))}
              <span className="w-8 h-8 flex items-center justify-center rounded bg-white border-2 border-red-200 text-[10px] text-red-400">…</span>
            </div>
            <div className="text-[10px] font-mono text-red-600">메모리: {memory.list.mem} · 전부 동시에 적재</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3">
            <div className="text-[11px] font-bold text-emerald-700 mb-1">🌊 {memory.gen.title}</div>
            <div className="flex gap-1 items-center mb-1.5">
              {[0, 1, 2, 3, 4, 5, 6].map((i) => {
                const active = i === tick % 7;
                return (
                  <span key={i} className={`w-8 h-8 flex items-center justify-center rounded border-2 text-[10px] font-mono font-bold transition
                    ${active ? 'bg-[#FFD43B] border-emerald-500 text-[#1e4c6e] scale-110 shadow' : 'bg-white/40 border-dashed border-emerald-200 text-emerald-300'}`}>
                    {active ? (i * i) : '·'}
                  </span>
                );
              })}
            </div>
            <div className="text-[10px] font-mono text-emerald-700">메모리: {memory.gen.mem} · 한 번에 딱 1개만 존재</div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">트레이드오프: </span>제너레이터는 <span className="font-mono">gen[3]</span>·<span className="font-mono">len(gen)</span> 불가, 1회 소비. 여러 번 쓰면 리스트로.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 제너레이터 파이프라인 + itertools 부품
    // ─────────────────────────────────────────────────────
    function PipelineView({ pipeline }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-3">🔗 지연 파이프라인 — 값 하나가 관을 통과</div>
            <div className="space-y-1.5">
              {pipeline.stages.map((s, i) => (
                <div key={i}>
                  <div className="flex items-center gap-2 rounded-lg border-2 border-[#3776AB] bg-blue-50 p-2">
                    <span className="text-[10px] font-mono font-bold text-white bg-[#3776AB] rounded px-1.5 py-0.5 shrink-0">{s.name}</span>
                    <span className="text-[10px] text-slate-500 flex-1">{s.desc}</span>
                    <span className="text-[9px] font-mono text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-1.5 py-0.5">{s.sample}</span>
                  </div>
                  {i < pipeline.stages.length - 1 && (
                    <div className="text-center text-[#FFD43B] text-sm leading-none my-0.5">▼</div>
                  )}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">🧰 itertools — 지연 부품</div>
            <table className="w-full text-[10px]">
              <tbody>
                {pipeline.tools.map((t, i) => (
                  <tr key={i} className="border-t border-blue-100">
                    <td className="py-1 font-mono font-bold text-slate-700 whitespace-nowrap pr-2">{t.fn}</td>
                    <td className="py-1 text-slate-500">{t.out}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실무 함정 3종 카드
    // ─────────────────────────────────────────────────────
    function PitfallsView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-blue-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">{p.title}</div>
              <div className="grid grid-cols-2 gap-2">
                <div className="rounded bg-red-50 border border-red-200 p-1.5">
                  <div className="text-[9px] font-bold text-red-600 mb-0.5">✗ 나쁨</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.bad}</pre>
                  <div className="text-[9px] text-red-500 mt-1 whitespace-pre-wrap">{p.badOut}</div>
                </div>
                <div className="rounded bg-emerald-50 border border-emerald-200 p-1.5">
                  <div className="text-[9px] font-bold text-emerald-600 mb-0.5">✓ 좋음</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.good}</pre>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      proto:    { icon: '🔁', label: '프로토콜' },
      forloop:  { icon: '⚙️', label: 'for 원리' },
      gen:      { icon: '🌱', label: 'yield' },
      memory:   { icon: '💾', label: '메모리' },
      pipeline: { icon: '🔗', label: '파이프라인' },
      pitfalls: { icon: '🚨', label: '실무 함정' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.proto;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>이터레이터·제너레이터 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'proto' && <ProtoView proto={state.proto} />}
          {state.stage === 'forloop' && <ForLoopView forloop={state.forloop} />}
          {state.stage === 'gen' && <GenView gen={state.gen} />}
          {state.stage === 'memory' && <MemoryView memory={state.memory} />}
          {state.stage === 'pipeline' && <PipelineView pipeline={state.pipeline} />}
          {state.stage === 'pitfalls' && <PitfallsView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅲ. 파이썬다운 코드</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">III-1-1</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">이터레이터·제너레이터</h1>
                <p className="text-sm text-[#1e4c6e]/80">for가 도는 원리(이터레이터 프로토콜)와 yield로 메모리 효율적 지연 시퀀스 만들기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                for는 iter()를 한 번 부르고 next()를 반복하다 StopIteration에서 멈추는 프로토콜이다. yield가 있는 함수는
                호출 시 제너레이터(이터레이터)를 만들고, next()마다 yield까지 실행됐다 멈추며 지역 상태를 보존한다 — 덕분에 지연 평가로
                큰/무한 시퀀스도 메모리 한 개분으로 처리한다. 리스트는 전부 적재(여러 번·인덱싱 가능), 제너레이터는 하나씩(1회 소비)이 트레이드오프다.
                itertools(count·islice·chain)와 yield from으로 지연 파이프라인을 조립하고, 메모리 폭발·1회 소비·StopIteration 누수 3종만 피하면 실무 버그가 크게 준다.
                다음 장 III-1-2에서는 데코레이터로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['이터러블', '이터레이터', '__iter__', '__next__', 'StopIteration', 'yield', '지연평가', '제너레이터식', 'itertools', 'yield from', '메모리효율'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
