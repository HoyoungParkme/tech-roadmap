      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();

    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }

    // ─────────────────────────────────────────────────────
    // Step 1 — 디렉터리 트리 시각화
    // ─────────────────────────────────────────────────────
    function TreeView({ tree }) {
      const KIND = {
        root: { color: '#1e4c6e', chip: 'bg-blue-100 border-blue-300' },
        dir:  { color: '#3776AB', chip: 'bg-blue-50 border-blue-200' },
        pkg:  { color: '#3776AB', chip: 'bg-blue-50 border-blue-200' },
        file: { color: '#57534a', chip: 'bg-white border-slate-200' },
        key:  { color: '#92400e', chip: 'bg-amber-50 border-amber-300' },
      };
      const ICON = { root: '📦', dir: '📁', pkg: '🐍', file: '📄', key: '⭐' };
      return (
        <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
          <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">📁 표준 src 레이아웃</div>
          <div className="space-y-0.5 font-mono">
            {tree.map((n, i) => {
              const k = KIND[n.kind] || KIND.file;
              return (
                <div key={i} className="flex items-center text-[11px]" style={{ paddingLeft: n.depth * 16 }}>
                  <span className={`inline-flex items-center gap-1 rounded px-1.5 py-0.5 border ${k.chip}`} style={{ color: k.color }}>
                    <span>{ICON[n.kind]}</span>
                    <span className="font-bold">{n.name}</span>
                  </span>
                  {n.note && <span className="ml-2 text-[9px] text-slate-500 font-sans">{n.note}</span>}
                </div>
              );
            })}
          </div>
          <div className="mt-3 text-[10px] text-[#1e4c6e] bg-yellow-100 border border-yellow-300 rounded px-2 py-1.5">
            ⭐ 표시(pyproject.toml · poetry.lock)는 루트에 두고 <b>반드시 커밋</b> — 도구가 프로젝트 루트를 인식하고 재현성을 보장한다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — pyproject.toml 섹션 도식

    function PyprojectView({ sections, replaces }) {
      const TONE = {
        blue:    'bg-blue-50 border-blue-300 text-[#1e4c6e]',
        amber:   'bg-amber-50 border-amber-400 text-amber-900',
        emerald: 'bg-emerald-50 border-emerald-400 text-emerald-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">📄 pyproject.toml 한 파일에 통합</div>
            <div className="space-y-1.5">
              {sections.map((s, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${TONE[s.tone]}`}>
                  <div className="flex items-baseline gap-2">
                    <span className="font-mono font-bold text-[10px]">{s.tag}</span>
                    <span className="text-[9px] opacity-80">— {s.role}</span>
                  </div>
                  <div className="mt-1 flex flex-wrap gap-1">
                    {s.items.map((it, j) => (
                      <span key={j} className="font-mono text-[9px] bg-white/70 border border-current/20 rounded px-1 py-0.5">{it}</span>

          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">🔁 옛 파일들을 대체</div>
            <table className="w-full text-[10px]">
              <tbody>
                {replaces.map((r, i) => (
                  <tr key={i} className="border-t border-blue-100">
                    <td className="py-1 font-mono text-red-600 line-through pr-2 whitespace-nowrap">{r.old}</td>
                    <td className="py-1 text-blue-400 px-1">▶</td>
                    <td className="py-1 font-mono font-bold text-emerald-700">{r.new}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — poetry 의존성 흐름 + lock 표
    // ─────────────────────────────────────────────────────
    function PoetryFlowView({ flow, lockRows }) {
      const TONE = {
        blue:    'bg-blue-50 border-blue-300 text-[#1e4c6e]',
        amber:   'bg-amber-50 border-amber-400 text-amber-900',
        emerald: 'bg-emerald-50 border-emerald-400 text-emerald-900',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🔒 선언 → 해결 → lock → 설치</div>
            <div className="space-y-1.5">
              {flow.map((f, i) => (
                <div key={i}>
                  <div className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 ${TONE[f.tone]}`}>
                    <span className="w-5 h-5 shrink-0 rounded-full bg-[#3776AB] text-white text-[10px] font-bold flex items-center justify-center">{f.icon}</span>
                    <div className="flex-1">
                      <div className="font-mono font-bold text-[10px]">{f.label}</div>
                      <div className="text-[9px] opacity-80">{f.detail}</div>
                    </div>
                    <span className="text-[8px] font-mono uppercase opacity-60">{f.title}</span>
                  </div>
                  {i < flow.length - 1 && <div className="text-center text-blue-400 text-xs leading-none">▼</div>}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-400 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">📌 poetry.lock — 범위를 정확한 버전으로 고정</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-slate-500 text-[9px]">
                  <td className="pb-1">패키지</td><td className="pb-1">pyproject 범위</td><td className="pb-1">lock 고정</td>
                </tr>
              </thead>
              <tbody>
                {lockRows.map((r, i) => (
                  <tr key={i} className="border-t border-amber-100">
                    <td className="py-1 font-mono font-bold text-slate-700">{r.pkg}</td>
                    <td className="py-1 font-mono text-slate-500">{r.range}</td>
                    <td className="py-1 font-mono font-bold text-emerald-700">{r.locked}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 의존성 그룹 + 진입점 + 설치 비교
    // ─────────────────────────────────────────────────────
    function GroupsView({ buckets, entry, compare }) {
      const TONE = { good: 'text-emerald-700', bad: 'text-red-600' };
      const Bucket = ({ b, tone }) => (
        <div className={`rounded border-2 p-2 ${tone}`}>
          <div className="text-[10px] font-bold mb-1">{b.title}</div>
          <div className="flex flex-wrap gap-1">
            {b.pkgs.map((p, i) => (
              <span key={i} className="font-mono text-[10px] bg-white/70 border border-current/20 rounded px-1.5 py-0.5">{p}</span>
            ))}
          </div>
        </div>
      );
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3 space-y-1.5">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1">🧪 의존성 그룹 분리</div>
            <Bucket b={buckets.main} tone="bg-emerald-50 border-emerald-400 text-emerald-900" />
            <Bucket b={buckets.dev} tone="bg-amber-50 border-amber-400 text-amber-900" />
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">🎯 진입점 (entry point)</div>
            <div className="flex items-center gap-2 text-[10px] font-mono">
              <span className="rounded bg-[#3776AB] text-white px-2 py-1 font-bold">$ {entry.cmd}</span>
              <span className="text-blue-400">──▶</span>
              <span className="rounded bg-blue-50 border border-blue-300 text-[#1e4c6e] px-2 py-1">{entry.target}</span>
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">{entry.note}</div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">⚙️ 설치 범위 비교</div>
            <table className="w-full text-[10px]">
              <tbody>
                {compare.map((c, i) => (
                  <tr key={i} className="border-t border-blue-100">
                    <td className="py-1 font-mono font-bold text-slate-700 whitespace-nowrap pr-2">{c.expr}</td>
                    <td className={`py-1 font-mono font-bold pr-2 ${TONE[c.tone]}`}>{c.result}</td>
                    <td className="py-1 text-slate-500">{c.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 함정 4종 카드
    // ─────────────────────────────────────────────────────
    function PitfallsView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-blue-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">{p.title}</div>
              <div className="grid grid-cols-2 gap-2">
                <div className="rounded bg-red-50 border border-red-200 p-1.5">
                  <div className="text-[9px] font-bold text-red-600 mb-0.5">✗ 나쁨</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.bad}</pre>
                  <div className="text-[9px] text-red-500 mt-1 whitespace-pre-wrap">{p.badOut}</div>
                </div>
                <div className="rounded bg-emerald-50 border border-emerald-200 p-1.5">
                  <div className="text-[9px] font-bold text-emerald-600 mb-0.5">✓ 좋음</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.good}</pre>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      layout:    { icon: '📁', label: '레이아웃' },
      pyproject: { icon: '📄', label: 'pyproject' },
      poetry:    { icon: '🔒', label: 'poetry 흐름' },
      groups:    { icon: '🧪', label: '그룹·진입점' },
      pitfalls:  { icon: '🚨', label: '실무 함정' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.layout;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>프로젝트 구조·poetry — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'layout' && <TreeView tree={state.tree} />}
          {state.stage === 'pyproject' && <PyprojectView sections={state.sections} replaces={state.replaces} />}
          {state.stage === 'poetry' && <PoetryFlowView flow={state.flow} lockRows={state.lockRows} />}
          {state.stage === 'groups' && <GroupsView buckets={state.buckets} entry={state.entry} compare={state.compare} />}
          {state.stage === 'pitfalls' && <PitfallsView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅴ. 현장 투입</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">V-1-1</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">프로젝트 구조·poetry</h1>
                <p className="text-sm text-[#1e4c6e]/80">재현 가능한 프로젝트 레이아웃과 poetry로 의존성·가상환경·패키징 관리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                재현 가능한 프로젝트는 구조에서 시작한다. src 레이아웃으로 임포트를 격리하고, pyproject.toml(PEP 518) 한 파일에
                메타·의존성·빌드를 선언한다. poetry 는 의존성을 선언→해결→lock→격리 설치하며, poetry.lock 을 커밋해야 팀·CI·배포가
                같은 버전을 재현한다. 개발/런타임 의존성은 group.dev 로 나눠 배포는 --only main 으로 가볍게 하고, 진입점은
                [tool.poetry.scripts] 로 연결한다. 실무 실패 4종(lock 미커밋·전역 설치·평면 레이아웃·의존성 미분리)만 피해도
                "내 컴퓨터에선 됐는데"가 사라진다. 다음 장 V-1-2로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['src레이아웃', '임포트격리', 'pyproject.toml', 'PEP518', 'poetry', 'poetry.lock', '재현성', '의존성그룹', '가상환경', '진입점', 'lock커밋'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
