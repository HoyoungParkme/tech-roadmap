    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Python V-2-2 — 종합: CLI 도구 만들기 (Part Ⅴ 현장 투입 · Python 마지막 장)
    학습 목표: 앞서 배운 구조(함수 분리)·타입힌트·예외·테스트·로깅·poetry 배포를
              하나의 실전 CLI 도구(로그 분석기 logtool)로 합친다.
              인자 파싱→검증→핵심 로직→출력/종료코드의 실행 흐름을 단계별로 추적하고,
              각 단계에 어떤 챕터 개념이 적용됐는지 배지로 연결한다.
    패턴: fastapi v1 — 좌(LiveDataPane: CLI 실행 파이프라인·Namespace 매핑·종료코드) / 우(VSCode CodeViewer: python)
    색상: Python 파랑 #3776AB · 형광펜 노랑 #FFD43B · 글자/링크 파랑다크 #1e4c6e
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 진입점·구조 → argparse → 타입/예외/종료코드 → 로깅/설정 → 테스트/배포
    //   예제 도구: 로그 파일을 분석하는 CLI "logtool"
    //     logtool count  access.log --level ERROR
    //     logtool top    access.log --n 5
    //   각 STEP = { title, desc, stage, concepts(합쳐지는 챕터 개념), 좌측 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      cli: {lang:'python', filename:'logtool/cli.py — 구조와 진입점', lines:[
        '"""logtool — 로그 파일 분석 CLI (종합 예제)."""',
        'import sys',
        'from pathlib import Path',
        '',
        '# 1) 핵심 로직: I/O 없이 "데이터 → 결과"만 (테스트하기 쉬움)',
        'def count_levels(lines: list[str]) -> dict[str, int]:',
        '    counts: dict[str, int] = {}',
        '    for line in lines:',
        '        level = line.split()[0] if line.split() else ""',
        '        if level:',
        '            counts[level] = counts.get(level, 0) + 1',
        '    return counts',
        '',
        '# 2) 조립: 파싱 → 검증 → 로직 → 출력',
        'def main(argv: list[str] | None = None) -> int:',
        '    args = parse_args(argv)          # ① 파싱',
        '    path = validate(args)            # ② 검증',
        '    lines = path.read_text().splitlines()',
        '    result = count_levels(lines)     # ③ 로직',
        '    render(result)                   # ④ 출력',
        '    return 0                         # 종료코드 0 = 성공',
        '',
        '# 3) 진입점: 셸이 종료코드를 받도록 SystemExit 로 반환',
        'if __name__ == "__main__":',
        '    raise SystemExit(main())',
      ]},
      parser: {lang:'python', filename:'logtool/cli.py — argparse 파서', lines:[
        'import argparse',
        '',
        'def parse_args(argv=None) -> argparse.Namespace:',
        '    p = argparse.ArgumentParser(',
        '        prog="logtool", description="로그 파일 분석 도구")',
        '    sub = p.add_subparsers(dest="cmd", required=True)',
        '',
        '    # 서브커맨드 1: count — 레벨별 개수',
        '    c = sub.add_parser("count", help="레벨별 로그 수 집계")',
        '    c.add_argument("path", help="로그 파일 경로")',
        '    c.add_argument("--level", choices=["INFO", "WARN", "ERROR"],',
        '                   help="특정 레벨만 세기")',
        '',
        '    # 서브커맨드 2: top — 상위 N개',
        '    t = sub.add_parser("top", help="가장 많은 레벨 N개")',
        '    t.add_argument("path")',
        '    t.add_argument("--n", type=int, default=3,  # 문자열→int 자동 변환',
        '                   help="표시할 개수 (기본 3)")',
        '',
        '    return p.parse_args(argv)',
        '',
        '# 예) logtool count access.log --level ERROR',
        '#  => Namespace(cmd="count", path="access.log", level="ERROR")',
      ]},
      errors: {lang:'python', filename:'logtool/cli.py — 검증과 예외', lines:[
        'import sys',
        'from pathlib import Path',
        '',
        'def validate(args) -> Path:',
        '    path = Path(args.path)',
        '    if not path.exists():',
        '        # 사용자 친화 에러: traceback 대신 한 줄 + 종료코드 1',
        '        print(f"error: 파일을 찾을 수 없습니다: {path}",',
        '              file=sys.stderr)',
        '        raise SystemExit(1)',
        '    return path',
        '',

                caption: '입력 리스트를 직접 만들고 결과 딕셔너리를 그대로 비교한다. Step 1의 구조 분리가 여기서 보상으로 돌아온다.',
                changes: [{mark:'new', text:'집계 결과 단언'},
                          {mark:'read', text:'입력·출력이 모두 값'}] },

        stage: 'deploy',
        stageLabel: '로직 테스트 — 파일 I/O 없음',
        concepts: ['테스트', '순수 함수'],
        tests: TESTS.slice(0, 2),
        entryPoint: ENTRY_TODO,
        alert: { tone: 'good', text: '입력도 출력도 그냥 값이라 테스트가 한 줄로 끝난다. 이게 로직을 I/O 에서 떼어 놓은 값어치다.' },
        code: {...CODE.deploy, highlight: [4,5,6]},
      },
      { ...S5,
        beat: { label: 'main 에 argv 를 넘긴다', at: 'tests/test_cli.py L8–11',
                caption: 'sys.argv 를 건드리지 않고 리스트를 직접 넘겨 CLI 전체 경로를 실행한다.',
                changes: [{mark:'new', text:'main 통합 테스트'},
                          {mark:'read', text:'argv 를 인자로 주입'}] },
        actor: '✅ main(["count", "no_such.log"])',
        stage: 'deploy',
        stageLabel: 'main 까지 셸 없이 실행한다',
        concepts: ['테스트', '함수 분리'],
        tests: TESTS.slice(0, 3),
        entryPoint: ENTRY_TODO,
        alert: { tone: 'info', text: 'Step 1에서 main(argv=None) 으로 받아 둔 덕분이다. sys.argv 를 함수 안에서 읽었다면 여기서 monkeypatch 가 필요했다.' },
        code: {...CODE.deploy, highlight: [8,9,10,11]},
      },
      { ...S5,
        beat: { label: '종료코드를 단언한다', at: 'tests/test_cli.py L12–13',
                caption: 'SystemExit 를 잡아 e.code 를 확인한다. 파일이 없으면 1 이어야 한다.',
                changes: [{mark:'new', text:'exit 1 검증'},
                          {mark:'read', text:'SystemExit.code'}] },
        actor: '✅ assert e.code == 1',
        stage: 'deploy',
        stageLabel: '에러 경로의 종료코드까지 검증',
        concepts: ['테스트', '종료코드'],
        tests: TESTS,
        entryPoint: ENTRY_TODO,
        alert: { tone: 'good', text: '종료코드는 CLI 의 공개 API 다. 메시지만 보지 말고 코드까지 테스트로 못 박아 둬야 셸 스크립트가 안전하다.' },
        code: {...CODE.deploy, highlight: [12,13]},
      },
      { ...S5,
        beat: { label: 'scripts 에 한 줄', at: 'tests/test_cli.py L15–17',
                caption: 'pyproject.toml 의 [tool.poetry.scripts] 에 명령 이름과 대상 함수를 적는다.',
                changes: [{mark:'new', text:'entry point 등록'},
                          {mark:'changed', text:'logtool → logtool.cli:main'}] },
        actor: '✅ [tool.poetry.scripts]',
        stage: 'deploy',
        stageLabel: '명령 이름을 main 에 연결한다',
        concepts: ['테스트', 'poetry 배포'],
        tests: TESTS,
        entryPoint: ENTRY_DONE,
        alert: { tone: 'info', text: '왼쪽이 셸에서 칠 명령 이름, 오른쪽이 "모듈경로:함수" 다. 함수는 인자 없이 호출 가능해야 한다.' },
        code: {...CODE.deploy, highlight: [15,16,17]},
      },
      { ...S5,
        beat: { label: 'install 하면 전역 명령', at: 'tests/test_cli.py L18–20',
                caption: 'poetry install 이 실행 파일을 만들어 준다. 이제 어디서나 logtool 로 부를 수 있다.',
                changes: [{mark:'new', text:'logtool 실행 파일'},
                          {mark:'gone', text:'python -m 호출 불필요'}] },
        actor: '✅ pytest · poetry · [tool.poetry.scripts]',
        stage: 'deploy',
        stageLabel: 'pytest 통과 → poetry 콘솔 스크립트 등록',
        concepts: ['테스트', 'poetry 배포', 'entry point'],
        tests: TESTS,
        entryPoint: ENTRY_DONE,
        alert: { tone: 'good', text: '순수 함수로 로직을 분리한 덕에 테스트가 파일 I/O 없이 끝난다 — 좋은 구조의 실전 보상이다. poetry scripts 한 줄이 main()을 logtool 명령으로 바꾼다. 구조·타입·예외·로깅·테스트·배포가 여기서 하나로 합쳐진다.' },
        code: {...CODE.deploy, highlight: [18,19,20]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — CLI 실행 파이프라인 (개념 배지 포함)
    // ─────────────────────────────────────────────────────
    function PipelineView({ pipeline, entry }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🧩 인자 파싱 → 검증 → 로직 → 출력/종료</div>
            <div className="space-y-1.5">
              {pipeline.map((s, i) => (
                <div key={i}>
                  <div className="flex items-center gap-2 rounded-lg border-2 border-[#3776AB] bg-blue-50 px-2.5 py-1.5">
                    <span className="text-base font-bold text-[#3776AB]">{s.n}</span>
                    <div className="flex-1">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-bold text-[#1e4c6e]">{s.name}</span>
                        <span className="text-[9px] font-mono text-slate-500">{s.fn}</span>
                      </div>
                      <div className="text-[10px] text-slate-500">{s.desc}</div>
                    </div>
                    <span className="text-[9px] font-bold text-white bg-[#3776AB] rounded px-1.5 py-0.5 whitespace-nowrap">{s.badge}</span>
                  </div>
                  {i < pipeline.length - 1 && <div className="text-center text-blue-400 text-sm leading-3">▼</div>}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5">
            <div className="text-[10px] font-bold text-[#1e4c6e] mb-1">🚪 진입점 — 셸이 종료코드를 받도록</div>
            <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{entry}</pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 명령줄 → Namespace 매핑 (인터랙티브)
    // ─────────────────────────────────────────────────────
    const CLI_SAMPLES = [
      {
        cmd: 'logtool count access.log --level ERROR',
        ns: { cmd: '"count"', path: '"access.log"', level: '"ERROR"' },
      },
      {
        cmd: 'logtool top access.log --n 5',
        ns: { cmd: '"top"', path: '"access.log"', n: '5  (int 변환)' },
      },
      {
        cmd: 'logtool top access.log',
        ns: { cmd: '"top"', path: '"access.log"', n: '3  (default)' },
      },
    ];

    function ArgparseView() {
      const [idx, setIdx] = useState(0);
      const sample = CLI_SAMPLES[idx];
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🎛 명령을 골라 보세요 → Namespace 변환</div>
            <div className="flex flex-col gap-1 mb-3">
              {CLI_SAMPLES.map((s, i) => (
                <button
                  key={i}
                  onClick={() => setIdx(i)}
                  aria-label={`예시 명령 ${i + 1} 선택`}
                  className={`text-left text-[10px] font-mono rounded px-2 py-1 border ${i === idx ? 'bg-[#3776AB] text-white border-[#3776AB]' : 'bg-white text-[#1e4c6e] border-blue-300 hover:bg-blue-50'}`}
                >$ {s.cmd}</button>
              ))}
            </div>
            <div className="rounded bg-[#282c34] p-3 font-mono text-xs">
              <div className="text-slate-400">$ <span className="text-emerald-300">{sample.cmd}</span></div>
              <div className="mt-2 text-slate-500 text-[10px]">parse_args() ▼</div>
              <div className="mt-1 text-sky-300">Namespace(</div>
              {Object.entries(sample.ns).map(([k, v]) => (
                <div key={k} className="pl-4 text-yellow-300">
                  <span className="text-orange-300">{k}</span>=<span>{v}</span>,
                </div>
              ))}
              <div className="text-sky-300">)</div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">읽는 법: </span>문자열 argv가 <span className="font-mono">args.cmd</span>·<span className="font-mono">args.path</span>·<span className="font-mono">args.n</span> 처럼 속성으로 바뀐다.
            <span className="font-mono">type=int</span>·<span className="font-mono">default</span>·<span className="font-mono">choices</span>는 파서가 대신 검증한다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 종료코드 규약 + 에러 시나리오
    // ─────────────────────────────────────────────────────
    function ErrorsView({ exitCodes, scenarios }) {
      const TONE = { good: 'text-emerald-700 bg-emerald-50 border-emerald-300', bad: 'text-red-700 bg-red-50 border-red-300', warn: 'text-amber-800 bg-amber-50 border-amber-300' };
      const CTONE = { good: 'text-emerald-700', bad: 'text-red-600', warn: 'text-amber-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🚦 종료코드(exit code) 규약</div>
            <div className="grid grid-cols-3 gap-1.5">
              {exitCodes.map((e, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 text-center ${TONE[e.tone]}`}>
                  <div className="text-lg font-mono font-bold">{e.code}</div>
                  <div className="text-[10px] font-bold">{e.label}</div>
                  <div className="text-[9px] opacity-80 mt-0.5">{e.when}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🧪 실행 시나리오 → 결과 + 코드</div>
            <div className="space-y-1.5">
              {scenarios.map((s, i) => (
                <div key={i} className="rounded bg-[#282c34] px-2.5 py-1.5 font-mono text-[10px]">
                  <div className="text-slate-400">$ <span className="text-emerald-300">{s.in}</span></div>
                  <div className="flex items-center justify-between mt-0.5">
                    <span className={s.tone === 'good' ? 'text-slate-200' : 'text-red-300'}>{s.out}</span>
                    <span className={`font-bold ${CTONE[s.tone]} bg-white/90 rounded px-1.5`}>exit {s.code}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — LOG_LEVEL 환경변수 → 로그 필터 (인터랙티브)
    // ─────────────────────────────────────────────────────
    const LEVELS = ['DEBUG', 'INFO', 'WARNING', 'ERROR'];
    const LOG_LINES = [
      { lvl: 'DEBUG', msg: '집계 시작: 16 줄', color: 'text-slate-400' },
      { lvl: 'INFO', msg: '집계 완료: 3 종류', color: 'text-sky-300' },
      { lvl: 'WARNING', msg: '알 수 없는 레벨 1건 무시', color: 'text-yellow-300' },
      { lvl: 'ERROR', msg: '파일 인코딩 경고', color: 'text-red-300' },
    ];

    function LoggingView() {
      const [level, setLevel] = useState('INFO');
      const threshold = LEVELS.indexOf(level);
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🔊 <span className="font-mono">LOG_LEVEL</span> 을 바꿔 보세요</div>
            <div className="flex flex-wrap gap-1 mb-3">
              {LEVELS.map((lv) => (
                <button
                  key={lv}
                  onClick={() => setLevel(lv)}
                  aria-label={`로그 레벨 ${lv} 선택`}
                  className={`text-[10px] font-mono rounded px-2 py-1 border ${lv === level ? 'bg-[#3776AB] text-white border-[#3776AB]' : 'bg-white text-[#1e4c6e] border-blue-300 hover:bg-blue-50'}`}
                >{lv}</button>
              ))}
            </div>
            <div className="rounded bg-[#282c34] p-3 font-mono text-[11px]">
              <div className="text-slate-500 text-[10px] mb-1">$ LOG_LEVEL={level} logtool count access.log</div>
              {LOG_LINES.map((l, i) => {
                const shown = LEVELS.indexOf(l.lvl) >= threshold;
                return shown ? (
                  <div key={i} className={l.color}><span className="font-bold">{l.lvl}</span> {l.msg}</div>
                ) : (
                  <div key={i} className="text-slate-700 line-through opacity-40">{l.lvl} {l.msg} (숨김)</div>
                );
              })}
              <div className="text-emerald-300 mt-1">INFO=12  WARN=3  ERROR=1   <span className="text-slate-500">← 결과(stdout)</span></div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">임계값 규칙: </span>설정한 레벨 <span className="font-mono">이상</span>만 보인다. <span className="font-mono">DEBUG</span>는 모두, <span className="font-mono">ERROR</span>는 오류만 — 코드 수정 없이 환경변수로 조절.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — pytest 결과 + poetry entry point
    // ─────────────────────────────────────────────────────
    function DeployView({ tests, entryPoint }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-700 mb-2">✅ pytest — 로직이 순수 함수라 파일 없이 통과</div>
            <div className="space-y-1">
              {tests.map((t, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] rounded bg-emerald-50 border border-emerald-200 px-2 py-1">
                  <span className="text-emerald-600 font-bold">✓ PASS</span>
                  <span className="font-mono text-slate-700">{t.name}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] font-mono text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-1">
              ===== 4 passed in 0.03s =====
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#3776AB] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">📦 poetry 콘솔 스크립트 등록</div>
            <div className="rounded bg-[#282c34] p-2.5 font-mono text-[10px] leading-5">
              <div className="text-slate-500">[tool.poetry.scripts]</div>
              <div><span className="text-sky-300">{entryPoint.cmd}</span> = <span className="text-emerald-300">"{entryPoint.target}"</span></div>
            </div>
            <div className="flex items-center gap-2 mt-2 text-[10px]">
              <span className="font-mono rounded bg-blue-50 border border-blue-200 text-[#1e4c6e] px-2 py-1">poetry install</span>
              <span className="text-blue-400">──▶</span>
              <span className="font-mono rounded bg-[#3776AB] text-white px-2 py-1">$ {entryPoint.cmd} ...</span>
              <span className="text-slate-500">전역 명령 완성</span>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      pipeline: { icon: '🧩', label: '실행 파이프라인' },
      argparse: { icon: '🎛', label: 'argparse 파싱' },
      errors:   { icon: '🚦', label: '예외·종료코드' },
      logging:  { icon: '🔊', label: '로깅·설정' },
      deploy:   { icon: '✅', label: '테스트·배포' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.pipeline;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>logtool CLI — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-2 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {/* 이 단계가 합치는 챕터 개념 배지 */}
          <div className="flex flex-wrap gap-1 mb-3">
            <span className="text-[9px] text-slate-500 self-center">합쳐지는 개념:</span>
            {(state.concepts || []).map((c, i) => (
              <span key={i} className="text-[9px] font-bold text-[#1e4c6e] bg-yellow-100 border border-yellow-300 rounded-full px-2 py-0.5">{c}</span>
            ))}
          </div>
          {state.stage === 'pipeline' && <PipelineView pipeline={state.pipeline} entry={state.entry} />}
          {state.stage === 'argparse' && <ArgparseView />}
          {state.stage === 'errors' && <ErrorsView exitCodes={state.exitCodes} scenarios={state.scenarios} />}
          {state.stage === 'logging' && <LoggingView />}
          {state.stage === 'deploy' && <DeployView tests={state.tests} entryPoint={state.entryPoint} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅴ. 현장 투입</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">V-2-2</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">종합: CLI 도구 만들기</h1>
                <p className="text-sm text-[#1e4c6e]/80">앞서 배운 구조·타입힌트·예외·테스트·로깅을 합쳐 실전 CLI 도구를 완성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리 — 파이썬 과정 마무리</div>
                실전 CLI 도구는 여러 챕터의 개념이 하나로 합쳐진 결과물이다. 로직을 순수 함수로 <b>구조</b>화하고(파싱→검증→로직→출력),
                <b> argparse</b>로 인자를 Namespace로 파싱하며, <b>타입힌트·예외</b>로 사용자 친화 에러와 <b>종료코드</b>(0/1/2)를 낸다.
                진단은 <b>로깅</b>으로 분리하고 상세도는 <b>환경변수</b>(LOG_LEVEL)로 조절한다. 순수 함수 덕에 <b>pytest</b>가 파일 없이 돌고,
                마지막으로 <b>poetry</b>의 <span className="font-mono">[tool.poetry.scripts]</span> 한 줄이 main()을 전역 <span className="font-mono">logtool</span> 명령으로 배포한다.
                이것으로 파이썬 학습 과정을 마친다 — 수고했습니다. 🐍
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['CLI', 'argparse', '서브커맨드', 'Namespace', '타입힌트', '예외처리', '종료코드', 'logging', 'LOG_LEVEL', 'pytest', 'poetry', 'entry-point'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록으로 (Python 완료) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
