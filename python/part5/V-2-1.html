  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

    // ─────────────────────────────────────────────────────
    // Step 1 — 레벨 필터 (인터랙티브: 임계 레벨 이상만 통과)
    // ─────────────────────────────────────────────────────
    const LEVELS = [
      { name: 'DEBUG', num: 10, color: '#64748b', msg: '쿼리 파라미터=…' },
      { name: 'INFO', num: 20, color: '#3776AB', msg: '주문 생성 order_id=42' },
      { name: 'WARNING', num: 30, color: '#d97706', msg: '재고 부족 sku=A1' },
      { name: 'ERROR', num: 40, color: '#dc2626', msg: '결제 실패 timeout' },
      { name: 'CRITICAL', num: 50, color: '#7f1d1d', msg: 'DB 연결 끊김' },
    ];

    function LevelFilterView() {
      const [threshold, setThreshold] = useState(20); // INFO 기본
      const cur = LEVELS.find((l) => l.num === threshold);
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🎚 로거 임계 레벨을 바꿔 보세요 — 이상만 통과</div>
            <div className="flex flex-wrap gap-1 mb-3">
              {LEVELS.map((l) => (
                <button
                  key={l.name}
                  onClick={() => setThreshold(l.num)}
                  aria-label={`임계 레벨 ${l.name}`}
                  className={`text-[10px] font-mono font-bold rounded px-2 py-1 border ${l.num === threshold ? 'text-white' : 'bg-white'}`}
                  style={l.num === threshold ? { backgroundColor: l.color, borderColor: l.color } : { color: l.color, borderColor: l.color }}
                >{l.name}</button>
              ))}
            </div>
            <div className="text-[10px] text-[#3776AB] font-mono mb-2 px-2 py-1 rounded bg-blue-50 border border-blue-200">
              setLevel(logging.{cur.name}) → {cur.name}({cur.num}) 이상만 통과
            </div>
            <div className="space-y-1">
              {LEVELS.map((l) => {
                const pass = l.num >= threshold;
                return (
                  <div key={l.name} className={`flex items-center gap-2 text-[10px] rounded border px-2 py-1 ${pass ? 'bg-white border-blue-200' : 'bg-slate-100 border-slate-200 opacity-50'}`}>
                    <span className="font-mono font-bold w-16 shrink-0" style={{ color: l.color }}>{l.name}</span>
                    <span className="font-mono text-slate-600 flex-1 truncate">{l.msg}</span>
                    <span className={`font-bold shrink-0 ${pass ? 'text-emerald-600' : 'text-slate-400'}`}>{pass ? '통과 ▶' : '버림 ✕'}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2">
              <div className="text-[10px] font-bold text-red-700 mb-1">✗ print</div>
              <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">print(x)
# 항상 출력·제어 불가
# 시간/레벨/출처 없음</pre>
            </div>
            <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2">
              <div className="text-[10px] font-bold text-emerald-700 mb-1">✓ logging</div>
              <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">log.debug(x)
# 레벨로 on/off
# 시간·레벨·이름 자동</pre>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — Logger → Handler → Formatter 파이프라인
    // ─────────────────────────────────────────────────────
    function PipelineView() {
      const handlers = [
        { name: 'StreamHandler', dest: '콘솔 (stdout)', level: 'INFO', color: '#3776AB' },
        { name: 'RotatingFileHandler', dest: 'app.log (회전 5개)', level: 'DEBUG', color: '#1e4c6e' },
      ];
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-3">🔧 레코드 흐름</div>
            {/* Logger */}
            <div className="rounded-lg border-2 border-[#3776AB] bg-blue-50 p-2 text-center">
              <div className="text-xs font-mono font-bold text-[#1e4c6e]">getLogger(__name__)</div>
              <div className="text-[9px] text-[#3776AB]">1차 레벨 필터 · 부모로 전파(propagate)</div>
            </div>
            <div className="text-center text-blue-400 text-lg leading-none my-1">▼</div>
            {/* Handlers */}
            <div className="grid grid-cols-2 gap-2">
              {handlers.map((h) => (
                <div key={h.name} className="rounded-lg border-2 bg-white p-2 text-center" style={{ borderColor: h.color }}>
                  <div className="text-[10px] font-mono font-bold" style={{ color: h.color }}>{h.name}</div>
                  <div className="text-[9px] text-slate-500">{h.dest}</div>
                  <div className="text-[9px] font-mono mt-0.5 inline-block rounded px-1" style={{ backgroundColor: '#e0edf7', color: h.color }}>2차 필터: {h.level}</div>
                </div>
              ))}
            </div>
            <div className="text-center text-blue-400 text-lg leading-none my-1">▼</div>
            {/* Formatter */}
            <div className="rounded-lg border-2 border-amber-400 bg-amber-50 p-2 text-center">
              <div className="text-[10px] font-mono font-bold text-amber-900">Formatter</div>
              <div className="text-[9px] font-mono text-amber-800">%(asctime)s %(levelname)s %(name)s - %(message)s</div>
            </div>
            <div className="text-center text-blue-400 text-lg leading-none my-1">▼</div>
            <div className="rounded bg-[#282c34] p-2 font-mono text-[10px] text-slate-200">
              <span className="text-slate-400">2026-08-07 10:22:01 </span>
              <span className="text-emerald-300">INFO</span>
              <span className="text-sky-300"> orders</span>
              <span className="text-slate-200"> - 주문 생성 order_id=42</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">전파(propagate): </span>자식 로거의 레코드는 루트까지 올라간다. 그래서 <span className="font-mono">dictConfig</span>로 루트에 핸들러를 한 번만 달고, 나머지는 <span className="font-mono">getLogger(__name__)</span>만 쓴다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 구조화 로그(JSON) + 상관ID + 예외

    function PitfallsView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-blue-300 bg-white p-2.5">

    // ─────────────────────────────────────────────────────

    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

              <span>로깅·설정 관리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'levels' && <LevelFilterView />}
          {state.stage === 'pipeline' && <PipelineView />}
          {state.stage === 'structured' && <StructuredView />}
          {state.stage === 'config' && <ConfigView />}
          {state.stage === 'pitfalls' && <PitfallsView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅴ. 현장 투입</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">V-2-1</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">로깅·설정 관리</h1>
                <p className="text-sm text-[#1e4c6e]/80">print 대신 logging으로 관측성 확보, 환경별 설정을 코드와 분리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                print은 제어 불가·흔적 없음이라 운영에서 못 쓴다 — logging으로 레벨을 붙이고, 개발/운영을 같은 코드에서 스위치로 오간다.
                구성은 dictConfig로 루트에 한 번(Logger→Handler→Formatter), 나머지는 getLogger(__name__). 운영 로그는 JSON으로 남기고
                request_id 같은 상관ID로 요청을 꿰매며, 예외는 logger.exception으로 스택까지. 설정은 코드가 아니라 환경변수/.env로 분리하고
                pydantic-settings로 검증하며, .env는 커밋 금지·시크릿은 Vault/Secrets Manager에서. 다음 장 V-2-2에서는 예외 처리·재시도·타임아웃 전략으로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['logging', '레벨', 'getLogger', 'Handler', 'Formatter', 'dictConfig', 'JSON로그', '상관ID', 'logger.exception', '환경변수', '.env', 'pydantic-settings', '시크릿분리'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
