          {
            title: '③ 과한 모킹 (무의미)',
            bad: 'mock 이 정답을 그대로 반환\n→ 우리 로직은 안 돎',
            badOut: '가짜끼리 통과, 보증 0',
            good: '경계(네트워크·시간)만 모킹\n우리 로직은 진짜 실행',
          },
          {
            title: '④ assert 없는 테스트',
            bad: 'def test_run():\n    service.run()   # 끝',
            badOut: '예외만 안 나면 통과',
            good: 'assert 로 결과를\n반드시 검증',
          },
        ],
        alert: { tone: 'danger', text: '커버리지 100%는 "실행됐다"일 뿐 "검증됐다"가 아니다 — assert 없는 테스트가 대표적 함정. 독립·빠름·명확 3원칙과 이 4종만 피해도 CI가 초록으로 믿을 만해진다.' },
        code: {
          lang: 'python',
          filename: 'test_quality.py — 함정과 커버리지',
          lines: [
            '# 커버리지 측정:  pytest --cov=service',
            '#   service.py   88%   Missing: 42-45',
            '#   → 88%여도 assert 없으면 검증은 0',
            '',
            '# ① 나쁨: 모듈 전역 공유 → 순서 의존',
            'cache = {}',
            'def test_write(): cache["k"] = 1',
            'def test_read():  assert cache == {}  # 깨짐',
            '',
            '# ① 좋음: fixture 로 매번 새 상태',
            'import pytest',
            '@pytest.fixture',
            'def cache():',
            '    return {}          # 테스트마다 새로',
            'def test_read(cache):',
            '    assert cache == {}  # 항상 독립',
            '',
            '# ④ 나쁨: assert 없는 테스트',
            'def test_run():',
            '    service.run()      # 예외만 없으면 통과(무의미)',
            '# ④ 좋음: 결과를 검증',
            'def test_run_returns_ok():',
            '    assert service.run() == "ok"',
          ],
          highlight: [1, 2, 3, 6, 7, 8, 11, 12, 13, 14, 15, 16],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — AAA 실행 흐름 → pass/fail 판정 (인터랙티브)
    // ─────────────────────────────────────────────────────
    function AAAFlowView({ flow, cmd }) {
      const [got, setGot] = useState(flow.got);
      const isPass = got === flow.want;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🧪 AAA — 준비 → 실행 → 검증</div>
            <div className="space-y-1.5">
              <div className="flex items-center gap-2">
                <span className="text-[9px] font-bold text-white bg-[#3776AB] rounded px-1.5 py-0.5 w-16 text-center shrink-0">Arrange</span>
                <span className="font-mono text-[11px] text-[#1e4c6e]">{flow.arrange}</span>
              </div>
              <div className="text-center text-blue-300 text-xs">▼</div>
              <div className="flex items-center gap-2">
                <span className="text-[9px] font-bold text-white bg-[#3776AB] rounded px-1.5 py-0.5 w-16 text-center shrink-0">Act</span>
                <span className="font-mono text-[11px] text-[#1e4c6e]">{flow.act}</span>
              </div>
              <div className="text-center text-blue-300 text-xs">▼</div>
              <div className="flex items-center gap-2">
                <span className="text-[9px] font-bold text-white bg-[#3776AB] rounded px-1.5 py-0.5 w-16 text-center shrink-0">Assert</span>
                <span className="font-mono text-[11px] text-[#1e4c6e]">{flow.assertExpr}</span>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">실제 값을 바꿔 pass/fail 을 보세요</div>
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[10px] text-slate-500 w-14">result =</span>
              <div className="flex gap-1">
                {['5', '4'].map((v) => (
                  <button
                    key={v}
                    onClick={() => setGot(v)}
                    aria-label={`결과 값 ${v}`}
                    className={`text-[11px] font-mono rounded px-2.5 py-1 border ${v === got ? 'bg-[#3776AB] text-white border-[#3776AB]' : 'bg-white text-[#1e4c6e] border-blue-300 hover:bg-blue-50'}`}
                  >{v}</button>
                ))}
              </div>
              <span className="text-[10px] text-slate-400 font-mono ml-1">want = {flow.want}</span>
            </div>
            <div className="rounded bg-[#282c34] p-3 font-mono text-xs">
              <div className="text-slate-400">$ {cmd}</div>
              <div className="mt-1">
                <span className="text-slate-300">test_add_two_positives </span>
                {isPass
                  ? <span className="text-emerald-400 font-bold">PASSED ✓</span>
                  : <span className="text-red-400 font-bold">FAILED ✗</span>}
              </div>
              {!isPass && (
                <div className="mt-1 text-red-300">
                  <div>&gt; assert {got} == {flow.want}</div>
                  <div className="text-slate-400">E   assert {got} == {flow.want}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — fixture 하나 → 여러 테스트에 주입/정리
    // ─────────────────────────────────────────────────────
    function FixtureView({ fixture }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#3776AB] bg-blue-50 p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">🔧 fixture <span className="font-mono">{fixture.name}</span></div>
            <div className="font-mono text-[10px] text-emerald-700">↑ setup: {fixture.setup}</div>
            <div className="font-mono text-[10px] text-slate-500">↓ teardown: {fixture.teardown}</div>
          </div>
          <div className="text-center text-blue-300 text-lg">│ 주입 ▼</div>
          <div className="space-y-2">
            {fixture.consumers.map((c, i) => (
              <div key={i} className="flex items-center gap-2 rounded-lg border-2 border-blue-300 bg-white p-2">
                <span className="text-[9px] font-bold text-white bg-[#3776AB] rounded px-1.5 py-0.5 shrink-0">TEST</span>
                <span className="font-mono text-[11px] text-[#1e4c6e]">{c.test}(<span className="text-[#3776AB]">{c.uses}</span>)</span>
                <span className="ml-auto text-[9px] text-emerald-600 font-bold">준비완료 ✓</span>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            <span className="font-bold">yield 앞</span> = 준비 · <span className="font-bold">yield 뒤</span> = 정리(테스트 종료 시 자동). 세 테스트가 각자 깨끗한 <span className="font-mono">{fixture.name}</span> 를 받는다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — parametrize: 한 함수 → N 케이스로 확장
    // ─────────────────────────────────────────────────────
    function ParamView({ param }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#3776AB] bg-blue-50 p-3 text-center">
            <div className="text-[11px] font-bold text-[#1e4c6e]">📋 test_is_even(<span className="font-mono">{param.func}</span>)</div>
            <div className="text-[10px] text-[#3776AB] mt-1">아래 표의 각 행 → 독립 테스트 1개로 자동 확장</div>
          </div>
          <div className="text-center text-blue-300 text-lg">▼ 케이스별 확장 ▼</div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-2">
            <table className="w-full text-[11px]">
              <thead>
                <tr className="text-[9px] text-slate-500 border-b border-blue-200">
                  <th className="text-left py-1 font-semibold">케이스 이름</th>
                  <th className="text-left py-1 font-semibold">입력 n</th>
                  <th className="text-left py-1 font-semibold">기대값</th>
                  <th className="text-right py-1 font-semibold">결과</th>
                </tr>
              </thead>
              <tbody>
                {param.cases.map((c, i) => (
                  <tr key={i} className="border-t border-blue-100">
                    <td className="py-1 font-mono text-[10px] text-slate-600">test_is_even[{c.in}-{c.want}]</td>
                    <td className="py-1 font-mono font-bold text-[#1e4c6e]">{c.in}</td>
                    <td className="py-1 font-mono text-[#3776AB]">{c.want}</td>
                    <td className="py-1 text-right font-bold text-emerald-600">PASSED ✓</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-yellow-50 p-2.5 text-[10px] text-[#1e4c6e]">
            케이스 <span className="font-bold">{param.cases.length}개</span> → 테스트 <span className="font-bold">{param.cases.length}개</span>로 리포트. 하나가 깨져도 나머지는 계속 검증되고, 실패 케이스는 이름의 <span className="font-mono">[값]</span>으로 즉시 식별.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — pytest.raises + 외부 호출 모킹 격리
    // ─────────────────────────────────────────────────────
    function MockView({ mock }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🎭 외부 호출을 가짜로 바꿔치기</div>
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2">
                <div className="text-[10px] font-bold text-red-700 mb-1">{mock.real.label}</div>
                <div className="font-mono text-[10px] text-slate-700">{mock.real.call}</div>
                <div className="text-[9px] text-red-500 mt-1">✗ {mock.real.bad}</div>
              </div>
              <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2">
                <div className="text-[10px] font-bold text-emerald-700 mb-1">{mock.patched.label}</div>
                <div className="font-mono text-[10px] text-slate-700">{mock.patched.call}</div>
                <div className="text-[9px] text-emerald-600 mt-1">✓ {mock.patched.good}</div>
              </div>
            </div>
            <div className="mt-2 text-center text-[10px] text-[#3776AB]">monkeypatch.setattr 로 실제 함수 → 가짜 함수 교체</div>
          </div>
          <div className="rounded-lg border-2 border-[#3776AB] bg-blue-50 p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">예외도 "나야" 통과 — pytest.raises</div>
            <div className="rounded bg-[#282c34] p-2.5 font-mono text-[11px]">
              <div className="text-purple-300">{mock.raises.expr}</div>
              <div className="text-slate-300 pl-4">{mock.raises.body}</div>
              <div className="text-emerald-400 mt-1">→ {mock.raises.ok}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 함정 4종 카드
    // ─────────────────────────────────────────────────────
    function PitfallsView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-blue-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">{p.title}</div>
              <div className="grid grid-cols-2 gap-2">
                <div className="rounded bg-red-50 border border-red-200 p-1.5">
                  <div className="text-[9px] font-bold text-red-600 mb-0.5">✗ 나쁨</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.bad}</pre>
                  <div className="text-[9px] text-red-500 mt-1 whitespace-pre-wrap">{p.badOut}</div>
                </div>
                <div className="rounded bg-emerald-50 border border-emerald-200 p-1.5">
                  <div className="text-[9px] font-bold text-emerald-600 mb-0.5">✓ 좋음</div>
                  <pre className="text-[10px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.good}</pre>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      basics:   { icon: '🧪', label: 'pytest 기본' },
      fixture:  { icon: '🔧', label: 'fixture' },
      param:    { icon: '📋', label: 'parametrize' },
      mock:     { icon: '🎭', label: '예외·모킹' },
      pitfalls: { icon: '📊', label: '실무 함정' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.basics;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>테스트(pytest) — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'basics' && <AAAFlowView flow={state.flow} cmd={state.cmd} />}
          {state.stage === 'fixture' && <FixtureView fixture={state.fixture} />}
          {state.stage === 'param' && <ParamView param={state.param} />}
          {state.stage === 'mock' && <MockView mock={state.mock} />}
          {state.stage === 'pitfalls' && <PitfallsView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅴ. 현장 투입</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">V-1-2</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">테스트(pytest)</h1>
                <p className="text-sm text-[#1e4c6e]/80">assert 기반 테스트·fixture·파라미터화·모킹으로 견고한 코드 지키기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                pytest 는 순수 assert 한 줄로 검증하고, 파일 test_*.py·함수 test_* 를 자동 수집한다. 모든 테스트는 Arrange-Act-Assert 로 쓰면 의도가 또렷해진다.
                fixture(yield teardown)로 준비/정리를 공유하고, parametrize 로 한 테스트를 여러 케이스로 확장하며, pytest.raises 로 예외를, monkeypatch·mock 으로 외부 의존을 격리한다.
                좋은 테스트는 독립·빠름·명확이고, 커버리지 100%도 assert 가 없으면 무의미하다 — 상태 공유·실제 API 호출·과한 모킹·assert 누락 4종만 피해도 CI를 믿을 수 있다.
                다음 장 V-1-3에서는 타입 힌트와 mypy 로 정적 검증을 더한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['pytest', 'assert', 'AAA', 'fixture', 'yield', 'teardown', 'parametrize', 'pytest.raises', 'monkeypatch', 'mock', 'pytest-cov', 'flaky'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
