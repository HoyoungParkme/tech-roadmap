  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    Python IV-2-2 — pandas 5분 훑기
    학습 목표: DataFrame·Series로 표 데이터를 로드→선택→필터→변환→집계하는
              실무 최소 세트를 5단계로 훑는다. 표를 실시간으로 하이라이트해
              열/행 선택, loc vs iloc, 불리언 인덱싱, groupby 집계, 그리고
              벡터화가 for 루프보다 빠른 이유와 대표 실무 함정까지 눈으로 본다.
    패턴: fastapi v1 — 좌(LiveDataPane: DataFrame 표 변형 시각화) / 우(VSCode CodeViewer: python)
    색상: Python 파랑 #3776AB · 형광펜 노랑 #FFD43B · 글자/링크 파랑다크 #1e4c6e
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공용 샘플 DataFrame — 전 단계가 이 표를 재료로 변형한다
    //   직원 5명 · 열: name / dept / salary / age (age 에 결측치 1개)
    // ─────────────────────────────────────────────────────
    const COLUMNS = ['name', 'dept', 'salary', 'age'];
    const ROWS = [
      { idx: 0, name: 'kim',  dept: 'eng',   salary: 5000, age: 29 },
      { idx: 1, name: 'lee',  dept: 'sales', salary: 4200, age: 35 },
      { idx: 2, name: 'park', dept: 'eng',   salary: 6100, age: 41 },
      { idx: 3, name: 'choi', dept: 'sales', salary: 3900, age: 26 },
      { idx: 4, name: 'jung', dept: 'hr',    salary: 4800, age: null },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 자료구조 → 선택 → 변환 → 집계 → 실무 함정
    //   각 STEP = { title, desc, stage, 좌측 패널 힌트, 우측 code }
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 자료구조 — Series(1차원)·DataFrame(2차원 표)',
        desc: 'pandas의 두 축은 Series와 DataFrame이다. Series는 인덱스가 붙은 1차원 배열(엑셀의 한 열), DataFrame은 같은 인덱스를 공유하는 여러 Series를 옆으로 붙인 2차원 표(엑셀 시트)라고 보면 된다. 실무에서는 대부분 read_csv로 파일을 읽어 DataFrame으로 시작하는데, 읽자마자 세 가지를 습관처럼 확인한다: head()로 앞 5행을 눈으로 보고, info()로 행 수·열별 dtype·결측 개수를 파악하고, describe()로 숫자 열의 분포(평균·min·max·사분위)를 훑는다. 이 세 줄을 건너뛰면 dtype이 object(문자열)로 읽힌 숫자 열이나 숨은 결측치를 나중에야 발견해 디버깅에 시간을 버린다.',
        actor: '🐼 Series · DataFrame · read_csv/head/info/describe',
        stage: 'structure',
        stageLabel: '표 전체 파악 (head / info / describe)',
        highlightCol: 'salary',
        summary: {
          info: ['RangeIndex: 5 entries, 0 to 4', 'name    5 non-null   object', 'dept    5 non-null   object', 'salary  5 non-null   int64', 'age     4 non-null   float64  ← 결측 1'],
          describe: [
            { stat: 'count', salary: '5', age: '4' },
            { stat: 'mean',  salary: '4800', age: '32.75' },
            { stat: 'min',   salary: '3900', age: '26' },
            { stat: 'max',   salary: '6100', age: '41' },
          ],
        },
        alert: { tone: 'info', text: 'DataFrame 한 열을 꺼내면 그게 곧 Series다(df["salary"] → Series). read_csv 직후 head()·info()·describe() 세 줄은 "데이터 건강검진" — dtype이 object로 잘못 읽힌 숫자 열, 숨은 결측(age 4 non-null)을 여기서 잡는다.' },
        code: {
          lang: 'python',
          filename: 'load.py — 로드와 첫 파악',
          lines: [
            'import pandas as pd',
            '',
            '# 1) Series = 인덱스가 붙은 1차원 (표의 한 열)',
            's = pd.Series([5000, 4200, 6100], name="salary")',
            '',
            '# 2) DataFrame = 2차원 표 (여러 Series를 옆으로)',
            'df = pd.DataFrame({',
            '    "name":   ["kim", "lee", "park", "choi", "jung"],',
            '    "dept":   ["eng", "sales", "eng", "sales", "hr"],',
            '    "salary": [5000, 4200, 6100, 3900, 4800],',
            '    "age":    [29, 35, 41, 26, None],',
            '})',
            '',
            '# 실무에선 보통 파일에서 바로 읽는다',
            '# df = pd.read_csv("employees.csv")',
            '',
            '# 3) 로드 직후 3종 건강검진',
            'df.head()        # => 앞 5행 미리보기',
            'df.info()        # => 행수·dtype·non-null(결측) 개수',
            'df.describe()    # => 숫자 열 평균·min·max·사분위',
            'df["salary"]     # => 한 열 = Series',
          ],
          highlight: [4, 7, 17, 18, 19, 20],
        },
      },

    // ─────────────────────────────────────────────────────
    // 공용 DataFrame 표 — 열/행/셀 하이라이트 지원
    //   highlightCols: 강조할 열 이름 배열
    //   highlightRows: 강조할 행 idx 배열
    //   dimRows: 흐리게 처리할 행 idx 배열 (필터 탈락)
    // ─────────────────────────────────────────────────────
    function DataTable({ rows, cols, highlightCols = [], highlightRows = null, dimRows = [], extra = null }) {
      const hlCol = new Set(highlightCols);
      const showCols = extra ? [...cols, extra.name] : cols;
      return (
        <table className="w-full text-[10px] border-collapse font-mono">
          <thead>
            <tr>
              <th className="px-1.5 py-1 text-slate-400 border-b-2 border-blue-200 text-right"></th>
              {showCols.map((c) => (
                <th
                  key={c}
                  className={`px-2 py-1 border-b-2 text-left font-bold ${hlCol.has(c) ? 'bg-[#FFD43B] text-[#1e4c6e] border-[#3776AB]' : 'text-[#1e4c6e] border-blue-200'}`}
                >{c}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => {
              const isHiRow = highlightRows ? highlightRows.includes(r.idx) : false;
              const isDim = dimRows.includes(r.idx);
              return (
                <tr
                  key={r.idx}
                  className={`${isHiRow ? 'bg-blue-100' : ''} ${isDim ? 'opacity-30' : ''}`}
                >
                  <td className="px-1.5 py-1 text-slate-400 text-right border-b border-blue-50 font-bold">{r.idx}</td>
                  {cols.map((c) => {
                    const val = r[c];
                    const isNaN = val === null || val === undefined;
                    return (
                      <td
                        key={c}
                        className={`px-2 py-1 border-b border-blue-50 ${hlCol.has(c) ? 'bg-yellow-50 font-bold text-[#1e4c6e]' : 'text-slate-700'} ${isNaN ? 'text-red-500 italic' : ''}`}
                      >{isNaN ? 'NaN' : String(val)}</td>
                    );
                  })}
                  {extra && (
                    <td className="px-2 py-1 border-b border-blue-50 bg-emerald-50 font-bold text-emerald-700">
                      {extra.fn(r)}
                    </td>
                  )}
                </tr>
              );
            })}
          </tbody>
        </table>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 표 전체 + info/describe 요약
    // ─────────────────────────────────────────────────────
    function StructureView({ highlightCol, summary }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🐼 DataFrame (5행 × 4열) — <span className="text-[#3776AB]">노란 열 = Series 1개</span></div>
            <DataTable rows={ROWS} cols={COLUMNS} highlightCols={[highlightCol]} />
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-blue-300 bg-white p-2">
              <div className="text-[10px] font-bold text-[#1e4c6e] mb-1">df.info()</div>
              <pre className="text-[9px] font-mono text-slate-600 leading-4 whitespace-pre-wrap">{summary.info.join('\n')}</pre>
            </div>
            <div className="rounded-lg border-2 border-blue-300 bg-white p-2">
              <div className="text-[10px] font-bold text-[#1e4c6e] mb-1">df.describe()</div>
              <table className="w-full text-[9px] font-mono">
                <tbody>
                  {summary.describe.map((d, i) => (
                    <tr key={i} className="border-t border-blue-50">
                      <td className="py-0.5 text-slate-500 pr-2">{d.stat}</td>
                      <td className="py-0.5 text-slate-700 pr-2">{d.salary}</td>
                      <td className="py-0.5 text-slate-700">{d.age}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 선택 모드 토글 (열 / loc / iloc / 불리언)
    // ─────────────────────────────────────────────────────

      const MODES = {
        col:  { label: 'df[["name","salary"]]', cols: ['name', 'salary'], rows: null, dim: [], note: '열 2개 선택 → DataFrame' },
        loc:  { label: 'df.loc[0:2]',            cols: [], rows: [0, 1, 2], dim: [3, 4], note: '라벨 슬라이스 → 2행 포함(3개 행)' },
        iloc: { label: 'df.iloc[0:2]',           cols: [], rows: [0, 1],    dim: [2, 3, 4], note: '정수 슬라이스 → 2행 미포함(2개 행)' },
        bool: { label: 'df[df.salary >= 4500]',  cols: ['salary'], rows: [0, 2, 4], dim: [1, 3], note: '조건 True 인 행만 (kim, park, jung)' },

      const m = MODES[mode];
      return (

          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">

                >{MODES[k].label}</button>
              ))}
            </div>
            <DataTable rows={ROWS} cols={COLUMNS} highlightCols={m.cols} highlightRows={m.rows} dimRows={m.dim} />
            <div className="mt-2 text-[10px] text-[#1e4c6e] bg-yellow-100 border border-yellow-300 rounded px-2 py-1.5">
              <span className="font-mono font-bold">{m.label}</span> → {m.note}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-400 bg-amber-50 p-2 text-[10px] text-amber-900">
            <span className="font-bold">loc vs iloc 슬라이스: </span> <span className="font-mono">loc[0:2]</span> 는 <b>3개 행</b>(양끝 포함), <span className="font-mono">iloc[0:2]</span> 는 <b>2개 행</b>(미포함). 버튼으로 흐려지는 행 수를 비교해 보세요.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 새 열(bonus) 추가 + age 결측 채우기
    // ─────────────────────────────────────────────────────
    function TransformView() {
      const [filled, setFilled] = useState(false);
      const rows = ROWS.map((r) => ({
        ...r,
        age: r.age === null && filled ? 33 : r.age,
      }));
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🔧 새 열 <span className="font-mono text-emerald-700">bonus = salary*0.1</span> 추가</div>
            <DataTable
              rows={rows}
              cols={COLUMNS}
              extra={{ name: 'bonus', fn: (r) => (r.salary * 0.1).toFixed(1) }}
            />
          </div>
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="flex items-center justify-between mb-1">
              <div className="text-[11px] font-bold text-[#1e4c6e]">💧 결측치(age NaN) 처리</div>
              <button
                onClick={() => setFilled((f) => !f)}
                aria-label="결측치 채우기 토글"
                className={`text-[10px] font-mono rounded px-2 py-1 border ${filled ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-[#1e4c6e] border-blue-300 hover:bg-blue-50'}`}
              >{filled ? 'fillna(33) 적용됨 ↺' : 'fillna(mean) 실행 ▶'}</button>
            </div>
            <div className="text-[10px] text-slate-600 font-mono">
              df["age"].fillna(<b>{filled ? '33' : 'mean=32.75'}</b>) — jung 행의 <span className="text-red-500">NaN</span> → <span className="text-emerald-700 font-bold">{filled ? '33' : '?'}</span>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — groupby split → combine 시각화
    // ─────────────────────────────────────────────────────
    function AggregateView({ groupResult }) {
      const DEPT_COLOR = { eng: '#3776AB', sales: '#0f766e', hr: '#b45309' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">📊 <span className="font-mono">groupby("dept")</span> — 색이 곧 그룹(split)</div>
            <table className="w-full text-[10px] border-collapse font-mono">
              <tbody>
                {ROWS.map((r) => (
                  <tr key={r.idx}>
                    <td className="px-1.5 py-1 text-slate-400 text-right">{r.idx}</td>
                    <td className="px-2 py-1 text-slate-700">{r.name}</td>
                    <td className="px-2 py-1">
                      <span className="rounded px-1.5 py-0.5 text-white text-[9px] font-bold" style={{ backgroundColor: DEPT_COLOR[r.dept] }}>{r.dept}</span>
                    </td>
                    <td className="px-2 py-1 text-slate-700">{r.salary}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="text-center text-[#3776AB] text-lg leading-none">▼ apply(mean) + combine ▼</div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-700 mb-2">.agg(count, sum, mean) 결과 (3행으로 합쳐짐)</div>
            <table className="w-full text-[10px] border-collapse font-mono">
              <thead>
                <tr className="text-emerald-700">
                  <th className="px-2 py-1 text-left border-b-2 border-emerald-200">dept</th>
                  <th className="px-2 py-1 text-right border-b-2 border-emerald-200">count</th>
                  <th className="px-2 py-1 text-right border-b-2 border-emerald-200">sum</th>
                  <th className="px-2 py-1 text-right border-b-2 border-emerald-200">mean</th>
                </tr>
              </thead>
              <tbody>
                {groupResult.map((g, i) => (
                  <tr key={i} className="border-b border-emerald-50">
                    <td className="px-2 py-1">
                      <span className="rounded px-1.5 py-0.5 text-white text-[9px] font-bold" style={{ backgroundColor: DEPT_COLOR[g.dept] }}>{g.dept}</span>
                    </td>
                    <td className="px-2 py-1 text-right text-slate-700">{g.count}</td>
                    <td className="px-2 py-1 text-right text-slate-700">{g.sum}</td>
                    <td className="px-2 py-1 text-right font-bold text-emerald-700">{g.mean}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 벡터화 속도 막대 + 실무 함정 카드
    // ─────────────────────────────────────────────────────
    function PitfallsView({ speed, pitfalls }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-blue-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">⚡ 같은 계산, 속도 비교 (상대값)</div>
            <div className="space-y-1.5">
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-mono w-24 shrink-0 text-red-600">for iterrows</span>
                <div className="flex-1 bg-slate-100 rounded h-4 overflow-hidden">
                  <div className="bg-red-400 h-full rounded flex items-center justify-end pr-1 text-[9px] text-white font-bold" style={{ width: '100%' }}>×{speed.loop}</div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-mono w-24 shrink-0 text-emerald-700">벡터화 (df*1.1)</span>
                <div className="flex-1 bg-slate-100 rounded h-4 overflow-hidden">
                  <div className="bg-emerald-500 h-full rounded flex items-center justify-end pr-1 text-[9px] text-white font-bold" style={{ width: speed.vector + '%' }}>×{speed.vector}</div>
                </div>
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">넘파이가 열 전체를 C 레벨에서 한 번에 처리 → 루프 없이 수십 배 빠름</div>
          </div>
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-blue-300 bg-white p-2.5">
              <div className="text-[10px] font-bold text-[#1e4c6e] mb-1.5">{p.title}</div>
              <div className="grid grid-cols-2 gap-2">
                <div className="rounded bg-red-50 border border-red-200 p-1.5">
                  <div className="text-[9px] font-bold text-red-600 mb-0.5">✗ 나쁨</div>
                  <pre className="text-[9px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.bad}</pre>
                </div>
                <div className="rounded bg-emerald-50 border border-emerald-200 p-1.5">
                  <div className="text-[9px] font-bold text-emerald-600 mb-0.5">✓ 좋음</div>
                  <pre className="text-[9px] font-mono text-slate-700 whitespace-pre-wrap leading-4">{p.good}</pre>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-blue-50',    border: 'border-blue-300',    text: 'text-[#1e4c6e]',   icon: '💡' },
      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 표 변형 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      structure: { icon: '🐼', label: '자료구조' },
      select:    { icon: '🎯', label: '선택·필터' },
      transform: { icon: '🔧', label: '변환' },
      aggregate: { icon: '📊', label: '집계' },
      pitfalls:  { icon: '⚡', label: '벡터화·함정' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.structure;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>pandas DataFrame — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'structure' && <StructureView highlightCol={state.highlightCol} summary={state.summary} />}
          {state.stage === 'select' && <SelectView />}
          {state.stage === 'transform' && <TransformView />}
          {state.stage === 'aggregate' && <AggregateView groupResult={state.groupResult} />}
          {state.stage === 'pitfalls' && <PitfallsView speed={state.speed} pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅳ. 데이터 다루기</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">IV-2-2</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">pandas 5분 훑기</h1>
                <p className="text-sm text-[#1e4c6e]/80">DataFrame·Series로 표 데이터를 로드·선택·필터·집계하는 실무 최소 세트</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                pandas는 Series(1차원)·DataFrame(2차원 표)로 시작해, read_csv 직후 head·info·describe로 건강검진을 한다.
                선택은 열 df["col"], 행은 loc(라벨·양끝 포함)·iloc(정수·미포함), 그리고 불리언 인덱싱(조건마다 괄호)으로 한다.
                변환은 벡터 연산으로 새 열을 만들고 결측은 fillna/dropna로 명시 처리하며, 집계는 groupby().agg()·value_counts·merge로 요약한다.
                pandas가 빠른 이유는 넘파이 기반 벡터화 — for 루프(iterrows)는 최후의 수단이다. SettingWithCopyWarning(체인 인덱싱)·loc/iloc 슬라이스 차이·결측치 방치 3종만 피해도 버그가 크게 준다.
                다음 파트 V-1-1에서는 웹/DB 연동으로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['DataFrame', 'Series', 'read_csv', 'loc', 'iloc', '불리언인덱싱', 'apply', 'fillna', 'groupby', 'value_counts', 'merge', '벡터화', 'SettingWithCopy'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
