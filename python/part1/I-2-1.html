  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

      setTimeout(focusFirst, 500);

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 조건문 → 반복문 → 리스트 컴프리헨션 → dict/set·제너레이터 → match·walrus
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(cond/loop/comp/gencomp/match)에 따라

      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      condition: {lang:"python", filename:"control_flow.py — 조건문", lines:[
        "def grade(score: int) -> str:",
        "    \"\"\"점수를 등급 문자로 바꾼다.\"\"\"",
        "    if score >= 90:",
        "        return 'A'",
        "    elif score >= 80:",
        "        return 'B'      # => score=82 이면 여기",
        "    else:",
        "        return 'C'",
        "",
        "",
        "print(grade(82))        # => B",
        "",
        "# ── truthy / falsy — 파이썬다운 빈 값 판정 ──",
        "items: list[int] = []",
        "",
        "if items:               # 비어있으면 False → 건너뜀",
        "    print('데이터 있음')",
        "else:",
        "    print('비었음')      # => 비었음",

        "# 좋음: 의도가 드러난다",
        "if not items:           # 비었나?",

        "if user is None:        # 값 자체가 없나?",
        "    ...",
        "",
        "# 나쁨: 장황하고 None 과 [] 를 뭉갠다",
        "# if len(items) > 0: ...",
        "# if user != None: ...",
      ]},
      loops: {lang:"python", filename:"control_flow.py — 반복문", lines:[
        "names  = [\"kim\", \"lee\", \"park\"]",
        "scores = [82, 55, 91]",
        "",
        "# enumerate + zip — 인덱스와 짝을 안전하게",
        "for i, (name, score) in enumerate(zip(names, scores)):",
        "    if score < 60:",
        "        continue            # 낙제는 건너뜀",
        "    print(i, name, score)   # => 0 kim 82",
        "",
        "# for-else — 탐색 성공/실패를 플래그 없이",
        "for score in scores:",
        "    if score >= 90:",
        "        print(\"우수자 발견:\", score)  # => 91",
        "        break",
        "else:",
        "    # break 가 한 번도 안 걸렸을 때만 실행",
        "    print(\"우수자 없음\")",
        "",
        "# while — 종료가 데이터가 아니라 상태일 때",
        "retries, ok = 0, False",
        "while retries < 3 and not ok:",
        "    ok = try_connect()      # 재시도 루프",
        "    retries += 1",
      ]},
      comprehension: {lang:"python", filename:"comprehension.py — 리스트 컴프리헨션", lines:[
        "xs = [1, 2, 3, 4, 5, 6]",
        "",
        "# ── 방식 A: for + append (전통적) ──",
        "result = []",
        "for x in xs:",
        "    if x % 2 == 0:      # 걸러내기",
        "        result.append(x ** 2)   # 변환 후 담기",
        "print(result)           # => [4, 16, 36]",
        "",
        "# ── 방식 B: 리스트 컴프리헨션 (파이썬다움) ──",
        "result = [x ** 2 for x in xs if x % 2 == 0]",
        "#          └변환┘       └순회┘   └─필터─┘",
        "print(result)           # => [4, 16, 36]",
        "",
        "# 같은 결과. B 가 더 빠르고(내부 append),",
        "# \"걸러 변환한 결과\"라는 의도가 한 줄에 보인다.",
        "",
        "# 중첩·조건도 가능 (단, 과하면 루프로)",
        "pairs = [(i, j) for i in range(3)",
        "                for j in range(3) if i < j]",
        "# => [(0,1), (0,2), (1,2)]",
      ]},
      lazy: {lang:"python", filename:"lazy.py — dict/set/제너레이터", lines:[
        "nums  = [1, 2, 3]",
        "words = [\"a\", \"bb\"]",
        "",
        "# dict 컴프리헨션 — 키:값 매핑",
        "length = {w: len(w) for w in words}",
        "# => {\"a\": 1, \"bb\": 2}",
        "",
        "# set 컴프리헨션 — 중복 자동 제거",
        "uniq = {c for c in \"aabbc\"}",
        "# => {\"a\", \"b\", \"c\"}",
        "",
        "# 제너레이터식 — 대괄호 대신 소괄호",
        "squares = (x * x for x in nums)   # 아직 계산 X",
        "print(next(squares))   # => 1  (여기서 첫 계산)",
        "print(next(squares))   # => 4",
        "",
        "# 큰 데이터: 리스트를 만들지 않고 상수 메모리로 합산",
        "total = sum(x * x for x in range(10_000_000))",
        "#           └ 리스트 컴프리헨션이었다면 수백 MB 낭비 ┘",
        "",
        "# 파일 스트리밍 — 한 줄씩 흘려보내기 (메모리 안전)",
        "with open(\"big.log\") as f:",
        "    errors = (ln for ln in f if \"ERROR\" in ln)",
        "    first = next(errors, None)",
      ]},
      pythonic: {lang:"python", filename:"pythonic.py — match·walrus·안티패턴", lines:[
        "# match (3.10+) — 구조 분해 매칭",
        "def handle(cmd: tuple) -> str:",
        "    match cmd:",
        "        case (\"move\", dx, dy):   # 튜플 모양 + 언패킹",
        "            return f\"이동 {dx},{dy}\"   # => 이동 10,0",
        "        case (\"stop\",):",
        "            return \"정지\"",
        "        case _:",
        "            return \"알 수 없음\"",
        "",
        "# walrus := — 계산과 대입을 한 번에",
        "if (n := len(data)) > 100:",
        "    print(f\"{n}건 — 배치 처리\")   # n 재사용",
        "",
        "# ❌ 안티패턴 1: 순회 중 리스트 수정 (원소 건너뜀)",
        "# for x in xs:",
        "#     if x < 0: xs.remove(x)   # 인덱스 어긋남",
        "# ✅ 새 리스트로",
        "xs = [x for x in xs if x >= 0]",
        "",
        "# ❌ 안티패턴 2: 대용량 리스트 컴프리헨션",
        "# rows = [parse(l) for l in huge_file]  # 메모리 폭발",
        "# ✅ 제너레이터로 스트리밍",
        "rows = (parse(l) for l in huge_file)",
        "",
        "# ❌ 안티패턴 3: 과중첩 → ✅ 루프로 풀어 이름 붙이기",
      ]},
    };

    const S1 = { title:"Step 1. 조건문 — if / elif / else 와 truthy 판정",
      desc:"파이썬의 분기는 if · elif · else 세 키워드가 전부다. 중괄호가 없으니 \"들여쓰기\"가 곧 블록의 경계이고, 이 규칙이 코드 구조를 눈으로 강제한다. 실무에서 가장 자주 실수하는 지점은 조건에 꼭 비교식을 넣어야 한다고 생각하는 것 — 파이썬은 빈 리스트·빈 문자열·0·None을 전부 \"거짓(falsy)\"으로 보므로 if items: 한 줄이면 \"비어있지 않은가\"를 그대로 표현한다. len(items) > 0 이나 items != None 은 장황할 뿐 아니라, None 과 빈 리스트를 구분해야 하는 상황에서는 오히려 버그를 숨긴다. 그래서 \"값이 없다\"는 if x is None 으로, \"비어있다\"는 if not x 로 의도를 나눠 쓰는 습관이 안전하다." };
    const S2 = { title:"Step 2. 반복문 — for·while 과 enumerate·zip, break/continue/for-else",
      desc:"파이썬의 for 는 C 스타일 인덱스 루프가 아니라 \"이터러블을 하나씩 꺼내는\" 루프다. 그래서 리스트·문자열·딕트·파일 무엇이든 같은 문법으로 순회한다. 인덱스가 필요하면 range(len(xs)) 대신 enumerate(xs) 를, 두 리스트를 나란히 돌리려면 zip(a, b) 를 쓰는 게 정석이다 — 손으로 인덱스를 굴리면 off-by-one 버그와 씨름하게 된다. 흐름 제어는 break(루프 탈출)·continue(다음 반복으로)이고, 파이썬만의 for-else 는 \"break 없이 끝까지 돌았을 때만\" else 가 실행된다 — \"찾았으면 멈추고, 못 찾았으면 처리\"하는 탐색 패턴을 플래그 변수 없이 표현한다. while 은 종료 조건이 데이터가 아니라 상태에 달렸을 때(재시도·폴링 등)만 골라 쓴다." };
    const S3 = { title:"Step 3. 리스트 컴프리헨션 — for+append 를 한 줄로",
      desc:"\"빈 리스트를 만들고, 루프를 돌며, 조건을 걸러, 변환해서 append\" — 이 네 줄짜리 관용구가 파이썬 코드의 절반을 차지한다. 리스트 컴프리헨션 [f(x) for x in xs if cond] 은 정확히 그 네 동작을 한 줄로 압축한다. 단순히 짧아서가 아니라 두 가지 실질 이득이 있다: 첫째, .append 메서드를 매번 조회·호출하지 않고 인터프리터가 내부에서 리스트를 채우므로 눈에 띄게 빠르다. 둘째, \"이 리스트는 xs 를 걸러 변환한 결과\"라는 의도가 한눈에 읽힌다 — 루프 버전은 끝까지 읽어야 result 가 무엇인지 안다. 읽는 순서도 자연스럽다: 뒤쪽 for·if(무엇을, 어떤 조건으로)를 먼저, 앞쪽 식(어떻게 변환)을 나중에 읽으면 된다. 단, 조건과 변환이 복잡해지면 오히려 루프가 낫다(다음 단계에서 다룬다)." };
    const S4 = { title:"Step 4. dict/set 컴프리헨션과 제너레이터식 — 지연평가로 메모리 절약",

    // 색 토큰 — Python 파랑 #3776AB / 형광펜 #FFD43B / 다크 #1e4c6e
    // ─────────────────────────────────────────────────────
    const BLUE = '#3776AB';
    const YELLOW = '#FFD43B';

    // ─────────────────────────────────────────────────────
    // Step 1 — 조건 분기 + truthy 표
    // ─────────────────────────────────────────────────────
    function BranchView({ branch, truthy }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 p-3 bg-white" style={{ borderColor: '#9ec5e8' }}>
            <div className="text-[11px] font-bold mb-2" style={{ color: '#1e4c6e' }}>🔀 if / elif / else — 위에서부터 처음 참인 가지만</div>
            <div className="text-[10px] font-mono mb-2 inline-block rounded px-2 py-1 border" style={{ background: '#eef6fc', borderColor: '#9ec5e8', color: '#1e4c6e' }}>{branch.input}</div>
            <div className="space-y-1">
              {branch.rows.map((r, i) => (
                <div key={i} className={`text-[11px] font-mono rounded border px-2 py-1 flex items-center gap-2 ${r.taken ? 'font-bold' : 'opacity-60'}`}
                  style={r.taken ? { background: YELLOW, borderColor: '#e0b400', color: '#1e4c6e' } : { background: '#faf7ef', borderColor: '#cfc9ba', color: '#57534a' }}>
                  <span>{r.taken ? '✓' : '·'}</span>
                  <span className="flex-1">{r.cond}</span>
                  <span>→ {r.label}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] font-mono rounded px-2 py-1 border" style={{ background: '#eef6fc', borderColor: '#9ec5e8', color: '#1e4c6e' }}>{branch.result}</div>
          </div>
          <div className="rounded-lg border-2 p-3 bg-white" style={{ borderColor: '#cfc9ba' }}>
            <div className="text-[11px] font-bold mb-1.5" style={{ color: '#1e4c6e' }}>🧪 truthy / falsy — 빈 값은 곧 거짓</div>
            <div className="space-y-1">
              {truthy.map((t, i) => (
                <div key={i} className="text-[10px] font-mono rounded border px-2 py-1 flex items-center gap-2"
                  style={t.tone ? { background: '#ecfdf5', borderColor: '#6ee7b7', color: '#065f46' } : { background: '#fef2f2', borderColor: '#fca5a5', color: '#991b1b' }}>
                  <span className="flex-1">{t.val}</span>
                  <span className="font-bold">{t.bool}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 반복문 순회 표 + for-else
    // ─────────────────────────────────────────────────────
    function LoopView({ loop, forElse }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 p-3 bg-white" style={{ borderColor: '#9ec5e8' }}>
            <div className="text-[11px] font-bold mb-2" style={{ color: '#1e4c6e' }}>🔁 enumerate(zip(names, scores)) — 인덱스와 짝을 한 번에</div>
            <table className="w-full text-[10px] font-mono">
              <thead>
                <tr style={{ color: '#1e4c6e' }} className="border-b" >
                  {loop.zipHeader.map((h, i) => <th key={i} className="text-left py-0.5 px-1">{h}</th>)}
                  <th className="text-left py-0.5 px-1">흐름</th>
                </tr>
              </thead>
              <tbody>
                {loop.rows.map((r, i) => {
                  const brk = r.note.includes('break');
                  const cont = r.note.includes('continue') && r.note.includes('→');
                  return (
                    <tr key={i} className="border-t" style={{ borderColor: '#e5e0d3', background: brk ? '#fff8dd' : cont ? '#faf7ef' : 'transparent' }}>
                      <td className="py-1 px-1" style={{ color: '#57534a' }}>{r.i}</td>
                      <td className="py-1 px-1" style={{ color: '#57534a' }}>{r.name}</td>
                      <td className="py-1 px-1" style={{ color: '#57534a' }}>{r.score}</td>
                      <td className="py-1 px-1 font-bold" style={{ color: brk ? '#b45309' : cont ? '#991b1b' : '#065f46' }}>{r.note}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 p-3" style={{ borderColor: '#e0b400', background: '#fffbe6' }}>
            <div className="text-[11px] font-bold mb-1" style={{ color: '#1e4c6e' }}>🎯 for-else — break 없이 끝까지 돌 때만 else</div>
            <div className="text-[10px]" style={{ color: '#57534a' }}>{forElse.note}</div>
            <div className="mt-1.5 text-[10px] font-mono rounded px-2 py-1 border font-bold" style={{ background: YELLOW, borderColor: '#e0b400', color: '#1e4c6e' }}>{forElse.hit}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — for+append vs 컴프리헨션: 요소별 필터/변환 흐름
    // ─────────────────────────────────────────────────────
    function CompView({ comp }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 p-3 bg-white" style={{ borderColor: '#9ec5e8' }}>
            <div className="text-[11px] font-bold mb-2" style={{ color: '#1e4c6e' }}>⚡ 원소마다: {comp.filterLabel} → {comp.transformLabel}</div>
            <div className="flex items-center gap-1 mb-2">
              <span className="text-[9px] w-12" style={{ color: '#8a8578' }}>입력 xs</span>
              {comp.source.map((s, i) => (
                <span key={i} className="text-[10px] font-mono rounded border px-1.5 py-0.5" style={{ background: '#eef6fc', borderColor: '#9ec5e8', color: '#1e4c6e' }}>{s}</span>
              ))}
            </div>
            <div className="space-y-1">
              {comp.flow.map((f, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] font-mono">
                  <span className="w-6 text-right rounded border px-1" style={{ background: '#faf7ef', borderColor: '#cfc9ba', color: '#57534a' }}>{f.x}</span>
                  <span style={{ color: '#8a8578' }}>—필터→</span>
                  <span className="font-bold" style={{ color: f.pass ? '#065f46' : '#991b1b' }}>{f.pass ? '통과' : '제외'}</span>
                  {f.pass ? (
                    <>
                      <span style={{ color: '#8a8578' }}>—변환→</span>
                      <span className="rounded border px-1.5 py-0.5 font-bold" style={{ background: YELLOW, borderColor: '#e0b400', color: '#1e4c6e' }}>{f.out}</span>
                    </>
                  ) : (
                    <span style={{ color: '#c4bfae' }} className="line-through">버림</span>
                  )}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 p-2.5 bg-white" style={{ borderColor: '#6ee7b7' }}>
            <div className="text-[11px] font-bold mb-1.5" style={{ color: '#065f46' }}>🟰 두 방식이 만드는 같은 결과</div>
            <div className="flex items-center gap-1">
              <span className="text-[9px] w-24" style={{ color: '#8a8578' }}>[x**2 for x in xs if x%2==0]</span>
              {comp.result.map((r, i) => (
                <span key={i} className="text-[11px] font-mono font-bold rounded border px-2 py-0.5" style={{ background: '#ecfdf5', borderColor: '#6ee7b7', color: '#065f46' }}>{r}</span>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 컴프리헨션 변종 + 제너레이터 지연평가
    // ─────────────────────────────────────────────────────
    function GenCompView({ variants, gen }) {
      const KIND = {
        list: { c: '#3776AB', bg: '#eef6fc', b: '#9ec5e8' },
        dict: { c: '#7c3aed', bg: '#f5f3ff', b: '#c4b5fd' },
        set:  { c: '#0e7490', bg: '#ecfeff', b: '#67e8f9' },
        gen:  { c: '#b45309', bg: '#fffbe6', b: '#e0b400' },
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 p-3 bg-white" style={{ borderColor: '#9ec5e8' }}>
            <div className="text-[11px] font-bold mb-2" style={{ color: '#1e4c6e' }}>🧊 괄호가 종류를 결정한다</div>
            <div className="space-y-1">
              {variants.map((v, i) => {
                const k = KIND[v.kind];
                return (
                  <div key={i} className="flex items-center gap-2 text-[10px] font-mono rounded border px-2 py-1" style={{ background: k.bg, borderColor: k.b }}>
                    <span className="font-bold uppercase w-8" style={{ color: k.c }}>{v.kind}</span>
                    <span className="flex-1" style={{ color: '#2b2b2b' }}>{v.expr}</span>
                    <span style={{ color: '#8a8578' }}>{v.memo}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 p-3" style={{ borderColor: '#e0b400', background: '#fffbe6' }}>
            <div className="text-[11px] font-bold mb-1.5" style={{ color: '#1e4c6e' }}>⏳ 제너레이터 지연평가 — next() 할 때 하나씩</div>
            <div className="space-y-1">
              {gen.pulls.map((p, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] font-mono">
                  <span className="rounded border px-1.5 py-0.5 font-bold" style={{ background: 'white', borderColor: '#e0b400', color: '#b45309' }}>{p.call}</span>
                  <span style={{ color: '#8a8578' }}>→ yield</span>
                  <span className="rounded border px-1.5 py-0.5 font-bold" style={{ background: YELLOW, borderColor: '#e0b400', color: '#1e4c6e' }}>{p.yield}</span>
                  <span style={{ color: '#8a8578' }}>{p.state}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] rounded px-2 py-1 border font-mono" style={{ background: 'white', borderColor: '#e0b400', color: '#57534a' }}>{gen.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — match 데모 + 3대 실패 사례
    // ─────────────────────────────────────────────────────
    function MatchView({ matchDemo, fails }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 p-3 bg-white" style={{ borderColor: '#9ec5e8' }}>
            <div className="text-[11px] font-bold mb-2" style={{ color: '#1e4c6e' }}>🧩 match — 모양을 맞추고 동시에 언패킹</div>
            <div className="text-[10px] font-mono mb-2 inline-block rounded px-2 py-1 border" style={{ background: '#eef6fc', borderColor: '#9ec5e8', color: '#1e4c6e' }}>{matchDemo.input}</div>
            <div className="space-y-1">
              {matchDemo.arms.map((a, i) => (
                <div key={i} className={`text-[10px] font-mono rounded border px-2 py-1 flex items-center gap-2 ${a.hit ? 'font-bold' : 'opacity-60'}`}
                  style={a.hit ? { background: YELLOW, borderColor: '#e0b400', color: '#1e4c6e' } : { background: '#faf7ef', borderColor: '#cfc9ba', color: '#57534a' }}>
                  <span>{a.hit ? '✓' : '·'}</span>
                  <span className="flex-1">{a.pat}</span>
                  <span>{a.act}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 p-2.5" style={{ borderColor: '#fca5a5', background: '#fef2f2' }}>
            <div className="text-[11px] font-bold mb-1.5" style={{ color: '#991b1b' }}>🚑 실무 3대 실패 → 교정</div>
            <div className="space-y-1.5">
              {fails.map((f, i) => (
                <div key={i} className="text-[10px]">
                  <div className="flex items-start gap-1.5">
                    <span style={{ color: '#dc2626' }} className="font-bold">✗</span>
                    <span style={{ color: '#7f1d1d' }}>{f.bad}</span>
                  </div>
                  <div className="flex items-start gap-1.5 ml-3">
                    <span style={{ color: '#059669' }} className="font-bold">✓</span>
                    <span style={{ color: '#065f46' }}>{f.fix}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-white',      border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      cond:    { icon: '🔀', label: '조건문' },
      loop:    { icon: '🔁', label: '반복문' },
      comp:    { icon: '⚡', label: '리스트 컴프리헨션' },
      gencomp: { icon: '🧊', label: 'dict/set·제너레이터' },
      match:   { icon: '🧩', label: 'match·안티패턴' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.cond;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#9ec5e8' }}>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold flex items-center gap-1.5" style={{ color: '#1e4c6e' }}>
              <span>{badge.icon}</span>
              <span>제어문·컴프리헨션 — {badge.label}</span>
            </h3>
            <span className="text-[10px]" style={{ color: '#8a8578' }}>{state.actor}</span>
          </div>
          <div className="text-[10px] font-mono mb-3 px-2 py-1 rounded border" style={{ background: '#eef6fc', borderColor: '#9ec5e8', color: BLUE }}>
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'cond' && <BranchView branch={state.branch} truthy={state.truthy} />}
          {state.stage === 'loop' && <LoopView loop={state.loop} forElse={state.forElse} />}
          {state.stage === 'comp' && <CompView comp={state.comp} />}
          {state.stage === 'gencomp' && <GenCompView variants={state.variants} gen={state.gen} />}
          {state.stage === 'match' && <MatchView matchDemo={state.matchDemo} fails={state.fails} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark) — 언어 python
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className="flex"
                    style={isHi ? { background: 'rgba(55,118,171,0.22)', borderLeft: '2px solid ' + BLUE, marginLeft: '-0.75rem', paddingLeft: '0.5rem' } : null}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #eef6fc 0%, #fffbe6 100%)' }}>
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ background: BLUE }}>Ⅰ. 언어 기초</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: '#1e4c6e' }}>I-2-1. 제어문과 컴프리헨션</h1>
                <p className="text-sm" style={{ color: '#3a6a8f' }}>if·for·while과 리스트/딕트/제너레이터 컴프리헨션으로 파이썬답게 쓰기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BLUE }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ background: i <= stepIdx ? BLUE : '#cbdcea' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#dbeafe' }}>{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-sky-50"
                style={{ borderColor: '#9ec5e8', color: '#1e4c6e' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-sky-50 disabled:opacity-40"
                style={{ borderColor: '#9ec5e8', color: '#1e4c6e' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ background: playing ? '#1e4c6e' : BLUE }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-sky-50 disabled:opacity-40"
                style={{ borderColor: '#9ec5e8', color: '#1e4c6e' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#8a8578' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: BLUE, color: '#1e4c6e' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                파이썬의 분기는 if/elif/else 와 truthy 판정, 반복은 이터러블을 하나씩 꺼내는 for(+enumerate·zip·for-else)와 상태 기반 while 이다.
                네 줄짜리 for+append 관용구는 리스트 컴프리헨션 [f(x) for x in xs if cond] 한 줄로 더 빠르고 명확하게 바뀌고,
                괄호를 바꾸면 dict/set 컴프리헨션과 지연평가 제너레이터가 된다. 대용량은 제너레이터로 스트리밍한다.
                match·walrus 는 의도가 또렷할 때만. 규칙은 "짧게"가 아니라 "읽기 쉽게" — 과중첩·순회 중 수정·메모리 폭발을 피하면 그것이 파이썬다움이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['if_elif_else', 'truthy', 'for', 'enumerate', 'zip', 'for-else', '컴프리헨션', '제너레이터', '지연평가', 'match', 'walrus'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ background: '#eef6fc', color: '#1e4c6e', borderColor: '#9ec5e8' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BLUE }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
