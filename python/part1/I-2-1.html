    // ─────────────────────────────────────────────────────

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.cond;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#9ec5e8' }}>
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold flex items-center gap-1.5" style={{ color: '#1e4c6e' }}>
              <span>{badge.icon}</span>
              <span>제어문·컴프리헨션 — {badge.label}</span>
            </h3>
            <span className="text-[10px]" style={{ color: '#8a8578' }}>{state.actor}</span>
          </div>
          <div className="text-[10px] font-mono mb-3 px-2 py-1 rounded border" style={{ background: '#eef6fc', borderColor: '#9ec5e8', color: BLUE }}>
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'cond' && <BranchView branch={state.branch} truthy={state.truthy} />}
          {state.stage === 'loop' && <LoopView loop={state.loop} forElse={state.forElse} />}
          {state.stage === 'comp' && <CompView comp={state.comp} />}
          {state.stage === 'gencomp' && <GenCompView variants={state.variants} gen={state.gen} />}
          {state.stage === 'match' && <MatchView matchDemo={state.matchDemo} fails={state.fails} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark) — 언어 python
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className="flex"
                    style={isHi ? { background: 'rgba(55,118,171,0.22)', borderLeft: '2px solid ' + BLUE, marginLeft: '-0.75rem', paddingLeft: '0.5rem' } : null}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #eef6fc 0%, #fffbe6 100%)' }}>
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ background: BLUE }}>Ⅰ. 언어 기초</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: '#1e4c6e' }}>I-2-1. 제어문과 컴프리헨션</h1>
                <p className="text-sm" style={{ color: '#3a6a8f' }}>if·for·while과 리스트/딕트/제너레이터 컴프리헨션으로 파이썬답게 쓰기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BLUE }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ background: i <= stepIdx ? BLUE : '#cbdcea' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#dbeafe' }}>{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-sky-50"
                style={{ borderColor: '#9ec5e8', color: '#1e4c6e' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-sky-50 disabled:opacity-40"
                style={{ borderColor: '#9ec5e8', color: '#1e4c6e' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ background: playing ? '#1e4c6e' : BLUE }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-sky-50 disabled:opacity-40"
                style={{ borderColor: '#9ec5e8', color: '#1e4c6e' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#8a8578' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: BLUE, color: '#1e4c6e' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                파이썬의 분기는 if/elif/else 와 truthy 판정, 반복은 이터러블을 하나씩 꺼내는 for(+enumerate·zip·for-else)와 상태 기반 while 이다.
                네 줄짜리 for+append 관용구는 리스트 컴프리헨션 [f(x) for x in xs if cond] 한 줄로 더 빠르고 명확하게 바뀌고,
                괄호를 바꾸면 dict/set 컴프리헨션과 지연평가 제너레이터가 된다. 대용량은 제너레이터로 스트리밍한다.
                match·walrus 는 의도가 또렷할 때만. 규칙은 "짧게"가 아니라 "읽기 쉽게" — 과중첩·순회 중 수정·메모리 폭발을 피하면 그것이 파이썬다움이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['if_elif_else', 'truthy', 'for', 'enumerate', 'zip', 'for-else', '컴프리헨션', '제너레이터', '지연평가', 'match', 'walrus'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ background: '#eef6fc', color: '#1e4c6e', borderColor: '#9ec5e8' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BLUE }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
