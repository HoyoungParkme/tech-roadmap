    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Python I-2-2 — 함수·인자 (args·kwargs·기본값 함정)
    학습 목표: 위치·키워드·기본값 인자와 *args/**kwargs 수집, 인자 순서 규칙(/·*로
              위치전용·키워드전용), 언패킹 호출 f(*list, **dict)를 익히고,
              파이썬 개발자가 반드시 아는 "가변 기본값 함정"(def f(x=[]))이
              왜 호출 간 값이 누적되는지를 상자·화살표로 추적한 뒤, 다중 반환과
              일급 객체까지 실무에서 바로 쓰고 자주 틀리는 지점을 6단계로 본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 인자 바인딩·수집·공유 리스트 누적 시각화) / 우(VSCode CodeViewer: python)
    색상: Python 파랑 #3776AB · 형광펜 노랑 #FFD43B · 글자/링크 파랑다크 #1e4c6e
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 인자 전달 → *args/**kwargs → 순서 규칙 → 가변 기본값 함정 → 반환/일급 → 실무 함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(calling/collect/order/trap/returns/pitfalls)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      calling: {lang: "python", filename: "calling.py — 위치·키워드·기본값", lines: [
        "# 기본값이 있는 파라미터는 뒤쪽에 둔다",
        "def greet(name, greeting=\"안녕\", punct=\"!\"):",
        "    return f\"{greeting}, {name}{punct}\"",
        "",
        "# 1) 위치 인자 — 순서대로 매칭",
        "print(greet(\"kim\"))            # => 안녕, kim!",
        "print(greet(\"kim\", \"hello\"))   # => hello, kim!",
        "",
        "# 2) 키워드 인자 — 이름으로 콕 집음 (순서 무관)",
        "print(greet(\"kim\", punct=\"?\")) # => 안녕, kim?",
        "print(greet(name=\"lee\", greeting=\"hi\"))  # => hi, lee!",
        "",
        "# 3) 위치 다음에 키워드 (거꾸로는 SyntaxError)",
        "print(greet(\"kim\", greeting=\"hey\", punct=\"~\"))  # => hey, kim~",
        "# greet(greeting=\"hi\", \"kim\")  → SyntaxError",
      ]},
      collect: {lang: "python", filename: "collect.py — 가변 인자 수집", lines: [
        "# *args: 남는 위치 인자 → 튜플",
        "# **kwargs: 남는 키워드 인자 → 딕셔너리",
        "def log(level, *args, **kwargs):",
        "    print(level, args, kwargs)",
        "",
        "log(\"INFO\", \"user\", 42, code=200, ok=True)",
        "# => INFO ('user', 42) {'code': 200, 'ok': True}",
        "",
        "# 인자가 없으면 빈 튜플 / 빈 딕셔너리",
        "log(\"WARN\")",
        "# => WARN () {}",
        "",
        "# 대표 용례: 투명하게 감싸는 래퍼(데코레이터)",
        "def timed(fn):",
        "    def wrapper(*args, **kwargs):",
        "        # 원본 시그니처가 무엇이든 그대로 전달",
        "        return fn(*args, **kwargs)",
        "    return wrapper",
      ]},
      order: {lang: "python", filename: "order.py — / 와 * 마커", lines: [
        "# 순서: 위치전용 / , 일반, *, 키워드전용, **kwargs",
        "def f(a, b, /, c, *, d, e):",
        "    return (a, b, c, d, e)",
        "",
        "# a, b 는 위치 전용 (/ 앞)",
        "# d, e 는 키워드 전용 (* 뒤)",
        "print(f(1, 2, 3, d=4, e=5))     # => (1, 2, 3, 4, 5)",
        "print(f(1, 2, c=3, d=4, e=5))   # => (1, 2, 3, 4, 5)",
        "",
        "# f(a=1, b=2, c=3, d=4, e=5)  → TypeError",
        "#   (a, b 는 위치 전용이라 이름으로 못 넘김)",
        "# f(1, 2, 3, 4, 5)            → TypeError",

    // ─────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────
    // Step 4 — 가변 기본값 함정 (인터랙티브: 공유 리스트 누적)
    // ─────────────────────────────────────────────────────
    function MutableDefaultView() {
      const [mode, setMode] = useState('bad'); // 'bad' | 'good'
      const [callCount, setCallCount] = useState(0);
      // bad 모드: 정의 시 1회 생성된 하나의 리스트가 누적 (호출마다 append)
      // good 모드: 호출마다 새 리스트 → 항상 [현재값]
      const badList = [];
      for (let i = 1; i <= callCount; i++) badList.push(i);
      const goodLastVal = callCount === 0 ? null : callCount;

      const isBad = mode === 'bad';
      const reset = () => setCallCount(0);
      const doCall = () => setCallCount((c) => Math.min(c + 1, 6));

      // 화살표로 이번까지의 모든 호출이 같은 상자를 가리킴(bad) / 각자 새 상자(good)
      return (
        <div className="space-y-3">
          <div className="flex gap-1.5">
            <button
              onClick={() => { setMode('bad'); reset(); }}
              className={`flex-1 text-[10px] font-bold rounded px-2 py-1.5 border ${isBad ? 'bg-red-500 text-white border-red-500' : 'bg-white text-red-600 border-red-300'}`}
            >✗ box=[]  (함정)</button>
            <button
              onClick={() => { setMode('good'); reset(); }}
              className={`flex-1 text-[10px] font-bold rounded px-2 py-1.5 border ${!isBad ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-300'}`}
            >✓ box=None  (해결)</button>
          </div>

          <div className={`rounded-lg border-2 p-3 ${isBad ? 'border-red-300 bg-red-50' : 'border-emerald-300 bg-emerald-50'}`}>
            <div className={`text-[10px] font-mono font-bold mb-2 ${isBad ? 'text-red-700' : 'text-emerald-700'}`}>
              {isBad ? 'def add(x, box=[]):  # 정의 시 리스트 1개 생성' : 'def add(x, box=None):  # 호출마다 새 리스트'}
            </div>

            <div className="flex items-center gap-3">
              {/* 호출들 */}
              <div className="flex flex-col gap-1">
                {Array.from({ length: callCount }).map((_, i) => (
                  <div key={i} className="flex items-center gap-1">
                    <span className="text-[10px] font-mono font-bold rounded px-1.5 py-0.5 bg-[#1e4c6e] text-white">add({i + 1})</span>
                    <span className={isBad ? 'text-red-400 text-sm' : 'text-emerald-400 text-sm'}>──▶</span>
                  </div>
                ))}
                {callCount === 0 && <span className="text-[10px] text-slate-400">아래 "add() 호출" 버튼을 눌러보세요</span>}
              </div>

              {/* 리스트 상자 */}
              <div className="flex-1">
                {isBad ? (
                  <div className="rounded-lg border-2 border-red-400 bg-white p-2 text-center">
                    <div className="text-[9px] text-slate-500 font-mono">공유 리스트 1개 (id 동일)</div>
                    <div className="text-lg font-mono font-bold text-red-700">[{badList.join(', ')}]</div>
                    <div className="text-[9px] text-red-500">호출할수록 누적 →</div>
                  </div>
                ) : (
                  <div className="rounded-lg border-2 border-emerald-400 bg-white p-2 text-center">
                    <div className="text-[9px] text-slate-500 font-mono">이번 호출의 새 리스트</div>
                    <div className="text-lg font-mono font-bold text-emerald-700">[{goodLastVal === null ? '' : goodLastVal}]</div>
                    <div className="text-[9px] text-emerald-600">매번 새로 생성 → 안 쌓임</div>
                  </div>
                )}
              </div>
            </div>
          </div>

          <div className="flex gap-1.5">
            <button
              onClick={doCall}
              aria-label="add 함수 호출"
              className="flex-1 text-xs font-bold rounded px-3 py-1.5 bg-[#3776AB] text-white hover:bg-[#1e4c6e]"
            >▶ add({callCount + 1}) 호출</button>
            <button
              onClick={reset}
              className="text-xs rounded px-3 py-1.5 border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
            >↺ 리셋</button>
          </div>

          <div className="rounded bg-[#282c34] p-2.5 font-mono text-[11px]">
            <div className="text-slate-400">반환값: <span className={isBad ? 'text-red-300' : 'text-emerald-300'}>
              [{isBad ? badList.join(', ') : (goodLastVal === null ? '' : goodLastVal)}]
            </span></div>
          </div>
        </div>
      );
    }

    const ALERT_STYLE = {

      warn:   { bg: 'bg-yellow-50',  border: 'border-yellow-400',  text: 'text-[#1e4c6e]',   icon: '⚠️' },

      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>

    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      calling:  { icon: '📌', label: '인자 전달' },
      collect:  { icon: '📦', label: '가변 인자' },
      order:    { icon: '🚦', label: '순서 규칙' },
      trap:     { icon: '🕳', label: '기본값 함정' },
      returns:  { icon: '🎁', label: '반환·일급' },
      pitfalls: { icon: '🚨', label: '실무 함정' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.calling;
      return (
        <div className="rounded-xl border border-blue-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>함수·인자 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#3776AB] font-mono mb-3 px-2 py-1 rounded bg-blue-50 border border-blue-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'calling' && <CallBindingView binding={state.binding} />}
          {state.stage === 'collect' && <CollectView collect={state.collect} />}
          {state.stage === 'order' && <OrderView order={state.order} />}
          {state.stage === 'trap' && <MutableDefaultView />}
          {state.stage === 'returns' && <ReturnsView returns={state.returns} />}
          {state.stage === 'pitfalls' && <PitfallsView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-xs" style={{ backgroundColor: '#3776AB' }}>Ⅰ. 언어 기초</span>
              <div>
                <div className="text-[11px] font-mono text-[#3776AB] font-bold">I-2-2</div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">함수·인자 — args·kwargs·기본값 함정</h1>
                <p className="text-sm text-[#1e4c6e]/80">위치·키워드·기본값·가변인자와 파이썬 개발자가 반드시 아는 가변 기본값 함정</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#3776AB' : '#cfe0ee' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-blue-50 px-5 py-4 shadow" style={{ backgroundColor: '#1e4c6e' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#1e4c6e' : '#3776AB' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-blue-400 bg-white text-[#1e4c6e] hover:bg-blue-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-[#1e4c6e]" style={{ borderColor: '#3776AB' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                인자는 위치·키워드·기본값으로 넘기고, 남는 위치는 *args(튜플)·남는 키워드는 **kwargs(딕셔너리)로 모인다.
                순서는 위치전용 / , 일반, *, 키워드전용 순이며 / 와 * 로 호출 방식을 강제한다. 반드시 기억할 함정은 가변 기본값 —
                def f(x=[]) 의 리스트는 정의 시 한 번만 생성되어 모든 호출이 공유하므로 값이 누적된다. 항상 x=None 후 내부에서 생성하라.
                함수는 일급 객체라 변수·리스트·인자로 다룰 수 있고, 다중 반환은 튜플 언패킹이다.
                다음 장 II-1-1에서는 리스트·튜플·딕셔너리 컬렉션으로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['위치인자', '키워드인자', '기본값', 'args', 'kwargs', '위치전용/', '키워드전용*', '언패킹', '가변기본값함정', '다중반환', '일급객체'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-blue-100 text-[#1e4c6e] border border-blue-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
