  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    Python I-1-2 — 컬렉션 내부 동작 (list·dict·set·tuple)
    학습 목표: 4대 컬렉션이 메모리에서 어떻게 생겼는지(동적 배열 / 해시 테이블)를 눈으로 보고,
              연산별 시간복잡도와 "언제 무엇을 쓰나"의 선택 기준을 실무 함정과 함께 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: 배열 슬롯·해시 버킷·검색비용 시뮬레이션) / 우(VSCode CodeViewer: python)
    색상: Python 파랑 (#3776AB 기조 / 형광펜 #FFD43B / 텍스트·배지 다크 #1e4c6e)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — list → tuple → dict → set → 복사 → 선택기준/함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. list — 동적 배열, 인덱싱은 빠르고 중간 삽입은 느리다',
        desc: 'list는 내부적으로 "연속된 메모리 한 줄에 객체 포인터를 죽 늘어놓은 동적 배열"이다. 그래서 lst[i]는 시작 주소 + i칸 계산 한 번으로 끝나 O(1)이지만, 맨 앞이나 중간에 끼워 넣으면 뒤의 모든 원소를 한 칸씩 밀어야 해서 O(n)이 된다. append가 O(1)로 느껴지는 건 파이썬이 실제 원소 수보다 여유 있게 자리를 미리 잡아두기 때문이고(용량이 꽉 차면 통째로 더 큰 배열로 복사·이전), 이 복사 비용을 전체로 나누면 "분할상환(amortized) O(1)"이 된다. 실무에서 큐처럼 앞에서 빼고 뒤에 넣는 패턴이면 list.pop(0)은 O(n)이라 느리니 collections.deque를 써야 한다.',
        actor: '📦 동적 배열 · 인덱싱 O(1) · 중간삽입 O(n)',
        stage: 'list',
        stageLabel: 'list 내부 구조 — 연속 슬롯 + 여유 용량',
        slots: [
          { i: 0, v: '10' }, { i: 1, v: '20' }, { i: 2, v: '30' }, { i: 3, v: '40' },
        ],
        spare: 2,
        ops: [
          { op: 'lst[i]  인덱싱', big: 'O(1)', tone: 'good', why: '시작주소 + i칸 → 한 번에' },
          { op: 'lst.append(x)', big: 'O(1)*', tone: 'good', why: '분할상환 — 여유칸에 그냥 넣음' },
          { op: 'lst.insert(0, x)', big: 'O(n)', tone: 'bad', why: '뒤 원소 전부 한 칸씩 밀기' },
          { op: 'lst.pop(0)', big: 'O(n)', tone: 'bad', why: '앞에서 빼기 → deque 권장' },
          { op: 'x in lst', big: 'O(n)', tone: 'bad', why: '앞에서부터 하나씩 비교' },
        ],
        alert: { tone: 'warn', text: '큐(앞에서 빼고 뒤에 넣기)에 list.pop(0)을 쓰면 매번 O(n). collections.deque는 양끝 삽입·삭제가 O(1)이다.' },
        code: {
          lang: 'python',
          filename: 'list_internals.py',
          lines: [
            'import sys',
            'from collections import deque',
            '',
            '# 1) 인덱싱은 O(1) — 시작 주소에서 i칸 점프',
            'nums = [10, 20, 30, 40]',
            'print(nums[2])            # => 30   (한 번에)',
            '',
            '# 2) append 는 분할상환 O(1) — 여유 용량 덕분',
            'lst = []',
            'for i in range(4):',
            '    lst.append(i)',
            '    # __sizeof__ 는 실제 원소보다 큰 용량을 보여준다',
            '    print(i, sys.getsizeof(lst))',
            '# => 0 88 / 1 88 / 2 88 / 3 88   (미리 잡아둔 자리)',
            '',
            '# 3) 중간/앞 삽입은 O(n) — 뒤 원소를 전부 민다',
            'nums.insert(0, 5)         # [5, 10, 20, 30, 40]',
            'print(nums)               # => [5, 10, 20, 30, 40]',
            '',
            '# 4) 큐 패턴이면 pop(0) 금지 → deque 사용',
            'q = deque([1, 2, 3])',
            'q.appendleft(0)           # O(1)',
            'q.popleft()               # O(1)',
            'print(q)                  # => deque([1, 2, 3])',
          ],
          highlight: [4, 5, 6, 8, 15, 16, 17, 20, 21, 22, 23],
        },
      },
      {

    const OP_TONE = { good: 'text-emerald-700', bad: 'text-red-700', mid: 'text-amber-700' };

    function ComplexityTable({ title, rows }) {
      return (
        <div className="rounded-lg border-2 border-[#FFD43B] bg-[#fffbe6] p-2.5">
          <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">⏱ {title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-[#1e4c6e] border-b border-[#e6c53a]">
                <th className="text-left py-0.5">연산</th>
                <th className="text-left py-0.5 pl-2 w-16">복잡도</th>
                <th className="text-left py-0.5 pl-2">왜</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className="border-t border-[#f0e2a0]">
                  <td className="py-1 font-mono text-slate-700">{r.op}</td>
                  <td className={`py-1 pl-2 font-bold font-mono ${OP_TONE[r.tone]}`}>{r.big}</td>
                  <td className="py-1 pl-2 text-slate-600">{r.why}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function ListView({ slots, spare, ops }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#3776AB] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">📦 동적 배열 — 연속된 슬롯 + 여유 용량</div>
            <div className="flex items-end gap-1">
              {slots.map((s) => (
                <div key={s.i} className="flex flex-col items-center">
                  <div className="w-11 h-11 rounded border-2 border-[#3776AB] bg-[#eaf2fa] flex items-center justify-center font-mono font-bold text-[#1e4c6e] text-sm">{s.v}</div>
                  <div className="text-[9px] text-slate-500 font-mono mt-0.5">[{s.i}]</div>
                </div>
              ))}
              {Array.from({ length: spare }).map((_, i) => (
                <div key={'sp' + i} className="flex flex-col items-center">
                  <div className="w-11 h-11 rounded border-2 border-dashed border-slate-300 bg-slate-50 flex items-center justify-center text-slate-300 text-lg">·</div>
                  <div className="text-[9px] text-slate-400 font-mono mt-0.5">여유</div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-slate-600">인덱싱 <b className="text-[#1e4c6e] font-mono">nums[i]</b> = 시작주소 + i칸 → <b className="text-emerald-700">O(1)</b>. 점선칸은 append 대비 미리 잡아둔 자리(분할상환의 비밀).</div>
          </div>
          <ComplexityTable title="list 연산별 시간복잡도" rows={ops} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — tuple 불변 슬롯 + 해시가능 판정
    // ─────────────────────────────────────────────────────
    function TupleView({ slots, hashable }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#1e4c6e] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2 flex items-center gap-1.5"><span>🔒</span><span>불변 슬롯 — 만든 뒤 못 바꾼다</span></div>
            <div className="flex items-end gap-1">
              {slots.map((s) => (
                <div key={s.i} className="flex flex-col items-center">
                  <div className="w-16 h-11 rounded border-2 border-[#1e4c6e] bg-[#e7edf3] flex items-center justify-center font-mono font-bold text-[#1e4c6e] text-sm">{s.v}</div>
                  <div className="text-[9px] text-slate-500 font-mono mt-0.5">[{s.i}] 🔒</div>
                </div>
              ))}
              <div className="ml-2 text-[10px] text-slate-600 self-center">= <span className="font-mono">(37.5, 127.0)</span><br/>좌표 = 하나의 값</div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#3776AB] bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">🔑 해시가능? → dict 키·set 원소로 쓸 수 있나</div>
            <div className="space-y-1">
              {hashable.map((h, i) => (
                <div key={i} className={`text-[10px] font-mono rounded border px-2 py-1 flex items-center gap-2 ${h.ok ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-red-50 border-red-300 text-red-700'}`}>
                  <span>{h.ok ? '✓' : '✗'}</span>
                  <span className="font-bold w-20">{h.label}</span>
                  <span className="font-normal text-slate-600">{h.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — dict 해시 버킷 다이어그램 + 복잡도
    // ─────────────────────────────────────────────────────
    function DictView({ buckets, ops }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#3776AB] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🔑 해시 테이블 — 키를 해시해 버킷으로 점프</div>
            <div className="space-y-1">
              {buckets.map((b) => (
                <div key={b.idx} className="flex items-center gap-2 text-[10px]">
                  <span className="w-8 text-right font-mono text-slate-400">[{b.idx}]</span>
                  {b.key ? (
                    <div className="flex-1 flex items-center gap-2">
                      <span className="rounded border-2 border-[#3776AB] bg-[#eaf2fa] px-2 py-0.5 font-mono font-bold text-[#1e4c6e]">{b.key}: {b.val}</span>
                      <span className="text-[9px] text-slate-400 font-mono">← {b.hash}</span>
                    </div>
                  ) : (
                    <span className="flex-1 rounded border border-dashed border-slate-300 bg-slate-50 px-2 py-0.5 text-slate-300 font-mono">빈 버킷</span>
                  )}
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-slate-600"><b className="text-[#1e4c6e] font-mono">user["name"]</b> → hash("name")로 [3]번 자리에 바로 점프 → <b className="text-emerald-700">O(1)</b></div>
          </div>
          <ComplexityTable title="dict 연산별 시간복잡도" rows={ops} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — list in vs set in 검색 비용 대비
    // ─────────────────────────────────────────────────────
    function SetView({ search, ops }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#3776AB] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🔍 <span className="font-mono">{search.target} in ?</span> — 검색 비용을 눈으로 비교</div>
            {/* list: 앞에서부터 훑기 */}
            <div className="mb-2">
              <div className="text-[10px] font-bold text-red-700 mb-1">list — 앞에서부터 하나씩 비교 (O(n))</div>
              <div className="flex items-center gap-0.5 flex-wrap">
                {search.list.map((v, i) => (
                  <span key={i} className={`text-[10px] font-mono rounded px-1.5 py-0.5 border ${v === search.target ? 'bg-emerald-100 border-emerald-400 text-emerald-900 font-bold' : 'bg-red-50 border-red-200 text-red-700'}`}>{v}</span>
                ))}
                <span className="ml-1 text-[9px] text-red-700 font-mono">≈ {search.listSteps}회 비교</span>
              </div>
            </div>
            {/* set: 해시로 한 번에 */}
            <div>
              <div className="text-[10px] font-bold text-emerald-700 mb-1">set — 해시로 버킷 한 번에 (O(1))</div>
              <div className="flex items-center gap-2">
                <span className="text-[10px] font-mono rounded px-2 py-0.5 border bg-slate-100 border-slate-300 text-slate-700">{search.setHash}</span>
                <span className="text-emerald-500">→</span>
                <span className="text-[10px] font-mono rounded px-2 py-0.5 border bg-emerald-100 border-emerald-400 text-emerald-900 font-bold">버킷[3]에서 발견</span>
                <span className="text-[9px] text-emerald-700 font-mono">{search.setSteps}회</span>
              </div>
            </div>
          </div>
          <ComplexityTable title="set 연산별 시간복잡도" rows={ops} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 얕은/깊은 복사 다이어그램 + [[0]*3]*3 함정
    // ─────────────────────────────────────────────────────
    function CopyBlock({ data }) {
      return (
        <div className={`flex-1 rounded-lg border-2 p-2.5 ${data.shared ? 'border-red-300 bg-red-50' : 'border-emerald-300 bg-emerald-50'}`}>
          <div className={`text-[10px] font-bold mb-1.5 ${data.shared ? 'text-red-800' : 'text-emerald-800'}`}>{data.title}</div>
          <div className="flex items-center justify-center gap-1 text-[10px] font-mono">
            <span className="rounded border border-slate-400 bg-white px-1.5 py-0.5">원본</span>
            <span className="rounded border border-slate-400 bg-white px-1.5 py-0.5">사본</span>
          </div>
          <div className="flex justify-center my-1 text-lg">{data.shared ? '↘ ↙' : '↓  ↓'}</div>
          <div className="flex items-center justify-center gap-1 text-[10px] font-mono">
            {data.shared ? (
              <span className="rounded border-2 border-red-400 bg-white px-2 py-0.5 font-bold text-red-800">공유 [sub]</span>
            ) : (
              <>
                <span className="rounded border border-emerald-400 bg-white px-1.5 py-0.5">[sub]</span>
                <span className="rounded border border-emerald-400 bg-white px-1.5 py-0.5">[sub 사본]</span>
              </>
            )}
          </div>
          <div className={`mt-1.5 text-[9px] ${data.shared ? 'text-red-700' : 'text-emerald-700'}`}>{data.note}</div>
        </div>
      );
    }

    function CopyView({ copyDiagram, trap }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#3776AB] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🧬 얕은 복사 vs 깊은 복사 — 내부 객체를 공유하나?</div>
            <div className="flex gap-2">
              <CopyBlock data={copyDiagram.shallow} />
              <CopyBlock data={copyDiagram.deep} />
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-400 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-800 mb-1.5">🚨 {trap.title}</div>
            <div className="space-y-1">
              {trap.rows.map((r, i) => (
                <div key={i} className={`text-[10px] font-mono flex items-center gap-2 rounded px-2 py-1 border ${r.bad ? 'bg-red-100 border-red-300 text-red-800 font-bold' : 'bg-white border-red-200 text-slate-700'}`}>
                  <span className="flex-1">{r.code}</span>
                  <span className="text-[9px] font-normal text-slate-500">{r.note}</span>
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-[10px] font-mono rounded bg-emerald-100 border border-emerald-400 text-emerald-900 px-2 py-1 font-bold">✓ {trap.fix}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 선택 기준 종합표 + 결정 트리
    // ─────────────────────────────────────────────────────
    function ChooseView({ chooseTable, decisions }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#3776AB] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-2">🧭 4대 컬렉션 한눈에</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-[#1e4c6e] border-b border-slate-300">
                  <th className="text-left py-0.5">타입</th>
                  <th className="text-left py-0.5 pl-1">순서</th>
                  <th className="text-left py-0.5 pl-1">중복</th>
                  <th className="text-left py-0.5 pl-1">가변</th>
                  <th className="text-left py-0.5 pl-1">언제</th>
                </tr>
              </thead>
              <tbody>
                {chooseTable.map((r, i) => (
                  <tr key={i} className="border-t border-slate-200 align-top">
                    <td className="py-1"><span className="font-mono font-bold px-1.5 py-0.5 rounded text-white" style={{ backgroundColor: r.color }}>{r.name}</span></td>
                    <td className="py-1 pl-1 text-slate-700">{r.ordered}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.dup}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.mutable}</td>
                    <td className="py-1 pl-1 text-slate-600">{r.use}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-[#FFD43B] bg-[#fffbe6] p-2.5">
            <div className="text-[11px] font-bold text-[#1e4c6e] mb-1.5">❓ 이럴 땐 이걸 — 결정 기준</div>
            <div className="space-y-1">
              {decisions.map((d, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="flex-1 text-slate-700">{d.q}</span>
                  <span className="text-slate-400">→</span>
                  <span className="font-mono font-bold text-[#1e4c6e] w-20 text-right">{d.a}</span>
                  <span className="text-[9px] text-slate-500 w-24">{d.why}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fa]', border: 'border-[#3776AB]', text: 'text-[#1e4c6e]', icon: '💡' },
      warn:   { bg: 'bg-[#fffbe6]', border: 'border-[#e6c53a]', text: 'text-[#1e4c6e]', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Python 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      list:   { icon: '📦', label: 'list · 동적 배열' },
      tuple:  { icon: '🔒', label: 'tuple · 불변' },
      dict:   { icon: '🔑', label: 'dict · 해시 테이블' },
      set:    { icon: '🎯', label: 'set · 멤버십' },
      copy:   { icon: '🧬', label: '복사 · 참조 공유' },
      choose: { icon: '🧭', label: '선택 기준' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.list;
      return (
        <div className="rounded-xl border border-[#3776AB] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1e4c6e] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>컬렉션 내부 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1e4c6e] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fa] border border-[#bcd4ea]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'list' && <ListView slots={state.slots} spare={state.spare} ops={state.ops} />}
          {state.stage === 'tuple' && <TupleView slots={state.tupleSlots} hashable={state.hashable} />}
          {state.stage === 'dict' && <DictView buckets={state.buckets} ops={state.dictOps} />}
          {state.stage === 'set' && <SetView search={state.search} ops={state.setOps} />}
          {state.stage === 'copy' && <CopyView copyDiagram={state.copyDiagram} trap={state.trap} />}
          {state.stage === 'choose' && <ChooseView chooseTable={state.chooseTable} decisions={state.decisions} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#FFD43B]/20 border-l-2 border-[#FFD43B] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#eaf2fa] to-[#fffbe6] px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2.5 h-10 rounded-lg bg-[#3776AB] text-white font-bold text-xs whitespace-nowrap">Ⅰ. 언어 기초</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1e4c6e]">I-1-2. 컬렉션 내부 동작 — list·dict·set·tuple</h1>
                <p className="text-sm text-[#3776AB]">4대 컬렉션의 내부 구조·시간복잡도·언제 무엇을 쓰나</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#3776AB] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#3776AB]' : 'bg-[#cfe0f0]'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1e4c6e] text-white px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-blue-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#3776AB] bg-white text-[#1e4c6e] hover:bg-[#eaf2fa]"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#3776AB] bg-white text-[#1e4c6e] hover:bg-[#eaf2fa] disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1e4c6e] text-white' : 'bg-[#3776AB] text-white hover:bg-[#2c5f8a]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#3776AB] bg-white text-[#1e4c6e] hover:bg-[#eaf2fa] disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#3776AB]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#3776AB] bg-white px-4 py-3 text-sm text-[#1e4c6e]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                list는 동적 배열이라 인덱싱은 O(1)·중간삽입은 O(n), tuple은 불변이라 해시가능해 dict 키·set 원소가 된다.
                dict·set은 해시 테이블이라 조회·멤버십이 평균 O(1)이다. 그래서 "여기 있나?"를 반복해 물으면 list(O(n)) 대신 set/dict(O(1))에 담는 것이 실무의 핵심 습관이다.
                복사는 얕은 복사가 내부 객체를 공유함을 기억하고, 2차원 배열은 [[0]*3]*3 대신 컴프리헨션으로 만든다.
                다음 장 I-2-1에서는 이 컬렉션들을 도는 반복·컴프리헨션·제너레이터를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['list', 'tuple', 'dict', 'set', '동적배열', '해시테이블', '시간복잡도', '멤버십O(1)', '얕은복사', 'deepcopy', '컴프리헨션'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#eaf2fa] text-[#1e4c6e] border border-[#bcd4ea]">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1e4c6e]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
