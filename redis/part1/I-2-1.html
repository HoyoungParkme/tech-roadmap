  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

  <!--
    Redis Chapter I-2-1 — Redis vs Memcached vs DragonflyDB
    학습 목표: 인메모리 캐시 솔루션 5가지의 차이를 비교하고 시나리오별로 선택할 수 있다.
    패턴: fastapi v1 — 좌(LiveDataPane: 솔루션 비교 카드) / 우(VSCode CodeViewer)
    색상: neutral (redis 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      redis: {
        lang: 'markdown',
        filename: 'redis.md',
        lines: [
          '# Redis (2009~)',
          '',
          '## 특징',
          '- 단일 스레드 이벤트 루프 (I/O 멀티플렉싱)',
          '- 자료구조 풍부: String / List / Hash / Set / Sorted Set / Stream / HyperLogLog / Geo / Bitmap',
          '- Pub/Sub, Lua, MULTI/EXEC 트랜잭션',
          '- 운영: Sentinel (HA) + Cluster (sharding)',
          '- BSD → SSPL → AGPL 라이선스 변천 (2024)',
          '',
          '## 강점',
          '- 사실상 표준 — 자료/문서/도구가 가장 풍부',
          '- 라이브러리: 모든 언어 (Python, Java, Go, JS, Rust, ...)',
          '- 운영 노하우 축적 — 트러블슈팅 자료 많음',
          '- p99 < 1ms (단일 키 조회)',
          '',
          '## 약점',
          '- 단일 스레드 — CPU 1개만 활용. 큰 키 LRANGE 시 블로킹',
          '- 64GB 넘는 메모리 활용 어려움 (cluster 필요)',
          '- 라이선스 이슈로 Valkey 포크 (2024년 AWS/Google 주도)',
          '',
          '## 추천 시나리오',
          '- 캐시 + 자료구조 (랭킹/큐) 같이 쓸 때',
          '- 분산 락, Stream, Pub/Sub 필요',
          '- 처음 시작이면 일단 Redis',
        ],
      },
      memcached: {
        lang: 'markdown',
        filename: 'memcached.md',
        lines: [
          '# Memcached (2003~)',
          '',
          '## 특징',
          '- 멀티스레드 — CPU 코어 활용 잘함',
          '- 자료구조 없음 — 오직 key → value (단순 byte)',
          '- 영속성 없음 — 재시작 = 데이터 손실',
          '- 분산: 클라이언트 측 consistent hashing',
          '',
          '## 강점',
          '- 정말 단순 — 운영 부담 최소',
          '- 큰 키도 멀티스레드로 처리',
          '- 메모리 효율 — slab allocator',
          '- BSD 라이선스 (변동 없음)',
          '',
          '## 약점',
          '- 자료구조 X — INCR 정도만 있음',
          '- Pub/Sub X, Stream X, 트랜잭션 X',
          '- 영속성 X — 캐시 외 용도 불가',
          '- 클러스터링은 클라이언트 책임',
          '',
          '## 명령어 비교',
          '```',
          'Memcached: get, set, add, replace, delete, incr, decr',
          'Redis:     200+ 명령어',
          '```',
          '',
          '## 추천 시나리오',
          '- 페이지 캐시, 세션 캐시 — 정말 캐시만',
          '- 자료구조 불필요',
          '- 운영 단순함 우선',
        ],
      },
      dragonfly: {
        lang: 'markdown',
        filename: 'dragonflydb.md',
        lines: [
          '# DragonflyDB (2022~)',
          '',
          '## 특징',
          '- Redis API 호환 — 클라이언트 코드 그대로',
          '- 멀티스레드 + shared-nothing',
          '  → 각 CPU 코어가 독자 메모리/큐 (slot)',
          '- 단일 노드에서 1M+ ops/sec (Redis ~200K)',
          '- 256GB 메모리도 단일 노드로 활용 가능',
          '',
          '## 아키텍처',
          '```',
          '        Client',
          '          ↓',
          '      [shard router]',
          '       ↙  ↓  ↘',
          '   shard1 shard2 shard3   (코어별 독립)',
          '```',
          '',
          '## 강점',
          '- 단일 노드 처리량 압도적',
          '- Redis cluster 안 써도 OK (운영 단순)',
          '- 메모리 효율 (Redis 대비 30% ↓ 주장)',
          '- BSL 라이선스 (소스 공개)',

            { mark: 'gone',    text: '클라우드 상업 사용 제약' },
          ],
        },
        spotlight: 'valkey',
        verdict: '라이선스 변경',
        verdictTone: 'good',
        keyPoint: '오픈소스 선택에서 라이선스는 성능만큼 중요한 축이다. 사업 모델이 걸린다.',
        code: { ...CODE.forks, highlight: [19, 20, 21] },
      },
      { ...S4,
        beat: {
          label: '대응 — 포크 출시',
          at: 'forks.md L23–25',
          caption: 'AWS 와 Google 은 BSD 를 유지한 Valkey 를 내고 ElastiCache 기본을 갈아 끼웠다.',
          changes: [
            { mark: 'new',     text: 'Valkey 출시 (BSD 유지)' },
            { mark: 'changed', text: '관리형 서비스 기본 교체' },
          ],
        },
        spotlight: 'valkey',
        verdict: '포크 대응',
        verdictTone: 'good',
        keyPoint: '라이선스 한 줄이 관리형 서비스의 기본값을 바꿨다. 파급이 이렇게 크다.',
        code: { ...CODE.forks, highlight: [23, 24, 25] },
      },
      { ...S4,
        beat: {
          label: '코드는 그대로 돈다',
          at: 'forks.md L29–31',
          caption: 'redis-py, ioredis 같은 기존 클라이언트가 Valkey 에도 그대로 붙는다.',
          changes: [
            { mark: 'read', text: '명령어 100% 동일' },
            { mark: 'gone', text: '클라이언트 교체 불필요' },
          ],
        },
        spotlight: 'valkey',
        verdict: '호환 100%',
        verdictTone: 'good',
        keyPoint: '전환 비용이 거의 0이다. 그래서 클라우드에서는 굳이 Redis 를 고집할 이유가 적다.',
        code: { ...CODE.forks, highlight: [29, 30, 31] },
      },
      { ...S4,
        beat: {
          label: '선택 기준 정리',
          at: 'forks.md L34–36',
          caption: '상업 클라우드면 Valkey, 자체 운영이면 Redis, 멀티스레드가 핵심이면 KeyDB/Dragonfly.',
          changes: [
            { mark: 'read', text: '축: 라이선스 · 운영 · 스레드' },
          ],
        },
        spotlight: 'valkey',
        verdict: '오픈소스 포크',
        verdictTone: 'good',
        keyPoint: '라이선스 이슈에 민감하면 Valkey. 멀티스레드 안정성 검증된 KeyDB도 옵션.',
        code: { ...CODE.forks, highlight: [34, 35, 36] },
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat: {
          label: 'Q1. 자료구조가 필요한가',
          at: 'decision-tree.md L5–7',
          caption: 'List/Hash/Sorted Set 이 필요 없다면 여기서 Memcached 로 끝난다.',
          changes: [
            { mark: 'read', text: 'NO → Memcached' },
          ],
        },
        spotlight: 'memcached',
        verdict: 'Q1 자료구조',
        verdictTone: 'good',
        keyPoint: '첫 질문에서 후보가 절반으로 갈린다. 자료구조가 필요하면 Memcached 는 탈락이다.',
        code: { ...CODE.decision, highlight: [5, 6, 7] },
      },
      { ...S5,
        beat: {
          label: 'Q2. 영속성이 필요한가',
          at: 'decision-tree.md L9–11',
          caption: '재시작 후 데이터가 남아야 하는지 묻는다. 아니라면 둘 다 가능하다.',
          changes: [
            { mark: 'read', text: 'NO → Memcached or Redis' },
          ],
        },
        spotlight: 'memcached',
        verdict: 'Q2 영속성',
        verdictTone: 'good',
        keyPoint: '캐시는 날아가도 되지만, 세션·큐·랭킹은 다르다. 용도가 답을 정한다.',
        code: { ...CODE.decision, highlight: [9, 10, 11] },
      },
      { ...S5,
        beat: {
          label: 'Q3. 라이선스에 민감한가',
          at: 'decision-tree.md L13–15',
          caption: 'AWS/GCP 관리형을 쓴다면 BSD 인 Valkey 로 간다.',
          changes: [
            { mark: 'changed', text: 'YES → Valkey (BSD)' },
          ],
        },
        spotlight: 'valkey',
        verdict: 'Q3 라이선스',
        verdictTone: 'good',
        keyPoint: '관리형 서비스를 쓸 거라면 사실상 Valkey 가 기본값이다. 굳이 거스를 이유가 없다.',
        code: { ...CODE.decision, highlight: [13, 14, 15] },
      },
      { ...S5,
        beat: {
          label: 'Q4. 처리량 한계인가',
          at: 'decision-tree.md L17–19',
          caption: '단일 노드 처리량이 막혔을 때만 DragonflyDB. 아니면 Redis 가 기본이다.',
          changes: [
            { mark: 'changed', text: 'YES → DragonflyDB' },
            { mark: 'read',    text: 'NO → Redis' },
          ],
        },
        spotlight: 'dragonfly',
        verdict: 'Q4 처리량',
        verdictTone: 'good',
        keyPoint: '처리량 한계는 측정한 뒤에 말하는 것이다. 추측으로 DragonflyDB 를 고르지 마라.',
        code: { ...CODE.decision, highlight: [17, 18, 19] },
      },
      { ...S5,
        beat: {
          label: '실무 빈도',
          at: 'decision-tree.md L23–29',
          caption: 'Redis 70% / Valkey 15% / Memcached 10%. 나머지 5%가 특수 케이스다.',
          changes: [
            { mark: 'read', text: 'Redis 70% · Valkey 15%' },
          ],
        },
        spotlight: 'all',
        verdict: '빈도 분포',
        verdictTone: 'good',
        keyPoint: '현실에서는 85%가 Redis 계열이다. 나머지는 이유가 분명할 때만 고른다.',
        code: { ...CODE.decision, highlight: [23, 24, 25, 26, 27, 28, 29] },
      },
      { ...S5,
        beat: {
          label: '결론',
          at: 'decision-tree.md L32–34',
          caption: 'Redis 로 시작하고 6개월 운영해 본 뒤 한계가 보이면 그때 바꾼다.',
          changes: [
            { mark: 'read', text: '기본값 = Redis 한 대' },
          ],
        },
        spotlight: 'all',
        verdict: '결정 트리',
        verdictTone: 'good',
        summary: {
          title: '5솔루션 비교',
          rows: [
            { metric: '자료구조', before: 'Memcached: X', after: 'Redis/Valkey/Dragonfly: O', delta: '대부분 Redis' },
            { metric: '멀티스레드', before: 'Redis: X', after: 'Memcached/KeyDB/Dragonfly: O', delta: 'CPU 활용' },
            { metric: '영속성', before: 'Memcached: X', after: 'Redis: RDB+AOF', delta: '재시작 안전' },
            { metric: '라이선스', before: 'Redis: AGPL', after: 'Valkey: BSD', delta: '클라우드 안전' },
            { metric: '처리량/노드', before: 'Redis: 200K ops', after: 'Dragonfly: 1M ops', delta: '5x' },
          ],
        },
        keyPoint: '"일단 Redis로 시작 → 한계 부딪힐 때 Dragonfly/Valkey 검토". 다음 챕터에서 직접 설치.',
        code: { ...CODE.decision, highlight: [32, 33, 34] },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    const SOLUTIONS = [
      { id: 'redis',     name: 'Redis',       year: 2009, threads: '단일', struct: 'O',  persist: 'O',  license: 'AGPL', tps: '200K' },
      { id: 'memcached', name: 'Memcached',   year: 2003, threads: '멀티', struct: 'X',  persist: 'X',  license: 'BSD',  tps: '500K' },
      { id: 'dragonfly', name: 'DragonflyDB', year: 2022, threads: '멀티', struct: 'O',  persist: 'O',  license: 'BSL',  tps: '1M' },
      { id: 'valkey',    name: 'Valkey',      year: 2024, threads: '단일', struct: 'O',  persist: 'O',  license: 'BSD',  tps: '200K' },
    ];

    function SolutionCard({ sol, spotlight }) {
      const isActive = spotlight === sol.id || spotlight === 'all';
      const isDim = spotlight !== sol.id && spotlight !== 'all';
      return (
        <div className={`rounded-lg border-2 p-3 transition ${
          spotlight === sol.id ? 'border-neutral-700 bg-neutral-100 shadow-md' :
          spotlight === 'all' ? 'border-neutral-300 bg-white' :
          'border-neutral-200 bg-neutral-50 opacity-40'
        }`}>
          <div className="flex items-center justify-between mb-2">
            <span className={`font-bold text-sm ${spotlight === sol.id ? 'text-neutral-900' : 'text-neutral-700'}`}>{sol.name}</span>
            <span className="text-[10px] text-neutral-500">{sol.year}</span>
          </div>
          <div className="grid grid-cols-2 gap-1 text-[10px]">
            <div><span className="text-neutral-500">스레드:</span> <span className="font-mono">{sol.threads}</span></div>
            <div><span className="text-neutral-500">자료구조:</span> <span className={`font-mono ${sol.struct === 'O' ? 'text-emerald-700' : 'text-rose-600'}`}>{sol.struct}</span></div>
            <div><span className="text-neutral-500">영속성:</span> <span className={`font-mono ${sol.persist === 'O' ? 'text-emerald-700' : 'text-rose-600'}`}>{sol.persist}</span></div>
            <div><span className="text-neutral-500">라이선스:</span> <span className="font-mono">{sol.license}</span></div>
            <div className="col-span-2"><span className="text-neutral-500">처리량:</span> <span className="font-mono font-bold">{sol.tps} ops/sec</span></div>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-neutral-400 bg-white p-3">
          <div className="text-sm font-bold text-neutral-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-neutral-500 border-b border-neutral-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">한 쪽</th><th className="py-1 pr-2">다른 쪽</th><th className="py-1">비고</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-neutral-100">
                  <td className="py-1 pr-2 font-medium text-neutral-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-neutral-800 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-neutral-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-neutral-800">인메모리 캐시 솔루션 비교</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="grid grid-cols-2 gap-2">
            {SOLUTIONS.map((sol) => (
              <SolutionCard key={sol.id} sol={sol} spotlight={state.spotlight} />
            ))}
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-neutral-800 bg-neutral-100 border border-neutral-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-neutral-500/25 border-l-2 border-neutral-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-neutral-50 to-stone-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-neutral-700 text-white font-bold">R</span>
              <div>
                <h1 className="text-2xl font-bold text-neutral-900">Chapter I-2-1. Redis vs Memcached vs DragonflyDB</h1>
                <p className="text-sm text-neutral-700/80">인메모리 캐시 솔루션 5가지 비교와 시나리오별 선택</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-neutral-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-neutral-700' : 'bg-neutral-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-neutral-800 text-neutral-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-neutral-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-neutral-300 bg-white text-neutral-700 hover:bg-neutral-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-neutral-300 bg-white text-neutral-700 hover:bg-neutral-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-neutral-900 text-white' : 'bg-neutral-700 text-white hover:bg-neutral-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-neutral-300 bg-white text-neutral-700 hover:bg-neutral-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-neutral-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-neutral-400 bg-white px-4 py-3 text-sm text-neutral-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Redis는 표준이고 자료구조가 풍부하다. Memcached는 단순 캐시 전용. DragonflyDB는 멀티스레드 처리량 강자. Valkey/KeyDB는 라이선스 안전한 포크. 모르겠으면 Redis로 시작하라.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Redis', 'Memcached', 'DragonflyDB', 'Valkey', 'KeyDB', 'License'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-neutral-100 text-neutral-800 border border-neutral-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-neutral-700">
              <a href="./I-1-2.html" className="underline hover:no-underline">← I-1-2 인메모리 캐시란</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 Redis 설치 + 첫 GET/SET →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
