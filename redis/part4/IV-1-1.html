  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Redis Chapter IV-1-1 — 분산 락
    학습 목표: SETNX 단순락의 한계, SET NX EX 안전 락, owner 확인, Redlock, 함정.
    패턴: fastapi v1 — 좌(LiveDataPane: 락 경합 시뮬레이션) / 우(VSCode CodeViewer)
    색상: neutral (redis 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: { lang: 'python', filename: 'naive-lock.py', lines: [
            '# Step 1. ❌ 단순 SETNX — 위험한 안티패턴',
            '',
            'import redis',
            'r = redis.Redis()',
            '',
            '# ❌ 안 좋은 예',
            'def naive_lock(key: str) -> bool:',
            '    return r.setnx(key, "1") == 1',
            '',
            'def naive_unlock(key: str):',
            '    r.delete(key)',
            '',
            '# 문제 시나리오',
            '# 1) P1 이 lock 획득',
            'naive_lock("order:42")        # True',
            '',
            '# 2) P1 이 작업 중 crash 💥',
            '#    - OOM kill',
            '#    - kubernetes pod evict',
            '#    - 서버 재부팅',
            '',
            '# 3) lock 키는 영원히 남음',
            '#    naive_unlock 호출 못함',
            '',
            '# 4) 다른 프로세스 P2 가 lock 획득 시도',
            'naive_lock("order:42")        # False (영원히 False)',
            '',
            '# 5) 시스템 데드락',
            '#    수동으로 redis-cli DEL order:42 해줘야 함',
            '',
            '# 결론: SETNX 만으론 분산 락 안 됨',
            '# 반드시 만료 시간(TTL) 필요',
      ] },
      s2: { lang: 'python', filename: 'safe-lock.py', lines: [
            '# Step 2. ✅ SET NX EX — 안전한 락',
            '',
            'import redis, uuid, time',
            'r = redis.Redis(decode_responses=True)',
            '',
            'def acquire_lock(resource: str, ttl: int = 30) -> str | None:',
            '    """락 획득. 성공 시 token 반환, 실패 시 None."""',
            '    token = str(uuid.uuid4())',
            '    # NX: 없을 때만, EX: TTL 초',
            '    ok = r.set(f"lock:{resource}", token, nx=True, ex=ttl)',
            '    return token if ok else None',
            '',
            'def release_lock(resource: str, token: str):',
            '    """⚠ owner 확인 후 해제 — Step 3 에서 자세히."""',
            '    r.delete(f"lock:{resource}")',
            '',
            '# 사용',
            'token = acquire_lock("order:42", ttl=30)',
            'if token:',
            '    try:',
            '        # 임계 영역 작업',
            '        process_order(42)',
            '    finally:',
            '        release_lock("order:42", token)',
            'else:',
            '    print("다른 프로세스가 처리 중")',
            '',
            '# TTL 30초 동안',
            '# - holder 살아있으면: 작업 완료 후 DEL',
            '# - holder 죽으면: 30초 후 자동 해제',
            '',
            '# 다음 문제',
            '# release_lock 이 그냥 DEL 한다',
            '# → 누군가의 락을 잘못 해제할 수 있음 (Step 3)',
      ] },
      s3: { lang: 'python', filename: 'lua-release.py', lines: [
            '# Step 3. owner 확인 후 안전 해제',
            '',
            'import redis, uuid',
            'r = redis.Redis(decode_responses=True)',
            '',
            '# ❌ 위험 — race condition',
            'def unsafe_release(resource: str, token: str):',
            '    if r.get(f"lock:{resource}") == token:',
            '        # 여기서 TTL 만료 + 다른 프로세스가 락 잡으면',
            '        # 그 락을 내가 DEL 해버림!',
            '        r.delete(f"lock:{resource}")',
            '',
            '# ✅ Lua 스크립트로 원자 실행',
            'RELEASE_SCRIPT = """',
            'if redis.call("get", KEYS[1]) == ARGV[1] then',
            '    return redis.call("del", KEYS[1])',
            'else',
            '    return 0',
            'end',
            '"""',
            '',
            'def release_lock(resource: str, token: str) -> bool:',
            '    result = r.eval(',
            '        RELEASE_SCRIPT,',
            '        1,                          # KEYS 개수',
            '        f"lock:{resource}",         # KEYS[1]',
            '        token,                      # ARGV[1]',
            '    )',
            '    return result == 1',
            '',
            '# 전체 패턴',
            'def with_lock(resource: str, ttl: int = 30):',
            '    """컨텍스트 매니저로 자동 해제."""',
            '    token = str(uuid.uuid4())',
            '    ok = r.set(f"lock:{resource}", token, nx=True, ex=ttl)',
            '    if not ok:',
            '        raise Exception("Lock not acquired")',
            '    try:',
            '        yield token',
            '    finally:',

              </div>
            ))}
          </div>
        </div>
      );
    }

    function LockSafeViz({ viz }) {
      return (
        <div className="rounded-lg bg-neutral-50 border border-neutral-300 p-4">
          <div className="space-y-1.5">
            {viz.steps.map((s, i) => (
              <div key={i} className="flex items-center gap-2 px-2 py-1.5 rounded bg-white border border-neutral-300">
                <span className="text-[10px] bg-neutral-700 text-white px-2 py-0.5 rounded font-mono">{s.proc}</span>
                <span className="flex-1 text-xs font-mono">{s.op}</span>
                <span className="text-[10px] font-mono text-emerald-700">{s.result}</span>
                <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-mono">TTL {s.ttl}s</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LuaReleaseViz({ viz }) {
      return (
        <div className="rounded-lg bg-neutral-50 border border-neutral-300 p-4">
          <div className="bg-neutral-900 text-emerald-300 rounded p-2 text-[10px] font-mono mb-3 break-all">
            {viz.script}
          </div>
          <div className="space-y-1.5">
            {viz.flow.map((f, i) => (
              <div key={i} className={`flex items-center gap-2 px-2 py-1 rounded ${f.match ? 'bg-emerald-50 border border-emerald-300' : 'bg-white'}`}>
                <span className="text-[10px] font-mono text-neutral-600">{f.from}</span>
                <span className="text-neutral-400">→</span>
                <span className="text-[10px] font-mono font-bold text-emerald-800">{f.to}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-emerald-700 text-center">⚛ EVAL 명령 = Redis 안에서 원자 실행</div>
        </div>
      );
    }

    function RedlockViz({ viz }) {
      return (
        <div className="rounded-lg bg-neutral-50 border border-neutral-300 p-4">
          <div className="text-xs text-neutral-600 mb-2">Redlock — {viz.nodes.length}개 노드 중 과반 {viz.quorum} 이상 확보 필요</div>
          <div className="grid grid-cols-5 gap-1">
            {viz.nodes.map((n, i) => (
              <div key={i} className={`text-center p-2 rounded border-2 ${
                n.status === 'acquired' ? 'bg-emerald-100 border-emerald-400' :
                'bg-rose-100 border-rose-400'
              }`}>
                <div className="font-bold text-xs">{n.id}</div>
                <div className="text-[9px] mt-0.5">{n.status === 'acquired' ? '✓' : '✗'}</div>
              </div>
            ))}
          </div>
          <div className="mt-3 text-center text-xs">
            확보: <span className="font-bold text-emerald-700">{viz.acquired}/{viz.nodes.length}</span>
            {' '}({viz.acquired >= viz.quorum ? '✓ 락 획득' : '✗ 실패'})
          </div>
        </div>
      );
    }

    function FencingViz({ viz }) {
      return (
        <div className="rounded-lg bg-neutral-50 border border-neutral-300 p-4">
          <div className="space-y-1.5">
            {viz.flow.map((f, i) => (
              <div key={i} className="flex items-center gap-2 bg-white border border-neutral-300 rounded px-2 py-1.5">
                <span className={`text-[10px] px-2 py-0.5 rounded font-mono ${f.proc === 'P1' ? 'bg-blue-200 text-blue-800' : 'bg-amber-200 text-amber-800'}`}>{f.proc}</span>
                <span className="text-[10px] bg-purple-100 text-purple-800 px-2 py-0.5 rounded font-mono">token={f.token}</span>
                <span className="flex-1 text-xs font-mono">{f.action}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-emerald-700 text-center">단조 증가 token으로 stale write 거부</div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-neutral-400 bg-white p-3">
          <div className="text-sm font-bold text-neutral-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-neutral-500 border-b border-neutral-200">
                <th className="py-1 pr-2">단계</th><th className="py-1 pr-2">문제</th><th className="py-1 pr-2">해결</th><th className="py-1">효과</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-neutral-100">
                  <td className="py-1 pr-2 font-medium text-neutral-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-neutral-800 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-neutral-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-neutral-800">분산 락 시뮬레이션</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {viz?.kind === 'lock-naive' && <LockNaiveViz viz={viz} />}
          {viz?.kind === 'lock-safe' && <LockSafeViz viz={viz} />}
          {viz?.kind === 'lua-release' && <LuaReleaseViz viz={viz} />}
          {viz?.kind === 'redlock' && <RedlockViz viz={viz} />}
          {viz?.kind === 'fencing' && <FencingViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-neutral-800 bg-neutral-100 border border-neutral-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-neutral-500/25 border-l-2 border-neutral-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-neutral-50 to-stone-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-neutral-700 text-white font-bold">R</span>
              <div>
                <h1 className="text-2xl font-bold text-neutral-900">Chapter IV-1-1. 분산 락</h1>
                <p className="text-sm text-neutral-700/80">SETNX 함정 → SET NX EX → Lua release → Redlock → Fencing</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-neutral-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-neutral-700' : 'bg-neutral-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-neutral-800 text-neutral-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-neutral-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-neutral-300 bg-white text-neutral-700 hover:bg-neutral-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-neutral-300 bg-white text-neutral-700 hover:bg-neutral-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-neutral-900 text-white' : 'bg-neutral-700 text-white hover:bg-neutral-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-neutral-300 bg-white text-neutral-700 hover:bg-neutral-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-neutral-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-neutral-400 bg-white px-4 py-3 text-sm text-neutral-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                실무 분산 락: SET NX EX + Lua release. 99% 케이스 redis-py Lock 한 줄로 끝. 절대 동시성 금지면 DB 트랜잭션. 다음 Pub/Sub.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Lock', 'SETNX', 'NX EX', 'Lua', 'Redlock', 'Fencing'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-neutral-100 text-neutral-800 border border-neutral-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-neutral-700">
              <a href="../part3/III-2-2.html" className="underline hover:no-underline">← III-2-2 Replication</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 Pub/Sub vs Stream →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
