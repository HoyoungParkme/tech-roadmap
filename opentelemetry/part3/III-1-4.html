<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenTelemetry 학습 — III-1-4. Pipeline 구성과 fan-out</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔀</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    .otel-text-dark { color: var(--otel-dark); }

    .otel-hover:hover { background-color: var(--otel-dark); }
  </style>

<body>
  <div id="root"></div>

  <!--
    III-1-4. Pipeline 구성과 fan-out
    학습 목표: service.pipelines로 신호별 파이프라인을 조립하고, fan-out·connector로 데이터를 분기·연결한다
    핵심 비유: "분류 컨베이어" — 한 입구(receiver)에서 들어온 짐을 여러 발송대(exporter)로 동시에 나눠 보낸다
    패턴: fastapi 표준 — 좌(파이프라인 fan-out 애니메이션) / 우(VSCode YAML)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 5 STEPS — Pipeline 구성과 fan-out
    const STEPS = [
      {
        title: 'Step 1. service.pipelines — 신호별 독립 파이프라인',
        desc: 'receivers·processors·exporters는 부품일 뿐, 실제 데이터 흐름은 service.pipelines에서 신호(traces/metrics/logs)별로 조립해야 비로소 흐른다. 신호마다 파이프라인이 독립적이라 trace는 Tempo로, metric은 Prometheus로 서로 다른 백엔드에 보낼 수 있다. 왜 나눌까? 신호마다 데이터 양·보존 기간·백엔드가 다르기 때문에 한 파이프라인에 섞으면 라우팅도, 부하 격리도 불가능하다. 여기서 정의하지 않은 receiver나 exporter는 config에 적어놨어도 절대 동작하지 않는다.',
        focus: 'pipelines',
        code: {
          lang: 'yaml',
          filename: 'pipelines.yaml — 신호별 조립',
          lines: [
            '# service.pipelines — 부품을 신호별로 조립해야 흐른다',
            '',
            'service:',
            '  pipelines:',
            '',
            '    # ① Trace 파이프라인',
            '    traces:',
            '      receivers:  [otlp]',
            '      processors: [memory_limiter, batch]',
            '      exporters:  [otlp/tempo]        # trace 전용 백엔드',
            '',
            '    # ② Metric 파이프라인 — 다른 백엔드',
            '    metrics:',
            '      receivers:  [otlp]',
            '      processors: [memory_limiter, batch]',
            '      exporters:  [prometheus]        # metric 전용 백엔드',
            '',
            '    # ③ Log 파이프라인',
            '    logs:',
            '      receivers:  [otlp]',
            '      processors: [memory_limiter, batch]',
            '      exporters:  [loki]',
            '',
            '# 신호별로 완전히 독립 — 보존/부하/백엔드를 따로 관리',
            '# 여기 안 적힌 부품은 정의만 있고 절대 실행되지 않는다',
          ],
          highlight: [7, 13, 19],
        },
      },
      {
        title: 'Step 2. fan-out — 한 receiver에서 여러 exporter로',
        desc: '한 파이프라인의 exporters에 여러 개를 나열하면 같은 데이터가 모든 exporter로 동시에 복제 전송된다. 이것이 fan-out이다. 대표 예로 trace를 Jaeger(디버깅 UI)와 Tempo(장기 보존)에 동시에 보내거나, 마이그레이션 중 구·신 백엔드에 병행 전송한다. 왜 유용할까? 코드 한 줄 안 바꾸고 관측 백엔드를 추가·교체·병행할 수 있다. 단, exporter가 늘수록 CPU·메모리·네트워크 부하가 배로 늘어 sending_queue가 밀리면 전체가 느려진다.',
        focus: 'fanout',
        code: {
          lang: 'yaml',
          filename: 'fan-out.yaml — 다중 exporter',
          lines: [
            '# fan-out — exporters 리스트에 여러 개 = 동시 복제 전송',
            '',
            'exporters:',
            '  otlp/tempo:   { endpoint: tempo:4317, tls: { insecure: true } }',
            '  otlp/jaeger:  { endpoint: jaeger:4317, tls: { insecure: true } }',
            '  debug:        { verbosity: basic }',
            '',
            'service:',
            '  pipelines:',
            '    traces:',
            '      receivers:  [otlp]',
            '      processors: [memory_limiter, batch]',
            '      # ▼ 같은 span이 세 곳으로 동시 전송된다',
            '      exporters:  [otlp/tempo, otlp/jaeger, debug]',
            '',
            '# 활용: Jaeger(디버깅) + Tempo(장기보존) 병행',
            '#       마이그레이션 중 구·신 백엔드 동시 전송',
            '# 주의: exporter가 N개면 부하도 대략 N배 — 큐 크기 점검',
          ],
          highlight: [13, 14],
        },
      },
      {
        title: 'Step 3. connectors — 파이프라인 사이를 잇는 다리',
        desc: 'connector는 한 파이프라인의 exporter이면서 동시에 다른 파이프라인의 receiver인 특수 부품이다. 대표가 spanmetrics로, trace 파이프라인이 내보낸 span을 받아 요청 수·지연·에러율 metric으로 집계해 metric 파이프라인으로 넘긴다. 왜 쓸까? 애플리케이션이 metric을 따로 안 만들어도 trace만으로 RED 지표(Rate·Error·Duration)를 자동 생성할 수 있다. connectors 블록에 선언한 뒤 한쪽 파이프라인의 exporters와 다른 쪽의 receivers 양쪽에 같은 이름을 적어 다리를 놓는다.',
        focus: 'connector',
        code: {
          lang: 'yaml',
          filename: 'connector.yaml — trace를 metric으로',
          lines: [
            '# connector — 파이프라인 A의 exporter = 파이프라인 B의 receiver',
            '',
            'connectors:',
            '  spanmetrics:                    # span → RED metric 집계',
            '    histogram:',
            '      explicit: { buckets: [10ms, 100ms, 250ms, 1s] }',
            '    dimensions:',
            '      - name: http.method',
            '      - name: http.status_code',
            '',
            'service:',
            '  pipelines:',
            '    # 트레이스: 백엔드로도 보내고, connector로도 넘긴다',
            '    traces:',
            '      receivers:  [otlp]',
            '      processors: [batch]',
            '      exporters:  [otlp/tempo, spanmetrics]   # ← 다리 입구',
            '',
            '    # 메트릭: connector가 만든 metric을 받아 내보낸다',
            '    metrics:',
            '      receivers:  [spanmetrics]               # ← 다리 출구',
            '      processors: [batch]',
            '      exporters:  [prometheus]',
            '',
            '# trace만으로 요청수·지연·에러율(RED)을 자동 생성',
          ],
          highlight: [17, 21],
        },
      },
      {
        title: 'Step 4. 설정 검증 — validate로 배포 전에 잡는다',
        desc: 'Collector는 잘못된 파이프라인이라도 일단 뜨는 경우가 많아, 런타임에 조용히 데이터가 안 흐르는 사고가 잦다. otelcol validate로 배포 전에 config를 정적 검증하면 오타 난 부품 이름, 존재하지 않는 exporter 참조, 신호 타입 불일치(trace 파이프라인에 metric 전용 exporter)를 미리 잡는다. 가장 흔한 함정은 부품을 정의만 하고 파이프라인에 연결하지 않는 것으로, validate는 통과해도 데이터는 안 흐른다. CI에서 validate를 게이트로 걸어 오설정 배포를 원천 차단하는 것이 실무 표준이다.',
        focus: 'validate',
        code: {
          lang: 'yaml',
          filename: 'validate.sh — 배포 전 정적 검증',
          lines: [
            '# 배포 전 config 정적 검증 (CI 게이트로 사용)',
            '',
            'otelcol validate --config=./otel-collector.yaml',
            '',
            '# 잡아내는 대표 오류:',
            '#  - unknown exporters: [otlp/temp]   # 오타 (tempo 아님)',
            '#  - references to undefined component: filter',
            '#  - pipeline "metrics" cannot use exporter "otlp/tempo"',
            '#      of type traces                 # 신호 타입 불일치',
            '',
            '# ⚠️ validate가 못 잡는 함정: 정의만 하고 미연결',
            'processors:',
            '  filter/health: {}          # 정의는 했지만',
            'service:',
            '  pipelines:',
            '    traces:',
            '      receivers:  [otlp]',
            '      processors: [batch]    # filter/health 를 안 넣음!',
            '      exporters:  [otlp/tempo]',
            '# → 헬스체크 노이즈가 그대로 백엔드로 흘러간다',
            '',
            '# Docker: config 마운트 후 validate 서브커맨드 실행',
            '# docker run --rm -v $PWD:/etc otel/opentelemetry-collector \\',
            '#   validate --config=/etc/otel-collector.yaml',
          ],
          highlight: [12, 18],
        },
      },
      {
        title: 'Step 5. 실무 함정 — fan-out 부하·실패 처리·신호 혼동',
        desc: '파이프라인 운영의 3대 함정을 미리 막아야 한다. 첫째, fan-out으로 exporter를 늘리면 부하가 배로 늘어 큐가 밀리므로 sending_queue와 num_consumers를 넉넉히 잡는다. 둘째, exporter 한 곳이 죽으면 retry가 쌓여 backpressure가 receiver까지 전파되므로 retry_on_failure 상한과 큐 포화 시 drop 정책을 명확히 한다. 셋째, metric 파이프라인에 trace exporter를 넣는 식의 신호 혼동은 validate로 CI에서 차단한다. 관측 시스템 자신이 장애 지점이 되지 않게 격리하는 것이 핵심이다.',
        focus: 'pitfall',
        code: {
          lang: 'yaml',
          filename: 'production.yaml — 부하·실패 대비',
          lines: [
            '# fan-out 부하와 exporter 실패에 대비한 실전 설정',
            '',
            'exporters:',
            '  otlp/tempo:',
            '    endpoint: tempo:4317',
            '    sending_queue:',
            '      enabled: true',
            '      num_consumers: 10        # fan-out 시 넉넉히',
            '      queue_size: 10000        # 백엔드 지연 흡수 버퍼',
            '    retry_on_failure:',
            '      enabled: true',
            '      max_elapsed_time: 120s   # 무한 재시도 금지',
            '',
            'processors:',
            '  memory_limiter:',
            '    check_interval: 1s',
            '    limit_mib: 1024            # 큐 폭주 시 OOM 차단',
            '',
            'service:',
            '  telemetry:',
            '    metrics: { level: detailed }  # 큐 길이·drop 수 관측',
            '  pipelines:',
            '    traces:',
            '      receivers:  [otlp]',
            '      processors: [memory_limiter, batch]',
            '      exporters:  [otlp/tempo, otlp/jaeger]',
            '',
            '# 원칙: 관측 시스템이 스스로 장애 지점이 되지 않게 격리',
          ],
          highlight: [8, 9, 12, 17],
        },
      },
    ];

    // ─────────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 파이프라인 fan-out 시각화
    // ─────────────────────────────────────────────────────────
    function LiveDataPane({ step, stepIdx }) {
      const focus = step.focus;
      const animKey = `step-${stepIdx}`;

      // 신호별 라우팅 정의 (focus별로 강조 대상이 달라짐)
      const signals = [
        { sig: 'traces',  color: 'sky',     to: focus === 'fanout' ? ['Tempo', 'Jaeger', 'debug'] : ['Tempo'] },
        { sig: 'metrics', color: 'violet',  to: ['Prometheus'] },
        { sig: 'logs',    color: 'emerald', to: ['Loki'] },
      ];

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="otel-bg-light px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🔀</span>
              <span className="text-xs font-bold otel-text-dark">service.pipelines — 분류 컨베이어</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">otel-col · pipelines</span>
          </div>

          <div className="p-4 space-y-2 min-h-[460px]" key={animKey}>

            {/* 입구: OTLP receiver */}
            <div className="flex justify-center">
              <div className={`rounded-lg px-4 py-2 border-2 text-center transition-all duration-500 ${focus !== 'pitfall' ? 'otel-bg-light otel-border' : 'bg-white border-slate-300'}`}>
                <div className="text-xs font-bold otel-text-dark">📥 otlp receiver</div>
                <div className="text-[9px] text-slate-500 font-mono">:4317 / :4318</div>
              </div>
            </div>

            <ArrowDown active label="신호 분리" />

            {/* 신호별 파이프라인 3줄 */}
            <div className="space-y-2">
              {signals.map((s) => {
                const dim = focus === 'connector' && s.sig === 'logs';
                return (
                  <PipelineRow
                    key={s.sig}
                    sig={s.sig}
                    color={s.color}
                    to={s.to}
                    fanout={focus === 'fanout' && s.sig === 'traces'}
                    dimmed={dim}
                  />
                );
              })}
            </div>

            {/* connector 다리 (Step 3) */}
            {focus === 'connector' && (
              <div className="otel-bg-light border-2 otel-border rounded-lg p-3 fade-in mt-1">
                <div className="text-xs font-bold otel-text-dark mb-1.5">🌉 spanmetrics connector</div>
                <div className="flex items-center justify-center gap-2 text-[10px] font-mono">
                  <span className="px-2 py-1 rounded bg-sky-100 text-sky-700 border border-sky-300">traces</span>
                  <span className="text-slate-400">─ span 집계 →</span>
                  <span className="px-2 py-1 rounded bg-violet-100 text-violet-700 border border-violet-300">metrics</span>
                </div>
                <div className="text-[9px] text-slate-500 text-center mt-1.5">trace 한 줄로 RED 지표(Rate·Error·Duration) 자동 생성</div>
              </div>
            )}

            {/* validate 배너 (Step 4) */}
            {focus === 'validate' && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-lg p-3 fade-in mt-1">
                <div className="text-xs font-bold text-amber-800 mb-1.5">🛡️ otelcol validate</div>
                <div className="space-y-1 text-[10px] font-mono">
                  <div className="text-emerald-700">✓ 오타·미정의 참조·신호 타입 불일치 검출</div>
                  <div className="text-red-600">✗ 정의만 하고 미연결은 통과 → 데이터 안 흐름</div>
                </div>
              </div>
            )}

            {/* pitfall 배너 (Step 5) */}
            {focus === 'pitfall' && (
              <div className="bg-red-50 border-2 border-red-300 rounded-lg p-3 fade-in mt-1">
                <div className="text-xs font-bold text-red-700 mb-1.5">⚠️ 운영 3대 함정</div>
                <div className="space-y-1 text-[10px]">
                  <div className="flex gap-1.5"><span className="font-bold text-red-600">1</span><span className="text-slate-600">fan-out 부하 배증 → 큐·consumer 확대</span></div>
                  <div className="flex gap-1.5"><span className="font-bold text-red-600">2</span><span className="text-slate-600">exporter 실패 backpressure → retry 상한·drop</span></div>
                  <div className="flex gap-1.5"><span className="font-bold text-red-600">3</span><span className="text-slate-600">신호 혼동 → validate로 CI 차단</span></div>
                </div>
              </div>
            )}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">
              {focus === 'pipelines' && '신호별 독립 파이프라인 — trace/metric/log를 각자 백엔드로'}
              {focus === 'fanout'    && 'fan-out — 한 신호을 여러 exporter로 동시 복제 전송'}
              {focus === 'connector' && 'connector — 파이프라인 사이를 잇는 다리 (spanmetrics)'}
              {focus === 'validate'  && 'validate — 배포 전 정적 검증으로 오설정 차단'}
              {focus === 'pitfall'   && '운영 함정 — 부하·실패·신호 혼동을 미리 격리'}
            </div>
          </div>
        </div>
      );
    }

    // ── 신호별 파이프라인 한 줄
    function PipelineRow({ sig, color, to, fanout, dimmed }) {
      const tagCls = {
        sky:     'bg-sky-100 text-sky-700 border-sky-300',
        violet:  'bg-violet-100 text-violet-700 border-violet-300',
        emerald: 'bg-emerald-100 text-emerald-700 border-emerald-300',
      }[color];
      const dotCls = {
        sky: 'bg-sky-400', violet: 'bg-violet-400', emerald: 'bg-emerald-400',
      }[color];

      return (
        <div className={`rounded-lg border p-2.5 transition-all duration-500 fade-in ${dimmed ? 'opacity-40 border-slate-200 bg-slate-50' : fanout ? `border-2 ${tagCls}` : 'border-slate-200 bg-white'}`}>
          <div className="flex items-center gap-2">
            <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded border ${tagCls}`}>{sig}</span>
            <span className="text-[10px] text-slate-400 font-mono">[batch]</span>
            <span className="text-slate-400 text-sm">→</span>
            <div className="flex flex-wrap gap-1.5 items-center">
              {to.map((t) => (
                <span key={t} className="flex items-center gap-1 text-[10px] font-mono bg-slate-100 text-slate-700 border border-slate-300 rounded px-1.5 py-0.5">
                  <span className={`w-1.5 h-1.5 rounded-full ${dotCls}`}></span>{t}
                </span>
              ))}
            </div>
            {fanout && <span className="ml-auto text-[9px] otel-bg text-white px-2 py-0.5 rounded-full font-bold">FAN-OUT</span>}
          </div>
        </div>
      );
    }

    function ArrowDown({ active, label }) {
      return (
        <div className="flex flex-col items-center -my-0.5">
          <div className={`text-2xl leading-none transition-all duration-500 ${active ? 'otel-text' : 'text-slate-300'}`}>
            ↓
          </div>
          {label && (
            <div className={`text-[9px] font-mono transition-colors ${active ? 'otel-text-dark font-bold' : 'text-slate-400'}`}>
              {label}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[30rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { animation: fadeIn 360ms ease-out; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="otel-text hover:otel-text-dark font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-4</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 otel-bg text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. Collector &amp; Processor &gt; Chapter 1. Pipeline</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Pipeline 구성과 fan-out</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                receiver·processor·exporter를 연결하는 파이프라인 — <strong>신호별 독립 조립</strong>과 <strong>fan-out</strong>으로 데이터를 분기한다.
                <code className="bg-slate-100 px-1 rounded text-xs ml-1">service.pipelines</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">fan-out</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">connectors</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">validate</code>
              </p>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl otel-bg-dark text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl otel-bg-light border-2 otel-border otel-text-dark text-sm">
                💡 Part III 마무리 — 다음(IV-1-1)부터는 <strong>백엔드 &amp; 시각화</strong>로 넘어가 수집한 텔레메트리를 저장·조회한다.
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0} aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay} aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold otel-bg text-white otel-hover transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 진행바 */}
            <div className="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
              <div className="otel-bg h-full rounded-full transition-all duration-500" style={{ width: `${((stepIdx + 1) / STEPS.length) * 100}%` }}></div>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브로</a>
              <a href="../part4/IV-1-1.html" className="otel-text hover:otel-text-dark font-medium">IV-1-1 백엔드 &amp; 시각화 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
