<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenTelemetry 인터랙티브 학습</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔭</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
    :root {
      --otel:        #4F62AD;
      --otel-dark:   #3D4E8C;
      --otel-light:  #EAEDF7;
      --otel-mid:    #6E80C4;
      --otel-pale:   #D6DCEE;
    }
    .bg-otel      { background-color: var(--otel); }
    .bg-otel-dark { background-color: var(--otel-dark); }
    .bg-otel-light{ background-color: var(--otel-light); }
    .bg-otel-mid  { background-color: var(--otel-mid); }
    .bg-otel-pale { background-color: var(--otel-pale); }
    .text-otel    { color: var(--otel); }
    .text-otel-dark{color: var(--otel-dark); }
    .border-otel  { border-color: var(--otel); }
    .hover-bg-otel-light:hover { background-color: var(--otel-light); }
  </style>
</head>
<body>
  <div id="root"></div>
  <!--
    OpenTelemetry 인터랙티브 학습 — 사이드바 + iframe (observability/k8s 표준 패턴)
    역할: 5 Parts × 4 sections = 20 sections, Phase A 시점 8개 ready / 20 planned
    색상: #4F62AD (OTel 보라-블루) 단일 톤
  -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SECTIONS = [
      {
        part: 'I',
        label: 'Part I. OTel 기초',
        shade: 'bg-otel-dark',
        items: [
          { id: 'I-1-1', title: 'Trace란 무엇인가',                    file: './part1/I-1-1.html' },
          { id: 'I-1-2', title: 'Span 구조와 부모-자식 트리',          file: './part1/I-1-2.html' },
          { id: 'I-1-3', title: 'Context 전파 (Propagation)',          file: './part1/I-1-3.html' },
          { id: 'I-1-4', title: '3 Signals: Trace · Metric · Log',     file: './part1/I-1-4.html' },
        ],
      },
      {
        part: 'II',
        label: 'Part II. SDK & 계측',
        shade: 'bg-otel',
        items: [
          { id: 'II-1-1', title: 'Auto vs Manual Instrumentation',     file: './part2/II-1-1.html' },
          { id: 'II-1-2', title: 'SDK 구조 (Provider/Processor/Exporter)', file: './part2/II-1-2.html' },
          { id: 'II-1-3', title: '언어별 라이브러리 (Python/JS/Java)', file: './part2/II-1-3.html' },
          { id: 'II-1-4', title: 'Resource Attribute (서비스 정체성)', file: './part2/II-1-4.html' },
        ],
      },
      {
        part: 'III',
        label: 'Part III. Collector & Processor',
        shade: 'bg-otel-mid',
        items: [
          { id: 'III-1-1', title: 'Collector 개론 (gateway vs agent)', file: './part3/III-1-1.html' },
          { id: 'III-1-2', title: 'Receiver — OTLP / Prometheus / Fluent', file: './part3/III-1-2.html' },
          { id: 'III-1-3', title: 'Processor — batch / sample / filter', file: './part3/III-1-3.html' },
          { id: 'III-1-4', title: 'Pipeline 구성과 fan-out', file: './part3/III-1-4.html' },
        ],
      },
      {
        part: 'IV',
        label: 'Part IV. Exporter & Backend',
        shade: 'bg-otel-mid',
        items: [
          { id: 'IV-1-1', title: 'OTLP — gRPC / HTTP 전송', file: './part4/IV-1-1.html' },
          { id: 'IV-1-2', title: 'Jaeger — Trace 백엔드', file: './part4/IV-1-2.html' },
          { id: 'IV-1-3', title: 'Prometheus — Metric 백엔드', file: './part4/IV-1-3.html' },
          { id: 'IV-1-4', title: 'Loki — Log 백엔드 (Grafana 스택)', file: './part4/IV-1-4.html' },
        ],
      },
      {
        part: 'V',
        label: 'Part V. 실전 운영',
        shade: 'bg-otel-pale',
        items: [
          { id: 'V-1-1', title: '분산 추적 디버깅 워크플로우', file: './part5/V-1-1.html' },
          { id: 'V-1-2', title: '샘플링 전략 (head vs tail)', file: './part5/V-1-2.html' },
          { id: 'V-1-3', title: '운영 체크리스트 (overhead/cost)', file: './part5/V-1-3.html' },
          { id: 'V-1-4', title: '통합 패턴 — k8s · Mesh · FastAPI', file: './part5/V-1-4.html' },
        ],
      },
    ];

    const TOTAL = SECTIONS.reduce((s, sec) => s + sec.items.length, 0);
    const READY = SECTIONS.reduce((s, sec) => s + sec.items.filter(i => i.file).length, 0);

    function findItemById(id) {
      for (const section of SECTIONS) {
        const found = section.items.find(item => item.id === id);
        if (found) return { ...found, part: section.part };
      }
      return null;
    }

    function GiscusPanel({ term }) {
      const [open, setOpen] = React.useState(false);
      const [width, setWidth] = React.useState(() => Math.min(480, Math.round(window.innerWidth * 0.9)));
      const bodyRef = React.useRef(null);
      const loadedRef = React.useRef(false);

      React.useEffect(() => {
        if (!open || loadedRef.current || !bodyRef.current) return;
        const s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-repo', 'HoyoungParkme/tech-roadmap');
        s.setAttribute('data-repo-id', 'R_kgDOSIZCtg');
        s.setAttribute('data-category', 'General');
        s.setAttribute('data-category-id', 'DIC_kwDOSIZCts4C7lgx');
        s.setAttribute('data-mapping', 'specific');
        s.setAttribute('data-term', term);
        s.setAttribute('data-strict', '0');
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'bottom');
        s.setAttribute('data-theme', 'light');
        s.setAttribute('data-lang', 'ko');
        bodyRef.current.appendChild(s);
        loadedRef.current = true;
      }, [open, term]);

      const onResizeStart = (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = width;
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:ew-resize;';
        document.body.appendChild(overlay);
        const onMove = (ev) => {
          const newW = Math.max(320, Math.min(window.innerWidth * 0.9, startW + (startX - ev.clientX)));
          setWidth(newW);
        };
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          overlay.remove();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      };

      const buttonRight = open ? Math.min(width, window.innerWidth - 40) + 'px' : 0;

      return (
        <React.Fragment>
          <button
            onClick={() => setOpen(o => !o)}
            aria-expanded={open}
            aria-label={open ? '댓글 패널 닫기' : '댓글 패널 열기'}
            style={{ position: 'fixed', top: '40%', right: buttonRight, zIndex: 51, writingMode: 'vertical-rl', transition: 'right 0.25s ease' }}
            className="bg-slate-800 text-white px-2 py-3 rounded-l-lg text-sm font-medium shadow-md hover:bg-slate-700"
          >
            💬 {open ? '닫기' : '댓글'}
          </button>
          <div
            role="complementary"
            aria-label="댓글 패널"
            style={{ position: 'fixed', top: 0, right: 0, height: '100vh', width: width + 'px', transform: open ? 'translateX(0)' : 'translateX(100%)', transition: 'transform 0.25s ease', zIndex: 50, background: '#fff', boxShadow: '-4px 0 12px rgba(0,0,0,0.08)' }}
          >
            <div onMouseDown={onResizeStart} style={{ position: 'absolute', left: '-4px', top: 0, width: '8px', height: '100%', cursor: 'ew-resize', zIndex: 52 }} aria-hidden="true" />
            <div className="border-b border-slate-200 px-4 py-3 flex items-center justify-between">
              <span className="font-bold text-slate-800">💬 댓글 / 질문</span>
              <button onClick={() => setOpen(false)} aria-label="댓글 패널 닫기" className="text-slate-500 hover:text-slate-800 px-2">✕</button>
            </div>
            <div ref={bodyRef} className="p-4 overflow-y-auto" style={{ height: 'calc(100vh - 56px)' }} />
          </div>
        </React.Fragment>
      );
    }

    function App() {
      const [activeId, setActiveId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [expandedParts, setExpandedParts] = useState({ I: true, II: true, III: true, IV: true, V: true });

      const activeItem = activeId ? findItemById(activeId) : null;

      const navigate = useCallback((id, file) => {
        if (!file) return;
        setActiveId(id);
        window.location.hash = id;
        if (window.innerWidth < 1024) setSidebarOpen(false);
      }, []);

      useEffect(() => {
        const hash = window.location.hash.slice(1);
        if (hash) {
          const it = findItemById(hash);
          if (it && it.file) setActiveId(hash);
        }
        const onHash = () => {
          const h = window.location.hash.slice(1);
          const it = findItemById(h);
          if (it && it.file) setActiveId(h);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const togglePart = (part) => {
        setExpandedParts(prev => ({ ...prev, [part]: !prev[part] }));
      };

      return (
        <React.Fragment>
        <div className="h-full flex bg-slate-100">
          {sidebarOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-30 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />
          )}
          <aside className={`fixed lg:static z-40 h-full w-72 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0 lg:w-72'}`}>
            <div className="p-4 border-b border-slate-200 shrink-0">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-otel text-white flex items-center justify-center rounded-lg font-bold text-sm">OT</div>
                <div>
                  <div className="font-bold text-slate-800 text-sm">OpenTelemetry 학습</div>
                  <div className="text-[11px] text-slate-500">{READY}/{TOTAL} 시각화 (Part I+II ready)</div>
                </div>
              </div>
            </div>
            <nav className="flex-1 overflow-y-auto p-2">
              {SECTIONS.map((section) => (
                <div key={section.part} className="mb-1">
                  <button
                    onClick={() => togglePart(section.part)}
                    className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left hover:bg-slate-50 transition"
                  >
                    <span className={`w-5 h-5 rounded text-white text-[10px] flex items-center justify-center font-bold ${section.shade}`}>
                      {section.part}
                    </span>
                    <span className="text-xs font-bold text-slate-700 flex-1 truncate">{section.label}</span>
                    <span className="text-[10px] text-slate-400">{section.items.filter(i => i.file).length}/{section.items.length}</span>
                    <span className={`text-slate-400 text-xs transition-transform ${expandedParts[section.part] ? 'rotate-90' : ''}`}>&#9654;</span>
                  </button>
                  {expandedParts[section.part] && (
                    <div className="ml-4 border-l border-slate-100 pl-2 space-y-0.5">
                      {section.items.map((item) => {
                        const isActive = activeId === item.id;
                        const isPlanned = !item.file;
                        return (
                          <button
                            key={item.id}
                            onClick={() => navigate(item.id, item.file)}
                            disabled={isPlanned}
                            className={`w-full text-left px-2 py-1.5 rounded-md text-xs transition-all truncate ${
                              isActive ? 'bg-otel-light text-otel-dark font-bold' : `text-slate-600 ${isPlanned ? 'opacity-40 cursor-not-allowed' : 'hover-bg-otel-light'}`
                            }`}
                          >
                            <span className="font-mono text-[10px] opacity-60 mr-1">{item.id}</span>
                            {item.title}
                            {isPlanned && <span className="ml-1 text-[9px] text-slate-400">(예정)</span>}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              ))}
            </nav>
            <div className="p-3 border-t border-slate-200 shrink-0 text-[10px] text-slate-400 text-center">
              React + Tailwind + Babel CDN
            </div>
          </aside>
          <main className="flex-1 flex flex-col min-w-0">
            <div className="h-12 bg-white border-b border-slate-200 flex items-center px-4 shrink-0 gap-3">
              <button
                onClick={() => setSidebarOpen(prev => !prev)}
                className="lg:hidden p-1.5 rounded-md hover:bg-slate-100 text-slate-600"
                aria-label="사이드바 토글"
              >
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M3 5h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2z" />
                </svg>
              </button>
              {activeItem ? (
                <div className="flex items-center gap-2 min-w-0">
                  <span className={`w-5 h-5 rounded text-white text-[10px] flex items-center justify-center font-bold shrink-0 ${
                    SECTIONS.find(s => s.part === activeItem.part)?.shade || 'bg-slate-600'
                  }`}>{activeItem.part}</span>
                  <span className="font-mono text-xs text-slate-500 shrink-0">{activeItem.id}</span>
                  <span className="text-sm font-bold text-slate-800 truncate">{activeItem.title}</span>
                </div>
              ) : (
                <span className="text-sm text-slate-500">시각화를 선택하세요</span>
              )}
            </div>
            {activeItem ? (
              <iframe
                key={activeItem.id}
                src={activeItem.file}
                className="flex-1 w-full border-0"
                title={activeItem.title}
              />
            ) : (
              <div className="flex-1 flex items-center justify-center p-8">
                <div className="text-center max-w-md">
                  <div className="w-16 h-16 bg-otel-light text-otel-dark rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl font-bold">OT</div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-3">OpenTelemetry 인터랙티브 학습</h2>
                  <p className="text-slate-600 mb-6 leading-relaxed">
                    벤더 락인 없는 관측 표준 — <strong>Trace · Metric · Log</strong> 세 신호를 하나의 SDK와 하나의 프로토콜(OTLP)로 묶어, 어떤 백엔드(Jaeger·Tempo·Prometheus·Datadog)에도 꽂을 수 있게 한다.
                  </p>
                  <div className="grid grid-cols-5 gap-2 mb-6">
                    {SECTIONS.map(s => (
                      <div key={s.part} className="text-center">
                        <div className={`w-8 h-8 rounded-lg text-white text-xs flex items-center justify-center font-bold mx-auto mb-1 ${s.shade}`}>{s.part}</div>
                        <div className="text-[10px] text-slate-500">{s.items.filter(i => i.file).length}/{s.items.length}</div>
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-slate-400">{READY}/{TOTAL} 시각화 ready · Part I+II 완성</p>
                </div>
              </div>
            )}
          </main>
        </div>
        <GiscusPanel term="opentelemetry" />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
