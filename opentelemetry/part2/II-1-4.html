<body>
  <div id="root"></div>

  <!--
    II-1-4. Resource Attribute — 서비스 정체성
    학습 목표: 텔레메트리가 "어디서 왔는지"를 식별하는 Resource 속성을 이해하고,
    모든 span/metric/log에 일관되게 붙여 백엔드에서 서비스별로 필터·집계·서비스맵을 그린다.
    핵심 비유: "택배 송장" — 물건(텔레메트리)에 보낸 사람(service.name/version/env)이 찍혀 있어야 분류가 된다.
    패턴: fastapi 표준 — 좌(LiveDataPane: Resource 첨부 시각화) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 문제 — 정체 불명의 텔레메트리',
        desc: 'span·metric·log 를 아무리 잘 계측해도, 그것이 "어느 서비스·어느 버전·어느 환경"에서 왔는지 표시가 없으면 백엔드에서는 익명 데이터 더미일 뿐이다. 여러 서비스가 한 Collector 로 데이터를 보내는 순간, p99 지연이 튀어도 어느 서비스 탓인지 특정할 수 없다. staging 과 production 이 섞여 잘못된 알림이 울린다. 정체성(identity)이 없으면 관측성은 검색 불가능한 로그 바다가 된다. 그래서 모든 텔레메트리에는 발신자 정보가 필요하다.',
        focus: 'problem',
        code: {
          lang: 'bash',
          filename: 'no_resource.txt — 정체성 없는 텔레메트리 (문제 상황)',
          lines: [
            '# Collector 에 도착한 span 들 — 발신자 정보가 없다',
            '',
            'span  name=GET /orders     duration=812ms   status=ERROR',
            'span  name=charge          duration=143ms   status=OK',
            'span  name=GET /orders     duration=790ms   status=ERROR',
            'metric  http.server.duration  p99=812ms',
            '',
            '# ❓ 풀 수 없는 질문',
            '#  - 이 812ms 는 order-service 인가 payment-service 인가?',
            '#  - v2.3.1 배포 후 느려진 건가? 어느 버전이지?',
            '#  - 이 ERROR 는 production 인가 staging 인가?',
            '#  - k8s 어느 pod 에서 터졌나?',
            '',
            '# 계측은 완벽한데 "누가 보냈는지"가 없어서 아무것도 특정 못 한다.',
            '# → 대시보드 필터 불가, 서비스맵 불가, 서비스별 집계 불가',
            '# → 필요한 것: 모든 텔레메트리에 붙는 발신자 표식 = Resource',
          ],
          highlight: [3, 4, 5, 8, 9, 10, 11, 12],
        },
      },
      {
        title: 'Step 2. Resource — 텔레메트리 생성 주체의 신원',
        desc: 'Resource 는 텔레메트리를 생성한 "주체(entity)"를 설명하는 속성(attribute) 집합이다. 대표 키는 service.name(필수), service.version, deployment.environment 이며 host·process·k8s.pod 같은 인프라 속성도 담는다. span 마다 붙는 일반 attribute 와 달리, Resource 는 프로세스 수명 동안 고정되어 그 프로세스가 내보내는 모든 span·metric·log 에 동일하게 첨부된다. 즉 "이 데이터는 어디서 왔는가"의 답이다. service.name 은 백엔드가 서비스를 구분하는 1차 키이므로 절대 누락하면 안 된다.',
        focus: 'identity',
        code: {
          lang: 'python',
          filename: 'resource.py — Resource 생성',
          lines: [
            '# pip install opentelemetry-sdk opentelemetry-semantic-conventions',
            'from opentelemetry.sdk.resources import Resource',
            'from opentelemetry.semconv.resource import ResourceAttributes',
            '',
            '# 서비스 정체성 = 이 프로세스가 내보내는 모든 텔레메트리에 붙는 표식',
            'resource = Resource.create({',
            '    ResourceAttributes.SERVICE_NAME: "order-service",        # 필수 — 서비스 구분 1차 키',
            '    ResourceAttributes.SERVICE_VERSION: "2.3.1",             # 배포 버전 비교용',
            '    ResourceAttributes.DEPLOYMENT_ENVIRONMENT: "production", # prod/staging 분리',
            '    ResourceAttributes.SERVICE_NAMESPACE: "checkout",        # 팀/도메인 그룹',
            '    ResourceAttributes.SERVICE_INSTANCE_ID: "order-7f9c-01", # 인스턴스 식별',
            '})',
            '',
            '# 문자열 상수를 직접 써도 되지만, ResourceAttributes 상수를 쓰면',
            '# 오타(servcie.name)로 인한 컨벤션 불일치를 컴파일 타임에 막는다.',
            'print(resource.attributes)',
            '# → {\'service.name\': \'order-service\', \'service.version\': \'2.3.1\', ...}',
          ],
          highlight: [6, 7, 8, 9],
        },
      },
      {
        title: 'Step 3. 첨부 — 모든 span·metric·log 에 자동으로',
        desc: 'Resource 는 개별 span 에 손으로 붙이는 게 아니라, TracerProvider·MeterProvider·LoggerProvider 를 만들 때 한 번 주입한다. 그러면 그 Provider 가 만드는 모든 텔레메트리에 SDK 가 Resource 를 자동으로 첨부해 Collector 로 내보낸다. 코드 어디서도 service.name 을 반복해 적지 않는다 — 정체성은 프로세스 시작 시 한 곳에서만 정의된다. 이 일관성 덕분에 서로 다른 신호(trace·metric·log)를 같은 service.name 으로 상호 연결(correlation)할 수 있다.',
        focus: 'attach',
        code: {
          lang: 'python',
          filename: 'bootstrap.py — Provider 에 Resource 주입',
          lines: [
            'from opentelemetry import trace, metrics',
            'from opentelemetry.sdk.trace import TracerProvider',
            'from opentelemetry.sdk.metrics import MeterProvider',
            'from opentelemetry.sdk.trace.export import BatchSpanProcessor',
            'from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter',
            'from resource import resource  # Step 2 에서 만든 Resource',
            '',
            '# 딱 한 번 — Provider 생성 시 Resource 주입',
            'tracer_provider = TracerProvider(resource=resource)',
            'tracer_provider.add_span_processor(BatchSpanProcessor(OTLPSpanExporter()))',
            'trace.set_tracer_provider(tracer_provider)',
            '',
            'meter_provider = MeterProvider(resource=resource)  # metric 도 같은 정체성',
            'metrics.set_meter_provider(meter_provider)',
            '',
            '# 이후 코드 어디서도 service.name 을 반복하지 않는다',
            'tracer = trace.get_tracer(__name__)',
            'with tracer.start_as_current_span("charge"):',
            '    pass  # 이 span 에 service.name=order-service 가 자동 첨부됨',
            '',
            '# → trace / metric / log 가 같은 Resource 를 공유 = 신호 간 상관관계 성립',
          ],
          highlight: [8, 9, 12, 18, 19],
        },
      },
      {
        title: 'Step 4. 자동 감지 — 디텍터 & 환경변수',
        desc: '정체성을 코드에 하드코딩하면 환경마다 다시 빌드해야 한다. 실무에서는 Resource Detector 가 실행 환경(호스트·프로세스·k8s·클라우드 메타데이터)을 자동으로 읽어 채운다. 배포 정보(버전·환경)는 코드를 건드리지 않고 OTEL_RESOURCE_ATTRIBUTES 환경변수로 주입한다 — 같은 이미지를 staging/production 에 그대로 올리고 값만 바꾼다. 감지된 속성과 환경변수·수동 지정은 병합되며, 명시적으로 준 값이 우선한다. 이것이 12-factor 스타일의 설정 분리다.',
        focus: 'detect',
        code: {
          lang: 'bash',
          filename: 'deploy.sh — 환경변수로 정체성 주입',
          lines: [
            '# 코드는 그대로, 배포 환경마다 값만 바꾼다 (재빌드 없음)',
            'export OTEL_SERVICE_NAME="order-service"',
            'export OTEL_RESOURCE_ATTRIBUTES="service.version=2.3.1,deployment.environment=production"',
            '',
            '# k8s 라면 Downward API 로 pod 메타데이터를 그대로 주입',
            '#   value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NS)"',
            '',
            '# 자동 감지 디텍터 활성화 — host/process/k8s/cloud 메타데이터를 읽어 채움',
            'export OTEL_EXPERIMENTAL_RESOURCE_DETECTORS="host,process,os,otel"',
            '',
            'python -m opentelemetry.instrumentation.auto_instrumentation \\',
            '    python app.py',
            '',
            '# 병합 우선순위: 수동 지정 > OTEL_RESOURCE_ATTRIBUTES > 디텍터 감지값',
            '# → 같은 컨테이너 이미지를 staging/prod 에 올리고 env 만 교체',
            '#   deployment.environment=staging  으로 바꾸면 끝',
          ],
          highlight: [2, 3, 9, 14],
        },
      },
      {
        title: 'Step 5. 왜 중요한가 — 필터·서비스맵·집계 & 함정',
        desc: '백엔드(Jaeger·Tempo·Prometheus·Grafana)는 Resource 속성을 1급 차원(dimension)으로 쓴다. deployment.environment=production 으로 대시보드를 필터하고, service.name 으로 서비스맵의 노드를 그리며, service.version 별로 에러율을 집계해 카나리 배포를 판정한다. 함정도 여기서 갈린다 — service.name 누락이면 unknown_service 로 뭉뚱그려지고, 팀마다 이름이 다르면(order vs order-svc) 서비스맵이 쪼개진다. user.id 같은 고카디널리티 값을 Resource 에 넣으면 메트릭 시계열이 폭발한다. 정체성은 낮은 카디널리티로 일관되게 유지해야 한다.',
        focus: 'backend',
        code: {
          lang: 'bash',
          filename: 'backend_queries.txt — 정체성이 만드는 관측성',
          lines: [
            '# 1) 대시보드 필터 — 환경/버전으로 좁히기',
            'histogram_quantile(0.99,',
            '  rate(http_server_duration_bucket{',
            '    service_name="order-service", deployment_environment="production"',
            '  }[5m]))',
            '',
            '# 2) 서비스맵 — service.name 이 노드가 된다',
            '#   gateway → order-service → payment-service',
            '#   (Resource 의 service.name 으로 그래프의 점을 잇는다)',
            '',
            '# 3) 버전별 집계 — 카나리 배포 판정',
            'sum by (service_version) (rate(errors_total{service_name="order-service"}[5m]))',
            '#   v2.3.0: 0.1%   v2.3.1: 4.2%  ← 새 버전이 문제, 롤백 결정',
            '',
            '# ⚠️ 실무 함정',
            '#  - service.name 누락 → 백엔드에서 "unknown_service" 로 뭉침',
            '#  - 팀마다 다른 이름(order / order-svc) → 서비스맵 분열',
            '#  - user.id 등 고카디널리티를 Resource 에 → 시계열 폭발 = 비용/성능 붕괴',
            '#  - 컨벤션 불일치(env vs environment) → 필터가 안 걸린다',
          ],
          highlight: [3, 4, 12, 13, 16, 17, 18],
        },
      },
    ];

    function LiveDataPane({ step, stepIdx }) {
      const focus = step.focus;
      const animKey = `step-${stepIdx}`;

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🪪</span>
              <span className="text-xs font-bold text-slate-700">Resource — 텔레메트리 송장</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">Semantic Conventions · service.*</span>
          </div>

          <div className="p-4 min-h-[460px]" key={animKey}>
            {focus === 'problem'  && <ProblemView />}
            {focus === 'identity' && <IdentityView />}
            {focus === 'attach'   && <AttachView />}
            {focus === 'detect'   && <DetectView />}
            {focus === 'backend'  && <BackendView />}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">
              {focus === 'problem'  && '발신자 표식이 없으면 텔레메트리는 검색 불가능한 익명 더미'}
              {focus === 'identity' && 'service.name·version·environment — 프로세스 고정 정체성'}
              {focus === 'attach'   && 'Provider 에 한 번 주입 → 모든 span·metric·log 에 자동 첨부'}
              {focus === 'detect'   && '디텍터·환경변수로 코드 수정 없이 환경별 정체성 주입'}
              {focus === 'backend'  && 'Resource 로 필터·서비스맵·버전 집계 — 저카디널리티 유지'}
            </div>
          </div>
        </div>
      );
    }

    // Step 1: 정체성 없는 텔레메트리
    function ProblemView() {
      const items = [
        { icon: '🔗', label: 'span',   detail: 'GET /orders  812ms  ERROR' },
        { icon: '🔗', label: 'span',   detail: 'charge  143ms  OK' },
        { icon: '📊', label: 'metric', detail: 'http.duration  p99=812ms' },
        { icon: '📝', label: 'log',    detail: 'timeout while charging' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-2">Collector 도착 — 계측은 완벽하지만 발신자 표식이 없다</div>
          <div className="space-y-1.5">
            {items.map((it, i) => (
              <div key={i} className="flex items-center gap-2 rounded border border-slate-300 bg-slate-100 px-3 py-2">
                <span className="text-base">{it.icon}</span>
                <span className="text-[11px] font-bold w-16 shrink-0 text-slate-700">{it.label}</span>
                <span className="text-[10px] font-mono truncate flex-1 text-slate-700">{it.detail}</span>
                <span className="text-[9px] text-red-500 font-mono font-bold">from=?</span>
              </div>
            ))}
          </div>
          <div className="mt-4 p-3 rounded-lg bg-amber-50 border border-amber-300">
            <div className="text-[11px] text-amber-800 font-bold mb-1">❓ 특정 불가능한 질문</div>
            <ul className="text-[10px] text-amber-700 space-y-0.5 list-disc list-inside">
              <li>812ms 는 order-service 인가 payment-service 인가?</li>
              <li>이 ERROR 는 production 인가 staging 인가?</li>
              <li>어느 버전(v2.3.1?) 배포 후 느려졌나?</li>
            </ul>
          </div>
        </div>
      );
    }

    // Step 2: Resource 속성 = 정체성 카드
    function IdentityView() {
      const attrs = [
        { key: 'service.name',            val: 'order-service', req: true,  note: '필수 · 서비스 구분 1차 키' },
        { key: 'service.version',         val: '2.3.1',         req: false, note: '배포 버전 비교' },
        { key: 'deployment.environment',  val: 'production',    req: false, note: 'prod / staging 분리' },
        { key: 'service.namespace',       val: 'checkout',      req: false, note: '팀 · 도메인 그룹' },
        { key: 'service.instance.id',     val: 'order-7f9c-01', req: false, note: '인스턴스 식별' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-2">Resource = 프로세스 수명 동안 고정된 신원 카드</div>
          <div className="rounded-lg border-2 p-3" style={{ borderColor: 'var(--otel)', background: 'var(--otel-light)' }}>
            <div className="text-[10px] font-bold mb-2 text-otel-dark">🪪 Resource (semantic conventions 표준 키)</div>
            <div className="space-y-1.5">
              {attrs.map((a) => (
                <div key={a.key} className="flex items-center gap-2 bg-white rounded border border-otel px-2 py-1.5" style={{ borderColor: 'var(--otel)' }}>
                  <span className="font-mono text-[10px] font-bold w-44 shrink-0 text-otel-dark">{a.key}</span>
                  <span className="font-mono text-[10px] text-slate-700 w-28 shrink-0 truncate">{a.val}</span>
                  {a.req
                    ? <span className="text-[8px] font-bold text-white bg-red-500 rounded px-1 shrink-0">필수</span>
                    : <span className="text-[8px] text-slate-400 shrink-0">권장</span>}
                  <span className="text-[9px] text-slate-500 truncate flex-1 text-right">{a.note}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="mt-3 p-2 rounded-lg bg-otel-light border border-otel" style={{ background: 'var(--otel-light)', borderColor: 'var(--otel)' }}>
            <div className="text-[10px] text-otel-dark">💡 표준 키를 쓰면 어떤 백엔드로 바꿔도 필터·서비스맵이 그대로 동작한다</div>
          </div>
        </div>
      );
    }

    // Step 3: Provider 에 주입 → 모든 신호에 첨부
    function AttachView() {
      const signals = [
        { icon: '🔗', name: 'trace',  provider: 'TracerProvider' },
        { icon: '📊', name: 'metric', provider: 'MeterProvider' },
        { icon: '📝', name: 'log',    provider: 'LoggerProvider' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-3">한 번 주입 → 모든 신호에 같은 Resource 자동 첨부</div>
          <div className="flex flex-col items-center">
            <div className="rounded-lg border-2 px-4 py-2 text-center shadow-otel" style={{ borderColor: 'var(--otel)', background: 'var(--otel-light)' }}>
              <div className="text-[10px] text-slate-500">Resource</div>
              <div className="font-mono text-[11px] font-bold text-otel-dark">service.name=order-service</div>
              <div className="font-mono text-[9px] text-slate-500">version=2.3.1 · env=production</div>
            </div>
            <div className="text-lg text-otel leading-none my-1">↓</div>
            <div className="grid grid-cols-3 gap-2 w-full">
              {signals.map((s) => (
                <div key={s.name} className="text-center bg-white border-2 rounded-lg px-1 py-2" style={{ borderColor: 'var(--otel)' }}>
                  <div className="text-2xl">{s.icon}</div>
                  <div className="text-[11px] font-bold text-otel-dark">{s.name}</div>
                  <div className="text-[8px] text-slate-500 font-mono">{s.provider}</div>
                  <div className="mt-1 text-[8px] font-mono rounded px-1 py-0.5" style={{ background: 'var(--otel-pale)', color: 'var(--otel-dark)' }}>+ Resource</div>
                </div>
              ))}
            </div>
          </div>
          <div className="mt-4 p-3 rounded-lg bg-emerald-50 border border-emerald-300">
            <div className="text-[11px] text-emerald-800 font-bold">✅ 같은 Resource 공유 → trace · metric · log 상호 연결(correlation)</div>
            <div className="text-[10px] text-emerald-700 mt-0.5">코드 어디서도 service.name 을 반복하지 않는다</div>
          </div>
        </div>
      );
    }

    // Step 4: 자동 감지 & 환경변수
    function DetectView() {
      const sources = [
        { icon: '🖥️', name: 'host detector',    out: 'host.name · host.arch',        kind: 'auto' },
        { icon: '⚙️', name: 'process detector', out: 'process.pid · runtime',        kind: 'auto' },
        { icon: '☸️', name: 'k8s (Downward)',   out: 'k8s.pod.name · k8s.namespace', kind: 'auto' },
        { icon: '🔧', name: 'OTEL_RESOURCE_ATTRIBUTES', out: 'version=2.3.1 · env=production', kind: 'env' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-2">환경이 스스로 정체성을 채운다 — 코드 수정 없음</div>
          <div className="space-y-1.5">
            {sources.map((s) => (
              <div key={s.name} className={`flex items-center gap-2 rounded border px-3 py-2 ${s.kind === 'env' ? 'bg-amber-50 border-amber-300' : 'bg-otel-light border-otel'}`}
                   style={s.kind === 'env' ? {} : { background: 'var(--otel-light)', borderColor: 'var(--otel)' }}>
                <span className="text-base">{s.icon}</span>
                <span className="text-[10px] font-bold w-48 shrink-0 font-mono text-slate-700">{s.name}</span>
                <span className="text-lg text-slate-400">→</span>
                <span className="text-[9px] font-mono truncate flex-1 text-slate-600">{s.out}</span>
              </div>
            ))}
          </div>
          <div className="mt-3 rounded-lg bg-slate-900 text-slate-100 font-mono text-[10px] p-3 overflow-x-auto">
            <div className="text-slate-400"># 병합 우선순위 (왼쪽이 이긴다)</div>
            <div className="mt-1">
              <span className="text-emerald-300">수동 지정</span>
              <span className="text-slate-500"> &gt; </span>
              <span className="text-amber-300">OTEL_RESOURCE_ATTRIBUTES</span>
              <span className="text-slate-500"> &gt; </span>
              <span style={{ color: '#A5B4F0' }}>디텍터 감지값</span>
            </div>
          </div>
          <div className="mt-3 p-2 rounded-lg bg-otel-light border border-otel" style={{ background: 'var(--otel-light)', borderColor: 'var(--otel)' }}>
            <div className="text-[10px] text-otel-dark">💡 같은 이미지를 staging/prod 에 올리고 env=... 만 교체 (12-factor)</div>
          </div>
        </div>
      );
    }

    // Step 5: 백엔드 활용 & 함정
    function BackendView() {
      const nodes = [
        { name: 'gateway',         env: 'prod', v: '1.4.0' },
        { name: 'order-service',   env: 'prod', v: '2.3.1' },
        { name: 'payment-service', env: 'prod', v: '0.9.2' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-2">Resource = 백엔드의 1급 차원(dimension)</div>
          <div className="rounded-lg border border-otel p-3 mb-3" style={{ borderColor: 'var(--otel)', background: 'var(--otel-light)' }}>
            <div className="text-[10px] font-bold text-otel-dark mb-2">🗺️ 서비스맵 — service.name 이 노드</div>
            <div className="flex items-center justify-between gap-1">
              {nodes.map((n, i) => (
                <React.Fragment key={n.name}>
                  <div className="flex-1 text-center bg-white border-2 rounded-lg px-1 py-1.5" style={{ borderColor: 'var(--otel)' }}>
                    <div className="text-[10px] font-bold text-otel-dark truncate">{n.name}</div>
                    <div className="text-[8px] font-mono text-slate-500">v{n.v} · {n.env}</div>
                  </div>
                  {i < nodes.length - 1 && <span className="text-otel text-sm shrink-0">→</span>}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg bg-white border border-slate-200 p-2 mb-3">
            <div className="text-[10px] font-bold text-slate-600 mb-1">📈 버전별 에러율 — 카나리 판정</div>
            <div className="flex items-center gap-2 text-[10px] font-mono">
              <span className="rounded px-2 py-0.5 bg-emerald-100 text-emerald-700">v2.3.0 · 0.1%</span>
              <span className="rounded px-2 py-0.5 bg-red-100 text-red-700 font-bold">v2.3.1 · 4.2% ⚠️</span>
              <span className="text-slate-500">→ 롤백</span>
            </div>
          </div>
          <div className="p-2.5 rounded-lg bg-red-50 border border-red-300">
            <div className="text-[10px] text-red-800 font-bold mb-0.5">⚠️ 정체성 함정</div>
            <ul className="text-[9px] text-red-700 space-y-0.5 list-disc list-inside">
              <li>service.name 누락 → unknown_service 로 뭉침</li>
              <li>이름 불일치(order / order-svc) → 서비스맵 분열</li>
              <li>user.id 등 고카디널리티 → 시계열 폭발 = 비용 붕괴</li>
            </ul>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
            .fade-in { animation: fadeIn 360ms ease-out; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium text-otel hover:text-otel-dark">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">Part II. SDK &amp; 계측 · II-1-4</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-otel text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. SDK &amp; 계측 &gt; Chapter 1. Resource</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Resource Attribute — 서비스 정체성</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                텔레메트리가 <strong>어디서 왔는지 식별하는 속성</strong> — 모든 span·metric·log 에 첨부되는 발신자 표식.
                <code className="bg-slate-100 px-1 rounded text-xs">문제</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">정체성</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">첨부</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">자동감지</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">활용</code> 5 단계로 서비스 정체성을 잡는다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl bg-otel-dark text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider" style={{ color: '#D6DCEE' }}>Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs" style={{ color: '#D6DCEE' }}>키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-otel-light border-2 border-otel text-otel-dark text-sm">
                💡 다음(Part III)에서는 <strong>Collector — 텔레메트리 수집·가공 파이프라인</strong>
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-otel text-white hover-bg-otel-dark transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="../part3/III-1-1.html" className="font-medium text-otel hover:text-otel-dark">III-1-1 Collector 개요 &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
