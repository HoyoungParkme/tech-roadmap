<html lang="ko">

<body>
  <div id="root"></div>

  <!--
    I-1-4. 3 Signals — Trace · Metric · Log
    학습 목표: 관측 가능성의 세 신호가 무엇이며, 하나의 요청에서 함께 생성되어 trace_id 로 상관되는 원리를 잡는다.
    핵심 비유: "병원 진료 기록" — 동선(Trace) · 활력징후 수치(Metric) · 의사 메모(Log)가 한 환자 ID로 묶인다.
    패턴: fastapi 표준 — 좌(LiveDataPane: 세 신호 생성·상관) / 우(VSCode 코드 python/json)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 세 신호 — 하나의 요청, 세 가지 관점',
        desc: '관측 가능성(Observability)은 딱 세 가지 신호로 이루어진다. Trace 는 요청의 전체 여정(무엇이 느린가), Metric 은 시간에 따른 집계 수치(얼마나 자주·얼마나 빠른가), Log 는 그 순간의 이벤트 기록(왜 그랬나)이다. 셋은 서로 다른 질문에 답하기 때문에 하나만으로는 반쪽짜리다. OTel 의 핵심 가치는 이 셋을 같은 SDK·같은 프로토콜(OTLP)로 함께 뽑아내 상호 참조하게 만드는 것이다.',
        focus: 'overview',
        code: {
          lang: 'python',
          filename: 'app.py — 한 요청에서 세 신호를 함께 발생',
          lines: [
            '# OTel 은 tracer / meter / logger 를 같은 SDK 로 함께 제공한다.',
            '# 하나의 요청 안에서 세 신호가 동시에 만들어진다.',
            '',
            'from opentelemetry import trace, metrics',
            'from opentelemetry._logs import get_logger',
            '',
            'tracer = trace.get_tracer("checkout")      # ① Trace — 여정',
            'meter  = metrics.get_meter("checkout")     # ② Metric — 집계',
            'logger = get_logger("checkout")            # ③ Log — 이벤트',
            '',
            'req_counter = meter.create_counter("checkout.requests")',
            'latency_ms  = meter.create_histogram("checkout.latency", unit="ms")',
            '',
            'def checkout(user_id: str):',
            '    # ① Trace: 이 요청 전체를 감싸는 span 시작',
            '    with tracer.start_as_current_span("POST /checkout") as span:',
            '        span.set_attribute("user.id", user_id)',
            '        # ② Metric: 요청 수 +1, 지연 기록',
            '        req_counter.add(1, {"route": "/checkout"})',
            '        latency_ms.record(142, {"route": "/checkout"})',
            '        # ③ Log: 그 순간의 사실을 남긴다',
            '        logger.info("checkout done", extra={"amount": 15000})',
            '',
            '# 무엇이 느린가? → Trace   얼마나?  → Metric   왜?  → Log',
          ],
          highlight: [7, 8, 9],
        },
      },
      {
        title: 'Step 2. Trace — 요청의 전체 여정 (span 트리)',
        desc: 'Trace 는 한 요청이 여러 서비스·함수를 거치는 경로를 부모-자식 span 트리로 표현한다. 각 span 은 시작·종료 시각을 가지므로 어느 구간이 오래 걸렸는지가 트리에서 바로 보인다. "무엇이 느린가"라는 질문의 답이 여기 있다. 메트릭이 p99 가 높다고 알려주면, 트레이스로 내려가 그 느린 요청의 어느 span 이 병목인지 짚는다.',
        focus: 'trace',
        code: {
          lang: 'python',
          filename: 'trace_view.py — span 트리로 병목 찾기',
          lines: [
            '# Trace = 부모-자식 span 트리. 각 span 은 duration 을 가진다.',
            'with tracer.start_as_current_span("POST /checkout") as root:',
            '    # 자식 span 들이 root 아래로 자동으로 이어 붙는다',
            '    with tracer.start_as_current_span("order.create"):',
            '        create_order()                       # 10ms',
            '    with tracer.start_as_current_span("inventory.check"):',
            '        check_stock("i2")                    # 38ms  ← 병목',
            '    with tracer.start_as_current_span("payment.charge"):',
            '        charge(15000)                        # 10ms',
            '',
            '# Jaeger UI 에서 본 같은 trace_id 의 span 트리:',
            '#   POST /checkout ............ 142ms',
            '#   |- order.create ..........  10ms',
            '#   |- inventory.check .......  38ms  ⚠ 전체의 27%',
            '#   |- payment.charge ........  10ms',
            '#',
            '# 결론: "무엇이 느린가?" = inventory.check span',
          ],
          highlight: [6, 7],
        },
      },
      {
        title: 'Step 3. Metric — 시간에 따른 수치·집계',
        desc: 'Metric 은 개별 요청이 아니라 수많은 요청을 집계한 수치다. Counter(요청 수처럼 계속 증가), Histogram(지연 시간의 분포 → p50·p95·p99), Gauge(현재 큐 길이 같은 순간값) 세 종류를 주로 쓴다. 저장 비용이 신호 중 가장 싸서 대시보드·알림의 기본 재료가 된다. "얼마나 자주, 얼마나 빠른가"를 싸게 오래 보관하며 추세와 이상을 감시한다.',
        focus: 'metric',
        code: {
          lang: 'python',
          filename: 'metric_view.py — counter · histogram · gauge',
          lines: [
            '# Metric 은 요청들을 "집계"한다. 개별 요청 정보는 버린다(그래서 싸다).',
            '',
            '# ① Counter — 단조 증가. 초당 요청수(RPS)는 이걸 미분해서 얻는다',
            'req_counter.add(1, {"route": "/checkout", "status": "200"})',
            '',
            '# ② Histogram — 값의 분포를 버킷에 담는다 → p50/p95/p99 산출',
            'latency_ms.record(142, {"route": "/checkout"})',
            '#   버킷:  [0,50)=1200  [50,100)=430  [100,250)=88  [250,+)=5',
            '#   p95 = 118ms,  p99 = 240ms  ← 알림 임계값의 근거',
            '',
            '# ③ Gauge(ObservableGauge) — 순간값. 콜백으로 현재 상태를 읽음',
            'def queue_depth(options):',
            '    yield metrics.Observation(len(order_queue))',
            'meter.create_observable_gauge("order.queue.depth", [queue_depth])',
            '',
            '# 대시보드 질문: "얼마나?" → RPS 12/s, p99 240ms, 큐 3',
            '# 단, "어느 요청"인지는 모른다 → 그건 Trace 로 내려가야 한다',
          ],
          highlight: [6, 7, 8, 9],
        },
      },
      {
        title: 'Step 4. Log — 이벤트 기록 + trace_id 주입',
        desc: 'Log 는 특정 순간에 일어난 사실을 문장으로 남긴 것이다. "왜 실패했나"의 근거(스택트레이스, 입력값, 분기 이유)는 대부분 로그에만 있다. 핵심은 로그 한 줄마다 trace_id 를 함께 찍는 것 — 이게 있어야 트레이스에서 본 느린 요청의 로그만 골라 볼 수 있다. trace_id 없는 로그는 상관이 끊긴 고립된 텍스트라 디버깅 가치가 절반으로 줄어든다.',
        focus: 'log',
        code: {
          lang: 'python',
          filename: 'log_view.py — 로그에 trace_id 자동 주입',
          lines: [
            '# Log 는 "왜"의 근거. 반드시 trace_id 를 함께 찍어야 상관이 된다.',
            'import logging',
            'from opentelemetry.instrumentation.logging import LoggingInstrumentor',
            '',
            '# 이 한 줄이 모든 로그 레코드에 trace_id / span_id 를 자동 주입한다',
            'LoggingInstrumentor().instrument(set_logging_format=True)',
            '',
            'log = logging.getLogger("checkout")',
            '',
            'with tracer.start_as_current_span("inventory.check"):',
            '    if stock < needed:',
            '        # 이 로그에는 현재 span 의 trace_id 가 자동으로 붙는다',
            '        log.warning("insufficient stock item=i2 have=0 need=2")',
            '',
            '# 출력 예 (trace_id 가 박혀 나온다):',
            '# WARNING [trace_id=5b8aa5a2d2c872e8...321cf3 span_id=051581bf]',
            '#         insufficient stock item=i2 have=0 need=2',
            '#',
            '# → 느린 trace 의 trace_id 로 로그를 검색하면 "왜"가 바로 나온다',
          ],
          highlight: [5, 6, 12],
        },
      },
      {
        title: 'Step 5. 상관 — trace_id · exemplar 로 셋을 잇다',
        desc: '세 신호의 진짜 힘은 따로가 아니라 연결될 때 나온다. 공통 키는 trace_id: 로그는 trace_id 로, 메트릭은 exemplar(히스토그램 버킷에 대표 요청의 trace_id 를 붙인 표본)로 트레이스에 연결된다. 실무 디버깅 흐름은 한 방향이다 — 메트릭 알림(p99 급등) → exemplar 클릭으로 느린 trace 진입 → 그 trace_id 로 로그 조회. OTel 은 이 셋을 같은 OTLP 로 함께 내보내 이 흐름을 한 화면에서 가능하게 한다.',
        focus: 'correlate',
        code: {
          lang: 'json',
          filename: 'otlp_correlation.json — exemplar 로 metric→trace 연결',
          lines: [
            '{',
            '  "// 흐름": "Metric 알림 → exemplar → Trace → trace_id 로 Log 조회",',
            '',
            '  "metric": {',
            '    "name": "checkout.latency",',
            '    "histogram_bucket": "[100,250)ms",',
            '    "exemplar": {',
            '      "value": 240,',
            '      "trace_id": "5b8aa5a2d2c872e8321cf37308d69df2",',
            '      "span_id": "051581bf3cb55c13"',
            '    }',
            '  },',
            '',
            '  "trace": {',
            '    "trace_id": "5b8aa5a2d2c872e8321cf37308d69df2",',
            '    "slowest_span": "inventory.check",',
            '    "duration_ms": 38',
            '  },',
            '',
            '  "log": {',
            '    "trace_id": "5b8aa5a2d2c872e8321cf37308d69df2",',
            '    "level": "WARNING",',
            '    "body": "insufficient stock item=i2 have=0 need=2"',
            '  }',
            '}',
          ],
          highlight: [8, 15, 21],
        },
      },
    ];

    function SignalsLiveDataPane({ step, stepIdx }) {
      const focus = step.focus;
      const animKey = `step-${stepIdx}`;

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🔭</span>
              <span className="text-xs font-bold text-slate-700">3 Signals — Trace · Metric · Log</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">OTLP · trace_id 상관</span>
          </div>

          <div className="p-4 min-h-[460px]" key={animKey}>
            {focus === 'overview'  && <OverviewView />}
            {focus === 'trace'     && <TraceSignalView />}
            {focus === 'metric'    && <MetricSignalView />}
            {focus === 'log'       && <LogSignalView />}
            {focus === 'correlate' && <CorrelateView />}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">
              {focus === 'overview'  && '한 요청에서 세 신호가 함께 태어난다 — 무엇이 느린가·얼마나·왜'}
              {focus === 'trace'     && 'Trace: span 트리로 요청의 여정과 병목을 본다'}
              {focus === 'metric'    && 'Metric: counter·histogram·gauge 로 추세를 싸게 감시한다'}
              {focus === 'log'       && 'Log: 이벤트의 근거 — trace_id 를 반드시 함께 찍는다'}
              {focus === 'correlate' && 'exemplar·trace_id 로 세 신호를 한 흐름으로 연결한다'}
            </div>
          </div>
        </div>
      );
    }

    const SIGNALS = [
      { key: 'trace',  icon: '🧭', name: 'Trace',  q: '무엇이 느린가?', ex: 'POST /checkout → 5 span, 142ms', color: '#4F62AD' },
      { key: 'metric', icon: '📈', name: 'Metric', q: '얼마나?',        ex: 'RPS 12/s · p99 240ms',          color: '#6E80C4' },
      { key: 'log',    icon: '📝', name: 'Log',    q: '왜?',            ex: 'WARNING insufficient stock i2',  color: '#3D4E8C' },
    ];

    // Step 1: 한 요청 → 세 신호
    function OverviewView() {
      return (
        <div className="fade-in">
          <div className="text-center mb-3">
            <div className="inline-block px-4 py-2 rounded-lg bg-otel text-white text-[12px] font-bold shadow-otel">
              요청 1건 · POST /checkout · trace_id=5b8a..9df2
            </div>
            <div className="text-otel text-xl leading-none mt-1">↓ 동시에 세 신호 발생 ↓</div>
          </div>
          <div className="grid grid-cols-1 gap-2">
            {SIGNALS.map(s => (
              <div key={s.key} className="flex items-center gap-3 rounded-lg border-2 px-3 py-2.5 bg-white"
                   style={{ borderColor: s.color }}>
                <span className="text-2xl shrink-0">{s.icon}</span>
                <div className="w-16 shrink-0">
                  <div className="text-[12px] font-bold" style={{ color: s.color }}>{s.name}</div>
                  <div className="text-[10px] text-slate-500">{s.q}</div>
                </div>
                <div className="text-[10px] font-mono text-slate-600 flex-1 truncate">{s.ex}</div>
              </div>
            ))}
          </div>
          <div className="mt-4 p-3 rounded-lg bg-otel-light border border-otel">
            <div className="text-[11px] text-otel-dark font-bold mb-1">🔭 OTel 의 통합 표준화</div>
            <div className="text-[10px] text-otel-dark leading-snug">
              같은 SDK · 같은 프로토콜(OTLP)로 셋을 함께 내보내고, 공통 trace_id 로 상호 참조한다. 하나만으로는 반쪽 — 셋이 붙어야 완전한 관측이 된다.
            </div>
          </div>
        </div>
      );
    }

    // Step 2: Trace span 트리
    function TraceSignalView() {
      const spans = [
        { name: 'POST /checkout', depth: 0, ms: 142, w: 100, bottleneck: false },
        { name: 'order.create',   depth: 1, ms: 10,  w: 7,   bottleneck: false },
        { name: 'inventory.check',depth: 1, ms: 38,  w: 27,  bottleneck: true  },
        { name: 'payment.charge', depth: 1, ms: 10,  w: 7,   bottleneck: false },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-3">🧭 같은 trace_id 의 span 트리 — 길이가 곧 duration</div>
          <div className="space-y-2">
            {spans.map((s, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]" style={{ paddingLeft: `${s.depth * 20}px` }}>
                <div className="w-32 truncate font-mono text-slate-700 shrink-0">
                  {s.depth > 0 ? '└─ ' : ''}{s.name}
                </div>
                <div className="flex-1 relative h-5 bg-slate-100 rounded">
                  <div className={`absolute h-full rounded flex items-center justify-end pr-1 text-white text-[9px] ${s.bottleneck ? 'bg-red-500' : 'bg-otel'}`}
                       style={{ width: `${s.w}%` }}>
                    {s.ms}ms
                  </div>
                </div>
                {s.bottleneck && <span className="text-[9px] text-red-600 font-bold shrink-0">⚠ 병목</span>}
              </div>
            ))}
          </div>
          <div className="mt-4 p-3 rounded-lg bg-otel-light border border-otel">
            <div className="text-[11px] text-otel-dark font-bold">답: "무엇이 느린가?"</div>
            <div className="text-[10px] text-otel-dark mt-0.5">inventory.check span 이 38ms — 전체 142ms 의 27%</div>
          </div>
        </div>
      );
    }

    // Step 3: Metric — histogram 분포
    function MetricSignalView() {
      const buckets = [
        { label: '0–50ms',   count: 1200, h: 100 },
        { label: '50–100',   count: 430,  h: 40  },
        { label: '100–250',  count: 88,   h: 14  },
        { label: '250+',     count: 5,    h: 6   },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-3">📈 checkout.latency 히스토그램 (요청들을 집계)</div>
          <div className="flex items-end justify-around gap-2 h-40 px-2 border-b border-slate-200">
            {buckets.map((b, i) => (
              <div key={i} className="flex flex-col items-center flex-1">
                <span className="text-[9px] text-slate-500 font-mono mb-0.5">{b.count}</span>
                <div className="w-full rounded-t bg-otel-mid" style={{ height: `${b.h}%`, minHeight: '6px' }}></div>
              </div>
            ))}
          </div>
          <div className="flex justify-around gap-2 px-2 mt-1">
            {buckets.map((b, i) => (
              <span key={i} className="text-[8px] text-slate-500 font-mono flex-1 text-center">{b.label}</span>
            ))}
          </div>
          <div className="grid grid-cols-3 gap-2 mt-4">
            {[['RPS', '12/s'], ['p95', '118ms'], ['p99', '240ms']].map(([k, v]) => (
              <div key={k} className="text-center p-2 rounded-lg bg-otel-light border border-otel">
                <div className="text-[9px] text-slate-500">{k}</div>
                <div className="text-[13px] font-bold text-otel-dark font-mono">{v}</div>
              </div>
            ))}
          </div>
          <div className="mt-3 p-2 rounded-lg bg-amber-50 border border-amber-300 text-[10px] text-amber-800">
            답: "얼마나?" — 싸게 오래 보관하며 추세·이상을 감시. 단, 어느 요청인지는 모른다.
          </div>
        </div>
      );
    }

    // Step 4: Log — trace_id 주입
    function LogSignalView() {
      const logs = [
        { lvl: 'INFO',    color: 'text-emerald-300', msg: 'order created orderId=o9' },
        { lvl: 'WARNING', color: 'text-amber-300',   msg: 'insufficient stock item=i2 have=0 need=2' },
        { lvl: 'INFO',    color: 'text-emerald-300', msg: 'payment charged amount=15000' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-3">📝 로그 한 줄마다 trace_id 가 박혀 나온다</div>
          <div className="rounded-lg bg-slate-900 p-3 font-mono text-[10px] space-y-2">
            {logs.map((l, i) => (
              <div key={i} className="leading-snug">
                <span className={`font-bold ${l.color}`}>{l.lvl}</span>
                <span className="text-otel-pale" style={{ color: '#A5B4F0' }}> [trace_id=5b8a..9df2 span_id=0515]</span>
                <div className="text-slate-200 pl-2">{l.msg}</div>
              </div>
            ))}
          </div>
          <div className="mt-4 p-3 rounded-lg bg-otel-light border border-otel">
            <div className="text-[11px] text-otel-dark font-bold">답: "왜?"</div>
            <div className="text-[10px] text-otel-dark mt-0.5">
              LoggingInstrumentor 가 trace_id 를 자동 주입 → 느린 trace 의 로그만 정확히 골라 본다.
            </div>
          </div>
          <div className="mt-2 p-2 rounded-lg bg-red-50 border border-red-300 text-[10px] text-red-700">
            ⚠ 함정: trace_id 없는 로그는 상관이 끊긴 고립 텍스트 — 디버깅 가치 절반.
          </div>
        </div>
      );
    }

    // Step 5: 상관
    function CorrelateView() {
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-3">🔗 실무 디버깅 흐름 — 한 방향으로 흐른다</div>
          <div className="space-y-2">
            <div className="p-2.5 rounded-lg border-2 flex items-center gap-2" style={{ borderColor: '#6E80C4' }}>
              <span className="text-lg">📈</span>
              <div className="flex-1">
                <div className="text-[11px] font-bold text-otel-dark">① Metric 알림</div>
                <div className="text-[10px] text-slate-600">p99 가 240ms 로 급등 — exemplar 표본 부착</div>
              </div>
            </div>
            <div className="text-center text-otel text-lg leading-none">↓ exemplar 의 trace_id</div>
            <div className="p-2.5 rounded-lg border-2 flex items-center gap-2" style={{ borderColor: '#4F62AD' }}>
              <span className="text-lg">🧭</span>
              <div className="flex-1">
                <div className="text-[11px] font-bold text-otel-dark">② Trace 진입</div>
                <div className="text-[10px] text-slate-600 font-mono">trace_id=5b8a..9df2 → inventory.check 38ms</div>
              </div>
            </div>
            <div className="text-center text-otel text-lg leading-none">↓ 같은 trace_id 로 검색</div>
            <div className="p-2.5 rounded-lg border-2 flex items-center gap-2" style={{ borderColor: '#3D4E8C' }}>
              <span className="text-lg">📝</span>
              <div className="flex-1">
                <div className="text-[11px] font-bold text-otel-dark">③ Log 조회</div>
                <div className="text-[10px] text-slate-600">insufficient stock item=i2 — "왜"의 근거 확보</div>
              </div>
            </div>
          </div>
          <div className="mt-4 p-3 rounded-lg bg-emerald-50 border border-emerald-300">
            <div className="text-[11px] text-emerald-800 font-bold">✅ 공통 키 = trace_id</div>
            <div className="text-[10px] text-emerald-700 mt-0.5">
              OTel 이 셋을 같은 OTLP 로 함께 내보내 이 흐름을 한 화면에서 끝낸다.
            </div>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
            .fade-in { animation: fadeIn 360ms ease-out; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium text-otel hover:text-otel-dark">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-4</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-otel text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. OTel 기초 &gt; Chapter 1. 관측 가능성의 세 신호</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">3 Signals — Trace · Metric · Log</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                관측 가능성의 세 신호와 그 상관관계 — <strong>무엇이 느린가·얼마나·왜</strong>를 한 요청에서 함께 뽑아 trace_id 로 잇는다.
                <code className="bg-slate-100 px-1 rounded text-xs">개요</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">Trace</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">Metric</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">Log</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">상관</code> 5 단계.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <SignalsLiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl bg-otel-dark text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider" style={{ color: '#D6DCEE' }}>Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs" style={{ color: '#D6DCEE' }}>키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-otel-light border-2 border-otel text-otel-dark text-sm">
                💡 Part I 를 마쳤다. 다음 Part II 에서는 <strong>OTel SDK 를 실제 서비스에 설치·계측</strong>한다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-otel text-white hover-bg-otel-dark transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <div className="w-full bg-slate-200 rounded-full h-1.5 max-w-md mx-auto">
              <div className="bg-otel h-1.5 rounded-full transition-all duration-300"
                   style={{ width: `${((stepIdx + 1) / STEPS.length) * 100}%` }}></div>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="../part2/II-1-1.html" className="font-medium text-otel hover:text-otel-dark">II-1-1 SDK 설치·계측 &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
