<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenTelemetry 학습 — I-1-1. Trace란 무엇인가</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚇</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <style>
    :root {
      --otel:        #4F62AD;
      --otel-dark:   #3D4E8C;
      --otel-light:  #EAEDF7;
      --otel-mid:    #6E80C4;
      --otel-pale:   #D6DCEE;
    }
    .bg-otel       { background-color: var(--otel); }
    .bg-otel-dark  { background-color: var(--otel-dark); }
    .bg-otel-light { background-color: var(--otel-light); }
    .bg-otel-mid   { background-color: var(--otel-mid); }
    .bg-otel-pale  { background-color: var(--otel-pale); }
    .text-otel     { color: var(--otel); }
    .text-otel-dark{ color: var(--otel-dark); }
    .border-otel   { border-color: var(--otel); }
    .ring-otel     { --tw-ring-color: var(--otel); }
    .shadow-otel   { box-shadow: 0 8px 20px -4px rgba(79, 98, 173, 0.35); }
    .hover-bg-otel-dark:hover { background-color: var(--otel-dark); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    I-1-1. Trace란 무엇인가
    학습 목표: 분산된 여러 서비스를 거치는 한 요청을 traceId 로 묶어 하나의 흐름으로 본다.
    핵심 비유: "지하철 환승 기록" — 출발(잠실) → 환승(을지로3가) → 도착(시청)이 한 카드 기록으로 묶이듯
    패턴: fastapi 표준 — 좌(LiveDataPane: trace 시각화) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 문제 — 모놀리스 로그로는 안 보이는 흐름',
        desc: '단일 서버 시대에는 로그 파일 하나만 grep 하면 디버깅이 끝났다. 그러나 MSA 환경에서는 한 요청이 5~10개 서비스를 거친다. 어느 서비스가 느렸는지, 어디서 에러가 시작됐는지, 단순 로그로는 시간 순서를 맞추기조차 어렵다. 이 흐름을 한 줄로 묶을 식별자가 필요하다.',
        focus: 'problem',
        code: {
          lang: 'yaml',
          filename: 'monolith_vs_msa.log — 로그 비교 (문제 상황)',
          lines: [
            '# 1) 모놀리스 — 한 파일에 시간 순서대로 다 있음',
            '#    grep "POST /checkout" app.log → 끝',
            '',
            '[14:02:01] POST /checkout user=u123 → DB query → 200 OK (142ms)',
            '',
            '# 2) MSA — 6개 컨테이너의 로그가 따로따로',
            '#    어느 user 의 어느 요청이 어디서 느렸는지 알기 어렵다',
            '',
            '# api-gateway:',
            '[14:02:01.000] POST /checkout user=u123 → forward → 142ms',
            '',
            '# order-service:',
            '[14:02:01.010] orderId=o9 created',
            '',
            '# inventory-service:',
            '[14:02:01.050] stock check  itemId=i1  ok',
            '[14:02:01.090] stock check  itemId=i2  SLOW 38ms ⚠️',
            '',
            '# payment-service:',
            '[14:02:01.100] charge  amount=15000  card=...4242  OK',
            '',
            '# notification-service:',
            '[14:02:01.135] email queued  user=u123',
            '',
            '# ❓ 142ms 중 어디서 38ms 가 쓰였나? user=u123 의 요청이',
            '#    inventory 의 느린 줄과 같은 요청인지 어떻게 매칭?',
            '#    → 모든 줄을 묶을 "ID" 가 없다 = trace 가 없다',
          ],
          highlight: [14, 23, 24, 25],
        },
      },
      {
        title: 'Step 2. traceId — 한 요청 = 하나의 식별자',
        desc: '진입점(보통 API Gateway 또는 첫 서비스)에서 16바이트(32자 hex) `traceId` 를 만들고, 이 요청이 호출하는 모든 다운스트림 서비스에 헤더로 전달한다. 모든 서비스가 자기 로그·메트릭·span 에 같은 `traceId` 를 찍는다. 디버깅은 traceId 하나로 모든 흔적을 하나의 줄기로 검색하는 일이 된다.',
        focus: 'traceid',
        code: {
          lang: 'yaml',
          filename: 'with_traceid.log — 같은 traceId 로 묶인 흐름',
          lines: [
            '# 같은 요청에 속한 모든 로그가 traceId 를 공유한다',
            '# trace_id = 16 byte (32 hex) — UUID 와 비슷하지만 trace 전용',
            '',
            'trace_id: 5b8aa5a2d2c872e8321cf37308d69df2   ← 한 요청을 식별',
            '',
            '# api-gateway:',
            '[14:02:01.000] trace=5b8a..9df2  POST /checkout user=u123',
            '',
            '# order-service:',
            '[14:02:01.010] trace=5b8a..9df2  orderId=o9 created',
            '',
            '# inventory-service:',
            '[14:02:01.050] trace=5b8a..9df2  stock check itemId=i1 ok',
            '[14:02:01.090] trace=5b8a..9df2  stock check itemId=i2 SLOW 38ms',
            '',
            '# payment-service:',
            '[14:02:01.100] trace=5b8a..9df2  charge ok 15000',
            '',
            '# notification-service:',
            '[14:02:01.135] trace=5b8a..9df2  email queued',
            '',
            '# ✅ 이제 traceId 한 줄만 검색하면 6개 서비스의 모든 흔적이 한 묶음',
            '#    Jaeger UI 에서 검색창에 trace_id 붙여넣기 → 끝',
            '#    → "어디서 38ms 가 쓰였나" 한눈에 보인다 = inventory itemId=i2',
          ],
          highlight: [4, 7, 10, 14, 17, 20],
        },
      },
      {
        title: 'Step 3. 서비스 간 전파 — 헤더로 traceId 이어 붙이기',
        desc: '진입점에서 만든 traceId는 다음 서비스로 HTTP 헤더 `traceparent` (W3C 표준)에 실려 전달된다. 받는 서비스의 OTel SDK가 헤더에서 traceId를 꺼내 자기 span에 이어 붙인다. 헤더가 끊기면 trace도 끊긴다 — 그래서 모든 HTTP/gRPC 클라이언트가 자동으로 헤더를 inject 하는 게 중요하다.',
        focus: 'propagation',
        code: {
          lang: 'python',
          filename: 'gateway.py — traceparent 헤더 자동 전파',
          lines: [
            '# OTel SDK 는 HTTP 클라이언트(requests/httpx)를 monkey-patch 해서',
            '# 모든 outbound 요청에 traceparent 헤더를 자동으로 붙인다.',
            '',
            'from fastapi import FastAPI, Request',
            'import httpx',
            'from opentelemetry import trace',
            'from opentelemetry.instrumentation.fastapi import FastAPIInstrumentor',
            'from opentelemetry.instrumentation.httpx import HTTPXClientInstrumentor',
            '',
            'app = FastAPI()',
            'FastAPIInstrumentor.instrument_app(app)',
            'HTTPXClientInstrumentor().instrument()',
            'tracer = trace.get_tracer("checkout-gateway")',
            '',
            '@app.post("/checkout")',
            'async def checkout(req: Request):',
            '    # 진입점에서 root span 자동 생성',
            '    # trace_id = 5b8aa5a2d2c872e8321cf37308d69df2',
            '',
            '    async with httpx.AsyncClient() as client:',
            '        # ↓ httpx 가 자동으로 traceparent 헤더 inject',
            '        #   traceparent: 00-5b8aa5a2d2c872e8321cf37308d69df2-051581bf3cb55c13-01',
            '        #                ^^ version  ^^^^^^^^ trace_id ^^^^^^^^^  ^^ parent_span ^^  ^^ flags',
            '        await client.post("http://order-service/orders")',
            '        await client.post("http://inventory-service/check")',
            '        await client.post("http://payment-service/charge")',
            '',
            '    return {"ok": True}',
            '',
            '# 다운스트림 서비스는 헤더에서 trace_id 를 꺼내 자기 span 의 parent 로 사용',
            '# → 같은 trace_id 가 6 개 서비스를 관통한다',
          ],
          highlight: [11, 12, 21, 22],
        },
      },
      {
        title: 'Step 4. Gantt 차트 — 한눈에 보는 병목',
        desc: 'Jaeger/Tempo UI는 같은 traceId 의 모든 span을 시간축에 막대(Gantt 차트)로 보여준다. 각 막대의 길이가 그 span의 duration. 길이만 봐도 누가 병목인지 즉시 보인다. "inventory itemId=i2가 38ms" 같은 진단이 한눈에 끝난다. 이게 분산 추적의 본질이다.',
        focus: 'gantt',
        code: {
          lang: 'yaml',
          filename: 'jaeger_ui.gantt — Gantt 차트로 보는 trace',
          lines: [
            '# Jaeger UI 에서 trace_id = 5b8a..9df2 를 열면',
            '# 142ms 전체에 걸친 6 개 span 이 시간순으로 그려진다.',
            '',
            'POST /checkout                  [████████████████████████████████] 142ms',
            '├─ order-service:create         [██████] 10ms',
            '├─ inventory-service:check[i1]  [██] 5ms',
            '├─ inventory-service:check[i2]  [████████████████████] 38ms  ← 병목 ⚠️',
            '├─ payment-service:charge       [██████] 10ms',
            '└─ notification-service:email   [████] 8ms',
            '',
            '시간축 →   0ms          50ms          100ms          142ms',
            '',
            '# 한눈에:',
            '# - 전체 142ms 중 inventory itemId=i2 한 호출이 38ms (27%)',
            '# - 다음 액션: inventory-service 의 i2 조회 쿼리/캐시 점검',
            '#',
            '# 이 도구가 없으면 똑같이 알아내는 데 1 시간 + Slack 5 명 + 2 차 사고',
            '# 이 도구가 있으면 30 초 + 혼자서 끝',
          ],
          highlight: [7, 15, 16],
        },
      },
    ];

    function TraceViz({ step, stepIdx }) {
      const focus = step.focus;
      const animKey = `step-${stepIdx}`;

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🚇</span>
              <span className="text-xs font-bold text-slate-700">Trace — 지하철 환승 기록</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">W3C Trace Context · 32 hex</span>
          </div>

          <div className="p-4 min-h-[460px]" key={animKey}>
            {focus === 'problem'     && <ProblemView />}
            {focus === 'traceid'     && <TraceIdView />}
            {focus === 'propagation' && <PropagationView />}
            {focus === 'gantt'       && <GanttView />}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">
              {focus === 'problem'     && '6개 서비스의 로그가 따로 — 무엇이 무엇과 같은 요청인지 알 수 없음'}
              {focus === 'traceid'     && '32 hex traceId 로 같은 요청의 모든 흔적을 한 묶음으로'}
              {focus === 'propagation' && 'traceparent HTTP 헤더로 서비스 경계 너머 trace 이어 붙이기'}
              {focus === 'gantt'       && 'Gantt 차트로 누가 병목인지 즉시 식별'}
            </div>
          </div>
        </div>
      );
    }

    // Step 1: 분리된 로그 — 끊긴 6 개 서비스
    function ProblemView() {
      const services = [
        { name: 'api-gateway',          icon: '🚪', log: 'POST /checkout user=u123', color: 'bg-slate-100 border-slate-300 text-slate-700' },
        { name: 'order-service',        icon: '📦', log: 'orderId=o9 created',       color: 'bg-slate-100 border-slate-300 text-slate-700' },
        { name: 'inventory-service',    icon: '📚', log: 'stock check i1, i2 SLOW',  color: 'bg-red-100 border-red-300 text-red-700' },
        { name: 'payment-service',      icon: '💳', log: 'charge 15000 OK',          color: 'bg-slate-100 border-slate-300 text-slate-700' },
        { name: 'notification-service', icon: '📧', log: 'email queued',             color: 'bg-slate-100 border-slate-300 text-slate-700' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-2">5 개 서비스 — 각자 자기 로그만 가진다. 같은 요청인지 모름.</div>
          <div className="space-y-1.5">
            {services.map(s => (
              <div key={s.name} className={`flex items-center gap-2 rounded border px-3 py-2 ${s.color}`}>
                <span className="text-base">{s.icon}</span>
                <span className="text-[11px] font-bold w-36 shrink-0">{s.name}</span>
                <span className="text-[10px] font-mono truncate flex-1">{s.log}</span>
                <span className="text-[9px] text-slate-500 font-mono">trace=?</span>
              </div>
            ))}
          </div>
          <div className="mt-4 p-3 rounded-lg bg-amber-50 border border-amber-300">
            <div className="text-[11px] text-amber-800 font-bold mb-1">❓ 풀 수 없는 질문</div>
            <ul className="text-[10px] text-amber-700 space-y-0.5 list-disc list-inside">
              <li>5 개 로그 줄이 같은 요청인가, 다른 사용자의 다른 요청인가?</li>
              <li>전체 142ms 중 어디서 38ms 가 쓰였나?</li>
              <li>에러는 어느 서비스에서 시작됐나?</li>
            </ul>
          </div>
        </div>
      );
    }

    // Step 2: traceId 가 모든 줄에 붙음
    function TraceIdView() {
      const services = [
        { name: 'api-gateway',          icon: '🚪', log: 'POST /checkout user=u123' },
        { name: 'order-service',        icon: '📦', log: 'orderId=o9 created' },
        { name: 'inventory-service',    icon: '📚', log: 'stock check i2 SLOW 38ms' },
        { name: 'payment-service',      icon: '💳', log: 'charge 15000 OK' },
        { name: 'notification-service', icon: '📧', log: 'email queued' },
      ];
      const traceId = '5b8aa5a2d2c872e8321cf37308d69df2';
      const short  = '5b8a..9df2';
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-2">같은 traceId 가 모든 로그에 부착 — 한 줄로 검색 가능</div>
          <div className="mb-3 p-2 rounded-lg bg-otel-light border border-otel" style={{ background: 'var(--otel-light)', borderColor: 'var(--otel)' }}>
            <div className="text-[10px] text-otel-dark font-bold mb-0.5">trace_id (16 byte = 32 hex)</div>
            <div className="font-mono text-[11px] text-otel-dark break-all">{traceId}</div>
          </div>
          <div className="space-y-1.5">
            {services.map(s => (
              <div key={s.name} className="flex items-center gap-2 rounded border border-otel bg-otel-light px-3 py-2"
                   style={{ background: 'var(--otel-light)', borderColor: 'var(--otel)' }}>
                <span className="text-base">{s.icon}</span>
                <span className="text-[11px] font-bold w-36 shrink-0 text-otel-dark">{s.name}</span>
                <span className="text-[10px] font-mono truncate flex-1 text-slate-700">{s.log}</span>
                <span className="text-[9px] text-otel-dark font-mono font-bold">trace={short}</span>
              </div>
            ))}
          </div>
          <div className="mt-4 p-3 rounded-lg bg-emerald-50 border border-emerald-300">
            <div className="text-[11px] text-emerald-800 font-bold">✅ 같은 trace_id 로 5 개 서비스의 흔적을 한 묶음 검색</div>
          </div>
        </div>
      );
    }

    // Step 3: HTTP 헤더로 전파
    function PropagationView() {
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-3">진입점이 trace 시작 → 헤더에 실어 다음 서비스로 전달</div>
          {/* 3 서비스 */}
          <div className="flex items-center justify-between gap-2">
            <ServiceBlock icon="🚪" name="gateway" sub="root span" />
            <ArrowWithHeader />
            <ServiceBlock icon="📦" name="order" sub="child span" />
            <ArrowWithHeader />
            <ServiceBlock icon="📚" name="inventory" sub="child span" />
          </div>
          {/* 헤더 형식 */}
          <div className="mt-5 p-3 rounded-lg bg-slate-900 text-slate-100 font-mono text-[10px] overflow-x-auto">
            <div className="text-slate-400 mb-1"># HTTP header (W3C Trace Context)</div>
            <div>
              <span className="text-otel-light" style={{ color: '#A5B4F0' }}>traceparent:</span> 00-<span className="text-emerald-300">5b8aa5a2d2c872e8321cf37308d69df2</span>-<span className="text-amber-300">051581bf3cb55c13</span>-01
            </div>
            <div className="text-slate-400 mt-1">
              # &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;version &nbsp;&nbsp;<span className="text-emerald-300">trace_id (32 hex)</span> &nbsp;&nbsp;<span className="text-amber-300">parent_span_id</span> &nbsp;flags
            </div>
          </div>
          <div className="mt-3 p-2 rounded-lg bg-otel-light border border-otel" style={{ background: 'var(--otel-light)', borderColor: 'var(--otel)' }}>
            <div className="text-[10px] text-otel-dark">
              <span className="font-bold">💡</span> OTel SDK 가 HTTP 클라이언트(httpx/requests/axios)를 자동으로 monkey-patch — 코드 0 줄로 헤더 inject
            </div>
          </div>
        </div>
      );
    }
    function ServiceBlock({ icon, name, sub }) {
      return (
        <div className="flex-1 text-center bg-white border-2 rounded-lg px-2 py-2 shadow-otel" style={{ borderColor: 'var(--otel)' }}>
          <div className="text-2xl">{icon}</div>
          <div className="text-[11px] font-bold text-otel-dark">{name}</div>
          <div className="text-[9px] text-slate-500 font-mono">{sub}</div>
        </div>
      );
    }
    function ArrowWithHeader() {
      return (
        <div className="flex flex-col items-center shrink-0">
          <div className="text-lg leading-none text-otel">→</div>
          <div className="text-[8px] text-slate-500 font-mono">traceparent</div>
        </div>
      );
    }

    // Step 4: Gantt
    function GanttView() {
      const spans = [
        { name: 'POST /checkout',                  start: 0,   width: 100, color: 'bg-otel-dark', label: '142ms (전체)' },
        { name: 'order-service:create',            start: 7,   width: 7,   color: 'bg-otel-mid',  label: '10ms' },
        { name: 'inventory-service:check[i1]',     start: 14,  width: 4,   color: 'bg-otel-mid',  label: '5ms' },
        { name: 'inventory-service:check[i2]',     start: 18,  width: 27,  color: 'bg-red-500',   label: '38ms ⚠️ 병목' },
        { name: 'payment-service:charge',          start: 45,  width: 7,   color: 'bg-otel-mid',  label: '10ms' },
        { name: 'notification-service:email',      start: 52,  width: 6,   color: 'bg-otel-mid',  label: '8ms' },
      ];
      return (
        <div className="fade-in">
          <div className="text-[11px] text-slate-500 mb-3">Jaeger/Tempo UI — 같은 traceId 의 6 span 시간축</div>
          <div className="space-y-1.5">
            {spans.map((s, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <div className="w-44 truncate font-mono text-slate-700 shrink-0">{s.name}</div>
                <div className="flex-1 relative h-5 bg-slate-100 rounded">
                  <div
                    className={`absolute h-full rounded text-white text-[9px] flex items-center justify-end pr-1 ${s.color}`}
                    style={{ left: `${s.start}%`, width: `${s.width}%` }}
                  >
                    {s.width > 15 ? s.label : ''}
                  </div>
                </div>
                <div className="w-20 text-right text-[9px] text-slate-500 font-mono shrink-0">{s.width <= 15 ? s.label : ''}</div>
              </div>
            ))}
          </div>
          <div className="mt-3 flex items-center justify-between text-[9px] text-slate-400 font-mono">
            <span>0ms</span><span>30ms</span><span>60ms</span><span>100ms</span><span>142ms</span>
          </div>
          <div className="mt-4 p-3 rounded-lg bg-red-50 border border-red-300">
            <div className="text-[11px] text-red-800 font-bold">⚠️ 발견: inventory itemId=i2 가 38ms (전체의 27%)</div>
            <div className="text-[10px] text-red-700 mt-0.5">다음 액션: inventory-service 의 i2 조회 쿼리/캐시 점검</div>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
            .fade-in { animation: fadeIn 360ms ease-out; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium text-otel hover:text-otel-dark">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-otel text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. OTel 기초 &gt; Chapter 1. Trace / Span</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Trace란 무엇인가</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                지하철 환승 기록 — <strong>한 요청이 여러 서비스를 거쳐도 하나의 ID로 묶는다</strong>.
                <code className="bg-slate-100 px-1 rounded text-xs">문제</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">traceId</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">전파</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">Gantt</code> 4 단계로 분산 추적의 본질을 잡는다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <TraceViz step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl bg-otel-dark text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider" style={{ color: '#D6DCEE' }}>Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs" style={{ color: '#D6DCEE' }}>키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-otel-light border-2 border-otel text-otel-dark text-sm">
                💡 다음(I-1-2)에서는 <strong>Span의 구조와 부모-자식 트리</strong>
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-otel text-white hover-bg-otel-dark transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./I-1-2.html" className="font-medium text-otel hover:text-otel-dark">I-1-2 Span 구조 &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
