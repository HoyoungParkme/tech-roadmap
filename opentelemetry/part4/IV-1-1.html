  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-1-1. OTLP — gRPC / HTTP 전송
    학습 목표: OpenTelemetry 표준 전송 프로토콜(OTLP)의 gRPC(:4317) vs HTTP(:4318) 특성과 Exporter 설정 이해
    핵심 비유: "배송 트럭 vs 택배" — SDK가 텔레메트리를 OTLP로 포장해 Collector/백엔드로 나른다
    패턴: fastapi 표준 — 좌(SDK→OTLP 전송 시각화) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 5 STEPS — OTLP 전송 프로토콜
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang: 'python', filename: 'otlp_basic.py — SDK에서 OTLP로 전송', lines: [
        '# pip install opentelemetry-sdk opentelemetry-exporter-otlp',
        'from opentelemetry import trace',
        'from opentelemetry.sdk.trace import TracerProvider',
        'from opentelemetry.sdk.trace.export import BatchSpanProcessor',
        'from opentelemetry.sdk.resources import Resource',
        '# OTLP/gRPC exporter — 포트 4317, 바이너리 protobuf',
        'from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter',
        '',
        "resource = Resource.create({'service.name': 'checkout-api'})",
        'provider = TracerProvider(resource=resource)',
        '',
        '# 엔드포인트만 바꾸면 Tempo·Jaeger·SaaS 어디로든 동일 코드',
        "exporter = OTLPSpanExporter(endpoint='http://otel-collector:4317', insecure=True)",
        'provider.add_span_processor(BatchSpanProcessor(exporter))',
        'trace.set_tracer_provider(provider)',
        '',
        'tracer = trace.get_tracer(__name__)',
        "with tracer.start_as_current_span('checkout') as span:",
        "    span.set_attribute('order.id', 'A-1024')",
        '    ...  # 비즈니스 로직 — span이 OTLP로 Collector에 전송된다',
      ]},
      s2: {lang: 'python', filename: 'grpc_vs_http.py — 두 전송 비교', lines: [
        '# ── gRPC exporter — 포트 4317, HTTP/2 바이너리, 연결 재사용',
        'from opentelemetry.exporter.otlp.proto.grpc.trace_exporter \\',
        '    import OTLPSpanExporter as GrpcExporter',
        "grpc_exporter = GrpcExporter(endpoint='otel-collector:4317', insecure=True)",
        '#   → 경로 없음(host:port). 대용량 사내 트래픽에 저오버헤드로 유리',
        '',
        '# ── HTTP/protobuf exporter — 포트 4318, 프록시·방화벽 친화',
        'from opentelemetry.exporter.otlp.proto.http.trace_exporter \\',
        '    import OTLPSpanExporter as HttpExporter',
        "http_exporter = HttpExporter(",
        "    endpoint='http://otel-collector:4318/v1/traces')",
        '#   → /v1/traces 경로 필수. 서버리스·LB 뒤에서 안정적',
        '',
        '# 함정: gRPC에 /v1/traces 붙이거나 HTTP에 4317 쓰면 조용히 실패',
        '# 같은 신호에 두 exporter를 동시에 걸 필요는 없다 — 하나만 선택',
      ]},
      s3: {lang: 'bash', filename: 'otel-env.sh — 코드 수정 없이 환경변수로', lines: [
        '# OpenTelemetry SDK — 환경변수로 OTLP 전송 설정 (표준 스펙)',
        '# ── 프로토콜 선택: grpc | http/protobuf',
        'export OTEL_EXPORTER_OTLP_PROTOCOL=grpc',
        '# ── 엔드포인트 (gRPC 4317 / HTTP 4318)',
        'export OTEL_EXPORTER_OTLP_ENDPOINT=https://otel-collector:4317',
        '# ── 인증 헤더 (SaaS 백엔드 API 키)',
        'export OTEL_EXPORTER_OTLP_HEADERS=api-key=SECRET_TOKEN,x-tenant=seoul',
        '# ── gzip 압축 — 대역폭 절감 (기본 none)',
        'export OTEL_EXPORTER_OTLP_COMPRESSION=gzip',
        '# ── TLS 사설 CA 인증서',
        'export OTEL_EXPORTER_OTLP_CERTIFICATE=/etc/ssl/certs/otel-ca.pem',
        '# ── export 타임아웃(ms)',
        'export OTEL_EXPORTER_OTLP_TIMEOUT=10000',
        '# ── 신호별 재정의: trace만 다른 백엔드로',
        'export OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=https://traces.vendor.io:4318/v1/traces',
        '',
        '# 함정: https 미설정(평문) / 헤더 누락(401) / 압축 off(대역폭 폭증)',

                caption: '직접 전송은 앱마다 인증·재시도·라우팅이 중복된다. 경유 구조는 백엔드 교체·샘플링·배치를 중앙에서 한 번에 바꾼다.',
                changes: [ {mark:'gone', text:'앱별 중복 설정 제거'},
                           {mark:'read', text:'백엔드 교체 = Collector 설정'} ] },
        code: { ...CODE.s5, highlight: [19,20] },
      },
    ];

    // ─────────────────────────────────────────────────────────
    // 좌측 LiveDataPane — SDK→OTLP 전송 시각화
    // ─────────────────────────────────────────────────────────
    function OtlpTransportLiveDataPane({ beat, step, stepIdx }) {
      const focus = step.focus;
      const animKey = `step-${stepIdx}`;

      // 배치 큐 게이지 (Step 4에서 채움)
      const queuePct = focus === 'batch' ? 78 : 30;

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="otel-bg-light px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🚚</span>
              <span className="text-xs font-bold otel-text-dark">OTLP 전송 — SDK에서 백엔드까지</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">otlp v1 · protobuf</span>
          </div>

          <div className="p-4 space-y-2 min-h-[460px]" key={animKey}>

            {/* SDK 박스 */}
            <div className={`rounded-lg p-3 transition-all duration-500 fade-in ${focus === 'otlp' ? 'bg-sky-50 border-2 border-sky-400 shadow-lg shadow-sky-200/40' : 'bg-white border border-slate-300'}`}>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-base">📦</span>
                <span className="text-sm font-bold text-slate-800">SDK — service.name: checkout-api</span>
                {focus === 'otlp' && <span className="ml-auto text-[10px] otel-bg text-white px-2 py-0.5 rounded-full font-bold">FOCUS</span>}
              </div>
              <div className="grid grid-cols-3 gap-1.5">
                {[
                  { name: 'traces', tag: 'span' },
                  { name: 'metrics', tag: 'point' },
                  { name: 'logs', tag: 'record' },
                ].map((s) => (
                  <div key={s.name} className="rounded border bg-sky-100 text-sky-700 border-sky-300 px-1.5 py-1 text-center">
                    <div className="text-[11px] font-bold font-mono leading-tight">{s.name}</div>
                    <div className="text-[8px] opacity-70 font-mono">{s.tag}</div>
                  </div>
                ))}
              </div>
              <div className="mt-2 text-[10px] text-slate-500 font-mono">OTLPSpanExporter — protobuf 직렬화</div>
            </div>

            {/* 배치 큐 게이지 */}
            <div className={`rounded-lg px-3 py-2 transition-all duration-500 fade-in ${focus === 'batch' ? 'bg-amber-50 border-2 border-amber-400' : 'bg-slate-50 border border-slate-200'}`}>
              <div className="flex items-center justify-between mb-1">
                <span className="text-[11px] font-bold text-slate-700">BatchSpanProcessor 큐</span>
                <span className="text-[10px] font-mono text-slate-500">{queuePct}% · max 2048</span>
              </div>
              <div className="h-2 w-full bg-slate-200 rounded-full overflow-hidden">
                <div className={`h-full transition-all duration-700 ${queuePct > 70 ? 'bg-amber-500' : 'otel-bg'}`} style={{ width: queuePct + '%' }}></div>
              </div>
              {focus === 'batch' && <div className="mt-1 text-[9px] text-amber-700 font-mono">큐 상한 임박 → 초과 span은 drop (앱 격리)</div>}
            </div>

            <ArrowDownOtlp active={true} label="OTLP push (protobuf)" />

            {/* 두 전송 레인 */}
            <div className="grid grid-cols-2 gap-2">
              <TransportLane
                active={['protocols', 'config', 'batch'].includes(focus)}
                highlight={focus === 'protocols'}
                title="gRPC"
                port=":4317"
                rows={[
                  ['전송', 'HTTP/2 바이너리'],
                  ['엔드포인트', 'host:4317'],
                  ['강점', '저오버헤드·재사용'],
                  ['적합', '사내 대용량'],
                ]}
                color="violet"
              />
              <TransportLane
                active={['protocols', 'config'].includes(focus)}
                highlight={focus === 'protocols'}
                title="HTTP/protobuf"
                port=":4318"
                rows={[
                  ['전송', 'HTTP POST'],
                  ['엔드포인트', '/v1/traces'],
                  ['강점', '프록시·방화벽 친화'],
                  ['적합', '서버리스·LB 뒤'],
                ]}
                color="emerald"
              />
            </div>

            <ArrowDownOtlp active={true} label="deliver" />

            {/* 목적지 */}
            <div className={`rounded-lg p-3 transition-all duration-500 fade-in ${focus === 'topology' ? 'border-2 otel-border' : 'bg-white border border-slate-300'}`} style={focus === 'topology' ? { backgroundColor: 'var(--otel-light)' } : {}}>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-base">🏭</span>
                <span className="text-sm font-bold text-slate-800">목적지</span>
                {focus === 'topology' && <span className="ml-auto text-[10px] otel-bg text-white px-2 py-0.5 rounded-full font-bold">FOCUS</span>}
              </div>
              <div className="grid grid-cols-2 gap-1.5">
                <div className="rounded border otel-border px-2 py-1.5 text-center" style={{ backgroundColor: 'var(--otel-light)' }}>
                  <div className="text-[11px] font-bold otel-text-dark font-mono">Collector 경유</div>
                  <div className="text-[8px] text-slate-500 font-mono mt-0.5">권장 · 중앙 관리</div>
                </div>
                <div className="rounded border border-slate-300 bg-slate-50 px-2 py-1.5 text-center">
                  <div className="text-[11px] font-bold text-slate-600 font-mono">백엔드 직접</div>
                  <div className="text-[8px] text-slate-400 font-mono mt-0.5">단순 · 중복 증가</div>
                </div>
              </div>
            </div>

          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">
              {focus === 'otlp' && '세 신호를 하나의 표준(OTLP)으로 — 코드는 그대로, 목적지만 교체'}
              {focus === 'protocols' && 'gRPC(4317·바이너리) vs HTTP(4318·경로 필수) — 엔드포인트 형태가 결정적'}
              {focus === 'config' && '환경변수로 프로토콜·헤더·TLS·압축 주입 (코드 무수정)'}
              {focus === 'batch' && '큐에 모아 배치 전송, 실패 시 재시도, 초과 시 drop으로 앱 격리'}
              {focus === 'topology' && 'Collector 경유가 운영 표준 — 배치·샘플링·백엔드 교체 중앙화'}
            </div>
          </div>
        </div>
      );
    }

    // ── 전송 레인 카드
    function TransportLane({ active, highlight, title, port, rows, color }) {
      const cls = highlight
        ? `bg-${color}-50 border-2 border-${color}-400 shadow-lg shadow-${color}-200/40 scale-[1.01]`
        : active
        ? `bg-${color}-50 border border-${color}-300`
        : 'bg-slate-50 border border-slate-200 opacity-60';
      const headCls = {
        violet: 'text-violet-700',
        emerald: 'text-emerald-700',
      }[color];
      return (
        <div className={`rounded-lg p-2.5 transition-all duration-500 fade-in ${cls}`}>
          <div className="flex items-center justify-between mb-1.5">
            <span className={`text-sm font-bold font-mono ${headCls}`}>{title}</span>
            <span className="text-[10px] font-mono bg-white/70 rounded px-1.5 py-0.5 text-slate-600">{port}</span>
          </div>
          <div className="space-y-0.5">
            {rows.map((r) => (
              <div key={r[0]} className="flex justify-between text-[9px] font-mono">
                <span className="text-slate-400">{r[0]}</span>
                <span className="text-slate-700 font-medium">{r[1]}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ArrowDownOtlp({ active, label }) {
      return (
        <div className="flex flex-col items-center -my-0.5">
          <div className={`text-2xl leading-none transition-all duration-500 ${active ? 'otel-text' : 'text-slate-300'}`}>↓</div>
          {label && (
            <div className={`text-[9px] font-mono transition-colors ${active ? 'otel-text-dark font-bold' : 'text-slate-400'}`}>{label}</div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[30rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { animation: fadeIn 360ms ease-out; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="otel-text hover:otel-text-dark font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 otel-bg text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. Exporter &amp; Backend &gt; Chapter 1. OTLP</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">OTLP — gRPC / HTTP 전송</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                OpenTelemetry의 표준 전송 프로토콜 — 벤더 중립 <strong>OTLP</strong>로 세 신호를 한 규격에 실어 나른다.
                <code className="bg-slate-100 px-1 rounded text-xs ml-1">gRPC :4317</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">HTTP :4318</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">exporter 설정</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">batch · retry</code>를 다룬다.
              </p>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <OtlpTransportLiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl otel-bg-dark text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl otel-bg-light border-2 otel-border otel-text-dark text-sm">
                💡 다음(IV-1-2)에서는 <strong>백엔드 연동 심화</strong> — Tempo·Prometheus·Loki 등 목적지별 exporter 설정을 자세히 본다.
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0} aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay} aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold otel-bg text-white otel-hover transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 진행바 */}
            <div className="max-w-md mx-auto">
              <div className="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                <div className="h-full otel-bg transition-all duration-500" style={{ width: ((stepIdx + 1) / STEPS.length * 100) + '%' }}></div>
              </div>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브로</a>
              <a href="./IV-1-2.html" className="otel-text hover:otel-text-dark font-medium">IV-1-2 백엔드 연동 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
