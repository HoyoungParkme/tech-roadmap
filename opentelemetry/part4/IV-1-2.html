  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-1-2. Jaeger — Trace 백엔드
    학습 목표: OTLP로 전송된 span이 Jaeger에 저장되고 trace_id로 조회되어 타임라인·서비스맵으로 시각화되는 흐름 이해
    핵심 비유: "블랙박스 기록장치" — 여러 서비스의 이동 궤적(span)을 한 항공편(trace_id)으로 묶어 저장하고 되감아 본다
    패턴: fastapi 표준 — 좌(Jaeger 저장·조회·시각화) / 우(VSCode 코드: yaml/bash)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 데모용 span 목록 — 하나의 trace(checkout 요청)를 구성하는 span들
    const TRACE = [
      { svc: 'frontend', op: 'GET /checkout',   start: 0,   dur: 120, depth: 0, color: 'sky' },
      { svc: 'api',      op: 'POST /order',      start: 12,  dur: 96,  depth: 1, color: 'violet' },
      { svc: 'api',      op: 'db.query INSERT',  start: 20,  dur: 38,  depth: 2, color: 'emerald' },
      { svc: 'api',      op: 'cache.get',        start: 60,  dur: 10,  depth: 2, color: 'amber' },
      { svc: 'payment',  op: 'charge',           start: 74,  dur: 30,  depth: 2, color: 'rose' },
    ];

    // 5 STEPS — Jaeger 저장·조회·시각화
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang: 'yaml', filename: 'docker-compose.yaml — Jaeger all-in-one (개발용)', lines: [
        '# 로컬 개발: collector + query + storage 를 한 컨테이너로',
        '',
        'services:',
        '  jaeger:',
        '    image: jaegertracing/all-in-one:1.60',
        '    environment:',
        '      # 네이티브 OTLP 수신 활성화 (1.35+ 기본 지원)',
        '      COLLECTOR_OTLP_ENABLED: "true"',
        '      # 개발용 인메모리 저장 (재시작 시 전부 소실)',
        '      SPAN_STORAGE_TYPE: memory',
        '    ports:',
        '      - "16686:16686"   # Jaeger UI (query)',
        '      - "4317:4317"     # OTLP gRPC 수신',
        '      - "4318:4318"     # OTLP HTTP 수신',
        '    healthcheck:',
        '      test: ["CMD", "wget", "-qO-", "localhost:16686"]',
        '      interval: 10s',
        '',
        '# all-in-one = 개발 전용. 프로덕션은 collector/query 분리 배포',
      ]},
      s2: {lang: 'yaml', filename: 'otel-collector.yaml — Jaeger로 export', lines: [
        '# OTel Collector 가 앱의 span 을 받아 Jaeger 로 전달',
        '',
        'receivers:',
        '  otlp:',
        '    protocols:',
        '      grpc: { endpoint: 0.0.0.0:4317 }',
        '      http: { endpoint: 0.0.0.0:4318 }',
        '',
        'exporters:',
        '  # Jaeger 는 이제 OTLP 를 직접 받는다 (jaeger exporter 는 폐기됨)',
        '  otlp/jaeger:',
        '    endpoint: jaeger:4317',
        '    tls:',
        '      insecure: true          # 사내망 데모. 운영은 mTLS 권장',
        '',
        'processors:',
        '  batch:',
        '    timeout: 5s',
        '',
        'service:',
        '  pipelines:',
        '    traces:',
        '      receivers:  [otlp]',
        '      processors: [batch]',
        '      exporters:  [otlp/jaeger]',
        '',
        '# 앱 -> Collector -> Jaeger : 백엔드 교체가 설정 한 줄',
      ]},
      s3: {lang: 'yaml', filename: 'jaeger-collector.yaml — Elasticsearch 백엔드', lines: [
        '# 프로덕션 collector: Elasticsearch 를 저장소로',
        '',
        'services:',
        '  jaeger-collector:',
        '    image: jaegertracing/jaeger-collector:1.60',
        '    environment:',
        '      SPAN_STORAGE_TYPE: elasticsearch',
        '      ES_SERVER_URLS: http://es:9200',
        '      # 인덱스 롤오버 + 보존 (미설정 시 디스크 폭발)',
        '      ES_INDEX_ROLLOVER: "true"',
        '      ES_NUM_SHARDS: "3"',
        '      ES_NUM_REPLICAS: "1"',
        '    ports:',
        '      - "4317:4317"     # OTLP gRPC',
        '',
        '  jaeger-query:',
        '    image: jaegertracing/jaeger-query:1.60',
        '    environment:',
        '      SPAN_STORAGE_TYPE: elasticsearch',
        '      ES_SERVER_URLS: http://es:9200',

                           {mark:'changed', text:'저장량·비용 감소'} ] },
        code: { ...CODE.s5, highlight: [15,16,17,18] },
      },
      { ...S5, focus: 'pitfalls',
        beat: { label: '무엇이 남는가', at: 'tail-sampling.yaml L20',
                caption: '에러와 느린 요청은 전부, 정상은 일부만 남는다. 여기에 보존 기간과 카디널리티 관리를 더해야 운영이 안정된다.',
                changes: [ {mark:'read', text:'유실·비용·용량 균형'} ] },
        code: { ...CODE.s5, highlight: [20] },
      },
    ];

    // ─────────────────────────────────────────────────────────
    // 좌측 LiveDataPane — Jaeger 저장·조회·시각화
    // ─────────────────────────────────────────────────────────
    function LiveDataPane({ beat, step, stepIdx }) {
      const focus = step.focus;
      const animKey = `step-${stepIdx}`;
      const TOTAL = 120; // trace 총 길이(ms) — 타임라인 스케일

      const barCls = {
        sky: 'bg-sky-400', violet: 'bg-violet-400', emerald: 'bg-emerald-400',
        amber: 'bg-amber-400', rose: 'bg-rose-400',
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="otel-bg-light px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🔭</span>
              <span className="text-xs font-bold otel-text-dark">Jaeger — 분산 추적 블랙박스</span>
            </div>
            <span className="text-[10px] text-slate-600 font-mono">UI :16686 · CNCF</span>
          </div>

          <div className="p-4 space-y-3 min-h-[460px]" key={animKey}>

            {/* 서비스 -> OTLP -> Jaeger 파이프라인 (항상 표시) */}
            <div className="flex items-stretch gap-2">
              {/* 서비스들 */}
              <div className={`flex-1 rounded-lg border p-2 transition-all duration-500 ${focus === 'otlp' ? 'border-2 otel-border otel-bg-light' : 'border-slate-200 bg-slate-50'}`}>
                <div className="text-[10px] font-bold text-slate-500 mb-1">서비스 (SDK)</div>
                <div className="space-y-1">
                  {['frontend', 'api', 'payment'].map((s) => (
                    <div key={s} className="text-[10px] font-mono bg-white rounded border border-slate-200 px-1.5 py-0.5 flex items-center justify-between">
                      <span className="text-slate-700">{s}</span>
                      <span className="otel-text">span</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* OTLP 화살표 */}
              <div className="flex flex-col items-center justify-center px-1">
                <div className={`text-[9px] font-mono font-bold ${focus === 'otlp' ? 'otel-text-dark' : 'text-slate-400'}`}>OTLP</div>
                <div className={`text-2xl leading-none ${focus === 'otlp' ? 'otel-text' : 'text-slate-300'}`}>&rarr;</div>
                <div className={`text-[8px] font-mono ${focus === 'otlp' ? 'otel-text' : 'text-slate-400'}`}>:4317</div>
              </div>

              {/* Jaeger 3요소 */}
              <div className="flex-1 rounded-lg border-2 otel-border otel-bg-light p-2">
                <div className="text-[10px] font-bold otel-text-dark mb-1">Jaeger</div>
                <div className="space-y-1">
                  <JaegerBox label="collector" desc="수집·검증" on={['arch','otlp'].includes(focus)} />
                  <JaegerBox label="storage" desc="span 보관" on={['arch','storage'].includes(focus)} />
                  <JaegerBox label="query" desc="조회·UI" on={['arch','query','pitfalls'].includes(focus)} />
                </div>
              </div>
            </div>

            {/* 하단 동적 패널 */}
            {focus === 'arch' && (
              <div className="fade-in rounded-lg border border-slate-200 bg-white p-3">
                <div className="text-xs font-bold otel-text-dark mb-2">배포 모드</div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="rounded border border-slate-300 bg-slate-50 p-2">
                    <div className="text-[11px] font-bold text-slate-700">all-in-one</div>
                    <div className="text-[9px] text-slate-500 mt-0.5">3요소 한 프로세스 · memory · 개발/데모</div>
                  </div>
                  <div className="rounded border-2 otel-border otel-bg-light p-2">
                    <div className="text-[11px] font-bold otel-text-dark">production</div>
                    <div className="text-[9px] text-slate-600 mt-0.5">collector/query 분리 · ES/Cassandra · 독립 스케일</div>
                  </div>
                </div>
              </div>
            )}

            {focus === 'otlp' && (
              <div className="fade-in rounded-lg border border-slate-200 bg-white p-3">
                <div className="text-xs font-bold otel-text-dark mb-2">네이티브 OTLP 수신 (1.35+)</div>
                <div className="space-y-1.5 text-[11px] font-mono">
                  <div className="flex items-center gap-2"><span className="otel-bg text-white px-1.5 rounded">gRPC</span><span className="text-slate-600">:4317</span><span className="text-slate-400">— 고성능 push</span></div>
                  <div className="flex items-center gap-2"><span className="otel-bg-mid text-white px-1.5 rounded">HTTP</span><span className="text-slate-600">:4318</span><span className="text-slate-400">— 방화벽 친화적</span></div>
                </div>
                <div className="text-[9px] text-slate-500 mt-2">권장: 앱 &rarr; OTel Collector &rarr; Jaeger (백엔드 교체가 쉬움)</div>
              </div>
            )}

            {focus === 'storage' && (
              <div className="fade-in rounded-lg border border-slate-200 bg-white p-3">
                <div className="text-xs font-bold otel-text-dark mb-2">저장 백엔드 선택</div>
                <div className="space-y-1.5">
                  {[
                    { name: 'memory', use: '개발/데모', note: '재시작 시 전부 소실', bad: true },
                    { name: 'elasticsearch', use: '프로덕션', note: '태그 검색·필터 강함', bad: false },
                    { name: 'cassandra', use: '프로덕션', note: '높은 쓰기 처리량', bad: false },
                  ].map((b) => (
                    <div key={b.name} className={`flex items-center justify-between rounded border px-2 py-1 ${b.bad ? 'border-rose-300 bg-rose-50' : 'border-emerald-300 bg-emerald-50'}`}>
                      <span className="text-[11px] font-mono font-bold text-slate-700">{b.name}</span>
                      <span className="text-[9px] text-slate-500">{b.use}</span>
                      <span className={`text-[9px] font-bold ${b.bad ? 'text-rose-600' : 'text-emerald-700'}`}>{b.note}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {focus === 'query' && (
              <div className="fade-in rounded-lg border border-slate-200 bg-white p-3">
                <div className="flex items-center justify-between mb-2">
                  <div className="text-xs font-bold otel-text-dark">trace_id: 4bf92f…4736 — 타임라인</div>
                  <div className="text-[9px] font-mono text-slate-400">120ms</div>
                </div>
                <div className="space-y-1">
                  {TRACE.map((sp, i) => (
                    <div key={i} className="flex items-center gap-2">
                      <div className="w-24 shrink-0 text-[9px] font-mono text-slate-600 truncate" style={{ paddingLeft: sp.depth * 8 }}>{sp.op}</div>
                      <div className="relative flex-1 h-3 bg-slate-100 rounded">
                        <div className={`absolute h-3 rounded ${barCls[sp.color]}`}
                          style={{ left: (sp.start / TOTAL * 100) + '%', width: (sp.dur / TOTAL * 100) + '%' }}
                          title={sp.svc + ' ' + sp.dur + 'ms'}></div>
                      </div>
                      <div className="w-8 shrink-0 text-[8px] font-mono text-slate-400 text-right">{sp.dur}ms</div>
                    </div>
                  ))}
                </div>
                <div className="text-[9px] text-slate-500 mt-2">db.query INSERT 가 38ms — 이 구간이 병목. span 클릭 &rarr; 태그·에러 확인</div>
              </div>
            )}

            {focus === 'pitfalls' && (
              <div className="fade-in space-y-1.5">
                {[
                  { t: 'memory 프로덕션', d: '재시작·OOM 시 trace 전소 → ES/Cassandra 필수' },
                  { t: '샘플링 미설정', d: '저장량·비용 트래픽 비례 폭발 → tail sampling' },
                  { t: '보존 미설정', d: 'ILM/TTL 없으면 인덱스 무한 증가 → 디스크 폭발' },
                  { t: '카디널리티 폭발', d: 'op/태그에 user_id·URL → /users/{id} 로 템플릿화' },
                ].map((p) => (
                  <div key={p.t} className="flex items-start gap-2 rounded-lg border border-rose-200 bg-rose-50 p-2">
                    <span className="text-sm">⚠️</span>
                    <div>
                      <div className="text-[11px] font-bold text-rose-700">{p.t}</div>
                      <div className="text-[10px] text-slate-600 leading-snug">{p.d}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">
              {focus === 'arch'     && 'collector(쓰기) · storage(보관) · query(읽기·UI) 3요소'}
              {focus === 'otlp'     && '표준 OTLP 를 네이티브 수신 — 전용 프로토콜 불필요'}
              {focus === 'storage'  && '프로덕션은 ES/Cassandra — 보존 기간을 반드시 설정'}
              {focus === 'query'    && 'trace_id 로 조회 → waterfall 타임라인 → 느린 span 발견'}
              {focus === 'pitfalls' && '유실·비용·용량·카디널리티 — 4대 함정을 미리 막는다'}
            </div>
          </div>
        </div>
      );
    }

    function JaegerBox({ label, desc, on }) {
      return (
        <div className={`rounded border px-1.5 py-1 flex items-center justify-between transition-all duration-500 ${on ? 'border-2 otel-border bg-white shadow-sm scale-[1.02]' : 'border-slate-200 bg-white/60 opacity-60'}`}>
          <span className="text-[10px] font-mono font-bold text-slate-700">{label}</span>
          <span className="text-[8px] text-slate-500">{desc}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[30rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];
      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { animation: fadeIn 360ms ease-out; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="otel-text hover:otel-text-dark font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 otel-bg text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs otel-text-dark font-bold">Part IV. Exporter &amp; Backend &gt; Chapter 1 · IV-1-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Jaeger — Trace 백엔드</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                분산 추적을 저장하고 시각화하는 백엔드 — 여러 서비스의 span이 <strong>OTLP</strong>로 Jaeger에 저장되고,
                <code className="bg-slate-100 px-1 rounded text-xs mx-1">trace_id</code>로 조회하면
                <strong>타임라인·서비스맵</strong>으로 그려진다.
                <code className="bg-slate-100 px-1 rounded text-xs ml-1">collector</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">storage</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">query</code> 3요소를 다룬다.
              </p>
              {/* 진행바 */}
              <div className="mt-3 h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full otel-bg transition-all duration-500" style={{ width: progress + '%' }}></div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl otel-bg-dark text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl otel-bg-light border-2 otel-border otel-text-dark text-sm">
                💡 다음(IV-1-3)에서는 <strong>Grafana Tempo</strong> — 오브젝트 스토리지 기반의 저비용 대용량 trace 백엔드를 본다.
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold otel-bg text-white otel-hover transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="./IV-1-3.html" className="otel-text hover:otel-text-dark font-medium">IV-1-3 Grafana Tempo &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
