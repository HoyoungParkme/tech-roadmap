  <style>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-1-4. Loki — Log 백엔드 (Grafana 스택)
    학습 목표: OTel 로그를 라벨 기반으로 Loki에 저장하고, trace_id로 트레이스와 상관시키며,
               LogQL로 조회하고 Grafana(LGTM 스택)에서 로그와 트레이스를 왕복 이동한다.
    핵심 비유: "도서관 색인 카드" — 본문(로그)은 서가에 그대로 쌓고, 라벨(색인)만 인덱싱한다.
    패턴: fastapi 표준 — 좌(LGTM 상관 시각화) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────────
    // 5 STEPS — Loki 로그 백엔드 & LGTM 상관
    // ─────────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      ship: {lang: 'yaml', filename: 'otel-collector.yaml — 로그 파이프라인', lines: [
        '# OTel Collector — 로그 파이프라인 (OTLP 네이티브 전송)',
        '',
        '# lokiexporter(deprecated) 대신 Loki 3.0+ 의 /otlp 수신 사용',
        'exporters:',
        '  otlphttp/loki:',
        '    endpoint: http://loki:3100/otlp     # Loki OTLP 엔드포인트',
        '    tls: { insecure: true }',
        '    retry_on_failure: { enabled: true } # 백엔드 장애 흡수',
        '',
        'processors:',
        '  memory_limiter: { limit_mib: 512, check_interval: 1s }',
        '  batch: { timeout: 5s, send_batch_size: 1024 }',
        '',
        'service:',
        '  pipelines:',
        '    logs:',
        '      receivers:  [otlp]                # SDK가 OTLP로 push',
        '      processors: [memory_limiter, batch]',
        '      exporters:  [otlphttp/loki]       # Loki로 발송',
      ]},
      label: {lang: 'yaml', filename: 'loki-config.yaml — 라벨 vs 본문', lines: [
        '# Loki 설정 — 무엇을 인덱싱할지 결정 (라벨 vs 본문)',
        '',
        'limits_config:',
        '  # OTLP resource 속성 중 라벨로 승격할 것 (저카디널리티만!)',
        '  otlp_config:',
        '    resource_attributes:',
        '      attributes_config:',
        '        - action: index_label',
        '          attributes:',
        '            - service.name',
        '            - deployment.environment',
        '            - k8s.namespace.name',
        '  # 스트림당 라벨 수 상한 — 카디널리티 방어선',
        '  max_label_names_per_series: 15',
        '  # trace_id / user_id 처럼 값이 무한한 속성은 라벨 금지',
        '  # → structured_metadata 로 저장 (인덱스 폭발 방지)',
        '  allow_structured_metadata: true',
      ]},
      correlate: {lang: 'yaml', filename: 'log-record.yaml — trace context 주입', lines: [
        '# OTel 로그 레코드 — 활성 span의 trace context 자동 첨부',
        '# (SDK LoggingHandler / log appender 사용 시 자동)',
        'log_record:',
        '  body: "order created"',
        '  severity: INFO',
        '  trace_id: 4bf92f3577b34da6a3ce929d0e0e4736   # ← 자동 주입',
        '  span_id:  00f067aa0ba902b7',
        '  attributes:',
        '    service.name: checkout',
        '    user.id: u-8842                # 본문 속성 (라벨 아님)',
        '',
        '# Collector: trace_id 를 structured_metadata 로 (라벨 아님)',
        'processors:',
        '  transform:',
        '    log_statements:',
        '      - context: log',
        '        statements:',
        '          - set(attributes["trace_id"], trace_id.string)',
      ]},
      query: {lang: 'sql', filename: 'queries.logql — LogQL 조회', lines: [
        '-- LogQL: 라벨 셀렉터(인덱스)로 좁히고 → 필터로 파고든다',
        '',
        '-- (1) 라벨 셀렉터: 인덱스 사용, 스트림을 먼저 좁힌다',
        '{service_name="checkout", deployment_environment="prod"}',

            </div>
          )}

          <div className="otel-bg-light px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🗄️</span>
              <span className="text-xs font-bold otel-text-dark">LGTM 스택 — 로그↔트레이스 상관</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">Loki 3.x · Grafana · Tempo</span>
          </div>

          <div className="p-4 space-y-3 min-h-[460px]" key={animKey}>

            {/* LGTM 파이프라인 노드 5개 */}
            <div className="flex items-stretch justify-between gap-1">
              {NODES.map((n, i) => {
                const on = active.includes(n.key);
                return (
                  <React.Fragment key={n.key}>
                    <div className={`flex-1 rounded-lg border px-1.5 py-2 text-center transition-all duration-500 ${on ? 'otel-bg-light otel-border border-2 shadow-md scale-[1.03]' : 'bg-slate-50 border-slate-200 opacity-60'}`}>
                      <div className="text-lg leading-none">{n.icon}</div>
                      <div className={`text-[10px] font-bold mt-1 leading-tight ${on ? 'otel-text-dark' : 'text-slate-500'}`}>{n.label}</div>
                      <div className="text-[8px] text-slate-400 font-mono leading-tight truncate">{n.sub}</div>
                    </div>
                    {i < NODES.length - 1 && (
                      <div className={`self-center text-sm font-bold ${active.includes(n.key) && active.includes(NODES[i + 1].key) ? 'otel-text' : 'text-slate-300'}`}>
                        {n.key === 'grafana' ? '↔' : '→'}
                      </div>
                    )}
                  </React.Fragment>
                );
              })}
            </div>

            {/* 포커스별 디테일 카드 */}
            <div className="pt-1 fade-in" key={focus}>
              <FocusDetail focus={focus} />
            </div>

          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">
              {focus === 'ship'      && 'OTLP로 Loki /otlp 엔드포인트에 전송 — Collector가 batch·재시도로 흡수'}
              {focus === 'label'     && '라벨(색인)만 인덱싱, 본문은 그대로 저장 — 고카디널리티 라벨은 금물'}
              {focus === 'correlate' && 'trace_id는 라벨이 아닌 structured_metadata로 — 3신호 상관의 열쇠'}
              {focus === 'query'     && '라벨 셀렉터로 먼저 좁히고(빠름) → 파이프라인 필터로 파고든다(느림)'}
              {focus === 'grafana'   && 'derived field로 로그→Tempo 점프, tracesToLogsV2로 트레이스→로그 복귀'}
            </div>
          </div>
        </div>
      );
    }

    // ── 포커스별 상세 시각화
    function FocusDetail({ focus }) {
      if (focus === 'ship') {
        return (
          <div className="rounded-lg border border-slate-200 bg-slate-50 p-3">
            <div className="text-xs font-bold text-slate-700 mb-2">📦 전송 흐름 — OTLP HTTP push</div>
            <div className="space-y-2 text-[11px] font-mono">
              <div className="flex items-center gap-2">
                <span className="px-2 py-1 rounded bg-white border border-slate-200">batch(1024)</span>
                <span className="otel-text font-bold">→</span>
                <span className="px-2 py-1 rounded otel-bg-light otel-text-dark border otel-border font-bold">POST :3100/otlp</span>
                <span className="text-emerald-600 font-bold">200 OK</span>
              </div>
              <div className="text-[10px] text-slate-500 leading-snug font-sans">
                큐가 차 있어도 <strong>retry_on_failure</strong>가 Loki 재시작을 흡수한다. 앱은 Collector만 알면 되고, 백엔드 교체 시 앱 코드는 그대로다.
              </div>
            </div>
          </div>
        );
      }
      if (focus === 'label') {
        return (
          <div className="rounded-lg border border-slate-200 bg-white p-3">
            <div className="text-xs font-bold text-slate-700 mb-2">🏷️ 인덱싱되는 것 vs 아닌 것</div>
            <div className="grid grid-cols-2 gap-2 text-[10px]">
              <div className="rounded border border-emerald-300 bg-emerald-50 p-2">
                <div className="font-bold text-emerald-700 mb-1">라벨 = 인덱싱 O</div>
                <div className="font-mono text-emerald-800 space-y-0.5">
                  <div>service_name</div>
                  <div>environment</div>
                  <div>namespace</div>
                </div>
                <div className="mt-1 text-emerald-600 font-sans">저카디널리티만</div>
              </div>
              <div className="rounded border border-red-300 bg-red-50 p-2">
                <div className="font-bold text-red-700 mb-1">본문/메타 = 인덱싱 X</div>
                <div className="font-mono text-red-800 space-y-0.5">
                  <div>trace_id</div>
                  <div>user_id</div>
                  <div>log body</div>
                </div>
                <div className="mt-1 text-red-600 font-sans">라벨로 넣으면 폭발</div>
              </div>
            </div>
            <div className="mt-2 text-[10px] text-amber-700 bg-amber-50 border loki-border rounded px-2 py-1 leading-snug">
              ⚠️ 함정: trace_id를 라벨로 넣으면 요청마다 새 스트림 → 인덱스 폭발·쿼리 급감속
            </div>
          </div>
        );
      }
      if (focus === 'correlate') {
        return (
          <div className="rounded-lg border border-slate-200 bg-[#282c34] p-3 font-mono text-[11px]">
            <div className="text-slate-400 mb-2 font-sans font-bold text-xs">🧾 로그 레코드 (구조적 JSON)</div>
            <div className="space-y-0.5 text-slate-300">
              <div><span className="text-sky-300">"body"</span>: <span className="text-emerald-300">"order created"</span>,</div>
              <div><span className="text-sky-300">"severity"</span>: <span className="text-emerald-300">"INFO"</span>,</div>
              <div className="bg-amber-500/20 rounded px-1">
                <span className="text-amber-300">"trace_id"</span>: <span className="text-amber-200">"4bf92f...4736"</span>,
              </div>
              <div><span className="text-sky-300">"span_id"</span>: <span className="text-slate-300">"00f067aa0ba902b7"</span>,</div>
              <div><span className="text-sky-300">"service.name"</span>: <span className="text-emerald-300">"checkout"</span></div>
            </div>
            <div className="mt-2 text-[10px] text-slate-400 font-sans leading-snug">
              활성 span의 trace context가 자동 주입 → structured_metadata로 저장되어 라벨 카디널리티는 그대로.
            </div>
          </div>
        );
      }
      if (focus === 'query') {
        const rows = [
          { level: 'error', color: 'text-red-600 bg-red-50', msg: 'payment gateway timeout' },
          { level: 'error', color: 'text-red-600 bg-red-50', msg: 'retry exhausted (3/3)' },
          { level: 'warn',  color: 'text-amber-600 bg-amber-50', msg: 'slow query 1.2s' },
        ];
        return (
          <div className="rounded-lg border border-slate-200 bg-white p-3">
            <div className="text-[10px] font-mono bg-slate-800 text-slate-100 rounded px-2 py-1 mb-2 overflow-x-auto whitespace-nowrap">
              {'{service_name="checkout"} |= "error"'}
            </div>
            <div className="space-y-1">
              {rows.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] font-mono">
                  <span className={`px-1.5 py-0.5 rounded font-bold ${r.color}`}>{r.level}</span>
                  <span className="text-slate-600 truncate">{r.msg}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-slate-500 font-sans leading-snug">
              라벨 셀렉터가 스트림을 먼저 좁혀 스캔량을 줄인다. rate(...)로 감싸면 시계열 메트릭이 된다.
            </div>
          </div>
        );
      }
      // grafana
      return (
        <div className="rounded-lg border border-slate-200 bg-white p-3">
          <div className="text-xs font-bold text-slate-700 mb-2">🔗 로그 → 트레이스 점프</div>
          <div className="text-[10px] font-mono flex items-center gap-2 flex-wrap">
            <span className="px-1.5 py-0.5 rounded bg-red-50 text-red-600 font-bold">error</span>
            <span className="text-slate-600">timeout</span>
            <span className="px-1.5 py-0.5 rounded otel-bg text-white font-bold cursor-pointer">TraceID: 4bf92f</span>
            <span className="otel-text font-bold">→</span>
            <span className="px-1.5 py-0.5 rounded bg-violet-100 text-violet-700 border border-violet-300">Tempo</span>
          </div>
          <div className="mt-2 space-y-0.5">
            {[
              { w: 'w-full', name: 'checkout', color: 'bg-violet-400' },
              { w: 'w-3/4', name: 'payment', color: 'bg-violet-300' },
              { w: 'w-1/3', name: 'db.query', color: 'bg-red-400' },
            ].map((s, i) => (
              <div key={i} className="flex items-center gap-2">
                <span className="text-[9px] font-mono text-slate-500 w-16 shrink-0 truncate">{s.name}</span>
                <div className={`h-2 rounded ${s.w} ${s.color}`}></div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-500 font-sans leading-snug">
            derived field가 trace_id를 링크로 바꾼다. tracesToLogsV2로 역방향(트레이스→로그) 복귀도 가능.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[30rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];
      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { animation: fadeIn 360ms ease-out; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="otel-text hover:otel-text-dark font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-4</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 otel-bg text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. Exporter &amp; Backend &gt; Chapter 1. 백엔드</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Loki — Log 백엔드 (Grafana 스택)</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                로그를 <strong>라벨 기반</strong>으로 저장하고 <strong>trace와 연결</strong>한다.
                <code className="bg-slate-100 px-1 rounded text-xs ml-1">OTLP</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">라벨 인덱스</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">LogQL</code> /
                <code className="bg-slate-100 px-1 rounded text-xs">LGTM 상관</code> 으로 이어진다.
              </p>
              {/* 진행바 */}
              <div className="mt-3 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full otel-bg transition-all duration-500" style={{ width: `${progress}%` }}></div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LokiLiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl otel-bg-dark text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl otel-bg-light border-2 otel-border otel-text-dark text-sm">
                💡 다음 파트(Part V)에서는 <strong>수집한 텔레메트리를 실제로 활용</strong>한다 — 대시보드·알림·SLO로 이어진다.
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold otel-bg text-white otel-hover transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="otel-text hover:otel-text-dark font-medium">Part V. 활용 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
