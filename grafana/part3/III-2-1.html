<!DOCTYPE html>

<head>

  <title>Grafana 학습 — III-2-1. Multi-dimensional Alert</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔥</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      single: {lang:"yaml", filename:"01-single-series.yaml", lines:[
        "# Step 1. 단일 시리즈 알람",
        "# \"전체 평균\" 만 본다. 부분 장애 못 잡음.",
        "",
        "apiVersion: 1",
        "groups:",
        "  - name: cluster-avg",
        "    interval: 1m",
        "    rules:",
        "      - uid: cluster-cpu",
        "        title: 클러스터 평균 CPU 높음",
        "        condition: C",
        "        data:",
        "          - refId: A",
        "            datasourceUid: prom",
        "            model:",
        "              # by 없음 → 단일 시리즈",
        "              expr: |",
        "                avg(",
        "                  100 - rate(",
        "                    node_cpu_seconds_total{mode=\"idle\"}[5m]",
        "                  ) * 100",
        "                )",
        "          - refId: C",
        "            datasourceUid: __expr__",
        "            model:",
        "              type: threshold",
        "              expression: A",
        "              conditions:",
        "                - evaluator: { type: gt, params: [80] }",
        "        for: 5m",
        "        labels:",
        "          severity: warning",
        "        annotations:",
        "          summary: \"클러스터 평균 CPU > 80%\"",
        "",
        "# 문제",
        "#  3 인스턴스 중 1개만 95% 라도",
        "#  평균은 (95+30+30)/3 = 51.7% → 알람 안 옴",
        "#  그동안 1번 인스턴스에 몰린 사용자는 죽음",
        "",
        "# 언제 쓰는가",
        "#  - 정말 클러스터 전체를 보는 게 의미 있을 때",
        "#  - 비용 메트릭 같은 합산값",
        "#  - 대부분의 경우는 by (instance) 권장",
      ]},
      byInstance: {lang:"yaml", filename:"02-by-instance.yaml", lines:[
        "# Step 2. by (instance) — 인스턴스별 알람",
        "",
        "apiVersion: 1",
        "groups:",
        "  - name: per-instance",
        "    interval: 1m",
        "    rules:",
        "      - uid: cpu-per-instance",
        "        title: \"[{{ $labels.instance }}] CPU 높음\"",
        "        condition: C",
        "        data:",
        "          - refId: A",
        "            datasourceUid: prom",
        "            model:",
        "              expr: |",
        "                avg by (instance) (",
        "                  100 - rate(",
        "                    node_cpu_seconds_total{mode=\"idle\"}[5m]",
        "                  ) * 100",
        "                )",
        "          - refId: C",
        "            datasourceUid: __expr__",
        "            model:",
        "              type: threshold",
        "              expression: A",
        "              conditions:",
        "                - evaluator: { type: gt, params: [80] }",
        "        for: 5m",
        "",
        "        labels:",
        "          severity: warning",
        "          # 알람 인스턴스마다 host 라벨 다름",
        "          host: \"{{ $labels.instance }}\"",
        "        annotations:",
        "          summary: \"{{ $labels.instance }} CPU > 80%\"",
        "          description: |",
        "            현재 값: {{ humanize $values.A.Value }}%",
        "",
        "# 결과 (3 인스턴스)",
        "#   alert 1: instance=api-1  CPU=95%  → Firing",
        "#   alert 2: instance=api-2  CPU=35%  → Normal",
        "#   alert 3: instance=api-3  CPU=42%  → Normal",
        "#",
        "#   알람 1번만 Firing, 2/3은 그대로",
        "#",
        "# 장점",
        "#  - 부분 장애 즉시 포착",
        "#  - 어느 인스턴스 문제인지 라벨에 박힘",
        "#  - 해소도 인스턴스별 (1번만 회복)",
        "",
        "# 주의",
        "#  - 알람 수 폭증 가능",
        "#  - Notification에서 group_by로 묶기 필수",
      ]},
      multiDim: {lang:"yaml", filename:"03-multi-dimension.yaml", lines:[
        "# Step 3. 다차원 알람 — by (a, b, c)",
        "",
        "apiVersion: 1",
        "groups:",
        "  - name: multi-dim",
        "    interval: 1m",
        "    rules:",
        "      - uid: cpu-service-pod",
        "        title: \"[{{ $labels.service }}/{{ $labels.pod }}] CPU\"",
        "        condition: C",
        "        data:",
        "          - refId: A",
        "            datasourceUid: prom",
        "            model:",
        "              expr: |",
        "                avg by (service, instance, pod) (",
        "                  100 - rate(",
        "                    container_cpu_usage_seconds_total[5m]",
        "                  ) * 100",
        "                )",
        "          - refId: C",
        "            datasourceUid: __expr__",
        "            model:",
        "              type: threshold",
        "              expression: A",
        "              conditions:",
        "                - evaluator: { type: gt, params: [80] }",
        "        for: 5m",
        "",
        "        labels:",
        "          severity: warning",
        "          service: \"{{ $labels.service }}\"",
        "          pod: \"{{ $labels.pod }}\"",
        "        annotations:",
        "          summary: \"{{ $labels.service }}/{{ $labels.pod }} CPU 높음\"",
        "",

        "# Step 4. Math + Reduce + Threshold 결합",
        "",
        "apiVersion: 1",
        "groups:",
        "  - name: composite",
        "    interval: 1m",
        "    rules:",
        "      - uid: error-rate-pct",
        "        title: 에러율 6% 초과",
        "        condition: D",
        "",
        "        data:",
        "          # A — 전체 요청 수",
        "          - refId: A",
        "            datasourceUid: prom",
        "            model:",
        "              expr: |",
        "                sum(rate(http_requests_total[5m]))",
        "",
        "          # B — 5xx 요청 수",
        "          - refId: B",
        "            datasourceUid: prom",
        "            model:",
        "              expr: |",
        "                sum(rate(http_requests_total",
        "                  {status=~\"5..\"}[5m]))",
        "",
        "          # C — Math: B / A * 100",
        "          - refId: C",
        "            datasourceUid: __expr__",
        "            model:",
        "              type: math",
        "              expression: \"($B / $A) * 100\"",
        "",
        "          # D — Threshold(C) > 6",
        "          - refId: D",
        "            datasourceUid: __expr__",
        "            model:",
        "              type: threshold",
        "              expression: C",
        "              conditions:",
        "                - evaluator: { type: gt, params: [6] }",
        "",
        "        for: 5m",
        "        labels:",
        "          severity: warning",
        "        annotations:",
        "          summary: \"에러율 {{ humanize $values.C.Value }}%\"",

            {mark:"changed", text:"expr 한 줄"},
            {mark:"read", text:"job:http_error_ratio:5m"},
          ],
        },
        instances: [{"name":"job:http_error_ratio:5m","value":"pre-computed","fires":false}],
        groupBy: "expr = recording rule",
        alertCount: 1,
        verdict: "빠름",
        verdictTone: "good",
        keyPoint: "쿼리가 짧아지면 읽기도 쉽고 평가도 빠르다.",
        code:{...CODE.recording, highlight:[36,37,38,39,40,41,42,43]},
      },
      { ...S5,
        beat:{
          label:"임계 5% 판정",
          at:"05-recording-rule.yaml L44–50",
          caption:"threshold 가 기록된 비율을 0.05 와 비교한다. 0.07 이면 Firing.",
          changes:[
            {mark:"new", text:"threshold > 0.05"},
            {mark:"changed", text:"0.07 → Firing"},
          ],
        },
        instances: [{"name":"job:http_error_ratio:5m","value":0.07,"fires":true}],
        groupBy: "threshold(A) > 0.05",
        alertCount: 1,
        verdict: "임계 5%",
        verdictTone: "warn",
        keyPoint: "기록된 값은 비율(0~1)이라 퍼센트와 단위를 헷갈리지 않게 한다.",
        code:{...CODE.recording, highlight:[44,45,46,47,48,49,50]},
      },
      { ...S5,
        beat:{
          label:"세 가지 이점",
          at:"05-recording-rule.yaml L57–60",
          caption:"평가가 빠르고, 대시보드와 메트릭이 같아지고, 쿼리가 짧아진다.",
          changes:[
            {mark:"read", text:"평가 속도"},
            {mark:"read", text:"대시보드와 일관성"},
          ],
        },
        instances: [{"name":"평가 시간","value":"짧아짐","fires":false}],
        groupBy: "recording rule",
        alertCount: "fast",
        verdict: "이점",
        verdictTone: "good",
        keyPoint: "같은 메트릭을 대시보드와 알람이 함께 쓰면 숫자가 어긋나지 않는다.",
        code:{...CODE.recording, highlight:[57,58,59,60]},
      },
      { ...S5,
        beat:{
          label:"느릴 때 체크 순서",
          at:"05-recording-rule.yaml L67–71",
          caption:"Recording 미사용, 짧은 interval, 과한 차원, 느린 데이터소스 순으로 본다.",
          changes:[
            {mark:"read", text:"4단계 체크리스트"},
          ],
        },
        instances: [{"name":"job:http_err:rate5m","value":"pre-computed","fires":false}],
        groupBy: "recording rule",
        alertCount: "fast",
        verdict: "Recording",
        verdictTone: "good",
        keyPoint: "단일 → by (1차원) → Math/Reduce → Recording. 단계적으로 늘려간다.",
        summary: {"title":"Multi-dim Alert 가이드","rows":[{"metric":"단일","before":"avg(...)","after":"알람 1","delta":"부분 장애 놓침"},{"metric":"by 1차원","before":"by (instance)","after":"인스턴스별","delta":"기본 권장"},{"metric":"by N차원","before":"by (a,b,c)","after":"시계열 곱","delta":"폭발 주의"},{"metric":"Math","before":"A/B 비율","after":"복합 임계","delta":"강력"},{"metric":"Recording","before":"미리 계산","after":"빠른 평가","delta":"성능"}]},
        code:{...CODE.recording, highlight:[67,68,69,70,71]},
      },
    ];

    const TONE = {
      good:   { badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { badge: 'bg-amber-200 text-amber-800' },
      danger: { badge: 'bg-rose-200 text-rose-800' },
    };

    function InstanceMatrix({ instances }) {
      return (
        <div className="mt-2 rounded-lg border p-3 bg-white border-orange-200">
          <div className="font-bold text-xs mb-2" style={{ color: '#F46800' }}>시계열 / 알람 매트릭스</div>
          <div className="space-y-1">
            {instances.map((ins, i) => {
              const v = typeof ins.value === 'number' ? ins.value : null;
              const pct = v != null ? Math.min(100, v) : 0;
              return (
                <div key={i} className="flex items-center gap-2 text-[11px]">
                  <span className="w-32 truncate text-zinc-700 font-mono">{ins.name}</span>
                  <div className="flex-1 h-2 bg-zinc-100 rounded-full overflow-hidden">
                    <div className="h-full" style={{ width: `${pct}%`, backgroundColor: ins.fires ? '#C04000' : '#13aa52' }} />
                  </div>
                  <span className="w-16 text-right font-mono">{typeof ins.value === 'number' ? `${ins.value}` : ins.value}</span>
                  <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${ins.fires ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                    {ins.fires ? 'FIRING' : 'OK'}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function GroupCard({ state }) {
      return (
        <div className="rounded-lg border p-3 bg-orange-50 border-orange-200 text-xs">
          <div className="font-bold mb-1" style={{ color: '#F46800' }}>그루핑</div>
          <div className="text-zinc-700">PromQL: <code className="font-mono bg-white px-1 rounded">{state.groupBy}</code></div>
          <div className="text-zinc-700">알람 수: <b>{state.alertCount}</b></div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{ borderColor: '#F46800' }}>
          <div className="text-sm font-bold mb-2" style={{ color: '#F46800' }}>🔥 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-zinc-500 border-b border-zinc-200">
                <th className="py-1 pr-2">방식</th><th className="py-1 pr-2">표현</th><th className="py-1 pr-2">결과</th><th className="py-1">특징</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-orange-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-zinc-700">{r.after}</td>
                  <td className="py-1 font-bold" style={{ color: '#F46800' }}>{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#F4680040' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#F46800' }}>Multi-dim Alert</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <GroupCard state={state} />
          <InstanceMatrix instances={state.instances} />
          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs rounded p-2 border bg-orange-50 border-orange-200" style={{ color: '#C04000' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/25 border-l-2 border-orange-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap p-4 rounded-xl text-white shadow" style={{ backgroundColor: '#F46800' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white font-bold" style={{ color: '#F46800' }}>🔥</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter III-2-1. Multi-dimensional Alert</h1>
                <p className="text-sm text-orange-50">단일 · by · 다차원 · Math · Recording</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-white underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? '' : 'bg-orange-100'}`} style={i <= stepIdx ? { backgroundColor: '#F46800' } : {}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#C04000' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-50 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#C04000' : '#F46800' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 px-4 py-3 text-sm bg-white" style={{ borderColor: '#F46800', color: '#C04000' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                by (instance) 가 기본. 차원 늘릴수록 강력하지만 폭주 위험. Recording으로 평가 비용 절감.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['MultiDim', 'by', 'Math', 'Reduce', 'Recording'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border bg-orange-50 border-orange-300" style={{ color: '#F46800' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#F46800' }}>
              <a href="./III-1-2.html" className="underline hover:no-underline">← 이전: III-1-2 Notification</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 Silence →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
