  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      policy: {lang:"yaml", filename:"01-notification-policy.yaml", lines:[
        "# Step 1. 알림 라이프사이클 — 억제 없음",
        "# pending -> firing -> resolved, 전이마다 통지 발송",
        "",
        "apiVersion: 1",
        "policies:",
        "  - orgId: 1",
        "    receiver: slack-platform",
        "    group_by: [\"alertname\", \"team\"]",
        "    # 억제 설정 없음 -> 모든 firing 알람이 통지됨",
        "    mute_time_intervals: []",
        "    routes:",
        "      - receiver: slack-platform",
        "        matchers:",
        "          - team = platform",
        "",
        "# 알림 상태 전이 (Grafana Alerting)",
        "#   Normal   : 조건 미충족",
        "#   Pending  : 조건 충족, for 기간 대기 중",
        "#   Firing   : for 통과 -> 이때 통지 발송",
        "#   Resolved : 조건 해소 -> 해소 통지",
        "",
        "# 문제 상황",
        "#   계획된 점검(deploy, DB 마이그레이션) 중에도",
        "#   firing 이 그대로 발송 -> 담당자 피로 + 진짜 알람 묻힘",
        "#   해결책: Silence(일회성) / Mute Timing(정기)",
      ]},
      silence: {lang:"json", filename:"02-silence.json", lines:[
        "{",
        "  // POST /api/v2/silences  (Grafana 통합 Alerting)",
        "  \"matchers\": [",
        "    { \"name\": \"alertname\", \"value\": \"HighCPU\",  \"isRegex\": false },",
        "    { \"name\": \"team\",      \"value\": \"platform\", \"isRegex\": false }",
        "  ],",
        "",
        "  // 음소거 기간 — 반드시 명시 (핵심)",
        "  \"startsAt\": \"2026-08-11T14:00:00Z\",",
        "  \"endsAt\":   \"2026-08-11T16:00:00Z\",",
        "",
        "  \"createdBy\": \"oncall@corp.io\",",
        "  \"comment\":   \"DB 마이그레이션 점검 — JIRA-1234\"",
        "}",
        "",
        "// 동작",
        "//   매처에 걸린 firing 알람은 통지 안 됨 (상태: Suppressed)",
        "//   endsAt 이 지나면 자동 만료 -> 통지 재개",
        "",
        "// amtool 로 생성 (CLI)",
        "//   amtool silence add alertname=HighCPU team=platform \\",
        "//     --duration=2h --comment=\"점검\" --author=oncall",
        "",
        "// 언제 쓰나",
        "//   - 계획된 점검 / 배포 / 인프라 작업",
        "//   - 알람 폭주(스톰) 임시 진화",
        "//   - 이미 인지한 이슈의 재통지 차단",
        "",
        "// 원칙: 기간을 짧게 — 만료를 잊으면 영구 침묵",
      ]},
      matcherScope: {lang:"json", filename:"03-matcher-scope.json", lines:[
        "{",
        "  // 안티패턴 — 너무 넓은 매처",
        "  \"matchers\": [",
        "    { \"name\": \"team\", \"value\": \"platform\", \"isRegex\": false }",
        "  ],",
        "  \"endsAt\":  \"2026-08-18T00:00:00Z\",  // 게다가 7일",
        "  \"comment\": \"그냥 시끄러워서\"",
        "}",
        "",
        "// 결과: platform 팀의 모든 알람이 7일간 침묵",
        "//   점검과 무관한 OOMKilled, DiskFull 까지 묻힘",
        "//   -> 장애를 못 보고 지나침 (진짜 사고)",
        "",
        "// 좋은 매처 — 좁고 구체적",
        "{",
        "  \"matchers\": [",
        "    { \"name\": \"alertname\", \"value\": \"HighCPU\",    \"isRegex\": false },",
        "    { \"name\": \"instance\",  \"value\": \"db-01:9100\", \"isRegex\": false }",
        "  ],",
        "  \"endsAt\": \"2026-08-11T16:00:00Z\"   // 2시간",
        "}",
        "",
        "// 매처 설계 원칙",
        "//   1) alertname 은 거의 항상 포함 (대상 특정)",
        "//   2) instance / pod 로 범위 최소화",
        "//   3) isRegex 는 신중히 — team=~\".*\" 는 사고",
        "//   4) 기간은 작업 시간 + 약간의 버퍼만",
      ]},
      muteTiming: {lang:"yaml", filename:"04-mute-timing.yaml", lines:[
        "# Step 4. Mute Timing — 정기 시간대 음소거",
        "# Silence(일회성)와 달리 요일/시간대로 반복 적용",
        "",
        "apiVersion: 1",
        "mute_time_intervals:",
        "  - name: weekends-and-nights",
        "    time_intervals:",

      good:   { badge: 'bg-emerald-200 text-emerald-800' },

    // 라이프사이클 노드 (억제 판정이 가운데)
    const NODES = ['pending', 'firing', '억제 판정', '통지 / 억제', 'resolved'];
    const TICKS_PER_NODE = 12;
    const TOTAL_TICKS = NODES.length * TICKS_PER_NODE;

    function LifecycleTrack({ activeNode, muted }) {
      return (
        <div className="rounded-lg border p-3 bg-white border-orange-200">
          <div className="font-bold text-xs mb-2" style={{ color: '#F46800' }}>알림 라이프사이클</div>
          <div className="flex items-center gap-1">
            {NODES.map((label, i) => {
              const isActive = i === activeNode;
              const isOutcome = i === 3;
              let bg = '#f4f4f5', fg = '#71717a', dot = '#d4d4d8';
              if (isActive) {
                if (isOutcome) {
                  bg = muted ? '#e5e7eb' : '#dcfce7';
                  fg = muted ? '#4b5563' : '#166534';
                  dot = muted ? '#9ca3af' : '#16a34a';
                } else {
                  bg = '#ffedd5'; fg = '#B84F00'; dot = '#F46800';
                }
              }
              const text = isOutcome ? (muted ? '🔕 억제됨' : '📨 통지') : label;
              return (
                <React.Fragment key={i}>
                  <div className="flex-1 rounded px-1 py-1.5 text-center transition" style={{ backgroundColor: bg }}>
                    <div className="mx-auto mb-1 w-2 h-2 rounded-full" style={{ backgroundColor: dot }} />
                    <div className="text-[9px] font-bold font-mono leading-tight" style={{ color: fg }}>{text}</div>
                  </div>
                  {i < NODES.length - 1 && <span className="text-[10px]" style={{ color: activeNode > i ? '#F46800' : '#d4d4d8' }}>▸</span>}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    function SuppressGate({ state }) {
      const map = {
        none:    { icon: '🔔', tint: '#fff7ed', bd: '#fed7aa', fg: '#B84F00' },
        silence: { icon: '🔕', tint: '#ecfdf5', bd: '#a7f3d0', fg: '#047857' },
        mute:    { icon: '🌙', tint: '#eef2ff', bd: '#c7d2fe', fg: '#4338ca' },
        danger:  { icon: '⚠️', tint: '#fff1f2', bd: '#fecdd3', fg: '#be123c' },
        expired: { icon: '⏰', tint: '#fff7ed', bd: '#fed7aa', fg: '#B84F00' },
      };
      const s = map[state.suppressType] || map.none;
      return (
        <div className="mt-2 rounded-lg border p-3 text-xs" style={{ backgroundColor: s.tint, borderColor: s.bd }}>
          <div className="flex items-center gap-2 mb-1">
            <span className="text-base">{s.icon}</span>
            <span className="font-bold" style={{ color: s.fg }}>억제 게이트</span>
            <span className="ml-auto font-mono text-[10px] px-1.5 py-0.5 rounded bg-white" style={{ color: s.fg }}>⏱ {state.clock}</span>
          </div>
          <code className="block font-mono text-[10.5px] break-all" style={{ color: s.fg }}>{state.suppressLabel}</code>
        </div>
      );
    }

    function AlertList({ alerts, focusIdx }) {
      return (

          <div className="font-bold text-xs mb-2" style={{ color: '#F46800' }}>발생한 알림</div>
          <div className="space-y-1.5">

              const focused = i === focusIdx;
              return (
                <div key={i} className="flex items-center gap-2 rounded px-2 py-1.5 transition"

                  <span className="w-24 truncate font-mono text-[11px] font-bold text-zinc-800">{a.name}</span>
                  <span className="w-28 truncate font-mono text-[10px] text-zinc-500">{a.labels}</span>
                  <span className="flex-1 truncate text-[10px]" style={{ color: a.muted ? '#6b7280' : '#166534' }}>{a.reason}</span>
                  <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${a.muted ? 'bg-zinc-200 text-zinc-600' : 'bg-emerald-100 text-emerald-700'}`}>
                    {a.muted ? '🔕 MUTED' : '📨 SENT'}

            })}
          </div>
        </div>
      );

      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{ borderColor: '#F46800' }}>
          <div className="text-sm font-bold mb-2" style={{ color: '#F46800' }}>🔕 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-zinc-500 border-b border-zinc-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">Silence</th><th className="py-1 pr-2">Mute Timing</th><th className="py-1">포인트</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-orange-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-zinc-700 font-mono">{r.after}</td>
                  <td className="py-1 font-bold" style={{ color: '#F46800' }}>{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const [tick, setTick] = useState(0);
      const [loop, setLoop] = useState(0);

      // 스텝이 바뀌면 애니메이션 초기화
      useEffect(() => { setTick(0); setLoop(0); }, [state]);

      useEffect(() => {
        const id = setInterval(() => {
          setTick((prev) => {
            const next = prev + 1;
            if (next >= TOTAL_TICKS) { setLoop((l) => l + 1); return 0; }
            return next;
          });
        }, 70);
        return () => clearInterval(id);
      }, [state]);

      const activeNode = Math.floor(tick / TICKS_PER_NODE);
      const focusIdx = state.alerts.length ? loop % state.alerts.length : 0;
      const focusMuted = state.alerts.length ? state.alerts[focusIdx].muted : false;

      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#F4680040' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#F46800' }}>Silence &amp; Mute</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <LifecycleTrack activeNode={activeNode} muted={focusMuted} />
          <SuppressGate state={state} />
          <AlertList alerts={state.alerts} focusIdx={focusIdx} />
          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs rounded p-2 border bg-orange-50 border-orange-200" style={{ color: '#C04000' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/25 border-l-2 border-orange-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap p-4 rounded-xl text-white shadow" style={{ backgroundColor: '#F46800' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-xl" style={{ color: '#F46800' }}>🔕</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-white/25">Part III · 알림</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/25">III-2-2</span>
                </div>
                <h1 className="text-2xl font-bold">Silence &amp; Mute — 알림 억제</h1>
                <p className="text-sm text-orange-50">점검·유지보수 시 알림을 일시 중지</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-white underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? '' : 'bg-orange-100'}`} style={i <= stepIdx ? { backgroundColor: '#F46800' } : {}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#C04000' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-50 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#C04000' : '#F46800' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 px-4 py-3 text-sm bg-white" style={{ borderColor: '#F46800', color: '#C04000' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Silence는 라벨 매처 + 기간으로 대상만 정확히 끄고, Mute Timing은 요일·시간대로 반복 억제한다. 매처는 좁게, 기간은 짧게, warning만 mute하고 critical은 항상 통지하며, 점검이 끝나면 즉시 expire해서 영구 침묵을 막는다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Silence', 'MuteTiming', 'Matcher', 'endsAt', 'Suppressed', 'amtool'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border bg-orange-50 border-orange-300" style={{ color: '#F46800' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#F46800' }}>
              <a href="./III-2-1.html" className="underline hover:no-underline">← 이전: III-2-1 Multi-dim Alert</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: Part IV IV-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
