    const TONE = {
      good:   { badge: 'bg-emerald-200 text-emerald-800' },

      danger: { badge: 'bg-rose-200 text-rose-800' },
    };

    // 라이프사이클 노드 (억제 판정이 가운데)
    const NODES = ['pending', 'firing', '억제 판정', '통지 / 억제', 'resolved'];
    const TICKS_PER_NODE = 12;
    const TOTAL_TICKS = NODES.length * TICKS_PER_NODE;

    function LifecycleTrack({ activeNode, muted }) {
      return (
        <div className="rounded-lg border p-3 bg-white border-orange-200">
          <div className="font-bold text-xs mb-2" style={{ color: '#F46800' }}>알림 라이프사이클</div>
          <div className="flex items-center gap-1">
            {NODES.map((label, i) => {
              const isActive = i === activeNode;
              const isOutcome = i === 3;
              let bg = '#f4f4f5', fg = '#71717a', dot = '#d4d4d8';
              if (isActive) {
                if (isOutcome) {
                  bg = muted ? '#e5e7eb' : '#dcfce7';
                  fg = muted ? '#4b5563' : '#166534';
                  dot = muted ? '#9ca3af' : '#16a34a';
                } else {
                  bg = '#ffedd5'; fg = '#B84F00'; dot = '#F46800';
                }
              }
              const text = isOutcome ? (muted ? '🔕 억제됨' : '📨 통지') : label;
              return (
                <React.Fragment key={i}>
                  <div className="flex-1 rounded px-1 py-1.5 text-center transition" style={{ backgroundColor: bg }}>
                    <div className="mx-auto mb-1 w-2 h-2 rounded-full" style={{ backgroundColor: dot }} />
                    <div className="text-[9px] font-bold font-mono leading-tight" style={{ color: fg }}>{text}</div>
                  </div>
                  {i < NODES.length - 1 && <span className="text-[10px]" style={{ color: activeNode > i ? '#F46800' : '#d4d4d8' }}>▸</span>}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    function SuppressGate({ state }) {
      const map = {
        none:    { icon: '🔔', tint: '#fff7ed', bd: '#fed7aa', fg: '#B84F00' },
        silence: { icon: '🔕', tint: '#ecfdf5', bd: '#a7f3d0', fg: '#047857' },
        mute:    { icon: '🌙', tint: '#eef2ff', bd: '#c7d2fe', fg: '#4338ca' },
        danger:  { icon: '⚠️', tint: '#fff1f2', bd: '#fecdd3', fg: '#be123c' },
        expired: { icon: '⏰', tint: '#fff7ed', bd: '#fed7aa', fg: '#B84F00' },
      };
      const s = map[state.suppressType] || map.none;
      return (
        <div className="mt-2 rounded-lg border p-3 text-xs" style={{ backgroundColor: s.tint, borderColor: s.bd }}>
          <div className="flex items-center gap-2 mb-1">
            <span className="text-base">{s.icon}</span>
            <span className="font-bold" style={{ color: s.fg }}>억제 게이트</span>
            <span className="ml-auto font-mono text-[10px] px-1.5 py-0.5 rounded bg-white" style={{ color: s.fg }}>⏱ {state.clock}</span>
          </div>
          <code className="block font-mono text-[10.5px] break-all" style={{ color: s.fg }}>{state.suppressLabel}</code>
        </div>
      );
    }

    function AlertList({ alerts, focusIdx }) {
      return (
        <div className="mt-2 rounded-lg border p-3 bg-white border-orange-200">
          <div className="font-bold text-xs mb-2" style={{ color: '#F46800' }}>발생한 알림</div>
          <div className="space-y-1.5">
            {alerts.map((a, i) => {
              const focused = i === focusIdx;
              return (
                <div key={i} className="flex items-center gap-2 rounded px-2 py-1.5 transition"
                  style={{ backgroundColor: focused ? '#fff7ed' : '#fafafa', boxShadow: focused ? '0 0 0 2px #F4680055' : 'none' }}>
                  <span className="w-24 truncate font-mono text-[11px] font-bold text-zinc-800">{a.name}</span>
                  <span className="w-28 truncate font-mono text-[10px] text-zinc-500">{a.labels}</span>
                  <span className="flex-1 truncate text-[10px]" style={{ color: a.muted ? '#6b7280' : '#166534' }}>{a.reason}</span>
                  <span className={`px-1.5 py-0.5 rounded text-[9px] font-bold ${a.muted ? 'bg-zinc-200 text-zinc-600' : 'bg-emerald-100 text-emerald-700'}`}>
                    {a.muted ? '🔕 MUTED' : '📨 SENT'}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{ borderColor: '#F46800' }}>
          <div className="text-sm font-bold mb-2" style={{ color: '#F46800' }}>🔕 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-zinc-500 border-b border-zinc-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">Silence</th><th className="py-1 pr-2">Mute Timing</th><th className="py-1">포인트</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-orange-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-zinc-700 font-mono">{r.after}</td>
                  <td className="py-1 font-bold" style={{ color: '#F46800' }}>{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const [tick, setTick] = useState(0);
      const [loop, setLoop] = useState(0);

      // 스텝이 바뀌면 애니메이션 초기화
      useEffect(() => { setTick(0); setLoop(0); }, [state]);

      useEffect(() => {
        const id = setInterval(() => {
          setTick((prev) => {
            const next = prev + 1;
            if (next >= TOTAL_TICKS) { setLoop((l) => l + 1); return 0; }
            return next;
          });
        }, 70);
        return () => clearInterval(id);
      }, [state]);

      const activeNode = Math.floor(tick / TICKS_PER_NODE);
      const focusIdx = state.alerts.length ? loop % state.alerts.length : 0;
      const focusMuted = state.alerts.length ? state.alerts[focusIdx].muted : false;

      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#F4680040' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#F46800' }}>Silence &amp; Mute</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <LifecycleTrack activeNode={activeNode} muted={focusMuted} />
          <SuppressGate state={state} />
          <AlertList alerts={state.alerts} focusIdx={focusIdx} />
          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs rounded p-2 border bg-orange-50 border-orange-200" style={{ color: '#C04000' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-orange-500/25 border-l-2 border-orange-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap p-4 rounded-xl text-white shadow" style={{ backgroundColor: '#F46800' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-xl" style={{ color: '#F46800' }}>🔕</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-white/25">Part III · 알림</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-white/25">III-2-2</span>
                </div>
                <h1 className="text-2xl font-bold">Silence &amp; Mute — 알림 억제</h1>
                <p className="text-sm text-orange-50">점검·유지보수 시 알림을 일시 중지</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-white underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? '' : 'bg-orange-100'}`} style={i <= stepIdx ? { backgroundColor: '#F46800' } : {}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#C04000' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-50 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#C04000' : '#F46800' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 px-4 py-3 text-sm bg-white" style={{ borderColor: '#F46800', color: '#C04000' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Silence는 라벨 매처 + 기간으로 대상만 정확히 끄고, Mute Timing은 요일·시간대로 반복 억제한다. 매처는 좁게, 기간은 짧게, warning만 mute하고 critical은 항상 통지하며, 점검이 끝나면 즉시 expire해서 영구 침묵을 막는다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Silence', 'MuteTiming', 'Matcher', 'endsAt', 'Suppressed', 'amtool'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border bg-orange-50 border-orange-300" style={{ color: '#F46800' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#F46800' }}>
              <a href="./III-2-1.html" className="underline hover:no-underline">← 이전: III-2-1 Multi-dim Alert</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: Part IV IV-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
