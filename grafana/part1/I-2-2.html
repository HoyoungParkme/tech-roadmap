<body>
  <div id="root"></div>

  <!--
    I-2-2. Data Source — 데이터 소스 추상화 — fastapi v1 패턴
    학습 목표: Data Source = Grafana가 데이터를 가져오는 백엔드. 플러그인 기반.
      각 소스별 쿼리 언어(PromQL/LogQL/SQL)를 통일된 인터페이스로 추상화.
    핵심 비유: "여러 나라 콘센트를 하나의 멀티 어댑터로" — 소스마다 규격이 달라도 Grafana가 변환
    패턴: 좌(LiveDataPane: 소스→추상화→패널 데이터 흐름 애니메이션) / 우(VSCode datasource.yml/json)
    색상: #F46800 (Grafana brand orange)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. Data Source란 — "Grafana는 데이터를 저장하지 않는다"',
        desc: 'Grafana는 자체 데이터베이스가 아니다. 지표는 Prometheus, 로그는 Loki, 업무 데이터는 PostgreSQL·MySQL 같은 외부 백엔드에 있고, Grafana는 그 앞에 붙어 데이터를 가져와 그리는 뷰 계층이다. 이 백엔드 하나하나가 Data Source이며, 각 소스는 플러그인으로 연결된다. 그래서 "지금 이 숫자가 어디서 왔나"를 늘 소스 단위로 추적할 수 있어야 오답을 피한다.',
        sources: [
          { key: 'prom', on: true },
        ],
        stage: 'intro',
        keyPoint: 'Grafana = 뷰 계층. 실제 데이터는 외부 백엔드(Data Source)에 있고 플러그인으로 연결.',
        code: {
          lang: 'yaml',
          filename: 'provisioning/datasources.yml — 첫 데이터 소스',
          lines: [
            '# Grafana는 데이터를 저장하지 않는다.',
            '# 외부 백엔드를 Data Source로 "연결"만 한다.',
            'apiVersion: 1',
            '',
            'datasources:',
            '  # Prometheus = 지표(metric) 백엔드',
            '  - name: Prometheus',
            '    type: prometheus          # 플러그인 식별자',
            '    uid: prom-default         # 패널이 참조하는 영구 ID',
            '    access: proxy             # Grafana 서버가 대신 호출',
            '    url: http://prometheus:9090',
            '    isDefault: true           # 기본 데이터 소스',
            '',
            '# access 모드',
            '#   proxy  : 브라우저 → Grafana 서버 → 백엔드 (권장)',
            '#            백엔드 주소·인증이 브라우저에 노출되지 않음',
            '#   direct : 브라우저가 백엔드를 직접 호출 (거의 안 씀)',
            '',
            '# uid 는 이름이 바뀌어도 유지 → 패널은 uid 로 소스를 가리킨다',
          ],
          highlight: [7, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 2. 연결 설정과 Test — "URL·인증을 맞추고 초록불 확인"',
        desc: '데이터 소스를 붙이려면 URL과 인증 정보가 필요하다. Prometheus는 보통 URL만, SQL은 host·db·user·password, 클라우드(CloudWatch 등)는 키가 필요하다. 설정 화면의 "Save & Test" 버튼이 실제로 백엔드에 핑을 보내 초록불이 떠야 연결이 검증된 것이다. 여기서 자주 막히는 원인은 네트워크 도달 불가, 잘못된 인증, 그리고 연결 타임아웃(방화벽·느린 쿼리)이다.',
        sources: [
          { key: 'prom', on: true },
          { key: 'sql', on: true },
        ],
        stage: 'connect',
        keyPoint: '연결 = URL + 인증. "Save & Test"로 초록불을 확인해야 실제 도달을 검증한 것.',
        code: {
          lang: 'yaml',
          filename: 'provisioning/datasources.yml — 인증·타임아웃',
          lines: [
            'apiVersion: 1',
            'datasources:',
            '  - name: Prometheus',
            '    type: prometheus',
            '    uid: prom-default',
            '    url: http://prometheus:9090',
            '    isDefault: true',
            '    jsonData:',
            '      httpMethod: POST',
            '      timeout: 30             # 초 단위 연결/쿼리 타임아웃',
            '',
            '  # PostgreSQL = 업무 데이터 백엔드',
            '  - name: AppDB',
            '    type: postgres',
            '    uid: appdb',
            '    url: postgres:5432',
            '    user: grafana_ro          # 읽기 전용 계정 권장',
            '    jsonData:',
            '      database: app',
            '      sslmode: require',
            '    secureJsonData:',
            '      password: ${APP_DB_PASSWORD}   # env 로 주입, 평문 금지',
            '',
            '# 함정: password 를 yaml 에 그대로 쓰면 git 에 노출된다.',
            '#   → secureJsonData + 환경변수(${...}) 로만 주입할 것.',
            '# 함정: timeout 이 짧으면 무거운 쿼리가 매번 실패한다.',
          ],
          highlight: [16, 17, 20, 21, 22],
        },
      },
      {
        title: 'Step 3. 쿼리 언어 추상화 — "소스마다 언어가 다르다"',
        desc: '소스마다 데이터를 꺼내는 언어가 다르다. Prometheus는 PromQL, Loki는 LogQL, SQL 계열은 SQL이다. Grafana는 이 서로 다른 언어를 각 소스의 query editor로 감싸고, 결과를 공통 데이터 프레임(시간·값의 표)으로 변환해 패널에 넘긴다. 덕분에 패널·시각화 코드는 소스가 무엇이든 동일하게 동작한다. 실무 함정은 언어 혼동이다 — PromQL 문법을 SQL 소스에 쓰면 곧바로 에러가 난다.',
        sources: [
          { key: 'prom', on: true },
          { key: 'loki', on: true },
          { key: 'sql', on: true },
        ],
        stage: 'abstract',
        keyPoint: 'PromQL·LogQL·SQL → Grafana가 공통 데이터 프레임으로 변환 → 패널은 소스 무관하게 동일.',
        code: {
          lang: 'json',
          filename: 'dashboard.json — 소스별 쿼리, 같은 패널 구조',
          lines: [
            '{',
            '  "panels": [',
            '    {',
            '      "title": "지표 (Prometheus)",',
            '      "datasource": { "type": "prometheus", "uid": "prom-default" },',
            '      "targets": [{ "refId": "A",',
            '        "expr": "rate(http_requests_total[5m])"',
            '      }]',
            '    },',
            '    {',
            '      "title": "로그 (Loki)",',
            '      "datasource": { "type": "loki", "uid": "loki-default" },',
            '      "targets": [{ "refId": "A",',
            '        "expr": "{app=\\"api\\"} |= \\"error\\""',
            '      }]',
            '    },',
            '    {',
            '      "title": "주문 수 (PostgreSQL)",',
            '      "datasource": { "type": "postgres", "uid": "appdb" },',
            '      "targets": [{ "refId": "A", "format": "time_series",',
            '        "rawSql": "SELECT $__timeGroup(created_at,$__interval) AS time, count(*) FROM orders GROUP BY 1"',
            '      }]',
            '    }',
            '  ]',
            '}',
            '',
            '// 세 패널의 구조는 동일: datasource + targets.',
            '// 다른 것은 쿼리 언어(expr/rawSql)뿐 → 추상화의 핵심.',
          ],
          highlight: [5, 6, 7, 12, 13, 14, 19, 20, 21],
        },
      },
      {
        title: 'Step 4. Mixed 데이터 소스 — "한 패널에 여러 소스"',
        desc: '한 패널 안에서 여러 데이터 소스를 동시에 쓸 수도 있다. datasource를 특수 값 "-- Mixed --"로 두면, 각 target이 자기 소스를 따로 지정한다. 배포 이벤트(SQL)를 지표 그래프(Prometheus) 위에 겹쳐 상관관계를 보는 식이다. 단, 소스마다 응답 속도가 다르므로 가장 느린 쿼리가 패널 전체의 로딩 시간을 결정한다는 점을 기억해야 한다.',
        sources: [
          { key: 'prom', on: true },
          { key: 'loki', on: true },
          { key: 'sql', on: true },
        ],
        stage: 'mixed',
        keyPoint: 'Mixed = 한 패널에 여러 소스. target마다 소스 지정. 가장 느린 쿼리가 로딩을 좌우.',
        code: {
          lang: 'json',
          filename: 'dashboard.json — Mixed 데이터 소스',
          lines: [
            '{',
            '  "title": "배포 상관관계 패널",',
            '  "type": "timeseries",',
            '',
            '  // 패널 소스를 Mixed 로 → target 별로 소스 지정',
            '  "datasource": { "type": "datasource", "uid": "-- Mixed --" },',
            '',
            '  "targets": [',
            '    {',
            '      "refId": "A",',
            '      "datasource": { "type": "prometheus", "uid": "prom-default" },',
            '      "expr": "rate(http_requests_total[5m])"',
            '    },',
            '    {',
            '      "refId": "B",',
            '      "datasource": { "type": "postgres", "uid": "appdb" },',
            '      "rawSql": "SELECT deployed_at AS time, version FROM deploys"',
            '    }',
            '  ]',
            '}',
            '',
            '// A(지표)와 B(배포 이벤트)를 한 그래프에 겹침.',
            '// 주의: B가 느리면 A가 준비돼도 패널은 B를 기다린다.',
          ],
          highlight: [6, 11, 12, 16, 17],
        },
      },
      {
        title: 'Step 5. 변수로 소스 전환 — "dev·prod를 한 보드에서"',
        desc: 'datasource 타입 변수를 만들면 우상단 드롭다운으로 데이터 소스를 통째로 바꿀 수 있다. 같은 보드를 dev·staging·prod Prometheus에 재사용하는 전형적 패턴이다. 패널은 하드코딩된 uid 대신 ${ds} 변수를 참조한다. 실무 함정은 권한이다 — 소스 전환은 되지만 사용자에게 그 소스 조회 권한이 없으면 빈 패널이 뜬다. 소스 권한(RBAC)과 변수는 항상 같이 점검해야 한다.',
        sources: [
          { key: 'prom', on: true },
          { key: 'loki', on: true },
          { key: 'sql', on: true },
        ],
        stage: 'variable',
        summary: {
          title: 'Data Source 5가지 핵심',
          points: [
            'Grafana는 저장하지 않는다 — 외부 백엔드를 플러그인으로 연결',
            '연결 = URL + 인증, "Save & Test" 초록불로 도달 검증',
            'PromQL·LogQL·SQL → 공통 데이터 프레임으로 추상화',
            'Mixed = 한 패널 여러 소스, 가장 느린 쿼리가 로딩 좌우',
            '변수로 소스 전환 — 인증 노출·소스 권한(RBAC)을 함께 점검',
          ],
        },
        keyPoint: 'datasource 변수로 dev·prod 전환. 단, 소스 조회 권한(RBAC)이 없으면 빈 패널.',
        code: {
          lang: 'json',
          filename: 'dashboard.json — datasource 변수',
          lines: [
            '{',
            '  "templating": {',
            '    "list": [',
            '      {',
            '        "name": "ds",',
            '        "type": "datasource",       // 소스 목록을 드롭다운으로',
            '        "query": "prometheus",      // prometheus 타입만 후보',
            '        "current": { "text": "Prometheus prod" }',
            '      }',
            '    ]',
            '  },',
            '',
            '  "panels": [',
            '    {',
            '      "title": "요청량",',
            '      // 하드코딩 uid 대신 변수 참조',
            '      "datasource": { "type": "prometheus", "uid": "${ds}" },',
            '      "targets": [{ "refId": "A",',
            '        "expr": "rate(http_requests_total[5m])"',
            '      }]',
            '    }',
            '  ]',
            '}',
            '',
            '// 드롭다운으로 dev/staging/prod Prometheus 전환.',
            '// 함정: 전환은 되지만 그 소스 조회 권한이 없으면 빈 패널.',
            '//   → datasource 변수 + RBAC 권한을 항상 같이 점검.',
          ],
          highlight: [5, 6, 7, 16, 17],
        },
      },
    ];

    // ── 데이터 소스 메타 (색·아이콘·쿼리 언어)
    const SOURCE_META = {
      prom: { name: 'Prometheus', lang: 'PromQL', color: '#E6522C', icon: '🔥', sample: 'rate(http_requests_total[5m])' },
      loki: { name: 'Loki',       lang: 'LogQL',  color: '#F2C94C', icon: '📜', sample: '{app="api"} |= "error"' },
      sql:  { name: 'PostgreSQL', lang: 'SQL',    color: '#336791', icon: '🗄️', sample: 'SELECT count(*) FROM orders' },
    };

    // ── 좌측: 소스 → 추상화 → 패널 데이터 흐름
    function LiveDataPane({ step }) {
      const active = step.sources.filter((s) => s.on).map((s) => s.key);
      const meta = active.map((k) => ({ key: k, ...SOURCE_META[k] }));
      const isMixed = step.stage === 'mixed';
      const isVariable = step.stage === 'variable';
      const isAbstract = step.stage === 'abstract' || isMixed || isVariable;

      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">🔌</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">Data Sources</span>
            {isVariable && (
              <span className="ml-auto text-[10px] text-slate-300 font-mono flex items-center gap-1">
                ds:
                <span className="px-1.5 py-0.5 rounded bg-slate-700 text-orange-300">Prometheus prod ▾</span>
              </span>
            )}
            {!isVariable && (
              <span className="ml-auto text-[10px] text-slate-400 font-mono">{active.length} connected</span>
            )}
          </div>

          {/* 본체: 3열 (소스 / 추상화 / 패널) */}
          <div className="flex-1 p-3 bg-slate-100">
            <div className="flex items-stretch gap-2 h-full">
              {/* 좌: 데이터 소스들 */}
              <div className="flex flex-col justify-center gap-2 w-2/5">
                <div className="text-[10px] font-bold text-slate-500 text-center mb-0.5">외부 백엔드</div>
                {meta.map((m) => (
                  <div key={m.key} className="rounded-lg border bg-white shadow-sm overflow-hidden"
                    style={{ borderColor: m.color }}>
                    <div className="px-2 py-1 flex items-center gap-1.5" style={{ backgroundColor: m.color + '22' }}>
                      <span>{m.icon}</span>
                      <span className="text-[11px] font-bold text-slate-800">{m.name}</span>
                      <span className="ml-auto text-[9px] font-mono px-1 rounded"
                        style={{ backgroundColor: m.color, color: '#fff' }}>{m.lang}</span>
                    </div>
                    <div className="px-2 py-1 text-[9px] font-mono text-slate-500 truncate">{m.sample}</div>
                  </div>
                ))}
                {step.stage === 'connect' && (
                  <div className="text-[9px] text-center text-emerald-600 font-bold flex items-center justify-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
                    Save &amp; Test — 초록불
                  </div>
                )}
              </div>

              {/* 중: 흐름 화살표 + 추상화 계층 */}
              <div className="flex flex-col items-center justify-center w-1/5">
                <svg viewBox="0 0 60 120" className="w-full h-24" preserveAspectRatio="none">
                  {meta.map((m, i) => {
                    const y1 = (120 / (meta.length + 1)) * (i + 1);
                    return (
                      <line key={m.key} x1="0" y1={y1} x2="58" y2="60"
                        stroke={m.color} strokeWidth="2.5"
                        className={isAbstract ? 'dash-move' : ''} />
                    );
                  })}
                </svg>
                <div className="rounded-lg px-2 py-1.5 text-center shadow"
                  style={{ backgroundColor: '#F46800' }}>
                  <div className="text-[10px] font-bold text-white leading-tight">추상화</div>
                  <div className="text-[8px] text-orange-100 leading-tight">data frame</div>
                </div>
                {isMixed && (
                  <div className="mt-1 text-[8px] font-mono px-1 rounded bg-slate-800 text-orange-300">-- Mixed --</div>
                )}
              </div>

              {/* 우: 통일된 패널 */}
              <div className="flex flex-col justify-center gap-2 w-2/5">
                <div className="text-[10px] font-bold text-slate-500 text-center mb-0.5">패널 (통일 인터페이스)</div>
                <div className="rounded-lg border-2 bg-white shadow-sm overflow-hidden"
                  style={{ borderColor: '#F46800' }}>
                  <div className="px-2 py-1 border-b border-slate-200 bg-grafana-soft text-[10px] font-bold text-grafana-deep">
                    {isMixed ? '배포 상관관계' : '요청량'}
                  </div>
                  <div className="p-2 h-16 flex items-center justify-center">
                    <svg viewBox="0 0 120 40" className="w-full h-full" preserveAspectRatio="none">
                      <polyline
                        points="0,32 15,26 30,28 45,18 60,22 75,12 90,16 105,8 120,14"
                        fill="none" stroke="#F46800" strokeWidth="2"
                        className={isAbstract ? 'flow-pulse' : ''} />
                      {isMixed && (
                        <line x1="70" y1="0" x2="70" y2="40" stroke="#336791" strokeWidth="1.5" strokeDasharray="3 3" />
                      )}
                    </svg>
                  </div>
                </div>
                <div className="text-[9px] text-center text-slate-500">
                  소스가 무엇이든 패널 코드는 동일
                </div>
              </div>
            </div>
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (Step 5) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">Part I. 기초</span>
                  <span className="text-[10px] font-mono text-slate-500">I-2-2</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900">Data Source — 데이터 소스 추상화</h1>
                <p className="text-xs text-slate-600">다양한 데이터베이스를 하나의 인터페이스로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                Data Source는 Grafana가 데이터를 가져오는 외부 백엔드다 — Grafana 자체는 저장하지 않는다. 소스마다 쿼리 언어(PromQL·LogQL·SQL)가 다르지만 Grafana가 공통 데이터 프레임으로 추상화해 패널은 소스와 무관하게 동작한다. Mixed로 한 패널에 여러 소스를 겹칠 수 있고, datasource 변수로 dev·prod를 전환한다. 실무에서는 인증 정보 노출(secureJsonData), 소스 권한(RBAC), 연결 타임아웃, 쿼리 언어 혼동을 항상 함께 점검해야 한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Data Source', 'plugin', 'PromQL', 'LogQL', 'SQL', 'data frame', 'Mixed', 'secureJsonData', 'RBAC', 'timeout'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>II-1-1 Prometheus 데이터 소스 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
