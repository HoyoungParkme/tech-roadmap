    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */

      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

    const PANEL_COLOR = {
      amber:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-800',   dot: 'bg-amber-500'   },

    };

    function MiniSparkline({ color }) {
      // 더미 시계열 라인
      const data = [0.12, 0.14, 0.13, 0.17, 0.19, 0.21, 0.18, 0.16, 0.20, 0.22, 0.19, 0.17, 0.18];
      const W = 200, H = 50, MAX = 0.3;
      const pts = data.map((v, i) => `${(i / (data.length - 1)) * W},${H - (v / MAX) * H}`).join(' ');
      const c = PANEL_COLOR[color] || PANEL_COLOR.amber;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full" preserveAspectRatio="none">
          <polyline points={pts} fill="none" stroke="currentColor" strokeWidth="2" className={c.text} />
        </svg>
      );
    }

    function MiniGauge({ percent }) {
      const angle = (percent / 100) * 180 - 90;
      return (
        <svg viewBox="0 0 100 60" className="w-full h-full">
          <path d="M 10 50 A 40 40 0 0 1 90 50" stroke="#e2e8f0" strokeWidth="8" fill="none" />
          <path d="M 10 50 A 40 40 0 0 1 90 50" stroke="#F46800" strokeWidth="8" fill="none"
            strokeDasharray={`${(percent / 100) * 125.6} 125.6`} />
          <line x1="50" y1="50" x2={50 + 30 * Math.sin((angle * Math.PI) / 180)} y2={50 - 30 * Math.cos((angle * Math.PI) / 180)}
            stroke="#334155" strokeWidth="2" />
          <circle cx="50" cy="50" r="3" fill="#334155" />
        </svg>
      );
    }

    function PanelMock({ p }) {
      const c = PANEL_COLOR[p.color] || PANEL_COLOR.amber;
      // 24칸 그리드 → flex basis %
      const widthPct = (p.gridPos.w / 24) * 100;
      const heightPx = p.gridPos.h * 12;
      return (
        <div
          className={`rounded border ${c.border} ${c.bg} overflow-hidden shadow-sm flex flex-col`}
          style={{ width: `calc(${widthPct}% - 4px)`, minHeight: heightPx }}
        >
          <div className="px-2 py-1 border-b border-slate-200 bg-white/60 flex items-center gap-1">
            <span className={`w-1.5 h-1.5 rounded-full ${c.dot}`}></span>
            <span className="text-[10px] font-bold text-slate-700">{p.title}</span>
            <span className="ml-auto text-[8px] text-slate-400 font-mono">{p.type}</span>
          </div>
          <div className="flex-1 p-1.5 flex items-center justify-center">
            {p.type === 'timeseries' && <MiniSparkline color={p.color} />}
            {p.type === 'stat' && <div className={`text-xl font-bold font-mono ${c.text}`}>{p.value}</div>}
            {p.type === 'gauge' && (
              <div className="flex items-center gap-2 w-full">
                <div className="w-20 h-12"><MiniGauge percent={parseInt(p.value)} /></div>
                <div className={`text-lg font-bold font-mono ${c.text}`}>{p.value}</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      // gridPos.y 로 행 그룹핑
      const rows = {};
      step.panels.forEach((p) => {
        const y = p.gridPos.y;
        if (!rows[y]) rows[y] = [];
        rows[y].push(p);
      });
      const sortedY = Object.keys(rows).map(Number).sort((a, b) => a - b);

      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">📊</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">{step.folder} / Service Health</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">⏱ {step.timeRange} · ↻ 30s</span>
          </div>

          {/* tag 행 */}
          <div className="bg-slate-50 px-3 py-1.5 flex items-center gap-2 border-b border-slate-200 flex-wrap">
            <span className="text-[10px] text-slate-500 font-bold">tags:</span>
            {step.tags.map((t) => (
              <span key={t} className="text-[10px] px-1.5 py-0.5 rounded bg-grafana-soft text-grafana-deep font-mono">
                #{t}
              </span>
            ))}
            {step.showFolder && (
              <span className="ml-auto text-[10px] text-slate-500 font-mono">
                folder: <span className="font-bold text-grafana-deep">{step.folder}</span>
              </span>
            )}
          </div>

          {/* dashboard 본체 — gridPos 시뮬레이션 */}
          <div className="flex-1 p-3 bg-slate-100">
            {step.panels.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-300 rounded-lg bg-white">
                <span className="text-3xl mb-2">🗒️</span>
                <div className="text-xs font-bold">빈 도화지</div>
                <div className="text-[10px]">+ Add visualization 으로 panel 추가</div>
              </div>
            ) : (
              <div className="space-y-1.5">
                {sortedY.map((y) => (
                  <div key={y} className="flex gap-1 items-stretch">
                    {rows[y]
                      .sort((a, b) => a.gridPos.x - b.gridPos.x)
                      .map((p) => (
                        <PanelMock key={p.id} p={p} />
                      ))}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (Step 4) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <h1 className="text-xl font-bold text-slate-900">I-1-1. Dashboard란 무엇인가</h1>
                <p className="text-xs text-slate-600">자동차 계기판 4종 한 보드 — panel의 집합 + 공통 time range + folder/tag</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3.5초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                dashboard는 panel의 컨테이너일 뿐 — 자체 데이터가 없다. panel = query 1 + 시각화 1, gridPos로 24칸 그리드에 배치한다. time range는 보드 공통이라 한 번 바꾸면 모든 panel이 같이 갱신된다. folder = 권한 단위, tag = 검색 필터, uid = 영구 URL — 이 4가지가 dashboard 운영의 기본 골격이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Dashboard', 'Panel', 'gridPos', 'time range', 'folder', 'tag', 'uid', 'provisioning'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>I-1-2 Panel 개념 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
