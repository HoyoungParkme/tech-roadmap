  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

    // ── 파이프라인 단계 뱃지
    function PipelineBar({ active }) {
      const stages = [
        { key: 'query', label: 'Query', icon: '🔎' },
        { key: 'data', label: 'Data', icon: '🧮' },
        { key: 'viz', label: 'Visualize', icon: '📈' },

      // stage → 파이프라인 강조 매핑
      const map = { anatomy: 'all', query: 'query', viz: 'viz', transform: 'data', grid: 'viz' };
      const cur = map[active] || 'all';
      return (
        <div className="flex items-center gap-1.5 px-3 py-2 bg-slate-50 border-b border-slate-200">
          {stages.map((s, i) => {
            const on = cur === 'all' || cur === s.key;
            return (
              <React.Fragment key={s.key}>
                <div
                  className={`flex items-center gap-1 px-2 py-1 rounded text-[10px] font-bold border ${on ? 'bg-grafana-soft text-grafana-deep border-grafana-orange' : 'bg-white text-slate-400 border-slate-200'}`}
                >
                  <span>{s.icon}</span><span>{s.label}</span>
                </div>
                {i < stages.length - 1 && <span className="text-slate-300 text-xs">→</span>}
              </React.Fragment>
            );
          })}
          <span className="ml-auto text-[10px] text-slate-400 font-mono">Edit Panel</span>
        </div>
      );
    }

    function MiniSparkline() {
      const data = [0.12, 0.14, 0.13, 0.17, 0.19, 0.21, 0.18, 0.16, 0.20, 0.22, 0.19, 0.17, 0.18];
      const W = 200, H = 50, MAX = 0.3;
      const pts = data.map((v, i) => `${(i / (data.length - 1)) * W},${H - (v / MAX) * H}`).join(' ');
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full" preserveAspectRatio="none">
          <polyline points={pts} fill="none" stroke="#F46800" strokeWidth="2" />
        </svg>
      );
    }

    // ── stage: anatomy — panel 세 부분 분해도
    function AnatomyView() {
      const parts = [
        { icon: '🔎', name: 'query', sub: 'targets[]', desc: '데이터소스에 보내는 쿼리' },
        { icon: '📈', name: '시각화', sub: 'type', desc: '결과를 그리는 그래프 종류' },
        { icon: '⚙️', name: '옵션', sub: 'fieldConfig · options', desc: '단위 · 임계값 · 범례' },
      ];
      return (
        <div className="space-y-2">
          <div className="rounded-lg border border-grafana-orange bg-white overflow-hidden shadow-sm">
            <div className="px-2 py-1 border-b border-slate-200 bg-white/60 flex items-center gap-1">
              <span className="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
              <span className="text-[10px] font-bold text-slate-700">p99 Latency</span>
              <span className="ml-auto text-[8px] text-slate-400 font-mono">timeseries</span>
            </div>
            <div className="h-16 p-1.5"><MiniSparkline /></div>
          </div>
          <div className="text-center text-[10px] text-slate-400">이 패널 1개는 아래 3부분으로 이루어진다</div>
          <div className="grid grid-cols-3 gap-2">
            {parts.map((p) => (
              <div key={p.name} className="rounded-lg border border-slate-200 bg-white px-2 py-2 text-center shadow-sm">
                <div className="text-lg">{p.icon}</div>
                <div className="text-[11px] font-bold text-slate-800">{p.name}</div>
                <div className="text-[9px] font-mono text-grafana-deep">{p.sub}</div>
                <div className="text-[9px] text-slate-500 mt-0.5">{p.desc}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── stage: query — query editor 모방
    function QueryView({ step }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div className="flex items-center gap-2 px-2 py-1.5 border-b border-slate-200 bg-slate-50">
              <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-grafana-orange text-white">A</span>
              <span className="text-[10px] text-slate-500">Data source</span>
              <span className="text-[10px] font-mono font-bold text-slate-800 px-1.5 py-0.5 rounded bg-slate-100 border border-slate-200">🐘 {step.datasource}</span>
            </div>
            <div className="p-2 bg-slate-900 font-mono text-[10px] leading-5 text-slate-200">
              <div><span className="text-sky-400">SELECT</span> date_trunc(<span className="text-emerald-400">'minute'</span>, created_at) <span className="text-sky-400">AS</span> time,</div>
              <div className="pl-10"><span className="text-orange-300">count</span>(*) <span className="text-sky-400">AS</span> orders</div>
              <div><span className="text-sky-400">FROM</span> orders <span className="text-sky-400">WHERE</span> <span className="text-amber-300">$__timeFilter</span>(created_at)</div>
              <div><span className="text-sky-400">GROUP BY</span> 1 <span className="text-sky-400">ORDER BY</span> 1;</div>
            </div>
          </div>
          <div className="flex items-center justify-center gap-2 text-[10px] text-slate-400">
            <span>결과가 아래 시리즈로</span><span className="text-slate-300">→</span>
          </div>
          <div className="rounded-lg border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div className="px-2 py-1 border-b border-slate-200 text-[10px] font-bold text-slate-600">Orders per minute · time series</div>
            <div className="h-16 p-1.5"><MiniSparkline /></div>
          </div>
        </div>
      );
    }

    // ── stage: viz — 시각화 + 임계값
    function VizView({ step }) {
      const levels = [
        { color: 'bg-emerald-500', label: 'green', range: '0.00 이상' },
        { color: 'bg-amber-400', label: 'yellow', range: '0.01 이상' },
        { color: 'bg-red-500', label: 'red', range: '0.05 이상' },
      ];
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-400 bg-red-50 shadow-sm overflow-hidden">
            <div className="px-2 py-1 border-b border-red-200 bg-white/60 flex items-center gap-1">
              <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>
              <span className="text-[10px] font-bold text-slate-700">{step.panelTitle}</span>
              <span className="ml-auto text-[8px] text-slate-400 font-mono">stat</span>
            </div>
            <div className="py-4 flex flex-col items-center">
              <div className="text-3xl font-bold font-mono text-red-600">{step.vizValue}</div>
              <div className="text-[10px] text-red-500 mt-1">임계값 red 구간 (0.05 이상)</div>
            </div>
          </div>
          <div className="rounded-lg border border-slate-200 bg-white px-2 py-2 shadow-sm">
            <div className="text-[10px] font-bold text-slate-600 mb-1.5">thresholds — 값 구간별 색</div>
            <div className="space-y-1">
              {levels.map((l) => (
                <div key={l.label} className="flex items-center gap-2">
                  <span className={`w-3 h-3 rounded ${l.color}`}></span>
                  <span className="text-[10px] font-mono text-slate-700 w-14">{l.label}</span>
                  <span className="text-[10px] text-slate-500">{l.range}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ── stage: transform — 파이프라인 체인
    function TransformView() {
      const chain = [
        { id: 'merge', desc: '쿼리 A · B 결과를 시간 기준 한 표로 합침' },
        { id: 'calculateField', desc: 'success / total = 성공률 계산 필드 추가' },
        { id: 'organize', desc: '필요한 필드만 남기고 이름 정리' },
      ];
      return (
        <div className="space-y-2">
          <div className="flex items-center justify-center gap-2 text-[10px] text-slate-500">
            <span className="px-2 py-1 rounded bg-slate-100 border border-slate-200 font-mono">쿼리 A</span>
            <span className="px-2 py-1 rounded bg-slate-100 border border-slate-200 font-mono">쿼리 B</span>
            <span className="text-slate-300">↓</span>
          </div>
          {chain.map((t, i) => (
            <div key={t.id} className="flex items-stretch gap-2">
              <div className="flex flex-col items-center">
                <span className="w-6 h-6 rounded-full bg-grafana-orange text-white text-[11px] font-bold flex items-center justify-center">{i + 1}</span>
                {i < chain.length - 1 && <span className="flex-1 w-px bg-orange-200"></span>}
              </div>
              <div className="flex-1 rounded-lg border border-slate-200 bg-white px-2 py-1.5 shadow-sm mb-1">
                <div className="text-[11px] font-mono font-bold text-grafana-deep">{t.id}</div>
                <div className="text-[10px] text-slate-500">{t.desc}</div>
              </div>
            </div>
          ))}
          <div className="rounded-lg border border-emerald-200 bg-emerald-50 px-2 py-2 text-center shadow-sm">
            <div className="text-[10px] text-emerald-700">최종 표시</div>
            <div className="text-xl font-bold font-mono text-emerald-700">성공률 98.7%</div>
          </div>
        </div>
      );
    }

    // ── stage: grid — 그리드 배치 + 툴바
    function GridView() {
      const panels = [
        { title: 'p99 Latency', type: 'timeseries', value: '', w: 12, color: 'text-amber-700', dot: 'bg-amber-500', bg: 'bg-amber-50', border: 'border-amber-300' },
        { title: 'RPS', type: 'stat', value: '1,240', w: 6, color: 'text-sky-700', dot: 'bg-sky-500', bg: 'bg-sky-50', border: 'border-sky-300' },
        { title: 'Error Rate', type: 'stat', value: '4.2%', w: 6, color: 'text-red-600', dot: 'bg-red-500', bg: 'bg-red-50', border: 'border-red-300' },
      ];
      return (
        <div className="space-y-2">
          <div className="flex items-center gap-1.5 px-2 py-1 rounded bg-slate-800 text-[10px] text-slate-200">
            <span className="px-1.5 py-0.5 rounded bg-slate-700">✏️ Edit (e)</span>
            <span className="px-1.5 py-0.5 rounded bg-slate-700">⧉ Duplicate</span>
            <span className="px-1.5 py-0.5 rounded bg-slate-700">🔗 Link</span>
            <span className="ml-auto text-slate-400">드래그로 이동 · 리사이즈</span>
          </div>
          <div className="flex gap-1.5 items-stretch">
            {panels.map((p) => (
              <div key={p.title} className={`rounded border ${p.border} ${p.bg} overflow-hidden shadow-sm flex flex-col`} style={{ width: `calc(${(p.w / 24) * 100}% - 4px)` }}>
                <div className="px-2 py-1 border-b border-slate-200 bg-white/60 flex items-center gap-1">
                  <span className={`w-1.5 h-1.5 rounded-full ${p.dot}`}></span>
                  <span className="text-[9px] font-bold text-slate-700">{p.title}</span>
                  <span className="ml-auto text-[7px] text-slate-400 font-mono">{p.type}</span>
                </div>
                <div className="flex-1 p-1.5 flex items-center justify-center min-h-[52px]">
                  {p.type === 'timeseries' ? <MiniSparkline /> : <div className={`text-lg font-bold font-mono ${p.color}`}>{p.value}</div>}
                </div>
              </div>
            ))}
          </div>
          <div className="text-center text-[10px] text-slate-400 font-mono">gridPos: 12 + 6 + 6 = 24칸 (한 줄 꽉)</div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">📊</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">{step.panelTitle}</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">⏱ last 1h · ↻ 30s</span>
          </div>

          {/* 파이프라인 단계 표시 */}
          <PipelineBar active={step.stage} />

          {/* 단계별 본체 */}
          <div className="flex-1 p-3 bg-slate-100">
            {step.stage === 'anatomy' && <AnatomyView />}
            {step.stage === 'query' && <QueryView step={step} />}
            {step.stage === 'viz' && <VizView step={step} />}
            {step.stage === 'transform' && <TransformView />}
            {step.stage === 'grid' && <GridView />}
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (마지막 단계) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">Part I. 기초</span>
                  <span className="text-[10px] font-mono text-slate-400">I-1-2</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900">Panel — 대시보드의 기본 단위</h1>
                <p className="text-xs text-slate-600">하나의 쿼리·시각화를 담는 패널</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                Panel은 query + 시각화 + 옵션이 한 덩어리인 대시보드의 기본 블록이다. query editor는 데이터소스별로 문법이 다르고, 결과는 시각화 타입·필드 옵션·임계값·범례로 표현하며, transform으로 쿼리를 안 건드리고 결과를 가공한다. 편집·복제·재배치·링크는 UI로 다 되고, 실무 함정 네 가지(무거운 쿼리·과다 패널·부적합 타입·timezone)만 피하면 panel 운영의 기본기는 갖춘 것이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Panel', 'query editor', 'refId', 'visualization', 'threshold', 'legend', 'transform', 'panel link', 'timezone'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>I-2-1 다음 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
