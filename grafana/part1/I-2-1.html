  <!--
    I-2-1. Visualization Type — 시각화 6종 — fastapi v1 패턴
    학습 목표: 같은 데이터라도 시각화 타입에 따라 전달되는 정보가 달라진다.
    데이터 형태(시계열/현재값/범주/원시/분포)에 맞는 타입을 고르는 것이 핵심.
    패턴: 좌(LiveDataPane: 동일 데이터를 6종 시각화로 대비) / 우(VSCode panel.json)
    색상: #F46800 (Grafana brand orange)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 6종 시각화가 공유하는 단 하나의 데이터셋 (같은 데이터, 다른 시각화)

      { name: '/pay', v: 0.42 },

      { name: '/cart', v: 0.28 },

      { name: '/home', v: 0.12 },

      { ep: '/search', rps: 910, p99: 0.35, err: 0.2 },
      { ep: '/cart', rps: 540, p99: 0.28, err: 0.1 },

    // heatmap: 행=지연 버킷(위=느림), 열=시간. 값=요청 수(색 진하기)
    const HEATMAP = [
      [1, 0, 1, 2, 4, 3, 6, 9, 7, 5, 3, 4],
      [3, 4, 3, 5, 7, 6, 8, 10, 9, 7, 6, 6],
      [8, 9, 8, 7, 6, 7, 5, 4, 5, 6, 8, 7],
      [12, 11, 13, 10, 8, 9, 7, 5, 6, 8, 10, 9],
    ];

    const VIZ_TYPES = [
      { key: 'timeseries', icon: '📈', label: 'Time series' },
      { key: 'stat', icon: '🔢', label: 'Stat' },
      { key: 'gauge', icon: '🎯', label: 'Gauge' },
      { key: 'bar', icon: '📊', label: 'Bar chart' },
      { key: 'table', icon: '🧾', label: 'Table' },
      { key: 'heatmap', icon: '🔥', label: 'Heatmap' },
    ];

    const STEPS = [
      {
        viz: 'timeseries',
        title: 'Step 1. Time series — "시간에 따른 추세를 본다"',
        desc: 'Grafana 기본값이자 가장 많이 쓰는 타입. x축은 시간, y축은 값이라 "언제 튀었나 / 우상향인가"를 한눈에 본다. 지연·트래픽·에러율처럼 시간축을 가진 지표는 거의 다 time series로 시작한다. 단일 순간이 아니라 흐름이 중요할 때 고른다. 스파이크 시각, 평소 대비 이상치, 배포 전후 변화를 읽는 게 목적이다.',
        keyPoint: '시간축이 있는 지표(지연·RPS·에러율)의 기본값. 추세와 스파이크를 읽는다.',
        code: {
          lang: 'json',
          filename: 'panel.json — time series',
          lines: [
            '{',
            '  "title": "p99 Latency",',
            '  "type": "timeseries",',
            '',

            '',

      {
        viz: 'stat',
        title: 'Step 2. Stat — "지금 이 값 하나를, 크게"',

        keyPoint: '단일 현재값을 큰 숫자로. reduce로 시계열을 접고, threshold로 색을 입힌다.',

          lang: 'json',

            '  "title": "현재 RPS",',

            '        { "color": "green",  "value": null },',

            '}',
            '',
            '// reduce = 시계열을 값 1개로 접는 규칙',
            '//  last(마지막) / mean(평균) / max(최댓값)',
            '// colorMode: background → 값 상태를 배경색으로 강조',
          ],
          highlight: [3, 10, 11, 12, 20, 21, 22, 23],
        },
      },
      {
        viz: 'gauge',
        title: 'Step 3. Gauge — "정해진 범위 안 어디쯤인가"',
        desc: 'min~max 범위가 분명한 지표에 쓴다 — CPU 0~100%, 디스크 사용률, SLO 소진율. Stat이 "값"이라면 Gauge는 "범위 대비 위치"를 보여준다. 임계값 구간(초록/노랑/빨강)을 색 띠로 그려서 "위험 구간에 얼마나 가까운가"가 직관적이다. max를 반드시 설정해야 의미가 산다 — max 없는 gauge는 눈금 없는 계기판과 같다.',
        keyPoint: 'min~max 범위가 있는 지표(사용률·소진율). max 미설정 시 무의미.',
        code: {
          lang: 'json',
          filename: 'panel.json — gauge',
          lines: [
            '{',
            '  "title": "CPU 사용률",',
            '  "type": "gauge",',
            '',
            '  "targets": [{ "refId": "A",',
            '    "expr": "avg(rate(process_cpu_seconds_total[5m])) * 100"',
            '  }],',
            '',
            '  "options": {',
            '    "showThresholdMarkers": true,',
            '    "showThresholdLabels": false',
            '  },',
            '',
            '  "fieldConfig": {',
            '    "defaults": {',
            '      "unit": "percent",',
            '      "min": 0,',
            '      "max": 100,',
            '      "thresholds": { "mode": "absolute", "steps": [',
            '        { "color": "green",  "value": null },',
            '        { "color": "yellow", "value": 70 },',
            '        { "color": "red",    "value": 90 }',
            '      ]}',
            '    }',
            '  }',
            '}',
            '',
            '// gauge 핵심: min/max 가 곧 눈금',
            '//  max 를 빼먹으면 바늘 위치가 무의미해진다',
            '// threshold 구간이 위험도 색 띠로 표시된다',
          ],
          highlight: [3, 17, 18, 19, 20, 21, 22, 23],
        },
      },
      {
        viz: 'bar',
        title: 'Step 4. Bar chart — "범주끼리 나란히 비교"',
        desc: '시간이 아니라 범주(category) 간 크기를 비교할 때 쓴다 — 엔드포인트별 지연, 국가별 매출, 에러 코드별 건수. 막대 길이 비교라 "무엇이 가장 큰가"가 즉시 읽힌다. 값을 내림차순 정렬하면 Top-N이 한눈에 들어온다. 파이차트로 하면 3~4개만 넘어가도 각도 비교가 어려워지므로, 범주 비교는 대부분 bar가 정답이다.',
        keyPoint: '범주 간 크기 비교. 정렬하면 Top-N이 즉시 보인다. 파이차트 대신 bar.',
        code: {
          lang: 'json',
          filename: 'panel.json — bar chart',
          lines: [

            '',

            '    "format": "table",',
            '    "instant": true',
            '  }],',
            '',
            '  "options": {',
            '    "orientation": "horizontal",',
            '    "xTickLabelRotation": 0,',

            '',

            '    "defaults": { "unit": "s" }',

            '}',
            '',
            '// 시간이 아니라 "범주"를 비교할 때',
            '//  instant: true → 지금 한 순간의 값만 (추세 X)',
            '//  format: table → route 라벨별 한 줄씩',
            '// 정렬(Transform: Sort by)로 Top-N 강조',
          ],
          highlight: [3, 7, 8, 12, 14],
        },
      },
      {
        viz: 'table',
        title: 'Step 5. Table — "원시 데이터·다차원을 그대로"',
        desc: '차트로 뭉개면 안 되는 세부를 그대로 볼 때 쓴다 — 엔드포인트별 RPS·p99·에러율을 한 행씩. 여러 컬럼(다차원)을 동시에 보여주는 게 강점이다. Cell 값에 색·게이지·링크를 입히고(Cell type), Transform으로 join·정렬·필터해 원하는 표를 만든다. 로그 원문, 최근 배포 목록, 알림 이력처럼 "숫자 하나"로 못 줄이는 데이터에 적합하다.',
        keyPoint: '다차원·원시 데이터를 행 단위로. Cell 색/게이지 + Transform으로 가공.',
        code: {
          lang: 'json',
          filename: 'panel.json — table',
          lines: [
            '{',
            '  "title": "엔드포인트 요약",',
            '  "type": "table",',
            '',
            '  "targets": [{ "refId": "A",',
            '    "expr": "sum by (route) (rate(http_requests_total[1m]))",',
            '    "format": "table",',
            '    "instant": true',
            '  }],',
            '',
            '  "transformations": [',
            '    { "id": "merge" },',
            '    { "id": "organize", "options": {',
            '      "renameByName": { "route": "Endpoint", "Value": "RPS" }',
            '    }}',
            '  ],',
            '',
            '  "fieldConfig": {',
            '    "overrides": [{',
            '      "matcher": { "id": "byName", "options": "err%" },',
            '      "properties": [{ "id": "custom.cellOptions",',
            '        "value": { "type": "color-background" } }]',
            '    }]',
            '  }',
            '}',
            '',
            '// table = 여러 컬럼을 한 행씩 그대로',
            '//  transformations: merge/organize 로 컬럼 가공',
            '//  overrides: 특정 컬럼만 색·게이지 Cell 로',
          ],
          highlight: [3, 7, 11, 12, 13, 20, 21, 22, 23],
        },
      },
      {
        viz: 'heatmap',
        title: 'Step 6. Heatmap — "분포를 색으로" + 선택 기준·함정',
        desc: 'y축을 값 구간(버킷), 색을 빈도로 그려 "값이 어디에 몰리는가"를 본다 — 지연 분포, 응답 크기 분포. 평균 하나로는 숨는 롱테일(느린 소수 요청)이 heatmap에선 드러난다. State timeline(상태 구간)·Logs(로그 원문) 패널도 상황별로 함께 쓴다. 함정: 범주 비교에 파이차트 남용, threshold 미설정으로 이상 무감지, 단위(unit) 누락으로 "0.42가 초인지 밀리초인지" 모호, 축 스케일(min/max) 방치로 왜곡.',
        keyPoint: '분포·롱테일은 heatmap. 함정: 파이 남용·threshold/단위 누락·축 스케일 방치.',
        summary: {
          title: '데이터 형태 → 시각화 선택',
          points: [
            '시간축이 있다(추세) → Time series',
            '지금 값 하나 강조 → Stat / 범위 대비 위치 → Gauge',
            '범주끼리 비교 → Bar chart (파이차트 남용 금지)',
            '다차원·원시 데이터 → Table / 분포·롱테일 → Heatmap',
            '공통 필수: unit·decimals·threshold·축 min/max 설정',
          ],
        },
        code: {
          lang: 'json',
          filename: 'panel.json — heatmap',
          lines: [
            '{',
            '  "title": "지연 분포 (Heatmap)",',
            '  "type": "heatmap",',
            '',
            '  "targets": [{ "refId": "A",',
            '    "expr": "sum by (le) (rate(http_request_duration_seconds_bucket[5m]))",',
            '    "format": "heatmap"',
            '  }],',
            '',
            '  "options": {',
            '    "calculate": false,',
            '    "color": { "scheme": "Oranges", "steps": 64 },',

            '  },',
            '',
            '  "fieldConfig": { "defaults": { "unit": "short" } }',
            '}',
            '',
            '// ── 시각화 선택 치트시트 ──',
            '//  (시간, 값)      → timeseries',
            '//  현재값 1개      → stat',
            '//  0~max 범위      → gauge',
            '//  범주 비교       → barchart  (파이차트 남용 금지)',
            '//  다차원 원시     → table',
            '//  분포/롱테일     → heatmap',
            '//',
            '// ── 자주 하는 실수 ──',
            '//  unit 누락       → 0.42 가 초? ms? 모호',
            '//  threshold 미설정 → 이상을 색으로 못 잡음',
            '//  축 min/max 방치 → 스케일 왜곡·과장',
          ],
          highlight: [3, 7, 12, 13, 22, 28, 29, 30],
        },
      },
    ];

    // ── 미니 차트 컴포넌트 (같은 데이터를 6종으로) ─────────────────
    function MiniTimeSeries({ big }) {
      const W = 260, H = big ? 120 : 44, MAX = 0.5;
      const pts = SERIES.map((v, i) => `${(i / (SERIES.length - 1)) * W},${H - (v / MAX) * H}`).join(' ');
      const area = `0,${H} ${pts} ${W},${H}`;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full" preserveAspectRatio="none">
          <polygon points={area} fill="#F46800" opacity="0.12" />
          <polyline points={pts} fill="none" stroke="#F46800" strokeWidth="2" />
        </svg>
      );
    }

    function MiniStat({ big }) {
      return (
        <div className="flex flex-col items-center justify-center w-full h-full">
          <div className={`font-bold font-mono grafana-orange ${big ? 'text-4xl' : 'text-base'}`}>1,240</div>
          <div className={`text-slate-500 font-mono ${big ? 'text-xs' : 'text-[8px]'}`}>reqps · last</div>
        </div>
      );
    }

    function MiniGauge({ big }) {
      const percent = 67;
      const R = big ? 46 : 24;
      const cx = 50, cy = 50;
      const dash = (percent / 100) * (Math.PI * R);
      return (
        <div className="flex flex-col items-center justify-center w-full h-full">
          <svg viewBox="0 0 100 58" className={big ? 'w-40 h-24' : 'w-16 h-9'}>
            <path d={`M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}`} stroke="#e2e8f0" strokeWidth="9" fill="none" />
            <path d={`M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}`} stroke="#F46800" strokeWidth="9" fill="none"
              strokeDasharray={`${dash} 999`} strokeLinecap="round" />
          </svg>
          <div className={`font-bold font-mono grafana-orange -mt-1 ${big ? 'text-2xl' : 'text-[10px]'}`}>67%</div>
        </div>
      );
    }

    function MiniBar({ big }) {
      const MAX = 0.5;
      return (
        <div className="w-full h-full flex flex-col justify-center gap-1 px-1">
          {CATEGORIES.map((c) => (
            <div key={c.name} className="flex items-center gap-1">
              <span className={`text-slate-500 font-mono text-right ${big ? 'text-[10px] w-14' : 'text-[7px] w-8'}`}>{c.name}</span>
              <div className="flex-1 bg-slate-100 rounded-sm overflow-hidden" style={{ height: big ? 14 : 6 }}>
                <div className="h-full bg-grafana-orange rounded-sm" style={{ width: `${(c.v / MAX) * 100}%` }} />
              </div>
              {big && <span className="text-[9px] font-mono text-slate-600 w-8">{c.v}s</span>}
            </div>
          ))}
        </div>
      );
    }

    function MiniTable({ big }) {
      return (
        <div className="w-full h-full overflow-hidden px-1">
          <table className={`w-full ${big ? 'text-[10px]' : 'text-[6px]'} font-mono`}>
            <thead>
              <tr className="text-slate-500 border-b border-slate-200">
                <th className="text-left py-0.5">endpoint</th>
                <th className="text-right">rps</th>
                <th className="text-right">p99</th>
                <th className="text-right">err%</th>
              </tr>
            </thead>
            <tbody>
              {TABLE.map((r) => (
                <tr key={r.ep} className="border-b border-slate-100">
                  <td className="text-slate-700 py-0.5">{r.ep}</td>
                  <td className="text-right text-slate-600">{r.rps}</td>
                  <td className="text-right text-slate-600">{r.p99}</td>
                  <td className="text-right font-bold" style={{ color: r.err > 0.5 ? '#dc2626' : '#059669' }}>{r.err}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function MiniHeatmap({ big }) {
      const MAX = 13;
      const cell = big ? 18 : 7;
      return (
        <div className="w-full h-full flex items-center justify-center">
          <div className="flex flex-col gap-0.5">
            {HEATMAP.map((row, ri) => (
              <div key={ri} className="flex gap-0.5">
                {row.map((v, ci) => (
                  <div key={ci} style={{ width: cell, height: cell, backgroundColor: '#F46800', opacity: 0.12 + (v / MAX) * 0.85, borderRadius: 2 }} />
                ))}
              </div>
            ))}
          </div>
        </div>
      );
    }

    const VIZ_RENDER = {
      timeseries: MiniTimeSeries,
      stat: MiniStat,
      gauge: MiniGauge,
      bar: MiniBar,
      table: MiniTable,
      heatmap: MiniHeatmap,
    };

    // ── 좌측: 동일 데이터를 6종 시각화로 대비 ─────────────────────
    function LiveDataPane({ step }) {
      const Active = VIZ_RENDER[step.viz];
      const activeMeta = VIZ_TYPES.find((t) => t.key === step.viz);
      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">📊</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">Service Health / Visualize</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">동일 데이터 · 6종 대비</span>
          </div>

          {/* 시각화 타입 전환 스트립 (현재 타입 강조) */}
          <div className="bg-slate-50 px-2 py-1.5 flex items-center gap-1 border-b border-slate-200 flex-wrap">
            {VIZ_TYPES.map((t) => {
              const on = t.key === step.viz;
              return (
                <span key={t.key}
                  className={`text-[10px] px-2 py-1 rounded font-mono flex items-center gap-1 border transition ${on ? 'bg-grafana-orange text-white border-grafana-orange font-bold' : 'bg-white text-slate-500 border-slate-200'}`}>
                  <span>{t.icon}</span>{t.label}
                </span>
              );
            })}
          </div>

          {/* 큰 활성 시각화 */}
          <div className="flex-1 p-3 bg-slate-100">
            <div className="rounded-lg border border-slate-200 bg-white h-full flex flex-col overflow-hidden shadow-sm">
              <div className="px-2 py-1 border-b border-slate-200 bg-white/70 flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-grafana-orange"></span>
                <span className="text-[11px] font-bold text-slate-700">{activeMeta.label} panel</span>
                <span className="ml-auto text-[9px] text-slate-400 font-mono">type: {step.viz}</span>
              </div>
              <div className="flex-1 p-2 flex items-center justify-center" style={{ minHeight: 150 }}>
                <Active big={true} />
              </div>
            </div>
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (Step 6) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange font-bold">Part I. 기초</span>
                  <span className="text-[10px] text-slate-400 font-mono">I-2-1</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900">Visualization Type — 시각화 6종</h1>
                <p className="text-xs text-slate-600">데이터에 맞는 시각화 고르기 — 같은 데이터, 다른 그림</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} aria-label="이전 단계" disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} aria-label="다음 단계" disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                시각화 타입은 취향이 아니라 데이터 형태로 정해진다. 시간축이면 time series, 현재값 하나면 stat, 범위 대비면 gauge, 범주 비교면 bar, 다차원 원시면 table, 분포면 heatmap. 파이차트는 범주 3~4개를 넘으면 각도 비교가 무너지니 bar로 대체한다. 어떤 타입이든 unit·decimals·threshold·축 min/max를 설정해야 값이 오해 없이 읽힌다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['timeseries', 'stat', 'gauge', 'barchart', 'table', 'heatmap', 'threshold', 'unit', 'reduce', 'transform'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>I-2-2 다음 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
