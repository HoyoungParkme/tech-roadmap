<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    V-1-2. Permission — 권한 모델 — fastapi v1 패턴
    학습 목표: 조직 역할(Viewer/Editor/Admin) + 리소스 권한(폴더 상속 → 대시보드 override)
    핵심 비유: "건물 출입증 — 기본 등급 + 층별 도어락 + 특정 방 별도 잠금"
    패턴: 좌(LiveDataPane: 권한 계층 상속/override 시각화) / 우(VSCode json/bash)
    색상: #F46800 (Grafana brand orange)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      roles: {lang:"json", filename:"org-roles.json — 조직 역할 개요", lines:[
        "{",
        "  \"orgId\": 1,",
        "  \"orgName\": \"acme-corp\",",
        "",
        "  // 조직 역할 3종 — 로그인 사용자는 반드시 하나를 가진다",
        "  \"roles\": {",
        "    \"Viewer\": {",
        "      \"canView\": true,        // 대시보드 조회",
        "      \"canEdit\": false,       // 편집 불가",
        "      \"canAdmin\": false",
        "    },",
        "    \"Editor\": {",
        "      \"canView\": true,",
        "      \"canEdit\": true,        // 대시보드 생성·수정·삭제",
        "      \"canAdmin\": false       // 사용자·권한 관리는 불가",
        "    },",
        "    \"Admin\": {",
        "      \"canView\": true,",
        "      \"canEdit\": true,",
        "      \"canAdmin\": true        // 사용자·데이터소스·권한 전부",
        "    }",
        "  },",
        "",
        "  // 신규 사용자 기본 역할 — 운영 안전상 Viewer 권장",
        "  \"autoAssignOrgRole\": \"Viewer\"",
        "}",
      ]},
      model: {lang:"json", filename:"permission-model.json — 두 축의 권한", lines:[
        "{",
        "  // 축 1) 조직 역할 — 전역 기본 등급",
        "  \"user\": {",
        "    \"login\": \"kim.dev\",",
        "    \"orgRole\": \"Viewer\"          // 전역 기본은 조회만",
        "  },",
        "",
        "  // 축 2) 리소스 권한 — 특정 폴더/대시보드에 개별 부여",
        "  \"resourcePermissions\": [",
        "    {",
        "      \"resource\": \"folder\",",
        "      \"uid\": \"team-platform\",",
        "      \"permission\": \"Edit\",      // 이 폴더 안에서는 편집 가능",
        "      \"assignedTo\": { \"type\": \"user\", \"id\": \"kim.dev\" }",
        "    }",
        "  ],",
        "",
        "  // 실제 유효 권한 = 두 축의 합집합(더 높은 쪽)",
        "  // - team-platform 폴더 안: Edit  (리소스 권한이 이김)",
        "  // - 그 외 모든 폴더:       View  (조직 역할 Viewer)",
        "",
        "  // 설계 원칙: 조직 역할은 낮게, 필요한 폴더만 올린다",
        "  \"principle\": \"least-privilege\"",
        "}",
      ]},
      folderPerm: {lang:"bash", filename:"grant-folder-permission.sh — 폴더에 팀 권한", lines:[
        "#!/usr/bin/env bash",
        "# 폴더에 팀 권한을 부여하면 하위 대시보드가 상속받는다.",
        "set -euo pipefail",
        "",
        "GRAFANA=\"https://grafana.acme.internal\"",
        "FOLDER_UID=\"team-platform\"",
        "PLATFORM_TEAM_ID=12",
        "",
        "# team-platform 폴더에 Platform 팀 Edit(권한 코드 2) 부여",
        "#   permission: 1=View, 2=Edit, 4=Admin",
        "curl -sS -X POST \\",
        "  \"$GRAFANA/api/folders/$FOLDER_UID/permissions\" \\",
        "  -H \"Authorization: Bearer $GRAFANA_TOKEN\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d @- <<JSON",
        "{",
        "  \"items\": [",
        "    { \"teamId\": 12, \"permission\": 2 },",
        "    { \"role\": \"Viewer\", \"permission\": 1 }",
        "  ]",
        "}",
        "JSON",
        "",
        "# 결과: 이 폴더 안의 모든 대시보드가",
        "#   - Platform 팀 → Edit (상속)",
        "#   - 그 외 Viewer → View (상속)",
        "# 대시보드가 100개여도 관리 지점은 이 폴더 한 곳뿐.",
      ]},

      dsPerm: {lang:"bash", filename:"datasource-permission.sh — 소스별 쿼리 권한", lines:[
        "#!/usr/bin/env bash",
        "# 데이터소스별로 \"누가 쿼리할 수 있는지\"를 제어한다.",
        "set -euo pipefail",
        "",
        "GRAFANA=\"https://grafana.acme.internal\"",
        "BILLING_DB_UID=\"pg-billing-prod\"   # 민감한 결제 DB",
        "PAYMENT_TEAM_ID=34",
        "",
        "# 1) 기본 접근을 잠근다 (전체 허용 → 팀 지정으로 전환)",
        "curl -sS -X POST \\",
        "  \"$GRAFANA/api/access-control/datasources/$BILLING_DB_UID/permissions/roles\" \\",
        "  -H \"Authorization: Bearer $GRAFANA_TOKEN\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"permission\": \"\" }'   # built-in Viewer 기본 쿼리권 제거",
        "",
        "# 2) 결제팀에게만 Query 권한을 부여",
        "curl -sS -X POST \\",
        "  \"$GRAFANA/api/access-control/datasources/$BILLING_DB_UID/permissions/teams/$PAYMENT_TEAM_ID\" \\",
        "  -H \"Authorization: Bearer $GRAFANA_TOKEN\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"permission\": \"Query\" }'",
        "",
        "# 결과: pg-billing-prod 는 결제팀만 쿼리 가능",
        "#   - Explore 화면에서 타 팀의 임의 쿼리 차단",
        "#   - 대시보드 조회 권한과는 완전히 별개의 축",
      ]},
      audit: {lang:"bash", filename:"audit-permissions.sh — 권한 감사 체크리스트", lines:[
        "#!/usr/bin/env bash",
        "# 분기별 권한 감사 — 흔한 함정 4가지를 점검한다.",
        "set -euo pipefail",
        "GRAFANA=\"https://grafana.acme.internal\"",
        "H=(-H \"Authorization: Bearer $GRAFANA_TOKEN\")",
        "",
        "# 함정 1) Editor 과다 — 운영 보드를 아무나 수정",
        "echo \"== Editor 이상 사용자 목록 ==\"",
        "curl -sS \"${H[@]}\" \"$GRAFANA/api/org/users\" \\",
        "  | jq -r \".[] | select(.role != \"Viewer\") | .login + \" -> \" + .role\"",
        "",
        "# 함정 2) 개인 권한 — 팀 대신 개인에게 직접 부여된 폴더",
        "echo \"== 개인에게 직접 걸린 폴더 권한 (팀 미활용) ==\"",
        "curl -sS \"${H[@]}\" \"$GRAFANA/api/folders/team-platform/permissions\" \\",
        "  | jq -r \".[] | select(.userId != null) | .userLogin\"",
        "",
        "# 함정 3) 공개 대시보드 — 익명 노출 여부",
        "echo \"== 공개(public) 대시보드 목록 ==\"",
        "curl -sS \"${H[@]}\" \"$GRAFANA/api/dashboards/public-dashboards\" \\",
        "  | jq -r \".publicDashboards[]? | .dashboardUid\"",
        "",
        "# 함정 4) 상속 오해 — 폴더 없이 떠 있는 general 보드",
        "echo \"== General(폴더 미지정) 대시보드 ==\"",
        "curl -sS \"${H[@]}\" \"$GRAFANA/api/search?folderIds=0&type=dash-db\" \\",
        "  | jq -r \".[] | .title\"",
        "",
        "# 원칙: 기본 Viewer · 팀/폴더 부여 · override는 예외",
      ]},
    };

    const S1 = { title:"Step 1. 조직 역할 — Viewer · Editor · Admin", desc:"Grafana에 로그인한 모든 사용자는 조직(Org) 단위로 세 가지 기본 역할 중 하나를 가진다. Viewer는 대시보드를 볼 수만 있고, Editor는 만들고 고칠 수 있으며, Admin은 사용자/데이터소스/권한까지 관리한다. 이 역할이 \"기본 등급\"이고, 뒤에서 배울 폴더·대시보드 권한이 그 위에 얹힌다. 신규 입사자를 무심코 Editor로 두면 운영 보드를 실수로 망가뜨릴 수 있으니, 기본은 Viewer가 안전하다." };
    const S2 = { title:"Step 2. 두 개의 축 — 조직 역할 vs 리소스 권한", desc:"Grafana 권한은 두 층으로 나뉜다. 하나는 방금 본 조직 역할(전역 등급)이고, 다른 하나는 폴더·대시보드에 개별로 거는 리소스 권한이다. 조직 역할이 Viewer여도, 특정 폴더에 Edit 권한을 따로 주면 그 폴더 안에서는 편집할 수 있다. 즉 \"기본은 낮게, 필요한 곳만 콕 집어 올리는\" 최소 권한 설계가 가능하다. 이 두 축을 헷갈리면 \"왜 이 사람이 편집이 되지?\"를 영원히 못 푼다." };
    const S3 = { title:"Step 3. 폴더 권한 — 팀에 주고, 하위가 상속", desc:"리소스 권한은 사용자 개인이 아니라 Team이나 Role에 주는 게 정석이다. 예를 들어 \"team-platform 폴더에 Platform 팀 Edit\"를 걸면, 그 폴더 안의 모든 대시보드가 자동으로 그 권한을 상속받는다. 사람이 팀에 들어오고 나가는 것만 관리하면 되니, 대시보드가 100개여도 권한은 폴더 한 줄로 끝난다. 개인에게 일일이 주면 퇴사자 권한이 유령처럼 남는다." };
    const S4 = { title:"Step 4. 대시보드 override — 상속을 끊고 개별 지정", desc:"가끔 특정 대시보드만 다르게 잠그고 싶을 때가 있다. 예를 들어 폴더는 팀 전체 Edit이지만, \"prod-billing\" 대시보드만은 결제 담당자 2명만 편집하게 막고 싶다. 이때 그 대시보드에 개별 권한을 걸면 상속을 override한다 — 폴더 권한 위에 대시보드 권한이 덧씌워진다. 단, override는 예외이므로 남발하면 \"이 보드는 왜 나만 안 되지?\"라는 미궁이 생긴다. 꼭 필요한 소수 보드에만 쓴다." };
    const S5 = { title:"Step 5. 데이터소스 권한 — 누가 어떤 소스를 쿼리하나", desc:"대시보드를 볼 수 있어도, 그 뒤의 데이터소스를 쿼리할 권한은 별개다. Grafana Enterprise/최신 버전은 데이터소스 단위로 \"누가 이 Prometheus/PostgreSQL을 쿼리할 수 있나\"를 제어한다. 민감한 결제 DB는 결제팀만 쿼리하게 막고, 공용 메트릭은 전체에 연다. 이걸 열어두면 Explore 화면에서 아무 사용자나 프로덕션 DB에 임의 쿼리를 날려 성능을 흔들 수 있다. 최소 권한은 대시보드뿐 아니라 데이터소스에도 적용된다." };
    const S6 = { title:"Step 6. 실무 함정 — 과권한·상속 오해·공개 보드", desc:"권한 사고는 대부분 몇 가지 뻔한 실수에서 나온다. Editor를 남발해 아무나 운영 보드를 고치고, 폴더 상속을 오해해 하위 보드가 뚫려 있고, 팀을 안 쓰고 개인에게 권한을 뿌려 퇴사자 권한이 남고, 공개(anonymous) 대시보드로 내부 지표를 밖에 흘린다. 해법은 하나로 수렴한다 — 기본은 Viewer, 권한은 팀·폴더 단위, override와 공개는 예외로만. 이 원칙만 지켜도 권한 감사에서 막히지 않는다." };

              <span className="text-sm">📁</span>
              <span className="text-xs font-bold text-slate-800">team-platform</span>
              <span className="ml-auto text-[10px] font-mono font-bold text-amber-800">Platform 팀: Edit</span>
            </div>
            <div className="text-[10px] text-slate-500 mt-0.5">폴더에 팀 Edit 권한 부여 → 하위가 상속</div>
          </div>
          {/* 상속 화살표 */}
          <div className="flex justify-center text-slate-400 text-xs">
            {override ? '│ 상속 (일부 override)' : '│ 상속 ▼'}
          </div>
          {/* 대시보드 3개 */}
          <div className="space-y-1.5 pl-4">
            {dashLabels.map((d, i) => {
              const perm = dashPerm[i];
              const c = PERM_COLOR[perm];
              const isOv = override && i === 0;
              return (
                <div key={d} className={`rounded-lg border ${c.border} ${c.bg} p-2 flex items-center gap-1.5 ${isOv ? 'ring-2 ring-red-400' : ''}`}>
                  <span className="text-xs">📊</span>
                  <span className="text-[11px] font-bold text-slate-700">{d}</span>
                  <span className={`ml-auto text-[10px] font-mono font-bold ${c.text}`}>Platform 팀: {perm}</span>
                  {isOv && <span className="text-[9px] px-1 rounded bg-red-100 text-red-700 font-bold">override</span>}
                </div>
              );
            })}
          </div>
          {override && (
            <div className="text-[10px] text-slate-500 bg-slate-50 border border-slate-200 rounded p-2 leading-snug">
              prod-billing 만 개별 권한으로 잠금 → lee.pay / park.pay 만 Edit, 나머지 팀원은 View 로 강등.
            </div>
          )}
        </div>
      );
    }

    // 데이터소스 권한
    function DataSourceView() {
      const rows = [
        { name: 'prom-shared', type: 'Prometheus', who: '전체 (Viewer 포함)', perm: 'View', sensitive: false },
        { name: 'pg-billing-prod', type: 'PostgreSQL', who: '결제팀만', perm: 'Admin', sensitive: true },
        { name: 'loki-logs', type: 'Loki', who: 'Platform 팀', perm: 'Edit', sensitive: false },
      ];
      return (
        <div className="space-y-2">
          <div className="text-[11px] font-bold text-slate-600 mb-1">데이터소스별 쿼리 권한 — 대시보드 조회와 별개 축</div>
          {rows.map((r) => {
            const c = r.sensitive ? PERM_COLOR.Admin : PERM_COLOR.View;
            return (
              <div key={r.name} className={`rounded-lg border ${c.border} ${r.sensitive ? 'bg-red-50' : 'bg-white'} p-2.5`}>
                <div className="flex items-center gap-1.5">
                  <span className="text-xs">{r.sensitive ? '🔒' : '🗄️'}</span>
                  <span className="text-[11px] font-bold text-slate-800 font-mono">{r.name}</span>
                  <span className="text-[9px] text-slate-400 font-mono">{r.type}</span>
                  <span className={`ml-auto text-[10px] font-bold ${c.text}`}>{r.who}</span>
                </div>
                {r.sensitive && <div className="text-[10px] text-red-600 mt-1">민감 소스 — 팀 단위로 쿼리 제한, Explore 임의 쿼리 차단</div>}
              </div>
            );
          })}
        </div>
      );
    }

    // 실무 함정
    function PitfallsView() {
      const items = [
        { icon: '⚠️', t: 'Editor 과다', d: '아무나 운영 보드 수정 → 기본은 Viewer' },
        { icon: '🔗', t: '상속 오해', d: '폴더 없는 General 보드가 뚫려 있음' },
        { icon: '👤', t: '개인 권한 남발', d: '팀 미활용 → 퇴사자 권한 잔존' },
        { icon: '🌐', t: '공개 대시보드', d: '익명 노출로 내부 지표 유출' },
      ];
      return (
        <div className="space-y-2">
          <div className="text-[11px] font-bold text-slate-600 mb-1">권한 사고를 부르는 4대 함정</div>
          {items.map((it) => (
            <div key={it.t} className="rounded-lg border border-red-200 bg-red-50 p-2.5 flex items-start gap-2">
              <span className="text-base">{it.icon}</span>
              <div>
                <div className="text-xs font-bold text-red-800">{it.t}</div>
                <div className="text-[10px] text-slate-600">{it.d}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function LiveDataPane({ beat, step }) {
      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">🔐</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">Administration / Permissions</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">org: acme-corp</span>
          </div>

          {/* 본체 */}
          <div className="flex-1 p-3 bg-slate-50 overflow-auto">
            {step.mode === 'org' && <OrgRolesView />}
            {step.mode === 'axes' && <AxesView />}
            {step.mode === 'inherit' && <InheritView override={false} />}
            {step.mode === 'override' && <InheritView override={true} />}
            {step.mode === 'datasource' && <DataSourceView />}
            {step.mode === 'pitfalls' && <PitfallsView />}
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (Step 6) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">Part V. 조직·권한</span>
                  <span className="text-[10px] font-mono text-slate-400">V-1-2</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900">Permission — 권한 모델</h1>
                <p className="text-xs text-slate-600">폴더·대시보드 단위의 접근 제어 — 조직 역할 + 리소스 권한 + 상속/override</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                Grafana 권한은 두 축이다 — 조직 역할(Viewer/Editor/Admin)이라는 전역 기본 등급과, 폴더·대시보드에 거는 리소스 권한. 리소스 권한은 개인이 아니라 팀·역할에 주고, 폴더에 걸면 하위 대시보드가 상속한다. 특정 보드만 다르게 잠그려면 개별 권한으로 override하되 예외로만 쓴다. 데이터소스 쿼리 권한은 대시보드 조회와 별개 축이니 민감 소스는 팀 단위로 잠근다. 기본은 Viewer, 부여는 팀/폴더 단위 — 이 원칙이 최소 권한과 권한 감사를 동시에 지킨다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['orgRole', 'Viewer', 'Editor', 'Admin', 'folder-permission', 'inheritance', 'override', 'team', 'datasource-permission', 'least-privilege'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>V-2-1 다음 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
