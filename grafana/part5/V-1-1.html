    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      org: {lang:"bash", filename:"org-create.sh — 조직 생성·전환 (HTTP API)", lines:[
        "#!/usr/bin/env bash",
        "# Grafana HTTP API 로 Organization 관리",
        "# 조직 = 완전 격리된 테넌트 (자체 대시보드/데이터소스/사용자)",
        "GRAFANA=\"http://admin:admin@localhost:3000\"",
        "",
        "# 1) 새 조직 생성 → 격리된 빈 테넌트 하나가 생긴다",
        "curl -s -X POST \"$GRAFANA/api/orgs\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"name\": \"Acme Corp\" }'",
        "# 응답: { \"orgId\": \"2\", \"message\": \"Organization created\" }",
        "",
        "# 2) 조직 목록 확인 (server admin 권한 필요)",
        "curl -s \"$GRAFANA/api/orgs\" | jq '.[] | {id, name}'",
        "# [ {id:1,name:\"Main Org.\"}, {id:2,name:\"Acme Corp\"} ]",
        "",
        "# 3) 내 세션의 \"현재 조직\" 전환",
        "#    로그인은 하나지만 화면은 한 번에 한 조직만 본다",
        "curl -s -X POST \"$GRAFANA/api/user/using/2\"",
        "# 이후 모든 요청은 orgId=2 컨텍스트에서 동작",
        "",
        "# 핵심: orgId=1 의 대시보드는 orgId=2 에서 절대 안 보인다",
        "#  - 데이터소스도 조직별로 따로 등록해야 한다",
        "#  - 조직 간 공유가 필요하면 \"단일 조직 + 팀\" 구조를 택하라",
      ]},
      team: {lang:"bash", filename:"team-setup.sh — 팀 생성·멤버 추가", lines:[
        "#!/usr/bin/env bash",
        "GRAFANA=\"http://admin:admin@localhost:3000\"",
        "# 현재 조직(orgId) 안에서 팀을 만든다",
        "",
        "# 1) Platform 팀 생성",
        "TEAM_ID=$(curl -s -X POST \"$GRAFANA/api/teams\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"name\": \"Platform\", \"email\": \"platform@acme.io\" }' \\",
        "  | jq -r '.teamId')",
        "echo \"created team: $TEAM_ID\"",
        "",
        "# 2) 사용자를 팀에 추가 (userId 는 조직 멤버 중 하나)",
        "curl -s -X POST \"$GRAFANA/api/teams/$TEAM_ID/members\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"userId\": 3 }'",
        "",
        "# 3) 팀 관리자 지정 — members·admins 목록으로 통째로 교체",
        "curl -s -X PUT \"$GRAFANA/api/teams/$TEAM_ID/members\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"members\": [\"lee@acme.io\"], \"admins\": [\"dana@acme.io\"] }'",
        "",
        "# 왜 팀인가?",
        "#  - 권한을 개인마다 주면 퇴사/이동 때마다 전부 손봐야 함",
        "#  - \"팀에 권한\" → 멤버십만 갈아끼우면 권한이 따라감",
        "#  - 한 사람이 여러 팀 소속 가능 (Platform + On-call)",
      ]},
      folder: {lang:"json", filename:"folder-permissions.json — 폴더 권한 (API body)", lines:[
        "// POST /api/folders  → 폴더 생성",
        "{",
        "  \"uid\": \"team-platform\",",
        "  \"title\": \"Team-Platform\"",
        "}",
        "",
        "// POST /api/folders/team-platform/permissions",
        "//  → 이 폴더 + 안의 모든 대시보드에 권한이 상속된다",
        "{",
        "  \"items\": [",
        "    {",
        "      \"teamId\": 1,          // Platform 팀",
        "      \"permission\": 2       // 1=View, 2=Edit, 4=Admin",
        "    },",
        "    {",
        "      \"teamId\": 2,          // Payment 팀",
        "      \"permission\": 1       // 읽기 전용",
        "    },",
        "    {",
        "      \"role\": \"Viewer\",     // 조직의 모든 Viewer",
        "      \"permission\": 1",
        "    }",
        "  ]",
        "}",
        "",
        "// 권한 상속 규칙",
        "//  - 폴더 권한 = 안의 대시보드 기본 권한",
        "//  - 대시보드에 권한을 더 얹을 수는 있어도 낮출 수는 없다",
        "//  - 개인(userId) 대신 팀(teamId)/역할(role)로 거는 게 정석",
      ]},
      invite: {lang:"bash", filename:"invite-user.sh — 초대·조직 역할 지정", lines:[
        "#!/usr/bin/env bash",
        "GRAFANA=\"http://admin:admin@localhost:3000\"",
        "",
        "# 1) 조직에 사용자 초대 (role: Admin / Editor / Viewer)",
        "curl -s -X POST \"$GRAFANA/api/org/invites\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{",
        "    \"loginOrEmail\": \"dana@acme.io\",",
        "    \"name\": \"Dana Kim\",",
        "    \"role\": \"Editor\",",
        "    \"sendEmail\": true",
        "  }'",
        "",
        "# 2) 이미 있는 조직 멤버의 역할 변경",
        "curl -s -X PATCH \"$GRAFANA/api/org/users/5\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"role\": \"Viewer\" }'",
        "",
        "# 조직 역할이 하는 일",
        "#  - Viewer : 대시보드 보기만",
        "#  - Editor : 대시보드 생성/편집 (권한 있는 폴더 안)",
        "#  - Admin  : 사용자/팀/데이터소스까지 관리",
        "",
        "# 함정: 전원 Editor + 폴더 권한 미설정",
        "#   → 아무나 운영 대시보드를 수정 → 폴더 권한으로 잠가라",
      ]},
      decision: {lang:"json", filename:"structure-decision.json — 구조 선택 기준", lines:[
        "{",
        "  \"multiTenant_organizations\": {",
        "    \"when\": \"여러 고객사에 SaaS 로 제공\",",
        "    \"isolation\": \"완전 격리 (대시보드·데이터소스·사용자)\",",
        "    \"share\": \"조직 간 공유 불가\",",

        "    \"when\": \"한 회사 내부에서 팀별 분리\",",
        "    \"isolation\": \"폴더/대시보드 권한으로 부분 격리\",",
        "    \"share\": \"데이터소스·대시보드 공유 쉬움\",",

        "    \"cost\": \"권한 설계를 폴더 단위로 꼼꼼히\"",
        "  },",
        "",
        "  \"rule_of_thumb\": [",
        "    \"외부 고객 격리 → Organization\",",
        "    \"사내 팀 분리 → 단일 Org + Team + Folder\",",
        "    \"권한은 항상 개인이 아니라 팀/역할에\",",
        "    \"처음에 정하라 — 나중 조직 이관은 export/import 대공사\"",
        "  ]",
        "}",
      ]},
    };

    const S1 = { title:"Step 1. Organization — \"완전히 격리된 테넌트\"", desc:"Organization(조직)은 Grafana 안의 독립된 세계다. 조직마다 자체 대시보드·데이터소스·사용자·API 키를 따로 가지며 서로 절대 넘볼 수 없다. 그래서 하나의 Grafana 인스턴스로 여러 회사(테넌트)를 완전히 격리해 서비스할 수 있다. 한 사용자가 여러 조직에 속할 수도 있지만, 로그인 후에는 항상 하나의 \"현재 조직\" 컨텍스트에서만 화면이 보인다. 조직을 나누면 격리는 강력하지만 대시보드·데이터소스를 조직 간에 공유할 수 없다는 점을 처음에 오해하기 쉽다." };
    const S2 = { title:"Step 2. Team — \"조직 안 사용자 그룹\"", desc:"Team(팀)은 한 조직 안에서 사용자를 묶는 그룹이다. 조직이 건물이라면 팀은 그 안의 부서다. 팀 자체는 격리 단위가 아니라 \"권한을 한 번에 부여하기 위한 묶음\"이다. 폴더나 대시보드 권한을 개인마다 일일이 주면 사람이 바뀔 때마다 지옥이 되지만, \"Platform 팀에 Edit 권한\"처럼 팀에 주면 입·퇴사 시 팀 멤버십만 바꾸면 끝난다. 한 사용자는 여러 팀에 동시에 속할 수 있고, 팀 안에서 Member/Admin 역할을 갖는다." };

        keyPoint:'조직 역할(Admin/Editor/Viewer)은 기본값. 세밀한 접근은 팀·폴더 권한이 최종 결정한다.',
        code:{...CODE.invite, highlight:[24,25]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'멀티테넌시가 맞는 자리', at:'structure-decision.json L2–4',
               caption:'여러 고객사에 SaaS로 제공하는 상황이면 Organization으로 나눈다. 대시보드·데이터소스·사용자가 전부 격리된다.',
               changes:[{mark:'read', text:'조건: 여러 고객사 SaaS'},
                        {mark:'read', text:'격리 수준: 완전'}] },
        mode:'compare', focus:'compare',
        keyPoint:'고객사끼리 절대 서로 보면 안 되는 상황 — 그때만 Organization을 나눈다.',
        code:{...CODE.decision, highlight:[2,3,4]},
      },
      { ...S5,
        beat:{ label:'격리가 남기는 비용', at:'structure-decision.json L5–8',
               caption:'조직 간 공유가 막히므로 같은 Prometheus도 조직마다 다시 등록해야 한다. 격리의 대가가 중복 관리다.',
               changes:[{mark:'gone', text:'조직 간 공유 불가'},
                        {mark:'changed', text:'데이터소스 중복 등록'}] },
        mode:'compare', focus:'compare',
        keyPoint:'격리의 청구서는 중복 등록이다 — 조직 수만큼 데이터소스가 늘어난다.',
        code:{...CODE.decision, highlight:[5,6,7,8]},
      },
      { ...S5,
        beat:{ label:'단일 조직 + 팀 쪽', at:'structure-decision.json L10–12',
               caption:'한 회사 내부의 팀 분리라면 조직은 하나로 두고 폴더·대시보드 권한으로 부분 격리한다.',
               changes:[{mark:'read', text:'조건: 사내 팀 분리'},
                        {mark:'changed', text:'격리 수준: 부분'}] },
        mode:'compare', focus:'compare',
        keyPoint:'사내 팀 분리는 부분 격리로 충분하다 — 폴더 권한이 경계 역할을 한다.',
        code:{...CODE.decision, highlight:[10,11,12]},
      },
      { ...S5,
        beat:{ label:'공유가 살아난다', at:'structure-decision.json L13–16',
               caption:'같은 조직이므로 데이터소스를 공용으로 쓰고 팀 간 대시보드도 참조할 수 있다. 대신 폴더 권한 설계를 꼼꼼히 해야 한다.',
               changes:[{mark:'new', text:'공용 Prometheus 사용'},
                        {mark:'changed', text:'폴더 권한 설계 부담'}] },
        mode:'compare', focus:'compare',
        keyPoint:'공유를 얻는 대신 폴더 권한 설계를 정교하게 해야 한다.',
        code:{...CODE.decision, highlight:[13,14,15,16]},
      },
      { ...S5,
        beat:{ label:'판단 기준 두 줄', at:'structure-decision.json L18–20',
               caption:'외부 고객 격리면 Organization, 사내 팀 분리면 단일 Org + Team + Folder — 이 두 줄로 대부분 정리된다.',
               changes:[{mark:'read', text:'외부 고객 → Organization'},
                        {mark:'read', text:'사내 팀 → 단일 Org + Team'}] },
        mode:'compare', focus:'compare',
        keyPoint:'외부 고객이면 Organization, 사내면 단일 조직 — 이 한 줄이 첫 갈림길이다.',
        code:{...CODE.decision, highlight:[18,19,20]},
      },
      { ...S5,
        beat:{ label:'처음에 정하라', at:'structure-decision.json L21–23',
               caption:'권한은 언제나 팀·역할에 걸고, 구조는 처음에 결정한다. 나중에 조직을 옮기려면 export/import 대공사가 된다.',
               changes:[{mark:'read', text:'권한은 팀/역할에'},
                        {mark:'gone', text:'나중 조직 이관은 대공사'}] },
        mode:'compare', focus:'compare',
        summary:{
          title:'조직 구조 4가지 함정',
          points:[
            'Organization과 Team 혼동 — Org=격리 테넌트, Team=권한 묶음',
            '폴더 없이 대시보드 난립 — 검색·권한이 동시에 무너진다',
            'Team 미활용, 개인마다 권한 — 입·퇴사 때마다 손봐야 함',
            '격리 오해 — 조직을 나누면 데이터소스도 공유 불가',
          ],
        },
        keyPointCompare:true,
        keyPoint:'여러 고객사=Organization 격리, 사내 팀 분리=단일 조직+팀+폴더. 처음에 결정하라.',
        code:{...CODE.decision, highlight:[21,22,23]},
      },
    ];

    // ── 재사용 조각들





    // ── 우측: VSCode CodeViewer
    // ── RefPanel ── 예전 왼쪽 패널에만 있던 표·정리 (anim/lesson.jsx 가 "표·정리 보기" 상자에 넣는다)
    function RefPanel({ step }) {
      if (step.mode === 'teams') return (
        <div>
          <h4>Acme Corp 조직 안의 팀 (예시)</h4>
          <table><thead><tr><th>팀</th><th>멤버 (조직 역할)</th></tr></thead><tbody>
            <tr><td>Platform</td><td>Dana (Editor) · Sam (Admin) · Lee (Editor)</td></tr>
            <tr><td>Payment</td><td>Kim (Editor) · Park (Viewer)</td></tr>
            <tr><td>On-call</td><td>Sam (Editor) · Dana (Editor)</td></tr>
          </tbody></table>
          <p className="mt-1">Sam과 Dana처럼 한 사람이 여러 팀에 속할 수 있다. 팀은 격리 단위가 아니라 권한을 한 번에 주기 위한 묶음이다.</p>
        </div>);
      if (step.mode === 'folders') return (
        <div>
          <h4>폴더별 권한과 안의 대시보드 (예시)</h4>
          <table><thead><tr><th>폴더</th><th>권한</th><th>대시보드</th></tr></thead><tbody>
            <tr><td>Team-Platform</td><td>Platform 팀: Edit</td><td>Service Health · Latency · K8s Nodes</td></tr>
            <tr><td>Team-Payment</td><td>Payment 팀: Edit</td><td>Checkout · Fraud Rate</td></tr>
            <tr><td>Shared (전사 공개)</td><td>Viewer: View</td><td>SLO Overview · Cost</td></tr>
          </tbody></table>
          <p className="mt-1">permission 숫자: 1=View, 2=Edit, 4=Admin. 폴더에 걸면 안의 대시보드가 모두 같은 권한을 받는다.</p>
        </div>);
      if (step.mode === 'roles') return (
        <div>
          <h4>조직 역할 세 가지</h4>
          <table><thead><tr><th>사용자 (예시)</th><th>역할</th><th>대시보드</th><th>관리</th></tr></thead><tbody>
            <tr><td>Sam</td><td>Admin</td><td>생성·편집</td><td>사용자·팀·데이터소스</td></tr>
            <tr><td>Dana</td><td>Editor</td><td>생성·편집</td><td>불가</td></tr>
            <tr><td>Park</td><td>Viewer</td><td>보기만</td><td>불가</td></tr>
          </tbody></table>
          <p className="mt-1">조직 역할은 기본값이다. 실제 접근은 폴더·대시보드 권한과 팀 멤버십이 겹쳐 정해진다.</p>
        </div>);
      if (step.mode === 'compare') return (
        <div>
          <h4>격리냐 공유냐, 두 구조</h4>
          <table><thead><tr><th></th><th>Organization 격리</th><th>단일 Org + Team</th></tr></thead><tbody>
            <tr><td>맞는 상황</td><td>여러 고객사 SaaS</td><td>사내 팀 분리</td></tr>
            <tr><td>격리 수준</td><td>완전 격리 (서로 안 보임)</td><td>폴더 권한으로 부분 격리</td></tr>
            <tr><td>공유</td><td>불가</td><td>쉬움</td></tr>
            <tr><td>데이터소스</td><td>조직마다 중복 등록</td><td>공용</td></tr>
          </tbody></table>
          {step.summary && (<div className="mt-2"><h4>{step.summary.title}</h4>
            <ul>{step.summary.points.map((p, i) => <li key={i}>{p}</li>)}</ul></div>)}
        </div>);
      return null;
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={"hidden language-" + code.lang}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={"flex " + (isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : '')} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
