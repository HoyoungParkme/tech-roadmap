      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);

    학습 목표: Organization(격리 테넌트) / Team(사용자 그룹) / Folder(대시보드 묶음) 계층과 권한 부여

    색상: #F46800 (Grafana brand orange)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      org: {lang:"bash", filename:"org-create.sh — 조직 생성·전환 (HTTP API)", lines:[
        "#!/usr/bin/env bash",
        "# Grafana HTTP API 로 Organization 관리",
        "# 조직 = 완전 격리된 테넌트 (자체 대시보드/데이터소스/사용자)",
        "GRAFANA=\"http://admin:admin@localhost:3000\"",
        "",
        "# 1) 새 조직 생성 → 격리된 빈 테넌트 하나가 생긴다",
        "curl -s -X POST \"$GRAFANA/api/orgs\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"name\": \"Acme Corp\" }'",
        "# 응답: { \"orgId\": 2, \"message\": \"Organization created\" }",
        "",
        "# 2) 조직 목록 확인 (server admin 권한 필요)",
        "curl -s \"$GRAFANA/api/orgs\" | jq '.[] | {id, name}'",
        "# [ {id:1,name:\"Main Org.\"}, {id:2,name:\"Acme Corp\"} ]",
        "",
        "# 3) 내 세션의 \"현재 조직\" 전환",
        "#    로그인은 하나지만 화면은 한 번에 한 조직만 본다",
        "curl -s -X POST \"$GRAFANA/api/user/using/2\"",
        "# 이후 모든 요청은 orgId=2 컨텍스트에서 동작",
        "",
        "# 핵심: orgId=1 의 대시보드는 orgId=2 에서 절대 안 보인다",
        "#  - 데이터소스도 조직별로 따로 등록해야 한다",
        "#  - 조직 간 공유가 필요하면 \"단일 조직 + 팀\" 구조를 택하라",
      ]},
      team: {lang:"bash", filename:"team-setup.sh — 팀 생성·멤버 추가", lines:[
        "#!/usr/bin/env bash",
        "GRAFANA=\"http://admin:admin@localhost:3000\"",
        "# 현재 조직(orgId) 안에서 팀을 만든다",
        "",
        "# 1) Platform 팀 생성",
        "TEAM_ID=$(curl -s -X POST \"$GRAFANA/api/teams\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"name\": \"Platform\", \"email\": \"platform@acme.io\" }' \\",
        "  | jq -r '.teamId')",
        "echo \"created team: $TEAM_ID\"",
        "",
        "# 2) 사용자를 팀에 추가 (userId 는 조직 멤버 중 하나)",
        "curl -s -X POST \"$GRAFANA/api/teams/$TEAM_ID/members\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"userId\": 3 }'",
        "",
        "# 3) 팀 안에서의 역할 지정 (Member / Admin)",
        "curl -s -X PUT \"$GRAFANA/api/teams/$TEAM_ID/members/3\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"permission\": 4 }'   # 4 = Team Admin, 0 = Member",
        "",
        "# 왜 팀인가?",
        "#  - 권한을 개인마다 주면 퇴사/이동 때마다 전부 손봐야 함",
        "#  - \"팀에 권한\" → 멤버십만 갈아끼우면 권한이 따라감",
        "#  - 한 사람이 여러 팀 소속 가능 (Platform + On-call)",
      ]},
      folder: {lang:"json", filename:"folder-permissions.json — 폴더 권한 (API body)", lines:[
        "// POST /api/folders  → 폴더 생성",
        "{",
        "  \"uid\": \"team-platform\",",
        "  \"title\": \"Team-Platform\"",
        "}",
        "",
        "// POST /api/folders/team-platform/permissions",
        "//  → 이 폴더 + 안의 모든 대시보드에 권한이 상속된다",
        "{",
        "  \"items\": [",
        "    {",
        "      \"teamId\": 1,          // Platform 팀",
        "      \"permission\": 2       // 1=View, 2=Edit, 4=Admin",
        "    },",
        "    {",
        "      \"teamId\": 2,          // Payment 팀",
        "      \"permission\": 1       // 읽기 전용",
        "    },",
        "    {",
        "      \"role\": \"Viewer\",     // 조직의 모든 Viewer",
        "      \"permission\": 1",
        "    }",
        "  ]",
        "}",
        "",
        "// 권한 상속 규칙",
        "//  - 폴더 권한 = 안의 대시보드 기본 권한",
        "//  - 대시보드에서 개별로 덮어쓸 수도 있으나 지양",
        "//  - 개인(userId) 대신 팀(teamId)/역할(role)로 거는 게 정석",
      ]},
      invite: {lang:"bash", filename:"invite-user.sh — 초대·조직 역할 지정", lines:[
        "#!/usr/bin/env bash",
        "GRAFANA=\"http://admin:admin@localhost:3000\"",
        "",
        "# 1) 조직에 사용자 초대 (이메일 링크 발송)",
        "curl -s -X POST \"$GRAFANA/api/org/invites\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{",
        "    \"loginOrEmail\": \"dana@acme.io\",",
        "    \"name\": \"Dana Kim\",",
        "    \"role\": \"Editor\",       # Admin / Editor / Viewer",
        "    \"sendEmail\": true",
        "  }'",
        "",
        "# 2) 이미 있는 조직 멤버의 역할 변경",
        "curl -s -X PATCH \"$GRAFANA/api/org/users/5\" \\",
        "  -H \"Content-Type: application/json\" \\",
        "  -d '{ \"role\": \"Viewer\" }'",
        "",
        "# 조직 역할이 하는 일",
        "#  - Viewer : 대시보드 보기만",
        "#  - Editor : 대시보드 생성/편집 (권한 있는 폴더 안)",
        "#  - Admin  : 사용자/팀/데이터소스까지 관리",
        "",
        "# 함정: 전원 Editor + 폴더 권한 미설정",
        "#   → 아무나 운영 대시보드를 수정 → 폴더 권한으로 잠가라",
      ]},
      decision: {lang:"json", filename:"structure-decision.json — 구조 선택 기준", lines:[
        "{",
        "  \"multiTenant_organizations\": {",
        "    \"when\": \"여러 고객사에 SaaS 로 제공\",",
        "    \"isolation\": \"완전 격리 (대시보드·데이터소스·사용자)\",",
        "    \"share\": \"조직 간 공유 불가\",",
        "    \"example\": \"고객사 A / 고객사 B 를 절대 서로 못 봄\",",
        "    \"cost\": \"데이터소스를 조직마다 중복 등록\"",
        "  },",
        "",
        "  \"singleOrg_teams_folders\": {",
        "    \"when\": \"한 회사 내부에서 팀별 분리\",",
        "    \"isolation\": \"폴더/대시보드 권한으로 부분 격리\",",
        "    \"share\": \"데이터소스·대시보드 공유 쉬움\",",
        "    \"example\": \"Platform / Payment 팀이 공용 Prometheus 사용\",",
        "    \"cost\": \"권한 설계를 폴더 단위로 꼼꼼히\"",
        "  },",
        "",
        "  \"rule_of_thumb\": [",
        "    \"외부 고객 격리 → Organization\",",
        "    \"사내 팀 분리 → 단일 Org + Team + Folder\",",
        "    \"권한은 항상 개인이 아니라 팀/역할에\",",
        "    \"처음에 정하라 — 나중 조직 이관은 export/import 대공사\"",
        "  ]",
        "}",
      ]},
    };

    const S1 = { title:"Step 1. Organization — \"완전히 격리된 테넌트\"", desc:"Organization(조직)은 Grafana 안의 독립된 세계다. 조직마다 자체 대시보드·데이터소스·사용자·API 키를 따로 가지며 서로 절대 넘볼 수 없다. 그래서 하나의 Grafana 인스턴스로 여러 회사(테넌트)를 완전히 격리해 서비스할 수 있다. 한 사용자가 여러 조직에 속할 수도 있지만, 로그인 후에는 항상 하나의 \"현재 조직\" 컨텍스트에서만 화면이 보인다. 조직을 나누면 격리는 강력하지만 대시보드·데이터소스를 조직 간에 공유할 수 없다는 점을 처음에 오해하기 쉽다." };
    const S2 = { title:"Step 2. Team — \"조직 안 사용자 그룹\"", desc:"Team(팀)은 한 조직 안에서 사용자를 묶는 그룹이다. 조직이 건물이라면 팀은 그 안의 부서다. 팀 자체는 격리 단위가 아니라 \"권한을 한 번에 부여하기 위한 묶음\"이다. 폴더나 대시보드 권한을 개인마다 일일이 주면 사람이 바뀔 때마다 지옥이 되지만, \"Platform 팀에 Edit 권한\"처럼 팀에 주면 입·퇴사 시 팀 멤버십만 바꾸면 끝난다. 한 사용자는 여러 팀에 동시에 속할 수 있고, 팀 안에서 Member/Admin 역할을 갖는다." };
    const S3 = { title:"Step 3. Folder — \"대시보드 서류함 + 권한 단위\"", desc:"Folder(폴더)는 대시보드를 묶는 서류함이자 권한의 기본 단위다. 대시보드 하나하나에 권한을 거는 대신 폴더에 권한을 걸면 그 안의 모든 대시보드에 자동 상속된다. 실무에서는 \"Team-Platform\" 폴더에 Platform 팀 Edit, 나머지 Viewer 식으로 폴더 단위로 정리한다. 폴더 없이 대시보드를 루트에 난립시키면 수백 개가 뒤섞여 검색도 권한 관리도 무너진다. 폴더 → 대시보드 → 패널로 내려가는 트리를 먼저 설계하는 것이 조직 운영의 출발점이다." };
    const S4 = { title:"Step 4. 사용자 초대 · 역할 — \"누가 무엇을 할 수 있나\"", desc:"사용자는 조직에 초대되어야 화면을 볼 수 있고, 조직 안에서 Admin / Editor / Viewer 세 가지 조직 역할 중 하나를 갖는다. Viewer는 보기만, Editor는 대시보드 생성·편집, Admin은 사용자·팀·데이터소스까지 관리한다. 이 조직 역할은 \"기본값\"이고, 실제 세밀한 접근은 폴더/대시보드 권한과 팀 멤버십이 겹쳐서 결정된다. 초대 시 이메일로 링크를 보내거나, SSO를 붙이면 로그인 시 자동으로 조직·역할이 매핑된다. 흔한 함정은 모두를 Editor로 만들어 놓고 폴더 권한을 안 걸어 아무나 운영 보드를 수정하는 상황이다." };
    const S5 = { title:"Step 5. 멀티테넌시 vs 단일 조직+팀 — \"격리냐 공유냐\"", desc:"구조 선택의 핵심 질문은 \"테넌트끼리 완전 격리인가, 아니면 한 회사 안에서 팀별로 나누는가\"다. 여러 고객사에 SaaS로 대시보드를 제공한다면 Organization으로 완전 격리(멀티테넌시)해 서로의 데이터가 절대 안 보이게 한다. 반대로 한 회사 내부라면 단일 조직 + 팀 + 폴더 권한이 정석이다. 데이터소스를 공유하고, 팀 간 대시보드를 참조할 수 있기 때문이다. 조직으로 나누면 공유가 막히고, 팀으로만 나누면 격리가 약하다. 이 트레이드오프를 처음에 정하지 않으면 나중에 조직 이관(대시보드 export/import)이라는 큰 작업이 생긴다." };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={"hidden language-" + code.lang}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={"flex " + (isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : '')} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));

        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;

          setStepIdx((i) => {

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Organization', 'Team', 'Folder', 'Multi-tenancy', 'Role', 'Permission', 'Invite', 'API'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
