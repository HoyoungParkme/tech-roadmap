  <!--
    II-1-1. Prometheus — 메트릭 시각화 — fastapi v1 패턴
    학습 목표: PromQL(rate·sum by·histogram_quantile)로 메트릭을 조회해 Grafana 패널로 렌더한다
    핵심 흐름: PromQL 쿼리 → Prometheus TSDB → Grafana timeseries → legend 포맷·변수 필터
    패턴: 좌(LiveDataPane: 쿼리 에디터 + 시계열 패널 모방) / 우(VSCode: promql + json)
    색상: #F46800 (Grafana brand orange)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 시리즈 색상 팔레트 (Grafana 기본 계열과 유사)
    const SERIES_COLOR = {
      green:  '#22c55e',
      blue:   '#3b82f6',
      orange: '#F46800',
      red:    '#ef4444',
      purple: '#a855f7',
    };

    const STEPS = [
      {
        title: 'Step 1. 데이터소스 연결 — "Prometheus를 패널에 물린다"',
        desc: 'Grafana 패널은 스스로 데이터를 만들지 않는다. datasource로 Prometheus를 지정해야 쿼리를 보낼 곳이 생긴다. 왜 rate()부터 배우나? Prometheus의 http_requests_total 같은 counter는 계속 커지기만 하는 누적값이라 그래프로 그리면 우상향 직선일 뿐 의미가 없다. rate()로 "초당 증가율"로 바꿔야 비로소 트래픽 곡선이 된다. [5m]은 기울기를 계산할 시간 창(range) — 짧으면 뾰족하고 길면 완만해진다.',
        query: 'rate(http_requests_total[5m])',
        datasource: 'Prometheus',
        mode: 'range',
        legendFormat: '',
        variable: null,
        series: [
          { name: '{job="api", instance="10.0.0.1", status="200"}', color: 'green', wave: 0, base: 40, amp: 12 },
          { name: '{job="api", instance="10.0.0.2", status="200"}', color: 'blue', wave: 1, base: 34, amp: 10 },
          { name: '{job="api", instance="10.0.0.1", status="500"}', color: 'red', wave: 2, base: 8, amp: 5 },

        legendRaw: true,
        keyPoint: 'counter는 rate()로 초당 증가율로 바꿔야 그래프가 의미를 갖는다. [5m]은 기울기 계산 창.',
        code: {
          lang: 'promql',
          filename: 'query.promql — 첫 쿼리 (rate)',
          lines: [
            '-- Grafana 패널의 Query 에디터에 입력하는 PromQL',
            '-- datasource: Prometheus (패널 상단에서 선택)',
            '',
            '-- (1) 원본 counter — 누적값. 그대로 그리면 우상향 직선뿐',
            'http_requests_total',
            '',
            '-- (2) rate(): 지난 5분간의 초당 평균 증가율',
            '--     counter reset(재시작)도 자동 보정해 준다',
            'rate(http_requests_total[5m])',
            '',
            '-- range 벡터 [5m] = 각 시점마다 과거 5분 구간을 본다',
            '--   짧게 [1m]  → 민감하고 뾰족한 곡선 (스파이크 잘 보임)',
            '--   길게  [10m] → 완만하게 스무딩된 곡선 (추세 파악)',
            '',
            '-- 이 쿼리는 label 조합마다 별도 시계열을 반환한다',

      {
        title: 'Step 2. sum by — "필요 없는 label을 접어 라인 수를 줄인다"',

        query: 'sum by (job, status) (rate(http_requests_total[5m]))',
        datasource: 'Prometheus',
        mode: 'range',
        legendFormat: '',
        variable: null,
        series: [
          { name: '{job="api", status="200"}', color: 'green', wave: 0, base: 72, amp: 16 },
          { name: '{job="api", status="500"}', color: 'red', wave: 2, base: 10, amp: 5 },

            '',
            '-- without 은 반대 — 지정 label만 버리고 나머지 유지',
            'sum without (instance) (rate(http_requests_total[5m]))',
            '',
            '-- 자주 쓰는 집계 연산자',
            '--   sum   합계 (RPS, 총 에러 수)',
            '--   avg   평균 (CPU 사용률)',
            '--   max   최댓값 (가장 뜨거운 노드)',
            '--   count 시계열 개수 (살아있는 인스턴스 수)',

          highlight: [3, 4, 5, 8],
        },
      },
      {
        title: 'Step 3. legend 포맷 — "{{label}} 로 범례를 사람이 읽게"',

        query: 'sum by (job, status) (rate(http_requests_total[5m]))',
        datasource: 'Prometheus',
        mode: 'range',
        legendFormat: '{{job}} · {{status}}',
        variable: null,
        series: [
          { name: 'api · 200', color: 'green', wave: 0, base: 72, amp: 16 },
          { name: 'api · 500', color: 'red', wave: 2, base: 10, amp: 5 },
        ],
        legendRaw: false,
        keyPoint: 'Legend 옵션에 {{label}} — 표시용 이름만 바꾼다. 값은 불변, 가독성만 개선.',
        code: {
          lang: 'json',
          filename: 'panel.json — legend 포맷 + 시간 범위',
          lines: [
            '{',
            '  "type": "timeseries",',
            '  "title": "요청 처리율 (RPS)",',
            '  "datasource": { "type": "prometheus", "uid": "prom-default" },',
            '',
            '  "targets": [',
            '    {',
            '      "refId": "A",',
            '      "expr": "sum by (job, status) (rate(http_requests_total[5m]))",',
            '',
            '      "range": true,        // range 쿼리 — 시계열(그래프)용',

            '      "legendFormat": "{{job}} · {{status}}"',

            '',
            '  "fieldConfig": {',

            '}',
            '',
            '// range  vs  instant',
            '//   range   : from~to 전 구간을 step 간격으로 → 선 그래프',

            '#   { "name": "job", "type": "query",',
            '#     "query": "label_values(http_requests_total, job)" }',
            '#   → 드롭다운으로 api / checkout / search 전환',
            '',
            '# 3) exemplar — 그래프 점에서 trace 로 점프 (datasource 옵션)',

            '',
            '# 실무 함정 체크리스트',
            '#   - 무거운 쿼리(높은 카디널리티) → recording rule로 선계산',
            '#   - legend 미포맷 → 스크린샷에서 판독 불가',
            '#   - step 부적절 → 촘촘하면 느리고, 성기면 스파이크 유실',
            '#   - 시간 범위 과다(30d) → raw 쿼리는 타임아웃, rule 필수',
          ],
          highlight: [7, 8, 9, 10, 13],
        },
      },
    ];

    // ── 시계열 라인 생성기 (step 마다 다른 파형)
    function seriesPath(s, W, H) {
      const N = 40;
      const pts = [];
      for (let i = 0; i < N; i++) {
        const x = (i / (N - 1)) * W;
        const t = i / (N - 1);
        // wave 종류별로 살짝 다른 형태 + 결정적 노이즈
        const noise = Math.sin(i * (1.7 + s.wave)) * (s.amp * 0.25);
        const swell = Math.sin(t * Math.PI * (1 + s.wave * 0.6) + s.wave) * s.amp;
        const v = s.base + swell + noise;
        const y = H - (v / 100) * H;
        pts.push(`${x.toFixed(1)},${Math.max(2, Math.min(H - 2, y)).toFixed(1)}`);
      }
      return pts.join(' ');
    }

    function TimeseriesPanel({ step }) {
      const W = 300, H = 130;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: 150 }} preserveAspectRatio="none">
          {/* 그리드 */}
          {[0.25, 0.5, 0.75].map((g) => (
            <line key={g} x1="0" y1={H * g} x2={W} y2={H * g} stroke="#e2e8f0" strokeWidth="1" />
          ))}
          {step.series.map((s, i) => (
            <polyline
              key={i}
              points={seriesPath(s, W, H)}
              fill="none"
              stroke={SERIES_COLOR[s.color]}
              strokeWidth="2"
              vectorEffect="non-scaling-stroke"
            />
          ))}
          {/* exemplar 마커 */}
          {step.exemplar && (
            <g>
              <rect x="210" y="30" width="8" height="8" transform="rotate(45 214 34)" fill="#B84F00" />
              <rect x="150" y="52" width="8" height="8" transform="rotate(45 154 56)" fill="#B84F00" />
            </g>
          )}
        </svg>
      );
    }

    function LiveDataPane({ step }) {
      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">📊</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">Edit Panel</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">⏱ last 1h · step auto · ↻ 30s</span>
          </div>

          {/* datasource + 변수 행 */}
          <div className="bg-slate-50 px-3 py-1.5 flex items-center gap-2 border-b border-slate-200 flex-wrap">
            <span className="text-[10px] text-slate-500 font-bold">datasource:</span>
            <span className="text-[10px] px-1.5 py-0.5 rounded bg-grafana-soft text-grafana-deep font-mono">🔥 {step.datasource}</span>
            {step.variable && (
              <span className="ml-auto flex items-center gap-1 text-[10px] text-slate-600">
                <span className="font-bold">${step.variable.name}:</span>
                <span className="px-1.5 py-0.5 rounded border border-grafana-orange bg-white font-mono text-grafana-deep">
                  {step.variable.value} ▾
                </span>
              </span>
            )}
          </div>

          {/* PromQL 쿼리 에디터 */}
          <div className="px-3 py-2 bg-[#1f2430] border-b border-slate-700">
            <div className="text-[9px] text-slate-500 mb-1 font-mono">PromQL query · refId A</div>
            <div className="text-[11px] font-mono text-orange-300 break-all leading-relaxed">{step.query}</div>
          </div>

          {/* 흐름 표시 */}
          <div className="px-3 py-1 bg-slate-50 border-b border-slate-200 flex items-center justify-center gap-2 text-[9px] text-slate-500 font-mono">
            <span>PromQL</span><span className="grafana-orange">→</span>
            <span>Prometheus TSDB</span><span className="grafana-orange">→</span>
            <span className="font-bold text-slate-700">timeseries 패널</span>
          </div>

          {/* timeseries 패널 본체 */}
          <div className="flex-1 p-3 bg-slate-100">
            <div className="rounded border border-slate-200 bg-white shadow-sm overflow-hidden">
              <div className="px-2 py-1 border-b border-slate-200 bg-white/60 flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-grafana-orange"></span>
                <span className="text-[10px] font-bold text-slate-700">
                  {step.unit === 's' ? '지연시간' : '요청 처리율'}
                </span>
                <span className="ml-auto text-[8px] text-slate-400 font-mono">
                  unit: {step.unit === 's' ? 's' : 'reqps'} · {step.mode}
                </span>
              </div>
              <div className="px-1 pt-1">
                <TimeseriesPanel step={step} />
              </div>
              {/* legend */}
              <div className="px-2 py-1.5 border-t border-slate-100 flex flex-wrap gap-x-3 gap-y-1">
                {step.series.map((s, i) => (
                  <div key={i} className="flex items-center gap-1">
                    <span className="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: SERIES_COLOR[s.color] }}></span>
                    <span className={`text-[9px] font-mono ${step.legendRaw ? 'text-slate-400' : 'text-slate-700 font-bold'}`}>
                      {s.name}
                    </span>
                  </div>
                ))}
              </div>
              {step.legendRaw && (
                <div className="px-2 pb-1.5 text-[8px] text-red-400 font-mono">
                  ⚠ legend 미포맷 — 중괄호 범벅이라 읽기 어렵다
                </div>
              )}
              {step.exemplar && (
                <div className="px-2 pb-1.5 text-[8px] text-grafana-deep font-mono flex items-center gap-1">
                  <span className="inline-block w-2 h-2 rotate-45" style={{ backgroundColor: '#B84F00' }}></span>
                  exemplar — 점 클릭 시 trace로 점프
                </div>
              )}
            </div>
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (Step 5) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      // promql 은 hljs 미지원 → sql 로 하이라이트 (유사 문법)
      const hlLang = code.lang === 'promql' ? 'sql' : code.lang;

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${hlLang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-grafana-soft text-grafana-deep">Part II. 데이터 소스</span>
                  <span className="text-[10px] font-mono text-slate-400">II-1-1</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900">Prometheus — 메트릭 시각화</h1>
                <p className="text-xs text-slate-600">PromQL로 메트릭을 조회해 대시보드로 — rate · sum by · histogram_quantile</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} aria-label="이전 단계" disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} aria-label="다음 단계" disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3.5초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                PromQL은 counter를 rate()로 초당 증가율로 바꾸고, sum by (…)로 카디널리티를 낮춰 라인을 정리한다. legend는 {'{{label}}'}로 포맷해 읽히게 만들고, range는 그래프·instant는 단일값이라는 걸 구분한다. p99는 histogram_quantile(0.99, sum by (le)(rate(..._bucket[5m])))의 순서를 지켜 뽑는다. 무거운 쿼리는 recording rule로 선계산하고 변수 $job으로 동적화하면 빠르고 재사용 가능한 대시보드가 된다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['PromQL', 'rate', 'sum by', 'histogram_quantile', 'legendFormat', 'range/instant', 'variable', 'recording rule', 'exemplar', 'cardinality'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>II-1-2 Loki 로그 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
