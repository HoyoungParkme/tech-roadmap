<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grafana 인터랙티브 학습</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📊</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
    .grafana-orange { color: #F46800; }
    .bg-grafana-orange { background-color: #F46800; }
    .border-grafana-orange { border-color: #F46800; }
    .bg-grafana-soft { background-color: #FFF1E6; }
    .text-grafana-deep { color: #B84F00; }
    .hover-grafana-soft:hover { background-color: #FFF1E6; }
  </style>
  <!-- 필기노트 공통 스킨(hub) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-image:none !important; background-color:#fffdf7 !important; font-family:Pretendard, system-ui, sans-serif; }
    #root > div { background-image:none !important; background-color:#fffdf7 !important; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color:#faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color:#2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color:#57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color:#8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color:#cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow:3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius:8px !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color:#faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    Grafana 인터랙티브 학습 — 사이드바 + iframe (mlops/observability 표준 패턴)
    역할: 5 Parts × 20 sections, Phase A 시점 Part I+II = 8개 ready / 12 planned
    색상: Grafana brand orange #F46800 단일 톤
  -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SECTIONS = [
      {
        part: 'I',
        label: 'Part I. 기초 — Dashboard / Panel',
        items: [
          { id: 'I-1-1', title: 'Dashboard란 무엇인가', file: './part1/I-1-1.html' },
          { id: 'I-1-2', title: 'Panel 개념', file: './part1/I-1-2.html' },
          { id: 'I-2-1', title: 'Visualization Type 6종', file: './part1/I-2-1.html' },
          { id: 'I-2-2', title: 'Data Source 추상화', file: './part1/I-2-2.html' },
        ],
      },
      {
        part: 'II',
        label: 'Part II. Data Source & Variable',
        items: [
          { id: 'II-1-1', title: 'Prometheus (metrics)', file: './part2/II-1-1.html' },
          { id: 'II-1-2', title: 'Loki (logs)', file: './part2/II-1-2.html' },
          { id: 'II-2-1', title: 'SQL (Postgres/MySQL)', file: './part2/II-2-1.html' },
          { id: 'II-2-2', title: 'Variable & Template', file: './part2/II-2-2.html' },
        ],
      },
      {
        part: 'III',
        label: 'Part III. Alerting (예정)',
        items: [
          { id: 'III-1-1', title: 'Alert Rule', file: './part3/III-1-1.html' },
          { id: 'III-1-2', title: 'Notification Policy', file: './part3/III-1-2.html' },
          { id: 'III-2-1', title: 'Contact Point', file: './part3/III-2-1.html' },
          { id: 'III-2-2', title: 'Silence & Mute', file: './part3/III-2-2.html' },
        ],
      },
      {
        part: 'IV',
        label: 'Part IV. Provisioning & Plugin (예정)',
        items: [
          { id: 'IV-1-1', title: 'Dashboard as JSON', file: './part4/IV-1-1.html' },
          { id: 'IV-1-2', title: 'Datasource provisioning', file: './part4/IV-1-2.html' },
          { id: 'IV-2-1', title: 'Plugin 설치·관리', file: './part4/IV-2-1.html' },
          { id: 'IV-2-2', title: 'Dashboard provisioning', file: './part4/IV-2-2.html' },
        ],
      },
      {
        part: 'V',
        label: 'Part V. 실전 운영 (예정)',
        items: [
          { id: 'V-1-1', title: 'Organization & Team', file: './part5/V-1-1.html' },
          { id: 'V-1-2', title: 'Permission', file: './part5/V-1-2.html' },
          { id: 'V-2-1', title: 'RBAC', file: './part5/V-2-1.html' },
          { id: 'V-2-2', title: 'SSO', file: './part5/V-2-2.html' },
        ],
      },
    ];

    const TOTAL = SECTIONS.reduce((s, sec) => s + sec.items.length, 0);
    const READY = SECTIONS.reduce((s, sec) => s + sec.items.filter(i => i.file).length, 0);

    function findItemById(id) {
      for (const section of SECTIONS) {
        const found = section.items.find(item => item.id === id);
        if (found) return { ...found, part: section.part };
      }
      return null;
    }

    function App() {
      const [currentId, setCurrentId] = useState(null);

      // hash 라우팅 (#/I-1-1)
      useEffect(() => {
        const sync = () => {
          const h = window.location.hash || '';
          const m = h.match(/^#\/(.+)$/);
          if (m && findItemById(m[1])) {
            setCurrentId(m[1]);
          } else {
            setCurrentId(null);
          }
        };
        sync();
        window.addEventListener('hashchange', sync);
        return () => window.removeEventListener('hashchange', sync);
      }, []);

      const onPick = useCallback((id, file) => {
        if (!file) return;
        window.location.hash = `#/${id}`;
        setCurrentId(id);
      }, []);

      const current = currentId ? findItemById(currentId) : null;

      return (
        <div className="h-full flex flex-col bg-slate-50">
          {/* 헤더 */}
          <header className="bg-white border-b border-slate-200 px-5 py-3 flex items-center gap-3 shrink-0">
            <a href="../index.html" className="text-xs text-slate-500 hover:text-slate-700 underline">← 전체 학습</a>
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-grafana-orange text-white font-bold flex items-center justify-center">G</div>
              <div>
                <div className="font-bold text-slate-900 text-sm">Grafana 인터랙티브 학습</div>
                <div className="text-[10px] text-slate-500">시각화 · 대시보드 · 알림 — Grafana 11+ 기준</div>
              </div>
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono">
              {READY} / {TOTAL} ready · Phase A
            </span>
          </header>

          {/* 본문 — 사이드바 + iframe */}
          <div className="flex-1 flex overflow-hidden">
            {/* 사이드바 */}
            <aside className="w-72 shrink-0 bg-white border-r border-slate-200 overflow-y-auto">
              <div className="p-3 space-y-3">
                {SECTIONS.map((section) => (
                  <div key={section.part}>
                    <div className="flex items-center gap-2 px-2 py-1.5 mb-1">
                      <span className="w-6 h-6 rounded bg-grafana-orange text-white text-[10px] font-bold flex items-center justify-center">
                        {section.part}
                      </span>
                      <span className="text-xs font-bold text-slate-700">{section.label}</span>
                    </div>
                    <ul className="space-y-0.5">
                      {section.items.map((item) => {
                        const ready = !!item.file;
                        const active = currentId === item.id;
                        return (
                          <li key={item.id}>
                            <button
                              onClick={() => onPick(item.id, item.file)}
                              disabled={!ready}
                              className={`w-full text-left px-3 py-1.5 rounded text-xs transition flex items-center gap-2 ${
                                active
                                  ? 'bg-grafana-soft text-grafana-deep font-bold'
                                  : ready
                                  ? 'text-slate-700 hover-grafana-soft'
                                  : 'text-slate-400 cursor-not-allowed'
                              }`}
                            >
                              <span className="font-mono text-[10px] opacity-60">{item.id}</span>
                              <span className="flex-1 truncate">{item.title}</span>
                              {!ready && <span className="text-[9px] text-slate-400">planned</span>}
                            </button>
                          </li>
                        );
                      })}
                    </ul>
                  </div>
                ))}
              </div>
            </aside>

            {/* iframe 영역 */}
            <main className="flex-1 overflow-hidden bg-slate-100">
              {current ? (
                <iframe
                  key={current.id}
                  src={current.file}
                  className="w-full h-full border-0"
                  title={current.title}
                />
              ) : (
                <div className="h-full flex items-center justify-center p-8">
                  <div className="max-w-2xl bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
                    <div className="w-16 h-16 rounded-2xl bg-grafana-orange text-white text-2xl font-bold flex items-center justify-center mx-auto mb-4">
                      📊
                    </div>
                    <h2 className="text-2xl font-bold text-slate-900 mb-2">Grafana 인터랙티브 학습</h2>
                    <p className="text-sm text-slate-600 leading-relaxed mb-4">
                      운영 데이터를 한 화면에 모아 "지금 무엇이 문제인가" 를 즉시 보여주는 시각화 플랫폼.
                      panel → dashboard → data source → variable → alerting 순서로 익힌다.
                    </p>
                    <div className="grid grid-cols-2 gap-3 text-left max-w-md mx-auto">
                      <div className="rounded-lg bg-grafana-soft border border-grafana-orange p-3">
                        <div className="text-[10px] text-grafana-deep font-bold mb-1">Phase A (지금)</div>
                        <div className="text-xs text-slate-700">Part I·II — 8 sections</div>
                      </div>
                      <div className="rounded-lg bg-slate-50 border border-slate-200 p-3">
                        <div className="text-[10px] text-slate-500 font-bold mb-1">Phase B~D</div>
                        <div className="text-xs text-slate-700">Alerting · Provisioning · 운영</div>
                      </div>
                    </div>
                    <div className="mt-5 text-xs text-slate-500">
                      왼쪽 사이드바에서 섹션을 선택하면 시작합니다.
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
