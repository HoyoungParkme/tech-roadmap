      panel:      { icon: '📊', label: 'Panel',       badge: 'bg-sky-100 text-sky-800 border-sky-300' },
      datasource: { icon: '🔌', label: 'Data source', badge: 'bg-violet-100 text-violet-800 border-violet-300' },
      app:        { icon: '📦', label: 'App',         badge: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
    };

    const SIG_META = {
      signed:    { label: '✔ signed',    cls: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
      community: { label: '✔ community', cls: 'bg-amber-100 text-amber-700 border-amber-300' },
      unsigned:  { label: '✖ unsigned',  cls: 'bg-red-100 text-red-700 border-red-300' },
    };

    const STATE_META = {
      installed:  { label: 'installed',  cls: 'text-emerald-600' },
      installing: { label: 'installing…',cls: 'text-grafana-deep' },
      catalog:    { label: 'available',  cls: 'text-slate-400' },
      blocked:    { label: 'BLOCKED',    cls: 'text-red-600' },
    };

    function PluginRow({ p, active }) {
      const k = KIND_META[p.kind] || KIND_META.panel;
      const s = SIG_META[p.sig] || SIG_META.signed;
      const st = STATE_META[p.state] || STATE_META.catalog;
      const ring =
        p.state === 'installing' ? 'border-grafana-orange bg-grafana-soft' :
        p.state === 'blocked'    ? 'border-red-300 bg-red-50' :
        p.state === 'installed'  ? 'border-slate-200 bg-white' :
                                   'border-dashed border-slate-300 bg-slate-50';
      return (
        <div className={`rounded-lg border ${ring} px-2.5 py-2 flex items-center gap-2 transition ${active ? 'shadow-md scale-[1.01]' : ''}`}>
          <span className="text-base">{k.icon}</span>
          <div className="min-w-0">
            <div className="text-[11px] font-bold text-slate-800 truncate">{p.name}</div>
            <div className="flex items-center gap-1 mt-0.5">
              <span className={`text-[8px] px-1 py-px rounded border ${k.badge}`}>{k.label}</span>
              <span className="text-[8px] text-slate-400 font-mono">{p.ver}</span>
            </div>
          </div>
          <div className="ml-auto flex flex-col items-end gap-0.5">
            <span className={`text-[8px] px-1 py-px rounded border font-mono ${s.cls}`}>{s.label}</span>
            <span className={`text-[9px] font-bold font-mono ${st.cls}`}>
              {p.state === 'installing' && <span className="inline-block w-1.5 h-1.5 rounded-full bg-grafana-orange animate-ping mr-1 align-middle"></span>}
              {st.label}
            </span>
          </div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      // 설치 완료된 것에서 "사용 가능한 타입" 도출
      const available = step.plugins.filter((p) => p.state === 'installed');
      const newPanels = available.filter((p) => p.kind === 'panel');
      const newSources = available.filter((p) => p.kind === 'datasource' || p.kind === 'app');

      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">🧩</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">Plugins</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">v11.2 · Catalog</span>
          </div>

          {/* 플러그인 목록 */}
          <div className="flex-1 p-3 bg-slate-100 overflow-auto">
            <div className="text-[10px] font-bold text-slate-500 mb-1.5">설치됨 · 설치중</div>
            <div className="space-y-1.5">
              {step.plugins.map((p) => (
                <PluginRow key={p.id} p={p} active={step.installing === p.id || p.state === 'blocked'} />
              ))}
            </div>

            {step.catalog && step.catalog.length > 0 && (
              <>
                <div className="text-[10px] font-bold text-slate-500 mt-3 mb-1.5">카탈로그 (미설치)</div>
                <div className="space-y-1.5">
                  {step.catalog.map((c) => (
                    <PluginRow key={c.id} p={{ ...c, ver: '—', state: 'catalog' }} active={false} />
                  ))}
                </div>
              </>
            )}

            {/* 서명 차단 알림 */}
            {step.blockedNotice && (
              <div className="mt-3 rounded-lg border border-red-300 bg-red-50 px-2.5 py-2 text-[10px] text-red-700 flex items-start gap-1.5">
                <span>🔒</span>
                <span>{step.blockedNotice}</span>
              </div>
            )}
          </div>

          {/* 사용 가능해진 확장 */}
          <div className="px-3 py-2 bg-white border-t border-slate-200">
            <div className="text-[10px] text-slate-500 mb-1">Grafana 에서 지금 쓸 수 있는 확장</div>
            <div className="flex flex-wrap gap-1">
              {newPanels.map((p) => (
                <span key={p.id} className="text-[9px] px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 border border-sky-200 font-mono">📊 {p.name}</span>
              ))}
              {newSources.map((p) => (
                <span key={p.id} className="text-[9px] px-1.5 py-0.5 rounded bg-violet-50 text-violet-700 border border-violet-200 font-mono">🔌 {p.name}</span>
              ))}
            </div>
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (Step 5) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">Part IV. 프로비저닝</span>
                  <span className="text-[10px] font-mono text-slate-500">IV-2-1</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900 mt-1">Plugin — 설치·관리</h1>
                <p className="text-xs text-slate-600">패널·데이터소스·앱 플러그인으로 기능 확장</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                Grafana 확장은 전부 plugin(Panel·Data source·App)이다. grafana-cli install 은 손이 가고 재현이 안 되므로, 컨테이너는 GF_INSTALL_PLUGINS 로 부팅 시 자동 설치하고 datasource·app 은 provisioning yaml 로 설정까지 코드화한다. 기본은 서명된 플러그인만 로드하며, 사내 미서명 플러그인은 allow_loading_unsigned_plugins 에 id 를 콕 집어 허용하되 보안 위험을 감수한다. 버전 호환과 과다 설치도 잊지 말자.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['plugin', 'panel', 'datasource', 'app', 'grafana-cli', 'GF_INSTALL_PLUGINS', 'provisioning', 'signed', 'unsigned'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
