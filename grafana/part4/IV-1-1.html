  <div id="root"></div>

  <!--
    IV-1-1. Dashboard as JSON — 코드로서의 대시보드 — fastapi v1 패턴
    학습 목표: 대시보드는 내부적으로 JSON 모델(panels·targets·templating·time)이며,
      Export/Import로 JSON을 옮기고 Git으로 버전 관리·코드 리뷰·재현성을 확보한다.
    핵심 비유: "대시보드도 소스코드다" — UI 클릭이 결국 JSON 텍스트로 저장된다.
    패턴: 좌(LiveDataPane: UI→JSON→Git→Import 흐름 + 필드 애니메이션) / 우(VSCode dashboard.json)
    색상: #F46800 (Grafana brand orange)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {

        stage: 'ui',
        fields: [],
        keyPoint: 'UI 편집의 실체는 JSON 문서. 대시보드는 곧 코드다.',
        code: {
          lang: 'json',
          filename: 'dashboard.json — UI가 저장하는 실체',
          lines: [
            '{',
            '  // 이 JSON이 대시보드의 "진짜 모습"이다.',
            '  // UI에서 패널을 끌고 쿼리를 넣는 모든 동작은',
            '  // 결국 이 텍스트를 편집하는 것과 같다.',
            '  "title": "Service Health",',

            '  "panels": [ /* 시각화 패널 배열 */ ],',

            '}',

          ],

        },
      },
      {
        title: 'Step 2. JSON 구조 — 대시보드를 이루는 뼈대',

        stage: 'json',
        fields: [
          { key: 'uid', label: 'service-health', hint: '영구 식별자' },
          { key: 'schemaVersion', label: '39', hint: '모델 버전' },
          { key: 'panels', label: '[ 3 ]', hint: '시각화 배열' },
          { key: 'templating', label: '[ env ]', hint: '변수 정의' },
          { key: 'time', label: 'now-6h → now', hint: '기본 시간 범위' },
        ],
        keyPoint: '핵심 필드: uid·schemaVersion·panels·templating·time.',
        code: {
          lang: 'json',
          filename: 'dashboard.json — 최상위 뼈대',
          lines: [
            '{',
            '  "uid": "service-health",',
            '  "title": "Service Health",',
            '  "schemaVersion": 39,',
            '  "version": 7,',
            '',
            '  // 1) panels — 각 시각화 = 쿼리 + 표시 방식',
            '  "panels": [',

            '',
            '  // 3) time — 대시보드 기본 시간 범위',
            '  "time": { "from": "now-6h", "to": "now" }',
            '}',
            '',
            '// panels[].targets 가 실제 데이터 쿼리(PromQL/LogQL/SQL)',
            '// templating.list 의 변수는 $env 처럼 쿼리에서 참조',
          ],
          highlight: [1, 3, 7, 8, 20, 21, 29],
        },
      },
      {
        title: 'Step 3. Export → Git 커밋 → 코드 리뷰',
        desc: '대시보드 JSON을 파일로 Export해서 Git 저장소에 넣으면, 대시보드 변경이 코드 변경과 똑같이 관리된다. 누가·언제·왜 패널을 바꿨는지 커밋 히스토리에 남고, Pull Request로 리뷰를 받은 뒤 머지한다. 임계값을 0.05에서 0.02로 낮추는 한 줄 변경도 diff로 명확히 보이므로, "누가 몰래 알림 기준을 바꿔서 장애를 놓쳤다" 같은 사고를 막는다. 대시보드가 늘어날수록 이 규율의 가치가 커진다.',
        stage: 'git',
        fields: [],
        diff: [
          { sign: ' ', text: '  "id": 3, "type": "stat", "title": "Error Rate",' },
          { sign: '-', text: '  "thresholds": { "steps": [{ "color": "red", "value": 0.05 }] }' },
          { sign: '+', text: '  "thresholds": { "steps": [{ "color": "red", "value": 0.02 }] }' },
        ],
        keyPoint: 'JSON을 Git에 두면 대시보드 변경이 리뷰·롤백 가능해진다.',
        code: {
          lang: 'json',
          filename: 'dashboards/service-health.json — Git 관리',
          lines: [
            '{',
            '  "uid": "service-health",',
            '  "title": "Service Health",',
            '  "schemaVersion": 39,',
            '  "version": 8,',
            '',
            '  "panels": [',
            '    {',
            '      "id": 3,',
            '      "type": "stat",',
            '      "title": "Error Rate",',
            '      "fieldConfig": {',
            '        "defaults": {',
            '          "unit": "percentunit",',
            '          "thresholds": {',
            '            "mode": "absolute",',
            '            "steps": [',
            '              { "color": "green", "value": null },',
            '              { "color": "red",   "value": 0.02 }',
            '            ]',
            '          }',
            '        }',
            '      }',
            '    }',
            '  ]',
            '}',
            '',
            '// 워크플로우 (대시보드도 코드처럼)',
            '//   git checkout -b lower-error-threshold',
            '//   grafana Export → dashboards/service-health.json 덮어쓰기',
            '//   git add . && git commit -m "alert: error 임계값 5% → 2%"',
            '//   git push → Pull Request → 리뷰 승인 → merge',
            '//',
            '// 얻는 것: 변경 이력 / 책임 추적 / 한 줄 롤백',
          ],
          highlight: [17, 18, 19, 29, 30, 31],
        },
      },
      {
        title: 'Step 4. Import → 다른 환경에서 재현',
        desc: 'Git의 JSON 한 벌이 있으면 staging에서 검증한 대시보드를 prod에 그대로 Import해서 똑같이 재현할 수 있다. 손으로 다시 패널을 만들 필요가 없다 — 클릭 재현은 실수와 미묘한 차이를 낳지만, JSON Import는 문자 그대로 동일한 정의를 복제한다. 이때 uid가 열쇠다. 같은 uid로 Import하면 기존 대시보드를 덮어쓰고(업데이트), 새 uid면 새 대시보드가 생긴다. 라이브러리 패널을 쓰면 공통 패널 하나를 여러 대시보드가 참조해 재사용할 수도 있다.',
        stage: 'import',
        fields: [],
        keyPoint: '같은 JSON·같은 uid → 어느 환경이든 동일하게 재현된다.',
        code: {
          lang: 'json',
          filename: 'import.sh 대신 — Grafana HTTP API로 재현',

            '{',
            '  // POST /api/dashboards/db 로 보내는 요청 본문',
            '  "dashboard": {',
            '    "uid": "service-health",   // 같은 uid → 기존 보드 업데이트',
            '    "title": "Service Health",',
            '    "schemaVersion": 39,',
            '    "panels": [ /* Git의 정의 그대로 */ ]',
            '  },',
            '  "folderUid": "team-platform",',
            '  "overwrite": true,            // 기존 uid면 덮어쓰기 허용',
            '  "message": "deploy from git @a1b2c3d"',
            '}',
            '',
            '// staging → prod 승격 (CI에서 실행)',
            '//   curl -X POST https://grafana.prod/api/dashboards/db \\',
            '//     -H "Authorization: Bearer $GRAFANA_TOKEN" \\',
            '//     -H "Content-Type: application/json" \\',
            '//     -d @dashboards/service-health.json',
            '//',
            '// uid 규칙 (재현성의 핵심)',
            '//   같은 uid + overwrite:true → 그 보드를 업데이트',
            '//   새로운 uid             → 새 보드 생성',
            '//   uid 생략               → 랜덤 uid (재현 불가! 피할 것)',
            '//',
            '// 라이브러리 패널: 공통 패널 1개를 여러 보드가 참조 → 재사용',
          ],
          highlight: [3, 9, 10, 20, 21, 22],
        },
      },
      {
        title: 'Step 5. 실무 함정 — 드리프트·uid 충돌·schemaVersion',
        desc: '가장 흔한 사고는 드리프트다. 운영자가 급해서 UI에서 직접 패널을 고치면 실제 대시보드와 Git의 JSON이 어긋나고, 다음 배포 때 UI 수정이 조용히 사라진다. provisioning으로 editable:false를 걸어 UI 수동 편집을 막는 게 정석이다. 둘째, uid를 생략하거나 복붙하면 서로 다른 보드가 같은 uid를 갖거나(충돌) 매번 새 보드가 생긴다. 셋째, schemaVersion이 너무 낮은 오래된 JSON은 최신 Grafana가 자동 마이그레이션하는데, Export 시점에 버전이 올라가 diff가 지저분해지니 마이그레이션 후 커밋을 분리한다.',
        stage: 'trap',
        fields: [],
        traps: [
          { icon: '🌀', name: '드리프트', desc: 'UI 수동 편집 ≠ Git → editable:false로 차단' },
          { icon: '💥', name: 'uid 충돌', desc: '생략·복붙 금지 → 보드마다 고유 uid 고정' },
          { icon: '🔀', name: 'schemaVersion', desc: '자동 마이그레이션 후 커밋 분리' },
          { icon: '✋', name: '수동 JSON 실수', desc: '괄호·쉼표 깨짐 → UI 편집 후 Export 권장' },
        ],
        summary: {
          title: 'Dashboard as JSON 5가지 핵심',
          points: [
            'UI 편집의 실체는 JSON 문서 — 대시보드는 코드다',
            '핵심 필드: uid·schemaVersion·panels·templating·time',
            'Export → Git → PR 리뷰로 변경 이력·롤백 확보',
            '같은 JSON·같은 uid로 Import → 환경 간 동일 재현',
            '함정: 드리프트·uid 충돌·schemaVersion 마이그레이션',
          ],
        },
        keyPoint: '드리프트를 막고 uid를 고정하면 JSON 대시보드가 안정된다.',
        code: {
          lang: 'yaml',
          filename: 'provisioning/dashboards.yml — 드리프트 차단',
          lines: [
            '# 대시보드를 파일에서 자동 등록 + UI 수동 편집 차단',
            'apiVersion: 1',
            '',
            'providers:',
            '  - name: team-platform',
            '    orgId: 1',
            '    folder: Team-Platform',
            '    folderUid: team-platform',
            '    type: file',
            '    disableDeletion: true',
            '    editable: false            # UI에서 수정 불가 → 드리프트 원천 차단',
            '    allowUiUpdates: false      # UI 저장 자체를 막음',
            '    updateIntervalSeconds: 30  # 파일 변경 30초마다 재적용',
            '    options:',
            '      path: /etc/grafana/dashboards/platform',
            '      foldersFromFilesStructure: true',
            '',
            '# 함정 체크리스트',
            '# 1) 드리프트: editable:false 없으면 UI 수정이 배포 때 사라진다',
            '# 2) uid 충돌: 보드마다 고유 uid를 JSON에 명시(생략·복붙 금지)',
            '# 3) schemaVersion: 낮은 버전 Export 시 자동 상향 → diff 분리 커밋',
            '# 4) 수동 편집 실수: 괄호/쉼표 깨지기 쉬움 → UI 편집 후 Export가 안전',
            '#',
            '# 결론: "UI로 편집, Git이 진실(source of truth)"',
            '#   운영 반영은 항상 파일 → provisioning 경로로만',
          ],
          highlight: [10, 11, 12, 18, 19, 20, 21],
        },
      },
    ];

    // ── 좌측: UI → JSON → Git → Import 흐름 시각화
    const STAGES = [
      { key: 'ui',     icon: '🖱️', label: 'UI 편집',   sub: '마우스로 패널 배치' },
      { key: 'json',   icon: '{ }', label: 'JSON 모델', sub: '대시보드의 실체' },
      { key: 'git',    icon: '🌿',  label: 'Git 커밋',  sub: 'PR 리뷰·이력' },
      { key: 'import', icon: '🚀',  label: 'Import',    sub: '다른 환경 재현' },
    ];

    function FlowRail({ activeStage }) {
      // trap 단계에서는 전 과정이 완료된 상태로 표시
      const activeIdx = activeStage === 'trap'
        ? STAGES.length - 1
        : STAGES.findIndex((s) => s.key === activeStage);
      return (
        <div className="flex items-stretch gap-1">
          {STAGES.map((s, i) => {
            const done = i <= activeIdx;
            const isActive = s.key === activeStage;
            return (
              <React.Fragment key={s.key}>
                <div
                  className={`flex-1 rounded-lg border px-2 py-2 text-center transition ${done ? 'bg-grafana-soft border-grafana-orange' : 'bg-white border-slate-200'} ${isActive ? 'ring-2 ring-offset-1' : ''}`}
                  style={isActive ? { boxShadow: '0 0 0 2px #F46800' } : {}}
                >
                  <div className="text-base font-mono" style={{ color: done ? '#B84F00' : '#94a3b8' }}>{s.icon}</div>
                  <div className={`text-[10px] font-bold ${done ? 'text-grafana-deep' : 'text-slate-400'}`}>{s.label}</div>
                  <div className="text-[8px] text-slate-400 leading-tight">{s.sub}</div>
                </div>
                {i < STAGES.length - 1 && (
                  <div className="flex items-center">
                    <span className="text-sm" style={{ color: i < activeIdx ? '#F46800' : '#cbd5e1' }}>▸</span>
                  </div>
                )}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    function FieldRows({ fields }) {
      return (
        <div className="space-y-1">
          {fields.map((f) => (
            <div key={f.key} className="flex items-center gap-2 bg-white rounded border border-slate-200 px-2 py-1">
              <span className="text-[11px] font-mono font-bold text-grafana-deep w-24 shrink-0">{f.key}</span>
              <span className="text-slate-400">:</span>
              <span className="text-[11px] font-mono text-slate-700 flex-1">{f.label}</span>
              <span className="text-[9px] text-slate-400">{f.hint}</span>
            </div>
          ))}
        </div>
      );
    }

    function DiffBlock({ diff }) {
      const bg = (sign) => (sign === '+' ? 'bg-emerald-50' : sign === '-' ? 'bg-red-50' : 'bg-white');
      const tx = (sign) => (sign === '+' ? 'text-emerald-700' : sign === '-' ? 'text-red-600' : 'text-slate-500');
      return (
        <div className="rounded border border-slate-200 overflow-hidden font-mono text-[10px]">
          <div className="bg-slate-800 text-slate-300 px-2 py-1 flex items-center gap-2">
            <span className="text-emerald-400">●</span> Pull Request #142
            <span className="ml-auto text-slate-400">service-health.json</span>
          </div>
          {diff.map((d, i) => (
            <div key={i} className={`flex ${bg(d.sign)}`}>
              <span className={`w-5 text-center select-none ${tx(d.sign)}`}>{d.sign}</span>
              <span className={`flex-1 whitespace-pre ${tx(d.sign)}`}>{d.text}</span>
            </div>
          ))}
        </div>
      );
    }

    function LiveDataPane({ step }) {
      return (
        <div className="rounded-xl border border-slate-200 bg-white overflow-hidden shadow-sm h-full flex flex-col">
          {/* Grafana 상단 헤더바 */}
          <div className="bg-slate-900 px-3 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">📊</span>
            <span className="text-xs font-bold" style={{ color: '#F46800' }}>Grafana</span>
            <span className="text-slate-500">/</span>
            <span className="text-xs text-slate-300 font-mono">Dashboard as JSON</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">uid: service-health</span>
          </div>

          {/* 흐름 레일 */}
          <div className="px-3 py-3 bg-slate-50 border-b border-slate-200">
            <FlowRail activeStage={step.stage} />
          </div>

          {/* 본체 — 단계별 내용 */}
          <div className="flex-1 p-3 bg-slate-100">
            {step.stage === 'ui' && (
              <div className="h-full flex flex-col gap-2">
                <div className="text-[10px] font-bold text-slate-500">UI에서 이렇게 편집하면…</div>
                <div className="grid grid-cols-2 gap-2 flex-1">
                  {['p99 Latency', 'RPS', 'Error Rate', 'CPU'].map((t, i) => (
                    <div key={t} className="rounded border border-slate-200 bg-white p-2 flex flex-col">
                      <div className="flex items-center gap-1 mb-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-grafana-orange"></span>
                        <span className="text-[10px] font-bold text-slate-700">{t}</span>
                        <span className="ml-auto text-[8px] text-slate-400 cursor-move">⠿ drag</span>
                      </div>
                      <div className="flex-1 flex items-center justify-center text-slate-300 text-lg">▨</div>
                    </div>
                  ))}
                </div>
                <div className="text-center text-xl text-grafana-orange">↓ 저장하면 ↓</div>
                <div className="rounded bg-slate-800 text-slate-200 px-3 py-2 font-mono text-[11px] text-center">
                  { }  하나의 dashboard.json 문서
                </div>
              </div>
            )}

            {step.stage === 'json' && (
              <div className="h-full flex flex-col gap-2">
                <div className="text-[10px] font-bold text-slate-500">JSON 최상위 필드 = 대시보드의 뼈대</div>
                <FieldRows fields={step.fields} />
                <div className="mt-auto rounded bg-grafana-soft border border-grafana-orange px-2 py-1.5 text-[10px] text-grafana-deep">
                  panels[].targets 가 실제 쿼리, templating.list 가 변수. 이 둘이 대시보드의 핵심.
                </div>
              </div>
            )}

            {step.stage === 'git' && (
              <div className="h-full flex flex-col gap-2">
                <div className="text-[10px] font-bold text-slate-500">대시보드 변경 = 코드 diff</div>
                <DiffBlock diff={step.diff} />
                <div className="grid grid-cols-3 gap-1 text-center mt-1">
                  {[['commit', '변경 이력'], ['PR review', '책임 추적'], ['revert', '한 줄 롤백']].map(([a, b]) => (
                    <div key={a} className="rounded border border-slate-200 bg-white px-1 py-1.5">
                      <div className="text-[10px] font-mono font-bold text-grafana-deep">{a}</div>
                      <div className="text-[9px] text-slate-500">{b}</div>
                    </div>
                  ))}
                </div>
                <div className="mt-auto text-[10px] text-slate-500">임계값 5% → 2% 변경이 diff 한 줄로 명확히 보인다.</div>
              </div>
            )}

            {step.stage === 'import' && (
              <div className="h-full flex flex-col items-center justify-center gap-2">
                <div className="flex items-center gap-2 w-full">
                  <div className="flex-1 rounded-lg border border-slate-300 bg-white p-2 text-center">
                    <div className="text-lg">🌿</div>
                    <div className="text-[10px] font-bold text-slate-700">Git JSON</div>
                    <div className="text-[8px] font-mono text-slate-400">uid: service-health</div>
                  </div>
                  <div className="text-center">
                    <div className="text-xl text-grafana-orange">🚀→</div>
                    <div className="text-[8px] text-slate-400">POST /api/dashboards/db</div>
                  </div>
                  <div className="flex flex-col gap-1 flex-1">
                    <div className="rounded border border-emerald-300 bg-emerald-50 p-1.5 text-center">
                      <div className="text-[10px] font-bold text-emerald-700">staging</div>
                      <div className="text-[8px] text-emerald-600">동일 재현 ✓</div>
                    </div>
                    <div className="rounded border border-emerald-300 bg-emerald-50 p-1.5 text-center">
                      <div className="text-[10px] font-bold text-emerald-700">prod</div>
                      <div className="text-[8px] text-emerald-600">동일 재현 ✓</div>
                    </div>
                  </div>
                </div>
                <div className="rounded bg-grafana-soft border border-grafana-orange px-3 py-1.5 text-[10px] text-grafana-deep text-center w-full">
                  같은 uid + overwrite:true → 그 보드를 업데이트. uid 생략은 재현 불가!
                </div>
              </div>
            )}

            {step.stage === 'trap' && (
              <div className="h-full flex flex-col gap-2">
                <div className="text-[10px] font-bold text-slate-500">실무에서 실제로 터지는 함정 4가지</div>
                <div className="grid grid-cols-2 gap-2 flex-1">
                  {step.traps.map((t) => (
                    <div key={t.name} className="rounded border border-red-200 bg-red-50 p-2 flex flex-col">
                      <div className="flex items-center gap-1 mb-1">
                        <span className="text-base">{t.icon}</span>
                        <span className="text-[11px] font-bold text-red-700">{t.name}</span>
                      </div>
                      <div className="text-[10px] text-slate-600 leading-snug">{t.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* keyPoint */}
          <div className="px-3 py-2 bg-grafana-soft border-t border-grafana-orange text-[11px] text-grafana-deep">
            💡 {step.keyPoint}
          </div>

          {/* summary (Step 5) */}
          {step.summary && (
            <div className="px-3 pb-3 pt-2 bg-white border-t border-slate-200">
              <div className="text-[11px] font-bold text-slate-700 mb-1.5">📋 {step.summary.title}</div>
              <ul className="space-y-1">
                {step.summary.points.map((p, i) => (
                  <li key={i} className="text-[11px] text-slate-700 flex gap-1.5">
                    <span className="grafana-orange">▸</span><span>{p}</span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    // ── 우측: VSCode CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { borderColor: '#F46800' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-slate-50 px-4 py-5">
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-grafana-orange text-white font-bold">G</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">Part IV. 프로비저닝</span>
                  <span className="text-[10px] font-mono text-slate-400">IV-1-1</span>
                </div>
                <h1 className="text-xl font-bold text-slate-900">Dashboard as JSON — 코드로서의 대시보드</h1>
                <p className="text-xs text-slate-600">대시보드를 JSON 모델로 버전 관리 — Export → Git → Import로 재현</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← Grafana 학습 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#F46800' : '#fed7aa' }} />
              ))}
            </div>

            {/* 단계 제목+설명 */}
            <div className="mb-4 rounded-xl bg-grafana-orange text-white px-5 py-3 shadow">
              <h2 className="text-base font-bold mb-1">{step.title}</h2>
              <p className="text-xs leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#B84F00' : '#F46800' }}>
                {playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3.5초/단계</div>

            {isLast && (
              <div className="mt-4 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#F46800' }}>
                <div className="font-bold mb-1 grafana-orange">✅ 핵심 정리</div>
                대시보드의 실체는 JSON 문서다 — UI 편집은 이 텍스트를 만드는 편집기일 뿐이다. uid·schemaVersion·panels·templating·time이 뼈대이고, Export해서 Git에 두면 대시보드 변경이 코드처럼 리뷰·롤백된다. 같은 JSON과 같은 uid로 Import하면 어느 환경이든 동일하게 재현된다. 드리프트(UI 수동 편집)는 editable:false로 막고, uid는 보드마다 고정하며, schemaVersion 자동 마이그레이션은 커밋을 분리한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Dashboard as Code', 'JSON Model', 'schemaVersion', 'uid', 'Export', 'Import', 'Git', 'provisioning', 'drift'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-grafana-soft text-grafana-deep border border-grafana-orange">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← Grafana 학습 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline" style={{ color: '#F46800' }}>IV-1-2 다음 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
