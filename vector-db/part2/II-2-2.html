  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-2-2. FAISS 최적화 (GPU 가속, Quantization)
    학습 목표: CPU baseline → GPU 100x 가속 → 메모리 한계 → PQ 압축 8억 벡터 → 정확도 손실
              5단계로 FAISS 대규모 최적화의 trade-off를 이해한다.
    핵심 비유: 고속도로 + 압축 트럭 — 속도(GPU) vs 메모리(PQ) vs 정확도(recall)
    패턴: fastapi v1 — 좌(LiveDataPane: 막대 그래프 + 게이지 + 압축 시각화 + tradeoff)
                       우(VSCode CodeViewer: cpu-baseline / gpu-accel / pq-compress / recall-eval)
    색상: vector-db purple
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   speedBars : CPU vs GPU 검색 속도 [{ label, value, max, color, highlight }]
    //   memGauge  : VRAM 사용량 게이지 { used, total, label }
    //   compress  : PQ 압축 시각화 { original, compressed, blocks }
    //   tradeoff  : 정확도 vs 속도 점도표 [{ label, recall, speed, active }]
    //   verdict   : 단계 결론 { type, text }   type: 'good'|'warn'|'fail'
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      cpuBaseline: {lang:"python", filename:"cpu-baseline.py", lines:[
        "# CPU baseline — IndexFlatL2 (정확 brute-force 검색)",
        "# 100만 벡터 × 128차원 → 검색 ~50ms / query",
        "import faiss",
        "import numpy as np",
        "import time",
        "",
        "# 1) 100만 합성 벡터 (128차원, float32)",
        "d, n = 128, 1_000_000",
        "rng = np.random.default_rng(42)",
        "vectors = rng.standard_normal((n, d)).astype(\"float32\")",
        "",
        "# 2) brute-force 인덱스 — 모든 벡터와 L2 거리",
        "index = faiss.IndexFlatL2(d)",
        "index.add(vectors)              # 학습 단계 없음",
        "print(f\"ntotal={index.ntotal}\") # 1,000,000",
        "",
        "# 3) 검색 — top-10 nearest",
        "query = rng.standard_normal((1, d)).astype(\"float32\")",
        "t0 = time.perf_counter()",
        "D, I = index.search(query, k=10)",
        "print(f\"latency = {(time.perf_counter()-t0)*1000:.1f} ms\")",
        "#  → latency = 50.2 ms (i9-13900K 단일 코어)",
        "",
        "# 메모리: 100만 × 128 × 4byte = 488 MB (RAM 여유)",
        "# 한계: 50ms → 초당 20 QPS, 1억 벡터 키우면 5초/쿼리",
      ]},
      gpuAccel: {lang:"python", filename:"gpu-accel.py", lines:[
        "# GPU 가속 — faiss-gpu로 인덱스를 VRAM으로 전송",
        "# pip install faiss-gpu  (CUDA 환경 필수)",
        "import faiss",
        "import numpy as np",
        "import time",
        "",
        "d, n = 128, 1_000_000",
        "rng = np.random.default_rng(42)",
        "vectors = rng.standard_normal((n, d)).astype(\"float32\")",
        "",
        "# 1) CPU 인덱스 생성 (FAISS 표준 패턴)",
        "cpu_index = faiss.IndexFlatL2(d)",
        "cpu_index.add(vectors)",
        "",
        "# 2) GPU 리소스 핸들 — workspace 메모리 풀 관리",
        "res = faiss.StandardGpuResources()",
        "",
        "# 3) CPU 인덱스 → GPU 디바이스 0번으로 복사",
        "gpu_index = faiss.index_cpu_to_gpu(",
        "    res,        # GPU 리소스",
        "    0,          # device id",
        "    cpu_index,  # 옮길 CPU 인덱스",
        ")",
        "",
        "# 4) 검색 — 같은 API, 다른 속도",
        "query = rng.standard_normal((1, d)).astype(\"float32\")",
        "t0 = time.perf_counter()",
        "D, I = gpu_index.search(query, k=10)",
        "print(f\"latency = {(time.perf_counter()-t0)*1000:.2f} ms\")",
        "#  → latency = 0.50 ms  (NVIDIA RTX 4090, 100x 가속)",
        "",
        "# 5) 멀티 GPU 샤딩",
        "# multi_gpu = faiss.index_cpu_to_all_gpus(cpu_index)",
        "",
        "# 빠른 이유: 수천 코어 동시 L2 계산 + 메모리 대역폭 ~1TB/s",
      ]},
      memLimit: {lang:"python", filename:"gpu-accel.py", lines:[
        "# 메모리 한계 — 데이터가 커지면 GPU VRAM에 못 올린다",
        "import faiss",
        "import numpy as np",
        "",
        "# 실전 임베딩: 768차원 (BERT base) — 차원이 6배 늘어남",
        "d = 768",

    // ─────────────────────────────────────────────────────
    // SpeedBars — CPU vs GPU 검색 속도 막대 그래프
    // ─────────────────────────────────────────────────────
    function SpeedBars({ bars }) {
      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-violet-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>⚡</span>
            <span>검색 속도 (100만 × 128d, ms / query · 낮을수록 좋음)</span>
          </div>
          <div className="space-y-2">
            {bars.map((b, i) => {
              const measured = b.value !== null && b.value !== undefined;
              const widthPct = measured ? Math.max((b.value / b.max) * 100, 1.5) : 0;
              return (
                <div key={i}>
                  <div className="flex justify-between text-[10px] mb-0.5">
                    <span className={`font-mono ${b.highlight ? 'text-violet-900 font-bold' : 'text-slate-600'}`}>
                      {b.label}
                    </span>
                    <span className={`font-mono ${b.highlight ? 'text-violet-900 font-bold' : 'text-slate-500'}`}>
                      {measured ? `${b.value} ms` : '—'}
                    </span>
                  </div>
                  <div className="bg-white/70 rounded-full h-3 border border-violet-200 overflow-hidden">
                    {measured ? (
                      <div
                        className={`h-full rounded-full ${b.color} transition-all duration-700`}
                        style={{ width: `${widthPct}%` }}
                      />
                    ) : (
                      <div className="h-full w-full flex items-center justify-center">
                        <span className="text-[9px] text-slate-400 font-mono">측정 전</span>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // MemoryGauge — VRAM 사용량 게이지 (overflow 시 빨강)
    // ─────────────────────────────────────────────────────
    function MemoryGauge({ gauge }) {
      const pct = Math.min((gauge.used / gauge.total) * 100, 100);
      const overflowPct = gauge.overflow ? Math.max((gauge.used / gauge.total - 1) * 100, 0) : 0;

      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-violet-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>💾</span>
            <span>{gauge.label}</span>
          </div>
          <div className="bg-white/70 rounded-lg h-8 border border-violet-200 overflow-hidden relative">
            <div
              className={`h-full ${gauge.barColor} transition-all duration-700`}
              style={{ width: `${pct}%` }}
            />
            {gauge.overflow && (
              <div className="absolute top-0 left-0 w-full h-full flex items-center justify-center">
                <span className="text-xs font-bold text-red-700 font-mono">
                  ⚠ {gauge.used.toFixed(0)} GB &gt; 한계 {gauge.total} GB
                </span>
              </div>
            )}
            {!gauge.overflow && (
              <div className="absolute top-0 left-0 w-full h-full flex items-center justify-center">
                <span className="text-xs font-bold text-slate-700 font-mono">
                  {gauge.used} GB / {gauge.total} GB ({pct.toFixed(1)}%)
                </span>
              </div>
            )}
          </div>
          <div className="flex justify-between text-[9px] text-violet-600 font-mono mt-1">
            <span>0</span>
            <span>VRAM 한계 ({gauge.total} GB)</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // CompressViz — 원본 vs PQ 압축 시각화
    // ─────────────────────────────────────────────────────
    function CompressViz({ data }) {
      const renderBlocks = (count, color, max = 32) => {
        const blocks = Array.from({ length: max }, (_, i) => i < count);
        return (
          <div className="grid grid-cols-16 gap-0.5">
            {blocks.map((on, i) => (
              <div
                key={i}
                className={`h-2 rounded-sm transition-all duration-700 ${on ? color : 'bg-slate-200'}`}
              />
            ))}
          </div>
        );
      };

      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-violet-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>📦</span>
            <span>PQ 압축 시각화 — 벡터 1개 기준</span>
          </div>

          {/* 원본 */}
          <div className="mb-3">
            <div className="flex justify-between text-[10px] mb-1">
              <span className="font-mono text-slate-600">{data.original.label}</span>
              <span className="font-mono text-slate-700 font-bold">{data.original.size} ({data.original.dim}d)</span>
            </div>
            <div className="grid gap-0.5" style={{ gridTemplateColumns: 'repeat(32, minmax(0, 1fr))' }}>
              {Array.from({ length: 32 }).map((_, i) => (
                <div key={i} className="h-3 rounded-sm bg-slate-400" />
              ))}
            </div>
            <div className="text-[9px] text-slate-500 mt-0.5 font-mono text-center">
              32 × 96byte 청크 (3,072 byte)
            </div>
          </div>

          {/* 화살표 + 비율 */}
          <div className="flex items-center justify-center gap-2 my-2">
            <span className="text-[10px] text-violet-600 font-mono">PQ (m=96, nbits=8)</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" strokeWidth="2">
              <path d="M12 5v14M5 12l7 7 7-7" />
            </svg>
            <span className="px-2 py-0.5 bg-violet-600 text-white rounded text-[10px] font-bold font-mono">
              {data.ratio} 압축
            </span>
          </div>

          {/* 압축 후 */}
          <div>
            <div className="flex justify-between text-[10px] mb-1">
              <span className="font-mono text-violet-800 font-bold">{data.compressed.label}</span>
              <span className="font-mono text-violet-900 font-bold">{data.compressed.size} ({data.compressed.dim}코드)</span>
            </div>
            <div className="grid gap-0.5" style={{ gridTemplateColumns: 'repeat(32, minmax(0, 1fr))' }}>
              <div className="h-3 rounded-sm bg-violet-600" />
              {Array.from({ length: 31 }).map((_, i) => (
                <div key={i} className="h-3 rounded-sm bg-slate-200" />
              ))}
            </div>
            <div className="text-[9px] text-violet-600 mt-0.5 font-mono text-center">
              1개 청크 (96 byte) — 256 코드 중 하나로 표현
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // TradeoffChart — 정확도 vs 속도 산점도
    // ─────────────────────────────────────────────────────
    function TradeoffChart({ tradeoff }) {
      const w = 380;
      const h = 240;
      const padL = 50;
      const padR = 12;
      const padT = 12;
      const padB = 36;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;

      // x: log10(speed ms), y: recall (0.7~1.0)
      const xMin = Math.log10(0.04);
      const xMax = Math.log10(60);
      const yMin = 0.80;
      const yMax = 1.00;

      const xPos = (speed) => padL + ((Math.log10(speed) - xMin) / (xMax - xMin)) * plotW;
      const yPos = (recall) => padT + plotH - ((recall - yMin) / (yMax - yMin)) * plotH;

      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-violet-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>🎯</span>
            <span>{tradeoff.title}</span>
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            {/* y axis */}
            <line x1={padL} y1={padT} x2={padL} y2={padT + plotH} stroke="#a78bfa" strokeWidth="1" />
            {/* x axis */}
            <line x1={padL} y1={padT + plotH} x2={padL + plotW} y2={padT + plotH} stroke="#a78bfa" strokeWidth="1" />

            {/* y grid + labels */}
            {[0.80, 0.85, 0.90, 0.95, 1.00].map((v, i) => (
              <g key={`y${i}`}>
                <line
                  x1={padL}
                  y1={yPos(v)}
                  x2={padL + plotW}
                  y2={yPos(v)}
                  stroke="#e9d5ff"
                  strokeWidth="0.5"
                  strokeDasharray="2,2"
                />
                <text x={padL - 4} y={yPos(v) + 3} textAnchor="end" fontSize="9" fill="#7c3aed" fontFamily="monospace">
                  {v.toFixed(2)}
                </text>
              </g>
            ))}

            {/* x grid + labels (log scale) */}
            {[0.05, 0.1, 0.5, 1, 5, 50].map((v, i) => (
              <g key={`x${i}`}>
                <line
                  x1={xPos(v)}
                  y1={padT}
                  x2={xPos(v)}
                  y2={padT + plotH}
                  stroke="#e9d5ff"
                  strokeWidth="0.5"
                  strokeDasharray="2,2"
                />
                <text x={xPos(v)} y={padT + plotH + 12} textAnchor="middle" fontSize="9" fill="#7c3aed" fontFamily="monospace">
                  {v}
                </text>
              </g>
            ))}

            {/* axis titles */}
            <text x={padL + plotW / 2} y={h - 4} textAnchor="middle" fontSize="10" fill="#5b21b6" fontFamily="monospace">
              검색 속도 (ms, log scale, 작을수록 빠름) →
            </text>
            <text
              x={12}
              y={padT + plotH / 2}
              textAnchor="middle"
              fontSize="10"
              fill="#5b21b6"
              fontFamily="monospace"
              transform={`rotate(-90, 12, ${padT + plotH / 2})`}
            >
              ↑ recall@10
            </text>

            {/* points */}
            {tradeoff.points.map((p, i) => {
              const cx = xPos(p.speed);
              const cy = yPos(p.recall);
              const r = p.active ? 8 : 5;
              return (
                <g key={i}>
                  {p.active && (
                    <circle cx={cx} cy={cy} r={14} fill="none" stroke={p.color} strokeWidth="2" opacity="0.4">
                      <animate attributeName="r" from="10" to="18" dur="1.4s" repeatCount="indefinite" />
                      <animate attributeName="opacity" from="0.6" to="0" dur="1.4s" repeatCount="indefinite" />
                    </circle>
                  )}
                  <circle cx={cx} cy={cy} r={r} fill={p.color} stroke="white" strokeWidth="1.5" />
                  <text
                    x={cx + 10}
                    y={cy + 3}
                    fontSize="9"
                    fontWeight={p.active ? 'bold' : 'normal'}
                    fill={p.color}
                    fontFamily="monospace"
                  >
                    {p.label}
                  </text>
                </g>
              );
            })}
          </svg>
          <div className="text-[9px] text-violet-700 mt-1 text-center font-mono">
            우상단(빠르고 정확)이 이상 · 보라 = PQ 강조 · 회색 = 비교군
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Verdict 박스 — 단계 결론
    // ─────────────────────────────────────────────────────
    function Verdict({ verdict }) {
      const styles = {
        good: 'bg-emerald-50 border-emerald-400 text-emerald-800',
        warn: 'bg-amber-50 border-amber-400 text-amber-800',
        fail: 'bg-red-50 border-red-400 text-red-800',
      };
      const icons = { good: '✅', warn: '⚠️', fail: '❌' };

      return (
        <div className={`rounded-lg border-2 p-3 flex items-start gap-2 ${styles[verdict.type]}`}>
          <span className="text-lg leading-none">{icons[verdict.type]}</span>
          <div className="flex-1">
            <div className="text-[10px] uppercase tracking-wider font-bold opacity-70">결론</div>
            <div className="text-sm font-medium mt-0.5">{verdict.text}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 통합
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">⚡ FAISS 최적화 실측 — 속도 / 메모리 / 정확도</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-3">
            {/* 속도 막대 (모든 단계 공통) */}
            <SpeedBars bars={step.speedBars} />

            {/* 메모리 게이지 (1, 2, 3, 4단계) */}
            {step.memGauge && <MemoryGauge gauge={step.memGauge} />}

            {/* 압축 시각화 (4단계) */}
            {step.compress && <CompressViz data={step.compress} />}

            {/* trade-off 산점도 (5단계) */}
            {step.tradeoff && <TradeoffChart tradeoff={step.tradeoff} />}

            {/* 결론 */}
            {step.verdict && <Verdict verdict={step.verdict} />}
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-slate-400"></span>CPU
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-violet-600"></span>GPU / 활성
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>여유
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2.5 h-2.5 rounded bg-red-500"></span>한계 초과
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-violet-500/15 border-l-2 border-violet-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. FAISS &gt; Chapter 2. FAISS 실전</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">FAISS 최적화 — GPU 가속과 Quantization</h1>
                  <p className="text-sm text-slate-500 mt-0.5">CPU 50ms → GPU 0.5ms → PQ로 1억 벡터 압축 → recall trade-off</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음(II-2-3)에서는 <strong>FAISS의 한계</strong>(메타데이터 필터, persistence, CRUD, 분산)와 보완 전략을 다룬다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-2-1.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; II-2-1. FAISS 실전 워크플로우</a>
              <a href="./II-2-3.html" className="text-violet-700 hover:text-violet-900 font-medium">II-2-3. FAISS 한계와 보완 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
