  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-2-3. FAISS 한계와 보완 — 메타데이터, 영속성, 필터링
    학습 목표: FAISS는 "벡터 검색만 잘하는" 라이브러리라는 사실을 5단계로 체험.
              메타데이터·영속성·필터링은 외부 도구로 보완해야 하며, 본격 프로덕션이면
              Chroma/pgvector 같은 통합 벡터 DB로 가는 게 합리적이라는 결론으로 닫는다.
    핵심 비유: FAISS = 도서관 책장 (책 빨리 찾기), 메타데이터 = 도서 카탈로그
              (제목/저자/장르) — FAISS는 책장만, 카탈로그는 SQLite/Redis가 담당.
    패턴: fastapi v1 — 좌(LiveDataPane: FAISS 박스 + ID 화살표 + 외부 메타 박스 + 영속성 + 필터)
                       우(VSCode CodeViewer)
    색상: vector-db purple
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   faiss     : { vectors: [{ id, label, hit }] }   — FAISS 박스 안 ID들
    //   metaDb    : { rows: [{ id, title, category, hit }] } | null
    //   showLink  : ID 화살표(FAISS → 메타DB)를 그릴지
    //   persist   : { mode: 'memory'|'save'|'load'|'rebuild', files:[...] } | null
    //   filter    : { mode: 'pre'|'post', pool:[...], result:[...], note:'' } | null
    //   conclusion: 마지막 결론 박스 표시
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      metaNone: {lang:"python", filename:"metadata-side-db.py", lines:[
        "# FAISS는 벡터(float)와 정수 ID만 저장 — 메타데이터는 분리",
        "import faiss",
        "import numpy as np",
        "",
        "# 1) FAISS 인덱스 생성 (768차원 L2)",
        "index = faiss.IndexIDMap(faiss.IndexFlatL2(768))",
        "",
        "# 2) 벡터 추가 — ID는 직접 부여",
        "ids     = np.array([17, 23, 42, 56, 71, 88], dtype=np.int64)",
        "vectors = np.random.rand(6, 768).astype(np.float32)",
        "index.add_with_ids(vectors, ids)",
        "",
        "# 3) 검색 결과는 ID + 거리뿐",
        "q = np.random.rand(1, 768).astype(np.float32)",
        "D, I = index.search(q, k=3)",
        "# I = [[42, 23, 71]]",
        "# D = [[0.13, 0.27, 0.44]]",
        "",
        "# 문제: ID=42가 어떤 문서인지 FAISS는 모른다",
        "#  - title?    → ✗",
        "#  - category? → ✗",
        "#  - 작성일?   → ✗",
        "# 메타는 다른 저장소(SQLite/Redis/Postgres)에 따로 둬야 한다",
      ]},
      metaSqlite: {lang:"python", filename:"metadata-side-db.py", lines:[
        "# 보완: SQLite에 같은 ID로 메타데이터 저장 → 2-step 조회",
        "import faiss, sqlite3, numpy as np",
        "",
        "# 1) 메타데이터 테이블 — FAISS와 같은 정수 ID를 PK로",
        "conn = sqlite3.connect(\"metadata.db\")",
        "conn.execute(\"\"\"",
        "  CREATE TABLE IF NOT EXISTS docs (",
        "    id INTEGER PRIMARY KEY,",
        "    title TEXT,",
        "    category TEXT,",
        "    created_at TEXT",
        "  )",
        "\"\"\")",
        "",
        "# 2) 적재 시 두 곳에 같은 ID로 동시 기록",
        "def insert_doc(doc_id, vector, title, category):",
        "    index.add_with_ids(vector.reshape(1, -1),",
        "                       np.array([doc_id], dtype=np.int64))",
        "    conn.execute(",
        "      \"INSERT INTO docs(id, title, category) VALUES(?,?,?)\",",
        "      (doc_id, title, category),",
        "    )",
        "    conn.commit()",
        "",
        "# 3) 검색 = FAISS로 ID 회수 → SQLite로 메타 조회",
        "D, I = index.search(q, k=3)            # [[42, 71, 23]]",
        "rows = conn.execute(",
        "  \"SELECT id,title,category FROM docs WHERE id IN (?,?,?)\",",
        "  tuple(int(i) for i in I[0])",
        ").fetchall()",
        "",
        "# → [(42, \"FAISS 정리\", \"ai\"), (71, \"pgvector\", \"ai\"), ...]",
        "# 핵심: ID라는 끈으로 두 저장소를 묶음 — 동기화는 직접 책임",

    // ─────────────────────────────────────────────────────
    // FAISS 박스 — 벡터 ID 카드 그리드
    // ─────────────────────────────────────────────────────
    function FaissBox({ faiss }) {
      if (!faiss) {
        return (
          <div className="rounded-lg bg-slate-50 border border-dashed border-slate-300 p-3 text-center text-[11px] text-slate-400 font-mono">
            (FAISS 박스 — 이 단계에서 사용 안 함)
          </div>
        );
      }
      return (
        <div className="rounded-lg bg-gradient-to-br from-purple-50 to-purple-100 border-2 border-purple-300 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-[11px] font-bold text-purple-800 flex items-center gap-1">
              <span>📦</span><span>FAISS 인덱스 (in-memory)</span>
            </div>
            <span className="text-[9px] font-mono text-purple-600">IndexIDMap(IndexFlatL2(768))</span>
          </div>
          <div className="grid grid-cols-3 gap-2">
            {faiss.vectors.map((v) => (
              <div
                key={v.id}
                className={`rounded-md border-2 p-2 text-center transition-all duration-500 ${
                  v.hit
                    ? 'bg-purple-600 border-purple-800 text-white shadow-md scale-105'
                    : 'bg-white border-purple-200 text-purple-700'
                }`}
              >
                <div className={`text-[10px] uppercase ${v.hit ? 'text-purple-200' : 'text-purple-400'}`}>id</div>
                <div className="text-base font-mono font-bold">{v.id}</div>
                <div className={`text-[9px] font-mono ${v.hit ? 'text-purple-100' : 'text-slate-500'}`}>
                  {v.label}
                </div>
              </div>
            ))}
          </div>
          {faiss.searchHit && (
            <div className="mt-2 px-2 py-1 rounded bg-purple-700 text-white text-[10px] font-mono flex justify-between">
              <span>검색 결과</span>
              <span>id={faiss.searchHit.id}, dist={faiss.searchHit.dist}</span>

    }

    // ─────────────────────────────────────────────────────
    // 메타데이터 SQLite 테이블 박스
    // ─────────────────────────────────────────────────────
    function MetaDbBox({ metaDb, showLink }) {
      if (!metaDb) {
        return (
          <div className="rounded-lg bg-slate-50 border border-dashed border-slate-300 p-3 text-center text-[11px] text-slate-400 font-mono">

              <span>🗄️</span><span>SQLite metadata.db</span>

                <th className="px-2 py-1 text-left">title</th>
                <th className="px-2 py-1 text-left">category</th>
              </tr>
            </thead>
            <tbody>
              {metaDb.rows.map((r) => (
                <tr
                  key={r.id}
                  className={`transition-all duration-500 ${
                    r.hit ? 'bg-emerald-300/60 font-bold text-emerald-900' : 'odd:bg-white even:bg-emerald-50/50 text-slate-700'

    // ─────────────────────────────────────────────────────
    // 영속성 다이어그램 (저장 → 재시작 → 로드 → add → 리빌드)
    // ─────────────────────────────────────────────────────
    function PersistDiagram({ persist }) {
      if (!persist) return null;
      const colorOf = (k) => {
        if (k === 'mem')     return 'from-purple-100 to-purple-50 border-purple-300 text-purple-800';
        if (k === 'save')    return 'from-emerald-100 to-emerald-50 border-emerald-300 text-emerald-800';
        if (k === 'restart') return 'from-amber-100 to-amber-50 border-amber-300 text-amber-800';
        if (k === 'load')    return 'from-sky-100 to-sky-50 border-sky-300 text-sky-800';
        if (k === 'add')     return 'from-rose-100 to-rose-50 border-rose-300 text-rose-800';
        return 'from-fuchsia-100 to-fuchsia-50 border-fuchsia-300 text-fuchsia-800';
      };
      const iconOf = (k) => ({
        mem: '🧠', save: '💾', restart: '⟲', load: '📂', add: '➕', rebuild: '🔁',
      }[k] || '•');
      return (
        <div className="rounded-lg bg-gradient-to-br from-purple-50 to-purple-100 border-2 border-purple-300 p-3">
          <div className="text-[11px] font-bold text-purple-800 mb-2 flex items-center gap-1">
            <span>💾</span><span>FAISS 영속성 흐름 — write_index / read_index</span>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
            {persist.steps.map((s, i) => (
              <div
                key={i}
                className={`rounded-md border-2 bg-gradient-to-br p-2 text-center transition-all duration-500 ${colorOf(s.kind)}`}
              >
                <div className="text-base">{iconOf(s.kind)}</div>
                <div className="text-[11px] font-bold mt-0.5">{s.label}</div>
                <div className="text-[9px] mt-0.5 font-mono opacity-80">{s.detail}</div>
              </div>
            ))}
          </div>
          <div className="text-[9px] text-purple-700 mt-2 text-center font-mono">
            저장·로드는 OK · 새 add는 다시 write 필요 · 학습형 인덱스는 주기적 리빌드가 안전
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 필터링 시나리오 (pre vs post 나란히 비교)
    // ─────────────────────────────────────────────────────
    function FilterScenario({ filter }) {
      if (!filter) return null;
      const renderCol = (col, accent) => (
        <div className={`rounded-lg border-2 ${accent.border} ${accent.bg} p-3`}>
          <div className={`text-[11px] font-bold mb-2 ${accent.text}`}>
            {col.label}
          </div>
          <ol className="space-y-1.5">
            {col.steps.map((s, i) => (
              <li
                key={i}
                className={`rounded-md border px-2 py-1.5 text-[10px] flex flex-col gap-0.5 ${
                  s.warn
                    ? 'bg-amber-50 border-amber-300 text-amber-900'
                    : 'bg-white border-slate-200 text-slate-700'
                }`}
              >
                <div className="font-bold font-mono">
                  <span className="opacity-60 mr-1">{i + 1}.</span>{s.t}
                </div>
                <div className="text-[9px] font-mono opacity-80">{s.detail}</div>
              </li>
            ))}
          </ol>
        </div>
      );
      return (
        <div className="rounded-lg bg-purple-50/50 border-2 border-purple-300 p-3">
          <div className="text-[11px] font-bold text-purple-800 mb-2 flex items-center justify-between">
            <span>🔍 필터링 시나리오 — {filter.query}</span>
            <span className="text-[9px] font-mono text-purple-600">pre vs post 비교</span>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
            {renderCol(filter.pre, {
              border: 'border-sky-300', bg: 'bg-sky-50/60', text: 'text-sky-800',
            })}
            {renderCol(filter.post, {
              border: 'border-rose-300', bg: 'bg-rose-50/60', text: 'text-rose-800',
            })}
          </div>
          <div className="text-[9px] text-purple-700 mt-2 text-center font-mono">
            pre = 정확하지만 후보 클수록 느림 · post = 빠르지만 결과 누락 위험
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 결론 박스 (Step 5)
    // ─────────────────────────────────────────────────────
    function ConclusionBox() {
      const rows = [
        { k: '메타데이터',  faiss: 'ID만 — 외부 DB 직접',         alt: '✓ 내장 (필드 schema)' },
        { k: '영속성',      faiss: 'write/read_index 수동',       alt: '✓ 자동 + WAL/스냅샷' },

        { k: '추천 상황',   faiss: 'GPU·대규모·검색 최우선',      alt: '대다수 RAG' },

      return (
        <div className="rounded-lg bg-white border-2 border-purple-400 overflow-hidden shadow-sm">
          <div className="bg-purple-100 px-3 py-2 border-b border-purple-200 flex items-center justify-between">
            <div className="text-xs font-bold text-purple-900">📊 FAISS vs 통합 벡터 DB (Chroma · pgvector)</div>
            <span className="text-[10px] font-mono text-purple-700">결론</span>
          </div>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="bg-purple-50 text-left">

                <th className="px-3 py-2 font-bold text-purple-700">Chroma / pgvector</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={r.k} className={i % 2 === 0 ? 'bg-white' : 'bg-purple-50/40'}>
                  <td className="px-3 py-1.5 font-bold text-slate-700 border-r border-slate-100">{r.k}</td>
                  <td className="px-3 py-1.5 text-slate-700 font-mono">{r.faiss}</td>
                  <td className="px-3 py-1.5 text-purple-800 font-mono font-semibold">{r.alt}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="bg-purple-50 px-3 py-2 border-t border-purple-200 text-[11px] text-purple-900 leading-relaxed">
            <strong>결론.</strong> FAISS 한계 4종을 모두 직접 보완해야 한다면 도메인 코드가
            인프라 코드에 잠식된다. 일반 RAG는 <strong>Chroma (Part III)</strong> 또는
            <strong> pgvector (Part IV)</strong>로 가는 것이 합리적이다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — Step에 따라 적절한 패널을 보여줌
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📚 도서관 사서 — FAISS는 책장만, 카탈로그는 따로</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* Step 1, 2 — FAISS + (조건부) 메타DB + 화살표 */}
          {(step.faiss || step.metaDb) && (
            <div className="space-y-2">
              <FaissBox faiss={step.faiss} />
              {step.showLink && (
                <div className="flex items-center justify-center gap-1 text-[10px] font-mono text-slate-500 py-0.5">
                  <span>id 화살표</span>

                </div>
              )}
              <MetaDbBox metaDb={step.metaDb} showLink={step.showLink} />
            </div>
          )}

          {/* Step 3 — 영속성 다이어그램 */}
          {step.persist && <PersistDiagram persist={step.persist} />}

          {/* Step 4 — 필터링 시나리오 */}
          {step.filter && <FilterScenario filter={step.filter} />}

          {/* Step 5 — 결론 */}
          {step.conclusion && <ConclusionBox />}

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm" style={{ background: '#a78bfa' }}></span>
              FAISS 박스
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm" style={{ background: '#34d399' }}></span>
              SQLite 메타
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm" style={{ background: '#fbbf24' }}></span>
              주의/제약
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
              미사용
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + 파일 탭
    //   step.code 외에 step.codeAlt 가 있으면 탭으로 토글
    // ─────────────────────────────────────────────────────
    function CodeViewer({ step, stepIdx, total }) {
      const tabs = step.codeAlt ? [step.code, step.codeAlt] : [step.code];
      const [activeTab, setActiveTab] = useState(0);
      const code = tabs[Math.min(activeTab, tabs.length - 1)];
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      // 새 단계로 이동하면 첫 탭으로
      useEffect(() => { setActiveTab(0); }, [stepIdx]);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭들 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <div className="flex gap-1 ml-2">
              {tabs.map((t, i) => (
                <button
                  key={i}
                  onClick={() => setActiveTab(i)}
                  className={`px-2 py-0.5 text-[11px] font-mono rounded-t transition ${
                    i === activeTab
                      ? 'bg-[#282c34] text-purple-200 border-t border-l border-r border-purple-500/40'
                      : 'bg-[#1e2127] text-slate-500 hover:text-slate-300'
                  }`}
                >
                  {t.filename}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 숨김 코드 */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-purple-500/15 border-l-2 border-purple-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}{tabs.length > 1 ? ` · tab ${activeTab + 1}/${tabs.length}` : ''}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-purple-700 hover:text-purple-900 font-medium">&larr; Vector DB 허브</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-3</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-purple-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. FAISS &gt; Chapter 2. FAISS 실전</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">FAISS 한계와 보완 — 메타데이터, 영속성, 필터링</h1>
                  <p className="text-sm text-slate-500 mt-0.5">FAISS는 책장(검색)만 잘한다 — 카탈로그(메타)와 자동 동기화는 외부 도구로</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-purple-50 border-2 border-purple-300 rounded-xl p-3 text-sm text-purple-900">
                💡 다음 Part(III)에서는 <strong>Chroma</strong>로 메타데이터·영속성·필터·CRUD가 한 패키지에 통합된 모습을 직접 다룬다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-purple-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-purple-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-purple-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-purple-600 text-white hover:bg-purple-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-2-2.html" className="text-slate-500 hover:text-slate-700">&larr; II-2-2 IVF/PQ 인덱스</a>
              <a href="../index.html" className="text-purple-700 hover:text-purple-900 font-medium">Vector DB 허브 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
