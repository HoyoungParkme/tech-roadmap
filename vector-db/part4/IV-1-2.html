  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-1-2. pgvector 데이터 모델 — vector 타입과 연산자
    학습 목표: pgvector 확장의 vector 타입 정의/입력/거리 연산자/함수/제약을 5단계로 학습한다.
    핵심 비유: 벡터 컬럼 = N차원 좌표 행, 거리 연산자 = 두 점 사이 측정 도구
    패턴: fastapi v1 — 좌(LiveDataPane: 벡터 행 + 거리 다이어그램 + 함수 표) / 우(VSCode CodeViewer)
    색상: vector-db purple
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   row       : 테이블 한 행 시각화 ({ columns:[{name,type,value,active}] })
    //   distance  : 거리 연산자 다이어그램 ({ a, b, op, result, formula, range, color })
    //   funcs     : 함수 표 ({ rows:[{ fn, input, output, note }] })
    //   limits    : 제약 카드 ({ items:[{ label, value, color }] })
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"sql", filename:"vector-type.sql", lines:[
        "-- pgvector 확장 활성화 (DB당 1회)",
        "CREATE EXTENSION IF NOT EXISTS vector;",
        "",
        "-- vector(N) 타입 — N은 차원 수, 컬럼 정의 시 고정",
        "CREATE TABLE items (",
        "    id        SERIAL PRIMARY KEY,",
        "    name      TEXT NOT NULL,",
        "    -- OpenAI text-embedding-3-small = 1536차원",
        "    embedding vector(1536)",
        ");",
        "",
        "-- 다른 모델별 차원 (참고)",
        "--   text-embedding-3-large    : vector(3072)",
        "--   all-MiniLM-L6-v2          : vector(384)",
        "--   bge-large-en-v1.5         : vector(1024)",
        "--   nomic-embed-text-v1.5     : vector(768)",
        "",
        "-- 컬럼 메타 확인",
        "SELECT column_name, udt_name, character_maximum_length",
        "FROM   information_schema.columns",
        "WHERE  table_name = 'items';",
        "",
        "-- udt_name = \"vector\" / atttypmod 안에 차원 N 인코딩",
        "",
        "-- 핵심:",
        "--  1) N은 컬럼에 고정 — 다른 차원 INSERT 시 에러",
        "--  2) N을 생략한 vector 도 가능하지만 차원 검증 못 함",
        "--  3) 차원 변경은 ALTER TABLE 로 컬럼 재생성 필요",
      ]},
      s2: {lang:"python", filename:"insert-vector.sql", lines:[
        "-- ① SQL: 텍스트 리터럴 + 명시 캐스트",
        "INSERT INTO items (name, embedding)",
        "VALUES ('cat photo', '[0.10, 0.85, 0.42]'::vector(3));",
        "",
        "-- ② SQL: 캐스트 생략 — 컬럼 타입으로 자동 캐스트",
        "INSERT INTO items (name, embedding)",
        "VALUES ('dog photo', '[0.20, 0.75, 0.55]');",
        "",
        "-- ③ 차원 불일치 → ERROR",
        "INSERT INTO items (name, embedding)",
        "VALUES ('bad', '[0.1, 0.2]');",
        "-- ERROR: expected 3 dimensions, not 2",
        "",
        "-- ─── Python 드라이버: 자동 변환 ───",
        "# pip install pgvector psycopg[binary]",
        "import psycopg",
        "from pgvector.psycopg import register_vector",
        "import numpy as np",
        "",
        "conn = psycopg.connect(\"postgresql://...\", autocommit=True)",
        "register_vector(conn)   # 어댑터 등록 — 핵심",
        "",
        "# numpy ndarray 또는 list를 그대로 바인딩",
        "vec = np.array([0.10, 0.85, 0.42], dtype=np.float32)",
        "conn.execute(",
        "    \"INSERT INTO items (name, embedding) VALUES (%s, %s)\",",
        "    (\"cat photo\", vec),",
        ")",
        "# 어댑터가 vec → \"[0.10,0.85,0.42]\" 리터럴로 직렬화",
        "",
        "# SELECT 시 역방향: vector → numpy.ndarray 자동 디코드",
        "rows = conn.execute(\"SELECT embedding FROM items\").fetchall()",
        "# rows[0][0] 은 numpy.ndarray (shape=(3,), dtype=float32)",
      ]},
      s3: {lang:"sql", filename:"distance-ops.sql", lines:[
        "-- ─── 3가지 거리 연산자 ───",
        "SELECT '[1,2]'::vector <->  '[4,6]'::vector AS l2_dist;     -- 5",
        "SELECT '[1,2]'::vector <=>  '[4,6]'::vector AS cos_dist;    -- 0.018",
        "SELECT '[1,2]'::vector <#>  '[4,6]'::vector AS neg_inner;   -- -16",
        "",
        "-- 모두 \"작을수록 가까움\" → ORDER BY 만 쓰면 KNN 검색",
        "SELECT id, name, embedding <=> %(q)s AS distance",

    const S4 = { title:"Step 4. 함수 — vector_dims, vector_norm, AVG (vector_avg)", desc:"pgvector는 거리 연산자 외에 유틸 함수도 제공한다. vector_dims(v) 는 차원 수를 돌려주고, vector_norm(v) 는 L2 norm(벡터의 길이 √Σaᵢ²)을 계산한다. 집계 함수 avg(vector) 는 벡터들의 element-wise 평균을 돌려주며 클러스터 centroid 계산에 흔히 쓴다. sum(vector) 도 동일 방식." };

        limits: {"items":[{"label":"최대 차원 (저장)","value":"16,000","unit":"dims","color":"bg-violet-100 text-violet-800 border-violet-300"},{"label":"최대 차원 (HNSW/IVFFlat)","value":"2,000","unit":"dims","color":"bg-purple-100 text-purple-800 border-purple-300"},{"label":"바이트/요소","value":"4","unit":"B (float32)","color":"bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300"},{"label":"1536차원 1행 크기","value":"~6.1","unit":"KB","color":"bg-violet-100 text-violet-800 border-violet-300"},{"label":"3072차원 1행 크기","value":"~12.3","unit":"KB","color":"bg-purple-100 text-purple-800 border-purple-300"},{"label":"TOAST 임계","value":"~2","unit":"KB","color":"bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300"}],"tactics":[{"icon":"✂","text":"차원 축소: matryoshka / PCA — 1536→512"},{"icon":"🔢","text":"halfvec(N): float16 — 메모리 절반"},{"icon":"📦","text":"bit/sparse 양자화 — 인덱스 5~10× 축소"}]},
        code:{...CODE.s5, highlight:[30,31,32,33]},

      { ...S5,
        beat:{ label:"아예 떼어 놓기도 한다", at:"limits.md L34",
               caption:"임베딩만 별도 테이블에 두고 본문 테이블은 FK 만 갖는다. 본문 조회가 TOAST 를 건드리지 않게 된다.",
               changes:[{mark:"new", text:"임베딩 전용 테이블 분리"},
                        {mark:"read", text:"메인 테이블은 fk 만 보유"}] },
        row: null,
        distance: null,
        funcs: null,
        limits: {"items":[{"label":"최대 차원 (저장)","value":"16,000","unit":"dims","color":"bg-violet-100 text-violet-800 border-violet-300"},{"label":"최대 차원 (HNSW/IVFFlat)","value":"2,000","unit":"dims","color":"bg-purple-100 text-purple-800 border-purple-300"},{"label":"바이트/요소","value":"4","unit":"B (float32)","color":"bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300"},{"label":"1536차원 1행 크기","value":"~6.1","unit":"KB","color":"bg-violet-100 text-violet-800 border-violet-300"},{"label":"3072차원 1행 크기","value":"~12.3","unit":"KB","color":"bg-purple-100 text-purple-800 border-purple-300"},{"label":"TOAST 임계","value":"~2","unit":"KB","color":"bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300"}],"tactics":[{"icon":"✂","text":"차원 축소: matryoshka / PCA — 1536→512"},{"icon":"🔢","text":"halfvec(N): float16 — 메모리 절반"},{"icon":"📦","text":"bit/sparse 양자화 — 인덱스 5~10× 축소"},{"icon":"🗂","text":"큰 임베딩은 별도 테이블 + JOIN"}]},
        code:{...CODE.s5, highlight:[34]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // VectorRow — 테이블 행 시각화 (압축 표시)
    // ─────────────────────────────────────────────────────
    function VectorRow({ row }) {
      if (!row) return null;
      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-purple-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>🗂</span>
            <span>{row.title}</span>
          </div>

          {/* 컬럼 헤더 + 값 — 가로 스크롤 가능 */}
          <div className="overflow-hidden rounded-lg border border-violet-200 bg-white">
            <table className="w-full text-[11px] font-mono">
              <thead>
                <tr className="bg-violet-50">
                  {row.columns.map((c) => (
                    <th
                      key={c.name}
                      className={`px-3 py-2 text-left border-b border-violet-100 ${
                        c.active ? 'bg-violet-200 text-violet-900' : 'text-violet-700'
                      }`}
                    >
                      <div className="font-bold">{c.name}</div>

              <span className="font-bold mr-1">→</span>{row.highlight}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // DistanceDiagram — 두 벡터 + 결과 거리 SVG
    // ─────────────────────────────────────────────────────
    function DistanceDiagram({ distance }) {
      if (!distance) return null;
      const w = 380;
      const h = 240;
      const { a, b, ops } = distance;

      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-purple-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>📐</span>
            <span>두 벡터 사이 거리 — 3가지 측정 방식</span>
          </div>

          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto bg-white rounded border border-violet-200">
            <defs>
              <pattern id="grid-vec-iv12" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e9d5ff" strokeWidth="0.5" />
              </pattern>
              <marker id="vec-arrow" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto">
                <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed" />
              </marker>
            </defs>
            <rect width={w} height={h} fill="url(#grid-vec-iv12)" />

            {/* 원점 표시 */}
            <circle cx={40} cy={210} r={3} fill="#7c3aed" />
            <text x={42} y={222} fontSize="9" fill="#6d28d9" fontFamily="monospace">origin</text>

            {/* 벡터 a (원점 → a) */}
            <line x1={40} y1={210} x2={a.x} y2={a.y} stroke="#a78bfa" strokeWidth="1.5" strokeDasharray="3,3" markerEnd="url(#vec-arrow)" opacity="0.6" />
            {/* 벡터 b (원점 → b) */}
            <line x1={40} y1={210} x2={b.x} y2={b.y} stroke="#a78bfa" strokeWidth="1.5" strokeDasharray="3,3" markerEnd="url(#vec-arrow)" opacity="0.6" />

            {/* 거리 — a~b 직선 (L2 강조) */}
            <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="#7c3aed" strokeWidth="2.5" />
            <text x={(a.x + b.x) / 2 + 6} y={(a.y + b.y) / 2 - 6} fontSize="10" fill="#5b21b6" fontFamily="monospace" fontWeight="bold">
              &lt;-&gt; = 5.0
            </text>

            {/* 점 a */}
            <circle cx={a.x} cy={a.y} r={9} fill="#7c3aed" stroke="#4c1d95" strokeWidth="2" />
            <text x={a.x} y={a.y - 14} textAnchor="middle" fontSize="10" fill="#4c1d95" fontFamily="monospace" fontWeight="bold">{a.label}</text>

            {/* 점 b */}
            <circle cx={b.x} cy={b.y} r={9} fill="#a855f7" stroke="#581c87" strokeWidth="2" />
            <text x={b.x} y={b.y - 14} textAnchor="middle" fontSize="10" fill="#581c87" fontFamily="monospace" fontWeight="bold">{b.label}</text>

            {/* 코사인 각도 표시 */}
            <text x={70} y={185} fontSize="9" fill="#9333ea" fontFamily="monospace">θ ≈ 11° (cos≈0.98)</text>
          </svg>

          {/* 3가지 연산자 결과 카드 */}
          <div className="mt-2 grid grid-cols-1 gap-1.5">
            {ops.map((o) => (
              <div key={o.op} className="flex items-center gap-2 bg-white border border-violet-200 rounded px-2 py-1.5 text-[11px]">
                <span className="font-mono font-bold text-base w-12 text-center" style={{ color: o.color }}>{o.op}</span>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-violet-900">{o.name}</div>
                  <div className="text-[9px] text-slate-500 font-mono truncate">{o.formula} · {o.range}</div>
                </div>
                <div className="text-right">
                  <div className="font-mono font-bold text-violet-700">{o.result}</div>
                  <div className="text-[9px] text-slate-500 font-mono">{o.ops_class}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-1 text-[10px] text-violet-700 text-center font-mono">
            모두 "값 작을수록 가까움" → ORDER BY ... LIMIT k 로 KNN
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FuncsTable — 함수 표
    // ─────────────────────────────────────────────────────
    function FuncsTable({ funcs }) {
      if (!funcs) return null;
      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-purple-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>🧮</span>
            <span>벡터 유틸 함수 — 입력/출력 예시</span>
          </div>

          <div className="overflow-hidden rounded-lg border border-violet-200 bg-white">
            <table className="w-full text-[11px]">
              <thead>
                <tr className="bg-violet-50 text-left">
                  <th className="px-2 py-2 font-bold text-violet-700 w-1/4">함수</th>
                  <th className="px-2 py-2 font-bold text-violet-700">입력 예</th>
                  <th className="px-2 py-2 font-bold text-violet-700 w-1/5">출력</th>
                </tr>
              </thead>
              <tbody>
                {funcs.rows.map((r, i) => (
                  <tr key={r.fn} className={i % 2 === 0 ? 'bg-white' : 'bg-violet-50/40'}>
                    <td className="px-2 py-1.5 font-mono font-bold text-violet-800 border-r border-slate-100">
                      <div className="flex items-center gap-1">
                        <span className="inline-block w-5 text-center text-violet-400">{r.emoji}</span>
                        <span>{r.fn}</span>
                      </div>
                      <div className="text-[9px] text-slate-500 font-sans font-normal mt-0.5">{r.note}</div>
                    </td>
                    <td className="px-2 py-1.5 text-slate-700 font-mono text-[10px] break-all">{r.input}</td>
                    <td className="px-2 py-1.5 font-mono font-bold text-violet-700 text-[10px]">{r.output}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="mt-2 text-[10px] text-violet-700 bg-white/60 border border-violet-200 rounded px-2 py-1">
            <span className="font-bold">팁:</span> 함수형(<span className="font-mono">l2_distance</span> 등)은 인덱스를 못 타므로 KNN 쿼리는 연산자(<span className="font-mono">&lt;-&gt;</span>, <span className="font-mono">&lt;=&gt;</span>, <span className="font-mono">&lt;#&gt;</span>)를 쓰자.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LimitsCards — 제약 카드
    // ─────────────────────────────────────────────────────
    function LimitsCards({ limits }) {
      if (!limits) return null;
      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-purple-100 border border-violet-200 p-3">
          <div className="text-[11px] font-bold text-violet-800 mb-2 flex items-center gap-1">
            <span>⚠️</span>
            <span>vector(N) 제약 & 비용</span>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 gap-1.5">
            {limits.items.map((it) => (
              <div key={it.label} className={`rounded-lg border-2 px-2 py-2 ${it.color}`}>
                <div className="text-[9px] font-semibold opacity-80 leading-tight">{it.label}</div>
                <div className="flex items-baseline gap-1 mt-0.5">
                  <span className="font-mono font-bold text-lg leading-none">{it.value}</span>
                  <span className="font-mono text-[9px] opacity-70">{it.unit}</span>
                </div>
              </div>
            ))}
          </div>

          <div className="mt-2 bg-white/70 border border-violet-200 rounded p-2">
            <div className="text-[10px] font-bold text-violet-800 mb-1">💡 절약 전략</div>
            <ul className="space-y-0.5">
              {limits.tactics.map((t, i) => (
                <li key={i} className="text-[10px] text-slate-700 flex items-start gap-1.5">
                  <span className="text-violet-600">{t.icon}</span>
                  <span>{t.text}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 단계별 시각화 라우터
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step, stepIdx }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📐 pgvector — vector 타입 모델</h2>
            <span className="text-[10px] text-slate-400 font-mono">step {stepIdx + 1} live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-3">
            {step.row      && <VectorRow row={step.row} />}
            {step.distance && <DistanceDiagram distance={step.distance} />}
            {step.funcs    && <FuncsTable funcs={step.funcs} />}
            {step.limits   && <LimitsCards limits={step.limits} />}
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#7c3aed' }}></span>
              vector 컬럼
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#a855f7' }}></span>
              연산 결과
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5" style={{ background: '#7c3aed' }}></span>
              거리 (작을수록 가까움)
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="text-slate-400">⌨</span>
              ←/→
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-violet-500/15 border-l-2 border-violet-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. pgvector &gt; Chapter 1. pgvector 기초</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">pgvector 데이터 모델 — vector 타입과 연산자</h1>
                  <p className="text-sm text-slate-500 mt-0.5">vector(N) 정의 / 입력 / 거리 연산자 / 함수 / 제약을 5단계로</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음(IV-2-1)에서는 <strong>인덱싱</strong> — IVFFlat vs HNSW 트레이드오프와 파라미터 튜닝을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[110px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 칩 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['vector(N)', '<->', '<=>', '<#>', 'vector_dims', 'vector_norm', 'avg(vector)', '16,000 dims', 'TOAST', 'halfvec'].map(kw => (
                <span key={kw} className="bg-violet-50 text-violet-700 px-3 py-1 rounded-full text-xs font-mono font-medium border border-violet-200">{kw}</span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./IV-1-1.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; IV-1-1 pgvector란</a>
              <a href="./IV-2-1.html" className="text-violet-700 hover:text-violet-900 font-medium">IV-2-1 pgvector 인덱싱 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
