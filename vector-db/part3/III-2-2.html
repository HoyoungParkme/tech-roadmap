  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-2-2. Chroma + LangChain / LlamaIndex 통합
    학습 목표: 같은 Chroma 작업을 (1) 직접 호출 (2) LangChain (3) LlamaIndex 추상화로
              구현했을 때 코드량/관심사가 어떻게 달라지는지 5단계로 비교한다.
    핵심 비유: 커피 — 원두 직접 갈기(직접 호출) vs 커피 머신(LangChain/LlamaIndex)
    패턴: fastapi v1 — 좌(LiveDataPane: 직접 호출 흐름 + 추상화 흐름 + 라인 수 비교 + 임베딩 선택)
                    / 우(VSCode CodeViewer)
    색상: purple
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   directFlow   : 좌측 직접 호출 흐름 박스 [{label, lib, active, payload}]
    //   abstractFlow : 우측 추상화 흐름 박스 (LangChain or LlamaIndex)
    //   directLines  : 직접 호출 코드 라인 수
    //   abstractLines: 추상화 코드 라인 수
    //   embedModel   : 'openai' | 'cohere' | 'huggingface' | null
    //   showModelBox : 모델 선택 박스 노출 여부
    //   framework    : 'direct' | 'langchain' | 'llamaindex' (좌측 우측 박스 라벨)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"python", filename:"direct.py", lines:[
        "\"\"\"Chroma 직접 호출 — 추상화 없이 원시 클라이언트만 사용.\"\"\"",
        "import chromadb",
        "from openai import OpenAI",
        "",
        "# 1) 클라이언트 + 컬렉션 준비",
        "chroma = chromadb.PersistentClient(path=\"./chroma_direct\")",
        "col = chroma.get_or_create_collection(\"docs\")",
        "oai = OpenAI()",
        "",
        "# 2) 임베딩 — OpenAI API 직접 호출",
        "docs = [\"AI 기초 가이드\", \"ML 실전 튜토리얼\"]",
        "resp = oai.embeddings.create(model=\"text-embedding-3-small\", input=docs)",
        "vectors = [d.embedding for d in resp.data]",
        "",
        "# 3) 저장 — id/문서/벡터/메타데이터를 모두 직접 묶어 add",
        "col.add(",
        "    ids=[\"d1\", \"d2\"],",
        "    documents=docs,",
        "    embeddings=vectors,",
        "    metadatas=[{\"category\": \"AI\"}, {\"category\": \"ML\"}],",
        ")",
        "",
        "# 4) 질의 — 질문도 같은 임베딩 모델로 직접 인코딩",
        "q_vec = oai.embeddings.create(",
        "    model=\"text-embedding-3-small\", input=[\"딥러닝 입문\"]",
        ").data[0].embedding",
        "res = col.query(query_embeddings=[q_vec], n_results=2)",
        "# → 모든 단계가 손에 잡히지만, 코드량이 많고 책임이 흩어져 있다",
      ]},
      s2: {lang:"python", filename:"langchain.py", lines:[
        "\"\"\"LangChain 추상화 — Document + Chroma.from_documents 한 줄로 적재.\"\"\"",
        "from langchain_community.vectorstores import Chroma",
        "from langchain_openai import OpenAIEmbeddings",
        "from langchain_core.documents import Document",
        "",
        "# 1) 문서 = page_content + metadata 단일 객체",
        "docs = [",
        "    Document(page_content=\"AI 기초 가이드\",     metadata={\"category\": \"AI\"}),",
        "    Document(page_content=\"ML 실전 튜토리얼\",   metadata={\"category\": \"ML\"}),",
        "]",
        "",
        "# 2) 한 줄로 임베딩 + Chroma 저장",
        "vectorstore = Chroma.from_documents(",
        "    documents=docs,",
        "    embedding=OpenAIEmbeddings(model=\"text-embedding-3-small\"),",
        "    persist_directory=\"./chroma_langchain\",",
        ")",
        "",
        "# 3) 검색도 한 줄 — 질문 임베딩/query까지 자동",
        "results = vectorstore.similarity_search(\"딥러닝 입문\", k=2)",
        "",
        "# 비교: 직접 호출(Step1) 18줄 → LangChain 8줄",
        "#   - 임베딩 호출 / collection.add 인자 묶기 / query 인코딩이",
        "#     from_documents() 내부로 들어갔다",
      ]},
      s3: {lang:"python", filename:"retriever.py", lines:[
        "\"\"\"LangChain Retriever — vectorstore를 RAG 체인의 표준 부품으로 변환.\"\"\"",
        "from langchain.chains import RetrievalQA",
        "from langchain_openai import ChatOpenAI",
        "",

        "from llama_index.vector_stores.chroma import ChromaVectorStore",
        "",
        "# 1) Chroma 원시 클라이언트 — collection까지 직접 만듦",
        "client = chromadb.PersistentClient(path=\"./chroma_llama\")",
        "collection = client.get_or_create_collection(\"my_docs\")",
        "",
        "# 2) LlamaIndex 래퍼로 한 번 감싸기",
        "vector_store = ChromaVectorStore(chroma_collection=collection)",
        "storage_ctx = StorageContext.from_defaults(vector_store=vector_store)",
        "",
        "# 3) Document → Index — 임베딩 + 저장 자동",
        "docs = [",
        "    Document(text=\"AI 기초 가이드\",   metadata={\"category\": \"AI\"}),",
        "    Document(text=\"ML 실전 튜토리얼\", metadata={\"category\": \"ML\"}),",
        "]",
        "index = VectorStoreIndex.from_documents(docs, storage_context=storage_ctx)",
        "",
        "# 4) Query Engine — 검색 + LLM 응답을 하나로 묶음",
        "engine = index.as_query_engine(similarity_top_k=4)",

    function DirectFlowBox({ flow }) {
      const isOff = !flow || flow.every((f) => !f.active);
      return (
        <div className={`rounded-lg border-2 p-3 transition-all ${
          isOff ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-gradient-to-br from-rose-50 to-rose-100 border-rose-300'
        }`}>
          <div className="text-[11px] font-bold mb-2 flex items-center gap-1.5">
            <span>🔧</span>
            <span className={isOff ? 'text-slate-500' : 'text-rose-800'}>직접 호출 (raw chromadb)</span>
          </div>
          {flow ? (
            <div className="space-y-1.5">
              {flow.map((f, i) => (
                <div
                  key={i}
                  className={`flex items-center gap-2 px-2 py-1.5 rounded border text-[11px] transition ${
                    f.active
                      ? 'bg-white border-rose-400 shadow-sm'
                      : 'bg-slate-50 border-slate-200 opacity-50'
                  }`}
                >
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0 ${
                    f.active ? 'bg-rose-500 text-white' : 'bg-slate-300 text-slate-500'
                  }`}>
                    {i + 1}
                  </span>
                  <div className="flex-1 min-w-0">
                    <div className={`font-mono font-bold truncate ${f.active ? 'text-rose-900' : 'text-slate-500'}`}>

            <div className="text-[11px] text-slate-500 italic font-mono py-4 text-center">
              (이 단계는 추상화 경로만)
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 박스: 추상화 흐름 (LangChain or LlamaIndex)
    // ─────────────────────────────────────────────────────
    function AbstractFlowBox({ flow, framework }) {
      const isLI = framework === 'llamaindex';
      const isOff = !flow || flow.every((f) => !f.active);
      const titleLabel = isLI ? '🦙 LlamaIndex 추상화' : '🦜 LangChain 추상화';
      const palette = isLI
        ? 'bg-gradient-to-br from-amber-50 to-amber-100 border-amber-300'
        : 'bg-gradient-to-br from-purple-50 to-purple-100 border-purple-300';
      const rowActive = isLI ? 'bg-white border-amber-400 shadow-sm' : 'bg-white border-purple-400 shadow-sm';
      const badgeActive = isLI ? 'bg-amber-500 text-white' : 'bg-purple-600 text-white';
      const fontMain = isLI ? 'text-amber-900' : 'text-purple-900';
      const fontSub = isLI ? 'text-amber-600' : 'text-purple-600';
      const titleColor = isLI ? 'text-amber-800' : 'text-purple-800';

      return (
        <div className={`rounded-lg border-2 p-3 transition-all ${
          isOff ? 'bg-slate-50 border-slate-200 opacity-60' : palette
        }`}>
          <div className={`text-[11px] font-bold mb-2 flex items-center gap-1.5 ${isOff ? 'text-slate-500' : titleColor}`}>
            <span>{titleLabel}</span>
          </div>
          {flow ? (
            <div className="space-y-1.5">

                <div
                  key={i}
                  className={`flex items-center gap-2 px-2 py-1.5 rounded border text-[11px] transition ${
                    f.active
                      ? rowActive
                      : 'bg-slate-50 border-slate-200 opacity-50'
                  }`}
                >
                  <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0 ${
                    f.active ? badgeActive : 'bg-slate-300 text-slate-500'
                  }`}>
                    {i + 1}
                  </span>
                  <div className="flex-1 min-w-0">
                    <div className={`font-mono font-bold truncate ${f.active ? fontMain : 'text-slate-500'}`}>
                      {f.label}
                    </div>
                    <div className={`font-mono text-[9px] truncate ${f.active ? fontSub : 'text-slate-400'}`}>
                      {f.lib} · {f.payload}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-[11px] text-slate-500 italic font-mono py-4 text-center">
              (Step 1은 직접 호출만)

      );
    }

    // ─────────────────────────────────────────────────────
    // 코드 라인 수 비교 막대
    // ─────────────────────────────────────────────────────
    function LineCompareBar({ direct, abstract }) {
      if (direct == null && abstract == null) return null;
      const max = Math.max(direct || 0, abstract || 0, 1);
      const dPct = ((direct || 0) / max) * 100;
      const aPct = ((abstract || 0) / max) * 100;

      return (
        <div className="rounded-lg bg-white border-2 border-purple-200 p-3">
          <div className="text-[11px] font-bold text-purple-800 mb-2 flex items-center gap-1.5">
            <span>📏</span>
            <span>코드 라인 수 비교</span>
          </div>
          <div className="space-y-2">
            {/* 직접 호출 */}
            <div>
              <div className="flex justify-between text-[10px] font-mono mb-0.5">
                <span className="text-rose-700 font-bold">직접 호출</span>
                <span className="text-rose-700 font-bold">{direct != null ? `${direct}줄` : '—'}</span>
              </div>
              <div className="h-3 bg-slate-100 rounded overflow-hidden">
                <div
                  className="h-full bg-gradient-to-r from-rose-400 to-rose-500 transition-all duration-700"
                  style={{ width: direct != null ? `${dPct}%` : '0%' }}
                />
              </div>
            </div>
            {/* 추상화 */}
            <div>
              <div className="flex justify-between text-[10px] font-mono mb-0.5">
                <span className="text-purple-700 font-bold">추상화 (LangChain/LlamaIndex)</span>
                <span className="text-purple-700 font-bold">{abstract != null ? `${abstract}줄` : '—'}</span>
              </div>
              <div className="h-3 bg-slate-100 rounded overflow-hidden">
                <div
                  className="h-full bg-gradient-to-r from-purple-500 to-purple-600 transition-all duration-700"
                  style={{ width: abstract != null ? `${aPct}%` : '0%' }}
                />
              </div>
            </div>
          </div>
          {direct != null && abstract != null && (
            <div className="mt-2 text-center text-[10px] font-mono text-purple-700">
              감소율 ≈ <span className="font-bold">{Math.round((1 - abstract / direct) * 100)}%</span>
              <span className="text-slate-500"> · {direct}줄 → {abstract}줄</span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 임베딩 모델 선택 박스 (Step 5)

    function EmbedModelBox({ selected, onSelect }) {
      return (
        <div className="rounded-lg bg-white border-2 border-purple-300 p-3">
          <div className="text-[11px] font-bold text-purple-800 mb-2 flex items-center gap-1.5">
            <span>🔌</span>
            <span>Embedding Model — 클릭해서 교체</span>
          </div>
          <div className="grid grid-cols-3 gap-2">
            {EMBED_MODELS.map((m) => {
              const active = selected === m.id;
              return (
                <button
                  key={m.id}
                  onClick={() => onSelect(m.id)}
                  className={`p-2 rounded-lg border-2 text-left transition ${
                    active
                      ? 'bg-purple-600 border-purple-700 text-white shadow-md scale-[1.02]'
                      : 'bg-white border-slate-200 hover:border-purple-300 hover:bg-purple-50'
                  }`}
                >
                  <div className="flex items-center gap-1 mb-1">
                    <span className="text-sm">{m.emoji}</span>
                    <span className={`text-[11px] font-bold ${active ? 'text-white' : 'text-slate-800'}`}>
                      {m.name}
                    </span>
                  </div>
                  <div className={`text-[9px] font-mono leading-tight ${active ? 'text-purple-100' : 'text-slate-500'}`}>
                    {m.sub}
                  </div>
                  <div className={`text-[9px] font-mono mt-0.5 ${active ? 'text-purple-100' : 'text-slate-400'}`}>
                    dim={m.dim} · {m.cost}
                  </div>
                  <div className={`text-[9px] mt-1 font-medium ${active ? 'text-white' : 'text-purple-700'}`}>
                    {m.tag}
                  </div>
                </button>
              );
            })}
          </div>
          <div className="mt-2 px-2 py-1.5 rounded bg-purple-50 border border-purple-200">
            <div className="text-[10px] font-mono text-purple-800">
              <span className="font-bold">교체 비용:</span> vectorstore / retriever / chain 코드 <span className="font-bold text-purple-900">0줄 변경</span>
            </div>
          </div>
        </div>
      );
    }

                </div>

            </div>
          )}


          {/* 좌(직접) / 우(추상화) 흐름 */}

            <div className="mb-3">
              <EmbedModelBox selected={embedModel} onSelect={setEmbedModel} />

            <div className="space-y-2">
              <div className="rounded-lg bg-purple-600 text-white p-3 flex items-start gap-2 shadow-sm">
                <span className="text-lg leading-none">❓</span>
                <div className="flex-1">
                  <div className="text-[10px] uppercase tracking-wider text-purple-200 font-bold">핵심 질문</div>

              </div>
              {step.answer && (
                <div className={`rounded-lg border-2 p-3 flex items-start gap-2 ${ansStyle[step.answerType]}`}>
                  <span className="text-lg leading-none">
                    {step.answerType === 'success' ? '✅' : step.answerType === 'fail' ? '⚠️' : '💬'}

                  <div className="flex-1">
                    <div className="text-[10px] uppercase tracking-wider font-bold opacity-70">결론</div>
                    <div className="text-sm font-medium mt-0.5">{step.answer}</div>
                  </div>
                </div>
              )}
            </div>

            <span className="flex items-center gap-1">

              직접 호출 (raw)

              <span className="w-2.5 h-2.5 rounded-full bg-purple-600"></span>
              LangChain
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
              LlamaIndex

            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span>

          </div>

    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 라인 번호 + 강조 */}
          <div className="overflow-auto max-h-[36rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-purple-500/15 border-l-2 border-purple-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [embedModel, setEmbedModel] = useState('openai');
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-purple-700 hover:text-purple-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-purple-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. Chroma &gt; Chapter 2. Chroma 실전</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Chroma + LangChain / LlamaIndex 통합</h1>
                  <p className="text-sm text-slate-500 mt-0.5">직접 호출 → 추상화 → 임베딩 교체까지 — 라인 수로 보는 추상화의 보상</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} embedModel={embedModel} setEmbedModel={setEmbedModel} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-purple-50 border-2 border-purple-300 rounded-xl p-3 text-sm text-purple-900">
                💡 다음(IV-1-1)에서는 <strong>pgvector</strong> — PostgreSQL에 벡터 검색을 더하는 확장으로 넘어간다 (기존 집에 방을 증축하는 비유)
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-purple-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-purple-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-purple-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-purple-600 text-white hover:bg-purple-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 칩 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {[
                'Chroma.from_documents()',
                'as_retriever(search_kwargs)',
                'ChromaVectorStore',
                'VectorStoreIndex',
                'RetrievalQA',
                'embed_documents/embed_query',
              ].map((kw) => (
                <span key={kw} className="bg-purple-50 text-purple-700 px-3 py-1 rounded-full text-xs font-medium border border-purple-200 font-mono">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-2-1.html" className="text-purple-600 hover:text-purple-800 font-medium">&larr; III-2-1. Chroma 아키텍처</a>
              <a href="../part4/IV-1-1.html" className="text-blue-600 hover:text-blue-800 font-medium">IV-1-1. pgvector란 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
