<!DOCTYPE html>

<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>

  <div id="root"></div>

  <!--
    FastAPI Chapter VI-3-2 — Git 버전 관리 첫걸음
    학습 목표: git init → add/commit → status/log → branch/checkout → remote push
              5단계 흐름으로 버전 관리 워크플로우를 시각화한다.
    핵심 비유: 게임 세이브 포인트 — 작업 디렉토리 → staging → local repo → remote
    패턴: fastapi v1 — 좌(LiveDataPane: 디렉토리/스테이징/로컬/리모트 4영역) / 우(CodeViewer 5탭)
    색상: indigo
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — git init → add/commit → status/log → branch → push
    //   working  : 작업 디렉토리 파일 목록 [{name, state}]  state: 'untracked' | 'modified' | 'tracked'
    //   staging  : 스테이지 영역 파일 [{name}]
    //   localRepo: 로컬 저장소 커밋 [{hash, msg, branch}]
    //   remote   : 원격 저장소 커밋 [{hash, msg}]
    //   branchInfo: 현재 브랜치/HEAD 상태
    //   code     : 우측 CodeViewer 파일 (lang, filename, lines, highlight)
    // ─────────────────────────────────────────────────────
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };
    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      init: {lang:"bash", filename:"init.sh", lines:[
        "# Step 1. git init — FastAPI 프로젝트에 Git 도입",
        "",
        "# (1) 프로젝트 폴더로 이동",
        "cd ~/projects/fastapi-todo",
        "",
        "# (2) 현재 폴더 상태 확인 — 아직 git 폴더 없음",
        "ls -la",
        "# drwxr-xr-x  app/",
        "# -rw-r--r--  main.py",
        "# -rw-r--r--  README.md",
        "",
        "# (3) git 저장소 초기화",
        "git init",
        "# Initialized empty Git repository in .git/",
        "",
        "# (4) 숨김 폴더 .git/ 이 생긴 것을 확인",
        "ls -la",
        "# drwxr-xr-x  .git/        ← 여기에 모든 이력 저장",
        "# drwxr-xr-x  app/",
        "# -rw-r--r--  main.py",
        "# -rw-r--r--  README.md",
        "",
        "# (5) .gitignore 작성 — Git이 무시할 파일 목록",
        "cat > .gitignore << EOF",
        "__pycache__/",
        "*.pyc",
        ".venv/",
        ".env",
        ".idea/",
        ".vscode/",
        "EOF",
        "",
        "# 핵심:",
        "#  • .git/ 은 절대 직접 건드리지 않는다",
        "#  • .env 같은 비밀 파일은 .gitignore 에 꼭 추가",
        "#  • 한 번만 init 하면 그 폴더는 영구 git 저장소",
      ]},
      addcommit: {lang:"bash", filename:"add-commit.sh", lines:[
        "# Step 2. git add + commit — 첫 세이브 포인트",
        "",
        "# (1) 작업 디렉토리에서 변경된 파일을 staging 으로",
        "git add main.py app/routers.py README.md .gitignore",
        "",
        "# 또는 전부 한 번에 (단, .gitignore에 걸리지 않은 것)",
        "git add .",
        "",
        "# (2) staging 상태 확인",
        "git status --short",
        "# A  .gitignore",
        "# A  README.md",
        "# A  app/routers.py",
        "# A  main.py",
        "#   ↑ A = Added to staging",
        "",
        "# (3) commit — 스테이징된 파일을 로컬 저장소에 영구 기록",
        "git commit -m \"feat: 프로젝트 스켈레톤 초기 설정\"",
        "# [main (root-commit) a1b2c3d] feat: 프로젝트 스켈레톤 초기 설정",
        "#  4 files changed, 87 insertions(+)",
        "",
        "# (4) 커밋 메시지 컨벤션 — 한눈에 종류 파악",
        "#   feat:  새 기능",
        "#   fix:   버그 수정",
        "#   docs:  문서만 변경",
        "#   refactor: 동작 그대로, 구조만 개선",
        "#   test:  테스트 추가/수정",
        "#   chore: 빌드/설정 등 기타",
        "",
        "# 핵심:",
        "#  • add 와 commit 은 분리되어 있다 (의도적 설계)",
        "#  • commit 메시지는 \"왜\" 를 적는다, \"무엇\" 은 diff 가 알려준다",
        "#  • 한 번에 한 가지 주제만 — 작게 자주 커밋",
      ]},
      statuslog: {lang:"bash", filename:"status-log.sh", lines:[
        "# Step 3. git status / log — 상태 확인과 이력 조회",
        "",
        "# ── git status : 현재 작업 디렉토리 + staging 상태",

    const S1 = { title:"Step 1. git init — 새 저장소 만들기", desc:"Git은 코드 변경 이력을 저장하는 도구. 비유하면 게임의 세이브 포인트 — 원하는 시점으로 돌아갈 수 있다. `git init` 한 번이면 현재 폴더가 Git 저장소가 된다. 숨김 폴더 `.git/`이 생기고 앞으로의 모든 변경 이력이 거기에 저장된다. 아직 파일은 어디에도 추적되고 있지 않다 — 작업 디렉토리에는 파일이 보이지만 Git이 보기엔 전부 untracked 상태다." };
    const S2 = { title:"Step 2. git add / commit — 세이브 포인트 찍기", desc:"파일을 저장소에 기록하려면 두 단계가 필요하다. `git add`로 스테이징 영역에 올리고(=세이브할 파일 선택), `git commit`으로 로컬 저장소에 영구 기록한다(=세이브 버튼). 이 두 단계 구조 덕분에 \"전부가 아니라 일부 파일만 깔끔하게 커밋\"이 가능하다. 커밋 메시지는 미래의 나에게 보내는 편지 — `feat:`, `fix:`, `docs:` 같은 prefix를 쓰면 한눈에 종류가 보인다." };
    const S3 = { title:"Step 3. git status / log — 현재 상태와 과거 확인", desc:"작업하다 보면 지금 무엇이 변경됐는지, 무엇이 staging에 올라가 있는지, 과거에 어떤 커밋이 있었는지 자주 확인해야 한다. `git status`는 현재 시점의 사진 — modified/staged/untracked를 색깔로 보여준다. `git log`는 과거 시점의 영상 — 커밋 hash, 메시지, 시간, 작성자가 시간순으로 나열된다. 이 두 명령은 가장 자주 쓰는 \"조회\" 명령이다." };
    const S4 = { title:"Step 4. git branch / checkout — 평행 우주 만들기", desc:"실험 코드를 main에 직접 쓰면 위험하다. `git branch`로 새 가지를 만들고 `git checkout`(또는 `git switch`)으로 그쪽으로 이동하면 평행 우주가 생긴다. main은 그대로 둔 채 feature/login 같은 가지에서 마음껏 실험하고, 잘 되면 main에 합치고(merge), 망하면 가지째 버리면 된다. 작업 단위마다 브랜치를 만드는 것이 실무 표준이다." };
    const S5 = { title:"Step 5. git remote / push — 원격 저장소로 백업", desc:"여기서 등장하는 것이 GitHub 같은 원격 저장소다. 노트북이 고장 나도, 다른 컴퓨터에서 작업하고 싶어도, 팀원과 공유하고 싶어도 — 모든 답은 원격 저장소다. `git remote add origin <URL>`로 원격을 연결하고, `git push`로 로컬의 커밋을 밀어 올린다. 이제 로컬 저장소(.git/)와 원격 저장소가 동기화되면서 진짜 협업이 시작된다. Git 워크플로우 5단계의 끝이자, 팀 개발의 시작점이다." };

        working: [{"name":"main.py","state":"tracked"},{"name":"app/routers.py","state":"tracked"},{"name":"app/auth.py","state":"tracked"},{"name":"README.md","state":"tracked"}],
        staging: [],
        localRepo: [{"hash":"a1b2c3d","msg":"feat: 프로젝트 스켈레톤 초기 설정","branch":"main"},{"hash":"d4e5f6g","msg":"feat: todos CRUD 라우터 추가","branch":"main"},{"hash":"h7i8j9k","msg":"fix: description nullable 처리 누락","branch":"main"},{"hash":"p3q4r5s","msg":"feat: JWT 로그인 엔드포인트 추가","branch":"main"}],
        remote: [{"hash":"a1b2c3d","msg":"feat: 프로젝트 스켈레톤 초기 설정"},{"hash":"d4e5f6g","msg":"feat: todos CRUD 라우터 추가"},{"hash":"h7i8j9k","msg":"fix: description nullable 처리 누락"},{"hash":"p3q4r5s","msg":"feat: JWT 로그인 엔드포인트 추가"}],
        branchInfo: {"current":"main","head":"p3q4r5s","remote":"origin/main"},
        keyPoint: "clone = init + remote add + pull 을 한 번에.",
        code:{...CODE.push, highlight:[32,33,34,35]},
      },
      { ...S5,
        beat:{ label:"pull — 내려받기", at:"push.sh L37–39",
               caption:"팀원이 push 한 변경은 git pull 로 내 로컬에 동기화한다. 협업 사이클이 완성됐다.",
               changes:[{mark:"read", text:"원격 → 로컬 동기화"}] },
        working: [{"name":"main.py","state":"tracked"},{"name":"app/routers.py","state":"tracked"},{"name":"app/auth.py","state":"tracked"},{"name":"README.md","state":"tracked"}],
        staging: [],
        localRepo: [{"hash":"a1b2c3d","msg":"feat: 프로젝트 스켈레톤 초기 설정","branch":"main"},{"hash":"d4e5f6g","msg":"feat: todos CRUD 라우터 추가","branch":"main"},{"hash":"h7i8j9k","msg":"fix: description nullable 처리 누락","branch":"main"},{"hash":"p3q4r5s","msg":"feat: JWT 로그인 엔드포인트 추가","branch":"main"}],
        remote: [{"hash":"a1b2c3d","msg":"feat: 프로젝트 스켈레톤 초기 설정"},{"hash":"d4e5f6g","msg":"feat: todos CRUD 라우터 추가"},{"hash":"h7i8j9k","msg":"fix: description nullable 처리 누락"},{"hash":"p3q4r5s","msg":"feat: JWT 로그인 엔드포인트 추가"}],
        branchInfo: {"current":"main","head":"p3q4r5s","remote":"origin/main"},
        keyPoint: "push 와 pull 이 협업의 양방향 통로다.",
        code:{...CODE.push, highlight:[37,38,39]},
      },
      { ...S5,
        beat:{ label:"5단계 흐름 정리", at:"push.sh L41–46",
               caption:"init → add → commit → branch → push. 그리고 .env 는 절대 push 하지 않는다.",
               changes:[{mark:"read", text:"세팅→선택→저장→분기→공유"}] },
        working: [{"name":"main.py","state":"tracked"},{"name":"app/routers.py","state":"tracked"},{"name":"app/auth.py","state":"tracked"},{"name":"README.md","state":"tracked"}],
        staging: [],
        localRepo: [{"hash":"a1b2c3d","msg":"feat: 프로젝트 스켈레톤 초기 설정","branch":"main"},{"hash":"d4e5f6g","msg":"feat: todos CRUD 라우터 추가","branch":"main"},{"hash":"h7i8j9k","msg":"fix: description nullable 처리 누락","branch":"main"},{"hash":"p3q4r5s","msg":"feat: JWT 로그인 엔드포인트 추가","branch":"main"}],
        remote: [{"hash":"a1b2c3d","msg":"feat: 프로젝트 스켈레톤 초기 설정"},{"hash":"d4e5f6g","msg":"feat: todos CRUD 라우터 추가"},{"hash":"h7i8j9k","msg":"fix: description nullable 처리 누락"},{"hash":"p3q4r5s","msg":"feat: JWT 로그인 엔드포인트 추가"}],
        branchInfo: {"current":"main","head":"p3q4r5s","remote":"origin/main"},
        keyPoint: "push = 로컬을 원격에 동기화. 노트북 고장 대비 + 팀 협업의 출발점.",
        code:{...CODE.push, highlight:[41,42,43,44,45,46]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — indigo 톤
    //   작업 디렉토리 → staging → local repo → remote 4영역
    // ─────────────────────────────────────────────────────
    const STATE_STYLE = {
      tracked:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800', label: 'tracked' },
      modified:  { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-800',   label: 'modified' },
      untracked: { bg: 'bg-slate-100',  border: 'border-slate-300',   text: 'text-slate-700',   label: 'untracked' },
    };

    function FileCard({ file }) {
      const s = STATE_STYLE[file.state] || STATE_STYLE.untracked;
      return (
        <div className={`rounded-md border ${s.bg} ${s.border} px-2 py-1 flex items-center justify-between text-xs`}>
          <span className={`font-mono ${s.text}`}>{file.name}</span>
          <span className={`text-[9px] px-1.5 py-0.5 rounded ${s.bg} ${s.text} border ${s.border}`}>{s.label}</span>
        </div>
      );
    }

    function StagingCard({ file }) {
      return (
        <div className="rounded-md border border-indigo-300 bg-indigo-50 px-2 py-1 flex items-center justify-between text-xs">
          <span className="font-mono text-indigo-800">{file.name}</span>
          <span className="text-[9px] px-1.5 py-0.5 rounded bg-indigo-200 text-indigo-800">staged</span>
        </div>
      );
    }

    function CommitCard({ commit, isRemote }) {
      const isFeat = commit.msg.startsWith('feat');
      const isFix = commit.msg.startsWith('fix');
      const isDocs = commit.msg.startsWith('docs');
      const tagBg = isFeat ? 'bg-emerald-100 text-emerald-800'
                  : isFix  ? 'bg-amber-100 text-amber-800'
                  : isDocs ? 'bg-sky-100 text-sky-800'
                           : 'bg-slate-100 text-slate-700';
      const branchTag = commit.branch && commit.branch !== 'main';
      return (
        <div className={`rounded-md border ${isRemote ? 'border-violet-300 bg-violet-50' : 'border-indigo-200 bg-white'} px-2 py-1 text-xs`}>
          <div className="flex items-center gap-2">
            <span className="font-mono text-[10px] text-slate-500">{commit.hash}</span>
            {branchTag && (
              <span className="text-[9px] px-1.5 py-0.5 rounded bg-violet-100 text-violet-800 border border-violet-200">{commit.branch}</span>
            )}
            <span className={`text-[9px] px-1.5 py-0.5 rounded ${tagBg} ml-auto`}>
              {commit.msg.split(':')[0]}
            </span>
          </div>
          <div className="mt-0.5 text-[11px] text-slate-700 truncate">{commit.msg.split(':').slice(1).join(':').trim()}</div>
        </div>
      );
    }

    function Zone({ title, subtitle, children, accent }) {
      const accentMap = {
        slate:  'border-slate-300  bg-slate-50',
        indigo: 'border-indigo-300 bg-indigo-50/40',
        sky:    'border-sky-300    bg-sky-50/40',
        violet: 'border-violet-300 bg-violet-50/40',
      };
      const titleColorMap = {
        slate:  'text-slate-700',
        indigo: 'text-indigo-800',
        sky:    'text-sky-800',
        violet: 'text-violet-800',
      };
      return (
        <div className={`rounded-lg border ${accentMap[accent]} p-2`}>
          <div className="flex items-center justify-between mb-1.5">
            <span className={`text-[11px] font-bold ${titleColorMap[accent]}`}>{title}</span>
            <span className="text-[9px] text-slate-500">{subtitle}</span>
          </div>
          <div className="space-y-1">{children}</div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-indigo-200 bg-white p-4 h-full flex flex-col">
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-800">Git 워크플로우 — 4영역 추적</h3>
            <span className="text-[10px] text-slate-500">현재 브랜치: <b className="text-indigo-700">{state.branchInfo.current}</b> @ <span className="font-mono">{state.branchInfo.head}</span></span>
          </div>

          {/* 작업 디렉토리 */}
          <Zone title="① 작업 디렉토리 (working tree)" subtitle="내 PC 의 파일" accent="slate">
            {state.working.length === 0
              ? <div className="text-[10px] text-slate-400 italic px-1">파일 없음</div>
              : state.working.map((f, i) => <FileCard key={i} file={f} />)}
          </Zone>

          {/* 화살표 */}
          <div className="text-center text-[10px] font-bold text-indigo-600 py-1">↓ git add ↓</div>

          {/* 스테이징 */}
          <Zone title="② 스테이징 영역 (staging)" subtitle="다음 커밋 대기" accent="indigo">
            {state.staging.length === 0
              ? <div className="text-[10px] text-slate-400 italic px-1">비어 있음</div>
              : state.staging.map((f, i) => <StagingCard key={i} file={f} />)}
          </Zone>

          {/* 화살표 */}
          <div className="text-center text-[10px] font-bold text-indigo-600 py-1">↓ git commit ↓</div>

          {/* 로컬 저장소 */}
          <Zone title="③ 로컬 저장소 (.git/)" subtitle="내 PC 의 이력" accent="sky">
            {state.localRepo.length === 0
              ? <div className="text-[10px] text-slate-400 italic px-1">커밋 없음</div>
              : state.localRepo.map((c, i) => <CommitCard key={i} commit={c} isRemote={false} />)}
          </Zone>

          {/* 화살표 */}
          <div className="text-center text-[10px] font-bold text-indigo-600 py-1">↓ git push ↓</div>

          {/* 원격 저장소 */}
          <Zone title="④ 원격 저장소 (GitHub)" subtitle="팀의 이력" accent="violet">
            {state.remote.length === 0
              ? <div className="text-[10px] text-slate-400 italic px-1">아직 push 안 함</div>
              : state.remote.map((c, i) => <CommitCard key={i} commit={c} isRemote={true} />)}
          </Zone>

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-500/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">VI</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">Chapter VI-3-2. Git 버전 관리 첫걸음</h1>
                <p className="text-sm text-indigo-800/80">init → add/commit → status/log → branch → push. 5단계로 추적</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-600' : 'bg-indigo-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-indigo-700 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-700 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                init → add/commit → status/log → branch → push 의 5단계가 Git 일상 워크플로우다. 작업 디렉토리 → 스테이징 → 로컬 저장소 → 원격 저장소의 4영역을 머릿속에 그리면 어떤 명령이 어디를 바꾸는지 즉시 보인다. .env 같은 비밀 파일은 절대 push 하지 말고 .gitignore 에 꼭 등록한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['git init', 'git add', 'git commit', 'git status', 'git log', 'git branch', 'git checkout', 'git push', '.gitignore', 'GitHub'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-700">
              <a href="./chapter-06-07-erd.html" className="underline hover:no-underline">← 이전: VI-3-1 ERD 그리기</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
