  <title>FastAPI 인터랙티브 학습 — Chapter 3-3. JWT 인증</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔐</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    FastAPI Chapter 3-3 — JWT 인증
    학습 목표: 로그인 → access_token 발급 → JWT 구조 이해 → Authorization 헤더 →
              verify_token Depends → exp 만료 처리. 5단계로 JWT 인증 흐름을 추적한다.
    핵심 비유: 놀이공원 입장 팔찌 — 매표소에서 받은 팔찌 하나로 모든 놀이기구를 탄다
    패턴: fastapi v1 — 좌(LiveDataPane: 인증 흐름 시뮬레이션) / 우(VSCode CodeViewer 5탭)
    색상: indigo (auth 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 로그인 → 토큰 → 구조 → 헤더 → 검증 → 만료
    //   pane      : 좌측 LiveDataPane 에 표시할 인증 흐름 상태
    //   actors    : 클라이언트/서버 박스 옆에 띄울 이벤트 카드
    //   token     : JWT 토큰 상태 (issued, payload, expired)
    //   request   : HTTP 요청/응답 카드
    //   verdict   : 인증 결과 (✅ 통과 / ❌ 차단)
    //   code      : 우측 CodeViewer 파일 (lang, filename, lines, highlight)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      login: {lang:"python", filename:"login.py", lines:[
        "\"\"\"",
        "login.py — 로그인 엔드포인트",
        "",
        "아이디/비밀번호를 검증하고 JWT access_token 을 발급한다.",
        "\"\"\"",
        "from datetime import datetime, timedelta",
        "from fastapi import APIRouter, HTTPException",
        "from jose import jwt",
        "from pydantic import BaseModel",
        "import os",
        "import bcrypt",
        "",
        "router = APIRouter()",
        "",
        "SECRET_KEY = os.getenv(\"JWT_SECRET\")  # .env 에서 로드",
        "ALGORITHM = \"HS256\"",
        "ACCESS_TOKEN_EXPIRE_MINUTES = 30",
        "",
        "",
        "class LoginRequest(BaseModel):",
        "    \"\"\"로그인 요청 스키마\"\"\"",
        "    username: str",
        "    password: str",
        "",
        "",
        "class TokenResponse(BaseModel):",
        "    \"\"\"토큰 응답 스키마 (OAuth2 표준 형식)\"\"\"",
        "    access_token: str",
        "    token_type: str = \"bearer\"",
        "",
        "",
        "def create_access_token(sub: str) -> str:",
        "    \"\"\"JWT access_token 발급",
        "",
        "    Args:",
        "        sub: 토큰 주체 (보통 user_id 또는 username)",
        "    Returns:",
        "        서명된 JWT 문자열",
        "    \"\"\"",
        "    expire = datetime.utcnow() + timedelta(",
        "        minutes=ACCESS_TOKEN_EXPIRE_MINUTES",
        "    )",
        "    payload = {\"sub\": sub, \"exp\": expire}",
        "    return jwt.encode(payload, SECRET_KEY, algorithm=ALGORITHM)",
        "",
        "",
        "@router.post(\"/login\", response_model=TokenResponse)",
        "def login(body: LoginRequest):",
        "    # 1. 사용자 조회 (DB 에서 username 으로)",
        "    user = find_user_by_username(body.username)",
        "    if not user:",
        "        raise HTTPException(401, \"잘못된 자격 증명\")",
        "",
        "    # 2. 비밀번호 검증 (bcrypt 해시 비교)",
        "    if not bcrypt.checkpw(",
        "        body.password.encode(), user.password_hash",
        "    ):",
        "        raise HTTPException(401, \"잘못된 자격 증명\")",
        "",
        "    # 3. 토큰 발급",
        "    token = create_access_token(sub=user.username)",
        "    return TokenResponse(access_token=token)",
      ]},
      struct: {lang:"markdown", filename:"jwt-struct.md", lines:[
        "# JWT 구조 — header.payload.signature",
        "",
        "## 한 줄 요약",
        "",
        "JWT 는 점(.) 으로 구분된 **세 덩어리** 의 Base64URL 문자열이다.",
        "",
        "```",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9   ← header",
        ".",
        "eyJzdWIiOiJhbGljZSIsImV4cCI6MTc0NzcwMDAwMH0   ← payload",
        ".",
        "a1b2c3d4e5f6...   ← signature",
        "```",
        "",
        "## 1) Header — 어떤 알고리즘으로 서명했는가",
        "",
        "```json",
        "{",
        "  \"alg\": \"HS256\",",
        "  \"typ\": \"JWT\"",
        "}",
        "```",
        "",
        "- `alg`: 서명 알고리즘 (HS256, RS256 등)",
        "- `typ`: 토큰 타입 (항상 \"JWT\")",
        "",

      verify: {lang:"python", filename:"verify.py", lines:[
        "\"\"\"",
        "verify.py — JWT 검증 의존성",
        "",
        "FastAPI 라우터에 Depends(verify_token) 으로 꽂으면",
        "자동으로 토큰을 추출/검증/디코딩해서 user 정보를 주입한다.",
        "\"\"\"",
        "from fastapi import Depends, HTTPException, status",
        "from fastapi.security import OAuth2PasswordBearer",
        "from jose import jwt, JWTError",
        "import os",
        "",
        "SECRET_KEY = os.getenv(\"JWT_SECRET\")",
        "ALGORITHM = \"HS256\"",
        "",
        "# OAuth2PasswordBearer 가 Authorization 헤더에서",
        "# \"Bearer <token>\" 형식을 자동 파싱해서 token 만 꺼내준다.",
        "oauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"login\")",
        "",
        "",
        "def verify_token(token: str = Depends(oauth2_scheme)) -> str:",
        "    \"\"\"JWT 토큰 검증 의존성",
        "",
        "    Args:",
        "        token: Authorization 헤더에서 자동 추출된 JWT 문자열",
        "    Returns:",
        "        토큰의 sub 값 (보통 username)",
        "    Raises:",
        "        HTTPException 401: 토큰이 없거나 서명/형식이 잘못된 경우",
        "    \"\"\"",
        "    credentials_exception = HTTPException(",
        "        status_code=status.HTTP_401_UNAUTHORIZED,",
        "        detail=\"자격 증명을 검증할 수 없습니다\",",
        "        headers={\"WWW-Authenticate\": \"Bearer\"},",
        "    )",
        "",
        "    try:",
        "        # 1. 서명 검증 + payload 디코딩",
        "        payload = jwt.decode(",
        "            token, SECRET_KEY, algorithms=[ALGORITHM]",
        "        )",
        "        # 2. sub 클레임 추출",
        "        username: str | None = payload.get(\"sub\")",
        "        if username is None:",
        "            raise credentials_exception",
        "        return username",
        "    except JWTError:",
        "        # 서명 불일치 / 만료 / 형식 오류 모두 여기서 잡힘",
        "        raise credentials_exception",
        "",
        "",
        "# ─── 라우터에서 사용 ───",
        "from fastapi import APIRouter",
        "",
        "router = APIRouter()",
        "",
        "",
        "@router.get(\"/me\")",
        "def get_me(username: str = Depends(verify_token)):",
        "    \"\"\"보호된 엔드포인트 — 토큰이 유효해야 호출 가능\"\"\"",
        "    # 여기까지 도달했다면 검증 통과 상태",
        "    return {\"username\": username}",
      ]},
      expiry: {lang:"python", filename:"expiry.py", lines:[
        "\"\"\"",
        "expiry.py — JWT 만료 처리",
        "",
        "exp 클레임으로 토큰 수명을 제한하고,",
        "만료된 토큰은 401 로 응답한다.",
        "\"\"\"",
        "from datetime import datetime, timedelta",
        "from fastapi import Depends, HTTPException, status",
        "from fastapi.security import OAuth2PasswordBearer",
        "from jose import jwt, JWTError, ExpiredSignatureError",
        "import os",
        "",
        "SECRET_KEY = os.getenv(\"JWT_SECRET\")",
        "ALGORITHM = \"HS256\"",
        "ACCESS_TOKEN_EXPIRE_MINUTES = 30  # 짧게 유지하는 게 정석",
        "",
        "oauth2_scheme = OAuth2PasswordBearer(tokenUrl=\"login\")",
        "",
        "",
        "def create_access_token(sub: str) -> str:",
        "    \"\"\"exp 클레임을 포함해서 토큰 발급",
        "",
        "    datetime.utcnow() + timedelta 로 만료 시각을 정한다.",
        "    jose 가 자동으로 datetime → epoch 정수로 변환한다.",
        "    \"\"\"",
        "    expire = datetime.utcnow() + timedelta(",
        "        minutes=ACCESS_TOKEN_EXPIRE_MINUTES",
        "    )",
        "    payload = {",
        "        \"sub\": sub,",
        "        \"exp\": expire,         # 만료 시각",
        "        \"iat\": datetime.utcnow(),  # 발급 시각",
        "    }",
        "    return jwt.encode(payload, SECRET_KEY, algorithm=ALGORITHM)",
        "",
        "",
        "def verify_token(token: str = Depends(oauth2_scheme)) -> str:",
        "    \"\"\"만료 케이스를 명시적으로 구분해 응답 메시지를 다르게 준다\"\"\"",
        "    try:",
        "        payload = jwt.decode(",
        "            token, SECRET_KEY, algorithms=[ALGORITHM]",
        "        )",
        "        return payload[\"sub\"]",
        "",
        "    except ExpiredSignatureError:",
        "        # 만료된 경우 — 클라이언트에게 명확히 알린다",
        "        raise HTTPException(",
        "            status_code=status.HTTP_401_UNAUTHORIZED,",
        "            detail=\"토큰이 만료되었습니다. 다시 로그인하세요.\",",
        "            headers={\"WWW-Authenticate\": \"Bearer\"},",
        "        )",
        "",
        "    except JWTError:",
        "        # 서명 불일치 / 형식 오류",
        "        raise HTTPException(",
        "            status_code=status.HTTP_401_UNAUTHORIZED,",
        "            detail=\"유효하지 않은 토큰입니다.\",",
        "            headers={\"WWW-Authenticate\": \"Bearer\"},",
        "        )",
        "",
        "",
        "# ─── 운영 정석 ───",
        "#  • access_token: 짧게 (15~30분)",
        "#  • refresh_token: 길게 (7~30일), 별도 저장",
        "#  • 만료 시 클라이언트가 refresh_token 으로 새 access_token 요청",
        "#  • 로그아웃 = refresh_token 폐기 (블랙리스트 또는 DB 삭제)",
      ]},
    };

    const S1 = { title:"Step 1. 로그인 — access_token 발급", desc:"사용자가 아이디/비밀번호로 로그인 요청을 보낸다. 서버는 비밀번호를 검증하고, 통과하면 \"access_token\" 이라는 종이쪽지를 만들어서 응답한다. 이 종이쪽지가 바로 JWT 다. 비유하자면 놀이공원 매표소에서 신분증을 보여주고 입장 팔찌를 받는 순간이다. 이 팔찌 하나만 있으면 모든 놀이기구에서 신분증을 다시 보여줄 필요가 없다." };
    const S2 = { title:"Step 2. JWT 구조 — header.payload.signature", desc:"JWT 는 점(.) 으로 구분된 세 덩어리다. eyJhbGc...(header).eyJzdWI...(payload).a1b2c3...(signature). 헤더는 알고리즘 정보, 페이로드는 실제 데이터(누구/언제까지), 시그니처는 서버만 만들 수 있는 도장이다. 페이로드는 Base64 디코딩하면 누구나 읽을 수 있다 — 그래서 비밀번호 같은 건 넣으면 절대 안 된다. 시그니처는 위조 방지용이지 내용 숨김용이 아니다." };
    const S3 = { title:"Step 3. Authorization: Bearer — 토큰을 헤더에 실어 보낸다", desc:"클라이언트는 보호된 API 를 호출할 때마다 토큰을 헤더에 담아 보낸다. 형식은 정해져 있다: \"Authorization: Bearer eyJhbGc...\" 의 형태. \"Bearer\" 는 \"이 토큰의 소지자(bearer)에게 권한을 인정한다\" 라는 의미다. 즉, 팔찌를 차고 있는 사람은 모두 같은 사람으로 인정한다. 그래서 토큰이 유출되면 곧바로 도용된다 — HTTPS 가 필수인 이유다." };

          "ok": true,
          "text": "토큰 수명 30분 — 짧게 유지하는 게 정석"
        },
        keyPoint: "만료를 구분해서 처리하려면 ExpiredSignatureError 를 따로 잡아야 한다.",
        code:{...CODE.expiry, highlight:[10,11,12,13,14,15]},
      },
      { ...S5,
        beat:{
          label:"exp 를 넣어 발급",
          at:"expiry.py L29–34",
          caption:"payload 에 exp(만료 시각)와 iat(발급 시각)를 담는다. jose 가 datetime 을 epoch 로 바꿔준다.",
          changes:[
            {mark:"new", text:"exp / iat 클레임"},
            {mark:"changed", text:"토큰에 수명이 새겨짐"},
          ],
        },
        actors: [
          {
            "side": "server",
            "label": "토큰 발급",
            "detail": "sub=alice, exp=now+30min, iat=now",
            "kind": "issue"
          }
        ],
        verdict: {
          "ok": true,
          "text": "팔찌에 유효 시간이 인쇄된다"
        },
        keyPoint: "exp 는 발급 순간 토큰 안에 굳는다 — 나중에 서버가 연장할 수 없다.",
        code:{...CODE.expiry, highlight:[29,30,31,32,33,34]},
      },
      { ...S5,
        beat:{
          label:"유효 기간 안: 통과",
          at:"expiry.py L39–43",
          caption:"jwt.decode 는 exp 를 자동 확인한다. 아직 유효하면 sub 를 돌려주고 요청이 진행된다.",
          changes:[
            {mark:"read", text:"decode 가 exp 자동 확인"},
          ],
        },
        actors: [
          {
            "side": "client",
            "label": "GET /me",
            "detail": "발급 5분 후 — 아직 유효",
            "kind": "request"
          },
          {
            "side": "server",
            "label": "jwt.decode() 검증",
            "detail": "exp > 현재시각 → 통과",
            "kind": "check"
          }
        ],
        verdict: {
          "ok": true,
          "text": "유효 기간 안 — 정상 처리"
        },
        keyPoint: "exp 확인은 decode 에 내장돼 있다 — 직접 비교 코드를 쓸 필요가 없다.",
        code:{...CODE.expiry, highlight:[39,40,41,42,43]},
      },
      { ...S5,
        beat:{
          label:"만료: 명확히 알린다",
          at:"expiry.py L45–51",
          caption:"ExpiredSignatureError 를 먼저 잡아 \"만료되었습니다, 다시 로그인하세요\" 로 구분 응답한다.",
          changes:[
            {mark:"changed", text:"만료 → 전용 401 메시지"},
            {mark:"gone", text:"만료 토큰의 접근"},
          ],
        },
        actors: [
          {
            "side": "client",
            "label": "GET /me 재호출",
            "detail": "30분 후 같은 토큰 사용",
            "kind": "request"
          },
          {
            "side": "server",
            "label": "ExpiredSignatureError",
            "detail": "exp < 현재시각 → 만료 401",
            "kind": "reject"
          }
        ],
        verdict: {
          "ok": false,
          "text": "만료 — \"다시 로그인하세요\" 안내"
        },
        keyPoint: "만료는 사용자 잘못이 아니다 — 재로그인 경로를 명확히 알려주는 게 좋은 UX.",
        code:{...CODE.expiry, highlight:[45,46,47,48,49,50,51]},
      },
      { ...S5,
        beat:{
          label:"그 외 오류는 별도 401",
          at:"expiry.py L53–59",
          caption:"만료가 아닌 서명 불일치·형식 오류는 JWTError 로 잡아 \"유효하지 않은 토큰\" 으로 응답한다.",
          changes:[
            {mark:"read", text:"JWTError → 유효하지 않은 토큰"},
          ],
        },
        actors: [
          {
            "side": "server",
            "label": "JWTError 포착",
            "detail": "서명 불일치 / 형식 오류",
            "kind": "reject"
          },
          {
            "side": "client",
            "label": "응답 401",
            "detail": "{\"detail\":\"유효하지 않은 토큰입니다.\"}",
            "kind": "response-fail"
          }
        ],
        verdict: {
          "ok": false,
          "text": "위조·손상 토큰 — 만료와 다른 메시지로 구분"
        },
        keyPoint: "만료와 위조를 구분해 주면 클라이언트가 올바르게 대응(재로그인 vs 오류 처리)할 수 있다.",
        code:{...CODE.expiry, highlight:[53,54,55,56,57,58,59]},
      },
      { ...S5,
        beat:{
          label:"운영 정석: refresh 조합",
          at:"expiry.py L62–66",
          caption:"access 는 짧게(15~30분), refresh 는 길게(7~30일). 만료 시 refresh 로 재발급, 로그아웃은 refresh 폐기.",
          changes:[
            {mark:"read", text:"access 짧게 + refresh 길게"},
            {mark:"gone", text:"만료 없는 영구 토큰"},
          ],
        },
        actors: [
          {
            "side": "client",
            "label": "GET /me 재호출",
            "detail": "30분 후 같은 토큰 사용",
            "kind": "request"
          },
          {
            "side": "server",
            "label": "jwt.decode() 검증",
            "detail": "exp=1747700000 < 현재시각 → 만료",
            "kind": "reject"
          },
          {
            "side": "server",
            "label": "ExpiredSignatureError",
            "detail": "JWTError 의 하위 클래스",
            "kind": "reject"
          },
          {
            "side": "client",
            "label": "응답 401",
            "detail": "{\"detail\":\"토큰이 만료되었습니다\"}",
            "kind": "response-fail"
          }
        ],
        verdict: {
          "ok": false,
          "text": "차단 — 다시 /login 으로 새 토큰 발급받아야 함"
        },
        keyPoint: "exp 가 인증 시스템의 안전망. 토큰 유출돼도 시간이 지나면 자동 무효화된다.",
        code:{...CODE.expiry, highlight:[62,63,64,65,66]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — indigo 톤
    // ─────────────────────────────────────────────────────
    const KIND_STYLE = {
      request:       { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-800',  badge: 'bg-indigo-200 text-indigo-800',  icon: '→' },
      response:      { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800', icon: '←' },
      'response-fail': { bg: 'bg-rose-50',  border: 'border-rose-300',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800',       icon: '✕' },
      check:         { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-800',  badge: 'bg-violet-200 text-violet-800',   icon: '◎' },
      issue:         { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-800',     badge: 'bg-sky-200 text-sky-800',         icon: '✦' },
      reject:        { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800',       icon: '⛔' },
      'jwt-header':  { bg: 'bg-indigo-50',  border: 'border-indigo-400',  text: 'text-indigo-900',  badge: 'bg-indigo-200 text-indigo-900',   icon: '①' },
      'jwt-payload': { bg: 'bg-fuchsia-50', border: 'border-fuchsia-400', text: 'text-fuchsia-900', badge: 'bg-fuchsia-200 text-fuchsia-900', icon: '②' },
      'jwt-sig':     { bg: 'bg-amber-50',   border: 'border-amber-400',   text: 'text-amber-900',   badge: 'bg-amber-200 text-amber-900',     icon: '③' },
      'http-header': { bg: 'bg-slate-50',   border: 'border-slate-300',   text: 'text-slate-700',   badge: 'bg-slate-200 text-slate-700',     icon: '⚑' },
    };

    const SIDE_LABEL = {
      client: '클라이언트',
      server: '서버',
      token:  'JWT 토큰',
      header: 'HTTP 헤더',
    };

    function ActorCard({ item }) {
      const s = KIND_STYLE[item.kind] || KIND_STYLE.check;
      return (
        <div className={`rounded-lg border ${s.bg} ${s.border} px-3 py-2`}>
          <div className="flex items-center justify-between mb-1">
            <div className="flex items-center gap-2">
              <span className={`text-sm ${s.text}`}>{s.icon}</span>
              <span className={`text-xs font-bold ${s.text}`}>{item.label}</span>
            </div>
            <span className={`text-[10px] px-2 py-0.5 rounded ${s.badge}`}>{SIDE_LABEL[item.side] || item.side}</span>
          </div>
          <div className={`text-[11px] font-mono ${s.text} break-all leading-snug`}>
            {item.detail}
          </div>
        </div>
      );
    }

    function VerdictBox({ verdict }) {
      if (!verdict) return null;
      const ok = verdict.ok;
      return (
        <div
          className={`mt-3 rounded-lg border-2 p-3 flex items-start gap-2 ${
            ok ? 'border-emerald-400 bg-emerald-50' : 'border-rose-400 bg-rose-50'
          }`}
        >
          <span className="text-xl leading-none">{ok ? '✅' : '❌'}</span>
          <div className={`text-sm font-bold ${ok ? 'text-emerald-900' : 'text-rose-900'}`}>
            {verdict.text}
          </div>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      return (
        <div className="rounded-xl border border-indigo-200 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-800">JWT 인증 흐름 시뮬레이션</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 메시지 흐름</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="space-y-2">
            {state.actors.map((it, i) => (
              <ActorCard key={i} item={it} />
            ))}
          </div>
          <VerdictBox verdict={state.verdict} />
          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-500/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">🔐</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">Chapter 3-3. JWT 인증</h1>
                <p className="text-sm text-indigo-800/80">로그인 → 토큰 발급 → 헤더 전송 → 검증 → 만료. 5단계로 추적</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-600' : 'bg-indigo-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-indigo-700 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-700 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                로그인 → access_token 발급 → JWT 구조 이해 → Authorization: Bearer 헤더 → verify_token Depends → exp 만료 자동 처리. 이 5단계가 JWT 인증의 전부다. 실무에서는 access_token + refresh_token 조합으로 보안과 사용성을 동시에 잡는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['JWT', 'access_token', 'OAuth2PasswordBearer', 'Authorization', 'Bearer', 'Depends', 'verify_token', 'exp', 'jose', 'HS256'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./chapter-03-04.html" className="underline hover:no-underline">다음 챕터 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
