  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!--
    FastAPI Chapter IV-4-18 — RequestValidationError 커스터마이즈
    학습 목표: FastAPI 기본 422 응답을 가로채서 한국어 메시지, 필드별 상세, 프론트 친화 포맷으로 변환
    핵심 비유: "에러 메시지 통역사" — 영어 Pydantic 메시지를 한국어 + UX 친화 JSON 으로 다시 쓴다
    패턴: fastapi v1 — 좌(LiveDataPane: 422 응답 표준→커스텀 변환) / 우(VSCode CodeViewer 5탭)
    색상: indigo (validation 에러 커스터마이즈 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 5단계: 기본 422 → 핸들러 → 한글화 → 필드 상세 → 프론트 포맷
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      defaultResp: {lang:"python", filename:"default.py", lines:[
        "\"\"\"default.py — 핸들러 미등록 시 FastAPI 기본 422 응답 확인.\"\"\"",
        "",
        "from fastapi import FastAPI",
        "from pydantic import BaseModel, Field",
        "",
        "app = FastAPI()",
        "",
        "class ProductIn(BaseModel):",
        "    \"\"\"상품 등록 요청 — Pydantic 검증 규칙 3개.\"\"\"",
        "    name: str = Field(min_length=1, description=\"상품명\")",
        "    price: float = Field(gt=0, description=\"0 초과\")",
        "    stock: int = Field(ge=0, description=\"0 이상\")",
        "",
        "@app.post(\"/products\")",
        "def create_product(product: ProductIn):",
        "    \"\"\"검증 통과 시에만 실행. 실패 시 FastAPI 가 422 자동 응답.\"\"\"",
        "    return {\"ok\": True, \"product\": product.model_dump()}",
        "",
        "# 잘못된 요청 예시:",
        "#   POST /products  {\"name\": \"\", \"price\": -5, \"stock\": \"abc\"}",
        "#",
        "# FastAPI 가 자동으로 돌려주는 응답:",
        "#   HTTP/1.1 422 Unprocessable Entity",
        "#   { \"detail\": [ {\"loc\": [\"body\",\"price\"], \"msg\": \"...\",",
        "#                   \"type\": \"greater_than\", \"input\": -5}, ... ] }",
        "#",
        "# 문제점:",
        "#  1) 메시지가 영어다 — 사용자에게 보여주려면 번역이 필요",
        "#  2) detail 배열이라 프론트에서 필드별로 꺼내기 번거롭다",
        "#  3) type 이 Pydantic 내부 코드라 사용자에게 의미가 없다",
        "#",
        "# → 다음 단계: RequestValidationError 핸들러로 가로채자",
      ]},
      handler: {lang:"python", filename:"handler.py", lines:[
        "\"\"\"handler.py — 422 응답 봉투를 success/code/errors 로 통일.\"\"\"",
        "",
        "from fastapi import FastAPI, Request",
        "from fastapi.exceptions import RequestValidationError",
        "from fastapi.responses import JSONResponse",
        "from pydantic import BaseModel, Field",
        "",
        "app = FastAPI()",
        "",
        "class ProductIn(BaseModel):",
        "    name: str = Field(min_length=1)",
        "    price: float = Field(gt=0)",
        "    stock: int = Field(ge=0)",
        "",
        "@app.exception_handler(RequestValidationError)",
        "async def validation_handler(request: Request, exc: RequestValidationError):",
        "    \"\"\"검증 실패를 가로채 봉투(envelope) 형태로 변환.\"\"\"",
        "    errors = []",
        "    for err in exc.errors():",
        "        # err = {\"loc\": (..), \"msg\": \"..\", \"type\": \"..\", \"input\": ..}",
        "        field_path = \".\".join(str(p) for p in err[\"loc\"])",
        "        errors.append({\"field\": field_path, \"message\": err[\"msg\"]})",
        "    return JSONResponse(",
        "        status_code=422,",
        "        content={",
        "            \"success\": False,",
        "            \"code\": \"VALIDATION_FAILED\",",
        "            \"errors\": errors,",
        "        },",
        "    )",
        "",
        "@app.post(\"/products\")",
        "def create_product(product: ProductIn):",
        "    return {\"ok\": True, \"product\": product.model_dump()}",
        "",
        "# 변경점:",
        "#  • detail(배열) → errors(배열) 로 키 이름 명확화",
        "#  • loc(튜플) → field(점 표기) 로 평탄화 — 프론트가 즉시 사용",
        "#  • success/code 추가 — 다른 비즈니스 에러와 봉투 통일",
        "# → 다음 단계: message 를 한국어로 번역하자",
      ]},
      korean: {lang:"python", filename:"korean.py", lines:[
        "\"\"\"korean.py — Pydantic type 코드를 한국어 문장으로 매핑.\"\"\"",
        "",
        "from fastapi import FastAPI, Request",
        "from fastapi.exceptions import RequestValidationError",
        "from fastapi.responses import JSONResponse",
        "",
        "# 한국어 메시지 템플릿 — {ctx_key} 자리는 ctx 값으로 치환",
        "MESSAGES: dict[str, str] = {",
        "    \"missing\":            \"필수 항목입니다.\",",
        "    \"string_too_short\":   \"{min_length}자 이상 입력해 주세요.\",",
        "    \"string_too_long\":    \"{max_length}자 이하로 입력해 주세요.\",",
        "    \"greater_than\":       \"{gt} 보다 큰 값을 입력해 주세요.\",",
        "    \"greater_than_equal\": \"{ge} 이상의 값을 입력해 주세요.\",",
        "    \"less_than\":          \"{lt} 보다 작은 값을 입력해 주세요.\",",
        "    \"less_than_equal\":    \"{le} 이하의 값을 입력해 주세요.\",",
        "    \"int_parsing\":        \"정수만 입력할 수 있습니다.\",",
        "    \"float_parsing\":      \"숫자만 입력할 수 있습니다.\",",
        "    \"value_error\":        \"값이 올바르지 않습니다.\",",
        "    \"enum\":               \"허용된 값 중에서 선택해 주세요.\",",
        "}",
        "FALLBACK = \"올바르지 않은 값입니다.\"",
        "",
        "def translate(err: dict) -> str:",
        "    \"\"\"단일 에러 dict 를 한국어 문장으로 변환.\"\"\"",
        "    template = MESSAGES.get(err[\"type\"], FALLBACK)",
        "    ctx = err.get(\"ctx\", {}) or {}",
        "    try:",
        "        return template.format(**ctx)",
        "    except KeyError:",
        "        return FALLBACK   # ctx 키 누락 시 안전 fallback",
        "",
        "app = FastAPI()",
        "",
        "@app.exception_handler(RequestValidationError)",
        "async def validation_handler(request: Request, exc: RequestValidationError):",
        "    errors = [",
        "        {\"field\": \".\".join(str(p) for p in err[\"loc\"]),",
        "         \"message\": translate(err)}",
        "        for err in exc.errors()",
        "    ]",
        "    return JSONResponse(422, {\"success\": False,",
        "                              \"code\": \"VALIDATION_FAILED\",",
        "                              \"errors\": errors})",
        "",
        "# 효과: \"Input should be greater than 0\" → \"0 보다 큰 값을 입력해 주세요.\"",
        "# → 다음 단계: 필드별 라벨/원본값까지 함께 돌려주자",

      fieldDetail: {lang:"python", filename:"field-detail.py", lines:[
        "\"\"\"field-detail.py — 라벨·입력값·위치를 분리한 풀세트 응답.\"\"\"",
        "",
        "from fastapi import FastAPI, Request",
        "from fastapi.exceptions import RequestValidationError",
        "from fastapi.responses import JSONResponse",
        "from app.errors.korean import translate",
        "",
        "# 한국어 필드 라벨 — 마지막 필드명 기준 매핑",
        "LABELS: dict[str, str] = {",
        "    \"name\":     \"상품명\",",
        "    \"price\":    \"가격\",",
        "    \"stock\":    \"재고\",",
        "    \"email\":    \"이메일\",",
        "    \"password\": \"비밀번호\",",
        "    \"age\":      \"나이\",",
        "}",
        "",
        "def split_location(loc: tuple) -> tuple[str, str]:",
        "    \"\"\"loc 첫 요소를 location 으로, 나머지를 점 표기 field 로.",
        "",
        "    예) (\"body\", \"items\", 0, \"price\") → (\"body\", \"items.0.price\")",
        "    \"\"\"",
        "    if not loc:",
        "        return \"unknown\", \"\"",
        "    return str(loc[0]), \".\".join(str(p) for p in loc[1:])",
        "",
        "def label_of(field_path: str) -> str:",
        "    \"\"\"점 표기 경로의 마지막 세그먼트로 라벨 lookup.\"\"\"",
        "    last = field_path.split(\".\")[-1] if field_path else \"\"",
        "    return LABELS.get(last, last)",
        "",
        "app = FastAPI()",
        "",
        "@app.exception_handler(RequestValidationError)",
        "async def validation_handler(request: Request, exc: RequestValidationError):",
        "    errors = []",
        "    for err in exc.errors():",
        "        location, field_path = split_location(err[\"loc\"])",
        "        errors.append({",
        "            \"location\": location,",
        "            \"field\":    field_path,",
        "            \"label\":    label_of(field_path),",
        "            \"message\":  translate(err),",
        "            \"input\":    err.get(\"input\"),",
        "            \"type\":     err[\"type\"],",
        "        })",
        "    return JSONResponse(422, {\"success\": False,",
        "                              \"code\": \"VALIDATION_FAILED\",",
        "                              \"errors\": errors})",
        "",
        "# 효과: 프론트 폼이 errors.find(e => e.field === \"price\").message 한 줄로",
        "# 인라인 에러를 표시할 수 있다.",
        "# → 다음 단계: fieldErrors 객체 + summary + meta 풀세트로 확장",
      ]},
      frontendFormat: {lang:"python", filename:"frontend-format.py", lines:[
        "\"\"\"frontend-format.py — 토스트/인라인/디버깅 동시 지원 풀세트.\"\"\"",
        "",
        "from datetime import datetime, timezone",
        "from fastapi import FastAPI, Request",
        "from fastapi.exceptions import RequestValidationError",
        "from fastapi.responses import JSONResponse",
        "from app.errors.korean import translate",
        "from app.errors.handler import split_location, label_of",
        "",
        "app = FastAPI()",
        "",
        "@app.exception_handler(RequestValidationError)",
        "async def validation_handler(request: Request, exc: RequestValidationError):",
        "    \"\"\"프론트 친화 풀세트 응답.",
        "",
        "    응답 본문 구조:",
        "      success     : bool — 항상 False",
        "      code        : str  — \"VALIDATION_FAILED\"",
        "      summary     : str  — 첫 에러 (상단 알림 그대로 사용)",
        "      errors      : list — 순서 있는 에러 목록 (토스트/스낵바)",
        "      fieldErrors : dict — {field: message} (Hook Form 등에 직접 주입)",
        "      meta        : dict — path/method/request_id/timestamp (디버깅)",
        "    \"\"\"",
        "    errors = []",
        "    field_errors: dict[str, str] = {}",
        "    for err in exc.errors():",
        "        location, field_path = split_location(err[\"loc\"])",
        "        label = label_of(field_path)",
        "        message = translate(err)",
        "        errors.append({",
        "            \"location\": location, \"field\": field_path,",
        "            \"label\": label, \"message\": message,",
        "            \"input\": err.get(\"input\"), \"type\": err[\"type\"],",
        "        })",
        "        # 같은 필드 중복 시 첫 번째만 fieldErrors 에 담는다",
        "        field_errors.setdefault(field_path, message)",
        "",
        "    first = errors[0] if errors else None",
        "    summary = (f\"{first['label']}: {first['message']}\"",
        "               if first else \"요청이 올바르지 않습니다.\")",
        "    request_id = request.headers.get(\"x-request-id\", \"\")",
        "",
        "    return JSONResponse(",
        "        status_code=422,",
        "        content={",
        "            \"success\":     False,",
        "            \"code\":        \"VALIDATION_FAILED\",",
        "            \"summary\":     summary,",
        "            \"errors\":      errors,",
        "            \"fieldErrors\": field_errors,",
        "            \"meta\": {",
        "                \"path\":       request.url.path,",
        "                \"method\":     request.method,",
        "                \"request_id\": request_id,",
        "                \"timestamp\":  datetime.now(timezone.utc).isoformat(),",
        "            },",
        "        },",
        "        headers={\"x-request-id\": request_id},",
        "    )",
        "",
        "# 프론트 사용 예시 (React Hook Form):",
        "#   if (!data.success) {",
        "#     toast.error(data.summary);                        // 상단 알림",
        "#     Object.entries(data.fieldErrors).forEach(([k, m]) =>",
        "#       setError(k, { type: \"server\", message: m })     // 인라인",
        "#     );",
        "#     console.error(\"[req]\", data.meta.request_id);     // 디버깅",
        "#   }",
      ]},
    };

    const S1 = { title:"Step 1. 기본 422 응답 — Pydantic 원본 그대로", desc:"FastAPI 는 Pydantic 검증이 실패하면 자동으로 422 Unprocessable Entity 를 반환한다. 응답에는 detail 배열이 들어 있고, 각 항목에는 loc(에러 위치), msg(영어 메시지), type(에러 종류), input(받은 값)이 담긴다. 개발자 디버깅용으로는 충분하지만 사용자에게 보여주기에는 너무 기술적이고 영어다." };
    const S2 = { title:"Step 2. RequestValidationError 핸들러 등록", desc:"@app.exception_handler(RequestValidationError) 데코레이터로 422 응답을 가로챈다. 핸들러 안에서 exc.errors() 로 원본 에러 리스트를 받아 원하는 모양으로 다시 조립한 뒤 JSONResponse 로 돌려준다. 이 단계에서는 우선 응답 봉투(envelope)를 success/code/errors 3 키로 통일한다. 메시지는 아직 영어지만 응답 모양만으로도 프론트 코드가 단순해진다." };

        response: {"status":422,"statusText":"Unprocessable Entity","headers":{"content-type":"application/json","x-request-id":"req-7a91f3"},"body":{"success":false,"code":"VALIDATION_FAILED","summary":"상품명: 1자 이상 입력해 주세요.","errors":[{"location":"body","field":"name","label":"상품명","message":"1자 이상 입력해 주세요.","input":"","type":"string_too_short"},{"location":"body","field":"price","label":"가격","message":"0 보다 큰 값을 입력해 주세요.","input":-5,"type":"greater_than"},{"location":"body","field":"stock","label":"재고","message":"정수만 입력할 수 있습니다.","input":"abc","type":"int_parsing"}],"fieldErrors":{"name":"1자 이상 입력해 주세요.","price":"0 보다 큰 값을 입력해 주세요.","stock":"정수만 입력할 수 있습니다."},"meta":{"path":"/products","method":"POST","request_id":"req-7a91f3","timestamp":"2026-05-19T10:24:00Z"}}},
        verdict: {"tone":"good","text":"이슈 제보 때 request_id 하나로 서버 로그를 찾는다"},
        keyPoint: "meta 는 사용자용이 아니라 개발자용 — 헤더에도 실어 프록시 로그와 연결한다.",
        code:{...CODE.frontendFormat, highlight:[51,52,53,54,55,56,57,58]},
      },
      { ...S5,
        beat:{
          label:"프론트 사용 예시",
          at:"frontend-format.py L61–68",
          caption:"toast 는 summary, 인라인은 fieldErrors, 디버깅은 meta — 세 용도가 한 응답에서 나온다.",
          changes:[
            {mark:"read", text:"토스트·인라인·디버깅 동시 지원"},
          ],
        },
        request: "POST /products  body: {\"name\": \"\", \"price\": -5, \"stock\": \"abc\"}",
        response: {"status":422,"statusText":"Unprocessable Entity","headers":{"content-type":"application/json","x-request-id":"req-7a91f3"},"body":{"success":false,"code":"VALIDATION_FAILED","summary":"상품명: 1자 이상 입력해 주세요.","errors":[{"location":"body","field":"name","label":"상품명","message":"1자 이상 입력해 주세요.","input":"","type":"string_too_short"},{"location":"body","field":"price","label":"가격","message":"0 보다 큰 값을 입력해 주세요.","input":-5,"type":"greater_than"},{"location":"body","field":"stock","label":"재고","message":"정수만 입력할 수 있습니다.","input":"abc","type":"int_parsing"}],"fieldErrors":{"name":"1자 이상 입력해 주세요.","price":"0 보다 큰 값을 입력해 주세요.","stock":"정수만 입력할 수 있습니다."},"meta":{"path":"/products","method":"POST","request_id":"req-7a91f3","timestamp":"2026-05-19T10:24:00Z"}}},
        verdict: {"tone":"great","text":"토스트·인라인·디버깅 3가지 용도 동시 지원"},
        keyPoint: "errors(배열) + fieldErrors(객체) + summary + meta. React Hook Form 에 그대로 setError 가능.",
        code:{...CODE.frontendFormat, highlight:[61,62,63,64,65,66,67,68]},
      },
    ];

    // 좌측 LiveDataPane — indigo 톤
    const VERDICT_STYLE = {
      warn:     { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-800',    icon: '!' },
      progress: { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-800',   icon: '~' },
      good:     { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800', icon: 'OK' },
      great:    { bg: 'bg-indigo-50',  border: 'border-indigo-400',  text: 'text-indigo-800',  icon: '★' },
    };

    function StatusLine({ status, statusText }) {
      const isOk = status < 400;
      return (
        <div className="flex items-center gap-2 mb-2">
          <span className={`px-2 py-0.5 rounded font-mono text-xs font-bold ${isOk ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}`}>{status}</span>
          <span className="text-xs text-slate-700 font-mono">{statusText}</span>
        </div>
      );
    }

    function HeaderTable({ headers }) {
      const entries = Object.entries(headers || {});
      if (entries.length === 0) return null;
      return (
        <div className="mb-2 text-[11px] font-mono bg-slate-50 border border-slate-200 rounded p-2">
          {entries.map(([k, v]) => (
            <div key={k} className="flex gap-2"><span className="text-slate-500">{k}:</span><span className="text-slate-800">{v}</span></div>
          ))}
        </div>
      );
    }

    function JsonBody({ body }) {
      return (
        <pre className="text-[11px] font-mono leading-5 bg-slate-900 text-indigo-100 rounded p-3 overflow-auto max-h-[360px] whitespace-pre">{JSON.stringify(body, null, 2)}</pre>
      );
    }

    function VerdictBadge({ verdict }) {
      if (!verdict) return null;
      const s = VERDICT_STYLE[verdict.tone] || VERDICT_STYLE.progress;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} px-3 py-2 flex items-start gap-2`}>
          <span className={`text-xs font-bold ${s.text} flex-shrink-0`}>[{s.icon}]</span>
          <span className={`text-xs ${s.text} leading-relaxed`}>{verdict.text}</span>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      return (
        <div className="rounded-xl border border-indigo-200 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-800">422 응답 미리보기</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 프론트가 받는 응답</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="mb-3 rounded-lg bg-indigo-50 border border-indigo-200 px-3 py-2">
            <div className="text-[10px] font-bold text-indigo-700 mb-1">REQUEST</div>
            <div className="text-[11px] font-mono text-indigo-900 break-all">{state.request}</div>
          </div>
          <div className="rounded-lg border border-slate-300 bg-white p-3 flex-1 overflow-auto">
            <div className="text-[10px] font-bold text-slate-600 mb-2">RESPONSE</div>
            <StatusLine status={state.response.status} statusText={state.response.statusText} />
            <HeaderTable headers={state.response.headers} />
            <JsonBody body={state.response.body} />
          </div>
          <VerdictBadge verdict={state.verdict} />
          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">팁: {state.keyPoint}</div>
        </div>
      );
    }

    // 우측 VSCode CodeViewer (highlight.js + 탭)
    function CodeViewer({ code, stepIdx, total, onTabClick }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex gap-0 px-2 pt-1 bg-slate-800 border-b border-slate-700 overflow-x-auto">
            {STEPS.map((s, i) => (
              <button key={i} onClick={() => onTabClick && onTabClick(i)}
                className={`px-2.5 py-1 text-[10px] font-mono rounded-t whitespace-nowrap transition ${i === stepIdx ? 'bg-[#282c34] text-indigo-300 border-t border-x border-slate-600' : 'bg-slate-700/60 text-slate-400 hover:text-slate-200'}`}>
                {s.code.filename}
              </button>
            ))}
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // App
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
          else if (e.key === ' ') { e.preventDefault(); setPlaying((p) => !p); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">IV</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">Chapter IV-4-18. RequestValidationError 커스터마이즈</h1>
                <p className="text-sm text-indigo-800/80">기본 422 → 핸들러 → 한글화 → 필드 상세 → 프론트 친화 포맷. 5단계로 추적</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-600' : 'bg-indigo-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-indigo-700 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} onTabClick={setStepIdx} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-700 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ 이동 · Space 재생 토글 · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">핵심 정리</div>
                기본 422 → exception_handler 로 가로채기 → type 코드 매핑으로 한글화 → 필드별 라벨/입력값/위치 분리 → errors(배열) + fieldErrors(객체) + summary + meta 풀세트. 한 번의 응답으로 토스트, 인라인 폼 에러, 디버깅까지 모두 커버한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RequestValidationError', 'exception_handler', '422', 'Pydantic', 'JSONResponse', 'fieldErrors', 'summary', 'meta'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./chapter-04-19-path-query-validation.html" className="underline hover:no-underline">다음: IV-4-19 Path/Query 검증 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
