  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    FastAPI Chapter IV-4-3 — 환경 변수 (.env + pydantic-settings)
    학습 목표: 하드코딩의 위험 → .env 분리 → pydantic-settings 타입 검증 →
              환경별 분리(dev/staging/prod) → Secret 관리(Vault/AWS)까지
              5단계 흐름으로 "안전한 설정 관리"의 전체 그림을 잡는다.
    패턴: fastapi v1 — 좌(LiveDataPane: 코드↔.env↔환경변수 흐름) / 우(VSCode CodeViewer 5탭)
    색상: indigo (fastapi 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 하드코딩 → .env → pydantic → 환경별 → Secret
    //   flow      : 좌측 LiveDataPane에 표시할 흐름 카드들
    //                [{kind, label, value, badge, leak?}]
    //   arrow     : 변환 화살표 라벨
    //   alertBox  : 경고/주의 박스 (Step 1, 5)
    //   checkBox  : 안전 체크 박스 (Step 2~4)
    //   code      : 우측 CodeViewer 파일 (lang, filename, lines, highlight)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      hardcoded: {lang:"python", filename:"hardcoded-bad.py", lines:[
        "\"\"\"",
        "안티 패턴: 비밀값을 소스코드에 하드코딩",
        "이 파일이 GitHub에 올라가면 비밀번호 / API 키가 모두 노출된다.",
        "\"\"\"",
        "",
        "from fastapi import FastAPI",
        "from sqlalchemy import create_engine",
        "",
        "# 🚨 절대 이렇게 하면 안 된다",
        "DB_HOST = \"prod-db.company.com\"",
        "DB_USER = \"admin\"",
        "DB_PASSWORD = \"p@ss123!\"          # ← git push 순간 노출",
        "API_KEY = \"sk-prod-abcd1234XYZ\"   # ← OpenAI 등 결제 키",
        "JWT_SECRET = \"my-super-secret\"    # ← 토큰 위조 가능",
        "",
        "DATABASE_URL = (",
        "    f\"postgresql://{DB_USER}:{DB_PASSWORD}\"",
        "    f\"@{DB_HOST}:5432/myapp\"",
        ")",
        "",
        "engine = create_engine(DATABASE_URL)",
        "app = FastAPI()",
        "",
        "",
        "# 발생하는 문제들:",
        "#  1) git에 한 번 커밋되면 history에서 지워도 남는다",
        "#  2) 개발 환경 / 운영 환경 값이 다른데 매번 코드 수정",
        "#  3) 협업자마다 로컬 DB 비밀번호가 달라서 충돌",
        "#  4) GitHub 공개 레포면 봇이 5분 내 스캔해서 악용",
        "",
        "# → 다음 단계 (Step 2): \".env 파일로 분리한다\"",
      ]},
      dotenv: {lang:"bash", filename:"dotenv.env", lines:[
        "# .env — 환경 변수 파일 (절대 git에 올리지 않는다)",
        "# KEY=VALUE 형식, 따옴표 불필요",
        "",
        "# ─── 데이터베이스 ───",
        "DB_HOST=localhost",
        "DB_PORT=5432",
        "DB_USER=postgres",
        "DB_PASSWORD=p@ss123!",
        "DB_NAME=myapp",
        "",
        "# ─── 외부 API ───",
        "OPENAI_API_KEY=sk-prod-abcd1234XYZ",
        "STRIPE_SECRET_KEY=sk_live_xxx",
        "",
        "# ─── 인증 ───",
        "JWT_SECRET=change-me-in-production-please",
        "JWT_ALGORITHM=HS256",
        "JWT_EXPIRE_MINUTES=60",
        "",
        "# ─── 앱 설정 ───",
        "APP_ENV=development",
        "DEBUG=true",
        "LOG_LEVEL=INFO",
        "",
        "# .gitignore 에 반드시 추가 ↓",
        "#   .env, .env.local, .env.*.local",
        "# 대신 .env.example 을 git에 커밋해서 키 목록을 문서화",
        "",
        "# 한계:",
        "#  • 값 누락 시 런타임에야 KeyError",
        "#  • 타입이 항상 문자열 (bool/int 변환 직접)",
        "#  • 오타 검증 없음 (DB_PSSWORD = ...)",
        "",
        "# → 다음 단계 (Step 3): \"pydantic-settings 로 타입 검증\"",
      ]},
      settings: {lang:"python", filename:"settings.py", lines:[

        flow: [{"kind":"code","label":"FastAPI","value":"boto3.client(\"secretsmanager\")","badge":"SDK"},{"kind":"arrow","label":"↓","value":"IAM 권한 검증 + 감사 로그","badge":"인증"},{"kind":"data","label":"AWS Secrets","value":"db_password (암호화)","badge":"메모리"},{"kind":"data","label":"AWS Secrets","value":"자동 로테이션 (90일)","badge":"갱신"},{"kind":"data","label":"Settings()","value":"DB_PASSWORD 주입 (런타임)","badge":"주입"}],
        arrow: "비밀값은 절대 디스크에 쓰지 않는다",
        alertBox: null,
        keyPoint: "dev 의 편함과 prod 의 안전을 분기 다섯 줄로 둘 다 가진다.",
        code: { ...CODE.secret, highlight: [33,34,35,36,37] },
      },
      { ...S5,
        beat:{ label:"절대 하지 말 것", at:"secret.md L42–46",
               caption:"print·로그·Sentry·Slack 으로 비밀값이 새는 경로를 막는다. git 커밋은 단 한 번도 금지.",
               changes:[{"mark":"gone","text":"print(settings.db_password)"},{"mark":"gone","text":"settings 객체 통째 전송"}] },
        flow: [{"kind":"code","label":"FastAPI","value":"boto3.client(\"secretsmanager\")","badge":"SDK"},{"kind":"arrow","label":"↓","value":"IAM 권한 검증 + 감사 로그","badge":"인증"},{"kind":"data","label":"AWS Secrets","value":"db_password (암호화)","badge":"메모리"},{"kind":"data","label":"AWS Secrets","value":"자동 로테이션 (90일)","badge":"갱신"},{"kind":"data","label":"Settings()","value":"DB_PASSWORD 주입 (런타임)","badge":"주입"}],
        arrow: "비밀값은 절대 디스크에 쓰지 않는다",
        alertBox: {"title":"Secret Manager가 해결하는 것","items":["디스크 노출 차단 — 비밀값이 메모리에만 존재","접근 감사 로그 — 누가 언제 읽었는지 추적","자동 로테이션 — 90일마다 자동으로 비밀번호 변경","IAM 권한 분리 — prod 비밀은 prod 서버만 읽기"]},
        keyPoint: "도구를 아무리 올려도 print 한 줄이면 무너진다. 유출 경로는 대부분 로그다.",
        code: { ...CODE.secret, highlight: [42,43,44,45,46] },
      },
      { ...S5,
        beat:{ label:"사고 대응 4단계", at:"secret.md L50–53",
               caption:"새면 즉시 전체 키 재발급 → history 제거 → 접근 로그로 피해 산정 → 재발 방지 도입 순서다.",
               changes:[{"mark":"changed","text":"모든 키 재발급"},{"mark":"read","text":"CloudTrail 접근 로그"}] },
        flow: [{"kind":"code","label":"FastAPI","value":"boto3.client(\"secretsmanager\")","badge":"SDK"},{"kind":"arrow","label":"↓","value":"IAM 권한 검증 + 감사 로그","badge":"인증"},{"kind":"data","label":"AWS Secrets","value":"db_password (암호화)","badge":"메모리"},{"kind":"data","label":"AWS Secrets","value":"자동 로테이션 (90일)","badge":"갱신"},{"kind":"data","label":"Settings()","value":"DB_PASSWORD 주입 (런타임)","badge":"주입"}],
        arrow: "비밀값은 절대 디스크에 쓰지 않는다",
        alertBox: {"title":"Secret Manager가 해결하는 것","items":["디스크 노출 차단 — 비밀값이 메모리에만 존재","접근 감사 로그 — 누가 언제 읽었는지 추적","자동 로테이션 — 90일마다 자동으로 비밀번호 변경","IAM 권한 분리 — prod 비밀은 prod 서버만 읽기"]},
        keyPoint: "\"지우면 되겠지\"는 없다. 유출 = 전량 재발급이 유일한 대응이다.",
        code: { ...CODE.secret, highlight: [50,51,52,53] },
      },
      { ...S5,
        beat:{ label:"5단계 진화 정리", at:"secret.md L55–59",
               caption:"하드코딩 → .env → pydantic-settings → 환경별 분리 → Secret Manager. 규모에 맞춰 한 단계씩.",
               changes:[{"mark":"read","text":"5단계 로드맵"}] },
        flow: [{"kind":"code","label":"FastAPI","value":"boto3.client(\"secretsmanager\")","badge":"SDK"},{"kind":"arrow","label":"↓","value":"IAM 권한 검증 + 감사 로그","badge":"인증"},{"kind":"data","label":"AWS Secrets","value":"db_password (암호화)","badge":"메모리"},{"kind":"data","label":"AWS Secrets","value":"자동 로테이션 (90일)","badge":"갱신"},{"kind":"data","label":"Settings()","value":"DB_PASSWORD 주입 (런타임)","badge":"주입"}],
        arrow: "비밀값은 절대 디스크에 쓰지 않는다",
        alertBox: {"title":"Secret Manager가 해결하는 것","items":["디스크 노출 차단 — 비밀값이 메모리에만 존재","접근 감사 로그 — 누가 언제 읽었는지 추적","자동 로테이션 — 90일마다 자동으로 비밀번호 변경","IAM 권한 분리 — prod 비밀은 prod 서버만 읽기"]},
        keyPoint: ".env 는 dev 까지, prod 는 Secret Manager. 보안 수준에 비례해서 도구를 올린다.",
        code: { ...CODE.secret, highlight: [55,56,57,58,59] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — indigo 톤
    // ─────────────────────────────────────────────────────
    const KIND_STYLE = {
      code:  { bg: 'bg-rose-50',     border: 'border-rose-300',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
      env:   { bg: 'bg-indigo-50',   border: 'border-indigo-300',  text: 'text-indigo-800',  badge: 'bg-indigo-200 text-indigo-800' },
      data:  { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      arrow: { bg: 'bg-slate-100',   border: 'border-slate-300',   text: 'text-slate-700',   badge: 'bg-slate-200 text-slate-700' },
    };

    function FlowCard({ item }) {
      const s = KIND_STYLE[item.kind] || KIND_STYLE.env;
      return (
        <div className={`rounded-lg border ${s.bg} ${s.border} px-3 py-2 flex items-center justify-between ${item.leak ? 'ring-2 ring-red-400 ring-offset-1' : ''}`}>
          <div className="flex items-center gap-2 min-w-0">
            <span className={`text-xs font-bold ${s.text} w-20 shrink-0`}>{item.label}</span>
            <span className={`text-sm font-mono ${s.text} truncate`}>{item.value}</span>
          </div>
          <span className={`text-[10px] px-2 py-0.5 rounded shrink-0 ml-2 ${s.badge}`}>
            {item.leak ? '🚨 ' : ''}{item.badge}
          </span>
        </div>
      );
    }

    function AlertBox({ alert }) {
      if (!alert) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-400 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">⚠️ {alert.title}</div>
          <ul className="space-y-1">
            {alert.items.map((a, i) => (
              <li key={i} className="text-xs text-red-900 flex gap-2">
                <span className="text-red-500">▸</span>
                <span>{a}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function CheckBox({ check }) {
      if (!check) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-400 bg-indigo-50 p-3">
          <div className="text-xs font-bold text-indigo-800 mb-2">✅ {check.title}</div>
          <ul className="space-y-1">
            {check.items.map((a, i) => (
              <li key={i} className="text-xs text-indigo-900 flex gap-2">
                <span className="text-indigo-500">✓</span>
                <span>{a}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      return (
        <div className="rounded-xl border border-indigo-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-800">코드 ↔ .env ↔ 환경 변수 흐름</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 데이터 흐름</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="space-y-2">
            {state.flow.map((it, i) => (
              <FlowCard key={i} item={it} />
            ))}
          </div>
          {state.arrow && (
            <div className="mt-3 text-center text-xs font-bold text-indigo-600 py-2 border-y border-dashed border-indigo-300">
              ↓ {state.arrow} ↓
            </div>
          )}
          <AlertBox alert={state.alertBox} />
          <CheckBox check={state.checkBox} />
          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (탭 5개 = 단계 5개)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ steps, stepIdx, onSelect }) {
      const code = steps[stepIdx].code;
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 탭 바 */}
          <div className="flex items-center gap-1 px-2 py-1.5 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            <span className="w-3 h-3 rounded-full bg-red-400 ml-1"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400 mr-2"></span>
            {steps.map((s, i) => (
              <button
                key={i}
                onClick={() => onSelect(i)}
                className={`px-2.5 py-1 text-[11px] font-mono rounded-t border-b-2 whitespace-nowrap ${
                  i === stepIdx
                    ? 'bg-[#282c34] text-indigo-300 border-indigo-400'
                    : 'bg-slate-800 text-slate-400 border-transparent hover:text-slate-200'
                }`}
              >
                {s.code.filename}
              </button>
            ))}
          </div>
          {/* 코드 본문 */}
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-500/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1 whitespace-pre"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          {/* 상태 바 */}
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines · {code.lang}</span>
            <span>세부 {stepIdx + 1} / {steps.length}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
          else if (e.key === ' ') {
            e.preventDefault();
            setPlaying((p) => !p);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">IV</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">Chapter IV-4-3. 환경 변수 (.env + pydantic-settings)</h1>
                <p className="text-sm text-indigo-800/80">하드코딩 → .env → pydantic-settings → 환경별 분리 → Secret 관리</p>
              </div>
              <a href="./index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-600' : 'bg-indigo-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-indigo-700 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4" style={{ minHeight: '560px' }}>
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer steps={STEPS} stepIdx={stepIdx} onSelect={setStepIdx} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-700 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ · Space = 재생/정지 · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                하드코딩 → .env → pydantic-settings → 환경별 분리 → Secret Manager 의 5단계 진화. 프로젝트 규모와 보안 요구에 맞춰 한 단계씩 올라가면 된다. 다음 챕터(IV-4-4)에서는 전역 예외 처리(Exception Handler)로 에러 응답을 통일하는 법을 배운다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['.env', 'pydantic-settings', 'BaseSettings', '12-Factor', 'APP_ENV', 'Secret Manager', 'AWS', 'Vault', 'JWT_SECRET'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-700">
              <a href="./chapter-04-02-upload.html" className="underline hover:no-underline">← 이전: IV-4-2 파일 업로드</a>
              <a href="./chapter-04-04-exception-handler.html" className="underline hover:no-underline">다음: IV-4-4 전역 예외 처리 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
