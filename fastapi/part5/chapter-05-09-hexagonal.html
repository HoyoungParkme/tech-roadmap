<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastAPI 인터랙티브 학습 — Chapter 5-9. 헥사고날 아키텍처</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    FastAPI Chapter 5-9 — 헥사고날 아키텍처 (Hexagonal Architecture)
    학습 목표: Domain Core → Port (interface) → Adapter (구현) → inbound/outbound → DB/API 교체
              5단계 변환 흐름과 마지막에 어댑터 교체로 자유로워지는 모습을 시각화한다.
    핵심 비유: 6각형 도식 — 비즈니스 로직(중앙)이 어떻게 외부와 격리되는가
    패턴: fastapi v1 — 좌(LiveDataPane: 6각형 도식 + 포트/어댑터) / 우(VSCode CodeViewer 5탭)
    색상: indigo
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — Domain → Port → Adapter → inbound/outbound → 교체
    //   pane      : 좌측 LiveDataPane에 표시할 헥사곤 상태
    //   hexagon   : 중앙 6각형 (활성 영역 색)
    //   ports     : 포트 목록 [{side, label, kind, active}]
    //   adapters  : 어댑터 목록 [{side, label, tech, badge, active}]
    //   swap      : 어댑터 교체 표시 (Step 5만 활성)
    //   code      : 우측 CodeViewer 파일 (lang, filename, lines, highlight)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      domain: {lang:"python", filename:"domain.py", lines:[
        "\"\"\"",
        "domain.py — 헥사고날 아키텍처의 중심",
        "경로: app/domain/order.py",
        "목적: 외부 의존성 0개. 비즈니스 규칙만 담는 순수 파이썬 클래스.",
        "의존성: 표준 라이브러리(dataclasses) 만 사용 — FastAPI, SQLAlchemy 등 절대 금지.",
        "\"\"\"",
        "from dataclasses import dataclass, field",
        "from datetime import datetime",
        "",
        "",
        "@dataclass",
        "class OrderItem:",
        "    \"\"\"주문 항목 — 상품 한 줄.\"\"\"",
        "    product_id: str",
        "    quantity: int",
        "    unit_price: int  # 단위: 원",
        "",
        "    def line_total(self) -> int:",
        "        \"\"\"이 줄의 합계 금액을 계산한다.\"\"\"",
        "        return self.quantity * self.unit_price",
        "",
        "",
        "@dataclass",
        "class Order:",
        "    \"\"\"주문 도메인 — 비즈니스 규칙의 중심.\"\"\"",
        "    id: str",
        "    customer_id: str",
        "    items: list[OrderItem] = field(default_factory=list)",
        "    created_at: datetime = field(default_factory=datetime.utcnow)",
        "",
        "    # ── 비즈니스 규칙 ───────────────────────────────",
        "    MIN_AMOUNT = 10_000  # 최소 주문 금액",
        "",
        "    def total(self) -> int:",
        "        \"\"\"총 주문 금액을 계산한다.\"\"\"",
        "        return sum(item.line_total() for item in self.items)",
        "",
        "    def is_valid(self) -> bool:",
        "        \"\"\"최소 주문 금액을 넘었는지 검증한다.\"\"\"",
        "        return self.total() >= self.MIN_AMOUNT",
        "",
        "    def add_item(self, item: OrderItem) -> None:",
        "        \"\"\"주문 항목을 추가한다.\"\"\"",
        "        self.items.append(item)",
        "",
        "",
        "# 주목할 점:",
        "#  1. import 에 FastAPI, SQLAlchemy, requests 같은 외부 라이브러리 없음",
        "#  2. DB 가 무엇이든, API 가 무엇이든 이 코드는 그대로 동작",
        "#  3. 테스트도 mock 없이 그냥 인스턴스 만들고 호출하면 끝",
      ]},
      port: {lang:"python", filename:"port.py", lines:[
        "\"\"\"",
        "port.py — 도메인과 외부 사이의 \"계약(인터페이스)\"",
        "경로: app/ports/order_repository.py, app/ports/payment_gateway.py",
        "목적: Domain Core 가 외부에 무엇을 원하는지만 선언. 구현은 어댑터가 담당.",
        "의존성: 표준 라이브러리(typing.Protocol, abc) 만 사용.",
        "\"\"\"",
        "from typing import Protocol",
        "from app.domain.order import Order",
        "",
        "",
        "# ── outbound port (도메인 → 외부) ─────────────────",
        "class OrderRepository(Protocol):",

      adapter: {lang:"python", filename:"adapter.py", lines:[
        "\"\"\"",
        "adapter.py — Port 인터페이스의 실제 구현",
        "경로: app/adapters/sql_order_repository.py, app/adapters/toss_payment.py",
        "목적: SQLAlchemy, requests 같은 외부 기술을 어댑터에 가둔다.",
        "의존성: SQLAlchemy, requests (외부 라이브러리 OK).",
        "\"\"\"",
        "from sqlalchemy.orm import Session",
        "import requests",
        "",
        "from app.domain.order import Order, OrderItem",
        "from app.ports.order_repository import OrderRepository",
        "from app.ports.payment_gateway import PaymentGateway",
        "",
        "",
        "# ── SQL 어댑터: OrderRepository 의 PostgreSQL 구현 ───",
        "class SqlOrderRepository:",
        "    \"\"\"PostgreSQL 로 주문을 저장하는 어댑터.\"\"\"",
        "",
        "    def __init__(self, session: Session) -> None:",
        "        self.session = session",
        "",
        "    def save(self, order: Order) -> None:",
        "        \"\"\"도메인 객체 → ORM 모델 변환 후 저장.\"\"\"",
        "        row = OrderRow(",
        "            id=order.id,",
        "            customer_id=order.customer_id,",
        "            total=order.total(),  # 도메인 메서드 호출",
        "        )",
        "        self.session.add(row)",
        "        self.session.commit()",
        "",
        "    def find_by_id(self, order_id: str) -> Order | None:",
        "        \"\"\"ORM 행 → 도메인 객체로 다시 변환.\"\"\"",
        "        row = self.session.get(OrderRow, order_id)",
        "        if row is None:",
        "            return None",
        "        return Order(id=row.id, customer_id=row.customer_id, items=[])",
        "",
        "",
        "# ── HTTP 어댑터: PaymentGateway 의 Toss 구현 ─────────",
        "class TossPaymentAdapter:",
        "    \"\"\"Toss Payments API 를 호출하는 어댑터.\"\"\"",
        "",
        "    def __init__(self, api_key: str) -> None:",
        "        self.api_key = api_key",
        "        self.base_url = \"https://api.tosspayments.com/v1\"",
        "",
        "    def charge(self, order_id: str, amount: int) -> bool:",
        "        \"\"\"Toss 결제 API 호출.\"\"\"",
        "        resp = requests.post(",
        "            f\"{self.base_url}/payments\",",
        "            headers={\"Authorization\": f\"Basic {self.api_key}\"},",
        "            json={\"orderId\": order_id, \"amount\": amount},",
        "            timeout=5,",
        "        )",
        "        return resp.status_code == 200",
        "",
        "",
        "# 핵심 포인트:",
        "#  1. SQLAlchemy, requests 같은 외부 의존성이 어댑터에만 존재",
        "#  2. 어댑터는 Port 의 메서드 시그니처를 반드시 지킨다 (Protocol 만족)",
        "#  3. 도메인 객체 ↔ 외부 모델 변환은 어댑터가 책임진다",
      ]},
      inbound: {lang:"python", filename:"inbound.py", lines:[
        "\"\"\"",
        "inbound.py — FastAPI Router 가 Inbound Adapter 역할을 한다",
        "경로: app/adapters/http_router.py, app/use_cases/place_order.py",
        "목적: HTTP 요청을 받아 도메인 유스케이스를 호출 (외부 → 도메인 방향).",
        "의존성: FastAPI, Pydantic.",
        "\"\"\"",
        "from fastapi import APIRouter, Depends",
        "from pydantic import BaseModel",
        "",
        "from app.domain.order import Order, OrderItem",
        "from app.ports.order_repository import OrderRepository",
        "from app.ports.payment_gateway import PaymentGateway",
        "",
        "",
        "# ── 유스케이스(도메인 서비스) — Inbound Port 의 구현 ───",
        "class PlaceOrderService:",
        "    \"\"\"주문 생성 유스케이스 — 도메인 규칙 + Outbound Port 사용.\"\"\"",
        "",
        "    def __init__(",
        "        self,",
        "        repo: OrderRepository,        # outbound port",
        "        payment: PaymentGateway,      # outbound port",
        "    ) -> None:",
        "        self.repo = repo",
        "        self.payment = payment",
        "",
        "    def execute(self, customer_id: str, items: list[dict]) -> Order:",
        "        order = Order(id=\"ord-1\", customer_id=customer_id)",
        "        for it in items:",
        "            order.add_item(OrderItem(**it))",
        "        if not order.is_valid():",
        "            raise ValueError(\"최소 주문 금액 미달\")",
        "        self.repo.save(order)                          # outbound",
        "        self.payment.charge(order.id, order.total())   # outbound",
        "        return order",
        "",
        "",
        "# ── Inbound Adapter: FastAPI Router ──────────────",
        "router = APIRouter(prefix=\"/orders\")",
        "",
        "",
        "class OrderRequest(BaseModel):",
        "    customer_id: str",
        "    items: list[dict]",
        "",
        "",
        "@router.post(\"/\")",
        "def create_order(",
        "    body: OrderRequest,",
        "    svc: PlaceOrderService = Depends(),  # DI 로 유스케이스 주입",
        "):",
        "    \"\"\"HTTP POST → 도메인 유스케이스로 변환 → 응답 반환.\"\"\"",
        "    order = svc.execute(body.customer_id, body.items)",
        "    return {\"id\": order.id, \"total\": order.total()}",
        "",
        "",
        "# 핵심 포인트:",
        "#  1. Router(Inbound Adapter) 는 도메인 객체를 직접 만들지 않는다",
        "#  2. 유스케이스(PlaceOrderService) 에 위임만 한다",
        "#  3. CLI 로 같은 기능을 노출하려면 Router 대신 click 어댑터만 추가",
      ]},

        "\"\"\"",
        "swap.py — 어댑터 교체로 외부 기술을 자유롭게 갈아끼우기",
        "경로: app/adapters/mongo_order_repository.py, app/adapters/in_memory_repo.py",
        "목적: Port 만 지키면 어댑터를 자유롭게 교체할 수 있음을 보인다.",

        "\"\"\"",
        "from pymongo.collection import Collection",
        "import stripe",
        "",
        "from app.domain.order import Order",
        "from app.ports.order_repository import OrderRepository",
        "from app.ports.payment_gateway import PaymentGateway",
        "",
        "",
        "# ── 교체 1: PostgreSQL → MongoDB ──────────────────",
        "class MongoOrderRepository:",
        "    \"\"\"OrderRepository(Port) 의 MongoDB 구현 — 시그니처 동일.\"\"\"",
        "",
        "    def __init__(self, collection: Collection) -> None:",
        "        self.collection = collection",
        "",
        "    def save(self, order: Order) -> None:",
        "        self.collection.insert_one({",
        "            \"_id\": order.id,",
        "            \"customer_id\": order.customer_id,",
        "            \"total\": order.total(),",
        "        })",
        "",
        "    def find_by_id(self, order_id: str) -> Order | None:",
        "        doc = self.collection.find_one({\"_id\": order_id})",
        "        if doc is None:",
        "            return None",
        "        return Order(id=doc[\"_id\"], customer_id=doc[\"customer_id\"])",
        "",
        "",
        "# ── 교체 2: Toss → Stripe ─────────────────────────",
        "class StripePaymentAdapter:",
        "    \"\"\"PaymentGateway(Port) 의 Stripe 구현 — 시그니처 동일.\"\"\"",
        "",
        "    def __init__(self, api_key: str) -> None:",
        "        stripe.api_key = api_key",
        "",
        "    def charge(self, order_id: str, amount: int) -> bool:",
        "        try:",
        "            stripe.PaymentIntent.create(amount=amount, currency=\"krw\",",

        "    def __init__(self) -> None:",
        "        self.storage: dict[str, Order] = {}",
        "",
        "    def save(self, order: Order) -> None:",
        "        self.storage[order.id] = order",
        "",

    const S1 = { title: "Step 1. Domain Core — 비즈니스 로직만 남기다", desc: "주문(Order) 도메인을 만든다고 하자. \"총액을 계산한다\", \"최소 주문 금액을 넘었는지 검증한다\" — 이런 규칙은 DB가 PostgreSQL이든 MongoDB든, HTTP API든 CLI든 절대 바뀌지 않는다. 헥사고날의 출발은 \"이 핵심 규칙(Domain Core)만 떼어내서 어떤 외부 의존성도 없게 만든다\"이다. FastAPI도, SQLAlchemy도, requests도 절대 import 하지 않는다. 순수 파이썬 클래스만으로 비즈니스 규칙을 표현한다." };

    const S3 = { title: "Step 3. Adapter — Port 의 실제 구현체를 끼우다", desc: "Port 가 \"계약\"이라면, Adapter 는 \"그 계약을 실제로 이행하는 사람\"이다. OrderRepository(Port) 의 SqlOrderRepository(Adapter), MongoOrderRepository(Adapter)... 같은 Port 에 대해 여러 Adapter 가 존재할 수 있다. Adapter 는 SQLAlchemy, requests 같은 외부 라이브러리를 마음껏 사용한다. 단, \"Port 가 정의한 메서드 시그니처\"는 반드시 지킨다. 이게 헥사고날의 핵심 — 외부 기술을 도메인 안으로 끌고 들어오지 않고 어댑터에 가둔다." };
    const S4 = { title: "Step 4. Inbound / Outbound — 방향에 따라 어댑터를 분리하다", desc: "헥사고날은 어댑터를 두 방향으로 나눈다. Inbound(외부 → 도메인): HTTP 요청, CLI 명령, 메시지 큐가 도메인을 호출한다. Outbound(도메인 → 외부): 도메인이 DB, 결제 API, 이메일 서버를 호출한다. FastAPI Router 는 대표적인 Inbound Adapter — HTTP 요청을 받아서 도메인 유스케이스(PlaceOrderUseCase) 를 호출한다. 양쪽 어댑터가 분리되어 있어서 \"HTTP 대신 CLI 로 같은 기능을 노출\"하는 것이 매우 쉬워진다." };

    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total, onTabClick }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      const tabs = STEPS.map((s, i) => ({ name: s.code.filename, idx: i }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 탭 바 (5탭) */}
          <div className="flex items-center bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {tabs.map((t) => (
              <button
                key={t.idx}
                onClick={() => onTabClick(t.idx)}
                className={`px-3 py-2 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                  t.idx === stepIdx
                    ? 'bg-[#282c34] text-indigo-300 border-t-2 border-t-indigo-400'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                }`}
              >{t.name}</button>
            ))}
          </div>
          <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 border-b border-slate-700">
            <span className="w-2.5 h-2.5 rounded-full bg-red-400"></span>
            <span className="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
            <span className="w-2.5 h-2.5 rounded-full bg-green-400"></span>
            <span className="ml-2 text-[10px] text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-500/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">⬡</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">Chapter 5-9. 헥사고날 아키텍처</h1>
                <p className="text-sm text-indigo-800/80">Domain → Port → Adapter → inbound/outbound → 교체 자유. 5단계로 추적</p>
              </div>
              <a href="./index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-600' : 'bg-indigo-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-indigo-700 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} onTabClick={setStepIdx} />
            </div>

            {/* 컨트롤 — 4버튼 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-700 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Domain Core (순수 로직) → Port (계약) → Adapter (구현) 구조로 분리하면, DB/API/UI 가 바뀌어도 비즈니스 로직은 안전하다. 다음 챕터(5-10)에서는 헥사고날의 확장형인 클린 아키텍처를 살펴본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['헥사고날', 'Domain Core', 'Port', 'Adapter', 'inbound', 'outbound', 'DI', 'Protocol', 'FastAPI'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-700">
              <a href="./chapter-05-08-apirouter.html" className="underline hover:no-underline">← 이전: 5-8 APIRouter</a>
              <a href="./chapter-05-10-clean.html" className="underline hover:no-underline">다음: 5-10 클린 아키텍처 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
