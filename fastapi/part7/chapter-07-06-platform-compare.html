  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>

  <!--
    FastAPI Chapter VII-6 — 배포 플랫폼 매트릭스
    학습 목표: Render / Fly.io / Railway / AWS App Runner / Google Cloud Run 5개 플랫폼을
              5개 지표(가격, cold start, autoscale, DB 연동, DX)로 비교한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 5×5 매트릭스, 활성 컬럼 강조) / 우(VSCode CodeViewer 5탭)
    색상: indigo (fastapi 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5개 플랫폼 — 행(row)
    // ─────────────────────────────────────────────────────
    const PLATFORMS = [
      { id: 'render',   name: 'Render',         emoji: '🍱', tag: '학습/MVP' },
      { id: 'fly',      name: 'Fly.io',         emoji: '🌍', tag: '글로벌' },
      { id: 'railway',  name: 'Railway',        emoji: '🚂', tag: 'DX 최강' },
      { id: 'apprunner',name: 'AWS App Runner', emoji: '☁️', tag: '엔터프라이즈' },
      { id: 'cloudrun', name: 'Google Cloud Run',emoji: '🏃', tag: '서버리스' },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 — 각 단계마다 한 지표(컬럼)에 집중
    //   metricKey : 강조할 컬럼 키
    //   metrics   : 플랫폼별 해당 지표 값 (label, value, tone)
    //   summary   : 전체 5지표 요약 매트릭스 행 (한눈에 보기)
    //   code      : 우측 CodeViewer 파일
    // ─────────────────────────────────────────────────────
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };
    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      price: {lang:"markdown", filename:"price.md", lines:[
        "# Step 1. 가격 비교 — 5개 플랫폼",
        "",
        "## 무료 티어 한눈에 보기",
        "",
        "| 플랫폼 | 무료 한도 | 한도 초과 시 |",
        "|:--|:--|:--|",
        "| Render          | 인스턴스 750h/월 | $7/월 (Starter) |",
        "| Fly.io          | shared-cpu-1x VM 3개 | $1.94~/VM/월 |",
        "| Railway         | $5 크레딧/월 (소모) | 사용량 과금 |",
        "| AWS App Runner  | 무료 없음 | 최소 ~$25/월 |",
        "| Google Cloud Run| 200만 req/월 + CPU 18만초 | 요청·CPU·메모리 |",
        "",
        "## 학습 단계별 추천",
        "",
        "### 🐣 처음 배포해보는 단계",
        "- Render 추천: 카드 등록도 무료, GitHub 푸시만으로 자동 배포",
        "- 슬립이 있어도 학습에는 문제 없음",
        "",
        "### 🏃 사이드 프로젝트 운영",
        "- Railway: $5 크레딧 안에서 충분히 운영 가능",
        "- Fly.io: 항상 켜진 글로벌 서비스 필요할 때",
        "",
        "### 💼 회사 서비스",
        "- AWS App Runner: 사내 AWS 인프라와 통합",
        "- Cloud Run: 트래픽 폭증 가능성 있는 서비스",
        "",
        "## ⚠️ 숨은 비용",
        "- AWS App Runner는 최소 인스턴스가 항상 돈",
        "- Cloud Run은 요청량이 폭증하면 청구서도 폭증",
        "- 항상 \"Budget Alert\" 를 켜고 시작하자",
      ]},
      cold: {lang:"markdown", filename:"cold-start.md", lines:[
        "# Step 2. Cold Start 비교",
        "",
        "## Cold Start 가 발생하는 조건",
        "",
        "| 플랫폼 | 발생 조건 | 첫 요청 지연 |",
        "|:--|:--|:--|",
        "| Render (무료)   | 15분 무요청 | 약 25~40초 |",
        "| Fly.io          | auto-stop 활성 | 약 2~5초 |",
        "| Railway         | 발생 안 함 (상시 가동) | - |",
        "| AWS App Runner  | 발생 안 함 (인스턴스 상시) | - |",
        "| Google Cloud Run| 콘테이너 새로 부팅 | 약 300ms~2초 |",
        "",
        "## Cold Start 가 왜 느린가?",
        "",
        "```",
        "[요청 도착]",
        "   ↓",
        "컨테이너 이미지 풀  ─┐",
        "컨테이너 부팅      ├─ cold start 구간",
        "FastAPI 앱 import  ├─ 모듈 로드",
        "DB 커넥션 풀 생성  ─┘",
        "   ↓",
        "[정상 응답]",
        "```",
        "",
        "## 해결 전략",
        "",

        metrics: [{"id":"render","label":"git push","value":"A+","tone":"good","note":"자동 배포"},{"id":"fly","label":"fly deploy","value":"A","tone":"good","note":"fly.toml 1개"},{"id":"railway","label":"railway up","value":"A+","tone":"good","note":"CLI/GUI 모두 쉬움"},{"id":"apprunner","label":"아직 비교 전","value":"…","tone":"warn","note":"다음 beat"},{"id":"cloudrun","label":"아직 비교 전","value":"…","tone":"warn","note":"다음 beat"}],
        keyPoint: "CLI 와 GUI 어느 쪽으로도 같은 일이 된다 — 초심자 진입로가 둘이다.",
        code:{...CODE.dx, highlight:[13,14,15,16,17]},
      },
      { ...S5,
        beat:{ label:"App Runner — 10단계 콘솔", at:"dx.md L20–27",
               caption:"소스, 빌드, 서비스, 스케일, 네트워크, 보안… 클릭이 가장 쉽다는데 10단계다.",
               changes:[{"mark":"new","text":"콘솔 마법사 10단계 (C)"},{"mark":"read","text":"IAM/VPC 이해 요구"}] },
        metricKey: "dx",
        metrics: [{"id":"render","label":"git push","value":"A+","tone":"good","note":"자동 배포"},{"id":"fly","label":"fly deploy","value":"A","tone":"good","note":"fly.toml 1개"},{"id":"railway","label":"railway up","value":"A+","tone":"good","note":"CLI/GUI 모두 쉬움"},{"id":"apprunner","label":"AWS Console","value":"C","tone":"bad","note":"IAM/VPC 복잡"},{"id":"cloudrun","label":"아직 비교 전","value":"…","tone":"warn","note":"다음 beat"}],
        keyPoint: "단계 수는 통제 항목 수와 같다. 복잡함은 대가이지 결함이 아니다.",
        code:{...CODE.dx, highlight:[20,21,22,23,24,25,26,27]},
      },
      { ...S5,
        beat:{ label:"App Runner — IaC 로", at:"dx.md L32–33",
               caption:"실무는 콘솔 클릭 대신 JSON 정의 + CLI. 반복 가능해야 운영이다.",
               changes:[{"mark":"read","text":"create-service --cli-input-json"}] },
        metricKey: "dx",
        metrics: [{"id":"render","label":"git push","value":"A+","tone":"good","note":"자동 배포"},{"id":"fly","label":"fly deploy","value":"A","tone":"good","note":"fly.toml 1개"},{"id":"railway","label":"railway up","value":"A+","tone":"good","note":"CLI/GUI 모두 쉬움"},{"id":"apprunner","label":"AWS Console","value":"C","tone":"bad","note":"IAM/VPC 복잡"},{"id":"cloudrun","label":"아직 비교 전","value":"…","tone":"warn","note":"다음 beat"}],
        keyPoint: "10단계를 사람이 반복하면 사고가 난다. 코드로 굳혀야 한다.",
        code:{...CODE.dx, highlight:[32,33]},
      },
      { ...S5,
        beat:{ label:"Cloud Run — 한 줄 + URL", at:"dx.md L36–41",
               caption:"gcloud run deploy --source . 한 줄. Cloud Build 가 빌드하고 첫 줄에 https URL 이 나온다.",
               changes:[{"mark":"new","text":"gcloud run deploy (B+)"}] },
        metricKey: "dx",
        metrics: [{"id":"render","label":"git push","value":"A+","tone":"good","note":"자동 배포"},{"id":"fly","label":"fly deploy","value":"A","tone":"good","note":"fly.toml 1개"},{"id":"railway","label":"railway up","value":"A+","tone":"good","note":"CLI/GUI 모두 쉬움"},{"id":"apprunner","label":"AWS Console","value":"C","tone":"bad","note":"IAM/VPC 복잡"},{"id":"cloudrun","label":"gcloud run deploy","value":"B+","tone":"warn","note":"GCP CLI 학습"}],
        keyPoint: "한 줄이지만 gcloud 라는 세계에 먼저 익숙해져야 한다 — 그래서 B+.",
        code:{...CODE.dx, highlight:[36,37,38,39,40,41]},
      },
      { ...S5,
        beat:{ label:"용도별 결론", at:"dx.md L44–47",
               caption:"학습/MVP 는 Railway·Render, 글로벌은 Fly, 스파이크는 Cloud Run, 사내는 App Runner.",
               changes:[{"mark":"read","text":"용도별 최종 매핑 4줄"}] },
        metricKey: "dx",
        metrics: [{"id":"render","label":"git push","value":"A+","tone":"good","note":"자동 배포"},{"id":"fly","label":"fly deploy","value":"A","tone":"good","note":"fly.toml 1개"},{"id":"railway","label":"railway up","value":"A+","tone":"good","note":"CLI/GUI 모두 쉬움"},{"id":"apprunner","label":"AWS Console","value":"C","tone":"bad","note":"IAM/VPC 복잡"},{"id":"cloudrun","label":"gcloud run deploy","value":"B+","tone":"warn","note":"GCP CLI 학습"}],
        keyPoint: "DX 결론: 학습/MVP는 Railway·Render, 글로벌은 Fly, 스케일은 Cloud Run, 사내는 App Runner.",
        code:{...CODE.dx, highlight:[44,45,46,47]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 5×5 매트릭스 (활성 컬럼 강조)
    // ─────────────────────────────────────────────────────
    const TONE_STYLE = {
      good: { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', dot: 'bg-emerald-500' },
      warn: { bg: 'bg-amber-50',    border: 'border-amber-300',   text: 'text-amber-800',   dot: 'bg-amber-500'   },
      bad:  { bg: 'bg-rose-50',     border: 'border-rose-300',    text: 'text-rose-800',    dot: 'bg-rose-500'    },
    };

    function MatrixRow({ platform, metric }) {
      const t = TONE_STYLE[metric.tone] || TONE_STYLE.warn;
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2 flex items-center gap-3`}>
          <div className="flex items-center gap-2 w-40 shrink-0">
            <span className="text-xl">{platform.emoji}</span>
            <div className="flex flex-col">
              <span className="text-sm font-bold text-slate-800 leading-tight">{platform.name}</span>
              <span className="text-[10px] text-slate-500 leading-tight">{platform.tag}</span>
            </div>
          </div>
          <div className="flex-1 flex items-center gap-2">
            <span className={`w-2 h-2 rounded-full ${t.dot}`}></span>
            <span className={`text-sm font-medium ${t.text}`}>{metric.label}</span>
          </div>
          <div className="flex flex-col items-end shrink-0">
            <span className={`text-base font-mono font-bold ${t.text}`}>{metric.value}</span>
            <span className="text-[10px] text-slate-500">{metric.note}</span>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      // 플랫폼 순서대로 정렬 (state.metrics 는 id 기반 매핑)
      const metricById = Object.fromEntries(state.metrics.map((m) => [m.id, m]));
      return (
        <div className="rounded-xl border border-indigo-200 bg-white p-4 h-full flex flex-col">
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-800">5×5 플랫폼 매트릭스</h3>
            <span className="text-[10px] text-slate-500">현재 지표: {state.metricKey}</span>
          </div>
          <div className="space-y-2">
            {PLATFORMS.map((p) => (
              <MatrixRow key={p.id} platform={p} metric={metricById[p.id]} />
            ))}
          </div>
          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
          <div className="mt-2 grid grid-cols-3 gap-1.5 text-[10px]">
            <div className="flex items-center gap-1.5 rounded border border-emerald-200 bg-emerald-50 px-2 py-1">
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span className="text-emerald-800">유리/추천</span>
            </div>
            <div className="flex items-center gap-1.5 rounded border border-amber-200 bg-amber-50 px-2 py-1">
              <span className="w-2 h-2 rounded-full bg-amber-500"></span>
              <span className="text-amber-800">중간/조건부</span>
            </div>
            <div className="flex items-center gap-1.5 rounded border border-rose-200 bg-rose-50 px-2 py-1">
              <span className="w-2 h-2 rounded-full bg-rose-500"></span>
              <span className="text-rose-800">불리/주의</span>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer — 5탭, highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ stepIdx, setStepIdx, total }) {
      const code = STEPS[stepIdx].code;
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 탭 바 (5탭) */}
          <div className="flex items-center gap-0.5 px-2 pt-2 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {STEPS.map((s, i) => {
              const active = i === stepIdx;
              return (
                <button
                  key={i}
                  onClick={() => setStepIdx(i)}
                  className={`px-3 py-1.5 text-[11px] font-mono rounded-t whitespace-nowrap transition ${
                    active
                      ? 'bg-[#282c34] text-indigo-300 border-t border-x border-slate-700'
                      : 'bg-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {s.code.filename}
                </button>
              );
            })}
          </div>
          {/* 윈도우 헤더 */}
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          {/* 코드 본문 */}
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-500/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          {/* 푸터 */}
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">VII</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">Chapter VII-6. 배포 플랫폼 매트릭스</h1>
                <p className="text-sm text-indigo-800/80">Render / Fly / Railway / AWS App Runner / Cloud Run × 5개 지표</p>
              </div>
              <a href="./index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-600' : 'bg-indigo-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-indigo-700 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer stepIdx={stepIdx} setStepIdx={setStepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-700 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-700 hover:bg-indigo-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">✅ 핵심 정리 — 시나리오별 추천</div>
                <ul className="space-y-1 mt-2">
                  <li>• <b>처음 배포</b>: Render (git push 자동, 무료 750h)</li>
                  <li>• <b>사이드 운영</b>: Railway ($5 크레딧, 원클릭 DB)</li>
                  <li>• <b>글로벌 서비스</b>: Fly.io (엣지 배포)</li>
                  <li>• <b>트래픽 스파이크</b>: Google Cloud Run (0→1000 인스턴스)</li>
                  <li>• <b>사내 AWS 통합</b>: AWS App Runner (IAM/VPC 통제)</li>
                </ul>
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Render', 'Fly.io', 'Railway', 'AppRunner', 'CloudRun', 'cold-start', 'autoscale', 'min-instances'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-800 border border-indigo-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-700">
              <a href="./chapter-07-05-static-vs-dynamic.html" className="underline hover:no-underline">← 이전: VII-5 정적 vs 동적 호스팅</a>
              <a href="./chapter-07-07-env-vars.html" className="underline hover:no-underline">다음: VII-7 환경변수 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
