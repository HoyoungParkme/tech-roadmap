  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    II-1-2. Storage — Object / Block / File
    학습 목표: 클라우드 스토리지 3종(+Hybrid 의사결정)의 차이와 쓰임새를 익힌다.
    핵심 비유: "창고 3종" — Object(서랍, 키-값) / Block(상자, 디스크) / File(캐비닛, 공유 폴더)
    패턴: fastapi v1 패턴 — 좌(LiveDataPane 3 storage 비교) / 우(VSCode CodeViewer Terraform)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의 (Object / Block / File / Hybrid 의사결정)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. Object Storage — "서랍에 키 붙여 넣기"',
        desc: 'S3 / GCS / Azure Blob. HTTP API 로 PUT/GET. 키(bucket/path) 기반 평면 키-값 저장소. 무한 확장 + 11 9s durability + 정적 웹 호스팅까지 한방에. 단점은 부분 수정 불가(전체 재업로드).',
        focus: 'object',
        boxes: {
          object: { state: 'active',  bullets: ['🌐 무한 확장 (페타바이트+)', '🔗 URL 로 직접 접근 (HTTP)', '🛡️ 11 9s durability (99.999999999%)', '🌍 정적 웹 호스팅 가능'] },
          block:  { state: 'dim',     bullets: [] },
          file:   { state: 'dim',     bullets: [] },
        },
        showDecisionTable: false,
        code: {
          lang: 'hcl',
          filename: 's3_bucket.tf',
          lines: [
            '# Terraform — S3 bucket + 정적 웹 호스팅 + lifecycle',
            'resource "aws_s3_bucket" "lake" {',
            '  bucket = "company-data-lake"',
            '}',
            '',
            'resource "aws_s3_bucket_versioning" "lake" {',
            '  bucket = aws_s3_bucket.lake.id',
            '  versioning_configuration { status = "Enabled" }',
            '}',
            '',
            '# 정적 웹 호스팅 — index.html 을 그대로 서빙',
            'resource "aws_s3_bucket_website_configuration" "lake" {',
            '  bucket = aws_s3_bucket.lake.id',
            '  index_document { suffix = "index.html" }',
            '}',
            '',
            '# 라이프사이클 — 30일 IA, 90일 Glacier, 365일 삭제',
            'resource "aws_s3_bucket_lifecycle_configuration" "lake" {',
            '  bucket = aws_s3_bucket.lake.id',
            '  rule {',
            '    id     = "tiering"',
            '    status = "Enabled"',
            '    transition { days = 30  storage_class = "STANDARD_IA" }',
            '    transition { days = 90  storage_class = "GLACIER" }',
            '    expiration { days = 365 }',
            '  }',
            '}',
            '',
            '# 사용 — HTTP API 로 PUT/GET',
            '# aws s3 cp ./report.pdf s3://company-data-lake/2026/05/report.pdf',
            '# → 키: 2026/05/report.pdf (디렉터리 X, 평면 네임스페이스)',
          ],
          highlight: [2, 12, 13, 14, 15],
        },
      },
      {
        title: 'Step 2. Block Storage — "상자(디스크)를 단일 VM에 끼우기"',
        desc: 'EBS / GCP Persistent Disk. VM 1대에 attach 해서 OS 가 "디스크"로 인식. 블록(섹터) 단위 R/W. 10K IOPS 까지 끌어올려 DB 데이터 파일에 적합. 단일 EC2 전속 — 멀티 attach 는 제한적.',
        focus: 'block',
        boxes: {
          object: { state: 'dim',    bullets: [] },
          block:  { state: 'active', bullets: ['🔌 VM 에 attach (단일 EC2 전속)', '🗄️ OS 가 마운트 디스크로 인식', '⚡ 최대 10K IOPS (gp3 / io2)', '🐘 DB 데이터 파일에 적합'] },
          file:   { state: 'dim',    bullets: [] },
        },
        showDecisionTable: false,
        code: {
          lang: 'hcl',
          filename: 'ebs_volume.tf',
          lines: [
            '# Terraform — EBS volume + EC2 attach (단일 VM 전속)',
            'resource "aws_ebs_volume" "db_data" {',
            '  availability_zone = "ap-northeast-2a"',
            '  size              = 100         # GiB',
            '  type              = "gp3"       # SSD',
            '  iops              = 10000       # 10K IOPS',
            '  throughput        = 250         # MiB/s',
            '  encrypted         = true',
            '}',
            '',
            'resource "aws_volume_attachment" "db_attach" {',
            '  device_name = "/dev/xvdf"',
            '  volume_id   = aws_ebs_volume.db_data.id',
            '  instance_id = aws_instance.db.id   # ← 단일 EC2',
            '}',
            '',
            '# VM 안에서 — OS가 디스크로 인식, 포맷 후 마운트',
            '# $ lsblk',
            '#   xvda   8G    /                   (루트)',
            '#   xvdf   100G                      (방금 attach)',
            '# $ sudo mkfs.ext4 /dev/xvdf',
            '# $ sudo mount /dev/xvdf /var/lib/postgresql/data',
            '',
            '# 특징',
            '# - 블록 단위 R/W → 낮은 latency, DB 에 적합',
            '# - VM 1대 전속 (같은 AZ 안에서만 attach)',
            '# - 단가는 Object 보다 비쌈, 용량 무한 확장 X',
          ],
          highlight: [6, 11, 12, 13, 14, 15],
        },
      },
      {
        title: 'Step 3. File Storage — "캐비닛을 여러 EC2 가 동시에 마운트"',
        desc: 'EFS / GCP Filestore. NFS 프로토콜로 여러 EC2 가 같은 파일 시스템을 동시 마운트. POSIX 호환이라 디렉터리/권한/심볼릭 링크 모두 지원. 공유 업로드 폴더, CMS 미디어, 레거시 NFS 워크로드에 쓴다.',
        focus: 'file',
        boxes: {
          object: { state: 'dim',    bullets: [] },
          block:  { state: 'dim',    bullets: [] },
          file:   { state: 'active', bullets: ['📡 NFS 프로토콜 (NFSv4)', '🤝 여러 EC2 동시 마운트', '📂 POSIX 호환 (권한/링크 OK)', '🔄 공유 업로드 폴더에 적합'] },
        },
        showDecisionTable: false,
        code: {
          lang: 'hcl',
          filename: 'efs_filesystem.tf',
          lines: [
            '# Terraform — EFS file system + mount target (AZ별)',
            'resource "aws_efs_file_system" "shared" {',
            '  creation_token   = "shared-fs"',
            '  performance_mode = "generalPurpose"',
            '  encrypted        = true',
            '}',
            '',
            '# AZ-a 마운트 타깃',
            'resource "aws_efs_mount_target" "az_a" {',
            '  file_system_id  = aws_efs_file_system.shared.id',
            '  subnet_id       = aws_subnet.private_a.id',
            '  security_groups = [aws_security_group.efs.id]',
            '}',
            '',
            '# AZ-b 마운트 타깃 (이 둘이 있어야 멀티-AZ 동시 마운트 가능)',
            'resource "aws_efs_mount_target" "az_b" {',
            '  file_system_id  = aws_efs_file_system.shared.id',
            '  subnet_id       = aws_subnet.private_b.id',
            '  security_groups = [aws_security_group.efs.id]',
            '}',
            '',
            '# 여러 EC2 에서 동시에 mount (NFSv4)',
            '# $ sudo mount -t nfs4 \\',
            '#     fs-12345.efs.ap-northeast-2.amazonaws.com:/ /mnt/shared',
            '# $ ls /mnt/shared',
            '#   uploads/  cms-media/  legacy-data/',
            '',
            '# 특징',
            '# - 다중 EC2 동시 R/W (NFS) — Block 과의 가장 큰 차이',
            '# - POSIX 호환 → 기존 NFS 앱 그대로 이식',
          ],
          highlight: [22, 23, 24, 29],
        },
      },
      {
        title: 'Step 4. 의사결정 표 — "영구 / 공유 / 정적 / 동적"',
        desc: '4가지 축으로 골라라 — 영구 보존? / 다중 VM 공유? / 정적 자산? / DB 동적 R/W? 한 표로 정리. 실무에서는 한 시스템 안에서 3종을 섞어 쓰는 게 일반적이다 (S3 자산 + EBS DB + EFS 업로드).',
        focus: 'all',
        boxes: {
          object: { state: 'active', bullets: ['🌐 정적/장기 보존', '🔗 URL 직접 노출'] },
          block:  { state: 'active', bullets: ['⚡ DB / OS 디스크', '🔌 단일 VM 전속'] },
          file:   { state: 'active', bullets: ['🤝 다중 VM 공유', '📂 POSIX 권한'] },
        },
        showDecisionTable: true,
        code: {
          lang: 'hcl',
          filename: 'storage_mix.tf',
          lines: [
            '# 실무 — 한 시스템 안에서 3종 혼합 (s3 + ebs + efs)',
            '',
            '# (1) 정적 자산 / 백업 — Object Storage',
            'resource "aws_s3_bucket" "static_assets" {',
            '  bucket = "app-static-assets"',
            '}',
            '',
            '# (2) DB 데이터 파일 — Block Storage (단일 EC2)',
            'resource "aws_ebs_volume" "postgres_data" {',
            '  availability_zone = "ap-northeast-2a"',
            '  size              = 200',
            '  type              = "gp3"',
            '  iops              = 10000',
            '}',
            '',
            '# (3) 공유 업로드 폴더 — File Storage (여러 EC2 마운트)',
            'resource "aws_efs_file_system" "user_uploads" {',
            '  creation_token = "user-uploads"',
            '  encrypted      = true',
            '}',
            '',
            '# 선택 기준 (4축)',
            '# ┌─────────┬──────┬──────┬──────┐',
            '# │ 요건    │ S3   │ EBS  │ EFS  │',
            '# ├─────────┼──────┼──────┼──────┤',
            '# │ 영구    │ ✅   │ ✅   │ ✅   │',
            '# │ 공유    │ ✅   │ ❌   │ ✅   │',
            '# │ 정적    │ ✅   │ ❌   │ ❌   │',
            '# │ 동적    │ ❌   │ ✅   │ ✅   │',
            '# └─────────┴──────┴──────┴──────┘',
            '#  S3 → URL 직접, 정적/장기',
            '#  EBS → DB / OS 디스크 (단일 VM)',
            '#  EFS → 다중 VM 공유 폴더',
          ],
          highlight: [4, 9, 17, 23, 24, 25, 26, 27, 28, 29, 30],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Storage 메타 (3종 + 의사결정)
    // ─────────────────────────────────────────────────────
    const STORAGE_META = [
      { key: 'object', emoji: '🪣', name: 'Object — S3 버킷',  service: 'AWS S3 / GCS / Azure Blob' },
      { key: 'block',  emoji: '🧱', name: 'Block — EBS',        service: 'AWS EBS / GCP Persistent Disk' },
      { key: 'file',   emoji: '📁', name: 'File — EFS',         service: 'AWS EFS / GCP Filestore' },
    ];

    // 정적 Tailwind 클래스 (purge 안전, blue 톤)
    const BOX_STYLE = {
      active: { card: 'bg-blue-50 border-blue-500 shadow-md scale-[1.02]', title: 'text-blue-800', emoji: 'opacity-100', badge: 'bg-blue-600 text-white', label: '활성' },
      dim:    { card: 'bg-slate-50 border-slate-200 opacity-60',           title: 'text-slate-500', emoji: 'opacity-40',  badge: 'bg-slate-300 text-slate-600', label: '대기' },
    };

    // ─────────────────────────────────────────────────────
    // 의사결정 표 (Step 4)
    // ─────────────────────────────────────────────────────
    const DECISION_ROWS = [
      { axis: '영구 보존',      icon: '💾', s3: true,  ebs: true,  efs: true,  hint: '셋 다 영속 (전원 꺼져도 유지)' },
      { axis: '다중 VM 공유',   icon: '🤝', s3: true,  ebs: false, efs: true,  hint: 'EBS 만 단일 VM 전속' },
      { axis: '정적 자산 (URL)', icon: '🌐', s3: true,  ebs: false, efs: false, hint: 'S3 만 HTTP URL 로 직접 노출' },
      { axis: '동적 R/W (DB)',  icon: '🔄', s3: false, ebs: true,  efs: true,  hint: 'S3 는 부분 수정 불가' },
    ];

    // ─────────────────────────────────────────────────────
    // LiveDataPane — Storage 3종 비교
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ boxes, focus, showDecisionTable }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🗄️ 창고 3종 — Storage 비교</h2>
            <span className="text-[10px] text-slate-400 font-mono">focus: {focus}</span>
          </div>

          <div className="space-y-3">
            {STORAGE_META.map((s) => {
              const box = boxes[s.key];
              const style = BOX_STYLE[box.state];
              return (
                <div
                  key={s.key}
                  className={`rounded-lg border-2 p-3 transition-all duration-500 ${style.card}`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <div className="flex items-center gap-2">
                      <span className={`text-2xl ${style.emoji}`} aria-hidden="true">{s.emoji}</span>
                      <div>
                        <div className={`text-sm font-bold ${style.title}`}>{s.name}</div>
                        <div className="text-[10px] text-slate-500 font-mono">{s.service}</div>
                      </div>
                    </div>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${style.badge}`}>
                      {style.label}
                    </span>
                  </div>

                  {box.bullets && box.bullets.length > 0 && (
                    <ul className="mt-2 space-y-1">
                      {box.bullets.map((b, i) => (
                        <li key={i} className="text-xs text-slate-700 leading-relaxed">{b}</li>
                      ))}
                    </ul>
                  )}
                </div>
              );
            })}
          </div>

          {/* Step 4: 의사결정 표 */}
          {showDecisionTable && (
            <div className="mt-4 p-3 rounded-lg bg-blue-50 border-2 border-blue-300">
              <div className="text-xs font-bold text-blue-900 mb-2">📋 의사결정 표 — 4가지 축</div>
              <div className="overflow-hidden rounded-md border border-blue-200">
                <table className="w-full text-[11px]">
                  <thead className="bg-blue-100 text-blue-900">
                    <tr>
                      <th className="text-left p-2 font-bold">요건</th>
                      <th className="p-2 font-bold">S3</th>
                      <th className="p-2 font-bold">EBS</th>
                      <th className="p-2 font-bold">EFS</th>
                    </tr>
                  </thead>
                  <tbody className="bg-white">
                    {DECISION_ROWS.map((r) => (
                      <tr key={r.axis} className="border-t border-blue-100">
                        <td className="p-2 font-medium text-slate-700">
                          <span className="mr-1">{r.icon}</span>{r.axis}
                        </td>
                        <td className={`text-center p-2 font-bold ${r.s3 ? 'text-blue-700' : 'text-slate-300'}`}>
                          {r.s3 ? '✅' : '❌'}
                        </td>
                        <td className={`text-center p-2 font-bold ${r.ebs ? 'text-blue-700' : 'text-slate-300'}`}>
                          {r.ebs ? '✅' : '❌'}
                        </td>
                        <td className={`text-center p-2 font-bold ${r.efs ? 'text-blue-700' : 'text-slate-300'}`}>
                          {r.efs ? '✅' : '❌'}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="text-[10px] text-blue-800 mt-2 leading-relaxed">
                💡 실무 = 3종 혼합 — S3(정적 자산) + EBS(DB) + EFS(공유 업로드)
              </div>
            </div>
          )}

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-blue-500"></span>활성</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-300"></span>대기</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js (Terraform = hcl)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">
              {code.lang === 'hcl' ? 'Terraform' : code.lang}
            </span>
          </div>

          {/* hljs 토큰화용 hidden code (innerHTML 추출) */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-blue-500/10 border-l-2 border-blue-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 — 단계 번호 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-blue-700 hover:text-blue-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-blue-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 핵심 자원 &gt; Chapter 1. Storage</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Storage — Object / Block / File</h1>
                  <p className="text-sm text-slate-500 mt-0.5">창고 3종 비유 — 키-값 서랍(S3) / 디스크 상자(EBS) / 공유 캐비닛(EFS)</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane
                boxes={step.boxes}
                focus={step.focus}
                showDecisionTable={step.showDecisionTable}
              />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-blue-50 border-2 border-blue-300 rounded-xl p-3 text-sm text-blue-900">
                💡 다음(II-2-1)에서는 <strong>VPC + Subnet</strong>
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-blue-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-blue-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-blue-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-1-1.html" className="text-slate-500 hover:text-slate-700">&larr; II-1-1 Compute</a>
              <a href="./II-2-1.html" className="text-blue-700 hover:text-blue-900 font-medium">II-2-1 VPC + Subnet &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
