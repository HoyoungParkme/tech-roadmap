  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-2-1. IaC (Infrastructure as Code)
    학습 목표: 콘솔 클릭 대신 코드로 인프라를 정의/재현/추적/감지하는 표준 패턴.
    핵심 비유: 건물 설계도 — 매번 손으로 짓기 vs 설계도(Terraform)로 동일하게 5번 복제
    패턴: mlops v1 — 좌(LiveDataPane: 수동 vs IaC + drift) / 우(VSCode CodeViewer · Terraform HCL)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — 4 step IaC 여정
    // Step 1 manual_pain    — 콘솔 클릭 흐름도 10 단계 + 5 환경 불일치
    // Step 2 declarative    — Terraform 1 파일 → 5 환경 동일 복제
    // Step 3 version_control— git history 표 (3 commit + diff)
    // Step 4 drift          — 콘솔에서 손으로 변경 → terraform plan 빨간 출력
    // ─────────────────────────────────────────────────────

    // 콘솔 10단계 (Step 1)
    const CONSOLE_STEPS = [
      { n: 1,  label: 'AWS Console 로그인',          icon: '🔑' },
      { n: 2,  label: 'EC2 → 인스턴스 시작',         icon: '🖥️' },
      { n: 3,  label: 'AMI 선택 (Amazon Linux)',     icon: '💿' },
      { n: 4,  label: '인스턴스 타입 (t3.micro)',    icon: '⚙️' },
      { n: 5,  label: '키 페어 생성/선택',            icon: '🗝️' },
      { n: 6,  label: '보안 그룹 (포트 22/80/443)',  icon: '🛡️' },
      { n: 7,  label: '스토리지 8GB 설정',           icon: '💾' },
      { n: 8,  label: 'RDS PostgreSQL 생성',         icon: '🗄️' },
      { n: 9,  label: 'S3 버킷 생성',                icon: '🪣' },
      { n: 10, label: '보안 정책/태깅 마무리',        icon: '🏷️' },
    ];

    // 5개 환경 (Step 1: 모두 다름 / Step 2: 모두 동일)
    const ENV_LIST = ['dev', 'staging', 'qa', 'prod-asia', 'prod-us'];

    // git history (Step 3)
    const GIT_LOG = [
      {
        sha: 'a3f9c1d',
        author: 'sh.hong',
        when: '2 hours ago',
        msg: 'feat: add S3 bucket for log archive',
        diff: [
          { sign: '+', text: 'resource "aws_s3_bucket" "logs" {' },
          { sign: '+', text: '  bucket = "app-logs-${var.environment}"' },
          { sign: '+', text: '}' },
        ],
      },
      {
        sha: '7d2e4ab',
        author: 'jenny.kim',
        when: 'yesterday',
        msg: 'chore: bump RDS to PostgreSQL 15.4',
        diff: [
          { sign: '-', text: '  engine_version = "14.10"' },
          { sign: '+', text: '  engine_version = "15.4"' },
        ],
      },
      {
        sha: '1c5b8f0',
        author: 'sh.hong',
        when: '3 days ago',
        msg: 'feat: initial EC2 + security group',
        diff: [
          { sign: '+', text: 'resource "aws_instance" "web" {' },
          { sign: '+', text: '  instance_type = "t3.micro"' },
          { sign: '+', text: '}' },
        ],
      },
    ];

    // ─────────────────────────────────────────────────────
    // STEPS
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      manual: {lang: 'shell', filename: 'manual-checklist.sh', lines: [
        '# 콘솔에서 dev 환경 만들기 (사람이 직접 10 단계)',
        '#  1. AWS Console 로그인',
        '#  2. EC2 → 인스턴스 시작',
        '#  3. AMI 선택: Amazon Linux 2023',
        '#  4. 인스턴스 타입: t3.micro',
        '#  5. 키 페어: dev-key (어디 갔지?)',
        '#  6. 보안 그룹: 포트 22, 80, 443',
        '#  7. 스토리지: 8GB (어? prod는 30GB였나?)',
        '#  8. RDS PostgreSQL 15.4 (마스터 비번은 메모장에...)',
        '#  9. S3 버킷: my-app-dev-bucket',
        '# 10. 태그/보안 정책 마무리',
        '',
        '# 다음 주 — staging 환경 똑같이 만들기',
        '$ # 콘솔 다시 열고 또 클릭...',
        '$ # "어 이번엔 RDS 버전이 뭐였지?"',
        '$ # "보안 그룹 규칙 dev랑 똑같이 했나?"',
        '',
        '# 한계',
        '# - 재현 불가 (사람의 기억에 의존)',
        '# - 환경마다 미세한 차이 (dev≠staging≠prod)',
        '# - 변경 이력 없음 (누가 언제 뭘 바꿨는지 추적 불가)',
      ]},
      declarative: {lang: 'yaml', filename: 'main.tf', lines: [

          at: 'terraform-plan-drift.txt L14–18',
          caption: 'ingress에 추가된 규칙의 실체다. DB 포트가 전세계에 열려 있고 코드에는 그런 규칙이 없다.',
          changes: [
            { mark: 'new', text: 'from_port 3306 규칙' },
            { mark: 'changed', text: 'prod-asia → 코드와 불일치' },
            { mark: 'gone', text: '보안 경계 붕괴' },
          ],
        },
        view: 'drift',
        envStatus: ENV('iac', 'iac', 'iac', 'mismatch', 'iac'),
        code: { ...CODE.drift, highlight: [14, 15, 16, 17, 18] },
      },
      { ...S4,
        beat: {
          label: 'DRIFT 확정 — 코드가 진실의 원천',
          at: 'terraform-plan-drift.txt L24–31',
          caption: '1 to change. apply 하면 손으로 넣은 규칙이 지워진다. 콘솔 직접 변경을 막고 drift 감지를 정기 실행하는 게 운영 정책이다.',
          changes: [
            { mark: 'changed', text: 'prod-asia → DRIFT 감지' },
            { mark: 'new', text: '정기 drift detection + Slack 알림' },
            { mark: 'gone', text: '콘솔 직접 변경 권한 회수' },
          ],
        },
        view: 'drift',
        envStatus: ENV('iac', 'iac', 'iac', 'drift', 'iac'),
        code: { ...CODE.drift, highlight: [24, 25, 26, 27, 28, 29, 30, 31] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 환경 상태 색상
    // ─────────────────────────────────────────────────────
    const ENV_STYLE = {
      done:     { card: 'bg-blue-50 border-blue-300',       label: '수동 완료', badge: 'bg-blue-100 text-blue-700',     mark: '🖱️' },
      partial:  { card: 'bg-yellow-50 border-yellow-400',   label: '부분 일치', badge: 'bg-yellow-100 text-yellow-700', mark: '⚠️' },
      mismatch: { card: 'bg-red-50 border-red-400',         label: '불일치',    badge: 'bg-red-100 text-red-700',       mark: '❌' },
      iac:      { card: 'bg-emerald-50 border-emerald-400', label: 'IaC 동일', badge: 'bg-emerald-100 text-emerald-700', mark: '✅' },
      drift:    { card: 'bg-red-50 border-red-500 animate-pulse', label: 'DRIFT 감지', badge: 'bg-red-100 text-red-700', mark: '🚨' },
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — view 별 4 가지 시각화 분기
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📐 건물 설계도 (IaC)</h2>
            <span className="text-[10px] text-slate-400 font-mono">manual vs IaC · live</span>
          </div>

          {step.view === 'manual_pain'   && <ManualPainView envStatus={step.envStatus} />}
          {step.view === 'declarative'   && <DeclarativeView envStatus={step.envStatus} />}
          {step.view === 'version_control' && <VersionControlView />}
          {step.view === 'drift'         && <DriftView envStatus={step.envStatus} />}

          {/* 환경 상태 범례 (공통) */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-blue-300"></span>수동 완료</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-yellow-400"></span>부분 일치</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-red-400"></span>불일치/Drift</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-400"></span>IaC 동일</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // View 1. Manual Pain — 콘솔 10단계 흐름도 + 5환경 미스매치
    // ─────────────────────────────────────────────────────
    function ManualPainView({ envStatus }) {
      return (
        <div className="space-y-4">
          <div>
            <div className="text-xs font-bold text-slate-600 mb-2">콘솔 클릭 흐름도 (10 단계)</div>
            <div className="grid grid-cols-5 gap-1.5">
              {CONSOLE_STEPS.map((s, i) => (
                <div key={s.n} className="flex flex-col items-center">
                  <div className="w-full bg-slate-100 border border-slate-300 rounded-md p-1.5 text-center">
                    <div className="text-base">{s.icon}</div>
                    <div className="text-[9px] text-slate-600 leading-tight mt-0.5">{s.label}</div>
                  </div>
                  {i < CONSOLE_STEPS.length - 1 && i % 5 !== 4 && (
                    <div className="text-[8px] text-slate-400 mt-0.5">▼</div>
                  )}
                </div>
              ))}
            </div>
            <div className="text-[10px] text-slate-500 mt-2">
              ⏱️ 1 환경 = 10 클릭 = ~30 분 · 5 환경 = 50 클릭 + 사람의 기억에 의존
            </div>
          </div>

          <div className="pt-3 border-t border-slate-100">
            <div className="text-xs font-bold text-slate-600 mb-2">5 환경 결과</div>
            <div className="grid grid-cols-5 gap-2">
              {ENV_LIST.map((env) => {
                const st = envStatus[env];
                const style = ENV_STYLE[st];
                return (
                  <div key={env} className={`rounded-md border-2 p-2 text-center ${style.card}`}>
                    <div className="text-base">{style.mark}</div>
                    <div className="text-[10px] font-bold text-slate-700 mt-0.5">{env}</div>
                    <div className={`text-[9px] mt-1 px-1 py-0.5 rounded ${style.badge}`}>{style.label}</div>
                  </div>
                );
              })}
            </div>
            <div className="text-[10px] text-red-600 mt-2 font-medium">
              ⚠️ dev/staging/qa/prod 모두 동일하게 만들 수 없다 — "내 환경에선 되는데"
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // View 2. Declarative — 1 코드 파일 → 5 환경 복제 화살표
    // ─────────────────────────────────────────────────────
    function DeclarativeView({ envStatus }) {
      return (
        <div className="space-y-4">
          <div className="flex items-center gap-3">
            {/* main.tf 카드 */}
            <div className="bg-blue-50 border-2 border-blue-400 rounded-lg p-3 text-center w-28 flex-shrink-0">
              <div className="text-2xl">📄</div>
              <div className="text-xs font-bold text-blue-700 mt-1">main.tf</div>
              <div className="text-[10px] text-slate-500">1 파일</div>
            </div>

            {/* 화살표 */}
            <div className="flex flex-col items-center text-blue-500 px-1">
              <div className="text-xs font-mono">terraform</div>
              <div className="text-2xl">→</div>
              <div className="text-[10px] font-mono">apply ×5</div>
            </div>

            {/* 5 환경 결과 */}
            <div className="grid grid-cols-1 gap-1.5 flex-1">
              {ENV_LIST.map((env) => {
                const st = envStatus[env];
                const style = ENV_STYLE[st];
                return (
                  <div key={env} className={`rounded-md border-2 px-2 py-1 flex items-center justify-between ${style.card}`}>
                    <div className="flex items-center gap-1.5">
                      <span className="text-sm">{style.mark}</span>
                      <span className="text-[11px] font-bold text-slate-700">{env}</span>
                    </div>
                    <span className={`text-[9px] px-1.5 py-0.5 rounded ${style.badge}`}>{style.label}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="pt-3 border-t border-slate-100">
            <div className="text-xs font-bold text-slate-600 mb-2">멱등성 (idempotent)</div>
            <div className="text-[11px] text-slate-600 leading-relaxed bg-slate-50 rounded-md p-2 border border-slate-200">
              같은 코드를 100번 apply 해도 결과는 같다. var.environment 만 바꾸면 5 환경이 정확히 동일한 형상으로 만들어진다.
              사람의 기억 대신 <strong className="text-blue-700">코드가 진실의 원천</strong>.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // View 3. Version Control — git history 표 + diff
    // ─────────────────────────────────────────────────────
    function VersionControlView() {
      return (
        <div className="space-y-3">
          <div className="text-xs font-bold text-slate-600">git log — main.tf history</div>
          <div className="space-y-2">
            {GIT_LOG.map((c, idx) => (
              <div key={c.sha} className="bg-slate-50 border border-slate-200 rounded-md overflow-hidden">
                <div className="px-2.5 py-1.5 flex items-center justify-between bg-white border-b border-slate-200">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[10px] text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded">{c.sha}</span>
                    <span className="text-[11px] font-bold text-slate-700">{c.msg}</span>
                  </div>
                  <div className="text-[10px] text-slate-500">
                    {c.author} · {c.when}
                  </div>
                </div>
                <div className="font-mono text-[10px] leading-tight px-2.5 py-1.5 bg-slate-900">
                  {c.diff.map((line, i) => (
                    <div
                      key={i}
                      className={line.sign === '+' ? 'text-emerald-300' : 'text-red-300'}
                    >
                      <span className="select-none mr-1.5 opacity-70">{line.sign}</span>
                      {line.text}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="text-[10px] text-slate-500 pt-2 border-t border-slate-100">
            🔍 누가 / 언제 / 왜 / 무엇을 바꿨는지 모두 추적 — 인프라도 코드 리뷰 대상
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // View 4. Drift — 5환경 + drift 박스 + plan 빨간 출력
    // ─────────────────────────────────────────────────────
    function DriftView({ envStatus }) {
      return (
        <div className="space-y-4">
          <div>
            <div className="text-xs font-bold text-slate-600 mb-2">5 환경 drift 감지</div>
            <div className="grid grid-cols-5 gap-2">
              {ENV_LIST.map((env) => {
                const st = envStatus[env];
                const style = ENV_STYLE[st];
                return (
                  <div key={env} className={`rounded-md border-2 p-2 text-center ${style.card}`}>
                    <div className="text-base">{style.mark}</div>
                    <div className="text-[10px] font-bold text-slate-700 mt-0.5">{env}</div>
                    <div className={`text-[9px] mt-1 px-1 py-0.5 rounded ${style.badge}`}>{style.label}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-red-50 border-2 border-red-400 rounded-lg p-3">
            <div className="flex items-center gap-2 text-red-800 font-bold text-sm mb-2">
              <span className="text-lg">🚨</span>
              <span>DRIFT — prod-asia · aws_security_group.web</span>
            </div>
            <div className="font-mono text-[10px] leading-tight bg-slate-900 rounded p-2 space-y-0.5">
              <div className="text-slate-400"># Terraform plan 결과</div>
              <div className="text-red-300">~ resource "aws_security_group" "web" &#123;</div>
              <div className="text-red-300 pl-2">~ ingress = [</div>
              <div className="text-emerald-300 pl-4">+ &#123; from_port = 3306,</div>
              <div className="text-emerald-300 pl-4">+   cidr_blocks = ["0.0.0.0/0"] &#125;  ← 손으로 추가</div>
              <div className="text-red-300 pl-2">]</div>
              <div className="text-red-300">&#125;</div>
              <div className="text-yellow-300 pt-0.5">Plan: 0 to add, 1 to change, 0 to destroy.</div>
            </div>
            <div className="text-[10px] text-red-700 mt-2 font-medium">
              ⚠️ 콘솔에서 손으로 변경 → 코드와 어긋남 — terraform apply 로 코드 상태 복구
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + 라인 번호 + 강조
    // (HCL 은 hljs 기본 미지원이라 yaml lang 으로 라벨만 override)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      // HCL 파일이면 표기만 HCL 로 보이게 override (highlight.js 는 yaml 로 토큰화)
      const displayLang = code.filename.endsWith('.tf') ? 'hcl' : code.lang;

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{displayLang}</span>
          </div>

          {/* hljs 토큰화 hidden */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-blue-500/10 border-l-2 border-blue-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-blue-700 hover:text-blue-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-blue-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. 클라우드 기초 &gt; Chapter 2. IaC 개론</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">IaC (Infrastructure as Code)</h1>
                  <p className="text-sm text-slate-500 mt-0.5">건물 설계도 — 코드로 인프라를 정의하면 어디서든 동일하게 재현</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-blue-50 border-2 border-blue-300 rounded-xl p-3 text-sm text-blue-900">
                💡 다음(I-2-2)에서는 <strong>Terraform 실전</strong> — state / module / workspace
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-blue-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-blue-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-blue-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./I-2-2.html" className="text-blue-700 hover:text-blue-900 font-medium">I-2-2 Terraform 실전 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
