  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    IV-2-2. Multi-region & DR (Disaster Recovery)
    학습 목표: region 장애에도 살아남는 4가지 DR 전략을 RTO/RPO와 함께 이해한다.
    핵심 비유: 두 도시 백업 — us-east-1 무너져도 us-west-2가 받아낸다
    패턴: 좌(LiveDataPane: 두 region 박스 + 복제 화살표) / 우(VSCode CodeViewer)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의 (4 DR 전략)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. Backup & Restore — 백업 후 복구',
        desc: 'primary(us-east-1)는 평소대로 풀가동. secondary(us-west-2)는 snapshot만 떠 있고 인스턴스는 꺼진 상태. 장애가 나면 사람이 절차를 실행해서 새로 띄운다. 가장 저렴하지만 RTO 1~3시간, RPO 24시간으로 느리다.',
        focus: 'backup_restore',
        primary: { app: 'on', db: 'on', label: 'ACTIVE' },
        secondary: { app: 'off', db: 'snapshot', label: 'SNAPSHOT ONLY' },
        replication: { kind: 'snapshot', lag: '24h', speed: 'slow' },
        rto: '1~3h', rpo: '24h', cost: '$',
        code: {
          lang: 'yaml',
          filename: 's3-replication.yml',
          lines: [
            '# S3 Cross-Region Replication + RDS Snapshot Copy',
            'Resources:',
            '  PrimaryBucket:',
            '    Type: AWS::S3::Bucket',
            '    Properties:',
            '      BucketName: app-data-use1          # us-east-1 (primary)',
            '      VersioningConfiguration: { Status: Enabled }',
            '      ReplicationConfiguration:',
            '        Role: !GetAtt ReplicationRole.Arn',
            '        Rules:',
            '          - Status: Enabled',
            '            Destination:',
            '              Bucket: arn:aws:s3:::app-data-usw2   # us-west-2 복제',
            '              StorageClass: STANDARD_IA',
            '',
            '# RDS 자동 snapshot을 다른 region으로 복사',
            '$ aws rds copy-db-snapshot \\',
            '    --source-db-snapshot-identifier arn:aws:rds:us-east-1:...:snapshot:daily \\',
            '    --target-db-snapshot-identifier daily-dr \\',
            '    --source-region us-east-1 \\',
            '    --region us-west-2',
            '',
            '# 장애 시 흐름 (RTO 1~3h, RPO 24h)',
            '# 1) snapshot으로 RDS 복원       (30~60분)',
            '# 2) CloudFormation으로 인프라 생성 (30분)',
            '# 3) Route53 record 수동 변경     (5분)',
          ],
          highlight: [6, 13, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 2. Pilot Light — 핵심 DB만 minimal 가동',
        desc: 'secondary에 핵심 DB read replica만 항시 가동(불씨). 앱은 꺼져 있다. 장애 시 replica를 promote하고 ASG로 앱만 띄우면 끝. RTO 30분, RPO 5분. Backup&Restore보다 훨씬 빠르고 Warm Standby보다 저렴하다.',
        focus: 'pilot_light',
        primary: { app: 'on', db: 'on', label: 'ACTIVE' },
        secondary: { app: 'off', db: 'replica', label: 'DB ONLY (PILOT)' },
        replication: { kind: 'replica', lag: '5min', speed: 'medium' },
        rto: '30min', rpo: '5min', cost: '$$',
        code: {
          lang: 'yaml',
          filename: 'pilot-light.yml',
          lines: [
            '# Route53 failover + RDS cross-region read replica',
            'Resources:',
            '  PrimaryRDS:',
            '    Type: AWS::RDS::DBInstance',
            '    Properties:',
            '      DBInstanceIdentifier: app-primary-use1   # us-east-1',
            '      Engine: postgres',
            '      MultiAZ: true',
            '',
            '  DRReadReplica:                               # us-west-2 (불씨)',
            '    Type: AWS::RDS::DBInstance',
            '    Properties:',
            '      DBInstanceIdentifier: app-replica-usw2',
            '      SourceDBInstanceIdentifier: !Sub',
            '        arn:aws:rds:us-east-1:...:db:app-primary-use1',
            '      DBInstanceClass: db.t3.medium            # 평소 작게',
            '',
            '  PrimaryDNS:',
            '    Type: AWS::Route53::RecordSet',
            '    Properties:',
            '      Name: api.example.com',
            '      Failover: PRIMARY',
            '      HealthCheckId: !Ref ApiHealthCheck       # 30s health check',
            '      AliasTarget: { DNSName: alb-use1.elb... }',
            '  DRDns:',
            '    Type: AWS::Route53::RecordSet',
            '    Properties:',
            '      Failover: SECONDARY',
            '      AliasTarget: { DNSName: alb-usw2.elb... }',
            '',
            '# 장애 시 (RTO 30min, RPO 5min)',
            '# 1) Route53 자동 failover         (1~3분)',
            '# 2) Replica를 primary로 promote    (5~10분)',
            '# 3) ASG desired 0 → N             (10~15분)',
          ],
          highlight: [10, 13, 14, 15, 22, 23, 28],
        },
      },
      {
        title: 'Step 3. Warm Standby — 축소 버전 항시 가동',
        desc: 'secondary에 작은 사본 풀스택을 항상 돌린다. 트래픽은 거의 없고 최소 인스턴스만 가동. 장애 시 scale-out + DNS만 전환하면 즉시 받을 수 있다. Aurora Global DB가 핵심 — RPO 1초, promote 1분 이내. RTO 5분, RPO 1분.',
        focus: 'warm_standby',
        primary: { app: 'on', db: 'on', label: 'ACTIVE (FULL)' },
        secondary: { app: 'minimal', db: 'replica', label: 'WARM (SMALL)' },
        replication: { kind: 'aurora_global', lag: '1s', speed: 'fast' },
        rto: '5min', rpo: '1min', cost: '$$$',
        code: {
          lang: 'yaml',
          filename: 'warm-standby.yml',
          lines: [
            '# Aurora Global Database + EKS 축소 클러스터',
            'Resources:',
            '  GlobalCluster:',
            '    Type: AWS::RDS::GlobalCluster',
            '    Properties:',
            '      GlobalClusterIdentifier: app-global',
            '      Engine: aurora-postgresql',
            '      # primary: us-east-1 (write)',
            '      # secondary: us-west-2 (read, 1초 lag)',
            '',
            '  PrimaryCluster:                          # us-east-1 - full size',
            '    Type: AWS::RDS::DBCluster',
            '    Properties:',
            '      Engine: aurora-postgresql',
            '      GlobalClusterIdentifier: !Ref GlobalCluster',
            '      DBClusterInstanceClass: db.r6g.xlarge',
            '',
            '  DRCluster:                               # us-west-2 - 축소',
            '    Type: AWS::RDS::DBCluster',
            '    Properties:',
            '      GlobalClusterIdentifier: !Ref GlobalCluster',
            '      DBClusterInstanceClass: db.r6g.large',
            '',
            '# EKS — 축소 nodegroup 항시 가동',
            'managedNodeGroups:',
            '  - name: warm-pool',
            '    instanceType: t3.medium',
            '    minSize: 2                  # 평소 2대만',
            '    maxSize: 20                 # 장애 시 빠르게 확장',
            '',
            '# 장애 시 (RTO 5min, RPO 1min)',
            '# 1) Route53 failover                  (1분)',
            '# 2) failover-global-cluster            (1~2분, write 전환)',
            '# 3) HPA가 트래픽에 맞춰 scale-out      (3~5분)',
          ],
          highlight: [3, 11, 18, 22, 28, 29],
        },
      },
      {
        title: 'Step 4. Multi-Active — 두 region 모두 active',
        desc: '두 region 모두 실제 트래픽 받음. Route53 latency routing이 사용자 가까운 region으로 라우팅. DynamoDB Global Table이 양방향 자동 복제. 장애 시 사용자는 거의 못 느낀다. RTO 0, RPO 0. 가장 비싸고 충돌 처리(LWW) 설계가 핵심 난이도.',
        focus: 'multi_active',
        primary: { app: 'on', db: 'on', label: 'ACTIVE (LIVE)' },
        secondary: { app: 'on', db: 'on', label: 'ACTIVE (LIVE)' },
        replication: { kind: 'dynamodb_global', lag: '<1s', speed: 'instant', bidirectional: true },
        rto: '0', rpo: '0', cost: '$$$$',
        code: {
          lang: 'yaml',
          filename: 'multi-active.yml',
          lines: [
            '# DynamoDB Global Table + Route53 latency routing',
            'Resources:',
            '  OrdersTable:',
            '    Type: AWS::DynamoDB::GlobalTable        # 양방향 자동 복제',
            '    Properties:',
            '      TableName: orders',
            '      AttributeDefinitions:',
            '        - { AttributeName: order_id, AttributeType: S }',
            '      KeySchema:',
            '        - { AttributeName: order_id, KeyType: HASH }',
            '      Replicas:',
            '        - Region: us-east-1                 # active',
            '        - Region: us-west-2                 # active',
            '      StreamSpecification:',
            '        StreamViewType: NEW_AND_OLD_IMAGES',
            '      # 충돌 해결: Last Writer Wins (timestamp)',
            '',
            '# Route53 — 사용자 가까운 region으로 자동 라우팅',
            'EastDNS:',
            '  Type: AWS::Route53::RecordSet',
            '  Properties:',
            '    Name: api.example.com',
            '    SetIdentifier: us-east',
            '    Region: us-east-1                       # latency 기반',
            '    HealthCheckId: !Ref EastHealth',
            '    AliasTarget: { DNSName: alb-use1... }',
            'WestDNS:',
            '  Type: AWS::Route53::RecordSet',
            '  Properties:',
            '    Region: us-west-2',
            '    HealthCheckId: !Ref WestHealth',
            '    AliasTarget: { DNSName: alb-usw2... }',
            '',
            '# DR 4전략 비교',
            '# | 전략            | RTO    | RPO   | 비용 |',
            '# | Backup&Restore  | 1~3h   | 24h   | $    |',
            '# | Pilot Light     | 30min  | 5min  | $$   |',
            '# | Warm Standby    | 5min   | 1min  | $$$  |',
            '# | Multi-Active    | ~0     | ~0    | $$$$ |',
          ],
          highlight: [4, 11, 12, 13, 16, 24, 30],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // DR 전략 카드 메타
    // ─────────────────────────────────────────────────────
    const DR_STRATEGIES = [
      { key: 'backup_restore', emoji: '💾', name: 'Backup & Restore', note: 'snapshot only' },
      { key: 'pilot_light',    emoji: '🔥', name: 'Pilot Light',      note: 'DB minimal' },
      { key: 'warm_standby',   emoji: '🌡️', name: 'Warm Standby',     note: '축소 가동' },
      { key: 'multi_active',   emoji: '⚡', name: 'Multi-Active',     note: '양쪽 active' },
    ];

    // 인스턴스 상태 스타일
    const NODE_STYLE = {
      on:       { bg: 'bg-blue-500',   text: 'text-white',       border: 'border-blue-700',  label: 'ON',       dot: 'bg-emerald-400' },
      off:      { bg: 'bg-slate-200',  text: 'text-slate-400',   border: 'border-slate-300', label: 'OFF',      dot: 'bg-slate-400' },
      minimal:  { bg: 'bg-blue-200',   text: 'text-blue-800',    border: 'border-blue-400',  label: 'MIN',      dot: 'bg-yellow-400' },
      snapshot: { bg: 'bg-slate-100',  text: 'text-slate-500',   border: 'border-slate-300', label: 'SNAP',     dot: 'bg-slate-400' },
      replica:  { bg: 'bg-blue-100',   text: 'text-blue-700',    border: 'border-blue-300',  label: 'REPLICA',  dot: 'bg-yellow-400' },
    };

    const REPLICATION_STYLE = {
      slow:    { color: 'stroke-slate-400',  label: 'snapshot copy', dash: '6,4',  animate: false },
      medium:  { color: 'stroke-blue-400',   label: 'async replica', dash: '4,3',  animate: true  },
      fast:    { color: 'stroke-blue-500',   label: 'aurora global', dash: '0',    animate: true  },
      instant: { color: 'stroke-blue-600',   label: 'global table',  dash: '0',    animate: true  },
    };

    // ─────────────────────────────────────────────────────
    // RegionBox — 단일 region 시각화
    // ─────────────────────────────────────────────────────
    function RegionBox({ name, sub, app, db, label, isPrimary }) {
      const appStyle = NODE_STYLE[app];
      const dbStyle = NODE_STYLE[db];
      const isLive = app === 'on' || app === 'minimal';
      return (
        <div className={`rounded-xl border-2 p-3 transition-all duration-500 ${isLive ? 'bg-blue-50 border-blue-400' : 'bg-slate-50 border-slate-300'}`}>
          <div className="flex items-center justify-between mb-2">
            <div>
              <div className="text-xs font-bold text-slate-800">{name}</div>
              <div className="text-[10px] text-slate-500 font-mono">{sub}</div>
            </div>
            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${isLive ? 'bg-blue-600 text-white' : 'bg-slate-300 text-slate-600'}`}>
              {label}
            </span>
          </div>

          {/* 앱 노드 */}
          <div className={`rounded-md border p-2 mb-1.5 ${appStyle.bg} ${appStyle.border} flex items-center justify-between`}>
            <div className="flex items-center gap-1.5">
              <span aria-hidden="true">⚙️</span>
              <span className={`text-[11px] font-bold ${appStyle.text}`}>App / EKS</span>
            </div>
            <span className={`w-2 h-2 rounded-full ${appStyle.dot} ${app === 'on' ? 'animate-pulse' : ''}`}></span>
          </div>

          {/* DB 노드 */}
          <div className={`rounded-md border p-2 ${dbStyle.bg} ${dbStyle.border} flex items-center justify-between`}>
            <div className="flex items-center gap-1.5">
              <span aria-hidden="true">🗄️</span>
              <span className={`text-[11px] font-bold ${dbStyle.text}`}>RDS / DDB</span>
            </div>
            <span className="text-[9px] font-mono text-slate-500">{dbStyle.label}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ReplicationArrow — 두 region 사이 복제 화살표
    // ─────────────────────────────────────────────────────
    function ReplicationArrow({ replication }) {
      const style = REPLICATION_STYLE[replication.speed];
      const bidirectional = replication.bidirectional;
      return (
        <div className="flex flex-col items-center justify-center px-2">
          <svg width="60" height="80" viewBox="0 0 60 80">
            {/* 위쪽 화살표 (primary → secondary) */}
            <line
              x1="30" y1="15" x2="30" y2="65"
              className={style.color}
              strokeWidth="2"
              strokeDasharray={style.dash}
              markerEnd="url(#arrowhead-down)"
            >
              {style.animate && style.dash !== '0' && (
                <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="0.8s" repeatCount="indefinite" />
              )}
            </line>
            {bidirectional && (
              <line
                x1="30" y1="65" x2="30" y2="15"
                className={style.color}
                strokeWidth="2"
                markerEnd="url(#arrowhead-up)"
                transform="translate(8 0)"
              />
            )}
            <defs>
              <marker id="arrowhead-down" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="0">
                <polygon points="0 0, 8 0, 4 6" className={`fill-current ${style.color.replace('stroke-', 'text-')}`} />
              </marker>
              <marker id="arrowhead-up" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="180">
                <polygon points="0 8, 8 8, 4 2" className={`fill-current ${style.color.replace('stroke-', 'text-')}`} />
              </marker>
            </defs>
          </svg>
          <div className="text-[9px] font-mono text-slate-600 text-center leading-tight">
            <div>{style.label}</div>
            <div className="text-blue-600">lag {replication.lag}</div>
            {bidirectional && <div className="text-blue-700 font-bold">↕ both ways</div>}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 두 region + 복제 + DR 전략 카드
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🌎 두 도시 백업 (Multi-region DR)</h2>
            <span className="text-[10px] text-slate-400 font-mono">2 regions · live</span>
          </div>

          {/* 두 region + 복제 화살표 */}
          <div className="grid grid-cols-[1fr_auto_1fr] gap-2 items-stretch mb-4">
            <RegionBox
              name="us-east-1"
              sub="N. Virginia"
              app={step.primary.app}
              db={step.primary.db}
              label={step.primary.label}
              isPrimary={true}
            />
            <ReplicationArrow replication={step.replication} />
            <RegionBox
              name="us-west-2"
              sub="Oregon"
              app={step.secondary.app}
              db={step.secondary.db}
              label={step.secondary.label}
              isPrimary={false}
            />
          </div>

          {/* RTO/RPO/비용 지표 */}
          <div className="grid grid-cols-3 gap-2 mb-4">
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-2 text-center">
              <div className="text-[10px] text-blue-600 font-bold">RTO</div>
              <div className="text-base font-extrabold text-blue-800 tabular-nums">{step.rto}</div>
              <div className="text-[9px] text-slate-500">복구 시간</div>
            </div>
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-2 text-center">
              <div className="text-[10px] text-blue-600 font-bold">RPO</div>
              <div className="text-base font-extrabold text-blue-800 tabular-nums">{step.rpo}</div>
              <div className="text-[9px] text-slate-500">데이터 손실</div>
            </div>
            <div className="bg-blue-50 border border-blue-200 rounded-lg p-2 text-center">
              <div className="text-[10px] text-blue-600 font-bold">Cost</div>
              <div className="text-base font-extrabold text-blue-800 tabular-nums">{step.cost}</div>
              <div className="text-[9px] text-slate-500">월 비용</div>
            </div>
          </div>

          {/* DR 전략 카드 (현재 단계 highlight) */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2 pt-3 border-t border-slate-100">
            {DR_STRATEGIES.map((s) => {
              const isActive = step.focus === s.key;
              return (
                <div
                  key={s.key}
                  className={`rounded-lg p-2 text-center transition-all duration-300 ${isActive ? 'bg-blue-100 border-2 border-blue-500 scale-105' : 'bg-slate-50 border border-slate-200'}`}
                >
                  <div className="text-lg">{s.emoji}</div>
                  <div className="text-[10px] font-bold text-slate-800 mt-0.5">{s.name}</div>
                  <div className="text-[9px] text-slate-500 leading-tight">{s.note}</div>
                </div>
              );
            })}
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-blue-500"></span>풀가동</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-blue-200"></span>축소</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-200"></span>꺼짐</span>
            <span className="flex items-center gap-1 ml-auto"><span className="w-3 h-0.5 bg-blue-500"></span>복제</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        codeRef.current.removeAttribute('data-highlighted');
        codeRef.current.className = `language-${code.lang}`;
        codeRef.current.textContent = code.lines.join('\n');
        window.hljs.highlightElement(codeRef.current);
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-blue-500/10 border-l-2 border-blue-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-blue-700 hover:text-blue-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-blue-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. 안정성 &amp; 운영 &gt; Chapter 2. Multi-region &amp; DR</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Multi-region & DR</h1>
                  <p className="text-sm text-slate-500 mt-0.5">두 도시 백업 — 4가지 DR 전략 (Backup / Pilot Light / Warm Standby / Multi-Active)</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-blue-50 border-2 border-blue-300 rounded-xl p-3 text-sm text-blue-900">
                💡 Part IV 완성. 다음(V-1-1)에서는 <strong>Well-Architected Framework</strong>
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-blue-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-blue-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-blue-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./IV-2-1.html" className="text-slate-500 hover:text-slate-700">&larr; IV-2-1</a>
              <a href="../part5/V-1-1.html" className="text-blue-700 hover:text-blue-900 font-medium">V-1-1 Well-Architected Framework &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
