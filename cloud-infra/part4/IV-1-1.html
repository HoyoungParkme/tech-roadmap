<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Cloud Infra 학습 — IV-1-1. CloudWatch / Stackdriver / Monitor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🩺</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-1-1. CloudWatch / Stackdriver / Monitor
    학습 목표: 클라우드 네이티브 모니터링 — 메트릭/로그/알람/대시보드 통합
    핵심 비유: "클라우드 건강검진" — 메트릭(혈압) + 로그(병력) + 알람(이상신호) + 대시보드(차트)
    구조: 4단계 (metrics / logs / alarms / dashboard) — 좌(LiveDataPane: CloudWatch 콘솔 모방) / 우(VSCode CodeViewer)
    W-2 fix: 기존 yaml 블록의 boto3 python 혼입 → kind 분리 (Step 1: terraform + python, Step 3/4: terraform 단독)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // STEPS — 4단계 metrics / logs / alarms / dashboard
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      metrics: {lang:"hcl", filename:"cloudwatch_metrics.tf", lines:[
        "# Terraform — CloudWatch Agent 설정 (메모리/디스크 OS 메트릭)",
        "resource \"aws_ssm_parameter\" \"cw_agent\" {",
        "  name  = \"/cloudwatch-agent/config\"",
        "  type  = \"String\"",
        "  value = jsonencode({",
        "    metrics = {",
        "      namespace = \"MyApp/Production\"        # custom namespace",
        "      metrics_collected = {",
        "        mem  = { measurement = [\"mem_used_percent\"] }",
        "        disk = { measurement = [\"used_percent\"], resources = [\"/\"] }",
        "        cpu  = { measurement = [\"usage_idle\", \"usage_user\"] }",
        "      }",
        "      append_dimensions = {",
        "        InstanceId           = \"$${aws:InstanceId}\"",
        "        AutoScalingGroupName = \"$${aws:AutoScalingGroupName}\"",
        "      }",
        "    }",
        "  })",
        "}",
        "",
        "# 빌트인: AWS/EC2, AWS/RDS, AWS/ELB (자동, 무료 5분 단위)",
        "# 커스텀: MyApp/* (PutMetricData 호출당 과금, 1분 단위)",
      ]},
      metricsApp: {lang:"python", filename:"metrics_publisher.py", lines:[
        "# 애플리케이션에서 직접 push — boto3",
        "import boto3",
        "",
        "cw = boto3.client(\"cloudwatch\")",
        "",
        "def publish_order_created(env: str = \"prod\") -> None:",
        "    \"\"\"주문 생성 카운트를 CloudWatch에 push.\"\"\"",
        "    cw.put_metric_data(",
        "        Namespace=\"MyApp/Orders\",",
        "        MetricData=[{",
        "            \"MetricName\": \"OrdersCreated\",",
        "            \"Dimensions\": [{\"Name\": \"Env\", \"Value\": env}],",
        "            \"Value\": 1,",
        "            \"Unit\": \"Count\",",
        "        }],",
        "    )",
        "",
        "# batch (최대 1000개)로 묶어 호출하면 비용 절감",
        "# cw.put_metric_data(Namespace=\"MyApp/Orders\", MetricData=[...20])",
      ]},
      logs: {lang:"shell", filename:"logs_insights.sh", lines:[
        "# (1) Log Group 생성 + 보존 정책",
        "$ aws logs create-log-group --log-group-name /myapp/api",
        "$ aws logs put-retention-policy \\",
        "    --log-group-name /myapp/api --retention-in-days 30",
        "",
        "# (2) Logs Insights 쿼리 — 최근 1시간 ERROR 상위 10건",
        "fields @timestamp, @message",
        "| filter @message like /ERROR/",
        "| stats count() as errors by bin(5m)",
        "| sort @timestamp desc",
        "| limit 10",
        "",
        "# (3) p99 latency 500ms 초과 path 집계",
        "fields @timestamp, request_id, latency_ms, path",
        "| filter latency_ms > 500",
        "| stats count() by path",
        "| sort count desc",
        "",
        "# (4) CLI에서 비동기 실행 → query_id polling",
        "$ aws logs start-query \\",
        "    --log-group-name /myapp/api \\",
        "    --start-time $(date -d \"1 hour ago\" +%s) \\",
        "    --end-time   $(date +%s) \\",
        "    --query-string \"fields @timestamp, @message | filter @message like /ERROR/\"",
      ]},
      alarms: {lang:"hcl", filename:"alarms.tf", lines:[
        "# Terraform — SNS Topic + PagerDuty subscription",
        "resource \"aws_sns_topic\" \"alerts\" {",
        "  name = \"prod-alerts\"",
        "}",
        "",
        "resource \"aws_sns_topic_subscription\" \"pagerduty\" {",
        "  topic_arn = aws_sns_topic.alerts.arn",
        "  protocol  = \"https\"",
        "  endpoint  = \"https://events.pagerduty.com/integration/<KEY>/enqueue\"",
        "}",
        "",
        "# CPU > 80% 5분 연속이면 알람",
        "resource \"aws_cloudwatch_metric_alarm\" \"high_cpu\" {",
        "  alarm_name          = \"ec2-high-cpu\"",
        "  metric_name         = \"CPUUtilization\"",
        "  namespace           = \"AWS/EC2\"",
        "  statistic           = \"Average\"",
        "  period              = 60          # 1분 buckets",
        "  evaluation_periods  = 5           # 5번 연속",
        "  datapoints_to_alarm = 5           # 5개 모두 위반",
        "  threshold           = 80",
        "  comparison_operator = \"GreaterThanThreshold\"",

      { key: 'cpu',    name: 'CPUUtilization',     unit: '%',    stroke: '#2563eb', current: 62,
        points: [38, 41, 45, 48, 52, 50, 55, 58, 60, 64, 61, 62] },
      { key: 'mem',    name: 'mem_used_percent',   unit: '%',    stroke: '#0ea5e9', current: 71,
        points: [55, 58, 60, 62, 64, 66, 68, 69, 70, 71, 71, 71] },
      { key: 'netin',  name: 'NetworkIn',          unit: 'MB/s', stroke: '#1d4ed8', current: 14,
        points: [ 8,  9, 10, 12, 13, 14, 15, 14, 13, 14, 14, 14] },
      { key: 'netout', name: 'NetworkOut',         unit: 'MB/s', stroke: '#3b82f6', current: 9,
        points: [ 5,  6,  6,  7,  8,  8,  9,  9,  9,  9,  9,  9] },
    ];

    // Step 2: Log Group 표 + 쿼리 결과
    const LOG_GROUPS = [
      { name: '/myapp/api',     streams: 12, retention: 30, sizeMB: 842 },
      { name: '/myapp/worker',  streams:  4, retention: 14, sizeMB: 217 },
      { name: '/aws/lambda/etl', streams:  2, retention:  7, sizeMB:  53 },
    ];
    const LOG_QUERY = "fields @timestamp, @message\n| filter @message like /ERROR/\n| stats count() as errors by bin(5m)\n| sort @timestamp desc";
    const LOG_RESULTS = [
      { ts: '14:35', errors: 12, sample: 'ERROR DBConnectionTimeout (rds-1)' },
      { ts: '14:30', errors:  8, sample: 'ERROR PaymentGatewayHTTP503' },
      { ts: '14:25', errors:  3, sample: 'ERROR ValidationFailed user=u_42' },
      { ts: '14:20', errors:  1, sample: 'ERROR S3 NoSuchKey reports/2025-05-07' },
      { ts: '14:15', errors:  0, sample: '—' },
    ];

    // Step 3: Alarm 룰 표
    const ALARMS = [
      { name: 'ec2-high-cpu',     metric: 'CPUUtilization',  threshold: '> 80% / 5m', state: 'ALARM',         lastChange: '2m ago' },
      { name: 'alb-5xx-rate',     metric: '5xx error rate',  threshold: '> 1% / 3m',  state: 'OK',            lastChange: '1h ago' },
      { name: 'rds-free-storage', metric: 'FreeStorageSpace', threshold: '< 10 GB',    state: 'INSUFFICIENT', lastChange: '20m ago' },
      { name: 'lambda-errors',    metric: 'Errors',          threshold: '> 5 / 5m',   state: 'OK',            lastChange: '4h ago' },
    ];

    // Step 4: Dashboard widget 그리드
    const DASHBOARD_WIDGETS = [
      { type: 'line',   title: 'ALB Errors (1h)',  span: 'col-span-2',
        chart: { stroke: '#2563eb', points: [2, 3, 5, 4, 6, 8, 12, 18, 22, 14, 9, 7] } },
      { type: 'number', title: 'Requests / sec',   span: 'col-span-1', value: '1,847' },
      { type: 'log',    title: 'Recent ERRORs',    span: 'col-span-2',
        rows: ['ERROR DBConn… 14:35', 'ERROR Payment… 14:30', 'ERROR Valid… 14:25'] },
      { type: 'text',   title: 'On-call',          span: 'col-span-1',
        body: '#ops-prod\nRunbook: wiki/runbook' },
    ];

    // ─────────────────────────────────────────────────────
    // 작은 sparkline SVG
    // ─────────────────────────────────────────────────────
    function Sparkline({ points, stroke = '#2563eb', width = 220, height = 48 }) {
      if (!points || points.length === 0) return null;
      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = max - min || 1;
      const stepX = width / (points.length - 1);
      const path = points
        .map((p, i) => {
          const x = i * stepX;
          const y = height - ((p - min) / range) * (height - 4) - 2;
          return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
        })
        .join(' ');
      // area fill
      const areaPath = `${path} L ${width} ${height} L 0 ${height} Z`;
      return (
        <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-12" preserveAspectRatio="none">
          <path d={areaPath} fill={stroke} fillOpacity="0.12" />
          <path d={path} fill="none" stroke={stroke} strokeWidth="1.5" />
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // ALARM 상태 뱃지 색
    // ─────────────────────────────────────────────────────
    const ALARM_BADGE = {
      OK:           'bg-emerald-100 text-emerald-700 border-emerald-300',
      ALARM:        'bg-red-100 text-red-700 border-red-400 animate-pulse',
      INSUFFICIENT: 'bg-slate-100 text-slate-600 border-slate-300',
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 단계별 CloudWatch 콘솔 모방
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, focus }) {
      const isMetricsView = focus === 'metrics' || focus === 'metrics-app';
      const headerTitle = {
        'metrics':     '📊 CloudWatch Metrics — last 1h',
        'metrics-app': '📊 Custom Namespace — MyApp/Orders',
        'logs':        '📝 CloudWatch Logs Insights',
        'alarms':      '🚨 CloudWatch Alarms',
        'dashboard':   '📺 prod-overview Dashboard',
      }[focus];

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* 콘솔 헤더 */}
          <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-blue-500"></span>
              <h2 className="text-sm font-bold text-slate-700">{headerTitle}</h2>
            </div>
            <span className="text-[10px] text-slate-400 font-mono">ap-northeast-2 · live</span>
          </div>

          {/* Step 1: 4 라인 차트 그리드 */}
          {isMetricsView && (
            <div className="grid grid-cols-2 gap-3">
              {METRIC_CHARTS.map((m) => (
                <div key={m.key} className="border border-slate-200 rounded-lg p-3 bg-slate-50/60">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[11px] font-mono text-slate-600">{m.name}</span>
                    <span className="text-xs font-bold text-blue-700 tabular-nums">{m.current}{m.unit}</span>
                  </div>
                  <Sparkline points={m.points} stroke={m.stroke} />
                  <div className="flex justify-between text-[9px] text-slate-400 font-mono mt-1">
                    <span>−1h</span>
                    <span>now</span>
                  </div>
                </div>
              ))}
              {focus === 'metrics-app' && (
                <div className="col-span-2 mt-1 p-2 rounded bg-blue-50 border border-blue-200 text-[11px] text-blue-900">
                  <span className="font-bold">Custom:</span> <span className="font-mono">MyApp/Orders · OrdersCreated · Env=prod</span>
                  <span className="ml-2 text-blue-700">↑ boto3 PutMetricData</span>
                </div>
              )}
            </div>
          )}

          {/* Step 2: Log Group 표 + Insights 쿼리 + 결과 */}
          {focus === 'logs' && (
            <div className="space-y-4">
              {/* Log Group 표 */}
              <div>
                <div className="text-[10px] font-bold text-slate-500 mb-1 uppercase">Log Groups</div>
                <table className="w-full text-[11px]">
                  <thead className="bg-slate-100 text-slate-600">
                    <tr>
                      <th className="text-left px-2 py-1 font-mono font-normal">Name</th>
                      <th className="text-right px-2 py-1 font-mono font-normal">Streams</th>
                      <th className="text-right px-2 py-1 font-mono font-normal">Retention</th>
                      <th className="text-right px-2 py-1 font-mono font-normal">Size</th>
                    </tr>
                  </thead>
                  <tbody>
                    {LOG_GROUPS.map((g) => (
                      <tr key={g.name} className="border-b border-slate-100">
                        <td className="px-2 py-1 font-mono text-blue-700">{g.name}</td>
                        <td className="px-2 py-1 text-right tabular-nums">{g.streams}</td>
                        <td className="px-2 py-1 text-right tabular-nums">{g.retention}d</td>
                        <td className="px-2 py-1 text-right tabular-nums">{g.sizeMB} MB</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Insights 쿼리 박스 */}
              <div>
                <div className="text-[10px] font-bold text-slate-500 mb-1 uppercase">Insights Query</div>
                <pre className="bg-slate-900 text-blue-200 text-[11px] font-mono p-2 rounded whitespace-pre overflow-x-auto">
{LOG_QUERY}
                </pre>
              </div>

              {/* 결과 표 5행 */}
              <div>
                <div className="text-[10px] font-bold text-slate-500 mb-1 uppercase">Results · 5 rows</div>
                <table className="w-full text-[11px]">
                  <thead className="bg-slate-100 text-slate-600">
                    <tr>
                      <th className="text-left px-2 py-1 font-mono font-normal">ts</th>
                      <th className="text-right px-2 py-1 font-mono font-normal">errors</th>
                      <th className="text-left px-2 py-1 font-mono font-normal">sample</th>
                    </tr>
                  </thead>
                  <tbody>
                    {LOG_RESULTS.map((r, i) => (
                      <tr key={i} className="border-b border-slate-100">
                        <td className="px-2 py-1 font-mono text-slate-500">{r.ts}</td>
                        <td className={`px-2 py-1 text-right tabular-nums font-bold ${r.errors > 5 ? 'text-red-600' : r.errors > 0 ? 'text-yellow-600' : 'text-emerald-600'}`}>{r.errors}</td>
                        <td className="px-2 py-1 font-mono text-slate-700 truncate">{r.sample}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Step 3: Alarm 룰 표 */}
          {focus === 'alarms' && (
            <div className="space-y-3">
              <table className="w-full text-[11px]">
                <thead className="bg-slate-100 text-slate-600">
                  <tr>
                    <th className="text-left px-2 py-1.5 font-mono font-normal">Alarm</th>
                    <th className="text-left px-2 py-1.5 font-mono font-normal">Metric</th>
                    <th className="text-left px-2 py-1.5 font-mono font-normal">Threshold</th>
                    <th className="text-center px-2 py-1.5 font-mono font-normal">State</th>
                    <th className="text-right px-2 py-1.5 font-mono font-normal">Changed</th>
                  </tr>
                </thead>
                <tbody>
                  {ALARMS.map((a) => (
                    <tr key={a.name} className="border-b border-slate-100">
                      <td className="px-2 py-1.5 font-mono text-blue-700">{a.name}</td>
                      <td className="px-2 py-1.5 font-mono text-slate-600">{a.metric}</td>
                      <td className="px-2 py-1.5 font-mono text-slate-500">{a.threshold}</td>
                      <td className="px-2 py-1.5 text-center">
                        <span className={`inline-block px-1.5 py-0.5 rounded border text-[10px] font-bold ${ALARM_BADGE[a.state]}`}>
                          {a.state}
                        </span>
                      </td>
                      <td className="px-2 py-1.5 text-right text-slate-500 tabular-nums">{a.lastChange}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="p-2 rounded bg-blue-50 border border-blue-200 text-[11px] text-blue-900">
                <span className="font-bold">SNS Topic:</span> <span className="font-mono">prod-alerts</span> → PagerDuty
              </div>
            </div>
          )}

          {/* Step 4: 4 widget 그리드 (line / number / log / text) */}
          {focus === 'dashboard' && (
            <div className="space-y-3">
              <div className="grid grid-cols-3 gap-3">
                {DASHBOARD_WIDGETS.map((w, i) => (
                  <div key={i} className={`border border-slate-200 rounded-lg p-3 bg-slate-50/60 ${w.span}`}>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-bold text-slate-600 uppercase">{w.type}</span>
                      <span className="text-[10px] font-mono text-slate-400">{w.title}</span>
                    </div>
                    {w.type === 'line' && (
                      <Sparkline points={w.chart.points} stroke={w.chart.stroke} />
                    )}
                    {w.type === 'number' && (
                      <div className="text-3xl font-extrabold text-blue-700 tabular-nums text-center py-2">
                        {w.value}
                      </div>
                    )}
                    {w.type === 'log' && (
                      <div className="space-y-0.5 text-[10px] font-mono text-slate-700">
                        {w.rows.map((r, j) => (
                          <div key={j} className="truncate text-red-600">{r}</div>
                        ))}
                      </div>
                    )}
                    {w.type === 'text' && (
                      <pre className="text-[10px] font-mono text-slate-600 whitespace-pre-wrap leading-snug">
{w.body}
                      </pre>
                    )}
                  </div>
                ))}
              </div>
              <div className="p-2 rounded bg-blue-50 border border-blue-200 text-[11px] text-blue-900">
                <span className="font-bold">4 Golden Signals</span> — latency · traffic · errors · saturation 한 화면에
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-blue-500/10 border-l-2 border-blue-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-blue-700 hover:text-blue-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-blue-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. 운영 &amp; 비용 &gt; Chapter 1. 모니터링</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">CloudWatch / Stackdriver / Monitor</h1>
                  <p className="text-sm text-slate-500 mt-0.5">클라우드 건강검진 — 메트릭 + 로그 + 알람 + 대시보드 통합</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} focus={step.focus} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-blue-50 border-2 border-blue-300 rounded-xl p-3 text-sm text-blue-900">
                💡 다음(IV-1-2)에서는 <strong>비용 최적화</strong> — 정기 구독 vs 떨이세일
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-blue-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-blue-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-blue-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-blue-600 text-white hover:bg-blue-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./IV-1-2.html" className="text-blue-700 hover:text-blue-900 font-medium">IV-1-2 비용 최적화 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
