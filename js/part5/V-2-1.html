        desc: '함수 안에서 throw가 일어나면 그 함수는 즉시 중단되고, 자바스크립트 엔진은 호출 스택을 위로 되감으며(unwind) 자신을 감싼 가장 가까운 try/catch를 찾는다. catch가 있으면 거기서 멈추고, 끝까지 없으면 전역까지 올라가 프로그램이 죽는다 — 이 "되감기" 그림을 머릿속에 그려야 에러 흐름이 보인다. catch(err)로 잡은 err는 보통 Error 객체이며 name(에러 종류)·message(사람이 읽을 설명)·stack(어디서 터졌는지의 호출 경로)을 담는다. 이 stack이 디버깅의 핵심 단서다. finally는 에러가 나든 안 나든 반드시 실행돼 파일 닫기·로딩 스피너 끄기 같은 뒷정리를 보장한다. 실무 실패 사례: catch(e){}처럼 잡고 아무것도 안 하는 "silent fail"은 에러를 삼켜 원인 추적을 불가능하게 만든다 — 최소한 로깅하거나 다시 throw하라.',

          { k: 'stack', v: 'parseJSON → loadUser → main', note: '터진 위치의 호출 경로 (핵심 단서)' },

            '  return JSON.parse(text); // 잘못된 JSON 이면 SyntaxError throw',

          filename: 'custom-error.js — class extends Error',

            '// Error 를 상속해 "종류"를 타입으로 표현한다',
            'class ValidationError extends Error {',
            '  constructor(message, field) {',
            '    super(message);          // 부모 Error 초기화 (message/stack)',
            '    this.name = "ValidationError"; // 로그·stack 에 종류 표시',
            '    this.field = field;      // 도메인 정보를 필드로',

                  <tr key={i} className="border-b border-slate-700/50">
                    <td className="py-1 px-2 text-slate-500">{i}</td>
                    {r.map((cell, j) => <td key={j} className="py-1 px-2">{cell}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — Sources 패널 모사 (paused · call stack · watch · step)
    // ─────────────────────────────────────────────────────
    function SourcesView({ pausedLine, callStack, watch, stepControls }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg overflow-hidden border border-slate-700 bg-[#282c34]">
            <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 border-b border-slate-700 text-[10px] text-slate-300">
              <span className="font-bold">Sources</span>
              <span className="ml-auto px-1.5 py-0.5 rounded bg-yellow-400/20 text-yellow-300 border border-yellow-500/40">⏸ Paused on breakpoint</span>
            </div>
            <div className="px-3 py-2 font-mono text-[10px] text-yellow-200 bg-yellow-400/10 border-l-2 border-yellow-400">
              ▶ {pausedLine}
            </div>
            {/* Step 컨트롤 */}
            <div className="flex flex-wrap gap-1 px-2 py-1.5 bg-slate-800 border-t border-slate-700">
              {stepControls.map((s, i) => (
                <span key={i} className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-700 text-slate-200" title={s.note}>
                  <span className="text-yellow-300">{s.key}</span> {s.label}
                </span>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            {/* Call Stack */}
            <div className="rounded-lg border-2 border-yellow-300 bg-white p-2">
              <div className="text-[10px] font-bold text-amber-800 mb-1">Call Stack</div>
              <div className="space-y-0.5">
                {callStack.map((f, i) => (
                  <div key={i} className={`flex items-center gap-1 rounded px-1.5 py-1 text-[9px] font-mono ${
                    f.current ? 'bg-yellow-200 text-amber-900 font-bold' : 'bg-yellow-50 text-slate-600'}`}>
                    {f.current && <span className="text-amber-600">▶</span>}
                    <span>{f.fn}</span>
                    <span className="ml-auto text-slate-500">{f.loc}</span>
                  </div>
                ))}
              </div>
            </div>
            {/* Watch */}
            <div className="rounded-lg border-2 border-yellow-300 bg-white p-2">
              <div className="text-[10px] font-bold text-amber-800 mb-1">Watch</div>
              <div className="space-y-0.5">
                {watch.map((w, i) => (
                  <div key={i} className={`rounded px-1.5 py-1 text-[9px] font-mono ${
                    w.warn ? 'bg-red-50 border border-red-200' : 'bg-emerald-50 border border-emerald-200'}`}>
                    <div className="flex items-center gap-1">
                      <span className="text-slate-700">{w.expr}:</span>
                      <span className={`font-bold ${w.warn ? 'text-red-600' : 'text-emerald-700'}`}>{w.val}</span>
                    </div>
                    {w.note && <div className="text-[8px] text-red-500">{w.note}</div>}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — Sentry 파이프라인 + 실패 사례 체크리스트
    // ─────────────────────────────────────────────────────
    function ObservabilityView({ pipeline, antipatterns }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
              <span>📡</span><span>프로덕션 에러 추적 파이프라인</span>
            </div>
            <div className="space-y-1">
              {pipeline.map((p, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-yellow-500 text-xs leading-none">▼</div>}
                  <div className="flex items-center gap-2 rounded border border-yellow-200 bg-yellow-50 px-2 py-1.5">
                    <span className="text-[9px] font-bold text-amber-800 w-4">{i + 1}</span>
                    <span className="font-mono text-[11px] font-bold text-slate-800 w-24">{p.step}</span>
                    <span className="ml-auto text-[9px] text-slate-500 text-right">{p.note}</span>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-red-700 mb-1.5">🚫 실패 사례 → ✅ 올바른 습관</div>
            <div className="space-y-1">
              {antipatterns.map((a, i) => (
                <div key={i} className="flex items-center gap-1.5 text-[10px]">
                  <span className="line-through text-red-500 bg-red-50 rounded px-1.5 py-0.5 border border-red-200 flex-1 truncate">{a.bad}</span>
                  <span className="text-emerald-500">→</span>
                  <span className="text-emerald-800 font-bold bg-emerald-50 rounded px-1.5 py-0.5 border border-emerald-200 flex-1 truncate">{a.good}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-yellow-50',  border: 'border-yellow-300',  text: 'text-amber-900',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (JavaScript 노랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      propagate:     { icon: '🧵', label: '에러 전파' },
      custom:        { icon: '🏷', label: '커스텀 에러' },
      async:         { icon: '⚡', label: '비동기·전역' },
      console:       { icon: '🖥', label: 'Console' },
      sources:       { icon: '🐞', label: 'Sources 디버깅' },
      observability: { icon: '📡', label: 'Sentry·소스맵' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.propagate;
      return (
        <div className="rounded-xl border border-yellow-400 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-amber-800 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>에러 추적·디버깅 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-amber-700 font-mono mb-3 px-2 py-1 rounded bg-yellow-50 border border-yellow-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'propagate' && <PropagateView stack={state.stack} errObj={state.errObj} />}
          {state.stage === 'custom' && <CustomErrorView classTree={state.classTree} branchTable={state.branchTable} />}
          {state.stage === 'async' && <AsyncView asyncPaths={state.asyncPaths} globalHandlers={state.globalHandlers} />}
          {state.stage === 'console' && <ConsoleView consoleLines={state.consoleLines} consoleTable={state.consoleTable} />}
          {state.stage === 'sources' && <SourcesView pausedLine={state.pausedLine} callStack={state.callStack} watch={state.watch} stepControls={state.stepControls} />}
          {state.stage === 'observability' && <ObservabilityView pipeline={state.pipeline} antipatterns={state.antipatterns} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-yellow-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#F7DF1E] text-black font-bold text-base border border-amber-300">JS</span>
              <div>
                <div className="inline-flex items-center gap-1.5 mb-1">
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-[#F7DF1E] text-black border border-amber-300">Ⅴ. 실무 투입</span>
                  <span className="text-[11px] font-mono text-amber-700">V-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-amber-800">에러 추적과 디버깅 (DevTools)</h1>
                <p className="text-sm text-amber-700/80">try/catch·에러 객체·전역 에러 핸들러와 크롬 DevTools로 버그를 빠르게 잡기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-amber-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#F7DF1E]' : 'bg-yellow-100'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-amber-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold border ${playing ? 'bg-amber-800 text-yellow-50 border-amber-800' : 'bg-[#F7DF1E] text-black border-amber-300 hover:bg-yellow-300'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-amber-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#F7DF1E] bg-white px-4 py-3 text-sm text-amber-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                throw는 호출 스택을 되감아 가장 가까운 <span className="font-mono">try/catch</span>를 찾고, <span className="font-mono">err.stack</span>이 원인 추적의 1순위 단서다. <span className="font-mono">class extends Error</span>로 커스텀 에러를 만들어 <span className="font-mono">instanceof</span>로 분기하고, 비동기 에러는 <span className="font-mono">async try/catch</span>·전역 <span className="font-mono">onerror</span>·<span className="font-mono">unhandledrejection</span>으로 잡는다.
                DevTools의 Console(레벨·table·group)로 빠르게 관찰하고, Sources의 브레이크포인트에서 멈춰 call stack·watch로 원인을 좁힌다. 프로덕션은 Sentry + 소스맵으로 추적한다.
                안티패턴 4종(silent fail·log만 사용·값 추측·핸들러/소스맵 미설정)을 피하고 재현→관찰→가설→검증으로 근본 원인을 잡아라. 다음 장 V-2-2에서는 성능 프로파일링을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['try/catch', 'finally', 'Error객체', 'stack', 'custom에러', 'instanceof', 'unhandledrejection', 'onerror', 'DevTools', 'console.table', '브레이크포인트', 'call스택', 'watch', 'debugger', 'Sentry', '소스맵'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-amber-800 border border-yellow-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-amber-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
