<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript 학습 — III-1-1. DOM 조작 API</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23F7DF1E'/><text x='2' y='13' font-size='9' font-weight='bold' fill='black'>JS</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    JavaScript III-1-1 — DOM 조작 API
    학습 목표: 노드 선택(querySelector·getElementById), 생성·삽입(createElement·append·
              DocumentFragment), 수정(textContent·innerHTML·classList·dataset), 삭제(remove)를
              단계별로 익히고, 리플로우/레이아웃 스래싱을 피하는 성능 습관과 innerHTML XSS를
              차단하는 안전 습관을 실무 수준으로 정리한다.
    패턴: fastapi v1 — 좌(LiveDataPane: DOM 트리 상자 시연 / 삽입 위치 / textContent vs innerHTML /
                       리플로우 카운트) 우(VSCode CodeViewer: 실전 DOM 조작 JS + 결과 주석)
    색상: JavaScript 노랑 #F7DF1E — 배경·형광펜엔 노랑, 글자·링크·배지 텍스트엔 앰버 다크 #a16207
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 선택 → 생성·삽입 → 수정 → 삭제 → 성능 → 안전
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 LiveDataPane 은 stage 값에 따라 DOM 트리를 서로 다르게 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      select: {lang:"javascript", filename:"select.js — 노드 선택", lines:[
        "// DOM 은 부모-자식 트리. CSS 선택자로 노드를 고른다",
        "const app = document.getElementById('app'); // id 조회 (가장 빠름)",
        "const first = document.querySelector('.item'); // 첫 매칭 1개",
        "const all = document.querySelectorAll('.item'); // 매칭 모두",
        "",
        "console.log(all.length); // 3",
        "console.log(all instanceof NodeList); // true (정적 스냅샷)",
        "",
        "// 자식·속성 선택자도 한 문법으로",
        "document.querySelector('.list > li.done');   // 직계 자식 중 .done",
        "document.querySelectorAll('input[type=text]'); // 속성 선택자",
        "",
        "// 함정: getElementsByClassName 은 실시간(live) 컬렉션",
        "const live = document.getElementsByClassName('item');",
        "for (let i = 0; i < live.length; i++) {",
        "  live[i].remove(); // 지우는 순간 length 가 줄어 인덱스가 밀린다!",
        "}",
        "// → 예측 가능한 querySelectorAll(정적 NodeList) 을 기본으로 쓴다",
      ]},
      insert: {lang:"javascript", filename:"insert.js — 생성과 삽입", lines:[
        "// 1) 노드를 만들고 내용을 채운다",
        "const li = document.createElement('li');",
        "li.textContent = '새 항목';   // 안전하게 텍스트 채우기",
        "li.classList.add('item');     // 클래스 부여",
        "",
        "// 2) 네 방향으로 삽입",
        "const list = document.querySelector('.list');",
        "list.append(li);    // 자식 맨 뒤",
        "list.prepend(li);   // 자식 맨 앞",
        "list.before(li);    // list 앞(형제)",
        "list.after(li);     // list 뒤(형제)",
        "",
        "// 3) 반복 삽입은 DocumentFragment 로 한 번에 (리플로우 1회)",
        "const frag = document.createDocumentFragment();",
        "for (const name of [\"A\", \"B\", \"C\"]) {",
        "  const item = document.createElement('li');",
        "  item.textContent = name;",
        "  frag.appendChild(item); // 화면 밖 임시 컨테이너에 모음",
        "}",
        "list.append(frag); // 실제 DOM 삽입은 이때 딱 한 번",
        "",
        "// 4) 마크업 문자열은 insertAdjacentHTML (신뢰된 값만!)",
        "list.insertAdjacentHTML('beforeend', '<li class=\"item\">D</li>');",
      ]},
      modify: {lang:"javascript", filename:"modify.js — 내용·속성·클래스 수정", lines:[
        "const el = document.querySelector('.item');",
        "",
        "// 1) 텍스트: 사용자 입력은 항상 textContent (안전)",
        "const userInput = '<img src=x onerror=\"steal()\">';",
        "el.textContent = userInput; // 태그가 아니라 글자 그대로 표시",
        "",
        "// 2) innerHTML 은 문자열을 HTML 로 파싱 → 실행된다",
        "el.innerHTML = userInput; // 💥 XSS! img 가 생성되고 onerror 실행",
        "// → innerHTML 은 개발자가 쓴 신뢰된 정적 마크업에만",

    const S1 = { title:"Step 1. 선택 — querySelector · querySelectorAll · getElementById", desc:"DOM은 HTML을 부모-자식으로 잇는 \"트리\"이고, 조작의 첫 걸음은 원하는 노드를 트리에서 골라내는 일이다. 실무 표준은 CSS 선택자를 그대로 쓰는 querySelector(첫 하나)와 querySelectorAll(모두)이다 — 클래스·자식·속성 선택자를 한 문법으로 다룰 수 있어 getElementById/getElementsByClassName처럼 API를 나눠 외울 필요가 없다. 단 성능이 극단적으로 중요한 반복문 안에서는 id 직접 조회인 getElementById가 여전히 가장 빠르다. 가장 자주 실수하는 지점은 반환 타입이다: querySelectorAll이 돌려주는 NodeList는 \"정적(static)\" 스냅샷이라 이후 DOM이 바뀌어도 갱신되지 않고, getElementsByClassName의 HTMLCollection은 \"실시간(live)\"이라 루프 도중 원소를 추가/삭제하면 무한 루프나 인덱스 밀림이 생긴다. 그래서 실무에서는 예측 가능한 정적 NodeList를 주는 querySelectorAll을 기본으로 쓴다.", stage:"select" };
    const S2 = { title:"Step 2. 생성·삽입 — createElement · append · insertAdjacentHTML", desc:"HTML 문자열을 innerHTML로 통째로 갈아끼우는 대신, 노드를 프로그램으로 만들어 원하는 자리에 꽂는 것이 안전하고 정확하다. createElement로 빈 요소를 만들고, textContent·classList로 내용과 스타일을 채운 뒤 위치 메서드로 붙인다. 위치는 네 방향으로 기억하면 된다 — append(자식 맨 뒤), prepend(자식 맨 앞), before(참조 노드 앞의 형제), after(참조 노드 뒤의 형제). 옛 appendChild와 달리 append/before/after는 여러 노드와 문자열을 한 번에 받고 반환값에 얽매이지 않아 실무에서 더 쓰기 좋다. 마크업을 문자열로 빠르게 꽂아야 할 땐 insertAdjacentHTML(position, html)이 편리하지만, 넣는 문자열에 사용자 입력이 섞이면 innerHTML과 똑같이 XSS 위험이 있으니 신뢰된 정적 마크업에만 쓴다. 핵심은 여러 노드를 반복 삽입할 때인데, 하나씩 append하면 매번 리플로우가 일어나므로 DocumentFragment(화면 밖 임시 컨테이너)에 모아 담고 마지막에 한 번만 붙여 리플로우를 1회로 줄인다.", stage:"insert" };
    const S3 = { title:"Step 3. 수정 — textContent(안전) vs innerHTML(XSS 위험)", desc:"노드의 내용을 바꾸는 방법은 두 갈래이고, 이 선택이 보안을 가른다. textContent는 넣는 값을 항상 \"글자 그대로\"의 텍스트로 취급한다 — <b>나 <img> 같은 문자열도 태그로 해석하지 않고 화면에 그 문자 그대로 보여주므로, 사용자 입력을 넣어도 스크립트가 실행될 수 없다. 반면 innerHTML은 넣는 문자열을 HTML로 \"파싱\"해 실제 요소를 만든다. 그래서 사용자가 입력한 <img src=x onerror=탈취코드> 같은 문자열이 innerHTML에 들어가면 그 코드가 실제로 실행된다(XSS). 규칙은 단순하다: 사용자 입력은 반드시 textContent로 넣고, innerHTML은 개발자가 작성한 신뢰된 정적 마크업에만 쓴다. 속성은 setAttribute(전용 값)나 요소 프로퍼티(el.id, el.href)로, data-* 커스텀 속성은 dataset으로 읽고 쓴다. 클래스는 문자열을 직접 이어붙이지 말고 classList.add/remove/toggle/contains로 다뤄 다른 클래스를 실수로 덮어쓰는 일을 막는다.", stage:"modify" };
    const S4 = { title:"Step 4. 삭제 — remove() 와 부모-자식 관계", desc:"노드를 지우는 현대적 방법은 지울 노드에서 바로 remove()를 호출하는 것이다 — 옛 방식인 parent.removeChild(child)는 부모 참조를 먼저 구해야 해서 번거로웠는데, remove()는 자기 자신을 트리에서 떼어내므로 코드가 짧고 실수가 적다. 한 가지 기억할 점은 DOM에서 노드를 제거해도 그 노드를 가리키는 자바스크립트 변수가 남아 있으면 객체 자체는 메모리에서 사라지지 않는다는 것이다(떼어낸 뒤 다시 붙일 수도 있다) — 그래서 등록해 둔 이벤트 리스너나 타이머가 남아 메모리 누수가 될 수 있으니, 재사용하지 않을 노드는 참조를 끊어 준다. 목록 전체를 비울 때 innerHTML = \"\"는 간단하지만 자식에 걸린 리스너 정리 없이 통째로 날려 미묘한 누수를 남길 수 있고, 반대로 while (el.firstChild) el.firstChild.remove()로 하나씩 지우면 명시적이다. 성능이 중요하면 el.replaceChildren()가 자식 전체를 한 번에 비우는 표준 방법이다.", stage:"remove" };
    const S5 = { title:"Step 5. 성능 — 리플로우 최소화 · 레이아웃 스래싱 회피", desc:"DOM 조작이 느려지는 진짜 원인은 자바스크립트가 아니라 브라우저의 \"리플로우(reflow)\"다 — 요소를 추가하거나 크기·위치를 바꾸면 브라우저가 레이아웃을 다시 계산하는데, 이게 반복문 안에서 매 순회마다 일어나면 비용이 눈덩이처럼 커진다. 1000개 항목을 하나씩 append하면 최악의 경우 리플로우가 1000번 일어나지만, DocumentFragment에 모아 마지막에 한 번 붙이면 리플로우는 1번이다 — 눈에 띄게 빨라진다. 두 번째 함정은 \"레이아웃 스래싱(layout thrashing)\"이다. offsetHeight·getBoundingClientRect 같은 레이아웃 값을 \"읽고\" 곧바로 스타일을 \"쓰고\" 다시 \"읽는\" 식으로 읽기와 쓰기를 번갈아 하면, 브라우저가 최신 값을 주려고 매번 강제로 리플로우를 실행한다. 해법은 읽기를 모두 먼저 한 뒤 쓰기를 몰아서 하는 \"읽기/쓰기 분리(batching)\"다. 정리하면, 삽입은 fragment로 묶고, 레이아웃 읽기와 스타일 쓰기는 단계를 나눠라 — 이 두 습관이 DOM 성능 문제의 대부분을 해결한다.", stage:"perf" };
    const S6 = { title:"Step 6. 실패 사례와 안전 습관", desc:"지금까지의 함정을 실무에서 자주 마주치는 세 가지 실패로 정리한다. ① innerHTML에 사용자 입력을 그대로 넣어 <img onerror>나 <script>가 실행되는 XSS — 해법은 사용자 입력을 textContent로 넣거나, 마크업이 꼭 필요하면 createElement로 조립하는 것이다. ② 루프마다 appendChild로 실제 DOM을 건드려 화면이 버벅이는 문제 — DocumentFragment로 모아 한 번에 붙인다. ③ querySelectorAll의 결과(NodeList)에 map·filter 같은 배열 메서드를 바로 부르려다 TypeError가 나는 문제 — NodeList는 배열이 아니라 유사 배열이라 forEach만 있고 map은 없다. Array.from(nodeList)나 스프레드 [...nodeList]로 진짜 배열로 바꾼 뒤 배열 메서드를 쓴다. 이 세 습관 — 사용자 입력엔 textContent, 반복 삽입엔 fragment, NodeList는 배열로 변환 — 만 지키면 DOM 조작에서 겪는 사고의 대부분이 사라진다. 다음 장 III-1-2에서는 이렇게 조작한 요소에 이벤트를 붙이고 위임(delegation)으로 관리하는 법을 다룬다.", stage:"safe" };

    // ─────────────────────────────────────────────────────
    const MARK_STYLE = {
      selected: 'bg-yellow-200 border-yellow-500 ring-2 ring-yellow-400 text-amber-900',
      new:      'bg-emerald-50 border-emerald-400 text-emerald-800',
      modified: 'bg-amber-100 border-amber-400 text-amber-900',
      removed:  'bg-red-50 border-red-300 text-red-500 line-through opacity-60',
      none:     'bg-white border-slate-200 text-slate-700',
    };

    function TreeNode({ node, depth }) {
      const cls = MARK_STYLE[node.mark] || MARK_STYLE.none;
      return (
        <div style={{ marginLeft: depth * 16 }}>
          <div className={`inline-flex items-center gap-1.5 rounded border px-2 py-1 my-0.5 text-[10px] font-mono ${cls}`}>
            <span className="text-amber-500">&lt;</span>
            <span className="font-bold">{node.tag}</span>
            {node.attr && <span className="text-sky-600">{node.attr}</span>}
            <span className="text-amber-500">&gt;</span>
            {node.text && <span className="text-slate-500 not-italic">{node.text}</span>}
            {node.mark === 'selected' && <span className="text-amber-700">✓ 매칭</span>}
            {node.mark === 'new' && <span className="text-emerald-600">＋ 새 노드</span>}
            {node.mark === 'removed' && <span className="no-underline text-red-500">✕</span>}
          </div>
          {node.children && node.children.map((c, i) => (
            <TreeNode key={i} node={c} depth={depth + 1} />
          ))}
        </div>
      );
    }

    function TreeBox({ title, tree }) {
      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
            <span>🌳</span><span>{title}</span>
          </div>
          {tree.map((n, i) => <TreeNode key={i} node={n} depth={0} />)}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 선택: 트리 + 선택자 결과표
    // ─────────────────────────────────────────────────────
    function SelectView({ tree, selectors }) {
      const TONE = { good: 'text-emerald-700', mid: 'text-amber-700', bad: 'text-red-600' };
      return (
        <div className="space-y-2">
          <TreeBox title='DOM 트리 — querySelectorAll(".item") 매칭 노드 강조' tree={tree} />
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">선택 API 별 결과·반환 타입</div>
            <div className="space-y-1">
              {selectors.map((s, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold text-slate-800 flex-1 truncate">{s.code}</span>
                  <span className="text-yellow-500">→</span>
                  <span className={`font-mono font-bold ${TONE[s.tone]}`}>{s.result}</span>
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">정적 NodeList = 조회 시점 스냅샷 · 실시간 HTMLCollection = DOM 변경에 따라 갱신(루프 함정)</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 삽입 위치 다이어그램 + 결과 트리
    // ─────────────────────────────────────────────────────
    function InsertView({ positions, insertTree }) {
      const find = (z) => positions.find((p) => p.zone === z);
      const Slot = ({ zone, inner }) => {
        const p = find(zone);
        const base = inner ? 'border-dashed border-emerald-400 bg-emerald-50 text-emerald-700'
                           : 'border-dashed border-amber-400 bg-yellow-50 text-amber-800';
        return (
          <div className={`rounded border px-2 py-1 text-[10px] font-mono flex items-center gap-2 ${base}`}>
            <span className="font-bold">{p.name}</span>
            <span className="text-[9px] ml-auto">{p.where}</span>
          </div>
        );
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
              <span>➕</span><span>참조 노드(ul.list) 기준 삽입 위치</span>
            </div>
            <div className="space-y-1">
              <Slot zone="outer-top" />
              <div className="rounded border-2 border-slate-300 bg-slate-50 p-1.5 space-y-1">
                <div className="text-[9px] font-mono text-slate-500 pl-1">&lt;ul class="list"&gt; 내부</div>
                <Slot zone="inner-top" inner />
                <div className="rounded border border-slate-200 bg-white px-2 py-1 text-[10px] font-mono text-slate-600">…기존 자식 li…</div>
                <Slot zone="inner-bottom" inner />
              </div>
              <Slot zone="outer-bottom" />
            </div>
          </div>
          <TreeBox title="append 결과 — 새 li 가 자식 맨 뒤에 삽입됨" tree={insertTree} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — textContent vs innerHTML + 속성/클래스
    // ─────────────────────────────────────────────────────
    function ModifyView({ userInput, modifyCompare, attrDemo }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-700 mb-2 flex items-center gap-1.5">
              <span>✏</span><span>같은 사용자 입력을 두 API 에 넣으면?</span>
            </div>
            <div className="rounded bg-slate-800 px-2 py-1 mb-2 font-mono text-[10px] text-yellow-200">
              입력: {userInput}
            </div>
            <div className="grid grid-cols-1 gap-1.5">
              {modifyCompare.map((m, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${m.safe ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[10px] font-bold text-slate-800">{m.api}</span>
                    <span className={`ml-auto text-[9px] px-1.5 py-0.5 rounded font-bold ${m.safe ? 'bg-emerald-200 text-emerald-800' : 'bg-red-200 text-red-800'}`}>{m.safe ? '안전' : 'XSS 위험'}</span>
                  </div>
                  <div className={`mt-1 text-[10px] font-mono ${m.safe ? 'text-emerald-700' : 'text-red-700 font-bold'}`}>→ {m.outcome}</div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{m.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">속성·클래스 — 전용 API 로 안전하게</div>
            <div className="space-y-1">
              {attrDemo.map((a, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold text-slate-800 flex-1">{a.code}</span>
                  <span className="text-yellow-500">→</span>
                  <span className="text-[9px] text-amber-700 font-mono">{a.desc}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 삭제: 트리(제거 표시)
    // ─────────────────────────────────────────────────────
    function RemoveView({ removeTree }) {
      return (
        <div className="space-y-2">
          <TreeBox title="remove() — 대상 노드가 트리에서 떨어져 나감" tree={removeTree} />
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5 text-[10px] text-slate-600 space-y-1">
            <div className="flex items-center gap-2"><span className="font-mono font-bold text-emerald-700">node.remove()</span><span className="text-[9px]">— 표준. 부모 참조 불필요, 자기 자신을 제거</span></div>
            <div className="flex items-center gap-2"><span className="font-mono text-slate-500 line-through">parent.removeChild(node)</span><span className="text-[9px]">— 옛 방식(호환용)</span></div>
            <div className="flex items-center gap-2"><span className="font-mono font-bold text-emerald-700">el.replaceChildren()</span><span className="text-[9px]">— 자식 전체 비우기(빠름·안전)</span></div>
            <div className="text-[9px] text-red-600 border-t border-yellow-100 pt-1 mt-1">⚠ DOM 에서 떼도 변수가 남으면 객체·리스너가 살아있어 누수가 될 수 있다</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 성능: 리플로우 카운트 + 스래싱 읽기/쓰기
    // ─────────────────────────────────────────────────────
    function PerfView({ reflow, thrash }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
              <span>⚡</span><span>리플로우 횟수 — 개별 삽입 vs Fragment</span>
            </div>
            <div className="space-y-2">
              {reflow.map((r, i) => (
                <div key={i}>
                  <div className="flex items-center justify-between text-[10px] mb-0.5">
                    <span className="font-mono text-slate-700">{r.label}</span>
                    <span className={`font-mono font-bold ${r.tone === 'bad' ? 'text-red-600' : 'text-emerald-700'}`}>리플로우 {r.count}회</span>
                  </div>
                  <div className="h-3 rounded bg-slate-100 overflow-hidden">
                    <div className={`h-full ${r.tone === 'bad' ? 'bg-red-400' : 'bg-emerald-400'}`} style={{ width: r.bar + '%' }} />
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">레이아웃 스래싱 — 읽기/쓰기 순서</div>
            <div className="grid grid-cols-2 gap-2">
              <div>
                <div className="text-[9px] font-bold text-red-600 mb-1">❌ 번갈아 (강제 리플로우)</div>
                <div className="space-y-0.5">
                  {thrash.bad.map((t, i) => (
                    <div key={i} className={`text-[9px] font-mono px-1.5 py-0.5 rounded ${t.startsWith('읽기') ? 'bg-sky-100 text-sky-800' : 'bg-red-100 text-red-700'}`}>{t}</div>
                  ))}
                </div>
              </div>
              <div>
                <div className="text-[9px] font-bold text-emerald-700 mb-1">✅ 읽기→쓰기 분리(batching)</div>
                <div className="space-y-0.5">
                  {thrash.good.map((t, i) => (
                    <div key={i} className={`text-[9px] font-mono px-1.5 py-0.5 rounded ${t.startsWith('읽기') ? 'bg-sky-100 text-sky-800' : 'bg-emerald-100 text-emerald-700'}`}>{t}</div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실패 사례 카드 + NodeList 배열 변환
    // ─────────────────────────────────────────────────────
    function SafeView({ traps, nodeListDemo }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2 flex items-center gap-1.5">
              <span>🛡</span><span>세 가지 실패 → 안전한 대안</span>
            </div>
            <div className="space-y-1.5">
              {traps.map((t, i) => (
                <div key={i} className="rounded border border-emerald-200 bg-emerald-50 px-2 py-1.5">
                  <div className="flex items-center gap-1.5 text-[10px] font-mono">
                    <span className="line-through text-red-500 bg-red-50 rounded px-1.5 py-0.5 border border-red-200">{t.bad}</span>
                    <span className="text-emerald-500">→</span>
                    <span className="text-emerald-800 font-bold bg-white rounded px-1.5 py-0.5 border border-emerald-300">{t.good}</span>
                  </div>
                  <div className="mt-0.5 text-[9px] text-slate-500">{t.why}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">NodeList 는 배열이 아니다 — 변환 후 배열 메서드</div>
            <div className="grid grid-cols-1 gap-1">
              {nodeListDemo.map((n, i) => (
                <div key={i} className={`flex items-center gap-2 rounded border px-2 py-1 text-[10px] ${n.ok ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-300'}`}>
                  <span className="font-mono font-bold text-slate-800 flex-1 truncate">{n.code}</span>
                  <span className={n.ok ? 'text-emerald-600' : 'text-red-500'}>{n.ok ? '✓' : '✕'}</span>
                  <span className="text-[9px] text-slate-500 w-32 text-right">{n.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-yellow-50',  border: 'border-yellow-300',  text: 'text-amber-900',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (JavaScript 노랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      select: { icon: '🔍', label: '노드 선택' },
      insert: { icon: '➕', label: '생성·삽입' },
      modify: { icon: '✏', label: '내용 수정' },
      remove: { icon: '🗑', label: '노드 삭제' },
      perf:   { icon: '⚡', label: '성능' },
      safe:   { icon: '🛡', label: '안전 습관' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.select;
      return (
        <div className="rounded-xl border border-yellow-400 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-amber-800 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>DOM 조작 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-amber-700 font-mono mb-3 px-2 py-1 rounded bg-yellow-50 border border-yellow-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'select' && <SelectView tree={state.tree} selectors={state.selectors} />}
          {state.stage === 'insert' && <InsertView positions={state.positions} insertTree={state.insertTree} />}
          {state.stage === 'modify' && <ModifyView userInput={state.userInput} modifyCompare={state.modifyCompare} attrDemo={state.attrDemo} />}
          {state.stage === 'remove' && <RemoveView removeTree={state.removeTree} />}
          {state.stage === 'perf' && <PerfView reflow={state.reflow} thrash={state.thrash} />}
          {state.stage === 'safe' && <SafeView traps={state.traps} nodeListDemo={state.nodeListDemo} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-yellow-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#F7DF1E] text-black font-bold text-base border border-amber-300">JS</span>
              <div>
                <div className="inline-flex items-center gap-1.5 mb-1">
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-[#F7DF1E] text-black border border-amber-300">Ⅲ. DOM과 이벤트</span>
                  <span className="text-[11px] font-mono text-amber-700">III-1-1</span>
                </div>
                <h1 className="text-2xl font-bold text-amber-800">DOM 조작 API</h1>
                <p className="text-sm text-amber-700/80">선택·생성·삽입·수정·삭제 — querySelector·createElement·append와 성능·XSS 주의</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-amber-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#F7DF1E]' : 'bg-yellow-100'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-amber-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold border ${playing ? 'bg-amber-800 text-yellow-50 border-amber-800' : 'bg-[#F7DF1E] text-black border-amber-300 hover:bg-yellow-300'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-amber-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#F7DF1E] bg-white px-4 py-3 text-sm text-amber-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                DOM은 트리이고, 조작은 <span className="font-mono">querySelector/All</span>로 고르고 → <span className="font-mono">createElement</span>·<span className="font-mono">append</span>로 붙이고 → <span className="font-mono">textContent</span>·<span className="font-mono">classList</span>로 고치고 → <span className="font-mono">remove()</span>로 지운다.
                성능은 <span className="font-mono">DocumentFragment</span>로 리플로우를 1회로 줄이고, 레이아웃 읽기/쓰기를 분리해 스래싱을 막는다.
                안전은 세 가지 — 사용자 입력은 <span className="font-mono">textContent</span>(innerHTML XSS 차단), 반복 삽입은 fragment, <span className="font-mono">NodeList</span>는 <span className="font-mono">Array.from/[...]</span>로 배열 변환. 다음 장 III-1-2에서 이벤트와 위임을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['querySelector', 'querySelectorAll', 'NodeList', 'createElement', 'append', 'DocumentFragment', 'insertAdjacentHTML', 'textContent', 'innerHTML', 'XSS', 'classList', 'dataset', 'remove', '리플로우', '레이아웃스래싱'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-amber-800 border border-yellow-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-amber-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
