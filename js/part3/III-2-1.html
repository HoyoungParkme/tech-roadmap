            '',

        code: {

          filename: 'read.js — FormData 로 폼 전체 읽기',
          lines: [
            '// ❌ 하나씩 긁기 — 지겹고 실수 나기 쉽다',

            '// 체크박스를 .value 로 읽으면 항상 "on" (함정!)',
            'const agree = document.querySelector("#agree").checked; // true/false',
            '',
            '// ✅ FormData 한 방에 — name 이 붙은 모든 필드 자동 수집',
            'const form = document.querySelector("#signup");',
            'const fd = new FormData(form);',
            '',
            'fd.get("email");          // "a@b.com"  개별 접근',

            'const data = Object.fromEntries(fd);',
            'console.log(data); // { email: "a@b.com", plan: "pro", agree: "on" }',
            '',
            '// ⚠ name 속성이 없는 필드는 FormData 에 안 잡힌다',
            '// <input name="email"> 처럼 name 을 꼭 붙일 것',

          highlight: [6, 7, 8, 10, 11, 12, 14, 15],
        },
      },
      {

        actor: '🚀 제출 버튼/Enter → 새로고침 없이 전송',
        stage: 'submit',
        stageLabel: 'form submit + preventDefault() + fetch',
        alert: { tone: 'danger', text: '제출은 버튼 click 이 아니라 form 의 submit 에 걸어라(Enter·접근성 포함). 리스너 첫 줄 e.preventDefault() 를 빼먹으면 fetch 도중 페이지가 새로고침된다. 그 뒤 FormData 로 모아 fetch 전송.' },
        code: {
          lang: 'javascript',
          filename: 'submit.js — 제출 가로채기 + fetch',
          lines: [
            'const form = document.querySelector("#signup");',
            '',
            '// ✅ click 이 아니라 form 의 submit 에 건다',
            '//    → 버튼 클릭 + Enter 키 + 접근성 도구까지 모두 커버',
            'form.addEventListener("submit", async (e) => {',
            '  e.preventDefault(); // ← 첫 줄! 기본 새로고침을 막는다',
            '',
            '  const fd = new FormData(form);',
            '  const data = Object.fromEntries(fd);',
            '',
            '  const res = await fetch("/api/signup", {',
            '    method: "POST",',
            '    headers: { "Content-Type": "application/json" },',
            '    body: JSON.stringify(data),',
            '  });',
            '',
            '  if (res.ok) {',
            '    form.reset();               // 입력칸 비우기',

      {

        desc: '폼 이벤트 버그는 대부분 같은 곳에서 반복된다. ① 제출을 버튼 click으로 처리 — 마우스 클릭은 되지만 입력칸에서 Enter를 누르면 아무 일도 안 일어나고, 접근성 도구와도 어긋난다. 반드시 form의 submit을 쓴다. ② change와 input 혼동 — 실시간 글자수·미리보기를 change에 걸면 포커스가 빠질 때까지 갱신이 안 돼 "멈춘 것처럼" 보인다. 실시간엔 input. ③ preventDefault() 누락 — SPA에서 submit을 가로채놓고 preventDefault를 빼면 fetch 도중 페이지가 새로고침되어 한 번 깜빡이고 실패한다. ④ 체크박스를 value로 읽기 — 항상 "on"이 나와 체크 여부 판단이 안 된다. checked로 읽어야 한다. 이 네 가지만 피하면 폼 이벤트의 실무 버그 대부분이 사라진다. 다음 장(III-2-2)에서는 이벤트 위임과 버블링/캡처로 넘어간다.',

        stageLabel: '실무에서 진짜 터지는 4가지 함정',
        pitfalls: [
          { bad: '버튼 click 으로 제출 처리', symptom: 'Enter 제출·접근성 안 됨', fix: 'form 의 submit 이벤트 사용' },
          { bad: '실시간 갱신을 change 에 걸기', symptom: '포커스 빠질 때까지 반응 없음', fix: '실시간엔 input 이벤트' },
          { bad: 'preventDefault() 누락', symptom: '한 번 깜빡이고 새로고침', fix: '리스너 첫 줄에서 호출' },
          { bad: '체크박스를 .value 로 읽기', symptom: '항상 "on" — 체크 판단 불가', fix: '.checked (true/false)' },
        ],
        alert: { tone: 'danger', text: '4대 함정: ①click 제출(→submit) ②change 실시간(→input) ③preventDefault 누락(→첫 줄 호출) ④체크박스 .value(→.checked). 다음 장 III-2-2에서 이벤트 위임·버블링을 다룬다.' },
        code: {
          lang: 'javascript',
          filename: 'pitfalls.js — 흔한 실패와 교정',
          lines: [
            '// ① 버튼 click 제출 → Enter·접근성 놓침',
            'btn.addEventListener("click", submit);      // ❌',
            'form.addEventListener("submit", submit);    // ✅',
            '',
            '// ② 실시간 갱신을 change 에 → 포커스 빠질 때까지 멈춤',
            'input.addEventListener("change", updateCount); // ❌ 늦음',
            'input.addEventListener("input",  updateCount); // ✅ 즉시',
            '',
            '// ③ preventDefault 누락 → fetch 중 새로고침',
            'form.addEventListener("submit", async (e) => {',
            '  // e.preventDefault();  ← 빼먹으면 페이지 리로드!  ❌',
            '  e.preventDefault();                             // ✅',
            '  await fetch("/api/x", { method: "POST" });',
            '});',
            '',
            '// ④ 체크박스를 value 로 → 항상 "on"',
            'const agree = checkbox.value;    // ❌ 항상 "on"',
            'const agree2 = checkbox.checked; // ✅ true / false',
          ],
          highlight: [1, 2, 3, 5, 6, 7, 11, 12, 16, 17],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 실제 동작하는 미니 폼 — input/change/submit/focus/blur 이벤트를 진짜로 받는다
    //   stage 에 따라 강조 안내가 달라지지만, 폼 자체는 실제로 동작한다.
    //   좌측 LiveDataPane 의 핵심 인터랙티브 위젯.
    // ─────────────────────────────────────────────────────
    function InteractiveMiniForm({ stage }) {
      const [values, setValues] = useState({ email: '', agree: false, plan: 'free' });
      const [log, setLog] = useState([]);
      const [submitted, setSubmitted] = useState(null);
      const timerRef = useRef(null);

      const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(values.email);
      const showEmailError = values.email.length > 0 && !emailOk;

      // 이벤트 로그에 한 줄 추가 (최근 6개만 유지)
      const pushLog = (type, detail, tone) => {
        setLog((prev) => [{ type, detail, tone, id: Date.now() + Math.random() }, ...prev].slice(0, 6));
      };

      // FormData 로 수집한 결과를 흉내내는 객체 (name 있는 필드 + 체크박스는 체크 시만)
      const collected = { email: values.email, plan: values.plan };
      if (values.agree) collected.agree = 'on';

      const onSubmit = (e) => {
        e.preventDefault(); // 기본 새로고침 차단 (SPA 패턴)
        pushLog('submit', 'preventDefault() → 새로고침 없이 전송', 'submit');
        setSubmitted({ ...collected, at: new Date().toLocaleTimeString('ko-KR') });
      };

      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
            <span>🧪</span><span>실제 동작하는 미니 폼 — 타이핑·선택·제출해 보세요</span>
          </div>
          <form onSubmit={onSubmit} className="space-y-2">
            {/* 텍스트: input / change / focus / blur 모두 발생 */}
            <div>
              <label className="text-[10px] font-bold text-slate-700 flex items-center gap-1">
                <span>email</span>
                <span className="font-mono text-[9px] text-slate-400">name="email"</span>
              </label>
              <input
                name="email"
                type="text"
                value={values.email}
                placeholder="a@b.com 을 입력해 보세요"
                onFocus={() => pushLog('focus', 'email 칸 진입', 'focus')}
                onBlur={() => pushLog('blur', 'email 칸 이탈', 'blur')}
                onChange={(e) => {
                  // React onChange = DOM 의 input 이벤트(매 입력)
                  setValues((v) => ({ ...v, email: e.target.value }));
                  pushLog('input', `value = "${e.target.value}"`, 'input');
                }}
                onBlurCapture={() => pushLog('change', `확정값 = "${values.email}"`, 'change')}
                className={`w-full mt-0.5 px-2 py-1 text-[11px] font-mono rounded border ${
                  showEmailError ? 'border-red-400 bg-red-50' : 'border-yellow-300 bg-yellow-50'} focus:outline-none focus:border-amber-500`}
              />
              {(stage === 'validate' || showEmailError) && (
                <div className="text-[9px] text-red-600 mt-0.5 h-3">
                  {showEmailError ? '올바른 이메일 형식이 아닙니다 (input 즉시 검증)' : ''}
                </div>
              )}
            </div>

            {/* 체크박스: change 는 클릭 즉시 / .checked 로 읽어야 함 */}
            <label className="flex items-center gap-1.5 text-[10px] text-slate-700">
              <input
                name="agree"
                type="checkbox"
                checked={values.agree}
                onChange={(e) => {
                  setValues((v) => ({ ...v, agree: e.target.checked }));
                  pushLog('change', `agree.checked = ${e.target.checked}`, 'change');
                }}
                className="accent-amber-500"
              />
              <span>약관 동의 <span className="font-mono text-[9px] text-slate-400">(.checked = {String(values.agree)})</span></span>
            </label>

            {/* 셀렉트: change 는 선택 즉시 발생 */}
            <div className="flex items-center gap-2">
              <label className="text-[10px] font-bold text-slate-700">plan</label>
              <select
                name="plan"
                value={values.plan}
                onChange={(e) => {
                  setValues((v) => ({ ...v, plan: e.target.value }));
                  pushLog('change', `plan = "${e.target.value}" (선택 즉시)`, 'change');
                }}
                className="text-[11px] font-mono px-2 py-1 rounded border border-yellow-300 bg-yellow-50 focus:outline-none"
              >
                <option value="free">free</option>
                <option value="pro">pro</option>
                <option value="team">team</option>
              </select>
              <button
                type="submit"
                className="ml-auto px-3 py-1 text-[11px] font-bold rounded bg-[#F7DF1E] text-black border border-amber-300 hover:bg-yellow-300"
              >제출 (또는 Enter)</button>
            </div>
          </form>

          {/* 실시간 수집 객체 (FormData 흉내) — read 단계에서 특히 강조 */}
          <div className={`mt-2 rounded border px-2 py-1.5 ${stage === 'read' ? 'border-amber-400 bg-yellow-50' : 'border-yellow-200 bg-yellow-50/60'}`}>
            <div className="text-[9px] font-bold text-amber-800 mb-0.5">📦 new FormData(form) → Object.fromEntries</div>
            <pre className="text-[10px] font-mono text-slate-800 whitespace-pre-wrap">{JSON.stringify(collected, null, 1)}</pre>
          </div>

          {/* 이벤트 로그 — events 단계에서 특히 강조 */}
          <div className="mt-2">
            <div className="text-[9px] font-bold text-amber-800 mb-0.5">🧾 이벤트 로그 (최근 6개, 최신이 위)</div>
            <div className="space-y-0.5 min-h-[1.5rem]">
              {log.length === 0 && <div className="text-[9px] text-slate-400">폼을 조작하면 이벤트가 여기 쌓입니다…</div>}
              {log.map((e) => (
                <div key={e.id} className="flex items-center gap-1.5 text-[9px]">
                  <span className={`font-mono font-bold px-1 rounded ${EVENT_TONE[e.tone]}`}>{e.type}</span>
                  <span className="text-slate-600 font-mono truncate">{e.detail}</span>
                </div>
              ))}
            </div>
          </div>

          {/* 제출 결과 — submit 단계 데모 */}
          {submitted && (
            <div className="mt-2 rounded border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-[9px] text-emerald-800">
              <span className="font-bold">✅ 제출됨 (새로고침 없음, {submitted.at})</span>
              <span className="font-mono block mt-0.5">{JSON.stringify(collected)}</span>
            </div>
          )}
        </div>
      );
    }

    const EVENT_TONE = {
      focus:  'bg-sky-100 text-sky-800',
      input:  'bg-yellow-200 text-amber-900',
      change: 'bg-violet-100 text-violet-800',
      blur:   'bg-slate-200 text-slate-700',
      submit: 'bg-emerald-100 text-emerald-800',
    };

    // ─────────────────────────────────────────────────────
    // Step 1 부가 — 이벤트 발생 시점 표 (미니 폼 아래에 함께 표시)
    // ─────────────────────────────────────────────────────
    function TimingTableView({ timing }) {
      return (
        <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-amber-800 mb-1.5">⏱ 이벤트별 "언제 터지나" 요약</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-amber-800 border-b border-yellow-200">
                <th className="text-left py-0.5">이벤트</th>
                <th className="text-left py-0.5">발생 시점</th>
                <th className="text-left py-0.5">주 용도</th>
              </tr>
            </thead>
            <tbody>
              {timing.map((r, i) => (
                <tr key={i} className="border-t border-yellow-100 align-top">
                  <td className="py-1 pr-1"><span className={`font-mono font-bold px-1 rounded ${EVENT_TONE[r.ev]}`}>{r.ev}</span></td>
                  <td className="py-1 pr-1 text-slate-700">{r.when}</td>
                  <td className="py-1 text-slate-500 text-[9px]">{r.use}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실패 사례 카드
    // ─────────────────────────────────────────────────────
    function PitfallsView({ pitfalls }) {
      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
            <span>🚨</span><span>실무에서 진짜 터지는 4가지 — 증상 → 해법</span>
          </div>
          <div className="space-y-1.5">
            {pitfalls.map((p, i) => (
              <div key={i} className="rounded border border-red-200 bg-red-50 px-2 py-1.5">
                <div className="flex items-center gap-1.5">
                  <span className="text-[9px] font-bold text-red-700 bg-red-100 rounded px-1">{i + 1}</span>
                  <span className="text-[10px] font-bold text-slate-800 line-through decoration-red-400">{p.bad}</span>
                </div>
                <div className="mt-0.5 flex items-center gap-1.5 text-[9px]">
                  <span className="text-red-600">증상: {p.symptom}</span>
                  <span className="text-emerald-500">▶</span>
                  <span className="text-emerald-800 font-bold bg-white rounded px-1.5 py-0.5 border border-emerald-300">{p.fix}</span>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500 border-t border-yellow-100 pt-1.5">이 4가지만 피하면 폼 이벤트 실무 버그의 대부분이 사라진다. 다음 장 → III-2-2. 이벤트 위임·버블링.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-yellow-50',  border: 'border-yellow-300',  text: 'text-amber-900',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (JavaScript 노랑 톤)
    //   events/read/submit/validate 는 실제 동작하는 미니 폼을 공유한다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      events:   { icon: '🖱', label: '이벤트 시점' },
      read:     { icon: '📦', label: '값 읽기·FormData' },
      submit:   { icon: '🚀', label: 'submit 가로채기' },
      validate: { icon: '✅', label: '실시간 검증' },
      pitfalls: { icon: '🚨', label: '실패 사례' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.events;
      const showForm = state.stage !== 'pitfalls';
      return (
        <div className="rounded-xl border border-yellow-400 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-amber-800 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>폼 이벤트 실전 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-amber-700 font-mono mb-3 px-2 py-1 rounded bg-yellow-50 border border-yellow-200">
            현재 단계: {state.stageLabel}
          </div>
          <div className="space-y-2">
            {showForm && <InteractiveMiniForm stage={state.stage} />}
            {state.stage === 'events' && <TimingTableView timing={state.timing} />}
            {state.stage === 'pitfalls' && <PitfallsView pitfalls={state.pitfalls} />}
          </div>
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-yellow-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#F7DF1E] text-black font-bold text-base border border-amber-300">JS</span>
              <div>
                <div className="inline-flex items-center gap-1.5 mb-1">
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-[#F7DF1E] text-black border border-amber-300">Ⅲ. DOM과 이벤트</span>
                  <span className="text-[11px] font-mono text-amber-700">III-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-amber-800">폼 이벤트 실전</h1>
                <p className="text-sm text-amber-700/80">input·change·submit·focus 이벤트와 JS로 폼 값 읽기·검증·제출 가로채기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-amber-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#F7DF1E]' : 'bg-yellow-100'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-amber-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold border ${playing ? 'bg-amber-800 text-yellow-50 border-amber-800' : 'bg-[#F7DF1E] text-black border-amber-300 hover:bg-yellow-300'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-amber-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 왼쪽 폼은 실제로 동작합니다</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#F7DF1E] bg-white px-4 py-3 text-sm text-amber-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                <span className="font-mono">input</span> 은 매 입력마다, <span className="font-mono">change</span> 는 값이 확정될 때(텍스트=blur / 체크·셀렉트=선택 즉시) 터진다 — 실시간 검증은 input, 최종 검증은 blur.
                값은 하나씩 긁지 말고 <span className="font-mono">new FormData(form)</span> 로 한 번에 모으고(체크박스는 <span className="font-mono">.checked</span>), SPA 제출은 <span className="font-mono">form.submit</span> 에 걸어 <span className="font-mono">e.preventDefault()</span> 로 새로고침을 막고 fetch 로 보낸다.
                4대 함정(click 제출·change 실시간·preventDefault 누락·체크박스 value)만 피하면 된다. 다음 장 III-2-2에서는 이벤트 위임·버블링을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['input', 'change', 'submit', 'focus', 'blur', 'FormData', 'preventDefault', 'checked', '실시간검증', '디바운스', 'reset', 'fetch'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-amber-800 border border-yellow-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-amber-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
