          { name: '스로틀', how: '마지막 실행 시각을 캡처, 주기당 1회로 제한', ex: '스크롤 → 100ms마다', tone: 'mid' },
        ],
        alert: { tone: 'good', text: '핵심 정리: 함수는 태어난 환경을 기억한다(클로저). 이 성질이 캡슐화·팩토리·디바운스/스로틀·이벤트 핸들러를 떠받친다. 다음 장 I-2-1에서 실행 컨텍스트와 this 를 해부한다.' },
        code: {
          lang: 'javascript',
          filename: 'patterns.js — 실무 클로저',
          lines: [
            '// 1) 데이터 은닉 (모듈 패턴)',
            'function createStore() {',
            '  let state = 0;             // 밖에서 못 건드림',
            '  return {',
            '    get: () => state,',
            '    set: (v) => { state = v; },',
            '  };',
            '}',
            '',
            '// 2) 팩토리 — 설정을 캡처',
            'const makeAdder = (base) => (n) => n + base;',
            'const add10 = makeAdder(10);',
            'add10(5); // 15',
            '',
            '// 3) 디바운스 — 마지막 타이머만 살린다',
            'function debounce(fn, ms) {',
            '  let timer;                 // 클로저에 보관',
            '  return (...args) => {',
            '    clearTimeout(timer);',
            '    timer = setTimeout(() => fn(...args), ms);',
            '  };',
            '}',
            '',
            'const onSearch = debounce((q) => fetchApi(q), 300);',
          ],
          highlight: [2, 3, 4, 11, 16, 17, 18, 19, 20],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 함수 정의 3방식 비교 표
    // ─────────────────────────────────────────────────────
    function DefineView({ defs }) {
      const TONE = {
        best: 'bg-[#F7DF1E]/25 border-amber-500',
        good: 'bg-white border-amber-300',
        mid:  'bg-white border-amber-200',
      };
      return (
        <div className="space-y-2">
          {defs.map((d, i) => (
            <div key={i} className={`rounded-lg border-2 p-3 ${TONE[d.tone]}`}>
              <div className="flex items-center justify-between mb-1.5">
                <span className="text-sm font-bold text-[#a16207]">{d.kind}</span>
                <code className="text-[10px] font-mono text-slate-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">{d.sig}</code>
              </div>
              <div className="grid grid-cols-3 gap-1.5 text-[10px]">
                <div className="rounded bg-amber-50 border border-amber-200 px-1.5 py-1">
                  <div className="text-[9px] text-slate-500">호이스팅</div>
                  <div className="font-bold text-slate-700">{d.hoist}</div>
                </div>
                <div className="rounded bg-amber-50 border border-amber-200 px-1.5 py-1">
                  <div className="text-[9px] text-slate-500">this / arguments</div>
                  <div className="font-bold text-slate-700">{d.thisArg}</div>
                </div>
                <div className="rounded bg-amber-50 border border-amber-200 px-1.5 py-1">
                  <div className="text-[9px] text-slate-500">언제</div>
                  <div className="font-bold text-slate-700">{d.use}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 스코프 체인 (중첩 프레임 + 탐색 화살표)
    // ─────────────────────────────────────────────────────
    function ScopeView({ scope }) {
      // frames[0] = global(가장 바깥) → 안쪽으로 중첩. 탐색은 inner(마지막)에서 시작해 위로.
      const innerIdx = scope.frames.length - 1;
      const resolvedIdx = scope.frames.findIndex((f) => f.hasTarget);
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-amber-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#a16207] mb-2">
              🔗 스코프 프레임 — <code className="bg-[#F7DF1E]/30 px-1 rounded">{scope.lookup}</code> 를 찾는 여정
            </div>
            {/* 중첩된 프레임: global이 가장 바깥, 뒤로 갈수록 안쪽 */}
            {scope.frames.reduce((acc, f, i) => {
              const isTarget = f.hasTarget;
              const isStart = i === innerIdx;
              const inner = (
                <div className={`rounded-lg border-2 p-2 ${isTarget ? 'border-emerald-400 bg-emerald-50' : 'border-amber-300 bg-amber-50'}`}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[11px] font-mono font-bold text-[#a16207]">{f.name}</span>
                    {isStart && <span className="text-[9px] text-slate-500">← 탐색 시작</span>}
                    {isTarget && <span className="text-[9px] font-bold text-emerald-700">✓ 여기서 발견!</span>}
                    {!isTarget && !isStart && i > resolvedIdx && <span className="text-[9px] text-red-500">✗ 없음 → 위로</span>}
                  </div>
                  <div className="flex flex-wrap gap-1 mb-1.5">
                    {f.vars.map((v, k) => (
                      <code key={k} className={`text-[10px] font-mono px-1.5 py-0.5 rounded border ${isTarget ? 'bg-emerald-100 border-emerald-300 text-emerald-900' : 'bg-white border-amber-200 text-slate-700'}`}>{v}</code>
                    ))}
                  </div>
                  {acc}
                </div>
              );
              return inner;
            }, null)}
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5 text-[10px] text-[#a16207]">
            <span className="font-bold">탐색 방향 ↑ </span>{scope.note}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 클로저 카운터 (캡처된 환경 + 호출 타임라인)
    // ─────────────────────────────────────────────────────
    function ClosureView({ closure }) {
      const last = closure.calls[closure.calls.length - 1];
      return (
        <div className="space-y-2">
          {/* 캡처된 환경 상자 */}
          <div className="rounded-lg border-2 border-amber-400 bg-[#F7DF1E]/15 p-3">
            <div className="text-[11px] font-bold text-[#a16207] mb-1.5">📦 클로저가 붙든 환경 (살아있음)</div>
            <div className="flex items-center gap-2">
              <code className="text-xs font-mono px-2 py-1 rounded bg-white border-2 border-amber-400 text-[#a16207] font-bold">
                {closure.captured} = {last.after}
              </code>
              <span className="text-[10px] text-slate-500">← 호출마다 이 변수 하나가 증가</span>
            </div>
          </div>
          {/* 호출 타임라인 */}
          <div className="rounded-lg border-2 border-amber-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#a16207] mb-2">⏱ next() 호출 타임라인</div>
            <div className="space-y-1.5">
              {closure.calls.map((c, i) => (
                <div key={i} className="flex items-center gap-2 text-[11px]">
                  <span className="font-mono text-slate-500 w-16">next() #{c.n}</span>
                  <code className="font-mono px-1.5 py-0.5 rounded bg-amber-50 border border-amber-200 text-slate-600">{closure.captured}={c.before}</code>
                  <span className="text-amber-500 font-bold">+1 →</span>
                  <code className="font-mono px-1.5 py-0.5 rounded bg-[#F7DF1E]/30 border border-amber-400 text-[#a16207] font-bold">{closure.captured}={c.after}</code>
                  <span className="ml-auto text-[10px] text-emerald-700 font-bold">반환 {c.after}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5 text-[10px] text-[#a16207]">
            {closure.note}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — for+var+setTimeout 함정 (var vs let 비교 타임라인)
    // ─────────────────────────────────────────────────────
    function TrapView({ trap }) {
      const Cell = ({ v, bad }) => (
        <span className={`w-8 h-8 flex items-center justify-center rounded font-mono font-bold text-sm border-2 ${bad ? 'bg-red-50 border-red-300 text-red-700' : 'bg-emerald-50 border-emerald-300 text-emerald-800'}`}>{v}</span>
      );
      return (
        <div className="space-y-2">
          {/* var: 하나의 i 공유 */}
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1.5">😱 var — i 하나를 3개 콜백이 공유</div>
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[10px] text-slate-500">공유 변수</span>
              <code className="text-xs font-mono px-2 py-1 rounded bg-red-50 border-2 border-red-300 text-red-700 font-bold">var i = {trap.shared}</code>
              <span className="text-[10px] text-slate-500">← 루프 끝난 뒤 최종값</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-slate-500 w-14">출력</span>
              {trap.varOut.map((v, i) => <Cell key={i} v={v} bad />)}
            </div>
          </div>
          {/* let: 반복마다 새 바인딩 */}
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-700 mb-1.5">✅ let — 반복마다 새 j 바인딩</div>
            <div className="flex items-center gap-1.5 mb-2">
              {trap.letOut.map((v, i) => (
                <code key={i} className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-emerald-50 border border-emerald-300 text-emerald-800">j#{i}={v}</code>
              ))}
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-slate-500 w-14">출력</span>
              {trap.letOut.map((v, i) => <Cell key={i} v={v} />)}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5 text-[10px] text-[#a16207]">
            {trap.note}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 클로저 패턴 표
    // ─────────────────────────────────────────────────────
    function PracticalView({ patterns }) {
      const DOT = { best: 'bg-[#F7DF1E]', good: 'bg-emerald-400', mid: 'bg-amber-400' };
      return (
        <div className="space-y-2">
          {patterns.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-amber-300 bg-white p-3">
              <div className="flex items-center gap-2 mb-1">
                <span className={`w-2.5 h-2.5 rounded-full ${DOT[p.tone]}`}></span>
                <span className="text-sm font-bold text-[#a16207]">{p.name}</span>
              </div>
              <div className="text-[11px] text-slate-700 mb-1.5">{p.how}</div>
              <code className="text-[10px] font-mono px-2 py-1 rounded bg-[#F7DF1E]/20 border border-amber-300 text-[#a16207] inline-block">{p.ex}</code>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-[#a16207]',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',   text: 'text-[#a16207]',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (JS 노랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      define:    { icon: '🧩', label: '함수 정의' },
      scope:     { icon: '🔗', label: '스코프 체인' },
      closure:   { icon: '📦', label: '클로저 캡처' },
      trap:      { icon: '⏱', label: 'var 함정' },
      practical: { icon: '🛠', label: '실무 패턴' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.define;
      return (
        <div className="rounded-xl border border-amber-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#a16207] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>함수·스코프·클로저 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#a16207] font-mono mb-3 px-2 py-1 rounded bg-amber-50 border border-amber-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'define' && <DefineView defs={state.defs} />}
          {state.stage === 'scope' && <ScopeView scope={state.scope} />}
          {state.stage === 'closure' && <ClosureView closure={state.closure} />}
          {state.stage === 'trap' && <TrapView trap={state.trap} />}
          {state.stage === 'practical' && <PracticalView patterns={state.patterns} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-[#F7DF1E]/20 border-l-2 border-[#F7DF1E] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#F7DF1E] text-[#a16207] font-bold text-sm border border-amber-400">JS</span>
              <div>
                <div className="text-[11px] font-bold text-[#a16207]">Ⅰ. 언어 코어 · I-1-2</div>
                <h1 className="text-2xl font-bold text-[#a16207]">함수와 스코프·클로저</h1>
                <p className="text-sm text-slate-600">함수 정의 방식·스코프 체인·클로저가 상태를 기억하는 원리와 실무 활용</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#a16207] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#F7DF1E]' : 'bg-amber-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#a16207] text-amber-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-amber-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-[#a16207] hover:bg-amber-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-[#a16207] hover:bg-amber-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold border border-amber-500 ${playing ? 'bg-[#a16207] text-white' : 'bg-[#F7DF1E] text-[#a16207] hover:bg-yellow-300'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-[#a16207] hover:bg-amber-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-amber-500 bg-white px-4 py-3 text-sm text-[#a16207]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                함수는 선언식·표현식·화살표로 만들고, 화살표는 렉시컬 this라 콜백엔 좋지만 메서드엔 부적합하다.
                변수는 스코프 체인을 따라 안에서 밖으로 찾으며(렉시컬), 클로저는 함수가 태어난 환경을 붙들어 상태를 기억한다.
                for+var+setTimeout이 3,3,3을 찍는 함정은 var의 함수 스코프 때문이고 let·IIFE로 해결한다.
                이 성질을 은닉·팩토리·디바운스/스로틀에 매일 쓴다. 다음 장 I-2-1에서 실행 컨텍스트와 this를 해부한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['함수정의', '호이스팅', '화살표함수', '렉시컬스코프', '스코프체인', '클로저', '캡처', 'var함정', 'IIFE', '디바운스', '모듈패턴'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-amber-100 text-[#a16207] border border-amber-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#a16207]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
