    // ─────────────────────────────────────────────────────
    // Step 1 — 프로토타입 체인 상자·화살표 + 탐색 하이라이트
    // ─────────────────────────────────────────────────────
    function ChainLookupView({ chain, lookups }) {
      const [sel, setSel] = useState(1);
      const active = lookups[sel];
      const foundAt = active.foundAt; // -1 이면 못 찾음
      const reach = foundAt === -1 ? chain.length - 1 : foundAt; // 탐색이 도달한 마지막 노드

      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
              <span>🔗</span><span>프로토타입 체인 — dog.{active.prop} 탐색</span>
            </div>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {lookups.map((lk, i) => (
                <button
                  key={i}
                  onClick={() => setSel(i)}
                  className={`px-2 py-0.5 rounded text-[10px] font-mono border ${
                    i === sel ? 'bg-[#F7DF1E] text-black border-amber-400 font-bold' : 'bg-yellow-50 text-amber-800 border-yellow-200'}`}
                >dog.{lk.prop}</button>
              ))}
            </div>
            <div className="space-y-0">
              {chain.map((node, i) => {
                const traversed = i <= reach;        // 탐색 경로에 포함
                const isFound = i === foundAt;        // 발견 지점
                const has = node.props.includes(active.prop);
                return (
                  <React.Fragment key={i}>
                    <div className={`rounded border-2 px-2.5 py-1.5 transition ${
                      isFound ? 'bg-emerald-50 border-emerald-400'
                      : traversed ? 'bg-yellow-100 border-yellow-400'
                      : 'bg-white border-slate-200 opacity-60'}`}>
                      <div className="flex items-center gap-2">
                        <span className="font-mono text-[11px] font-bold text-slate-800">{node.label}</span>
                        <span className="text-[9px] text-slate-500">{node.sub}</span>
                        {isFound && <span className="ml-auto text-[9px] px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-800 font-bold">✓ 발견</span>}
                        {traversed && !isFound && i < chain.length - 1 && <span className="ml-auto text-[9px] px-1.5 py-0.5 rounded bg-red-100 text-red-600">없음 ↑</span>}
                      </div>
                      {node.props.length > 0 && (
                        <div className="mt-1 flex flex-wrap gap-1">
                          {node.props.map((p) => (
                            <span key={p} className={`text-[9px] font-mono px-1 rounded ${
                              p === active.prop && has ? 'bg-emerald-200 text-emerald-900 font-bold' : 'bg-slate-100 text-slate-600'}`}>{p}</span>
                          ))}
                        </div>
                      )}
                    </div>
                    {i < chain.length - 1 && (
                      <div className={`text-center text-xs leading-tight ${i < reach ? 'text-yellow-500' : 'text-slate-300'}`}>
                        <span className="font-mono text-[9px]">__proto__</span> ▼
                      </div>
                    )}
                  </React.Fragment>
                );
              })}
            </div>
            <div className={`mt-2 text-[10px] px-2 py-1 rounded border ${
              foundAt === -1 ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
              {foundAt === -1 ? '💥 ' : '→ '}{active.note}
            </div>
          </div>
        </div>
      );
    }

          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1">🔁 메서드 오버라이드</div>
            <div className="flex items-center gap-2 text-[10px]">
              <span className="font-mono font-bold text-slate-800">{override.call}</span>
              <span className="text-yellow-500">→</span>
              <span className="font-mono px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">{override.found}</span>
            </div>
            <div className="mt-1 text-[9px] text-slate-500">{override.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실패 사례 카드
    // ─────────────────────────────────────────────────────
    function TrapsView({ traps, rule }) {
      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
            <span>💣</span><span>프로토타입 오해가 만드는 버그</span>
          </div>
          <div className="space-y-1.5">
            {traps.map((t, i) => (
              <div key={i} className="rounded border border-red-200 bg-red-50 px-2 py-1.5">
                <div className="flex items-center gap-2">
                  <span className="text-[9px] px-1 rounded bg-red-200 text-red-800 font-bold">❌</span>
                  <span className="font-mono text-[10px] font-bold text-slate-800">{t.bad}</span>
                </div>
                <div className="mt-0.5 text-[9px] text-red-700">증상: {t.symptom}</div>
                <div className="mt-0.5 text-[9px] text-amber-800">이유: {t.why}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] font-bold text-emerald-800 border-t border-yellow-100 pt-2 flex items-center gap-1.5">
            <span>✅ 규칙</span>
            <span className="font-normal text-emerald-700">{rule}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 정리 규칙 카드 + 자가점검표
    // ─────────────────────────────────────────────────────
    function SafeView({ rules, checks }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">🎯 핵심 5규칙</div>
            <div className="space-y-1.5">
              {rules.map((r, i) => (
                <div key={i} className="rounded border border-emerald-200 bg-emerald-50 px-2 py-1.5">
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold text-emerald-900">{i + 1}. {r.title}</span>
                    <span className="ml-auto font-mono text-[10px] font-bold text-emerald-800 bg-white rounded px-1.5 py-0.5 border border-emerald-300">{r.good}</span>
                  </div>
                  <div className="mt-0.5 text-[9px] text-slate-500">{r.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">✅ 자가 점검 — 즉시 답할 수 있는가</div>
            <table className="w-full text-[10px]">
              <tbody>
                {checks.map((c, i) => (
                  <tr key={i} className="border-t border-yellow-100">
                    <td className="py-1 pr-2 text-slate-700">{c.q}</td>
                    <td className="py-1 text-right font-mono font-bold text-amber-800">{c.a}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-yellow-50',  border: 'border-yellow-300',  text: 'text-amber-900',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (JavaScript 노랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      chain:   { icon: '🔗', label: '프로토타입 체인' },
      ctor:    { icon: '🧭', label: 'prototype/__proto__' },
      sugar:   { icon: '🍬', label: 'class 문법 설탕' },
      extends: { icon: '🧬', label: 'extends·instanceof' },
      traps:   { icon: '💣', label: '실패 사례' },
      safe:    { icon: '🎯', label: '정리' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.chain;
      return (
        <div className="rounded-xl border border-yellow-400 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-amber-800 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>프로토타입과 class — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-amber-700 font-mono mb-3 px-2 py-1 rounded bg-yellow-50 border border-yellow-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'chain' && <ChainLookupView chain={state.chain} lookups={state.lookups} />}
          {state.stage === 'ctor' && <CtorRelView rel={state.rel} />}
          {state.stage === 'sugar' && <SugarMapView mapping={state.mapping} />}
          {state.stage === 'extends' && <ExtendsView extChain={state.extChain} instOf={state.instOf} override={state.override} />}
          {state.stage === 'traps' && <TrapsView traps={state.traps} rule={state.rule} />}
          {state.stage === 'safe' && <SafeView rules={state.rules} checks={state.checks} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-yellow-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#F7DF1E] text-black font-bold text-base border border-amber-300">JS</span>
              <div>
                <div className="inline-flex items-center gap-1.5 mb-1">
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-[#F7DF1E] text-black border border-amber-300">Ⅰ. 언어 코어</span>
                  <span className="text-[11px] font-mono text-amber-700">I-2-2</span>
                </div>
                <h1 className="text-2xl font-bold text-amber-800">프로토타입과 class</h1>
                <p className="text-sm text-amber-700/80">프로토타입 체인이 상속을 구현하는 원리와 class 문법이 그 위에 놓인 설탕임을 이해</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-amber-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#F7DF1E]' : 'bg-yellow-100'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-amber-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold border ${playing ? 'bg-amber-800 text-yellow-50 border-amber-800' : 'bg-[#F7DF1E] text-black border-amber-300 hover:bg-yellow-300'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-amber-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#F7DF1E] bg-white px-4 py-3 text-sm text-amber-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                프로퍼티 읽기는 <span className="font-mono">자신 → __proto__ → null</span>까지 올라가는 체인 탐색이고, 이 탐색 하나가 JS 상속의 전부다. <span className="font-mono">new C().__proto__ === C.prototype</span> 등식만 기억하면 prototype·__proto__ 혼동이 사라진다.
                <span className="font-mono">class</span>는 이 프로토타입 배치를 감싼 문법 설탕 — 메서드는 프로토타입에, <span className="font-mono">this.x</span>는 인스턴스에, static은 생성자에, <span className="font-mono">#</span>는 private.
                <span className="font-mono">extends</span>는 체인을 연장하고 <span className="font-mono">instanceof</span>는 그 체인을 검사한다. 실무 규칙은 하나 — 상태는 <span className="font-mono">this</span>에, 행동(메서드)은 프로토타입에. 다음 장 II-1-1에서 이벤트 루프·비동기를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['프로토타입', '__proto__', 'prototype', '체인', 'Object.create', 'class', 'constructor', 'extends', 'super', 'static', 'private', 'instanceof', '오버라이드'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-amber-800 border border-yellow-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-amber-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
