  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    JavaScript I-1-1 — 변수·타입·형변환의 함정
    학습 목표: var/let/const의 스코프·TDZ, 원시 7타입과 typeof의 함정,
              암묵적 형변환(==·+·truthy)이 만드는 버그를 단계별로 추적하고
              항상 ===·명시적 변환·??로 회피하는 실무 습관을 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: 스코프 타임라인 / 타입 그리드 / 강제변환 스텝 시뮬레이션)
                       우(VSCode CodeViewer: 실전 JS 코드 + 콘솔 출력 주석)
    색상: JavaScript 노랑 #F7DF1E — 배경·형광펜엔 노랑, 글자·링크·배지 텍스트엔 앰버 다크 #a16207
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 선언 → 타입 → 동등비교 → 연산자/truthy → 함정 → 안전코드
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. var를 버리는 이유 — 스코프·호이스팅·TDZ',
        desc: 'var는 블록(`{}`)을 무시하고 함수 전체를 스코프로 삼는다. 게다가 선언이 함수 맨 위로 "끌어올려져(호이스팅)" 값을 넣기 전에 써도 에러 대신 undefined가 나온다 — 오타나 순서 실수가 조용히 undefined 버그로 이어진다. let/const는 블록 스코프라서 `{}` 밖에서 안 보이고, 선언 전 구간을 TDZ(Temporal Dead Zone)로 막아 미리 쓰면 ReferenceError로 즉시 잡아준다. 실무 사례: for 루프에서 var i로 콜백을 등록하면 모든 콜백이 마지막 i 값을 공유해 "0,1,2" 대신 "3,3,3"이 찍힌다 — let i로 바꾸면 반복마다 새 바인딩이 생겨 해결된다. 그래서 현대 코드는 기본 const, 재할당이 필요할 때만 let, var는 쓰지 않는다.',
        actor: '⏱ 실행 타임라인 · var(함수) vs let/const(블록·TDZ)',
        stage: 'scope',
        stageLabel: '선언 키워드별 접근 가능 구간',
        timeline: [
          { line: 'console.log(v)', v: 'undefined', l: '💥 TDZ', c: '💥 TDZ', note: '호이스팅으로 v는 undefined, let/const는 에러' },
          { line: 'var v = 1', v: '1', l: '(선언 전)', c: '(선언 전)', note: 'var만 이 위에서 접근 가능' },
          { line: 'let l = 2', v: '1', l: '2', c: '(선언 전)', note: 'let 바인딩 시작' },
          { line: 'const c = 3', v: '1', l: '2', c: '3', note: '세 변수 모두 살아있음' },
        ],
        alert: { tone: 'warn', text: 'var = 함수 스코프 + 호이스팅으로 선언 전 접근이 undefined(에러 아님). let/const = 블록 스코프 + TDZ로 선언 전 접근을 ReferenceError로 즉시 차단. 기본 const, 필요할 때만 let.' },
        code: {
          lang: 'javascript',
          filename: 'scope.js — var의 함정과 회피',
          lines: [
            '// 1) 호이스팅: var는 선언이 위로 끌어올려진다',
            'console.log(v); // undefined  (에러 아님 → 버그의 씨앗)',
            'var v = 1;',
            '',
            '// let/const는 TDZ(선언 전 구간)에서 막힌다',
            'console.log(l); // ReferenceError: Cannot access \'l\'',
            'let l = 2;',
            '',
            '// 2) 블록 스코프: {} 를 존중하는가',
            'if (true) {',
            '  var funcScoped = "샌다";',
            '  let blockScoped = "안 샌다";',
            '}',
            'console.log(funcScoped);  // "샌다"  (var는 블록 무시)',
            'console.log(blockScoped); // ReferenceError (let은 블록 밖 X)',
            '',

            'const raw = "0"; // 폼 입력은 문자열',
            'if (raw === "") { /* 빈 값만 정확히 */ }',
            'if (Number(raw) === 0) { /* 숫자 0 을 의도대로 */ }',
            '',
            '// 습관 2) 변환은 명시적으로',
            'const price = "100", tax = 50;',
            'const total = Number(price) + tax;  // 150 (문자열 결합 방지)',
            'const label = String(total) + "원";  // "150원"',
            'const active = Boolean(raw);         // 의도를 드러냄',
            '',
            '// 습관 3) 기본값은 || 대신 ?? (nullish 병합)',
            'function getCount(count) {',
            '  const withOr = count || 10;   // count=0 이면 10 (버그)',
            '  const withNn = count ?? 10;   // count=0 이면 0  (정상)',
            '  return withNn;',
            '}',
            'console.log(getCount(0));         // 0   (?? 가 0 을 지킴)',
            'console.log(getCount(undefined)); // 10  (없을 때만 기본값)',
            '',
            '// 이 3가지만으로 강제변환 버그의 대부분이 사라진다',
            '// 다음 장 → I-1-2. 값 복사 vs 참조 복사',
          ],
          highlight: [1, 3, 4, 6, 8, 9, 13, 14, 15, 18, 19],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 스코프/호이스팅/TDZ 실행 타임라인
    // ─────────────────────────────────────────────────────
    function ScopeTimelineView({ timeline }) {
      const Cell = ({ text }) => {
        const isErr = text.includes('💥') || text.includes('선언 전');
        const isUndef = text === 'undefined';
        return (
          <td className={`px-2 py-1 text-center font-mono text-[10px] border ${
            isErr ? 'bg-red-50 border-red-200 text-red-600'
            : isUndef ? 'bg-yellow-100 border-yellow-300 text-amber-800'
            : 'bg-emerald-50 border-emerald-200 text-emerald-800 font-bold'}`}>{text}</td>
        );
      };
      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
            <span>⏱</span><span>실행 타임라인 — 각 줄에서 세 변수의 상태</span>
          </div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-amber-800">
                <th className="text-left py-1 font-mono">실행 줄</th>
                <th className="py-1">var v</th>
                <th className="py-1">let l</th>
                <th className="py-1">const c</th>
              </tr>
            </thead>
            <tbody>
              {timeline.map((row, i) => (
                <tr key={i} className="border-t border-yellow-100">
                  <td className="py-1 pr-2 font-mono text-slate-700 whitespace-nowrap">{row.line}</td>
                  <Cell text={row.v} /><Cell text={row.l} /><Cell text={row.c} />
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 flex flex-wrap gap-2 text-[9px]">
            <span className="px-1.5 py-0.5 rounded bg-yellow-100 border border-yellow-300 text-amber-800">undefined = 호이스팅됨</span>
            <span className="px-1.5 py-0.5 rounded bg-red-50 border border-red-200 text-red-600">💥 = TDZ ReferenceError</span>
            <span className="px-1.5 py-0.5 rounded bg-emerald-50 border border-emerald-200 text-emerald-800">값 = 접근 가능</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — typeof 결과 그리드 (함정 강조)
    // ─────────────────────────────────────────────────────
    function TypeGridView({ types }) {
      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
            <span>🏷</span><span>값 → typeof 결과 (⚠ = 함정)</span>
          </div>
          <div className="grid grid-cols-1 gap-1">
            {types.map((t, i) => (
              <div key={i} className={`flex items-center gap-2 rounded border px-2 py-1 text-[10px] ${
                t.ok ? 'bg-yellow-50 border-yellow-200' : 'bg-red-50 border-red-300'}`}>
                <span className="font-mono font-bold text-slate-700 w-24 truncate">{t.val}</span>
                <span className="text-amber-500">→</span>
                <span className={`font-mono px-1.5 py-0.5 rounded ${t.ok ? 'bg-yellow-200 text-amber-900' : 'bg-red-200 text-red-800 font-bold'}`}>"{t.typeof}"</span>
                <span className={`ml-auto text-[9px] px-1 rounded ${t.kind === 'prim' ? 'bg-emerald-100 text-emerald-800' : 'bg-sky-100 text-sky-800'}`}>{t.kind === 'prim' ? '원시' : 'object'}</span>
                {!t.ok && <span className="text-red-500">⚠</span>}
              </div>
            ))}
          </div>
          {types.filter(t => t.why).length > 0 && (
            <div className="mt-2 space-y-0.5">
              {types.filter(t => t.why).map((t, i) => (
                <div key={i} className="text-[9px] text-red-700"><span className="font-mono font-bold">{t.val}</span> — {t.why}</div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — == 강제변환 스텝 + 비교표
    // ─────────────────────────────────────────────────────
    function EqualityView({ coerceSteps, eqTable }) {
      const TONE = { bad: 'text-red-600', mid: 'text-amber-700', good: 'text-emerald-700' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-2">🔀 "5" == 5 — 강제변환이 일어나는 순서</div>
            <div className="space-y-1">
              {coerceSteps.map((s, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-yellow-500 text-xs leading-none">▼</div>}
                  <div className="flex items-center gap-2 rounded border border-yellow-200 bg-yellow-50 px-2 py-1.5">
                    <span className="text-[9px] font-bold text-amber-800 w-8">{s.label}</span>
                    <span className="font-mono text-[11px] text-slate-800 font-bold">{s.expr}</span>
                    <span className="ml-auto text-[9px] text-slate-500 text-right">{s.note}</span>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">== 와 === 결과 비교</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-amber-800 border-b border-yellow-200">
                  <th className="text-left py-0.5">비교식</th>
                  <th className="py-0.5">==</th>
                  <th className="py-0.5">===</th>
                </tr>
              </thead>
              <tbody>
                {eqTable.map((r, i) => (
                  <tr key={i} className="border-t border-yellow-100">
                    <td className="py-1 font-mono text-slate-700">{r.a} vs {r.b}</td>
                    <td className={`py-1 text-center font-mono font-bold ${TONE[r.tone]}`}>{r.loose}</td>
                    <td className="py-1 text-center font-mono text-slate-600">{r.strict}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1 text-[9px] text-slate-500">빨강 = == 만 true (강제변환 함정) · null==undefined 는 관용구로 허용</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — + 연산자 + falsy 판정
    // ─────────────────────────────────────────────────────
    function OperatorsView({ plusOps, falsy }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-2">➕ + 의 두 얼굴 — 결합 vs 산술</div>
            <div className="space-y-1">
              {plusOps.map((op, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold text-slate-800 w-20">{op.expr}</span>
                  <span className="text-yellow-500">→</span>
                  <span className={`font-mono font-bold px-1.5 py-0.5 rounded ${op.kind === 'concat' ? 'bg-yellow-200 text-amber-900' : 'bg-emerald-100 text-emerald-800'}`}>{op.result}</span>
                  <span className={`ml-auto text-[9px] px-1 rounded ${op.kind === 'concat' ? 'bg-yellow-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}`}>{op.kind === 'concat' ? '문자열 결합' : '산술'}</span>
                  <span className="text-[9px] text-slate-500 w-24 text-right">{op.note}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">🔦 truthy / falsy 판정 (if 에서의 boolean)</div>
            <div className="grid grid-cols-3 gap-1">
              {falsy.map((x, i) => (
                <div key={i} className={`flex items-center justify-between rounded border px-2 py-1 text-[10px] font-mono ${
                  x.f ? 'bg-red-50 border-red-200 text-red-600' : 'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
                  <span className="font-bold">{x.v}</span>
                  <span className="text-[9px]">{x.f ? 'falsy' : 'truthy'}</span>
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">falsy 8종: false · 0 · -0 · 0n · "" · null · undefined · NaN — 나머지는 전부 truthy (0·"" 함정 주의)</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 유명한 함정 카드
    // ─────────────────────────────────────────────────────
    function TrapsView({ traps }) {
      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-white p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1.5">
            <span>🃏</span><span>악명 높은 결과 — "이게 왜?" 와 그 이유</span>
          </div>
          <div className="space-y-1.5">
            {traps.map((t, i) => (
              <div key={i} className="rounded border border-yellow-200 bg-yellow-50 px-2 py-1.5">
                <div className="flex items-center gap-2">
                  <span className="font-mono text-[11px] font-bold text-slate-800">{t.expr}</span>
                  <span className="text-yellow-500">→</span>
                  <span className="font-mono text-[11px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-700">{t.result}</span>
                </div>
                <div className="mt-0.5 text-[9px] text-amber-800">{t.why}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500 border-t border-yellow-100 pt-1.5">교훈: 규칙을 외우지 말고 === + 명시적 변환으로 애초에 안 만나면 된다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 안전 규칙 카드 + ?? vs || 비교표
    // ─────────────────────────────────────────────────────
    function SafeView({ rules, nullishCompare }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">🛡 세 가지 안전 습관</div>
            <div className="space-y-1.5">
              {rules.map((r, i) => (
                <div key={i} className="rounded border border-emerald-200 bg-emerald-50 px-2 py-1.5">
                  <div className="text-[10px] font-bold text-emerald-900 mb-1">{i + 1}. {r.title}</div>
                  <div className="flex items-center gap-1.5 text-[10px] font-mono">
                    <span className="line-through text-red-500 bg-red-50 rounded px-1.5 py-0.5 border border-red-200">{r.bad}</span>
                    <span className="text-emerald-500">→</span>
                    <span className="text-emerald-800 font-bold bg-white rounded px-1.5 py-0.5 border border-emerald-300">{r.good}</span>
                  </div>
                  <div className="mt-0.5 text-[9px] text-slate-500">{r.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-yellow-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-800 mb-1.5">⚖ count || 기본값 vs count ?? 기본값</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-amber-800 border-b border-yellow-200">
                  <th className="text-left py-0.5">입력</th>
                  <th className="py-0.5">|| 결과</th>
                  <th className="py-0.5">?? 결과</th>
                </tr>
              </thead>
              <tbody>
                {nullishCompare.map((r, i) => (
                  <tr key={i} className="border-t border-yellow-100">
                    <td className="py-1 font-mono text-slate-700">{r.input}</td>
                    <td className="py-1 text-center font-mono text-red-600">{r.or}</td>
                    <td className="py-1 text-center font-mono text-emerald-700 font-bold">{r.nn}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1 text-[9px] text-slate-500">⚠ = 유효한 값(0·""·false)을 기본값으로 덮어씀 · ?? 는 null/undefined 일 때만 대체</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-yellow-50',  border: 'border-yellow-300',  text: 'text-amber-900',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (JavaScript 노랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      scope:     { icon: '⏱', label: '스코프·TDZ' },
      types:     { icon: '🏷', label: '원시 타입' },
      equality:  { icon: '🔀', label: '== 강제변환' },
      operators: { icon: '➕', label: '+ 와 truthy' },
      traps:     { icon: '🃏', label: '유명한 함정' },
      safe:      { icon: '🛡', label: '안전한 코드' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.scope;
      return (
        <div className="rounded-xl border border-yellow-400 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-amber-800 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>변수·타입·형변환 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-amber-700 font-mono mb-3 px-2 py-1 rounded bg-yellow-50 border border-yellow-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'scope' && <ScopeTimelineView timeline={state.timeline} />}
          {state.stage === 'types' && <TypeGridView types={state.types} />}
          {state.stage === 'equality' && <EqualityView coerceSteps={state.coerceSteps} eqTable={state.eqTable} />}
          {state.stage === 'operators' && <OperatorsView plusOps={state.plusOps} falsy={state.falsy} />}
          {state.stage === 'traps' && <TrapsView traps={state.traps} />}
          {state.stage === 'safe' && <SafeView rules={state.rules} nullishCompare={state.nullishCompare} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-yellow-400/20 border-l-2 border-yellow-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg bg-[#F7DF1E] text-black font-bold text-base border border-amber-300">JS</span>
              <div>
                <div className="inline-flex items-center gap-1.5 mb-1">
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-[#F7DF1E] text-black border border-amber-300">Ⅰ. 언어 코어</span>
                  <span className="text-[11px] font-mono text-amber-700">I-1-1</span>
                </div>
                <h1 className="text-2xl font-bold text-amber-800">변수·타입·형변환의 함정</h1>
                <p className="text-sm text-amber-700/80">var·let·const, 원시 7타입, 암묵적 형변환(==·+·truthy)이 만드는 버그와 회피법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-amber-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#F7DF1E]' : 'bg-yellow-100'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-amber-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold border ${playing ? 'bg-amber-800 text-yellow-50 border-amber-800' : 'bg-[#F7DF1E] text-black border-amber-300 hover:bg-yellow-300'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-amber-400 bg-white text-amber-800 hover:bg-yellow-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-amber-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#F7DF1E] bg-white px-4 py-3 text-sm text-amber-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                var는 함수 스코프·호이스팅 때문에 버려지고, let/const가 블록 스코프·TDZ로 실수를 즉시 잡아준다. 값은 원시 7타입 + object로 나뉘고 typeof는 null·배열에서 함정이 있어 <span className="font-mono">x === null</span>·<span className="font-mono">Array.isArray()</span>로 판별한다.
                <span className="font-mono">==</span>·<span className="font-mono">+</span>·truthy의 암묵적 형변환이 <span className="font-mono">"5"==5</span>, <span className="font-mono">"5"+3="53"</span>, <span className="font-mono">[]==![]</span> 같은 버그를 만든다.
                해법은 세 가지 — 항상 <span className="font-mono">===</span>, <span className="font-mono">Number()/String()/Boolean()</span>로 명시적 변환, 기본값은 <span className="font-mono">??</span>. 다음 장 I-1-2에서는 값 복사 vs 참조 복사를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['var', 'let', 'const', 'TDZ', '호이스팅', '원시타입', 'typeof', '강제변환', '동등비교', 'truthy', 'falsy', 'NaN', 'nullish병합'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-amber-800 border border-yellow-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-amber-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
