  <script id="trn-focus-js">
  (function () {

      if (!first) return;

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <script>window.LESSON = {"topic": "vault", "topicName": "HashiCorp Vault", "topicHref": "../index.html", "id": "I-1-2", "title": "auth method — token/userpass/approle/k8s", "sub": "비유: 건물 출입 — 사람은 사원증, 앱은 발급받은 배지, 파드는 소속 증명. 신원 증명 → 정책 붙은 token.", "path": "part1/I-1-2.html", "prev": {"id": "I-1-1", "title": "secret engine — KV vs dynamic", "href": "../part1/I-1-1.html"}, "next": {"id": "I-2-1", "title": "policy — capabilities와 path glob", "href": "../part1/I-2-1.html"}, "wrap": "auth method = \"신원 증명 → 정책 붙은 token 발급\" 절차. token은 모든 인증의 결과물(신분증)이며 root token은 설정 후 폐기한다. 사람은 userpass/OIDC, 앱·CI는 role_id + secret_id를 분리한 approle, 쿠버네티스 파드는 SA JWT를 검증하는 kubernetes를 쓴다. 각 method는 서로 다른 mount path에 꽂히고, 로그인에 성공하면 정책이 붙은 token을 돌려준다. 다음 챕터는 \"그 token이 무엇을 할 수 있는가\" — policy."};</script>

<body>

  <!--
    Vault I-1-2 — auth method (token / userpass / approle / kubernetes)
    비유: 건물 출입 — 사람은 사원증(userpass/OIDC), 앱은 발급받은 배지(approle), 파드는 사원증 대신 소속 증명(k8s SA)
    5단계: 인증 문제 → token → userpass(사람) → approle(앱/CI) → kubernetes(파드) + 실무 정리
    좌 LiveDataPane(VaultAuthView) / 우 CodeViewer
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FFCC33';
    const DARK  = '#7c5e00';
    const SUB   = '#b8860b';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      whyAuth: {lang:'bash', filename:'why-auth.sh', lines:[
        "# Vault 는 인증 없이는 아무것도 못 읽는다",
        "",
        "# 1) token 없이 시크릿 요청 → 거부",
        "vault kv get secret/app/db",
        "#   Error: missing client token (permission denied)",
        "",
        "# 2) 그래서 먼저 \"로그인\" 이 필요하다",
        "#   로그인 = auth method 로 신원을 증명하는 것",
        "#   성공하면 Vault 가 token 을 발급한다",
        "",
        "# 3) 활성화된 auth method 목록 보기",
        "vault auth list",
        "#   Path         Type        Description",
        "#   ----         ----        -----------",
        "#   token/       token       루트/기본 — 항상 켜져 있음",
        "#   userpass/    userpass    사람 — 아이디 + 비밀번호",
        "#   approle/     approle     앱/CI — role_id + secret_id",
        "#   kubernetes/  kubernetes  파드 — ServiceAccount JWT",
        "",
        "# 4) 주체마다 증명 방식이 다르다",
        "#   - 사람   → userpass / OIDC (사원증)",
        "#   - 앱/CI  → approle (미리 받은 배지)",
        "#   - 파드   → kubernetes (소속 증명)",
        "",
        "# → 각 auth method 는 서로 다른 mount path 에 꽂힌다",
        "# → 다음 단계부터 하나씩 본다",
      ]},
      tokenAuth: {lang:'bash', filename:'token-auth.sh', lines:[
        "# token — 모든 auth method 의 결과물",
        "",
        "# 1) root token 으로 로그인 (초기화 직후 1회)",
        "vault login hvs.rootXXXXXXXXXXXXXXXX",
        "#   token_policies   [\"root\"]",
        "#   → 모든 권한. 설정이 끝나면 폐기한다",
        "",
        "# 2) 정책이 붙은 하위 token 발급",
        "vault token create -policy=app-read -ttl=1h",
        "#   Key                Value",
        "#   ----               -----",
        "#   token              hvs.a1B2c3d4E5f6",
        "#   token_policies     [\"default\" \"app-read\"]",
        "#   token_duration     1h",
        "",
        "# 3) 이 token 으로 요청 (헤더에 실어 보냄)",
        "curl -H \"X-Vault-Token: hvs.a1B2c3d4E5f6\" \\",
        "  http://127.0.0.1:8200/v1/secret/data/app/db",
        "",
        "# 4) 갱신 / 폐기",

               at: "userpass-auth.sh L22–27",
               caption: "CLI 없이 HTTP POST로도 같은 로그인이 된다.",
               changes:[{mark:'read', text: "POST /v1/auth/userpass/login/alice"}] },
        scene: "userpass",
        items: [
          { who: "alice", what: "password=**** → policy=dev-team", risk: "👤 사람" },
          { who: "mount", what: "auth/userpass/login/alice", risk: "경로" },
          { who: "발급 token", what: "hvs.Zx9... (policy=dev-team)", risk: "✓ TTL 1h" },
        ],
        alert: { tone: "info", text: "경로에 사용자명이 들어간다 — auth/userpass/login/alice." },
        code:{...CODE.userpassAuth, highlight:[22,23,24,25,26,27]},
      },
      { ...S3,
        beat:{ label: "실무 선택",
               at: "userpass-auth.sh L29–30",
               caption: "userpass는 개념/로컬용 — 실무 사람 인증은 OIDC/LDAP SSO로 간다.",
               changes:[{mark:'read', text: "실무: OIDC/LDAP 연동"}] },
        scene: "userpass",
        items: [
          { who: "alice", what: "password=**** → policy=dev-team", risk: "👤 사람" },
          { who: "bob", what: "password=**** → policy=readonly", risk: "👤 사람" },
          { who: "mount", what: "auth/userpass/login/alice", risk: "경로" },
          { who: "발급 token", what: "hvs.Zx9... (policy=dev-team)", risk: "✓ TTL 1h" },
        ],
        alert: { tone: "info", text: "userpass = 사람용 창구. 로그인 성공 → 그 사용자에 매핑된 policy가 token에 붙는다." },
        code:{...CODE.userpassAuth, highlight:[29,30]},
      },
      // ── Step 4 ────────────────────────────────────────────────────
      { ...S4,
        beat:{ label: "창구 개설",
               at: "approle-auth.sh L3–4",
               caption: "사람 없는 주체(앱·배치·CI)를 위한 approle을 활성화한다.",
               changes:[{mark:'new', text: "approle/ mount 개설"}] },
        scene: "approle",
        items: [
          { who: "approle/", what: "auth enable approle", risk: "＋ 창구" },
        ],
        alert: { tone: "info", text: "approle은 앱·배치·CI 같은 머신용 창구다." },
        code:{...CODE.approleAuth, highlight:[3,4]},
      },
      { ...S4,
        beat:{ label: "role 정의",
               at: "approle-auth.sh L6–10",
               caption: "policy와 token/secret_id 수명을 묶어 role \"app\" 을 만든다.",
               changes:[{mark:'new', text: "role app — app-read · ttl 20m"},
                        {mark:'new', text: "secret_id — ttl 10m · 1회용"}] },
        scene: "approle",
        items: [
          { who: "role: app", what: "token_policies=app-read · ttl=20m", risk: "정의" },
          { who: "secret_id 규칙", what: "ttl=10m · num_uses=1", risk: "단기/1회" },
        ],
        alert: { tone: "info", text: "role이 \"이 앱은 무엇을, 얼마나 오래\" 를 정한다." },
        code:{...CODE.approleAuth, highlight:[6,7,8,9,10]},
      },
      { ...S4,
        beat:{ label: "role_id 조회",
               at: "approle-auth.sh L12–14",
               caption: "role_id는 공개 가능한 아이디 — 앱 설정에 심어 둔다.",
               changes:[{mark:'read', text: "role_id 조회 (공개)"}] },
        scene: "approle",
        items: [
          { who: "role_id", what: "db02a1c9-... (공개, 앱 설정)", risk: "아이디" },
        ],
        alert: { tone: "info", text: "role_id 만으로는 로그인할 수 없다 — 절반의 신원." },
        code:{...CODE.approleAuth, highlight:[12,13,14]},
      },
      { ...S4,
        beat:{ label: "secret_id 발급",
               at: "approle-auth.sh L16–20",
               caption: "secret_id는 비밀번호 역할 — 단기 TTL에 1회용으로 발급한다.",
               changes:[{mark:'new', text: "secret_id 발급 — 10m · 1회용"}] },
        scene: "approle",
        items: [
          { who: "role_id", what: "db02a1c9-... (공개, 앱 설정)", risk: "아이디" },
          { who: "secret_id", what: "5f3b...(비밀, 단기/1회용)", risk: "🔒 비번" },
        ],
        alert: { tone: "warn", text: "secret_id는 CI가 빌드에 딱 한 번 주입한다." },
        code:{...CODE.approleAuth, highlight:[16,17,18,19,20]},
      },
      { ...S4,
        beat:{ label: "두 조각 로그인",
               at: "approle-auth.sh L22–28",
               caption: "role_id + secret_id로 로그인하면 app-read token을 받는다.",
               changes:[{mark:'read', text: "role_id + secret_id 제출"},
                        {mark:'new', text: "token hvs.Qp7RsTuVwX (20m)"}] },
        scene: "approle",
        items: [
          { who: "role_id", what: "db02a1c9-... (공개, 앱 설정)", risk: "아이디" },
          { who: "secret_id", what: "5f3b...(비밀, 단기/1회용)", risk: "🔒 비번" },
          { who: "발급 token", what: "hvs.Qp7... (policy=app-read)", risk: "✓ TTL 20m" },
        ],
        alert: { tone: "good", text: "로그인 성공 — 정책 붙은 단기 token 수령." },
        code:{...CODE.approleAuth, highlight:[22,23,24,25,26,27,28]},
      },
      { ...S4,
        beat:{ label: "주입과 소진",
               at: "approle-auth.sh L30–31",
               caption: "role_id는 설정에, secret_id는 단기 주입 — 로그인 후엔 이미 소진됐다.",
               changes:[{mark:'gone', text: "secret_id 소진 (num_uses=1)"}] },
        scene: "approle",
        items: [
          { who: "role_id", what: "db02a1c9-... (공개, 앱 설정)", risk: "아이디" },
          { who: "secret_id", what: "5f3b...(비밀, 단기/1회용)", risk: "🔒 비번" },
          { who: "CI 주입", what: "secret_id 를 빌드에 1회 전달", risk: "use_limit=1" },
          { who: "발급 token", what: "hvs.Qp7... (policy=app-read)", risk: "✓ TTL 20m" },
        ],
        alert: { tone: "good", text: "approle = role_id(아이디) + secret_id(비번) 분리. secret_id는 단기/1회용으로 주입해 유출 위험 최소화." },
        code:{...CODE.approleAuth, highlight:[30,31]},
      },
      // ── Step 5 ────────────────────────────────────────────────────
      { ...S5,
        beat:{ label: "창구 + 클러스터 연결",
               at: "kubernetes-auth.sh L3–6",
               caption: "kubernetes auth를 켜고 클러스터 API 주소를 등록한다.",
               changes:[{mark:'new', text: "kubernetes/ mount + config"}] },
        scene: "kubernetes",
        items: [
          { who: "kubernetes/", what: "auth enable + kubernetes_host 등록", risk: "＋ 창구" },
        ],
        alert: { tone: "info", text: "Vault가 클러스터의 TokenReview API를 부를 수 있게 연결한다." },
        code:{...CODE.kubernetesAuth, highlight:[3,4,5,6]},
      },
      { ...S5,
        beat:{ label: "role — SA를 정책에",
               at: "kubernetes-auth.sh L8–13",
               caption: "prod 네임스페이스의 web-app SA만 web-secrets 정책에 묶는다.",
               changes:[{mark:'new', text: "role web — bound SA/ns"},
                        {mark:'read', text: "policy web-secrets 연결"}] },
        scene: "kubernetes",
        items: [
          { who: "role: web", what: "policies=web-secrets · ttl=1h", risk: "정의" },
          { who: "bound SA", what: "ns=prod, sa=web-app 만 허용", risk: "경계" },
        ],
        alert: { tone: "info", text: "bound_* 가 \"누가 이 role로 로그인할 수 있는가\" 의 경계다." },
        code:{...CODE.kubernetesAuth, highlight:[8,9,10,11,12,13]},
      },
      { ...S5,
        beat:{ label: "파드가 JWT 제출",
               at: "kubernetes-auth.sh L15–19",
               caption: "파드에 자동 마운트된 SA JWT를 로그인 엔드포인트로 보낸다.",
               changes:[{mark:'read', text: "SA JWT 자동 마운트"},
                        {mark:'read', text: "POST /auth/kubernetes/login"}] },
        scene: "kubernetes",
        items: [
          { who: "파드", what: "SA JWT 자동 마운트 (비밀 주입 X)", risk: "🐳 파드" },
          { who: "로그인 요청", what: "role=web + SA JWT 전송", risk: "→ 검증 대기" },
        ],
        alert: { tone: "info", text: "파드에 비밀을 미리 넣지 않는다 — JWT는 이미 있다." },
        code:{...CODE.kubernetesAuth, highlight:[15,16,17,18,19]},
      },
      { ...S5,
        beat:{ label: "검증 → token",
               at: "kubernetes-auth.sh L20–23",
               caption: "Vault가 TokenReview로 소속을 확인하고 정책 붙은 token을 준다.",
               changes:[{mark:'read', text: "TokenReview로 JWT 검증"},
                        {mark:'new', text: "token hvs.Kj4... (web-secrets)"}] },
        scene: "kubernetes",
        items: [
          { who: "파드", what: "SA JWT 자동 마운트 (비밀 주입 X)", risk: "🐳 파드" },
          { who: "TokenReview", what: "k8s API 로 JWT 검증", risk: "✓ 소속 확인" },
          { who: "발급 token", what: "hvs.Kj4... (policy=web-secrets)", risk: "✓ TTL 1h" },
        ],
        alert: { tone: "good", text: "소속 증명만으로 token 발급 — 별도 비밀 주입이 없다." },
        code:{...CODE.kubernetesAuth, highlight:[20,21,22,23]},
      },
      { ...S5,
        beat:{ label: "실무 매핑 규칙",
               at: "kubernetes-auth.sh L25–31",
               caption: "사람=OIDC/userpass · 앱/CI=approle · 파드=kubernetes로 정리된다.",
               changes:[{mark:'read', text: "주체별 매핑 확정"}] },
        scene: "kubernetes",
        items: [
          { who: "파드", what: "SA JWT 자동 마운트 (비밀 주입 X)", risk: "🐳 파드" },
          { who: "TokenReview", what: "k8s API 로 JWT 검증", risk: "✓ 소속 확인" },
          { who: "bound SA", what: "ns=prod, sa=web-app 만 허용", risk: "경계" },
          { who: "발급 token", what: "hvs.Kj4... (policy=web-secrets)", risk: "✓ TTL 1h" },
        ],
        alert: { tone: "good", text: "사람=OIDC/userpass · 앱·CI=approle · 파드=kubernetes. 각 method는 정책 붙은 token을 돌려준다." },
        code:{...CODE.kubernetesAuth, highlight:[25,26,27,28,29,30,31]},
      },
    ];

    // ── RefPanel ── 그림에 다 담지 못한 표·명령 정리 (레슨 화면의 "표·정리 보기")
    function RefPanel({ step, stepIdx }) {
      const g = Number((step.title.match(/^Step (\d)/) || [0, 1])[1]) - 1;
      if (g === 0) return (<div>
        <h4>주체별 auth method</h4>
        <table><thead><tr><th>주체</th><th>method</th><th>증명 수단</th></tr></thead><tbody>
          <tr><td>사람</td><td className="font-mono">userpass · oidc · ldap</td><td>아이디·비밀번호 또는 회사 SSO</td></tr>
          <tr><td>앱 · CI</td><td className="font-mono">approle</td><td>role_id + secret_id</td></tr>
          <tr><td>k8s 파드</td><td className="font-mono">kubernetes</td><td>ServiceAccount JWT</td></tr>
          <tr><td>모두의 결과</td><td className="font-mono">token</td><td>항상 켜져 있고 끌 수 없다</td></tr>
        </tbody></table>
      </div>);
      if (g === 1) return (<div>
        <h4>token 명령</h4>
        <table><tbody>
          <tr><td className="font-mono">vault token create -policy=… -ttl=…</td><td>정책과 TTL 이 붙은 하위 token 발급</td></tr>
          <tr><td className="font-mono">vault token lookup</td><td>정책·남은 TTL 확인</td></tr>
          <tr><td className="font-mono">vault token renew</td><td>max TTL 안에서 TTL 연장</td></tr>
          <tr><td className="font-mono">vault token revoke</td><td>즉시 무효 + 그 아래 하위 token 도 함께</td></tr>
        </tbody></table>
        <ul>
          <li>Vault 1.10 부터 service token 은 <span className="font-mono">hvs.</span> 로 시작한다 (예전 형식은 <span className="font-mono">s.</span>).</li>
          <li>root token 은 TTL 이 없고 모든 권한을 가진다. 초기 설정이 끝나면 폐기하고, 필요할 때 unseal 키로 다시 만든다.</li>
        </ul>
      </div>);
      if (g === 2) return (<div>
        <h4>userpass 사용자 설정</h4>
        <table><tbody>
          <tr><td className="font-mono">token_policies</td><td>로그인하면 token 에 붙는 정책 (예전 이름 policies 도 받는다)</td></tr>
          <tr><td className="font-mono">token_ttl</td><td>발급 token 의 TTL. 정하지 않으면 시스템 기본값 768h(32일)</td></tr>
          <tr><td className="font-mono">auth/userpass/login/&lt;이름&gt;</td><td>HTTP 로그인 경로</td></tr>
        </tbody></table>
        <p>실무에서 사람 인증은 OIDC·LDAP 로 회사 SSO 에 붙이고, 그룹에 정책을 매핑한다.</p>
      </div>);
      if (g === 3) return (<div>
        <h4>approle role 설정</h4>
        <table><tbody>
          <tr><td className="font-mono">token_policies=app-read</td><td>발급 token 의 정책</td></tr>
          <tr><td className="font-mono">token_ttl=20m · token_max_ttl=1h</td><td>발급 token 의 수명과 연장 상한</td></tr>
          <tr><td className="font-mono">secret_id_ttl=10m</td><td>secret_id 가 유효한 시간</td></tr>
          <tr><td className="font-mono">secret_id_num_uses=1</td><td>secret_id 를 쓸 수 있는 횟수</td></tr>
        </tbody></table>
        <ul>
          <li>role_id 는 앱 설정에 두고, secret_id 는 CI 가 배포 때 짧게 전달한다.</li>
          <li>둘이 한곳에 같이 저장되면 approle 을 쓰는 의미가 사라진다.</li>
        </ul>
      </div>);
      if (g === 4) return (<div>
        <h4>kubernetes role 설정</h4>
        <table><tbody>
          <tr><td className="font-mono">bound_service_account_names</td><td>로그인할 수 있는 SA (web-app)</td></tr>
          <tr><td className="font-mono">bound_service_account_namespaces</td><td>허용 네임스페이스 (prod)</td></tr>
          <tr><td className="font-mono">policies · ttl</td><td>새 이름은 token_policies · token_ttl, 예전 이름도 받는다</td></tr>
        </tbody></table>
        <p>Vault 는 받은 JWT 를 클러스터의 TokenReview API 로 검증하고, bound 조건이 맞을 때만 token 을 준다.</p>
      </div>);
      return null;
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
