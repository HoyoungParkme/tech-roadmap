  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <div id="root"></div>
  <!--
    Vault I-2-2 — token: TTL / renewable / orphan / accessor
    비유: 놀이공원 자유이용권(수명 있는 티켓) + 티켓 번호표(accessor)
    5단계: token이란 → TTL/renewable/num_uses(수명) → service vs batch / orphan → accessor(번호표) → 부모-자식 계층 revoke cascade + 실무 정리
    좌 LiveDataPane(TokenView: 발급→TTL 카운트다운→renew 연장→계층 revoke) / 우 CodeViewer
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FFCC33';
    const DARK  = '#7c5e00';
    const SUB   = '#b8860b';

    const STEPS = [
      {
        title: 'Step 1. token — Vault 안에서 통하는 "출입증"',
        desc: 'Vault 에 로그인(auth)하면 그 대가로 token 을 받는다. 이후 모든 요청은 이 token 을 헤더에 실어 보낸다 — token 이 곧 "나"다. token 에는 어떤 policy 가 붙었는지, 언제까지 유효한지(TTL), 갱신할 수 있는지가 함께 적혀 있다. 즉 token 은 단순 비밀번호가 아니라 "권한 + 수명" 이 묶인 출입증이다.',
        scene: 'issue',
        token: { id: 'hvs.CAESI...4a9f', accessor: 'kR7pMxQ2', policies: ['app-read'], ttl: 3600, renewable: true, uses: '무제한', type: 'service' },
        alert: { tone: 'info', text: 'token = 권한(policy) + 수명(TTL) 이 묶인 출입증. 모든 API 요청에 X-Vault-Token 으로 실린다.' },
        code: {
          lang: 'bash',
          filename: 'token-basics.sh',
          lines: [
            '# 로그인하면 token 을 받는다',
            'vault login -method=userpass username=alice',
            '#   Key                  Value',
            '#   ---                  -----',
            '#   token                hvs.CAESI...4a9f',
            '#   token_accessor       kR7pMxQ2...',
            '#   token_policies       [\'app-read\']',
            '#   token_duration       1h        (= TTL)',
            '#   token_renewable      true',
            '',
            '# 이후 모든 요청은 이 token 으로 인증한다',
            'export VAULT_TOKEN=hvs.CAESI...4a9f',
            'vault kv get secret/app/db          # token 이 곧 나',
            '',
            '# 내 token 정보 조회 (값 노출 없이)',
            'vault token lookup',
            '#   accessor       kR7pMxQ2...',
            '#   policies       [\'app-read\', \'default\']',
            '#   ttl            59m58s',
            '#   renewable      true',
            '',
            '# → token 에는 "무엇을 할 수 있고(policy)"',
            '#   "언제까지 유효한지(TTL)" 가 함께 담긴다',
          ],
          highlight: [1, 2, 5, 6, 7, 8, 9, 12, 13, 14, 17, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 2. 수명 — TTL / max TTL / renewable / num_uses',
        desc: 'token 은 영원하지 않다. TTL(Time To Live) 이 지나면 만료된다. renewable=true 면 renew 로 수명을 연장할 수 있지만, max TTL 을 넘길 수는 없다 — 무한 연장을 막는 상한선이다. num_uses 를 지정하면 "N번 쓰면 폐기" 되는 일회성 token 도 만들 수 있다. 실무 원칙은 짧은 TTL + 필요할 때 renew — 유출되어도 곧 무효가 된다.',
        scene: 'ttl',
        token: { id: 'hvs.CAESI...4a9f', accessor: 'kR7pMxQ2', policies: ['app-read'], ttl: 3600, maxTtl: 86400, renewable: true, uses: '무제한', type: 'service' },
        alert: { tone: 'good', text: '짧은 TTL + renew 가 실무 표준. max TTL 은 무한 연장을 막는 상한선. num_uses 로 일회성 token 도 가능.' },
        code: {
          lang: 'bash',
          filename: 'ttl-renew.sh',
          lines: [
            '# 짧은 수명 token 을 직접 발급',
            'vault token create \\',
            '  -policy=app-read \\',
            '  -ttl=1h \\            # 만료까지 시간',
            '  -explicit-max-ttl=24h \\   # 이 이상은 연장 불가',
            '  -renewable=true',
            '#   token            hvs.CAESI...4a9f',
            '#   token_duration   1h',
            '',
            '# 만료 전에 수명 연장 (renew)',
            'vault token renew -increment=1h',
            '#   token_duration   1h   (다시 1시간)',
            '# → 단, 최초 발급 + max_ttl(24h) 을 넘기면 거부',
            '',
            '# N번만 쓰이는 일회성 token',
            'vault token create -policy=app-read -use-limit=3',
            '#   token_num_uses   3',
            '# → 3번 요청하면 4번째부터 401 (자동 폐기)',
            '',
            '# 내 token 을 스스로 갱신 (앱에서 흔함)',
            'vault token renew-self',
            '',
            '# → 실무: TTL 은 짧게(15m~1h), 앱이 주기적으로',
            '#   renew-self. 유출돼도 곧 만료된다.',
          ],
          highlight: [2, 3, 4, 5, 6, 11, 12, 13, 16, 17, 18, 21, 22, 23, 24],
        },
      },
      {
        title: 'Step 3. token 종류 — service vs batch, 그리고 orphan',
        desc: 'service token 은 Vault 서버에 저장되어 renew/revoke/lookup 이 모두 가능한 표준 token 이다. batch token 은 서버에 저장하지 않는 가벼운 token 으로, 대량 발급에 유리하지만 renew 가 안 되고 lookup 도 제한적이다. orphan token 은 부모가 없는 독립 token 이다 — 부모 token 이 만료/revoke 되어도 함께 죽지 않는다. 오래 살아야 하는 데몬/CI 러너에 쓴다.',
        scene: 'types',
        cards: [
          { name: 'service token', desc: '서버 저장 · renew/revoke/lookup 가능', tag: '표준', tone: 'good' },
          { name: 'batch token', desc: '서버 미저장 · 가볍고 대량 발급 · renew 불가', tag: '경량', tone: 'info' },
          { name: 'orphan token', desc: '부모 없음 · 부모 만료에 영향 안 받음', tag: '독립', tone: 'warn' },
        ],
        alert: { tone: 'info', text: 'service = 표준(관리 가능). batch = 경량(대량·단명). orphan = 독립(부모 만료와 무관).' },
        code: {
          lang: 'bash',
          filename: 'token-types.sh',
          lines: [
            '# 1) service token (기본값) — 완전 관리 가능',
            'vault token create -policy=app-read',
            '#   type             service',
            '# → renew / revoke / lookup 모두 가능',
            '',
            '# 2) batch token — 서버에 저장 안 함(경량)',
            'vault token create -type=batch -policy=app-read -ttl=5m',
            '#   type             batch',
            '# → 대량 워크로드에 유리, 대신:',
            '#   - renew 불가 (수명 고정)',
            '#   - 자식 token 생성 불가',
            '#   - 부분적인 lookup 만 지원',
            '',
            '# 3) orphan token — 부모 없는 독립 token',
            'vault token create -orphan -policy=app-read -ttl=72h',
            '#   token            hvs.CAESI...long',
            '# → 부모 token 이 revoke/만료돼도 살아남는다',
            '# → 오래 도는 데몬 / CI 러너에 사용',
            '',
            '# 지금 token 이 orphan 인지 확인',
            'vault token lookup -format=json | jq .data.orphan',
            '#   true',
            '',
            '# → 선택 기준: 관리성(service) vs 성능(batch)',
            '#   vs 수명 독립(orphan)',
          ],
          highlight: [1, 2, 3, 6, 7, 8, 9, 10, 11, 12, 14, 15, 16, 17, 18, 21, 22, 23],
        },
      },
      {
        title: 'Step 4. accessor — 토큰 값 없이 다루는 "번호표"',
        desc: 'token 값 자체는 비밀번호처럼 노출되면 안 된다. 그런데 운영자는 "이 token 이 살아 있나? 폐기하고 싶다" 할 때가 있다. 이때 쓰는 것이 accessor 다 — token 을 발급할 때 함께 나오는 공개 가능한 핸들러다. accessor 로는 token 값을 알 수 없지만, lookup(속성 조회) 과 revoke(폐기) 는 할 수 있다. 로그/감사 시스템에 token 값 대신 accessor 를 남기는 게 실무 표준이다.',
        scene: 'accessor',
        token: { id: 'hvs.CAESI...4a9f', accessor: 'kR7pMxQ2', policies: ['app-read'], ttl: 2400, renewable: true, uses: '무제한', type: 'service' },
        alert: { tone: 'good', text: 'accessor = token 값을 노출하지 않고 lookup/revoke 하는 핸들러. 로그·감사에는 값 대신 accessor 를 남긴다.' },
        code: {
          lang: 'bash',
          filename: 'accessor.sh',
          lines: [
            '# 발급 시 token 과 accessor 가 함께 나온다',
            'vault token create -policy=app-read',
            '#   token            hvs.CAESI...4a9f   ← 비밀(노출 금지)',
            '#   token_accessor   kR7pMxQ2...        ← 공개 가능 핸들러',
            '',
            '# accessor 로 token 속성 조회 (값은 모름)',
            'vault token lookup -accessor kR7pMxQ2',
            '#   policies    [\'app-read\']',
            '#   ttl         39m40s',
            '#   accessor    kR7pMxQ2',
            '# → token 값은 여기서 알 수 없다',
            '',
            '# 유출 의심 → accessor 로 즉시 폐기',
            'vault token revoke -accessor kR7pMxQ2',
            '#   Success! Revoked token (if it existed)',
            '',
            '# 살아있는 모든 accessor 나열 (감사)',
            'vault list auth/token/accessors',
            '#   kR7pMxQ2',
            '#   9fLm3nZ8',
            '#   ...',
            '',
            '# → 감사 로그에는 token 값이 아니라 accessor 가',
            '#   남는다. 값 유출 없이 추적·폐기 가능.',
          ],
          highlight: [1, 2, 3, 4, 6, 7, 8, 9, 10, 11, 13, 14, 15, 17, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 5. token 계층 — 부모를 revoke 하면 자식도 함께',
        desc: 'token 은 나무처럼 계층을 이룬다. 어떤 token 으로 새 token 을 만들면, 새 것은 자식이 된다. 핵심 규칙: 부모를 revoke 하면 자식 · 손자까지 한 번에 폐기된다. 사고가 났을 때 뿌리 하나만 잘라도 그 아래 전부 정리되는 구조다. 단, orphan token 은 이 나무에서 떨어져 나온 독립 token 이라 부모가 죽어도 살아남는다. 실무 요약: 짧은 TTL + renew, 유출 대비는 accessor 로, 정리는 계층 revoke 로.',
        scene: 'tree',
        alert: { tone: 'good', text: '부모 revoke → 자식/손자 cascade 폐기. orphan 만 예외. 사고 시 뿌리 하나로 하위 전부 정리.' },
        code: {
          lang: 'bash',
          filename: 'token-tree.sh',
          lines: [
            '# 부모 token 으로 자식 token 을 만든다',
            'export VAULT_TOKEN=<parent-token>',
            'vault token create -policy=app-read   # child-1',
            'vault token create -policy=app-read   # child-2',
            '# child-1 로 또 만들면 → grandchild',
            '',
            '# 계층 구조',
            '#   parent',
            '#   ├─ child-1',
            '#   │   └─ grandchild',
            '#   └─ child-2',
            '',
            '# 부모를 revoke 하면?',
            'vault token revoke <parent-token>',
            '# → child-1, child-2, grandchild 모두 즉시 폐기',
            '#   (cascade revoke)',
            '',
            '# 예외: orphan 은 나무에서 떨어져 있다',
            'vault token create -orphan -policy=app-read',
            '# → 부모가 revoke 돼도 이 token 은 살아남는다',
            '',
            '# 실무 요약',
            '#   - TTL 짧게 + renew-self 로 연장',
            '#   - 유출 대비: accessor 로 lookup / revoke',
            '#   - 사고 시: 상위 token revoke 로 하위 정리',
            '#   - 오래 사는 워크로드만 orphan',
          ],
          highlight: [1, 2, 3, 4, 5, 8, 9, 10, 11, 13, 14, 15, 16, 18, 19, 20, 22, 23, 24, 25, 26],
        },
      },
    ];

    const ALERT_STYLE = {
      info:   { bg:'#fffbe6', bd:'#fde68a', tx:'#7c5e00', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function Row({ k, v, mono }) {
      return (
        <div className="flex items-start gap-2 text-xs">
          <span className="w-20 shrink-0 text-slate-500">{k}</span>
          <span className={`flex-1 break-all ${mono ? 'font-mono' : ''}`} style={{color:DARK}}>{v}</span>
        </div>
      );
    }

    // token 카드 — 발급/accessor 씬에서 TTL 카운트다운 애니메이션
    function TokenCard({ token, animateTtl }) {
      const [left, setLeft] = useState(token.ttl);
      useEffect(() => {
        setLeft(token.ttl);
        if (!animateTtl) return;
        const id = setInterval(() => {
          setLeft((v) => (v <= 60 ? token.ttl : v - 60));
        }, 700);
        return () => clearInterval(id);
      }, [token, animateTtl]);
      const pct = Math.max(0, Math.min(100, (left / token.ttl) * 100));
      const mm = Math.floor(left / 60);
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{background:BRAND, color:DARK}}>
            <span>🎫</span><span>발급된 token</span>
            <span className="ml-auto text-[10px] px-1.5 py-0.5 rounded-full bg-white" style={{color:DARK}}>{token.type}</span>
          </div>
          <div className="p-3 space-y-1.5" style={{background:'#fffbe6'}}>
            <Row k="token" v={token.id} mono />
            <Row k="accessor" v={token.accessor} mono />
            <Row k="policies" v={token.policies.join(', ')} mono />
            <Row k="renewable" v={token.renewable ? 'true' : 'false'} />
            <Row k="num_uses" v={token.uses} />
            {token.maxTtl ? <Row k="max_ttl" v={`${Math.floor(token.maxTtl/3600)}h`} /> : null}
            <div className="pt-1">
              <div className="flex items-center justify-between text-[10px] mb-0.5" style={{color:SUB}}>
                <span>TTL 남은 수명</span>
                <span className="font-mono">{mm}m {String(left % 60).padStart(2,'0')}s</span>
              </div>
              <div className="h-2 rounded-full overflow-hidden" style={{background:'#fde68a'}}>
                <div className="h-full transition-all duration-500" style={{width:`${pct}%`, background:BRAND}} />
              </div>
              {animateTtl ? <div className="text-[10px] mt-1" style={{color:SUB}}>⏱ 카운트다운 → renew 로 다시 채워진다</div> : null}
            </div>
          </div>
        </div>
      );
    }

    function TypeCards({ cards }) {
      return (
        <div className="space-y-2">
          {cards.map((c, i) => {
            const s = ALERT_STYLE[c.tone] || ALERT_STYLE.info;
            return (
              <div key={i} className="rounded-md p-2.5 text-xs flex items-center gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
                <span className="font-mono font-bold w-28 shrink-0">{c.name}</span>
                <span className="flex-1">{c.desc}</span>
                <span className="text-[10px] shrink-0 px-1.5 py-0.5 rounded-full bg-white/70 font-bold">{c.tag}</span>
              </div>
            );
          })}
        </div>
      );
    }

    // 부모-자식 계층 revoke cascade 시각화 (killed 상태 순차 전파)
    function TokenTree() {
      const [killed, setKilled] = useState(0); // 0 정상 → 1..4 폐기 단계
      useEffect(() => {
        let n = 0;
        const id = setInterval(() => {
          n = n >= 5 ? 0 : n + 1;
          setKilled(n);
        }, 900);
        return () => clearInterval(id);
      }, []);
      // 노드 폐기 순서: parent(1) → child-1(2) → grandchild(3) → child-2(4). orphan 은 항상 생존
      const nodes = [
        { id: 'parent',     label: 'parent token',   depth: 0, killAt: 1 },
        { id: 'child-1',    label: 'child-1',         depth: 1, killAt: 2 },
        { id: 'grandchild', label: 'grandchild',      depth: 2, killAt: 3 },
        { id: 'child-2',    label: 'child-2',         depth: 1, killAt: 4 },
      ];
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{background:BRAND, color:DARK}}>
            <span>🌳</span><span>token 계층 — 부모 revoke → cascade</span>
          </div>
          <div className="p-3 space-y-1.5" style={{background:'#fffbe6'}}>
            {nodes.map((n) => {
              const dead = killed >= n.killAt && killed !== 0;
              return (
                <div key={n.id} className="flex items-center gap-2 text-xs" style={{paddingLeft:`${n.depth * 20}px`}}>
                  <span className="text-slate-400">{n.depth > 0 ? '└─' : '●'}</span>
                  <span className="rounded px-2 py-1 font-mono transition-all"
                        style={dead
                          ? {background:'#fee2e2', color:'#991b1b', border:'1px solid #fecaca', textDecoration:'line-through', opacity:0.6}
                          : {background:'#dbf3e6', color:'#166534', border:'1px solid #86efac'}}>
                    {n.label} {dead ? '✖ revoked' : '● alive'}
                  </span>
                </div>
              );
            })}
            <div className="flex items-center gap-2 text-xs pt-1">
              <span className="text-slate-400">○</span>
              <span className="rounded px-2 py-1 font-mono" style={{background:'#fef3c7', color:'#92400e', border:'1px solid #fde68a'}}>
                orphan token ● alive (부모와 무관)
              </span>
            </div>
            <div className="text-[10px] pt-1" style={{color:SUB}}>
              {killed === 0 ? '정상 상태 — 곧 parent 를 revoke 한다' : `cascade 진행: ${killed}/4 폐기 · orphan 만 생존`}
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DARK}}>token 라이프사이클</h3>
            <span className="text-[10px] text-slate-500">scene: {state.scene}</span>
          </div>
          {state.scene === 'tree'
            ? <TokenTree />
            : state.scene === 'types'
              ? <TypeCards cards={state.cards} />
              : <TokenCard token={state.token} animateTtl={state.scene === 'ttl'} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#fffbe6 0%,#fef3c7 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg font-bold" style={{background:BRAND, color:DARK}}>V</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:DARK}}>I-2-2. token — TTL / renewable / orphan / accessor</h1>
                <p className="text-sm" style={{color:SUB}}>비유: 수명 있는 자유이용권(token) + 티켓 번호표(accessor). 권한을 담고 다니는 출입증의 수명 관리.</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:SUB}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#fde68a'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow" style={{background:BRAND, color:DARK}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:DARK}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold" style={{background:BRAND, color:DARK}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:DARK}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:SUB}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                token = 권한(policy) + 수명(TTL) 이 묶인 출입증이다. TTL 이 지나면 만료되고, renewable 이면 max TTL 상한 안에서 renew 로 연장한다. num_uses 로 일회성 token 도 만든다. service(관리 가능) / batch(경량) / orphan(부모 독립) 세 종류가 있고, accessor 로는 token 값 없이 lookup·revoke 가 된다. 계층에서 부모를 revoke 하면 자식·손자가 cascade 로 함께 폐기된다(orphan 만 예외). 실무는 짧은 TTL + renew, 유출 대비는 accessor, 정리는 계층 revoke.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Vault', 'token', 'TTL', 'renewable', 'orphan', 'accessor', 'batch-token', 'revoke'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#fffbe6', color:DARK, border:'1px solid #fde68a'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:SUB}}>
              <a href="../index.html" className="underline hover:no-underline">← 목차</a>
              <div className="flex gap-3">
                <a href="./I-2-1.html" className="underline hover:no-underline">← 이전: I-2-1</a>
                <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
