  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

    #trn-beat-badge {

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    Vault I-1-1 — secret engine (KV vs dynamic)
    비유: 은행 금고(KV) vs 즉석 발권기(dynamic)
    5단계(STEP) × 세부단계(beat) 구조:
      · beat 마다 코드 3~8줄만 강조한다 (의미 단위 = 명령 1개 + 그 결과)
      · 좌 LiveDataPane 은 "그 강조된 줄이 만든 상태" 를 그대로 그린다
      · 그래서 다음을 누르면 "어느 줄 → 무엇이 바뀌었나" 가 1:1 로 보인다
    좌 LiveDataPane(Vault 서버 상태) / 우 CodeViewer
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FFCC33';
    const DARK  = '#7c5e00';
    const SUB   = '#b8860b';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      problem: {lang:"bash", filename:"before-vault.sh", lines:[
        "# Vault 없는 흔한 풍경",
        "",
        "# 1) .env 에 시크릿 평문",
        "cat .env",
        "#   DB_PASSWORD=prod-super-secret-2024",
        "#   AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE",
        "#   STRIPE_KEY=sk_live_xxxxxxxxxxxx",
        "",
        "# 2) 실수로 git push",
        "git add .env",
        "git commit -m \"fix config\"",
        "git push                       # 💥 GitHub Secret Scanner 알람",
        "",
        "# 3) 회수가 안 된다",
        "#   - 푸시 이력에서 지우려면 rebase + force push",
        "#   - 그 사이 봇/사람이 이미 클론",
        "#   - 결국 모든 키를 \"회전(rotate)\" 해야 한다",
        "",
        "# 4) 누가 어떤 시크릿을 봤는지 추적 불가",
        "#   - 어제 퇴사자가 DB 비밀번호를 알고 있다면?",
        "#   - 비밀번호를 바꿔야 한다 → 전 서비스 재배포",
        "",
        "# → \"한 곳에서 보관 + 발급 + 감사\" 가 필요하다",
        "# → Vault 와 secret engine 이 그 역할을 한다",
      ]},
      kvV2: {lang:"bash", filename:"kv-v2.sh", lines:[
        "# KV v2 secret engine 활성화 + 사용",
        "",
        "# 1) 활성화 (한 번만)",
        "vault secrets enable -path=secret kv-v2",
        "#   Success! Enabled the kv-v2 secrets engine at: secret/",
        "",
        "# 2) 시크릿 저장 (key=value 형태)",
        "vault kv put secret/app/db \\",
        "  username=app \\",
        "  password=\"p@ss123\"",
        "#   Key                Value",
        "#   ----               -----",
        "#   created_time       2026-05-20T01:23:45.6Z",
        "#   version            1",
        "",
        "# 3) 다시 쓰면 새 버전이 생긴다",
        "vault kv put secret/app/db username=app password=\"rotate-2026\"",
        "#   version            2",
        "",
        "# 4) 읽기 — 항상 같은 값이 나온다",
        "vault kv get secret/app/db",
        "#   ====== Data ======",
        "#   password    rotate-2026",
        "#   username    app",
        "",
        "# 5) 이전 버전으로 되돌리기",
        "vault kv rollback -version=1 secret/app/db",
        "",
        "# KV v2 = 정적 시크릿의 안전한 보관소 + 버전 관리",

        code:{...CODE.dynamic, highlight:[3,4,6,7,9]},
      },
      { ...S4,
        beat:{ label: "발급 규칙(role)",
               at: "dynamic.sh L13–16",
               caption: "발급할 때 DB에 무엇을 실행할지 템플릿으로 정한다.",
               changes:[{"mark":"new","text":"└ roles/app · CREATE ROLE + GRANT SELECT"}] },
        view: {"left":{"title":"운영자","rows":[{"k":"write roles/app","v":"creation_statements=…"}]},"arrow":{"dir":"→","text":"define"},"right":{"title":"Vault 서버","rows":[{"k":"database/","v":"database 엔진"},{"k":"└ roles/app","v":"CREATE ROLE + GRANT SELECT","badge":"발급 규칙","mark":"new"}]}},
        alert: {"tone":"info","text":"role이 권한 범위를 정한다 — SELECT만 주면 그 이상은 못 한다."},
        code:{...CODE.dynamic, highlight:[13,14,15,16]},
      },
      { ...S4,
        beat:{ label: "TTL 설정",
               at: "dynamic.sh L17–18",
               caption: "발급된 자격증명의 수명을 정한다.",
               changes:[{"mark":"changed","text":"└ roles/app · default 1h / max 24h"}] },
        view: {"left":{"title":"운영자","rows":[{"k":"default_ttl","v":"1h"},{"k":"max_ttl","v":"24h"}]},"arrow":{"dir":"→","text":"set"},"right":{"title":"Vault 서버","rows":[{"k":"└ roles/app","v":"default 1h / max 24h","badge":"수명","mark":"changed"}]}},
        alert: {"tone":"good","text":"수명이 짧을수록 유출되어도 피해가 작다."},
        code:{...CODE.dynamic, highlight:[17,18]},
      },
      { ...S4,
        beat:{ label: "요청 → 즉석 발급",
               at: "dynamic.sh L20–21, L24–27",
               caption: "요청하는 순간 DB에 새 사용자가 실제로 만들어진다.",
               changes:[{"mark":"read","text":"lease_id · database/creds/app/Hk9…"},{"mark":"read","text":"받은 자격 · v-token-app-7Ab1… / A1!xYz9…"},{"mark":"new","text":"v-token-app-7Ab1… · CREATE ROLE 실행됨"}] },
        view: {"left":{"title":"app-1","rows":[{"k":"vault read","v":"database/creds/app"},{"k":"lease_id","v":"database/creds/app/Hk9…","mark":"read"},{"k":"받은 자격","v":"v-token-app-7Ab1… / A1!xYz9…","badge":"TTL 1h","mark":"read"}]},"arrow":{"dir":"←","text":"issue"},"right":{"title":"PostgreSQL","rows":[{"k":"v-token-app-7Ab1…","v":"CREATE ROLE 실행됨","badge":"신규 사용자","mark":"new"}]}},
        alert: {"tone":"good","text":"요청자마다 다른 사용자 — DB 로그에 누구인지 그대로 남는다."},
        code:{...CODE.dynamic, highlight:[20,21,24,25,26,27]},
      },
      { ...S4,
        beat:{ label: "자동 회수",
               at: "dynamic.sh L29–31",
               caption: "1시간이 지나면 Vault가 스스로 지운다.",
               changes:[{"mark":"gone","text":"받은 자격 · v-token-app-7Ab1…"},{"mark":"gone","text":"v-token-app-7Ab1… · DROP ROLE 실행됨"}] },
        view: {"left":{"title":"app-1","rows":[{"k":"받은 자격","v":"v-token-app-7Ab1…","badge":"lease 만료","mark":"gone"}]},"arrow":{"dir":"→","text":"revoke"},"right":{"title":"PostgreSQL","rows":[{"k":"v-token-app-7Ab1…","v":"DROP ROLE 실행됨","mark":"gone"}]}},
        alert: {"tone":"good","text":"lease_id로 발급·회수 이력이 남아 추적할 수 있다."},
        code:{...CODE.dynamic, highlight:[29,30,31]},
      },
      // ── Step 5 ────────────────────────────────────────────────────
      { ...S5,
        beat:{ label: "엔진 목록",
               at: "engines-overview.sh L2, L5–9",
               caption: "한 Vault 안에 경로별로 여러 엔진이 꽂혀 있다.",
               changes:[{"mark":"new","text":"secret/ · kv — 정적 보관"},{"mark":"new","text":"database/ · DB 사용자 발급"},{"mark":"new","text":"aws/ · IAM STS 발급"}] },
        view: {"left":{"title":"운영자","rows":[{"k":"vault secrets list","v":"마운트 조회"}]},"arrow":{"dir":"←","text":"list"},"right":{"title":"Vault 서버 — 마운트","rows":[{"k":"secret/","v":"kv — 정적 보관","badge":"정적","mark":"new"},{"k":"database/","v":"DB 사용자 발급","badge":"동적","mark":"new"},{"k":"aws/","v":"IAM STS 발급","badge":"동적","mark":"new"},{"k":"transit/","v":"암복호화 (키는 안 줌)","badge":"서비스","mark":"new"},{"k":"pki/","v":"짧은 수명 TLS 인증서","badge":"동적","mark":"new"}]}},
        alert: {"tone":"info","text":"engine은 경로 단위 모듈 — 필요한 만큼 꽂는다."},
        code:{...CODE.overview, highlight:[2,5,6,7,8,9]},
      },
      { ...S5,
        beat:{ label: "KV에서 읽기",
               at: "engines-overview.sh L11–13",
               caption: "외부 서비스 키처럼 회전이 어려운 값은 KV에서 읽는다.",
               changes:[{"mark":"read","text":"받은 값 · sk_live_xxxxxxxxxxxxxx"}] },
        view: {"left":{"title":"앱","rows":[{"k":"kv get","v":"secret/external/stripe"},{"k":"받은 값","v":"sk_live_xxxxxxxxxxxxxx","badge":"매번 동일","mark":"read"}]},"arrow":{"dir":"←","text":"read"},"right":{"title":"secret/ (kv)","rows":[{"k":"external/stripe","v":"sk_live_…","badge":"정적"}]}},
        alert: {"tone":"info","text":"Stripe가 발급한 키는 Vault가 만들어 줄 수 없다 → 보관이 답이다."},
        code:{...CODE.overview, highlight:[11,12,13]},
      },
      { ...S5,
        beat:{ label: "DB는 동적 발급",
               at: "engines-overview.sh L15–16, L18–19",
               caption: "DB 자격은 요청할 때마다 새로 만들어 받는다.",
               changes:[{"mark":"read","text":"받은 자격 · v-token-app-7Ab1… (매번 다름)"}] },
        view: {"left":{"title":"앱","rows":[{"k":"vault read","v":"database/creds/app"},{"k":"받은 자격","v":"v-token-app-7Ab1… (매번 다름)","badge":"TTL 1h","mark":"read"}]},"arrow":{"dir":"←","text":"issue"},"right":{"title":"database/ (dynamic)","rows":[{"k":"creds/app","v":"요청 시 CREATE ROLE","badge":"동적"}]}},
        alert: {"tone":"good","text":"회전 가능한 백엔드는 전부 이쪽으로 옮기는 게 이득이다."},
        code:{...CODE.overview, highlight:[15,16,18,19]},
      },
      { ...S5,
        beat:{ label: "AWS 임시 키",
               at: "engines-overview.sh L22–24, L26–27",
               caption: "AWS도 같은 방식 — 만료되는 임시 자격을 받는다.",
               changes:[{"mark":"read","text":"받은 키 · ASIA… + security_token"}] },
        view: {"left":{"title":"앱","rows":[{"k":"vault read","v":"aws/creds/readonly"},{"k":"받은 키","v":"ASIA… + security_token","badge":"3600s","mark":"read"}]},"arrow":{"dir":"←","text":"issue"},"right":{"title":"aws/ (dynamic)","rows":[{"k":"creds/readonly","v":"STS 임시 자격","badge":"동적"}]}},
        alert: {"tone":"good","text":"영구 IAM 키를 서버에 두지 않아도 된다."},
        code:{...CODE.overview, highlight:[22,23,24,26,27]},
      },
      { ...S5,
        beat:{ label: "정리",
               at: "engines-overview.sh L29–33",
               caption: "정적은 KV, 회전 가능한 것은 dynamic — 이 분담이 실무 표준이다.",
               changes:[] },
        view: {"left":{"title":"KV v2에 두는 것","rows":[{"k":"Stripe API key","v":"외부 발급"},{"k":"JWT secret","v":"사람이 정함"},{"k":"인증서","v":"수동 갱신"}]},"right":{"title":"dynamic으로 받는 것","rows":[{"k":"DB 사용자","v":"TTL 1h"},{"k":"AWS IAM","v":"TTL 1h"},{"k":"PKI 인증서","v":"role 이 TTL 지정"}]}},
        alert: {"tone":"good","text":"다음: 이 엔진에 누가 들어올 수 있는가 — auth method."},
        code:{...CODE.overview, highlight:[29,30,31,32,33]},

    ];

    // ── RefPanel ── 그림에 다 담지 못한 표·명령 정리 (레슨 화면의 "표·정리 보기")
    function RefPanel({ step, stepIdx }) {
      const g = Number((step.title.match(/^Step (\d)/) || [0, 1])[1]) - 1;
      if (g === 0) return (<div>
        <h4>시크릿이 새는 길과 막는 능력</h4>
        <table><thead><tr><th>문제</th><th>필요한 능력</th></tr></thead><tbody>
          <tr><td>파일을 읽을 수 있으면 누구나 안다</td><td>보관: 한 곳에 두고 접근을 통제한다</td></tr>
          <tr><td>git 이력에 남으면 회수가 안 된다</td><td>발급: 필요할 때 받아 쓰고 오래 들고 있지 않는다</td></tr>
          <tr><td>누가 봤는지 모른다</td><td>감사: 누가·언제 받았는지 기록한다</td></tr>
        </tbody></table>
      </div>);
      if (g === 1) return (<div>
        <h4>KV v2 명령과 동작</h4>
        <table><thead><tr><th>명령</th><th>하는 일</th></tr></thead><tbody>
          <tr><td className="font-mono">kv put</td><td>새 버전을 쌓는다 (v1, v2 …)</td></tr>
          <tr><td className="font-mono">kv get</td><td>최신 버전을 읽는다. <span className="font-mono">-version=N</span> 으로 옛 버전도 읽는다</td></tr>
          <tr><td className="font-mono">kv rollback</td><td>옛 버전 값을 복사해 새 버전으로 쌓는다</td></tr>
          <tr><td className="font-mono">kv delete</td><td>최신 버전을 soft delete 한다. <span className="font-mono">kv undelete</span> 로 되살린다</td></tr>
          <tr><td className="font-mono">kv destroy</td><td>지정한 버전의 데이터를 영구 삭제한다</td></tr>
          <tr><td className="font-mono">kv metadata delete</td><td>키와 모든 버전을 지운다</td></tr>
        </tbody></table>
        <ul>
          <li>버전은 기본 10개까지 남고, 넘으면 가장 오래된 버전이 영구 삭제된다 (<span className="font-mono">max_versions</span>).</li>
          <li><span className="font-mono">cas_required=true</span> 면 쓰기마다 <span className="font-mono">cas</span>(지금 버전 번호)를 맞춰야 해서 동시에 덮어쓰는 사고를 막는다.</li>
          <li>KV v1 은 버전이 없어 덮어쓰면 이전 값이 사라진다.</li>
          <li>실제 API 경로는 <span className="font-mono">secret/data/…</span>(값)과 <span className="font-mono">secret/metadata/…</span>(목록·버전 정보)로 나뉜다. 정책을 쓸 때 이 경로를 쓴다.</li>
        </ul>
      </div>);
      if (g === 2) return (<div>
        <h4>정적 시크릿이 남기는 문제</h4>
        <table><tbody>
          <tr><td>출처</td><td>모든 인스턴스가 같은 값이라 DB 로그가 전부 user=app 이다</td></tr>
          <tr><td>회수</td><td>DB 비밀번호 변경 → KV 갱신 → 인스턴스 100개 재시작</td></tr>
          <tr><td>사람</td><td>값을 본 사람은 퇴사해도 계속 안다</td></tr>
        </tbody></table>
      </div>);
      if (g === 3) return (<div>
        <h4>database 엔진 흐름</h4>
        <table><thead><tr><th>경로</th><th>역할</th></tr></thead><tbody>
          <tr><td className="font-mono">database/config/my-pg</td><td>Vault 가 DB 에 붙을 관리자 접속</td></tr>
          <tr><td className="font-mono">database/roles/app</td><td>발급할 때 실행할 SQL 과 TTL (default 1h, max 24h)</td></tr>
          <tr><td className="font-mono">database/creds/app</td><td>읽을 때마다 새 사용자와 lease 를 만든다</td></tr>
        </tbody></table>
        <ul>
          <li>lease 는 <span className="font-mono">vault lease renew &lt;lease_id&gt;</span> 로 max_ttl 안에서 늘리고, <span className="font-mono">vault lease revoke</span> 로 바로 회수한다.</li>
          <li>lease 가 끝나면 Vault 가 revocation 문(기본은 권한 회수 후 DROP ROLE)을 실행한다.</li>
        </ul>
      </div>);
      if (g === 4) return (<div>
        <h4>마운트별 성격</h4>
        <table><thead><tr><th>경로</th><th>엔진</th><th>성격</th></tr></thead><tbody>
          <tr><td className="font-mono">secret/</td><td>kv</td><td>정적 보관 (Stripe 키, JWT secret, 인증서)</td></tr>
          <tr><td className="font-mono">database/</td><td>database</td><td>요청마다 DB 사용자 발급</td></tr>
          <tr><td className="font-mono">aws/</td><td>aws</td><td>STS 임시 자격 발급</td></tr>
          <tr><td className="font-mono">transit/</td><td>transit</td><td>암호화·복호화를 대신 해 주고 키는 내주지 않는다</td></tr>
          <tr><td className="font-mono">pki/</td><td>pki</td><td>짧은 수명 TLS 인증서 발급</td></tr>
        </tbody></table>
        <h4>고르는 기준</h4>
        <table><tbody>
          <tr><td>외부가 정한 값, 사람이 정하는 값</td><td>KV v2 에 보관</td></tr>
          <tr><td>Vault 가 직접 만들고 지울 수 있는 자격</td><td>dynamic 엔진으로 발급</td></tr>
        </tbody></table>
      </div>);
      return null;
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
