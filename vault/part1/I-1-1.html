  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

    /** STEP × beat 를 한 줄로 펼친다. 다음/이전 버튼은 이 배열 위를 이동한다. */

      step.beats.map((beat, bi) => ({ step, si, beat, bi, beats: step.beats.length }))

    const MARK = {

      read:    { bd: '#93c5fd', bg: '#eff6ff', sign: '→', tip: '전달됨' },

    };

    function StageBox({ box, beatKey }) {

        <div className="rounded-lg overflow-hidden bg-white flex-1 min-w-0" style={{ border: `1px solid ${BRAND}` }}>

            )}
            {box.rows.map((row, i) => {
              const m = row.mark ? MARK[row.mark] : null;
              return (
                <div key={beatKey + '-' + i}
                     className={`rounded-md px-2 py-1.5 text-[11px] ${m ? 'trn-mark' : ''}`}

                    {m && <span className="font-bold shrink-0" style={{ color: m.bd }} title={m.tip}>{m.sign}</span>}

                    {row.badge && (
                      <span className="ml-auto shrink-0 px-1.5 py-0.5 rounded-full text-[9px] font-bold"

    const NOTE_STYLE = {

      if (!note) return null;

    /** 강조 줄 번호 배열을 "L3–L7" 같은 사람이 읽는 표기로 바꾼다. */
    function hlLabel(hl) {
      const a = [...hl].sort((x, y) => x - y);
      const parts = [];
      let s = a[0], p = a[0];
      for (let i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        parts.push(s === p ? 'L' + s : 'L' + s + '–' + p);
        s = a[i]; p = a[i];
      }
      return parts.join(', ');
    }

    function LiveDataPane({ beat, filename, beatKey }) {

      return (

    function CodeViewer({ code, hl, beatLabel, beatIdx, beatTotal }) {
      const codeRef = useRef(null);
      // hljs 는 렌더 이후(useEffect)에 동작하므로, 결과를 state 로 되돌려 한 번 더 그린다.
      // (이 과정이 없으면 스텝을 넘겨도 코드 본문이 이전 파일 내용으로 남는다)
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(hl || []);
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] px-1.5 py-0.5 rounded font-mono"
                  style={{ background: 'rgba(255,204,51,.18)', color: BRAND }}>{hlLabel(hl)} · {beatLabel}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre key={code.filename} ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`}
                       style={isHi ? { background: 'rgba(255,204,51,0.18)', borderLeft: `2px solid ${BRAND}` } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    {tokens && tokens[i] !== undefined
                      ? <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
                      : <span className="flex-1">{line}</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines · 강조 {highlightSet.size}줄</span>
            <span>세부 {beatIdx + 1} / {beatTotal}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [idx, setIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const cur = FLAT[idx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setIdx((i) => Math.min(FLAT.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setIdx((i) => {
            if (i >= FLAT.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = idx === FLAT.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg,#fffbe6 0%,#fef3c7 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-4 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg font-bold" style={{ background: BRAND, color: DARK }}>V</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: DARK }}>I-1-1. secret engine — KV vs dynamic</h1>
                <p className="text-sm" style={{ color: SUB }}>비유: 은행 금고(KV) vs 즉석 발권기(dynamic). 시크릿을 어디에 어떻게 보관/발급할지의 첫 결정.</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: SUB }}>← 챕터 목록</a>
            </header>

            {/* 진행바: 큰 칸 = STEP, 안의 점 = 세부 단계(beat) */}
            <div className="mb-3 flex gap-1.5">
              {STEPS.map((s, si) => (
                <div key={si} className="flex-1">
                  <div className="h-1.5 rounded-full transition" style={{ background: si <= cur.si ? BRAND : '#fde68a' }} />
                  <div className="flex gap-0.5 mt-1">
                    {s.beats.map((_, bi) => (
                      <div key={bi} className="h-1 flex-1 rounded-full transition"
                           style={{ background: si < cur.si || (si === cur.si && bi <= cur.bi) ? DARK : '#f0e6c8' }} />
                    ))}
                  </div>
                </div>
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-3 shadow" style={{ background: BRAND, color: DARK }}>
              <div className="text-[11px] font-bold opacity-70 mb-0.5">STEP {cur.si + 1} / {STEPS.length} · 세부 {cur.bi + 1} / {cur.beats}</div>
              <h2 className="text-lg font-bold mb-1">{cur.step.title}</h2>
              <p className="text-sm leading-relaxed">{cur.step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={cur.beat} filename={cur.step.code.filename} beatKey={idx} />
              <CodeViewer code={cur.step.code} hl={cur.beat.hl} beatLabel={cur.beat.label} beatIdx={cur.bi} beatTotal={cur.beats} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{ border: `1px solid ${BRAND}`, color: DARK }}>처음</button>
              <button onClick={() => setIdx((i) => Math.max(0, i - 1))} disabled={idx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: DARK }}>← 이전</button>
              <button onClick={() => { if (isLast) setIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold" style={{ background: BRAND, color: DARK }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setIdx((i) => Math.min(FLAT.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: DARK }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: SUB }}>키보드 ←/→ · 자동재생 3초/단계 · 왼쪽 그림은 오른쪽 강조 줄에 그대로 대응한다</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{ border: `2px solid ${BRAND}`, color: DARK }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                secret engine = "시크릿을 어떻게 다룰지" 의 모듈. KV v2 는 사람이 적은 정적 값(인증서, 외부 API 키)을 버전 관리하며 보관한다. database/aws 같은 dynamic engine 은 요청마다 짧은 수명의 자격증명을 즉석 발급해, 유출 추적과 자동 회수가 가능하다. 실무는 둘을 섞어 쓴다. 다음 챕터는 "누가 이 엔진에 들어올 수 있는가" — auth method.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Vault', 'secret-engine', 'KV-v2', 'dynamic', 'lease', 'TTL'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{ background: '#fffbe6', color: DARK, border: '1px solid #fde68a' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: SUB }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
