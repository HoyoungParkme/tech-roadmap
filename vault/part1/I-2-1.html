  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;

    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }

  <script>window.LESSON = {"topic": "vault", "topicName": "HashiCorp Vault", "topicHref": "../index.html", "id": "I-2-1", "title": "policy — capabilities와 path glob", "sub": "비유: 출입증에 \"어느 방에서 무엇을 할 수 있는가\" 를 적어 둔 규칙표. 인증 다음의 인가.", "path": "part1/I-2-1.html", "prev": {"id": "I-1-2", "title": "auth method — token/userpass/approle/k8s", "href": "../part1/I-1-2.html"}, "next": {"id": "I-2-2", "title": "token — TTL/renewable/orphan/accessor", "href": "../part1/I-2-2.html"}, "wrap": "policy = \"이 token이 어떤 path에서 무엇(capabilities)을 할 수 있는가\" 의 규칙이다. path는 \"+\"(한 세그먼트)와 \"*\"(끝 나머지)로 glob 매칭하고, 겹치면 더 구체적인 path 하나가 이긴다. 같은 path 안에서 deny는 최우선이라 민감 경로 봉쇄에 쓴다. token에는 정책 여러 개를 붙이고, 같은 path는 capabilities를 합친다. templated policy는 identity를 path에 끼워 사용자/팀별 격리를 하나의 정책으로 만든다. 실무 원칙은 최소 권한 + 팀/앱별 정책 분리 + deny 못 박기. 다음: token — 이 정책을 실제로 들고 다니는 주체."};</script>

<body>

  <!--
    Vault I-2-1 — policy (capabilities 와 path glob)
    비유: 건물 출입증에 "어느 층, 어느 방, 무엇을 할 수 있는가" 를 적어 둔 규칙표
    5단계: 인증 이후의 인가 문제 → path+capabilities → path glob 과 우선순위 → deny/최소권한/합집합 → templated policy + 실무
    좌 LiveDataPane(정책 판정 흐름: 요청 path+동작 vs path glob/capabilities → 허용/거부, deny 우선) / 우 CodeViewer
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FFCC33';
    const DARK  = '#7c5e00';
    const SUB   = '#b8860b';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      whyPolicy: {lang:'text', filename:'why-policy.txt', lines:[
        "# 인증(authentication) 과 인가(authorization) 는 다르다",
        "",
        "#  authentication : \"너 누구야?\"      → auth method (userpass, k8s...)",
        "#  authorization  : \"뭘 할 수 있어?\"  → policy (이번 주제)",
        "",
        "# 로그인만으로는 아무 권한도 없다",
        "$ vault login -method=userpass username=alice",
        "#   token: hvs.CAESI...          ← 신원은 확인됨",
        "",
        "$ vault kv get secret/app/db",
        "#   Error: permission denied     ← 정책이 없으면 아무것도 못 읽는다",
        "",
        "# Vault 의 기본 규칙",
        "#   - 명시하지 않은 path = 거부(deny)",
        "#   - 허용하려면 정책에 path 와 capabilities 를 적어야 한다",
        "#   - 최소 권한(least privilege): 필요한 것만 딱 열어 준다",
        "",
        "# → 다음 단계: 정책 파일(HCL)의 생김새를 본다",
      ]},
      appPolicy: {lang:'hcl', filename:'app-policy.hcl', lines:[
        "# 앱 서비스용 정책 (HCL)",
        "",
        "# 1) 공용 앱 시크릿: 읽기만 허용",
        "path \"secret/data/app/*\" {",
        "  capabilities = [\"read\", \"list\"]",
        "}",
        "",
        "# 2) 내 앱 전용 경로: 읽고 쓰기까지 허용",
        "path \"secret/data/myapp/*\" {",
        "  capabilities = [\"create\", \"read\", \"update\"]",
        "}",
        "",
        "# capabilities 목록",
        "#   create  → 없던 값 새로 쓰기 (POST/PUT)",
        "#   read    → 값 읽기   (GET)",
        "#   update  → 있던 값 바꾸기  (POST/PUT)",
        "#   delete  → 삭제       (DELETE)",
        "#   patch   → 일부만 고치기 (PATCH)",
        "#   list    → 키 목록     (LIST)",
        "#   sudo    → 루트 전용 특수 경로",
        "#   deny    → 무조건 거부 (최우선)",
        "",
        "# 적지 않은 동작은? → 자동으로 거부된다",
      ]},
      globPolicy: {lang:'hcl', filename:'glob-policy.hcl', lines:[

        rows: [
          { path: "secret/data/app/prod", action: "read", rule: "deny 규칙이 최우선 적용", verdict: "deny" },
          { path: "sys/policies/acl", action: "update", rule: "sys/* deny → 관리 API 차단", verdict: "deny" },
        ],
        alert: { tone: "danger", text: "관리 경로는 실수 여지를 없애 버린다." },
        code:{...CODE.leastPrivilege, highlight:[15,16,17,18]},
      },
      { ...S4,
        beat:{ label: "정책 합집합",
               at: "least-privilege.hcl L20–23",
               caption: "정책 여러 개에 같은 path가 있으면 capabilities를 합친다. 그 안에 deny가 있으면 거부다.",
               changes:[{mark:'read', text: "app-read + app-write 합집합"},
                        {mark:'gone', text: "delete는 어느 쪽에도 없음"}] },
        scene: "deny",
        rows: [
          { path: "secret/data/app/db", action: "read", rule: "app-read + app-write 합집합", verdict: "allow" },
          { path: "secret/data/app/db", action: "delete", rule: "delete 는 어느 정책에도 없음", verdict: "deny" },
        ],
        alert: { tone: "warn", text: "합집합에서도 deny가 하나면 그 path는 거부." },
        code:{...CODE.leastPrivilege, highlight:[20,21,22,23]},
      },
      { ...S4,
        beat:{ label: "최소 권한 원칙",
               at: "least-privilege.hcl L25",
               caption: "넓게 열지 말고 필요한 것만 + 위험한 곳은 deny로 못 박는다.",
               changes:[{mark:'read', text: "최소 권한 + deny 못 박기"}] },
        scene: "deny",
        rows: [
          { path: "secret/data/app/db", action: "read", rule: "app-read + app-write 합집합", verdict: "allow" },
          { path: "secret/data/app/db", action: "delete", rule: "delete 는 어느 정책에도 없음", verdict: "deny" },
          { path: "secret/data/app/prod", action: "read", rule: "deny 규칙이 최우선 적용", verdict: "deny" },
          { path: "sys/policies/acl", action: "update", rule: "sys/* deny → 관리 API 차단", verdict: "deny" },
        ],
        alert: { tone: "danger", text: "같은 path 안에서는 deny가 어떤 allow보다 우선한다. 다른 path 끼리는 더 구체적인 쪽 하나만 적용된다." },
        code:{...CODE.leastPrivilege, highlight:[25]},
      },
      // ── Step 5 ────────────────────────────────────────────────────
      { ...S5,
        beat:{ label: "변수 든 path",
               at: "templated-policy.hcl L3–6",
               caption: "{{identity.entity.name}}이 로그인한 사용자 이름으로 치환된다.",
               changes:[{mark:'new', text: "templated path 선언 (CRUD)"}] },
        scene: "templated",
        rows: [
          { path: "secret/data/user/{{identity.entity.name}}/*", action: "CRUD", rule: "entity 이름으로 치환", verdict: "allow" },
        ],
        alert: { tone: "info", text: "정책 파일 하나로 사용자마다 다른 path가 된다." },
        code:{...CODE.templatedPolicy, highlight:[3,4,5,6]},
      },
      { ...S5,
        beat:{ label: "알아서 격리",
               at: "templated-policy.hcl L7–9",
               caption: "alice는 자기 경로만 — bob 경로는 자동으로 거부된다.",
               changes:[{mark:'changed', text: "{{...}} → alice 치환"},
                        {mark:'gone', text: "bob 경로 접근 거부"}] },
        scene: "templated",
        rows: [
          { path: "secret/data/user/alice/note", action: "read", rule: "alice 로 치환 → 본인 경로", verdict: "allow" },
          { path: "secret/data/user/bob/note", action: "read", rule: "alice 가 bob 경로 접근", verdict: "deny" },
        ],
        alert: { tone: "good", text: "정책 하나로 개인 격리가 끝난다." },
        code:{...CODE.templatedPolicy, highlight:[7,8,9]},
      },
      { ...S5,
        beat:{ label: "팀 단위 격리",
               at: "templated-policy.hcl L11–14",
               caption: "{{identity.entity.metadata.team}}으로 팀별 경로도 같은 방식으로 연다.",
               changes:[{mark:'new', text: "팀 경로 정책 (read/list)"}] },
        scene: "templated",
        rows: [
          { path: "secret/data/team/team-a/*", action: "read", rule: "team=team-a 로 치환", verdict: "allow" },
          { path: "secret/data/team/team-b/*", action: "read", rule: "다른 팀 경로", verdict: "deny" },
        ],
        alert: { tone: "info", text: "메타데이터 team=team-a인 사용자는 team-a 경로만 연다." },
        code:{...CODE.templatedPolicy, highlight:[11,12,13,14]},
      },
      { ...S5,
        beat:{ label: "등록과 부착",
               at: "templated-policy.hcl L16–21",
               caption: "policy write로 등록하고 token create에 -policy로 붙인다.",
               changes:[{mark:'new', text: "정책 2개 등록"},
                        {mark:'read', text: "token에 부착 = 합집합"}] },
        scene: "templated",
        rows: [
          { path: "sys/policies/acl/app-read", action: "write", rule: "vault policy write 로 등록", verdict: "allow" },
          { path: "token", action: "create", rule: "-policy 2개 부착 — 합집합", verdict: "allow" },
        ],
        alert: { tone: "info", text: "정책은 등록 → 부착 순서로 살아난다." },
        code:{...CODE.templatedPolicy, highlight:[16,17,18,19,20,21]},
      },
      { ...S5,
        beat:{ label: "실무 원칙",
               at: "templated-policy.hcl L23–27",
               caption: "팀/앱별 분리 + 최소 권한 + deny 못 박기 + templated 격리.",
               changes:[{mark:'read', text: "실무 원칙 4가지"}] },
        scene: "templated",
        rows: [
          { path: "secret/data/user/alice/note", action: "read", rule: "alice 로 치환 → 본인 경로", verdict: "allow" },
          { path: "secret/data/user/bob/note", action: "read", rule: "alice 가 bob 경로 접근", verdict: "deny" },
          { path: "secret/data/team/team-a/*", action: "read", rule: "team=team-a 로 치환", verdict: "allow" },
          { path: "secret/data/team/team-b/*", action: "read", rule: "다른 팀 경로", verdict: "deny" },
        ],
        alert: { tone: "good", text: "templated policy로 개인/팀 자동 격리. 실무: 팀·앱별 정책 분리 + deny로 민감 경로 봉쇄." },
        code:{...CODE.templatedPolicy, highlight:[23,24,25,26,27]},
      },
    ];

    // ── RefPanel ── 그림에 다 담지 못한 표·명령 정리 (레슨 화면의 "표·정리 보기")
    function RefPanel({ step, stepIdx }) {
      const g = Number((step.title.match(/^Step (\d)/) || [0, 1])[1]) - 1;
      if (g === 0) return (<div>
        <h4>인증과 인가</h4>
        <table><thead><tr><th></th><th>질문</th><th>담당</th></tr></thead><tbody>
          <tr><td>authentication</td><td>너 누구야?</td><td>auth method (userpass, kubernetes …)</td></tr>
          <tr><td>authorization</td><td>뭘 할 수 있어?</td><td>policy</td></tr>
        </tbody></table>
        <p>정책을 하나도 적지 않은 path 는 모두 거부된다. 모든 token 에는 자기 token 조회·갱신 같은 최소 권한만 담긴 <span className="font-mono">default</span> 정책이 붙는다.</p>
      </div>);
      if (g === 1) return (<div>
        <h4>capabilities</h4>
        <table><thead><tr><th>capability</th><th>HTTP</th><th>뜻</th></tr></thead><tbody>
          <tr><td className="font-mono">create</td><td>POST/PUT</td><td>없던 경로에 쓰기</td></tr>
          <tr><td className="font-mono">read</td><td>GET</td><td>읽기</td></tr>
          <tr><td className="font-mono">update</td><td>POST/PUT</td><td>있던 값 바꾸기</td></tr>
          <tr><td className="font-mono">patch</td><td>PATCH</td><td>일부만 고치기</td></tr>
          <tr><td className="font-mono">delete</td><td>DELETE</td><td>삭제</td></tr>
          <tr><td className="font-mono">list</td><td>LIST</td><td>키 목록</td></tr>
          <tr><td className="font-mono">sudo</td><td>없음</td><td>root 보호 경로 접근</td></tr>
          <tr><td className="font-mono">deny</td><td>없음</td><td>거부. 같은 path 의 다른 capability 보다 앞선다</td></tr>
        </tbody></table>
        <p>KV v2 의 목록 보기는 <span className="font-mono">secret/metadata/…</span> 경로로 간다. <span className="font-mono">secret/data/app/*</span> 에 list 를 줘도 목록은 열리지 않으니, 목록이 필요하면 <span className="font-mono">secret/metadata/app/*</span> 에 list 를 준다.</p>
      </div>);
      if (g === 2) return (<div>
        <h4>여러 패턴이 걸릴 때 (낮은 우선순위가 되는 조건)</h4>
        <table><tbody>
          <tr><td>1</td><td>첫 + 나 * 가 더 앞에서 나온다</td></tr>
          <tr><td>2</td><td>* 로 끝난다 (상대는 그렇지 않다)</td></tr>
          <tr><td>3</td><td>+ 세그먼트가 더 많다</td></tr>
          <tr><td>4</td><td>패턴이 더 짧다</td></tr>
          <tr><td>5</td><td>사전 순으로 더 작다</td></tr>
        </tbody></table>
        <h4>glob-policy.hcl 판정 (문서 규칙을 python 으로 재현)</h4>
        <table><thead><tr><th>요청</th><th>적용 패턴</th><th>결과</th></tr></thead><tbody>
          <tr><td className="font-mono">read app/db</td><td className="font-mono">secret/data/app/*</td><td>허용 (+/db 보다 우선)</td></tr>
          <tr><td className="font-mono">read team/db</td><td className="font-mono">secret/data/+/db</td><td>허용</td></tr>
          <tr><td className="font-mono">read app/sub/db</td><td className="font-mono">secret/data/app/*</td><td>허용 (+/db 와는 불일치)</td></tr>
          <tr><td className="font-mono">update app/token</td><td className="font-mono">secret/data/app/token</td><td>허용</td></tr>
          <tr><td className="font-mono">read secret/data/app</td><td>없음</td><td>거부 (app/* 는 app 자체와 맞지 않는다)</td></tr>
        </tbody></table>
        <p>+ 는 Vault 1.1 부터 쓸 수 있고, * 는 path 의 마지막 글자로만 쓴다.</p>
      </div>);
      if (g === 3) return (<div>
        <h4>정책 여러 개를 붙였을 때</h4>
        <table><tbody>
          <tr><td>같은 path 패턴</td><td>capabilities 를 합친다. 그 안에 deny 가 있으면 거부</td></tr>
          <tr><td>다른 path 패턴</td><td>우선순위가 가장 높은 패턴 하나만 적용</td></tr>
        </tbody></table>
        <p>그래서 넓은 glob(<span className="font-mono">secret/data/app/*</span>)에만 deny 를 걸면, 다른 정책의 <span className="font-mono">secret/data/app/prod</span> 허용이 이긴다. 막아야 하는 경로는 정확한 path 로 deny 를 적는다.</p>
      </div>);
      if (g === 4) return (<div>
        <h4>templated policy 에 쓸 수 있는 값 (일부)</h4>
        <table><tbody>
          <tr><td className="font-mono">identity.entity.id · identity.entity.name</td><td>entity ID · 이름</td></tr>
          <tr><td className="font-mono">identity.entity.metadata.&lt;키&gt;</td><td>entity 메타데이터 (예: team)</td></tr>
          <tr><td className="font-mono">identity.entity.aliases.&lt;mount accessor&gt;.name</td><td>그 auth mount 에서의 로그인 이름</td></tr>
          <tr><td className="font-mono">identity.groups.names.&lt;그룹 이름&gt;.id</td><td>그룹 이름으로 찾은 그룹 ID</td></tr>
        </tbody></table>
        <p><span className="font-mono">{'{{identity.groups.names}}'}</span> 처럼 그룹 목록을 통째로 넣는 형식은 없다. 팀 경로는 메타데이터나 그룹 정책으로 나눈다.</p>
      </div>);
      return null;
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
