  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>

  <!--
    Vault IV-2-2 — External Secrets Operator (ESO)
    비유: Vault 값을 K8s Secret 으로 자동 동기화하는 "배달원 오퍼레이터"
    5단계: 문제(외부 시크릿을 앱에 어떻게) → ESO 소개(CRD 동기화) → SecretStore(Vault 연결/인증) → ExternalSecret(매핑 → 동기화 흐름) → vs Agent Injector + refreshInterval + 실무
    그림: ./IV-2-2.anim.js (A형 레슨, ../../anim/lesson.jsx) · 코드: CodeViewer
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FFCC33';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"bash", filename:"before-eso.sh", lines:[
        "# ESO 없이 손으로 옮기던 흔한 풍경",
        "",
        "# 1) Vault 에서 값을 꺼내",
        "vault kv get -field=password secret/app/db",
        "#   super-secret-v2",
        "",
        "# 2) 사람이 손으로 K8s Secret 을 만든다",
        "kubectl create secret generic app-db \\",
        "  --from-literal=password=super-secret-v2",
        "",
        "# 3) 며칠 뒤 Vault 원본을 회전(rotate)",
        "vault kv put secret/app/db password=super-secret-v3",
        "",
        "# 4) 하지만 K8s Secret 은 그대로 v2...",
        "kubectl get secret app-db -o jsonpath=\"{.data.password}\" | base64 -d",
        "#   super-secret-v2   # 💥 원본과 불일치",
        "",
        "# → 누가 언제 다시 동기화? 아무도 모른다",
        "# → GitOps 로 Secret 을 커밋하면 평문 유출 위험",
        "",
        "# 필요한 것: \"Vault 원본 -> K8s Secret\" 자동 동기화",
        "# → External Secrets Operator(ESO) 가 그 다리다",
      ]},
      s2: {lang:"bash", filename:"install-eso.sh", lines:[
        "# ESO 설치 (Helm)",
        "helm repo add external-secrets \\",
        "  https://charts.external-secrets.io",
        "",
        "helm install external-secrets \\",
        "  external-secrets/external-secrets \\",
        "  -n external-secrets --create-namespace",
        "",
        "# 컨트롤러가 상주하며 CRD 를 감시한다",
        "kubectl get pods -n external-secrets",
        "#   external-secrets-xxxx          Running",
        "#   external-secrets-webhook-xxxx  Running",
        "#   external-secrets-cert-controller-xxxx  Running",
        "# 새로 생긴 CRD 종류 확인",
        "kubectl api-resources | grep external-secrets",
        "#   secretstores          SecretStore",
        "#   clustersecretstores   ClusterSecretStore",
        "#   externalsecrets       ExternalSecret",
        "",
        "# 다음: SecretStore 로 Vault 에 붙는 법을 정의한다",
      ]},
      s3: {lang:"yaml", filename:"secret-store.yaml", lines:[
        "# ClusterSecretStore — Vault 연결·인증 정의",
        "apiVersion: external-secrets.io/v1",
        "kind: ClusterSecretStore",
        "metadata:",
        "  name: vault-backend",
        "spec:",
        "  provider:",
        "    vault:",
        "      server: \"https://vault.default.svc:8200\"",
        "      path: \"secret\"          # KV 마운트 경로",
        "      version: \"v2\"            # KV v2",
        "      auth:",

        ],
        alert:{ tone:"info", text:"ExternalSecret은 값이 아니라 \"어디서 가져올지\" 만 담는다 — 평문이 없다." },
        code:{...CODE.s4, highlight:[1,2,3,4,5,6]},
      },
      { ...S4,
        beat:{ label:"주기와 연결 참조", at:"external-secret.yaml L7–11",
               caption:"refreshInterval: 1h마다 원본을 다시 읽고, secretStoreRef로 Step 3의 vault-backend 연결을 쓴다.",
               changes:[{mark:"new", text:"refreshInterval: 1h"},
                        {mark:"read", text:"vault-backend 연결 참조"}] },
        scene:"flow",
        items:[
          { who:"① ExternalSecret", what:"db-secret 생성됨", risk:"매핑 선언" },
          { who:"② ESO 조회", what:"vault: secret/app/db 읽기", risk:"Vault 접근" },
        ],
        alert:{ tone:"info", text:"연결(어떻게)과 매핑(무엇을)이 분리돼 있어 저장소를 바꿔도 매핑은 그대로다." },
        code:{...CODE.s4, highlight:[7,8,9,10,11]},
      },
      { ...S4,
        beat:{ label:"target 이름", at:"external-secret.yaml L12–13",
               caption:"target.name: app-db — ESO가 만들어 낼 K8s Secret의 이름이다.",
               changes:[{mark:"new", text:"생성될 Secret 이름 app-db"}] },
        scene:"flow",
        items:[
          { who:"① ExternalSecret", what:"db-secret 생성됨", risk:"매핑 선언" },
          { who:"② ESO 조회", what:"vault: secret/app/db 읽기", risk:"Vault 접근" },
        ],
        alert:{ tone:"info", text:"파드 매니페스트는 이 이름(app-db)만 알면 된다." },
        code:{...CODE.s4, highlight:[12,13]},
      },
      { ...S4,
        beat:{ label:"키 매핑", at:"external-secret.yaml L14–18",
               caption:"Vault의 secret/app/db에서 password 필드를 읽어, K8s Secret의 password 키로 넣으라는 매핑이다.",
               changes:[{mark:"new", text:"remoteRef → secretKey 매핑"}] },
        scene:"flow",
        items:[
          { who:"① ExternalSecret", what:"db-secret 생성됨", risk:"매핑 선언" },
          { who:"② ESO 조회", what:"vault: secret/app/db 읽기", risk:"Vault 접근" },
        ],
        alert:{ tone:"info", text:"data 항목을 여러 개 적으면 필드 여러 개를 한 Secret으로 모은다." },
        code:{...CODE.s4, highlight:[14,15,16,17,18]},
      },
      { ...S4,
        beat:{ label:"Secret이 태어난다", at:"external-secret.yaml L20–26",
               caption:"ESO가 Vault를 조회해 표준 kind: Secret app-db를 자동 생성했다. 파드는 평범한 env/volume으로 마운트하면 끝이다.",
               changes:[{mark:"new", text:"kind: Secret app-db 자동 생성"},
                        {mark:"read", text:"파드는 표준 마운트 그대로"}] },
        scene:"flow",
        items:[
          { who:"① ExternalSecret", what:"db-secret 생성됨", risk:"매핑 선언" },
          { who:"② ESO 조회", what:"vault: secret/app/db 읽기", risk:"Vault 접근" },
          { who:"③ K8s Secret", what:"kind: Secret app-db 생성", risk:"✓ 네이티브" },
          { who:"④ 파드", what:"envFrom: app-db (표준 마운트)", risk:"앱 무변경" },
        ],
        alert:{ tone:"good", text:"ExternalSecret 선언 → ESO가 Vault 조회 → 표준 K8s Secret 생성 → 파드는 그냥 마운트." },
        code:{...CODE.s4, highlight:[20,21,22,23,24,25,26]},
      },
      // ── Step 5 ────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:"동기화 상태 확인", at:"eso-in-practice.sh L1–3",
               caption:"ExternalSecret의 상태가 SecretSynced·READY: True — 매핑이 살아서 동작 중이다.",
               changes:[{mark:"read", text:"STATUS: SecretSynced"}] },
        scene:"compare",
        items:[
          { who:"ESO", what:"표준 K8s Secret 생성", risk:"✓ 앱 무변경" },
        ],
        alert:{ tone:"good", text:"동기화가 깨지면 이 STATUS에 에러가 뜬다 — 모니터링 포인트." },
        code:{...CODE.s5, highlight:[1,2,3]},
      },
      { ...S5,
        beat:{ label:"표준 Secret 확인", at:"eso-in-practice.sh L5–7",
               caption:"ESO가 만든 app-db는 TYPE: Opaque의 평범한 K8s Secret이다. 앱 입장에선 손으로 만든 것과 구분되지 않는다.",
               changes:[{mark:"read", text:"app-db = 네이티브 Secret"}] },
        scene:"compare",
        items:[
          { who:"ESO", what:"표준 K8s Secret 생성", risk:"✓ 앱 무변경" },
        ],
        alert:{ tone:"info", text:"네이티브라는 것이 핵심 — 기존 매니페스트·차트를 그대로 쓴다." },
        code:{...CODE.s5, highlight:[5,6,7]},
      },
      { ...S5,
        beat:{ label:"파드는 그냥 마운트", at:"eso-in-practice.sh L9–12",
               caption:"envFrom secretRef로 마운트한다. Injector처럼 파일을 읽는 게 아니라 표준 Secret을 쓰므로 앱 무변경이다.",
               changes:[{mark:"read", text:"envFrom: app-db"},
                        {mark:"gone", text:"앱의 Vault 인지 필요성"}] },
        scene:"compare",
        items:[
          { who:"Agent Injector", what:"사이드카가 파일 주입", risk:"앱이 파일 경로를 앎" },
          { who:"ESO", what:"표준 K8s Secret 생성", risk:"✓ 앱 무변경" },
        ],
        alert:{ tone:"good", text:"Injector는 파일 주입(앱이 경로를 알아야 함), ESO는 표준 Secret(완전 무변경)." },
        code:{...CODE.s5, highlight:[9,10,11,12]},
      },
      { ...S5,
        beat:{ label:"회전 자동 반영", at:"eso-in-practice.sh L14–17",
               caption:"Vault 원본을 v4로 회전하면 refreshInterval(1h) 안에 ESO가 재동기화해 app-db가 v4로 갱신된다. Step 1의 불일치가 사라진다.",
               changes:[{mark:"changed", text:"원본 v4 → Secret 자동 갱신"},
                        {mark:"gone", text:"수동 재동기화 업무"}] },
        scene:"compare",
        items:[
          { who:"Agent Injector", what:"사이드카가 파일 주입", risk:"앱이 파일 경로를 앎" },
          { who:"ESO", what:"표준 K8s Secret 생성", risk:"✓ 앱 무변경" },
          { who:"refreshInterval", what:"주기마다 원본 재조회", risk:"🔄 회전 반영" },
        ],
        alert:{ tone:"good", text:"회전 주기는 refreshInterval로 조절 — 민감한 값일수록 짧게." },
        code:{...CODE.s5, highlight:[14,15,16,17]},
      },
      { ...S5,
        beat:{ label:"env는 재시작해야", at:"eso-in-practice.sh L18",
               caption:"Secret이 v4로 바뀌어도 envFrom으로 받은 환경변수는 이미 떠 있는 파드 안에서 그대로다. 파드를 다시 띄워야 새 값을 읽는다. 볼륨으로 마운트한 Secret은 kubelet이 잠시 뒤 파일을 바꿔 준다.",
               changes:[{mark:"read", text:"env는 파드 시작 때 한 번 읽힘"},
                        {mark:"changed", text:"rollout restart 또는 볼륨 마운트"}] },
        scene:"compare",
        items:[
          { who:"Agent Injector", what:"사이드카가 파일 주입", risk:"앱이 파일 경로를 앎" },
          { who:"ESO", what:"표준 K8s Secret 생성", risk:"✓ 앱 무변경" },
          { who:"refreshInterval", what:"주기마다 원본 재조회", risk:"🔄 회전 반영" },
        ],
        alert:{ tone:"warn", text:"회전을 앱까지 닿게 하려면 rollout restart를 걸거나 Secret을 볼륨으로 마운트한다." },
        code:{...CODE.s5, highlight:[18]},
      },
      { ...S5,
        beat:{ label:"GitOps 친화", at:"eso-in-practice.sh L20–21",
               caption:"커밋하는 것은 매핑(ExternalSecret)뿐 — 실제 값은 클러스터 안에서 ESO가 채우므로 Git에 평문이 없다.",
               changes:[{mark:"read", text:"매핑만 커밋, 값은 Vault에만"}] },
        scene:"compare",
        items:[
          { who:"Agent Injector", what:"사이드카가 파일 주입", risk:"앱이 파일 경로를 앎" },
          { who:"ESO", what:"표준 K8s Secret 생성", risk:"✓ 앱 무변경" },
          { who:"refreshInterval", what:"주기마다 원본 재조회", risk:"🔄 회전 반영" },
          { who:"GitOps", what:"매핑만 커밋(평문 X)", risk:"✓ 안전" },
        ],
        alert:{ tone:"good", text:"Secret을 커밋하던 관행의 평문 유출 위험이 사라진다." },
        code:{...CODE.s5, highlight:[20,21]},
      },
      { ...S5,
        beat:{ label:"핵심 비교", at:"eso-in-practice.sh L23–26",
               caption:"Injector=파일 주입(앱이 파일 경로를 앎), ESO=네이티브 Secret(앱 무변경) + 자동 회전 + 멀티 백엔드 통합.",
               changes:[{mark:"read", text:"Injector vs ESO 정리"}] },
        scene:"compare",
        items:[
          { who:"Agent Injector", what:"사이드카가 파일 주입", risk:"앱이 파일 경로를 앎" },
          { who:"ESO", what:"표준 K8s Secret 생성", risk:"✓ 앱 무변경" },
          { who:"refreshInterval", what:"주기마다 원본 재조회", risk:"🔄 회전 반영" },
          { who:"GitOps", what:"매핑만 커밋(평문 X)", risk:"✓ 안전" },
          { who:"멀티 백엔드", what:"Vault · AWS · GCP · Azure", risk:"같은 CRD" },
        ],
        alert:{ tone:"good", text:"ESO = 네이티브 K8s Secret + 자동 회전 + GitOps 친화 + 여러 백엔드 통합." },
        code:{...CODE.s5, highlight:[23,24,25,26]},
      },
    ];

    // 표·정리 보기: 옛 왼쪽 패널이 장면마다 쌓아 보여 주던 항목과 비교표
    const REF_TITLE = {
      problem: '손으로 옮기던 시절', eso: 'ESO — 두 CRD 로 동기화', store: 'SecretStore — Vault 연결',
      flow: 'ExternalSecret → K8s Secret 흐름', compare: 'Injector vs ESO · 실무',
    };
    const VS = [
      ['전달 형태', '파드 안 파일 (/vault/secrets)', '표준 K8s Secret'],
      ['앱 쪽 변경', '파일 경로를 읽게 한다', '기존 env·volume 매니페스트 그대로'],
      ['값이 바뀌면', '사이드카가 파일을 다시 쓴다', 'refreshInterval 마다 Secret 갱신 (env 는 재시작해야 반영)'],
      ['평문이 놓이는 곳', '파드의 메모리 볼륨', 'etcd 의 Secret 객체'],
      ['백엔드', 'Vault', 'Vault · AWS · GCP · Azure 를 같은 CRD 로'],
    ];
    function RefPanel({ step }) {
      if (!step.items || !step.items.length) return null;
      return (
        <div>
          <h4>{REF_TITLE[step.scene] || '정리'}</h4>
          <table><thead><tr><th>대상</th><th>내용</th><th>비고</th></tr></thead>
            <tbody>{step.items.map((it, i) => <tr key={i}><td className="font-mono"><b>{it.who}</b></td><td className="font-mono">{it.what}</td><td>{it.risk}</td></tr>)}</tbody></table>
          {step.scene === 'compare' && (<div><h4>Agent Injector vs ESO</h4>
            <table><thead><tr><th></th><th>Agent Injector</th><th>ESO</th></tr></thead>
              <tbody>{VS.map((r) => <tr key={r[0]}><td><b>{r[0]}</b></td><td>{r[1]}</td><td>{r[2]}</td></tr>)}</tbody></table></div>)}
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
