  <script id="trn-focus-js">

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    Vault V-2-1 — audit device (감사 로그)
    비유: CCTV + 블랙박스 — 모든 요청/응답을 지워지지 않게 기록
    5단계: 왜 감사가 필요한가 → audit device 활성화(file/syslog/socket) → 로그 구조 + HMAC → 다중 device 이중화(하나 실패 시 차단) → SIEM 수집/규정준수
    그림: ./V-2-1.anim.js (audit device·로그 한 줄·SIEM) / 코드: CodeViewer(bash + json)
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FFCC33';
    const DARK  = '#7c5e00';
    const SUB   = '#b8860b';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      why: {lang:'bash', filename:'why-audit.sh', lines:[
        '# 감사 device 없이 운영하면 벌어지는 일',
        '',
        '# 현재 활성화된 audit device 확인',
        'vault audit list',
        '#   No audit devices are enabled.   # 💥 아무것도 안 남는다',
        '',
        '# 사고 발생: prod DB 비밀번호가 외부에 유출됨',
        '#   Q1. 누가 secret/prod/db 를 읽었는가?',
        '#   Q2. 언제, 어느 IP/토큰으로 읽었는가?',
        '#   Q3. 정상 접근인가, 탈취된 토큰인가?',
        '',
        '# → audit device 가 없으면 세 질문 모두 "모른다"',
        '# → 감사관 요구(누가 시크릿에 접근했는지) 대응 불가',
        '',
        '# 해결: 모든 요청/응답을 기록하는 audit device 를 켠다',
        '#   - file   : 파일로 기록 (가장 흔함)',
        '#   - syslog : OS syslog 로 전송',
        '#   - socket : TCP/UDP 로 수집기에 스트리밍',
        '',
        '# → 프로덕션 필수, 최소 2개 device 로 이중화 (뒤에서)',
      ]},
      enable: {lang:'bash', filename:'audit-enable.sh', lines:[
        '# 1) file audit device — 가장 흔한 기본형',
        'vault audit enable file \\',
        '  file_path=/var/log/vault/audit.log',
        '#   Success! Enabled the file audit device at: file/',
        '',
        '# 2) syslog audit device (Linux 한정)',
        'vault audit enable syslog tag="vault" facility="AUTH"',
        '',
        '# 3) socket audit device — 수집기로 스트리밍',
        'vault audit enable socket \\',
        '  address="collector.internal:9000" \\',
        '  socket_type="tcp"',
        '',
        '# 활성화된 device 확인',
        'vault audit list -detailed',
        '#   Path      Type      Description    Options',
        '#   ----      ----      -----------    -------',
        '#   file/     file                     file_path=/var/log/vault/audit.log',
        '#   syslog/   syslog                   facility=AUTH tag=vault',
        '#   socket/   socket                   address=collector.internal:9000',
        '',

          { who: 'auth', what: 'display_name=app, policies=[read-db]', risk: '누가' },
        ],
        alert: { tone: 'info', text: '토큰 원문은 절대 로그에 남지 않는다 — 해시만 남아 비교에만 쓴다.' },
        code: { ...CODE.log, highlight: [4, 5, 6, 7, 8, 9] },
      },
      { ...S3,
        beat:{ label:'request — 무엇을', at:'audit.log L10–16',
               caption:'request 블록이 "무엇을" 을 말한다. operation=read, path=secret/data/prod/db, 요청한 IP까지 남는다.',
               changes:[{mark:'read', text:'operation · path · remote_address'}] },
        scene: 'structure',
        flow: 'hmac',
        items: [
          { who: 'time', what: '2026-08-11T03:12:45Z', risk: '언제' },
          { who: 'auth', what: 'display_name=app, policies=[read-db]', risk: '누가' },
          { who: 'request', what: 'op=read, path=secret/prod/db', risk: '무엇을' },
        ],
        alert: { tone: 'info', text: '누가·언제·어디서·무엇을 — 사건의 4요소가 이 한 줄에 모인다.' },
        code: { ...CODE.log, highlight: [10, 11, 12, 13, 14, 15, 16] },
      },
      { ...S3,
        beat:{ label:'response — 값은 HMAC', at:'audit.log L17–22',
               caption:'응답의 password/username 같은 민감값은 HMAC-SHA256 해시로만 남는다. 로그가 새도 평문은 없다.',
               changes:[{mark:'changed', text:'password · username → HMAC 해시'},
                        {mark:'read', text:'동일 값 비교(상관 분석)는 가능'}] },
        scene: 'structure',
        flow: 'hmac',
        items: [
          { who: 'time', what: '2026-08-11T03:12:45Z', risk: '언제' },
          { who: 'auth', what: 'display_name=app, policies=[read-db]', risk: '누가' },
          { who: 'request', what: 'op=read, path=secret/prod/db', risk: '무엇을' },
          { who: 'response', what: 'data.password = hmac-sha256:9f2c…', risk: '🔒 HMAC 해시' },
        ],
        alert: { tone: 'good', text: '민감값은 HMAC로 해시 → 로그가 새도 시크릿 평문은 안 나온다. 값 비교(상관)는 가능.' },
        code: { ...CODE.log, highlight: [17, 18, 19, 20, 21, 22] },
      },

      // ── Step 4. fail-closed 이중화 ──────────────────────────────────────
      { ...S4,
        beat:{ label:'디스크 full → 500', at:'fail-closed.sh L3–7',
               caption:'단일 file device 상태에서 디스크가 꽉 차면, 평범한 kv get이 internal error로 거부된다.',
               changes:[{mark:'changed', text:'file/ write 실패 (디스크 full)'},
                        {mark:'gone', text:'kv get 응답 — Code 500'}] },
        scene: 'redundancy',
        flow: 'blocked',
        items: [
          { who: 'file/', what: '디스크 full → write 실패', risk: '🚨 실패' },
        ],
        alert: { tone: 'danger', text: '감사 기록에 실패하자 요청 자체가 거부됐다 — 디스크 하나가 Vault 전체를 세웠다.' },
        code: { ...CODE.failclosed, highlight: [3, 4, 5, 6, 7] },
      },
      { ...S4,
        beat:{ label:'fail-closed 원칙', at:'fail-closed.sh L9–10',
               caption:'"기록 못 하면 처리도 안 한다" — 기록한 device가 하나도 없으면 요청을 거부한다. device가 하나뿐이면 그래서 위험하다.',
               changes:[{mark:'read', text:'무결성 > 가용성 (설계 철학)'}] },
        scene: 'redundancy',
        flow: 'blocked',
        items: [
          { who: 'file/', what: '디스크 full → write 실패', risk: '🚨 실패' },
          { who: 'Vault 판정', what: '기록한 device 0개 → 요청 거부', risk: '⛔ 차단(fail-closed)' },
        ],
        alert: { tone: 'warn', text: 'device가 하나뿐이면 그 장애가 곧 Vault 전면 장애다.' },
        code: { ...CODE.failclosed, highlight: [9, 10] },
      },
      { ...S4,
        beat:{ label:'2개 device 이중화', at:'fail-closed.sh L12–16',
               caption:'서로 다른 목적지(로컬 file + 원격 socket)로 device 2개를 켠다. file이 실패해도 socket이 기록하니 요청이 흐른다.',
               changes:[{mark:'new', text:'file-local + socket-siem (2개)'},
                        {mark:'changed', text:'요청 다시 흐름'}] },
        scene: 'redundancy',
        flow: 'basic',
        items: [
          { who: 'file/', what: '디스크 full → write 실패', risk: '🚨 실패' },
          { who: 'socket-siem/', what: 'collector 정상 → write 성공', risk: '✓ 성공' },
          { who: 'Vault 판정', what: '기록한 device 0개 → 요청 거부', risk: '⛔ 차단(fail-closed)' },
        ],
        alert: { tone: 'info', text: '같은 종류 2개보다, 장애 원인이 겹치지 않는 목적지 2개(디스크+네트워크)가 정석이다.' },
        code: { ...CODE.failclosed, highlight: [12, 13, 14, 15, 16] },
      },
      { ...S4,
        beat:{ label:'둘 다 죽으면 다시 막힌다', at:'fail-closed.sh L18–22',
               caption:'주의 — 두 device가 모두 실패하면 기록할 곳이 없어 요청이 다시 막힌다. 이중화는 디스크·네트워크 감시와 세트다.',
               changes:[{mark:'read', text:'기록한 device 0개 → 차단'},
                        {mark:'read', text:'디스크/네트워크 알람 병행'}] },
        scene: 'redundancy',
        flow: 'blocked',
        items: [
          { who: 'file/', what: '디스크 full → write 실패', risk: '🚨 실패' },
          { who: 'socket-siem/', what: 'collector 다운 → write 실패', risk: '🚨 실패' },
          { who: 'Vault 판정', what: '기록한 device 0개 → 요청 거부', risk: '⛔ 차단(fail-closed)' },
        ],
        alert: { tone: 'warn', text: '단일 device는 위험 — 그 device가 죽으면 Vault 전체가 멈춘다. 최소 2개로 이중화하고 둘 다 감시한다.' },
        code: { ...CODE.failclosed, highlight: [18, 19, 20, 21, 22] },
      },

      // ── Step 5. SIEM 수집·분석 ──────────────────────────────────────────
      { ...S5,
        beat:{ label:'Fluent Bit → SIEM', at:'siem-pipeline.sh L3–7',
               caption:'file audit 로그를 Fluent Bit가 tail로 긁어 JSON 파싱 후 OpenSearch(SIEM)로 보낸다.',
               changes:[{mark:'new', text:'수집 파이프라인 (tail → SIEM)'}] },
        scene: 'siem',
        flow: 'siem',
        items: [
          { who: '수집', what: 'socket 스트리밍 / Fluent Bit tail', risk: '→ SIEM' },
        ],
        alert: { tone: 'info', text: '남기기만 하면 반쪽 — 모아야 검색·알림·보고가 가능해진다.' },
        code: { ...CODE.siem, highlight: [3, 4, 5, 6, 7] },
      },
      { ...S5,
        beat:{ label:'새벽 prod read 탐지', at:'siem-pipeline.sh L9–12',
               caption:'SIEM 쿼리로 "00~05시 사이 prod 경로 read" 를 걸러낸다. 시각·경로·operation이 전부 로그에 있어 가능하다.',
               changes:[{mark:'read', text:'path + operation + 시간대 필터'}] },
        scene: 'siem',
        flow: 'siem',
        items: [
          { who: '수집', what: 'socket 스트리밍 / Fluent Bit tail', risk: '→ SIEM' },
          { who: '탐지', what: '새벽 prod read, 대량 실패, 퇴사자 토큰', risk: '⚠️ 이상 알림' },
        ],
        alert: { tone: 'info', text: 'Step 3에서 본 로그 구조 그대로가 쿼리 필드가 된다 — 구조를 알면 탐지를 짤 수 있다.' },
        code: { ...CODE.siem, highlight: [9, 10, 11, 12] },
      },
      { ...S5,
        beat:{ label:'brute force 패턴', at:'siem-pipeline.sh L14–15',
               caption:'분당 50건 넘는 실패 응답 — 토큰 brute force의 전형적 신호를 카운트 규칙으로 잡는다.',
               changes:[{mark:'read', text:'error 급증 카운트 규칙 (>50/1m)'}] },
        scene: 'siem',
        flow: 'siem',
        items: [
          { who: '수집', what: 'socket 스트리밍 / Fluent Bit tail', risk: '→ SIEM' },
          { who: '탐지', what: '새벽 prod read, 대량 실패, 퇴사자 토큰', risk: '⚠️ 이상 알림' },
        ],
        alert: { tone: 'warn', text: '실패 로그도 전부 남는다 — 성공만 보지 말고 실패의 "양" 을 감시하라.' },
        code: { ...CODE.siem, highlight: [14, 15] },
      },
      { ...S5,
        beat:{ label:'HMAC 상관 분석', at:'siem-pipeline.sh L17–19',
               caption:'같은 시크릿의 HMAC 값은 항상 같다. 아는 값의 해시를 sys/audit-hash로 구해 검색하면 평문 없이 "그 값을 본 요청 전부" 를 묶을 수 있다.',
               changes:[{mark:'read', text:'hmac-sha256:9f2c... 로 동일 값 검색'}] },
        scene: 'siem',
        flow: 'siem',
        items: [
          { who: '수집', what: 'socket 스트리밍 / Fluent Bit tail', risk: '→ SIEM' },
          { who: '탐지', what: '새벽 prod read, 대량 실패, 퇴사자 토큰', risk: '⚠️ 이상 알림' },
          { who: '상관', what: 'HMAC 값 비교로 동일 시크릿 추적', risk: '🔒 평문 없이' },
        ],
        alert: { tone: 'info', text: '유출된 값의 HMAC 하나로 접근자 전원을 역추적 — Step 3의 해시 설계가 여기서 빛난다.' },
        code: { ...CODE.siem, highlight: [17, 18, 19, 20] },
      },
      { ...S5,
        beat:{ label:'3박자 완성', at:'siem-pipeline.sh L21–25',
               caption:'남기기(audit device) + 모으기(SIEM) + 분석(탐지 규칙) — 세 박자가 갖춰져야 감사가 완성된다.',
               changes:[{mark:'read', text:'남기기 → 모으기 → 분석'},
                        {mark:'new', text:'규정 준수 보고 가능'}] },
        scene: 'siem',
        flow: 'siem',
        items: [
          { who: '수집', what: 'socket 스트리밍 / Fluent Bit tail', risk: '→ SIEM' },
          { who: '탐지', what: '새벽 prod read, 대량 실패, 퇴사자 토큰', risk: '⚠️ 이상 알림' },
          { who: '규정', what: '접근 이력 보고 (PCI/ISO)', risk: '✓ 준수' },
          { who: '상관', what: 'HMAC 값 비교로 동일 시크릿 추적', risk: '🔒 평문 없이' },
        ],
        alert: { tone: 'good', text: '남기기(audit device) + 모으기(SIEM) + 분석(탐지 규칙) 3박자가 갖춰져야 감사가 완성된다.' },
        code: { ...CODE.siem, highlight: [21, 22, 23, 24, 25] },
      },
    ];

    // ── RefPanel ── 예전 왼쪽 패널의 항목 표 (누가·무엇·상태)
    function RefPanel({ step }) {
      const items = step.items || [];
      if (!items.length) return null;
      return (
        <table>
          <thead><tr><th>항목</th><th>내용</th><th>상태</th></tr></thead>
          <tbody>{items.map((it, i) => (<tr key={i}><td className="font-mono">{it.who}</td><td>{it.what}</td><td>{it.risk}</td></tr>))}</tbody>
        </table>
      );
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
