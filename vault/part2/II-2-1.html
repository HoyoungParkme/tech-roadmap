  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

            '  },',
            '  "renew": "만료 직전 자동 renew, 실패 시 재발급",',
            '  "app_view": "앱은 /vault/secrets/db.json 만 읽음"',
            '}',
            '',
            '// 정리',
            '//   TTL 짧게 → 유출 위험 창 최소화',
            '//   Agent 자동 renew → 사람 개입 없이 무중단',
            '//   max_ttl 도달 → 조용히 새 자격증명으로 교체',
          ],
          highlight: [0, 3, 4, 10, 11, 12, 13, 14, 19, 20, 21, 22],
        },
      },
    ];

    function TtlGauge({ lease }) {
      const pct = Math.max(0, Math.min(100, Math.round((lease.remain / lease.ttl) * 100)));
      const STATE = {
        active:  { bar:'#22c55e', bg:'#dbf3e6', label:'활성 — 카운트다운 중', tx:'#166534' },
        renewed: { bar:BRAND,     bg:'#fffbe6', label:'renew — TTL 회복됨',   tx:DARK },
        revoked: { bar:'#ef4444', bg:'#fee2e2', label:'만료/회수 — 폐기됨',   tx:'#991b1b' },
        auto:    { bar:'#22c55e', bg:'#dbf3e6', label:'agent 자동 renew',     tx:'#166534' },
      };
      const s = STATE[lease.state] || STATE.active;
      return (
        <div className="rounded-md p-3 mb-3" style={{background:s.bg, border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between text-[11px] font-bold mb-1" style={{color:s.tx}}>
            <span>{s.label}</span>
            <span className="font-mono">{lease.remain}s / {lease.ttl}s</span>
          </div>
          <div className="w-full h-3 rounded-full overflow-hidden" style={{background:'rgba(0,0,0,0.08)'}}>
            <div className="h-full rounded-full transition-all" style={{width:`${pct}%`, background:s.bar}} />
          </div>
          <div className="flex items-center justify-between text-[10px] mt-1.5" style={{color:s.tx}}>
            <span className="font-mono break-all">🔑 {lease.cred}</span>
            <span className="shrink-0 ml-2">max_ttl {lease.max}s</span>
          </div>
        </div>
      );
    }

    function ScenePanel({ scene, items }) {
      const TONE = {
        concept: { bg:'#fffbe6', bd:'#fde68a', tx:'#7c5e00', icon:'📜', title:'lease = 기간 계약서' },
        active:  { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'⏱️', title:'발급/사용 — 시계가 흐른다' },
        renew:   { bg:'#fffbe6', bd:'#fde68a', tx:'#7c5e00', icon:'🔄', title:'renew — TTL 연장 (max_ttl 한도)' },
        expire:  { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🗑️', title:'만료/회수 — 자동 폐기' },
        prod:    { bg:'#fef9c3', bd:'#fde68a', tx:'#7c5e00', icon:'🤖', title:'실무 — Agent 자동 renew' },
      };
      const s = TONE[scene] || TONE.concept;
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{background:BRAND, color:DARK}}>
            <span>{s.icon}</span>
            <span>{s.title}</span>
          </div>
          <div className="p-3 space-y-2">
            {items.map((it, i) => (
              <div key={i} className="rounded-md p-2 text-xs flex items-start gap-2"
                   style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
                <span className="font-mono font-bold w-28 shrink-0">{it.who}</span>
                <span className="flex-1 break-all">{it.what}</span>
                <span className="text-[10px] shrink-0 px-1.5 py-0.5 rounded-full" style={{background:'rgba(255,255,255,0.6)'}}>{it.tag}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#fffbe6', bd:'#fde68a', tx:'#7c5e00', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DARK}}>lease 생명주기 타임라인</h3>
            <span className="text-[10px] text-slate-500">scene: {state.scene}</span>
          </div>
          <TtlGauge lease={state.lease} />
          <ScenePanel scene={state.scene} items={state.items} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#fffbe6 0%,#fef3c7 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg font-bold" style={{background:BRAND, color:DARK}}>V</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:DARK}}>II-2-1. lease — 발급/renew/만료 사이클</h1>
                <p className="text-sm" style={{color:SUB}}>비유: 동적 시크릿에 붙는 렌트카 계약서. TTL 안에서 살고, renew 로 연장하고, 안 하면 반납된다.</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:SUB}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#fde68a'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow" style={{background:BRAND, color:DARK}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:DARK}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold" style={{background:BRAND, color:DARK}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:DARK}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:SUB}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                lease 는 동적 시크릿에 붙는 기간 계약서다. 발급 시 lease_id + TTL 이 부여되고, TTL 이 0 이 되면 Vault 가 연결된 리소스(임시 DB 사용자 등)를 자동으로 폐기한다. 만료 전 renew 로 TTL 을 연장할 수 있지만 max_ttl 이라는 절대 상한을 넘지 못한다. 사고 시엔 revoke 로 즉시 회수한다. 실무 표준은 "짧은 TTL + Vault Agent 자동 renew" 로, 짧은 수명의 안전함과 무중단 운영을 동시에 얻는 것이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Vault', 'lease', 'TTL', 'max_ttl', 'renew', 'revoke', 'vault-agent'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#fffbe6', color:DARK, border:'1px solid #fde68a'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:SUB}}>
              <a href="../index.html" className="underline hover:no-underline">← 목차</a>
              <div className="flex gap-3">
                <a href="./II-1-2.html" className="underline hover:no-underline">← 이전: II-1-2</a>
                <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
