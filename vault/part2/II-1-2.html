  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    Vault II-1-2 — AWS secret engine (STS 임시 자격 증명)
    비유: 장기 마스터키(하드코딩) vs 놀이공원 1일 입장권(임시 STS 키)
    5단계: 장기 키의 위험 → AWS engine 설정 → role + IAM policy → creds 동적 발급 → lease 만료 시 자동 폐기 + iam_user vs assumed_role
    그림: ./II-1-2.anim.js (장면 5개) / 코드: CodeViewer (bash + json)
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FFCC33';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"bash", filename:"before-vault-aws.sh", lines:[
        "# Vault 없이 AWS 키를 다루는 흔한 풍경",
        "",
        "# 1) 앱 배포에 장기 IAM 키를 그대로 주입",
        "export AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE",
        "export AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCY",
        "#   → 이 키는 삭제 전까지 \"영원히\" 유효",
        "",
        "# 2) CI 변수, 이미지 레이어, .env 로 복제 전파",
        "docker build -t app .            # 키가 이미지에 박히기도",
        "git grep AKIA                    # 💥 저장소 어딘가에 남아 있음",
        "",
        "# 3) 유출되면?",
        "#   - 공격자가 S3/EC2 를 며칠간 사용",
        "#   - 언제 샜는지, 누가 썼는지 알 수 없다",
        "#   - 회수하려면 키 삭제 → 전 서비스 재배포",
        "",
        "# 4) 권한도 대충 넓게 (AdministratorAccess)",
        "#   - 앱은 S3 하나만 쓰는데 전체 권한 부여",
        "#   - 최소 권한 원칙 위반",
        "",
        "# → 요청 시점에만, 최소 권한으로, 짧게 사는 키가 필요",
        "# → Vault AWS secret engine 이 그 역할",
      ]},
      s2: {lang:"bash", filename:"aws-engine-config.sh", lines:[
        "# AWS secret engine 활성화 + 마스터 자격 등록",
        "",
        "# 1) 엔진 활성화 (경로 aws/)",
        "vault secrets enable aws",
        "#   Success! Enabled the aws secrets engine at: aws/",
        "",
        "# 2) Vault 전용 마스터 IAM 자격 등록 (한 번만)",
        "#    이 IAM 사용자는 \"IAM 사용자/키 생성\" 권한만 가진다",
        "vault write aws/config/root \\",
        "  access_key=AKIA_VAULT_MASTER_ONLY \\",
        "  secret_key=vaultMasterSecretKeyExample \\",
        "  region=ap-northeast-2",
        "#   Success! Data written to: aws/config/root",
        "",

               caption:"대상도 my-bucket 하나로 못박는다. 다른 버킷은 이 키로 건드릴 수 없다.",
               changes:[{mark:"new", text:"my-bucket 한정"},
                        {mark:"gone", text:"다른 버킷 접근 불가"}] },
        scene: "role",
        items: [
          { who: "IAM policy", what: "s3:GetObject on my-bucket/*", risk: "✓ 읽기만" },
          { who: "Resource", what: "arn:aws:s3:::my-bucket 만", risk: "✓ 범위 한정" },
        ],
        alert: { tone: "warn", text: "Action과 Resource를 함께 좁혀야 진짜 최소 권한이다." },
        code: { ...CODE.s3, highlight: [11, 12, 13, 14] },
      },
      { ...S3,
        beat:{ label:"role에 정책 첨부", at:"my-role-policy.json L19–23",
               caption:"이 정책을 policy_document로 붙여 aws/roles/my-role을 만든다. credential_type=iam_user라서 수명은 Step 2의 aws/config/lease(1h)를 따른다.",
               changes:[{mark:"new", text:"aws/roles/my-role 등록"},
                        {mark:"new", text:"credential_type=iam_user"}] },
        scene: "role",
        items: [
          { who: "aws/roles/my-role", what: "credential_type=iam_user", risk: "방식 선택" },
          { who: "IAM policy", what: "s3:GetObject on my-bucket/*", risk: "✓ 읽기만" },
          { who: "lease (config/lease)", what: "1h", risk: "짧은 수명" },
        ],
        alert: { tone: "warn", text: "role에 넓은 정책(*)을 붙이면 임시 키여도 위험. 반드시 최소 권한으로." },
        code: { ...CODE.s3, highlight: [19, 20, 21, 22, 23] },
      },
      // ── Step 4 ───────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:"발급 요청 한 줄", at:"read-creds.sh L3–4",
               caption:"앱/CI는 vault read aws/creds/my-role만 호출한다. 장기 키는 등장하지 않는다.",
               changes:[{mark:"read", text:"aws/creds/my-role 호출"}] },
        scene: "issue",
        items: [
          { who: "app → vault read", what: "aws/creds/my-role", risk: "요청" },
        ],
        alert: { tone: "info", text: "이 순간 Vault가 마스터 자격으로 IAM 사용자를 하나 만든다." },
        code: { ...CODE.s4, highlight: [3, 4] },
      },
      { ...S4,
        beat:{ label:"IAM 사용자 키 반환", at:"read-creds.sh L5–11",
               caption:"lease_id·TTL(1h)과 함께 방금 만든 IAM 사용자의 access_key(AKIA…)와 secret_key가 돌아온다. iam_user라 session_token은 <nil>이다.",
               changes:[{mark:"new", text:"AKIA... 키 + secret"},
                        {mark:"new", text:"lease vGZ8k.. / TTL 1h"}] },
        scene: "issue",
        items: [
          { who: "app → vault read", what: "aws/creds/my-role", risk: "요청" },
          { who: "Vault → IAM", what: "AKIA...(lease 동안만 사는 IAM 사용자)", risk: "lease 1h" },
        ],
        alert: { tone: "good", text: "키 모양은 장기 키와 같은 AKIA다. 다른 점은 lease 1h가 끝나면 Vault가 이 IAM 사용자를 지운다는 것이다." },
        code: { ...CODE.s4, highlight: [5, 6, 7, 8, 9, 10, 11] },
      },
      { ...S4,
        beat:{ label:"환경변수로 장착", at:"read-creds.sh L13–16",
               caption:"받은 두 값을 환경변수로 넣는다. STS 방식(assumed_role)이었다면 AWS_SESSION_TOKEN까지 넣어야 한다.",
               changes:[{mark:"read", text:"키 2개 export"}] },
        scene: "issue",
        items: [
          { who: "app 환경변수", what: "ACCESS_KEY + SECRET", risk: "✓ 장착" },
          { who: "Vault → IAM", what: "AKIA...(lease 동안만 사는 IAM 사용자)", risk: "lease 1h" },
        ],
        alert: { tone: "info", text: "키가 흘러도 TTL 안에서만 유효 — 위험 창이 1시간으로 줄었다." },
        code: { ...CODE.s4, highlight: [13, 14, 15, 16] },
      },
      { ...S4,
        beat:{ label:"S3 접근 성공", at:"read-creds.sh L18–20",
               caption:"임시 키로 my-bucket의 파일을 내려받는다. 정책이 허용한 GetObject라서 통과한다.",
               changes:[{mark:"read", text:"GetObject my-bucket/data.csv"}] },
        scene: "issue",
        items: [
          { who: "app → S3", what: "GetObject my-bucket/data.csv", risk: "✓ 접근 성공" },
          { who: "Vault → IAM", what: "AKIA...(lease 동안만 사는 IAM 사용자)", risk: "lease 1h" },
        ],
        alert: { tone: "good", text: "허용된 일은 그대로 된다. 앱 입장에서는 보통 AWS 키와 똑같다." },
        code: { ...CODE.s4, highlight: [18, 19, 20] },
      },
      { ...S4,
        beat:{ label:"권한 밖은 AccessDenied", at:"read-creds.sh L22–24",
               caption:"같은 키로 삭제를 시도하면 거부된다 — 정책에 s3:DeleteObject가 없기 때문이다.",
               changes:[{mark:"gone", text:"s3 rm → AccessDenied"},
                        {mark:"read", text:"최소 권한 동작 확인"}] },
        scene: "issue",
        items: [
          { who: "app → S3", what: "GetObject my-bucket/data.csv", risk: "✓ 접근 성공" },
          { who: "app → S3 (rm)", what: "DeleteObject 시도", risk: "❌ AccessDenied" },
        ],
        alert: { tone: "good", text: "유출돼도 읽기 이상은 못 한다. role 정책이 피해 범위를 미리 잘랐다." },
        code: { ...CODE.s4, highlight: [22, 23, 24] },
      },
      { ...S4,
        beat:{ label:"장기 키 없는 접근", at:"read-creds.sh L26",
               caption:"앱은 장기 키를 만진 적이 없고, 이 임시 키도 1시간 뒤 무효가 된다.",
               changes:[{mark:"gone", text:"장기 키 사용 0회"}] },
        scene: "issue",
        items: [
          { who: "app → vault read", what: "aws/creds/my-role", risk: "요청" },
          { who: "Vault → IAM", what: "AKIA...(lease 동안만 사는 IAM 사용자)", risk: "lease 1h" },
          { who: "app → S3", what: "GetObject my-bucket/data.csv", risk: "✓ 접근 성공" },
        ],
        alert: { tone: "good", text: "요청마다 새 임시 키 + 짧은 TTL. lease_id로 누가 언제 발급받았는지 추적 가능." },
        code: { ...CODE.s4, highlight: [26] },
      },
      // ── Step 5 ───────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:"활성 lease 목록", at:"lease-lifecycle.sh L3–7",
               caption:"sys/leases/lookup으로 지금 발급돼 살아 있는 임시 키(lease)들을 조회한다.",
               changes:[{mark:"read", text:"활성 lease vGZ8k.. 확인"}] },
        scene: "compare",
        items: [
          { who: "lease 목록", what: "aws/creds/my-role/vGZ8k...", risk: "활성 1건" },
        ],
        alert: { tone: "info", text: "지금 어떤 임시 키가 살아 있는지 Vault가 전부 알고 있다." },
        code: { ...CODE.s5, highlight: [3, 4, 5, 6, 7] },
      },
      { ...S5,
        beat:{ label:"renew — 만료 전 갱신", at:"lease-lifecycle.sh L9–10",
               caption:"더 필요하면 만료 전에 lease renew로 연장한다. iam_user lease만 되고, STS 방식은 lease_renewable이 false다.",
               changes:[{mark:"changed", text:"TTL 연장"}] },
        scene: "compare",
        items: [
          { who: "lease 목록", what: "aws/creds/my-role/vGZ8k...", risk: "활성 1건" },
          { who: "renew", what: "vault lease renew (만료 전)", risk: "연장" },
        ],
        alert: { tone: "info", text: "갱신을 멈추면 TTL이 끝나는 순간 키는 저절로 죽는다." },
        code: { ...CODE.s5, highlight: [9, 10] },
      },
      { ...S5,
        beat:{ label:"revoke — 즉시 폐기", at:"lease-lifecycle.sh L12–15",
               caption:"유출 의심이면 revoke. iam_user는 AWS의 IAM 사용자/키 삭제, assumed_role은 만료로 자연 소멸.",
               changes:[{mark:"gone", text:"임시 키 즉시 무효"},
                        {mark:"read", text:"방식별 폐기 경로 확인"}] },
        scene: "compare",
        items: [
          { who: "vault lease revoke", what: "수동 즉시 폐기", risk: "유출 대응" },
          { who: "iam_user", what: "AWS 에서 IAM 사용자/키 삭제", risk: "정리 실행" },
        ],
        alert: { tone: "warn", text: "iam_user 키는 revoke 하면 바로 죽는다. STS 키는 revoke 해도 자기 만료 시각까지 살아 있으니 TTL을 짧게 둔다." },
        code: { ...CODE.s5, highlight: [12, 13, 14, 15] },
      },
      { ...S5,
        beat:{ label:"credential_type 비교", at:"lease-lifecycle.sh L17–20",
               caption:"iam_user는 임시 IAM 사용자 생성(인라인 정책 세밀), assumed_role은 STS 토큰(가볍고 정해진 시각에 스스로 만료).",
               changes:[{mark:"read", text:"3가지 발급 방식 비교"}] },
        scene: "compare",
        items: [
          { who: "iam_user", what: "임시 IAM 사용자 생성/삭제", risk: "인라인 정책 가능" },
          { who: "assumed_role", what: "STS AssumeRole 토큰", risk: "스스로 만료, 정리 불필요" },
          { who: "federation_token", what: "GetFederationToken", risk: "레거시/특수" },
        ],
        alert: { tone: "info", text: "짧고 잦은 발급엔 assumed_role, 세밀한 인라인 정책엔 iam_user." },
        code: { ...CODE.s5, highlight: [17, 18, 19, 20] },
      },
      { ...S5,
        beat:{ label:"assumed_role로 등록", at:"lease-lifecycle.sh L21–23",
               caption:"role_arns에 대상 IAM role을 지정해 STS 방식 role(sts-role)을 만든다.",
               changes:[{mark:"new", text:"aws/roles/sts-role"},
                        {mark:"read", text:"role_arns → s3-reader"}] },
        scene: "compare",
        items: [
          { who: "aws/roles/sts-role", what: "credential_type=assumed_role", risk: "✓ 등록" },
          { who: "role_arns", what: "arn:...:role/s3-reader", risk: "대상 role" },
        ],
        alert: { tone: "info", text: "STS 방식은 IAM 정리가 필요 없어 대량 발급에 가볍다." },
        code: { ...CODE.s5, highlight: [21, 22, 23] },
      },
      { ...S5,
        beat:{ label:"핵심 — 장기 키 0", at:"lease-lifecycle.sh L25–28",
               caption:"앱/CI는 짧은 수명 임시 키로만 클라우드에 접근한다. 장기 키 하드코딩 0, 최소 권한, 자동 폐기.",
               changes:[{mark:"gone", text:"장기 키 하드코딩 제거"},
                        {mark:"new", text:"짧은 수명 + 자동 폐기 체계"}] },
        scene: "compare",
        items: [
          { who: "lease 만료", what: "Vault 가 IAM 사용자 DROP / 토큰 만료", risk: "자동 폐기" },
          { who: "iam_user", what: "임시 IAM 사용자 생성/삭제", risk: "인라인 정책 가능" },
          { who: "assumed_role", what: "STS AssumeRole 토큰", risk: "스스로 만료, 정리 불필요" },
          { who: "federation_token", what: "GetFederationToken", risk: "레거시/특수" },
          { who: "vault lease revoke", what: "수동 즉시 폐기", risk: "유출 대응" },
        ],
        alert: { tone: "good", text: "장기 키 하드코딩 제거 + 최소 권한 + 짧은 수명. 유출돼도 곧 무효, 출처는 lease_id로 명확." },
        code: { ...CODE.s5, highlight: [25, 26, 27, 28] },
      },
    ];


    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(255,204,51,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }


    // ── RefPanel ── 그림 아래 "표·정리 보기" 상자 (credential_type 비교)
    function RefPanel({ step }) {
      if (!step.title.startsWith('Step 3') && !step.title.startsWith('Step 5')) return null;
      return (
        <div>
          <h4>credential_type 세 가지</h4>
          <table>
            <thead><tr><th>방식</th><th>받는 것</th><th>수명 설정</th><th>renew</th><th>revoke 하면</th></tr></thead>
            <tbody>
              <tr><td className="font-mono">iam_user</td><td>새 IAM 사용자의 AKIA… 키 (session_token 없음)</td><td className="font-mono">aws/config/lease</td><td>된다</td><td>Vault가 IAM 사용자를 지운다</td></tr>
              <tr><td className="font-mono">assumed_role</td><td>STS AssumeRole의 ASIA… 키 + session_token</td><td className="font-mono">default_sts_ttl / max_sts_ttl</td><td>안 된다</td><td>키는 만료 시각까지 살아 있다</td></tr>
              <tr><td className="font-mono">federation_token</td><td>STS GetFederationToken의 ASIA… 키 + session_token</td><td className="font-mono">default_sts_ttl / max_sts_ttl</td><td>안 된다</td><td>키는 만료 시각까지 살아 있다</td></tr>
            </tbody>
          </table>
          <p className="mt-1">짧고 잦은 발급은 assumed_role, 사용자별 인라인 정책이 필요하면 iam_user. (출처: developer.hashicorp.com/vault의 AWS secrets engine 문서와 API 문서)</p>
        </div>);
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
