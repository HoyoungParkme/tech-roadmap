<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack 학습 — III-1-1. devServer (port / proxy / static)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    III-1-1. devServer (port / proxy / static)
    학습 목표: 개발 서버의 핵심 옵션 3개(port / proxy / static)가 어떤 문제를 풀어주는지 단계별로 본다.
    핵심 비유: "사무실 책상" — 내 자리(port), 다른 부서 전화 돌려주기(proxy), 공용 자료실(static)
    패턴: 좌 LiveDataPane(서버 상태 + 요청 표) / 우 VSCode CodeViewer
    색상: Webpack sky (#8DD6F9 계열, tailwind sky-*)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — devServer 옵션을 하나씩 더해가며 문제 해결
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 기본 — webpack-dev-server를 그냥 띄우면?',
        desc: 'webpack serve 한 줄로 dev server가 뜬다. 기본 포트 8080, 빌드 결과는 메모리에 두고 localhost로 서빙. 그런데 백엔드 API(:3000) 호출은 CORS 에러가 난다. public 폴더의 favicon 같은 정적 파일도 어디서 가져올지 모른다.',
        serverStatus: { running: true, port: 8080, mode: 'memory' },
        requests: [
          { method: 'GET', path: '/', target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/main.js', target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/api/users', target: 'localhost:3000 (백엔드)', status: 'CORS ❌', color: 'red' },
          { method: 'GET', path: '/favicon.ico', target: 'public/ 어디?', status: 404, color: 'amber' },
        ],
        showProxyBox: false,
        showStaticBox: false,
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js',
          lines: [
            '// 가장 기본 — devServer 옵션 없이 그냥 띄움',
            'module.exports = {',
            '  mode: "development",',
            '  entry: "./src/index.js",',
            '  output: {',
            '    filename: "main.js",',
            '    path: __dirname + "/dist",',
            '  },',
            '  // devServer: {} ← 비어있음',
            '};',
            '',
            '// 터미널',
            '// $ npx webpack serve',
            '// > [webpack-dev-server] http://localhost:8080/',
            '// > compiled successfully in 412 ms',
            '',
            '// 문제',
            '// 1) fetch("/api/users") → CORS 에러 (다른 origin)',
            '// 2) /favicon.ico → 404 (public 폴더 인식 안 됨)',
            '// 3) 포트 8080은 다른 팀원과 자주 충돌',
          ],
          highlight: [9, 17, 18, 19, 20],
        },
      },
      {
        title: 'Step 2. port 변경 — 팀원과 포트 충돌 회피',
        desc: 'devServer.port를 5173으로 지정. 보통 팀에서 프로젝트별 포트 규칙을 정해둔다(프론트 5173, 백엔드 3000). host: "0.0.0.0"으로 두면 LAN에서 모바일 기기 테스트도 가능.',
        serverStatus: { running: true, port: 5173, mode: 'memory' },
        requests: [
          { method: 'GET', path: '/',         target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/main.js',  target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/api/users', target: 'localhost:3000 (백엔드)', status: 'CORS ❌', color: 'red' },
          { method: 'GET', path: '/favicon.ico', target: 'public/ 어디?', status: 404, color: 'amber' },
        ],
        showProxyBox: false,
        showStaticBox: false,
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js',
          lines: [
            'module.exports = {',
            '  mode: "development",',
            '  entry: "./src/index.js",',
            '  output: { filename: "main.js", path: __dirname + "/dist" },',
            '',
            '  devServer: {',
            '    port: 5173,         // 8080 → 5173 (팀 규칙)',
            '    host: "0.0.0.0",   // LAN 노출 (모바일 테스트용)',
            '    open: true,         // 시작 시 브라우저 자동 오픈',
            '  },',
            '};',
            '',
            '// 터미널',
            '// $ npx webpack serve',
            '// > Project running at:',
            '// >   Local:   http://localhost:5173/',
            '// >   Network: http://192.168.0.42:5173/  ← 모바일 접속 가능',
          ],
          highlight: [6, 7, 8, 9, 10],
        },
      },
      {
        title: 'Step 3. proxy — 백엔드 호출을 같은 origin으로 위장',
        desc: '/api로 시작하는 요청을 devServer가 받아서 백엔드(:3000)로 대신 전달한다. 브라우저 입장에서는 같은 origin이라 CORS가 발생하지 않는다. changeOrigin: true로 Host 헤더도 백엔드용으로 교체.',
        serverStatus: { running: true, port: 5173, mode: 'memory + proxy' },
        requests: [
          { method: 'GET', path: '/',         target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/main.js',  target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/api/users', target: 'proxy → localhost:3000', status: 200, color: 'emerald' },
          { method: 'POST', path: '/api/login', target: 'proxy → localhost:3000', status: 200, color: 'emerald' },
          { method: 'GET', path: '/favicon.ico', target: 'public/ 어디?', status: 404, color: 'amber' },
        ],
        showProxyBox: true,
        showStaticBox: false,
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js',
          lines: [
            'module.exports = {',
            '  mode: "development",',
            '  entry: "./src/index.js",',
            '  output: { filename: "main.js", path: __dirname + "/dist" },',
            '',
            '  devServer: {',
            '    port: 5173,',
            '    host: "0.0.0.0",',
            '',
            '    proxy: [',
            '      {',
            '        context: ["/api"],            // /api 로 시작하는 요청을',
            '        target: "http://localhost:3000", // 이쪽으로 돌린다',
            '        changeOrigin: true,           // Host 헤더 교체',
            '        // pathRewrite: { "^/api": "" } // 필요 시 경로 변경',
            '      },',
            '    ],',
            '  },',
            '};',
            '',
            '// 결과',
            '// 브라우저: fetch("/api/users")',
            '// dev server: localhost:3000/api/users 로 대신 호출 → 응답 반환',
            '// CORS 에러 ❌ → ✅',
          ],
          highlight: [10, 11, 12, 13, 14, 15, 16, 17],
        },
      },
      {
        title: 'Step 4. static — public 폴더를 그대로 노출',
        desc: 'devServer.static으로 public 디렉터리를 등록. favicon, 이미지, robots.txt 등 webpack을 거치지 않을 정적 파일을 그대로 서빙. watch도 true로 두면 public 변경 시 자동 새로고침. 4개 옵션이 모이면 일반적인 SPA 개발 환경이 완성된다.',
        serverStatus: { running: true, port: 5173, mode: 'memory + proxy + static' },
        requests: [
          { method: 'GET', path: '/',         target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/main.js',  target: 'webpack memory bundle', status: 200, color: 'sky' },
          { method: 'GET', path: '/api/users', target: 'proxy → localhost:3000', status: 200, color: 'emerald' },
          { method: 'GET', path: '/favicon.ico', target: 'public/favicon.ico', status: 200, color: 'emerald' },
          { method: 'GET', path: '/robots.txt',  target: 'public/robots.txt',  status: 200, color: 'emerald' },
        ],
        showProxyBox: true,
        showStaticBox: true,
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js',
          lines: [
            'const path = require("path");',
            '',
            'module.exports = {',
            '  mode: "development",',
            '  entry: "./src/index.js",',
            '  output: { filename: "main.js", path: path.resolve(__dirname, "dist") },',
            '',
            '  devServer: {',
            '    port: 5173,',
            '    host: "0.0.0.0",',
            '    open: true,',
            '    historyApiFallback: true,   // SPA — / 외 경로도 index.html',
            '',
            '    static: {',
            '      directory: path.join(__dirname, "public"),',
            '      watch: true,              // public 변경 시 reload',
            '    },',
            '',
            '    proxy: [',
            '      {',
            '        context: ["/api"],',
            '        target: "http://localhost:3000",',
            '        changeOrigin: true,',
            '      },',
            '    ],',
            '  },',
            '};',
            '',
            '// 이제',
            '//  - /              → memory의 index.html (HtmlWebpackPlugin)',
            '//  - /main.js       → memory의 webpack 번들',
            '//  - /favicon.ico   → public/favicon.ico (디스크)',
            '//  - /api/*         → 백엔드 :3000',
            '//  - /random/route  → index.html (SPA fallback)',
          ],
          highlight: [12, 14, 15, 16, 17, 19, 20, 21, 22, 23, 24],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 상태 배지 색상
    // ─────────────────────────────────────────────────────
    const COLOR_STYLE = {
      sky:     { badge: 'bg-sky-100 text-sky-700 border-sky-300' },
      emerald: { badge: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
      amber:   { badge: 'bg-amber-100 text-amber-700 border-amber-300' },
      red:     { badge: 'bg-red-100 text-red-700 border-red-300' },
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — devServer 상태 + 요청 표
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ serverStatus, requests, showProxyBox, showStaticBox }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🖥️ webpack-dev-server</h2>
            <span className="text-[10px] text-slate-400 font-mono">live · :{serverStatus.port}</span>
          </div>

          {/* 서버 상태 헤더 */}
          <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-3 mb-4">
            <div className="flex items-center justify-between text-xs">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="font-bold text-sky-900">running</span>
                <span className="text-sky-700 font-mono">http://localhost:{serverStatus.port}/</span>
              </div>
              <span className="text-[10px] text-sky-700 font-mono">{serverStatus.mode}</span>
            </div>
          </div>

          {/* 옵션 배지들 */}
          <div className="flex flex-wrap gap-2 mb-4 text-[10px]">
            <span className={`px-2 py-0.5 rounded border font-mono ${serverStatus.port === 5173 ? 'bg-sky-100 text-sky-700 border-sky-300 font-bold' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>
              port: {serverStatus.port}
            </span>
            <span className={`px-2 py-0.5 rounded border font-mono ${showProxyBox ? 'bg-emerald-100 text-emerald-700 border-emerald-300 font-bold' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
              proxy: {showProxyBox ? 'on' : 'off'}
            </span>
            <span className={`px-2 py-0.5 rounded border font-mono ${showStaticBox ? 'bg-emerald-100 text-emerald-700 border-emerald-300 font-bold' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>
              static: {showStaticBox ? 'on' : 'off'}
            </span>
          </div>

          {/* 요청 표 */}
          <div className="overflow-hidden rounded-lg border border-slate-200 mb-3">
            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-600">
                <tr>
                  <th className="text-left px-2 py-2 font-bold w-14">method</th>
                  <th className="text-left px-2 py-2 font-bold">path</th>
                  <th className="text-left px-2 py-2 font-bold hidden md:table-cell">→ target</th>
                  <th className="text-center px-2 py-2 font-bold w-20">status</th>
                </tr>
              </thead>
              <tbody>
                {requests.map((r, i) => {
                  const style = COLOR_STYLE[r.color] || COLOR_STYLE.sky;
                  return (
                    <tr key={i} className="border-t border-slate-100 transition-all duration-500">
                      <td className="px-2 py-2 font-mono text-[10px] text-slate-600 font-bold">{r.method}</td>
                      <td className="px-2 py-2 font-mono text-[11px] text-slate-700">{r.path}</td>
                      <td className="px-2 py-2 font-mono text-[10px] text-slate-500 hidden md:table-cell">{r.target}</td>
                      <td className="px-2 py-2 text-center">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${style.badge}`}>
                          {r.status}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* proxy 박스 */}
          {showProxyBox && (
            <div className="p-3 rounded-lg bg-emerald-50 border border-emerald-300 mb-2 text-[11px] text-emerald-900">
              <div className="font-bold mb-1">🔀 proxy 동작</div>
              <div className="font-mono">/api/* → http://localhost:3000  <span className="text-emerald-700">(브라우저는 같은 origin으로 인식 → CORS 해결)</span></div>
            </div>
          )}

          {/* static 박스 */}
          {showStaticBox && (
            <div className="p-3 rounded-lg bg-sky-50 border border-sky-300 text-[11px] text-sky-900">
              <div className="font-bold mb-1">📁 static 디렉터리</div>
              <div className="font-mono">public/  →  /  <span className="text-sky-700">(favicon, robots.txt, 이미지 등 webpack을 거치지 않는 파일)</span></div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-sky-500/10 border-l-2 border-sky-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-500 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 개발 / 프로덕션 &gt; Chapter 1. devServer</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">devServer — port / proxy / static</h1>
                  <p className="text-sm text-slate-500 mt-0.5">사무실 책상 — 내 자리(port) · 부서 호출 전달(proxy) · 공용 자료실(static)</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane
                serverStatus={step.serverStatus}
                requests={step.requests}
                showProxyBox={step.showProxyBox}
                showStaticBox={step.showStaticBox}
              />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">
                💡 다음(III-1-2)에서는 source map — devtool 선택 가이드
              </div>
            )}

            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./III-1-2.html" className="text-sky-700 hover:text-sky-900 font-medium">III-1-2 source map &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
