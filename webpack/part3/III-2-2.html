<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack 학습 — III-2-2. cache (filesystem / contenthash)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-2-2. cache (filesystem / contenthash)
    학습 목표: 빌드 캐시(filesystem)와 출력 캐시(contenthash)는 다른 캐시다 — 둘 다 알아야 한다.
    핵심 비유:
      - filesystem cache: 작업장 책상 정리 후 퇴근 (다음날 어제 작업 그대로 이어서)
      - contenthash    : 책 표지에 인쇄된 ISBN — 내용이 바뀌어야만 ISBN도 바뀜
    패턴: 좌 LiveDataPane(빌드 시간 비교 + dist 파일 표) / 우 VSCode CodeViewer
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      step1: {lang:'javascript', filename:'webpack.config.js (BAD)', lines:[
        'module.exports = {',
        '  mode: "production",',
        '  entry: "./src/index.js",',
        '',
        '  output: {',
        '    filename: "main.js",       // ❌ 고정 이름',
        '    path: __dirname + "/dist",',
        '  },',
        '',
        '  // cache 옵션 없음 → memory cache (프로세스 종료 시 사라짐)',
        '};',
        '',
        '// 문제 1 — 빌드',
        '//   매번 전체 컴파일 (28s)',
        '',
        '// 문제 2 — 브라우저 캐시',
        '//   index.html: <script src="/main.js">',
        '//   사용자 브라우저: 옛 main.js (캐시) 그대로 사용',
        '//   → 새 기능이 보이지 않음, 새 버그가 나타남',
      ]},
      step2: {lang:'javascript', filename:'webpack.config.js (BUILD CACHE)', lines:[
        'module.exports = {',
        '  mode: "production",',
        '  entry: "./src/index.js",',
        '  output: { filename: "main.js", path: __dirname + "/dist" },',
        '',
        '  cache: {',
        '    type: "filesystem",                 // 디스크에 저장',
        '    cacheDirectory: __dirname + "/node_modules/.cache/webpack",',
        '    buildDependencies: {',
        '      config: [__filename],             // webpack.config.js 자체가 바뀌면 무효화',
        '    },',
        '  },',
        '};',
        '',
        '// 첫 빌드  : 28s   (cold, 캐시 생성)',
        '// 두 빌드  : 2.4s  (warm, 변경분만)',
        '// 코드 한 줄만 바꿨을 때: 1.2s',
        '',
        '// CI 팁',
        '//   GitHub Actions:',
        '//     - uses: actions/cache@v4',
        '//       with:',
        '//         path: node_modules/.cache/webpack',
        '//         key: ${{ runner.os }}-webpack-${{ hashFiles(\'**/package-lock.json\') }}',
      ]},
      step3: {lang:'javascript', filename:'webpack.config.js (CONTENTHASH)', lines:[
        'const HtmlWebpackPlugin = require("html-webpack-plugin");',
        '',
        'module.exports = {',
        '  mode: "production",',
        '  entry: "./src/index.js",',
        '',
        '  output: {',
        '    // [name]        : entry 이름',
        '    // [contenthash] : 모듈 내용 해시 (변경 시에만 바뀜)',
        '    filename:      "[name].[contenthash:8].js",',
        '    chunkFilename: "[name].[contenthash:8].chunk.js",',
        '    assetModuleFilename: "assets/[hash][ext][query]",',
        '    path: __dirname + "/dist",',
        '    clean: true,                       // 빌드마다 dist 정리',
        '  },',
        '',
        '  cache: { type: "filesystem" },        // 빌드 캐시 (Step 2)',
        '',
        '  plugins: [',
        '    new HtmlWebpackPlugin({',
        '      template: "./src/index.html",',
        '      // ↑ <script src="main.a1b2c3d4.js"> 자동 주입',
        '    }),',
        '  ],',
        '};',
        '',
        '// dist/ 출력',
        '//   index.html              (CDN에서 no-cache)',
        '//   main.a1b2c3d4.js        (1년 immutable)',
        '//   vendor.9d8e7f6c.js      (1년 immutable)',
      ]},
      step4: {lang:'javascript', filename:'webpack.config.js (FINAL) + nginx', lines:[
        '// webpack.config.js',
        'module.exports = {',
        '  mode: "production",',
        '  entry: "./src/index.js",',
        '',
        '  output: {',
        '    filename: "[name].[contenthash:8].js",',
        '    path: __dirname + "/dist",',
        '    clean: true,',
        '  },',
        '',
        '  cache: { type: "filesystem" },',
        '',
        '  optimization: {',
        '    runtimeChunk: "single",     // 런타임 분리 (IV-2-1)',
        '    splitChunks: { chunks: "all" },',
        '  },',
        '',
        '  plugins: [new HtmlWebpackPlugin({ template: "./src/index.html" })],',
        '};',
        '',
        '// --- nginx.conf (CDN 측에서 같은 정책 가능) ---',
        '// location = /index.html {',
        '//   add_header Cache-Control "no-cache, must-revalidate";',
        '// }',
        '// location ~* "\\.[0-9a-f]{8}\\.(js|css)$" {',
        '//   add_header Cache-Control "public, max-age=31536000, immutable";',
        '// }',
      ]},
    };

    const S1 = {
      title: 'Step 1. 캐시 없음 — 매번 처음부터 + 브라우저 캐시 깨짐',
      desc: 'cache: false, 출력 파일명도 main.js로 고정. 매 빌드마다 전체 모듈을 다시 컴파일(28s). 게다가 deploy하면 사용자 브라우저는 옛 main.js를 disk cache에서 그대로 써서 새 코드가 반영 안 됨 — "Ctrl+Shift+R 하세요" 안내가 필요한 상황.',
      buildBar: { coldMs: 28000, warmMs: 28000, label: '캐시 없음' },
      files: [
        { name: 'main.js',     size: '420 kb', stable: 'changes every build', browserCache: '❌ 깨짐' },
        { name: 'vendor.js',   size: '1.2 mb', stable: 'changes every build', browserCache: '❌ 깨짐' },
      ],
      notice: '⚠ "강력 새로고침 부탁드립니다" 라는 공지가 필요한 상태',
    };
    const S2 = {
      title: 'Step 2. cache: filesystem — 두 번째 빌드부터 폭발적으로 빠름',
      desc: 'cache.type: "filesystem" 한 줄. 모듈 그래프/loader 결과를 node_modules/.cache/webpack에 저장. 다음 빌드는 변경 모듈만 다시 처리 → 28s → 2.4s. CI 캐시(actions/cache)에 .cache/webpack 디렉터리만 캐싱하면 PR 빌드도 빨라진다.',
      buildBar: { coldMs: 28000, warmMs: 2400, label: 'filesystem cache' },
      files: [
        { name: 'main.js',     size: '420 kb', stable: 'changes every build', browserCache: '❌ 깨짐' },
        { name: 'vendor.js',   size: '1.2 mb', stable: 'changes every build', browserCache: '❌ 깨짐' },
      ],
      notice: '🎯 빌드는 빨라졌지만 브라우저 캐시 문제는 그대로',
    };
    const S3 = {
      title: 'Step 3. contenthash — 파일명에 내용 해시 포함',
      desc: 'filename: "[name].[contenthash:8].js". 모듈 내용이 바뀌면 해시도 바뀌어 main.a1b2c3d4.js → main.e5f6g7h8.js로 파일명 자체가 달라진다. index.html은 HtmlWebpackPlugin이 새 파일명으로 갱신. 사용자 브라우저는 새 파일명 → 새로 다운로드.',
      buildBar: { coldMs: 28000, warmMs: 2400, label: 'filesystem + contenthash' },
      files: [
        { name: 'main.a1b2c3d4.js',   size: '120 kb', stable: 'changes only if app code changes', browserCache: '✅ 1년 immutable' },
        { name: 'vendor.9d8e7f6c.js', size: '1.1 mb', stable: 'changes only if deps change',      browserCache: '✅ 1년 immutable' },
        { name: 'main.css.4f5a6b7c.css', size: '24 kb', stable: 'changes only if CSS changes',   browserCache: '✅ 1년 immutable' },
      ],
      notice: '✅ 빌드 빠름 + 브라우저 캐시 정확 — 배포 후 사용자는 변경된 파일만 새로 받음',
    };
    const S4 = {
      title: 'Step 4. 종합 — 캐시 전략의 두 축이 협력',
      desc: '"빌드 캐시(filesystem) + 출력 캐시(contenthash)" 두 축이 모이면 (a) 개발자는 빌드를 빠르게, (b) 사용자는 변경된 파일만 새로 다운로드. 추가로 index.html에는 no-cache, 해시 붙은 파일에는 immutable 헤더를 CDN에서 설정하는 게 표준.',
      buildBar: { coldMs: 28000, warmMs: 2400, label: '완성 — filesystem + contenthash + CDN' },
      files: [
        { name: 'index.html',         size: '4 kb',   stable: 'no-cache, must-revalidate',          browserCache: '🔁 항상 fresh check' },
        { name: 'main.a1b2c3d4.js',   size: '120 kb', stable: 'changes only if app code changes', browserCache: '✅ 1년 immutable' },
        { name: 'vendor.9d8e7f6c.js', size: '1.1 mb', stable: 'changes only if deps change',      browserCache: '✅ 1년 immutable' },
      ],
      notice: '🎉 빌드 12배 빠름 + 사용자 LCP 단축 + 강력 새로고침 안내 불필요',
    };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,
        beat:{ label:'출력 파일명 고정', at:'webpack.config.js (BAD) L6',
               caption:'출력 파일명을 main.js로 고정한다 — 매번 같은 이름이다.',
               changes:[{mark:'new', text:'filename: main.js (고정)'}] },
        code: {...CODE.step1, highlight:[6]},
      },
      { ...S1,
        beat:{ label:'빌드 캐시 없음', at:'webpack.config.js (BAD) L10',
               caption:'cache 옵션이 없어 memory cache만 쓰인다 — 프로세스가 끝나면 사라진다.',
               changes:[{mark:'gone', text:'filesystem cache 없음'}] },
        code: {...CODE.step1, highlight:[10]},
      },
      { ...S1,
        beat:{ label:'전체 재컴파일', at:'webpack.config.js (BAD) L13–14',
               caption:'문제 1 — 매번 전체 컴파일이라 빌드가 28초나 걸린다.',
               changes:[{mark:'gone', text:'전체 재컴파일 28s'}] },
        code: {...CODE.step1, highlight:[13,14]},
      },
      { ...S1,
        beat:{ label:'브라우저 캐시 깨짐', at:'webpack.config.js (BAD) L16–19',
               caption:'문제 2 — 파일명이 안 바뀌니 사용자 브라우저가 옛 main.js를 캐시에서 그대로 쓴다.',
               changes:[{mark:'gone', text:'브라우저 캐시 깨짐'}] },
        code: {...CODE.step1, highlight:[16,17,18,19]},
      },
      // ── Step 2 ────────────────────────────────────────────────────────
      { ...S2,
        beat:{ label:'filesystem 캐시 지정', at:'webpack.config.js (BUILD CACHE) L6–7',
               caption:'cache.type을 filesystem으로 지정해 디스크에 저장한다.',
               changes:[{mark:'new', text:'cache.type: filesystem'}] },
        code: {...CODE.step2, highlight:[6,7]},
      },
      { ...S2,
        beat:{ label:'캐시 위치 지정', at:'webpack.config.js (BUILD CACHE) L8',
               caption:'cacheDirectory로 캐시 저장 위치를 node_modules/.cache/webpack으로 정한다.',
               changes:[{mark:'new', text:'cacheDirectory 지정'}] },
        code: {...CODE.step2, highlight:[8]},
      },
      { ...S2,
        beat:{ label:'설정 변경 시 무효화', at:'webpack.config.js (BUILD CACHE) L9–11',
               caption:'buildDependencies로 webpack.config.js 자체가 바뀌면 캐시를 무효화한다.',
               changes:[{mark:'new', text:'buildDependencies.config'}] },
        code: {...CODE.step2, highlight:[9,10,11]},
      },
      { ...S2,
        beat:{ label:'빌드 시간 비교', at:'webpack.config.js (BUILD CACHE) L15–17',
               caption:'결과 — 첫 빌드 28s, 두 번째부터는 2.4s, 한 줄만 바꾸면 1.2s로 폭발적으로 빨라진다.',
               changes:[{mark:'changed', text:'28s → 2.4s(warm)'}] },
        code: {...CODE.step2, highlight:[15,16,17]},
      },
      // ── Step 3 ────────────────────────────────────────────────────────
      { ...S3,
        beat:{ label:'contenthash 적용', at:'webpack.config.js (CONTENTHASH) L10–12',
               caption:'filename에 contenthash를 넣어 모듈 내용이 바뀔 때만 파일명이 바뀌게 한다.',
               changes:[{mark:'changed', text:'filename → [name].[contenthash:8].js'}] },
        code: {...CODE.step3, highlight:[10,11,12]},
      },
      { ...S3,
        beat:{ label:'빌드 캐시 유지', at:'webpack.config.js (CONTENTHASH) L17',
               caption:'Step 2의 filesystem 빌드 캐시는 그대로 유지한다.',
               changes:[{mark:'read', text:'filesystem cache 유지'}] },
        code: {...CODE.step3, highlight:[17]},
      },
      { ...S3,
        beat:{ label:'index.html 자동 갱신', at:'webpack.config.js (CONTENTHASH) L21–22',
               caption:'HtmlWebpackPlugin의 template이 index.html에 새 파일명을 자동으로 주입한다.',
               changes:[{mark:'new', text:'index.html 자동 갱신'}] },
        code: {...CODE.step3, highlight:[21,22]},
      },
      { ...S3,
        beat:{ label:'해시 붙은 출력 확인', at:'webpack.config.js (CONTENTHASH) L27–30',
               caption:'결과 — dist에는 해시가 붙은 파일들이 나오고, 내용이 안 바뀌면 해시도 그대로다.',
               changes:[{mark:'new', text:'해시 붙은 파일명'}] },
        code: {...CODE.step3, highlight:[27,28,29,30]},
      },
      // ── Step 4 ────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:'빌드 캐시 유지', at:'webpack.config.js (FINAL) + nginx L12',
               caption:'filesystem 캐시(Step 2)는 그대로 사용한다.',
               changes:[{mark:'read', text:'cache: filesystem 유지'}] },
        code: {...CODE.step4, highlight:[12]},
      },
      { ...S4,
        beat:{ label:'코드 분할 추가', at:'webpack.config.js (FINAL) + nginx L14–16',
               caption:'optimization.splitChunks와 runtimeChunk로 코드 분할까지 더한다(다음 IV-2-1에서 다룬다).',
               changes:[{mark:'new', text:'runtimeChunk/splitChunks'}] },
        code: {...CODE.step4, highlight:[14,15,16]},
      },
      { ...S4,
        beat:{ label:'index.html no-cache', at:'webpack.config.js (FINAL) + nginx L22–25',
               caption:'nginx에서 index.html은 no-cache로 항상 새로 확인하게 한다.',
               changes:[{mark:'new', text:'index.html no-cache'}] },
        code: {...CODE.step4, highlight:[22,23,24,25]},
      },
      { ...S4,
        beat:{ label:'해시 파일 immutable', at:'webpack.config.js (FINAL) + nginx L26–28',
               caption:'해시 붙은 js/css는 1년 immutable 헤더로 캐시한다.',
               changes:[{mark:'new', text:'immutable 헤더 (js/css)'}] },
        code: {...CODE.step4, highlight:[26,27,28]},
      },
    ];

    function LiveDataPane({ beat, buildBar, files, notice }) {
      const maxMs = 28000;
      const coldPct = Math.min(100, (buildBar.coldMs / maxMs) * 100);
      const warmPct = Math.min(100, (buildBar.warmMs / maxMs) * 100);

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">⚡ 빌드 시간 + dist/ 파일</h2>
            <span className="text-[10px] text-slate-400 font-mono">live · cache</span>
          </div>

          {/* 빌드 시간 막대 */}
          <div className="rounded-lg border border-slate-200 bg-slate-50 p-3 mb-4">
            <div className="text-[10px] font-bold text-slate-700 uppercase tracking-wider mb-2">
              📊 {buildBar.label}
            </div>
            <div className="space-y-2">
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                  <span className="text-slate-600">cold build (첫 빌드)</span>
                  <span className="font-mono font-bold text-slate-700">{(buildBar.coldMs / 1000).toFixed(1)}s</span>
                </div>
                <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-amber-400 transition-all duration-700"
                    style={{ width: `${coldPct}%` }}
                  ></div>
                </div>
              </div>
              <div>
                <div className="flex justify-between text-[10px] mb-1">
                  <span className="text-slate-600">warm build (두 번째)</span>
                  <span className="font-mono font-bold text-slate-700">{(buildBar.warmMs / 1000).toFixed(1)}s</span>
                </div>
                <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-sky-500 transition-all duration-700"
                    style={{ width: `${warmPct}%` }}
                  ></div>
                </div>
              </div>
            </div>
          </div>

          {/* dist 파일 표 */}
          <div className="overflow-hidden rounded-lg border border-slate-200 mb-3">
            <div className="bg-slate-100 px-3 py-1.5 text-[10px] font-bold text-slate-600 uppercase tracking-wider">
              📁 dist/ 출력
            </div>
            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-600">
                <tr>
                  <th className="text-left px-2 py-2 font-bold">파일</th>
                  <th className="text-right px-2 py-2 font-bold w-16">size</th>
                  <th className="text-left px-2 py-2 font-bold hidden md:table-cell">동작</th>
                  <th className="text-left px-2 py-2 font-bold w-32">browser cache</th>
                </tr>
              </thead>
              <tbody>
                {files.map((f, i) => (
                  <tr key={i} className="border-t border-slate-100 transition-all duration-500">
                    <td className="px-2 py-2 font-mono text-[11px] text-slate-700">{f.name}</td>
                    <td className="px-2 py-2 text-right font-mono text-[10px] text-slate-500">{f.size}</td>
                    <td className="px-2 py-2 font-mono text-[10px] text-slate-500 hidden md:table-cell">{f.stable}</td>
                    <td className={`px-2 py-2 text-[10px] font-mono ${f.browserCache.startsWith('✅') ? 'text-emerald-700 font-bold' : f.browserCache.startsWith('❌') ? 'text-red-600' : 'text-sky-700'}`}>
                      {f.browserCache}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 공지 */}
          <div className={`p-3 rounded-lg text-[11px] font-medium border ${
            notice.startsWith('✅') || notice.startsWith('🎉') ? 'bg-emerald-50 text-emerald-900 border-emerald-300' :
            notice.startsWith('🎯') ? 'bg-sky-50 text-sky-900 border-sky-300' :
            'bg-amber-50 text-amber-900 border-amber-300'
          }`}>
            {notice}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
          setRenderedLines(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5"><span className="w-3 h-3 rounded-full bg-red-500"></span><span className="w-3 h-3 rounded-full bg-yellow-500"></span><span className="w-3 h-3 rounded-full bg-green-500"></span></div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>
          <pre className="hidden"><code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code></pre>
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-sky-500/10 border-l-2 border-sky-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);
      const step = STEPS[stepIdx];
      const handleNext = () => setStepIdx((i) => { if (i >= STEPS.length - 1) { setIsPlaying(false); return i; } return i + 1; });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;
      const togglePlay = () => { if (stepIdx >= STEPS.length - 1) setStepIdx(0); setIsPlaying((p) => !p); };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };
      useEffect(() => { if (!isPlaying) return; intervalRef.current = setInterval(() => nextRef.current(), 3000); return () => clearInterval(intervalRef.current); }, [isPlaying]);
      useEffect(() => { const onKey = (e) => { if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); } if (e.key === 'ArrowLeft') { e.preventDefault(); prevRef.current(); } }; window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-2</span>
            </nav>
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-500 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 개발 / 프로덕션 &gt; Chapter 2. cache</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">cache — filesystem / contenthash</h1>
                  <p className="text-sm text-slate-500 mt-0.5">두 종류의 캐시 — 빌드 캐시(작업장 정리) + 출력 캐시(책의 ISBN)</p>
                </div>
              </div>
            </header>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} buildBar={step.buildBar} files={step.files} notice={step.notice} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">💡 다음(IV-1-1)에서는 code splitting 기본 — multiple entry vs SplitChunks</div>
            )}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">세부 {stepIdx + 1} / {STEPS.length} · {step.title}</h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]">{isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}</button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-2-1.html" className="text-slate-500 hover:text-slate-700">&larr; III-2-1 HMR</a>
              <a href="../part4/IV-1-1.html" className="text-sky-700 hover:text-sky-900 font-medium">IV-1-1 code splitting &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
