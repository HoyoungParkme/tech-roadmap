<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack 학습 — III-1-2. source map (devtool 선택 가이드)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-1-2. source map (devtool 선택 가이드)
    학습 목표: devtool 옵션이 build time / quality / production 적합도 사이의 trade-off임을 본다.
    핵심 비유: "번역서 ↔ 원서 페이지 매핑" — source map은 컴파일된 코드의 줄 → 원본 코드의 줄을 알려주는 색인
    패턴: 좌 LiveDataPane(devtool 비교 표 + 에러 스택 트레이스) / 우 VSCode CodeViewer
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      step1: {lang:'javascript', filename:'webpack.config.js', lines:[
        'module.exports = {',
        '  mode: "production",',
        '  entry: "./src/index.js",',
        '  output: { filename: "main.js" },',
        '',
        '  devtool: false,           // ❌ source map 없음',
        '};',
        '',
        '// 결과 — 번들된 코드',
        '// main.js (한 줄, 압축됨)',
        '// !function(){"use strict";var e=...(48000자)...t.user.name)}();',
        '',
        '// 브라우저 콘솔 에러',
        '// TypeError: Cannot read properties of undefined (reading "name")',
        '//   at main.js:1:48732   ← 의미 없음',
        '',
        '// 디버깅 불가 — 원본 코드의 어느 줄인지 모른다',
      ]},
      step2: {lang:'javascript', filename:'webpack.dev.js', lines:[
        'module.exports = {',
        '  mode: "development",',
        '  entry: "./src/index.js",',
        '',
        '  // 개발 가성비 1순위',
        '  devtool: "eval-cheap-module-source-map",',
        '  //         └──┬─┘└──┬─┘└──┬─┘└────┬───┘',
        '  //          eval   cheap module source-map',
        '  //          (rebuild↑) (line) (원본) (매핑 생성)',
        '',
        '  devServer: { port: 5173, hot: true },',
        '};',
        '',
        '// 초기 build: 느림 (한 번)',
        '// rebuild   : 매우 빠름 (수정마다)',
        '// 에러 위치 : 원본 jsx/ts의 line까지 정확',
        '',
        '// 대안 — column까지 보고 싶을 때',
        '// devtool: "eval-source-map"  (rebuild는 조금 느려짐)',
      ]},
      step3: {lang:'javascript', filename:'webpack.prod.js', lines:[
        'module.exports = {',
        '  mode: "production",',
        '  entry: "./src/index.js",',
        '  output: {',
        '    filename: "[name].[contenthash:8].js",',
        '  },',
        '',
        '  // production 디버깅 — 외부 .map 생성',
        '  devtool: "source-map",',
        '};',
        '',
        '// dist/',
        '//  ├─ main.a1b2c3d4.js       (압축된 번들)',
        '//  └─ main.a1b2c3d4.js.map   (원본 매핑 파일)',
        '//',
        '// main.js 끝줄: //# sourceMappingURL=main.a1b2c3d4.js.map',
        '//',
        '// 주의',
        '//  - .map 을 그대로 공개 배포하면 원본 코드 노출',
        '//  - 보통: .map은 Sentry/DataDog에 업로드만 하고',
        '//          CDN 에는 올리지 않음 → hidden-source-map 사용',
      ]},
      step4: {lang:'javascript', filename:'webpack.config.js', lines:[
        '// 환경별 분기 (webpack-merge 패턴, 다음 자료에서 다룸)',
        'const isProd = process.env.NODE_ENV === "production";',
        '',
        'module.exports = {',
        '  mode: isProd ? "production" : "development",',
        '  entry: "./src/index.js",',
        '  output: {',
        '    filename: isProd ? "[name].[contenthash:8].js" : "[name].js",',
        '  },',
        '',
        '  devtool: isProd',
        '    ? "hidden-source-map"             // 공개 X, Sentry만',
        '    : "eval-cheap-module-source-map", // dev 가성비',
        '};',
        '',
        '// Sentry 업로드 예시 (CI)',
        '// $ sentry-cli releases files <version> upload-sourcemaps ./dist',
        '// → 배포 후 .map은 dist에서 삭제 → CDN에 올리지 않음',
        '',
        '// 한 줄 요약',
        '//   eval-*           : 개발용 (rebuild 빠름, 원본 노출 위험)',
        '//   *-source-map    : 외부 .map (production 가능)',
        '//   cheap            : line만 (가벼움)',
        '//   hidden-          : 주석 없음 (브라우저는 못 봄, Sentry만)',
      ]},
    };

    const ROWS_COMPARE = [
      { name: 'false',                          build: '× 1.0',  rebuild: '🚀',   quality: '❌ none',      prodOk: '✓ OK' },
      { name: 'eval',                            build: '× 1.1',  rebuild: '🚀🚀', quality: '⚠ 생성 코드',  prodOk: '❌' },
      { name: 'cheap-module-source-map',         build: '× 1.6',  rebuild: '🐢',   quality: '🔸 line only', prodOk: '❌' },
      { name: 'eval-cheap-module-source-map',    build: '× 1.3',  rebuild: '🚀',   quality: '🔸 line only', prodOk: '❌' },
      { name: 'source-map',                       build: '× 2.5',  rebuild: '🐢🐢', quality: '✅ full',      prodOk: '✓ OK (외부 .map)' },
      { name: 'hidden-source-map',               build: '× 2.5',  rebuild: '🐢🐢', quality: '✅ full',      prodOk: '✓ OK (Sentry용)' },
    ];

    const STACK1 = [
      'TypeError: Cannot read properties of undefined (reading "name")',
      '    at main.js:1:48732           ← 어디??',
      '    at HTMLButtonElement.onclick (main.js:1:51001)',
    ];
    const STACK2 = [
      'TypeError: Cannot read properties of undefined (reading "name")',
      '    at UserCard (src/components/UserCard.jsx:14)   ← 원본 줄!',
      '    at handleClick (src/pages/Home.jsx:42)',
    ];
    const STACK3 = [
      'TypeError: Cannot read properties of undefined (reading "name")',
      '    at UserCard (src/components/UserCard.jsx:14:23)  ← line+column',
      '    at handleClick (src/pages/Home.jsx:42:7)',
    ];
    const STACK4 = [
      '✓ dev = eval-cheap-module-source-map',
      '✓ prod = hidden-source-map (+ Sentry)',
      '❌ prod 에서 eval-* 사용 금지',
    ];

    const S1 = {
      title: 'Step 1. source map이 없으면 — 에러 위치가 미궁',
      desc: 'devtool: false. 번들된 main.js 한 줄에 모든 코드가 압축되어 있다. 에러 스택은 main.js:1:48732 처럼 의미 없는 위치를 가리킨다. 디버깅이 사실상 불가능.',
      currentTool: 'false (none)', buildTime: '🚀 fastest (× 1.0)', quality: '❌ none', prodOk: '✓ OK (가장 가벼움)', rebuild: '🚀',
      rows: ROWS_COMPARE, highlightRow: 0,
    };
    const S2 = {
      title: 'Step 2. development 권장 — eval-cheap-module-source-map',
      desc: '개발 모드의 가성비 1순위. eval 기반이라 초기 빌드는 느리지만 rebuild는 매우 빠르다(HMR과 궁합 좋음). loader 변환 전 원본까지 매핑되고, line 단위라 column까지 추적하는 옵션보다 가볍다.',
      currentTool: 'eval-cheap-module-source-map', buildTime: '× 1.3', quality: '🔸 line only (원본 line 추적)', prodOk: '❌ NO (production 금지)', rebuild: '🚀',
      rows: ROWS_COMPARE, highlightRow: 3,
    };
    const S3 = {
      title: 'Step 3. production + 디버깅 — source-map (외부 .map 파일)',
      desc: 'mode: production에서 devtool: "source-map". main.[hash].js 옆에 main.[hash].js.map 파일이 생성된다. 번들 자체는 압축된 채로 배포하고, Sentry나 Chrome DevTools가 .map을 참조해 원본 위치를 복원한다.',
      currentTool: 'source-map', buildTime: '× 2.5 (느림)', quality: '✅ full (column까지)', prodOk: '✓ OK (외부 .map)', rebuild: '🐢🐢',
      rows: ROWS_COMPARE, highlightRow: 4,
    };
    const S4 = {
      title: 'Step 4. 선택 가이드 — 환경별 정답표',
      desc: '결론: 개발=eval-cheap-module-source-map, 프로덕션 공개=hidden-source-map(+ Sentry 업로드), 로컬 빠른 확인=eval. 잘못 고르면 빌드 시간 5배 또는 원본 코드 유출.',
      currentTool: 'guide table', buildTime: '— 환경별 정답표 —', quality: '— 아래 표 참조 —', prodOk: '—', rebuild: '—',
      rows: [
        { name: 'development (일반)',         build: '권장',   rebuild: '🚀',   quality: 'eval-cheap-module-source-map',                    prodOk: '✓' },
        { name: 'development (가장 빠르게)',  build: '대안',   rebuild: '🚀🚀', quality: 'eval',                                            prodOk: '~' },
        { name: 'development (column까지)',   build: '대안',   rebuild: '🚀',   quality: 'eval-source-map',                                 prodOk: '~' },
        { name: 'production (공개 + 디버깅)', build: '권장',   rebuild: '🐢🐢', quality: 'hidden-source-map  + Sentry upload',              prodOk: '✓✓' },
        { name: 'production (가장 가볍게)',   build: '대안',   rebuild: '—',   quality: 'false',                                           prodOk: '~' },
        { name: 'production (절대 금지)',     build: '❌',     rebuild: '—',   quality: 'eval / eval-source-map (원본 코드 노출)',          prodOk: '❌' },
      ],
      highlightRow: 0,
    };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,
        beat:{ label:'source map 끄기', at:'webpack.config.js L6',
               caption:'devtool: false로 source map을 아예 끈다.',
               changes:[{mark:'new', text:'devtool: false'}] },
        stack: [],
        code: {...CODE.step1, highlight:[6]},
      },
      { ...S1,
        beat:{ label:'번들 압축 확인', at:'webpack.config.js L9–11',
               caption:'번들된 main.js는 한 줄로 압축돼 사람이 읽을 수 없다.',
               changes:[{mark:'read', text:'압축된 번들 확인'}] },
        stack: [],
        code: {...CODE.step1, highlight:[9,10,11]},
      },
      { ...S1,
        beat:{ label:'에러 위치 미궁', at:'webpack.config.js L13–15',
               caption:'에러 스택이 main.js:1:48732처럼 의미 없는 위치를 가리킨다.',
               changes:[{mark:'gone', text:'원본 위치 정보 없음'}] },
        stack: STACK1,
        code: {...CODE.step1, highlight:[13,14,15]},
      },
      { ...S1,
        beat:{ label:'디버깅 불가', at:'webpack.config.js L17',
               caption:'결론 — source map 없이는 디버깅이 사실상 불가능하다.',
               changes:[{mark:'gone', text:'디버깅 불가'}] },
        stack: STACK1,
        code: {...CODE.step1, highlight:[17]},
      },
      // ── Step 2 ────────────────────────────────────────────────────────
      { ...S2,
        beat:{ label:'가성비 1순위 옵션', at:'webpack.dev.js L6',
               caption:'eval-cheap-module-source-map을 지정한다 — 개발 가성비 1순위.',
               changes:[{mark:'changed', text:'devtool false → eval-cheap-module-source-map'}] },
        stack: [],
        code: {...CODE.step2, highlight:[6]},
      },
      { ...S2,
        beat:{ label:'옵션 이름 분해', at:'webpack.dev.js L7–9',
               caption:'옵션 이름을 분해하면 eval(빠른 rebuild) + cheap(line만) + module(원본 매핑) 조합이다.',
               changes:[{mark:'read', text:'옵션 이름 분해'}] },
        stack: [],
        code: {...CODE.step2, highlight:[7,8,9]},
      },
      { ...S2,
        beat:{ label:'빌드 속도 확인', at:'webpack.dev.js L14–16',
               caption:'초기 빌드는 느리지만 rebuild는 매우 빠르고, 에러 위치는 원본 line까지 잡힌다.',
               changes:[{mark:'read', text:'빌드/rebuild 속도 확인'}] },
        stack: STACK2,
        code: {...CODE.step2, highlight:[14,15,16]},
      },
      { ...S2,
        beat:{ label:'대안 옵션 확인', at:'webpack.dev.js L18–19',
               caption:'column까지 보고 싶으면 eval-source-map 대안도 있다(rebuild는 조금 느려짐).',
               changes:[{mark:'read', text:'대안 옵션 확인'}] },
        stack: STACK2,
        code: {...CODE.step2, highlight:[18,19]},
      },
      // ── Step 3 ────────────────────────────────────────────────────────
      { ...S3,
        beat:{ label:'source-map 지정', at:'webpack.prod.js L9',
               caption:'production에서 devtool: "source-map"을 지정한다.',
               changes:[{mark:'changed', text:'devtool → source-map'}] },
        stack: [],
        code: {...CODE.step3, highlight:[9]},
      },
      { ...S3,
        beat:{ label:'.map 파일 생성', at:'webpack.prod.js L12–14',
               caption:'빌드하면 번들 옆에 .map 파일이 따로 생긴다.',
               changes:[{mark:'new', text:'main.js.map 생성'}] },
        stack: [],
        code: {...CODE.step3, highlight:[12,13,14]},
      },
      { ...S3,
        beat:{ label:'sourceMappingURL 확인', at:'webpack.prod.js L16',
               caption:'번들 끝줄의 sourceMappingURL 주석이 .map 파일을 가리킨다.',
               changes:[{mark:'read', text:'sourceMappingURL 확인'}] },
        stack: STACK3,
        code: {...CODE.step3, highlight:[16]},
      },
      { ...S3,
        beat:{ label:'공개 배포 금지', at:'webpack.prod.js L19–21',
               caption:'.map을 그대로 공개하면 원본 코드가 노출되니, 보통 Sentry에만 올리고 hidden-source-map을 쓴다.',
               changes:[{mark:'gone', text:'.map 공개 배포 금지'}] },
        stack: STACK3,
        code: {...CODE.step3, highlight:[19,20,21]},
      },
      // ── Step 4 ────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:'환경 판별', at:'webpack.config.js L2',
               caption:'NODE_ENV로 production 여부를 판별한다.',
               changes:[{mark:'new', text:'isProd 플래그'}] },
        stack: [],
        code: {...CODE.step4, highlight:[2]},
      },
      { ...S4,
        beat:{ label:'devtool 환경별 분기', at:'webpack.config.js L11–13',
               caption:'isProd 삼항으로 devtool을 환경별로 분기한다 — prod는 hidden-source-map, dev는 eval-cheap-module-source-map.',
               changes:[{mark:'changed', text:'devtool 환경별 분기'}] },
        stack: [],
        code: {...CODE.step4, highlight:[11,12,13]},
      },
      { ...S4,
        beat:{ label:'Sentry 업로드', at:'webpack.config.js L16–18',
               caption:'prod의 .map은 CI에서 Sentry에만 업로드하고 CDN에는 올리지 않는다.',
               changes:[{mark:'read', text:'Sentry 업로드 확인'}] },
        stack: STACK4,
        code: {...CODE.step4, highlight:[16,17,18]},
      },
      { ...S4,
        beat:{ label:'선택 기준 요약', at:'webpack.config.js L20–24',
               caption:'정답표 한 줄 요약 — eval류는 개발용, source-map류는 production 가능, hidden은 브라우저에 안 보인다.',
               changes:[{mark:'read', text:'선택 기준 요약'}] },
        stack: STACK4,
        code: {...CODE.step4, highlight:[20,21,22,23,24]},
      },
    ];

    function LiveDataPane({ beat, currentTool, buildTime, quality, prodOk, rebuild, rows, highlightRow, stack }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🗺️ devtool 비교 & 에러 스택</h2>
            <span className="text-[10px] text-slate-400 font-mono">live · devtool</span>
          </div>

          {/* 현재 선택 */}
          <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-3 mb-4">
            <div className="text-[10px] font-bold text-sky-700 uppercase tracking-wider mb-1">현재 devtool</div>
            <div className="font-mono text-sm text-sky-900 break-all">{currentTool}</div>
            <div className="text-[11px] text-sky-700 mt-2 grid grid-cols-2 gap-1">
              <span>build: <span className="font-bold">{buildTime}</span></span>
              <span>quality: <span className="font-bold">{quality}</span></span>
              <span>rebuild: <span className="font-bold">{rebuild}</span></span>
              <span>prod: <span className="font-bold">{prodOk}</span></span>
            </div>
          </div>

          {/* devtool 표 */}
          <div className="overflow-hidden rounded-lg border border-slate-200 mb-3">
            <table className="w-full text-xs">
              <thead className="bg-slate-50 text-slate-600">
                <tr>
                  <th className="text-left px-2 py-2 font-bold">devtool / 환경</th>
                  <th className="text-center px-2 py-2 font-bold hidden md:table-cell">build</th>
                  <th className="text-center px-2 py-2 font-bold w-12">re</th>
                  <th className="text-left px-2 py-2 font-bold hidden md:table-cell">quality</th>
                  <th className="text-center px-2 py-2 font-bold w-20">prod</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr
                    key={i}
                    className={`border-t border-slate-100 transition-all duration-500 ${i === highlightRow ? 'bg-sky-50 ring-2 ring-sky-300' : ''}`}
                  >
                    <td className="px-2 py-2 font-mono text-[11px] text-slate-700">{r.name}</td>
                    <td className="px-2 py-2 text-center font-mono text-[10px] text-slate-500 hidden md:table-cell">{r.build}</td>
                    <td className="px-2 py-2 text-center text-[10px]">{r.rebuild}</td>
                    <td className="px-2 py-2 font-mono text-[10px] text-slate-500 hidden md:table-cell">{r.quality}</td>
                    <td className="px-2 py-2 text-center font-mono text-[10px] text-slate-600">{r.prodOk}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* 에러 스택 트레이스 */}
          <div className="rounded-lg border border-slate-700 bg-[#21252b] p-3 text-[11px] font-mono">
            <div className="text-[10px] text-slate-400 mb-1">📋 브라우저 콘솔 — 에러 스택</div>
            {stack.map((line, i) => (
              <div
                key={i}
                className={`whitespace-pre ${i === 0 ? 'text-red-400' : line.includes('← ') || line.includes('✓') ? 'text-emerald-300' : line.includes('❌') ? 'text-red-300' : 'text-slate-300'}`}
              >
                {line}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          // 칠하기 전에 본문을 다시 넣는다. 안 하면 앞 스텝 코드가 그대로 남는다.
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setRenderedLines(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5"><span className="w-3 h-3 rounded-full bg-red-500"></span><span className="w-3 h-3 rounded-full bg-yellow-500"></span><span className="w-3 h-3 rounded-full bg-green-500"></span></div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>
          <pre className="hidden"><code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code></pre>
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-sky-500/10 border-l-2 border-sky-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);
      const step = STEPS[stepIdx];
      const handleNext = () => setStepIdx((i) => { if (i >= STEPS.length - 1) { setIsPlaying(false); return i; } return i + 1; });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;
      const togglePlay = () => { if (stepIdx >= STEPS.length - 1) setStepIdx(0); setIsPlaying((p) => !p); };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };
      useEffect(() => { if (!isPlaying) return; intervalRef.current = setInterval(() => nextRef.current(), 3000); return () => clearInterval(intervalRef.current); }, [isPlaying]);
      useEffect(() => { const onKey = (e) => { if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); } if (e.key === 'ArrowLeft') { e.preventDefault(); prevRef.current(); } }; window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-2</span>
            </nav>
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-500 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 개발 / 프로덕션 &gt; Chapter 1. devtool</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">source map — devtool 선택 가이드</h1>
                  <p className="text-sm text-slate-500 mt-0.5">번역서 ↔ 원서 페이지 매핑 — 빠른 빌드와 디버깅 사이 trade-off</p>
                </div>
              </div>
            </header>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} {...step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">💡 다음(III-2-1)에서는 HMR — Hot Module Replacement 흐름</div>
            )}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">세부 {stepIdx + 1} / {STEPS.length} · {step.title}</h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]">{isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}</button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-1-1.html" className="text-slate-500 hover:text-slate-700">&larr; III-1-1 devServer</a>
              <a href="./III-2-1.html" className="text-sky-700 hover:text-sky-900 font-medium">III-2-1 HMR &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
