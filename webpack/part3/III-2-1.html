<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack 학습 — III-2-1. HMR (Hot Module Replacement)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-2-1. HMR (Hot Module Replacement)
    학습 목표: 코드 저장 → 브라우저 즉시 반영 사이의 4단계 흐름과 상태 보존 효과를 본다.
    핵심 비유: "공연 중 의상 갈아입기" — 무대(앱)는 그대로 두고 옷(모듈)만 바꿔치기
    패턴: 좌 LiveDataPane(흐름 다이어그램 + 카운터 상태 보존) / 우 VSCode CodeViewer
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 코드 수정 → fs.watch 감지',
        desc: '개발자가 Counter.jsx의 색상을 sky-500 → emerald-500으로 바꾸고 저장. webpack은 fs.watch로 src/ 전체를 감시하다가 변경을 감지한다. 이 시점에 브라우저는 아무 변화 없음.',
        flow: [
          { stage: 'editor',  label: 'src/Counter.jsx 저장', active: true,  done: false },
          { stage: 'watch',   label: 'webpack fs.watch 감지', active: false, done: false },
          { stage: 'rebuild', label: '변경 모듈만 rebuild',    active: false, done: false },
          { stage: 'ws',      label: 'WebSocket으로 patch 전송', active: false, done: false },
          { stage: 'apply',   label: 'HMR Runtime이 교체',       active: false, done: false },
        ],
        counter: { value: 7, status: 'idle', message: '브라우저: 그대로 (편집 중)', color: 'sky' },
        code: {
          lang: 'javascript',
          filename: 'src/Counter.jsx',
          lines: [
            'import React, { useState } from "react";',
            '',
            'export function Counter() {',
            '  const [n, setN] = useState(0);',
            '  return (',
            '    <button',
            '      onClick={() => setN(n + 1)}',
            '      className="bg-sky-500 text-white px-4 py-2 rounded"',
            '      //          ↑↑↑',
            '      //   sky-500 → emerald-500 으로 바꾸고 저장 (Ctrl+S)',
            '    >',
            '      count: {n}',
            '    </button>',
            '  );',
            '}',
          ],
          highlight: [8, 9, 10],
        },
      },
      {
        title: 'Step 2. webpack incremental rebuild',
        desc: 'webpack은 의존성 그래프에서 영향받은 모듈만 다시 컴파일한다. 전체 빌드는 1.2s지만 incremental rebuild는 80ms. compilation hook에서 변경된 chunk의 patch가 만들어진다.',
        flow: [
          { stage: 'editor',  label: 'src/Counter.jsx 저장', active: false, done: true },
          { stage: 'watch',   label: 'webpack fs.watch 감지', active: false, done: true },
          { stage: 'rebuild', label: '변경 모듈만 rebuild (80ms)', active: true,  done: false },
          { stage: 'ws',      label: 'WebSocket으로 patch 전송', active: false, done: false },
          { stage: 'apply',   label: 'HMR Runtime이 교체',       active: false, done: false },
        ],
        counter: { value: 7, status: 'compiling', message: '브라우저: 그대로 (서버에서 컴파일 중)', color: 'amber' },
        code: {
          lang: 'shell',
          filename: 'terminal (webpack-dev-server)',
          lines: [
            '$ npm run dev',
            '[webpack-dev-server] http://localhost:5173/',
            '',
            '✓ compiled successfully in 1245 ms     ← 초기 빌드',
            '',
            '# --- Ctrl+S 후 ---',
            '',
            '⚡ recompiling...',
            '✓ recompiled in 78 ms                  ← incremental (변경 모듈만)',
            '',
            '  hash: a1b2 → a1b3',
            '  emitted updates:',
            '    ./src/Counter.jsx     (1 module)',
            '    a1b2.hot-update.json  (manifest)',
            '    a1b2.hot-update.js    (patch payload)',
            '',
            '# WebSocket으로 클라이언트에 "hash 바뀜" 알림',
          ],
          highlight: [8, 9, 11, 12, 13, 14],
        },
      },
      {
        title: 'Step 3. WebSocket → HMR Runtime',
        desc: '브라우저에 주입된 HMR Runtime이 WebSocket으로 새 hash를 받는다. .hot-update.json으로 어떤 모듈이 바뀌었는지 확인하고 .hot-update.js를 fetch. 모듈 단위로 코드를 교체한다.',
        flow: [
          { stage: 'editor',  label: 'src/Counter.jsx 저장', active: false, done: true },
          { stage: 'watch',   label: 'webpack fs.watch 감지', active: false, done: true },
          { stage: 'rebuild', label: '변경 모듈만 rebuild (80ms)', active: false, done: true },
          { stage: 'ws',      label: 'WebSocket으로 patch 전송', active: true,  done: false },
          { stage: 'apply',   label: 'HMR Runtime이 교체',       active: false, done: false },
        ],
        counter: { value: 7, status: 'patching', message: '브라우저: patch fetch 중 (상태 7 유지)', color: 'amber' },
        code: {
          lang: 'javascript',
          filename: 'HMR Runtime (browser, 자동 주입)',
          lines: [
            '// webpack이 dev mode에서 번들에 자동 주입',
            '',
            'const ws = new WebSocket("ws://localhost:5173/ws");',
            '',
            'ws.onmessage = (event) => {',
            '  const msg = JSON.parse(event.data);',
            '',
            '  if (msg.type === "hash") {',
            '    currentHash = msg.data;',
            '  }',
            '',
            '  if (msg.type === "ok") {',
            '    // 1) manifest fetch',
            '    fetch(`/${prevHash}.hot-update.json`)',
            '      .then((r) => r.json())',
            '      .then((manifest) => {',
            '        // 2) 변경된 chunk 별 patch fetch',
            '        manifest.c.forEach((chunkId) => {',
            '          loadScript(`/${chunkId}.${prevHash}.hot-update.js`);',
            '        });',
            '      });',
            '  }',
            '};',
            '',
            '// 3) patch 안의 module.hot.accept() 콜백이 실행됨',
            '//    → React Fast Refresh 등이 트리거되어',
            '//      트리에서 해당 컴포넌트만 교체',
          ],
          highlight: [12, 13, 14, 17, 18, 19, 25, 26, 27],
        },
      },
      {
        title: 'Step 4. 모듈 교체 — 상태는 보존',
        desc: 'Counter.jsx만 새 코드로 바뀐다. 페이지 reload가 아니므로 useState의 카운터 값(7)이 그대로 유지된다. 색상만 sky → emerald로 바뀌고 클릭 카운트는 보존. full reload(F5)와의 결정적 차이.',
        flow: [
          { stage: 'editor',  label: 'src/Counter.jsx 저장', active: false, done: true },
          { stage: 'watch',   label: 'webpack fs.watch 감지', active: false, done: true },
          { stage: 'rebuild', label: '변경 모듈만 rebuild (80ms)', active: false, done: true },
          { stage: 'ws',      label: 'WebSocket으로 patch 전송', active: false, done: true },
          { stage: 'apply',   label: 'HMR Runtime이 교체 (상태 보존)', active: true,  done: true },
        ],
        counter: { value: 7, status: 'hot-replaced', message: '브라우저: 상태 7 그대로 + 색상만 emerald 로 바뀜!', color: 'emerald' },
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js (dev)',
          lines: [
            'module.exports = {',
            '  mode: "development",',
            '  entry: "./src/index.js",',
            '',
            '  devServer: {',
            '    port: 5173,',
            '    hot: true,                  // HMR 활성화 (기본 true)',
            '    liveReload: false,          // full reload는 끔 (HMR이 우선)',
            '    client: {',
            '      overlay: { errors: true, warnings: false },',
            '    },',
            '  },',
            '};',
            '',
            '// React 프로젝트라면 추가로',
            '// $ npm i -D @pmmmwh/react-refresh-webpack-plugin react-refresh',
            '//',
            '// plugins: [new ReactRefreshWebpackPlugin()]',
            '// → useState 값도 컴포넌트 단위로 자동 보존',
            '',
            '// HMR ❌ → full reload (F5)',
            '//    상태 초기화, 입력했던 폼 데이터 날아감',
            '// HMR ✅ ',
            '//    카운터, 모달, 라우트, 폼 데이터 모두 유지',
          ],
          highlight: [7, 8, 9, 10, 11, 18, 19],
        },
      },
    ];

    function LiveDataPane({ beat, flow, counter }) {
      const COLOR = {
        sky:     { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     btn: 'bg-sky-500' },
        amber:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   btn: 'bg-amber-500' },
        emerald: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', btn: 'bg-emerald-500' },
      }[counter.color] || { bg: 'bg-sky-50', border: 'border-sky-300', text: 'text-sky-900', btn: 'bg-sky-500' };

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🔥 HMR 흐름 + 브라우저 상태</h2>
            <span className="text-[10px] text-slate-400 font-mono">live · ws://localhost:5173/ws</span>
          </div>

          {/* 흐름 다이어그램 */}
          <div className="space-y-1.5 mb-4">
            {flow.map((s, i) => (
              <div
                key={i}
                className={`flex items-center gap-3 p-2 rounded-lg border transition-all duration-500 ${
                  s.active ? 'bg-sky-100 border-sky-400 ring-2 ring-sky-300' :
                  s.done   ? 'bg-emerald-50 border-emerald-200' :
                             'bg-slate-50 border-slate-200 opacity-60'
                }`}
              >
                <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ${
                  s.active ? 'bg-sky-500 text-white animate-pulse' :
                  s.done   ? 'bg-emerald-500 text-white' :
                             'bg-slate-300 text-slate-600'
                }`}>{s.done ? '✓' : i + 1}</span>
                <span className={`text-xs font-mono ${s.active ? 'font-bold text-sky-900' : 'text-slate-600'}`}>
                  {s.label}
                </span>
                {i < flow.length - 1 && (
                  <span className="ml-auto text-slate-300">↓</span>
                )}
              </div>
            ))}
          </div>

          {/* 브라우저 시뮬레이션 */}
          <div className={`rounded-lg border-2 ${COLOR.border} ${COLOR.bg} p-4`}>
            <div className={`text-[10px] font-bold uppercase tracking-wider mb-2 ${COLOR.text}`}>
              🌐 브라우저 (localhost:5173) — 상태: {counter.status}
            </div>
            <div className="flex items-center justify-center py-3">
              <button className={`${COLOR.btn} text-white px-6 py-3 rounded-lg font-bold shadow transition-all duration-500`}>
                count: {counter.value}
              </button>
            </div>
            <div className={`text-[11px] text-center ${COLOR.text}`}>
              {counter.message}
            </div>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
          setRenderedLines(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5"><span className="w-3 h-3 rounded-full bg-red-500"></span><span className="w-3 h-3 rounded-full bg-yellow-500"></span><span className="w-3 h-3 rounded-full bg-green-500"></span></div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>
          <pre className="hidden"><code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code></pre>
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-sky-500/10 border-l-2 border-sky-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);
      const step = STEPS[stepIdx];
      const handleNext = () => setStepIdx((i) => { if (i >= STEPS.length - 1) { setIsPlaying(false); return i; } return i + 1; });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;
      const togglePlay = () => { if (stepIdx >= STEPS.length - 1) setStepIdx(0); setIsPlaying((p) => !p); };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };
      useEffect(() => { if (!isPlaying) return; intervalRef.current = setInterval(() => nextRef.current(), 3000); return () => clearInterval(intervalRef.current); }, [isPlaying]);
      useEffect(() => { const onKey = (e) => { if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); } if (e.key === 'ArrowLeft') { e.preventDefault(); prevRef.current(); } }; window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-1</span>
            </nav>
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-500 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 개발 / 프로덕션 &gt; Chapter 2. HMR</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">HMR — Hot Module Replacement 흐름</h1>
                  <p className="text-sm text-slate-500 mt-0.5">공연 중 의상 갈아입기 — 무대(앱)는 그대로, 옷(모듈)만 교체</p>
                </div>
              </div>
            </header>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} flow={step.flow} counter={step.counter} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">💡 다음(III-2-2)에서는 cache — filesystem / contenthash</div>
            )}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">세부 {stepIdx + 1} / {STEPS.length} · {step.title}</h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]">{isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}</button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-1-2.html" className="text-slate-500 hover:text-slate-700">&larr; III-1-2 source map</a>
              <a href="./III-2-2.html" className="text-sky-700 hover:text-sky-900 font-medium">III-2-2 cache &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
