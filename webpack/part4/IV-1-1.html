<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack 학습 — IV-1-1. code splitting 기본 (multiple entry vs SplitChunks)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    IV-1-1. code splitting 기본 — multiple entry vs SplitChunks
    학습 목표: "왜 한 덩어리 main.js가 문제인지 → multiple entry → SplitChunks"의 진화를 청크 다이어그램으로 본다.
    핵심 비유: "택배 박스" — 한 덩어리 → 페이지별 박스 → 공통 부품(vendor) 따로 박스
    패턴: 좌 LiveDataPane(청크 다이어그램 + 크기 막대) / 우 VSCode CodeViewer
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 단일 entry — 모든 코드가 main.js 한 덩어리',
        desc: 'entry: "./src/index.js" 하나. 홈/상품/관리자 페이지 코드 + react + lodash + chart.js 가 전부 main.js에 묶여 2.4 MB. 사용자는 홈만 봐도 chart.js를 받는다.',
        chunks: [
          { name: 'main.js', size: 2400, color: 'red', includes: ['app code (3 page)', 'react', 'lodash', 'chart.js'] },
        ],
        totalSize: 2400,
        scenario: '👤 사용자가 / 만 봐도 chart.js 까지 다 다운로드',
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js (BAD)',
          lines: [
            'module.exports = {',
            '  mode: "production",',
            '  entry: "./src/index.js",         // ❌ 하나의 진입점',
            '',
            '  output: {',
            '    filename: "[name].[contenthash:8].js",',
            '    path: __dirname + "/dist",',
            '  },',
            '};',
            '',
            '// src/index.js',
            '//   import { HomePage } from "./pages/Home";',
            '//   import { ShopPage } from "./pages/Shop";   ← 같이 번들',
            '//   import { AdminPage } from "./pages/Admin"; ← 같이 번들',
            '//   import _ from "lodash";',
            '//   import Chart from "chart.js";',
            '',
            '// 결과: dist/main.a1b2.js  (2.4 MB)',
            '// 사용자 LCP 3.8s, JS parse time 1.2s — 답이 없다',
          ],
          highlight: [3, 12, 13, 14, 18, 19],
        },
      },
      {
        title: 'Step 2. multiple entry — 페이지별로 entry 분리',
        desc: 'entry를 { home, shop, admin } 객체로 분리. 페이지별 HTML이 각자의 번들만 로드한다. 하지만 모든 entry가 react와 lodash를 따로 포함 → 중복 코드가 3배.',
        chunks: [
          { name: 'home.js',  size: 920, color: 'sky',    includes: ['home page', 'react (중복)', 'lodash (중복)'] },
          { name: 'shop.js',  size: 1100, color: 'sky',    includes: ['shop page', 'react (중복)', 'lodash (중복)'] },
          { name: 'admin.js', size: 980, color: 'sky',    includes: ['admin page', 'react (중복)', 'chart.js'] },
        ],
        totalSize: 3000,
        scenario: '👤 / 방문 → home.js만 받음 (좋아짐). 하지만 react가 3번 중복 → 총 다운로드량은 오히려 늘어남',
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js (multiple entry)',
          lines: [
            'const HtmlWebpackPlugin = require("html-webpack-plugin");',
            '',
            'module.exports = {',
            '  mode: "production",',
            '  entry: {',
            '    home:  "./src/pages/home.js",',
            '    shop:  "./src/pages/shop.js",',
            '    admin: "./src/pages/admin.js",',
            '  },',
            '',
            '  output: {',
            '    filename: "[name].[contenthash:8].js",',
            '    path: __dirname + "/dist",',
            '    clean: true,',
            '  },',
            '',
            '  plugins: [',
            '    new HtmlWebpackPlugin({ filename: "home.html",  chunks: ["home"]  }),',
            '    new HtmlWebpackPlugin({ filename: "shop.html",  chunks: ["shop"]  }),',
            '    new HtmlWebpackPlugin({ filename: "admin.html", chunks: ["admin"] }),',
            '  ],',
            '};',
            '',
            '// 문제: react / lodash 가 home, shop, admin 셋 다 들어감 → 3배 중복',
          ],
          highlight: [5, 6, 7, 8, 9, 18, 19, 20, 25],
        },
      },
      {
        title: 'Step 3. SplitChunks — 공통/vendor 자동 추출',
        desc: 'optimization.splitChunks: { chunks: "all" }. webpack이 2개 이상 entry가 공유하는 모듈을 별도 chunk로 추출한다. node_modules에서 온 모듈은 자동으로 vendors~* 청크로. 중복 제거.',
        chunks: [
          { name: 'vendors.js',  size: 480, color: 'amber',   includes: ['react', 'lodash (공통)'] },
          { name: 'home.js',    size: 60,  color: 'sky',     includes: ['home page only'] },
          { name: 'shop.js',    size: 90,  color: 'sky',     includes: ['shop page only'] },
          { name: 'admin.js',   size: 70,  color: 'sky',     includes: ['admin page only'] },
          { name: 'chart.async.js', size: 320, color: 'emerald', includes: ['chart.js (admin만 쓰는 거 분리)'] },
        ],
        totalSize: 1020,
        scenario: '👤 / 방문 → vendors.js + home.js 만 (540 kb). 다른 페이지 이동 시 vendors는 캐시 재사용',
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js (SPLIT)',
          lines: [
            'module.exports = {',
            '  mode: "production",',
            '  entry: {',
            '    home:  "./src/pages/home.js",',
            '    shop:  "./src/pages/shop.js",',
            '    admin: "./src/pages/admin.js",',
            '  },',
            '',
            '  output: {',
            '    filename: "[name].[contenthash:8].js",',
            '    chunkFilename: "[name].[contenthash:8].chunk.js",',
            '    clean: true,',
            '  },',
            '',
            '  optimization: {',
            '    splitChunks: {',
            '      chunks: "all",                 // 모든 chunk(초기 + async) 대상',
            '      // 기본값으로 충분 — 아래는 webpack의 default 동작',
            '      // - node_modules → vendors~* 청크',
            '      // - 2개 이상 chunk가 import → ~ 공통 청크',
            '    },',
            '  },',
            '};',
            '',
            '// dist/',
            '//   vendors~home~shop~admin.[hash].js   (react + lodash, 한 번만 다운로드)',
            '//   home.[hash].js                       (60 kb)',
            '//   shop.[hash].js                       (90 kb)',
            '//   admin.[hash].js                      (70 kb)',
          ],
          highlight: [15, 16, 17, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 4. 비교 요약 — 언제 어떤 전략?',
        desc: '결론: 단일 entry는 거의 항상 BAD. multiple entry는 다중 HTML(SSR/MPA)에서만 의미. SPA는 단일 entry + SplitChunks + dynamic import(IV-1-2)가 표준 조합. vendor 분리는 캐시 안정성에 가장 큰 효과.',
        chunks: [
          { name: '✓ SPA 표준',      size: 0, color: 'emerald', includes: ['entry 1 + SplitChunks + dynamic import (IV-1-2)'] },
          { name: '✓ MPA / SSR',      size: 0, color: 'sky',     includes: ['entry N + SplitChunks (vendor 공유)'] },
          { name: '○ 라이브러리 빌드', size: 0, color: 'amber',   includes: ['entry 1, splitChunks 끔, library 옵션'] },
          { name: '❌ 그냥 단일 entry', size: 0, color: 'red',     includes: ['main.js 한 덩어리 — 2.4MB, peak LCP'] },
        ],
        totalSize: 0,
        scenario: '🎯 단일 entry + SplitChunks + dynamic import — SPA의 황금 조합',
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js (SPA 표준)',
          lines: [
            '// SPA의 경우 — 단일 entry 유지 + SplitChunks',
            'module.exports = {',
            '  mode: "production",',
            '  entry: "./src/index.tsx",   // SPA 단일 entry',
            '',
            '  output: {',
            '    filename: "[name].[contenthash:8].js",',
            '    chunkFilename: "[name].[contenthash:8].chunk.js",',
            '    clean: true,',
            '  },',
            '',
            '  optimization: {',
            '    splitChunks: { chunks: "all" },',
            '    runtimeChunk: "single",     // IV-2-1 — 캐시 안정성',
            '  },',
            '};',
            '',
            '// 코드 측 (src/router.tsx)',
            '// import { lazy } from "react";',
            '// const Admin = lazy(() => import("./pages/Admin"));  // IV-1-2',
            '',
            '// 결과 chunks',
            '//   runtime.js       (작음, IV-2-1)',
            '//   vendors.js       (react/lodash)',
            '//   main.js          (앱 코드)',
            '//   pages-Admin.chunk.js  (Admin 페이지 진입 시에만 로드)',
            '',
            '// → 첫 페이지 LCP 짧음 + 페이지 이동 시 필요한 만큼만 추가 다운로드',
          ],
          highlight: [12, 13, 14, 20, 24, 25, 26],
        },
      },
    ];

    function LiveDataPane({ chunks, totalSize, scenario }) {
      const COLOR = {
        sky:     'bg-sky-100 border-sky-300 text-sky-900',
        emerald: 'bg-emerald-100 border-emerald-300 text-emerald-900',
        amber:   'bg-amber-100 border-amber-300 text-amber-900',
        red:     'bg-red-100 border-red-300 text-red-900',
      };
      const maxSize = Math.max(...chunks.map((c) => c.size), 100);
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📦 청크 다이어그램</h2>
            <span className="text-[10px] text-slate-400 font-mono">live · output chunks</span>
          </div>

          {/* 총 크기 */}
          {totalSize > 0 && (
            <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-3 mb-4">
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-bold text-sky-700 uppercase tracking-wider">전체 다운로드 (모든 chunks 합)</span>
                <span className="font-mono text-lg font-bold text-sky-900">{totalSize} kb</span>
              </div>
            </div>
          )}

          {/* 청크 목록 */}
          <div className="space-y-2 mb-4">
            {chunks.map((c, i) => (
              <div
                key={i}
                className={`rounded-lg border-2 p-3 transition-all duration-500 ${COLOR[c.color] || COLOR.sky}`}
              >
                <div className="flex items-center justify-between mb-1">
                  <span className="font-mono text-xs font-bold">{c.name}</span>
                  {c.size > 0 && (
                    <span className="font-mono text-[11px]">{c.size} kb</span>
                  )}
                </div>
                {c.size > 0 && (
                  <div className="h-2 bg-white/60 rounded-full overflow-hidden mb-2">
                    <div
                      className={`h-full transition-all duration-700 ${
                        c.color === 'red'     ? 'bg-red-500' :
                        c.color === 'amber'   ? 'bg-amber-500' :
                        c.color === 'emerald' ? 'bg-emerald-500' :
                        'bg-sky-500'
                      }`}
                      style={{ width: `${(c.size / maxSize) * 100}%` }}
                    ></div>
                  </div>
                )}
                <div className="text-[10px] font-mono opacity-80">
                  {c.includes.map((m, j) => (
                    <span key={j}>{m}{j < c.includes.length - 1 ? ' · ' : ''}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {/* 시나리오 */}
          <div className="p-3 rounded-lg bg-slate-100 border border-slate-200 text-[11px] font-medium text-slate-700">
            {scenario}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
          setRenderedLines(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5"><span className="w-3 h-3 rounded-full bg-red-500"></span><span className="w-3 h-3 rounded-full bg-yellow-500"></span><span className="w-3 h-3 rounded-full bg-green-500"></span></div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>
          <pre className="hidden"><code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code></pre>
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-sky-500/10 border-l-2 border-sky-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);
      const step = STEPS[stepIdx];
      const handleNext = () => setStepIdx((i) => { if (i >= STEPS.length - 1) { setIsPlaying(false); return i; } return i + 1; });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;
      const togglePlay = () => { if (stepIdx >= STEPS.length - 1) setStepIdx(0); setIsPlaying((p) => !p); };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };
      useEffect(() => { if (!isPlaying) return; intervalRef.current = setInterval(() => nextRef.current(), 3000); return () => clearInterval(intervalRef.current); }, [isPlaying]);
      useEffect(() => { const onKey = (e) => { if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); } if (e.key === 'ArrowLeft') { e.preventDefault(); prevRef.current(); } }; window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-1</span>
            </nav>
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-500 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. 코드 스플리팅 / 지연 로딩 &gt; Chapter 1. 기본</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">code splitting 기본 — multiple entry vs SplitChunks</h1>
                  <p className="text-sm text-slate-500 mt-0.5">택배 박스 — 한 덩어리 → 페이지별 박스 → 공통 부품 분리</p>
                </div>
              </div>
            </header>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane chunks={step.chunks} totalSize={step.totalSize} scenario={step.scenario} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">💡 다음(IV-1-2)에서는 dynamic import — import() 문법과 청크 자동 생성</div>
            )}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">Step {stepIdx + 1} / {STEPS.length} · {step.title}</h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]">{isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}</button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>
            <nav className="flex justify-between text-sm pt-2">
              <a href="../part3/III-2-2.html" className="text-slate-500 hover:text-slate-700">&larr; III-2-2 cache</a>
              <a href="./IV-1-2.html" className="text-sky-700 hover:text-sky-900 font-medium">IV-1-2 dynamic import &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
