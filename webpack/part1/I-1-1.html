  <div id="root" data-trn-native-beats="1"></div>
  <!--
    Webpack I-1-1 — entry / output (비유: 공장 입고/출고장)
    entry = 원료가 들어오는 입고장 / output = 완성품이 쌓이는 출고장
    5단계: 원본 파일 → entry 선언 → dependency 추적 → bundle 생성 → output 적용
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#8DD6F9';
    const BRAND_DARK = '#1f6fa8';
    const BRAND_DEEP = '#0f4c75';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang: 'javascript', filename: 'src/index.js', lines: [
        '// src/index.js — 앱의 시작점이 될 파일',
        'import { renderHeader } from "./header.js";',
        'import { renderFooter } from "./footer.js";',
        'import "./style.css";',
        '',
        'function bootstrap() {',
        '  const root = document.getElementById("root");',
        '  root.innerHTML = "";',
        '  renderHeader(root);',
        '  // … 본문 …',
        '  renderFooter(root);',
        '}',
        '',
        'bootstrap();',
        '',
        '// 이 파일이 다른 파일들을 import 하고 있다',
        '// → 자연스럽게 "출발 모듈" 이 되는 후보',
        '// 그러나 브라우저는 import 를 그대로 못 읽는다',

      s2: {lang: 'javascript', filename: 'webpack.config.js', lines: [

        'const path = require("path");',
        '',
        'module.exports = {',
        '  // 이 한 줄이 핵심 — 출발 모듈',
        '  entry: "./src/index.js",',
        '',
        '  // output 은 다음 단계에서 채운다',
        '};',
        '',
        '// 여러 진입점이 필요한 경우 — 객체로',
        '// entry: {',
        '//   main:  "./src/index.js",',
        '//   admin: "./src/admin.js",',
        '// }',
        '// → 두 개의 독립적인 빌드 그래프가 만들어진다',
        '',
        '// 배열도 가능 (구버전 호환)',

      s3: {lang: 'javascript', filename: 'webpack/internals.js', lines: [
        '// Webpack 내부의 동작을 의사 코드로',
        'function buildGraph(entryPath) {',
        '  const visited = new Set();',
        '  const queue = [entryPath];',
        '  const modules = [];',
        '',
        '  while (queue.length) {',
        '    const file = queue.shift();',
        '    if (visited.has(file)) continue;',
        '    visited.add(file);',
        '',
        '    const code = readFile(file);',
        '    const deps = parseImports(code);',
        '    // → ["./header.js", "./footer.js", "./style.css"]',
        '',
        '    modules.push({ file, code, deps });',
        '    deps.forEach((d) => queue.push(resolve(file, d)));',
        '  }',
        '',
        '  return modules; // 의존 그래프 완성',
        '}',
        '',
        '// 실제 Webpack 은 loader/plugin 까지 함께 적용한다',
      ]},
      s4: {lang: 'javascript', filename: 'dist/main.js (요약본)', lines: [
        '// dist/main.js — 생성된 번들의 골격',
        '(() => {',
        '  // Webpack 런타임 — 모듈 캐시 + require 구현',
        '  const __modules__ = {',
        '    "./src/header.js": (module, exports) => {',
        '      function renderHeader(root) { /* … */ }',
        '      module.exports = { renderHeader };',
        '    },',
        '    "./src/footer.js": (module, exports) => {',
        '      function renderFooter(root) { /* … */ }',
        '      module.exports = { renderFooter };',
        '    },',
        '    "./src/style.css": (module, exports) => {',
        '      // style-loader 가 <style> 태그를 주입',
        '    },',
        '    "./src/index.js": (m, e, __webpack_require__) => {',
        '      const { renderHeader } = __webpack_require__("./src/header.js");',
        '      const { renderFooter } = __webpack_require__("./src/footer.js");',
        '      __webpack_require__("./src/style.css");',
        '      // bootstrap() …',
        '    },',
        '  };',
        '  // entry 모듈 실행 (트리거)',
        '  __webpack_require__("./src/index.js");',
        '})();',
      ]},
      s5: {lang: 'javascript', filename: 'webpack.config.js (완성)', lines: [
        '// webpack.config.js — entry + output 완성',
        'const path = require("path");',
        '',
        'module.exports = {',
        '  mode: "production",',
        '',
        '  // 입고장 — 빌드의 시작점',
        '  entry: "./src/index.js",',
        '',
        '  // 출고장 — 어디에 어떤 이름으로',
        '  output: {',
        '    path: path.resolve(__dirname, "dist"),',
        '    filename: "[name].[contenthash:8].js",',
        '    clean: true,        // 빌드 전에 dist/ 비우기',

        '',
        '// 운영 팁',
        '//   - clean: true 로 옛 번들 잔존을 막는다',
        '//   - publicPath 는 CDN/서브경로 배포 시 반드시 점검',

    const S1 = { title: 'Step 1. 원본 파일 — 입고장 앞에 쌓인 원료들', desc: 'src/ 폴더 안에는 index.js, header.js, footer.js, style.css 가 흩어져 있다. 브라우저는 이 파일들을 하나씩 <script> 로 읽어도 되지만, 그러면 요청 횟수가 늘고 모듈 간 의존 순서를 사람이 보장해야 한다. 공장에 비유하면 — 부품을 한 봉지로 묶지 않고 그대로 출하하는 셈이다. Webpack 은 이 흩어진 부품을 하나의 출하 박스로 묶기 위해, 먼저 "어느 부품이 시작점인지" 를 알아야 한다. 그 시작점이 entry 다.' };
    const S2 = { title: 'Step 2. entry 선언 — "이 파일이 출발점이다"', desc: 'webpack.config.js 에 entry: "./src/index.js" 를 적는다. 단 한 줄로 "여기서부터 빌드를 시작해라" 라고 Webpack 에게 알려준다. entry 는 문자열 한 개도, 객체로 여러 개도 가능하다 — 예를 들어 admin/main 두 개의 앱을 한 빌드로 만들 수도 있다. 입고장 비유: 컨베이어 벨트의 어디에 원료를 처음 올릴지 정하는 것. 이 한 줄이 빠지면 Webpack 은 "어디서부터 시작해야 하지?" 라고 멈춘다.' };
    const S3 = { title: 'Step 3. dependency 추적 — 모듈 그래프를 그린다', desc: 'Webpack 은 entry 파일을 열어 import 구문을 찾는다. import "./header.js" 가 보이면 header.js 도 모듈 그래프에 넣고, 그 안의 import 를 또 따라간다. 이 과정이 재귀적으로 반복되면서 한 장의 의존 그래프가 완성된다. 입고장 비유: 시작 부품에 붙어 있는 부속을 따라가며 한 박스에 모두 담는 과정. CSS, 이미지, 폰트도 (loader 가 있으면) 그래프에 포함된다. 추적이 끝난 모듈들은 다음 단계인 번들 생성으로 넘어간다.' };
    const S4 = { title: 'Step 4. bundle 생성 — 하나의 출고 박스로 묶는다', desc: '모듈 그래프가 완성되면 Webpack 은 각 모듈을 함수로 감싸고, 그 함수들을 한 파일 안에 묶는다. 이 파일이 bundle (보통 main.js 또는 [name].js) 이다. 브라우저는 이제 <script src="bundle.js"> 한 줄만 읽으면 모든 모듈이 메모리에 올라간다. 입고장 비유: 흩어진 부품들이 라벨이 붙은 한 박스로 포장되어 출하 준비를 끝낸다. CSS 는 (설정에 따라) JS 안에 인라인되거나 별도의 .css 파일로 추출된다.' };
    const S5 = { title: 'Step 5. output 적용 — 출고장 위치 / 파일명 정의', desc: '마지막으로 output 설정으로 "이 번들을 어디에 어떤 이름으로 둘지" 를 정한다. output.path 는 보통 dist/ 폴더 (절대 경로), filename 은 "[name].js" 또는 "[name].[contenthash].js" 다. contenthash 를 쓰면 코드가 바뀌지 않은 한 파일명이 그대로라 — 브라우저 캐시를 안정적으로 활용할 수 있다. publicPath 는 HTML 에서 번들을 부르는 기준 URL 이다 (CDN 사용 시 중요). 이 세 가지가 output 의 핵심이다.' };

    const FILES_IDLE = [

    const STEPS = [

      { ...S1,

          changes: [{ mark: 'read', text: 'renderHeader(), renderFooter() 호출' }, { mark: 'new', text: 'bootstrap() 즉시 실행' }] },

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          // 칠하기 전에 본문을 다시 넣는다. 안 하면 앞 스텝 코드가 그대로 남는다.
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        return code.lines.map((l, i) => ({
          html: tokenHtml && tokenHtml[i] !== undefined
            ? tokenHtml[i]
            : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
        }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(141,214,249,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#eaf6fd 0%,#cfeaf9 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg font-bold" style={{background:BRAND, color:BRAND_DEEP}}>WP</span>

                <h1 className="text-2xl font-bold" style={{color:BRAND_DEEP}}>I-1-1. entry / output</h1>
                <p className="text-sm" style={{color:BRAND_DARK}}>비유: 공장의 입고장(entry) → 출고장(output) — 흩어진 파일을 한 박스로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND_DARK}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#bce3f4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow" style={{background:BRAND, color:BRAND_DEEP}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND_DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND_DARK}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold" style={{background:BRAND, color:BRAND_DEEP}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND_DARK}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:BRAND_DARK}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                entry 는 빌드의 출발점, output 은 산출물의 위치/이름 규칙이다. 이 둘만 잡아도 Webpack 의 골격이 선다. 다음 챕터에서 — JS 외의 파일(CSS/이미지/TS)을 모듈로 변환하는 loader 를 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Webpack', 'entry', 'output', '번들러', '모듈그래프', 'contenthash'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#eaf6fd', color:BRAND_DEEP, border:`1px solid ${BRAND}`}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND_DARK}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
