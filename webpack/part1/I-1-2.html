<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack 학습 — I-1-2. loader</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    Webpack I-1-2 — loader (비유: 공장의 변환 라인)
    Webpack 은 JS 만 안다. 다른 형식은 loader 가 JS 로 번역해야 그래프에 들어간다.
    5단계: 비-JS 파일 등장 → 에러 → loader 도입 → 체인 적용 → 산출 확인
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#8DD6F9';
    const BRAND_DARK = '#1f6fa8';
    const BRAND_DEEP = '#0f4c75';

    const STEPS = [
      {
        title: 'Step 1. 비-JS 파일 등장 — CSS 와 PNG 가 import 된다',
        desc: 'JS 코드에서 import "./button.css" 와 import logo from "./logo.png" 을 적었다. 브라우저는 못 읽지만 — 번들러를 쓰니까 묶어줄 거라 기대한다. Webpack 의 기본 상태에서는 어떻게 될까? Webpack 은 본질적으로 JS 모듈만 안다. CSS 는 텍스트, PNG 는 바이너리다. "이 파일을 어떻게 JS 로 바꿔야 하지?" 를 모른다. loader 가 없으면 다음 단계에서 빌드가 멈춘다.',
        files: [
          { name: 'src/index.js', tag: 'JS', state: 'ok', detail: 'entry' },
          { name: 'src/button.css', tag: 'CSS', state: 'unknown', detail: 'loader 없음' },
          { name: 'src/logo.png', tag: 'PNG', state: 'unknown', detail: 'loader 없음' },
          { name: 'src/api.ts', tag: 'TS', state: 'unknown', detail: 'loader 없음' },
        ],
        rules: [],
        alert: { tone: 'info', text: 'JS 외의 파일은 Webpack 이 직접 읽을 수 없다. loader 가 필요하다.' },
        code: {
          lang: 'javascript',
          filename: 'src/index.js',
          lines: [
            '// src/index.js',
            'import "./button.css";          // CSS — 텍스트 파일',
            'import logo from "./logo.png";  // PNG — 바이너리 파일',
            'import { fetchUser } from "./api.ts"; // TS — 변환 필요',
            '',
            'function init() {',
            '  const img = document.createElement("img");',
            '  img.src = logo;',
            '  document.body.appendChild(img);',
            '  fetchUser(1).then((u) => console.log(u));',
            '}',
            '',
            'init();',
            '',
            '// 기대 — 번들러가 알아서 묶어줄 것이다',
            '// 현실 — Webpack 은 JS 만 안다',
          ],
          highlight: [1, 2, 3, 4, 15, 16],
        },
      },
      {
        title: 'Step 2. 에러 — "You may need an appropriate loader"',
        desc: 'webpack 실행 → 빨간 에러. ERROR in ./src/button.css 1:0 — Module parse failed: Unexpected token. You may need an appropriate loader to handle this file type. Webpack 이 .css 파일을 JS 파일처럼 파싱하려다가 첫 글자에서 막혔다. 같은 에러가 .png, .ts 에서도 반복된다. 이 메시지가 곧 "loader 를 등록하라" 는 신호다.',
        files: [
          { name: 'src/index.js', tag: 'JS', state: 'ok', detail: 'entry' },
          { name: 'src/button.css', tag: 'CSS', state: 'error', detail: 'parse 실패' },
          { name: 'src/logo.png', tag: 'PNG', state: 'error', detail: 'parse 실패' },
          { name: 'src/api.ts', tag: 'TS', state: 'error', detail: 'parse 실패' },
        ],
        rules: [],
        alert: { tone: 'danger', text: '"appropriate loader" 메시지 = loader 가 빠졌다는 표준 신호.' },
        code: {
          lang: 'javascript',
          filename: 'terminal',
          lines: [
            '$ npx webpack',
            '',
            'asset main.js 4.2 KiB',
            '',
            'ERROR in ./src/button.css 1:0',
            'Module parse failed: Unexpected token (1:0)',
            'You may need an appropriate loader to handle this file type,',
            'currently no loaders are configured to process this file.',
            '> .btn { background: #8DD6F9; padding: 12px; }',
            '|       border-radius: 8px;',
            '|     }',
            '',
            'ERROR in ./src/logo.png',
            'Module parse failed: Unexpected character "" (1:0)',
            'You may need an appropriate loader …',
            '',
            'ERROR in ./src/api.ts 3:14',
            'Module parse failed: Unexpected token (3:14)',
            'You may need an appropriate loader …',
            '> async function fetchUser(id: number) {',
            '',
            'webpack 5.x compiled with 3 errors',
          ],
          highlight: [5, 6, 7, 8, 13, 14, 15, 17, 18, 19, 22],
        },
      },
      {
        title: 'Step 3. loader 도입 — 각 형식별로 한 줄씩',
        desc: 'webpack.config.js 의 module.rules 에 loader 를 등록한다. test 는 파일 경로 정규식, use 는 적용할 loader 이름이다. css-loader 는 .css 를 JS 모듈로 변환, style-loader 는 그 결과를 <style> 태그로 주입한다. asset/resource 는 .png 를 URL 로 emit 한다. ts-loader (또는 babel-loader + @babel/preset-typescript) 는 .ts 를 JS 로 컴파일한다. 등록과 동시에 — 같은 import 가 동작한다.',
        files: [
          { name: 'src/index.js', tag: 'JS', state: 'ok', detail: 'entry' },
          { name: 'src/button.css', tag: 'CSS', state: 'loaded', detail: 'css+style' },
          { name: 'src/logo.png', tag: 'PNG', state: 'loaded', detail: 'asset' },
          { name: 'src/api.ts', tag: 'TS', state: 'loaded', detail: 'ts-loader' },
        ],
        rules: [
          { test: '/\\.css$/', use: ['style-loader', 'css-loader'] },
          { test: '/\\.png$/', use: 'asset/resource (built-in)' },
          { test: '/\\.ts$/', use: 'ts-loader' },
        ],
        alert: { tone: 'good', text: 'rules 에 등록만 하면 같은 import 가 동작한다 — 코드는 변경 없음.' },
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js',
          lines: [
            '// webpack.config.js — loader 등록',
            'module.exports = {',
            '  entry: "./src/index.js",',
            '  output: { filename: "bundle.js" },',
            '',
            '  module: {',
            '    rules: [',
            '      // CSS — 두 개의 loader 를 체인',
            '      {',
            '        test: /\\.css$/,',
            '        use: ["style-loader", "css-loader"],',
            '      },',
            '      // PNG — webpack 5 내장 asset 모듈',
            '      {',
            '        test: /\\.png$/,',
            '        type: "asset/resource",',
            '      },',
            '      // TS — JS 로 컴파일',
            '      {',
            '        test: /\\.ts$/,',
            '        use: "ts-loader",',
            '        exclude: /node_modules/,',
            '      },',
            '    ],',
            '  },',
            '',
            '  resolve: { extensions: [".ts", ".js"] },',
            '};',
          ],
          highlight: [6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 18, 19, 20, 21, 22, 27],
        },
      },
      {
        title: 'Step 4. 체인 적용 — loader 는 오른쪽 → 왼쪽으로 흐른다',
        desc: 'use: ["style-loader", "css-loader"] 처럼 배열을 적으면 — Webpack 은 오른쪽부터 적용한다. css-loader 가 먼저 .css 를 JS 모듈로 바꾸고, 그 결과를 style-loader 가 받아 런타임에 <style> 태그로 주입한다. 함수 합성처럼 f(g(x)) 로 흐른다. SCSS 라면 sass-loader → css-loader → style-loader (3개 체인), PostCSS 까지 넣으면 4개 체인이 된다. 순서가 잘못되면 변환 결과가 망가진다.',
        files: [
          { name: 'src/index.js', tag: 'JS', state: 'ok', detail: 'entry' },
          { name: 'src/button.css', tag: 'CSS', state: 'chained', detail: 'css → style' },
          { name: 'src/page.scss', tag: 'SCSS', state: 'chained', detail: 'sass → css → style' },
          { name: 'src/api.ts', tag: 'TS', state: 'loaded', detail: 'ts-loader' },
        ],
        rules: [
          { test: '/\\.css$/', use: ['style-loader', 'css-loader'], chain: 'right→left' },
          { test: '/\\.scss$/', use: ['style-loader', 'css-loader', 'sass-loader'], chain: 'sass→css→style' },
        ],
        flow: [
          { stage: '.scss 원본', kind: 'raw' },
          { stage: 'sass-loader → CSS 문자열', kind: 'step' },
          { stage: 'css-loader → JS 모듈', kind: 'step' },
          { stage: 'style-loader → <style> 주입', kind: 'final' },
        ],
        alert: { tone: 'warn', text: 'use 배열은 오른쪽부터 실행된다 — 순서를 바꾸면 망가진다.' },
        code: {
          lang: 'javascript',
          filename: 'webpack.config.js (scss 추가)',
          lines: [
            '// SCSS 를 추가하면 체인이 3개가 된다',
            'module: {',
            '  rules: [',
            '    {',
            '      test: /\\.scss$/,',
            '      use: [',
            '        "style-loader", // 3. 마지막 — <style> 주입',
            '        "css-loader",   // 2. CSS 를 JS 모듈로',
            '        "sass-loader",  // 1. 먼저 — SCSS → CSS',
            '      ],',
            '    },',
            '    {',
            '      test: /\\.css$/,',
            '      use: ["style-loader", "css-loader"],',
            '    },',
            '  ],',
            '},',
            '',
            '// 흐름 의사 코드 (오른쪽 → 왼쪽)',
            '//   raw .scss',
            '//     → sass-loader  ("scss" → "css")',
            '//     → css-loader   ("css"  → JS 모듈)',
            '//     → style-loader (런타임에 <style> 태그로 주입)',
            '',
            '// PostCSS 까지 넣으면 4개 체인',
            '//   use: ["style-loader","css-loader","postcss-loader","sass-loader"]',
            '',
            '// 순서를 뒤집으면 — css-loader 가 .scss 를 못 읽는다 = 에러',
          ],
          highlight: [4, 5, 6, 7, 8, 9, 10, 19, 20, 21, 22, 23, 28],
        },
      },
      {
        title: 'Step 5. 산출 확인 — 같은 import, 다른 결과물',
        desc: '같은 import "./button.css" 가 — 이제는 번들에 포함되어 페이지가 열리면 <style> 태그가 자동으로 head 에 들어간다. import logo from "./logo.png" 는 dist/ 에 emit 된 파일의 public URL 을 logo 변수에 담는다. .ts 는 JS 로 변환되어 그래프에 들어간다. 코드는 한 줄도 바꾸지 않았는데 — loader 등록만으로 모든 파일이 모듈이 됐다. 이게 Webpack 의 loader 가 주는 핵심 가치다.',
        files: [
          { name: 'dist/bundle.js', tag: 'JS', state: 'shipped', detail: 'CSS 인라인 포함' },
          { name: 'dist/logo.a1b2c3.png', tag: 'PNG', state: 'shipped', detail: 'emit 된 파일' },
          { name: 'dist/index.html', tag: 'HTML', state: 'shipped', detail: '런타임 <style>' },
        ],
        rules: [
          { test: '/\\.css$/', use: ['style-loader', 'css-loader'] },
          { test: '/\\.png$/', use: 'asset/resource' },
          { test: '/\\.ts$/', use: 'ts-loader' },
        ],
        wins: [
          'loader 가 비-JS 파일을 JS 모듈로 번역해 그래프에 합류시킨다',
          'use 배열은 오른쪽 → 왼쪽으로 흘러 함수 합성처럼 동작한다',
          'webpack 5 의 asset 모듈은 file/url/raw-loader 를 대체한다',
          'loader 등록만으로 import 문은 그대로 — 코드 수정이 없다',
        ],
        alert: { tone: 'good', text: 'loader = "이 형식을 JS 로 어떻게 바꿀까" 의 답.' },
        code: {
          lang: 'javascript',
          filename: 'dist/bundle.js (요약)',
          lines: [
            '// 번들 안의 css 모듈 (요약)',
            '"./src/button.css": (m, e, __webpack_require__) => {',
            '  // css-loader 가 만든 JS 모듈',
            '  const css = ".btn{background:#8DD6F9;padding:12px}";',
            '  // style-loader 가 런타임에 주입',
            '  const tag = document.createElement("style");',
            '  tag.textContent = css;',
            '  document.head.appendChild(tag);',
            '  m.exports = {};',
            '},',
            '',
            '// PNG 모듈 (asset/resource)',
            '"./src/logo.png": (m) => {',
            '  m.exports = __webpack_require__.p + "logo.a1b2c3.png";',
            '},',
            '',
            '// TS 모듈은 평범한 JS 로 컴파일되어 들어 있다',
            '"./src/api.ts": (m, e) => {',
            '  async function fetchUser(id) { /* … */ }',
            '  e.fetchUser = fetchUser;',
            '},',
            '',
            '// index.js 에서의 import 는 한 줄도 안 바뀌었다',
          ],
          highlight: [2, 3, 4, 5, 6, 7, 8, 12, 13, 14, 17, 18, 19, 20],
        },
      },
    ];

    function FilesPanel({ files }) {
      const STATE_STYLE = {
        ok:      { bg:'#bbf7d0', tx:'#166534', label:'OK' },
        unknown: { bg:'#e2e8f0', tx:'#475569', label:'??' },
        error:   { bg:'#fee2e2', tx:'#991b1b', label:'ERR' },
        loaded:  { bg:'#bce3f4', tx:'#0f4c75', label:'loaded' },
        chained: { bg:'#a5f3fc', tx:'#0e7490', label:'chained' },
        shipped: { bg:'#fef9c3', tx:'#854d0e', label:'shipped' },
      };
      const TAG_STYLE = {
        JS:   { bg:'#fef9c3', tx:'#854d0e' },
        CSS:  { bg:'#dbeafe', tx:'#1e40af' },
        PNG:  { bg:'#fae8ff', tx:'#86198f' },
        TS:   { bg:'#cffafe', tx:'#155e75' },
        SCSS: { bg:'#fce7f3', tx:'#9d174d' },
        HTML: { bg:'#ffedd5', tx:'#9a3412' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{background:BRAND, color:BRAND_DEEP}}>
            <span>🔧</span>
            <span>파일별 loader 상태</span>
          </div>
          <div className="p-3 space-y-2">
            {files.map((f, i) => {
              const s = STATE_STYLE[f.state] || STATE_STYLE.unknown;
              const t = TAG_STYLE[f.tag] || TAG_STYLE.JS;
              return (
                <div key={i} className="flex items-center gap-2 text-xs">
                  <span className="px-1.5 py-0.5 rounded font-mono w-12 text-center" style={{background:t.bg, color:t.tx}}>{f.tag}</span>
                  <span className="flex-1 font-mono truncate" style={{color:BRAND_DEEP}}>{f.name}</span>
                  <span className="text-[10px] text-slate-500 w-28 truncate">{f.detail}</span>
                  <span className="text-[10px] px-1.5 py-0.5 rounded font-bold w-16 text-center" style={{background:s.bg, color:s.tx}}>{s.label}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function RulesBox({ rules }) {
      if (!rules || rules.length === 0) return null;
      return (
        <div className="mt-3 rounded-lg p-3" style={{border:`1px solid ${BRAND}`, background:'#f0faff'}}>
          <div className="text-xs font-bold mb-2" style={{color:BRAND_DARK}}>📜 module.rules 등록 현황</div>
          <div className="space-y-1.5 text-[11px] font-mono">
            {rules.map((r, i) => (
              <div key={i} className="flex items-center gap-2" style={{color:BRAND_DEEP}}>
                <span className="px-1.5 py-0.5 rounded bg-white" style={{border:`1px solid ${BRAND}`}}>{r.test}</span>
                <span style={{color:BRAND_DARK}}>→</span>
                <span className="flex-1 truncate">{Array.isArray(r.use) ? r.use.join(' ← ') : r.use}</span>
                {r.chain && <span className="text-[10px] text-slate-500">{r.chain}</span>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FlowBox({ flow }) {
      if (!flow) return null;
      return (
        <div className="mt-3 rounded-lg p-3" style={{border:`1px solid ${BRAND}`, background:'#fff'}}>
          <div className="text-xs font-bold mb-2" style={{color:BRAND_DARK}}>🌀 loader 체인 흐름</div>
          <div className="space-y-1.5">
            {flow.map((f, i) => (
              <div key={i} className="flex items-center gap-2 text-[11px]">
                <span className="w-6 h-6 rounded-full font-bold flex items-center justify-center" style={{background: f.kind === 'final' ? '#bbf7d0' : f.kind === 'raw' ? '#fee2e2' : '#bce3f4', color: f.kind === 'final' ? '#166534' : f.kind === 'raw' ? '#991b1b' : '#0f4c75'}}>{i + 1}</span>
                <span className="font-mono" style={{color:BRAND_DEEP}}>{f.stage}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#eaf6fd'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🔧</span>
            <span className="text-lg font-bold" style={{color:BRAND_DEEP}}>loader 핵심 정리</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DEEP}}>
                <span style={{color:BRAND_DARK}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#eaf6fd', bd:'#bce3f4', tx:'#0f4c75', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:BRAND_DEEP}}>loader 등록과 파일 상태</h3>
            <span className="text-[10px] text-slate-500">5 단계</span>
          </div>
          <FilesPanel files={state.files} />
          <RulesBox rules={state.rules} />
          <FlowBox flow={state.flow} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(141,214,249,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#eaf6fd 0%,#cfeaf9 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg font-bold" style={{background:BRAND, color:BRAND_DEEP}}>WP</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DEEP}}>I-1-2. loader</h1>
                <p className="text-sm" style={{color:BRAND_DARK}}>비유: 공장의 변환 라인 — 다른 형식을 JS 모듈로 번역</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND_DARK}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#bce3f4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow" style={{background:BRAND, color:BRAND_DEEP}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND_DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND_DARK}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold" style={{background:BRAND, color:BRAND_DEEP}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND_DARK}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:BRAND_DARK}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                loader 는 "JS 가 아닌 형식을 모듈로 만드는 변환기" 다. test 정규식으로 매칭, use 배열은 오른쪽 → 왼쪽으로 흐른다. 다음 챕터에서 — Webpack 이 import 의 경로를 실제 파일로 찾아가는 module resolution 을 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Webpack', 'loader', 'css-loader', 'style-loader', 'ts-loader', 'asset-module'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#eaf6fd', color:BRAND_DEEP, border:`1px solid ${BRAND}`}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND_DARK}}>
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
