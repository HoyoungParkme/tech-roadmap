  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    PyTorch II-1-2 — 제어식 — nn.Module 서브클래싱
    학습 목표: Sequential이 "부품을 순서대로 통과"밖에 못 하던 한계(II-1-1)를 넘어,
              nn.Module 서브클래싱으로 (1) __init__에 부품을 선언하고 (2) forward에 데이터 흐름을
              파이썬 코드로 자유롭게 짜는 "모델의 정석 문법"을 익힌다. super().__init__() 계약,
              __setattr__ 후킹으로 인한 파라미터 자동 등록, 리스트 함정과 nn.ModuleList,
              작은 Module을 조립해 큰 Module을 만드는 블록 합성(ResNet BasicBlock)까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: __init__ 부품함/forward 흐름도 · skip connection 분기 · 모듈 트리) /
          우(VSCode CodeViewer: custom_module.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 2메서드 계약 → forward의 자유 → 부품 등록 → 모듈 합성 → 실무 스타일
    //   state.vis : 좌측 LiveDataPane 이 그릴 시각화 종류
    //               'contract'(init·forward 대응) | 'flow'(skip connection 분기)
    //               'register'(파라미터 등록/리스트 함정) | 'compose'(모듈 트리) | 'style'(실무 표)
    //   code      : 우측 CodeViewer 파일 (custom_module.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      contract: {lang:"python", filename:"custom_module.py (1/5 — 2메서드 계약)", lines:[
        "\"\"\"",
        "custom_module.py — Sequential 을 nn.Module 로 다시 쓰기",
        "__init__ 에 부품 선언, forward 에 데이터 흐름. 계약은 이 둘뿐.",
        "\"\"\"",
        "import torch",
        "import torch.nn as nn",
        "",
        "# ── (before) Sequential — 부품을 \"순서대로\" 늘어놓는 지름길 ──",
        "seq = nn.Sequential(",
        "    nn.Linear(784, 128),",
        "    nn.ReLU(),",
        "    nn.Linear(128, 10),",
        ")",
        "",
        "# ── (after) 같은 모델을 nn.Module 로 — 대응이 일대일 ──",
        "class MLP(nn.Module):",
        "    def __init__(self):",
        "        super().__init__()          # ← 이 한 줄을 잊지 마라",
        "        self.fc1 = nn.Linear(784, 128)   # 부품 선언",
        "        self.act = nn.ReLU()",
        "        self.fc2 = nn.Linear(128, 10)",
        "",
        "    def forward(self, x):           # 데이터 흐름",
        "        x = self.fc1(x)",
        "        x = self.act(x)",
        "        x = self.fc2(x)",
        "        return x",
        "",
        "model = MLP()",
        "out = model(torch.randn(4, 784))   # model(x) 로 호출 (forward 자동)",
        "print(out.shape)                   # torch.Size([4, 10])",
      ]},
      flow: {lang:"python", filename:"custom_module.py (2/5 — forward의 자유)", lines:[
        "\"\"\"",
        "custom_module.py — forward 는 그냥 파이썬 함수다",
        "분기·루프·다중 입력·잔차 연결 — Sequential 이 못 하던 것들.",
        "\"\"\"",
        "import torch",
        "import torch.nn as nn",
        "import torch.nn.functional as F",
        "",
        "class ResidualMLP(nn.Module):",
        "    def __init__(self, dim):",
        "        super().__init__()",
        "        self.block = nn.Sequential(",
        "            nn.Linear(dim, dim), nn.ReLU(),",
        "            nn.Linear(dim, dim),",
        "        )",
        "",
        "    def forward(self, x):",
        "        # ── skip connection: 입력을 건너뛰어 나중에 더한다 ──",
        "        out = self.block(x)",
        "        out = x + out          # ← 잔차 연결, Sequential 불가!",
        "        return F.relu(out)",
        "",
        "# forward 는 파이썬이라 분기·루프도 자유롭다",
        "class Flexible(nn.Module):",
        "    def __init__(self, dim):",
        "        super().__init__()",
        "        self.fc = nn.Linear(dim, dim)",
        "",
        "    def forward(self, x, use_relu=True, n_repeat=1):",
        "        for _ in range(n_repeat):     # 루프",
        "            x = self.fc(x)",
        "        if use_relu:                  # 분기",
        "            x = F.relu(x)",
        "        return x",
        "",
        "m = ResidualMLP(16)",

    const S1 = { title:"Step 1. 2메서드 계약 — __init__에 부품, forward에 흐름", desc:"nn.Module 서브클래싱은 딱 두 개의 메서드 계약으로 끝난다 — __init__에 \"쓸 부품\"을 선언하고, forward에 \"데이터가 부품을 어떻게 통과하는지\" 흐름을 적는다. II-1-1의 Sequential은 사실 이 둘을 자동으로 채워 주던 지름길이었다. 같은 2층 MLP를 nn.Module로 다시 쓰면, Sequential에 늘어놓던 순서가 forward 안의 호출 순서로 그대로 옮겨온다 — 대응 관계가 일대일이라 어렵지 않다. 딱 하나 반드시 지킬 규칙: __init__ 첫 줄에 super().__init__()를 호출해야 한다. 이걸 빠뜨리면 PyTorch가 부품·파라미터를 담을 내부 저장소를 초기화하지 못해 \"cannot assign module before Module.__init__() call\" 에러가 난다. 왜 지금 Sequential을 두고 굳이 이 문법을 배우냐면 — 다음 단계부터 Sequential이 절대 못 하는 것들이 forward의 자유에서 쏟아지기 때문이다." };
    const S2 = { title:"Step 2. forward의 자유 — 분기·루프·다중 입력이 그냥 파이썬", desc:"nn.Module이 Sequential을 압도하는 진짜 이유가 여기 있다 — forward는 그냥 파이썬 함수라서, if 분기·for 루프·여러 입력·중간값 재사용이 전부 된다. 대표 예가 skip connection(잔차 연결)이다: 블록을 통과한 결과에 입력 x를 그대로 더하는 out = x + block(x). Sequential은 \"부품을 순서대로 통과\"만 하므로 이렇게 입력을 건너뛰어 나중에 합치는 구조를 표현할 방법이 아예 없다. 그런데 forward에서는 단 세 줄이면 된다 — 값을 변수에 담아 두었다가(x) 나중에 더하면 그만이다. 이 한 줄의 덧셈이 ResNet을 가능하게 했고, 층을 100개 넘게 쌓아도 학습이 되게 만든 핵심이다(dl 파트의 ResNet에서 깊게 다룬다). 요점: 모델의 \"구조\"가 순차 나열을 벗어나는 순간, 답은 언제나 nn.Module의 forward다." };
    const S3 = { title:"Step 3. 부품 등록의 마법 — self.layer = ... 만으로 자동 등록", desc:"self.fc1 = nn.Linear(784,128) 한 줄이면, PyTorch가 그 층의 가중치·편향을 모델의 파라미터 목록에 알아서 등록한다 — 나중에 model.parameters()로 옵티마이저에 넘길 때 하나도 빠지지 않는다. 마법의 정체는 nn.Module이 __setattr__를 후킹해 두었기 때문이다: self.속성 = 모듈을 대입하는 순간 가로채 내부 _modules 딕셔너리에 등록한다. 그런데 여기 초보를 반드시 무너뜨리는 함정이 있다 — 층을 파이썬 리스트에 담으면(self.layers = [nn.Linear(...) for _ in ...]) 등록이 안 된다. 리스트는 그냥 리스트라 __setattr__ 후킹을 거치지 않기 때문이다. 그러면 model.parameters()에 안 잡혀 학습이 조용히 안 되고, .to(device)에도 안 딸려간다 — 에러도 안 나서 더 무섭다. 해결은 전용 컨테이너: 순서가 있으면 nn.ModuleList, 이름표가 필요하면 nn.ModuleDict를 쓴다. 이 둘은 담기는 순간 등록을 보장한다." };
    const S4 = { title:"Step 4. 모듈 합성 — 작은 Module을 조립해 큰 Module", desc:"nn.Module의 진짜 힘은 재귀 조립이다 — 작은 Module을 부품처럼 __init__에 담으면, 그 자체로 더 큰 Module이 된다. 실무 표준이 \"블록 패턴\"이다: 반복되는 구조(예: Conv→BN→ReLU→Conv→BN + skip)를 BasicBlock이라는 작은 Module로 한 번 정의하고, 큰 모델에서는 이 블록을 여러 개 쌓기만 한다. ResNet이 정확히 이 방식이다. 이렇게 하면 (1) 코드 중복이 사라지고 (2) 모델이 부품→블록→전체의 트리 구조로 깔끔하게 정리된다. 이 트리는 그냥 개념이 아니라 실제 객체 계층이다 — model.children()으로 바로 아래 자식들을, model.modules()로 트리 전체를 순회할 수 있고, model.apply(fn)로 모든 하위 모듈에 함수(예: 가중치 초기화)를 재귀 적용할 수 있다. print(model) 한 줄이면 이 트리가 들여쓰기로 그대로 보인다 — 큰 모델을 읽고 디버깅하는 첫걸음이다." };
    const S5 = { title:"Step 5. 실무 스타일 가이드 — 하이브리드 표준과 흔한 실수", desc:"실무 코드는 Sequential과 nn.Module을 대립시키지 않고 섞어 쓴다 — 전체 뼈대와 데이터 흐름은 nn.Module로 잡되, 그 안에서 \"순서대로 통과하는 부분 블록\"은 nn.Sequential로 짧게 묶는다. 이게 표준 하이브리드다: Sequential(부분 블록) in Module(전체 구조). 원칙은 딱 두 개로 기억하자 — __init__에는 \"상태\"(층·파라미터·설정)만 두고, forward에는 \"로직\"(흐름·분기·연산)만 둔다. forward 안에서 nn.Linear를 새로 만드는 건 매 호출마다 새 파라미터가 생겨 학습이 안 되는 대표 안티패턴이다. 마지막으로 가장 흔한 초보 실수: 절대 model.forward(x)로 직접 부르지 말고 model(x)로 불러라 — model(x)는 forward를 감싸며 hook·train/eval 모드 처리 같은 필수 로직을 함께 실행하지만, forward를 직접 부르면 이 처리가 통째로 건너뛰어져 조용한 버그가 된다. 여기까지가 \"모델을 만드는 법\"이다. 다음 장에서는 이렇게 만든 모델을 실제로 \"학습시키는 법\" — 손실 함수와 옵티마이저로 넘어간다." };

               caption:"model.forward(x) 로 부르면 감싸던 처리가 통째로 건너뛰어진다. 에러가 안 나서 조용한 버그가 된다.",
               changes:[{mark:"gone", text:"hook·모드 처리 건너뜀"},
                        {mark:"read", text:"다음 장: 손실 함수·옵티마이저"}] },
        actor:"🎯 하이브리드 표준 · model(x) vs model.forward(x)",
        engine:"style",
        vis:"style",
        engineDetail:"Sequential in Module · __init__=상태/forward=로직 · model(x)",
        styleRows:[
          {"rule":"Sequential in Module","good":"부분 블록은 Sequential, 전체는 Module","bad":"모든 걸 Sequential 하나로 욱여넣기","tone":"good"},
          {"rule":"__init__ = 상태","good":"층·파라미터·설정만 선언","bad":"forward 안에서 nn.Linear 새로 생성","tone":"warn"},
          {"rule":"forward = 로직","good":"흐름·분기·연산만","bad":"__init__ 에 데이터 흐름 로직","tone":"good"},
          {"rule":"호출은 model(x)","good":"hook·train/eval 함께 실행","bad":"model.forward(x) 직접 호출","tone":"bad"},
        ],
        alert:{"tone":"danger","text":"절대 model.forward(x) 를 직접 부르지 마라 — model(x)는 forward 를 감싸며 hook·train/eval 모드 처리를 함께 실행한다. 직접 부르면 그 처리가 통째로 건너뛰어져 \"조용한\" 버그가 된다."},
        code:{...CODE.style, highlight:[30,31,32,33,34]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — Sequential ↔ nn.Module 2메서드 대응 다이어그램
    // ─────────────────────────────────────────────────────
    function ContractBox() {
      const parts = ['Linear(784,128)', 'ReLU()', 'Linear(128,10)'];
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">📐 같은 모델, 두 가지 표현 — 대응은 일대일</div>
          <div className="flex items-stretch gap-2">
            {/* Sequential */}
            <div className="flex-1 rounded-lg border-2 border-sky-300 bg-sky-50 p-2">
              <div className="text-[11px] font-bold text-sky-800 mb-1.5">📎 Sequential (지름길)</div>
              {parts.map((p) => (
                <div key={p} className="mb-1 rounded border border-sky-300 bg-white px-2 py-1 text-[10px] font-mono text-slate-800 text-center">{p}</div>
              ))}
              <div className="text-[9px] text-sky-700 mt-1">부품을 순서대로 나열</div>
            </div>
            <div className="flex items-center text-orange-500 text-lg font-bold">≡</div>
            {/* nn.Module */}
            <div className="flex-[1.3] rounded-lg border-2 border-orange-400 bg-orange-50 p-2">
              <div className="text-[11px] font-bold text-orange-800 mb-1.5">🔥 nn.Module (정석)</div>
              <div className="rounded border border-orange-300 bg-white px-2 py-1 mb-1">
                <div className="text-[9px] font-bold text-orange-700">__init__ — 부품함</div>
                <div className="text-[9px] font-mono text-slate-700 leading-4">self.fc1 = Linear(784,128)<br/>self.act = ReLU()<br/>self.fc2 = Linear(128,10)</div>
              </div>
              <div className="rounded border border-orange-300 bg-white px-2 py-1">
                <div className="text-[9px] font-bold text-orange-700">forward — 흐름</div>
                <div className="text-[9px] font-mono text-slate-700 leading-4">x = fc1(x) → act(x) → fc2(x)</div>
              </div>
            </div>
          </div>
          <div className="mt-2 rounded border-2 border-red-300 bg-red-50 px-2 py-1.5">
            <div className="text-[10px] font-bold text-red-800">🚨 super().__init__() 필수</div>
            <div className="text-[9px] text-red-900 font-mono mt-0.5">잊으면 → cannot assign module before Module.__init__() call</div>
          </div>
        </div>
      );

    // ─────────────────────────────────────────────────────
    // Step 2 — skip connection 분기 다이어그램 (애니메이션)
    // ─────────────────────────────────────────────────────
    function FlowBox() {
      const [phase, setPhase] = useState(0); // 0:입력 1:분기 2:block 3:합류
      useEffect(() => {
        const t = setInterval(() => setPhase((p) => (p + 1) % 4), 900);
        return () => clearInterval(t);
      }, []);
      const on = (n) => phase >= n;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-3">🌿 skip connection — 입력을 건너뛰어 나중에 더한다</div>
          <div className="flex items-center justify-between gap-1">
            {/* x */}
            <div className={`rounded-lg border-2 px-2.5 py-2 text-center transition ${on(0) ? 'border-orange-500 bg-orange-100' : 'border-slate-300 bg-slate-50'}`}>
              <div className="text-[11px] font-mono font-bold text-orange-900">x</div>
              <div className="text-[8px] text-orange-700">입력</div>
            </div>
            <div className={`text-lg transition ${on(1) ? 'text-orange-600' : 'text-slate-300'}`}>→</div>
            {/* block */}
            <div className={`rounded-lg border-2 px-2.5 py-2 text-center transition ${on(2) ? 'border-orange-500 bg-orange-50' : 'border-slate-300 bg-slate-50'}`}>
              <div className="text-[10px] font-mono font-bold text-slate-800">block(x)</div>
              <div className="text-[8px] text-slate-500">Linear→ReLU→Linear</div>
            </div>
            <div className={`text-lg transition ${on(3) ? 'text-emerald-600' : 'text-slate-300'}`}>→</div>
            {/* + */}
            <div className={`rounded-full border-2 w-9 h-9 flex items-center justify-center transition ${on(3) ? 'border-emerald-500 bg-emerald-100' : 'border-slate-300 bg-slate-50'}`}>
              <span className="text-emerald-700 font-bold text-base">+</span>
            </div>
            <div className={`text-lg transition ${on(3) ? 'text-emerald-600' : 'text-slate-300'}`}>→</div>
            {/* out */}
            <div className={`rounded-lg border-2 px-2.5 py-2 text-center transition ${on(3) ? 'border-emerald-500 bg-emerald-50' : 'border-slate-300 bg-slate-50'}`}>
              <div className="text-[11px] font-mono font-bold text-emerald-900">out</div>
              <div className="text-[8px] text-emerald-700">x + block(x)</div>
            </div>
          </div>
          {/* skip arc 표시 */}
          <div className={`mt-2 flex items-center gap-1 text-[10px] transition ${on(1) ? 'text-orange-800' : 'text-slate-400'}`}>
            <span className="font-mono font-bold">⤵ skip</span>
            <span>x 를 변수에 담아 두었다가 마지막에 그대로 더한다 — block 을 건너뛰는 지름길</span>
          </div>
          <div className="mt-2 rounded border-2 border-slate-300 bg-slate-50 p-2">
            <div className="text-[10px] font-bold text-slate-700 mb-1">📎 Sequential 로는?</div>
            <div className="text-[9px] text-red-700">불가능 — 순서대로 "통과"만 하므로 입력을 건너뛰어 합칠 방법이 없다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 부품 등록 / 리스트 함정 다이어그램
    // ─────────────────────────────────────────────────────
    function RegisterBox() {
      const Card = ({ ok, title, code, params, note, tone }) => (
        <div className={`flex-1 rounded-lg border-2 p-2 ${ok ? 'border-emerald-400 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
          <div className={`text-[11px] font-bold mb-1 ${ok ? 'text-emerald-800' : 'text-red-800'}`}>{ok ? '✅' : '✗'} {title}</div>
          <div className="rounded border border-slate-300 bg-white px-1.5 py-1 text-[9px] font-mono text-slate-800 leading-4">{code}</div>
          <div className="mt-1 flex items-center gap-1 text-[10px]">
            <span className="text-slate-600">parameters():</span>
            <span className={`font-mono font-bold ${ok ? 'text-emerald-700' : 'text-red-700'}`}>{params}</span>
          </div>
          <div className={`text-[9px] mt-0.5 ${ok ? 'text-emerald-700' : 'text-red-700'}`}>{note}</div>
        </div>
      );
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">📦 self.x = Module → __setattr__ 후킹 → _modules 등록</div>
          <div className="rounded border border-orange-200 bg-orange-50 px-2 py-1 text-[9px] text-orange-900 mb-2 font-mono">
            self.fc = nn.Linear(...)  →  가로채기  →  _modules["fc"] 에 등록 → parameters() 에 포함
          </div>
          <div className="flex gap-2">
            <Card ok={false} title="list 에 담으면" code={'self.layers = [ Linear(8,8) ... ]'} params="0 개" note="후킹 안 거침 → 학습 조용히 실패, .to(device) 누락" tone="bad" />
            <Card ok={true} title="ModuleList 로" code={'self.layers = nn.ModuleList([...])'} params="6 개" note="담기는 순간 등록 보장 (순서: List / 이름표: Dict)" tone="good" />
          </div>
          <div className="mt-2 text-[10px] text-orange-900">왜 무섭나 — <span className="font-bold">에러가 안 난다</span>. parameters() 가 비어 옵티마이저가 아무것도 갱신하지 못할 뿐.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 모듈 트리 계층도
    // ─────────────────────────────────────────────────────
    function ComposeBox() {
      const Node = ({ label, sub, tone, indent }) => (
        <div style={{ marginLeft: indent * 16 + 'px' }} className={`mb-1 rounded border-2 px-2 py-1 flex items-center gap-2 ${tone}`}>
          <span className="text-[10px] font-mono font-bold text-slate-800">{label}</span>
          {sub && <span className="text-[9px] text-slate-500">{sub}</span>}

        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">

          <Node label="TinyResNet" sub="큰 Module" tone="border-orange-500 bg-orange-100" indent={0} />
          <Node label="├ stem: Conv2d" sub="부품" tone="border-orange-300 bg-orange-50" indent={1} />
          <Node label="└ blocks: ModuleList" sub="블록 컨테이너" tone="border-orange-400 bg-orange-50" indent={1} />
          <Node label="├ BasicBlock #0" sub="작은 Module" tone="border-sky-300 bg-sky-50" indent={2} />
          <Node label="│  ├ conv1 · conv2" sub="부품 + skip" tone="border-slate-300 bg-slate-50" indent={3} />
          <Node label="├ BasicBlock #1" sub="같은 구조 재사용" tone="border-sky-300 bg-sky-50" indent={2} />
          <Node label="└ BasicBlock #2" sub="쌓기만 하면 됨" tone="border-sky-300 bg-sky-50" indent={2} />
          <div className="mt-2 flex flex-wrap gap-1.5">
            {[['children()', '바로 아래 자식'], ['modules()', '트리 전체 순회'], ['apply(fn)', '재귀 적용(초기화)'], ['print(model)', '트리 확인']].map(([f, d]) => (
              <span key={f} className="px-1.5 py-0.5 rounded bg-orange-100 border border-orange-200 text-[9px] text-orange-900"><span className="font-mono font-bold">{f}</span> {d}</span>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 스타일 표
    // ─────────────────────────────────────────────────────
    const STYLE_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
    function StyleBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🎯 실무 스타일 — 하이브리드 표준과 원칙</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-orange-900 border-b-2 border-orange-200">
                <th className="text-left py-1">원칙</th>
                <th className="text-left py-1 pl-1">✅ 이렇게</th>
                <th className="text-left py-1 pl-1">✗ 하지 마라</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.rule} className="border-t border-orange-100 align-top">
                  <td className={`py-1 font-bold ${STYLE_TONE[r.tone]}`}>{r.rule}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.good}</td>
                  <td className="py-1 pl-1 text-red-700">{r.bad}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 rounded border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-2">
            <div className="text-[10px] font-bold text-orange-900 mb-1">📎 Sequential(부분 블록) in Module(전체 구조)</div>
            <div className="text-[9px] font-mono text-slate-700 leading-4">self.features = nn.Sequential(Conv, ReLU, Pool)  # 부분<br/>def forward(x): x = self.features(x); ... # 전체 흐름</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — nn.Module 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      contract: { icon: '📐', label: '2메서드 계약' },
      flow:     { icon: '🌿', label: 'forward의 자유' },
      register: { icon: '📦', label: '부품 등록' },
      compose:  { icon: '🌳', label: '모듈 합성' },
      style:    { icon: '🎯', label: '실무 스타일' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.contract;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>nn.Module — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'contract' && <ContractBox />}
          {state.vis === 'flow' && <FlowBox />}
          {state.vis === 'register' && <RegisterBox />}
          {state.vis === 'compose' && <ComposeBox />}
          {state.vis === 'style' && <StyleBox rows={state.styleRows} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <span className="inline-block text-[10px] font-bold text-orange-700 bg-orange-100 border border-orange-200 rounded px-1.5 py-0.5 mb-1">Part II · 모델 만들기</span>
                <h1 className="text-2xl font-bold text-orange-900">II-1-2. 제어식 — nn.Module 서브클래싱</h1>
                <p className="text-sm text-orange-800/80">__init__에 부품을, forward에 흐름을 — PyTorch 모델의 정석 문법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                nn.Module 서브클래싱은 두 메서드 계약이다 — <span className="font-mono">__init__</span>에 부품(상태)을,
                <span className="font-mono">forward</span>에 데이터 흐름(로직)을 적는다(<span className="font-mono">super().__init__()</span> 필수).
                forward는 그냥 파이썬이라 분기·루프·skip connection(<span className="font-mono">x + block(x)</span>)이 자유롭고 — 이게 Sequential이 못 하던 것이다.
                <span className="font-mono">self.x = Module</span>은 <span className="font-mono">__setattr__</span> 후킹으로 자동 등록되지만 리스트에 담으면 누락되니 <span className="font-mono">nn.ModuleList/ModuleDict</span>를 쓰고,
                작은 Module을 조립해 블록→전체 트리를 만든다. 호출은 언제나 <span className="font-mono">model(x)</span>.
                다음 장에서는 이렇게 만든 모델을 실제로 학습시키는 손실 함수·옵티마이저로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['nn.Module', '__init__', 'forward', 'super().__init__', 'skip connection', '__setattr__', 'nn.ModuleList', 'nn.ModuleDict', 'BasicBlock', 'children', 'apply', 'model(x)'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./II-1-1.html" className="underline hover:no-underline">← 이전: II-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
