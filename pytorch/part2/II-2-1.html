    @media (min-width: 768px) {

  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    PyTorch II-2-1 — 손실·옵티마이저 — 3박자 리듬
    학습 목표: 신경망 학습 루프의 심장인 세 줄 — optimizer.zero_grad() → loss.backward() → optimizer.step() —
              이 세 박자의 "순서"가 왜 전부인지 체험한다. 손실 함수와 마지막 층의 궁합(CrossEntropyLoss 내부 softmax),
              옵티마이저가 파라미터 "참조"를 들고 있다는 사실, 한 박자를 빼먹으면 생기는 증상(grad 누적 폭주·갱신 없음),
              순서 실수의 미묘한 버그, 그리고 스케줄러·클리핑·파라미터 그룹까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 손실·층 궁합표 · 옵티마이저 참조 · 3박자 리듬 다이어그램 · 결함 시뮬레이션 · 확장 리듬) /
          우(VSCode CodeViewer: loss_optim.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 손실 고르기 → 옵티마이저 연결 → 3박자 해부 → 순서 실수 → 확장 리듬
    //   state.vis : 좌측 LiveDataPane 이 그릴 시각화 종류
    //               'match'(손실·층 궁합표) | 'optim'(옵티마이저 참조)
    //               'rhythm'(3박자 리듬 + 결함 시뮬) | 'mistake'(순서 실수) | 'extend'(확장 리듬)
    //   code      : 우측 CodeViewer 파일 (loss_optim.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 손실 함수 고르기 — 마지막 층과의 "궁합"이 먼저다',
        desc: '학습의 방향을 정하는 건 손실 함수다. 그런데 초보가 가장 자주 데는 함정은 손실 함수 자체가 아니라 "마지막 층과의 궁합"이다. PyTorch의 nn.CrossEntropyLoss는 내부에 softmax(정확히는 log_softmax)를 이미 품고 있다 — 그래서 모델의 마지막 층은 softmax를 씌우지 않은 raw logits를 그대로 넘겨야 한다. 여기에 실수로 softmax를 한 번 더 씌우면 "이중 softmax"가 되어 학습이 느려지거나 이상해진다. TensorFlow의 from_logits=True와 정확히 같은 이슈다. 회귀엔 MSELoss, 이진 분류엔 BCEWithLogitsLoss(역시 내부에 sigmoid 포함)를 쓰는 이유도 같은 원리 — 수치적으로 안정적이라 로그와 지수를 한 번에 처리하기 때문이다.',
        actor: '🎯 손실 함수 ↔ 마지막 층의 궁합',
        engine: 'match',
        vis: 'match',
        engineDetail: 'CrossEntropyLoss(softmax 내장) · MSELoss · BCEWithLogitsLoss',
        matchRows: [
          { loss: 'nn.CrossEntropyLoss', last: 'raw logits (softmax ✗)', task: '다중 분류', note: '내부에 log_softmax 포함 — softmax 두 번 금지', tone: 'warn' },
          { loss: 'nn.BCEWithLogitsLoss', last: 'raw logits (sigmoid ✗)', task: '이진/멀티라벨', note: '내부에 sigmoid 포함 — 수치 안정', tone: 'warn' },
          { loss: 'nn.BCELoss', last: 'sigmoid 통과 (0~1)', task: '이진', note: '직접 sigmoid 필요 — 불안정할 수 있음', tone: 'bad' },
          { loss: 'nn.MSELoss', last: '선형 출력 그대로', task: '회귀', note: '연속값 예측 — 활성화 없이', tone: 'good' },
          { loss: 'nn.NLLLoss', last: 'log_softmax 통과', task: '다중 분류', note: 'CrossEntropy = log_softmax + NLLLoss', tone: 'good' },
        ],
        alert: { tone: 'warn', text: 'nn.CrossEntropyLoss 는 내부에 softmax 를 이미 품고 있다. 마지막 층에 softmax 를 또 씌우면 "이중 softmax" — 학습이 느려진다. TF 의 from_logits=True 와 같은 이슈. logits 를 그대로 넘겨라.' },
        code: {
          lang: 'python',
          filename: 'loss_optim.py (1/5 — 손실·층 궁합)',
          lines: [

                <th className="text-left py-1 pl-1">마지막 층 출력</th>
                <th className="text-left py-1 pl-1 w-16">용도</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.loss} className="border-t border-orange-100">
                  <td className="py-1 font-mono font-bold text-orange-800">{r.loss}</td>
                  <td className={`py-1 pl-1 font-bold ${MATCH_TONE[r.tone]}`}>{r.last}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.task}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 rounded border-2 border-amber-300 bg-amber-50 p-2">
            <div className="text-[10px] font-bold text-amber-900 mb-1">⚠️ 이중 softmax 함정</div>
            <div className="flex items-center justify-center gap-1.5 text-[10px] font-mono">
              <span className="px-1.5 py-0.5 rounded bg-orange-200 text-orange-800">logits</span>
              <span className="text-amber-600">→</span>
              <span className="px-1.5 py-0.5 rounded bg-red-200 text-red-800">softmax(내가)</span>
              <span className="text-amber-600">→</span>
              <span className="px-1.5 py-0.5 rounded bg-red-200 text-red-800">softmax(손실 내부)</span>
            </div>
            <div className="mt-1 text-[9px] text-amber-900 text-center">= 기울기가 뭉개져 학습이 느려짐. TF 의 from_logits=True 와 같은 이슈.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 옵티마이저 참조 다이어그램 (Step 2)
    // ─────────────────────────────────────────────────────
    function OptimBox() {
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🔌 옵티마이저는 파라미터의 "참조"를 들고 있다</div>
          <div className="flex items-center gap-2">
            <div className="flex-1 rounded-lg border-2 border-sky-300 bg-sky-50 px-2 py-2 text-center">
              <div className="text-[11px] font-bold text-sky-800">optimizer</div>
              <div className="text-[9px] text-slate-500 font-mono">Adam</div>
              <div className="text-[9px] text-slate-500 font-mono">param_groups</div>
            </div>
            <div className="text-center text-orange-600">
              <div className="text-lg">⟶</div>
              <div className="text-[9px] font-mono font-bold">참조(is)</div>
            </div>
            <div className="flex-1 rounded-lg border-2 border-orange-400 bg-orange-50 px-2 py-2 text-center">
              <div className="text-[11px] font-bold text-orange-800">model.parameters()</div>
              <div className="text-[9px] text-slate-500 font-mono">weight · bias</div>
              <div className="text-[9px] text-slate-500 font-mono">.grad ⬅ backward</div>
            </div>
          </div>
          <div className="mt-3 grid grid-cols-3 gap-1.5 text-center">
            <div className="rounded border border-orange-200 bg-orange-50 px-1 py-1.5">
              <div className="text-[9px] font-bold text-orange-900">backward()</div>
              <div className="text-[8px] text-slate-600">.grad 채움</div>
            </div>
            <div className="rounded border border-emerald-300 bg-emerald-50 px-1 py-1.5">
              <div className="text-[9px] font-bold text-emerald-900">step()</div>
              <div className="text-[8px] text-slate-600">참조 따라 갱신</div>
            </div>
            <div className="rounded border border-orange-200 bg-orange-50 px-1 py-1.5">
              <div className="text-[9px] font-bold text-orange-900">param_groups</div>
              <div className="text-[8px] text-slate-600">lr 그룹 보관</div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">
            <span className="font-mono font-bold">optimizer.param_groups[0]["params"][0] is model.weight</span> 는 <span className="font-mono">True</span> — 복사본이 아니라 그 텐서 자체다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 3박자 리듬 + 결함 시뮬레이션 (Step 3) — 인터랙티브
    // ─────────────────────────────────────────────────────
    function RhythmBox() {
      // mode: 'full'(정상) | 'no_zero'(zero_grad 누락) | 'no_step'(step 누락)
      const [mode, setMode] = useState('full');

      // 간단한 시뮬: 각 반복의 grad·param 상태를 mode 에 따라 다르게
      const SIM = {
        full:    { grad: [0.8, 0.6, 0.45, 0.34], param: [1.0, 0.92, 0.86, 0.81], loss: [1.0, 0.7, 0.49, 0.34], label: '정상 — grad 는 매번 초기화, param 갱신, loss 감소', tone: 'good' },
        no_zero: { grad: [0.8, 1.6, 2.4, 3.2],  param: [1.0, 0.84, 0.60, 0.28], loss: [1.0, 1.4, 2.9, 8.1], label: 'zero_grad 누락 — grad 누적(+=) 폭주 → loss 발산 → NaN', tone: 'bad' },
        no_step: { grad: [0.8, 0.8, 0.8, 0.8],  param: [1.0, 1.0, 1.0, 1.0],   loss: [1.0, 1.0, 1.0, 1.0], label: 'step 누락 — grad 는 계산되나 param 그대로 → loss 정체', tone: 'bad' },
      };
      const sim = SIM[mode];
      const Beat = ({ n, name, active }) => (
        <div className={`flex-1 rounded-lg border-2 px-1 py-2 text-center ${active ? 'border-orange-500 bg-orange-100' : 'border-slate-300 bg-slate-50 opacity-40'}`}>
          <div className="text-[10px] font-bold text-orange-900">박자 {n}</div>
          <div className="text-[9px] font-mono text-slate-700">{name}</div>
        </div>
      );
      const beat1 = mode !== 'no_zero';
      const beat3 = mode !== 'no_step';

      const Bars = ({ vals, color, cap }) => (
        <div>
          <div className="text-[9px] text-slate-600 mb-0.5">{cap}</div>
          <div className="flex items-end gap-1 h-10">
            {vals.map((v, i) => (
              <div key={i} className="flex-1 flex flex-col justify-end">
                <div className={`${color} rounded-t`} style={{ height: `${Math.min(100, v / (mode === 'no_zero' ? 8.1 : 1.0) * 100)}%` }}></div>
              </div>
            ))}
          </div>
        </div>
      );

      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🥁 3박자 리듬 — 사이클이 돈다</div>
          <div className="flex items-center gap-1">
            <Beat n="①" name="zero_grad" active={beat1} />
            <div className="text-orange-500 text-sm">→</div>
            <Beat n="②" name="backward" active={true} />
            <div className="text-orange-500 text-sm">→</div>
            <Beat n="③" name="step" active={beat3} />
            <div className="text-orange-500 text-sm">↻</div>
          </div>

          <div className="mt-3 flex gap-1.5">
            {[['full', '정상'], ['no_zero', 'zero_grad 빼기'], ['no_step', 'step 빼기']].map(([m, lbl]) => (
              <button
                key={m}
                onClick={() => setMode(m)}
                className={`flex-1 px-1 py-1 text-[10px] rounded border-2 font-bold ${mode === m ? 'border-orange-500 bg-orange-500 text-white' : 'border-orange-300 bg-white text-orange-800'}`}
              >{lbl}</button>
            ))}
          </div>

          <div className="mt-3 grid grid-cols-3 gap-2">
            <Bars vals={sim.grad} color="bg-amber-400" cap="grad 크기" />
            <Bars vals={sim.param} color="bg-orange-400" cap="param 변화" />
            <Bars vals={sim.loss} color={sim.tone === 'good' ? 'bg-emerald-400' : 'bg-red-400'} cap="loss (반복→)" />
          </div>

          <div className={`mt-2 rounded border-2 p-2 text-[10px] font-bold ${sim.tone === 'good' ? 'border-emerald-300 bg-emerald-50 text-emerald-900' : 'border-red-300 bg-red-50 text-red-900'}`}>
            {sim.tone === 'good' ? '✅ ' : '💥 '}{sim.label}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 순서 실수 표 (Step 4)
    // ─────────────────────────────────────────────────────
    function MistakeBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🚫 순서 실수 — 에러 없이 조용히 망가진다</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-orange-900 border-b-2 border-orange-200">
                <th className="text-left py-1 w-6"></th>
                <th className="text-left py-1">순서 패턴</th>
                <th className="text-left py-1 pl-1">증상</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.pattern} className="border-t border-orange-100">
                  <td className="py-1 text-center">{r.ok ? '✅' : '❌'}</td>
                  <td className={`py-1 font-mono font-bold ${r.ok ? 'text-emerald-700' : 'text-red-700'}`}>{r.pattern}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.symptom}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 rounded border-2 border-emerald-400 bg-emerald-50 p-2">
            <div className="text-[10px] font-bold text-emerald-900 mb-1">✅ 표준 뼈대 (손가락에 붙여라)</div>
            <div className="flex items-center justify-center gap-1 text-[10px] font-mono flex-wrap">
              <span className="px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-900">zero_grad</span>
              <span className="text-emerald-600">→</span>
              <span className="px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-900">forward/loss</span>
              <span className="text-emerald-600">→</span>
              <span className="px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-900">backward</span>
              <span className="text-emerald-600">→</span>
              <span className="px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-900">step</span>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 확장 리듬 표 (Step 5)
    // ─────────────────────────────────────────────────────
    const EXTEND_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
    function ExtendBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🎼 확장 리듬 — 규칙은 "삽입 위치"</div>
          {/* 위치 다이어그램 */}
          <div className="rounded border border-orange-200 bg-orange-50 p-2 mb-2">
            <div className="flex items-center justify-center gap-1 text-[9px] font-mono flex-wrap">
              <span className="px-1 py-0.5 rounded bg-orange-200 text-orange-900">zero_grad</span>
              <span className="text-orange-500">→</span>
              <span className="px-1 py-0.5 rounded bg-orange-200 text-orange-900">backward</span>
              <span className="text-red-500">→</span>
              <span className="px-1 py-0.5 rounded bg-amber-300 text-amber-900 font-bold">clip_grad_norm_</span>
              <span className="text-red-500">→</span>
              <span className="px-1 py-0.5 rounded bg-emerald-200 text-emerald-900">step</span>
            </div>
            <div className="text-[8px] text-center text-slate-600 mt-1">↑ 클리핑은 backward 와 step "사이"에만 효과가 있다</div>
          </div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-orange-900 border-b-2 border-orange-200">
                <th className="text-left py-1">장치</th>
                <th className="text-left py-1 pl-1">삽입 위치</th>
                <th className="text-left py-1 pl-1">이유</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.item} className="border-t border-orange-100">
                  <td className="py-1 font-mono font-bold text-orange-800">{r.item}</td>
                  <td className={`py-1 pl-1 font-bold ${EXTEND_TONE[r.tone]}`}>{r.where}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.why}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 text-[10px] text-orange-900">
            <span className="font-mono font-bold">scheduler.step()</span> ≠ <span className="font-mono">optimizer.step()</span> — 앞은 lr, 뒤는 파라미터. 다음 장(완전한 학습 루프)으로 이어진다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 손실·옵티마이저 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      match:   { icon: '🎯', label: '손실·층 궁합' },
      optim:   { icon: '🔌', label: '옵티마이저 연결' },
      rhythm:  { icon: '🥁', label: '3박자 리듬' },
      mistake: { icon: '🚫', label: '순서 실수' },
      extend:  { icon: '🎼', label: '확장 리듬' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.match;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>학습 루프 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'match' && <MatchBox rows={state.matchRows} />}
          {state.vis === 'optim' && <OptimBox />}
          {state.vis === 'rhythm' && <RhythmBox />}
          {state.vis === 'mistake' && <MistakeBox rows={state.mistakeRows} />}
          {state.vis === 'extend' && <ExtendBox rows={state.extendRows} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">II-2-1. 손실·옵티마이저 — 3박자 리듬</h1>
                <p className="text-sm text-orange-800/80">zero_grad → backward → step — 이 세 줄의 순서가 학습의 전부다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                신경망 학습의 심장은 세 박자다 — <span className="font-mono">optimizer.zero_grad()</span>(autograd 는 누적하니 먼저 지운다) →
                <span className="font-mono">loss.backward()</span>(기울기 계산) → <span className="font-mono">optimizer.step()</span>(참조 따라 갱신).
                손실 함수는 마지막 층과의 궁합(CrossEntropyLoss 는 softmax 내장 — logits 그대로)이 먼저고, 옵티마이저는 파라미터의 참조를 들고 있어 step 만으로 갱신한다.
                순서가 틀리면 에러 없이 조용히 망가지니 표준 뼈대를 손가락에 붙이고, 스케줄러(에폭 끝)·클리핑(backward~step 사이)·파라미터 그룹으로 확장한다.
                다음 장에서는 이 리듬에 데이터로더·검증·체크포인트를 더해 완전한 학습 루프를 완성한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['CrossEntropyLoss', 'from_logits', 'BCEWithLogitsLoss', 'MSELoss', 'optim.Adam', 'param_groups', 'zero_grad', 'backward', 'step', 'clip_grad_norm_', 'scheduler'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
