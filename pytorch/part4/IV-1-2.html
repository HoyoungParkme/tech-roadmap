  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    PyTorch IV-1-2 — 전이학습 — torchvision 동결·미세조정
    학습 목표: dl II-2-2(전이학습 이론)의 PyTorch 실전판. ImageNet에서 미리 학습한 ResNet 백본을
              가져와 (1) 마지막 fc만 갈아끼우는 특징추출과 (2) layer4부터 해동하는 미세조정으로,
              CIFAR 직접 학습 74% → 전이학습 92% 의 점프를 코드 열 줄로 재현한다.
              weights 신문법, requires_grad 동결, weights.transforms() 공식 전처리, 판별적 lr,
              2단계 학습 스케줄, timm 백본 동물원까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: ResNet 층 스택 동결/해동 · fc 교체 수술 · 3곡선 비교 · 파라미터 게이지) /
          우(VSCode CodeViewer: transfer_pytorch.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 백본 가져오기 → 특징 추출(동결) → 입력 규격 → 미세조정(해동) → 실무 확장
    //   state.vis : 좌측 LiveDataPane 이 그릴 시각화 종류
    //               'backbone'(층 스택+fc 확인) | 'freeze'(동결·fc 교체+게이지)
    //               'transform'(전처리 규격+불일치 폭락) | 'finetune'(해동+판별적 lr+3곡선) | 'ecosystem'(timm/도메인갭)
    //   code      : 우측 CodeViewer 파일 (transfer_pytorch.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"python", filename:"transfer_pytorch.py (1/5 — 백본 로드)", lines:[
        "\"\"\"",
        "transfer_pytorch.py — torchvision 백본으로 전이학습",
        "Step 1: ImageNet 사전학습 ResNet50 을 가져와 구조를 확인한다.",
        "\"\"\"",
        "import torch",
        "import torch.nn as nn",
        "from torchvision import models",
        "from torchvision.models import ResNet50_Weights",
        "",
        "# 신문법: weights= 열거형 (예전 pretrained=True 는 폐지 예정)",
        "weights = ResNet50_Weights.IMAGENET1K_V2   # V2 가 V1 보다 정확",
        "model = models.resnet50(weights=weights)",
        "",
        "# 층 구조 훑어보기 — 이름과 순서를 눈으로 확인",
        "for name, child in model.named_children():",
        "    print(name)",
        "    # conv1 / bn1 / relu / maxpool",
        "    # layer1 / layer2 / layer3 / layer4  (잔차 블록)",
        "    # avgpool / fc",
        "",
        "# 맨 끝 fc 확인 — ImageNet 1000 클래스용 출력이다",
        "print(model.fc)",
        "# Linear(in_features=2048, out_features=1000, bias=True)",
        "print(model.fc.in_features)   # 2048  (교체할 때 이 숫자가 필요)",
        "",
        "# 파라미터 총량 — 2500만 개를 \"이미 학습된 상태\"로 받는다",
        "total = sum(p.numel() for p in model.parameters())",
        "print(f\"{total:,} params\")    # 25,557,032 params",
      ]},
      s2: {lang:"python", filename:"transfer_pytorch.py (2/5 — 특징 추출)", lines:[
        "\"\"\"",
        "transfer_pytorch.py — Step 2: 백본 동결 + 분류기 교체",
        "백본은 얼리고(feature extractor), 새 fc 만 학습한다.",
        "\"\"\"",
        "import torch.nn as nn",
        "import torch.optim as optim",
        "",
        "# 1) 백본 전체 동결 — 모든 파라미터의 미분 추적을 끈다",
        "for p in model.parameters():",
        "    p.requires_grad = False",
        "",
        "# 2) 마지막 fc 를 우리 클래스 수(CIFAR=10)로 교체",
        "#    새 층은 기본 requires_grad=True → 이 층만 학습된다",
        "num_classes = 10",
        "model.fc = nn.Linear(model.fc.in_features, num_classes)",
        "",
        "# 3) 동결 확인 — 학습 대상 파라미터를 센다",
        "def count_trainable(m):",

    const S2 = { title:"Step 2. 특징 추출 모드 — 백본은 얼리고, 새 머리만 학습한다", desc:"가장 빠르고 안전한 전이 전략이 특징 추출(feature extraction)이다. 백본의 conv 층들은 이미 \"선·질감·눈·바퀴\" 같은 범용 특징을 볼 줄 알기 때문에, 그대로 얼려(freeze) 두고 마지막 분류기만 우리 클래스 수에 맞게 새로 학습한다. for p in model.parameters(): p.requires_grad=False 로 전체를 동결한 뒤, model.fc = nn.Linear(2048, 10) 으로 교체하면 새 fc 는 기본값 requires_grad=True 라 그 층만 학습된다. 실무의 함정은 옵티마이저다 — optim.Adam(model.parameters())로 넘기면 얼린 것까지 대상에 들어가니, 반드시 requires_grad=True 인 것만 걸러 넘겨야 한다. 아래 게이지처럼 학습 대상 파라미터가 2500만 → 2만으로 줄어, 적은 데이터로도 과적합 없이 빠르게 수렴한다." };

    const S4 = { title:"Step 4. 미세조정 전환 — layer4부터 해동, 낮은 lr로 살살 깨운다", desc:"특징 추출로 머리를 안정시킨 뒤, 마지막 한 방이 미세조정(fine-tuning)이다. 뒤쪽 층(layer4)은 \"고양이 귀·개 코\" 같은 상위 특징을 담당하는데, 우리 도메인에 맞게 살짝 다시 조율하면 성능이 한 계단 더 오른다. 핵심은 두 가지다. (1) 판별적 학습률(discriminative lr) — 파라미터 그룹으로 나눠(II-2-1 연결) 새 fc 는 크게(1e-3), 해동한 layer4 는 아주 작게(1e-5) 준다. 백본은 이미 좋으니 큰 lr 로 흔들면 애써 배운 특징이 망가진다. (2) 2단계 스케줄 — 먼저 head 만 몇 에폭 학습해 fc 를 안정시키고(1단계=특징추출), 그다음 layer4 를 해동해 함께 미세조정한다(2단계). 처음부터 전체를 풀면 초기 랜덤 fc 의 큰 그래디언트가 백본으로 역류해 망가지기 때문이다. 아래 3곡선처럼 직접 학습 74% → 특징추출 88% → 미세조정 92% 로 IV-1-1 대비 점프한다." };

    // ─────────────────────────────────────────────────────
    // ResNet 층 스택 — 동결(🔒)/해동(🔥) 상태 + fc 교체 수술 (Step 1·2·4)
    //   mode: 'plain'(전부 pretrained) | 'freeze'(백본 잠금+fc 교체)
    //         | 'finetune'(layer4 해동)
    // ─────────────────────────────────────────────────────
    function LayerStack({ mode }) {
      // 각 층: {name, role, frozen, isHead}
      const frozenBackbone = mode !== 'plain';
      const layer4Hot = mode === 'finetune';
      const layers = [
        { name: 'conv1 · bn1', role: '가장자리 · 색', frozen: frozenBackbone, hot: false },
        { name: 'layer1', role: '선 · 질감', frozen: frozenBackbone, hot: false },
        { name: 'layer2', role: '무늬 · 조각', frozen: frozenBackbone, hot: false },
        { name: 'layer3', role: '부품 (눈·바퀴)', frozen: frozenBackbone, hot: false },
        { name: 'layer4', role: '상위 특징 (귀·코)', frozen: frozenBackbone && !layer4Hot, hot: layer4Hot },
        { name: 'avgpool', role: '2048차원 특징', frozen: frozenBackbone, hot: false },
      ];
      const head = mode === 'plain'
        ? { name: 'fc', role: 'out=1000 (ImageNet)', tone: 'plain' }
        : { name: 'fc (교체됨)', role: 'out=10 (CIFAR)', tone: 'new' };

      const rowCls = (l) => {
        if (l.hot) return 'border-orange-500 bg-orange-100';
        if (l.frozen) return 'border-sky-300 bg-sky-50';
        return 'border-slate-300 bg-white';
      };
      const icon = (l) => (l.hot ? '🔥' : l.frozen ? '🔒' : '⚪');

      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">
            🏗️ ResNet50 층 스택 {mode === 'plain' ? '— 통째로 사전학습' : mode === 'freeze' ? '— 백본 동결 + fc 교체' : '— layer4 해동 미세조정'}
          </div>
          <div className="space-y-1">
            {layers.map((l) => (
              <div key={l.name} className={`flex items-center gap-2 rounded border-2 px-2 py-1 ${rowCls(l)}`}>
                <span className="text-sm w-5 text-center">{icon(l)}</span>
                <span className="text-[11px] font-mono font-bold text-slate-800 w-24">{l.name}</span>
                <span className="text-[10px] text-slate-600 flex-1">{l.role}</span>
                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${l.hot ? 'bg-orange-200 text-orange-800' : l.frozen ? 'bg-sky-200 text-sky-800' : 'bg-slate-200 text-slate-600'}`}>
                  {l.hot ? '학습' : l.frozen ? '동결' : '유지'}
                </span>
              </div>
            ))}
            {/* fc — 교체 수술 부위 */}
            <div className={`flex items-center gap-2 rounded border-2 px-2 py-1 ${head.tone === 'new' ? 'border-emerald-500 bg-emerald-50' : 'border-slate-400 bg-slate-100'} border-dashed`}>
              <span className="text-sm w-5 text-center">{head.tone === 'new' ? '🔧' : '⚪'}</span>
              <span className="text-[11px] font-mono font-bold text-slate-800 w-24">{head.name}</span>
              <span className="text-[10px] text-slate-600 flex-1">{head.role}</span>
              <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${head.tone === 'new' ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                {head.tone === 'new' ? '학습' : '1000'}
              </span>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">
            {mode === 'plain'
              ? '입력에 가까운 층은 범용 특징, 끝의 fc 는 ImageNet 1000 클래스 전용 — 우리 문제와 개수가 안 맞는다.'
              : mode === 'freeze'
              ? '🔒 백본은 얼리고 🔧 fc 만 우리 클래스(10)로 교체 — 새 fc 만 학습된다.'
              : '🔥 layer4 를 해동해 상위 특징을 우리 도메인에 맞게 미세조정. 앞쪽 범용 층은 여전히 동결.'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 파라미터 카운트 게이지 — 학습 대상 vs 동결 (Step 2)
    // ─────────────────────────────────────────────────────
    function ParamGauge({ trainable, frozen, label }) {
      const total = trainable + frozen;
      const pct = (trainable / total) * 100;
      const fmt = (n) => n.toLocaleString();
      return (
        <div className="mt-3 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">📊 학습 대상 파라미터 — 2555만 → {fmt(trainable)}</div>
          <div className="h-6 w-full rounded-full bg-sky-100 overflow-hidden flex border border-sky-200">
            <div className="h-full bg-emerald-500 flex items-center justify-center" style={{ width: `${Math.max(pct, 2)}%` }}>
              <span className="text-[9px] font-bold text-white whitespace-nowrap px-1">학습</span>
            </div>
            <div className="h-full flex-1 flex items-center justify-center">
              <span className="text-[9px] font-bold text-sky-700">🔒 동결 (백본)</span>
            </div>
          </div>
          <div className="mt-2 flex justify-between text-[10px]">
            <span className="text-emerald-700 font-bold">🟢 학습 {fmt(trainable)} ({pct.toFixed(2)}%)</span>
            <span className="text-sky-700 font-bold">🔒 동결 {fmt(frozen)}</span>
          </div>
          <div className="mt-1 text-[10px] text-orange-900">{label}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 전처리 규격 파이프라인 + 불일치 성능 폭락 (Step 3)
    // ─────────────────────────────────────────────────────
    function TransformBox() {
      const Stage = ({ label, sub }) => (
        <div className="flex-1 rounded border-2 border-orange-300 bg-orange-50 px-1.5 py-2 text-center">
          <div className="text-[10px] font-bold text-orange-900">{label}</div>
          <div className="text-[9px] text-slate-600 font-mono mt-0.5">{sub}</div>
        </div>
      );
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧼 백본 공식 전처리 — weights.transforms()</div>
            <div className="flex items-center gap-1">
              <Stage label="원본" sub="32×32" />
              <span className="text-orange-500 font-bold">→</span>
              <Stage label="Resize" sub="232→224" />
              <span className="text-orange-500 font-bold">→</span>
              <Stage label="정규화" sub="ImageNet μ/σ" />
              <span className="text-orange-500 font-bold">→</span>
              <Stage label="백본 입력" sub="3×224×224" />
            </div>
            <div className="mt-2 text-[9px] font-mono text-slate-600 text-center">
              mean=[0.485, 0.456, 0.406] · std=[0.229, 0.224, 0.225]
            </div>
          </div>
          {/* 불일치 폭락 */}
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">💥 전처리 불일치 시 — 에러 없이 정확도만 폭락</div>
            <div className="flex items-center gap-2">
              <div className="flex-1 text-center">
                <div className="text-[10px] text-emerald-700 font-bold">규격 일치</div>
                <div className="h-16 flex items-end justify-center">
                  <div className="w-10 bg-emerald-500 rounded-t" style={{ height: '100%' }}></div>
                </div>
                <div className="text-[11px] font-bold text-emerald-700">92%</div>
              </div>
              <span className="text-red-500 text-xl font-bold">▶</span>
              <div className="flex-1 text-center">
                <div className="text-[10px] text-red-700 font-bold">규격 불일치</div>
                <div className="h-16 flex items-end justify-center">
                  <div className="w-10 bg-red-400 rounded-t" style={{ height: '58%' }}></div>
                </div>
                <div className="text-[11px] font-bold text-red-700">54%</div>
              </div>
            </div>
            <div className="mt-1 text-[10px] text-red-900 text-center">백본이 "처음 보는 눈금"을 만나면 92% → 54% — 숫자를 손으로 적지 마라.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 판별적 lr 파라미터 그룹 + 3곡선 비교 (Step 4)
    // ─────────────────────────────────────────────────────
    function FinetuneBox() {
      // 3곡선: 직접학습 / 특징추출 / 미세조정 — 에폭별 정확도(%)
      const curves = [
        { name: '직접 학습 (IV-1-1)', color: '#94a3b8', pts: [30, 48, 58, 65, 70, 74], tone: 'text-slate-600' },
        { name: '특징 추출', color: '#38bdf8', pts: [72, 80, 84, 86, 87, 88], tone: 'text-sky-600' },
        { name: '미세조정', color: '#f97316', pts: [78, 85, 89, 90, 91, 92], tone: 'text-orange-600' },
      ];
      const W = 260, H = 96, pad = 6;
      const x = (i) => pad + (i / 5) * (W - 2 * pad);
      const y = (v) => H - pad - ((v - 20) / 80) * (H - 2 * pad);
      return (
        <div className="mt-1 space-y-3">
          {/* 판별적 lr */}
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🎚️ 판별적 학습률 — 파라미터 그룹별 lr</div>
            <div className="space-y-1.5">
              <div className="flex items-center gap-2 rounded border-2 border-emerald-400 bg-emerald-50 px-2 py-1">
                <span className="text-sm">🔧</span>
                <span className="text-[11px] font-mono font-bold text-slate-800 flex-1">model.fc (새 머리)</span>
                <span className="text-[11px] font-mono font-bold text-emerald-700">lr = 1e-3</span>
                <span className="text-[9px] text-emerald-700">크게</span>
              </div>
              <div className="flex items-center gap-2 rounded border-2 border-orange-400 bg-orange-50 px-2 py-1">
                <span className="text-sm">🔥</span>
                <span className="text-[11px] font-mono font-bold text-slate-800 flex-1">model.layer4 (해동)</span>
                <span className="text-[11px] font-mono font-bold text-orange-700">lr = 1e-5</span>
                <span className="text-[9px] text-orange-700">살살</span>
              </div>
              <div className="flex items-center gap-2 rounded border-2 border-sky-300 bg-sky-50 px-2 py-1">
                <span className="text-sm">🔒</span>
                <span className="text-[11px] font-mono font-bold text-slate-800 flex-1">layer1~3 (동결)</span>
                <span className="text-[11px] font-mono font-bold text-sky-700">lr = 0</span>
                <span className="text-[9px] text-sky-700">고정</span>
              </div>
            </div>
            <div className="mt-1.5 text-[10px] text-orange-900">백본은 이미 좋다 — 해동층 lr 은 head 의 1/100. 크게 흔들면 배운 특징이 망가진다.</div>
          </div>
          {/* 3곡선 비교 */}
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-1">📈 세 전략의 정확도 — 전이학습의 점프</div>
            <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 120 }}>
              {[40, 60, 80].map((v) => (
                <line key={v} x1={pad} y1={y(v)} x2={W - pad} y2={y(v)} stroke="#e5c9a8" strokeWidth="0.5" strokeDasharray="2 2" />
              ))}
              {curves.map((c) => (
                <polyline key={c.name} fill="none" stroke={c.color} strokeWidth="2"
                  points={c.pts.map((v, i) => `${x(i)},${y(v)}`).join(' ')} />
              ))}
              {curves.map((c) => (
                <g key={c.name + 'end'}>
                  <circle cx={x(5)} cy={y(c.pts[5])} r="3" fill={c.color} />
                  <text x={x(5) - 4} y={y(c.pts[5]) - 5} fontSize="8" fill={c.color} textAnchor="end" fontWeight="bold">{c.pts[5]}%</text>
                </g>
              ))}
            </svg>
            <div className="mt-1 flex flex-wrap gap-x-3 gap-y-0.5 text-[10px]">
              {curves.map((c) => (
                <span key={c.name} className={`font-bold ${c.tone}`}>■ {c.name}</span>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // timm 백본 동물원 + 도메인 갭 전략 표 (Step 5)
    // ─────────────────────────────────────────────────────
    const ROW_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
    function EcosystemBox({ zooRows, gapRows }) {
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🦁 timm 백본 동물원 — timm.create_model(...)</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-200">
                  <th className="text-left py-1">model 이름</th>
                  <th className="text-left py-1 pl-1">계열</th>
                  <th className="text-left py-1 pl-1">특징</th>
                </tr>
              </thead>
              <tbody>
                {zooRows.map((r) => (
                  <tr key={r.fn} className="border-t border-orange-100">
                    <td className="py-1 font-mono font-bold text-orange-800">{r.fn}</td>
                    <td className={`py-1 pl-1 font-bold ${ROW_TONE[r.tone]}`}>{r.kind}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🩻 도메인 갭 — 얼마나 풀지의 기준</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-300">
                  <th className="text-left py-1">ImageNet 과의 갭</th>
                  <th className="text-left py-1 pl-1">해동 전략</th>
                </tr>
              </thead>
              <tbody>
                {gapRows.map((r) => (
                  <tr key={r.gap} className="border-t border-orange-200">
                    <td className={`py-1 font-bold ${ROW_TONE[r.tone]}`}>{r.gap}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.strat}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[10px] text-orange-900">갭이 클수록 더 많이 풀고, 데이터가 적을수록 덜 푼다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 전이학습 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      backbone:  { icon: '📦', label: '백본 로드' },
      freeze:    { icon: '🔒', label: '특징 추출' },
      transform: { icon: '🧼', label: '입력 규격' },
      finetune:  { icon: '🔥', label: '미세조정' },
      ecosystem: { icon: '🦁', label: '실무 확장' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.backbone;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>전이학습 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'backbone' && <LayerStack mode="plain" />}
          {state.vis === 'freeze' && (
            <>
              <LayerStack mode="freeze" />
              <ParamGauge trainable={20490} frozen={25536542} label="fc 만 학습 대상(2만) — 적은 데이터로도 과적합 없이 빠르게 수렴한다." />
            </>
          )}
          {state.vis === 'transform' && <TransformBox />}
          {state.vis === 'finetune' && (
            <>
              <LayerStack mode="finetune" />
              <FinetuneBox />
            </>
          )}
          {state.vis === 'ecosystem' && <EcosystemBox zooRows={state.zooRows} gapRows={state.gapRows} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-orange-200 text-orange-800 mb-1">Part IV · 실전 프로젝트</span>
                <h1 className="text-2xl font-bold text-orange-900">IV-1-2. 전이학습 — torchvision 동결·미세조정</h1>
                <p className="text-sm text-orange-800/80">CIFAR 직접 학습 74% → ResNet 전이학습 92% — 코드 열 줄의 점프</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                전이학습은 "처음부터"를 버리고 ImageNet 백본의 눈을 빌리는 것이다 —
                <span className="font-mono">resnet50(weights=...)</span> 로 백본을 받고,
                <span className="font-mono">requires_grad=False</span> 로 얼린 뒤 <span className="font-mono">fc</span> 만 교체하면 특징추출(88%),
                <span className="font-mono">weights.transforms()</span> 로 입력 규격을 맞추고 <span className="font-mono">layer4</span> 를 해동해 판별적 lr 로 미세조정하면 92%.
                직접 학습(74%) 대비 코드 열 줄로 한 계단 점프했다. 실무에선 timm 백본 동물원과 도메인 갭 판단, 추론 시 <span className="font-mono">eval()+no_grad()</span> 를 챙긴다.
                다음 장에서는 이 학습 루프를 손으로 짜지 않게 해 주는 PyTorch Lightning 을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['transfer learning', 'resnet50', 'weights=', 'requires_grad', 'freeze', 'model.fc', 'transforms()', 'fine-tuning', 'layer4', 'discriminative lr', 'timm', 'eval', 'no_grad'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./IV-1-1.html" className="underline hover:no-underline">← 이전: IV-1-1 (CNN 분류기)</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
