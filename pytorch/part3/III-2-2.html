  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    PyTorch III-2-2 — 학습 모니터링 — TensorBoard·조기 종료
    학습 목표: 밤새 돌린 학습이 잘 가고 있는지, print 로그로는 절대 알 수 없다.
              (1) tqdm 진행바로 살아있음을 확인하고,
              (2) TensorBoard(SummaryWriter·add_scalar)로 loss/acc 곡선을 눈으로 보고 실험을 비교하고,
              (3) add_histogram/add_image 로 "숫자는 정상인데 분포가 이상한" 병을 잡고,
              (4) EarlyStopping 클래스로 과적합 직전에 멈추고 best 가중치를 복원하고,
              (5) 실험 이름 규칙·W&B/MLflow 로 팀 단위 실험 관리까지 5단계로 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: TensorBoard 계기판 모형 · patience 카운터 · 실험 비교) /
          우(VSCode CodeViewer: monitoring.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — print 한계 → TensorBoard → 더 깊은 기록 → 조기 종료 → 실무 체계
    //   state.vis  : 좌측 LiveDataPane 이 그릴 시각화 종류
    //                'print'(스크롤 로그 vs 진행바) | 'tb'(스칼라 계기판·실험 비교)
    //                'deep'(히스토그램·이미지·그래프) | 'earlystop'(patience 카운터) | 'ops'(실무 체계)
    //   code       : 우측 CodeViewer 파일 (monitoring.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      print: {lang:'python', filename:'monitoring.py (1/5 — tqdm 진행바)', lines:[
        '"""',
        'monitoring.py — 학습을 "눈으로" 보기',
        '1단계: print 의 한계를 tqdm 진행바로 먼저 메운다.',
        '"""',
        'import torch',
        'from tqdm import tqdm   # pip install tqdm',
        '',
        '# ❌ print 만 쓰는 루프 — 수천 줄이 스크롤로 흘러간다',
        'def train_naive(model, loader, optimizer, loss_fn):',
        '    for epoch in range(50):',
        '        for x, y in loader:',
        '            optimizer.zero_grad()',
        '            loss = loss_fn(model(x), y)',
        '            loss.backward()',
        '            optimizer.step()',
        '            print(loss.item())   # 0.83 0.81 0.79 ... 추세가 안 보인다',
        '',
        '# ✅ tqdm 으로 감싸면 한 줄이 살아 움직인다',
        'def train_tqdm(model, loader, optimizer, loss_fn):',
        '    for epoch in range(50):',
        '        # 진행바에 epoch 라벨을 붙인다',
        '        pbar = tqdm(loader, desc=f"epoch {epoch}", leave=False)',
        '        for x, y in pbar:',
        '            optimizer.zero_grad()',
        '            loss = loss_fn(model(x), y)',
        '            loss.backward()',
        '            optimizer.step()',
        '            # 스크롤 대신 진행바 오른쪽에 최신 loss 만 갱신',
        '            pbar.set_postfix(loss=f"{loss.item():.4f}")',
        '        # epoch 60%|██████    | 300/500 [00:12<00:08, loss=0.7912]',
        '',
        '# 진행바로 "살아있나"는 알 수 있다. 하지만 추세·비교는 여전히 불가.',
        '# → 다음 단계: TensorBoard 로 곡선을 그린다.',
      ]},
      tb: {lang:'python', filename:'monitoring.py (2/5 — TensorBoard 연결)', lines:[
        '"""',
        'monitoring.py — TensorBoard 로 loss/acc 를 곡선으로 본다',
        'pip install tensorboard  →  tensorboard --logdir runs',
        '"""',
        'import torch',
        'from torch.utils.tensorboard import SummaryWriter',
        '',
        '# 1) 실험마다 log_dir 을 따로 — run 디렉토리가 곧 실험 하나',
        'run_name = "exp_lr0.001_bs64"',
        'writer = SummaryWriter(log_dir=f"runs/{run_name}")',
        '',
        'def train(model, train_loader, val_loader, optimizer, loss_fn):',
        '    for epoch in range(50):',
        '        # ── 학습 ──────────────────────────────',
        '        model.train()',
        '        train_loss = 0.0',
        '        for x, y in train_loader:',
        '            optimizer.zero_grad()',
        '            loss = loss_fn(model(x), y)',
        '            loss.backward()',

    function PrintBox({ tick }) {

      const base = 0.90;

    function LineChart({ series, tick }) {
      // series: [{ color, label, fn(x)->y }]  x:0..1
      const W = 240, H = 90, pad = 6;
      const n = 24;
      const xs = Array.from({ length: n }, (_, i) => i / (n - 1));
      const toPt = (x, y) => {
        const px = pad + x * (W - 2 * pad);
        const py = pad + (1 - y) * (H - 2 * pad);
        return `${px.toFixed(1)},${py.toFixed(1)}`;
      };
      const grow = Math.min(1, tick / 12); // 곡선이 자라나는 애니메이션
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-24 bg-[#20242c] rounded">
          {[0.25, 0.5, 0.75].map((g) => (
            <line key={g} x1={pad} x2={W - pad} y1={pad + g * (H - 2 * pad)} y2={pad + g * (H - 2 * pad)} stroke="#3a4150" strokeWidth="0.5" />
          ))}
          {series.map((s, si) => {
            const pts = xs.filter((x) => x <= grow).map((x) => toPt(x, s.fn(x))).join(' ');
            return <polyline key={si} points={pts} fill="none" stroke={s.color} strokeWidth="1.6" />;
          })}
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 조기 종료 patience 카운터 시뮬레이션
    // ─────────────────────────────────────────────────────
    // val_loss 궤적: 내려가다 8 epoch부터 다시 상승 → patience=3 이면 11에서 정지
    const ES_TRACE = [0.90, 0.72, 0.60, 0.52, 0.47, 0.44, 0.42, 0.415, 0.43, 0.45, 0.47, 0.50];
    function EarlyStopBox({ tick }) {
      const patience = 3;
      const epoch = tick % (ES_TRACE.length + 2); // 끝나면 잠깐 멈춤
      const e = Math.min(epoch, ES_TRACE.length - 1);
      // best/counter 재계산
      let best = Infinity, counter = 0, bestEpoch = 0, stopped = false, stopEpoch = -1;
      for (let i = 0; i <= e; i++) {
        if (ES_TRACE[i] < best - 1e-4) { best = ES_TRACE[i]; counter = 0; bestEpoch = i; }
        else { counter++; if (counter >= patience && !stopped) { stopped = true; stopEpoch = i; } }
      }
      const max = 0.95, min = 0.38;
      const norm = (v) => (1 - (v - min) / (max - min));
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-xs font-bold text-orange-900">🛑 val_loss 궤적 & patience</div>
              <span className="text-[10px] font-mono text-slate-500">epoch {e}</span>
            </div>
            {/* 막대 궤적 */}
            <div className="flex items-end gap-1 h-20">
              {ES_TRACE.map((v, i) => {
                const shown = i <= e;
                const isBest = i === bestEpoch;
                const isStop = i === stopEpoch;
                return (
                  <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
                    <div
                      className={`w-full rounded-t transition-all ${!shown ? 'bg-slate-100' : isStop ? 'bg-red-500' : isBest ? 'bg-emerald-500' : v > best ? 'bg-amber-400' : 'bg-orange-400'}`}
                      style={{ height: shown ? (norm(v) * 100) + '%' : '4%' }}
                    ></div>
                    <span className="text-[8px] text-slate-400 mt-0.5">{i}</span>
                  </div>
                );
              })}
            </div>
            <div className="mt-1.5 flex gap-2 text-[9px]">
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500 inline-block"></span>best (val 최저)</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-amber-400 inline-block"></span>개선 없음</span>
              <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-red-500 inline-block"></span>정지</span>
            </div>
          </div>
          {/* 카운터 상태 */}
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2">
              <div className="text-[9px] text-emerald-700">best_loss</div>
              <div className="text-sm font-bold font-mono text-emerald-900">{best.toFixed(3)}</div>
              <div className="text-[8px] text-emerald-600">@epoch {bestEpoch}</div>
            </div>
            <div className={`rounded-lg border-2 p-2 ${counter >= patience ? 'border-red-400 bg-red-50' : counter > 0 ? 'border-amber-300 bg-amber-50' : 'border-slate-300 bg-slate-50'}`}>
              <div className="text-[9px] text-slate-600">counter</div>
              <div className="text-sm font-bold font-mono text-slate-900">{counter} / {patience}</div>
              <div className="text-[8px] text-slate-500">patience</div>
            </div>
            <div className={`rounded-lg border-2 p-2 ${stopped ? 'border-red-400 bg-red-50' : 'border-slate-300 bg-slate-50'}`}>
              <div className="text-[9px] text-slate-600">상태</div>
              <div className={`text-sm font-bold ${stopped ? 'text-red-700' : 'text-emerald-700'}`}>{stopped ? '🛑 STOP' : '▶ 진행'}</div>
              <div className="text-[8px] text-slate-500">{stopped ? 'best 복원' : 'training'}</div>
            </div>
          </div>
          <div className="text-[10px] text-orange-900 bg-orange-50 border border-orange-200 rounded p-2">
            8 epoch부터 val 이 반등(과적합). counter 가 patience(3)에 닿는 순간 멈추고, <span className="font-mono font-bold">epoch {bestEpoch}</span>의 가중치를 복원한다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 체계 (이름 규칙 + 도구 지도)
    // ─────────────────────────────────────────────────────
    function OpsBox() {
      const parts = [
        { seg: '20240806', label: '날짜', color: 'bg-slate-200 text-slate-700' },
        { seg: 'resnet18', label: '모델', color: 'bg-orange-200 text-orange-800' },
        { seg: 'lr0.001', label: '학습률', color: 'bg-emerald-200 text-emerald-800' },
        { seg: 'bs64', label: '배치', color: 'bg-sky-200 text-sky-800' },
        { seg: 'augFlip', label: '증강', color: 'bg-violet-200 text-violet-800' },
      ];
      const tools = [
        { name: 'TensorBoard', scope: '로컬 · 무료', line: 'writer.add_scalar(...)', tone: 'border-orange-300 bg-orange-50' },
        { name: 'Weights & Biases', scope: '클라우드 · 팀', line: 'wandb.log({"loss": vl})', tone: 'border-sky-300 bg-sky-50' },
        { name: 'MLflow', scope: '셀프호스팅 · 팀', line: 'mlflow.log_metric("loss", vl)', tone: 'border-emerald-300 bg-emerald-50' },
      ];
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧭 실험 이름 규칙 — 하이퍼파라미터 인코딩</div>
            <div className="flex flex-wrap items-center gap-1 font-mono text-[11px]">
              {parts.map((p, i) => (
                <React.Fragment key={p.seg}>
                  <span className={`px-1.5 py-0.5 rounded font-bold ${p.color}`}>{p.seg}</span>
                  {i < parts.length - 1 && <span className="text-slate-400">_</span>}
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 flex flex-wrap gap-2 text-[9px]">
              {parts.map((p) => (
                <span key={p.seg} className="text-slate-500"><span className="font-mono">{p.seg}</span> = {p.label}</span>
              ))}
            </div>
            <div className="mt-1.5 text-[10px] text-orange-900">폴더 이름만 봐도 "그 실험이 뭐였는지" 즉시 복원된다.</div>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🗺️ 실험 관리 도구 지도 (mlops 연결)</div>
            <div className="space-y-1.5">
              {tools.map((t) => (
                <div key={t.name} className={`flex items-center gap-2 rounded border-2 ${t.tone} px-2 py-1.5`}>
                  <span className="text-[11px] font-bold text-slate-800 w-32">{t.name}</span>
                  <span className="text-[9px] text-slate-500 w-24">{t.scope}</span>
                  <span className="text-[10px] font-mono text-slate-700 flex-1 truncate">{t.line}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-500 bg-orange-100 p-3 text-center">
            <div className="text-sm font-bold text-orange-900">🎲 "모니터링 없는 장기 학습은 도박이다"</div>
            <div className="text-[10px] text-orange-800 mt-1">계기판을 켜 두면 밤새 도는 학습이 언제 꺾이는지 아침에 곡선 한 장으로 안다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모니터링 계기판 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      print:     { icon: '📜', label: 'print 한계 · tqdm' },
      tb:        { icon: '📊', label: 'TensorBoard' },
      deep:      { icon: '📈', label: '분포·이미지·구조' },
      earlystop: { icon: '🛑', label: '조기 종료' },
      ops:       { icon: '🧭', label: '실무 체계' },
    };

    function LiveDataPane({ beat, state, tick }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.print;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>학습 계기판 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'print' && <PrintBox tick={tick} />}
          {state.vis === 'tb' && <TensorBoardBox tick={tick} />}
          {state.vis === 'deep' && <DeepBox tick={tick} />}
          {state.vis === 'earlystop' && <EarlyStopBox tick={tick} />}
          {state.vis === 'ops' && <OpsBox />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [tick, setTick] = useState(0);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      // 좌측 시각화 애니메이션용 tick (계기판이 살아 움직이게)
      useEffect(() => {
        const t = setInterval(() => setTick((v) => v + 1), 700);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <span className="text-[11px] font-bold text-orange-600 tracking-wide">PyTorch · Part Ⅲ 학습 루프</span>
                <h1 className="text-2xl font-bold text-orange-900">III-2-2. 학습 모니터링 — TensorBoard·조기 종료</h1>
                <p className="text-sm text-orange-800/80">밤새 돌린 학습이 잘 가고 있는지 — 숫자 로그 대신 눈으로 보는 계기판</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} tick={tick} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 계기판은 실시간 갱신</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                print(loss)는 "지금 숫자"만 줄 뿐 추세·비교·이상 감지를 못 한다. 그래서 —
                (1) <span className="font-mono">tqdm</span>으로 살아있음을 확인하고,
                (2) <span className="font-mono">SummaryWriter.add_scalar</span>로 train/val 곡선을 겹쳐 그려 과적합 시작점을 잡고,
                (3) <span className="font-mono">add_histogram/add_image</span>로 "숫자는 정상인데 분포가 이상한" 병(죽은 뉴런·기울기 폭주)을 찾고,
                (4) <span className="font-mono">EarlyStopping</span>으로 과적합 직전에 멈춰 best 가중치를 복원하고,
                (5) 실험 이름 규칙과 W&B/MLflow로 팀 단위 실험을 관리한다.
                모니터링 없는 장기 학습은 도박이다 — 다음 Part Ⅳ에서는 이 계기판을 켠 채 실전 모델을 굴린다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['tqdm', 'SummaryWriter', 'add_scalar', 'add_histogram', 'add_image', 'add_graph', 'tensorboard', 'EarlyStopping', 'patience', 'best_state', 'wandb', 'mlflow'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">다음: Part Ⅳ 실전 모델링 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
