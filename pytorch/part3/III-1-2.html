  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    PyTorch III-1-2 — transforms·증강 파이프라인
    학습 목표: Dataset 과 모델 사이에 놓이는 "변환 조립 라인"을 손에 쥔다.
              (1) transforms 는 __getitem__ 안에서 꺼낼 때마다 실행되는 함수이고 Compose 로 체인을 만든다
              (2) ToTensor/Normalize 가 왜 필수인지(0~255→0~1, HWC→CHW, ImageNet 통계 궁합)
              (3) 증강은 매 에폭 다른 변형을 만들고 train/val 은 파이프라인을 분리해야 한다
              (4) v2 API 와 변환 위치(CPU 워커 vs GPU 배치) 성능 감각
              (5) 분류 표준 레시피·커스텀 변환·역정규화 디버깅까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 조립 라인 · 정규화 분포 이동 · 에폭별 증강 그리드 · train/val 분리) /
          우(VSCode CodeViewer: transforms_pipeline.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 변환의 자리 → ToTensor/Normalize → 증강 → v2·성능 → 실무 레시피
    //   state.vis  : 좌측 LiveDataPane 이 그릴 시각화 종류
    //                'compose'(조립 라인) | 'normalize'(분포 이동) | 'augment'(에폭 그리드)
    //                'v2perf'(CPU 워커 vs GPU 배치) | 'recipe'(레시피·역정규화)
    //   code       : 우측 CodeViewer 파일 (transforms_pipeline.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. transforms의 자리 — Dataset과 모델 사이의 조립 라인',
        desc: 'transforms 는 별도의 전처리 스크립트가 아니라, Dataset.__getitem__ 이 샘플 하나를 꺼낼 때마다 그 자리에서 호출되는 "변환 함수"다. 그래서 원본 이미지 파일은 디스크에 그대로 두고, 배치를 뽑을 때마다 즉석에서 PIL 이미지를 텐서로 바꿔 모델에 넣는다 — 원본을 미리 통째로 변환해 저장할 필요가 없다는 게 핵심 이점이다. 여러 변환을 순서대로 엮을 때는 transforms.Compose([...]) 로 체인을 조립하는데, 리스트 순서가 곧 실행 순서다. 이미지 분류의 표준 3종은 거의 항상 Resize/Crop → ToTensor → Normalize 순서로, "크기 맞추기 → 텐서화 → 정규화"의 조립 라인을 이룬다. 순서를 헷갈려 Normalize 를 ToTensor 앞에 두면 PIL 이미지에 뺄셈을 시도해 곧장 에러가 난다.',
        actor: '🏭 __getitem__ 안에서 매번 실행되는 변환 함수',
        engine: 'compose',
        vis: 'compose',
        engineDetail: 'transforms.Compose([Resize, ToTensor, Normalize])',
        alert: { tone: 'info', text: 'Compose 의 리스트 순서 = 실행 순서. 표준은 크기 맞추기 → ToTensor → Normalize. Normalize 를 ToTensor 앞에 두면 PIL 이미지에 산술을 시도해 터진다.' },
        code: {
          lang: 'python',
          filename: 'transforms_pipeline.py (1/5 — 변환의 자리)',
          lines: [
            '"""',
            'transforms_pipeline.py — Dataset 과 모델 사이의 변환 조립 라인',
            'transforms 는 __getitem__ 이 샘플을 꺼낼 때마다 그 자리에서 실행된다.',
            '"""',
            'from PIL import Image',
            'from torch.utils.data import Dataset',
            'from torchvision import transforms',
            '',
            '# Compose: 리스트 순서 = 실행 순서 (표준 3종 조립 라인)',
            'pipeline = transforms.Compose([',
            '    transforms.Resize((224, 224)),   # 1) 크기 맞추기 (PIL)',
            '    transforms.ToTensor(),           # 2) PIL → Tensor',
            '    transforms.Normalize(            # 3) 채널별 정규화',
            '        mean=[0.485, 0.456, 0.406],',
            '        std=[0.229, 0.224, 0.225]),',
            '])',
            '',
            'class ImageDataset(Dataset):',
            '    def __init__(self, paths, labels, transform):',
            '        self.paths = paths',
            '        self.labels = labels',
            '        self.transform = transform   # 변환을 주입받는다',
            '',
            '    def __len__(self):',
            '        return len(self.paths)',
            '',
            '    def __getitem__(self, idx):',
            '        # 원본은 디스크에 그대로 — 꺼낼 때마다 즉석 변환',
            '        img = Image.open(self.paths[idx]).convert("RGB")',
            '        img = self.transform(img)    # 여기서 조립 라인 실행',
            '        return img, self.labels[idx]',
            '',
            '# 배치를 뽑을 때마다 변환이 돌아간다 (원본 저장 불필요)',
            'ds = ImageDataset(paths, labels, transform=pipeline)',
            'x, y = ds[0]',
            'print(x.shape)   # torch.Size([3, 224, 224])  (C, H, W)',
          ],
          highlight: [8, 9, 10, 11, 12, 13, 14, 15, 26, 27, 28, 29],
        },
      },

          </div>
          <div className="mt-2 text-[10px] text-orange-900">원본은 디스크에 그대로. <span className="font-mono font-bold">__getitem__</span> 이 꺼낼 때마다 이 라인이 즉석 실행된다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 정규화 분포 이동 (막대 히스토그램 before/after)
    // ─────────────────────────────────────────────────────
    function NormalizeBox() {
      // before: [0,1] 에 몰린 분포 / after: 0 중심으로 이동·확장
      const before = [2, 5, 9, 14, 18, 15, 10, 6, 3, 1];
      const after = [1, 3, 7, 12, 16, 17, 13, 9, 5, 2];
      const Bars = ({ data, tone, zeroAt }) => (
        <div className="flex items-end gap-[2px] h-16">
          {data.map((v, i) => (
            <div key={i} className="flex-1 flex flex-col justify-end">
              <div className={`${tone} rounded-t`} style={{ height: `${v * 3}px` }} />
            </div>

        </div>
      );
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🎚️ ToTensor + Normalize — 값의 분포가 이동한다</div>
          {/* ToTensor 축/스케일 요약 */}
          <div className="flex gap-2 mb-3">
            <div className="flex-1 rounded border border-sky-300 bg-sky-50 px-2 py-1.5 text-center">
              <div className="text-[9px] text-sky-800 font-bold">PIL (HWC)</div>
              <div className="text-[11px] font-mono text-slate-800">[0,255] uint8</div>
            </div>
            <div className="flex items-center text-orange-500 font-bold text-sm">→ ÷255 →</div>
            <div className="flex-1 rounded border border-orange-400 bg-orange-50 px-2 py-1.5 text-center">
              <div className="text-[9px] text-orange-800 font-bold">Tensor (CHW)</div>
              <div className="text-[11px] font-mono text-slate-800">[0,1] float32</div>
            </div>
          </div>
          {/* 분포 이동 */}
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded border border-orange-200 bg-orange-50 p-2">
              <div className="text-[10px] font-bold text-orange-800 mb-1">정규화 전 — [0,1] 에 몰림</div>
              <Bars data={before} tone="bg-orange-300" />
              <div className="text-[8px] text-slate-500 text-center mt-0.5 font-mono">0 ────── 1</div>

        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 에폭별 증강 그리드 + train/val 분리
    // ─────────────────────────────────────────────────────
    function AugmentBox() {
      // 같은 원본을 에폭마다 다르게 변형 (색/플립/크롭/지움을 의사난수로)
      const epochs = [
        { ep: 0, flip: false, crop: 0, erase: false, tint: '#fb923c' },
        { ep: 1, flip: true, crop: 3, erase: false, tint: '#f97316' },
        { ep: 2, flip: false, crop: 5, erase: true, tint: '#fdba74' },
        { ep: 3, flip: true, crop: 2, erase: false, tint: '#ea580c' },
        { ep: 4, flip: false, crop: 4, erase: true, tint: '#fb923c' },
        { ep: 5, flip: true, crop: 6, erase: false, tint: '#f59e0b' },
      ];
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🎲 같은 이미지 — 에폭마다 다른 변형</div>
          <div className="grid grid-cols-6 gap-1.5">
            {epochs.map((e) => (

                <div className="text-[8px] text-orange-700 font-mono mt-0.5">ep{e.ep}</div>
              </div>

          </div>
          <div className="mt-1 text-[9px] text-slate-500 text-center">RandomCrop · Flip · ColorJitter · RandomErasing — 매번 새 난수</div>
          {/* train/val 파이프라인 분리 */}
          <div className="mt-3 grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2">
              <div className="text-[10px] font-bold text-orange-800 mb-1">🚂 train — 랜덤 증강 O</div>
              <div className="flex gap-1 justify-center">
                <MiniImage tint="#f97316" flip crop={4} size={26} />
                <MiniImage tint="#fb923c" crop={2} erase size={26} />
                <MiniImage tint="#ea580c" flip crop={5} size={26} />

              <div className="flex gap-1 justify-center">
                <MiniImage tint="#64748b" size={26} />
                <MiniImage tint="#64748b" size={26} />
                <MiniImage tint="#64748b" size={26} />
              </div>
              <div className="text-[8px] text-slate-600 text-center mt-1">항상 같다 → 점수 안 흔들림</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — CPU 워커 vs GPU 배치 + 병목 게이지
    // ─────────────────────────────────────────────────────
    function V2PerfBox() {
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">⚙️ 변환을 어디서 돌릴까 — CPU 워커 vs GPU 배치</div>
          {/* v2 동시 변환 */}
          <div className="rounded border border-orange-200 bg-orange-50 p-2 mb-3">
            <div className="text-[10px] font-bold text-orange-800 mb-1">🆕 transforms.v2 — 이미지 + bbox 동시 변환</div>
            <div className="flex items-center justify-center gap-2 text-[10px]">
              <span className="px-1.5 py-0.5 rounded bg-orange-200 text-orange-800 font-mono">🖼️ image</span>
              <span className="text-orange-600 font-bold">+</span>
              <span className="px-1.5 py-0.5 rounded bg-orange-200 text-orange-800 font-mono">▭ bbox</span>
              <span className="text-orange-600 font-bold">→ 한 호출로 좌표 동기화</span>
            </div>
          </div>
          {/* 두 위치 */}
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-2">
              <div className="text-[10px] font-bold text-sky-800 mb-1">🧵 CPU 워커 (기본)</div>
              <div className="text-[9px] text-slate-600 font-mono">num_workers=8</div>
              <div className="text-[9px] text-slate-700 mt-1">준비 ∥ 학습 겹침</div>
            </div>
            <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2">
              <div className="text-[10px] font-bold text-orange-800 mb-1">🎮 GPU 배치 (Kornia)</div>
              <div className="text-[9px] text-slate-600 font-mono">gpu_aug(x)</div>
              <div className="text-[9px] text-slate-700 mt-1">배치 단위 한 줄</div>
            </div>
          </div>
          {/* 병목 게이지 */}
          <div className="mt-3 rounded border-2 border-red-300 bg-red-50 p-2">
            <div className="text-[10px] font-bold text-red-800 mb-1">📉 입력 병목 신호 — GPU 사용률</div>
            <div className="h-3 rounded-full bg-slate-200 overflow-hidden">
              <div className="h-full bg-red-400 flex items-center justify-end pr-1" style={{ width: '38%' }}>
                <span className="text-[8px] text-white font-bold">38%</span>
              </div>
            </div>
            <div className="text-[9px] text-red-900 mt-1">GPU 가 데이터를 기다리며 논다 → workers↑ 또는 GPU 증강으로 이동</div>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">먼저 <span className="font-bold">프로파일링</span>. 대기가 길면 입력 병목이라는 신호다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 표준 레시피 표 + 습관(커스텀·역정규화·눈 확인)
    // ─────────────────────────────────────────────────────
    const TONE_TEXT = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
    function RecipeBox({ recipeRows, habitRows }) {
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧾 분류 표준 레시피 — train/val 짝</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-200">
                  <th className="text-left py-1 w-14">세트</th>
                  <th className="text-left py-1 pl-1">파이프라인</th>
                  <th className="text-left py-1 pl-1 w-12">랜덤</th>
                </tr>
              </thead>
              <tbody>
                {recipeRows.map((r) => (
                  <tr key={r.stage} className="border-t border-orange-100">
                    <td className="py-1 font-mono font-bold text-orange-800">{r.stage}</td>
                    <td className="py-1 pl-1 text-slate-700 text-[9px]">{r.tf}</td>
                    <td className={`py-1 pl-1 font-bold ${TONE_TEXT[r.tone]}`}>{r.rand}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🛠️ 들여야 할 습관 3종</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-300">
                  <th className="text-left py-1 w-20">항목</th>
                  <th className="text-left py-1 pl-1">방법</th>
                </tr>
              </thead>
              <tbody>
                {habitRows.map((r) => (
                  <tr key={r.fn} className="border-t border-orange-200">
                    <td className={`py-1 font-bold ${TONE_TEXT[r.tone]}`}>{r.fn}</td>
                    <td className="py-1 pl-1 text-slate-700 font-mono text-[9px]">{r.how}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {/* 역정규화 눈 확인 미리보기 */}
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[10px] font-bold text-orange-900 mb-2">👁️ 역정규화 — 새까만 텐서를 사람이 볼 수 있게</div>
            <div className="flex items-center justify-center gap-3">
              <div className="text-center">
                <div className="w-10 h-10 rounded bg-slate-900 border border-slate-700" />
                <div className="text-[8px] text-slate-500 mt-0.5 font-mono">정규화 텐서</div>
              </div>
              <div className="text-orange-600 text-center">
                <div className="text-lg">→</div>
                <div className="text-[8px] font-mono">x·σ+μ</div>
              </div>
              <div className="text-center">
                <MiniImage tint="#f97316" size={40} />
                <div className="text-[8px] text-slate-500 mt-0.5 font-mono">denormalize</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — transforms 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      compose:   { icon: '🏭', label: 'Compose 조립 라인' },
      normalize: { icon: '🎚️', label: 'ToTensor·Normalize' },
      augment:   { icon: '🎲', label: '증강 변환' },
      v2perf:    { icon: '⚙️', label: 'v2 API·성능' },
      recipe:    { icon: '🧾', label: '실무 레시피' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.compose;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>transforms — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'compose' && <ComposeBox />}
          {state.vis === 'normalize' && <NormalizeBox />}
          {state.vis === 'augment' && <AugmentBox />}
          {state.vis === 'v2perf' && <V2PerfBox />}
          {state.vis === 'recipe' && <RecipeBox recipeRows={state.recipeRows} habitRows={state.habitRows} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">III-1-2. transforms·증강 파이프라인</h1>
                <p className="text-sm text-orange-800/80">Dataset과 모델 사이의 변환 조립 라인 — 전처리와 증강을 한 곳에서</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                transforms 는 Dataset 과 모델 사이의 변환 조립 라인이다 —
                <span className="font-mono">Compose</span> 로 순서대로 엮고, <span className="font-mono">ToTensor</span>(0~255→0~1·HWC→CHW)와
                <span className="font-mono">Normalize</span>(ImageNet 통계)로 전이학습 백본과 궁합을 맞춘다.
                증강은 매 에폭 다른 변형으로 과적합을 막되 <span className="font-bold">train 에만</span> 넣고 val 은 결정적으로,
                무거우면 <span className="font-mono">v2</span>·GPU 증강으로 병목을 푼다. 그리고 학습 전 <span className="font-bold">역정규화로 눈 확인</span>을 습관화하라.
                다음 장에서는 이렇게 학습한 모델을 안전하게 저장·복원하는 체크포인트를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Compose', 'ToTensor', 'Normalize', 'ImageNet', 'RandomResizedCrop', 'ColorJitter', 'RandomErasing', 'train/val', 'transforms.v2', 'Kornia', 'denormalize'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-3.html" className="underline hover:no-underline">다음: III-1-3 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
