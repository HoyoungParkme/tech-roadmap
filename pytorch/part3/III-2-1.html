  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    PyTorch III-2-1 — 체크포인트 — state_dict 저장·재개
    학습 목표: 12시간 학습이 11시간째에 죽었을 때 처음부터 다시 돌리지 않는 법.
              (1) state_dict 는 이름→텐서 OrderedDict 라는 정체, (2) torch.save(model.state_dict())
              가 왜 전체 저장보다 안전한 표준인가, (3) 인스턴스 생성→load_state_dict→eval() 3단계와
              map_location·strict=False, (4) 모델+옵티마이저 state+에폭+스케줄러를 묶는 재개 체크포인트,
              (5) best/last 이원 저장·안전 저장(임시→rename)·호환성 문서화까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: state_dict 열람 · 저장/로드 흐름도 · 크래시→재개 학습곡선 시뮬) /
          우(VSCode CodeViewer: checkpoint.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — state_dict 정체 → 저장 정석 → 로드 3단계 → 재개 체크포인트 → 실무 체계
    //   state.vis : 좌측 LiveDataPane 이 그릴 시각화 종류
    //               'inspect'(state_dict 내용물) | 'save'(state_dict vs 전체 저장)
    //               'load'(로드 3단계 흐름) | 'resume'(크래시→재개 학습곡선) | 'ops'(best/last 실무 표)
    //   code      : 우측 CodeViewer 파일 (checkpoint.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. state_dict의 정체 — 모델의 모든 파라미터를 담은 OrderedDict',
        desc: '체크포인트를 이해하려면 먼저 "모델을 저장한다"가 실제로 무엇을 저장하는지 알아야 한다. nn.Module 의 학습된 지식은 전부 파라미터 텐서(가중치 weight·편향 bias)에 들어 있고, model.state_dict() 는 이걸 "레이어이름.파라미터 → 텐서"로 매핑한 OrderedDict 로 돌려준다. print 로 열어 보면 fc1.weight, fc1.bias, fc2.weight … 처럼 키가 계층 이름 그대로 찍힌다. 여기서 핵심 분리 구조가 나온다 — 모델의 "구조"는 파이썬 클래스 코드(nn.Module 정의)에 있고, "학습된 값"은 state_dict 에 있다. 즉 클래스 코드 + state_dict = 완전한 모델이다. 그래서 저장할 때는 무거운 클래스 전체가 아니라 값 뭉치(state_dict)만 챙기면 된다.',
        actor: '📦 model.state_dict() — 이름→텐서 사전 열어보기',
        engine: 'inspect',
        vis: 'inspect',
        engineDetail: 'OrderedDict[str, Tensor] · fc1.weight / fc1.bias …',
        sdRows: [
          { key: 'fc1.weight', shape: '[128, 784]', numel: '100,352' },
          { key: 'fc1.bias', shape: '[128]', numel: '128' },
          { key: 'fc2.weight', shape: '[10, 128]', numel: '1,280' },
          { key: 'fc2.bias', shape: '[10]', numel: '10' },
        ],
        alert: { tone: 'info', text: '모델 클래스 코드(구조) + state_dict(학습된 값) = 완전한 모델. state_dict 는 값만 담은 OrderedDict 라, 저장 대상은 무거운 객체가 아니라 이 "값 뭉치" 하나면 충분하다.' },
        code: {
          lang: 'python',
          filename: 'checkpoint.py (1/5 — state_dict 열어보기)',
          lines: [
            '"""',
            'checkpoint.py — 학습을 저장하고 재개하는 정석',
            'Step 1: model.state_dict() 의 정체를 눈으로 확인한다.',
            '"""',
            'import torch',
            'import torch.nn as nn',
            '',
            'class Net(nn.Module):',
            '    def __init__(self):',
            '        super().__init__()',
            '        self.fc1 = nn.Linear(784, 128)',
            '        self.fc2 = nn.Linear(128, 10)',
            '    def forward(self, x):',
            '        return self.fc2(torch.relu(self.fc1(x)))',
            '',
            'model = Net()',
            '',
            '# state_dict = "레이어이름.파라미터" → 텐서 로 이뤄진 OrderedDict',
            'sd = model.state_dict()',
            'for name, tensor in sd.items():',
            '    print(name, tuple(tensor.shape))',
            '# fc1.weight (128, 784)',
            '# fc1.bias   (128,)',
            '# fc2.weight (10, 128)',
            '# fc2.bias   (10,)',
            '',
            'print(type(sd))          # <class "collections.OrderedDict">',
            '',
            '# 핵심 분리: 구조(=Net 클래스 코드) + 값(=state_dict).',
            '# 저장할 때 챙기는 것은 무거운 객체가 아니라 이 값 뭉치뿐이다.',
          ],
          highlight: [8, 9, 10, 11, 12, 17, 18, 19, 20, 26],
        },
      },

                <li>· 순수 텐서 값 사전 → 이식성 높음</li>
                <li>· 코드가 바뀌어도 구조만 다시 만들면 OK</li>
                <li>· 버전 변화에 강함</li>
              </ul>
            </div>
            <div className="flex-1 rounded-lg border-2 border-red-300 bg-red-50 p-2">
              <div className="text-[11px] font-bold text-red-800 mb-1">⚠️ B. 전체 객체 저장 (함정)</div>
              <div className="text-[9px] font-mono text-slate-700 bg-white rounded px-1.5 py-1 border border-red-200">torch.save(model, "m.pt")</div>
              <ul className="mt-1.5 text-[9px] text-red-900 space-y-0.5">
                <li>· pickle 이 클래스 경로를 굳힘</li>
                <li>· 파일 이동·리네임·리팩터링 시 깨짐</li>
                <li>· 버전 취약 + pickle 보안 위험</li>
              </ul>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">공식 권장은 언제나 <span className="font-mono font-bold">state_dict</span> 방식. "구조는 코드로, 값은 사전으로".</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 로드 3단계 흐름 + 옵션 표
    // ─────────────────────────────────────────────────────
    const OPT_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700', info: 'text-sky-700' };
    function LoadBox({ loadSteps, optRows }) {
      if (!loadSteps) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🔧 불러오기 — 빈 그릇 만들고 값 붓는 3단계</div>
          <div className="space-y-1.5">
            {loadSteps.map((s) => (
              <div key={s.n} className="flex items-start gap-2 rounded border border-orange-200 bg-orange-50 px-2 py-1.5">
                <span className="w-5 h-5 shrink-0 rounded-full bg-orange-600 text-white text-[11px] font-bold flex items-center justify-center">{s.n}</span>
                <div className="min-w-0">
                  <div className="text-[11px] font-bold text-orange-900">{s.title}</div>
                  <div className="text-[9px] font-mono text-slate-700 break-all">{s.code}</div>
                  <div className="text-[9px] text-slate-500">{s.note}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 rounded border-2 border-orange-300 bg-white">
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-200">
                  <th className="text-left py-1 px-2">실무 옵션</th>
                  <th className="text-left py-1 px-1">언제</th>
                </tr>
              </thead>
              <tbody>
                {optRows.map((r) => (
                  <tr key={r.opt} className="border-t border-orange-100">
                    <td className={`py-1 px-2 font-mono font-bold ${OPT_TONE[r.tone]}`}>{r.opt}</td>
                    <td className="py-1 px-1 text-slate-700">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 크래시 → 재개 학습곡선 시뮬 (옵티마이저 state 유무 비교)
    //   epoch 0..11 정상 학습 → 11에서 크래시 → 12부터 재개
    //   with-optimizer: 매끄럽게 이어짐 / without: 출렁이다 회복
    // ─────────────────────────────────────────────────────
    function ResumeBox() {
      const W = 340, H = 150, PAD = 24;
      const CRASH = 11, TOTAL = 20;
      // 손실 곡선 (0..1 정규화, 낮을수록 좋음)
      const base = (e) => 0.9 * Math.exp(-e / 6) + 0.06;         // 정상 하강
      const withOpt = (e) => base(e);                            // 옵티마이저 복원 — 그대로 이어짐
      const withoutOpt = (e) => {                                 // 옵티마이저 리셋 — 재개 후 출렁
        if (e <= CRASH) return base(e);
        const bump = 0.22 * Math.exp(-(e - CRASH) / 2.2);        // 재개 직후 튀었다 회복
        return base(e) + bump;
      };
      const x = (e) => PAD + (e / (TOTAL - 1)) * (W - 2 * PAD);
      const y = (v) => PAD + (1 - v) * (H - 2 * PAD);            // v: 0(하단) .. 1(상단)
      const path = (fn, from, to) => {
        let d = '';
        for (let e = from; e <= to; e++) d += (e === from ? 'M' : 'L') + x(e).toFixed(1) + ',' + y(fn(e)).toFixed(1) + ' ';
        return d.trim();
      };
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🔄 12시간째 크래시 → 체크포인트에서 재개</div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
            {/* 축 */}
            <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="#cfc9ba" strokeWidth="1" />
            <line x1={PAD} y1={PAD} x2={PAD} y2={H - PAD} stroke="#cfc9ba" strokeWidth="1" />
            {/* 크래시 지점 */}
            <line x1={x(CRASH)} y1={PAD} x2={x(CRASH)} y2={H - PAD} stroke="#ef4444" strokeWidth="1" strokeDasharray="3 3" />
            <text x={x(CRASH)} y={PAD - 6} fontSize="8" fill="#dc2626" textAnchor="middle">💥 크래시 → 재개</text>
            {/* 재개 전 (공통) */}
            <path d={path(base, 0, CRASH)} fill="none" stroke="#57534a" strokeWidth="2" />
            {/* 옵티마이저 리셋 (빨강, 출렁) */}
            <path d={path(withoutOpt, CRASH, TOTAL - 1)} fill="none" stroke="#ef4444" strokeWidth="2" strokeDasharray="4 2" />
            {/* 옵티마이저 복원 (초록, 매끄러움) */}
            <path d={path(withOpt, CRASH, TOTAL - 1)} fill="none" stroke="#10b981" strokeWidth="2" />
            {/* 라벨 */}
            <text x={W - PAD} y={H - PAD + 10} fontSize="8" fill="#8a8578" textAnchor="end">epoch →</text>
            <text x={PAD - 4} y={PAD + 4} fontSize="8" fill="#8a8578" textAnchor="end">loss</text>
          </svg>
          <div className="flex gap-3 justify-center mt-1 text-[9px]">
            <span className="flex items-center gap-1"><span className="inline-block w-4 h-0.5 bg-emerald-500"></span>옵티마이저 state 복원 — 매끄럽게 이어짐</span>
            <span className="flex items-center gap-1"><span className="inline-block w-4 h-0.5 bg-red-500"></span>state 빠뜨림 — 재개 후 출렁이다 회복</span>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">Adam·SGD 모멘텀 누적을 잃으면 학습률이 튄 것과 같은 효과 — 손실이 한동안 요동친다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — best/last 실무 운영 표
    // ─────────────────────────────────────────────────────
    const OPS_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', info: 'text-sky-700', bad: 'text-red-700' };
    function OpsBox({ opsRows }) {
      if (!opsRows) return null;
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🗂️ best / last 이원 저장 전략</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-200">
                  <th className="text-left py-1">파일</th>
                  <th className="text-left py-1 pl-1">저장 시점</th>
                  <th className="text-left py-1 pl-1">쓰임</th>
                </tr>
              </thead>
              <tbody>
                {opsRows.map((r) => (
                  <tr key={r.file} className="border-t border-orange-100">
                    <td className={`py-1 font-mono font-bold ${OPS_TONE[r.tone]}`}>{r.file}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.when}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.use}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🛟 안전한 저장 — 임시파일 → 원자적 rename</div>
            <div className="flex items-center gap-1.5 text-[10px]">
              <div className="flex-1 rounded border border-amber-300 bg-white px-2 py-1.5 text-center">
                <div className="font-bold text-amber-800">1. ckpt.tmp 에 쓰기</div>
                <div className="text-[9px] text-slate-500 font-mono">torch.save(obj, tmp)</div>
              </div>
              <div className="text-orange-600 text-lg">→</div>
              <div className="flex-1 rounded border border-emerald-400 bg-emerald-50 px-2 py-1.5 text-center">
                <div className="font-bold text-emerald-800">2. os.replace</div>
                <div className="text-[9px] text-slate-500 font-mono">tmp → ckpt.pt (원자적)</div>
              </div>
            </div>
            <div className="mt-2 text-[10px] text-orange-900">저장 도중 죽어도 반쯤 쓰인 파일이 원본을 덮지 않는다 — 이전 정상본이 살아남는다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 체크포인트 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      inspect: { icon: '📦', label: 'state_dict 정체' },
      save:    { icon: '⚖️', label: '저장의 정석' },
      load:    { icon: '🔧', label: '불러오기 3단계' },
      resume:  { icon: '🔄', label: '학습 재개' },
      ops:     { icon: '🗂️', label: '실무 체계' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.inspect;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>체크포인트 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'inspect' && <InspectBox rows={state.sdRows} />}
          {state.vis === 'save' && <SaveBox />}
          {state.vis === 'load' && <LoadBox loadSteps={state.loadSteps} optRows={state.optRows} />}
          {state.vis === 'resume' && <ResumeBox />}
          {state.vis === 'ops' && <OpsBox opsRows={state.opsRows} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">III-2-1. 체크포인트 — state_dict 저장·재개</h1>
                <p className="text-sm text-orange-800/80">12시간 학습이 11시간째에 죽었다 — 다시는 처음부터 돌리지 않는 법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                모델의 학습된 지식은 <span className="font-mono">state_dict</span>(이름→텐서 OrderedDict)에 있고, 구조는 클래스 코드에 있다 —
                그래서 저장은 <span className="font-mono">torch.save(model.state_dict())</span> 가 표준이다(전체 저장은 pickle 경로 의존으로 깨진다).
                로드는 인스턴스 생성 → <span className="font-mono">load_state_dict</span> → <span className="font-mono">eval()/train()</span> 3단계,
                GPU→CPU 는 <span className="font-mono">map_location</span>, 부분 로드는 <span className="font-mono">strict=False</span>.
                재개하려면 모델·옵티마이저(모멘텀!)·에폭·스케줄러를 한 딕셔너리로 묶고, 운영은 best/last 이원 저장 + 임시파일→rename 안전 저장으로 굳힌다.
                다음 장에서는 이렇게 저장한 학습을 실시간으로 들여다보는 <span className="font-bold">모니터링</span>을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['state_dict', 'torch.save', 'torch.load', 'load_state_dict', 'map_location', 'strict', 'optimizer', 'scheduler', 'resume', 'best/last', 'os.replace', 'eval'].map((k) => (
