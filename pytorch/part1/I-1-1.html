  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    PyTorch I-1-1 — 텐서 — numpy와 뭐가 다른가
    학습 목표: 겉보기엔 np.array와 똑같은 torch.tensor가, 실은 (1) GPU로 갈 수 있고
              (2) 자기 연산 이력을 기억해 미분할 수 있다는 두 가지 결정적 차이를 체험한다.
              numpy 브리지의 메모리 공유 함정, 디바이스 mismatch 에러, requires_grad와 grad_fn,
              float32 기본 dtype 함정, view/clone/detach 구분까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: numpy↔torch 비교 카드 · CPU↔GPU 이동 · grad_fn 체인) /
          우(VSCode CodeViewer: tensor_basics.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — numpy와 닮은 첫 만남 → 디바이스 → requires_grad → dtype 함정 → 실무 카탈로그
    //   state.vis  : 좌측 LiveDataPane 이 그릴 시각화 종류
    //                'bridge'(numpy 브리지 메모리 공유) | 'device'(CPU↔GPU 이동)
    //                'grad'(grad_fn 체인) | 'dtype'(dtype 표) | 'catalog'(생성/뷰 카탈로그)
    //   compare    : numpy vs torch 나란히 비교 코드 카드
    //   code       : 우측 CodeViewer 파일 (tensor_basics.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 첫 만남 — torch.tensor는 np.array와 거의 똑같다',
        desc: 'PyTorch를 처음 켠 numpy 유저가 가장 먼저 안심해야 할 사실 — 생성·인덱싱·브로드캐스팅·연산의 문법이 거의 그대로다. np.array([1,2,3])가 torch.tensor([1,2,3])가 되고, a[0], a[:, 1], a + b, a @ b 모두 동일하게 동작한다. 전환 비용이 낮다는 게 PyTorch가 numpy 유저를 빠르게 흡수한 이유다. 다만 딱 하나 조심할 다리(bridge)가 있다 — torch.from_numpy(arr)와 t.numpy()는 데이터를 복사하지 않고 "같은 메모리를 공유"한다. 그래서 한쪽을 바꾸면 다른 쪽도 바뀐다. 편해서 쓰지만, 원본을 지키고 싶다면 .copy()나 .clone()으로 끊어야 한다.',
        actor: '🤝 numpy → torch 전환 — 문법이 거의 그대로',
        engine: 'bridge',
        vis: 'bridge',
        engineDetail: 'torch.from_numpy() · t.numpy() — 메모리 공유',
        compare: {
          np: ['import numpy as np', '', 'a = np.array([1, 2, 3])', 'a[0]        # 1', 'a[1:]       # [2 3]', 'a + 10      # [11 12 13]', 'a.mean()    # 2.0', 'a.reshape(3, 1)'],
          torch: ['import torch', '', 't = torch.tensor([1, 2, 3])', 't[0]        # tensor(1)', 't[1:]       # tensor([2, 3])', 't + 10      # tensor([11,12,13])', 't.float().mean()  # 2.0', 't.reshape(3, 1)'],
        },
        alert: { tone: 'warn', text: 'from_numpy·numpy()는 복사가 아니라 "같은 메모리 공유"다. 한쪽을 바꾸면 다른 쪽도 바뀐다 — 원본 보존이 필요하면 .clone() 으로 끊어라.' },
        code: {
          lang: 'python',
          filename: 'tensor_basics.py (1/5 — numpy 브리지)',
          lines: [
            '"""',
            'tensor_basics.py — numpy 유저를 위한 torch.tensor 첫 만남',
            '문법은 거의 동일. 단, numpy 브리지는 메모리를 "공유" 한다.',
            '"""',
            'import numpy as np',
            'import torch',
            '',
            '# 1) 생성 — 문법이 거의 같다',
            'a = np.array([1, 2, 3])',
            't = torch.tensor([1, 2, 3])',
            'print(a, t)          # [1 2 3]   tensor([1, 2, 3])',
            '',
            '# 2) 인덱싱 · 슬라이싱 · 연산 — 그대로 통한다',
            'print(t[0], t[1:])   # tensor(1) tensor([2, 3])',
            'print(t + 10)        # tensor([11, 12, 13])',
            'print(t @ t)         # tensor(14)  = 1+4+9 (내적)',
            '',
            '# 3) numpy 브리지 — 여기서 함정이 시작된다',
            'arr = np.array([1.0, 2.0, 3.0])',
            'shared = torch.from_numpy(arr)   # 복사 아님! 메모리 공유',
            'arr[0] = 99.0                    # numpy 쪽을 바꿨는데...',
            'print(shared)                    # tensor([99., 2., 3.]) 텐서도 바뀜',
            '',
            '# 반대 방향도 공유된다',
            'back = shared.numpy()            # 역시 같은 메모리',
            'shared[1] = -1.0',
            'print(back)                      # [99. -1.  3.]',
            '',
            '# 원본을 지키고 싶다면 복사로 다리를 끊는다',
            'safe = torch.from_numpy(arr).clone()   # 이제 독립',
            'arr[0] = 0.0',
            'print(safe)                      # tensor([99., 2., 3.]) 영향 없음',
          ],
          highlight: [9, 10, 14, 15, 16, 19, 20, 21, 22, 29, 30, 31],
        },
      },

          <pre className="text-[10px] font-mono leading-4 text-slate-800 whitespace-pre-wrap break-all">{lines.join('\n')}</pre>

        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-2">

    }

            <div className="text-amber-600 text-xl">←</div>
            <div className="flex-1 rounded border border-orange-300 bg-white px-2 py-1.5 text-center">
              <div className="text-[10px] font-bold text-orange-800">torch.tensor</div>
              <div className="text-[9px] text-slate-500 font-mono">from_numpy(arr)</div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-amber-900">arr[0]=99 로 바꾸면 텐서도 99 가 된다. 끊으려면 <span className="font-mono font-bold">.clone()</span>.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // CPU ↔ GPU 디바이스 이동 다이어그램 (Step 2)
    // ─────────────────────────────────────────────────────
    function DeviceBox() {
      const Box = ({ icon, name, sub, color }) => (
        <div className={`flex-1 rounded-lg border-2 ${color} px-3 py-3 text-center`}>
          <div className="text-2xl">{icon}</div>
          <div className="text-[11px] font-bold text-slate-800 mt-1">{name}</div>
          <div className="text-[9px] text-slate-500 font-mono">{sub}</div>
        </div>
      );
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🚚 텐서는 device 사이를 이동한다</div>
          <div className="flex items-center gap-2">
            <Box icon="🖥️" name="CPU 텐서" sub='x.device = cpu' color="border-slate-300 bg-slate-50" />
            <div className="text-center text-orange-600">
              <div className="text-lg">→</div>
              <div className="text-[9px] font-mono font-bold">.to("cuda")</div>
            </div>
            <Box icon="🎮" name="GPU 텐서" sub='cuda:0 (병렬)' color="border-orange-400 bg-orange-50" />
          </div>
          <div className="mt-3 rounded border-2 border-red-300 bg-red-50 p-2">
            <div className="text-[10px] font-bold text-red-800 mb-1">💥 섞으면 터진다</div>
            <div className="flex items-center justify-center gap-1.5 text-[11px] font-mono">
              <span className="px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">CPU</span>
              <span className="text-red-600 font-bold">+</span>
              <span className="px-1.5 py-0.5 rounded bg-orange-200 text-orange-800">GPU</span>
              <span className="text-red-600 font-bold">=</span>
              <span className="px-1.5 py-0.5 rounded bg-red-200 text-red-800 font-bold">RuntimeError</span>
            </div>
            <div className="mt-1 text-[9px] text-red-900 text-center font-mono">Expected all tensors to be on the same device</div>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">해결: 연산 전에 <span className="font-mono font-bold">b.to("cuda")</span> 로 같은 방에 모은다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // grad_fn 체인 + backward 다이어그램 (Step 3)
    // ─────────────────────────────────────────────────────
    function GradBox() {
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🧠 계산 그래프 — 텐서가 족보를 들고 다닌다</div>
          {/* forward */}
          <div className="flex items-center gap-1.5">
            <div className="rounded-lg border-2 border-orange-400 bg-orange-50 px-3 py-2 text-center">
              <div className="text-[11px] font-bold text-orange-900 font-mono">x = 3.0</div>
              <div className="text-[9px] text-orange-700">requires_grad</div>
            </div>
            <div className="text-center text-slate-500">
              <div className="text-lg">→</div>
              <div className="text-[9px] font-mono">x**2</div>
            </div>
            <div className="rounded-lg border-2 border-orange-500 bg-orange-100 px-3 py-2 text-center">
              <div className="text-[11px] font-bold text-orange-900 font-mono">y = 9.0</div>
              <div className="text-[9px] text-orange-700 font-mono">grad_fn=Pow</div>
            </div>
          </div>
          {/* backward */}
          <div className="mt-2 flex items-center gap-1.5">
            <div className="rounded-lg border-2 border-emerald-500 bg-emerald-50 px-3 py-2 text-center">
              <div className="text-[11px] font-bold text-emerald-900 font-mono">x.grad = 6.0</div>
              <div className="text-[9px] text-emerald-700">dy/dx = 2x</div>
            </div>
            <div className="text-center text-emerald-600">
              <div className="text-lg">←</div>
              <div className="text-[9px] font-mono font-bold">backward()</div>
            </div>
            <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 px-3 py-2 text-center">
              <div className="text-[11px] font-bold text-emerald-900 font-mono">y = 9.0</div>
              <div className="text-[9px] text-emerald-700">역전파 시작점</div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">
            앞으로(forward) 갈 때 <span className="font-mono">grad_fn</span> 에 연산을 기록해 두고, <span className="font-mono font-bold">backward()</span> 로 거꾸로 따라가면 미분이 <span className="font-mono">x.grad</span> 에 자동으로 도착한다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // dtype 표 (Step 4)
    // ─────────────────────────────────────────────────────
    const DTYPE_TONE = {
      good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700',
    };
    function DtypeBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🔢 자주 만나는 dtype — 미분 가능 여부가 갈린다</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-orange-900 border-b-2 border-orange-200">
                <th className="text-left py-1">dtype</th>
                <th className="text-left py-1 pl-1">별칭</th>
                <th className="text-left py-1 pl-1 w-12">미분</th>
                <th className="text-left py-1 pl-1">쓰임</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.name} className="border-t border-orange-100">
                  <td className="py-1 font-mono font-bold text-slate-800">{r.name}</td>
                  <td className="py-1 pl-1 text-slate-600">{r.alias}</td>
                  <td className={`py-1 pl-1 font-bold ${DTYPE_TONE[r.tone]}`}>{r.grad}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.use}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-orange-900">numpy=float64 ↔ torch=float32 — 브리지로 넘어온 float64 가 mismatch 의 단골 원인.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 생성 카탈로그 + view/clone/detach 표 (Step 5)
    // ─────────────────────────────────────────────────────
    const VIEW_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
    function CatalogBox({ catalogRows, viewRows }) {
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧰 생성 카탈로그 — numpy 와 짝이 맞는다</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-200">
                  <th className="text-left py-1">torch</th>
                  <th className="text-left py-1 pl-1">의미</th>
                  <th className="text-left py-1 pl-1">numpy 대응</th>
                </tr>
              </thead>
              <tbody>
                {catalogRows.map((r) => (
                  <tr key={r.fn} className="border-t border-orange-100">
                    <td className="py-1 font-mono font-bold text-orange-800">{r.fn}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.desc}</td>
                    <td className="py-1 pl-1 font-mono text-sky-700">{r.np}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🔀 view vs clone vs detach — 목적이 다르다</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-300">
                  <th className="text-left py-1">함수</th>
                  <th className="text-left py-1 pl-1">메모리</th>
                  <th className="text-left py-1 pl-1">그래프</th>
                  <th className="text-left py-1 pl-1">언제</th>
                </tr>
              </thead>
              <tbody>
                {viewRows.map((r) => (
                  <tr key={r.fn} className="border-t border-orange-200">
                    <td className="py-1 font-mono font-bold text-slate-800">{r.fn}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.mem}</td>
                    <td className={`py-1 pl-1 font-bold ${VIEW_TONE[r.tone]}`}>{r.grad}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.use}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 텐서 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      bridge:  { icon: '🤝', label: 'numpy 브리지' },
      device:  { icon: '🖥️', label: '디바이스' },
      grad:    { icon: '🧠', label: '자동 미분' },
      dtype:   { icon: '🔢', label: 'dtype' },
      catalog: { icon: '🧰', label: '실무 카탈로그' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.bridge;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>텐서 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'bridge' && (<><CompareCard compare={state.compare} /><BridgeBox /></>)}
          {state.vis === 'device' && <DeviceBox />}
          {state.vis === 'grad' && <GradBox />}
          {state.vis === 'dtype' && <DtypeBox rows={state.dtypeRows} />}
          {state.vis === 'catalog' && <CatalogBox catalogRows={state.catalogRows} viewRows={state.viewRows} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">I-1-1. 텐서 — numpy와 뭐가 다른가</h1>
                <p className="text-sm text-orange-800/80">겉보기엔 똑같은 배열 — 그런데 GPU로 가고, 미분을 기억한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                torch.tensor는 겉으로는 np.array와 거의 같지만, 두 가지가 결정적으로 다르다 —
                (1) device 를 가져 <span className="font-mono">.to("cuda")</span> 로 GPU에서 병렬 연산하고,
                (2) <span className="font-mono">requires_grad</span> 로 연산 이력(grad_fn)을 기억해 <span className="font-mono">backward()</span> 로 미분이 자동으로 온다.
                여기에 dtype 함정(numpy=float64 vs torch=float32, 정수 미분 불가)과 view/clone/detach 구분까지 손에 쥐면 텐서 기초는 끝이다.
                다음 장에서는 이 grad_fn 체인이 실제로 어떻게 역전파되는지 — autograd를 파고든다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['torch.tensor', 'from_numpy', 'device', 'cuda', 'requires_grad', 'grad_fn', 'backward', 'float32', 'view', 'clone', 'detach'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
