  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    PyTorch I-1-2 — 텐서 연산·브로드캐스팅·shape 디버깅
    학습 목표: 딥러닝 버그의 8할은 shape 불일치다. (1) 연산 카탈로그(요소별·행렬곱·집계의 dim)
              (2) 브로드캐스팅 규칙(뒤에서부터 정렬, 1은 늘어남, (N,)과 (N,1)의 함정)
              (3) shape 변형 도구함(view/reshape/squeeze/unsqueeze/permute/transpose/flatten, contiguous)
              (4) 에러 메시지 해독("32x784 and 100x10" 역추적, CNN→FC 버그)
              (5) 디버깅 루틴(print(x.shape)·einops·assert·배치 0번 규약)까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: dim 소거·브로드캐스팅 셀 확장 애니메이션·변형 도구·에러 해독) /
          우(VSCode CodeViewer: shape_debug.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 연산 카탈로그 → 브로드캐스팅 → 변형 도구 → 에러 해독 → 디버깅 루틴
    //   state.vis  : 좌측 LiveDataPane 이 그릴 시각화 종류
    //                'ops'(연산 카탈로그 + dim 소거) | 'broadcast'(셀 확장 애니메이션)
    //                'reshape'(변형 도구함) | 'error'(에러 메시지 해독) | 'debug'(디버깅 루틴)
    //   code       : 우측 CodeViewer 파일 (shape_debug.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 연산 카탈로그 — 요소별 · 행렬곱 · 집계(dim)',
        desc: '텐서 연산은 세 부류로 나뉜다. (1) 요소별(element-wise) — a + b, a * b 는 같은 위치끼리 계산하므로 두 텐서의 shape 가 맞아야 한다(혹은 브로드캐스팅 가능해야 한다). (2) 행렬곱 — a @ b(=torch.matmul)는 완전히 다른 규칙이다. 안쪽 차원이 맞아야 하고((m,k)@(k,n)→(m,n)), 결과 shape 는 바깥 두 차원이 남는다. *(별표)와 @(골뱅이)를 헷갈리는 게 초보의 첫 사고다. (3) 집계 — sum·mean 은 "어느 축을 뭉갤지"를 dim 인자로 고른다. 여기서 핵심 직관: dim=k 는 "k번 축이 사라진다"는 뜻이다. (2,3) 텐서에 sum(dim=0)이면 0번 축(행)이 사라져 (3,)이 되고, sum(dim=1)이면 1번 축이 사라져 (2,)가 된다. keepdim=True 를 주면 사라지는 대신 크기 1로 남아 (1,3)·(2,1)이 되는데, 이게 뒤에서 브로드캐스팅으로 되돌릴 때 결정적으로 편하다(정규화의 단골 패턴).',
        actor: '➕ element-wise · @ matmul · Σ dim 소거',
        engine: 'ops',
        vis: 'ops',
        engineDetail: 'a+b · a@b((m,k)@(k,n)) · sum(dim=?, keepdim=?)',
        alert: { tone: 'info', text: '*(요소별)와 @(행렬곱)은 완전히 다른 연산이다. 집계의 dim=k 는 "k번 축이 사라진다"로 읽어라 — keepdim=True 면 사라지는 대신 크기 1로 남는다.' },
        code: {
          lang: 'python',
          filename: 'shape_debug.py (1/5 — 연산 카탈로그)',
          lines: [
            '"""',
            'shape_debug.py — 텐서 연산 3부류: 요소별 · 행렬곱 · 집계',
            '핵심: * 는 요소별, @ 는 행렬곱. dim=k 는 "k번 축이 사라진다".',
            '"""',
            'import torch',
            '',
            'a = torch.arange(6.0).reshape(2, 3)   # [[0,1,2],[3,4,5]]',
            'b = torch.ones(2, 3)',
            '',

            'print("flatten 후:", flat.shape)',
            '',
            '# 3) einops 한 줄 — 숫자 대신 "이름"으로 모양을 바꾼다',
            '#    (설치 시) from einops import rearrange',
            '#    flat = rearrange(h, "b c h w -> b (c h w)")  # flatten',
            '#    chw  = rearrange(img, "h w c -> c h w")      # permute',
            '#  숫자 축이 아니라 의미로 읽히니 실수가 준다.',
            '',
            '# 4) 규약: 배치 차원은 항상 0번. 0번은 건드리지 않는다',
            'batch_size = x.shape[0]      # 언제나 dim 0 = 배치',
            'fc = nn.Linear(16 * 8 * 8, 10)',
            'out = fc(flat)',
            'assert out.shape[0] == batch_size    # 배치 수는 보존되어야',
            'print("최종:", out.shape)    # (32,10)  디버깅 루틴 완료',
          ],
          highlight: [7, 8, 9, 12, 13, 15, 16, 17, 18, 20, 21, 22, 23, 26, 27, 29, 30, 31],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 연산 카탈로그 + dim 소거 다이어그램 (Step 1)
    // ─────────────────────────────────────────────────────
    function OpsBox() {
      const Cell = ({ v, hl }) => (
        <span className={`inline-flex items-center justify-center w-6 h-6 text-[10px] font-mono font-bold rounded border ${hl ? 'border-orange-500 bg-orange-100 text-orange-900' : 'border-slate-300 bg-white text-slate-700'}`}>{v}</span>
      );
      return (
        <div className="mt-1 space-y-3">
          {/* 연산 3부류 */}
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧮 연산 3부류 — 규칙이 다르다</div>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="rounded border border-sky-300 bg-sky-50 p-2">
                <div className="text-[11px] font-bold text-sky-800 font-mono">a * b</div>
                <div className="text-[9px] text-slate-600 mt-1">요소별</div>
                <div className="text-[9px] font-mono text-sky-700 mt-1">(2,3)*(2,3)<br/>→(2,3)</div>
              </div>
              <div className="rounded border border-orange-400 bg-orange-50 p-2">
                <div className="text-[11px] font-bold text-orange-800 font-mono">a @ w</div>
                <div className="text-[9px] text-slate-600 mt-1">행렬곱</div>
                <div className="text-[9px] font-mono text-orange-700 mt-1">(2,<b>3</b>)@(<b>3</b>,4)<br/>→(2,4)</div>
              </div>
              <div className="rounded border border-emerald-300 bg-emerald-50 p-2">
                <div className="text-[11px] font-bold text-emerald-800 font-mono">a.sum(dim)</div>
                <div className="text-[9px] text-slate-600 mt-1">집계</div>
                <div className="text-[9px] font-mono text-emerald-700 mt-1">축 하나<br/>사라짐</div>
              </div>
            </div>
          </div>
          {/* dim 소거 */}
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">Σ dim=k → "k번 축이 사라진다"</div>
            <div className="flex items-center justify-around gap-2">
              <div className="text-center">
                <div className="text-[9px] text-slate-500 mb-1 font-mono">a (2,3)</div>
                <div className="flex flex-col gap-1">
                  <div className="flex gap-1"><Cell v="0"/><Cell v="1"/><Cell v="2"/></div>
                  <div className="flex gap-1"><Cell v="3"/><Cell v="4"/><Cell v="5"/></div>
                </div>
              </div>
              <div className="text-center">
                <div className="text-[9px] text-orange-700 font-mono mb-1">sum(dim=0)</div>
                <div className="text-orange-500 text-lg">↓</div>
                <div className="flex gap-1 mt-1"><Cell v="3" hl/><Cell v="5" hl/><Cell v="7" hl/></div>
                <div className="text-[9px] text-slate-500 mt-1 font-mono">(3,)</div>
              </div>
              <div className="text-center">
                <div className="text-[9px] text-orange-700 font-mono mb-1">sum(dim=1)</div>
                <div className="text-orange-500 text-lg">→</div>
                <div className="flex flex-col gap-1 mt-1 items-center"><Cell v="3" hl/><Cell v="12" hl/></div>
                <div className="text-[9px] text-slate-500 mt-1 font-mono">(2,)</div>
              </div>
            </div>
            <div className="mt-2 text-[10px] text-orange-900">dim=0 은 행을 뭉개 열별 합, dim=1 은 열을 뭉개 행별 합. keepdim=True 면 (1,3)·(2,1) 로 남아 되돌리기 쉽다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 브로드캐스팅 셀 확장 애니메이션 (Step 2)
    // ─────────────────────────────────────────────────────
    function BroadcastBox() {
      // phase 0: 원본 (3,1)+(1,4) / phase 1: 확장 진행 / phase 2: 결과 (3,4)
      const [phase, setPhase] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setPhase((p) => (p + 1) % 3), 1400);
        return () => clearInterval(t);
      }, []);
      const cols = [10, 20, 30, 40];
      const rows = [1, 2, 3];
      const expanded = phase >= 1;
      const Cell = ({ v, ghost }) => (
        <span className={`inline-flex items-center justify-center w-9 h-7 text-[10px] font-mono font-bold rounded border transition-all duration-500 ${ghost ? 'border-dashed border-orange-300 bg-orange-50 text-orange-400' : 'border-orange-500 bg-orange-100 text-orange-900'}`}>{v}</span>
      );
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-xs font-bold text-orange-900">📐 (3,1) + (1,4) → (3,4) 셀 확장</div>
              <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-orange-100 text-orange-800">
                {phase === 0 ? '원본' : phase === 1 ? '1이 늘어남…' : '(3,4) 완성'}
              </span>
            </div>
            <div className="flex items-start justify-center gap-3">
              {/* col (3,1) */}
              <div className="text-center">
                <div className="text-[9px] text-slate-500 font-mono mb-1">col (3,1)</div>
                <div className="flex flex-col gap-1">
                  {rows.map((r) => (
                    <div key={r} className="flex gap-1">
                      <Cell v={r} />
                      {expanded && cols.slice(1).map((_, i) => <Cell key={i} v={r} ghost />)}
                    </div>
                  ))}
                </div>
              </div>
              <div className="text-orange-500 text-lg font-bold self-center">+</div>
              {/* row (1,4) */}
              <div className="text-center">
                <div className="text-[9px] text-slate-500 font-mono mb-1">row (1,4)</div>
                <div className="flex flex-col gap-1">
                  <div className="flex gap-1">{cols.map((c) => <Cell key={c} v={c} />)}</div>
                  {expanded && rows.slice(1).map((r) => (
                    <div key={r} className="flex gap-1">{cols.map((c) => <Cell key={c} v={c} ghost />)}</div>
                  ))}
                </div>
              </div>
              {phase === 2 && <div className="text-emerald-500 text-lg font-bold self-center">=</div>}
              {/* result */}
              {phase === 2 && (
                <div className="text-center">
                  <div className="text-[9px] text-emerald-600 font-mono mb-1">(3,4)</div>
                  <div className="flex flex-col gap-1">
                    {rows.map((r) => (
                      <div key={r} className="flex gap-1">
                        {cols.map((c) => (
                          <span key={c} className="inline-flex items-center justify-center w-9 h-7 text-[10px] font-mono font-bold rounded border border-emerald-500 bg-emerald-100 text-emerald-900">{r + c}</span>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div className="mt-2 text-[10px] text-orange-900">뒤에서부터 정렬: 0번 축 (3 vs 1→3), 1번 축 (1 vs 4→4). 점선 칸이 "1이 늘어난" 자리 — 실제 복사는 없다.</div>
          </div>
          {/* (N,) vs (N,1) 함정 */}
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-xs font-bold text-red-800 mb-2">💥 잠복 버그 — (N,) 와 (N,1) 을 섞으면</div>
            <div className="flex items-center justify-center gap-1.5 text-[11px] font-mono">
              <span className="px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">pred (4,)</span>
              <span className="text-red-600 font-bold">−</span>
              <span className="px-1.5 py-0.5 rounded bg-orange-200 text-orange-800">target (4,1)</span>
              <span className="text-red-600 font-bold">=</span>
              <span className="px-1.5 py-0.5 rounded bg-red-200 text-red-800 font-bold">(4,4) 🤯</span>
            </div>
            <div className="mt-2 text-[10px] text-red-900 text-center">에러가 아니라 조용히 4×4 로 폭발한다. 규칙상 합법이라 아무도 안 막는다. 해결: <span className="font-mono font-bold">target.squeeze(1)</span> 로 shape 통일.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // shape 변형 도구함 표 (Step 3)
    // ─────────────────────────────────────────────────────
    const TOOL_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
    function ReshapeBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🔧 shape 변형 도구함 — 목적별로 고른다</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-orange-900 border-b-2 border-orange-200">
                  <th className="text-left py-1">도구</th>
                  <th className="text-left py-1 pl-1">하는 일</th>
                  <th className="text-left py-1 pl-1">언제</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.fn} className="border-t border-orange-100">
                    <td className={`py-1 font-mono font-bold ${TOOL_TONE[r.tone]}`}>{r.fn}</td>
                    <td className="py-1 pl-1 text-slate-700">{r.act}</td>
                    <td className="py-1 pl-1 text-slate-600">{r.when}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {/* contiguous 함정 */}
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
            <div className="text-xs font-bold text-amber-900 mb-2">⚠️ view 가 실패하는 경우 — 비연속 메모리</div>
            <div className="flex items-center justify-center gap-1.5 text-[11px] font-mono flex-wrap">
              <span className="px-1.5 py-0.5 rounded bg-white border border-amber-300 text-amber-800">permute()</span>
              <span className="text-amber-600 font-bold">→</span>
              <span className="px-1.5 py-0.5 rounded bg-amber-200 text-amber-900">non-contiguous</span>
              <span className="text-amber-600 font-bold">→</span>
              <span className="px-1.5 py-0.5 rounded bg-red-200 text-red-800 font-bold">.view() 💥</span>
            </div>
            <div className="mt-2 text-[10px] text-amber-900 text-center">permute·transpose 는 데이터를 안 옮기고 "보는 순서"만 바꾼다. 해결: <span className="font-mono font-bold">.contiguous().view()</span> 또는 <span className="font-mono font-bold">reshape()</span>.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 에러 메시지 해독 다이어그램 (Step 4)
    // ─────────────────────────────────────────────────────
    const DECODE_TONE = {
      good: { chip: 'bg-emerald-200 text-emerald-900', text: 'text-emerald-800' },
      warn: { chip: 'bg-amber-200 text-amber-900', text: 'text-amber-800' },
      bad: { chip: 'bg-red-200 text-red-900', text: 'text-red-800' },
    };
    function ErrorDecodeBox({ decode }) {
      if (!decode) return null;
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-xs font-bold text-red-800 mb-2">🔎 에러 메시지 해독 — 숫자의 출처를 찾는다</div>
            <div className="rounded bg-slate-900 px-2 py-2 text-[10px] font-mono text-red-300 leading-4">
              RuntimeError: {decode.msg}
            </div>
            <div className="mt-2 space-y-1.5">
              {decode.items.map((it) => {
                const t = DECODE_TONE[it.tone];
                return (
                  <div key={it.num} className="flex items-center gap-2">
                    <span className={`inline-flex items-center justify-center min-w-9 px-1.5 py-0.5 text-[11px] font-mono font-bold rounded ${t.chip}`}>{it.num}</span>
                    <span className={`text-[10px] ${t.text}`}>{it.from}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3">
            <div className="text-[11px] font-bold text-emerald-900">✅ 판정 — 안쪽 두 숫자가 안 맞는다</div>
            <div className="mt-1 text-[10px] text-emerald-900 font-mono">{decode.verdict}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 디버깅 루틴 체크리스트 (Step 5)
    // ─────────────────────────────────────────────────────
    function DebugBox({ checklist }) {
      if (!checklist) return null;
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧪 3가지 무기 — 값 말고 shape 를 본다</div>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="rounded border border-sky-300 bg-sky-50 p-2">
                <div className="text-[11px] font-bold text-sky-800 font-mono">print(.shape)</div>
                <div className="text-[9px] text-slate-600 mt-1">층마다 찍기</div>
              </div>
              <div className="rounded border border-orange-400 bg-orange-50 p-2">
                <div className="text-[11px] font-bold text-orange-800 font-mono">assert</div>
                <div className="text-[9px] text-slate-600 mt-1">예상 명시</div>
              </div>
              <div className="rounded border border-emerald-300 bg-emerald-50 p-2">
                <div className="text-[11px] font-bold text-emerald-800 font-mono">rearrange</div>
                <div className="text-[9px] text-slate-600 mt-1">einops 이름</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">📋 실무 shape 체크리스트</div>
            <ul className="space-y-1">
              {checklist.map((c, i) => (
                <li key={i} className="flex gap-1.5 text-[10px] text-orange-900">
                  <span className="text-orange-500 font-bold">{i + 1}.</span>
                  <span>{c}</span>
                </li>
              ))}
            </ul>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2 text-center">
            <span className="text-[11px] font-bold text-emerald-900">🔑 규약: 배치 차원은 </span>
            <span className="text-[11px] font-mono font-bold px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-900">항상 0번</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — shape 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      ops:       { icon: '🧮', label: '연산 카탈로그' },
      broadcast: { icon: '📐', label: '브로드캐스팅' },
      reshape:   { icon: '🔧', label: '변형 도구함' },
      error:     { icon: '🔎', label: '에러 해독' },
      debug:     { icon: '🧪', label: '디버깅 루틴' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.ops;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>shape — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'ops' && <OpsBox />}
          {state.vis === 'broadcast' && <BroadcastBox />}
          {state.vis === 'reshape' && <ReshapeBox rows={state.toolRows} />}
          {state.vis === 'error' && <ErrorDecodeBox decode={state.decode} />}
          {state.vis === 'debug' && <DebugBox checklist={state.checklist} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">I-1-2. 텐서 연산·브로드캐스팅·shape 디버깅</h1>
                <p className="text-sm text-orange-800/80">딥러닝 버그의 8할은 shape — 규칙을 알면 에러 메시지가 읽힌다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                shape 는 딥러닝 버그의 8할이지만, 규칙은 의외로 단순하다 —
                (1) <span className="font-mono">*</span>(요소별)와 <span className="font-mono">@</span>(행렬곱)은 다른 연산이고, 집계의 <span className="font-mono">dim=k</span>는 "k번 축이 사라진다",
                (2) 브로드캐스팅은 뒤에서부터 정렬해 1이 늘어나되 <span className="font-mono">(N,)⊕(N,1)</span>은 조용히 폭발하며,
                (3) 변형 도구는 목적별로(view/squeeze/permute) 고르고 <span className="font-mono">permute</span> 뒤 <span className="font-mono">view</span>는 <span className="font-mono">contiguous</span>가 필요하다.
                (4) 에러 메시지의 숫자는 출처(배치·특징·층 in/out)를 역추적하면 읽히고, (5) <span className="font-mono">print(x.shape)</span>·<span className="font-mono">assert</span>·"배치=0번" 규약이면 대부분 곱셈 전에 잡힌다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['matmul', 'broadcast', 'dim', 'keepdim', 'view', 'reshape', 'squeeze', 'unsqueeze', 'permute', 'contiguous', 'flatten', 'x.shape', 'einops'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
