  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    PyTorch V-2-1 — 서빙 패턴 — FastAPI·배치 추론
    학습 목표: 학습을 끝낸 모델을 "요청이 몰려도 무너지지 않는" 추론 서버로 만드는 설계를 익힌다.
              (1) lifespan에서 모델 1회 로드 + eval/inference_mode 뼈대
              (2) 파이썬 추론은 CPU 바운드 — async 핸들러가 이벤트 루프를 막는 함정과 run_in_executor 처방
              (3) 동적 배칭 — 개별 요청을 잠깐 모아 배치로 (지연↑ 처리량↑↑)
              (4) 오프라인 배치 추론 — 밤새 100만 건 스코어링, 재시작 가능 설계
              (5) 서빙 스택 지도 — FastAPI vs TorchServe vs Triton vs ONNX Runtime 선택 기준
    패턴: fastapi v1 — 좌(LiveDataPane: 서버 흐름도 · 이벤트 루프 블로킹 타임라인 · 동적 배칭 큐 애니메이션 · 스택 비교표) /
          우(VSCode CodeViewer: serve_pytorch.py 진화)
    색상: orange (PyTorch 브랜드 #EE4C2C 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 서빙 뼈대 → 동시성 함정 → 동적 배칭 → 오프라인 배치 → 스택 지도
    //   state.vis : 좌측 LiveDataPane 이 그릴 시각화 종류
    //               'flow'(요청→전처리→모델→응답 흐름도) | 'block'(이벤트 루프 블로킹 타임라인)
    //               'batch'(동적 배칭 큐 애니메이션) | 'offline'(오프라인 배치 잡) | 'stack'(스택 비교표)
    //   code      : 우측 CodeViewer 파일 (serve_pytorch.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 기본 서빙 뼈대 — 모델은 딱 한 번만 로드한다',
        desc: '추론 서버의 첫 원칙은 단순하다 — 모델은 서버가 뜰 때 딱 한 번만 로드한다. 초보가 가장 자주 저지르는 실수가 요청 핸들러 안에서 torch.load()를 부르는 것인데, 그러면 요청마다 수백 MB를 디스크에서 읽고 GPU로 올리느라 응답이 초 단위로 느려지고 메모리도 터진다. FastAPI의 lifespan에서 모델을 한 번 로드해 앱 상태에 보관하고, 모든 요청이 그 하나를 공유해야 한다. 로드 직후엔 반드시 model.eval()로 Dropout·BatchNorm을 추론 모드로 바꾸고(V-1-1 연결), 예측은 torch.inference_mode() 블록 안에서 돌려 그래프 기록을 꺼야 빠르고 메모리도 적게 쓴다. 전처리(토크나이즈·정규화)는 학습 때와 반드시 동일해야 — 여기가 어긋나면 정확도가 조용히 무너진다.',
        actor: '🏗️ 서버 起動 1회 로드 → 요청마다 공유',
        engine: 'flow',
        vis: 'flow',
        engineDetail: 'lifespan 1회 로드 · eval() · inference_mode()',
        alert: { tone: 'danger', text: '요청 핸들러 안에서 torch.load() 금지! 요청마다 모델을 다시 읽으면 응답이 초 단위로 느려지고 메모리가 터진다. lifespan 에서 딱 1번 로드해 공유하라.' },
        code: {
          lang: 'python',
          filename: 'serve_pytorch.py (1/5 — 서빙 뼈대)',
          lines: [
            '"""',
            'serve_pytorch.py — PyTorch 모델을 FastAPI 로 서빙하는 최소 뼈대',
            '핵심: 모델은 lifespan 에서 1회 로드, eval()+inference_mode() 로 추론.',
            '(fastapi 주제의 의존성 주입·lifespan 개념과 상호 참조)',
            '"""',
            'from contextlib import asynccontextmanager',
            'import torch',
            'from fastapi import FastAPI',
            'from pydantic import BaseModel',
            '',
            'DEVICE = "cuda" if torch.cuda.is_available() else "cpu"',
            'ml = {}   # 앱 전역에서 공유할 모델 저장소',
            '',
            '@asynccontextmanager',
            'async def lifespan(app: FastAPI):',
            '    # ── 서버가 뜰 때 딱 한 번 실행 ──',
            '    model = torch.jit.load("model.ts", map_location=DEVICE)',
            '    model.eval()               # Dropout/BN 을 추론 모드로 (V-1-1)',
            '    ml["model"] = model.to(DEVICE)',
            '    yield                      # ← 여기서부터 요청을 받는다',
            '    ml.clear()                 # 서버 종료 시 정리',
            '',
            'app = FastAPI(lifespan=lifespan)',

            '#    sess = ort.InferenceSession("model.onnx")',
            '#    sess.run(None, {"input": x.numpy()})',
            '#    → CPU·엣지·다양한 하드웨어에서 가볍게 돌릴 때',
            '',
            '# 결론: "얼마나 크고, 팀이 무엇을 감당할 수 있는가" 로 고른다.',
            '#   다음 장(V-2-2 이후) — 느리거나 틀린 서버의 디버깅 처방전으로.',
          ],
          highlight: [5, 6, 7, 9, 10, 11, 12, 13, 15, 16, 17, 18, 19, 20, 22, 23, 24, 25, 26, 27, 29, 30],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 서버 흐름도 (요청 → 전처리 → 모델 → 응답)
    // ─────────────────────────────────────────────────────
    function FlowBox() {
      const Node = ({ icon, name, sub, color }) => (
        <div className={`flex-1 rounded-lg border-2 ${color} px-2 py-2.5 text-center`}>
          <div className="text-xl">{icon}</div>
          <div className="text-[10px] font-bold text-slate-800 mt-0.5">{name}</div>
          <div className="text-[9px] text-slate-500 font-mono">{sub}</div>
        </div>
      );
      const Arrow = () => <div className="text-orange-500 text-lg font-bold px-0.5">→</div>;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🏗️ 추론 서버 한 요청의 여정</div>
          <div className="flex items-center gap-0.5">
            <Node icon="📨" name="요청" sub="POST /predict" color="border-sky-300 bg-sky-50" />
            <Arrow />
            <Node icon="🧹" name="전처리" sub="정규화·텐서화" color="border-amber-300 bg-amber-50" />
            <Arrow />
            <Node icon="🔥" name="모델" sub="inference_mode" color="border-orange-400 bg-orange-50" />
            <Arrow />
            <Node icon="📤" name="응답" sub="softmax→JSON" color="border-emerald-300 bg-emerald-50" />
          </div>
          <div className="mt-3 rounded border-2 border-orange-400 bg-orange-50 p-2">
            <div className="text-[10px] font-bold text-orange-900 mb-1">⚙️ 서버 起動 시 (lifespan) — 딱 1번</div>
            <div className="flex items-center justify-center gap-1.5 text-[10px] font-mono">
              <span className="px-1.5 py-0.5 rounded bg-orange-200 text-orange-800">torch.load</span>
              <span className="text-orange-600">→</span>
              <span className="px-1.5 py-0.5 rounded bg-orange-200 text-orange-800">.eval()</span>
              <span className="text-orange-600">→</span>
              <span className="px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-800 font-bold">ml["model"] 공유</span>
            </div>
          </div>
          <div className="mt-2 rounded border-2 border-red-300 bg-red-50 p-2 text-center">
            <div className="text-[10px] font-bold text-red-800">🚨 요청마다 로드 = 재앙</div>
            <div className="text-[9px] text-red-900 font-mono mt-0.5">handler 안 torch.load → 응답 초 단위 · 메모리 폭발</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 이벤트 루프 블로킹 타임라인
    // ─────────────────────────────────────────────────────
    function BlockBox() {
      const Track = ({ label, cells, note }) => (
        <div className="flex items-center gap-2 mb-1.5">
          <div className="w-16 text-[9px] font-bold text-slate-700 text-right">{label}</div>
          <div className="flex-1 flex gap-0.5">{cells}</div>
          <div className="w-24 text-[9px] text-slate-600">{note}</div>
        </div>
      );
      const cell = (c, key) => <div key={key} className={`h-4 flex-1 rounded-sm ${c}`}></div>;
      // 블로킹: R1이 8칸을 독점, R2/R3는 그 뒤로 밀림
      const blocked1 = [...Array(8)].map((_, i) => cell('bg-orange-400', 'a' + i));
      const blockedWait = [...Array(8)].map((_, i) => cell('bg-red-200', 'w' + i));
      // run_in_executor: 워커 스레드로 분산, 루프는 계속 접수
      const okLoop = [...Array(8)].map((_, i) => cell(i % 3 === 0 ? 'bg-emerald-400' : 'bg-emerald-100', 'e' + i));
      const okWork = [...Array(8)].map((_, i) => cell('bg-orange-300', 'k' + i));
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="rounded border-2 border-red-300 bg-red-50 p-2 mb-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">🚨 나쁜 예 — async 안에서 그냥 model(x)</div>
            <Track label="이벤트 루프" cells={blocked1} note="R1 추론에 독점" />
            <Track label="R2 · R3" cells={blockedWait} note="계속 대기 😵" />
            <div className="text-[9px] text-red-900 mt-1">루프가 R1 추론에 붙잡혀 다른 요청을 못 받는다 → 동시성 사실상 1</div>
          </div>
          <div className="rounded border-2 border-emerald-300 bg-emerald-50 p-2">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">✅ 처방 — run_in_executor / 동기 def</div>
            <Track label="이벤트 루프" cells={okLoop} note="계속 요청 접수" />
            <Track label="워커 스레드" cells={okWork} note="추론 담당" />
            <div className="text-[9px] text-emerald-900 mt-1">무거운 추론은 스레드풀로 → 루프는 자유. + <span className="font-mono font-bold">--workers N</span> 으로 프로세스 늘려 코어 채움</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 동적 배칭 큐 애니메이션 (요청이 모여 배치로)
    // ─────────────────────────────────────────────────────
    function BatchBox() {
      const [t, setT] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setT((v) => (v + 1) % 7), 650);
        return () => clearInterval(id);
      }, []);
      // t: 0~4 요청이 쌓임, 5 flush(배치 추론), 6 결과 반환
      const filled = Math.min(t, 5);
      const flushing = t >= 5;
      const slots = [...Array(5)].map((_, i) => {
        const on = i < filled && !flushing;
        return (
          <div key={i} className={`w-8 h-8 rounded border-2 flex items-center justify-center text-sm transition-all
            ${on ? 'border-orange-400 bg-orange-100' : flushing ? 'border-slate-200 bg-slate-50' : 'border-dashed border-slate-300 bg-white'}`}>
            {on ? '📨' : ''}
          </div>
        );
      });
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">📦 동적 배칭 — 5ms 창에 모아 한 번에</div>
          <div className="flex items-center gap-2">
            <div className="text-center">
              <div className="text-[9px] font-bold text-slate-600 mb-1">큐 (window)</div>
              <div className="flex gap-1 p-1.5 rounded border-2 border-orange-300 bg-orange-50">{slots}</div>
            </div>
            <div className="text-center text-orange-600">
              <div className={`text-lg font-bold transition ${flushing ? 'opacity-100' : 'opacity-30'}`}>⚡</div>
              <div className="text-[8px] font-mono">flush</div>
            </div>
            <div className={`rounded-lg border-2 px-2 py-2 text-center transition ${flushing ? 'border-orange-500 bg-orange-100' : 'border-slate-200 bg-slate-50 opacity-50'}`}>
              <div className="text-lg">🔥</div>
              <div className="text-[9px] font-bold text-orange-900">model(batch)</div>
              <div className="text-[8px] font-mono text-orange-700">{flushing ? 'B=5 한 번에' : '대기'}</div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-orange-900">
            {t < 5 ? `요청 ${filled}건 모으는 중… (max ${'{'}32, 5ms{'}'} 중 먼저 오는 쪽)` : '⚡ 창 마감 → 배치로 한 번에 추론 → 각자에게 결과 반환'}
          </div>
          <div className="mt-2 flex items-center gap-3 text-[9px]">
            <div className="flex-1 rounded bg-amber-50 border border-amber-300 px-2 py-1 text-amber-900">지연 <span className="font-bold">소폭 ↑</span> (최대 5ms)</div>
            <div className="flex-1 rounded bg-emerald-50 border border-emerald-300 px-2 py-1 text-emerald-900">처리량 <span className="font-bold">대폭 ↑↑</span> (GPU 포화)</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 오프라인 배치 잡 (DataLoader → 저장 → 재시작)
    // ─────────────────────────────────────────────────────
    function OfflineBox() {
      const batches = [
        { id: '#1', range: '0 – 1023', done: true },
        { id: '#2', range: '1024 – 2047', done: true },
        { id: '#3', range: '2048 – 3071', done: true },
        { id: '#4', range: '3072 – 4095', done: false, crash: true },
        { id: '#5', range: '4096 – …', done: false },
      ];
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🌙 밤샘 배치 잡 — 배치마다 저장 + 재시작</div>
          <div className="space-y-1">
            {batches.map((b) => (
              <div key={b.id} className={`flex items-center gap-2 rounded border px-2 py-1
                ${b.done ? 'border-emerald-300 bg-emerald-50' : b.crash ? 'border-red-300 bg-red-50' : 'border-slate-200 bg-slate-50'}`}>
                <span className="text-[10px] font-mono font-bold text-slate-700 w-6">{b.id}</span>
                <span className="text-[9px] font-mono text-slate-600 flex-1">id {b.range}</span>
                <span className="text-[9px]">→ 🔥 model(1024)</span>
                <span className="text-[9px]">→ 💾 parquet</span>
                <span className={`text-[10px] font-bold w-16 text-right ${b.done ? 'text-emerald-700' : b.crash ? 'text-red-700' : 'text-slate-400'}`}>
                  {b.done ? '✅ done' : b.crash ? '💥 죽음' : '⏳ 대기'}
                </span>
              </div>
            ))}
          </div>
          <div className="mt-2 rounded border-2 border-orange-400 bg-orange-50 p-2 text-[10px] text-orange-900">
            <span className="font-bold">재시작</span> — done_ids.txt 에 #1~#3 기록됨. 다시 실행하면 <span className="font-mono font-bold">#4 부터</span> 이어서. 처음부터 다시 X.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 서빙 스택 비교표
    // ─────────────────────────────────────────────────────
    const STACK_TONE = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
    function StackBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-400 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🗺️ 서빙 스택 — 유연 ↔ 전용 ↔ 고성능 ↔ 경량</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-orange-900 border-b-2 border-orange-300">
                <th className="text-left py-1">스택</th>
                <th className="text-left py-1 pl-1">특징</th>
                <th className="text-left py-1 pl-1 w-16">배칭</th>
                <th className="text-left py-1 pl-1">언제</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.fn} className="border-t border-orange-200">
                  <td className="py-1 font-mono font-bold text-orange-800">{r.fn}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.mem}</td>
                  <td className={`py-1 pl-1 font-bold ${STACK_TONE[r.tone]}`}>{r.grad}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.use}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-orange-900">규모가 작고 커스텀이 많으면 <span className="font-mono font-bold">FastAPI 직접</span>, 크고 성능이 전부면 <span className="font-mono font-bold">Triton</span>.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 서빙 시각화 (orange 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      flow:    { icon: '🏗️', label: '서빙 뼈대' },
      block:   { icon: '⏱️', label: '동시성' },
      batch:   { icon: '📦', label: '동적 배칭' },
      offline: { icon: '🌙', label: '오프라인 배치' },
      stack:   { icon: '🗺️', label: '서빙 스택' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.flow;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>서빙 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            {state.engineDetail}
          </div>

          {state.vis === 'flow' && <FlowBox />}
          {state.vis === 'block' && <BlockBox />}
          {state.vis === 'batch' && <BatchBox />}
          {state.vis === 'offline' && <OfflineBox />}
          {state.vis === 'stack' && <StackBox rows={state.stackRows} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-orange-200 text-orange-900">Part 5 · 서빙</span>
                  <span className="text-[10px] text-orange-700 font-mono">V-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-orange-900">V-2-1. 서빙 패턴 — FastAPI·배치 추론</h1>
                <p className="text-sm text-orange-800/80">모델을 API로 — 요청이 몰려도 무너지지 않는 추론 서버의 설계</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                추론 서버 설계의 뼈대는 넷이다 —
                (1) 모델은 <span className="font-mono">lifespan</span> 에서 1회 로드 + <span className="font-mono">eval()</span>·<span className="font-mono">inference_mode()</span>,
                (2) CPU 바운드 추론은 <span className="font-mono">run_in_executor</span>·워커 수로 이벤트 루프 블로킹을 피하고,
                (3) 트래픽이 몰리면 <span className="font-mono">동적 배칭</span> 으로 처리량을 끌어올리며,
                (4) 실시간이 아닌 대량 작업은 <span className="font-mono">DataLoader</span> 배치 잡 + 재시작 가능 설계로 돌린다.
                규모가 커지면 TorchServe·Triton·ONNX Runtime 이 이 일들을 대신 해 준다. 다음 장은 이렇게 띄운 서버의 디버깅 처방전이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['FastAPI', 'lifespan', 'inference_mode', 'run_in_executor', 'workers', 'dynamic_batching', 'DataLoader', 'checkpoint', 'TorchServe', 'Triton', 'ONNX'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
