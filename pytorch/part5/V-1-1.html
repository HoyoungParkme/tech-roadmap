    // ─────────────────────────────────────────────────────
    // Step 1 — train/eval 스위치에 따른 Dropout·BN 동작 비교
    // ─────────────────────────────────────────────────────
    function EvalSwitchBox() {
      const [mode, setMode] = useState('eval');
      const isEval = mode === 'eval';
      // 같은 입력에 대한 출력 3회 — train 이면 흔들리고 eval 이면 고정
      const outs = isEval ? [0.62, 0.62, 0.62] : [0.41, 0.78, 0.55];
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-orange-900">🔀 같은 입력 · 3회 추론 — 스위치를 넘겨 보라</div>
            <div className="flex gap-1">
              <button onClick={() => setMode('train')} className={`px-2 py-0.5 text-[10px] rounded font-bold border ${!isEval ? 'bg-red-500 text-white border-red-500' : 'bg-white text-slate-600 border-slate-300'}`}>train()</button>
              <button onClick={() => setMode('eval')} className={`px-2 py-0.5 text-[10px] rounded font-bold border ${isEval ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-slate-600 border-slate-300'}`}>eval()</button>
            </div>
          </div>
          <div className="flex gap-2 mb-2">
            {outs.map((v, i) => (
              <div key={i} className="flex-1 text-center">
                <div className="h-16 flex items-end justify-center">
                  <div className={`w-8 rounded-t ${isEval ? 'bg-emerald-400' : 'bg-red-400'}`} style={{ height: `${v * 100}%` }}></div>
                </div>
                <div className="text-[9px] font-mono text-slate-600 mt-0.5">out{i + 1}={v.toFixed(2)}</div>
              </div>
            ))}
          </div>
          <div className={`text-[10px] font-bold text-center rounded py-1 ${isEval ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
            {isEval ? '✅ 세 번 다 동일 — 결정적(deterministic)' : '💥 매번 다름 — Dropout 이 무작위로 뉴런을 끔'}
          </div>
          <div className="mt-2 grid grid-cols-2 gap-2 text-[10px]">
            <div className="rounded border border-orange-200 bg-orange-50 p-1.5">
              <div className="font-bold text-orange-900">Dropout</div>
              <div className="text-slate-700">{isEval ? '꺼짐 — 전체 뉴런 사용' : '켜짐 — 절반 무작위 off'}</div>
            </div>
            <div className="rounded border border-orange-200 bg-orange-50 p-1.5">
              <div className="font-bold text-orange-900">BatchNorm</div>
              <div className="text-slate-700">{isEval ? '러닝 통계 사용' : '현재 배치 통계 사용'}</div>

          </div>
        </div>
      );

    // ─────────────────────────────────────────────────────
    // Step 2 — 그래프 생성 on/off 메모리·속도 게이지
    // ─────────────────────────────────────────────────────
    const GAUGE_TONE = {
      good: { bar: 'bg-emerald-400', text: 'text-emerald-700' },
      warn: { bar: 'bg-amber-400', text: 'text-amber-700' },
      bad: { bar: 'bg-red-400', text: 'text-red-700' },

    function NoGradBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🧠 그래프 기록 on/off — 메모리·속도 게이지</div>
          <div className="space-y-2.5">
            {rows.map((r) => {
              const t = GAUGE_TONE[r.tone];

                <div key={r.label}>

                    <span className="font-bold text-slate-800">{r.label}</span>

                  </div>
                  <div className="flex gap-1">
                    <div className="flex-1 h-3 rounded bg-slate-100 overflow-hidden" title="메모리(낮을수록 좋다)">

                  <div className={`text-[9px] mt-0.5 ${t.text}`}>{r.note}</div>

          </div>

        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — fp32 vs fp16 출력 차이 히스토그램
    // ─────────────────────────────────────────────────────
    function HalfBox({ histo }) {
      if (!histo) return null;
      const max = Math.max(...histo.bins);
      const pass = histo.verdict === 'pass';
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">🎚️ |fp32 − fp16| 출력 차이 분포 — 재보고 믿는다</div>
          <div className="flex items-end gap-1 h-24">
            {histo.bins.map((c, i) => (
              <div key={i} className="flex-1 flex flex-col items-center justify-end">
                <div className="w-full rounded-t bg-orange-400" style={{ height: `${(c / max) * 100}%` }}></div>
              </div>
            ))}
          </div>
          <div className="flex justify-between text-[9px] text-slate-500 font-mono mt-0.5">
            <span>0</span><span>차이 크기 (abs diff) →</span><span>1e-2</span>
          </div>
          <div className="mt-2 grid grid-cols-2 gap-2 text-[10px]">
            <div className="rounded border border-orange-200 bg-orange-50 p-1.5 font-mono">
              <span className="text-slate-600">max diff</span> <span className="font-bold text-slate-800">{histo.maxDiff}</span>
            </div>
            <div className="rounded border border-orange-200 bg-orange-50 p-1.5 font-mono">
              <span className="text-slate-600">mean diff</span> <span className="font-bold text-slate-800">{histo.meanDiff}</span>
            </div>
          </div>
          <div className={`mt-2 text-[10px] font-bold text-center rounded py-1 ${pass ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
            {pass ? '✅ max diff < 1e-2 — 정확도 유지 확인, 배포 OK' : '💥 차이 과다 — 배포 보류'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 배치 크기별 처리량 곡선
    // ─────────────────────────────────────────────────────
    function BatchBox({ curve }) {
      if (!curve) return null;
      const maxThr = Math.max(...curve.points.map((p) => p.thr));
      const W = 260, H = 110, padL = 26, padB = 18;
      const n = curve.points.length;
      const xAt = (i) => padL + (i / (n - 1)) * (W - padL - 6);
      const yAt = (thr) => H - padB - (thr / maxThr) * (H - padB - 6);
      const path = curve.points.map((p, i) => `${i === 0 ? 'M' : 'L'}${xAt(i).toFixed(1)},${yAt(p.thr).toFixed(1)}`).join(' ');
      const kneeIdx = curve.points.findIndex((p) => p.bs === curve.knee);
      return (
        <div className="mt-1 rounded-lg border-2 border-orange-300 bg-white p-3">
          <div className="text-xs font-bold text-orange-900 mb-2">📦 배치 크기별 처리량(throughput) — 무릎을 찾는다</div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
            <line x1={padL} y1={H - padB} x2={W - 4} y2={H - padB} stroke="#cfc9ba" strokeWidth="1" />
            <line x1={padL} y1="4" x2={padL} y2={H - padB} stroke="#cfc9ba" strokeWidth="1" />
            <path d={path} fill="none" stroke="#f97316" strokeWidth="2" />
            {curve.points.map((p, i) => (
              <g key={p.bs}>
                <circle cx={xAt(i)} cy={yAt(p.thr)} r={i === kneeIdx ? 4 : 2.5} fill={i === kneeIdx ? '#059669' : '#f97316'} />
                <text x={xAt(i)} y={H - padB + 12} fontSize="7" fill="#8a8578" textAnchor="middle" fontFamily="monospace">{p.bs}</text>
              </g>
            ))}
            {kneeIdx >= 0 && (
              <text x={xAt(kneeIdx)} y={yAt(curve.points[kneeIdx].thr) - 7} fontSize="8" fill="#059669" textAnchor="middle" fontWeight="bold">무릎 bs={curve.knee}</text>
            )}
            <text x="4" y="12" fontSize="7" fill="#8a8578" fontFamily="monospace">건/s</text>
          </svg>
          <div className="mt-1 text-[10px] text-orange-900">1건씩(bs=1)은 GPU 가 논다. 배치를 키우면 처리량이 뛰다가 <span className="font-bold text-emerald-700">bs={curve.knee}</span> 부근에서 포화 — 그 이상은 지연만 는다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 추론 체크리스트 + 흔한 실수
    // ─────────────────────────────────────────────────────
    function ChecklistBox({ checkRows, mistakes }) {
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">✅ 추론 표준 조합 — 이 순서로 못박는다</div>
            <div className="space-y-1.5">
              {checkRows.map((r) => (
                <div key={r.item} className="flex items-center gap-2 text-[10px]">
                  <span className="text-emerald-600 font-bold">✓</span>
                  <span className="font-mono font-bold text-orange-800 w-44">{r.item}</span>
                  <span className="text-slate-700 flex-1">{r.why}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-xs font-bold text-red-800 mb-2">💥 현업 3대 실수</div>
            <div className="space-y-1.5">
              {mistakes.map((m) => (
                <div key={m.label} className="flex items-start gap-2 text-[10px]">
                  <span className="px-1.5 py-0.5 rounded bg-red-200 text-red-800 font-bold whitespace-nowrap">{m.label}</span>
                  <span className="text-slate-700 flex-1">{m.text}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-900', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300',  text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',    text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      evalswitch: { icon: '🔀', label: 'eval 스위치' },
      nograd:     { icon: '🧠', label: '그래프 off' },
      half:       { icon: '🎚️', label: '정밀도 추론' },
      batch:      { icon: '📦', label: '배치 최적화' },
      checklist:  { icon: '✅', label: '추론 체크리스트' },
    };

    function LiveDataPane({ state }) {

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>추론 최적화 — {eng.label}</span>

          {state.vis === 'half' && <HalfBox histo={state.histo} />}
          {state.vis === 'batch' && <BatchBox curve={state.curve} />}

    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🔥</span>
              <div>
                <span className="inline-block px-2 py-0.5 mb-1 text-[10px] rounded-full bg-orange-200 text-orange-900 font-bold">Part 5 · 추론과 배포</span>
                <h1 className="text-2xl font-bold text-orange-900">V-1-1. 추론 모드 — eval·no_grad·half</h1>
                <p className="text-sm text-orange-800/80">학습이 끝난 모델을 서비스로 — 추론 전용 최적화의 3단 기어</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                추론 최적화는 3단 기어다 — (1) <span className="font-mono">model.eval()</span> 로 Dropout/BN 을 추론 모드로 고정하고,
                (2) <span className="font-mono">torch.inference_mode()</span> 로 그래프 기록을 끊어 메모리·속도를 벌고,
                (3) <span className="font-mono">autocast/half()</span> 로 정밀도를 낮추되 fp32 대비 출력 차이를 반드시 재본다.
                여기에 배치 추론과 <span className="font-mono">torch.compile</span> 로 처리량을 끌어올리면 2.x 시대 추론 표준 조합이 완성된다.
                다음 장에서는 이 모델을 <span className="font-mono">TorchScript·ONNX</span> 로 내보내 파이썬 없는 프로덕션에서 돌린다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['model.eval', 'Dropout', 'BatchNorm', 'no_grad', 'inference_mode', 'half', 'autocast', 'fp16', 'batch inference', 'torch.compile', 'throughput'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
