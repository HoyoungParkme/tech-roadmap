    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL I-1-2 — 활성화 함수 — sigmoid→ReLU 계보
    학습 목표: 활성화 없이 층을 쌓으면 선형 하나로 접힌다는 사실을 수식으로 확인하고,
              sigmoid의 포화 → 기울기 소실(0.25^10) 체험 → ReLU 혁명 → 현대 선택 지도까지
              5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 곡선+미분 플롯 · 층별 기울기 감쇠 막대 · 활성화 히트맵)
          / 우(VSCode CodeViewer: activations.py 진화)
    색상: indigo (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 수학 함수 정의 — 곡선 플롯용 (x: -6 ~ 6)
    // ─────────────────────────────────────────────────────
    const sigmoid = (x) => 1 / (1 + Math.exp(-x));
    const FN = {
      linear:    { f: (x) => 0.5 * x,                          d: (x) => 0.5 },
      sigmoid:   { f: (x) => sigmoid(x),                       d: (x) => sigmoid(x) * (1 - sigmoid(x)) },
      relu:      { f: (x) => Math.max(0, x),                   d: (x) => (x > 0 ? 1 : 0) },
      leaky:     { f: (x) => (x > 0 ? x : 0.1 * x),            d: (x) => (x > 0 ? 1 : 0.1) },
      gelu:      { f: (x) => 0.5 * x * (1 + Math.tanh(Math.sqrt(2 / Math.PI) * (x + 0.044715 * x ** 3))),
                   d: (x) => { const h = 1e-4; return (FN.gelu.f(x + h) - FN.gelu.f(x - h)) / (2 * h); } },
      // 선형 3층 합성: 0.8·(1.5·(0.5x)) = 0.6x — 아무리 쌓아도 직선
      linstack:  { f: (x) => 0.8 * (1.5 * (0.5 * x)),          d: (x) => 0.6 },
      // ReLU 1개만 끼워도 구부러진다: 0.8·relu(1.5·(0.5x + 1)) - 1
      bentstack: { f: (x) => 0.8 * Math.max(0, 1.5 * (0.5 * x + 1)) - 1, d: (x) => (0.5 * x + 1 > 0 ? 0.6 : 0) },
    };

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {
        lang: 'python',
        filename: 'activations.py (v1 — 선형 접힘 증명)',
        lines: [
          '"""',
          'activations.py — v1: 활성화 없는 심층망은 선형 하나로 접힌다',
          '수식이 아니라 numpy 로 직접 확인한다',
          '"""',
          'import numpy as np',
          '',
          'rng = np.random.default_rng(42)',
          '',
          '# 3층짜리 "심층" 네트워크 — 활성화 함수 없음',
          'W1 = rng.normal(size=(4, 3))   # 입력 3 → 은닉 4',
          'W2 = rng.normal(size=(4, 4))   # 은닉 4 → 은닉 4',
          'W3 = rng.normal(size=(2, 4))   # 은닉 4 → 출력 2',
          '',
          'x = rng.normal(size=(3,))',
          '',
          '# 층을 하나씩 통과 (활성화 없이)',
          'deep_out = W3 @ (W2 @ (W1 @ x))',
          '',
          '# 행렬 셋을 미리 곱해 "1층" 으로 접기',
          'W_folded = W3 @ W2 @ W1        # shape (2, 3)',
          'shallow_out = W_folded @ x',
          '',
          'print(np.allclose(deep_out, shallow_out))  # True !',
          '# 3층이든 100층이든 결과는 행렬 "하나" 와 완전히 같다',
          '# → 표현력 = 1층 선형 회귀. XOR 도 못 푼다.',
          '',
          '# 비선형을 한 번만 끼우면 접힘이 깨진다',
          'relu = lambda z: np.maximum(0, z)',
          'bent_out = W3 @ relu(W2 @ (W1 @ x))',
          'print(np.allclose(bent_out, shallow_out))  # False',
          '',
          '# 결론: 활성화 함수 = 직선을 구부리는 힘.',
          '# 없으면 "깊이" 는 계산 낭비일 뿐이다.',
        ],
      },
      s2: {
        lang: 'python',
        filename: 'activations.py (v2 — sigmoid와 미분)',
        lines: [
          '"""',
          'activations.py — v2: sigmoid 와 그 미분',
          '미분 곡선의 "최대 0.25" 를 눈으로 확인한다',
          '"""',
          'import numpy as np',
          '',

    // ─────────────────────────────────────────────────────
    // 함수 곡선 SVG 플롯 — f(x) 실선 + f'(x) 점선
    // ─────────────────────────────────────────────────────
    function CurvePlot({ plot }) {
      if (!plot) return null;
      const W = 460, H = 200, PAD = 24;
      const X_MIN = -6, X_MAX = 6;
      const { yMin, yMax } = plot;
      const sx = (x) => PAD + ((x - X_MIN) / (X_MAX - X_MIN)) * (W - 2 * PAD);
      const sy = (y) => H - PAD - ((y - yMin) / (yMax - yMin)) * (H - 2 * PAD);
      const N = 120;

      const pathFor = (fnKey, useDeriv) => {
        const def = FN[fnKey];
        const g = useDeriv ? def.d : def.f;
        let d = '';
        for (let i = 0; i <= N; i++) {
          const x = X_MIN + (i / N) * (X_MAX - X_MIN);
          let y = g(x);
          y = Math.max(yMin, Math.min(yMax, y));
          d += `${i === 0 ? 'M' : 'L'}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`;
        }
        return d;
      };

      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-indigo-900 mb-1">📈 {plot.title}</div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label={plot.title}>
            {/* 포화 구간 음영 (sigmoid 단계) */}
            {plot.saturation && (
              <g>
                <rect x={sx(-6)} y={PAD} width={sx(-4) - sx(-6)} height={H - 2 * PAD} fill="#fecdd3" opacity="0.45" />
                <rect x={sx(4)} y={PAD} width={sx(6) - sx(4)} height={H - 2 * PAD} fill="#fecdd3" opacity="0.45" />
                <text x={sx(-5)} y={PAD + 12} fontSize="9" fill="#be123c" textAnchor="middle">포화</text>
                <text x={sx(5)} y={PAD + 12} fontSize="9" fill="#be123c" textAnchor="middle">포화</text>
              </g>
            )}
            {/* 축 */}
            <line x1={sx(X_MIN)} y1={sy(0)} x2={sx(X_MAX)} y2={sy(0)} stroke="#cfc9ba" strokeWidth="1" />
            <line x1={sx(0)} y1={PAD} x2={sx(0)} y2={H - PAD} stroke="#cfc9ba" strokeWidth="1" />
            {[-4, -2, 2, 4].map((t) => (
              <text key={t} x={sx(t)} y={sy(0) + 11} fontSize="8" fill="#8a8578" textAnchor="middle">{t}</text>
            ))}
            {/* 곡선들 */}
            {plot.curves.map((c, i) => (
              <path key={i} d={pathFor(c.fn, c.deriv)} fill="none" stroke={c.color}
                    strokeWidth={c.deriv ? 1.5 : 2.2} strokeDasharray={c.dash ? '5,4' : 'none'} />
            ))}
            {/* 마커 (σ' 최대점 등) */}
            {(plot.markers || []).map((m, i) => (
              <g key={i}>
                <circle cx={sx(m.x)} cy={sy(m.y)} r="3.5" fill="#e11d48" />
                <text x={sx(m.x) + 6} y={sy(m.y) - 6} fontSize="9" fontWeight="bold" fill="#e11d48">{m.label}</text>
              </g>
            ))}
          </svg>
          <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-1">
            {plot.curves.map((c, i) => (
              <span key={i} className="flex items-center gap-1 text-[9px] text-slate-600">
                <span className="inline-block w-4 border-t-2" style={{ borderColor: c.color, borderStyle: c.dash ? 'dashed' : 'solid' }}></span>
                {c.label}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 층별 기울기 감쇠 막대 — sigmoid vs ReLU
    // ─────────────────────────────────────────────────────
    function DecayBars({ decay }) {
      if (!decay) return null;
      const layers = Array.from({ length: decay.layers }, (_, i) => decay.layers - i); // 10 → 1
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-indigo-900 mb-1.5">🕳 {decay.title}</div>
          <div className="space-y-1">
            {layers.map((layer) => (
              <div key={layer} className="flex items-center gap-1.5">
                <span className="text-[9px] font-mono text-slate-500 w-14 text-right">
                  layer {layer}{layer === decay.layers ? ' 출력' : layer === 1 ? ' 입력' : ''}
                </span>
                <div className="flex-1 space-y-0.5">
                  {decay.series.map((s) => {
                    const mag = Math.pow(s.factor, decay.layers - layer); // 출력층=1.0
                    const pct = Math.max(mag * 100, 0.4);
                    return (
                      <div key={s.name} className="flex items-center gap-1">
                        <div className="flex-1 h-2 rounded-sm bg-slate-100 overflow-hidden">
                          <div className={`h-full ${s.color} transition-all duration-700`} style={{ width: `${pct}%` }} />
                        </div>
                        <span className="text-[8px] font-mono text-slate-500 w-16">{mag >= 0.001 ? mag.toFixed(3) : mag.toExponential(0)}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          <div className="mt-1.5 flex gap-3">
            {decay.series.map((s) => (
              <span key={s.name} className="flex items-center gap-1 text-[9px] text-slate-600">
                <span className={`inline-block w-3 h-2 rounded-sm ${s.color}`}></span>{s.name}
              </span>
            ))}
          </div>
          <div className="mt-1 text-[9px] text-slate-500">역전파 방향: layer 10(출력) → layer 1(입력). 층마다 활성화 미분을 곱한다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 뉴런 활성화 히트맵 — ReLU 희소 활성화 (결정적 의사난수)
    // ─────────────────────────────────────────────────────
    function ActivationHeatmap({ heatmap }) {
      if (!heatmap) return null;
      const cells = [];
      for (let r = 0; r < heatmap.rows; r++) {
        for (let c = 0; c < heatmap.cols; c++) {
          // 결정적 의사난수 — 렌더마다 같은 그림
          const v = Math.abs(Math.sin(r * 12.9898 + c * 78.233) * 43758.5453) % 1;
          const alive = v < heatmap.aliveRatio;
          cells.push({ key: `${r}-${c}`, alive, intensity: alive ? 0.3 + v : 0 });
        }
      }
      const aliveCount = cells.filter((c) => c.alive).length;
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-indigo-900 mb-1.5">🔥 {heatmap.title}</div>
          <div className="grid gap-0.5" style={{ gridTemplateColumns: `repeat(${heatmap.cols}, minmax(0, 1fr))` }}>
            {cells.map((c) => (
              <div key={c.key} className="aspect-square rounded-sm"
                   style={{ backgroundColor: c.alive ? `rgba(79, 70, 229, ${Math.min(c.intensity, 1)})` : '#e7e5e4' }}
                   title={c.alive ? '활성 (>0)' : '출력 0'} />
            ))}
          </div>
          <div className="mt-1 text-[9px] text-slate-500">
            켜진 뉴런 {aliveCount}/{cells.length} ({Math.round((aliveCount / cells.length) * 100)}%) — 절반쯤 꺼진 희소 표현. 입력이 바뀌면 다른 조합이 켜진다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 선형 접힘 박스 (Step 1)

    function CollapseBox({ box }) {

        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-white p-3">

    // 현대 선택표 (Step 5) — 은닉층 / 출력층

    function ChooseBox({ box }) {
      if (!box) return null;

            <tbody>

            </tbody>

      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-500 bg-gradient-to-br from-indigo-50 to-sky-50 p-3">

                   rows={box.hidden.map((h) => [h.where, h.pick, h.why])} />
            <Table caption="출력층 — 문제 유형이 결정" cols={['문제', '선택', '이유']}
                   rows={box.output.map((o) => [o.problem, o.pick, o.why])} />
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>

      );
    }

          </div>
          <CurvePlot plot={state.plot} />

          <ProsConsBox box={state.prosCons} />
          <DecayBars decay={state.decay} />
          <ActivationHeatmap heatmap={state.heatmap} />
          <ChooseBox box={state.chooseBox} />
          <AlertBox alert={state.alert} />

      );
    }

    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-400/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-sky-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">I-1-2. 활성화 함수 — sigmoid→ReLU 계보</h1>
                <p className="text-sm text-indigo-800/80">비선형이 없으면 백 층을 쌓아도 직선 하나 — 그리고 sigmoid가 버려진 이유</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-500' : 'bg-indigo-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-indigo-800 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-indigo-400 bg-white text-indigo-800 hover:bg-indigo-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-indigo-400 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-800 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-indigo-400 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-500 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                활성화 함수는 행렬곱 연쇄의 "선형 접힘"을 깨는 유일한 장치다 — 없으면 백 층도 직선 하나.
                sigmoid는 확률 해석이라는 매력에도 미분 최대 0.25 탓에 10층이면 신호가 0.25¹⁰(백만분의 1)로 소멸해 은닉층에서 퇴출됐고,
                양수 구간 기울기 1인 ReLU가 딥러닝 부활의 방아쇠가 됐다(dying ReLU는 Leaky/ELU로 보완).
                실무 기본값: 은닉층 ReLU(Transformer는 GELU), 출력층은 회귀 linear · 이진 sigmoid · 다중 softmax.
                다음 장에서는 이 미분값들이 실제로 뒤로 흐르는 메커니즘 — 역전파를 해부한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['활성화함수', '비선형', '선형접힘', 'sigmoid', '포화', '기울기소실', 'ReLU', 'dyingReLU', 'LeakyReLU', 'GELU', 'softmax'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-900 border border-indigo-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-800">
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
