  <!--
    DL I-2-1 — 역전파 완전 해부 — 체인룰
    학습 목표: "가중치 100만 개를 하나씩 흔들어보기(수치 미분)"의 불가능함에서 출발해,
              미분 = 책임 배분 → 체인룰(국소 미분의 곱) → 역방향 한 번에(δ 전파) →
              forward→loss→backward→update 학습 사이클 완성까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 작은 신경망에 순전파 값/역전파 기울기가 흐르는 시뮬레이션)
          / 우(VSCode CodeViewer: backprop.py — 순수 numpy 구현 진화)
    색상: indigo (dl 도메인) + 순전파 blue / 역전파(기울기) red
    검증용 실제 숫자: x=1.0, y=1.0, w1=0.5, w2=-0.3, w3=0.8, w4=0.4
      z1=0.5  a1=σ(0.5)=0.6225 / z2=-0.3  a2=σ(-0.3)=0.4256
      ŷ=0.8·0.6225+0.4·0.4256=0.6682 / L=½(ŷ-y)²=0.0551
      δ=∂L/∂ŷ=ŷ-y=-0.3318
      ∂L/∂w3=δ·a1=-0.2066  ∂L/∂w4=δ·a2=-0.1412
      ∂L/∂w1=δ·w3·a1(1-a1)·x=-0.0624  ∂L/∂w2=δ·w4·a2(1-a2)·x=-0.0324
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 수치 미분의 벽 → 책임 배분 → 체인룰 → 역방향 한 번에 → 학습 사이클
    //   net: 좌측 신경망 다이어그램 상태
    //     showForward  : 노드에 순전파 값 표시
    //     showGrads    : ∂L/∂w 를 표시할 가중치 목록
    //     highlightPath: 체인룰 경로 강조 (edge id 목록)
    //     animForward / animBackward : 파란/빨간 점 애니메이션
    //   code: 우측 CodeViewer (backprop.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 문제 설정 — 가중치 100만 개를 하나씩 흔들 수는 없다',

        actor: '🧮 수치 미분: 가중치 1개 = forward 1번',
        phase: 'problem',
        phaseDetail: '수치 미분 — O(가중치 수) forward',
        net: { showForward: false, showGrads: [], highlightPath: [], animForward: false, animBackward: false, gradUnknown: true },
        costTable: {
          title: '수치 미분의 청구서 — 한 걸음(1 step)당 forward 횟수',
          rows: [
            { model: '이 페이지의 장난감 네트워크', params: '4개', fwd: '4번', verdict: 'ok', note: '문제없음' },
            { model: '작은 MLP (MNIST)', params: '10만 개', fwd: '10만 번', verdict: 'warn', note: '1 step에 수 분' },
            { model: 'ResNet-50', params: '2,500만 개', fwd: '2,500만 번', verdict: 'bad', note: '1 step에 수 시간' },
            { model: 'GPT급 LLM', params: '수십억 개', fwd: '수십억 번', verdict: 'bad', note: '학습 불가능 🔥' },
          ],
        },
        alert: { tone: 'danger', text: '학습은 이 "한 걸음"을 수십만 번 반복하는 일이다. 걸음당 forward가 가중치 수에 비례하면 게임 끝 — "한 번에 전부" 계산하는 다른 길이 필요하다.' },
        code: {
          lang: 'python',
          filename: 'backprop.py (v1 — 수치 미분의 벽)',
          lines: [
            '"""',
            'backprop.py — v1: 가장 원초적인 기울기 계산, 수치 미분',
            '',
            '아이디어: 가중치 w 를 ε 만큼 올려보고 손실 변화를 잰다',
            '  ∂L/∂w ≈ ( L(w+ε) - L(w-ε) ) / 2ε',
            '"""',
            'import numpy as np',
            '',
            '',
            'def numerical_gradient(loss_fn, weights: np.ndarray,',
            '                       eps: float = 1e-4) -> np.ndarray:',
            '    """가중치를 하나씩 흔들어 기울기를 재는 무식한 방법.',
            '',
            '    Args:',
            '        loss_fn: weights -> loss 를 계산하는 함수 (forward 전체)',
            '        weights: 현재 가중치 벡터',
            '    Returns:',
            '        각 가중치에 대한 ∂L/∂w 근사값',
            '    """',
            '    grads = np.zeros_like(weights)',
            '    for i in range(len(weights)):      # ← 가중치 수만큼 반복!',
            '        orig = weights[i]',
            '        weights[i] = orig + eps',
            '        loss_plus = loss_fn(weights)   # forward 1번',
            '        weights[i] = orig - eps',
            '        loss_minus = loss_fn(weights)  # forward 또 1번',
            '        weights[i] = orig',
            '        grads[i] = (loss_plus - loss_minus) / (2 * eps)',
            '    return grads',
            '',
            '',
            '# 비용 계산서:',
            '#   가중치 N개 → 한 걸음(1 step)에 forward 2N번',
            '#   N = 1,000,000 이면?  → forward 2,000,000번 / step',
            '#   학습 = 수십만 step  → 우주가 끝날 때까지 돌려도 안 끝남',
            '#',
            '# 필요한 것: forward 1번 + backward 1번으로',
            '#            "모든" ∂L/∂w 를 한꺼번에 얻는 방법 = 역전파',
          ],
          highlight: [4, 5, 21, 22, 23, 24, 25, 26, 27, 28, 33, 34, 35, 37, 38],
        },
      },
      {
        title: 'Step 2. 미분 = 책임 배분 — ∂L/∂w 는 "이 가중치의 책임"이다',
        desc: '수식을 걷어내고 ∂L/∂w의 뜻부터 잡자: "이 가중치를 아주 조금 올리면 손실이 얼마나 변하는가" — 즉 지금 손실에 대한 이 가중치의 책임 지분이다. 작은 네트워크(입력 1 → 은닉 2 → 출력 1, 가중치 4개)에 실제 숫자를 흘려보면, 정답 y=1.0인데 예측 ŷ=0.668이 나와 손실이 0.055 발생했다. 이때 ∂L/∂w3=-0.207은 "w3를 조금 올리면 손실이 그 비율로 줄어든다(음수니까)"는 뜻이고, ∂L/∂w2=-0.032는 w2의 책임이 훨씬 작다는 뜻이다. 기울기의 부호는 고칠 방향을, 크기는 책임의 크기를 알려준다 — 학습이란 이 책임 지분대로 가중치를 조금씩 고치는 일의 반복이다. 남은 문제는 단 하나: 이 책임을 어떻게 "계산"하느냐다.',
        actor: '⚖️ 손실 0.0551 의 책임을 가중치 4개에 배분',
        phase: 'forward',
        phaseDetail: 'forward 완료 — ŷ=0.668, L=0.0551',
        net: { showForward: true, showGrads: ['w1', 'w2', 'w3', 'w4'], highlightPath: [], animForward: true, animBackward: false },
        respBox: {
          title: '책임 지분표 — |∂L/∂w| 가 클수록 손실에 대한 영향이 크다',
          rows: [
            { w: 'w3 (h1→ŷ)', grad: -0.2066, mag: 100 },
            { w: 'w4 (h2→ŷ)', grad: -0.1412, mag: 68 },
            { w: 'w1 (x→h1)', grad: -0.0624, mag: 30 },
            { w: 'w2 (x→h2)', grad: -0.0324, mag: 16 },
          ],
        },
        alert: { tone: 'info', text: '부호가 음수 = "올리면 손실이 준다" → 올리는 방향으로 업데이트. 크기가 큰 w3부터 많이 움직인다. 이 표를 "계산"하는 방법이 다음 단계의 체인룰이다.' },
        code: {
          lang: 'python',
          filename: 'backprop.py (v2 — 작은 네트워크 forward)',

            '"""',
            'import numpy as np',
            '',
            '',
            'def sigmoid(z: float) -> float:',
            '    return 1.0 / (1.0 + np.exp(-z))',
            '',
            '',
            'def forward(x: float, w: dict) -> float:',
            '    """순전파: 입력 → 은닉 → 출력."""',
            '    z1 = w["w1"] * x          # z1 = 0.5*1.0  = 0.5',

          terms: [

                stroke={id === 'L' ? '#dc2626' : '#6366f1'} strokeWidth="2" />
              <text x={n.cx} y={n.cy + 4} textAnchor="middle" fontSize="12" fontWeight="bold"
                fill={id === 'L' ? '#b91c1c' : '#3730a3'}>{n.label}</text>
              {net.showForward && (
                <text x={n.cx} y={n.cy + (n.cy > 110 ? 36 : -28)} textAnchor="middle"
                  fontSize="9" fill="#1d4ed8" fontWeight="bold" fontFamily="monospace">{n.val}</text>
              )}
              {net.showForward && n.z && (
                <text x={n.cx} y={n.cy + (n.cy > 110 ? 46 : -38)} textAnchor="middle"
                  fontSize="8" fill="#64748b" fontFamily="monospace">{n.z}</text>
              )}
            </g>
          ))}
          {/* 범례 */}
          <g fontSize="8.5" fontFamily="monospace">
            <circle cx="12" cy="14" r="3.5" fill="#3b82f6" />
            <text x="20" y="17" fill="#1d4ed8">순전파 (값)</text>
            <circle cx="12" cy="28" r="3.5" fill="#dc2626" />
            <text x="20" y="31" fill="#b91c1c">역전파 (기울기 δ)</text>
          </g>
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 수치 미분 비용표
    // ─────────────────────────────────────────────────────
    function CostTable({ box }) {
      if (!box) return null;
      const tone = { ok: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700' };
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">💸 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-red-800 border-b border-red-200">
                <th className="text-left py-0.5">모델</th>
                <th className="text-right py-0.5">가중치</th>
                <th className="text-right py-0.5">forward/step</th>
                <th className="text-left py-0.5 pl-2">판정</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.model} className="border-t border-red-100">
                  <td className="py-1 text-slate-800">{r.model}</td>
                  <td className="py-1 text-right font-mono">{r.params}</td>
                  <td className="py-1 text-right font-mono font-bold">{r.fwd}</td>
                  <td className={`py-1 pl-2 font-bold ${tone[r.verdict]}`}>{r.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 책임 지분 막대
    // ─────────────────────────────────────────────────────
    function RespBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-white p-3">
          <div className="text-xs font-bold text-indigo-900 mb-2">⚖️ {box.title}</div>
          <div className="space-y-1.5">
            {box.rows.map((r) => (
              <div key={r.w} className="flex items-center gap-2 text-[10px]">
                <span className="w-20 font-mono text-slate-700">{r.w}</span>
                <div className="flex-1 h-3 rounded bg-indigo-50 border border-indigo-100 overflow-hidden">
                  <div className="h-full bg-red-400 transition-all duration-700" style={{ width: `${r.mag}%` }} />
                </div>
                <span className="w-16 text-right font-mono font-bold text-red-700">{r.grad.toFixed(4)}</span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-slate-600">모두 음수 → 4개 전부 "올리면 손실이 주는" 방향. w3의 책임이 w2의 6배 이상.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 체인룰 곱 조립
    // ─────────────────────────────────────────────────────
    function ChainBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-1.5">🔗 {box.title}</div>
          <div className="text-[10px] font-mono text-slate-700 mb-2 px-2 py-1 rounded bg-white border border-amber-200">{box.warmup}</div>
          <div className="flex items-stretch gap-1 flex-wrap">
            {box.terms.map((t, i) => (
              <React.Fragment key={t.sym}>
                {i > 0 && <div className="flex items-center text-amber-600 font-bold">×</div>}
                <div className="flex-1 min-w-[70px] rounded border-2 border-amber-300 bg-white p-1.5 text-center">
                  <div className="text-[10px] font-mono font-bold text-indigo-900">{t.sym}</div>
                  <div className="text-[9px] font-mono text-slate-600">= {t.formula}</div>
                  <div className="text-[11px] font-mono font-bold text-red-700">{t.val}</div>
                  <div className="text-[8px] text-slate-500">{t.where}</div>
                </div>
              </React.Fragment>
            ))}
          </div>
          <div className="mt-2 text-[10px] font-mono font-bold text-red-800 px-2 py-1 rounded bg-white border border-red-200">{box.result}</div>
          <div className="mt-1 text-[10px] text-emerald-700 font-bold">{box.check}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — δ 릴레이 표
    // ─────────────────────────────────────────────────────
    function DeltaBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-400 bg-white p-3">
          <div className="text-xs font-bold text-red-800 mb-2">🔴 {box.title}</div>
          <div className="space-y-1.5">
            {box.rows.map((r, i) => (
              <div key={r.at} className="flex gap-2 items-start">
                <span className="w-14 shrink-0 text-[10px] font-bold text-indigo-900 pt-0.5">{i === 0 ? '' : '↓ '}{r.at}</span>
                <div className="flex-1 rounded border border-red-200 bg-red-50 px-2 py-1">
                  <div className="text-[10px] font-mono font-bold text-red-800">{r.delta}</div>
                  <div className="text-[9px] font-mono text-slate-600">{r.use}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-700">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 업데이트 표 + 손실 감소 + 예고 2종
    // ─────────────────────────────────────────────────────
    function CycleBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-500 bg-gradient-to-br from-indigo-50 to-emerald-50 p-3">
          <div className="text-xs font-bold text-indigo-900 mb-2">🔄 {box.title}</div>
          <table className="w-full text-[10px] mb-2">
            <thead>
              <tr className="text-indigo-900 border-b border-indigo-300">
                <th className="text-left py-0.5">가중치</th>
                <th className="text-right py-0.5">현재</th>
                <th className="text-right py-0.5">∂L/∂w</th>
                <th className="text-right py-0.5">w − lr·∂L/∂w</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.w} className="border-t border-indigo-100 font-mono">
                  <td className="py-0.5 font-bold">{r.w}</td>
                  <td className="py-0.5 text-right">{r.old}</td>
                  <td className="py-0.5 text-right text-red-700">{r.grad}</td>
                  <td className="py-0.5 text-right font-bold text-emerald-700">{r.neu}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="flex items-center gap-2 text-[11px] font-mono mb-2">
            <span className="px-2 py-0.5 rounded bg-red-100 text-red-800 font-bold">L = {box.lossBefore.toFixed(4)}</span>
            <span className="text-indigo-600">→ 1 step →</span>
            <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">L = {box.lossAfter.toFixed(4)}</span>
            <span className="text-emerald-700 font-bold">(−52%)</span>
          </div>
          <div className="text-[10px] text-amber-900 rounded border border-amber-300 bg-amber-50 px-2 py-1 mb-1.5">{box.vanish}</div>
          <div className="text-[10px] text-indigo-900 rounded border border-indigo-300 bg-white px-2 py-1">{box.autodiff}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 신경망 기울기 계산 시뮬레이션 (indigo 톤)
    // ─────────────────────────────────────────────────────
    const PHASE_BADGE = {
      problem:  { icon: '🧮', label: '수치 미분의 벽' },
      forward:  { icon: '⚖️', label: '책임 배분' },
      chain:    { icon: '🔗', label: '체인룰' },
      backward: { icon: '🔴', label: 'δ 역전파' },
      cycle:    { icon: '🔄', label: '학습 사이클' },
    };

    function LiveDataPane({ state }) {
      const ph = PHASE_BADGE[state.phase] || PHASE_BADGE.problem;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
              <span>{ph.icon}</span>
              <span>계산 그래프 — {ph.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-indigo-700 font-mono mb-2 px-2 py-1 rounded bg-indigo-50 border border-indigo-200">
            {state.phaseDetail}
          </div>
          <div className="rounded-lg border border-indigo-100 bg-white">
            <NetworkDiagram net={state.net} />
          </div>
          <CostTable box={state.costTable} />
          <RespBox box={state.respBox} />
          <ChainBox box={state.chainBox} />
          <DeltaBox box={state.deltaBox} />
          <CycleBox box={state.cycleBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-400/15 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-sky-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-indigo-900">I-2-1. 역전파 완전 해부 — 체인룰</h1>
                <p className="text-sm text-indigo-800/80">수백만 가중치 각각의 "책임"을 한 번에 계산하는 방법 — 딥러닝을 가능하게 한 알고리즘</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-indigo-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-indigo-500' : 'bg-indigo-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-indigo-800 text-indigo-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-indigo-400 bg-white text-indigo-800 hover:bg-indigo-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-indigo-400 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-indigo-800 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-indigo-400 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-indigo-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-500 bg-white px-4 py-3 text-sm text-indigo-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                ∂L/∂w는 "이 가중치를 조금 올리면 손실이 얼마나 변하나" — 손실에 대한 책임 지분이다.
                신경망은 거대한 합성함수이므로 체인룰(국소 미분의 곱)로 어떤 가중치의 책임도 경로를 따라 곱해 얻을 수 있고,
                역전파는 이 곱셈을 출력→입력 방향으로 δ를 전파하며 재사용해 forward 1번 + backward 1번으로 전 가중치의 기울기를 끝낸다.
                학습 = forward → loss → backward → update 사이클의 반복이며, PyTorch의 loss.backward()는 이 과정의 자동화(자동미분)다.
                그리고 δ가 층마다 w×σ'로 곱해지는 구조 자체가 기울기 소실(I-1-2)의 원인 — 다음 챕터에서 이 병을 고치는 도구들을 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['역전파', '체인룰', '기울기', '수치미분', 'δ델타', '계산그래프', '자동미분', 'gradient-check', '학습률', '기울기소실'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-900 border border-indigo-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-indigo-800">
              <a href="./I-1-2.html" className="underline hover:no-underline">← 이전: I-1-2</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
