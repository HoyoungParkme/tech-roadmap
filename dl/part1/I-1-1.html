  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL I-1-1 — 퍼셉트론→MLP — 왜 층을 쌓나
    학습 목표: 1958년의 인공 뉴런(퍼셉트론)이 AND/OR 를 직선 하나로 나누는 원리를 보고,
              XOR 앞에서 어떤 직선도 실패하는 위기(1969 민스키)를 애니메이션으로 체험한 뒤,
              은닉 뉴런 2개의 직선 조합이 구부러진 결정 경계를 만드는 순간 →
              MLP 일반화(유니버설 근사, 깊이 vs 너비) → 특징의 계층 학습까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 2D 평면 결정 경계 시뮬레이션 + 네트워크 다이어그램 + 진리표)
          / 우(VSCode CodeViewer: perceptron_to_mlp.py 진화)
    색상: rose (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 퍼셉트론 → XOR 위기 → 층 쌓기 → MLP 일반화 → 딥러닝으로
    //   plot    : 좌측 2D 평면 상태 ('and' | 'xorFail' | 'xorSolved' | 'none')
    //   network : 네트워크 다이어그램 레이어 구성 (뉴런 수 배열)
    //   code    : 우측 CodeViewer 파일 (perceptron_to_mlp.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {
        lang: 'python',
        filename: 'perceptron_to_mlp.py (v1 — 퍼셉트론)',
        lines: [
          '"""',
          'perceptron_to_mlp.py — v1: 퍼셉트론 하나로 AND / OR',
          '뉴런 흉내: 입력×가중치 합 + 편향 → 계단 함수',
          '"""',
          'import numpy as np',
          '',
          '',
          'def step(z: np.ndarray) -> np.ndarray:',
          '    """계단 함수: 0을 넘으면 발화(1), 아니면 침묵(0)"""',
          '    return (z > 0).astype(int)',
          '',
          '',
          'def perceptron(x: np.ndarray, w: np.ndarray, b: float) -> np.ndarray:',
          '    """단층 퍼셉트론 forward.',
          '',
          '    Args:',
          '        x: (n, 2) 입력 / w: (2,) 가중치 / b: 편향',
          '    Returns:',
          '        (n,) 0 또는 1',
          '    """',
          '    return step(x @ w + b)',
          '',
          '',
          'X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]])',
          '',
          '# AND: 두 입력의 합이 1.5 를 넘어야 발화',
          'w_and, b_and = np.array([1.0, 1.0]), -1.5',
          'print(perceptron(X, w_and, b_and))   # [0 0 0 1]  ✓',
          '',
          '# OR: 합이 0.5 만 넘으면 발화',
          'w_or, b_or = np.array([1.0, 1.0]), -0.5',
          'print(perceptron(X, w_or, b_or))     # [0 1 1 1]  ✓',
          '',
          '# 기하학적 의미:',
          '#   w·x + b = 0  은 2D 평면의 "직선"이다',
          '#   퍼셉트론 = 그 직선으로 평면을 두 쪽으로 나누는 분류기',
          '#   가중치·편향을 바꾸면 → 직선이 기울고 평행이동한다',
          '#   "학습" = 직선을 올바른 자리로 밀어 넣는 것',
        ],
      },
      s2: {
        lang: 'python',
        filename: 'perceptron_to_mlp.py (v2 — XOR 실패 증명)',
        lines: [
          '"""',
          'perceptron_to_mlp.py — v2: 같은 방식으로 XOR 도전 → 전수 탐색 실패',
          '"""',
          'import numpy as np',
          '',
          'from perceptron import perceptron  # v1 의 step / perceptron',
          '',
          'X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]])',
          'y_xor = np.array([0, 1, 1, 0])   # 둘 중 하나만 1일 때 1',
          '',
          '# 가중치 공간을 통째로 뒤져 보자 (w1, w2, b 각 -2.0 ~ 2.0)',
          'grid = np.arange(-2.0, 2.01, 0.05)',
          'found = 0',
          'for w1 in grid:',
          '    for w2 in grid:',

    // ─────────────────────────────────────────────────────
    // 2D 평면 좌표계 — 데이터 좌표(0~1) → SVG 좌표 변환
    // ─────────────────────────────────────────────────────
    const SX = (x) => 32 + x * 120;
    const SY = (y) => 168 - y * 120;

    // XOR 정답 라벨 (파랑=0, 주황=1 대신 rose/emerald 의미색 사용)
    const POINTS_XOR = [
      { x: 0, y: 0, label: 0 }, { x: 0, y: 1, label: 1 },
      { x: 1, y: 0, label: 1 }, { x: 1, y: 1, label: 0 },
    ];
    const POINTS_AND = [
      { x: 0, y: 0, label: 0 }, { x: 0, y: 1, label: 0 },
      { x: 1, y: 0, label: 0 }, { x: 1, y: 1, label: 1 },
    ];

    // 직선 a·x + b·y + c = 0 을 화면 가로 범위 전체로 잇는 두 끝점
    function lineEndpoints(a, b, c) {
      if (Math.abs(b) < 0.02) {
        const x = -c / a;
        return { x1: SX(x), y1: SY(-0.28), x2: SX(x), y2: SY(1.28) };
      }
      const yAt = (x) => -(a * x + c) / b;
      return { x1: SX(-0.28), y1: SY(yAt(-0.28)), x2: SX(1.28), y2: SY(yAt(1.28)) };
    }

    // ─────────────────────────────────────────────────────
    // 좌측 평면 그림 — AND 성공 / XOR 실패(회전 애니) / XOR 해결(띠 영역)
    // ─────────────────────────────────────────────────────
    function PlaneSVG({ mode }) {
      const [angle, setAngle] = useState(20);

      // XOR 실패 모드: 직선을 계속 돌리며 오분류를 실시간 표시
      useEffect(() => {
        if (mode !== 'xorFail') return;
        const t = setInterval(() => setAngle((a) => (a + 7) % 360), 160);
        return () => clearInterval(t);
      }, [mode]);

      const pts = mode === 'and' ? POINTS_AND : POINTS_XOR;

      // 회전 직선 (중심 0.5,0.5 통과): a·(x-0.5) + b·(y-0.5) = 0
      const rad = (angle * Math.PI) / 180;
      const ra = Math.cos(rad), rb = Math.sin(rad);
      const rc = -(ra * 0.5 + rb * 0.5);
      const sideOf = (p) => (ra * p.x + rb * p.y + rc > 0 ? 1 : 0);
      const errors = mode === 'xorFail'
        ? pts.filter((p) => sideOf(p) !== p.label).length
        : 0;

      const L_OR = lineEndpoints(1, 1, -0.5);    // h1: x+y = 0.5
      const L_NAND = lineEndpoints(1, 1, -1.5);  // h2: x+y = 1.5
      const L_AND = lineEndpoints(1, 1, -1.5);   // AND 분리선도 x+y=1.5
      const L_ROT = lineEndpoints(ra, rb, rc);

      const misclassified = (p) => {
        if (mode === 'and') return false;
        if (mode === 'xorFail') return sideOf(p) !== p.label;
        return false; // xorSolved: 전부 정답
      };

      return (
        <svg viewBox="0 0 200 200" className="w-full max-w-[260px] mx-auto" role="img" aria-hidden="true">

            <clipPath id="plotClip"><rect x="14" y="14" width="172" height="168" /></clipPath>
          </defs>
          {/* 격자 + 축 */}
          <rect x="14" y="14" width="172" height="168" fill="#ffffff" stroke="#cfc9ba" />
          {[0, 0.5, 1].map((v) => (
            <g key={v}>
              <line x1={SX(v)} y1="14" x2={SX(v)} y2="182" stroke="#f0ece0" />
              <line x1="14" y1={SY(v)} x2="186" y2={SY(v)} stroke="#f0ece0" />
              <text x={SX(v)} y="196" fontSize="8" fill="#8a8578" textAnchor="middle">{v}</text>
              <text x="7" y={SY(v) + 2.5} fontSize="8" fill="#8a8578" textAnchor="middle">{v}</text>
            </g>
          ))}
          <text x="100" y="12" fontSize="8" fill="#8a8578" textAnchor="middle">
            {mode === 'and' ? 'AND — 직선 하나로 분리 성공' : mode === 'xorFail' ? 'XOR — 직선을 돌려도 항상 실패' : 'XOR — 두 직선 사이 띠 = 클래스 1'}
          </text>

          <g clipPath="url(#plotClip)">
            {/* xorSolved: 두 직선 사이 형광펜 띠 */}
            {mode === 'xorSolved' && (
              <polygon
                points={`${L_OR.x1},${L_OR.y1} ${L_OR.x2},${L_OR.y2} ${L_NAND.x2},${L_NAND.y2} ${L_NAND.x1},${L_NAND.y1}`}
                fill="#fde68a" opacity="0.55"
              />
            )}
            {/* 결정 직선들 */}
            {mode === 'and' && (
              <line {...{ x1: L_AND.x1, y1: L_AND.y1, x2: L_AND.x2, y2: L_AND.y2 }} stroke="#e11d48" strokeWidth="2" />
            )}
            {mode === 'xorFail' && (
              <line {...{ x1: L_ROT.x1, y1: L_ROT.y1, x2: L_ROT.x2, y2: L_ROT.y2 }} stroke="#e11d48" strokeWidth="2" strokeDasharray="5 3" />
            )}
            {mode === 'xorSolved' && (
              <g>
                <line {...{ x1: L_OR.x1, y1: L_OR.y1, x2: L_OR.x2, y2: L_OR.y2 }} stroke="#059669" strokeWidth="2" />
                <line {...{ x1: L_NAND.x1, y1: L_NAND.y1, x2: L_NAND.x2, y2: L_NAND.y2 }} stroke="#0284c7" strokeWidth="2" />
              </g>
            )}
          </g>

          {/* 데이터 점 4개 */}
          {pts.map((p) => (
            <g key={`${p.x}-${p.y}`}>
              {misclassified(p) && (
                <circle cx={SX(p.x)} cy={SY(p.y)} r="11" fill="none" stroke="#dc2626" strokeWidth="2" strokeDasharray="3 2" />
              )}
              <circle
                cx={SX(p.x)} cy={SY(p.y)} r="7"
                fill={p.label === 1 ? '#f43f5e' : '#ffffff'}
                stroke={p.label === 1 ? '#9f1239' : '#57534a'} strokeWidth="1.5"
              />
              <text x={SX(p.x)} y={SY(p.y) + 2.8} fontSize="7.5" textAnchor="middle"
                fill={p.label === 1 ? '#ffffff' : '#57534a'} fontWeight="bold">{p.label}</text>
            </g>
          ))}

          {/* 범례 / 상태 */}
          {mode === 'xorFail' && (
            <text x="100" y="192" fontSize="8" fill="#dc2626" textAnchor="middle" fontWeight="bold">
              θ={angle}° — 오분류 {errors}개 (0이 되는 각도는 없다)
            </text>
          )}
          {mode === 'xorSolved' && (
            <g>
              <text x="30" y="192" fontSize="7.5" fill="#059669">— h₁ (OR)</text>
              <text x="90" y="192" fontSize="7.5" fill="#0284c7">— h₂ (NAND)</text>
              <text x="152" y="192" fontSize="7.5" fill="#a16207">■ 띠 = 1</text>
            </g>
          )}
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // 네트워크 다이어그램 — layers = [입력수, 은닉수..., 출력수]
    // ─────────────────────────────────────────────────────
    function NetworkDiagram({ network }) {
      if (!network) return null;
      const { layers, caption, labels } = network;
      const W = 240, H = 110;
      const colX = layers.map((_, li) => 30 + (li * (W - 60)) / Math.max(1, layers.length - 1));
      const nodeY = (li, ni) => {
        const n = layers[li];
        return H / 2 + (ni - (n - 1) / 2) * 26;
      };
      const hiddenLabel = labels ? ['', 'h', ''] : null;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-2">
          <svg viewBox={`0 0 ${W} ${H + 14}`} className="w-full max-w-[300px] mx-auto" role="img" aria-hidden="true">
            {/* 연결선 */}
            {layers.slice(0, -1).map((n, li) =>
              Array.from({ length: n }).map((_, a) =>
                Array.from({ length: layers[li + 1] }).map((_, b) => (
                  <line key={`${li}-${a}-${b}`}
                    x1={colX[li]} y1={nodeY(li, a)} x2={colX[li + 1]} y2={nodeY(li + 1, b)}
                    stroke="#fda4af" strokeWidth="1" />
                ))
              )
            )}
            {/* 뉴런 */}
            {layers.map((n, li) =>
              Array.from({ length: n }).map((_, ni) => (
                <g key={`${li}-${ni}`}>
                  <circle cx={colX[li]} cy={nodeY(li, ni)} r="9"
                    fill={li === 0 ? '#ffffff' : li === layers.length - 1 ? '#e11d48' : '#fecdd3'}
                    stroke="#9f1239" strokeWidth="1.3" />
                  {labels && li === 1 && (
                    <text x={colX[li]} y={nodeY(li, ni) + 3} fontSize="8" textAnchor="middle" fill="#9f1239" fontWeight="bold">
                      h{ni + 1}
                    </text>
                  )}
                </g>
              ))
            )}
            {/* 층 이름 */}
            {layers.map((_, li) => (
              <text key={li} x={colX[li]} y={H + 10} fontSize="7.5" textAnchor="middle" fill="#8a8578">
                {li === 0 ? '입력층' : li === layers.length - 1 ? '출력층' : `은닉층${layers.length > 3 ? ' ' + li : ''}`}
              </text>
            ))}
          </svg>
          <div className="text-[10px] text-rose-900 text-center mt-1">{caption}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 진리표 — 단계별 실제 계산 결과 (step 함수를 JS로 그대로 재현)
    // ─────────────────────────────────────────────────────
    const stepFn = (z) => (z > 0 ? 1 : 0);

    function TruthTable({ kind }) {
      if (!kind) return null;
      const rows = [[0, 0], [0, 1], [1, 0], [1, 1]].map(([x1, x2]) => {
        if (kind === 'and') {
          const out = stepFn(x1 + x2 - 1.5);
          return { x1, x2, cols: [`${(x1 + x2 - 1.5).toFixed(1)}`, out], want: x1 && x2 ? 1 : 0, out };
        }
        if (kind === 'xorFail') {
          const want = x1 !== x2 ? 1 : 0;
          return { x1, x2, cols: ['—'], want, out: null };
        }
        // xorSolved
        const h1 = stepFn(x1 + x2 - 0.5);
        const h2 = stepFn(-x1 - x2 + 1.5);
        const out = stepFn(h1 + h2 - 1.5);
        return { x1, x2, cols: [h1, h2, out], want: x1 !== x2 ? 1 : 0, out };
      });
      const heads = kind === 'and' ? ['z = x₁+x₂−1.5', 'step(z)']
        : kind === 'xorFail' ? ['직선 하나의 예측']
        : ['h₁ (OR)', 'h₂ (NAND)', 'out (AND)'];
      const title = kind === 'and' ? '진리표 검증 — AND (전부 정답)'
        : kind === 'xorFail' ? '목표 진리표 — XOR (도달 불가)'
        : '진리표 검증 — 2층 계산 과정';
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-rose-900 mb-1.5">🧾 {title}</div>
          <table className="w-full text-[10px] text-center">
            <thead>
              <tr className="text-rose-900 border-b border-rose-200">
                <th className="py-0.5">x₁</th><th className="py-0.5">x₂</th>
                {heads.map((h) => <th key={h} className="py-0.5">{h}</th>)}
                <th className="py-0.5">정답</th><th className="py-0.5">판정</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className="border-t border-rose-100">
                  <td className="py-0.5 font-mono">{r.x1}</td>
                  <td className="py-0.5 font-mono">{r.x2}</td>
                  {r.cols.map((c, j) => <td key={j} className="py-0.5 font-mono">{c}</td>)}
                  <td className="py-0.5 font-mono font-bold">{r.want}</td>
                  <td className="py-0.5">
                    {r.out === null
                      ? <span className="text-red-700 font-bold">불가</span>
                      : r.out === r.want
                        ? <span className="text-emerald-700 font-bold">✓</span>
                        : <span className="text-red-700 font-bold">✗</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 깊게 vs 넓게 비교 (Step 4)
    // ─────────────────────────────────────────────────────
    function DeepWideBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">⚖️ {box.title}</div>
          {box.rows.map((r) => (
            <div key={r.name} className="mb-2">
              <div className="flex items-center justify-between text-[10px] mb-0.5">
                <span className="font-bold text-slate-800">{r.name}</span>
                <span className={r.tone === 'good' ? 'text-emerald-700' : 'text-red-700'}>{r.costLabel}</span>
              </div>
              <div className="h-2.5 rounded-full bg-rose-100 overflow-hidden">
                <div className={`h-full transition-all duration-700 ${r.tone === 'good' ? 'bg-emerald-500' : 'bg-red-400'}`}
                  style={{ width: `${r.cost}%` }} />
              </div>
              <div className="text-[9.5px] text-slate-600 mt-0.5">{r.detail}</div>
            </div>
          ))}
          <div className="text-[10px] text-rose-900 mt-1">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 특징 계층 사다리 (Step 5) — 엣지 → 부품 → 개념
    // ─────────────────────────────────────────────────────
    function HierarchyBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">🪜 {box.title}</div>
          <div className="space-y-1.5">
            {[...box.levels].reverse().map((lv, i) => (
              <React.Fragment key={lv.name}>
                {i > 0 && <div className="text-center text-rose-400 text-[10px] leading-none">▲ 조합</div>}
                <div className="rounded border border-rose-200 bg-rose-50 px-2 py-1.5 flex items-center gap-2">
                  <span className="text-lg">{lv.icon}</span>
                  <div className="min-w-0">
                    <div className="text-[10.5px] font-bold text-slate-800">
                      <span className="text-rose-700 font-mono mr-1">[{lv.depth}]</span>{lv.name}
                    </div>
                    <div className="text-[9.5px] text-slate-600">{lv.desc}</div>
                  </div>
                </div>
              </React.Fragment>
            ))}
          </div>
          <div className="text-[10px] text-rose-900 mt-2">{box.note}</div>
        </div>
      );
    }

    function NextProblemBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5">
          <div className="text-[11px] font-bold text-amber-900 mb-1">🔭 {box.title}</div>
          <ul className="text-[10px] text-amber-900 space-y-0.5 list-disc pl-4">
            {box.items.map((it) => <li key={it}>{it}</li>)}
          </ul>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 2D 결정 경계 시뮬레이션 + 네트워크 (rose 톤)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, state }) {
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900">🧬 결정 경계 실험실</h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.plot.mode !== 'none' && (
            <div className="rounded-lg border border-rose-200 bg-rose-50 p-2">
              <PlaneSVG mode={state.plot.mode} />
            </div>
          )}
          <NetworkDiagram network={state.network} />
          <TruthTable kind={state.table} />
          <DeepWideBox box={state.deepWide} />
          <HierarchyBox box={state.hierarchy} />
          <NextProblemBox box={state.nextProblem} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">I-1-1. 퍼셉트론→MLP — 왜 층을 쌓나</h1>
                <p className="text-sm text-rose-800/80">1958년의 인공 뉴런이 XOR 앞에서 멈춘 이유, 그리고 층이 그것을 푸는 방법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                퍼셉트론은 "직선 하나로 평면 나누기"이고, XOR는 그 직선 하나로는 해가 존재하지 않는 문제였다(1969, AI 겨울).
                층을 쌓으면 은닉 뉴런들이 직선을 하나씩 긋고 출력층이 그것을 조합해 구부러진 결정 경계를 만든다 — 층 = 표현의 조합.
                유니버설 근사 정리로 표현력은 보장되지만, 실무가 "깊게" 가는 이유는 깊이가 부품 재사용으로
                같은 표현력을 지수적으로 적은 뉴런으로 얻기 때문이다. 깊은 층은 엣지→부품→개념의 특징 계층을 스스로 학습한다.
                남은 질문 — 수백만 가중치를 어떻게 자동으로 배우나 — 는 다음 장(활성화 함수·역전파)에서 푼다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['퍼셉트론', 'XOR', '선형분리', 'AI겨울', '은닉층', 'MLP', '결정경계', '유니버설근사', '깊이vs너비', '특징계층'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
