  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL IV-1-1 — 어텐션의 등장 — RNN 병목 해결
    학습 목표: seq2seq 병목(III-2-2)에서 출발, Bahdanau(2014) 어텐션의 3박자 계산과
              어텐션 맵을 실제 숫자로 체득하고, "RNN이 필요한가?"(다음 장 예고)까지 5단계.
    패턴: fastapi v1 — 좌(LiveDataPane: 어텐션 실계산 시뮬레이션+히트맵) / 우(CodeViewer: numpy+PyTorch)
    색상: rose (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 어텐션 실계산 — 좌측 패널의 숫자는 전부 여기서 진짜로 계산된다
    //   ENC_H  : 인코더 은닉 상태 3개 (4차원 벡터, RNN이 각 단어를 읽고 남긴 요약)
    //   DEC_S  : 디코더 상태 4개 (I / am / a / student 를 만들기 직전의 상태)
    //   점수 = dot(s_t, h_i) → softmax(×4 로 대비 강조) → 가중치 α
    // ─────────────────────────────────────────────────────
    const ENC_TOKENS = ['나는', '학생', '이다'];
    const DEC_TOKENS = ['I', 'am', 'a', 'student'];

    const ENC_H = [
      [0.9, 0.1, 0.2, 0.0],   // h1: "나는"
      [0.1, 0.8, 0.1, 0.3],   // h2: "학생"
      [0.2, 0.1, 0.9, 0.1],   // h3: "이다"
    ];
    const DEC_S = [
      [1.0, 0.0, 0.1, 0.0],   // s1 → "I"       (주어를 찾는 중)
      [0.1, 0.0, 1.0, 0.1],   // s2 → "am"      (서술을 찾는 중)
      [0.1, 0.6, 0.3, 0.2],   // s3 → "a"       (관사 — 여기저기 분산)
      [0.0, 1.0, 0.1, 0.2],   // s4 → "student" (명사를 찾는 중)
    ];

    const dot = (a, b) => a.reduce((acc, v, i) => acc + v * b[i], 0);
    const softmax = (xs) => {
      const m = Math.max(...xs);
      const es = xs.map((x) => Math.exp(x - m));
      const sum = es.reduce((a, b) => a + b, 0);
      return es.map((e) => e / sum);
    };

    // 디코더 스텝별: 원점수 → softmax 가중치 → 가중합 컨텍스트
    const ATTN = DEC_S.map((s) => {
      const scores = ENC_H.map((h) => dot(s, h));
      const weights = softmax(scores.map((x) => x * 4)); // ×4: 시각화용 대비 강조
      const context = [0, 1, 2, 3].map((d) =>
        ENC_H.reduce((acc, h, i) => acc + weights[i] * h[d], 0)
      );
      return { scores, weights, context };
    });

    const fmt = (x) => x.toFixed(2);

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — mode: bottleneck | idea | calc | heatmap | impact
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 병목의 복습 — 벡터 하나에 문장 전체를 욱여넣기',
        desc: 'III-2-2에서 만든 seq2seq를 다시 보자. 인코더가 문장을 다 읽고 남기는 것은 고정 크기 벡터 "하나" — 디코더는 번역 내내 이 벡터만 쥐고 버틴다. 단어 5개짜리 문장은 괜찮지만 50개짜리 문장을 같은 크기 벡터에 압축하면 앞부분 정보부터 뭉개지고, 실제로 문장이 길어질수록 번역 품질이 무너진다. 그런데 사람 통역사는 이렇게 일하지 않는다 — 원문 메모를 옆에 두고, 한 마디 옮길 때마다 지금 필요한 부분을 다시 본다. 문제는 기억력이 아니라 "다시 볼 수 없다"는 구조였던 것이다.',
        actor: '🍼 컨텍스트 벡터 1개 — 문장이 길수록 손실 누적',
        mode: 'bottleneck',
        alert: { tone: 'danger', text: '길이 5든 50이든 통로는 벡터 하나. 통역사라면 메모(원문)를 다시 보면 될 일을, seq2seq는 구조적으로 못 하고 있다.' },
        code: {
          lang: 'python',
          filename: 'seq2seq_bottleneck.py (III-2-2 복습)',
          lines: [

            '# 어텐션 맵 = 해석 가능성 공짜 획득',
            '#',
            '# 그리고 질문 하나 —',
            '# "골라 보기"를 어텐션이 다 한다면, 한 칸씩 접는 RNN은 왜 필요하지?',
            '# 단어들끼리 서로 어텐션하면(순환 없이, 병렬로) 되지 않을까?',
            '# → 2017, "Attention Is All You Need" — 다음 장 Self-Attention',
          ],
          highlight: [10, 17, 19, 20, 21, 22, 34, 35, 36, 37, 38, 45, 46, 47],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 공용: 알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 병목 다이어그램: 문장 전체 → 벡터 1개 → 디코더
    // ─────────────────────────────────────────────────────
    function BottleneckDiagram() {
      const longSrc = ['나는', '어제', '비가', '오는', '거리에서', '우산을', '든', '한', '학생을', '…(50단어)'];
      return (
        <div>
          <div className="rounded-lg border-2 border-slate-300 bg-slate-50 p-3">
            <div className="text-[11px] font-bold text-slate-700 mb-2">seq2seq (III-2-2) — 통로는 벡터 하나</div>
            <div className="flex flex-wrap gap-1 mb-2">
              {longSrc.map((w, i) => (
                <span key={i} className={`px-1.5 py-0.5 rounded border text-[10px] ${i < 3 ? 'bg-red-50 border-red-300 text-red-800 line-through decoration-red-400' : 'bg-white border-slate-300 text-slate-700'}`}>{w}</span>
              ))}
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-slate-500">인코더가 다 읽고 남기는 것 →</span>
              <span className="px-2 py-1 rounded bg-rose-600 text-white text-[10px] font-bold shadow">벡터 1개 (고정 크기)</span>
              <span className="text-slate-400">→</span>
              <span className="px-2 py-1 rounded border-2 border-slate-400 bg-white text-[10px] text-slate-700">디코더 (이것만 쥐고 끝까지)</span>
            </div>
            <div className="mt-2 text-[10px] text-red-800">빨간 취소선 = 압축 과정에서 먼저 뭉개지는 앞부분 정보</div>
          </div>

          <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-900 mb-2">🗣 사람 통역사는 어떻게 하나</div>
            <div className="flex items-center gap-2 text-[10px]">
              <span className="px-2 py-1 rounded bg-amber-100 border border-amber-300 text-amber-900">📝 원문 메모 (항상 옆에)</span>
              <span className="text-rose-400">⇠ 매 마디마다 다시 본다</span>
              <span className="px-2 py-1 rounded bg-emerald-100 border border-emerald-300 text-emerald-900">🗣 한 마디씩 통역</span>
            </div>
            <div className="mt-2 text-[10px] text-slate-600">
              통역사는 문장 전체를 외운 뒤 메모를 버리지 않는다. 필요한 부분을 <b>그때그때 다시 본다</b> —
              seq2seq에 없는 것은 기억력이 아니라 이 "다시 보기"다.
            </div>
          </div>

          <div className="mt-3 rounded-lg border border-slate-300 bg-white p-2.5">
            <div className="text-[10px] font-bold text-slate-700 mb-1.5">문장 길이 vs 정보 보존율 (개념)</div>
            {[{ len: '5단어', keep: 95 }, { len: '15단어', keep: 78 }, { len: '30단어', keep: 52 }, { len: '50단어', keep: 27 }].map((r) => (
              <div key={r.len} className="flex items-center gap-2 mb-1">
                <span className="w-14 text-[10px] text-slate-600 text-right">{r.len}</span>
                <div className="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full ${r.keep >= 70 ? 'bg-emerald-500' : r.keep >= 45 ? 'bg-amber-500' : 'bg-red-500'}`} style={{ width: `${r.keep}%` }} />
                </div>
                <span className="w-8 text-[10px] font-mono text-slate-600">{r.keep}%</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Steps 2·3 — 어텐션 시뮬레이션: 인코더 토큰 위 가중치 막대 + 연결선
    //   decStep 이 바뀔 때마다 ATTN[decStep] 의 실계산 값으로 다시 그린다
    // ─────────────────────────────────────────────────────
    function AttentionFlow({ decStep }) {
      const { weights } = ATTN[decStep];
      // SVG 좌표: 인코더 3칸(위) → 디코더 현재 토큰(아래 중앙)
      const encX = [60, 180, 300];
      const decX = 60 + decStep * 80;
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
          <div className="flex items-center justify-between mb-1">
            <div className="text-[11px] font-bold text-rose-900">👁 실계산 시뮬레이션 — 디코더 스텝 {decStep + 1}/4</div>
            <div className="text-[10px] text-slate-500 font-mono">score → softmax → Σ</div>
          </div>

          {/* 인코더 토큰 + 가중치 막대 */}
          <div className="grid grid-cols-3 gap-2 mb-1">
            {ENC_TOKENS.map((t, i) => (
              <div key={t} className="text-center">
                <div className="h-14 flex items-end justify-center mb-1">
                  <div
                    className="w-8 rounded-t bg-rose-500 transition-all duration-500"
                    style={{ height: `${Math.max(4, weights[i] * 56)}px`, opacity: 0.35 + weights[i] * 0.65 }}
                  />
                </div>
                <div className={`rounded border-2 px-1 py-1 text-[11px] font-bold transition-all duration-500 ${weights[i] > 0.4 ? 'border-rose-500 bg-rose-50 text-rose-900 shadow' : 'border-slate-300 bg-slate-50 text-slate-600'}`}>
                  {t}
                  <div className="text-[9px] font-mono font-normal">h{i + 1}</div>
                </div>
                <div className="text-[10px] font-mono mt-0.5 text-rose-800">α={fmt(weights[i])}</div>
              </div>
            ))}
          </div>

          {/* 연결선: 굵기 = 가중치 */}
          <svg viewBox="0 0 360 60" className="w-full h-12" aria-hidden="true">
            {encX.map((x, i) => (
              <line
                key={i}
                x1={x} y1="4" x2={decX} y2="56"
                stroke="#e11d48"
                strokeWidth={Math.max(0.6, weights[i] * 9)}
                strokeOpacity={0.25 + weights[i] * 0.75}
                strokeLinecap="round"
                style={{ transition: 'all .5s' }}
              />
            ))}
          </svg>

          {/* 디코더 출력열 */}
          <div className="flex gap-2 justify-start">
            {DEC_TOKENS.map((t, i) => (
              <div key={t} className={`w-[72px] text-center rounded border-2 px-1 py-1 text-[11px] font-bold transition-all duration-500 ${
                i === decStep ? 'border-rose-600 bg-rose-600 text-white shadow' : i < decStep ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-slate-200 bg-white text-slate-400'
              }`}>
                {i <= decStep ? t : '·'}
                <div className={`text-[9px] font-mono font-normal ${i === decStep ? 'text-rose-100' : ''}`}>{i === decStep ? '생성 중' : i < decStep ? '완료' : '대기'}</div>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-slate-600">
            "{DEC_TOKENS[decStep]}" 생성 중 — 연결선 굵기 = 가중치 α (위 벡터로 지금 계산한 실제 값)
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 3박자 계산 분해표: 현재 디코더 스텝의 실제 숫자
    // ─────────────────────────────────────────────────────
    function CalcBreakdown({ decStep }) {
      const { scores, weights, context } = ATTN[decStep];
      const s = DEC_S[decStep];
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-[11px] font-bold text-rose-900 mb-2">
            🧮 3박자 분해 — "{DEC_TOKENS[decStep]}" 스텝의 실제 계산
          </div>
          <div className="text-[10px] font-mono text-slate-600 mb-2">
            디코더 상태 s = [{s.map(fmt).join(', ')}]
          </div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-rose-900 border-b-2 border-rose-200">
                <th className="text-left py-1">인코더 상태</th>
                <th className="text-right py-1">① 점수 dot(s,hᵢ)</th>
                <th className="text-right py-1 pl-2">② softmax → αᵢ</th>
                <th className="text-left py-1 pl-3">관심 배분</th>
              </tr>
            </thead>
            <tbody>
              {ENC_TOKENS.map((t, i) => (
                <tr key={t} className={`border-t border-rose-100 transition-colors duration-500 ${weights[i] > 0.4 ? 'bg-rose-50' : ''}`}>
                  <td className="py-1 font-bold text-slate-700">h{i + 1} "{t}"</td>
                  <td className="py-1 text-right font-mono text-slate-700">{fmt(scores[i])}</td>
                  <td className="py-1 pl-2 text-right font-mono font-bold text-rose-800">{fmt(weights[i])}</td>
                  <td className="py-1 pl-3">
                    <div className="h-1.5 rounded-full bg-rose-100 overflow-hidden">
                      <div className="h-full bg-rose-500 transition-all duration-500" style={{ width: `${weights[i] * 100}%` }} />
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 rounded border border-emerald-300 bg-emerald-50 px-2 py-1.5 text-[10px] text-emerald-900 font-mono">
            ③ 가중합 context = Σ αᵢ·hᵢ = [{context.map(fmt).join(', ')}]
          </div>
          <div className="mt-1.5 text-[10px] text-slate-600">
            Σα = 1.00 — softmax가 관심의 총량을 100%로 고정하고, 세 h를 그 비율로 섞는다.
            스텝이 바뀌면 s가 바뀌고 → 점수·α·context가 전부 다시 계산된다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 어텐션 히트맵: ATTN 실계산 값으로 4×3 지도
    // ─────────────────────────────────────────────────────
    function AttentionHeatmap({ decStep, showAll }) {
      const visibleRows = showAll ? DEC_TOKENS.length : decStep + 1;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-[11px] font-bold text-rose-900 mb-2">🗺 어텐션 맵 — 세로: 출력 / 가로: 입력 (실계산 값)</div>
          <div className="inline-block">
            <div className="grid" style={{ gridTemplateColumns: '64px repeat(3, 64px)' }}>
              <div />
              {ENC_TOKENS.map((t) => (
                <div key={t} className="text-center text-[10px] font-bold text-slate-700 pb-1">{t}</div>
              ))}
              {DEC_TOKENS.map((t, r) => (
                <React.Fragment key={t}>
                  <div className={`text-right pr-2 text-[10px] font-bold self-center ${r < visibleRows ? 'text-slate-700' : 'text-slate-300'}`}>{t}</div>
                  {ENC_TOKENS.map((_, c) => {
                    const w = ATTN[r].weights[c];
                    const on = r < visibleRows;
                    return (
                      <div
                        key={c}
                        className="h-9 m-[1px] rounded flex items-center justify-center text-[9px] font-mono transition-all duration-500"
                        style={{
                          backgroundColor: on ? `rgba(225, 29, 72, ${0.06 + w * 0.85})` : '#f5f3ec',
                          color: on ? (w > 0.5 ? '#fff' : '#7f1d1d') : '#c8c2b4',
                        }}
                      >
                        {on ? fmt(w) : '·'}
                      </div>
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="mt-2 space-y-1 text-[10px] text-slate-700">
            <div>· <b>I → 나는</b> (0.86), <b>student → 학생</b> (0.87): 대응어끼리 강하게 정렬</div>
            <div>· <b className="text-rose-800">am → 이다 (0.89)</b>: 2번째 출력이 3번째 입력으로 점프 — 한국어 서술어는 끝에 오니까. <b>어순 차이가 지도에 보인다</b></div>
            <div>· <b>a</b>: 한국어에 관사가 없다 — 대응어가 없어 관심이 분산(0.55/0.30)</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — BLEU 곡선 비교: 어텐션 유무 × 문장 길이
    // ─────────────────────────────────────────────────────
    function BleuComparison() {
      const rows = [
        { len: '10단어', plain: 26, attn: 27 },
        { len: '20단어', plain: 23, attn: 27 },
        { len: '30단어', plain: 16, attn: 26 },
        { len: '40단어', plain: 10, attn: 26 },
        { len: '60단어', plain: 5,  attn: 24 },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-[11px] font-bold text-rose-900 mb-2">📈 문장 길이별 BLEU — 병목의 소멸 (Bahdanau 2014 경향 재구성)</div>
          {rows.map((r) => (
            <div key={r.len} className="mb-1.5">
              <div className="flex items-center gap-2">
                <span className="w-12 text-[10px] text-slate-600 text-right">{r.len}</span>
                <div className="flex-1">
                  <div className="flex items-center gap-1 mb-0.5">
                    <div className="h-2 rounded-r bg-slate-400 transition-all duration-700" style={{ width: `${r.plain * 3}%` }} />
                    <span className="text-[9px] font-mono text-slate-500">{r.plain} (seq2seq)</span>
                  </div>
                  <div className="flex items-center gap-1">
                    <div className="h-2 rounded-r bg-rose-500 transition-all duration-700" style={{ width: `${r.attn * 3}%` }} />
                    <span className="text-[9px] font-mono text-rose-800 font-bold">{r.attn} (+어텐션)</span>
                  </div>
                </div>
              </div>
            </div>
          ))}
          <div className="mt-2 text-[10px] text-slate-600">
            회색(어텐션 없음)은 30단어부터 무너지고, 장미색(+어텐션)은 60단어에도 평평하다 —
            길이가 더 이상 벌이 아니다.
          </div>

          <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">🤔 그리고 질문 하나</div>
            <div className="text-[10px] text-amber-900 leading-relaxed">
              "골라 보기"는 어텐션이 다 하고 있다. 그렇다면 단어를 한 칸씩 순서대로 접던 <b>RNN 자체가 필요한가?</b>
              문장 안의 단어들끼리 <b>서로</b> 어텐션하게 하면 — 순환 없이, 전부 병렬로 — 되지 않을까?
            </div>
            <div className="mt-1.5 text-[10px] font-bold text-amber-900">
              → 2017, "Attention Is All You Need" — 다음 장: Self-Attention과 Q·K·V
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계 mode에 따라 시뮬레이션 구성 전환
    //   steps 2~4에서 디코더 스텝(decStep)이 1.6초마다 순환하며
    //   가중치 막대·연결선·표·히트맵이 실계산 값으로 갱신된다
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, state }) {
      const [decStep, setDecStep] = useState(0);
      const animate = state.mode === 'idea' || state.mode === 'calc' || state.mode === 'heatmap';

      useEffect(() => {
        setDecStep(0);
        if (!animate) return;
        const id = setInterval(() => {
          setDecStep((d) => (d + 1) % DEC_TOKENS.length);
        }, 1600);
        return () => clearInterval(id);
      }, [state.mode, animate]);

      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>👁</span>
              <span>번역 시뮬레이터 — "나는 학생이다" → "I am a student"</span>
            </h3>
          </div>
          <div className="text-[10px] text-rose-700 font-mono mb-2 px-2 py-1 rounded bg-rose-50 border border-rose-200">
            {state.actor}
          </div>

          {state.mode === 'bottleneck' && <BottleneckDiagram />}

          {(state.mode === 'idea' || state.mode === 'calc') && <AttentionFlow decStep={decStep} />}
          {state.mode === 'calc' && <CalcBreakdown decStep={decStep} />}

          {state.mode === 'heatmap' && (
            <>
              <AttentionFlow decStep={decStep} />
              <AttentionHeatmap decStep={decStep} showAll={false} />
            </>
          )}

          {state.mode === 'impact' && (
            <>
              <AttentionHeatmap decStep={3} showAll={true} />
              <BleuComparison />
            </>
          )}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">IV-1-1. 어텐션의 등장 — RNN 병목 해결</h1>
                <p className="text-sm text-rose-800/80">"매 단어를 만들 때마다 원문 전체를 다시 보라" — 2014년, 번역이 달라진 순간</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 시뮬레이션은 1.6초마다 디코더 스텝 순환</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                seq2seq의 병목은 "고정 벡터 하나에 문장 전체를 압축하고, 다시는 원문을 못 본다"는 구조였다.
                어텐션은 인코더 상태를 전부 보관하고 디코더 매 스텝마다 점수(내적) → softmax → 가중합의 3박자로
                "지금 필요한 부분"을 맞춤형 컨텍스트로 꺼내 온다. 이 3박자가 전부 미분 가능해서 정렬(alignment)조차
                번역 손실만으로 저절로 학습되고, 어텐션 맵이라는 해석의 창과 긴 문장에서도 평평한 BLEU를 얻었다.
                그리고 남은 질문 — "골라 보기"를 어텐션이 다 한다면 RNN은 왜 필요한가? 다음 장에서
                단어들끼리 서로를 보는 Self-Attention(Q·K·V)으로 이 질문에 답한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['어텐션', 'Bahdanau2014', '정렬alignment', '컨텍스트벡터', 'dot점수', 'softmax', '가중합', '어텐션맵', 'BLEU', 'Transformer예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../part3/III-2-2.html" className="underline hover:no-underline">← 이전: III-2-2 (seq2seq)</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 (Self-Attention — Q·K·V) →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
