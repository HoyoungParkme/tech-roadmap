    // ── Step 2 — 멀티헤드 어텐션 맵 (헤드별 히트맵 비교) ──

    // ── Step 3 — 포지셔널 인코딩 파형 + 히트맵 (실제 sin/cos 계산) ──
    const PE_POS = 8, PE_DIM = 16;
    function peValue(pos, i) {
      const wave = Math.pow(10000, (2 * Math.floor(i / 2)) / PE_DIM);
      return i % 2 === 0 ? Math.sin(pos / wave) : Math.cos(pos / wave);
    }

    function PositionalPane() {
      // SVG 파형: 차원 0(빠른 진동) vs 차원 6(느린 진동)
      const wavePath = (dim, color) => {
        const pts = [];
        for (let x = 0; x <= 120; x++) {
          const pos = (x / 120) * 14;
          const y = 26 - peValue(pos, dim) * 20;
          pts.push(`${x * 2.2},${y.toFixed(1)}`);
        }
        return <polyline points={pts.join(' ')} fill="none" stroke={color} strokeWidth="2" />;
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-800 mb-1">🌊 차원마다 파장이 다르다 — 다중 스케일 자(ruler)</div>
            <svg viewBox="0 0 264 56" className="w-full h-16">
              <line x1="0" y1="26" x2="264" y2="26" stroke="#cfc9ba" strokeDasharray="3 3" />
              {wavePath(0, '#e11d48')}
              {wavePath(6, '#7c3aed')}
            </svg>
            <div className="flex gap-3 text-[9px]">
              <span className="text-rose-600 font-bold">— dim 0: 빠른 진동 (이웃 토큰 구분)</span>
              <span className="text-violet-600 font-bold">— dim 6: 느린 진동 (먼 거리 구분)</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-800 mb-1.5">🔢 PE 히트맵 — 위치 0~7 × 차원 0~15 (행마다 고유 지문)</div>
            <div className="inline-grid" style={{ gridTemplateColumns: `auto repeat(${PE_DIM}, 1.05rem)` }}>
              <div></div>
              {Array.from({ length: PE_DIM }, (_, i) => (
                <div key={i} className="text-[7px] text-slate-400 text-center">{i}</div>
              ))}
              {Array.from({ length: PE_POS }, (_, pos) => (
                <React.Fragment key={pos}>
                  <div className="text-[8px] text-slate-600 pr-1 flex items-center justify-end font-bold">pos {pos}</div>
                  {Array.from({ length: PE_DIM }, (_, i) => {
                    const v = peValue(pos, i); // -1 ~ 1
                    const bg = v >= 0 ? `hsla(340, 75%, 50%, ${v})` : `hsla(215, 75%, 50%, ${-v})`;
                    return <div key={i} className="h-4 border border-white/70" style={{ backgroundColor: bg }} />;
                  })}
                </React.Fragment>
              ))}
            </div>
            <div className="mt-1 text-[9px] text-slate-500">붉음 = +1 방향(sin/cos 양수) · 푸름 = −1 방향 · 어떤 두 행도 같은 무늬가 없다</div>
          </div>
          <div className="rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5 text-[10px] text-amber-900">
            <b>임베딩 + PE = 내용과 위치의 합성</b> — 토큰 벡터에 이 지문을 더하면, QK^T 내적이 "무슨 단어인가"와 "몇 번째인가"를 동시에 비교하게 된다.
            sin/cos라서 PE(pos+k)가 PE(pos)의 선형 변환이 되고, 모델은 <b>상대 거리 k</b>를 위치와 무관하게 배운다.
          </div>
        </div>

          <div className="flex gap-2">
            {/* 인코더 블록 (애니메이션) */}
            <div className="flex-1 rounded-lg border-2 border-rose-400 bg-rose-50 p-2 relative">
              <div className="text-[10px] font-bold text-rose-800 text-center mb-1">인코더 블록 ×6 — 🔴 데이터 흐름</div>
              <div className="flex flex-col-reverse gap-0.5">
                <Box id="input" label="x = Embedding + PE" sub="Step 3에서 준비" />
                <Arrow />
                <Box id="mha" label="Multi-Head Attention" sub="8 헤드 · Step 2" />
                <Box id="norm1" label="Add & Norm" sub="x + Attn(x) → LayerNorm" tone="norm" />
                <Arrow />
                <Box id="ffn" label="FFN 512→2048→512" sub="토큰별 독립 MLP" />
                <Box id="norm2" label="Add & Norm" sub="x + FFN(x) → LayerNorm" tone="norm" />
                <Arrow />
                <Box id="out" label="다음 층으로 (×6 반복)" />
              </div>
              {/* 잔차 우회 화살표 */}
              <div className="absolute right-0.5 top-10 bottom-8 w-3 border-r-2 border-t-2 border-b-2 border-amber-500 rounded-r" title="잔차 통로"></div>
              <div className="absolute -right-1 top-4 text-[8px] font-bold text-amber-600 rotate-90 origin-center">잔차</div>
            </div>
            {/* 디코더 블록 (정적) */}
            <div className="flex-1 rounded-lg border-2 border-fuchsia-400 bg-fuchsia-50 p-2">
              <div className="text-[10px] font-bold text-fuchsia-800 text-center mb-1">디코더 블록 ×6</div>
              <div className="flex flex-col-reverse gap-0.5">
                <Box id="d0" label="출력 임베딩 + PE" tone="dec" />
                <Arrow />
                <Box id="d1" label="Masked MHA" sub="미래 토큰 -inf 차단 🙈" tone="dec" />
                <Box id="d2" label="Add & Norm" tone="norm" />
                <Arrow />
                <Box id="d3" label="Cross Attention" sub="Q=디코더 · K/V=인코더 ⇦" tone="dec" />
                <Box id="d4" label="Add & Norm" tone="norm" />
                <Arrow />
                <Box id="d5" label="FFN + Add & Norm" tone="dec" />
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="text-[10px] font-bold text-rose-800 mb-1">🙈 Masked Attention — 하삼각 마스크</div>
            <div className="flex items-center gap-3">
              <div className="inline-grid gap-px" style={{ gridTemplateColumns: 'repeat(5, 1.1rem)' }}>
                {Array.from({ length: 25 }, (_, idx) => {
                  const r = Math.floor(idx / 5), c = idx % 5;
                  const visible = c <= r;
                  return <div key={idx} className={`h-4 flex items-center justify-center text-[7px] font-bold rounded-sm ${
                    visible ? 'bg-fuchsia-400 text-white' : 'bg-slate-200 text-slate-400'}`}>{visible ? '✓' : '−∞'}</div>;
                })}
              </div>
              <div className="text-[9px] text-slate-600 flex-1">
                t번째 토큰은 자신 이전(✓)만 본다. 미래 칸은 softmax 전에 −∞ → 확률 0.
                학습 시 "다음 단어 정답"을 컨닝하면 손실이 0이 되며 아무것도 못 배운다 — 마스크는 선택이 아니라 생존 조건.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Step 5 — RNN vs Transformer 비교표 + 계보 ──
    const COMPARE_ROWS = [
      { crit: '토큰 처리 방식', rnn: '✗ 순차 (t는 t-1 대기)', trn: '◎ 완전 병렬 (행렬곱 1방)' },
      { crit: 'GPU 활용률 / 학습 시간', rnn: '✗ 코어 놀림 · 수 주', trn: '◎ 풀가동 · 수십 분의 1' },
      { crit: '장거리 의존 정보 경로', rnn: '✗ O(n) hop — 희석', trn: '◎ O(1) — 항상 1 hop' },
      { crit: '시퀀스 길이당 연산량', rnn: '◎ O(n)', trn: '△ O(n²) — 길면 비쌈' },
      { crit: '순서 정보', rnn: '◎ 구조에 내장', trn: '△ PE로 별도 주입 필요' },
      { crit: '스케일 업 (층·데이터 확대)', rnn: '✗ 병렬화 벽에 막힘', trn: '◎ 스케일링 법칙의 시작' },
    ];

    const LINEAGE = [
      { name: 'BERT (2018)', part: '인코더 스택만', use: '문장 이해 — 분류·검색·NER', tone: 'bg-sky-50 border-sky-300 text-sky-900' },
      { name: 'GPT (2018~)', part: '디코더 스택만', use: '다음 토큰 생성 — LLM 전체', tone: 'bg-emerald-50 border-emerald-300 text-emerald-900' },
      { name: 'ViT (2020)', part: '인코더 + 패치 임베딩', use: '이미지 인식 — CNN 왕좌 교체', tone: 'bg-amber-50 border-amber-300 text-amber-900' },
      { name: 'Whisper (2022)', part: '인코더-디코더 그대로', use: '음성 인식 — 오디오→텍스트', tone: 'bg-violet-50 border-violet-300 text-violet-900' },
    ];

    function RevolutionPane() {
      return (
        <div className="space-y-3">
          <div className="rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-amber-50 p-3">
            <div className="text-sm font-bold text-rose-900 mb-2">⚖️ RNN vs Transformer — 최종 성적표</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-rose-900 border-b-2 border-rose-300">
                  <th className="text-left py-1">기준</th>
                  <th className="text-left py-1 pl-2">RNN/LSTM</th>
                  <th className="text-left py-1 pl-2">Transformer</th>
                </tr>
              </thead>
              <tbody>
                {COMPARE_ROWS.map((r) => (
                  <tr key={r.crit} className="border-t border-rose-200">
                    <td className="py-1 text-slate-800">{r.crit}</td>
                    <td className={`py-1 pl-2 font-bold ${r.rnn.startsWith('◎') ? 'text-emerald-700' : r.rnn.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.rnn}</td>
                    <td className={`py-1 pl-2 font-bold ${r.trn.startsWith('◎') ? 'text-emerald-700' : r.trn.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.trn}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[9px] text-slate-600">O(n²)가 유일한 약점 — 훗날 FlashAttention·희소 어텐션이 여길 공략한다. 그래도 "병렬화"라는 대가가 압도적으로 컸다.</div>
          </div>
          <div className="rounded-lg border-2 border-rose-400 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-800 mb-2">🧬 이 블록의 후손들 — 현대 AI의 계보 (다음 장 예고)</div>
            <div className="text-center mb-1.5">
              <span className="inline-block px-3 py-1 rounded-lg bg-rose-600 text-white text-[11px] font-bold shadow">Transformer (2017)</span>
            </div>
            <div className="text-center text-[10px] text-slate-400 leading-none mb-1.5">┌────────┼────────┐</div>
            <div className="grid grid-cols-2 gap-1.5">
              {LINEAGE.map((m) => (
                <div key={m.name} className={`rounded border-2 p-1.5 ${m.tone}`}>
                  <div className="text-[10px] font-bold">{m.name}</div>
                  <div className="text-[9px] opacity-80">{m.part}</div>
                  <div className="text-[9px]">{m.use}</div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-600 text-center">
              병렬화 → 모델·데이터를 키울 수 있음 → <b>스케일링 법칙</b>("크게 만들수록 예측 가능하게 좋아진다")의 출발점
            </div>
          </div>
        </div>
      );
    }

    // ── 경고/알림 박스 ──
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ── 좌측 LiveDataPane — 단계별 Transformer 조립 (rose 톤) ──
    const PANE_BADGE = {
      'rnn-vs-parallel': { icon: '🐌⚡', label: '순차 vs 병렬' },
      'multihead':       { icon: '👁',   label: '멀티헤드 어텐션 맵' },
      'positional':      { icon: '🌊',   label: '위치 파형 주입' },
      'block':           { icon: '🏗',   label: '블록 조립 라인' },
      'revolution':      { icon: '🚀',   label: '혁명의 성적표' },
    };

    function LiveDataPane({ state }) {
      const badge = PANE_BADGE[state.pane.mode] || PANE_BADGE['rnn-vs-parallel'];
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>Transformer 조립 — {badge.label}</span>
            </h3>
          </div>
          <div className="text-[10px] text-rose-700 font-mono mb-2 px-2 py-1 rounded bg-rose-50 border border-rose-200">
            {state.actor}
          </div>
          {state.pane.mode === 'rnn-vs-parallel' && <RnnVsParallel />}
          {state.pane.mode === 'multihead' && <MultiheadPane />}
          {state.pane.mode === 'positional' && <PositionalPane />}
          {state.pane.mode === 'block' && <BlockPane />}
          {state.pane.mode === 'revolution' && <RevolutionPane />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ── 우측 VSCode CodeViewer (highlight.js / atom-one-dark) ──
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ── App ──
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">IV-2-1. Attention is All You Need — Transformer 해부</h1>
                <p className="text-sm text-rose-800/80">RNN을 완전히 버린 2017년의 결단 — 현대 AI 전체의 설계도</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Transformer는 "순차 처리를 버리고 어텐션만으로 시퀀스를 처리한다"는 단 하나의 결단에서 나왔다.
                멀티헤드가 관계의 다중 관점을, 포지셔널 인코딩이 순서를, Add&amp;Norm(잔차)이 깊이를, 마스크가 생성의 인과를 담당한다.
                그 대가로 얻은 완전 병렬 학습이 스케일링 법칙의 문을 열었고,
                BERT(인코더)·GPT(디코더)·ViT(패치)·Whisper(인코더-디코더)는 전부 이 블록의 변주다.
                다음 장에서는 이 뼈대가 사전학습-파인튜닝 패러다임으로 어떻게 폭발하는지 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Transformer', 'SelfAttention', 'MultiHead', 'QKV', 'PositionalEncoding', 'AddNorm', '잔차연결', 'MaskedAttention', 'CrossAttention', '병렬학습', '스케일링법칙'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
