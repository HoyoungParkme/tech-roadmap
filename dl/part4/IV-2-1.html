  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL IV-2-1 — Attention is All You Need — Transformer 해부 (5단계)
    패턴: fastapi v1 — 좌(LiveDataPane: 인코더 스택 조립·어텐션 맵·PE 파형) / 우(CodeViewer: transformer.py)
    색상: rose (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — RNN 포기 → 멀티헤드 → 위치 신호 → 블록 완성 → 혁명
    //   각 step = { title, desc, actor, pane(좌측 패널 구성 스위치), code }
    // ─────────────────────────────────────────────────────
    const TOKENS = ['그', '동물은', '피곤해서', '길을', '건너지', '않았다'];

    // 헤드별 어텐션 가중치 (행: query 토큰, 열: key 토큰) — 관점이 다르다
    const HEAD_MAPS = [
      {
        name: 'Head 1 — 지시/의미',
        focus: '"않았다"가 주어 "동물은"을 강하게 본다 (누가 안 했나)',
        w: [
          [0.55, 0.25, 0.05, 0.05, 0.05, 0.05],
          [0.30, 0.45, 0.10, 0.05, 0.05, 0.05],
          [0.05, 0.55, 0.25, 0.05, 0.05, 0.05],
          [0.05, 0.10, 0.05, 0.55, 0.20, 0.05],
          [0.05, 0.15, 0.10, 0.35, 0.30, 0.05],
          [0.05, 0.50, 0.15, 0.05, 0.15, 0.10],
        ],
      },
      {
        name: 'Head 2 — 문법(수식 관계)',
        focus: '"건너지"가 목적어 "길을"을 본다 (무엇을 건너나)',
        w: [
          [0.40, 0.40, 0.05, 0.05, 0.05, 0.05],
          [0.45, 0.35, 0.05, 0.05, 0.05, 0.05],
          [0.05, 0.10, 0.40, 0.05, 0.35, 0.05],
          [0.05, 0.05, 0.05, 0.40, 0.40, 0.05],
          [0.05, 0.05, 0.05, 0.55, 0.25, 0.05],
          [0.05, 0.05, 0.10, 0.10, 0.45, 0.25],
        ],
      },
      {
        name: 'Head 3 — 인접/위치',
        focus: '각 토큰이 바로 옆 토큰을 본다 (국소 문맥)',
        w: [
          [0.60, 0.30, 0.03, 0.03, 0.02, 0.02],
          [0.30, 0.40, 0.20, 0.04, 0.03, 0.03],
          [0.05, 0.30, 0.35, 0.22, 0.05, 0.03],
          [0.03, 0.05, 0.25, 0.37, 0.25, 0.05],
          [0.03, 0.04, 0.05, 0.28, 0.35, 0.25],
          [0.02, 0.03, 0.05, 0.05, 0.30, 0.55],
        ],
      },
    ];

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      problem: {lang:"python", filename:"transformer.py — ① 문제 정의", lines:[
        "\"\"\"transformer.py — Attention is All You Need (Vaswani, 2017)",
        "RNN을 버린 이유: 1) 순차 처리 → 병렬화 불가 → GPU가 논다",
        "                2) 장거리 의존 → 은닉 상태 거치며 정보 희석\"\"\"",
        "import torch",
        "import torch.nn as nn",
        "",
        "# ── RNN 방식: t 시점은 t-1 을 기다린다 ──────────────",
        "rnn = nn.LSTM(input_size=512, hidden_size=512)",
        "x = torch.randn(6, 1, 512)          # (seq=6, batch, dim)",
        "",
        "h = None",
        "for t in range(x.size(0)):          # ← 이 for 문이 족쇄",
        "    out, h = rnn(x[t:t+1], h)       # 토큰 하나씩, 직렬로",
        "# 토큰 6개 = 6번의 순차 연산. 문장이 길수록 선형으로 느려짐",
        "",
        "# ── Transformer 방식: 전 토큰을 한 번에 ─────────────",
        "attn = nn.MultiheadAttention(embed_dim=512, num_heads=8)",
        "out, weights = attn(x, x, x)        # self-attention: Q=K=V=x",
        "# 행렬곱 한 방 — 토큰 6개든 6,000개든 \"동시에\" 서로를 본다",
        "# 임의의 두 토큰 사이 거리 = 항상 1 hop (RNN은 최대 seq-1 hop)",
        "",
        "# ── 논문의 전체 구조 (이번 장에서 조립할 부품들) ──────",
        "# 인코더 x6 : [Multi-Head Attention → Add&Norm → FFN → Add&Norm]",
        "# 디코더 x6 : [Masked MHA → Add&Norm → Cross MHA → Add&Norm",
        "#              → FFN → Add&Norm]",

        "import torch",
        "import torch.nn as nn",
        "",
        "",
        "class MultiheadAttention(nn.Module):",
        "    \"\"\"d_model 을 h 개 헤드로 쪼개 병렬 어텐션 후 concat.\"\"\"",
        "",
        "    def __init__(self, d_model: int = 512, h: int = 8):",
        "        super().__init__()",
        "        assert d_model % h == 0",
        "        self.d_k = d_model // h        # 512/8 = 64차원씩",

        "        self.w_k = nn.Linear(d_model, d_model)",

        "import torch",
        "import torch.nn as nn",
        "",
        "",
        "class PositionalEncoding(nn.Module):",

        "       PE(pos, 2i+1) = cos(pos / 10000^(2i/d_model))",
        "",
        "    차원 i 가 커질수록 파장이 기하급수로 길어진다:",

        "    \"\"\"",
        "",
        "    def __init__(self, d_model: int = 512, max_len: int = 5000):",
        "        super().__init__()",

    // ── Step 3 — 포지셔널 인코딩 파형 + 히트맵 (실제 sin/cos 계산) ──
    const PE_POS = 8, PE_DIM = 16;
    function peValue(pos, i) {
      const wave = Math.pow(10000, (2 * Math.floor(i / 2)) / PE_DIM);
      return i % 2 === 0 ? Math.sin(pos / wave) : Math.cos(pos / wave);
    }

    function PositionalPane() {
      // SVG 파형: 차원 0(빠른 진동) vs 차원 6(느린 진동)
      const wavePath = (dim, color) => {
        const pts = [];
        for (let x = 0; x <= 120; x++) {
          const pos = (x / 120) * 14;
          const y = 26 - peValue(pos, dim) * 20;
          pts.push(`${x * 2.2},${y.toFixed(1)}`);
        }
        return <polyline points={pts.join(' ')} fill="none" stroke={color} strokeWidth="2" />;
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-800 mb-1">🌊 차원마다 파장이 다르다 — 다중 스케일 자(ruler)</div>
            <svg viewBox="0 0 264 56" className="w-full h-16">
              <line x1="0" y1="26" x2="264" y2="26" stroke="#cfc9ba" strokeDasharray="3 3" />
              {wavePath(0, '#e11d48')}
              {wavePath(6, '#7c3aed')}
            </svg>
            <div className="flex gap-3 text-[9px]">
              <span className="text-rose-600 font-bold">— dim 0: 빠른 진동 (이웃 토큰 구분)</span>
              <span className="text-violet-600 font-bold">— dim 6: 느린 진동 (먼 거리 구분)</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-800 mb-1.5">🔢 PE 히트맵 — 위치 0~7 × 차원 0~15 (행마다 고유 지문)</div>
            <div className="inline-grid" style={{ gridTemplateColumns: `auto repeat(${PE_DIM}, 1.05rem)` }}>
              <div></div>
              {Array.from({ length: PE_DIM }, (_, i) => (
                <div key={i} className="text-[7px] text-slate-400 text-center">{i}</div>
              ))}
              {Array.from({ length: PE_POS }, (_, pos) => (
                <React.Fragment key={pos}>
                  <div className="text-[8px] text-slate-600 pr-1 flex items-center justify-end font-bold">pos {pos}</div>
                  {Array.from({ length: PE_DIM }, (_, i) => {
                    const v = peValue(pos, i); // -1 ~ 1
                    const bg = v >= 0 ? `hsla(340, 75%, 50%, ${v})` : `hsla(215, 75%, 50%, ${-v})`;
                    return <div key={i} className="h-4 border border-white/70" style={{ backgroundColor: bg }} />;
                  })}
                </React.Fragment>
              ))}
            </div>
            <div className="mt-1 text-[9px] text-slate-500">붉음 = +1 방향(sin/cos 양수) · 푸름 = −1 방향 · 어떤 두 행도 같은 무늬가 없다</div>
          </div>
          <div className="rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5 text-[10px] text-amber-900">
            <b>임베딩 + PE = 내용과 위치의 합성</b> — 토큰 벡터에 이 지문을 더하면, QK^T 내적이 "무슨 단어인가"와 "몇 번째인가"를 동시에 비교하게 된다.
            sin/cos라서 PE(pos+k)가 PE(pos)의 선형 변환이 되고, 모델은 <b>상대 거리 k</b>를 위치와 무관하게 배운다.
          </div>
        </div>
      );
    }

    // ── Step 4 — 블록 다이어그램 + 데이터 흐름 애니메이션 ──
    const ENC_FLOW = ['input', 'mha', 'norm1', 'ffn', 'norm2', 'out'];

        </div>
      );
      const Arrow = () => <div className="text-center text-[10px] text-slate-400 leading-none">▲</div>;
      return (
        <div className="space-y-3">
          <div className="flex gap-2">
            {/* 인코더 블록 (애니메이션) */}
            <div className="flex-1 rounded-lg border-2 border-rose-400 bg-rose-50 p-2 relative">
              <div className="text-[10px] font-bold text-rose-800 text-center mb-1">인코더 블록 ×6 — 🔴 데이터 흐름</div>
              <div className="flex flex-col-reverse gap-0.5">
                <Box id="input" label="x = Embedding + PE" sub="Step 3에서 준비" />
                <Arrow />
                <Box id="mha" label="Multi-Head Attention" sub="8 헤드 · Step 2" />
                <Box id="norm1" label="Add & Norm" sub="x + Attn(x) → LayerNorm" tone="norm" />
                <Arrow />
                <Box id="ffn" label="FFN 512→2048→512" sub="토큰별 독립 MLP" />
                <Box id="norm2" label="Add & Norm" sub="x + FFN(x) → LayerNorm" tone="norm" />
                <Arrow />
                <Box id="out" label="다음 층으로 (×6 반복)" />
              </div>
              {/* 잔차 우회 화살표 */}
              <div className="absolute right-0.5 top-10 bottom-8 w-3 border-r-2 border-t-2 border-b-2 border-amber-500 rounded-r" title="잔차 통로"></div>
              <div className="absolute -right-1 top-4 text-[8px] font-bold text-amber-600 rotate-90 origin-center">잔차</div>
            </div>
            {/* 디코더 블록 (정적) */}
            <div className="flex-1 rounded-lg border-2 border-fuchsia-400 bg-fuchsia-50 p-2">
              <div className="text-[10px] font-bold text-fuchsia-800 text-center mb-1">디코더 블록 ×6</div>
              <div className="flex flex-col-reverse gap-0.5">
                <Box id="d0" label="출력 임베딩 + PE" tone="dec" />
                <Arrow />
                <Box id="d1" label="Masked MHA" sub="미래 토큰 -inf 차단 🙈" tone="dec" />
                <Box id="d2" label="Add & Norm" tone="norm" />
                <Arrow />
                <Box id="d3" label="Cross Attention" sub="Q=디코더 · K/V=인코더 ⇦" tone="dec" />
                <Box id="d4" label="Add & Norm" tone="norm" />
                <Arrow />
                <Box id="d5" label="FFN + Add & Norm" tone="dec" />
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="text-[10px] font-bold text-rose-800 mb-1">🙈 Masked Attention — 하삼각 마스크</div>
            <div className="flex items-center gap-3">
              <div className="inline-grid gap-px" style={{ gridTemplateColumns: 'repeat(5, 1.1rem)' }}>
                {Array.from({ length: 25 }, (_, idx) => {
                  const r = Math.floor(idx / 5), c = idx % 5;
                  const visible = c <= r;
                  return <div key={idx} className={`h-4 flex items-center justify-center text-[7px] font-bold rounded-sm ${
                    visible ? 'bg-fuchsia-400 text-white' : 'bg-slate-200 text-slate-400'}`}>{visible ? '✓' : '−∞'}</div>;
                })}
              </div>
              <div className="text-[9px] text-slate-600 flex-1">
                t번째 토큰은 자신 이전(✓)만 본다. 미래 칸은 softmax 전에 −∞ → 확률 0.
                학습 시 "다음 단어 정답"을 컨닝하면 손실이 0이 되며 아무것도 못 배운다 — 마스크는 선택이 아니라 생존 조건.
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Step 5 — RNN vs Transformer 비교표 + 계보 ──
    const COMPARE_ROWS = [
      { crit: '토큰 처리 방식', rnn: '✗ 순차 (t는 t-1 대기)', trn: '◎ 완전 병렬 (행렬곱 1방)' },
      { crit: 'GPU 활용률 / 학습 시간', rnn: '✗ 코어 놀림 · 수 주', trn: '◎ 풀가동 · 수십 분의 1' },
      { crit: '장거리 의존 정보 경로', rnn: '✗ O(n) hop — 희석', trn: '◎ O(1) — 항상 1 hop' },
      { crit: '시퀀스 길이당 연산량', rnn: '◎ O(n)', trn: '△ O(n²) — 길면 비쌈' },
      { crit: '순서 정보', rnn: '◎ 구조에 내장', trn: '△ PE로 별도 주입 필요' },
      { crit: '스케일 업 (층·데이터 확대)', rnn: '✗ 병렬화 벽에 막힘', trn: '◎ 스케일링 법칙의 시작' },
    ];

    const LINEAGE = [
      { name: 'BERT (2018)', part: '인코더 스택만', use: '문장 이해 — 분류·검색·NER', tone: 'bg-sky-50 border-sky-300 text-sky-900' },
      { name: 'GPT (2018~)', part: '디코더 스택만', use: '다음 토큰 생성 — LLM 전체', tone: 'bg-emerald-50 border-emerald-300 text-emerald-900' },
      { name: 'ViT (2020)', part: '인코더 + 패치 임베딩', use: '이미지 인식 — CNN 왕좌 교체', tone: 'bg-amber-50 border-amber-300 text-amber-900' },
      { name: 'Whisper (2022)', part: '인코더-디코더 그대로', use: '음성 인식 — 오디오→텍스트', tone: 'bg-violet-50 border-violet-300 text-violet-900' },
    ];

    function RevolutionPane() {
      return (
        <div className="space-y-3">
          <div className="rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-amber-50 p-3">
            <div className="text-sm font-bold text-rose-900 mb-2">⚖️ RNN vs Transformer — 최종 성적표</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-rose-900 border-b-2 border-rose-300">
                  <th className="text-left py-1">기준</th>
                  <th className="text-left py-1 pl-2">RNN/LSTM</th>
                  <th className="text-left py-1 pl-2">Transformer</th>
                </tr>
              </thead>
              <tbody>
                {COMPARE_ROWS.map((r) => (
                  <tr key={r.crit} className="border-t border-rose-200">
                    <td className="py-1 text-slate-800">{r.crit}</td>
                    <td className={`py-1 pl-2 font-bold ${r.rnn.startsWith('◎') ? 'text-emerald-700' : r.rnn.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.rnn}</td>
                    <td className={`py-1 pl-2 font-bold ${r.trn.startsWith('◎') ? 'text-emerald-700' : r.trn.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.trn}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[9px] text-slate-600">O(n²)가 유일한 약점 — 훗날 FlashAttention·희소 어텐션이 여길 공략한다. 그래도 "병렬화"라는 대가가 압도적으로 컸다.</div>
          </div>
          <div className="rounded-lg border-2 border-rose-400 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-800 mb-2">🧬 이 블록의 후손들 — 현대 AI의 계보 (다음 장 예고)</div>
            <div className="text-center mb-1.5">
              <span className="inline-block px-3 py-1 rounded-lg bg-rose-600 text-white text-[11px] font-bold shadow">Transformer (2017)</span>
            </div>
            <div className="text-center text-[10px] text-slate-400 leading-none mb-1.5">┌────────┼────────┐</div>
            <div className="grid grid-cols-2 gap-1.5">
              {LINEAGE.map((m) => (
                <div key={m.name} className={`rounded border-2 p-1.5 ${m.tone}`}>
                  <div className="text-[10px] font-bold">{m.name}</div>
                  <div className="text-[9px] opacity-80">{m.part}</div>
                  <div className="text-[9px]">{m.use}</div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-600 text-center">
              병렬화 → 모델·데이터를 키울 수 있음 → <b>스케일링 법칙</b>("크게 만들수록 예측 가능하게 좋아진다")의 출발점
            </div>
          </div>
        </div>
      );
    }

    // ── 경고/알림 박스 ──
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ── 좌측 LiveDataPane — 단계별 Transformer 조립 (rose 톤) ──
    const PANE_BADGE = {
      'rnn-vs-parallel': { icon: '🐌⚡', label: '순차 vs 병렬' },
      'multihead':       { icon: '👁',   label: '멀티헤드 어텐션 맵' },
      'positional':      { icon: '🌊',   label: '위치 파형 주입' },
      'block':           { icon: '🏗',   label: '블록 조립 라인' },
      'revolution':      { icon: '🚀',   label: '혁명의 성적표' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = PANE_BADGE[state.pane.mode] || PANE_BADGE['rnn-vs-parallel'];
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>Transformer 조립 — {badge.label}</span>
            </h3>
          </div>
          <div className="text-[10px] text-rose-700 font-mono mb-2 px-2 py-1 rounded bg-rose-50 border border-rose-200">
            {state.actor}
          </div>
          {state.pane.mode === 'rnn-vs-parallel' && <RnnVsParallel />}
          {state.pane.mode === 'multihead' && <MultiheadPane />}
          {state.pane.mode === 'positional' && <PositionalPane />}
          {state.pane.mode === 'block' && <BlockPane />}
          {state.pane.mode === 'revolution' && <RevolutionPane />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ── 우측 VSCode CodeViewer (highlight.js / atom-one-dark) ──
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ── App ──
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">IV-2-1. Attention is All You Need — Transformer 해부</h1>
                <p className="text-sm text-rose-800/80">RNN을 완전히 버린 2017년의 결단 — 현대 AI 전체의 설계도</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Transformer는 "순차 처리를 버리고 어텐션만으로 시퀀스를 처리한다"는 단 하나의 결단에서 나왔다.
                멀티헤드가 관계의 다중 관점을, 포지셔널 인코딩이 순서를, Add&amp;Norm(잔차)이 깊이를, 마스크가 생성의 인과를 담당한다.
                그 대가로 얻은 완전 병렬 학습이 스케일링 법칙의 문을 열었고,
                BERT(인코더)·GPT(디코더)·ViT(패치)·Whisper(인코더-디코더)는 전부 이 블록의 변주다.
                다음 장에서는 이 뼈대가 사전학습-파인튜닝 패러다임으로 어떻게 폭발하는지 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Transformer', 'SelfAttention', 'MultiHead', 'QKV', 'PositionalEncoding', 'AddNorm', '잔차연결', 'MaskedAttention', 'CrossAttention', '병렬학습', '스케일링법칙'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
