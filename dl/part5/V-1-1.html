  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL V-1-1 — 학습 안정화 — 배치 정규화·드롭아웃
    학습 목표: 초기화 실패(대칭·포화) → BN의 분포 안정화 → train/eval 함정과 LN/GN →
              드롭아웃 앙상블 효과 → 증상별 진단 플로차트까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 층별 활성값 분포 실계산 히스토그램·드롭아웃 마스크·train/val 곡선)
          / 우(VSCode CodeViewer: stabilize.py 진화)
    색상: rose (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 실계산 유틸 — 시드 고정 PRNG + 정규분포 + 4층 ReLU MLP 순전파
    //   layerStats(init, useBN): 층별 활성값 히스토그램(실제 forward 계산 결과)
    // ─────────────────────────────────────────────────────
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function randn(rng) {
      // Box-Muller
      let u = 0, v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    const DIM = 48, BATCH = 96, LAYERS = 4;

    // init: 'zero' | 'large' | 'xavier' | 'he'  /  useBN: 미니배치 평균/분산 정규화
    function simulateActivations(init, useBN) {
      const rng = mulberry32(20260806);
      const scale = { zero: 0, large: 1.2, xavier: Math.sqrt(1 / DIM), he: Math.sqrt(2 / DIM) }[init];
      // 입력 배치 X: N(0,1)
      let X = Array.from({ length: BATCH }, () => Array.from({ length: DIM }, () => randn(rng)));
      const layers = [];
      for (let l = 0; l < LAYERS; l++) {
        const W = Array.from({ length: DIM }, () => Array.from({ length: DIM }, () => randn(rng) * scale));
        // 선형 → (BN) → ReLU
        let Z = X.map((row) => {
          const out = new Array(DIM).fill(0);
          for (let j = 0; j < DIM; j++) {
            let s = 0;
            for (let i = 0; i < DIM; i++) s += row[i] * W[i][j];
            out[j] = s;
          }
          return out;
        });
        if (useBN) {
          for (let j = 0; j < DIM; j++) {
            let mean = 0;
            for (let b = 0; b < BATCH; b++) mean += Z[b][j];
            mean /= BATCH;
            let variance = 0;
            for (let b = 0; b < BATCH; b++) variance += (Z[b][j] - mean) ** 2;
            variance /= BATCH;
            const std = Math.sqrt(variance + 1e-5);
            for (let b = 0; b < BATCH; b++) Z[b][j] = (Z[b][j] - mean) / std; // γ=1, β=0
          }
        }
        const A = Z.map((row) => row.map((z) => Math.max(0, z))); // ReLU
        // 히스토그램: 활성값 분포 (0~3, 15칸) + 통계
        const flat = [];
        for (const row of A) for (const v of row) flat.push(v);
        const bins = new Array(15).fill(0);
        let sum = 0, deadCount = 0;
        for (const v of flat) {
          sum += v;
          if (v < 1e-8) deadCount++;
          const idx = Math.min(14, Math.floor((v / 3.0) * 15));
          bins[idx]++;
        }
        const mean = sum / flat.length;
        let variance = 0;
        for (const v of flat) variance += (v - mean) ** 2;
        const std = Math.sqrt(variance / flat.length);
        layers.push({ bins, std, dead: deadCount / flat.length });
        X = A;
      }
      return layers;
    }

    // 페이지 로드 시 1회 실계산 (시드 고정 → 항상 동일 결과)
    const ACT = {
      zero: simulateActivations('zero', false),
      large: simulateActivations('large', false),
      he: simulateActivations('he', false),
      heNoBN: simulateActivations('large', false),   // BN 비교용: 나쁜 스케일 그대로
      heBN: simulateActivations('large', true),      // 같은 나쁜 스케일 + BN → 복원되는가
    };

    // train/val 곡선 (Step 4) — 드롭아웃 유무 비교
    const CURVES = {
      epochs: [0, 5, 10, 15, 20, 25, 30, 35, 40],
      noDrop:  { train: [2.3, 1.4, 0.9, 0.55, 0.32, 0.18, 0.09, 0.05, 0.03], val: [2.3, 1.5, 1.1, 0.95, 0.92, 0.98, 1.10, 1.24, 1.38] },
      drop:    { train: [2.3, 1.5, 1.05, 0.78, 0.60, 0.50, 0.43, 0.39, 0.36], val: [2.3, 1.55, 1.08, 0.85, 0.71, 0.63, 0.58, 0.56, 0.55] },
    };

    // STEPS — 초기화 → BN → BN 함정/대안 → 드롭아웃 → 진단 플로차트
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {

    // 히스토그램 — 층별 활성값 분포 (실계산 결과 렌더)
    function ActHistogram({ layer, label, tone }) {
      const max = Math.max(...layer.bins, 1);
      const toneMap = {
        bad:  { bar: 'bg-red-400',     text: 'text-red-800' },
        warn: { bar: 'bg-amber-400',   text: 'text-amber-900' },
        good: { bar: 'bg-emerald-500', text: 'text-emerald-800' },
        rose: { bar: 'bg-rose-500',    text: 'text-rose-800' },
      };
      const t = toneMap[tone] || toneMap.rose;
      const stdLabel = layer.std >= 100 ? layer.std.toExponential(1) : layer.std.toFixed(2);
      return (
        <div className="flex items-end gap-1.5">
          <span className="text-[9px] text-slate-500 w-8 shrink-0">{label}</span>
          <div className="flex items-end gap-px h-7 flex-1">
            {layer.bins.map((b, i) => (
              <div key={i} className={`flex-1 rounded-t-sm ${b > 0 ? t.bar : 'bg-slate-100'}`}
                   style={{ height: `${Math.max(4, (b / max) * 100)}%`, opacity: b > 0 ? 0.45 + 0.55 * (b / max) : 1 }} />
            ))}
          </div>
          <span className={`text-[9px] font-mono w-16 shrink-0 text-right ${t.text}`}>
            σ={stdLabel}
          </span>
        </div>
      );
    }

    function HistoColumn({ title, layers, tone, note }) {
      return (
        <div className="flex-1 rounded-lg border border-rose-200 bg-white p-2 min-w-0">
          <div className="text-[10px] font-bold text-slate-800 mb-1.5">{title}</div>
          <div className="space-y-1">
            {layers.map((l, i) => (
              <ActHistogram key={i} layer={l} label={`L${i + 1}`} tone={tone} />
            ))}
          </div>
          <div className="mt-1.5 text-[9px] text-slate-500 leading-tight">{note}</div>
        </div>
      );
    }

            ⚡ 분포 안정 → lr 0.01 → 0.1로 10배 상향 가능 → 같은 정확도 도달까지 에폭 수 배 단축
          </div>
        </div>
      );
    }

    // Step 3 — train/eval + 정규화 선택 지도
    function NormPane() {
      const rows = [
        { name: 'BatchNorm', axis: '배치 축 (샘플들 간)', best: 'CNN + batch ≥ 16', fail: '작은 배치·가변 길이 시퀀스', tone: 'rose' },
        { name: 'LayerNorm', axis: '특징 축 (샘플 내부)', best: 'Transformer·NLP 표준', fail: '(배치 무관 — 함정 적음)', tone: 'emerald' },
        { name: 'GroupNorm', axis: '채널 그룹 (샘플 내부)', best: 'batch 1~4 detection/seg', fail: '그룹 수 튜닝 필요', tone: 'sky' },
      ];
      return (
        <div>
          <div className="rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1.5">⚠ 함정 1 — train / eval 모드에서 BN이 쓰는 통계</div>
            <div className="flex gap-2 text-[9px]">
              <div className="flex-1 rounded border border-rose-300 bg-white p-1.5">
                <div className="font-bold text-rose-800 mb-0.5">model.train()</div>
                <div className="text-slate-700">현재 <b>미니배치</b>의 μ/σ² 사용 + 러닝 통계를 이동평균으로 갱신</div>
              </div>
              <div className="flex items-center text-amber-500">→</div>
              <div className="flex-1 rounded border border-emerald-300 bg-white p-1.5">
                <div className="font-bold text-emerald-800 mb-0.5">model.eval()</div>
                <div className="text-slate-700">학습 중 모아둔 <b>러닝 통계</b>(running_mean/var) 사용 — 배치 구성과 무관하게 결정적</div>
              </div>
            </div>
            <div className="mt-1.5 text-[9px] text-amber-900">eval() 누락 = "학습 95%인데 서빙 엉망" 미스터리의 최다 원인. no_grad()는 모드를 안 바꾼다.</div>
          </div>
          <div className="mt-2 rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1.5">🗺 함정 2 대응 — 정규화 선택 지도 (무엇으로 정규화하나)</div>
            <table className="w-full text-[9px]">
              <thead>
                <tr className="text-rose-900 border-b border-rose-200">
                  <th className="text-left py-0.5">기법</th>
                  <th className="text-left py-0.5 pl-2">정규화 축</th>
                  <th className="text-left py-0.5 pl-2">표준 용도</th>
                  <th className="text-left py-0.5 pl-2">약점</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.name} className="border-t border-rose-100">
                    <td className="py-1 font-bold text-slate-800">{r.name}</td>
                    <td className="py-1 pl-2 text-slate-600 font-mono">{r.axis}</td>
                    <td className="py-1 pl-2 text-emerald-700 font-bold">{r.best}</td>
                    <td className="py-1 pl-2 text-red-700">{r.fail}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[9px] text-slate-600">공통 아이디어는 같다("분포를 다림질") — <b>어느 축으로 평균/분산을 내느냐</b>만 다르다.</div>
          </div>
        </div>
      );
    }

    // Step 4 — 드롭아웃 마스크 애니메이션 + train/val 곡선
    function CurveChart() {
      const W = 260, H = 110, PAD = 22;
      const maxY = 2.4;
      const pts = (arr) => arr.map((v, i) =>
        `${PAD + (i / (arr.length - 1)) * (W - PAD - 6)},${H - 14 - (v / maxY) * (H - 26)}`).join(' ');
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
          <line x1={PAD} y1={H - 14} x2={W - 4} y2={H - 14} stroke="#cfc9ba" strokeWidth="1" />
          <line x1={PAD} y1={6} x2={PAD} y2={H - 14} stroke="#cfc9ba" strokeWidth="1" />
          <text x={PAD - 4} y={12} fontSize="7" fill="#8a8578" textAnchor="end">loss</text>
          <text x={W - 6} y={H - 4} fontSize="7" fill="#8a8578" textAnchor="end">epoch →</text>
          {/* 드롭아웃 없음: train 실선 red, val 점선 red */}
          <polyline points={pts(CURVES.noDrop.train)} fill="none" stroke="#f87171" strokeWidth="1.5" />
          <polyline points={pts(CURVES.noDrop.val)} fill="none" stroke="#dc2626" strokeWidth="1.5" strokeDasharray="4 3" />
          {/* 드롭아웃: train 실선 emerald, val 점선 emerald */}
          <polyline points={pts(CURVES.drop.train)} fill="none" stroke="#34d399" strokeWidth="1.5" />
          <polyline points={pts(CURVES.drop.val)} fill="none" stroke="#059669" strokeWidth="1.5" strokeDasharray="4 3" />
          <text x={W - 8} y={26} fontSize="7" fill="#dc2626" textAnchor="end">val (no drop) ↗ 역주행</text>
          <text x={W - 8} y={64} fontSize="7" fill="#059669" textAnchor="end">val (p=0.4) 0.55 안정</text>
        </svg>
      );
    }

    function DropoutPane() {
      const ROWS = 6, COLS = 8, P = 0.4;
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setTick((v) => v + 1), 700);
        return () => clearInterval(t);
      }, []);
      // tick을 시드로 매 주기 새 마스크 재추첨 (결정적이지만 매번 다른 패턴)
      const rng = mulberry32(1000 + tick);
      const mask = Array.from({ length: ROWS * COLS }, () => rng() > P);
      const alive = mask.filter(Boolean).length;
      return (
        <div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[11px] font-bold text-rose-900">🎲 은닉층 뉴런 마스크 — 매 스텝 재추첨 (p=0.4)</span>
              <span className="text-[9px] font-mono text-slate-500">step #{tick + 1} · 생존 {alive}/{ROWS * COLS}</span>
            </div>
            <div className="grid grid-cols-8 gap-1">
              {mask.map((on, i) => (
                <div key={i}
                  className={`h-6 rounded flex items-center justify-center text-[9px] font-mono transition-all duration-300 ${on ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-300 scale-90'}`}>
                  {on ? '●' : '✕'}
                </div>
              ))}
            </div>
            <div className="mt-1.5 flex gap-3 text-[9px]">
              <span className="text-rose-800">● 활성 — 출력을 1/(1−p)=1.67배 보정</span>
              <span className="text-slate-500">✕ 드롭 — 이번 스텝 순전파·역전파 모두 제외</span>
            </div>
            <div className="mt-1 text-[9px] text-slate-600">매 스텝 다른 서브네트워크 = 앙상블 효과. eval 모드에선 전원 ● (보정 불필요 — inverted dropout).</div>
          </div>
          <div className="mt-2 rounded-lg border border-rose-200 bg-white p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1">📉 train(실선) vs val(점선) — 드롭아웃 유무</div>
            <CurveChart />
          </div>
        </div>
      );
    }

    // Step 5 — 진단 플로차트 + 표준 레시피
    function FlowchartPane() {
      const flows = [
        { sym: 'loss가 처음부터 정체 (2.30 고정)', cause: '학습 이전 문제', fix: '① 초기화(He/Xavier) ② lr 스윕 ③ 데이터 파이프라인(라벨·정규화)', tone: 'border-red-300 bg-red-50 text-red-900', icon: '🧊' },
        { sym: 'train만 좋고 val이 역주행', cause: '과적합 (암기)', fix: '① Dropout ② 데이터 증강 ③ weight decay — 순서대로 하나씩', tone: 'border-amber-300 bg-amber-50 text-amber-900', icon: '📈' },
        { sym: 'loss가 NaN / inf로 폭발', cause: '수치 폭발', fix: '① lr 낮추기 ② gradient clipping ③ 입력 정규화 확인', tone: 'border-rose-300 bg-rose-50 text-rose-900', icon: '💥' },
        { sym: '학습은 되는데 서빙만 엉망', cause: 'eval() 누락', fix: 'model.eval() + no_grad() — BN 러닝 통계·Dropout OFF 확인', tone: 'border-sky-300 bg-sky-50 text-sky-900', icon: '🚨' },
      ];
      const recipe = [
        { part: '초기화', pick: 'He (ReLU) / Xavier (tanh)' },
        { part: '정규화', pick: 'CNN → BN / Transformer → LN / 소배치 → GN' },
        { part: '과적합', pick: 'Dropout(FC만) + 증강 + weight decay' },
        { part: '옵티마이저', pick: 'AdamW(lr 3e-4, wd 0.01) + clip 1.0' },
      ];
      return (
        <div>
          <div className="space-y-1.5">
            {flows.map((f) => (
              <div key={f.sym} className={`rounded-lg border-2 p-2 ${f.tone}`}>
                <div className="flex items-center gap-1.5 text-[10px] font-bold">
                  <span>{f.icon}</span><span>{f.sym}</span>
                  <span className="ml-auto text-[9px] font-normal px-1.5 rounded bg-white/70 border border-current/20">{f.cause}</span>
                </div>
                <div className="mt-0.5 text-[9px] pl-5">{f.fix}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1.5">📋 표준 레시피 — 아프기 전에 이 조합으로 시작</div>
            <table className="w-full text-[9px]">
              <tbody>
                {recipe.map((r) => (
                  <tr key={r.part} className="border-t border-rose-200 first:border-t-0">
                    <td className="py-1 font-bold text-slate-800 w-16">{r.part}</td>
                    <td className="py-1 pl-2 text-rose-900 font-mono">{r.pick}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[9px] text-slate-600">2020년대 레퍼런스 구현의 사실상 기본값 — 여기서 출발해 증상이 보이면 위 플로차트대로 <b>하나씩</b> 조정한다.</div>
          </div>
        </div>
      );
    }

    // 경고/알림 박스
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // 좌측 LiveDataPane — 단계별 시각화 라우팅 (rose 톤)
    const PANE_TITLE = {
      init:      { icon: '🎲', label: '가중치 초기화 실험실' },
      bn:        { icon: '🧯', label: 'BatchNorm 복원 실험' },
      norm:      { icon: '🗺', label: '정규화 함정과 선택 지도' },
      dropout:   { icon: '🎰', label: 'Dropout 시뮬레이터' },
      flowchart: { icon: '🩺', label: '학습 진단실' },
    };

    function LiveDataPane({ beat, state }) {
      const t = PANE_TITLE[state.pane.mode] || PANE_TITLE.init;
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{t.icon}</span>
              <span>{t.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {state.pane.mode === 'init' && <InitPane />}
          {state.pane.mode === 'bn' && <BNPane />}
          {state.pane.mode === 'norm' && <NormPane />}
          {state.pane.mode === 'dropout' && <DropoutPane />}
          {state.pane.mode === 'flowchart' && <FlowchartPane />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // App
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">V-1-1. 학습 안정화 — 배치 정규화·드롭아웃</h1>
                <p className="text-sm text-rose-800/80">loss가 안 떨어지거나 val만 나쁠 때 — 학습을 길들이는 표준 장치들</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                학습 안정화는 순서다 — 출발점은 초기화(He/Xavier로 층별 분산 유지), 학습 중 흔들림은 정규화(BN은 미니배치 통계+γβ,
                작은 배치·시퀀스는 LN/GN), 과적합은 Dropout(매 스텝 서브넷 앙상블·공적응 방지)이 맡는다.
                실무 사고의 최다 원인은 model.eval() 누락 — BN 러닝 통계와 Dropout OFF는 이 한 줄이 바꾼다.
                증상이 보이면 플로차트대로 한 번에 하나씩: loss 정체→초기화·lr, val 역주행→Dropout·증강·weight decay, NaN→lr·클리핑.
                기본 출발점은 He 초기화 + BN(or LN) + AdamW다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['He초기화', 'Xavier', 'BatchNorm', 'LayerNorm', 'GroupNorm', 'Dropout', '공적응', 'train/eval', '러닝통계', 'GradientClipping', 'AdamW'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
