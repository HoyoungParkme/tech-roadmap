    // ─────────────────────────────────────────────────────

    function EncoderDecoderFlow({ tick }) {
      const encDone = Math.min(tick + 1, SRC_TOKENS.length);
      const decDone = Math.max(0, tick + 1 - SRC_TOKENS.length);
      const gauge = Math.round((encDone / SRC_TOKENS.length) * 100);
      const encFinished = encDone >= SRC_TOKENS.length;

            </div>
            <div className="mt-1 text-[9px] text-amber-800">
              {encFinished ? '압축 완료 — 이 벡터 하나만 디코더로 넘어간다 (나머지 h는 버려짐)' : `읽는 중… ${encDone}/${SRC_TOKENS.length} 토큰이 h에 누적`}

      if (!box) return null;
      const Chain = ({ tokens, tone }) => (

    // ─────────────────────────────────────────────────────
    // Step 4 — 정보 보존율 + 문장 길이별 BLEU 그래프
    // ─────────────────────────────────────────────────────
    function BottleneckGraph({ box }) {
      if (!box) return null;
      const maxBleu = 30;
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">🍾 40단어 문장을 읽은 뒤, 벡터에 남은 정보</div>
          <div className="space-y-1">
            {box.retention.map((r) => (
              <div key={r.pos} className="flex items-center gap-2 text-[10px]">
                <span className="w-24 text-slate-600 shrink-0">{r.pos}</span>
                <div className="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full transition-all duration-700 ${r.keep < 40 ? 'bg-red-400' : r.keep < 70 ? 'bg-amber-400' : 'bg-emerald-500'}`} style={{ width: `${r.keep}%` }} />
                </div>
                <span className="w-8 text-right font-mono">{r.keep}%</span>
                <span className="w-32 text-slate-500 shrink-0 hidden sm:inline">{r.label}</span>
              </div>
            ))}
          </div>
          <div className="mt-1 text-[9px] text-slate-500">h는 매 토큰마다 덮어쓰기된다 — 최근 것일수록 진하게, 오래된 것일수록 희미하게 남는다.</div>

          <div className="mt-3 text-xs font-bold text-rose-900 mb-1.5">📉 문장 길이별 번역 품질 (BLEU)</div>
          <div className="flex items-end gap-2 h-28 border-b-2 border-l-2 border-slate-300 pl-2 pb-0.5">
            {box.bleu.map((b) => (
              <div key={b.len} className="flex-1 flex flex-col items-center justify-end gap-0.5 h-full">
                <span className="text-[9px] font-mono font-bold text-slate-700">{b.score}</span>
                <div className={`w-full rounded-t transition-all duration-700 ${b.score >= 22 ? 'bg-emerald-500' : b.score >= 14 ? 'bg-amber-400' : 'bg-red-500'}`}
                     style={{ height: `${(b.score / maxBleu) * 100}%` }} />
                <span className="text-[9px] text-slate-600">{b.len}</span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-red-800 font-bold">20단어를 넘는 순간부터 급락 — 벡터 하나의 용량 한계가 그대로 성적표에 찍힌다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 어텐션 미리보기 + 유산 정리
    // ─────────────────────────────────────────────────────
    function AttentionPreview({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
          <div className="text-xs font-bold text-emerald-900 mb-2">🔭 어텐션 미리보기 — "{box.query}" 생성 시 어디를 보는가</div>
          <div className="flex items-center justify-center gap-3">
            {box.src.map((w, i) => (
              <div key={w} className="flex flex-col items-center gap-1">
                <span className={`px-2 py-1 rounded border-2 text-[11px] font-bold transition-all ${box.weights[i] > 0.5 ? 'border-emerald-500 bg-emerald-100 text-emerald-900 scale-110' : 'border-slate-300 bg-slate-50 text-slate-500'}`}>{w}</span>
                <div className="w-10 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                  <div className="h-full bg-emerald-500" style={{ width: `${box.weights[i] * 100}%` }} />
                </div>
                <span className="text-[9px] font-mono text-slate-600">{box.weights[i].toFixed(2)}</span>
              </div>
            ))}
          </div>
          <div className="text-center text-emerald-500 text-sm my-1">↖ ↑ ↗ (매 스텝 전체를 조회)</div>
          <div className="flex justify-center">
            <span className="px-2 py-1 rounded border-2 border-sky-500 bg-sky-100 text-sky-900 text-[11px] font-bold">디코더: "{box.query}" 생성 중</span>
          </div>
          <div className="mt-2 text-[10px] text-slate-600 text-center">"am"을 만들 땐 "이다"에 0.82 집중 — 고정 벡터 하나 대신, 스텝마다 새로 조합한다.</div>
        </div>
      );
    }

    function LegacyBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-emerald-50 p-3">
          <div className="text-sm font-bold text-rose-900 mb-2">🏛 {box.title}</div>
          <table className="w-full text-[10px]">
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.item} className="border-t border-rose-200 first:border-t-0">
                  <td className="py-1 font-bold text-slate-800 w-1/2">{r.item}</td>
                  <td className={`py-1 pl-2 ${r.to.includes('✂') ? 'text-red-700 font-bold' : 'text-emerald-700'}`}>{r.to}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 seq2seq 시뮬레이션 (rose 톤)
    //   step.anim 이 있으면 내부 틱 타이머로 인코딩/디코딩을 한 프레임씩 재생
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state, stepIdx }) {
      const [tick, setTick] = useState(0);

      useEffect(() => {
        setTick(0);
        if (!state.anim) return;
        const id = setInterval(() => {
          setTick((t) => (t + 1) % state.anim.frames);
        }, state.anim.ms);
        return () => clearInterval(id);
      }, [stepIdx]);

      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>🔬</span>
              <span>seq2seq 실험실</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.anim && (
            <div className="text-[10px] text-rose-700 font-mono mb-2 px-2 py-1 rounded bg-rose-50 border border-rose-200">
              내부 재생 프레임 {tick + 1}/{state.anim.frames} — 단계 안에서 자동 반복
            </div>
          )}
          <MismatchDiagram box={state.mismatch} />
          <FailBox box={state.failBox} />
          {state.encdec && <EncoderDecoderFlow tick={tick} />}
          <DecodeTable box={state.decodeTable} tick={tick} />
          <BiasBox box={state.biasBox} />
          <BottleneckGraph box={state.bottleneck} />
          <AttentionPreview box={state.attention} />
          <LegacyBox box={state.legacyBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">III-2-2. seq2seq와 병목 문제</h1>
                <p className="text-sm text-rose-800/80">문장 전체를 벡터 하나에 욱여넣기 — 번역 모델의 돌파구와 그 대가</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                seq2seq는 인코더 RNN이 입력 문장 전체를 고정 크기 컨텍스트 벡터 하나로 압축하고,
                디코더 RNN이 그 벡터에서 출발해 &lt;EOS&gt;까지 auto-regressive로 생성하는 구조다.
                학습은 teacher forcing(정답 주입)으로 안정화하지만 그 대가로 노출 편향이 생기고,
                무엇보다 "벡터 하나"라는 병목 탓에 문장이 길어질수록 앞부분 정보가 소실되어 BLEU가 급락한다.
                해법은 버렸던 인코더의 모든 시점을 디코더가 매 스텝 다시 보는 것 — 어텐션이며,
                인코더-디코더 구조·특수 토큰·생성 방식은 Transformer와 LLM으로 그대로 계승된다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['seq2seq', '인코더디코더', '컨텍스트벡터', 'auto-regressive', 'teacher-forcing', '노출편향', '병목문제', 'BLEU', 'GRU', '어텐션예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="./III-2-1.html" className="underline hover:no-underline">← 이전: III-2-1 (LSTM·GRU)</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: IV-1-1 (어텐션의 등장) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
