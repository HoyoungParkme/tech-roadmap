  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL III-2-2 — seq2seq와 병목 문제
    학습 목표: 번역 문제(길이 가변) → 인코더-디코더 압축·생성 → teacher forcing/노출 편향
              → 고정 벡터 병목(BLEU 급락) → 어텐션 예고까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 압축 게이지·생성 애니메이션·BLEU 그래프) / 우(CodeViewer: seq2seq.py)
    색상: rose (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공용 예시 문장 — "나는 학생 이다" → "I am a student"
    //   src/tgt 길이가 다르고(3+EOS vs 4+EOS), 어순도 1:1 대응이 아니다
    // ─────────────────────────────────────────────────────
    const SRC_TOKENS = ['나는', '학생', '이다', '<EOS>'];
    const TGT_TOKENS = ['I', 'am', 'a', 'student', '<EOS>'];

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   각 step = { title, desc, actor, pane 종류별 데이터, anim(선택: 내부 틱 프레임), code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      problem: {lang:'python', filename:'translation_problem.py', lines:[
        '"""',
        'translation_problem.py — 번역이 분류와 다른 이유',
        '',
        '분류: 입력 → 고정 차원 벡터 1개 (클래스 확률)',
        '번역: 입력 시퀀스(길이 m) → 출력 시퀀스(길이 n), m != n',
        '"""',
        'import torch',
        '',
        '# 토큰화 — 문장을 정수 id 시퀀스로',
        'SRC_VOCAB = {"<PAD>": 0, "<SOS>": 1, "<EOS>": 2,',
        '             "나는": 3, "학생": 4, "이다": 5}',
        'TGT_VOCAB = {"<PAD>": 0, "<SOS>": 1, "<EOS>": 2,',
        '             "I": 3, "am": 4, "a": 5, "student": 6}',
        '',
        'src = torch.tensor([3, 4, 5, 2])        # 나는 학생 이다 <EOS>',
        'tgt = torch.tensor([1, 3, 4, 5, 6, 2])  # <SOS> I am a student <EOS>',
        '',
        'print(len(src), len(tgt))  # 4, 6 — 길이가 다르다!',
        '',
        '# 시도 1: 분류기 — 출력이 고정 차원. [0.1, 0.9] 로 문장을 못 만든다',
        '',
        '# 시도 2: 토큰별 1:1 치환 — 나는->I, 학생->student, 이다->am',
        '# => "I student am" (어순 붕괴, 길이 3->4 불가, "a" 는 어디서?)',
        '',
        '# 필요한 것: 시퀀스 -> 시퀀스',
        '#  1) 입력 전체를 먼저 "이해" 하고     (인코더)',
        '#  2) 출력 길이를 스스로 정하며 생성    (디코더, <EOS> 까지)',
        '# 이것이 seq2seq (Sutskever et al., 2014) 의 문제 설정이다.',
      ]},
      encdec: {lang:'python', filename:'seq2seq.py — Encoder / Decoder', lines:[
        '"""',
        'seq2seq.py — 인코더/디코더 (PyTorch)',
        '',
        '인코더: 입력 시퀀스 -> 마지막 은닉 상태(컨텍스트 벡터)',
        '디코더: 컨텍스트 벡터 -> 출력 시퀀스 (한 토큰씩)',
        '"""',
        'import torch',
        'import torch.nn as nn',
        '',
        '',
        'class Encoder(nn.Module):',
        '    """입력 문장을 읽어 컨텍스트 벡터 하나로 압축한다."""',
        '',
        '    def __init__(self, vocab_size: int, emb_dim: int = 256,',
        '                 hid_dim: int = 512):',
        '        super().__init__()',
        '        self.embedding = nn.Embedding(vocab_size, emb_dim)',
        '        self.rnn = nn.GRU(emb_dim, hid_dim, batch_first=True)',
        '',
        '    def forward(self, src: torch.Tensor) -> torch.Tensor:',
        '        # src: (batch, src_len)',
        '        embedded = self.embedding(src)      # (batch, len, emb)',
        '        outputs, hidden = self.rnn(embedded)',
        '        # outputs: 모든 시점의 h — seq2seq 는 이걸 "버린다"',
        '        # hidden : 마지막 h 하나 — 문장 전체의 요약본',
        '        return hidden  # (1, batch, hid_dim) = 컨텍스트 벡터',
        '',
        '',

    const S1 = { title:'Step 1. 번역 문제의 구조 — 입력과 출력의 길이가 다르다', desc:'"나는 학생이다"는 토큰 3개, "I am a student"는 토큰 4개다. 지금까지 배운 분류 모델은 출력 차원이 고정이라 — 개/고양이 2개, 숫자 10개처럼 — 애초에 이 문제를 담을 수 없다. 게다가 어순까지 다르다: 한국어 서술어 "이다"는 문장 끝인데 영어 동사 "am"은 두 번째로 온다. 즉 토큰 i번을 토큰 i번으로 바꾸는 단순 치환도 불가능하고, 필요한 것은 시퀀스를 통째로 읽고 길이가 다른 시퀀스를 통째로 만들어내는 모델 — sequence to sequence다. 2014년 이전의 통계 기반 번역이 구문 정렬 규칙으로 이걸 흉내내다 한계에 부딪혔고, 여기서 신경망 번역(NMT)이 출발한다.' };
    const S2 = { title:'Step 2. 인코더-디코더 — 두 RNN의 협업', desc:'해법은 RNN 두 개를 이어 붙이는 것이다. 인코더 RNN이 입력 토큰을 하나씩 읽으며 은닉 상태 h를 갱신하고, 마지막 h — 컨텍스트 벡터 — 에 문장 전체의 의미를 압축한다. 디코더 RNN은 그 벡터를 첫 은닉 상태로 물려받아, 거기서부터 출력 문장을 생성한다. 왼쪽 애니메이션을 보라: 토큰이 들어갈 때마다 게이지가 차오르는데, 이것이 "문장 전체를 벡터 하나에 욱여넣는" 과정이다. 핵심 설계는 두 RNN이 가중치를 공유하지 않는다는 것 — 읽기(한국어 이해)와 쓰기(영어 생성)는 다른 기술이므로 파라미터도 분리한다. 두 세계를 잇는 유일한 통로가 컨텍스트 벡터 하나라는 사실을 기억해 두자. Step 4의 비극이 바로 여기서 시작된다.' };

      if (!box) return null;
      const Token = ({ w, tone }) => (
        <span className={`px-2 py-1 rounded border-2 text-[11px] font-bold ${tone === 'src' ? 'border-rose-400 bg-rose-50 text-rose-900' : 'border-sky-400 bg-sky-50 text-sky-900'}`}>{w}</span>
      );
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">↔ 길이 3 → 길이 4, 어순도 교차</div>
          <div className="flex items-center gap-1.5 flex-wrap mb-1">
            <span className="text-[10px] text-slate-500 w-10">입력</span>
            {box.src.map((w) => <Token key={w} w={w} tone="src" />)}
            <span className="text-[10px] text-slate-500 ml-1">(3 토큰)</span>
          </div>
          <div className="text-center text-rose-400 text-sm leading-none my-0.5">⤵ ⤫ ⤵ — 1:1 대응이 아니다</div>
          <div className="flex items-center gap-1.5 flex-wrap">
            <span className="text-[10px] text-slate-500 w-10">출력</span>
            {box.tgt.map((w) => <Token key={w} w={w} tone="tgt" />)}
            <span className="text-[10px] text-slate-500 ml-1">(4 토큰)</span>
          </div>
          <div className="mt-2 text-[10px] text-slate-600">{box.note}</div>
        </div>
      );
    }

    function FailBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-slate-300 bg-slate-50 p-3">
          <div className="text-xs font-bold text-slate-800 mb-2">🚫 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-slate-600 border-b border-slate-300">
                <th className="text-left py-0.5">모델</th>
                <th className="text-left py-0.5 pl-2">출력 형태</th>
                <th className="text-left py-0.5 pl-2">판정</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.model} className="border-t border-slate-200">
                  <td className="py-1 font-bold text-slate-800">{r.model}</td>
                  <td className="py-1 pl-2 text-slate-600 font-mono">{r.out}</td>
                  <td className={`py-1 pl-2 font-bold ${r.verdict.includes('✓') ? 'text-emerald-700' : 'text-red-700'}`}>{r.verdict}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 인코더 압축(게이지) → 컨텍스트 벡터 → 디코더 생성 애니메이션
    //   tick 0..3      : 인코더가 SRC_TOKENS 를 하나씩 읽음 (게이지 차오름)
    //   tick 4..8      : 디코더가 TGT_TOKENS 를 하나씩 생성
    // ─────────────────────────────────────────────────────
    function EncoderDecoderFlow({ tick }) {
      const encDone = Math.min(tick + 1, SRC_TOKENS.length);
      const decDone = Math.max(0, tick + 1 - SRC_TOKENS.length);
      const gauge = Math.round((encDone / SRC_TOKENS.length) * 100);
      const encFinished = encDone >= SRC_TOKENS.length;
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
          {/* 인코더 체인 */}
          <div className="text-[11px] font-bold text-rose-900 mb-1.5">① 인코더 RNN — 읽으며 h를 덮어쓴다</div>
          <div className="flex items-center gap-1 flex-wrap">
            {SRC_TOKENS.map((w, i) => (
              <React.Fragment key={w}>
                {i > 0 && <span className="text-rose-300 text-[10px]">→</span>}
                <div className={`px-1.5 py-1 rounded border-2 text-[10px] font-bold transition-all duration-500 ${
                  i < encDone ? 'border-rose-500 bg-rose-100 text-rose-900' : 'border-slate-200 bg-slate-50 text-slate-400'
                } ${i === encDone - 1 && !encFinished ? 'ring-2 ring-rose-400 scale-110' : ''}`}>
                  {w}<div className="text-[8px] font-mono text-rose-500">h{i + 1}</div>
                </div>
              </React.Fragment>
            ))}
          </div>
          {/* 컨텍스트 벡터 게이지 */}
          <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 p-2">
            <div className="flex items-center justify-between text-[10px] font-bold text-amber-900 mb-1">
              <span>🍾 컨텍스트 벡터 (고정 512차원) — 문장 전체를 압축</span>
              <span className="font-mono">{gauge}%</span>
            </div>
            <div className="h-3 rounded-full bg-white border border-amber-300 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-amber-300 to-rose-500 transition-all duration-500" style={{ width: `${gauge}%` }} />
            </div>
            <div className="mt-1 text-[9px] text-amber-800">
              {encFinished ? '압축 완료 — 이 벡터 하나만 디코더로 넘어간다 (나머지 h는 버려짐)' : `읽는 중… ${encDone}/${SRC_TOKENS.length} 토큰이 h에 누적`}
            </div>
          </div>
          {/* 디코더 체인 */}
          <div className="mt-3 text-[11px] font-bold text-sky-900 mb-1.5">② 디코더 RNN — 벡터에서 출발해 생성</div>
          <div className="flex items-center gap-1 flex-wrap min-h-[38px]">
            <div className={`px-1.5 py-1 rounded border-2 text-[10px] font-bold ${encFinished ? 'border-amber-400 bg-amber-50 text-amber-900' : 'border-slate-200 bg-slate-50 text-slate-300'}`}>ctx</div>
            {TGT_TOKENS.map((w, i) => (
              <React.Fragment key={w}>
                <span className={`text-[10px] ${i < decDone ? 'text-sky-400' : 'text-slate-200'}`}>→</span>
                <div className={`px-1.5 py-1 rounded border-2 text-[10px] font-bold transition-all duration-500 ${
                  i < decDone ? 'border-sky-500 bg-sky-100 text-sky-900' : 'border-slate-200 bg-slate-50 text-slate-300'
                } ${i === decDone - 1 ? 'ring-2 ring-sky-400 scale-110' : ''}`}>{w}</div>
              </React.Fragment>
            ))}
          </div>
          <div className="mt-1 text-[9px] text-slate-500">
            {decDone === 0 ? '인코딩이 끝나면 생성 시작…' : decDone >= TGT_TOKENS.length ? '<EOS> 출력 — 모델이 스스로 멈췄다 (출력 길이를 모델이 결정)' : `생성 중… 직전 출력 "${TGT_TOKENS[decDone - 1]}" 이 다음 입력이 된다`}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 디코딩 테이블 (한 스텝씩 공개) + 노출 편향 박스
    // ─────────────────────────────────────────────────────
    function DecodeTable({ box, tick }) {
      if (!box) return null;
      const visible = Math.min(tick + 1, box.rows.length);
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">⌨️ auto-regressive — 이전 출력 = 다음 입력</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-rose-800 border-b border-rose-200">
                <th className="text-left py-0.5">t</th>
                <th className="text-left py-0.5 pl-2">입력 (추론 시)</th>
                <th className="text-left py-0.5 pl-2">디코더 출력</th>
                <th className="text-left py-0.5 pl-2">학습 시 입력 (teacher)</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r, i) => (
                <tr key={r.t} className={`border-t border-rose-100 transition-all duration-500 ${i < visible ? 'opacity-100' : 'opacity-15'}`}>
                  <td className="py-1 font-mono">{r.t}</td>
                  <td className="py-1 pl-2 font-mono font-bold text-slate-700">{r.input}</td>
                  <td className="py-1 pl-2 font-mono font-bold text-sky-800">{r.output} {i === visible - 1 ? '◀' : ''}</td>
                  <td className="py-1 pl-2 font-mono text-emerald-700">{r.teacher} (정답 주입)</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[9px] text-slate-500">출력 열의 값이 다음 행의 입력이 된다 — 화살표를 세로로 따라가 보라.</div>
        </div>
      );
    }

    function BiasBox({ box }) {
      if (!box) return null;
      const Chain = ({ tokens, tone }) => (
        <div className="flex items-center gap-1 flex-wrap">
          {tokens.map((w, i) => (
            <React.Fragment key={i}>
              {i > 0 && <span className="text-slate-300 text-[9px]">→</span>}
              <span className={`px-1.5 py-0.5 rounded border text-[9px] font-mono font-bold ${
                w.includes('✗') || w.includes('💥') || w.includes('…') ? 'border-red-400 bg-red-50 text-red-800' :
                tone === 'good' ? 'border-emerald-300 bg-emerald-50 text-emerald-800' : 'border-slate-300 bg-white text-slate-700'
              }`}>{w}</span>
            </React.Fragment>
          ))}
        </div>
      );
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-2">⚠️ {box.title}</div>
          <div className="text-[9px] text-emerald-800 font-bold mb-0.5">학습 때 (teacher forcing — 항상 정답 위에서 배움)</div>
          <Chain tokens={box.good} tone="good" />
          <div className="text-[9px] text-red-800 font-bold mt-2 mb-0.5">추론 때 (한 번 틀리면 틀린 토큰 위에서 계속 생성)</div>
          <Chain tokens={box.bad} tone="bad" />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 정보 보존율 + 문장 길이별 BLEU 그래프
    // ─────────────────────────────────────────────────────
    function BottleneckGraph({ box }) {
      if (!box) return null;
      const maxBleu = 30;
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">🍾 40단어 문장을 읽은 뒤, 벡터에 남은 정보</div>
          <div className="space-y-1">
            {box.retention.map((r) => (
              <div key={r.pos} className="flex items-center gap-2 text-[10px]">
                <span className="w-24 text-slate-600 shrink-0">{r.pos}</span>
                <div className="flex-1 h-2.5 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full transition-all duration-700 ${r.keep < 40 ? 'bg-red-400' : r.keep < 70 ? 'bg-amber-400' : 'bg-emerald-500'}`} style={{ width: `${r.keep}%` }} />
                </div>
                <span className="w-8 text-right font-mono">{r.keep}%</span>
                <span className="w-32 text-slate-500 shrink-0 hidden sm:inline">{r.label}</span>
              </div>
            ))}
          </div>
          <div className="mt-1 text-[9px] text-slate-500">h는 매 토큰마다 덮어쓰기된다 — 최근 것일수록 진하게, 오래된 것일수록 희미하게 남는다.</div>

          <div className="mt-3 text-xs font-bold text-rose-900 mb-1.5">📉 문장 길이별 번역 품질 (BLEU)</div>
          <div className="flex items-end gap-2 h-28 border-b-2 border-l-2 border-slate-300 pl-2 pb-0.5">
            {box.bleu.map((b) => (
              <div key={b.len} className="flex-1 flex flex-col items-center justify-end gap-0.5 h-full">
                <span className="text-[9px] font-mono font-bold text-slate-700">{b.score}</span>
                <div className={`w-full rounded-t transition-all duration-700 ${b.score >= 22 ? 'bg-emerald-500' : b.score >= 14 ? 'bg-amber-400' : 'bg-red-500'}`}
                     style={{ height: `${(b.score / maxBleu) * 100}%` }} />
                <span className="text-[9px] text-slate-600">{b.len}</span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-red-800 font-bold">20단어를 넘는 순간부터 급락 — 벡터 하나의 용량 한계가 그대로 성적표에 찍힌다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 어텐션 미리보기 + 유산 정리
    // ─────────────────────────────────────────────────────
    function AttentionPreview({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
          <div className="text-xs font-bold text-emerald-900 mb-2">🔭 어텐션 미리보기 — "{box.query}" 생성 시 어디를 보는가</div>
          <div className="flex items-center justify-center gap-3">
            {box.src.map((w, i) => (
              <div key={w} className="flex flex-col items-center gap-1">
                <span className={`px-2 py-1 rounded border-2 text-[11px] font-bold transition-all ${box.weights[i] > 0.5 ? 'border-emerald-500 bg-emerald-100 text-emerald-900 scale-110' : 'border-slate-300 bg-slate-50 text-slate-500'}`}>{w}</span>
                <div className="w-10 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                  <div className="h-full bg-emerald-500" style={{ width: `${box.weights[i] * 100}%` }} />
                </div>
                <span className="text-[9px] font-mono text-slate-600">{box.weights[i].toFixed(2)}</span>
              </div>
            ))}
          </div>
          <div className="text-center text-emerald-500 text-sm my-1">↖ ↑ ↗ (매 스텝 전체를 조회)</div>
          <div className="flex justify-center">
            <span className="px-2 py-1 rounded border-2 border-sky-500 bg-sky-100 text-sky-900 text-[11px] font-bold">디코더: "{box.query}" 생성 중</span>
          </div>
          <div className="mt-2 text-[10px] text-slate-600 text-center">"am"을 만들 땐 "이다"에 0.82 집중 — 고정 벡터 하나 대신, 스텝마다 새로 조합한다.</div>
        </div>
      );
    }

    function LegacyBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-emerald-50 p-3">
          <div className="text-sm font-bold text-rose-900 mb-2">🏛 {box.title}</div>
          <table className="w-full text-[10px]">
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.item} className="border-t border-rose-200 first:border-t-0">
                  <td className="py-1 font-bold text-slate-800 w-1/2">{r.item}</td>
                  <td className={`py-1 pl-2 ${r.to.includes('✂') ? 'text-red-700 font-bold' : 'text-emerald-700'}`}>{r.to}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 seq2seq 시뮬레이션 (rose 톤)
    //   step.anim 이 있으면 내부 틱 타이머로 인코딩/디코딩을 한 프레임씩 재생
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, state, stepIdx }) {
      const [tick, setTick] = useState(0);

      useEffect(() => {
        setTick(0);
        if (!state.anim) return;
        const id = setInterval(() => {
          setTick((t) => (t + 1) % state.anim.frames);
        }, state.anim.ms);
        return () => clearInterval(id);
      }, [STEP_NO[stepIdx]]);

      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>🔬</span>
              <span>seq2seq 실험실</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.anim && (
            <div className="text-[10px] text-rose-700 font-mono mb-2 px-2 py-1 rounded bg-rose-50 border border-rose-200">
              내부 재생 프레임 {tick + 1}/{state.anim.frames} — 단계 안에서 자동 반복
            </div>
          )}
          <MismatchDiagram box={state.mismatch} />
          <FailBox box={state.failBox} />
          {state.encdec && <EncoderDecoderFlow tick={tick} />}
          <DecodeTable box={state.decodeTable} tick={tick} />
          <BiasBox box={state.biasBox} />
          <BottleneckGraph box={state.bottleneck} />
          <AttentionPreview box={state.attention} />
          <LegacyBox box={state.legacyBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">III-2-2. seq2seq와 병목 문제</h1>
                <p className="text-sm text-rose-800/80">문장 전체를 벡터 하나에 욱여넣기 — 번역 모델의 돌파구와 그 대가</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                seq2seq는 인코더 RNN이 입력 문장 전체를 고정 크기 컨텍스트 벡터 하나로 압축하고,
                디코더 RNN이 그 벡터에서 출발해 &lt;EOS&gt;까지 auto-regressive로 생성하는 구조다.
                학습은 teacher forcing(정답 주입)으로 안정화하지만 그 대가로 노출 편향이 생기고,
                무엇보다 "벡터 하나"라는 병목 탓에 문장이 길어질수록 앞부분 정보가 소실되어 BLEU가 급락한다.
                해법은 버렸던 인코더의 모든 시점을 디코더가 매 스텝 다시 보는 것 — 어텐션이며,
                인코더-디코더 구조·특수 토큰·생성 방식은 Transformer와 LLM으로 그대로 계승된다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['seq2seq', '인코더디코더', '컨텍스트벡터', 'auto-regressive', 'teacher-forcing', '노출편향', '병목문제', 'BLEU', 'GRU', '어텐션예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="./III-2-1.html" className="underline hover:no-underline">← 이전: III-2-1 (LSTM·GRU)</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: IV-1-1 (어텐션의 등장) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
