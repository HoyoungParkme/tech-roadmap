  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 문장 토큰 — 빈칸(t=21)에서 20스텝 앞의 "cat"(t=1)까지
    //   role: 'clue'(먼 결정적 단서) | 'trap'(가까운 교란 단서) | 'blank'(예측 지점) | 'filler'
    // ─────────────────────────────────────────────────────

    const MAX_DIST = BLANK_IDX - CLUE_IDX; // 20

    // ─────────────────────────────────────────────────────
    // 기울기 실계산 — |∂L/∂h_{t-k}| ≈ (|W_h|·tanh')^k
    //   소실: |W_h|=0.9, tanh'≈0.45 → 스텝당 ×0.405 → 20스텝에 1.1e-8
    //   폭주: |W_h|=2.2, tanh'≈0.82 → 스텝당 ×1.8   → 20스텝에 1.3e+5
    // ─────────────────────────────────────────────────────
    const VANISH_FACTOR = 0.405;
    const EXPLODE_FACTOR = 1.8;
    const gradAt = (factor, k) => Math.pow(factor, k);
    const fmtExp = (v) => {
      if (v === 0) return '0';
      const e = Math.floor(Math.log10(v));
      const m = v / Math.pow(10, e);
      return `${m.toFixed(1)}e${e >= 0 ? '+' : ''}${e}`;
    };

    // ─────────────────────────────────────────────────────

        code: {

            '',
            '  dL/dh_{t-k}  ∝  ∏_{i=1..k}  W_h · diag(tanh\'(z_i))',
            '',
            '  tanh\' <= 1 이므로:',
            '    |W_h| < 1  →  (작은 수)^k  →  지수적 소멸',

            '"""',

        code: {

      },
      {
        title: 'Step 5. 해결의 방향 — 곱셈의 연쇄를 덧셈의 통로로',
        desc: '문제를 한 문장으로 요약하면 "20번의 곱셈"이다. 그렇다면 해법의 방향도 정해진다 — 곱하지 말고 더하자. 덧셈의 기울기는 1이다: c_t = c_{t-1} + (새 정보)라면 ∂c_t/∂c_{t-1} = 1이라 스무 스텝을 거슬러도 신호가 줄지 않는다. 이 통찰은 딥러닝 역사에서 반복해서 등장한다: 1997년 LSTM이 cell state라는 덧셈 고속도로(+ 게이트)를 만들었고, ReLU는 tanh′≤1의 감쇠를 미분값 1로 없앴으며, 2015년 ResNet의 skip connection(x + F(x))은 같은 아이디어로 100층 CNN을 뚫었고, 2017년 Transformer는 아예 순차 연쇄를 버리고 어텐션으로 먼 단어에 직통 경로를 놓았다. 다음 장(III-2)에서 이 중 첫 해법 — LSTM의 cell state가 게이트로 덧셈 통로를 제어하는 방식을 열어본다.',
        pane: { mode: 'solution' },

        code: {
          lang: 'python',

            '',
            '  곱셈:  h_t = tanh(W_h @ h_{t-1} + ...)   → ∂h_t/∂h_{t-1} = W_h·tanh\'',
            '  덧셈:  c_t = c_{t-1} + g(x_t)            → ∂c_t/∂c_{t-1} = 1',

            'def backprop_through(steps: int, additive: bool) -> float:',

            '    g = torch.ones(64)',
            '    W = torch.randn(64, 64) * 0.05        # 곱셈 경로용',

            '',
            '# 같은 20스텝인데 덧셈 통로 위의 기울기는 거의 그대로다.',

            '',

            '#    20      52%        84%',

            '# 2011~ ReLU        tanh\'<=1 감쇠 제거 (미분값 1)',
            '# 2015  ResNet      x + F(x) = 깊이 방향 덧셈 통로 (skip)',
            '# 2017  Transformer 순차 연쇄 자체를 폐기 — 어텐션 직통 경로',

    // ─────────────────────────────────────────────────────
    // 토큰 스타일
    // ─────────────────────────────────────────────────────
    const TOKEN_STYLE = {
      clue:   'bg-rose-600 text-white border-rose-700 font-bold',
      trap:   'bg-amber-100 text-amber-900 border-amber-400 font-bold',
      blank:  'bg-white text-rose-700 border-rose-500 border-dashed font-bold',
      filler: 'bg-white text-slate-600 border-slate-200',
    };

    // ─────────────────────────────────────────────────────
    // 문장 + 의존성 아치 (SVG) — cat ↔ ___ 를 잇는 곡선
    // ─────────────────────────────────────────────────────
    function SentenceArch({ showArch, gradByDist }) {
      // 토큰을 flex-wrap으로 두면 아치를 못 그리므로, 그리드 좌표를 직접 계산한 SVG 위에 배치
      const perRow = 8;
      const cellW = 100 / perRow;
      const rowH = 44;
      const rows = Math.ceil(TOKENS.length / perRow);
      const pos = (i) => ({
        x: (i % perRow) * cellW + cellW / 2,
        row: Math.floor(i / perRow),
      });
      const p1 = pos(CLUE_IDX);
      const p2 = pos(BLANK_IDX);
      return (
        <div className="relative w-full" style={{ height: rows * rowH + (showArch ? 52 : 26) }}>
          {/* 아치: 같은 그림 안에서 cat → blank 를 잇는 점선 (행이 달라 꺾인 경로로 표현) */}
          {showArch && (
            <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox={`0 0 100 ${rows * rowH + 26}`} preserveAspectRatio="none">
              <path
                d={`M ${p1.x} ${p1.row * rowH + 24} C ${p1.x + 30} ${-14}, ${p2.x - 30} ${p2.row * rowH - 30}, ${p2.x} ${p2.row * rowH + 22}`}
                fill="none" stroke="#e11d48" strokeWidth="1.4" strokeDasharray="3 2" vectorEffect="non-scaling-stroke"
              />
            </svg>
          )}
          {showArch && (
            <div className="absolute left-1/2 -translate-x-1/2 text-[10px] font-bold text-rose-700 bg-white/90 border border-rose-300 rounded px-1.5 py-0.5 whitespace-nowrap"
                 style={{ top: rows * rowH + 26 }}>
              거리 20 — is/are 는 이 선 끝의 cat 이 결정한다
            </div>
          )}
          {TOKENS.map((t, i) => {
            const { x, row } = pos(i);
            const dist = BLANK_IDX - i;
            // 기울기 감쇠를 배경 투명도로도 표현 (flow 모드에서)
            const g = gradByDist && dist >= 0 && dist <= MAX_DIST ? gradByDist(dist) : null;
            return (
              <div
                key={i}
                className={`absolute -translate-x-1/2 px-1.5 py-0.5 rounded border text-[11px] whitespace-nowrap ${TOKEN_STYLE[t.role]}`}
                style={{
                  left: `${x}%`, top: row * rowH + 26,
                  opacity: g !== null ? Math.max(0.25, Math.min(1, 0.25 + g * 0.75)) : 1,
                }}
              >
                {t.w}
                {t.role === 'clue' && <span className="ml-1 text-[8px]">단수!</span>}
                {t.role === 'trap' && <span className="ml-1 text-[8px]">복수?</span>}
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // RNN의 예측 박스 (Step 1)
    // ─────────────────────────────────────────────────────
    function PredictionBox({ pred }) {
      if (!pred) return null;
      const Row = ({ label, p, wrong }) => (
        <div className="flex items-center gap-2">
          <span className={`w-8 text-[11px] font-mono font-bold ${wrong ? 'text-red-700' : 'text-emerald-700'}`}>{label}</span>
          <div className="flex-1 h-3 rounded-full bg-slate-100 overflow-hidden">
            <div className={`h-full ${wrong ? 'bg-red-400' : 'bg-emerald-400'} transition-all duration-700`} style={{ width: `${p * 100}%` }} />
          </div>
          <span className="text-[10px] font-mono w-9 text-right text-slate-600">{Math.round(p * 100)}%</span>
          <span className="text-[10px] w-14">{wrong ? '← RNN 선택 ✗' : '정답 ✓'}</span>
        </div>
      );
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-white p-3">
          <div className="text-xs font-bold text-red-800 mb-2">🤖 RNN(tanh, hidden 64)의 빈칸 예측</div>
          <div className="space-y-1.5">
            <Row label="is" p={pred.is} wrong={false} />
            <Row label="are" p={pred.are} wrong={true} />
          </div>
          <div className="mt-2 text-[10px] text-slate-600">
            hidden state에는 가까운 fish·neighbors의 "복수" 흔적이 진하게, 20스텝 전 cat의 "단수" 흔적은 희미하게 남았다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 기울기 크기 실계산 차트 — 거리 k에 대한 factor^k (로그 스케일)
    // ─────────────────────────────────────────────────────
    function GradientChart({ series, title, note }) {
      // series: [{ label, factor, color }] — 거리 0..20
      const LOG_MIN = -9, LOG_MAX = 6;
      const hPct = (v) => {
        const lg = Math.max(LOG_MIN, Math.min(LOG_MAX, Math.log10(v)));
        return ((lg - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 100;
      };
      const marks = [0, 5, 10, 15, 20];
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-1">📐 {title}</div>
          <div className="flex gap-3 text-[9px] mb-1.5">
            {series.map((s) => (
              <span key={s.label} className="flex items-center gap-1">
                <span className={`w-2.5 h-2.5 rounded-sm ${s.color}`} />
                {s.label}
              </span>
            ))}
            <span className="ml-auto text-slate-500">세로: log₁₀ |grad| (기준선 = 10⁰)</span>
          </div>
          <div className="relative h-32 border-b border-l border-slate-300">
            {/* 10^0 기준선 */}
            <div className="absolute left-0 right-0 border-t border-dashed border-slate-400" style={{ bottom: `${hPct(1)}%` }}>
              <span className="absolute -left-0.5 -top-3.5 text-[8px] text-slate-500 bg-white px-0.5">10⁰ = 신호 유지선</span>
            </div>
            <div className="absolute inset-0 flex items-end gap-[2px] px-1">
              {Array.from({ length: MAX_DIST + 1 }, (_, k) => (
                <div key={k} className="flex-1 flex items-end gap-[1px] h-full">
                  {series.map((s) => (
                    <div key={s.label} className={`flex-1 ${s.color} rounded-t-sm transition-all duration-500`}
                         style={{ height: `${Math.max(1.5, hPct(gradAt(s.factor, k)))}%` }} />
                  ))}
                </div>
              ))}
            </div>
          </div>
          <div className="flex justify-between text-[8px] text-slate-500 mt-0.5 px-1">
            {marks.map((m) => <span key={m}>k={m}</span>)}
          </div>
          <div className="mt-1.5 grid grid-cols-2 gap-1 text-[9px] font-mono">
            {series.map((s) => (
              <div key={s.label} className="rounded bg-slate-50 border border-slate-200 px-1.5 py-1 text-slate-700">
                {s.label}: k=20 → <b>{fmtExp(gradAt(s.factor, 20))}</b>
              </div>
            ))}
          </div>
          {note && <div className="mt-1.5 text-[10px] text-rose-900">{note}</div>}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // BPTT 역방향 애니메이션 (Step 3) — 오차 신호가 거슬러 가며 줄어든다
    // ─────────────────────────────────────────────────────
    function BackpropFlow() {
      const [k, setK] = useState(0); // 빈칸으로부터 거슬러 온 거리
      useEffect(() => {
        const id = setInterval(() => setK((v) => (v >= MAX_DIST ? 0 : v + 1)), 450);
        return () => clearInterval(id);
      }, []);
      const g = gradAt(VANISH_FACTOR, k);
      const gradByDist = (d) => (d <= k ? gradAt(VANISH_FACTOR, d) : 1); // 지나온 토큰은 감쇠 표시
      const curIdx = BLANK_IDX - k;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="flex items-center justify-between mb-1">
            <div className="text-xs font-bold text-rose-900">⏪ BPTT — 오차 신호가 시간을 거슬러 간다 (스텝당 ×{VANISH_FACTOR})</div>
            <span className="text-[10px] font-mono text-rose-700">k={k} · 현재 위치: "{TOKENS[curIdx].w}"</span>
          </div>
          <SentenceArch showArch={false} gradByDist={gradByDist} />
          <div className="mt-2 flex items-center gap-2">
            <span className="text-[10px] text-slate-600 w-24">지금 전달 중인<br/>학습 신호 크기</span>
            <div className="flex-1 h-4 rounded bg-slate-100 overflow-hidden">
              <div className="h-full bg-rose-500 transition-all duration-300"
                   style={{ width: `${Math.max(0.5, ((Math.log10(g) + 9) / 9) * 100)}%` }} />
            </div>
            <span className="text-[11px] font-mono font-bold text-rose-800 w-16 text-right">{fmtExp(g)}</span>
          </div>
          <div className="mt-1.5 text-[10px] text-slate-600">
            토큰이 흐려질수록 그 시점에 도달하는 학습 신호가 작다는 뜻 — <b className="text-rose-800">cat(k=20)에 도착할 땐 1.4e-8, 그 시점 가중치는 사실상 업데이트되지 않는다.</b>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 클리핑 전후 비교 (Step 4)
    // ─────────────────────────────────────────────────────
    function ClipCompare() {
      const rows = [
        { name: '폭주 기울기 (k=20, ×1.8)', before: gradAt(EXPLODE_FACTOR, 20), after: 1.0, fixed: true },
        { name: '정상 기울기 (k=3)',        before: gradAt(VANISH_FACTOR, 3),  after: gradAt(VANISH_FACTOR, 3), fixed: false },
        { name: '소실 기울기 (k=20, ×0.405)', before: gradAt(VANISH_FACTOR, 20), after: gradAt(VANISH_FACTOR, 20), fixed: false },
      ];
      const w = (v) => `${Math.max(1, ((Math.log10(Math.max(v, 1e-9)) + 9) / 15) * 100)}%`;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-400 bg-white p-3">
          <div className="text-xs font-bold text-amber-900 mb-2">✂️ clip_grad_norm_(max_norm=1.0) — 전 / 후 (로그 스케일)</div>
          {rows.map((r) => (
            <div key={r.name} className="mb-2">
              <div className="text-[10px] text-slate-700 mb-0.5">{r.name}</div>
              <div className="flex items-center gap-1.5">
                <span className="text-[9px] w-6 text-slate-500">전</span>
                <div className="flex-1 h-2.5 rounded bg-slate-100 overflow-hidden">
                  <div className={`h-full ${r.before > 10 ? 'bg-red-500' : r.before < 1e-4 ? 'bg-slate-300' : 'bg-emerald-400'}`} style={{ width: w(r.before) }} />
                </div>
                <span className="text-[9px] font-mono w-14 text-right text-slate-600">{fmtExp(r.before)}</span>
              </div>
              <div className="flex items-center gap-1.5 mt-0.5">
                <span className="text-[9px] w-6 text-slate-500">후</span>
                <div className="flex-1 h-2.5 rounded bg-slate-100 overflow-hidden">
                  <div className={`h-full ${r.fixed ? 'bg-emerald-500' : r.after < 1e-4 ? 'bg-slate-300' : 'bg-emerald-400'}`} style={{ width: w(r.after) }} />
                </div>
                <span className={`text-[9px] font-mono w-14 text-right ${r.fixed ? 'text-emerald-700 font-bold' : r.after < 1e-4 ? 'text-red-700 font-bold' : 'text-slate-600'}`}>{fmtExp(r.after)}</span>
              </div>
            </div>
          ))}
          <div className="rounded bg-amber-50 border border-amber-300 px-2 py-1.5 text-[10px] text-amber-900">
            폭주(1.3e+5)는 1.0으로 잘려 학습이 살아난다(NaN 방지 ✓). 그러나 소실(1.4e-8)은 상한 "아래"라 손대지 않는다 —
            <b> 클리핑은 큰 걸 줄일 뿐, 작은 걸 키우지 못한다.</b> 억지로 키워도 방향 정보가 이미 노이즈다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 곱셈 연쇄 vs 덧셈 통로 개념도 + 연대기 (Step 5)
    // ─────────────────────────────────────────────────────
    function PathwayDiagram() {
      const mulVals = [1, 0.405, 0.164, 0.066, 0.027];
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">🛣 곱셈의 연쇄 vs 덧셈의 통로</div>
          {/* 곱셈 연쇄 */}
          <div className="rounded border border-red-300 bg-red-50 p-2 mb-2">
            <div className="text-[10px] font-bold text-red-800 mb-1.5">RNN: h → h → h ... 매번 W_h·tanh′ 를 "곱한다"</div>
            <div className="flex items-center gap-1">
              {mulVals.map((v, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-[9px] text-red-600 font-mono">×0.4→</span>}
                  <div className="flex-1 rounded border border-red-400 bg-white text-center py-1"
                       style={{ opacity: Math.max(0.25, v) }}>
                    <div className="text-[9px] font-mono text-red-800">h</div>
                    <div className="text-[8px] font-mono text-red-600">{v.toFixed(3)}</div>
                  </div>
                </React.Fragment>
              ))}
              <span className="text-[9px] text-red-700 font-bold ml-1">…→ 0</span>
            </div>
          </div>
          {/* 덧셈 통로 */}
          <div className="rounded border border-emerald-400 bg-emerald-50 p-2">
            <div className="text-[10px] font-bold text-emerald-800 mb-1.5">LSTM cell state: c → c → c ... 새 정보를 "더한다" (∂c_t/∂c_(t-1) = 1)</div>
            <div className="flex items-center gap-1">
              {[0, 1, 2, 3, 4].map((i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-[9px] text-emerald-600 font-mono">＋→</span>}
                  <div className="flex-1 rounded border border-emerald-500 bg-white text-center py-1">
                    <div className="text-[9px] font-mono text-emerald-800">c</div>
                    <div className="text-[8px] font-mono text-emerald-600">1.000</div>
                  </div>
                </React.Fragment>
              ))}
              <span className="text-[9px] text-emerald-700 font-bold ml-1">신호 유지 ✓</span>
            </div>
          </div>
          <div className="mt-1.5 text-[10px] text-slate-600">ResNet의 x + F(x) skip connection과 정확히 같은 통찰 — 방향만 다르다(ResNet은 깊이, LSTM은 시간).</div>
        </div>
      );
    }

    function SolutionTimeline() {
      const items = [
        { year: '1997', name: 'LSTM', note: 'cell state = 시간 방향 덧셈 고속도로 + 게이트', hot: true },
        { year: '2011~', name: 'ReLU', note: "tanh′≤1 감쇠 제거 — 활성 구간 미분값 1", hot: false },
        { year: '2015', name: 'ResNet', note: 'x + F(x) skip — 깊이 방향 덧셈 통로, 100층 돌파', hot: false },
        { year: '2017', name: 'Transformer', note: '순차 연쇄 폐기 — 어텐션으로 먼 단어 직통 연결', hot: false },
      ];
      return (
        <div className="mt-3 rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-amber-50 p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">📜 소실 문제 해결 연대기 — 전부 "덧셈 통로"의 변주다</div>
          <div className="space-y-1.5">
            {items.map((it) => (
              <div key={it.year} className={`flex items-center gap-2 rounded border px-2 py-1.5 ${it.hot ? 'border-rose-500 bg-white' : 'border-slate-200 bg-white/70'}`}>
                <span className="text-[10px] font-mono font-bold text-rose-700 w-10">{it.year}</span>
                <span className={`text-[11px] font-bold w-24 ${it.hot ? 'text-rose-800' : 'text-slate-800'}`}>{it.name}{it.hot && ' ⭐'}</span>
                <span className="text-[10px] text-slate-600 flex-1">{it.note}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-rose-900 font-bold">다음 장(III-2): LSTM — 덧셈 통로에 "게이트"라는 밸브를 단다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 시뮬레이션 (rose 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      sentence: { icon: '🔗', label: '장거리 의존성' },
      math:     { icon: '📐', label: '연쇄곱 실계산' },
      flow:     { icon: '⏪', label: 'BPTT 신호 추적' },
      clip:     { icon: '✂️', label: '클리핑 실험실' },
      solution: { icon: '🛣', label: '해결의 방향' },
    };

    function LiveDataPane({ state }) {
      const p = state.pane;
      const badge = MODE_BADGE[p.mode] || MODE_BADGE.sentence;
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>기울기 관측소 — {badge.label}</span>
            </h3>
            <span className="text-[10px] font-mono text-rose-700 px-2 py-0.5 rounded bg-rose-50 border border-rose-200">
              ∂L/∂h ∝ ∏(W_h·tanh′)
            </span>
          </div>

          {/* Step 1: 문장 + 아치 + 오답 예측 */}
          {p.mode === 'sentence' && (
            <div>
              <SentenceArch showArch={p.showArch} gradByDist={null} />
              {p.showPred && <PredictionBox pred={state.pred} />}
            </div>
          )}

          {/* Step 2: 소실/폭주 실계산 그래프 */}
          {p.mode === 'math' && (
            <div>
              <div className="rounded bg-slate-50 border border-slate-200 px-2.5 py-2 text-[11px] font-mono text-slate-700">
                ∂L/∂h_(t−k) ∝ ∏_(i=1..k) W_h · diag(tanh′) &nbsp;≈&nbsp; (스텝당 배율)^k
              </div>
              <GradientChart
                title="시점 거리 k별 기울기 크기 — 실계산"
                series={[
                  { label: '소실 |W|<1 (×0.405/스텝)', factor: VANISH_FACTOR, color: 'bg-rose-500' },
                  { label: '폭주 |W|>1 (×1.8/스텝)', factor: EXPLODE_FACTOR, color: 'bg-red-700' },
                ]}
                note='둘 다 "지수 함수"라 중간이 없다 — 20스텝이면 10⁻⁸ 아니면 10⁺⁵. 매 스텝 같은 W_h를 곱하는 구조가 원인이다.'
              />
            </div>
          )}

          {/* Step 3: 역전파 애니메이션 */}
          {p.mode === 'flow' && <BackpropFlow />}

          {/* Step 4: 클리핑 전후 */}
          {p.mode === 'clip' && (
            <div>
              <GradientChart
                title="폭주 기울기 — 20스텝에 1.3e+5, 다음은 NaN"
                series={[{ label: '폭주 |W|>1 (×1.8/스텝)', factor: EXPLODE_FACTOR, color: 'bg-red-700' }]}
                note={null}
              />
              <ClipCompare />
            </div>
          )}

          {/* Step 5: 곱셈 vs 덧셈 + 연대기 */}
          {p.mode === 'solution' && (
            <div>
              <PathwayDiagram />
              <SolutionTimeline />
            </div>
          )}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">III-1-2. 기울기 소실 — RNN의 한계</h1>
                <p className="text-sm text-rose-800/80">"The cat, which ate the fish yesterday, ___ hungry" — 먼 단어를 잊는 수학적 이유</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                RNN이 먼 단어를 잊는 건 용량 부족이 아니라 수학이다 — BPTT의 기울기는 ∏(W_h·tanh′)의 연쇄곱이고,
                스텝당 배율이 1에서 조금만 벗어나도 20스텝이면 10⁻⁸(소실) 또는 10⁺⁵(폭주)가 된다.
                폭주는 clip_grad_norm_으로 응급 처치가 되지만, 클리핑은 큰 걸 줄일 뿐 작은 걸 키우지 못하므로 소실엔 무력하다.
                근본 해법은 "곱셈의 연쇄"를 "덧셈의 통로"로 바꾸는 것 — ∂(c+x)/∂c=1이라 신호가 감쇠 없이 흐른다.
                다음 장에서 이 통로에 게이트를 단 LSTM cell state를 열어본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['기울기소실', '기울기폭주', 'BPTT', '연쇄곱', '장거리의존성', 'tanh미분', 'gradient-clipping', 'clip_grad_norm_', 'cell-state', 'skip-connection'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="./III-1-1.html" className="underline hover:no-underline">← 이전: III-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./III-2-1.html" className="underline hover:no-underline">다음: III-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
