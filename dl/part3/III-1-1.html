  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL III-1-1 — RNN 구조와 BPTT
    학습 목표: 순서가 정보인 데이터(MLP/CNN 의 한계) → 순환 구조 h_t = tanh(Wx·x + Wh·h + b) →
              은닉 상태가 갱신되는 실계산 애니메이션(감성 분석) → BPTT 역전파 경로 →
              many-to-one/one-to-many/many-to-many 활용 지도까지 5단계.
    패턴: fastapi v1 — 좌(LiveDataPane: 펼친 RNN 셀 체인 실계산 시뮬레이션 + BPTT 역방향 흐름)
          / 우(CodeViewer: rnn_basics.py 진화) / 색상: rose (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 실계산 미니 RNN — 좌측 패널의 모든 숫자는 아래에서 실제로 계산된다
    //   h 차원 2 / 입력 x 는 단어의 감성 점수(스칼라, 사전 임베딩 가정)
    //   h_t = tanh(Wx·x_t + Wh·h_{t-1} + b)
    // ─────────────────────────────────────────────────────
    const TOKENS = [
      { w: '영화가', x: 0.1 },
      { w: '정말',   x: 0.4 },
      { w: '재미',   x: 0.9 },
      { w: '있었다', x: 0.6 },
    ];
    const Wx = [0.8, 0.5];                       // (2,) — 입력 → 은닉
    const Wh = [[0.6, -0.2], [0.1, 0.7]];        // (2,2) — 은닉 → 은닉 (모든 스텝 공유!)
    const B  = [0.0, 0.0];

    function rnnStep(x, hPrev) {
      // h_new[i] = tanh(Wx[i]*x + Σ_j Wh[i][j]*hPrev[j] + b[i])
      return [0, 1].map((i) =>
        Math.tanh(Wx[i] * x + Wh[i][0] * hPrev[0] + Wh[i][1] * hPrev[1] + B[i])
      );
    }
    // H[0]=h0(영벡터), H[t]=t번째 토큰까지 읽은 뒤의 은닉 상태
    const H = TOKENS.reduce((acc, tk) => {
      acc.push(rnnStep(tk.x, acc[acc.length - 1]));
      return acc;
    }, [[0, 0]]);
    const sigmoid = (z) => 1 / (1 + Math.exp(-z));
    const SENTIMENT = sigmoid(1.5 * H[4][0] + 1.5 * H[4][1]); // 출력층 v=[1.5,1.5] 가정 → 0.88

    // BPTT 시각화용 — 스텝 t 의 기여가 손실까지 오려면 (T-t)번 Wh·tanh' 을 곱해 거슬러야 한다
    // 평균 |dh_t/dh_{t-1}| ≈ 0.55 로 근사한 감쇠 (다음 장 기울기 소실의 복선)
    const DECAY = 0.55;
    const GRAD_CONTRIB = [3, 2, 1, 0].map((back) => Math.pow(DECAY, back)); // t=1..4 순서

    const fmt = (v) => (v >= 0 ? '+' : '') + v.toFixed(2);

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   view : 좌측 패널 모드 'order' | 'structure' | 'forward' | 'bptt' | 'usemap'
    //   anim : 셀 체인 자동 진행 여부 (forward: 정방향, bptt: 역방향)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 순서가 정보다 — MLP/CNN 이 문장 앞에서 무너지는 이유',
        desc: '"개가 사람을 물었다"와 "사람이 개를 물었다"는 단어 구성이 완전히 같지만 의미는 정반대다. MLP 에 넣으려고 단어 빈도 벡터(Bag-of-Words)로 바꾸는 순간 두 문장의 입력이 똑같아져서, 어떤 가중치를 학습해도 원리적으로 구분이 불가능해진다. 게다가 문장·주가·센서 로그 같은 시퀀스는 길이가 매번 달라서 고정 크기 입력층에 넣을 수도 없다. 결국 필요한 건 "지금 단어"만 보는 게 아니라 "지금까지 읽은 내용을 기억한 채" 다음 단어를 읽는 구조 — 이것이 RNN 이 등장한 이유다.',
        view: 'order',
        anim: null,
        alert: { tone: 'danger', text: 'BoW 벡터가 완전히 같다 = 모델 입장에서 두 문장은 "같은 입력"이다. 순서를 버리는 표현으로는 순서가 만드는 의미를 절대 복원할 수 없다.' },
        code: {
          lang: 'python',

          <span className={`text-[8px] font-mono w-9 text-right ${active ? 'text-rose-700 font-bold' : 'text-slate-500'}`}>{fmt(v)}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 펼친 RNN 셀 체인 — Step 2(정지) / 3(정방향 애니) / 4(BPTT 역방향)
    //   tick: forward 모드 = 지금까지 읽은 토큰 수(0~4)
    //         bptt   모드 = 기울기가 도달한 위치 (4→1)
    // ─────────────────────────────────────────────────────
    function CellChain({ mode, tick }) {
      const isBptt = mode === 'bptt';
      // forward: t번 셀은 tick >= t 일 때 계산 완료 / bptt: 기울기는 뒤(t=4)에서부터 도달
      return (
        <div>
          <div className="flex items-stretch gap-1">
            {TOKENS.map((tk, idx) => {
              const t = idx + 1;
              const done = isBptt ? true : tick >= t;
              const isActive = !isBptt && tick === t; // forward 모드에서 지금 갱신된 셀
              const gradHere = isBptt && t >= 4 - tick;
              const h = done ? H[t] : H[0];
              return (
                <React.Fragment key={tk.w}>
                  {idx > 0 && (
                    <div className="flex flex-col items-center justify-center w-5">
                      <span className={`text-xs ${isBptt ? 'text-slate-300' : done ? 'text-rose-500' : 'text-slate-300'}`}>→</span>
                      {isBptt && (
                        <span className={`text-xs font-bold transition-opacity duration-500 ${t >= 4 - tick ? 'text-red-500 opacity-100' : 'opacity-15 text-red-300'}`}>←</span>
                      )}
                      <span className="text-[7px] text-slate-400 font-mono">h</span>
                    </div>
                  )}
                  <div
                    className={`flex-1 rounded-lg border-2 p-1.5 transition-all duration-500 ${
                      gradHere
                        ? 'border-red-400 bg-red-50'
                        : isActive && !isBptt
                        ? 'border-rose-500 bg-rose-50 shadow'
                        : done
                        ? 'border-rose-300 bg-white'
                        : 'border-slate-200 bg-slate-50 opacity-60'
                    }`}
                  >
                    <div className="text-[8px] text-center font-mono text-slate-500 mb-0.5">t={t}</div>
                    <div className={`text-[9px] text-center font-bold rounded px-0.5 mb-1 ${done && !isBptt ? 'bg-amber-200 text-slate-800' : 'text-slate-700'}`}>
                      {tk.w}
                    </div>
                    <div className="text-[7px] text-center text-slate-400 font-mono mb-1">x={tk.x}</div>
                    <HGauge h={h} dim={0} active={isActive && !isBptt} />
                    <HGauge h={h} dim={1} active={isActive && !isBptt} />
                    {isBptt && (
                      <div className={`mt-1 text-[8px] text-center font-mono rounded transition-all duration-500 ${gradHere ? 'bg-red-100 text-red-700 font-bold' : 'text-slate-300'}`}>
                        ∇×{GRAD_CONTRIB[idx].toFixed(2)}
                      </div>
                    )}
                  </div>
                </React.Fragment>
              );
            })}
            {/* 출력 헤드 */}
            <div className="flex flex-col items-center justify-center w-5">
              <span className={`text-xs ${isBptt ? 'text-slate-300' : tick >= 4 ? 'text-rose-500' : 'text-slate-300'}`}>→</span>
              {isBptt && <span className="text-xs font-bold text-red-500">←</span>}
            </div>
            <div className={`w-16 rounded-lg border-2 p-1.5 flex flex-col items-center justify-center transition-all duration-500 ${
              isBptt ? 'border-red-400 bg-red-50' : tick >= 4 ? 'border-emerald-400 bg-emerald-50' : 'border-slate-200 bg-slate-50 opacity-60'
            }`}>
              <div className="text-[8px] text-slate-500">{isBptt ? '손실 L' : '출력 ŷ'}</div>
              <div className={`text-sm font-bold font-mono ${isBptt ? 'text-red-600' : tick >= 4 ? 'text-emerald-700' : 'text-slate-400'}`}>
                {isBptt ? '∇L' : tick >= 4 ? SENTIMENT.toFixed(2) : '—'}
              </div>
              <div className="text-[7px] text-slate-500">{isBptt ? '출발점' : '긍정 확률'}</div>
            </div>
          </div>
          <div className="mt-1.5 flex items-center justify-between text-[9px] text-slate-500">
            <span className="font-mono">Wx=[0.8, 0.5] · Wh=[[0.6,-0.2],[0.1,0.7]] — <b className="text-rose-700">모든 셀이 공유</b></span>
            {!isBptt && <span>{tick}/4 토큰 처리</span>}
          </div>
        </div>
      );
    }

    // Step 1 — 순서 소실 데모
    function OrderView() {
      const Sentence = ({ label, words, meaning, tone }) => (
        <div className={`rounded-lg border-2 p-2 ${tone === 'a' ? 'border-sky-300 bg-sky-50' : 'border-rose-300 bg-rose-50'}`}>
          <div className="text-[9px] text-slate-500 mb-1">{label}</div>
          <div className="flex gap-1 mb-1.5 flex-wrap">
            {words.map((w, i) => (
              <span key={i} className="px-1.5 py-0.5 rounded bg-white border border-slate-300 text-[11px] font-bold text-slate-800">
                <span className="text-[8px] text-slate-400 font-mono mr-0.5">{i + 1}</span>{w}
              </span>
            ))}
          </div>
          <div className="text-[10px] text-slate-700">→ {meaning}</div>
        </div>
      );
      return (
        <div className="space-y-2">
          <Sentence label="문장 A" words={['개가', '사람을', '물었다']} meaning="🐕 개가 가해자 (흔한 일)" tone="a" />
          <Sentence label="문장 B — 같은 단어, 다른 순서" words={['사람이', '개를', '물었다']} meaning="🧑 사람이 가해자 (뉴스감!)" tone="b" />
          <div className="rounded-lg border-2 border-red-300 bg-white p-2">
            <div className="text-[10px] font-bold text-red-800 mb-1.5">Bag-of-Words 로 바꾸면 (MLP 입력)</div>
            <div className="flex items-center gap-2 text-[10px] font-mono">
              <span className="text-slate-600">A:</span>
              <span className="px-2 py-1 rounded bg-red-50 border border-red-200 text-slate-800">[개:1, 사람:1, 물었다:1]</span>
            </div>
            <div className="flex items-center gap-2 text-[10px] font-mono mt-1">
              <span className="text-slate-600">B:</span>
              <span className="px-2 py-1 rounded bg-red-50 border border-red-200 text-slate-800">[개:1, 사람:1, 물었다:1]</span>
            </div>
            <div className="mt-1.5 text-[10px] text-red-800 font-bold">= 완전히 동일한 벡터 → 어떤 가중치로도 구분 불가</div>
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2">
            <div className="text-[10px] font-bold text-rose-800 mb-1">시퀀스 데이터의 두 가지 특수성</div>
            <div className="grid grid-cols-2 gap-1.5 text-[9px]">
              <div className="rounded border border-rose-200 bg-rose-50 p-1.5">
                <b className="text-rose-800">① 순서 의존</b>
                <div className="text-slate-600 mt-0.5">문장·주가·센서 — 같은 값도 "언제 나왔나"로 의미가 바뀐다</div>
              </div>
              <div className="rounded border border-rose-200 bg-rose-50 p-1.5">
                <b className="text-rose-800">② 길이 가변</b>
                <div className="text-slate-600 mt-0.5">3단어 vs 300단어 — 고정 크기 입력층에 못 넣는다</div>
              </div>
            </div>
            <div className="mt-1.5 text-[10px] text-slate-700">해법: 한 번에 다 넣지 말고, <b className="bg-amber-200 px-0.5">하나씩 읽으며 "기억"을 들고 다니자</b></div>
          </div>
        </div>
      );
    }

    // Step 2 — 접힌 그림 vs 펼친 그림
    function StructureView() {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2">
            <div className="text-[10px] font-bold text-rose-800 mb-1.5">셀의 정의 — 한 줄이 전부다</div>
            <div className="text-center font-mono text-[12px] text-slate-800 bg-amber-100 rounded py-1.5 px-2">
              h<sub>t</sub> = tanh( W<sub>x</sub>·x<sub>t</sub> + <b className="text-rose-700">W<sub>h</sub>·h<sub>t-1</sub></b> + b )
            </div>
            <div className="mt-1 flex justify-center gap-4 text-[9px] text-slate-600">
              <span>W<sub>x</sub>·x<sub>t</sub> : 새 입력 반영</span>
              <span className="text-rose-700 font-bold">W<sub>h</sub>·h<sub>t-1</sub> : 직전 기억 반영</span>
            </div>
          </div>
          <div className="flex gap-2 items-stretch">
            {/* 접힌 그림 */}
            <div className="w-32 rounded-lg border-2 border-slate-300 bg-white p-2 flex flex-col items-center">
              <div className="text-[9px] font-bold text-slate-600 mb-1">접힌 그림 (folded)</div>
              <div className="relative mt-2">
                <div className="w-16 h-12 rounded-lg border-2 border-rose-500 bg-rose-50 flex items-center justify-center text-[11px] font-bold text-rose-800">RNN</div>
                {/* 자기 자신으로 돌아오는 순환 화살표 */}
                <div className="absolute -top-4 left-1 right-1 h-4 border-2 border-b-0 border-rose-400 rounded-t-lg"></div>
                <div className="absolute -top-1.5 right-0.5 text-rose-500 text-[10px]">▼</div>
                <div className="absolute -top-7 left-0 right-0 text-center text-[8px] text-rose-600 font-mono">h (자기 자신에게)</div>
              </div>
              <div className="text-[9px] text-slate-500 font-mono mt-1.5">↑ x<sub>t</sub> 입력</div>
              <div className="text-[8px] text-slate-500 mt-auto pt-1 text-center">셀 1개 + 순환 화살표</div>
            </div>
            <div className="flex items-center text-rose-500 font-bold text-xs">unfold<br/>⇒</div>
            {/* 펼친 그림 */}
            <div className="flex-1 rounded-lg border-2 border-rose-400 bg-white p-2">
              <div className="text-[9px] font-bold text-rose-800 mb-1.5">시간축으로 펼친 그림 (unfolded) — 같은 모델!</div>
              <CellChain mode="structure" tick={4} />
            </div>
          </div>
          <div className="rounded-lg border border-rose-300 bg-rose-50 p-2 text-[10px] text-slate-700">
            펼친 셀 4개는 복제된 그림일 뿐, <b className="bg-amber-200 px-0.5">실체는 같은 Wx·Wh 를 쓰는 셀 하나</b>다.
            파라미터 수가 시퀀스 길이와 무관한 이유이자, 가변 길이 입력을 처리할 수 있는 이유.
          </div>
        </div>
      );
    }

    // Step 3 — forward 실계산 애니메이션
    function ForwardView({ tick }) {
      const cur = Math.min(tick, 4);
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-rose-400 bg-white p-2">
            <div className="text-[9px] font-bold text-rose-800 mb-1.5">"영화가 정말 재미 있었다" — 한 단어씩 입력 (실계산)</div>
            <CellChain mode="forward" tick={cur} />
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2">
            <div className="text-[10px] font-bold text-rose-800 mb-1">지금 스텝의 계산</div>
            {cur === 0 ? (
              <div className="text-[10px] text-slate-500 font-mono">h₀ = [0, 0] — 아직 아무것도 읽지 않았다</div>
            ) : (
              <div className="text-[10px] font-mono text-slate-700 leading-relaxed">
                h<sub>{cur}</sub> = tanh(Wx·<b className="text-rose-700">{TOKENS[cur - 1].x}</b> + Wh·[{fmt(H[cur - 1][0])}, {fmt(H[cur - 1][1])}])
                = <b className="bg-amber-200 px-0.5">[{fmt(H[cur][0])}, {fmt(H[cur][1])}]</b>
                <span className="text-slate-500 ml-1">← "{TOKENS[cur - 1].w}" 반영</span>
              </div>
            )}
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-2 flex items-center gap-2">
            <span className="text-lg">🎯</span>
            <div className="flex-1 text-[10px] text-slate-700">
              마지막 h₄ = [{fmt(H[4][0])}, {fmt(H[4][1])}] 만 출력층에 → 긍정 확률
              <b className={`ml-1 font-mono ${cur >= 4 ? 'text-emerald-700' : 'text-slate-400'}`}>{cur >= 4 ? SENTIMENT.toFixed(2) : '(계산 중…)'}</b>
            </div>
            <div className="w-20 h-2 rounded-full bg-emerald-100 overflow-hidden">
              <div className="h-full bg-emerald-500 transition-all duration-700" style={{ width: cur >= 4 ? `${SENTIMENT * 100}%` : '0%' }} />
            </div>
          </div>
        </div>
      );
    }

    // Step 4 — BPTT 역방향 흐름 + 기여도 감쇠
    function BpttView({ tick }) {
      const cur = Math.min(tick, 3); // 0: t=4 도달 → 3: t=1 까지 도달
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-400 bg-white p-2">
            <div className="text-[9px] font-bold text-red-800 mb-1.5">손실 ∇L 이 시간을 거슬러 흐른다 (빨간 ← 화살표)</div>
            <CellChain mode="bptt" tick={cur} />
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-white p-2">
            <div className="text-[10px] font-bold text-red-800 mb-1.5">스텝별 기여 크기 — 거슬러 갈수록 Wh·tanh′ 이 한 번 더 곱해진다 (|·|≈0.55 가정)</div>
            {TOKENS.map((tk, idx) => {
              const back = 3 - idx;
              const reached = back <= cur;
              return (
                <div key={tk.w} className="flex items-center gap-1.5 mb-1">
                  <span className="text-[9px] font-mono w-24 text-slate-600">t={idx + 1} "{tk.w}"</span>
                  <span className="text-[8px] font-mono w-20 text-slate-500">{back === 0 ? '곱 0회' : `× 0.55^${back}`}</span>
                  <div className="flex-1 h-2 rounded-full bg-red-50 border border-red-100 overflow-hidden">
                    <div className={`h-full transition-all duration-700 ${reached ? 'bg-red-500' : 'bg-red-200'}`} style={{ width: reached ? `${GRAD_CONTRIB[idx] * 100}%` : '0%' }} />
                  </div>
                  <span className={`text-[9px] font-mono w-8 text-right ${reached ? 'text-red-700 font-bold' : 'text-slate-300'}`}>{GRAD_CONTRIB[idx].toFixed(2)}</span>
                </div>
              );
            })}
            <div className="mt-1.5 text-[9px] text-slate-600">
              dL/dWh = 위 4개 기여의 <b>합</b> (Wh 는 공유 파라미터) — 하지만 먼 과거의 몫은 이미 거의 0
            </div>
          </div>
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-2 text-[10px] text-amber-900">
            📉 <b>복선:</b> 시퀀스 30칸이면 첫 단어의 기여는 0.55³⁰ ≈ 1.6×10⁻⁸.
            "긴 문맥을 기억 못 하는 RNN" 의 정체가 바로 이 곱셈 사슬 — 다음 장(기울기 소실·LSTM)의 주제다.
          </div>
        </div>
      );
    }

    // Step 5 — 활용 지도 (many-to-one / one-to-many / many-to-many)
    function UsemapView() {
      const Mini = ({ ins, outs }) => (
        <div className="flex flex-col items-center gap-0.5 my-1">
          <div className="flex gap-1">
            {outs.map((o, i) => (
              <div key={i} className={`w-6 h-4 rounded text-[8px] flex items-center justify-center ${o ? 'bg-emerald-400 text-white font-bold' : 'bg-transparent'}`}>{o ? 'y' : ''}</div>
            ))}
          </div>
          <div className="flex gap-1">
            {ins.map((_, i) => (
              <div key={i} className="w-6 h-5 rounded bg-rose-400 text-white text-[8px] flex items-center justify-center font-bold">h</div>
            ))}
          </div>
          <div className="flex gap-1">
            {ins.map((x, i) => (
              <div key={i} className={`w-6 h-4 rounded text-[8px] flex items-center justify-center ${x ? 'bg-sky-400 text-white font-bold' : 'bg-transparent'}`}>{x ? 'x' : ''}</div>
            ))}
          </div>
        </div>
      );
      const cards = [
        { name: 'many-to-one', ex: '감성 분석 · 주가 예측', how: '마지막 h 하나만 출력층에', code: 'h_n → Linear', ins: [1, 1, 1, 1], outs: [0, 0, 0, 1] },
        { name: 'one-to-many', ex: '이미지 캡셔닝 · 작곡', how: '씨앗 → 출력을 다음 입력으로 되먹임', code: '루프 생성', ins: [1, 0, 0, 0], outs: [1, 1, 1, 1] },
        { name: 'many-to-many', ex: '번역 · 품사 태깅', how: '모든 스텝의 h 를 각각 출력', code: 'out → Linear', ins: [1, 1, 1, 1], outs: [1, 1, 1, 1] },
      ];
      return (
        <div className="space-y-2">
          <div className="grid grid-cols-3 gap-1.5">
            {cards.map((c) => (
              <div key={c.name} className="rounded-lg border-2 border-rose-300 bg-white p-1.5 flex flex-col">
                <div className="text-[10px] font-bold text-rose-800 text-center">{c.name}</div>
                <Mini ins={c.ins} outs={c.outs} />
                <div className="text-[8px] text-slate-700 text-center font-bold">{c.ex}</div>
                <div className="text-[8px] text-slate-500 text-center mt-0.5">{c.how}</div>
                <div className="text-[8px] font-mono text-center mt-auto pt-1 text-rose-700 bg-rose-50 rounded">{c.code}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2">
            <div className="text-[10px] font-bold text-rose-800 mb-1">nn.RNN 출력 ↔ 우리가 짠 루프 대응표</div>
            <table className="w-full text-[9px]">
              <thead>
                <tr className="text-rose-800 border-b border-rose-200">
                  <th className="text-left py-0.5">PyTorch</th><th className="text-left py-0.5">shape</th><th className="text-left py-0.5">우리 코드</th><th className="text-left py-0.5">쓰는 곳</th>
                </tr>
              </thead>
              <tbody className="text-slate-700">
                <tr className="border-t border-rose-100"><td className="py-1 font-mono">out</td><td className="font-mono">(B, T, H)</td><td className="font-mono">history[1:]</td><td>many-to-many</td></tr>
                <tr className="border-t border-rose-100"><td className="py-1 font-mono">h_n</td><td className="font-mono">(1, B, H)</td><td className="font-mono">history[-1]</td><td>many-to-one</td></tr>
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-white p-2">
            <div className="text-[10px] font-bold text-amber-900 mb-1">⚠️ 순정 RNN 의 한계 — 실무 선택 기준</div>
            <div className="text-[9px] text-slate-700 space-y-0.5">
              <div>· <b>기울기 소실</b>: 20~30 스텝 이상의 의존성은 사실상 학습 불가 (Step 4)</div>
              <div>· <b>순차 계산</b>: 스텝을 병렬화할 수 없어 긴 시퀀스에서 느리다</div>
              <div>· 실무 기본값은 <b className="bg-amber-200 px-0.5">nn.LSTM / nn.GRU</b> — 인자가 호환되어 갈아끼우면 끝</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — RNN 셀 체인 실계산 시뮬레이션
    // ─────────────────────────────────────────────────────
    const VIEW_BADGE = {
      order:     { icon: '🔀', label: '순서 소실 실험' },
      structure: { icon: '🔁', label: '순환 구조 unfold' },
      forward:   { icon: '▶️', label: 'forward 실계산' },
      bptt:      { icon: '⏪', label: 'BPTT 역전파' },
      usemap:    { icon: '🗺️', label: '활용 지도' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = VIEW_BADGE[state.view] || VIEW_BADGE.structure;
      // 스텝 내부 서브 애니메이션: forward 는 0→4, bptt 는 0→3 을 순환
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        if (!state.anim) return;
        const max = state.anim === 'forward' ? 4 : 3;
        const id = setInterval(() => setTick((t) => (t >= max ? 0 : t + 1)), 1100);
        return () => clearInterval(id);
      }, [state.anim, state.view]);

      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>RNN 실험실 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">h_t = tanh(Wx·x + Wh·h + b)</span>
          </div>
          <div className="flex-1">
            {state.view === 'order' && <OrderView />}
            {state.view === 'structure' && <StructureView />}
            {state.view === 'forward' && <ForwardView tick={tick} />}
            {state.view === 'bptt' && <BpttView tick={tick} />}
            {state.view === 'usemap' && <UsemapView />}
          </div>
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <div className="text-[10px] font-bold text-rose-600 tracking-wide">PART III · 시퀀스 모델</div>
                <h1 className="text-2xl font-bold text-rose-900">III-1-1. RNN 구조와 BPTT</h1>
                <p className="text-sm text-rose-800/80">"나는 어제 학교에 ___" — 순서와 기억이 필요한 데이터를 다루는 첫 신경망</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`} />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                RNN 은 h_t = tanh(Wx·x_t + Wh·h_{'{t-1}'} + b) 한 줄로 "지금까지의 요약(기억)"을 들고 다니며 시퀀스를 읽는 구조다.
                모든 스텝이 같은 Wx·Wh 를 공유하므로 파라미터는 길이와 무관하고,
                학습은 펼친 그래프 위에서 시간을 거슬러 역전파하는 BPTT 로 이뤄진다.
                단, 거슬러 갈 때마다 Wh·tanh′ 이 곱해져 먼 과거의 기울기가 기하급수로 사라지는 것이
                순정 RNN 의 근본 한계 — 다음 장에서 기울기 소실과 그 해법(LSTM/GRU 게이트)을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RNN', '은닉상태', '순환구조', 'unfold', '가중치공유', 'BPTT', '기울기소실', 'many-to-one', 'many-to-many', 'nn.RNN'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
