  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL II-1-2 — 풀링·패딩·스트라이드 계산
    학습 목표: "출력 크기가 왜 저렇게 나오지?"를 없애는 페이지.
              패딩(크기 유지·가장자리 보호) → 스트라이드(다운샘플링) →
              출력 크기 공식 O=(I+2P−K)/S+1 유도+계산기 → 풀링(max/avg) →
              28×28 MNIST 미니 CNN의 층별 shape·파라미터 추적까지 5단계.
    패턴: fastapi v1 — 좌(LiveDataPane: 픽셀 그리드 + 계산기 + shape 흐름표) / 우(VSCode CodeViewer: cnn_shapes.py)
    색상: rose (dl 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   viz : 좌측 패널 구성 { grids: [...], calc, pool, flow }
    //   code: 우측 CodeViewer — cnn_shapes.py 진화
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 패딩 — 이미지가 줄어드는 걸 막고, 가장자리를 지킨다',
        desc: '5×5 이미지에 3×3 커널로 합성곱을 하면 출력은 3×3 — 층을 지날 때마다 2씩 줄어든다. 10층만 쌓아도 이미지가 사라지니 깊은 네트워크는 아예 불가능해진다. 더 미묘한 문제는 가장자리다: 모서리 픽셀은 커널이 딱 1번만 밟고 지나가지만 중앙 픽셀은 9번 참여한다 — 가장자리 정보가 구조적으로 손해를 본다. 해결책이 zero padding: 입력 둘레에 0을 한 겹 둘러서 출력 크기를 입력과 같게 유지하고("same"), 가장자리 픽셀도 커널 중심에 놓이게 만든다. 패딩 없이 줄어드는 대로 두는 것이 "valid" — 프레임워크의 padding="same"/"valid"가 바로 이 두 선택지다.',
        viz: {
          grids: [
            { label: 'valid — 패딩 없음', size: 5, pad: 0, kernel: 3, stride: 1, kernelPos: [0, 0], out: 3, tone: 'gray', note: '5×5 → 3×3 (층마다 −2)' },
            { label: 'same — zero padding=1', size: 5, pad: 1, kernel: 3, stride: 1, kernelPos: [0, 0], out: 5, tone: 'rose', note: '7×7(패딩 포함) → 5×5 유지' },
          ],
          gridCaption: '점선 셀 = 패딩(0). same에서는 모서리 픽셀도 커널의 "중심"에 올 수 있다.',
        },
        alert: { tone: 'info', text: '패딩은 공짜 트릭이 아니라 설계 선택이다. same은 깊게 쌓아도 크기가 안 줄어 층 수를 자유롭게 하고, valid는 "가장자리 0은 가짜 데이터"라는 입장 — 대부분의 현대 CNN(ResNet 등)은 same을 기본으로 쓴다.' },
        code: {
          lang: 'python',
          filename: 'cnn_shapes.py — ① 패딩',
          lines: [
            '"""',
            'cnn_shapes.py — CNN 출력 크기 산수 실험실',
            '① 패딩: valid vs same — 크기가 줄어드는 문제를 눈으로 확인',
            '"""',
            'import torch',
            'import torch.nn as nn',
            '',
            'x = torch.randn(1, 1, 5, 5)   # (batch, channel, H, W)',
            '',
            '# valid: 패딩 없음 → 층마다 (K-1)=2 씩 줄어든다',
            'conv_valid = nn.Conv2d(1, 8, kernel_size=3, padding=0)',
            'print(conv_valid(x).shape)    # [1, 8, 3, 3]  5→3',
            '',
            '# same: padding=1 → 크기 유지 (K=3 이면 P=1 이 same)',
            'conv_same = nn.Conv2d(1, 8, kernel_size=3, padding=1)',
            'print(conv_same(x).shape)     # [1, 8, 5, 5]  5→5',
            '',
            '# valid 로 깊게 쌓으면? — 이미지가 증발한다',
            'h = x',
            'for i in range(2):            # 5→3→1, 세 번째는 에러',
            '    h = conv_valid(torch.randn(1, 1, *h.shape[2:]))',
            '    print(f"layer {i+1}: {tuple(h.shape[2:])}")',
            '# layer 1: (3, 3)',
            '# layer 2: (1, 1)  ← 다음 층은 3×3 커널이 못 들어감',

    function PixelGrid({ g }) {
      const total = g.size + 2 * g.pad;               // 패딩 포함 한 변
      const [kr, kc] = g.kernelPos;                    // 커널 좌상단 (패딩 포함 좌표)
      // 스트라이드 발자국: 커널 좌상단이 밟는 (r,c) 집합
      const anchors = new Set();
      const span = total - g.kernel;
      for (let r = 0; r <= span; r += g.stride)
        for (let c = 0; c <= span; c += g.stride) anchors.add(`${r},${c}`);
      const accent = g.tone === 'rose';
      return (
        <div className={`flex-1 rounded-lg border-2 p-2 ${accent ? 'border-rose-400 bg-rose-50' : 'border-slate-300 bg-slate-50'}`}>
          <div className={`text-[11px] font-bold mb-1.5 ${accent ? 'text-rose-900' : 'text-slate-700'}`}>{g.label}</div>
          <div className="inline-grid gap-0.5" style={{ gridTemplateColumns: `repeat(${total}, 16px)` }}>
            {Array.from({ length: total * total }, (_, idx) => {
              const r = Math.floor(idx / total), c = idx % total;
              const isPad = r < g.pad || c < g.pad || r >= total - g.pad || c >= total - g.pad;
              const inKernel = r >= kr && r < kr + g.kernel && c >= kc && c < kc + g.kernel;
              const isAnchor = anchors.has(`${r},${c}`);
              let cls = 'w-4 h-4 rounded-[2px] flex items-center justify-center text-[7px] leading-none ';
              if (inKernel) cls += accent ? 'bg-rose-500 text-white ' : 'bg-slate-600 text-white ';
              else if (isPad) cls += 'border border-dashed border-amber-500 bg-amber-50 text-amber-600 ';
              else cls += 'bg-white border border-slate-300 text-slate-400 ';
              return (
                <div key={idx} className={cls}>
                  {isPad && !inKernel ? '0' : isAnchor && !inKernel ? '•' : ''}
                </div>
              );
            })}
          </div>
          <div className={`mt-1.5 text-[10px] font-mono ${accent ? 'text-rose-800' : 'text-slate-600'}`}>
            → 출력 {g.out}×{g.out} <span className="text-slate-500">· {g.note}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 스트라이드 비용 비교 막대 (Step 2)
    // ─────────────────────────────────────────────────────
    function StrideBar({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-2.5">
          <div className="text-xs font-bold text-rose-900 mb-1.5">⚡ {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-rose-800 border-b border-rose-200">
                <th className="text-left py-0.5">stride</th>
                <th className="text-left py-0.5 pl-2">출력(창 위치 수)</th>
                <th className="text-left py-0.5 pl-2">연산량</th>
                <th className="text-left py-0.5 pl-2">비고</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.s} className="border-t border-rose-100">
                  <td className="py-1 font-mono font-bold">{r.s}</td>
                  <td className="py-1 pl-2 font-mono">{r.out}</td>
                  <td className="py-1 pl-2">
                    <div className="flex items-center gap-1">
                      <div className="w-16 h-1.5 rounded-full bg-rose-100 overflow-hidden">
                        <div className="h-full bg-rose-500" style={{ width: `${r.cost}%` }} />
                      </div>
                      <span className="font-mono">{r.cost}%</span>
                    </div>
                  </td>
                  <td className="py-1 pl-2 text-slate-600">{r.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 출력 크기 인터랙티브 계산기 (Step 3)
    // ─────────────────────────────────────────────────────
    function CalcBox({ init }) {
      const [v, setV] = useState(init);
      useEffect(() => setV(init), [init]);
      const span = v.I + 2 * v.P - v.K;
      const valid = span >= 0;
      const exact = valid && span % v.S === 0;
      const out = valid ? Math.floor(span / v.S) + 1 : null;
      const Slider = ({ id, label, min, max }) => (
        <label className="flex items-center gap-2 text-[11px] text-slate-700">
          <span className="w-24">{label} <b className="font-mono text-rose-800">{v[id]}</b></span>
          <input
            type="range" min={min} max={max} value={v[id]}
            aria-label={label}
            onChange={(e) => setV({ ...v, [id]: Number(e.target.value) })}
            className="flex-1 accent-rose-600"
          />
        </label>
      );
      return (
        <div className="rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">🧮 출력 크기 계산기 — 직접 움직여 보라</div>
          <div className="space-y-1.5">
            <Slider id="I" label="입력 I" min={4} max={64} />
            <Slider id="K" label="커널 K" min={1} max={11} />
            <Slider id="P" label="패딩 P" min={0} max={5} />
            <Slider id="S" label="스트라이드 S" min={1} max={4} />
          </div>
          <div className="mt-2.5 rounded border border-rose-200 bg-rose-50 px-3 py-2 text-center">
            <div className="font-mono text-[13px] text-slate-800">
              O = ({v.I} + 2·{v.P} − {v.K}) / {v.S} + 1 ={' '}
              <span className="text-lg font-bold text-rose-700">{valid ? out : '불가'}</span>
              {valid && <span className="text-slate-500"> → 출력 {out}×{out}</span>}
            </div>
            {!valid && (
              <div className="mt-1 text-[10px] text-red-700 font-bold">🚫 커널이 패딩 포함 입력보다 크다 — 창이 들어갈 자리가 없음</div>
            )}
            {valid && !exact && (
              <div className="mt-1 text-[10px] text-amber-700 font-bold">⚠️ ({v.I}+2·{v.P}−{v.K}) % {v.S} ≠ 0 — 끝자락 픽셀이 버려진다(floor). shape 버그의 단골 지점!</div>
            )}
            {valid && exact && v.K === 3 && v.P === 1 && v.S === 1 && (
              <div className="mt-1 text-[10px] text-emerald-700 font-bold">✅ K=3, P=1, S=1 — "same" 조합: 출력 = 입력 그대로</div>
            )}
          </div>
        </div>
      );
    }

    // 공식 항별 유도표 (Step 3)
    function FormulaBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-2.5">
          <div className="text-xs font-bold text-rose-900 mb-1.5">📐 {box.title}</div>
          <table className="w-full text-[10px]">
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.term} className="border-t border-rose-100 first:border-t-0">
                  <td className="py-1 font-mono font-bold text-rose-700 w-14">{r.term}</td>
                  <td className="py-1 pl-2 text-slate-800 font-bold">{r.mean}</td>
                  <td className="py-1 pl-2 text-slate-600">{r.why}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 풀링 시각화 (Step 4) — 4×4 → max / avg 2×2
    // ─────────────────────────────────────────────────────
    const QUAD_STYLE = [
      'bg-rose-100 border-rose-300', 'bg-sky-100 border-sky-300',
      'bg-emerald-100 border-emerald-300', 'bg-amber-100 border-amber-300',
    ];

    function PoolViz({ pool }) {
      if (!pool) return null;
      const quadOf = (r, c) => Math.floor(r / 2) * 2 + Math.floor(c / 2);
      const isMax = (r, c) => pool.input[r][c] === pool.maxOut[Math.floor(r / 2)][Math.floor(c / 2)];
      const OutGrid = ({ title, data, strong }) => (
        <div className="text-center">
          <div className="text-[10px] font-bold text-slate-700 mb-1">{title}</div>
          <div className="inline-grid grid-cols-2 gap-0.5">
            {data.flat().map((n, i) => (
              <div key={i} className={`w-9 h-9 rounded border-2 flex items-center justify-center font-mono text-[11px] font-bold ${QUAD_STYLE[i]} ${strong ? 'text-rose-900' : 'text-slate-600'}`}>
                {n}
              </div>
            ))}
          </div>
        </div>
      );
      return (
        <div className="rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">🗜 2×2 풀링 (stride=2) — 4구역을 1칸씩으로 요약</div>
          <div className="flex items-center justify-center gap-3 flex-wrap">
            <div className="text-center">
              <div className="text-[10px] font-bold text-slate-700 mb-1">입력 4×4 (색 = 풀링 구역)</div>
              <div className="inline-grid grid-cols-4 gap-0.5">
                {pool.input.map((row, r) => row.map((n, c) => (
                  <div
                    key={`${r}-${c}`}
                    className={`w-8 h-8 rounded border flex items-center justify-center font-mono text-[10px] ${QUAD_STYLE[quadOf(r, c)]} ${isMax(r, c) ? 'ring-2 ring-rose-600 font-bold text-rose-900' : 'text-slate-600'}`}
                  >
                    {n}
                  </div>
                )))}
              </div>
            </div>
            <div className="text-rose-400 text-xl">→</div>
            <OutGrid title="max — 최댓값만 (표준)" data={pool.maxOut} strong={true} />
            <OutGrid title="avg — 평균 (희석됨)" data={pool.avgOut} strong={false} />
          </div>
          <div className="mt-2 text-[10px] text-slate-600 text-center">
            굵은 테두리 = 각 구역의 max. 창 안 "어디"였는지는 버려진다 → 1~2px 이동에 둔감해짐(위치 불변성)
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 층별 shape 흐름표 (Step 5)
    // ─────────────────────────────────────────────────────
    function ShapeFlow({ flow }) {
      if (!flow) return null;
      const maxP = Math.max(...flow.rows.map((r) => r.params));
      return (
        <div className="rounded-lg border-2 border-rose-400 bg-white p-3">
          <div className="text-xs font-bold text-rose-900 mb-2">🏗 {flow.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-rose-800 border-b-2 border-rose-200">
                <th className="text-left py-1">층</th>
                <th className="text-left py-1 pl-2">공식 대입</th>
                <th className="text-left py-1 pl-2">출력 shape</th>
                <th className="text-right py-1 pl-2">파라미터</th>
              </tr>
            </thead>
            <tbody>
              {flow.rows.map((r, i) => (
                <tr key={i} className="border-t border-rose-100">
                  <td className="py-1 text-slate-800 font-bold">{r.layer}</td>
                  <td className="py-1 pl-2 font-mono text-slate-600">{r.formula}</td>
                  <td className="py-1 pl-2 font-mono font-bold text-rose-800">{r.shape}</td>
                  <td className="py-1 pl-2">
                    <div className="flex items-center gap-1 justify-end">
                      {r.params > 0 && (
                        <div className="w-14 h-1.5 rounded-full bg-rose-100 overflow-hidden">
                          <div className="h-full bg-rose-500" style={{ width: `${Math.max(2, (r.params / maxP) * 100)}%` }} />
                        </div>
                      )}
                      <span className="font-mono text-slate-700 w-14 text-right">{r.params.toLocaleString()}</span>
                    </div>
                  </td>
                </tr>
              ))}
              <tr className="border-t-2 border-rose-300">
                <td className="py-1 font-bold text-rose-900" colSpan="3">합계</td>
                <td className="py-1 text-right font-mono font-bold text-rose-900">{flow.total.toLocaleString()}</td>
              </tr>
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-slate-600">
            공간(28→14→7)은 줄이고 채널(1→32→64)은 불린다. 파라미터의 95%는 Linear(3136→128) — 풀링이 FC 입력을 1/16로 줄여준 결과가 이 정도다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 실계산 시각화 (rose 톤)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, state, stepIdx }) {
      const v = state.viz;
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>🔬</span>
              <span>CNN 산수 실험대</span>
            </h3>
            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-rose-50 border border-rose-200 text-rose-700">
              O = (I + 2P − K) / S + 1
            </span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {v.grids && (
            <div>
              <div className="flex gap-2 items-stretch flex-wrap">
                {v.grids.map((g) => <PixelGrid key={g.label} g={g} />)}
              </div>
              <div className="mt-1.5 text-[10px] text-slate-500">{v.gridCaption}</div>
            </div>
          )}
          <StrideBar box={v.strideBar} />
          {v.calc && <CalcBox init={v.calc} />}
          <FormulaBox box={v.formulaBox} />
          <PoolViz pool={v.pool} />
          <ShapeFlow flow={v.flow} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">II-1-2. 풀링·패딩·스트라이드 계산</h1>
                <p className="text-sm text-rose-800/80">출력 크기가 왜 저렇게 나오지? — CNN 설계의 산수를 완전 정복</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                CNN 설계의 산수는 공식 하나로 끝난다 — O = ⌊(I + 2P − K)/S⌋ + 1.
                패딩(same)은 크기를 유지하며 가장자리를 지키고, 스트라이드는 겹침을 줄여 의도적으로 다운샘플링하며,
                풀링은 파라미터 0개로 특징을 요약해 위치 뻣뻣함을 완화하고 FC 앞의 파라미터 폭발을 막는다.
                shape mismatch가 나면 층마다 print(x.shape)를 꽂고 첫 어긋남에서 공식으로 역산하라 — 범인은 항상 P 아니면 S다.
                다음 챕터에서는 이렇게 쌓은 특징맵이 채널을 따라 "무엇을" 보고 있는지를 들여다본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['패딩', 'same', 'valid', '스트라이드', '다운샘플링', '출력크기공식', 'MaxPooling', '위치불변성', 'shape디버깅', 'MNIST'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="./II-1-1.html" className="underline hover:no-underline">← 이전: II-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
