  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL II-1-1 — 합성곱 원리 — 필터가 특징을 잡는 법
    학습 목표: MLP flatten의 파라미터 폭발·공간 구조 파괴 → 3×3 필터 슬라이딩 실계산 →
              엣지 필터 반응 히트맵 → 다중 채널/계층 특징 → 파라미터 공유까지 5단계.
    패턴: fastapi v1 — 좌(LiveDataPane: 합성곱 실계산 애니메이션) / 우(CodeViewer: convolution.py 진화) / 색상: rose
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 합성곱 실계산 데이터 — Step 2 애니메이션의 소재
    //   INPUT_5x5 × FILTER_X(십자 필터) = OUTPUT_3x3 (전부 실제 계산값)
    // ─────────────────────────────────────────────────────
    const INPUT_5x5 = [
      [1, 2, 0, 1, 3],
      [0, 1, 2, 3, 1],
      [3, 1, 0, 2, 2],
      [2, 0, 1, 3, 0],
      [1, 2, 3, 0, 1],
    ];
    const FILTER_X = [
      [1, 0, 1],
      [0, 1, 0],
      [1, 0, 1],
    ];
    // 각 출력 셀 = 3×3 창과 필터의 내적 (검산 완료)
    const OUTPUT_3x3 = [
      [5, 8, 8],
      [6, 7, 6],
      [7, 6, 9],
    ];

    // Step 3 — 세로 엣지 이미지 + 세로/가로 엣지 필터 반응 (실계산)
    const EDGE_IMG = [
      [0, 0, 9, 9, 9],
      [0, 0, 9, 9, 9],
      [0, 0, 9, 9, 9],
      [0, 0, 9, 9, 9],
      [0, 0, 9, 9, 9],
    ];
    const V_FILTER = [[-1, 0, 1], [-1, 0, 1], [-1, 0, 1]];
    const H_FILTER = [[-1, -1, -1], [0, 0, 0], [1, 1, 1]];
    const V_RESPONSE = [
      [27, 27, 0],
      [27, 27, 0],
      [27, 27, 0],
    ];
    const H_RESPONSE = [
      [0, 0, 0],
      [0, 0, 0],
      [0, 0, 0],
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      mlp: {lang:"python", filename:"mlp_image.py — 왜 안 되는가", lines:[
        "\"\"\"",
        "mlp_image.py — 이미지를 MLP에 넣으면 생기는 두 가지 문제",
        "1) 파라미터 폭발  2) 공간 구조(위치 관계) 파괴",
        "\"\"\"",
        "import numpy as np",
        "",
        "# ── 문제 1: 파라미터 폭발 ─────────────────────",
        "# 28x28 흑백(MNIST)조차 flatten하면 784차원",
        "input_dim = 28 * 28                     # 784",
        "hidden = 100",
        "first_layer_params = input_dim * hidden  # 78,400개",
        "",
        "# 실전 사진이면?",
        "photo_dim = 1000 * 1000 * 3              # 3,000,000",
        "print(photo_dim * hidden)                # 300,000,000 (3억)",
        "# → 첫 층 하나가 3억 파라미터. 시작도 전에 실패.",
        "",
        "# ── 문제 2: 공간 구조 파괴 ───────────────────",
        "img = np.zeros((5, 5))",
        "img[1:4, 1:2] = 9        # 세로 막대가 왼쪽에",
        "",
        "shifted = np.roll(img, 1, axis=1)  # 오른쪽 1px 이동",
        "",
        "v1 = img.flatten()",
        "v2 = shifted.flatten()",
        "# 같은 막대인데 벡터가 얼마나 다른가?",
        "print((v1 != v2).sum(), \"/\", v1.size)   # 6 / 25 원소가 다름",
        "",
        "# MLP 입장: v1과 v2는 그냥 \"다른 벡터\"다.",
        "# \"9가 어디 있든 같은 막대\" 라는 개념 자체가 없다.",
        "# 모든 위치마다 별도의 가중치로 따로 배워야 한다.",
        "",
        "# 필요한 것:",
        "#  1) 픽셀 전체가 아니라 \"작은 지역\" 만 보는 눈",
        "#  2) 그 눈을 모든 위치에서 \"재사용\" 하는 구조",
        "# → 이것이 합성곱(convolution)이다.",
      ]},
      conv: {lang:"python", filename:"convolution.py — numpy 이중 루프", lines:[
        "\"\"\"",

        "",
        "    Args:",

    function pixelBg(v, max) {
      const t = max > 0 ? Math.min(1, Math.abs(v) / max) : 0;
      const alpha = 0.08 + t * 0.72;
      return `rgba(225, 29, 72, ${alpha.toFixed(2)})`; // rose-600
    }

    function Cell({ v, max, active, dim, small }) {
      return (
        <div
          className={`flex items-center justify-center font-mono font-bold rounded-sm transition-all duration-200 ${small ? 'w-6 h-6 text-[10px]' : 'w-8 h-8 text-[11px]'} ${active ? 'ring-2 ring-amber-400 ring-offset-1 scale-105 z-10' : ''} ${dim ? 'opacity-30' : ''}`}
          style={{ backgroundColor: pixelBg(v, max), color: Math.abs(v) / max > 0.55 ? '#fff' : '#2b2b2b' }}
        >{v}</div>
      );
    }

    function Grid({ data, max, activeBox, small, label }) {

        <div>
          {label && <div className="text-[10px] font-bold text-rose-800 mb-1 text-center">{label}</div>}

            {data.map((row, r) => row.map((v, c) => {
              const inBox = activeBox && r >= activeBox.r && r < activeBox.r + 3 && c >= activeBox.c && c < activeBox.c + 3;
              return <Cell key={`${r}-${c}`} v={v} max={max} active={inBox} dim={activeBox && !inBox} small={small} />;
            }))}
          </div>
        </div>
      );

    function ConvAnimViz() {
      const [pos, setPos] = useState(0); // 0..8 → (r,c) = (pos/3, pos%3), 9 = 완료 후 잠깐 쉼
      useEffect(() => {
        const t = setInterval(() => setPos((p) => (p + 1) % 10), 900);
        return () => clearInterval(t);
      }, []);
      const done = pos >= 9;
      const r = done ? 2 : Math.floor(pos / 3);
      const c = done ? 2 : pos % 3;
      const filled = done ? 9 : pos + 1;

      // 현재 창과 필터의 곱셈 항 나열 (0이 아닌 항만)
      const terms = [];
      for (let i = 0; i < 3; i++)
        for (let j = 0; j < 3; j++)

      return (
        <div>
          <div className="flex gap-3 justify-center items-start flex-wrap">
            <Grid data={INPUT_5x5} max={3} activeBox={{ r, c }} label="입력 5×5" />

                      style={isFilled && !isCur ? { backgroundColor: pixelBg(v, 9) } : {}}>{isFilled ? v : '·'}</div>
                  );
                })}
              </div>
            </div>
          </div>
          <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5 font-mono text-[11px] text-amber-900">
            <span className="font-sans font-bold text-[10px] mr-1">🧮 위치 ({r},{c}) 내적:</span>
            {terms.join(' + ')} = <span className="font-bold text-sm">{OUTPUT_3x3[r][c]}</span>
            <span className="font-sans text-[9px] text-amber-700 ml-2">(필터의 0 위치는 곱해도 0이라 생략)</span>
          </div>
          <div className="mt-2 flex items-center gap-2 text-[10px] text-rose-800">
            <div className="flex-1 h-1.5 rounded-full bg-rose-100 overflow-hidden">
              <div className="h-full bg-rose-500 transition-all duration-300" style={{ width: `${(filled / 9) * 100}%` }} />
            </div>
            <span className="font-mono">{filled}/9 칸 {done ? '완료 ↻' : '계산 중'}</span>
          </div>
          <div className="mt-2 text-[10px] text-slate-600">창이 오른쪽 끝에 닿으면 한 줄 내려가 반복 → 출력 크기 = (5−3+1) × (5−3+1) = 3×3</div>
        </div>
      );
    }

              <div className="relative w-20 h-14">
                {[0, 1, 2, 3, 4].map((i) => (
                  <div key={i} className="absolute w-9 h-9 rounded border border-white bg-rose-300" style={{ left: i * 6, top: i * 2, opacity: 0.5 + i * 0.1 }} />
                ))}
                <div className="absolute -bottom-4 w-full text-center text-[9px] text-slate-600">fmap 32장 (32,H',W')</div>
              </div>
            </div>
            <div className="mt-6 text-[10px] text-slate-600 text-center">
              필터 1개는 3채널을 <b>관통해</b> 내적 → 숫자 하나 → map <b>1장</b>. 필터 32개 → map 32장.
            </div>
          </div>
          <div className="mt-3 rounded-lg border-2 border-rose-400 bg-rose-50 p-3">
            <div className="text-[11px] font-bold text-rose-900 mb-2">🏗 층을 쌓으면 — 계층 특징 (데이터가 스스로 조직화)</div>
            {layers.map((l, i) => (
              <React.Fragment key={l.name}>
                {i > 0 && <div className="text-center text-rose-400 text-[10px] leading-3">▼ 앞층 특징을 조합</div>}
                <div className="flex items-center gap-2 rounded border border-rose-300 bg-white px-2 py-1 mb-0.5">
                  <span>{l.icon}</span>
                  <span className="font-mono text-[10px] font-bold text-rose-800 w-12">{l.name}</span>
                  <span className="text-[10px] text-slate-700">{l.learns}</span>
                  <div className="ml-auto flex gap-px">
                    {Array.from({ length: 4 + i * 2 }).map((_, j) => (
                      <div key={j} className="w-1 rounded-full bg-rose-400" style={{ height: 8 + i * 3 }} />
                    ))}
                  </div>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 파라미터 공유 비교표 + 이동 불변성
    // ─────────────────────────────────────────────────────
    function ShareViz() {
      const rows = [
        { input: 'MNIST 28×28', fc: '78,500', conv: '320', ratio: '≈ 1/245', fcW: 100, convW: 0.5 },
        { input: 'CIFAR 32×32×3', fc: '786,688', conv: '1,792', ratio: '≈ 1/439', fcW: 100, convW: 0.3 },
        { input: '사진 224×224×3', fc: '150,529,000', conv: '9,472', ratio: '≈ 1/15,890', fcW: 100, convW: 0.1 },
      ];
      return (
        <div>
          <div className="rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-amber-50 p-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-xl">⚖️</span>
              <span className="text-sm font-bold text-rose-900">FC 첫 층 vs Conv 첫 층 — 파라미터 수 (bias 포함)</span>
            </div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-rose-900 border-b-2 border-rose-300">
                  <th className="text-left py-1">입력</th>
                  <th className="text-right py-1">FC (뉴런 100~1000)</th>
                  <th className="text-right py-1 pl-2">Conv (3×3, 32~64필터)</th>
                  <th className="text-right py-1 pl-2">비율</th>
                </tr>
              </thead>
              <tbody className="font-mono">
                {rows.map((r) => (
                  <tr key={r.input} className="border-t border-rose-200">
                    <td className="py-1 font-sans text-slate-800">{r.input}</td>
                    <td className="py-1 text-right text-red-700 font-bold">{r.fc}</td>
                    <td className="py-1 text-right pl-2 text-emerald-700 font-bold">{r.conv}</td>
                    <td className="py-1 text-right pl-2 text-rose-800">{r.ratio}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-2 space-y-1">
              <div className="flex items-center gap-2 text-[9px]"><span className="w-8 text-red-700 font-bold">FC</span><div className="h-2 rounded bg-red-500" style={{ width: '100%' }} /></div>
              <div className="flex items-center gap-2 text-[9px]"><span className="w-8 text-emerald-700 font-bold">Conv</span><div className="h-2 rounded bg-emerald-500" style={{ width: '3px' }} /><span className="text-slate-500">(28×28 기준, 눈에 안 보일 만큼 작다)</span></div>
            </div>
          </div>
          <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1.5">🐱 이동 등변성 — 같은 필터가 전 위치를 훑기 때문에</div>
            <div className="flex gap-2 items-center justify-center text-[10px]">
              <div className="rounded border border-rose-300 bg-rose-50 px-2 py-1.5 text-center">고양이가 왼쪽에<br /><span className="font-mono">fmap 왼쪽 발화 🔥</span></div>
              <span className="text-rose-500 font-bold">이동 →</span>
              <div className="rounded border border-rose-300 bg-rose-50 px-2 py-1.5 text-center">고양이가 오른쪽에<br /><span className="font-mono">fmap 오른쪽 발화 🔥</span></div>
              <span className="text-emerald-600 font-bold text-[9px]">"발화한다"는<br />사실은 동일 ✓</span>
            </div>
            <div className="mt-1.5 text-[10px] text-slate-600 text-center">위치마다 따로 외우는 MLP와 달리, "어디에 있어도 고양이"를 구조가 보장한다.</div>
          </div>
          <div className="mt-3 rounded-lg border border-amber-300 bg-amber-50 p-2 text-[10px] text-amber-900">
            🔜 <b>다음 장 예고</b> — feature map이 커지는 걸 줄이는 <b>풀링(pooling)</b>, 창을 성큼성큼 미는 <b>스트라이드(stride)</b>. 파라미터 0개로 크기를 줄이는 기술.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 시각화 스위치 (rose 톤)
    // ─────────────────────────────────────────────────────
    const VIZ_BADGE = {
      mlp:     { icon: '💥', label: 'MLP flatten 실험' },
      conv:    { icon: '🎬', label: '합성곱 실계산' },
      edge:    { icon: '🧭', label: '엣지 필터 반응' },
      channel: { icon: '🏗', label: '채널 · 계층 특징' },
      share:   { icon: '⚖️', label: '파라미터 공유' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = VIZ_BADGE[state.viz] || VIZ_BADGE.conv;
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5"><span>{badge.icon}</span><span>시뮬레이션 — {badge.label}</span></h3>
          </div>
          <div className="text-[10px] text-rose-700 font-mono mb-3 px-2 py-1 rounded bg-rose-50 border border-rose-200">
            {state.actor}
          </div>
          {state.viz === 'mlp' && <MlpViz />}
          {state.viz === 'conv' && <ConvAnimViz />}
          {state.viz === 'edge' && <EdgeViz />}
          {state.viz === 'channel' && <ChannelViz />}
          {state.viz === 'share' && <ShareViz />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <div className="text-[10px] font-bold text-rose-500 tracking-wide">PART II — CNN</div>
                <h1 className="text-2xl font-bold text-rose-900">II-1-1. 합성곱 원리 — 필터가 특징을 잡는 법</h1>
                <p className="text-sm text-rose-800/80">픽셀 100만 개를 완전연결로 넣으면 안 되는 이유, 그리고 3×3 창문의 마법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`} />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40">← 이전</button>
              <button
                onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }}
                aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                합성곱은 "작은 창(필터)으로 지역을 보고, 그 창을 모든 위치에서 재사용"하는 연산이다.
                출력 feature map은 "그 특징이 어디에 얼마나 있는가"의 지도이고, 필터 값 자체가 학습 파라미터라
                무엇을 볼지도 데이터가 결정한다. 파라미터 공유 덕에 MLP 대비 수백~수만분의 1 파라미터로,
                층을 쌓으면 엣지→질감→부품→객체의 계층 특징이 스스로 조직화된다.
                다음 장에서는 feature map 크기를 다스리는 풀링과 스트라이드를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['합성곱', 'CNN', '필터', '커널', 'feature map', '슬라이딩윈도우', '엣지탐지', '채널', '파라미터공유', '이동불변성', 'nn.Conv2d'].map((k) => (<span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
