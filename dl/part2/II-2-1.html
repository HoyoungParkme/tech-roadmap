  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DL II-2-1 — 아키텍처 진화 — LeNet→ResNet. CNN 10년사를 "벽과 돌파"의 관점으로 추적.
    패턴: fastapi v1 — 좌(LiveDataPane: 타임라인·블록 다이어그램·층수-오류율·기울기 고속도로) / 우(CodeViewer: architectures.py). 색상: rose
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 5단계 시나리오 — LeNet → AlexNet → VGG → ResNet → 이후 지도
    //    arch(블록 다이어그램) / specs(층수·파라미터·오류율) / depthChart·skipFlow·afterMap(단계별 시각화) / code(CodeViewer)
    const TIMELINE = [
      { year: 1998, name: 'LeNet-5', step: 0 },
      { year: 2012, name: 'AlexNet', step: 1 },
      { year: 2014, name: 'VGG-16/19', step: 2 },
      { year: 2015, name: 'ResNet-152', step: 3 },
      { year: '2019+', name: 'EfficientNet · ViT', step: 4 },
    ];

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      lenet: {lang:"python", filename:"architectures.py — LeNet-5 (1998)", lines:[
        "\"\"\"",
        "architectures.py — CNN 10년사를 코드로 추적한다",
        "1998 LeNet-5: conv-pool-conv-pool-FC 원형",
        "\"\"\"",
        "import torch",
        "import torch.nn as nn",
        "",
        "",
        "class LeNet5(nn.Module):",
        "    \"\"\"LeNet-5 (LeCun, 1998) — 우편번호 인식에 실전 투입된 원조 CNN.",
        "",
        "    구조 문법: [Conv → Pool] 반복으로 특징 추출 → FC 로 분류",
        "    이 문법은 이후 AlexNet/VGG 가 그대로 물려받는다.",
        "    \"\"\"",
        "",
        "    def __init__(self, num_classes: int = 10):",
        "        super().__init__()",
        "        self.features = nn.Sequential(",
        "            nn.Conv2d(1, 6, kernel_size=5),   # 32→28",
        "            nn.Tanh(),                        # 당시엔 tanh/sigmoid",
        "            nn.AvgPool2d(2),                  # 28→14",
        "            nn.Conv2d(6, 16, kernel_size=5),  # 14→10",
        "            nn.Tanh(),",
        "            nn.AvgPool2d(2),                  # 10→5",
        "        )",
        "        self.classifier = nn.Sequential(",
        "            nn.Flatten(),",
        "            nn.Linear(16 * 5 * 5, 120), nn.Tanh(),",
        "            nn.Linear(120, 84), nn.Tanh(),",
        "            nn.Linear(84, num_classes),",
        "        )",
        "",
        "    def forward(self, x: torch.Tensor) -> torch.Tensor:",
        "        return self.classifier(self.features(x))",
        "",
        "",
        "model = LeNet5()",
        "n_params = sum(p.numel() for p in model.parameters())",
        "print(f\"LeNet-5 params: {n_params:,}\")  # 약 61,706 — 6만 개",
        "",
        "# 14년의 공백은 모델 탓이 아니다 — 데이터(라벨셋)·GPU 부재 + tanh 포화",
      ]},
      alexnet: {lang:"python", filename:"architectures.py — AlexNet (2012)", lines:[
        "\"\"\"",
        "2012 AlexNet: 구조는 LeNet 확장판 — 승부는 \"재료\" 였다",
        "GPU 병렬 + ReLU + Dropout + 데이터 증강",
        "\"\"\"",
        "import torch.nn as nn",
        "from torchvision import transforms",
        "",
        "",
        "class AlexNet(nn.Module):",
        "    \"\"\"AlexNet (Krizhevsky et al., 2012) 핵심 재현.\"\"\"",
        "",
        "    def __init__(self, num_classes: int = 1000):",
        "        super().__init__()",
        "        self.features = nn.Sequential(",
        "            nn.Conv2d(3, 64, 11, stride=4, padding=2),",
        "            nn.ReLU(inplace=True),   # ① tanh → ReLU: 기울기 생존",
        "            nn.MaxPool2d(3, 2),",
        "            nn.Conv2d(64, 192, 5, padding=2),",
        "            nn.ReLU(inplace=True),",
        "            nn.MaxPool2d(3, 2),",
        "            nn.Conv2d(192, 384, 3, padding=1), nn.ReLU(True),",
        "            nn.Conv2d(384, 256, 3, padding=1), nn.ReLU(True),",
        "            nn.Conv2d(256, 256, 3, padding=1), nn.ReLU(True),",
        "            nn.MaxPool2d(3, 2),",
        "        )",
        "        self.classifier = nn.Sequential(",
        "            nn.Flatten(),",
        "            nn.Dropout(0.5),         # ② 거대 FC 의 과적합 억제",
        "            nn.Linear(256 * 6 * 6, 4096), nn.ReLU(True),",
        "            nn.Dropout(0.5),",
        "            nn.Linear(4096, 4096), nn.ReLU(True),",
        "            nn.Linear(4096, num_classes),",
        "        )",
        "",
        "    def forward(self, x):",
        "        return self.classifier(self.features(x))",
        "",
        "",
        "# ③ 데이터 증강 — 120만 장을 \"사실상 수천만 장\" 으로",
        "train_tf = transforms.Compose([",
        "    transforms.RandomResizedCrop(224),",
        "    transforms.RandomHorizontalFlip(),",
        "    transforms.ToTensor(),",

    const S4 = { title: "Step 4. 깊이의 역설과 ResNet (2015) — skip connection이 152층을 열다", desc: "2015년 He Kaiming 팀이 이상한 실험 결과를 공개한다: 56층 plain 네트워크가 20층보다 \"학습 오차\"부터 더 나쁘다. 과적합이라면 학습 오차는 낮아야 하니, 이건 과적합이 아니라 최적화 실패(degradation) — 이론상 56층은 \"20층 + 항등 변환 36층\"과 같아질 수 있는데, SGD가 그 해를 찾지 못하는 것이다. ResNet의 처방은 구조로 길을 깔아주는 것: 블록의 출력을 H(x)=F(x)+x로 정의해 입력 x를 그대로 더해준다. 이러면 층은 전체 변환 H(x)가 아니라 잔차 F(x)=H(x)−x만 배우면 되고, \"아무것도 안 배우는 게 최선\"인 층은 F(x)→0으로 가중치만 죽이면 공짜로 항등이 된다. 역전파에서는 +x 경로의 기울기가 항상 1이라, 기울기가 수백 층을 감쇠 없이 통과하는 고속도로가 생긴다. 결과: 152층 학습 성공, top-5 오류율 3.6%로 인간 수준(~5%)을 넘었다." };

            {icon:"📐", name:"EfficientNet (2019)", desc:"깊이·너비·해상도를 복합 계수 하나로 함께 스케일링 — 같은 정확도를 1/8 파라미터로"},
            {icon:"🧩", name:"ViT (2020) → Part Ⅳ", desc:"이미지를 16×16 패치 시퀀스로 → Transformer. \"conv 없이도 비전\" — 어텐션 편에서 계속"}
          ]
        },
        backboneTable: {
          title: "실무 선택 기준 — 직접 설계 vs 검증된 백본",
          rows: [
            {crit:"데이터 수천~수만 장 (대부분의 실무)", a:"✗ 과적합·튜닝 지옥", b:"◎ 전이학습 압승"},
            {crit:"학습 비용 (GPU 시간)", a:"✗ 처음부터 수백 시간", b:"◎ 파인튜닝 1~2시간"},
            {crit:"완전히 새로운 입력 도메인 (의료 3D 등)", a:"△ 설계 여지 있음", b:"○ 그래도 백본부터 시도"},
            {crit:"연구 — SOTA 갱신이 목표", a:"◎ 설계가 곧 기여", b:"－ 베이스라인"}
          ]
        },
        alert: {tone:"info", text:"실무 원칙: \"백본은 고르는 것, 설계하는 것이 아니다.\" 검증된 백본 + 전이학습이 기본기 — 다음 장(II-2-2)에서 전이학습을 직접 해본다."},
        code: {...CODE.after, highlight:[44,45]},
      },
    ];

    // 원본 스텝 번호표. TIMELINE 의 step 은 원본 스텝 번호(0~4)라
    // beat 로 펼친 stepIdx 와 직접 비교하면 어긋난다. title 경계로 번호를 복원한다.
    const STEP_NO = (() => {
      let no = -1, prev = null;
      return STEPS.map((s) => { if (s.title !== prev) { prev = s.title; no++; } return no; });
    })();


    // ── 연대기 타임라인 — 현재 단계 하이라이트
    function TimelineBar({ stepNo }) {
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5 mb-3">
          <div className="text-[10px] font-bold text-rose-800 mb-1.5">📜 CNN 10년 연대기</div>
          <div className="flex items-center">
            {TIMELINE.map((t, i) => {
              const active = t.step === stepNo;
              const passed = t.step < stepNo;
              return (
                <React.Fragment key={t.year}>
                  {i > 0 && <div className={`flex-1 h-0.5 ${passed || active ? 'bg-rose-400' : 'bg-rose-100'}`} />}
                  <div className="flex flex-col items-center px-0.5">
                    <div className={`w-3 h-3 rounded-full border-2 transition-all ${active ? 'bg-rose-600 border-rose-600 scale-125' : passed ? 'bg-rose-400 border-rose-400' : 'bg-white border-rose-200'}`} />
                    <div className={`text-[9px] mt-0.5 font-mono ${active ? 'text-rose-800 font-bold' : 'text-slate-500'}`}>{t.year}</div>
                    <div className={`text-[8px] whitespace-nowrap ${active ? 'text-rose-800 font-bold' : 'text-slate-400'}`}>{t.name}</div>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    // ── 아키텍처 블록 다이어그램
    const BLOCK_STYLE = {
      conv: { bg: 'bg-rose-500', text: 'text-white' },
      pool: { bg: 'bg-sky-500', text: 'text-white' },
      fc:   { bg: 'bg-amber-500', text: 'text-white' },
      relu: { bg: 'bg-emerald-500', text: 'text-white' },
      bn:   { bg: 'bg-violet-500', text: 'text-white' },
      skip: { bg: 'bg-yellow-300 border-2 border-yellow-500', text: 'text-yellow-900 font-extrabold' },
    };

    function ArchDiagram({ arch }) {
      if (!arch) return null;
      return (
        <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5 mb-3">
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[10px] font-bold text-rose-800">🏗 {arch.name}</span>
            <span className="text-[9px] font-mono text-slate-500">입력: {arch.input}</span>
          </div>
          <div className="flex flex-wrap items-center gap-1">
            {arch.blocks.map((b, i) => {
              const s = BLOCK_STYLE[b.t] || BLOCK_STYLE.conv;
              return (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-rose-300 text-[10px]">→</span>}
                  <span className={`px-1.5 py-1 rounded text-[9px] font-bold ${s.bg} ${s.text}`}>{b.label}</span>
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    // ── 스펙 칩 — 층수 / 파라미터 / 오류율
    function SpecChips({ specs }) {
      if (!specs) return null;
      const chips = [
        { k: '층수', v: `${specs.layers}층`, tone: 'bg-rose-100 text-rose-900 border-rose-300' },
        { k: '파라미터', v: specs.params, tone: 'bg-amber-100 text-amber-900 border-amber-300' },
        { k: '성적', v: specs.err, tone: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
      ];
      return (
        <div className="flex flex-wrap gap-1.5 mb-3">
          {chips.map((c) => (
            <span key={c.k} className={`px-2 py-1 rounded-lg border text-[10px] font-bold ${c.tone}`}>
              {c.k}: <span className="font-mono">{c.v}</span>
            </span>
          ))}
          <span className="px-2 py-1 rounded-lg border border-slate-300 bg-white text-[10px] text-slate-600">{specs.note}</span>
        </div>
      );
    }

    // ── AlexNet 재료 4가지 (Step 2)
    function IngredientsBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5 mb-3">
          <div className="text-[11px] font-bold text-emerald-800 mb-1.5">🧪 {box.title}</div>
          <div className="space-y-1">
            {box.rows.map((r) => (
              <div key={r.k} className="flex gap-2 items-start rounded border border-emerald-200 bg-white px-2 py-1">
                <span className="text-[10px] font-bold text-emerald-800 whitespace-nowrap w-24 shrink-0">{r.k}</span>
                <span className="text-[10px] text-slate-700">{r.why}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── VGG 수용 영역 비교 (Step 3)
    function ReceptiveBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-2.5 mb-3">
          <div className="text-[11px] font-bold text-sky-800 mb-1.5">📐 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-800 border-b border-sky-200">
                <th className="text-left py-0.5">항목</th>
                <th className="text-left py-0.5 pl-2">3×3 두 번</th>
                <th className="text-left py-0.5 pl-2">5×5 한 번</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.k} className="border-t border-sky-100">
                  <td className="py-1 text-slate-700">{r.k}</td>
                  <td className={`py-1 pl-2 font-mono ${r.win === 'a' ? 'text-emerald-700 font-bold' : 'text-slate-600'}`}>{r.a}{r.win === 'a' ? ' ✓' : ''}</td>
                  <td className="py-1 pl-2 font-mono text-slate-600">{r.b}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1 text-[9px] text-sky-900">같은 시야를 더 적은 파라미터 + 더 많은 비선형으로 — "작게 여러 번"의 승리.</div>
        </div>
      );
    }

    // ── 깊이의 역설 차트 — plain vs ResNet 층수-오류율 (Step 4)
    function DepthErrorChart({ chart }) {
      if (!chart) return null;
      const maxErr = 15;
      return (
        <div className="rounded-lg border-2 border-red-300 bg-white p-2.5 mb-3">
          <div className="text-[11px] font-bold text-red-800 mb-1.5">📉 {chart.title}</div>
          <div className="space-y-1">
            {chart.rows.map((r) => (
              <div key={r.name} className="flex items-center gap-2">
                <span className={`text-[9px] font-mono w-24 shrink-0 text-right ${r.kind === 'res' ? 'text-rose-700 font-bold' : 'text-slate-600'}`}>{r.name}</span>
                <div className="flex-1 h-3 rounded bg-slate-100 overflow-hidden">
                  <div
                    className={`h-full transition-all duration-700 ${r.bad ? 'bg-red-500' : r.kind === 'res' ? 'bg-rose-500' : 'bg-slate-400'}`}
                    style={{ width: `${(r.err / maxErr) * 100}%` }}
                  />
                </div>
                <span className={`text-[9px] font-mono w-12 ${r.bad ? 'text-red-700 font-bold' : 'text-slate-600'}`}>{r.err}%{r.bad ? ' 🚨' : ''}</span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[9px] text-red-900">{chart.note}</div>
        </div>
      );
    }

    // ── 기울기 고속도로 시각화 (Step 4) — skip 으로 우회하는 흐름
    function SkipFlowBox({ show }) {
      if (!show) return null;
      const layers = ['L152', '…', 'L3', 'L2', 'L1'];
      return (
        <div className="rounded-lg border-2 border-yellow-400 bg-yellow-50 p-2.5 mb-3">
          <div className="text-[11px] font-bold text-yellow-900 mb-1.5">🛣 기울기 고속도로 — ∂H/∂x = ∂F/∂x + 1</div>
          <div className="flex gap-3">
            {/* plain: 곱셈 감쇠 */}
            <div className="flex-1 rounded border border-slate-300 bg-white p-1.5">
              <div className="text-[9px] font-bold text-slate-600 text-center mb-1">plain — 곱셈으로 감쇠</div>
              {layers.map((l, i) => (
                <React.Fragment key={l}>
                  {i > 0 && <div className="text-center text-[8px] text-slate-400">↓ ×0.8</div>}
                  <div className="rounded border border-slate-300 bg-slate-50 text-center text-[9px] py-0.5 font-mono"
                       style={{ opacity: 1 - i * 0.18 }}>{l}</div>
                </React.Fragment>
              ))}
              <div className="text-center text-[9px] text-red-700 font-bold mt-1">0.8¹⁵² ≈ 0 — 신호 소멸 👻</div>
            </div>
            {/* resnet: +x 고속도로 */}
            <div className="flex-1 rounded border-2 border-rose-400 bg-white p-1.5 relative">
              <div className="text-[9px] font-bold text-rose-700 text-center mb-1">ResNet — "+1" 고속도로</div>
              {layers.map((l, i) => (
                <React.Fragment key={l}>
                  {i > 0 && <div className="text-center text-[8px] text-rose-500">↓ ×(∂F+1)</div>}
                  <div className="rounded border border-rose-300 bg-rose-50 text-center text-[9px] py-0.5 font-mono">{l}</div>
                </React.Fragment>
              ))}
              <div className="absolute right-1 top-7 bottom-7 w-1 rounded bg-yellow-400" title="skip 경로" />
              <div className="text-center text-[9px] text-emerald-700 font-bold mt-1">skip(⊕+x)으로 감쇠 없이 통과 ✓</div>
            </div>
          </div>
          <div className="mt-1.5 text-[9px] text-yellow-900">체인룰의 각 항에 "+1"이 끼면 곱이 0으로 붕괴하지 않는다 — 기울기가 노란 지름길로 우회해 첫 층까지 산다.</div>
        </div>
      );
    }

    // ── 이후 지도 (Step 5)
    function AfterMapBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-rose-400 bg-white p-2.5 mb-3">
          <div className="text-[11px] font-bold text-rose-900 mb-1.5">🗺 {box.title}</div>
          <div className="space-y-1.5">
            {box.items.map((it) => (
              <div key={it.name} className="flex gap-2 items-start rounded border border-rose-200 bg-rose-50 px-2 py-1.5">
                <span className="text-base">{it.icon}</span>
                <div>
                  <div className="text-[10px] font-bold text-rose-900">{it.name}</div>
                  <div className="text-[9px] text-slate-700">{it.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BackboneTable({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-xl border-2 border-rose-500 bg-gradient-to-br from-rose-50 to-amber-50 p-3 mb-3">
          <div className="text-[11px] font-bold text-rose-900 mb-1.5">⚖️ {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-rose-900 border-b-2 border-rose-300">
                <th className="text-left py-1">상황</th>
                <th className="text-left py-1 pl-2 w-28">직접 설계</th>
                <th className="text-left py-1 pl-2 w-28">백본+전이학습</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.crit} className="border-t border-rose-200">
                  <td className="py-1 text-slate-800">{r.crit}</td>
                  <td className={`py-1 pl-2 font-bold ${r.a.startsWith('◎') ? 'text-emerald-700' : r.a.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.a}</td>
                  <td className={`py-1 pl-2 font-bold ${r.b.startsWith('◎') ? 'text-emerald-700' : r.b.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.b}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ── 경고/알림 박스
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ── 좌측 LiveDataPane — 연대기 + 아키텍처 시뮬레이션 (rose 톤)
    const ERA_BADGE = {
      lenet:   { icon: '✉️', label: 'LeNet 시대' },
      alexnet: { icon: '🏆', label: 'AlexNet 혁명' },
      vgg:     { icon: '📏', label: 'VGG — 깊이의 추구' },
      resnet:  { icon: '🛣', label: 'ResNet — 깊이의 해방' },
      after:   { icon: '🗺', label: '백본 선택의 시대' },
    };

    function LiveDataPane({ beat, state, stepIdx }) {
      const era = ERA_BADGE[state.era] || ERA_BADGE.lenet;
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{era.icon}</span>
              <span>{era.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <TimelineBar stepNo={STEP_NO[stepIdx]} />
          <ArchDiagram arch={state.arch} />
          <SpecChips specs={state.specs} />
          <IngredientsBox box={state.ingredients} />
          <ReceptiveBox box={state.receptive} />
          <DepthErrorChart chart={state.depthChart} />
          <SkipFlowBox show={state.skipFlow} />
          <AfterMapBox box={state.afterMap} />
          <BackboneTable box={state.backboneTable} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ── 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ── App
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-orange-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">DL</span>
              <div>
                <h1 className="text-2xl font-bold text-rose-900">II-2-1. 아키텍처 진화 — LeNet→ResNet</h1>
                <p className="text-sm text-rose-800/80">skip connection 하나가 152층을 가능하게 했다 — CNN 10년사에서 배우는 설계 원리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`} />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }}
                aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                CNN 10년사는 "벽과 돌파"의 반복이다 — LeNet은 문법을 만들었지만 데이터·GPU가 없었고, AlexNet은 GPU·ReLU·드롭아웃·증강으로 그 문법을 폭발시켰으며,
                VGG는 "3×3만 깊게"로 표준을 세웠지만 19층의 벽에 부딪혔다. ResNet의 H(x)=F(x)+x는 층에게 "잔차만 배우는 쉬운 문제"를, 기울기에게 "감쇠 없는 고속도로"를 주어
                152층을 열었고, skip connection은 Transformer를 포함한 모든 딥러닝의 기본 부품이 됐다.
                실무 결론: 백본은 설계하지 말고 골라라 — 다음 장(II-2-2)에서 검증된 백본으로 전이학습을 직접 해본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['LeNet', 'AlexNet', 'VGG', 'ResNet', 'skip-connection', '잔차학습', 'degradation', '기울기소실', 'ReLU', 'BatchNorm', 'EfficientNet', '전이학습'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="./II-1-2.html" className="underline hover:no-underline">← 이전: II-1-2</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
