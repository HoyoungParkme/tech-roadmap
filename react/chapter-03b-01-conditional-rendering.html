<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-B-1. 조건부 렌더링 — 화면을 "if"로 분기하기
    학습 목표: React 에서 화면을 조건에 따라 다르게 그리는 5가지 패턴을
              실제 토글과 함께 시각화한다.
              안티패턴(`0 && X`, `null` 함정)이 어떻게 화면을 망가뜨리는지
              직접 눈으로 확인한다.
    핵심 비유: "JSX 안에서는 if 문이 안 들어간다 — 표현식만 가능하다."
              그래서 삼항(? :) / 단축 평가(&&) / 함수 분리가 표준이다.
    패턴: fastapi v1 — 좌(LiveDataPane: 조건 토글 → 렌더 결과)
                       / 우(VSCode CodeViewer)
    색상: indigo
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 조건부 렌더링의 핵심 패턴
    //   1) if early return            (컴포넌트 통째로 분기)
    //   2) 삼항 연산자 cond ? A : B    (둘 중 하나)
    //   3) 단축 평가  cond && A        (있을 때만)
    //   4) 함수 분리                  (분기 로직 추출)
    //   5) 안티패턴 — 0, null 함정     (단축 평가의 그림자)
    //
    //   각 step.demo(condition: boolean) → { rendered: ReactNode, log: string[] }
    //     LiveDataPane 가 직접 호출해서 "실제 렌더 결과" 박스에 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      step1: {lang:"jsx", filename:"if-return.jsx", lines:[
        "// Step 1. if early return — 가장 단순하고 읽기 쉬운 분기",
        "",
        "import React from 'react';",
        "",
        "// ─── (1) \"전혀 다른 화면\" 을 보여줘야 할 때 ───",
        "function Page({ isLoggedIn }) {",
        "  // 비로그인 → 함수 본문에서 그냥 return 해버린다",
        "  if (!isLoggedIn) return <LoginPrompt />;",
        "  // 여기 아래는 isLoggedIn 이 true 일 때만 실행됨",
        "  return <Dashboard />;",
        "}",
        "",
        "// ─── (2) 여러 상태를 차례로 분기 ───",
        "function ProductView({ status, error, data }) {",
        "  if (status === 'loading') return <Spinner />;",
        "  if (status === 'error')   return <ErrorBox message={error} />;",
        "  if (!data)                 return <EmptyState />;",
        "  return <Product data={data} />;  // 모든 if 통과 → 정상 화면",
        "}",
        "",
        "// ─── (3) 왜 if early return 이 1순위인가 ───",
        "//   ✅ 들여쓰기가 깊어지지 않고, 각 케이스가 독립적인 함수처럼 읽힌다",
        "//   ❌ 한 컴포넌트 안 작은 영역만 분기될 때는 오버킬 — ?: 또는 && 사용",
        "",
        "// 💡 \"전혀 다른 화면\" → if return · \"둘 중 하나\" → ? : · \"있을 때만\" → &&",
      ]},
      step2: {lang:"jsx", filename:"ternary.jsx", lines:[
        "// Step 2. 삼항 연산자 — JSX 안에서 두 가지 중 하나 고르기",
        "",
        "import React from 'react';",
        "",
        "// ─── (1) 가장 단순한 삼항 ───",
        "function StatusBadge({ isOnline }) {",
        "  return <span>{isOnline ? '🟢 온라인' : '⚪ 오프라인'}</span>;",
        "}",
        "",
        "// ─── (2) 컴포넌트 통째로 골라 그리기 ───",
        "function Header({ user }) {",
        "  return (",
        "    <header>",
        "      <Logo />",
        "      {user ? <UserMenu user={user} /> : <LoginButton />}",
        "    </header>",
        "  );",
        "}",
        "",
        "// ─── (3) className 도 삼항으로 ───",
        "function Button({ primary, children }) {",
        "  const cls = primary ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700';",
        "  return <button className={cls}>{children}</button>;",
        "}",
        "",
        "// ─── (4) ❌ 안티패턴 — 중첩 삼항 ───",
        "// {a ? <A /> : b ? <B /> : c ? <C /> : <D />}",
        "// ↑ 3중 중첩 — 절대 금지. 함수 분리(Step 4) 또는 if early return(Step 1).",
        "",
        "// ─── (5) ✅ JSX 외부에서 미리 계산 ───",
        "function Greeting({ hour }) {",
        "  const greeting = hour < 12 ? '좋은 아침' : '좋은 오후';",
        "  return <h1>{greeting}</h1>;  // 표현식이 길어지면 변수로 빼라",
        "}",
        "",
        "// 💡 삼항 vs && — else 가 있으면 ?:, 없으면 &&",
      ]},
      step3: {lang:"jsx", filename:"short-circuit.jsx", lines:[
        "// Step 3. 단축 평가 && — else 없는 분기의 표준",
        "",
        "import React from 'react';",
        "",
        "// ─── (1) 가장 흔한 패턴 — \"있을 때만 보여주기\" ───",
        "function Inbox({ hasUnread }) {",
        "  return (",
        "    <div>",
        "      📬 받은 편지함",
        "      {hasUnread && <UnreadBadge />}",
        "      {/* true → <UnreadBadge /> · false → React 가 무시 → 안 그림 */}",
        "    </div>",
        "  );",
        "}",
        "",
        "// ─── (2) 폼 검증 에러 메시지 ───",
        "function EmailField({ email, error }) {",
        "  return (",
        "    <div>",
        "      <input value={email} />",
        "      {error && <p className=\"text-rose-600\">{error}</p>}",
        "    </div>",
        "  );",
        "}",
        "",
        "// ─── (3) 권한 기반 표시 ───",
        "function Toolbar({ user }) {",
        "  return (",
        "    <div>",
        "      <SaveButton />",
        "      {user?.role === 'admin' && <DeleteButton />}",
        "    </div>",
        "  );",
        "}",
        "",
        "// ─── (4) 동작 원리 ───",
        "//   true  && X → X · false && X → false (단락)",
        "//   React 는 children 으로 false/null/undefined 를 받으면 무시",
        "",
        "// ─── (5) ⚠ 좌변 타입 주의 — Step 5 함정 참고 ───",
        "//   {!!items.length && <List />} / {items.length > 0 && <List />}",
        "",
        "// 💡 한 줄: \"있을 때만\" → cond && <X /> · \"둘 중 하나\" → cond ? <A /> : <B />",
      ]},
      step4: {lang:"jsx", filename:"func-extract.jsx", lines:[
        "// Step 4. 함수 분리 — 분기가 복잡해지면 즉시 추출",
        "",
        "import React from 'react';",
        "",
        "// ─── ❌ Before: JSX 안에 분기 4개 섞기 ───",
        "function PageBefore({ status, error, data }) {",
        "  return (",
        "    <Card>",
        "      {status === 'loading'",
        "        ? <Spinner />",
        "        : status === 'error'",
        "          ? <ErrorBox message={error} />",
        "          : !data?.length ? <EmptyState /> : <List items={data} />}",
        "    </Card>",
        "  );",
        "}",
        "// ↑ 4단 중첩 삼항 → 절대 읽기 싫음 😵",
        "",
        "// ─── ✅ After: \"어떤 화면\" 만 골라주는 함수로 추출 ───",
        "function renderContent(status, error, data) {",
        "  if (status === 'loading') return <Spinner />;",
        "  if (status === 'error')   return <ErrorBox message={error} />;",
        "  if (!data?.length)         return <EmptyState />;",
        "  return <List items={data} />;",
        "}",
        "",
        "function PageAfter({ status, error, data }) {",
        "  const content = renderContent(status, error, data);",
        "  return <Card>{content}</Card>;",
        "  // ↑ JSX 트리 한 줄 — 너무 깔끔해서 눈물이 날 정도",
        "}",
        "",
        "// ─── (3) 더 컴포넌트답게 — sub-component 추출 ───",
        "function ContentArea({ status, error, data }) {",
        "  if (status === 'loading') return <Spinner />;",
        "  if (status === 'error')   return <ErrorBox message={error} />;",
        "  if (!data?.length)         return <EmptyState />;",
        "  return <List items={data} />;",
        "}",
        "// 사용: <Card><ContentArea {...props} /></Card> — 캡슐화 + 단독 테스트 가능",
        "",
        "// ─── (4) 분리 시점 휴리스틱 ───",
        "//   ✅ 분기 케이스 3개 이상  /  한 케이스의 JSX 3줄 이상",
        "//   ✅ 같은 분기 재사용     /  분기 안에 또 다른 분기 (중첩)",
        "",
        "// 💡 \"JSX 는 트리를 그리는 것\" — 어떤 노드를 그릴지 결정 로직은 함수로.",
      ]},
      step5: {lang:"jsx", filename:"gotcha.jsx", lines:[
        "// Step 5. 안티패턴 — 단축 평가의 가장 흔한 버그",
        "",
        "import React from 'react';",
        "",
        "// ─── 🐛 버그 1: number 좌변의 함정 ───",
        "function FileListBuggy({ items }) {",
        "  return (",
        "    <div>",
        "      📁 첨부 파일",
        "      {items.length && <List items={items} />}",
        "      {/* items=[] → 0 && <List /> = 0 → React 가 \"0\" 을 텍스트로 그림 */}",
        "    </div>",
        "  );",
        "}",
        "",
        "// ─── ✅ 해결 1: boolean 으로 강제 ───",
        "function FileListFixed({ items }) {",
        "  return (",
        "    <div>",
        "      📁 첨부 파일",
        "      {items.length > 0 && <List items={items} />}",
        "      {/* 또는 !!items.length / items.length ? <List /> : null */}",
        "    </div>",
        "  );",
        "}",
        "",
        "// ─── 🐛 버그 2: 0 이 정상값일 때 ───",
        "function PriceBuggy({ price }) {",
        "  // price=0 (정상값) 인데 false 로 평가됨 → 가격 0원 상품 못 그림",
        "  return <div>{price && <Price value={price} />}</div>;",
        "}",
        "",
        "function PriceFixed({ price }) {",
        "  return <div>{price != null && <Price value={price} />}</div>;",
        "  //               ↑ null/undefined 만 거르고 0 은 통과",
        "}",
        "",
        "// ─── 📊 falsy 값 총정리 ───",
        "//   false / null / undefined → React 가 무시 ✅ 안전",
        "//   0   → \"0\"   출력 🐛   ·   NaN → \"NaN\" 출력 🐛",
        "//   \"\"  → 무시되지만 의도와 다를 수 있음 ⚠",
        "",
        "// ─── 💊 처방전 ───",
        "//   1. boolean 강제: items.length > 0 / !!items.length",
        "//   2. 0 이 정상값: value != null && <X />",
        "//   3. else 있음: value > 0 ? <X /> : null",
        "",
        "// 💡 한 줄: \"&& 좌변은 무조건 boolean 으로 만든 뒤에 쓴다.\"",
      ]},
    };

    const S1 = { title: "Step 1. if early return — 컴포넌트 통째로 갈아치우기", desc: "JSX 의 {} 안에는 if 문이 못 들어간다 (문장이라서). 대신 함수 컴포넌트 본문에서 if 로 일찍 return 해버리는 패턴이 가장 단순하다. 로딩 / 에러 / 권한 없음처럼 \"다른 화면을 통째로 보여줘야 할 때\" 1순위로 쓴다. 흐름이 평탄해서 읽기도 가장 쉽다.",
      condLabel: "isLoggedIn",
      condTrueText: "로그인됨",
      condFalseText: "비로그인",
      explainTrue: "isLoggedIn=true → 첫 번째 if 를 그냥 통과 → \"환영합니다\" 화면을 return",
      explainFalse: "isLoggedIn=false → 첫 번째 if 안에서 일찍 return → 아래 코드는 실행조차 안 됨",
      keyPoint: "\"다른 화면을 통째로 보여줘야 할 때\"는 if early return 이 1순위. 흐름이 평탄해서 가독성 최고.",
      demo: (cond) => {
          const log = [];
          log.push(`isLoggedIn = ${cond}`);
          if (!cond) {
            log.push('→ if (!isLoggedIn) 통과 → return <LoginPrompt />');
            return {
              rendered: (
                <div className="bg-rose-50 border-2 border-rose-300 rounded-lg p-4 text-center">
                  <div className="text-3xl mb-2">🔒</div>
                  <div className="text-sm font-bold text-rose-700">로그인이 필요합니다</div>
                  <button className="mt-2 px-3 py-1 bg-rose-500 text-white text-xs rounded font-medium">로그인</button>
                </div>
              ),
              log,
            };
          }
          log.push('→ if 통과 안 함 → return <Dashboard />');
          return {
            rendered: (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-lg p-4 text-center">
                <div className="text-3xl mb-2">👋</div>
                <div className="text-sm font-bold text-emerald-700">환영합니다, 민준님!</div>
                <div className="text-[10px] text-emerald-600 mt-1">대시보드를 불러오는 중…</div>
              </div>
            ),
            log,
          };
        },
    };
    const S2 = { title: "Step 2. 삼항 연산자 — 둘 중 하나를 골라 그리기", desc: "JSX 의 {} 안에서 if 는 못 쓰지만 삼항 연산자(? :)는 표현식이라서 OK. \"조건이 참이면 A, 아니면 B\" — 두 가지 중 정확히 하나를 그릴 때 가장 짧고 명확하다. 단, 중첩 삼항(?: 안에 또 ?:)은 가독성이 급락하니 그때는 함수로 분리한다.",
      condLabel: "isOnline",
      condTrueText: "온라인",
      condFalseText: "오프라인",
      explainTrue: "isOnline=true → ? 뒤의 A (초록 점 + \"온라인\") 가 평가됨",
      explainFalse: "isOnline=false → : 뒤의 B (회색 점 + \"오프라인\") 가 평가됨",
      keyPoint: "\"둘 중 하나\"가 명확할 때 삼항이 가장 짧다. 단 중첩 ? : 는 즉시 함수로 분리.",
      demo: (cond) => {
          const log = [];
          log.push(`isOnline = ${cond}`);
          log.push(`{isOnline ? <Online /> : <Offline />}`);
          log.push(`→ 평가된 가지: ${cond ? '<Online />' : '<Offline />'}`);
          return {
            rendered: (
              <div className="bg-white border-2 border-slate-200 rounded-lg p-4">
                <div className="flex items-center justify-center gap-2">
                  <span className={`w-3 h-3 rounded-full ${cond ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`}></span>
                  <span className={`text-sm font-bold ${cond ? 'text-emerald-700' : 'text-slate-500'}`}>
                    {cond ? '온라인' : '오프라인'}
                  </span>
                </div>
                <div className="mt-2 text-[10px] text-center text-slate-500 font-mono">
                  {cond ? 'last seen: 방금 전' : 'last seen: 3분 전'}
                </div>
              </div>
            ),
            log,
          };

      { ...S5,
        beat: { label: "해결1 마무리", at: "gotcha.jsx L22–25",
          caption: "!!items.length 또는 items.length ? ... : null 도 같은 효과의 대안이다.",
          changes: [{mark:"read", text:"대안 두 가지"}],
        },
        code: { ...CODE.step5, highlight: [22, 23, 24, 25] },
      },
      { ...S5,
        beat: { label: "버그2: 0이 정상값일 때", at: "gotcha.jsx L27–31",
          caption: "PriceBuggy: price=0(정상 가격)인데 && 좌변에서 falsy 로 평가돼 아예 그려지지 않는다.",
          changes: [{mark:"new", text:"PriceBuggy 컴포넌트"}, {mark:"gone", text:"price=0 상품 렌더"}],
        },
        code: { ...CODE.step5, highlight: [27, 28, 29, 30, 31] },
      },
      { ...S5,
        beat: { label: "해결2: != null 비교", at: "gotcha.jsx L33–36",
          caption: "PriceFixed: price != null 로 null/undefined 만 걸러내면 0 은 정상적으로 통과한다.",
          changes: [{mark:"new", text:"PriceFixed 컴포넌트"}, {mark:"changed", text:"price != null && <Price/>"}],
        },
        code: { ...CODE.step5, highlight: [33, 34, 35, 36] },
      },
      { ...S5,
        beat: { label: "falsy 값 총정리", at: "gotcha.jsx L38–41",
          caption: "false/null/undefined 는 안전하게 무시되지만, 0 과 NaN 은 그대로 텍스트로 출력된다.",
          changes: [{mark:"read", text:"falsy 값별 결과 정리"}],
        },
        code: { ...CODE.step5, highlight: [38, 39, 40, 41] },
      },
      { ...S5,
        beat: { label: "처방전 3가지", at: "gotcha.jsx L43–46",
          caption: "boolean 강제, 0 이 정상값이면 != null, else 가 있으면 삼항 — 상황별 처방전.",
          changes: [{mark:"read", text:"처방전 체크리스트"}],
        },
        code: { ...CODE.step5, highlight: [43, 44, 45, 46] },
      },
      { ...S5,
        beat: { label: "한 줄 정리", at: "gotcha.jsx L48",
          caption: "&& 좌변은 무조건 boolean 으로 만든 뒤에 쓴다.",
          changes: [{mark:"read", text:"핵심 요약"}],
        },
        code: { ...CODE.step5, highlight: [48] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // ConditionToggle — 좌측 상단: 조건 변수 토글 박스
    //   true / false 를 클릭으로 전환 → 즉시 아래 렌더 결과 갱신
    // ─────────────────────────────────────────────────────
    function ConditionToggle({ label, value, onChange, trueText, falseText }) {
      return (
        <div className="bg-white rounded-lg border-2 border-indigo-200 overflow-hidden">
          <div className="bg-indigo-100 px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-indigo-700 flex items-center justify-between">
            <span>조건 변수</span>
            <span className="font-mono normal-case lowercase text-indigo-500">boolean</span>
          </div>
          <div className="p-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="font-mono text-xs text-slate-700 font-bold">{label}</span>
              <span className="text-slate-400 text-xs">=</span>
              <span className={`font-mono text-xs font-bold px-1.5 py-0.5 rounded ${value ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                {String(value)}
              </span>
            </div>
            <div className="flex gap-1.5">
              <button
                onClick={() => onChange(true)}
                className={`flex-1 px-2 py-1.5 rounded text-[11px] font-bold transition ${
                  value
                    ? 'bg-emerald-500 text-white shadow'
                    : 'bg-slate-100 text-slate-500 hover:bg-emerald-100 hover:text-emerald-700'
                }`}
              >
                true · {trueText}
              </button>
              <button
                onClick={() => onChange(false)}
                className={`flex-1 px-2 py-1.5 rounded text-[11px] font-bold transition ${
                  !value
                    ? 'bg-rose-500 text-white shadow'
                    : 'bg-slate-100 text-slate-500 hover:bg-rose-100 hover:text-rose-700'
                }`}
              >
                false · {falseText}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // RenderResult — 좌측 중간: 실제 렌더 결과 박스
    //   step.demo(cond) 가 돌려준 ReactNode 를 그대로 표시
    // ─────────────────────────────────────────────────────
    function RenderResult({ rendered }) {
      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 overflow-hidden">
          <div className="bg-emerald-100 px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-emerald-700 flex items-center justify-between">
            <span>실제 렌더 결과</span>
            <span className="font-mono normal-case lowercase text-emerald-500">DOM</span>
          </div>
          <div className="p-3 bg-slate-50/50">
            {rendered}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // EvaluationLog — 좌측 하단: 평가 로그 (어떻게 표현식이 풀렸는가)
    // ─────────────────────────────────────────────────────
    function EvaluationLog({ log }) {
      return (
        <div className="bg-[#1e1e1e] rounded-lg border border-slate-700 overflow-hidden">
          <div className="bg-[#252526] px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400 flex items-center justify-between border-b border-slate-700">
            <span>평가 로그</span>
            <span className="font-mono normal-case lowercase text-slate-500">trace</span>
          </div>
          <div className="p-3 font-mono text-[11px] space-y-0.5">
            {log.map((line, i) => {
              const isArrow = line.startsWith('→');
              return (
                <div key={i} className={isArrow ? 'text-emerald-300 pl-2' : 'text-slate-200'}>
                  {line}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 변환 흐름 화살표 (수직)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-indigo-600 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-indigo-400 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : 조건 토글 (true/false 버튼)
    //   ↓ React 가 step 의 demo 함수 평가
    //   중간 : 실제 렌더 결과 (조건 따라 다른 DOM)
    //   ↓ 표현식 평가 추적
    //   하단 : 평가 로그 (어떤 가지가 평가됐는가)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step, stepIdx }) {
      // 각 step 마다 토글 상태를 따로 관리 → step 이 바뀌면 true 로 초기화
      const [cond, setCond] = useState(true);

      useEffect(() => {
        setCond(true);
      }, [stepIdx]);

      const { rendered, log } = step.demo(cond);

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🔀 조건 → JSX 평가 → 화면</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {/* 1) 조건 변수 토글 */}
            <ConditionToggle
              label={step.condLabel}
              value={cond}
              onChange={setCond}
              trueText={step.condTrueText}
              falseText={step.condFalseText}
            />

            <FlowArrow label="JSX 평가" />

            {/* 2) 실제 렌더 결과 */}
            <RenderResult rendered={rendered} />

            <FlowArrow label="평가 추적" />

            {/* 3) 평가 로그 */}
            <EvaluationLog log={log} />
          </div>

          {/* 분기별 설명 — true/false 별로 다른 색상 */}
          <div className={`mt-3 border-l-4 px-3 py-2 rounded-r ${cond ? 'bg-emerald-50 border-emerald-400' : 'bg-rose-50 border-rose-400'}`}>
            <div className={`text-[9px] font-bold uppercase tracking-wider mb-0.5 ${cond ? 'text-emerald-600' : 'text-rose-600'}`}>
              {cond ? 'TRUE 가지' : 'FALSE 가지'}
            </div>
            <p className={`text-[11px] leading-snug ${cond ? 'text-emerald-900' : 'text-rose-900'}`}>
              {cond ? step.explainTrue : step.explainFalse}
            </p>
          </div>

          {/* 핵심 포인트 박스 */}
          <div className="mt-2 bg-indigo-50 border-l-4 border-indigo-400 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-indigo-600 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-indigo-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-400"></span>true 가지
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-400"></span>false 가지
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-indigo-400"></span>흐름
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   파일명 탭 + 윈도우 dot + 라인 번호 + 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-indigo-500/15 border-l-2 border-indigo-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="./index.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter III-B-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-indigo-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. React 기초 &gt; Chapter B. 렌더링 패턴</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">III-B-1. 조건부 렌더링 — 화면을 if 로 분기하기</h1>
                  <p className="text-sm text-slate-500 mt-0.5">if early return / 삼항 / 단축 평가 / 함수 분리 / 안티패턴 5가지 패턴</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-indigo-50 border-2 border-indigo-300 rounded-xl p-3 text-sm text-indigo-900">
                💡 정리: 분기 화면 통째로 → <strong>if early return</strong> · 둘 중 하나 → <strong>삼항 ? :</strong> · 있을 때만 → <strong>cond &amp;&amp; X</strong> · 복잡하면 즉시 <strong>함수 분리</strong> · &amp;&amp; 좌변은 무조건 <strong>boolean 강제</strong>. 다음(III-B-2)에서는 리스트 렌더링과 key 를 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-indigo-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['조건부 렌더링', 'if early return', '삼항 연산자', '단축 평가', '&&', '함수 분리', 'falsy', '0 함정'].map((kw) => (
                <span key={kw} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-medium border border-indigo-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-03-01-jsx.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; III-1-3 JSX</a>
              <a href="./chapter-03b-02-list-rendering.html" className="text-indigo-700 hover:text-indigo-900 font-medium">III-B-2 리스트 렌더링 &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
