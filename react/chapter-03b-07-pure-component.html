  <!--
    III-B-7. 순수 컴포넌트 + Strict Mode
    학습 목표: 순수 함수 개념을 React 컴포넌트에 적용하는 법, 부수 효과가
              왜 위험한지, Strict Mode의 두 번 호출이 어떻게 버그를
              발견하는지, useEffect로 분리하는 패턴까지 5단계로 시각화한다.
    핵심 비유: "렌더링 = 요리 레시피 읽기, 이펙트 = 실제 요리"
    패턴: fastapi v1 — 좌(LiveDataPane: 입력 → 컴포넌트 → 출력 + Strict 시뮬)
                       / 우(VSCode CodeViewer)
    색상: indigo
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 순수 컴포넌트 학습 흐름
    //   1) 순수 함수란 (같은 입력 → 같은 출력)
    //   2) 컴포넌트도 순수해야 한다
    //   3) Strict Mode가 두 번 호출하는 이유
    //   4) 부수 효과 발견하는 패턴 (Strict Mode 시뮬)
    //   5) useEffect로 부수 효과 분리
    //
    //   inputs   : 입력 prop 목록 [{ name, value }]
    //   calls    : 호출 결과 [{ id, label, output, ok }]
    //                 ok: true=동일/예측가능, false=불일치/버그
    //   bug      : 버그 메시지 (있으면 빨강, 없으면 초록)
    //   tip      : 핵심 포인트 한 줄
    //   strict   : Strict Mode 시뮬 표시 여부
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      c1: {lang:"javascript", filename:"pure-fn.jsx", lines:["// Step 1. 순수 함수란? — 같은 입력 → 같은 출력","","// ─── (1) 순수 함수: 예측 가능 ───","function add(a, b) {","  return a + b;     // 외부에 의존하지 않는다","}","","add(2, 3);  // → 5","add(2, 3);  // → 5  (몇 번이고 같음)","add(2, 3);  // → 5","","// 특징 ↓","//   ① 같은 입력 → 같은 출력 (결정성)","//   ② 외부 변수/DOM/네트워크를 건드리지 않음 (no side effect)","//   ③ 호출 순서·횟수에 결과가 영향받지 않음","","// ─── (2) 불순 함수: 예측 불가 ───","let count = 0;","function badIncrement() {","  count += 1;       // 외부 변수 변경!","  return count;","}","","badIncrement();  // → 1","badIncrement();  // → 2  (다른 결과!)","badIncrement();  // → 3","","// ─── (3) 또 다른 불순 패턴 ───","function badRandom() {","  return Math.random();   // 매번 다른 값","}","function badNow() {","  return Date.now();      // 시간에 의존","}","","// 💡 React 컴포넌트도 \"함수\"다.","//    그래서 같은 props 에 대해 같은 JSX 를 반환해야","//    React 가 안전하게 메모이제이션·재사용·재실행할 수 있다."]},
      c2: {lang:"jsx", filename:"pure-component.jsx", lines:["// Step 2. 컴포넌트도 순수해야 한다","","// ─── ✅ 순수 컴포넌트 ───","function Greeting({ name }) {","  return <h1>안녕, {name}!</h1>;","}","","// 같은 props → 항상 같은 JSX","<Greeting name=\"철수\" />  // 안녕, 철수!","<Greeting name=\"철수\" />  // 안녕, 철수! (동일)","","// ─── ❌ 불순 컴포넌트 (안티패턴) ───","let callCount = 0;        // 모듈 전역 변수","","function BadGreeting({ name }) {","  callCount += 1;         // 렌더링 중 외부 변경!","  return (","    <h1>안녕, {name}! (호출 {callCount})</h1>","  );","}","","// 같은 name 인데도 호출마다 다른 결과","<BadGreeting name=\"철수\" />  // 안녕, 철수! (호출 1)","<BadGreeting name=\"철수\" />  // 안녕, 철수! (호출 2)","","// ─── 또 다른 불순 패턴 ───","","// (1) props 객체를 직접 mutate","function BadProps({ user }) {","  user.name = user.name.toUpperCase();  // 입력 변형!","  return <h1>{user.name}</h1>;","}","","// (2) 렌더 중 Date/Random 사용","function BadTimestamp() {","  const now = Date.now();   // 매번 달라짐","  return <p>지금: {now}</p>;","}","","// 💡 규칙: 렌더링 함수는 입력만 보고 결과를 만든다.","//    바깥 세상을 건드리지 않는다."]},
      c3: {lang:"jsx", filename:"strict-mode.jsx", lines:["// Step 3. Strict Mode — 순수성 자동 검사","","import { StrictMode } from 'react';","import { createRoot } from 'react-dom/client';","import App from './App';","","// ─── 적용 방법 ───","createRoot(document.getElementById('root')).render(","  <StrictMode>","    <App />","  </StrictMode>",");","","// ─── Strict Mode 가 개발 모드에서 하는 일 ───","//","//   ① 컴포넌트 함수를 2번 호출 (의도적)","//   ② useState 초기화 함수를 2번 실행","//   ③ useEffect 셋업/클린업을 추가로 한 번 실행","//      (mount → unmount → mount)","//","// 왜? → \"순수하지 않은 코드\" 를 일찍 잡기 위해.","","// ─── 예시: 순수 컴포넌트 ───","//   1번째 호출 → <h1>안녕, 철수!</h1>","//   2번째 호출 → <h1>안녕, 철수!</h1>","//   ✅ 두 결과 동일 → 문제 없음","","// ─── 예시: 불순 컴포넌트 ───","//   1번째 호출 → callCount 1 → \"안녕! (1)\"","//   2번째 호출 → callCount 2 → \"안녕! (2)\"","//   ❌ 두 결과 다름 → 버그 노출","","// ─── 자주 묻는 질문 ───","//   Q. 두 번 호출하면 성능 손해 아닌가?","//   A. 개발 빌드에서만 발생, 프로덕션은 1번.","//","//   Q. console.log 가 두 번 찍힌다?","//   A. 정상. 그게 바로 Strict Mode 의 신호다.","//","//   Q. useEffect 가 두 번 돌면 fetch 도 두 번?","//   A. 그렇다. 그래서 cleanup 을 잘 짜야 한다.","","// 💡 결론: Strict Mode 가 깜박이거나 두 번 찍히는 건","//    버그가 아니라 '검사 중' 이라는 뜻.","//    오히려 그 신호를 믿고 부수 효과를 정리하면 된다."]},
      c4: {lang:"jsx", filename:"side-effect-bug.jsx", lines:["// Step 4. 부수 효과 발견 — Strict Mode 가 잡아내는 것들","","// ─── 패턴 1: 모듈 전역 변수 변경 ───","let callCount = 0;","","function BadGreeting({ name }) {","  callCount += 1;          // ❌ 렌더 중 외부 mutation","  return <h1>안녕, {name}! ({callCount})</h1>;","}","","// Strict Mode 에서:","//   1번째 호출 → callCount = 1 → \"안녕, 철수! (1)\"","//   2번째 호출 → callCount = 2 → \"안녕, 철수! (2)\"","//   ⚠ 같은 props 인데 화면이 다르게 그려질 수 있다.","","// ─── 패턴 2: props 객체 직접 변경 ───","function BadList({ items }) {","  items.sort();            // ❌ 부모의 배열을 mutate","  return <ul>{items.map(i => <li key={i}>{i}</li>)}</ul>;","}","// → 부모가 모르는 사이 데이터가 뒤집힘","","// ─── 패턴 3: 렌더 중 DOM 직접 조작 ───","function BadTitle({ title }) {","  document.title = title;  // ❌ 렌더 중 DOM 변경","  return <h1>{title}</h1>;","}","// → Strict Mode 에서 두 번 set, 깜빡임/경합 발생","","// ─── 패턴 4: 렌더 중 fetch ───","function BadFetch() {","  fetch(\"/api/items\");     // ❌ 렌더마다 호출","  return <div>로딩 중…</div>;","}","// → 무한 호출, 네트워크 폭주, 서버 과부하","","// ─── 패턴 5: 렌더 중 ref 변경 ───","function BadRef() {","  const ref = useRef(0);","  ref.current += 1;        // ❌ 렌더 중 ref 쓰기","  return <p>{ref.current}</p>;","}","","// 💡 발견 신호 ↓","//   ① 카운터가 2 씩 증가","//   ② console.log 가 두 번 찍힘","//   ③ 네트워크 탭에 같은 요청이 두 번","//   ④ 화면이 살짝 깜빡임","//","//   → \"Strict Mode 가 깨진 게 아니라 코드가 깨진 것\""]},
      c5: {lang:"jsx", filename:"useeffect-fix.jsx", lines:["// Step 5. useEffect 로 부수 효과 분리하기","","import { useState, useEffect } from 'react';","","// ─── ✅ 패턴 1: DOM 변경 → useEffect ───","function GoodTitle({ title }) {","  useEffect(() => {","    document.title = title;","  }, [title]);             // title 바뀔 때만 실행","","  return <h1>{title}</h1>;","}","","// ─── ✅ 패턴 2: API 호출 → useEffect + cleanup ───","function GoodFetch() {","  const [data, setData] = useState(null);","","  useEffect(() => {","    const ctrl = new AbortController();","    fetch(\"/api/items\", { signal: ctrl.signal })","      .then(r => r.json())","      .then(setData);","","    return () => ctrl.abort();   // cleanup","  }, []);","","  return <div>{data ? \"로딩됨\" : \"로딩 중…\"}</div>;","}","","// ─── ✅ 패턴 3: 이벤트 핸들러 → 그대로 OK ───","function GoodButton() {","  const handleClick = () => {","    fetch(\"/api/save\");          // 이벤트는 자유","  };","  return <button onClick={handleClick}>저장</button>;","}","","// ─── ✅ 패턴 4: 외부 카운터 → state 로 ───","function GoodCounter() {","  const [count, setCount] = useState(0);   // 외부 변수 X","  return (","    <button onClick={() => setCount(c => c + 1)}>","      클릭 {count}","    </button>","  );","}","","// ─── ✅ 패턴 5: 타이머 → useEffect + cleanup ───","function GoodTimer() {","  const [n, setN] = useState(0);","  useEffect(() => {","    const id = setInterval(() => setN(x => x + 1), 1000);","    return () => clearInterval(id);   // 필수","  }, []);","  return <p>{n}초</p>;","}","","// 💡 핵심 비유","//   렌더링        = 요리 레시피 \"읽기\"     (계산만)","//   useEffect     = 실제 요리 \"하기\"       (외부와 상호작용)","//   cleanup       = 불 끄고 정리하기       (Strict Mode 통과)"]},
    };

    const S1 = { title: "Step 1. 순수 함수란 — 같은 입력, 같은 출력", desc: "순수 함수는 두 가지 약속을 지킨다. ① 같은 입력에 대해 항상 같은 출력을 낸다. ② 자기 바깥의 어떤 것도 건드리지 않는다(부수 효과 X). 수학의 f(x)=x+1처럼 언제 몇 번 호출해도 결과가 동일하다. React 컴포넌트도 이 약속을 따라야 예측 가능한 UI가 된다." };
    const S2 = { title: "Step 2. 컴포넌트도 순수해야 한다", desc: "React 컴포넌트는 props 를 입력으로 받아 JSX 를 출력하는 함수다. 따라서 같은 props → 같은 JSX 가 나와야 한다. 렌더링 함수 안에서 외부 변수를 변경하거나, 컴포넌트 바깥의 객체를 mutate 하거나, 전역 상태를 건드리면 React 의 가정이 깨진다. 결과는 화면 깜박임, 잘못된 메모, 추적 불가 버그." };
    const S3 = { title: "Step 3. Strict Mode 가 두 번 호출하는 이유", desc: "React.StrictMode 는 개발 모드에서 컴포넌트 함수를 일부러 두 번 호출한다. 왜? 순수 컴포넌트라면 두 번 호출해도 결과가 같다. 불순 컴포넌트라면 두 번째 호출에서 결과가 어긋나며 버그를 노출한다. 일종의 \"안전 검사\" 다. 프로덕션 빌드에서는 한 번만 호출되므로 성능 영향은 없다." };
    const S4 = { title: "Step 4. 부수 효과 발견 — Strict Mode 시뮬", desc: "실제 버그 패턴을 살펴보자. 컴포넌트 안에서 모듈 전역 카운터를 증가시키면, Strict Mode 가 두 번 호출하는 순간 카운터가 두 번씩 증가한다. 화면에 \"(2)\" 가 찍히면 즉시 의심하라. 외부 변수 mutation, props mutation, fetch 직접 호출이 대표적인 범인이다." };
    const S5 = { title: "Step 5. useEffect 로 부수 효과 분리", desc: "해법은 단순하다. 렌더링 함수는 \"JSX 를 만드는 일\" 만 한다. 외부 세계와 상호작용(API 호출, DOM 변경, 타이머, 구독)은 useEffect 안으로 옮긴다. useEffect 는 렌더링이 끝난 뒤에 한 번만 실행되며, deps 가 바뀔 때만 재실행된다. cleanup 함수를 같이 두면 Strict Mode 의 두 번 호출도 안전하게 통과한다." };

    const STEPS = [
      // ── Step 1 ──────────────────────────────────────────────
      { ...S1,
        beat:{ label:"순수 함수 — add", at:"pure-fn.jsx L3–10", caption:"같은 입력 (2,3) 에 대해 add 는 항상 같은 출력 5 를 돌려준다 — 외부 상태에 의존하지 않는다.",
               changes:[{"mark":"new","text":"add(a,b) 함수"},{"mark":"read","text":"add(2,3) → 5 (항상 동일)"}] },
        inputs: [{"name":"a","value":2},{"name":"b","value":3}],
        callLabel: "add(2, 3)",
        calls: [{"id":"c1-1","label":"1번째 호출","output":"5","ok":true},{"id":"c1-2","label":"2번째 호출","output":"5","ok":true},{"id":"c1-3","label":"3번째 호출","output":"5","ok":true}],
        bug: null,
        tip: "같은 입력 → 같은 출력 + 외부 상태 변경 없음. 이게 순수 함수다.",
        strict: false,
        code:{ ...CODE.c1, highlight:[3,4,5,6,7,8,9,10] },

        inputs: [{"name":"name","value":"\"철수\""},{"name":"StrictMode","value":"ON"}],
        callLabel: "<GoodGreeting name=\"철수\" />",
        calls: [{"id":"c5-1","label":"1번째 렌더 (계산)","output":"안녕, 철수!","ok":true},{"id":"c5-2","label":"2번째 렌더 (Strict 검사)","output":"안녕, 철수!","ok":true},{"id":"c5-3","label":"useEffect 1회","output":"document.title 변경","ok":true},{"id":"c5-4","label":"cleanup → 재실행","output":"안전하게 복구","ok":true}],
        bug: null,
        tip: "렌더 = 레시피 읽기, useEffect = 실제 요리. 부수 효과는 effect 안으로.",
        strict: true,
        code:{ ...CODE.c5, highlight:[57,58,59,60,61] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // InputCard — 좌측 상단: 컴포넌트 입력(props) 카드
    // ─────────────────────────────────────────────────────
    function InputCard({ inputs, label }) {
      return (
        <div className="rounded-lg border-2 border-indigo-300 bg-indigo-50 overflow-hidden">
          <div className="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider bg-indigo-100 text-indigo-700">
            입력 (props)
          </div>
          <div className="p-2.5 space-y-1">
            {inputs.map((p) => (
              <div key={p.name} className="flex items-center gap-2 text-[11px] font-mono">
                <span className="text-indigo-700 font-bold">{p.name}</span>
                <span className="text-slate-400">=</span>
                <span className="text-slate-800">{String(p.value)}</span>
              </div>
            ))}
            <div className="pt-1 mt-1 border-t border-indigo-200 text-[11px] font-mono text-indigo-900">
              {label}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ComponentBox — 중앙: 컴포넌트(함수) 자체를 표현하는 박스
    //   strict 모드면 두 번 호출 표시
    // ─────────────────────────────────────────────────────
    function ComponentBox({ strict }) {
      return (
        <div className="bg-white rounded-lg border-2 border-slate-300 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
            <span>컴포넌트 함수</span>
            {strict && (
              <span className="text-[9px] font-mono bg-violet-200 text-violet-800 px-1.5 py-0.5 rounded">
                StrictMode → 2회 호출
              </span>
            )}
          </div>
          <div className="p-2.5 flex items-center justify-center gap-3">
            <div className="text-[11px] font-mono text-slate-700">props</div>
            <span className="text-indigo-400">→</span>
            <div className="px-3 py-1.5 rounded-md bg-indigo-600 text-white text-[11px] font-mono font-bold">
              render()
            </div>
            <span className="text-indigo-400">→</span>
            <div className="text-[11px] font-mono text-slate-700">JSX</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // CallList — 좌측 하단: 호출 결과 목록
    //   ok=true 초록, false 빨강
    // ─────────────────────────────────────────────────────
    function CallList({ calls }) {
      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 overflow-hidden">
          <div className="bg-emerald-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-emerald-700 flex items-center justify-between">
            <span>출력 결과</span>
            <span className="text-[9px] font-mono text-emerald-600">render output</span>
          </div>
          <div className="p-2.5 space-y-1">
            {calls.map((c) => (
              <div
                key={c.id}
                className={`flex items-center justify-between gap-2 px-2 py-1 rounded text-[11px] font-mono border ${
                  c.ok
                    ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                    : 'bg-rose-50 text-rose-800 border-rose-200'
                }`}
              >
                <span className="font-bold">{c.label}</span>
                <span className="flex items-center gap-1.5">
                  <span>{c.output}</span>
                  <span className={`text-[9px] px-1 py-0.5 rounded font-bold uppercase ${
                    c.ok ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'
                  }`}>{c.ok ? 'OK' : 'BUG'}</span>
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 단계 간 화살표 (수직)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-indigo-600 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-indigo-400 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : 입력 props 카드
    //   ↓ 호출
    //   중간 : 컴포넌트 함수 박스 (Strict 표시)
    //   ↓ 반환
    //   하단 : 출력 결과 리스트 (OK/BUG 색)
    //   하단 : 핵심 포인트 + 버그 알림
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">⚛️ 입력 → 컴포넌트 → 출력 흐름</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {/* 1) 입력 */}
            <InputCard inputs={step.inputs} label={step.callLabel} />

            <FlowArrow label="호출" />

            {/* 2) 컴포넌트 함수 */}
            <ComponentBox strict={step.strict} />

            <FlowArrow label="반환" />

            {/* 3) 출력 */}
            <CallList calls={step.calls} />
          </div>

          {/* 버그 알림 (있을 때만) */}
          {step.bug && (
            <div className="mt-3 bg-rose-50 border-l-4 border-rose-400 px-3 py-2 rounded-r">
              <div className="text-[9px] font-bold text-rose-600 uppercase tracking-wider mb-0.5">버그 신호</div>
              <p className="text-[11px] text-rose-900 leading-snug">{step.bug}</p>
            </div>
          )}

          {/* 핵심 포인트 박스 */}
          <div className="mt-3 bg-indigo-50 border-l-4 border-indigo-400 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-indigo-600 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-indigo-900 leading-snug">{step.tip}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-indigo-400"></span>입력(props)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-slate-400"></span>render()
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-400"></span>OK
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-400"></span>BUG
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-violet-400"></span>StrictMode
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   파일명 탭 + 윈도우 dot + 라인 번호 + 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-indigo-500/15 border-l-2 border-indigo-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="./index.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter III-B-7</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-indigo-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III-B</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III-B. React 심화 &gt; Chapter 7. 순수 컴포넌트</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">III-B-7. 순수 컴포넌트 + Strict Mode</h1>
                  <p className="text-sm text-slate-500 mt-0.5">같은 입력 → 같은 출력, 부수 효과는 useEffect 로 분리</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-indigo-50 border-2 border-indigo-300 rounded-xl p-3 text-sm text-indigo-900">
                💡 정리: React 컴포넌트는 <strong>같은 props → 같은 JSX</strong> 를 반환해야 한다. 부수 효과는 <strong>useEffect</strong> 로 옮기고, <strong>Strict Mode</strong> 의 두 번 호출 신호를 활용해 불순 코드를 일찍 잡자.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-indigo-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['Pure Function', 'Pure Component', 'StrictMode', 'Side Effect', 'useEffect', 'cleanup', 'mutation', 'props'].map((kw) => (
                <span key={kw} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-medium border border-indigo-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-03b-06-component-tree.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; III-B-6 컴포넌트 트리</a>
              <a href="./chapter-03b-08-rendering-flow.html" className="text-indigo-700 hover:text-indigo-900 font-medium">III-B-8 렌더링 흐름 &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
