  <!--
    V-1-1. Context API — 전역 상태로 props drilling 해결
    학습 목표: props drilling 문제(5단계 깊이)부터 createContext / Provider / useContext

                       / 우(VSCode CodeViewer)

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — Context API 학습 흐름
    //   1) 문제: props drilling (5단계 깊이)
    //   2) createContext 로 Context 객체 생성
    //   3) Provider 로 트리 감싸기
    //   4) useContext 로 어디서나 직접 접근

    //
    //   tree     : 컴포넌트 트리 [{ id, name, depth, role, hasUser, note }]
    //                role: 'root' | 'pass' | 'consumer' | 'provider'
    //                    | 'clean' | 'rerender' | 'context' | 'leaf'
    //   flow     : 데이터 흐름 화살표 [{ from, to, label, kind }]
    //                kind: 'prop' | 'context' | 'rerender'
    //   keyPoint : 핵심 포인트 박스 문구

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // ── beat 재구성: react chapter-05-01-context-api ──
    const CODE = {
      step1: {lang:"jsx", filename:"props-drilling.jsx", lines:["// Step 1. props drilling — 5단계 깊이의 고통","","function App() {","  const user = { name: '홍길동', email: 'hong@dfocus.net' };","  // user 가 5단계 아래 <User /> 에서 필요하다","  return <Layout user={user} />;","}","","// 🔻 Layout 은 user 를 안 쓰지만, 자식에게 넘기려고 받음","function Layout({ user }) {","  return (","    <div className=\"layout\">","      <Header user={user} />","    </div>","  );","}","","// 🔻 Header 도 user 를 안 쓰지만, 자식에게 넘기려고 받음","function Header({ user }) {","  return (","    <header>","      <Nav user={user} />","    </header>","  );","}","","// 🔻 Nav 도 그저 통과 — props 통과 전용 중간 다리","function Nav({ user }) {","  return (","    <nav>","      <User user={user} />","    </nav>","  );","}","","// ✅ 진짜 user 를 쓰는 곳 — 5단계 아래","function User({ user }) {","  return <span>안녕, {user.name}!</span>;","}","","// ⚠️ 문제점","//   1) 중간 단계가 user 에 결합 — 시그니처 오염","//   2) theme, lang 까지 같은 방식이면 props 폭증","//   3) 중간 하나만 빠뜨려도 데이터가 끊긴다","//   👉 그래서 React 는 Context API 를 제공한다."]},
      step2: {lang:"jsx", filename:"create-context.jsx", lines:["// Step 2. createContext — 채널 만들기","","import React from 'react';","","// ─── (1) 가장 단순한 형태 ───","//   defaultValue 는 Provider 가 트리 위에 없을 때","//   useContext 가 받게 되는 폴백 값이다.","const UserContext = React.createContext(null);","","// ─── (2) 의미 있는 기본값 ───","//   null 대신 빈 객체나 noop 함수를 두면","//   사용처의 if-else 분기를 줄일 수 있다.","const ThemeContext = React.createContext({","  theme: 'light',","  toggle: () => {},","});","","// ─── (3) 컴포넌트 외부에 선언 ───","//   매 렌더마다 새 Context 가 생기면 안 되므로","//   반드시 컴포넌트 함수 바깥에 두고, 파일 단위로 export.","//   📁 contexts/UserContext.js → export const UserContext = ...","","// ─── (4) displayName — DevTools 에서 식별 ───","UserContext.displayName = 'UserContext';","","// 💡 createContext 반환값","//   { Provider, Consumer, displayName, _currentValue, ... }","//   - Provider : 값을 트리에 주입하는 컴포넌트","//   - Consumer : 옛 API (지금은 useContext 권장)","","// ⚠️ Provider 가 있으면 무조건 Provider 의 value 가 우선.","//    defaultValue 는 Provider 가 위에 없을 때만 쓰인다."]},
      step3: {lang:"jsx", filename:"provider.jsx", lines:["// Step 3. Provider — 트리에 값을 주입한다","","import React, { useState } from 'react';","import { UserContext } from './contexts/UserContext';","","function App() {","  // 보통 state 로 관리 (로그인/로그아웃에 따라 바뀌므로)","  const [user, setUser] = useState({","    name: '홍길동',","    email: 'hong@dfocus.net',","  });","","  return (","    // ✅ 이 한 줄로 트리 전체에 user 가 보인다","    <UserContext.Provider value={user}>","      <Layout />","    </UserContext.Provider>","  );","}","","// 🎉 중간 단계가 깨끗해진다","function Layout() {","  return <div className=\"layout\"><Header /></div>;","}","","function Header() {","  return <header><Nav /></header>;","}","","function Nav() {","  return <nav><User /></nav>;","}","","// ─── Provider 영향 범위 ───","//   - children 트리 안쪽 전체, 깊이 무관","//   - Provider 위쪽 컴포넌트는 못 본다","","// ─── 중첩 Provider — 안쪽이 우선 ───","<UserContext.Provider value={adminUser}>","  <UserContext.Provider value={guestUser}>","    <Card />   {/* 여기서는 guestUser */}","  </UserContext.Provider>","</UserContext.Provider>","","// ─── 여러 Context 동시 사용 ───","<UserContext.Provider value={user}>","  <ThemeContext.Provider value={theme}>","    <App />","  </ThemeContext.Provider>","</UserContext.Provider>","","// 💡 Provider = \"값의 수도꼭지\"","//    아래 어떤 컵(자손)이든 같은 물(value)을 받는다."]},
      step4: {lang:"jsx", filename:"usecontext.jsx", lines:["// Step 4. useContext — 어디서나 값을 꺼낸다","","import React, { useContext } from 'react';","import { UserContext } from './contexts/UserContext';","","// ─── (1) 기본 사용 — 한 줄 ───","function User() {","  const user = useContext(UserContext);","  return <span>안녕, {user.name}!</span>;","}","","// ─── (2) 구조 분해로 깔끔하게 ───","function UserCard() {","  const { name, email } = useContext(UserContext);","  return <div><h3>{name}</h3><p>{email}</p></div>;","}","","// ─── (3) 커스텀 훅 (실무 패턴) ───","//   - Provider 안에서만 호출하도록 안전장치","//   - 호출부가 useUser() 로 짧고 의미가 분명","function useUser() {","  const ctx = useContext(UserContext);","  if (ctx === null) {","    throw new Error('useUser 는 <UserProvider> 안에서만 호출');","  }","  return ctx;","}","","function Profile() {","  const user = useUser();   // ← 안전, 짧음, 자동완성 완벽","  return <h1>{user.name}</h1>;","}","","// ─── (4) 여러 Context 동시 구독 ───","function Header() {","  const user = useContext(UserContext);","  const { theme } = useContext(ThemeContext);","  return <header className={theme}>{user.name}</header>;","}","","// ⚠️ 규칙: 컴포넌트 최상단에서만 호출 (Hook 규칙).","//    인자는 Context 객체 — Provider 가 아니다.","//    ❌ useContext(<UserContext.Provider />)","//    ✅ useContext(UserContext)","// 💡 useContext = \"수도꼭지에서 물을 받는 컵\"."]},
      step5: {lang:"jsx", filename:"gotcha.jsx", lines:["// Step 5. ⚠️ Context 의 함정과 해결책","","import React, { useState, useMemo, useContext } from 'react';","","// ════════════════════════════════════════════","// 함정 1) 객체 리터럴 value — 매 렌더마다 새 참조","// ════════════════════════════════════════════","function BadProvider({ children }) {","  const [user, setUser] = useState(initial);","","  // ❌ { user, setUser } 가 매 렌더마다 새로 생성됨","  //    값은 같아도 참조가 달라서 모든 consumer 가 리렌더","  return (","    <UserContext.Provider value={{ user, setUser }}>","      {children}","    </UserContext.Provider>","  );","}","","// ✅ 해결: useMemo 로 value 안정화","function GoodProvider({ children }) {","  const [user, setUser] = useState(initial);","","  const value = useMemo(","    () => ({ user, setUser }),","    [user]   // user 가 바뀔 때만 새 객체","  );","","  return (","    <UserContext.Provider value={value}>","      {children}","    </UserContext.Provider>","  );","}","","// ════════════════════════════════════════════","// 함정 2) 자주 바뀌는 값 + 안 바뀌는 값을 한 Context 에","// ════════════════════════════════════════════","// ❌ user 와 setUser 를 같이 두면","//    user 가 바뀔 때 setUser 만 쓰는 컴포넌트도 리렌더","<UserContext.Provider value={{ user, setUser }}>","","// ✅ 읽기와 쓰기를 분리 — Facebook/Meta 권장 패턴","const UserStateContext = createContext(null);     // user 데이터","const UserDispatchContext = createContext(null);  // setUser/액션","","function UserProvider({ children }) {","  const [user, setUser] = useState(initial);","  return (","    <UserStateContext.Provider value={user}>","      <UserDispatchContext.Provider value={setUser}>","        {children}","      </UserDispatchContext.Provider>","    </UserStateContext.Provider>","  );","}","// 이제 setUser 만 쓰는 컴포넌트는 user 변경에 영향받지 않음","","// ════════════════════════════════════════════","// 함정 3) Context 는 \"전역 상태 라이브러리\" 가 아니다","// ════════════════════════════════════════════","//   잘 맞음   : 테마, 로그인 사용자, 언어, 라우터 정보","//              (거의 안 바뀌는 값)","//   잘 안 맞음 : 입력 실시간 동기화, 큰 리스트 부분 업데이트,","//              서버 데이터 캐싱 (자주 바뀌는 값)","//","//   👉 그럴 땐 외부 라이브러리에 위임:","//     - 서버 상태   : TanStack Query, SWR","//     - 클라이언트 : Zustand, Jotai, Redux Toolkit","//     - 셀렉터 필요 : useSyncExternalStore + 외부 store","","// 💡 정리: value 는 useMemo 안정화 / 읽기·쓰기 Context 분리 /","//         \"전역 상태 라이브러리\" 가 아니라 \"깊이 우회 도구\"."]},
    };

    const S1 = { title:"Step 1. 문제 — props drilling 5단계 지옥", desc:"깊은 컴포넌트 트리에서 자식의 자식의 자식이 user 데이터가 필요하다고 하자. 중간 단계(Layout, Header, Nav)는 user 가 필요 없는데도 단지 \"통과\"시키기 위해 props 를 받고 다시 내려준다. 한 단계만 깊어져도 모든 중간 컴포넌트의 시그니처가 바뀐다. 유지보수 악몽이자 Context 가 등장한 이유." };
    const S2 = { title:"Step 2. createContext — 공유 채널을 만든다", desc:"React.createContext(defaultValue) 호출 한 번이면 끝. 이 함수는 { Provider, Consumer } 를 가진 Context 객체를 반환한다. defaultValue 는 Provider 로 감싸지지 않은 컴포넌트에서 useContext 가 받게 되는 폴백이다. 보통은 null 또는 의미 있는 빈 값을 둔다. 이 객체 자체가 데이터를 담지는 않고, \"어떤 채널을 통해 데이터가 흐를지\" 만 정의한다." };
    const S3 = { title:"Step 3. Provider — 트리에 값을 흘려보낸다", desc:"UserContext.Provider 컴포넌트로 트리 일부를 감싸고 value 에 데이터를 넣는다. 그 시점부터 그 안의 어떤 깊이의 자손이든 useContext(UserContext) 한 줄로 값을 꺼낼 수 있다. 중간 단계는 더 이상 user props 를 받을 필요가 없다. props drilling 이 사라진다. 단, Provider 보다 위쪽의 컴포넌트는 이 값을 못 본다 — Provider 의 위치가 곧 \"범위\" 다." };
    const S4 = { title:"Step 4. useContext — 어디서나 한 줄로 꺼낸다", desc:"consumer 컴포넌트는 useContext(UserContext) 한 줄로 Provider 가 흘려보낸 값을 직접 받는다. props 사슬을 통째로 건너뛴다. 함수 본문 어디서든, 깊이가 얼마든, 한 줄. 단 Provider 보다 위쪽이면 createContext 의 defaultValue 가 돌아온다. 실무에서는 useUser() 같은 커스텀 훅으로 한 번 더 감싸서 \"Provider 없이 호출하면 throw\" 같은 안전장치를 둔다." };
    const S5 = { title:"Step 5. ⚠️ 함정 — Provider value 변경 시 모든 consumer 리렌더", desc:"Context 의 가장 큰 함정. Provider 의 value 가 바뀌면 그 Context 를 구독한 모든 consumer 가 리렌더된다. 게다가 value 에 객체 리터럴을 직접 넘기면 매 렌더마다 새 참조가 만들어져서 \"값은 같은데도\" 항상 리렌더가 일어난다. 해결책 1) 자주 바뀌는 값과 안 바뀌는 값을 다른 Context 로 분리, 2) value 를 useMemo 로 안정화, 3) 거대 전역 상태는 Zustand/Redux 같은 라이브러리에 위임. Context 는 \"변경이 드문 전역값\"에 가장 잘 맞는다." };

    const STEPS = [
      { ...S1,
        beat:{ label:"App이 user를 만든다", at:"props-drilling.jsx L3–6",
               caption:"App 컴포넌트가 user 객체를 만들어 Layout에게 첫 prop으로 내려보낸다.",
               changes:[{"mark":"new","text":"App: user 생성"}] },
        codeLeftLabel: "문제 상황 — props 만 통과시키는 중간 단계",
        codeLeft: "<App user={user}>\n  <Layout user={user}>\n    <Header user={user}>\n      <Nav user={user}>\n        <User user={user} />\n      </Nav>\n    </Header>\n  </Layout>\n</App>",
        tree: [{"id":"t1-1","name":"App","depth":0,"role":"root","hasUser":true,"note":"user 보유"}],
        flow: [],
        keyPoint: "user 는 아직 App 안에만 있다. 5단계 아래 User 까지 가려면 4번을 더 통과해야 한다.",
        code:{ ...CODE.step1, highlight:[3,4,5,6] },
      },
      { ...S1,
        beat:{ label:"Layout, 그냥 통과", at:"props-drilling.jsx L9–10",
               caption:"Layout은 user를 쓰지 않지만 자식에게 넘기기 위해 props로 받는다.",
               changes:[{"mark":"new","text":"Layout 노드 추가"},{"mark":"read","text":"App → Layout"}] },
        codeLeftLabel: "문제 상황 — props 만 통과시키는 중간 단계",
        codeLeft: "<App user={user}>\n  <Layout user={user}>\n    <Header user={user}>\n      <Nav user={user}>\n        <User user={user} />\n      </Nav>\n    </Header>\n  </Layout>\n</App>",
        tree: [{"id":"t1-1","name":"App","depth":0,"role":"root","hasUser":true,"note":"user 보유"},{"id":"t1-2","name":"Layout","depth":1,"role":"pass","hasUser":false,"note":"props 통과만"}],
        flow: [{"from":0,"to":1,"label":"user","kind":"prop"}],
        keyPoint: "Layout 은 user 를 쓰지 않는데도 시그니처에 user 를 받아야 한다.",
        code:{ ...CODE.step1, highlight:[9,10] },
      },

    function CodeCard({ label, code, accent }) {
      return (
        <div className={`rounded-lg border-2 ${accent === 'in' ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-slate-50'} overflow-hidden`}>
          <div className={`px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider ${accent === 'in' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'}`}>
            {label}
          </div>
          <pre className="text-[11px] font-mono text-slate-800 leading-snug p-2.5 m-0 whitespace-pre overflow-x-auto">{code}</pre>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ComponentTree — 컴포넌트 트리 시각화
    //   role 별 색상
    //     root      → indigo  (최상위 — user 생성)
    //     pass      → amber   (props 통과만 — drilling 단계)
    //     consumer  → emerald (실제로 user 사용)
    //     provider  → fuchsia (Context.Provider)
    //     clean     → slate   (props 깨끗 — Context 시대)
    //     rerender  → rose    (함정 — 불필요 리렌더)
    //     context   → sky     (createContext 객체)
    //     leaf      → slate   (보조 노드)
    // ─────────────────────────────────────────────────────
    function ComponentTree({ nodes }) {
      const roleMap = {
        root:     { bg: 'bg-indigo-100',  text: 'text-indigo-800',  border: 'border-indigo-400',  tag: 'root',      icon: '⚛' },
        pass:     { bg: 'bg-amber-50',    text: 'text-amber-800',   border: 'border-amber-300',   tag: 'pass',      icon: '↓' },
        consumer: { bg: 'bg-emerald-50',  text: 'text-emerald-800', border: 'border-emerald-400', tag: 'consumer',  icon: '✓' },
        provider: { bg: 'bg-fuchsia-50',  text: 'text-fuchsia-800', border: 'border-fuchsia-400', tag: 'provider',  icon: '◇' },
        clean:    { bg: 'bg-slate-50',    text: 'text-slate-500',   border: 'border-slate-200',   tag: 'clean',     icon: '·' },
        rerender: { bg: 'bg-rose-50',     text: 'text-rose-800',    border: 'border-rose-400',    tag: 're-render', icon: '🔁' },
        context:  { bg: 'bg-sky-50',      text: 'text-sky-800',     border: 'border-sky-400',     tag: 'context',   icon: '⚛' },
        leaf:     { bg: 'bg-slate-50',    text: 'text-slate-600',   border: 'border-slate-300',   tag: 'leaf',      icon: '·' },
      };

      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
            <span>컴포넌트 트리</span>
            <span className="text-[9px] font-mono text-slate-500">App → Layout → Header → Nav → User</span>
          </div>
          <div className="p-2.5 space-y-1">
            {nodes.map((n) => {
              const c = roleMap[n.role] || roleMap.leaf;
              return (
                <div key={n.id} className="flex items-center gap-1.5" style={{ marginLeft: `${n.depth * 14}px` }}>
                  <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded ${c.bg} ${c.text} border ${c.border} font-bold uppercase tracking-wide flex-shrink-0 inline-flex items-center gap-0.5`}>
                    <span>{c.icon}</span>
                    <span>{c.tag}</span>
                  </span>
                  <span className={`text-[11px] font-mono leading-tight ${n.hasUser ? 'text-indigo-900 font-bold' : 'text-slate-700'}`}>
                    {n.depth > 0 && <span className="text-slate-300">└ </span>}
                    {n.name}
                  </span>
                  {n.note && (
                    <span className="text-[9px] text-slate-500 italic ml-auto pl-2 flex-shrink-0">
                      {n.note}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrows — 데이터 흐름 화살표 패널
    //   - prop      : amber (props drilling)
    //   - context   : indigo (직접 점프)
    //   - rerender  : rose (불필요 리렌더 전파)
    // ─────────────────────────────────────────────────────
    function FlowArrows({ flow, nodes }) {
      if (!flow || flow.length === 0) {
        return (
          <div className="bg-slate-50 rounded-lg border border-slate-200 p-2.5 text-center">
            <span className="text-[10px] text-slate-500 font-mono">아직 데이터 흐름이 없음 (채널만 생성)</span>
          </div>
        );
      }

      const kindMap = {
        prop:     { color: 'amber',  arrow: '↓', label: 'props drilling — 단계마다 통과' },
        context:  { color: 'indigo', arrow: '⤳', label: 'context jump — 깊이 무관 직접 전달' },
        rerender: { color: 'rose',   arrow: '⚡', label: 're-render 전파 — 모든 consumer' },
      };

      // 동적 클래스 안전화 — Tailwind JIT 가 인식하도록 명시
      const styleMap = {
        amber:  { bg: 'bg-amber-50',  border: 'border-amber-200',  text: 'text-amber-700',  arrow: 'text-amber-600',  italic: 'text-amber-600' },
        indigo: { bg: 'bg-indigo-50', border: 'border-indigo-200', text: 'text-indigo-700', arrow: 'text-indigo-600', italic: 'text-indigo-600' },
        rose:   { bg: 'bg-rose-50',   border: 'border-rose-200',   text: 'text-rose-700',   arrow: 'text-rose-600',   italic: 'text-rose-600' },
      };

      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            데이터 흐름
          </div>
          <div className="p-2.5 space-y-1.5">
            {flow.map((f, i) => {
              const k = kindMap[f.kind] || kindMap.prop;
              const s = styleMap[k.color];
              const fromNode = nodes[f.from];
              const toNode = nodes[f.to];
              return (
                <div key={i} className={`flex items-center gap-2 px-2 py-1 rounded ${s.bg} border ${s.border}`}>
                  <span className={`text-[10px] font-mono ${s.text} font-bold flex-shrink-0`}>
                    {fromNode ? fromNode.name : '?'}
                  </span>
                  <span className={`text-base ${s.arrow} leading-none`}>{k.arrow}</span>
                  <span className={`text-[10px] font-mono ${s.text} font-bold flex-shrink-0`}>
                    {toNode ? toNode.name : '?'}
                  </span>
                  <span className={`text-[9px] ${s.italic} ml-auto italic truncate`}>
                    {f.label}
                  </span>
                </div>
              );
            })}
            <div className="pt-1 mt-1 border-t border-slate-100 text-[9px] text-slate-500 italic text-center">
              {kindMap[flow[0].kind] ? kindMap[flow[0].kind].label : ''}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 단계 사이 수직 화살표
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-indigo-600 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-indigo-400 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : 코드 카드 (현재 시나리오의 핵심 코드)
    //   중간 : 컴포넌트 트리 (역할별 색상 + 강조)
    //   하단 : 데이터 흐름 (props drilling / context jump / rerender)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🌳 컴포넌트 트리에서 user 가 흐르는 길</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {/* 1) 핵심 코드 */}
            <CodeCard label={step.codeLeftLabel} code={step.codeLeft} accent="in" />

            <FlowArrow label="컴포넌트 트리 구조" />

            {/* 2) 컴포넌트 트리 */}
            <ComponentTree nodes={step.tree} />

            <FlowArrow label="데이터 흐름" />

            {/* 3) 데이터 흐름 */}
            <FlowArrows flow={step.flow} nodes={step.tree} />
          </div>

          {/* 핵심 포인트 박스 */}
          <div className="mt-3 bg-indigo-50 border-l-4 border-indigo-400 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-indigo-600 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-indigo-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-indigo-400"></span>root
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-400"></span>pass(drill)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-400"></span>consumer
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-fuchsia-400"></span>provider
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-slate-300"></span>clean
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-400"></span>re-render
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-400"></span>context
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   파일명 탭 + 윈도우 dot + 라인 번호 + 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-indigo-500/15 border-l-2 border-indigo-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="./index.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter V-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-indigo-600 text-white flex items-center justify-center rounded-full font-bold text-sm">V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 상태 관리 &gt; Chapter 1. 전역 상태</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">V-1-1. Context API — 전역 상태로 props drilling 해결</h1>
                  <p className="text-sm text-slate-500 mt-0.5">5단계 깊이의 props 사슬을 createContext / Provider / useContext 로 한 줄에 끊는다</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-indigo-50 border-2 border-indigo-300 rounded-xl p-3 text-sm text-indigo-900">
                💡 정리: Context 는 <strong>props drilling 을 끊는 도구</strong>이지 "전역 상태 라이브러리" 가 아니다. value 는 <strong>useMemo</strong> 로 안정화하고, 자주 바뀌는 값과 안 바뀌는 값은 <strong>Context 를 분리</strong>하라. 큰 전역 상태는 <strong>Zustand / Jotai / Redux Toolkit</strong> 같은 외부 라이브러리에 위임하는 것이 옳다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-indigo-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['Context', 'createContext', 'Provider', 'useContext', 'props drilling', 'useMemo', '전역 상태', 're-render'].map((kw) => (
                <span key={kw} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-medium border border-indigo-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-04-04-custom-hooks.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; IV-2-4 Custom Hooks</a>
              <a href="./chapter-05-02-zustand.html" className="text-indigo-700 hover:text-indigo-900 font-medium">V-1-2 Zustand &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
