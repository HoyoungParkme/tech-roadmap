  <!--
    IV-1-1. React 렌더링 파이프라인 — Trigger → Render → Commit
    학습 목표: 버튼 클릭이나 state 변경이 어떻게 실제 DOM 변경으로 이어지는지,
              React가 내부적으로 거치는 5단계(Trigger / Render / Reconciliation /
              Commit / Cleanup+Effects)를 단계별로 시각화한다.
    핵심 비유: "렌더(설계도 다시 그리기) ≠ 커밋(공사장 변경)" — React는 두 단계를
              엄격히 분리한다. 그래서 Render는 순수해야 하고, DOM 변경은 Commit 단계에서만 일어난다.
    패턴: fastapi v1 — 좌(LiveDataPane: 5단계 파이프라인 박스 + Virtual DOM 트리)
                       / 우(VSCode CodeViewer)
    색상: indigo
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — React 렌더링 파이프라인
    //   Step 1) Trigger        — state 변경 / 부모 리렌더로 트리거 발생
    //   Step 2) Render         — 컴포넌트 함수 호출, 새 Virtual DOM 트리 생성
    //   Step 3) Reconciliation — 이전 트리 vs 새 트리 diff (변경 노드 식별)
    //   Step 4) Commit         — 변경된 부분만 실제 DOM에 패치
    //   Step 5) Cleanup+Effects — 이전 effect cleanup → 새 effect 실행 (paint 후)
    //
    //   pipeline   : 5단계 박스 [{ id, label, sub }]
    //   activeIdx  : 현재 활성(indigo 강조) 단계 인덱스 (0~4)
    //   vdomBefore : 변경 전 Virtual DOM 트리 [{ id, tag, depth, text, kind }]
    //   vdomAfter  : 변경 후 Virtual DOM 트리 [{ id, tag, depth, text, kind, changed }]
    //                 changed: 'new' | 'updated' | 'removed' | undefined
    //   keyPoint   : 핵심 포인트 한 줄 요약
    // ─────────────────────────────────────────────────────
    const PIPELINE = [
      { id: 'trigger',  label: '1. Trigger',        sub: 'state/props 변경' },
      { id: 'render',   label: '2. Render',         sub: '컴포넌트 함수 호출' },
      { id: 'reconcil', label: '3. Reconciliation', sub: 'VDOM diff' },
      { id: 'commit',   label: '4. Commit',         sub: 'Real DOM 패치' },
      { id: 'effects',  label: '5. Cleanup+Effect', sub: 'useEffect 실행' },
    ];

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      step1: { lang: "jsx", filename: "trigger.jsx", lines: [
        "// Step 1. Trigger — 렌더링이 시작되는 순간",
        "import { useState } from 'react';",
        "",
        "function Counter() {",
        "  const [count, setCount] = useState(0);",
        "",
        "  // 🚨 Trigger 1: setState 호출 — 가장 흔한 진입점",
        "  const handleClick = () => {",
        "    setCount(count + 1);   // ← 여기서 React 가 깨어난다",
        "  };",
        "",
        "  return (",
        "    <div>",
        "      <p>현재 카운트: {count}</p>",
        "      <button onClick={handleClick}>+1</button>",
        "    </div>",
        "  );",
        "}",
        "",
        "// 🚨 Trigger 2: 부모가 리렌더되면 자식도 자동 리렌더",
        "function Parent() {",
        "  const [theme, setTheme] = useState(\"light\");",
        "  return (",
        "    <div className={theme}>",
        "      <Counter />   {/* Parent 리렌더 → Counter 도 리렌더 */}",
        "      <button onClick={() => setTheme(\"dark\")}>다크</button>",
        "    </div>",
        "  );",
        "}",
        "",
        "// ❌ 트리거가 아닌 것 — 변수를 직접 바꾸면 React 는 모른다",
        "let externalVar = 0;",
        "function Bad() {",
        "  externalVar++;                  // setState 가 없으니 화면 그대로",
        "  return <div>{externalVar}</div>;",
        "}",
        "",
        "// 💡 React 는 \"선언적\" — setState 로 의도를 표현해야 파이프라인이 가동된다.",
        "//    명령형 변수 변경은 React 와 안 맞는다.",
        "",
        "// 📌 트리거 발생 후 React 가 하는 일",
        "//   1) 컴포넌트를 \"rerender 큐\"에 등록",
        "//   2) 다음 Render Phase 에서 함수 재호출 (Step 2)",
        "//   3) 이때까지 화면은 아직 그대로 — 큐에 들어간 상태",
      ]},
      step2: { lang: "jsx", filename: "render-fn.jsx", lines: [
        "// Step 2. Render — 컴포넌트 함수 호출 + Virtual DOM 생성",
        "",
        "// React 의사 코드:",
        "//   const newTree = Counter();   // 함수 재호출 → 새 VDOM 객체 트리",
        "",
        "function Counter() {",
        "  const [count, setCount] = useState(0);",
        "  console.log(\"렌더 발생, count =\", count);   // Render Phase",
        "",
        "  return (   // 반환된 JSX → React.createElement 호출 → VDOM 객체",
        "    <div>",
        "      <p>현재 카운트: {count}</p>",
        "      <button onClick={() => setCount(count + 1)}>+1</button>",
        "    </div>",
        "  );",
        "}",
        "",
        "// 반환된 객체 (단순화)",
        "// {",
        "//   type: 'div',",
        "//   props: { children: [",
        "//     { type: 'p',      props: { children: ['현재 카운트: ', 1] } },",
        "//     { type: 'button', props: { onClick: fn, children: '+1' } }",
        "//   ]}",
        "// }",
        "",
        "// ─── Render 의 두 가지 절대 규칙 ───",
        "// (1) 순수해야 한다 — 같은 입력 → 같은 출력. 외부 변수 변경 ❌",
        "function Bad() {",
        "  let value = 0;",
        "  value++;                     // ❌ Render 중 부수효과",
        "  fetch(\"/api/log\");           // ❌ Render 중 API 호출",
        "  document.title = \"변경됨\";    // ❌ Render 중 DOM 직접 변경",
        "  return <div>{value}</div>;",
        "}",
        "",
        "// (2) DOM 을 직접 만지지 않는다 — 설계도(VDOM)만 그린다.",
        "//     실제 공사(Real DOM 변경)는 Step 4 Commit 에서.",
        "",
        "// 💡 Strict Mode 는 Render 를 2번 호출 → 순수성 검증 (부수효과면 티남)",
        "",
        "// 📌 Render 종료 시점",
        "//   - newTree (새 VDOM)  ← 메모리에 완성",
        "//   - oldTree (이전 VDOM) ← React 가 보관 중",
        "//   - 두 트리를 들고 다음 Reconciliation 단계로",
      ]},
      step3: { lang: "markdown", filename: "reconciliation.md", lines: [
        "# Step 3. Reconciliation — Virtual DOM Diff 알고리즘",
        "",
        "oldTree 와 newTree 를 비교해서 \"최소 변경\"을 찾아내는 단계.",
        "",
        "## 비교 규칙 (단 3가지)",
        "",
        "| 비교 항목       | 같으면        | 다르면               |",
        "|:---------------|:-------------|:---------------------|",
        "| 1. type        | 노드 재사용   | 통째로 교체 (자식까지) |",
        "| 2. props       | -            | props 만 업데이트     |",
        "| 3. key (배열)  | 위치 재배치   | 노드 재생성           |",
        "",
        "## 시나리오 1 — 같은 type",
        "```jsx",
        "<p>현재 카운트: 0</p>   →   <p>현재 카운트: 1</p>",
        "```",
        "→ type 같음 → 노드 **재사용**. text 만 업데이트 마크.",
        "",
        "## 시나리오 2 — type 변경",
        "```jsx",
        "<div><p>hi</p></div>   →   <span><p>hi</p></span>",
        "```",
        "→ 최상위 type 다름 → **자식 트리까지 통째 교체**.",
        "   안의 `<p>` 도 새로 만들어진다 (state 도 잃는다).",
        "",
        "## 시나리오 3 — 배열 + key",
        "```jsx",
        "<ul><li key=\"a\">A</li><li key=\"b\">B</li></ul>",
        "↓ 순서만 뒤집음",
        "<ul><li key=\"b\">B</li><li key=\"a\">A</li></ul>",
        "```",
        "→ key 가 있으니 **같은 노드를 위치만 바꿔서 재사용**. DOM 재생성 ❌.",
        "   key 없으면 textContent 만 바꿔서 input state 가 섞이는 버그 발생.",
        "",
        "## 왜 빠른가 — O(n) 알고리즘",
        "React 는 **같은 깊이에서만** 비교한다(휴리스틱). 깊이 다르면 다른 노드.",
        "이론적 O(n³) 트리 diff 를 O(n) 으로 단순화 — 실무 99% 케이스에 OK.",
        "",
        "## React 18 의 Fiber",
        "- 이전(15): 재귀 — 한번 시작하면 못 멈춤 (긴 작업 시 UI freeze)",
        "- 이후(Fiber): 링크드 리스트 + 우선순위 → **중단/재개 가능**",
        "- 결과: `useTransition` 같은 동시성 기능 토대",
        "",
        "## 산출물",
        "```",
        "[ { type: \"UPDATE\", node: <p>, prop: \"children\", value: \"현재 카운트: 1\" } ]",
        "```",
        "→ 다음 Commit 단계에서 이 목록만 실제 DOM 에 적용.",
        "",
        "## 💡 실무 포인트",
        "- **`key` 는 안정적·고유**. `index` 는 순서 안 바뀔 때만 OK.",
        "- 같은 위치에 type 이 자주 바뀌면 → state 손실/성능 저하",
        "- \"왜 컴포넌트가 리마운트되지?\" 의 90% 는 type 또는 key 변경 때문",
      ]},
      step4: { lang: "markdown", filename: "commit.md", lines: [
        "# Step 4. Commit — 실제 DOM 패치",
        "",
        "Reconciliation 산출물(변경 목록)을 실제 브라우저 DOM 에 적용하는 단계.",
        "",
        "## 의사 코드로 보는 Commit",
        "```js",
        "const patches = [",
        "  { type: \"UPDATE_TEXT\", node: pNode, value: \"현재 카운트: 1\" },",
        "  { type: \"ADD_NODE\",    parent: ulNode, child: liNode },",
        "  { type: \"UPDATE_PROP\", node: btnNode, key: \"disabled\", value: true },",
        "];",
        "patches.forEach(p => {",
        "  switch (p.type) {",
        "    case \"UPDATE_TEXT\": p.node.textContent = p.value; break;",
        "    case \"ADD_NODE\":    p.parent.appendChild(p.child); break;",
        "    case \"REMOVE_NODE\": p.node.parentNode.removeChild(p.node); break;",
        "    case \"UPDATE_PROP\": p.node[p.key] = p.value; break;",
        "  }",
        "});",
        "```",
        "",
        "## Commit 의 3가지 특징",
        "",
        "### 1. 동기적이다",
        "paint 전에 모든 DOM 변경이 한 번에 끝나야 깜빡임 없이 갱신된다.",
        "",
        "### 2. 최소 변경만 한다",
        "```",
        "before: <p>현재 카운트: 0</p>   →  after: <p>현재 카운트: 1</p>",
        "DOM 호출: pNode.firstChild.nodeValue = \"현재 카운트: 1\"   ← 한 줄!",
        "```",
        "`<p>` 자체는 그대로, 텍스트 노드만 변경 → reflow 최소화.",
        "",
        "### 3. ref 가 채워지는 순간",
        "- Render 단계: `inputRef.current` 는 `null`",
        "- **Commit 직후**: React 가 `inputRef.current = <input DOM>` 할당",
        "- 그래서 `useEffect` 안에서 ref 를 쓰면 안전한 것",
        "",
        "## Commit 의 sub-phase (React 18 내부)",
        "| 순서 | 단계        | 하는 일                              |",
        "|:----|:------------|:-------------------------------------|",
        "| 1   | mutation    | DOM 변경 (appendChild, textContent)  |",
        "| 2   | layout      | `useLayoutEffect` 동기 실행          |",
        "| 3   | paint       | 실제 화면 갱신                        |",
        "| 4   | passive     | `useEffect` 비동기 실행 (Step 5)     |",
        "",
        "## ⚠ Commit 단계 금지 사항",
        "- 무한 setState → 무한 렌더 루프",
        "- 무거운 동기 작업 → paint 지연 → 화면 멈춤",
        "- 비동기 fetch → `useEffect` 로 옮기자",
        "",
        "## 💡 vanilla JS 와 비교",
        "```js",
        "document.getElementById(\"app\").innerHTML = template(state);",
        "// vanilla → 모든 자식 재생성, focus/scroll 잃음",
        "// React   → 바뀐 부분만 패치 → focus/scroll/애니메이션 유지",
        "```",
        "React 의 진가는 Commit 의 \"최소 변경\" 에서 나온다.",
      ]},
      step5: { lang: "jsx", filename: "effects.jsx", lines: [
        "// Step 5. Cleanup + Effects — Commit 직후 실행되는 부수효과",
        "import { useState, useEffect } from 'react';",
        "",
        "function Counter() {",
        "  const [count, setCount] = useState(0);",
        "",
        "  // ─── useEffect 실행 시점 ───",
        "  //  Render 끝 → Commit 끝 → paint → ✅ 여기서 콜백 실행 (비동기)",
        "",
        "  useEffect(() => {",
        "    console.log(\"effect 실행, count =\", count);",
        "    document.title = `카운트: ${count}`;   // DOM 직접 조작 OK ✅",
        "",
        "    return () => {                           // cleanup",
        "      console.log(\"cleanup, 이전 count =\", count);",
        "    };",
        "  }, [count]);   // count 변경 시만 재실행",
        "",
        "  return <button onClick={() => setCount(count + 1)}>+1 ({count})</button>;",
        "}",
        "",
        "// ─── 실행 흐름 (count 0 → 1 → 2) ───",
        "//   마운트 : Render→Commit→paint → effect(0) → cleanup(0) 보관",
        "//   클릭→1 : ... → cleanup(0) → effect(1) → cleanup(1) 보관",
        "//   클릭→2 : ... → cleanup(1) → effect(2)",
        "",
        "// ─── 실무 패턴 1: 구독 (subscribe/unsubscribe) ───",
        "function Chat({ roomId }) {",
        "  useEffect(() => {",
        "    const sub = chatAPI.subscribe(roomId);",
        "    sub.on(\"message\", handleMsg);",
        "    return () => { sub.off(\"message\", handleMsg); sub.close(); };  // 메모리 누수 방지",
        "  }, [roomId]);",
        "}",
        "",
        "// ─── 실무 패턴 2: fetch + race condition 방지 ───",
        "function User({ id }) {",
        "  const [data, setData] = useState(null);",
        "  useEffect(() => {",
        "    let cancelled = false;",
        "    fetch(`/api/users/${id}`).then(r => r.json())",
        "      .then(d => { if (!cancelled) setData(d); });",
        "    return () => { cancelled = true; };   // 빠른 id 변경 대비",
        "  }, [id]);",
        "}",
        "",
        "// ─── ❌ 안티패턴 ───",
        "function Bad() {",

        beat: { label: "useEffect vs useLayoutEffect", at: "effects.jsx L55–60", caption: "대부분은 useEffect(비동기) 면 충분하고, DOM 측정처럼 paint 전에 필요한 경우만 useLayoutEffect 를 쓴다.",
          changes: [{"mark":"read","text":"useLayoutEffect 는 예외적으로만"}] },
        activeIdx: 4,
        keyPoint: "useEffect = \"Commit 후 비동기 실행\". cleanup → effect 순서로 페어를 이룬다.",
        vdomBefore: [{"id":"b5-1","tag":"effect","depth":0,"kind":"effect","text":"subscribe(0)"},{"id":"b5-2","tag":"cleanup","depth":1,"kind":"cleanup","text":"unsubscribe(0)"}],
        vdomAfter: [{"id":"a5-1","tag":"cleanup","depth":0,"kind":"cleanup","text":"unsubscribe(0)","changed":"fired"},{"id":"a5-2","tag":"effect","depth":0,"kind":"effect","text":"subscribe(1)","changed":"fired"},{"id":"a5-3","tag":"cleanup","depth":1,"kind":"cleanup","text":"unsubscribe(1)","changed":"queued"}],
        code: { ...CODE.step5, highlight: [55,56,57,58,59,60] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // PipelineBoxes — 5단계 파이프라인 박스 (활성 단계 indigo 강조)
    // ─────────────────────────────────────────────────────
    function PipelineBoxes({ activeIdx }) {
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
            <span>렌더링 파이프라인</span>
            <span className="text-[9px] font-mono text-slate-500">5 phases</span>
          </div>
          <div className="p-2.5">
            <div className="grid grid-cols-5 gap-1.5">
              {PIPELINE.map((p, i) => {
                const active = i === activeIdx;
                const done = i < activeIdx;
                const boxCls = active
                  ? 'border-indigo-500 bg-indigo-100 shadow-md scale-105'
                  : done ? 'border-emerald-200 bg-emerald-50' : 'border-slate-200 bg-slate-50 opacity-60';
                const titleCls = active ? 'text-indigo-700' : done ? 'text-emerald-700' : 'text-slate-500';
                const subCls = active ? 'text-indigo-600' : done ? 'text-emerald-600' : 'text-slate-400';
                return (
                  <div key={p.id} className={`rounded-md border-2 px-1.5 py-2 text-center transition-all ${boxCls}`}>
                    <div className={`text-[10px] font-bold ${titleCls}`}>{p.label}</div>
                    <div className={`text-[9px] mt-0.5 leading-tight ${subCls}`}>{p.sub}</div>
                    {active && <div className="text-[8px] mt-1 text-indigo-500 font-bold uppercase tracking-wider">● active</div>}
                    {done && !active && <div className="text-[8px] mt-1 text-emerald-500">✓</div>}
                  </div>
                );
              })}
            </div>
            {/* 진행 화살표 */}
            <div className="flex items-center justify-between mt-2 px-2">
              {PIPELINE.slice(0, 4).map((_, i) => (
                <div key={i} className={`flex-1 h-0.5 mx-1 ${i < activeIdx ? 'bg-emerald-300' : 'bg-slate-200'}`} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VDomTree — Virtual DOM 트리 (변경된 노드 강조)
    //   kind 별 색상
    //     comp    → fuchsia (사용자 컴포넌트)
    //     elem    → sky     (HTML 요소)
    //     real    → emerald (실제 DOM)
    //     effect  → indigo  (effect 함수)
    //     cleanup → amber   (cleanup 함수)
    //   changed 별 강조
    //     trigger → indigo ring
    //     updated → indigo bg + dot
    //     same    → 회색
    //     patched → emerald + ✓
    //     fired   → indigo + ▶
    //     queued  → amber  + ⏳
    //     new     → indigo + + 표시
    //     removed → 회색 strikethrough
    // ─────────────────────────────────────────────────────
    function VDomTree({ label, nodes, accent }) {
      const kindMap = {
        comp:    { bg: 'bg-fuchsia-50', text: 'text-fuchsia-800', border: 'border-fuchsia-300', tag: 'comp' },
        elem:    { bg: 'bg-sky-50',     text: 'text-sky-800',     border: 'border-sky-300',     tag: 'elem' },
        real:    { bg: 'bg-emerald-50', text: 'text-emerald-800', border: 'border-emerald-300', tag: 'dom'  },
        effect:  { bg: 'bg-indigo-50',  text: 'text-indigo-800',  border: 'border-indigo-300',  tag: 'eff'  },
        cleanup: { bg: 'bg-amber-50',   text: 'text-amber-800',   border: 'border-amber-300',   tag: 'clean'},
      };
      const changedStyle = (c) => {
        switch (c) {
          case 'trigger': return 'bg-indigo-50 border-indigo-300 ring-1 ring-indigo-300';
          case 'updated': return 'bg-indigo-100 border-indigo-400';
          case 'same':    return 'bg-slate-50 border-slate-200';
          case 'patched': return 'bg-emerald-100 border-emerald-400';
          case 'fired':   return 'bg-indigo-100 border-indigo-400';
          case 'queued':  return 'bg-amber-50 border-amber-300';
          case 'new':     return 'bg-indigo-50 border-indigo-300';
          case 'removed': return 'bg-slate-100 border-slate-300 opacity-50 line-through';
          default:        return 'bg-white border-slate-200';
        }
      };
      const changedBadge = (c) => {
        switch (c) {
          case 'trigger': return { txt: '🚨 trig', cls: 'text-indigo-700 bg-indigo-100' };
          case 'updated': return { txt: '● upd',   cls: 'text-indigo-700 bg-indigo-100' };
          case 'same':    return { txt: '= same',  cls: 'text-slate-500 bg-slate-100' };
          case 'patched': return { txt: '✓ patch', cls: 'text-emerald-700 bg-emerald-100' };
          case 'fired':   return { txt: '▶ fire',  cls: 'text-indigo-700 bg-indigo-100' };
          case 'queued':  return { txt: '⏳ wait', cls: 'text-amber-700 bg-amber-100' };
          case 'new':     return { txt: '+ new',   cls: 'text-indigo-700 bg-indigo-100' };
          case 'removed': return { txt: '− rm',    cls: 'text-slate-500 bg-slate-100' };
          default:        return null;
        }
      };
      return (
        <div className={`rounded-lg border-2 overflow-hidden ${
          accent === 'after' ? 'border-indigo-300' : 'border-slate-200'
        }`}>
          <div className={`px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider flex items-center justify-between ${
            accent === 'after' ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-600'
          }`}>
            <span>{label}</span>
            <span className="text-[9px] font-mono opacity-70">virtual DOM</span>
          </div>
          <div className="p-2.5 space-y-1 bg-white min-h-[140px]">
            {nodes.map((n) => {
              const c = kindMap[n.kind] || kindMap.elem;
              const badge = changedBadge(n.changed);
              return (
                <div
                  key={n.id}
                  className={`flex items-center gap-1.5 rounded px-1.5 py-1 border transition-all ${changedStyle(n.changed)}`}
                  style={{ marginLeft: `${n.depth * 14}px` }}
                >
                  <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded ${c.bg} ${c.text} border ${c.border} font-bold uppercase tracking-wide flex-shrink-0`}>
                    {c.tag}
                  </span>
                  <span className="text-[11px] font-mono text-slate-700 leading-tight flex-1">
                    <span className="text-rose-600 font-bold">&lt;{n.tag}&gt;</span>
                    {n.text && <span className="text-slate-600 ml-1">{n.text}</span>}
                  </span>
                  {badge && (
                    <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded font-bold whitespace-nowrap ${badge.cls}`}>
                      {badge.txt}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 변환 흐름 화살표 (수직)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-indigo-600 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-indigo-400 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : 5단계 파이프라인 박스 (활성 단계 indigo)
    //   ↓
    //   중간 : Virtual DOM 트리 (before)
    //   ↓ Reconciliation
    //   하단 : Virtual DOM 트리 (after — 변경 노드 강조)
    //   끝   : 핵심 포인트 + 범례
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">⚛️ 렌더링 파이프라인 + Virtual DOM diff</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-2">
            {/* 1) 5단계 파이프라인 박스 */}
            <PipelineBoxes activeIdx={step.activeIdx} />

            <FlowArrow label="현재 단계의 입력" />

            {/* 2) Virtual DOM — before */}
            <VDomTree label="이전 트리 (oldTree)" nodes={step.vdomBefore} accent="before" />

            <FlowArrow label="diff & patch" />

            {/* 3) Virtual DOM — after (변경 강조) */}
            <VDomTree label="새 트리 (newTree)" nodes={step.vdomAfter} accent="after" />
          </div>

          {/* 핵심 포인트 박스 */}
          <div className="mt-3 bg-indigo-50 border-l-4 border-indigo-400 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-indigo-600 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-indigo-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-fuchsia-400"></span>component
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-400"></span>element
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-400"></span>real DOM
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-indigo-400"></span>effect
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-400"></span>cleanup
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   파일명 탭 + 윈도우 dot + 라인 번호 + 강조 라인
    //   상단에 5개 파일 탭(trigger.jsx / render-fn.jsx / reconciliation.md / commit.md / effects.jsx)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total, onTabClick }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      // 탭은 파일 하나당 하나다. beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
      const tabs = [...new Set(STEPS.map((s) => s.code.filename))]
        .map((filename) => ({ filename, idx: STEPS.findIndex((s) => s.code.filename === filename) }));

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭들 */}
          <div className="bg-[#21252b] px-3 py-2 flex items-center gap-2 border-b border-slate-700 overflow-x-auto">
            <div className="flex gap-1.5 flex-shrink-0">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <div className="flex gap-1 ml-2">
              {tabs.map((t) => (
                <button
                  key={t.idx}
                  onClick={() => onTabClick(t.idx)}
                  className={`text-[10px] font-mono px-2 py-1 rounded-t transition whitespace-nowrap ${
                    t.filename === code.filename
                      ? 'bg-[#282c34] text-slate-100 border-t border-l border-r border-slate-600'
                      : 'text-slate-500 hover:text-slate-300 hover:bg-slate-800/50'
                  }`}
                >
                  {t.filename}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase flex-shrink-0">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-indigo-500/15 border-l-2 border-indigo-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      const handleTabClick = (idx) => {
        setStepIdx(idx);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="./index.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter IV-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-indigo-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. React 동작 원리 &gt; Chapter 1. 렌더링</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">IV-1-1. React 렌더링 파이프라인 (Trigger → Render → Commit)</h1>
                  <p className="text-sm text-slate-500 mt-0.5">setState 한 줄이 어떻게 실제 DOM 변경으로 이어지는가 — 5단계 풀파이프라인</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} onTabClick={handleTabClick} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-indigo-50 border-2 border-indigo-300 rounded-xl p-3 text-sm text-indigo-900">
                💡 정리: <strong>setState → Render(VDOM 생성) → Reconciliation(diff) → Commit(DOM 패치) → Effects</strong>. Render는 순수해야 하고, DOM 변경은 Commit, 외부 세계와의 다리는 useEffect. 다음(IV-1-2)에서는 이 파이프라인을 좌우하는 <strong>Reconciliation 알고리즘과 key</strong>를 더 깊이 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-indigo-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
