        "",

        "import { useState } from 'react';",

      step4: {lang:"jsx", filename:"array-update.jsx", lines:[
        "// Step 4. 배열 state — mutate 메서드 금지, 새 배열 메서드만 사용",
        "import { useState } from 'react';",
        "",
        "function TodoList() {",
        "  const [todos, setTodos] = useState([",
        "    { id: 1, text: 'React 학습', done: false },",

        "function ProfileForm() {",

        "  const moveTo = (newCity) => {",

        "      draft.address.city = newCity;",

        "",

        <div className={`rounded-lg border-2 overflow-hidden ${dimmed ? 'opacity-60' : ''} ${addrAccent === 'rose' ? 'border-rose-300 bg-rose-50' : addrAccent === 'emerald' ? 'border-emerald-300 bg-emerald-50' : 'border-indigo-300 bg-indigo-50'}`}>
          <div className={`px-2.5 py-1 flex items-center justify-between ${addrAccent === 'rose' ? 'bg-rose-100' : addrAccent === 'emerald' ? 'bg-emerald-100' : 'bg-indigo-100'}`}>
            <span className={`text-[10px] font-bold uppercase tracking-wider ${addrAccent === 'rose' ? 'text-rose-700' : addrAccent === 'emerald' ? 'text-emerald-700' : 'text-indigo-700'}`}>{title}</span>
            <RefBadge addr={addr} accent={addrAccent} />
          </div>
          <div className="p-2.5 font-mono text-[11px] text-slate-700 space-y-0.5">
            <div className="text-slate-400">{'{'}</div>
            {Object.entries(obj).map(([k, v]) => {
              const isObj = typeof v === 'object' && v !== null && !Array.isArray(v);
              const isArr = Array.isArray(v);
              const hl = highlightKey === k;
              if (isObj) {
                return (
                  <div key={k} className={`pl-3 ${hl ? 'bg-yellow-100 rounded' : ''}`}>
                    <span className="text-indigo-700 font-bold">{k}</span>: <span className="text-slate-400">{'{'}</span>
                    <div className="pl-3">
                      {Object.entries(v).map(([ck, cv]) => (
                        <div key={ck} className={highlightKey === ck ? 'bg-yellow-100 rounded px-1' : ''}>
                          <span className="text-indigo-600">{ck}</span>: <span className="text-emerald-700">"{String(cv)}"</span>,
                        </div>
                      ))}
                    </div>
                    <span className="text-slate-400">{'}'}</span>,
                  </div>
                );
              }
              if (isArr) {
                return (
                  <div key={k} className={`pl-3 ${hl ? 'bg-yellow-100 rounded' : ''}`}>
                    <span className="text-indigo-700 font-bold">{k}</span>: <span className="text-slate-400">[ {v.length} items ]</span>,
                  </div>
                );
              }
              return (
                <div key={k} className={`pl-3 ${hl ? 'bg-yellow-100 rounded px-1' : ''}`}>
                  <span className="text-indigo-700 font-bold">{k}</span>: <span className="text-emerald-700">"{String(v)}"</span>,
                </div>
              );
            })}
            <div className="text-slate-400">{'}'}</div>
          </div>
        </div>
      );
    }

    // ── ArrayBox — 배열 시각화 (인덱스 + id/text/done 카드) ──
    function ArrayBox({ title, arr, addr, addrAccent }) {
      return (
        <div className={`rounded-lg border-2 overflow-hidden ${addrAccent === 'rose' ? 'border-rose-300 bg-rose-50' : 'border-emerald-300 bg-emerald-50'}`}>
          <div className={`px-2.5 py-1 flex items-center justify-between ${addrAccent === 'rose' ? 'bg-rose-100' : 'bg-emerald-100'}`}>
            <span className={`text-[10px] font-bold uppercase tracking-wider ${addrAccent === 'rose' ? 'text-rose-700' : 'text-emerald-700'}`}>{title}</span>
            <RefBadge addr={addr} accent={addrAccent} />
          </div>
          <div className="p-2.5 space-y-1">
            {arr.map((it, i) => (
              <div key={it.id} className="flex items-center gap-2 bg-white border border-slate-200 rounded px-2 py-1 text-[11px]">
                <span className="text-slate-400 font-mono w-4">[{i}]</span>
                <span className={`font-mono w-10 text-center text-[10px] px-1 rounded ${it.done ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>
                  {it.done ? '✓ DONE' : '○ TODO'}
                </span>
                <span className="text-slate-700 flex-1">{it.text}</span>
                <span className="text-slate-400 font-mono text-[9px]">id={it.id}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── RerenderBadge — 리렌더 결과 (X 빨강 / O 초록) ──
    function RerenderBadge({ rerendered, mutated }) {
      if (rerendered) {
        return (
          <div className="bg-emerald-50 border-2 border-emerald-400 rounded-lg p-3 flex items-center gap-3">
            <div className="w-9 h-9 bg-emerald-500 text-white rounded-full flex items-center justify-center text-lg font-bold">✓</div>
            <div>
              <div className="text-[10px] font-bold text-emerald-700 uppercase tracking-wider">React 변경 감지</div>
              <div className="text-xs text-emerald-800">새 참조 → 리렌더 발생 (화면 업데이트 O)</div>
            </div>
          </div>
        );
      }
      return (
        <div className="bg-rose-50 border-2 border-rose-400 rounded-lg p-3 flex items-center gap-3">
          <div className="w-9 h-9 bg-rose-500 text-white rounded-full flex items-center justify-center text-lg font-bold">✗</div>
          <div>
            <div className="text-[10px] font-bold text-rose-700 uppercase tracking-wider">React 감지 실패</div>
            <div className="text-xs text-rose-800">같은 참조(mutation) → 리렌더 스킵 (화면 그대로)</div>
          </div>
        </div>
      );
    }

    // ── OperationArrow — before → after 변환 화살표 + 라벨 ──
    function OperationArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1.5">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-indigo-600 font-mono font-bold tracking-wider uppercase max-w-md text-center px-2">{label}</div>
            <div className="text-indigo-400 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ── DetectorPanel — Object.is 비교 결과 (작은 박스) ──
    function DetectorPanel({ detector, result, isSame }) {
      return (
        <div className={`rounded-lg border ${isSame ? 'border-rose-300 bg-rose-50' : 'border-emerald-300 bg-emerald-50'} px-3 py-2 flex items-center justify-between`}>
          <div className="flex items-center gap-2">
            <span className="text-[9px] font-bold uppercase tracking-wider text-slate-500">React 비교</span>
            <code className="text-[10px] font-mono text-slate-700">{detector}</code>
          </div>
          <span className={`text-[10px] font-mono font-bold ${isSame ? 'text-rose-700' : 'text-emerald-700'}`}>{result}</span>
        </div>
      );
    }

    // ── PatternList — Step 4 전용: mutate vs immutable 메서드 표 ──
    function PatternList({ patterns }) {
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            배열 메서드 — mutate vs immutable
          </div>
          <div className="p-2 space-y-1">
            {patterns.map((p) => (
              <div key={p.op} className="grid grid-cols-12 items-center gap-2 bg-slate-50 rounded px-2 py-1.5 text-[10px]">
                <div className="col-span-2 font-bold text-slate-700">{p.op}</div>
                <div className="col-span-4 font-mono text-rose-600 line-through truncate">{p.bad}</div>
                <div className="col-span-1 text-slate-300 text-center">→</div>
                <div className="col-span-5 font-mono text-emerald-700 font-bold truncate">{p.good}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── ImmerComparison — Step 5 전용: spread vs Immer 비교 ──
    function ImmerComparison({ comparison, structuralSharing }) {
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            spread vs Immer
          </div>
          <div className="p-2.5 space-y-2">
            <div className="bg-amber-50 border border-amber-300 rounded px-2 py-1.5">
              <div className="text-[9px] font-bold text-amber-700 uppercase tracking-wider mb-1">Spread</div>
              <code className="text-[10px] font-mono text-amber-900 break-all">{comparison.spread}</code>
            </div>
            <div className="bg-emerald-50 border border-emerald-300 rounded px-2 py-1.5">
              <div className="text-[9px] font-bold text-emerald-700 uppercase tracking-wider mb-1">Immer</div>
              <code className="text-[10px] font-mono text-emerald-900 break-all">{comparison.immer}</code>
            </div>
            <div className="bg-indigo-50 border-l-4 border-indigo-400 px-2 py-1.5 rounded-r">
              <div className="text-[9px] font-bold text-indigo-700 uppercase tracking-wider">구조적 공유</div>
              <div className="text-[10px] text-indigo-900">{structuralSharing}</div>
            </div>
          </div>
        </div>
      );
    }

    // ── LiveDataPane — Before → opLabel → After → Object.is → 리렌더 배지 + 보너스 ──
    function LiveDataPane({ step }) {
      const isArray = step.boxKind === 'array';
      const beforeAccent = step.mutated ? 'rose' : 'indigo';
      const afterAccent  = step.mutated ? 'rose' : 'emerald';

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🧠 메모리 주소 변화 + React 변경 감지</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1.5">
            {/* Before */}
            {isArray ? (
              <ArrayBox title="Before" arr={step.before} addr={step.beforeRef} addrAccent={beforeAccent} />
            ) : (
              <ObjectBox
                title="Before"
                obj={step.before}
                addr={step.beforeRef}
                addrAccent={beforeAccent}
              />
            )}

            <OperationArrow label={step.opLabel} />

            {/* After */}
            {isArray ? (
              <ArrayBox title="After (setState 후)" arr={step.after} addr={step.afterRef} addrAccent={afterAccent} />
            ) : (
              <ObjectBox
                title="After (setState 후)"
                obj={step.after}
                addr={step.afterRef}
                addrAccent={afterAccent}
                highlightKey={step.boxKind === 'nested' ? 'city' : (step.boxKind === 'object' ? 'name' : undefined)}
              />
            )}

            {/* Object.is 비교 */}
            {step.extra && step.extra.detector && (
              <div className="pt-1">
                <DetectorPanel
                  detector={step.extra.detector}
                  result={step.extra.detectorResult}
                  isSame={step.mutated}
                />
              </div>
            )}

            {/* 리렌더 결과 */}
            <div className="pt-1">
              <RerenderBadge rerendered={step.rerendered} mutated={step.mutated} />
            </div>

            {/* Step 4 — 배열 메서드 표 */}
            {step.extra && step.extra.patterns && (
              <div className="pt-2">
                <PatternList patterns={step.extra.patterns} />
              </div>
            )}

            {/* Step 5 — Immer 비교 */}
            {step.extra && step.extra.comparison && (
              <div className="pt-2">
                <ImmerComparison comparison={step.extra.comparison} structuralSharing={step.extra.structuralSharing} />
              </div>
            )}
          </div>

          {/* 핵심 포인트 */}
          <div className="mt-3 bg-indigo-50 border-l-4 border-indigo-400 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-indigo-600 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-indigo-900 leading-snug">{step.callout}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-400"></span>같은 참조 (mutation)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-400"></span>새 참조 (immutable)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-indigo-400"></span>이전 state
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-yellow-300"></span>변경된 키
            </span>
          </div>
        </div>
      );
    }

    // ── CodeViewer — VSCode 스타일 (highlight.js + atom-one-dark, 파일명 탭, 라인 번호) ──
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[44rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-indigo-500/15 border-l-2 border-indigo-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ── App — 4 버튼(처음/이전/재생/다음) + 키보드 ←/→ + 자동재생 3000ms ──
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="./index.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter III-B-4</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-indigo-600 text-white flex items-center justify-center rounded-full font-bold text-xs">III-B</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III-B. React 응용 &gt; Chapter 4. State 고급</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">III-B-4. State 고급 — 객체/배열 불변 업데이트</h1>
                  <p className="text-sm text-slate-500 mt-0.5">왜 mutate 가 안 되는지, spread / 중첩 / 배열 / Immer 5 단계 시각화</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 정리 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-indigo-50 border-2 border-indigo-300 rounded-xl p-3 text-sm text-indigo-900">
                💡 정리: React 는 <strong>참조 비교(Object.is)</strong>로 변경을 감지한다. 객체/배열은 항상 <strong>새 참조</strong>를 만들어 setState 에 넘긴다 — 단순한 객체는 <strong>spread</strong>, 깊은 중첩은 <strong>Immer</strong>가 정답. 다음(III-B-5)에서는 useRef 로 리렌더 없이 값 보관하기를 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-indigo-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['immutability', 'Object.is', 'spread', 'nested update', 'map/filter', 'Immer', 'produce', 'structural sharing'].map((kw) => (
                <span key={kw} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-medium border border-indigo-200">
