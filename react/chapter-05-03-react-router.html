  <!--
    V-1-3. React Router — 클라이언트 사이드 라우팅
    학습 목표: SPA에서 URL 변경 시 서버 요청 없이 화면을 교체하는 클라이언트
              라우팅 원리와 React Router v6 핵심 API 5가지를 시각화한다.
    핵심 비유: "주소창은 그대로 보이지만, 사실은 JS가 컴포넌트를 갈아끼우는 중".
    패턴: fastapi v1 — 좌(LiveDataPane: 브라우저 mock — 주소창 + 페이지 콘텐츠 +
                       라우트 트리 다이어그램)
                       / 우(VSCode CodeViewer)
    색상: indigo
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — React Router 학습 흐름
    //   1) SPA 라우팅 필요성 (MPA vs SPA 비교)
    //   2) <BrowserRouter> 설정 (History API 래퍼)
    //   3) <Routes> + <Route> (URL ↔ 컴포넌트 매핑)
    //   4) 동적 파라미터 useParams (/users/:id)
    //   5) 중첩 라우트 + Outlet (공통 레이아웃)
    //
    //   browser  : 브라우저 mock {url, title, content, requests}
    //                requests: 'server' | 'none' (서버 왕복 발생 여부)
    //   tree     : 라우트 트리 노드 [{ id, label, depth, kind, active }]
    //                 kind: 'router' | 'routes' | 'route' | 'component' | 'outlet'
    //   highlight: 시각화 강조 (Step별 다름)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // ── beat 재구성: react chapter-05-03-react-router ──
    const CODE = {
      step1: {lang:"markdown", filename:"spa-need.md", lines:["# 왜 SPA 라우팅이 필요한가","","## 1. MPA(Multi Page App) — 전통적 방식","브라우저가 URL 변경마다 서버에 새 HTML 을 요청한다.","","```","GET /          → 서버: home.html      → 전체 페이지 새로 로드","GET /about     → 서버: about.html     → 전체 페이지 새로 로드","GET /products  → 서버: products.html  → 전체 페이지 새로 로드","```","단점: 깜빡임 / JS 상태 초기화 / 왕복 비용 / 공통 UI 매번 로드","","## 2. SPA(Single Page App) — 모던 방식","첫 진입 시 한 번만 index.html + JS 번들을 받는다.","이후 URL 변경은 JS 가 가로채서 화면만 교체한다.","","```","GET /          → 서버: index.html (한 번)   ← 최초 1회","/about         → 라우터: <About /> 렌더    ← 서버 요청 없음","/products      → 라우터: <Products /> 렌더 ← 서버 요청 없음","```","장점: 부드러운 전환 / 상태 유지 / 데이터만 fetch / 레이아웃 재사용","","## 3. 핵심 기술 — History API","브라우저 표준 API. 주소창 URL 만 바꾸고 새로고침은 하지 않는다.","React Router 는 이 API 를 우아한 컴포넌트로 감싼 것일 뿐.","","```javascript","// 순수 History API (라이브러리 없이)","history.pushState({}, '', '/about');  // 주소창만 /about 변경","window.dispatchEvent(new PopStateEvent('popstate'));  // 라우터 알림","```","","## 4. React Router 의 역할","- 주소창 변화 감지 (popstate / pushState)","- URL 패턴 매칭 (`/users/:id` ↔ `/users/42`)","- 매칭된 컴포넌트만 렌더링","- 중첩 레이아웃, 동적 파라미터, 코드 스플리팅 지원","","> 💡 핵심: SPA 라우팅은 \"서버에 안 가고 JS 가 화면을 바꾸는 것\"."]},
      step2: {lang:"jsx", filename:"browser-router.jsx", lines:["// Step 2. <BrowserRouter> — 라우터 컨텍스트 감싸기","import React from 'react';","import { createRoot } from 'react-dom/client';","import { BrowserRouter } from 'react-router-dom';","import App from './App';","","// ─── (1) main.jsx — 앱 최상위에서 단 한 번 감싼다 ───","const root = createRoot(document.getElementById('root'));","root.render(","  <BrowserRouter>","    <App />","  </BrowserRouter>",");","","// ⚠ <BrowserRouter> 는 앱 전체에 \"단 한 번\"만 감싸야 한다.","//    중복 감싸면 라우팅 컨텍스트가 충돌해 오작동.","","// ─── (2) BrowserRouter 가 내부적으로 하는 일 ───","//   1. History API 인스턴스 생성 (pushState / popstate 리스너)","//   2. RouterContext 로 현재 location 정보 제공","//      → 자식이 useLocation, useNavigate, useParams 등 사용 가능","//   3. URL 변경 감지 시 매칭되는 <Route> 만 리렌더 트리거","","// ─── (3) 다른 Router 들 — 환경별 선택 ───","//   <BrowserRouter>   ← 일반 SPA (HTML5 History API)","//   <HashRouter>      ← 정적 호스팅 (URL 에 # 사용, /#/about)","//   <MemoryRouter>    ← 테스트/SSR (URL 없이 메모리에서만)","//   <StaticRouter>    ← SSR 서버 사이드 렌더링용","","// ─── (4) basename — 서브 경로 배포 시 ───","//   예: https://example.com/admin 하위에 배포하는 경우","<BrowserRouter basename='/admin'>","  <App />","</BrowserRouter>","//   → /admin/about 으로 접근해야 path='/about' 매칭","","// ─── (5) 흔한 실수 ───","//   ❌ App 안쪽에 또 BrowserRouter 감싸기 (중복)","//   ❌ <Routes> 를 BrowserRouter 밖에서 사용","//      → \"useRoutes() may be used only in the context of a <Router>\"","","// 💡 핵심: BrowserRouter 는 \"라우팅 스위치 ON\".","//    한 번 감싸면 그 안 어떤 컴포넌트도 라우팅 훅을 쓸 수 있다."]},
      step3: {lang:"jsx", filename:"routes.jsx", lines:["// Step 3. <Routes> + <Route> — URL 패턴 ↔ 컴포넌트 매핑","import { BrowserRouter, Routes, Route, Link } from 'react-router-dom';","","// ─── 페이지 컴포넌트 정의 ───","function Home()     { return <h1>홈</h1>; }","function About()    { return <h1>회사 소개</h1>; }","function Products() { return <h1>상품 목록</h1>; }","function NotFound() { return <h1>404 — 없는 페이지</h1>; }","","// ─── (1) Routes + Route 기본 패턴 ───","function App() {","  return (","    <BrowserRouter>","      <nav>","        <Link to='/'>홈</Link> | ","        <Link to='/about'>소개</Link> | ","        <Link to='/products'>상품</Link>","      </nav>","","      <Routes>","        <Route path='/'         element={<Home />} />","        <Route path='/about'    element={<About />} />","        <Route path='/products' element={<Products />} />","        <Route path='*'         element={<NotFound />} />","      </Routes>","    </BrowserRouter>","  );","}","","// ─── (2) <Routes> 의 매칭 알고리즘 ───","//","//   - 자식 <Route> 들을 모두 검사한다","//   - \"정확도(specificity) 가 가장 높은\" 단 하나만 렌더링","//   - 순서 무관 — 추측 금지, 매칭 점수 기반","//","//   예) URL = /users/42","//     <Route path='/users'      />  ← 점수 1 (prefix only)","//     <Route path='/users/:id'  />  ← 점수 2 ✓ 승","//     <Route path='*'           />  ← 점수 0 (fallback)","","// ─── (3) path 패턴 종류 ───","//   '/'           → 정확히 루트만","//   '/about'      → 정확히 /about","//   '/users/:id'  → 동적 파라미터 (Step 4)","//   '/products/*' → 와일드카드 (이후 모든 경로)","//   '*'           → 어떤 것도 안 맞을 때 (404)","","// ─── (4) <Link> — 페이지 새로고침 없는 이동 ───","//   ❌ <a href=\"/about\">     ← 전체 페이지 reload","//   ✅ <Link to=\"/about\">    ← History API push (즉시)","","// ─── (5) 활성 링크 표시 — <NavLink> ───","import { NavLink } from 'react-router-dom';","<NavLink to='/about' className={({ isActive }) => isActive ? 'on' : 'off'}>소개</NavLink>","// 💡 핵심: <Routes> 는 \"switch\", <Route> 는 \"case\".","//    하나의 URL 에는 하나의 컴포넌트만 매칭된다 (중첩 제외)."]},
      step4: {lang:"jsx", filename:"useparams.jsx", lines:["// Step 4. 동적 파라미터 — useParams 로 URL 값 읽기","import { useParams, useNavigate, Link } from 'react-router-dom';","import { useEffect, useState } from 'react';","","// ─── (1) 라우트 정의 — 콜론(:) 으로 placeholder 지정 ───","function App() {","  return (","    <Routes>","      <Route path='/users'      element={<UserList />} />","      <Route path='/users/:id'  element={<UserDetail />} />","    </Routes>","  );","}","","// ─── (2) useParams() — URL 값을 객체로 ───","function UserDetail() {","  const { id } = useParams();      // /users/42 → id = \"42\"","  // ⚠ 항상 문자열! 숫자 필요하면 Number(id)","","  const [user, setUser] = useState(null);","","  useEffect(() => {","    fetch(`/api/users/${id}`)","      .then((r) => r.json())","      .then(setUser);","  }, [id]);                        // ✅ id 변경 시 다시 fetch","","  if (!user) return <div>로딩 중...</div>;","","  return (","    <div>","      <h1>👤 {user.name}</h1>","      <p>📧 {user.email}</p>","    </div>","  );","}","","// ─── (3) 여러 개 파라미터 ───","//   <Route path='/posts/:postId/comments/:commentId' element={<Cmt/>} />","//   const { postId, commentId } = useParams();","//   /posts/7/comments/13 → { postId: \"7\", commentId: \"13\" }","","// ─── (4) 프로그래밍 방식 이동 — useNavigate() ───","function UserList() {","  const navigate = useNavigate();","  const users = [{ id: 42, name: '민준' }, { id: 99, name: '서연' }];","  return (","    <ul>","      {users.map((u) => (","        <li key={u.id}>","          {/* 1) Link 로 이동 (선언적) */}","          <Link to={`/users/${u.id}`}>{u.name}</Link>","          {/* 2) 함수 호출로 이동 (조건부 로직 OK) */}","          <button onClick={() => navigate(`/users/${u.id}`)}>상세</button>","        </li>","      ))}","    </ul>","  );","}","","// ─── (5) navigate() 옵션들 ───","//   navigate('/about')                          ← 전진","//   navigate(-1)                                ← 뒤로","//   navigate('/login', { replace: true })       ← 히스토리 교체","//   navigate('/save', { state: { from: 'edit' } })  ← state 전달","","// 💡 핵심: :param 은 placeholder, useParams() 가 실제 값을 꺼낸다.","//    동적 데이터 페이지(상세, 검색, 필터)의 표준 패턴."]},
      step5: {lang:"jsx", filename:"nested-outlet.jsx", lines:["// Step 5. 중첩 라우트 + <Outlet /> — 공통 레이아웃 공유","import { BrowserRouter, Routes, Route, Outlet, NavLink } from 'react-router-dom';","","// ─── (1) 라우트 정의 — <Route> 안에 <Route> ───","function App() {","  return (","    <BrowserRouter>","      <Routes>","        <Route path='/dashboard' element={<Layout />}>","          {/* index = 부모 path 와 정확히 일치할 때의 기본 자식 */}","          <Route index           element={<DashHome />} />","          <Route path='settings' element={<Settings />} />","          <Route path='profile'  element={<Profile />} />","        </Route>","        <Route path='*' element={<NotFound />} />","      </Routes>","    </BrowserRouter>","  );","}","","// ─── (2) Layout — <Outlet /> 자리에 자식 라우트가 들어간다 ───","function Layout() {","  return (","    <div className='dashboard'>","      {/* ✅ 모든 자식 페이지에 공통 헤더 */}","      <header>","        <h1>🏠 Dashboard</h1>","        <nav className='flex gap-4'>","          <NavLink to='/dashboard'>홈</NavLink>","          <NavLink to='/dashboard/settings'>설정</NavLink>","          <NavLink to='/dashboard/profile'>프로필</NavLink>","        </nav>","      </header>","","      {/* ⭐ 핵심 — 자식 Route 의 element 가 여기에 렌더링 */}","      <main>","        <Outlet />","      </main>","","      {/* ✅ 모든 자식 페이지에 공통 푸터 */}","      <footer>© 2026</footer>","    </div>","  );","}","","// ─── (3) URL 별 렌더 결과 ───","//   /dashboard           → <Layout> + <Outlet>=<DashHome/>","//   /dashboard/settings  → <Layout> + <Outlet>=<Settings/>","//   /dashboard/profile   → <Layout> + <Outlet>=<Profile/>","//   ⭐ <Layout> 은 한 번만 마운트, 자식만 교체 → 헤더 상태 유지!","","// ─── (4) 다단계 중첩도 자유롭게 ───","//   <Route path='/admin' element={<AdminLayout />}>","//     <Route path='users' element={<UsersLayout />}>","//       <Route path=':id'  element={<UserDetail />} />","//     </Route>","//   </Route>","//   /admin/users/42 → AdminLayout > UsersLayout > UserDetail","","// ─── (5) Outlet 으로 데이터 전달 — context 패턴 ───","function Layout() {","  const [search, setSearch] = useState('');","  return (","    <div>","      <input value={search} onChange={(e) => setSearch(e.target.value)} />","      <Outlet context={{ search }} />     {/* 자식에 context 전달 */}","    </div>","  );","}","// 자식에서 useOutletContext() 로 받기","import { useOutletContext } from 'react-router-dom';","function DashHome() {","  const { search } = useOutletContext();","  return <div>검색어: {search}</div>;","}","","// 💡 핵심: <Outlet /> = \"여기에 자식 라우트가 렌더된다\"는 표시.","//    공통 레이아웃 공유의 표준 패턴 — 거의 모든 실무 앱이 사용."]},
    };

    const S1 = { title:"Step 1. 왜 SPA 라우팅이 필요한가 — MPA vs SPA", desc:"전통적 MPA(Multi Page App)는 URL이 바뀔 때마다 서버에 요청해 새 HTML을 통째로 받는다. 페이지 깜빡임이 발생하고 상태도 모두 사라진다. SPA(Single Page App)는 첫 진입 후 단 한 번만 HTML을 받고, 이후 URL 변경은 JS가 가로채서 컴포넌트만 갈아끼운다. 서버 왕복이 없으니 부드럽고, 상태도 유지된다. 이걸 가능하게 해주는 게 클라이언트 사이드 라우팅이다." };
    const S2 = { title:"Step 2. <BrowserRouter> — 라우터 컨텍스트 감싸기", desc:"<BrowserRouter>는 앱 전체를 감싸서 라우팅 기능을 활성화하는 최상위 컴포넌트다. 내부적으로 History API(pushState/popstate)를 React Context로 노출한다. 한 번만 감싸면 그 안의 어떤 컴포넌트도 useNavigate, useLocation, useParams 같은 훅을 쓸 수 있게 된다. 보통 main.jsx의 가장 바깥 레벨에 둔다." };
    const S3 = { title:"Step 3. <Routes> + <Route> — URL ↔ 컴포넌트 매핑", desc:"<Routes>는 라우트 목록 컨테이너이고, 각 <Route>가 실제 매핑 규칙이다. URL이 바뀌면 <Routes>가 자식 <Route>들을 순회하며 가장 잘 맞는 하나만 골라 렌더링한다. path=\"*\"는 어떤 것도 매칭되지 않을 때의 fallback(404 페이지)이다. 매칭은 정확도 기반이라 순서 상관 없이 best match가 이긴다." };
    const S4 = { title:"Step 4. 동적 파라미터 — useParams로 URL 값 읽기", desc:"path=\"/users/:id\"처럼 콜론(:)을 붙이면 동적 파라미터가 된다. /users/42, /users/100 같은 URL이 모두 같은 컴포넌트에 매칭되고, useParams() 훅으로 그 값을 읽는다. REST API의 경로 파라미터와 1:1 매핑되니 데이터 fetch 패턴에 그대로 쓰인다. 여러 개도 가능하다 — /posts/:postId/comments/:commentId." };
    const S5 = { title:"Step 5. 중첩 라우트 + <Outlet /> — 공통 레이아웃 공유", desc:"대부분의 앱은 헤더/사이드바/푸터 같은 공통 UI를 모든 페이지에서 재사용한다. <Route>를 다른 <Route> 안에 중첩하고, 부모의 element 컴포넌트 안에 <Outlet />을 두면 그 자리에 자식 라우트가 렌더된다. index 라우트(path 없이 index 속성)는 부모 URL과 정확히 같을 때의 기본 자식이다. 깊게 중첩하면 다단계 레이아웃도 그대로 표현된다." };

        tree: [{"id":"t5-1","label":"<BrowserRouter>","depth":0,"kind":"router"},{"id":"t5-2","label":"└ <Routes>","depth":1,"kind":"routes"},{"id":"t5-3","label":"   └ <Route path='/dashboard' element={<Layout />}>","depth":2,"kind":"route","active":true},{"id":"t5-4","label":"       ├ <Route index           element={<DashHome />} />","depth":3,"kind":"route"},{"id":"t5-5","label":"       ├ <Route path='settings' element={<Settings />} />","depth":3,"kind":"route","active":true},{"id":"t5-6","label":"       └ <Route path='profile'  element={<Profile />} />","depth":3,"kind":"route"},{"id":"t5-7","label":"       <Layout /> 안에 <Outlet /> ← 자식이 여기 박힘","depth":4,"kind":"outlet","active":true}],
        keyPoint: "부모 element 안의 <Outlet />은 자식 라우트가 렌더링되는 \"구멍\".",
        code:{ ...CODE.step5, highlight:[68,69,70,71,72,73,74,75] },
      },
      { ...S5,
        beat:{ label:"핵심 정리", at:"nested-outlet.jsx L77–78",
               caption:"Outlet 은 \"여기에 자식 라우트가 렌더된다\"는 표시 — 공통 레이아웃 공유의 표준 패턴이다.",
               changes:[{"mark":"read","text":"핵심 한 줄 정리"}] },
        browserLabel: "브라우저 — 중첩 라우트 렌더링",
        browser: {"mode":"single","url":"/dashboard/settings","title":"Settings — Dashboard","content":"┌────────────────────┐\n│ 🏠 Dashboard       │  ← <Layout> (공통)\n├────────┬───────────┤\n│ 사이드바  │ ⚙️ 설정    │  ← <Outlet/> 위치\n│  · 홈   │           │\n│  · 설정 │ 알림 ON   │\n└────────┴───────────┘","request":"⚡ Layout + Settings 동시 렌더","paint":"smooth","ctx":"parent: <Layout/> + child: <Settings/>"},
        tree: [{"id":"t5-1","label":"<BrowserRouter>","depth":0,"kind":"router"},{"id":"t5-2","label":"└ <Routes>","depth":1,"kind":"routes"},{"id":"t5-3","label":"   └ <Route path='/dashboard' element={<Layout />}>","depth":2,"kind":"route","active":true},{"id":"t5-4","label":"       ├ <Route index           element={<DashHome />} />","depth":3,"kind":"route"},{"id":"t5-5","label":"       ├ <Route path='settings' element={<Settings />} />","depth":3,"kind":"route","active":true},{"id":"t5-6","label":"       └ <Route path='profile'  element={<Profile />} />","depth":3,"kind":"route"},{"id":"t5-7","label":"       <Layout /> 안에 <Outlet /> ← 자식이 여기 박힘","depth":4,"kind":"outlet","active":true}],
        keyPoint: "부모 element 안의 <Outlet />은 자식 라우트가 렌더링되는 \"구멍\".",
        code:{ ...CODE.step5, highlight:[77,78] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // BrowserMock — 좌측 상단: 가짜 브라우저 (주소창 + 콘텐츠)
    //   mode === 'comparison' : MPA / SPA 비교 (Step 1)
    //   mode === 'single'     : 단일 브라우저 (Step 2~5)
    // ─────────────────────────────────────────────────────
    function BrowserMock({ browser }) {
      if (browser.mode === 'comparison') {
        return (
          <div className="grid grid-cols-2 gap-2">
            <BrowserPanel data={browser.mpa} title="❌ MPA — 서버 라우팅" tone="rose" />
            <BrowserPanel data={browser.spa} title="✅ SPA — 클라이언트 라우팅" tone="emerald" />
          </div>
        );
      }
      return <BrowserPanel data={browser} title="🌐 SPA Browser" tone="indigo" expanded />;
    }

    // ─────────────────────────────────────────────────────
    // BrowserPanel — 단일 브라우저 mock 카드
    //   주소창 + 페이지 콘텐츠 + 요청 표시
    // ─────────────────────────────────────────────────────
    function BrowserPanel({ data, title, tone, expanded }) {
      const toneMap = {
        indigo:  { bg: 'bg-indigo-100',  text: 'text-indigo-700',  border: 'border-indigo-300',  flash: '' },
        rose:    { bg: 'bg-rose-100',    text: 'text-rose-700',    border: 'border-rose-300',    flash: 'animate-pulse' },
        emerald: { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-300', flash: '' },
      };
      const t = toneMap[tone] || toneMap.indigo;
      return (
        <div className={`rounded-lg border-2 ${t.border} bg-white overflow-hidden`}>
          {/* 타이틀 바 */}
          <div className={`${t.bg} ${t.text} px-2 py-1 text-[10px] font-bold uppercase tracking-wider flex items-center justify-between`}>
            <span>{title}</span>
            <div className="flex gap-1">
              <span className="w-2 h-2 rounded-full bg-red-400"></span>
              <span className="w-2 h-2 rounded-full bg-yellow-400"></span>
              <span className="w-2 h-2 rounded-full bg-green-400"></span>
            </div>
          </div>

          {/* 주소창 */}
          <div className="bg-slate-50 border-b border-slate-200 px-2 py-1.5 flex items-center gap-1.5">
            <span className="text-slate-400 text-xs">⬅ ➡ ↻</span>
            <div className="flex-1 bg-white border border-slate-300 rounded-full px-2 py-0.5 font-mono text-[11px] text-slate-700">
              <span className="text-emerald-600">🔒 https://my-app.dev</span>
              <span className="text-indigo-700 font-bold">{data.url}</span>
            </div>
          </div>

          {/* 페이지 콘텐츠 */}
          <div className={`p-2.5 ${expanded ? 'min-h-[140px]' : 'min-h-[100px]'} ${data.paint === 'flash' ? 'bg-rose-50' : 'bg-white'}`}>
            <div className="text-[10px] font-bold text-slate-500 mb-1.5 font-mono">{data.title}</div>
            <pre className="text-[11px] text-slate-700 leading-snug font-sans whitespace-pre-wrap">{data.content}</pre>
          </div>

          {/* 푸터 — 요청 표시 */}
          <div className={`${t.bg} px-2 py-1 text-[10px] font-mono ${t.text} border-t ${t.border}`}>
            {data.request}
          </div>
          {data.ctx && (
            <div className="bg-slate-100 px-2 py-1 text-[10px] font-mono text-slate-600 border-t border-slate-200">
              {data.ctx}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // RouteTree — 좌측 하단: 라우트 트리 다이어그램
    //   kind 별 색상
    //     router    → indigo (BrowserRouter)
    //     routes    → sky    (Routes 컨테이너)
    //     route     → amber  (Route 정의)
    //     component → emerald(매칭된 컴포넌트)
    //     outlet    → fuchsia(Outlet 자리)
    // ─────────────────────────────────────────────────────
    function RouteTree({ nodes }) {
      const kindMap = {
        router:    { bg: 'bg-indigo-100',  text: 'text-indigo-800',  border: 'border-indigo-300',  tag: 'router'  },
        routes:    { bg: 'bg-sky-100',     text: 'text-sky-800',     border: 'border-sky-300',     tag: 'routes'  },
        route:     { bg: 'bg-amber-50',    text: 'text-amber-800',   border: 'border-amber-300',   tag: 'route'   },
        component: { bg: 'bg-emerald-50',  text: 'text-emerald-800', border: 'border-emerald-300', tag: 'comp'    },
        outlet:    { bg: 'bg-fuchsia-50',  text: 'text-fuchsia-800', border: 'border-fuchsia-300', tag: 'outlet'  },
      };
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            라우트 트리
          </div>
          <div className="p-2.5 space-y-1">
            {nodes.map((n) => {
              const c = kindMap[n.kind] || kindMap.route;
              return (
                <div
                  key={n.id}
                  className={`flex items-center gap-1.5 ${n.active ? 'bg-indigo-50 -mx-2 px-2 py-1 rounded border-l-2 border-indigo-500' : ''}`}
                  style={{ marginLeft: `${n.depth * 12}px` }}
                >
                  <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded ${c.bg} ${c.text} border ${c.border} font-bold uppercase tracking-wide flex-shrink-0`}>
                    {c.tag}
                  </span>
                  <span className={`text-[11px] font-mono leading-tight ${n.active ? 'text-indigo-900 font-bold' : 'text-slate-700'}`}>
                    {n.label}
                  </span>
                  {n.active && <span className="ml-auto text-[9px] text-indigo-600 font-bold">⬅ active</span>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 변환 흐름 화살표 (수직)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-indigo-600 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-indigo-400 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : 브라우저 mock (주소창 + 콘텐츠)
    //   ↓ URL 매칭
    //   하단 : 라우트 트리 다이어그램
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🌐 URL → 라우터 매칭 → 컴포넌트 렌더</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {/* 1) 브라우저 mock */}
            <div>
              <div className="text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">{step.browserLabel}</div>
              <BrowserMock browser={step.browser} />
            </div>

            <FlowArrow label="React Router 매칭" />

            {/* 2) 라우트 트리 */}
            <RouteTree nodes={step.tree} />
          </div>

          {/* 핵심 포인트 박스 */}
          <div className="mt-3 bg-indigo-50 border-l-4 border-indigo-400 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-indigo-600 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-indigo-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-indigo-400"></span>router
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-400"></span>routes
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-400"></span>route
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-400"></span>component
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-fuchsia-400"></span>outlet
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   파일명 탭 + 윈도우 dot + 라인 번호 + 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-indigo-500/15 border-l-2 border-indigo-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="./index.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter V-1-3</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-indigo-600 text-white flex items-center justify-center rounded-full font-bold text-sm">V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. React 실전 &gt; Chapter 1. 라우팅</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">V-1-3. React Router — 클라이언트 사이드 라우팅</h1>
                  <p className="text-sm text-slate-500 mt-0.5">URL 변경 시 서버 요청 없이 JS 가 컴포넌트를 갈아끼우는 5단계</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-indigo-50 border-2 border-indigo-300 rounded-xl p-3 text-sm text-indigo-900">
                💡 정리: <strong>BrowserRouter</strong> 로 감싸고, <strong>Routes/Route</strong> 로 URL 을 매핑하고, <strong>useParams</strong> 로 동적 값을 읽고, <strong>Outlet</strong> 으로 공통 레이아웃을 공유한다. 이 4가지가 React Router 의 거의 전부. 다음(V-1-4)에서는 코드 스플리팅과 lazy loading 을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-indigo-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-indigo-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['BrowserRouter', 'Routes', 'Route', 'useParams', 'useNavigate', 'Link', 'NavLink', 'Outlet', 'SPA', 'History API'].map((kw) => (
                <span key={kw} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-medium border border-indigo-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-05-02-context-api.html" className="text-indigo-700 hover:text-indigo-900 font-medium">&larr; V-1-2 Context API</a>
              <a href="./chapter-05-04-code-splitting.html" className="text-indigo-700 hover:text-indigo-900 font-medium">V-1-4 Code Splitting &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
