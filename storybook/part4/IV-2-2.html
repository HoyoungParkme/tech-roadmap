  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

<body>
  <div id="root"></div>
  <!--
    IV-2-2. Doc Block — 문서 조립 블록
    학습 목표: Autodocs가 내부적으로 쌓아 올리는 Doc Block(Meta·Title·Canvas·Story·
              Controls·ArgTypes·Source·Primary)을 직접 골라 재배치해 커스텀 MDX 문서를
              조립하는 법을 5단계로 이해한다.
    핵심 비유: "레고 블록" — Autodocs는 완제품, Doc Block은 낱개 블록. 필요한 블록만
              골라 내 문서 페이지를 손으로 쌓는다.
    패턴: fastapi v1 — 좌(LiveDataPane: 블록이 레고처럼 조립되는 문서 페이지)
                     / 우(VSCode CodeViewer: javascript / markdown)
    브랜드: Storybook pink (#FF4785 / dark #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 블록 메타 — 각 Doc Block의 아이콘 · 색 · 한 줄 역할
    //   preview: LiveDataPane에서 그릴 미니 미리보기 종류
    // ─────────────────────────────────────────────────────
    const BLOCK_META = {
      Meta:        { icon: '🔗', role: '문서-스토리 연결 (화면엔 안 보임)',   preview: 'meta',    tone: 'slate' },
      Title:       { icon: '🏷️', role: '문서 제목 (기본: 스토리 title)',     preview: 'title',   tone: 'pink'  },
      Subtitle:    { icon: '✏️', role: '제목 아래 한 줄 부제',                preview: 'subtitle',tone: 'pink'  },
      Description: { icon: '📝', role: 'JSDoc 주석에서 뽑은 설명',            preview: 'desc',    tone: 'slate' },
      Primary:     { icon: '⭐', role: '대표 스토리 크게 미리보기',           preview: 'story',   tone: 'pink'  },
      Canvas:      { icon: '🖼️', role: '툴바 달린 스토리 렌더 액자',          preview: 'canvas',  tone: 'pink'  },
      Story:       { icon: '▶️', role: '단일 스토리만 렌더 (툴바 없음)',       preview: 'story',   tone: 'pink'  },
      Controls:    { icon: '🎛️', role: 'props 조작 리모컨 표',               preview: 'controls',tone: 'emerald'},
      ArgTypes:    { icon: '📋', role: 'props 정의(타입·기본값) 표',          preview: 'argtypes',tone: 'emerald'},
      Source:      { icon: '💻', role: '스토리의 코드 스니펫',                preview: 'source',  tone: 'amber' },
    };

    const TONE = {
      pink:    'border-pink-200 bg-pink-50',
      emerald: 'border-emerald-200 bg-emerald-50',
      amber:   'border-amber-200 bg-amber-50',
      slate:   'border-slate-200 bg-slate-50',
    };

    // ─────────────────────────────────────────────────────
    // 단계별 데이터
    //   mode: 'auto'(Autodocs 자동 조립) | 'custom'(MDX 손조립)
    //   blocks: [{ name, note, hl }] — 문서에 쌓인 블록 스택
    //   hl: 이번 단계에서 새로 들어오거나 강조할 블록
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. Autodocs는 사실 블록을 자동으로 쌓은 완제품이다',
        desc: 'tags: [autodocs] 한 줄이면 문서 페이지가 공짜로 생기지만, 그 안을 열어 보면 Title·Subtitle·Description·Primary·Controls·Stories 라는 낱개 블록이 정해진 순서로 쌓여 있다. 즉 Autodocs는 "레고 완제품"이고, Doc Block은 그 완제품을 이루는 "낱개 블록"이다. 이 골격을 알아야 마음에 안 드는 부분만 떼어내 손볼 수 있다. 지금은 순서·구성을 우리가 못 고른다.',
        mode: 'auto',
        pageTitle: 'Atoms / Button — Docs (자동)',
        blocks: [
          { name: 'Title',       note: 'Atoms/Button', hl: true },
          { name: 'Subtitle',    note: '결제·폼 공용 버튼' },
          { name: 'Description',  note: 'JSDoc → 설명' },
          { name: 'Primary',      note: '대표 스토리' },
          { name: 'Controls',     note: 'props 리모컨' },
          { name: 'Canvas',       note: '나머지 스토리들' },
        ],
        code: {
          lang: 'javascript',
          filename: 'Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            "  tags: ['autodocs'],   // => 이 한 줄이 문서 페이지를 자동 생성",
            '};',
            'export default meta;',
            '',
            '// Autodocs가 내부적으로 쌓는 블록 순서 (개념도):',
            '//   Title       => 제목',
            '//   Subtitle    => 부제',
            '//   Description => 컴포넌트 설명(JSDoc)',
            '//   Primary     => 대표 스토리 미리보기',
            '//   Controls    => props 조작 표',
            '//   Stories     => 나머지 스토리 목록',
            '//',
            '// => 편하지만 순서/구성을 우리가 못 고른다',
            '// => "여기에 마이그레이션 가이드를 넣고 싶다" 같은 요구는 불가',
          ],
          highlight: [7, 11, 12, 13, 14, 15, 16, 17],
        },
      },
      {
        title: 'Step 2. MDX 문서를 열고 블록을 import + Meta로 스토리에 연결',
        desc: '커스텀 문서는 .mdx 파일에서 시작한다. @storybook/blocks 에서 원하는 블록을 import 하고, 맨 위에 Meta 블록을 두어 "이 문서는 어떤 스토리 파일과 짝인가"를 of 로 못 박는다. Meta는 화면에 아무것도 그리지 않는 연결 전용 블록이라, 빠뜨리면 다른 블록들이 참조할 대상을 잃는다. import 경로는 반드시 @storybook/blocks — @storybook/addon-docs 나 react 하위에서 찾으면 실무에서 흔히 깨진다.',
        mode: 'custom',
        pageTitle: 'Button.mdx (직접 조립 시작)',
        blocks: [
          { name: 'Meta',     note: 'of={ButtonStories}', hl: true },
          { name: 'Title',    note: 'Button', hl: true },
          { name: 'Subtitle', note: '디자인 시스템 기본 버튼', hl: true },
        ],
        code: {
          lang: 'markdown',
          filename: 'Button.mdx',
          lines: [
            '{/* 블록은 반드시 @storybook/blocks 에서 가져온다 */}',
            "import { Meta, Title, Subtitle } from '@storybook/blocks';",
            "import * as ButtonStories from './Button.stories';",
            '',
            '{/* Meta: 이 문서 <-> 스토리 파일을 of 로 연결 (화면엔 안 보임) */}',
            '<Meta of={ButtonStories} />',
            '',
            '<Title>Button</Title>',
            '<Subtitle>디자인 시스템 기본 버튼</Subtitle>',
            '',
            '{/* => Meta 를 빠뜨리면 아래 블록들이 참조 대상을 잃어 에러 */}',
            '{/* => import 를 addon-docs 등에서 하면 흔히 깨짐 */}',
          ],
          highlight: [1, 2, 3, 5, 6, 8, 9],
        },
      },
      {
        title: 'Step 3. 필요한 블록만 골라 재배치 — Canvas · Controls · Source',
        desc: '이제 자유롭게 순서를 짠다. 설명 다음에 Canvas(툴바 달린 렌더 액자)로 대표 모습을 보여주고, Controls(props 리모컨)로 직접 조작하게 하고, Source로 복붙용 코드를 붙인다. Autodocs와 달리 "설명 → 실사용 예 → 조작 → 코드" 같은 우리 팀의 읽기 흐름을 만들 수 있다. Canvas는 Story 를 감싸 확대·복사·배경 전환 툴바를 얹은 것이고, Source 는 그 스토리의 코드만 떼어 보여준다.',
        mode: 'custom',
        pageTitle: 'Button.mdx (블록 재배치)',
        blocks: [
          { name: 'Meta',        note: 'of={ButtonStories}' },
          { name: 'Title',       note: 'Button' },
          { name: 'Description',  note: '언제 쓰나' },
          { name: 'Canvas',       note: 'of={Primary}', hl: true },
          { name: 'Controls',     note: 'of={Primary}', hl: true },
          { name: 'Source',       note: 'of={Primary}', hl: true },
        ],
        code: {
          lang: 'markdown',
          filename: 'Button.mdx',
          lines: [
            "import { Meta, Title, Description, Canvas, Controls, Source }",
            "  from '@storybook/blocks';",
            "import * as ButtonStories from './Button.stories';",
            '',
            '<Meta of={ButtonStories} />',
            '<Title>Button</Title>',
            '',
            '{/* 우리 팀 읽기 흐름: 설명 -> 실사용 예 -> 조작 -> 코드 */}',
            '<Description of={ButtonStories} />',
            '',
            '<Canvas of={ButtonStories.Primary} />',
            '<Controls of={ButtonStories.Primary} />',
            '<Source of={ButtonStories.Primary} />',
            '',
            '{/* => Canvas = Story + 툴바(확대/복사/배경) */}',
            '{/* => Source = 그 스토리의 코드 스니펫만 */}',
          ],
          highlight: [8, 9, 11, 12, 13],
        },
      },
      {
        title: 'Step 4. of={} 참조 — 어떤 스토리·메타를 가리킬지 못 박기',
        desc: '모든 블록의 핵심은 of prop 이다. Canvas·Controls·Source 는 of 로 "어느 스토리"를, Description·ArgTypes 는 of 로 "어느 컴포넌트/메타"를 가리킨다. of 를 빠뜨리면 "블록을 어디에 연결할지 모르겠다"는 런타임 에러가 뜨는데, 실무에서 커스텀 MDX가 백지로 뜨는 원인 1위가 바로 이 of 누락과 import 경로 오타다. 스토리 하나를 콕 집을 땐 of={Stories.Primary}, 파일 전체 메타를 가리킬 땐 of={Stories} 로 대상 범위가 다르다.',
        mode: 'custom',
        pageTitle: 'Button.mdx (of 참조 연결)',
        blocks: [
          { name: 'Meta',     note: 'of={ButtonStories}', hl: true },
          { name: 'Canvas',   note: 'of={Primary}', hl: true },
          { name: 'ArgTypes', note: 'of={Button}', hl: true },
          { name: 'Controls', note: 'of={Primary}', hl: true },
        ],
        code: {
          lang: 'javascript',
          filename: 'of-reference.notes.ts',
          lines: [
            '// of prop = "이 블록을 무엇에 연결할까"',
            '',
            '// 1) 스토리 하나를 콕 집기 => 스토리 객체를 넘김',
            '//    <Canvas   of={ButtonStories.Primary} />',
            '//    <Controls of={ButtonStories.Primary} />',
            '//    <Source   of={ButtonStories.Primary} />',
            '',
            '// 2) 파일 전체/컴포넌트를 가리키기 => 메타를 넘김',
            '//    <Description of={ButtonStories} />',
            '//    <ArgTypes    of={ButtonStories} />',
            '',
            '// 흔한 함정 (커스텀 MDX가 백지로 뜨는 원인 1위)',
            '//   X of 누락      => "Story not found / of prop 필요" 에러',
            "//   X import 경로  => '@storybook/blocks' 아닌 곳에서 가져옴",
            '//   X of={Primary} 를 문자열 "Primary" 로 착각',
            '//',
            '// => of 는 문자열이 아니라 import 한 "객체"를 넘긴다',
          ],
          highlight: [3, 4, 5, 6, 8, 9, 10, 13, 14, 15],
        },
      },
      {
        title: 'Step 5. 디자인 시스템 문서 페이지 완성 — 과한 커스텀은 독',
        desc: '블록을 조합하면 표지·사용 지침·변형 갤러리·API 표·코드까지 갖춘 디자인 시스템 문서 한 장이 완성된다. 여기서 판단이 필요하다. Autodocs 기본형으로 충분한 90%의 컴포넌트는 손대지 말고, MDX 커스텀은 랜딩·가이드처럼 "설명이 실제로 필요한" 페이지에만 쓴다. 블록을 지나치게 잘게 쪼개 손으로 다 배치하면, 컴포넌트 API가 바뀔 때마다 문서를 수동으로 고쳐야 하는 유지보수 부담이 되레 커진다. 자동이 줄 수 있는 건 자동에 맡기는 게 실무 최적점이다.',
        mode: 'custom',
        pageTitle: 'Button.mdx — 디자인 시스템 문서 (완성)',
        blocks: [
          { name: 'Meta',        note: 'of={ButtonStories}' },
          { name: 'Title',       note: 'Button' },
          { name: 'Subtitle',    note: '디자인 시스템 기본 버튼' },
          { name: 'Description',  note: '사용 지침' },
          { name: 'Primary',      note: '대표 예시', hl: true },
          { name: 'Canvas',       note: '변형 갤러리', hl: true },
          { name: 'ArgTypes',     note: 'props API 표', hl: true },
          { name: 'Source',       note: '복붙용 코드' },
        ],
        code: {
          lang: 'markdown',
          filename: 'Button.mdx',
          lines: [
            "import { Meta, Title, Subtitle, Description,",
            "         Primary, Canvas, ArgTypes, Source } from '@storybook/blocks';",
            "import * as ButtonStories from './Button.stories';",
            '',
            '<Meta of={ButtonStories} />',
            '<Title>Button</Title>',
            '<Subtitle>디자인 시스템 기본 버튼</Subtitle>',
            '<Description of={ButtonStories} />',
            '',
            '## 대표 예시',
            '<Primary />',
            '',
            '## 변형 갤러리',
            '<Canvas of={ButtonStories.AllVariants} />',
            '',
            '## Props',
            '<ArgTypes of={ButtonStories} />',
            '',
            '{/* 판단: 90%는 Autodocs 기본형으로 충분 */}',
            '{/* => 랜딩/가이드처럼 설명이 필요한 페이지에만 커스텀 */}',
            '{/* => 과하게 쪼개면 API 변경 때마다 수동 유지보수 폭증 */}',
          ],
          highlight: [10, 11, 13, 14, 16, 17, 19, 20, 21],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // LiveDataPane — Doc Block이 레고처럼 문서 페이지로 조립되는 모습
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step, stepIdx }) {
      const { mode, blocks, pageTitle } = step;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🧱 Doc Block 레고 조립 — 문서 페이지</h2>
            <span className={`text-[10px] font-mono px-2 py-0.5 rounded ${mode === 'auto' ? 'bg-amber-100 text-amber-700' : 'bg-pink-100 text-pink-700'}`}>
              {mode === 'auto' ? 'Autodocs 자동' : 'MDX 손조립'}
            </span>
          </div>

          {/* 브라우저 프레임 안의 문서 페이지 */}
          <div className="bg-slate-100 rounded-lg p-3 min-h-[360px]">
            <div className="bg-white rounded-md border border-slate-200 shadow-inner overflow-hidden">
              <div className="bg-slate-50 px-3 py-1.5 border-b border-slate-200 flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-red-400"></span>
                <span className="w-2 h-2 rounded-full bg-yellow-400"></span>
                <span className="w-2 h-2 rounded-full bg-green-400"></span>
                <span className="ml-2 text-[10px] text-slate-400 font-mono truncate">{pageTitle}</span>
              </div>
              <div className="p-3 flex flex-col gap-2 max-h-[300px] overflow-auto">
                {blocks.map((b, i) => (
                  <BlockCard key={`${stepIdx}-${b.name}-${i}`} block={b} delay={i * 60} />
                ))}
              </div>
            </div>
          </div>

          {/* 메트릭 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="쌓인 블록" value={`${blocks.length} 개`} good={true} />
            <Metric label="조립 방식" value={mode === 'auto' ? '자동' : '수동'} good={mode === 'auto'} />
            <Metric label="순서 제어" value={mode === 'auto' ? '✗ 고정' : '✓ 자유'} good={mode !== 'auto'} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-300"></span>렌더/제목</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-300"></span>props 표</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-amber-300"></span>코드</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    // 블록 한 개 카드 (아이콘 + 이름 + 역할 + 미니 미리보기)
    function BlockCard({ block, delay }) {
      const meta = BLOCK_META[block.name];
      const toneCls = TONE[meta.tone];
      return (
        <div
          className={`block-in rounded-md border ${toneCls} ${block.hl ? 'ring-2 ring-pink-400' : ''} p-2`}
          style={{ animationDelay: `${delay}ms` }}
        >
          <div className="flex items-center gap-2">
            <span className="text-base leading-none">{meta.icon}</span>
            <span className="text-xs font-bold text-slate-700 font-mono">{block.name}</span>
            {block.note && (
              <span className="ml-auto text-[9px] text-slate-500 font-mono truncate max-w-[45%]">{block.note}</span>
            )}
          </div>
          <div className="text-[9px] text-slate-500 mt-0.5">{meta.role}</div>
          <div className="mt-1.5"><BlockPreview kind={meta.preview} /></div>
        </div>
      );
    }

    // 블록 종류별 미니 미리보기
    function BlockPreview({ kind }) {
      if (kind === 'meta') {
        return <div className="text-[9px] font-mono text-slate-400 border border-dashed border-slate-300 rounded px-2 py-1 text-center">연결 전용 · 화면 출력 없음</div>;
      }
      if (kind === 'title') {
        return <div className="h-4 w-24 rounded bg-slate-300"></div>;
      }
      if (kind === 'subtitle') {
        return <div className="h-2.5 w-32 rounded bg-slate-200"></div>;
      }
      if (kind === 'desc') {
        return (
          <div className="flex flex-col gap-1">
            <div className="h-2 w-full rounded bg-slate-200"></div>
            <div className="h-2 w-4/5 rounded bg-slate-200"></div>
          </div>
        );
      }
      if (kind === 'story') {
        return (
          <div className="flex items-center justify-center py-1.5">
            <span className="px-3 py-1 rounded text-[10px] font-medium text-white" style={{ backgroundColor: '#FF4785' }}>Save</span>
          </div>
        );
      }
      if (kind === 'canvas') {
        return (
          <div className="rounded border border-slate-200 bg-slate-50">
            <div className="flex items-center gap-1 px-1.5 py-0.5 border-b border-slate-200">
              <span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
              <span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
              <span className="ml-auto text-[8px] text-slate-400 font-mono">canvas</span>
            </div>
            <div className="flex items-center justify-center py-1.5">
              <span className="px-3 py-1 rounded text-[10px] font-medium text-white" style={{ backgroundColor: '#FF4785' }}>Save</span>
            </div>
          </div>
        );
      }
      if (kind === 'controls' || kind === 'argtypes') {
        return (
          <div className="rounded border border-emerald-200 overflow-hidden text-[8px] font-mono">
            <div className="grid grid-cols-3 bg-emerald-100 text-emerald-700">
              <span className="px-1.5 py-0.5">prop</span>
              <span className="px-1.5 py-0.5">type</span>
              <span className="px-1.5 py-0.5">{kind === 'controls' ? 'control' : 'default'}</span>
            </div>
            <div className="grid grid-cols-3 text-slate-500">
              <span className="px-1.5 py-0.5 border-t border-emerald-100">variant</span>
              <span className="px-1.5 py-0.5 border-t border-emerald-100">enum</span>
              <span className="px-1.5 py-0.5 border-t border-emerald-100">{kind === 'controls' ? '▽ select' : 'primary'}</span>
            </div>
          </div>
        );
      }
      if (kind === 'source') {
        return (
          <div className="rounded bg-slate-800 px-2 py-1 flex flex-col gap-0.5">
            <div className="h-1.5 w-3/4 rounded bg-pink-400/70"></div>
            <div className="h-1.5 w-1/2 rounded bg-slate-500"></div>
          </div>
        );
      }
      return null;
    }

    function Metric({ label, value, good }) {
      const tone = good ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-amber-50 border-amber-300 text-amber-700';
      return (
        <div className={`p-2 rounded border-2 ${tone}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-sm font-bold tabular-nums">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js atom-one-dark
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. 자동 문서화 &gt; IV-2-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Doc Block — 문서 조립 블록</h1>
                  <p className="text-sm text-slate-500 mt-0.5">문서 페이지를 구성하는 재사용 블록으로 커스텀 문서 만들기</p>
                </div>
              </div>
              {/* 진행바 */}
              <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-300" style={{ width: `${progress}%`, backgroundColor: '#FF4785' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 Part IV 완주 — 다음 <strong>Part V</strong>에서는 만든 문서·컴포넌트를 <strong>시각 회귀 테스트(Chromatic)</strong>로 지켜내는 법을 다룬다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="text-pink-700 hover:text-pink-900 font-medium">Part V · V-1-1 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
