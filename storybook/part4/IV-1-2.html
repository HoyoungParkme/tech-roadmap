<body>
  <div id="root"></div>
  <!--
    IV-1-2. MDX — 마크다운 + 스토리
    학습 목표: .mdx 한 파일에 마크다운 설명과 살아있는 예제(스토리)를 함께 담아
              autodocs 골격을 넘어 문서를 직접 저술하는 법을 6단계로 이해한다.
    핵심 비유: "설명서와 실물 샘플을 한 페이지에 붙인 카탈로그"
    패턴: fastapi v1 — 좌(LiveDataPane: .mdx가 한 문서로 조립되는 애니메이션) / 우(VSCode CodeViewer)
    브랜드: Storybook pink (#FF4785 / dark #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   scene: 'intro' | 'meta' | 'markdown' | 'embed' | 'controls' | 'pitfall'
    //   active: 렌더된 Docs 페이지에서 켜진(조립된) 블록 집합
    //   propsRows: Controls 블록이 켜지면 노출되는 props 표 행
    // ─────────────────────────────────────────────────────
    const PROPS_ROWS = [
      { name: 'variant', type: 'primary | danger', desc: '버튼의 강조 톤', def: 'primary' },
      { name: 'children', type: 'string', desc: '버튼 라벨', def: '—' },
      { name: 'disabled', type: 'boolean', desc: '비활성 여부', def: 'false' },
    ];

    const STEPS = [
      {
        title: 'Step 1. MDX = Markdown + JSX — 설명과 예제를 한 파일에',
        desc: 'Autodocs가 정해진 골격을 자동으로 찍어낸다면, MDX는 그 골격을 벗어나 문서를 직접 저술하고 싶을 때 쓴다. MDX는 이름 그대로 Markdown에 JSX를 섞은 형식이라, 마크다운으로 설명을 쓰다가 중간에 컴포넌트나 스토리를 그대로 심을 수 있다. 왜 필요한가 하면, 컴포넌트 API 표만으로는 "언제·왜 쓰는가" 같은 서사를 담을 수 없기 때문이다. 가이드, 튜토리얼, 디자인 원칙처럼 사람이 읽는 문서는 자유로운 편집이 필요하다. 확장자는 .mdx이며, 설명과 살아있는 예제를 한 파일에 둔다는 것이 핵심이다.',
        scene: 'intro',
        active: ['heading', 'prose'],
        propsRows: [],
        metrics: { source: 'MDX', freedom: '자유 저술', sync: '수동 참조' },
        code: {
          lang: 'markdown',
          filename: 'src/components/Button.mdx',
          lines: [
            "import { Meta } from '@storybook/blocks';",
            "import * as ButtonStories from './Button.stories';",
            '',
            '{/* MDX = 마크다운 + JSX 를 한 파일에 */}',
            '',
            '# Button',
            '',
            '주요 행동을 유도하는 기본 버튼.',
            '마크다운으로 설명을 쓰다가, 언제든 컴포넌트를 심을 수 있다.',
            '',
            '{/* => 아래 단계에서 Meta, Canvas, Controls 블록을 붙여 나간다 */}',
          ],
          highlight: [1, 2, 6, 8, 9],
        },
      },
      {
        title: 'Step 2. Meta 블록 — CSF 스토리 파일을 단일 원천으로 참조',
        desc: 'MDX 문서는 스토리를 새로 만들지 않고 이미 있는 CSF 스토리 파일을 참조한다. 파일 맨 위에서 스토리 모듈을 import한 뒤 Meta 블록의 of 속성에 넘기면, 이 문서가 어떤 컴포넌트의 문서인지 Storybook이 알고 사이드바에 끼워 넣는다. 왜 참조 방식인가 하면, 예제 코드를 문서에 복붙하면 곧 실제 컴포넌트와 어긋나기 때문이다. 스토리를 단일 원천으로 두고 문서는 그것을 가리키기만 하면, 코드가 바뀌어도 예제가 자동으로 최신을 따라간다. Meta는 문서와 스토리를 잇는 다리다.',
        scene: 'meta',
        active: ['meta', 'heading', 'prose'],
        propsRows: [],
        metrics: { source: 'MDX+CSF', freedom: '자유 저술', sync: '수동 참조' },
        code: {
          lang: 'javascript',
          filename: 'src/components/Button.stories.jsx',
          lines: [
            '// MDX 가 참조하는 단일 원천 — 스토리는 여기 한 곳에만 둔다',
            "import { Button } from './Button';",
            '',
            'export default {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            '};',
            '',
            '// 각 스토리 = MDX 의 Canvas 에 심을 살아있는 예제',
            "export const Primary = { args: { variant: 'primary', children: 'Save' } };",
            "export const Danger  = { args: { variant: 'danger',  children: 'Delete' } };",
            '',
            '// => MDX 에서 Meta 블록의 of 로 이 파일을 가리킨다',
            '// => 예제를 문서에 복붙하지 않으므로 코드와 문서가 어긋나지 않는다',
          ],
          highlight: [4, 5, 6, 9, 10, 11],
        },
      },
      {
        title: 'Step 3. 자유 마크다운 — 가이드·원칙 같은 서사를 담는다',
        desc: '여기서부터가 MDX의 진짜 이유다. 제목, 문단, 리스트, 표, 인용까지 마크다운 문법 그대로 원하는 만큼 설명을 쓴다. autodocs가 만들지 못하는 "이 컴포넌트를 언제 쓰고 언제 쓰지 말아야 하는지", 접근성 주의사항, 디자인 원칙 같은 서사를 자유롭게 담을 수 있다. 왜 중요한가 하면, 신규 입사자가 컴포넌트의 의도를 문서 한 장으로 파악하게 해 주기 때문이다. 사람이 읽는 가이드와 기계가 뽑아 주는 API 표가 한곳에 모인다.',
        scene: 'markdown',
        active: ['meta', 'heading', 'prose', 'list'],
        propsRows: [],
        metrics: { source: 'MDX+CSF', freedom: '자유 저술', sync: '수동 참조' },
        code: {
          lang: 'markdown',
          filename: 'src/components/Button.mdx',
          lines: [
            '{/* Meta 로 스토리에 바인딩 (Step 2) */}',
            '',
            '# Button',
            '',
            '## 언제 쓰나',
            '- 저장, 제출처럼 명확한 액션에 사용한다',
            '- 한 화면의 primary 버튼은 하나로 제한한다',
            '',
            '## 언제 쓰지 않나',
            '- 페이지 이동은 버튼이 아니라 링크를 쓴다',
            '',
            '> 접근성: 아이콘만 있는 버튼은 aria-label 을 반드시 넣는다',
          ],
          highlight: [5, 6, 7, 9, 10, 12],
        },
      },
      {
        title: 'Step 4. Canvas / Story 임베드 — 살아있는 예제를 문장 사이에',
        desc: '설명 중간에 살아있는 예제를 심는 순간 MDX가 빛난다. Canvas 블록에 스토리를 넘기면 그 스토리가 실제로 렌더되어 문서 안에서 바로 동작한다. 왜 스크린샷이 아니라 실물인가 하면, 이미지 문서는 코드가 바뀌면 즉시 낡지만 임베드된 스토리는 항상 현재 컴포넌트를 보여주기 때문이다. Story 블록으로 특정 스토리 하나만, Canvas로 소스 토글이 달린 상자째 심을 수 있다. 문단 사이사이에 예제를 배치해 "읽으면서 만지는" 문서를 만든다.',
        scene: 'embed',
        active: ['meta', 'heading', 'prose', 'list', 'canvas'],
        propsRows: [],
        metrics: { source: 'MDX+CSF', freedom: '자유 저술', sync: '수동 참조' },
        code: {
          lang: 'markdown',
          filename: 'src/components/Button.mdx',
          lines: [
            "import { Canvas, Story } from '@storybook/blocks';",
            '',
            '## 기본 사용',
            '',
            '<Canvas of={ButtonStories.Primary} />',
            '',
            '위 예제는 스크린샷이 아니라 실제로 렌더된 스토리다.',
            '컴포넌트 코드가 바뀌면 이 예제도 자동으로 최신이 된다.',
            '',
            '## 위험 액션',
            '',
            '<Story of={ButtonStories.Danger} />',
          ],
          highlight: [1, 5, 12],
        },
      },
      {
        title: 'Step 5. Controls 블록 — autodocs(자동) vs MDX(수동·자유)',
        desc: 'Controls 블록을 넣으면 argTypes에서 뽑은 props 표와 값을 바꿔 보는 입력기가 문서의 원하는 위치에 들어간다. autodocs가 이 표를 페이지 맨 아래 정해진 자리에 강제로 두는 것과 달리, MDX는 설명 흐름에 맞춰 어디든 배치할 수 있다. 정리하면 autodocs는 "자동·고정 골격", MDX는 "수동·자유 편집"이며 둘은 함께 쓸 수 있다. 왜 굳이 수동인가 하면, 대부분의 원자 컴포넌트는 autodocs로 충분하지만 랜딩 가이드나 디자인 원칙 문서는 자유 편집이 필요하기 때문이다. 자주 쓰는 독 블록은 Meta, Canvas, Story, Controls, ArgTypes, Source 등이 있다.',
        scene: 'controls',
        active: ['meta', 'heading', 'prose', 'list', 'canvas', 'controls'],
        propsRows: PROPS_ROWS,
        metrics: { source: 'MDX+CSF', freedom: '자유 저술', sync: '수동 참조' },
        code: {
          lang: 'markdown',
          filename: 'src/components/Button.mdx',
          lines: [
            "import { Controls } from '@storybook/blocks';",
            '',
            '## Props',
            '',
            '아래 표에서 값을 바꾸면 위 예제가 즉시 다시 그려진다.',
            '',
            '<Controls of={ButtonStories.Primary} />',
            '',
            '{/* autodocs 는 이 표를 맨 아래 고정 자리에 두지만  */}',
            '{/* MDX 는 설명 흐름에 맞춰 원하는 위치에 배치한다    */}',
            '{/* => 자동(autodocs) 과 수동(MDX) 은 함께 쓸 수 있다 */}',
          ],
          highlight: [1, 7, 9, 10],
        },
      },
      {
        title: 'Step 6. 실무 함정 — CSF 동기화·과한 커스텀·빌드 설정',
        desc: 'MDX에도 함정이 있다. 첫째, 예제를 문서에 직접 써 넣으면 CSF 스토리와 동기화가 깨지므로 반드시 of로 스토리를 참조한다. 둘째, 화려한 커스텀 컴포넌트를 문서에 남발하면 문서 자체가 유지보수 부담이 되니, 꼭 필요한 서사에만 MDX를 쓰고 나머지는 autodocs에 맡긴다. 셋째, MDX는 빌드 설정(.storybook/main의 stories 글롭과 addon-docs)이 맞아야 인식되므로 .mdx 경로를 반드시 포함시켜야 한다. 이렇게 절제해서 쓰면 API 표는 자동으로, 서사는 손으로 쓴 최상의 문서 한 장이 완성된다.',
        scene: 'pitfall',
        active: ['meta', 'heading', 'prose', 'list', 'canvas', 'controls', 'principle'],
        propsRows: PROPS_ROWS,
        metrics: { source: 'MDX+CSF', freedom: '자유 저술', sync: '주의' },
        code: {
          lang: 'javascript',
          filename: '.storybook/main.js',
          lines: [
            '// 함정 1) 예제를 문서에 직접 써 넣으면 CSF 와 동기화가 깨진다',
            '//   해결: 항상 Story of / Canvas of 로 스토리를 참조한다',
            '',
            '// 함정 2) 화려한 커스텀 남발 => 문서가 유지보수 부담이 된다',
            '//   해결: 서사에만 MDX, 원자 컴포넌트는 autodocs 에 맡긴다',
            '',
            '// 함정 3) 빌드 설정에 .mdx 경로가 없으면 문서가 인식되지 않는다',
            'export default {',
            '  stories: [',
            "    '../src/**/*.mdx',                        // => MDX 문서 포함 필수",
            "    '../src/**/*.stories.@(js|jsx|ts|tsx)',",
            '  ],',
            "  addons: ['@storybook/addon-docs'],",
            '};',
          ],
          highlight: [1, 2, 4, 5, 7, 10, 13],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Button variant 색상 매핑 (정적 Tailwind purge 안전)
    // ─────────────────────────────────────────────────────
    const BTN_STYLE = {
      primary: { bg: 'bg-pink-600', text: 'text-white', ring: 'ring-pink-300' },
      danger:  { bg: 'bg-red-600',  text: 'text-white', ring: 'ring-red-300' },
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — .mdx 한 파일이 렌더된 Docs 한 장으로 조립되는 과정
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const { scene, active, propsRows, metrics } = step;
      const has = (id) => active.includes(id);

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📝 Button.mdx — 마크다운 + 스토리가 한 문서로</h2>
            <span className="text-[10px] text-slate-400 font-mono">{scene}</span>
          </div>

          {/* Markdown + JSX 합류 표시 */}
          <div className="flex items-center gap-2 text-[10px] font-bold mb-2">
            <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600">Markdown 설명</span>
            <span className="text-pink-500">+</span>
            <span className="px-2 py-0.5 rounded bg-pink-100 text-pink-700">JSX 독 블록</span>
            <span className="text-slate-400">→</span>
            <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">렌더된 Docs</span>
          </div>

          {/* 문서 페이지 미리보기 */}
          <div className="bg-slate-50 rounded-lg p-4 min-h-[320px] flex flex-col gap-2">
            <MdxDocPreview has={has} propsRows={propsRows} />
          </div>

          {/* 메트릭 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="문서 원천" value={metrics.source} good={true} />
            <Metric label="편집 자유도" value={metrics.freedom} good={true} />
            <Metric label="CSF 동기화" value={metrics.sync} good={metrics.sync !== '주의'} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-500"></span>조립됨</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-300"></span>대기</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    // .mdx가 렌더된 Docs 페이지 — 블록이 단계별로 켜진다
    function MdxDocPreview({ has, propsRows }) {
      return (
        <div className="flex-1 flex flex-col gap-2">
          <div className="text-[11px] font-bold text-slate-600 mb-1">Atoms / Button — Docs (MDX)</div>

          {/* Meta 바인딩 배지 */}
          <DocBlock on={has('meta')} label="Meta — CSF 스토리에 바인딩">
            <div className="flex items-center gap-1.5 text-[10px] font-mono text-slate-500">
              <span className="px-1.5 py-0.5 rounded bg-slate-100">Button.mdx</span>
              <span className="text-pink-500">→ of →</span>
              <span className="px-1.5 py-0.5 rounded bg-pink-50 text-pink-700">Button.stories</span>
            </div>
          </DocBlock>

          {/* Heading */}
          <DocBlock on={has('heading')} label="Heading (마크다운 제목)">
            <div className="text-sm font-bold text-slate-800">Button</div>
          </DocBlock>

          {/* Prose */}
          <DocBlock on={has('prose')} label="Prose (자유 설명)">
            <div className="text-[11px] text-slate-500">주요 행동을 유도하는 기본 버튼. 언제 쓰고 언제 쓰지 말지 서술한다.</div>
          </DocBlock>

          {/* List (가이드) */}
          <DocBlock on={has('list')} label="List — 언제 쓰나 가이드">
            <ul className="text-[11px] text-slate-600 list-disc pl-4 space-y-0.5">
              <li>저장·제출처럼 명확한 액션에 사용</li>
              <li>한 화면의 primary 버튼은 하나로 제한</li>
            </ul>
          </DocBlock>

          {/* Canvas — 살아있는 스토리 */}
          <DocBlock on={has('canvas')} label="Canvas — 살아있는 스토리 임베드">
            <div className="flex gap-2">
              <BtnPreview label="Save" variant="primary" />
              <BtnPreview label="Delete" variant="danger" />
            </div>
          </DocBlock>

          {/* Controls — props 표 */}
          <DocBlock on={has('controls')} label="Controls — argTypes 로 만든 props 표">
            {propsRows.length === 0 ? (
              <div className="text-[11px] text-slate-400 italic">Controls 블록 미배치</div>
            ) : (
              <div className="grid grid-cols-[1fr_1.3fr] gap-x-2 gap-y-0.5 text-[10px]">
                <div className="font-bold text-slate-500">name</div>
                <div className="font-bold text-slate-500">type</div>
                {propsRows.map((r) => (
                  <React.Fragment key={r.name}>
                    <div className="font-mono text-pink-700">{r.name}</div>
                    <div className="font-mono text-slate-600">{r.type}</div>
                  </React.Fragment>
                ))}
              </div>
            )}
          </DocBlock>

          {/* Design 원칙 (커스텀 서술) */}
          <DocBlock on={has('principle')} label="Design 원칙 (커스텀 서술)">
            <div className="text-[11px] text-slate-600">서사는 손으로, API 표는 자동으로 — 둘을 한 페이지에.</div>
          </DocBlock>
        </div>
      );
    }

    // 조립 여부에 따라 켜지는 문서 블록 카드
    function DocBlock({ on, label, children }) {
      return (
        <div className={`rounded-lg border-2 p-2.5 transition-all ${on ? 'bg-white border-pink-300 shadow-sm' : 'bg-slate-100 border-slate-200 opacity-50'}`}>
          <div className="flex items-center gap-1.5 mb-1">
            <span className={`w-2 h-2 rounded-full ${on ? 'bg-pink-500' : 'bg-slate-300'}`}></span>
            <span className="text-[9px] font-bold uppercase tracking-wide text-slate-500">{label}</span>
          </div>
          {on ? children : <div className="text-[10px] text-slate-400 italic">아직 조립 전</div>}
        </div>
      );
    }

    // 버튼 미리보기 (Canvas 안의 살아있는 스토리)
    function BtnPreview({ label, variant }) {
      const sty = BTN_STYLE[variant];
      return (
        <button className={`px-3 py-1 rounded-md text-xs font-medium ${sty.bg} ${sty.text} hover:ring-2 ${sty.ring}`}>
          {label}
        </button>
      );
    }

    function Metric({ label, value, good }) {
      const tone = good ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-amber-50 border-amber-300 text-amber-700';
      return (
        <div className={`p-2 rounded border-2 ${tone}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-sm font-bold tabular-nums">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. 자동 문서화 &gt; IV-1-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">MDX — 마크다운 + 스토리</h1>
                  <p className="text-sm text-slate-500 mt-0.5">문서와 살아있는 예제를 한 파일에, 자유로운 문서 작성</p>
                </div>
              </div>
              {/* 진행바 */}
              <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-300" style={{ width: `${progress}%`, backgroundColor: '#FF4785' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(IV-2-1)에서는 <strong>JSDoc / TypeScript로 prop 설명을 자동 추출</strong>하여 argTypes를 손으로 채우지 않고도 표를 채우는 법을 다룬다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="./IV-2-1.html" className="text-pink-700 hover:text-pink-900 font-medium">IV-2-1 JSDoc 추출 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
