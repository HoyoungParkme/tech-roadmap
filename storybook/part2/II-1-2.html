    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    II-1-2. Actions — 이벤트 로그
    학습 목표: 컴포넌트가 발생시키는 이벤트(onClick/onChange/onSubmit)를 Actions 패널에
              인자와 함께 기록해, 앱을 띄우지 않고도 "이벤트가 진짜 나갔는지"를 눈으로 확인한다.
    핵심: fn() 스파이(@storybook/test) + argTypes action, 그리고 play 함수 연계 예고.
    패턴: fastapi v1 — 좌(LiveDataPane: 미리보기 + Actions 패널 애니메이션) / 우(VSCode CodeViewer, CSF)
    브랜드: Storybook pink (#FF4785 / dark #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   preview: 'button' | 'form' — 좌측 미리보기에 그릴 컴포넌트
    //   spyConnected: onClick 콜백이 Actions(스파이)에 연결됐는지
    //   verified: play 함수 assertion 통과 여부
    //   logs: Actions 패널에 순차 애니메이션으로 쌓일 이벤트 로그
    //         { name, args, note?, tag? }
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'STEP 1. 문제 — 이벤트가 진짜 발생했나?',
        desc: 'Button의 onClick 콜백이 실행됐는지 확인하려면 보통 앱 전체를 띄우고 결과 화면을 봐야 한다. 하지만 콜백이 상태를 바꾸지 않는 순수 이벤트라면 화면에 아무 흔적도 남지 않는다. 급한 마음에 console.log를 심으면 스토리마다 반복되고 코드가 지저분해진다. 그래서 Storybook은 콜백을 가로채 패널에 기록하는 Actions 애드온을 제공한다.',
        preview: 'button',
        spyConnected: false,
        verified: false,
        logs: [],
        code: {
          lang: 'javascript',
          filename: 'src/components/Button.stories.js',
          lines: [
            '// 아직 이벤트를 관측하지 못하는 스토리',
            "import { Button } from './Button';",
            '',
            'export default {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            '};',
            '',
            '// 클릭해도 콘솔에도 안 찍히고, 화면도 그대로.',
            'export const Primary = {',
            "  args: { label: '결제하기' },",
            '  // onClick 을 안 넘겼으니 콜백이 나가도 흔적이 없다',
            '};',
            '',
            '// 임시로 console.log 를 심으면?',
            'export const WithConsole = {',
            '  args: {',
            "    label: '결제하기',",
            "    onClick: () => console.log('clicked'),",
            '    // => 스토리마다 반복 + 코드 오염, 패널엔 안 남음',
            '  },',
            '};',
          ],
          highlight: [15, 16, 17, 18, 19, 20, 21],
        },
      },
      {
        title: 'STEP 2. argTypes로 액션 연결 — 클릭이 로그가 된다',
        desc: 'args에 fn() 스파이를 심거나 argTypes에서 onClick을 action으로 선언하면, 컴포넌트가 그 콜백을 호출하는 순간 Actions 패널에 이름과 인자가 자동으로 찍힌다. 앱을 띄우지 않아도 "이벤트가 나갔다"는 사실을 눈으로 확인할 수 있다. 액션 이름을 prop 이름과 똑같이 맞추면 로그만 봐도 어떤 핸들러가 불렸는지 바로 안다. 이것이 상호작용 디버깅의 출발점이다.',
        preview: 'button',
        spyConnected: true,
        verified: false,
        logs: [
          { name: 'onClick', args: '[ SyntheticEvent ]' },
        ],
        code: {
          lang: 'javascript',
          filename: 'src/components/Button.stories.js',
          lines: [
            "import { fn } from '@storybook/test';",
            "import { Button } from './Button';",
            '',
            'export default {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            '  // args 에 fn() 스파이 → 호출이 Actions 패널에 자동 로깅',
            '  args: { onClick: fn() },',
            '  argTypes: {',
            "    onClick: { action: 'onClick' }, // 액션 이름 = prop 이름",
            '  },',
            '};',
            '',
            'export const Primary = {',
            "  args: { label: '결제하기' },",
            '};',
            '',
            '// 버튼 클릭 → Actions 패널:',
            '//   => onClick: [ SyntheticEvent ]',
          ],
          highlight: [7, 8, 9, 10, 11, 18, 19],
        },
      },
      {
        title: 'STEP 3. fn() 스파이 — 호출을 감시한다',
        desc: '@storybook/test의 fn()은 콜백을 감싼 "스파이"다. 호출 여부, 호출 횟수, 넘어온 인자를 그대로 기록해 Actions 패널에 매 호출마다 한 줄씩 남긴다. 실제 핸들러 대신 이 목(mock)을 주입하는 것이 핵심이라, 진짜 API가 나가지 않으면서도 상호작용만 정확히 관측된다. 기록된 스파이는 다음 STEP의 play 함수에서 검증에 그대로 재사용된다.',
        preview: 'button',
        spyConnected: true,
        verified: false,
        logs: [
          { name: 'onClick', args: '[ SyntheticEvent ]', note: 'call #1' },
          { name: 'onClick', args: '[ SyntheticEvent ]', note: 'call #2' },
        ],
        code: {
          lang: 'javascript',
          filename: 'src/components/Button.stories.js',
          lines: [
            "import { fn } from '@storybook/test';",
            "import { Button } from './Button';",
            '',
            'export default {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            '  // fn() = 호출을 기록하는 스파이(mock)',
            '  args: { onClick: fn() },',
            '};',
            '',
            "export const Primary = { args: { label: '결제하기' } };",
            '',
            '// 클릭 2번 →',
            '//   => onClick: [ SyntheticEvent ]   (call #1)',
            '//   => onClick: [ SyntheticEvent ]   (call #2)',
            '// 스파이라서 호출 횟수/인자를 보존 → play 에서 재검증',
          ],
          highlight: [7, 8, 13, 14, 15, 16],
        },
      },
      {
        title: 'STEP 4. 이벤트 인자 확인 — 무엇이 넘어왔나',
        desc: 'onClick은 이벤트 객체 하나지만, onChange나 onSubmit 같은 콜백은 입력값이나 폼 데이터처럼 의미 있는 인자를 넘긴다. Actions 패널은 이 인자들을 펼쳐 직렬화해 보여줘서 "어떤 값이 어떤 순서로" 전달됐는지 즉시 디버깅할 수 있다. 입력 한 글자마다 onChange가 찍히고 제출 시 onSubmit이 객체를 통째로 남기므로, 데이터 흐름을 로그만 읽어도 재현할 수 있다. 화면 상태를 눈으로 좇지 않아도 되는 것이 큰 차이다.',
        preview: 'form',
        spyConnected: true,
        verified: false,
        logs: [
          { name: 'onChange', args: "[ 'a' ]" },
          { name: 'onChange', args: "[ 'ab' ]" },
          { name: 'onSubmit', args: "[ { email: 'ab', remember: true } ]" },
        ],
        code: {
          lang: 'javascript',
          filename: 'src/components/LoginForm.stories.js',
          lines: [
            "import { fn } from '@storybook/test';",
            "import { LoginForm } from './LoginForm';",
            '',
            'export default {',
            "  title: 'Forms/LoginForm',",
            '  component: LoginForm,',
            '  args: {',
            '    onChange: fn(),',
            '    onSubmit: fn(),',
            '  },',
            '};',
            '',
            'export const Typing = { args: {} };',
            '',
            "// 입력 'a' → 'ab' → 제출:",
            "//   => onChange: [ 'a' ]",
            "//   => onChange: [ 'ab' ]",
            "//   => onSubmit: [ { email: 'ab', remember: true } ]",
            '// 인자를 펼쳐 직렬화 → 무엇이 넘어왔는지 즉시 확인',
          ],
          highlight: [7, 8, 9, 10, 16, 17, 18],
        },
      },
      {
        title: 'STEP 5. play 함수 연계 + 실무 함정',
        desc: 'play 함수에서 userEvent로 클릭을 자동 실행하면 Actions에 로그가 저절로 쌓이고, 같은 스파이로 expect까지 이어져 "이벤트가 나갔다"를 자동 검증한다(다음 장에서 본격 해부). 함정 셋을 기억하자. 첫째, 실제 결제 핸들러 대신 반드시 fn() 목을 써야 진짜 요청이 나가지 않는다. 둘째, 액션 이름은 prop 이름과 일치시켜야 로그 혼선이 없다. 셋째, 리스트의 onScroll처럼 초당 수십 번 불리는 고빈도 콜백을 무분별하게 로깅하면 패널이 마비되니 걸러야 한다.',
        preview: 'button',
        spyConnected: true,
        verified: true,
        logs: [
          { name: 'onClick', args: '[ SyntheticEvent ]', tag: 'play' },
        ],
        code: {
          lang: 'javascript',
          filename: 'src/components/Button.stories.js',
          lines: [
            "import { fn, expect, userEvent, within } from '@storybook/test';",
            "import { Button } from './Button';",
            '',
            'export default {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            '  args: { onClick: fn() }, // 함정 ①: 실제 핸들러 금지 → 목만',
            '};',
            '',
            'export const Clicked = {',
            "  args: { label: '결제하기' },",
            '  play: async ({ args, canvasElement }) => {',
            '    const canvas = within(canvasElement);',
            "    await userEvent.click(canvas.getByRole('button'));",
            '    // => onClick 로그가 자동으로 쌓이고',
            '    await expect(args.onClick).toHaveBeenCalledTimes(1);',
            '  },',
            '};',
            '',
            '// 함정 ②: 액션 이름은 prop 이름과 일치',
            '// 함정 ③: onScroll 등 고빈도 콜백 로깅은 패널을 마비시킴',
          ],
          highlight: [12, 13, 14, 15, 16, 17],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 미리보기(컴포넌트) + Actions 패널(순차 로그 애니메이션)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step, stepIdx }) {
      const { preview, spyConnected, verified, logs } = step;
      const [visibleCount, setVisibleCount] = useState(0);

      // 스텝이 바뀌면 로그를 0부터 하나씩 순차로 드러낸다
      useEffect(() => {
        setVisibleCount(0);
        if (logs.length === 0) return;
        let n = 0;
        const timer = setInterval(() => {
          n += 1;
          setVisibleCount(n);
          if (n >= logs.length) clearInterval(timer);
        }, 650);
        return () => clearInterval(timer);
      }, [stepIdx]);

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🎬 미리보기 → Actions 패널</h2>
            <span className="text-[10px] text-slate-400 font-mono">{spyConnected ? 'fn() spy 연결됨' : 'unwired'}</span>
          </div>

          {/* 미리보기 (컴포넌트 캔버스) */}
          <div className="rounded-lg border border-slate-200 bg-slate-50 p-4 mb-3">
            <div className="text-[10px] uppercase tracking-wider text-slate-400 mb-2">Canvas — 컴포넌트 미리보기</div>
            {preview === 'button'
              ? <ButtonPreview active={visibleCount > 0} />
              : <FormPreview typedLen={Math.min(visibleCount, 2)} submitted={visibleCount >= 3} />}
          </div>

          {/* Actions 패널 */}
          <ActionsPanel logs={logs} visibleCount={visibleCount} />

          {/* 메트릭 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="로그 수" value={`${visibleCount}`} good={visibleCount > 0} />
            <Metric label="스파이" value={spyConnected ? '✓ 연결' : '✗ 없음'} good={spyConnected} />
            <Metric label="play 검증" value={verified ? '✓ 통과' : '— 대기'} good={verified} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-pink-500"></span>action 로그</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-emerald-500"></span>play 자동 실행</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    // 버튼 미리보기 — 로그가 나갈 때 리플 애니메이션
    function ButtonPreview({ active }) {
      return (
        <div className="flex items-center justify-center py-4">
          <button
            key={active ? 'on' : 'off'}
            className={`px-5 py-2 rounded-lg text-sm font-bold text-white shadow ${active ? 'ripple' : ''}`}
            style={{ backgroundColor: '#FF4785' }}
          >
            결제하기
          </button>
          {active && <span className="ml-3 text-[11px] font-mono text-pink-600">onClick 방출 →</span>}
        </div>
      );
    }

    // 폼 미리보기 — 입력/제출에 따라 값 반영
    function FormPreview({ typedLen, submitted }) {
      const typed = 'ab'.slice(0, typedLen);
      return (
        <div className="flex flex-col gap-2 py-1">
          <label className="text-[11px] text-slate-500 font-medium">email</label>
          <div className="px-3 py-2 rounded-md border border-slate-300 bg-white text-sm font-mono text-slate-700 min-h-[36px] flex items-center">
            {typed}
            <span className="w-0.5 h-4 bg-pink-500 ml-0.5 animate-pulse"></span>
          </div>
          <button
            className={`mt-1 self-start px-4 py-1.5 rounded-md text-sm font-bold text-white ${submitted ? 'ripple' : ''}`}
            style={{ backgroundColor: submitted ? '#C5306A' : '#FF4785' }}
          >
            {submitted ? '제출됨 ✓' : '로그인'}
          </button>
        </div>
      );
    }

    // Actions 패널 — VSCode 하단 패널 톤, 순차로 로그 등장
    function ActionsPanel({ logs, visibleCount }) {
      const shown = logs.slice(0, visibleCount);
      return (
        <div className="rounded-lg overflow-hidden border border-slate-700 bg-[#282c34]">
          <div className="bg-[#21252b] px-3 py-1.5 flex items-center gap-2 border-b border-slate-700">
            <span className="text-[10px] font-bold uppercase tracking-wider text-pink-300">Actions</span>
            <span className="text-[10px] text-slate-500 font-mono ml-auto">{logs.length} events</span>
          </div>
          <div className="p-3 min-h-[132px] font-mono text-[11px] leading-relaxed">
            {shown.length === 0 ? (
              <div className="text-slate-500 italic">아직 관측된 이벤트가 없습니다 — 콜백이 나가도 흔적이 없다</div>
            ) : (
              shown.map((log, i) => (
                <div key={i} className="log-in flex items-start gap-2 py-0.5">
                  <span className="text-slate-500 select-none">▸</span>
                  <span className={`font-bold ${log.tag === 'play' ? 'text-emerald-400' : 'text-pink-400'}`}>{log.name}</span>
                  <span className="text-slate-300">{log.args}</span>
                  {log.note && <span className="text-slate-500 ml-1">{log.note}</span>}
                  {log.tag === 'play' && <span className="ml-1 px-1.5 rounded bg-emerald-900 text-emerald-300 text-[9px]">play</span>}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function Metric({ label, value, good }) {
      const tone = good ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-slate-50 border-slate-300 text-slate-500';
      return (
        <div className={`p-2 rounded border-2 ${tone}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-sm font-bold tabular-nums">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setRenderedLines(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm bg-rose-600">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 컴포넌트 카탈로그 &gt; Chapter 1. Controls & Actions</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Actions — 이벤트 로그</h1>
                  <p className="text-sm text-slate-500 mt-0.5">컴포넌트가 발생시키는 이벤트를 패널에 기록해 상호작용을 눈으로 확인</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-rose-50 border-2 border-rose-300 rounded-xl p-3 text-sm text-rose-900">
                💡 다음(II-2-1)에서는 <strong>play 함수와 상호작용 테스트</strong> — userEvent로 시나리오를 자동 실행하고 expect로 검증한다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]" style={{ backgroundColor: '#FF4785' }}>
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-1-1.html" className="text-slate-500 hover:text-slate-700">&larr; II-1-1 Controls</a>
              <a href="./II-2-1.html" className="text-pink-700 hover:text-pink-900 font-medium">II-2-1 play 함수 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
