<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — II-2-2. Backgrounds — 라이트/다크</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    II-2-2. Backgrounds — 라이트/다크
    학습 목표: addon-backgrounds로 컴포넌트 배경을 라이트↔다크로 전환하며
              테마·대비를 검증하는 흐름과, "배경만 바뀌고 토큰은 안 바뀌는" 함정을
              테마 데코레이터로 해결하는 과정을 6단계로 익힌다.
    핵심 비유: "조명 바꿔 옷 입혀보기" — 진열대 조명(배경)만 바꾸면 옷(토큰)은 그대로다
    패턴: fastapi v1 — 좌(LiveDataPane: 배경 전환 프리뷰 + 대비 게이지) / 우(VSCode CodeViewer)
    브랜드: Storybook pink (#FF4785 / 다크 #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   bg: 프리뷰 캔버스 배경 프리셋 id ('light' | 'dark' | 'grid')
    //   tokenAware: 테마 토큰(색)까지 배경에 맞춰 바뀌는가 (false면 함정)
    //   contrast: 본문 텍스트 대비비 (WCAG AA 기준 4.5:1)
    //   preset: 툴바에 노출되는 backgrounds.values 프리셋 목록
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 왜 배경을 바꿔가며 봐야 하나',
        desc: '컴포넌트를 흰 배경에서만 확인하면, 다크 UI에 얹었을 때 텍스트가 묻히거나 그림자가 사라지는 문제를 배포 후에야 발견한다. 실무에서 버그의 절반은 "디자이너 화면은 라이트, 실제 서비스는 다크"라는 환경 차이에서 나온다. addon-backgrounds는 스토리를 다시 짜지 않고 툴바 클릭 한 번으로 배경을 갈아끼워, 같은 컴포넌트를 여러 조명 아래에서 즉시 검증하게 해준다. 배경 전환은 테마 검증의 가장 싼 첫 단추다.',
        bg: 'light',
        tokenAware: true,
        contrast: 12.6,
        preset: ['light'],
      },
      {
        title: 'Step 2. addon-backgrounds 설치와 프리셋 등록',
        desc: 'Storybook 8부터 backgrounds는 essentials에 포함돼 별도 설치 없이 켜져 있다. .storybook/preview.js의 parameters.backgrounds.values에 이름과 색을 배열로 넣으면, 그 목록이 그대로 툴바 드롭다운이 된다. 색은 반드시 디자인 토큰과 같은 실제 HEX를 써야 한다. 여기서 대충 회색을 넣으면 "스토리북에서는 멀쩡한데 서비스는 다르다"는 함정에 빠진다. 프리셋은 팀 전체가 공유하는 검증 기준선이 된다.',
        bg: 'light',
        tokenAware: true,
        contrast: 12.6,
        preset: ['light', 'dark'],
      },
      {
        title: 'Step 3. 툴바로 라이트↔다크 전환',
        desc: '등록한 프리셋은 상단 툴바의 배경 아이콘으로 실시간 전환된다. 전환 순간 캔버스 색만 바뀌고 컴포넌트는 다시 렌더되지 않으므로, 같은 인스턴스가 두 조명 아래 어떻게 보이는지 나란히 비교할 수 있다. 이 단계에서 다크로 넘겼을 때 아이콘·보더·플레이스홀더가 배경에 녹아버리는지를 눈으로 확인한다. 대비 게이지가 4.5 밑으로 떨어지면 그 색 조합은 접근성 기준 미달이다.',
        bg: 'dark',
        tokenAware: true,
        contrast: 11.4,
        preset: ['light', 'dark'],
      },
      {
        title: 'Step 4. 스토리별 기본 배경 고정',
        desc: '다크 전용으로 설계한 컴포넌트라면 매번 손으로 다크를 고르게 두면 안 된다. 스토리 객체의 parameters.backgrounds.default에 프리셋 이름을 지정하면 그 스토리는 항상 그 배경으로 열린다. 리뷰어가 실수로 라이트에서 보고 "깨졌다"고 오해하는 사고를 원천 차단한다. meta 레벨에 두면 파일 전체, 개별 스토리에 두면 그 스토리만 적용되어 우선순위가 명확하다.',
        bg: 'dark',
        tokenAware: true,
        contrast: 11.4,
        preset: ['light', 'dark'],
      },
      {
        title: 'Step 5. 함정 — 배경만 바뀌고 토큰은 그대로',
        desc: 'backgrounds는 캔버스 색만 칠할 뿐, 컴포넌트 내부의 하드코딩된 색은 절대 건드리지 못한다. 배경만 다크로 갈면 흰 카드에 검은 글씨가 그대로 떠서 대비가 오히려 무너진다. 이게 초보가 가장 많이 놓치는 지점이다. 진짜 테마 검증은 배경과 함께 CSS 변수(디자인 토큰)를 같이 바꿔야 한다. 즉 배경 전환은 "테마가 바뀐 척"일 뿐, 토큰을 안 건드리면 가짜 검증이다.',
        bg: 'dark',
        tokenAware: false,
        contrast: 2.1,
        preset: ['light', 'dark'],
      },
      {
        title: 'Step 6. 테마 데코레이터로 배경+토큰 동시 전환',
        desc: 'globalTypes로 theme 토글을 만들고, 데코레이터에서 그 값에 따라 루트에 data-theme를 걸어 CSS 변수를 통째로 교체한다. 이러면 배경과 컴포넌트 토큰이 한 몸으로 움직여 실제 다크모드와 1:1로 맞는다. addon-backgrounds는 "빠른 눈 검사"용, 데코레이터+토큰은 "진짜 테마 검증"용으로 역할을 나눠 쓰는 게 실무 정답이다. 마지막으로 대비비가 AA(4.5:1)를 넘는지 확인하면 검증이 끝난다.',
        bg: 'dark',
        tokenAware: true,
        contrast: 11.4,
        preset: ['light', 'dark'],
      },
    ];

    // ─────────────────────────────────────────────────────
    // 배경 프리셋 색 정의 (실제 디자인 토큰 값과 동일하게)
    // ─────────────────────────────────────────────────────
    const BG_PRESET = {
      light: { name: 'light', hex: '#F8FAFC', swatch: 'bg-slate-50' },
      dark:  { name: 'dark',  hex: '#0F172A', swatch: 'bg-slate-900' },
      grid:  { name: 'grid',  hex: '#FFFFFF', swatch: 'bg-white' },
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 배경 전환 프리뷰 + 대비 게이지
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const { bg, tokenAware, contrast, preset } = step;
      const isDarkCanvas = bg === 'dark';

      // 캔버스(배경)는 프리셋 색, 카드(컴포넌트)는 tokenAware일 때만 배경에 맞춰 토큰 전환
      const canvasHex = BG_PRESET[bg].hex;
      const cardBg = tokenAware ? (isDarkCanvas ? '#1E293B' : '#FFFFFF') : '#FFFFFF';
      const cardText = tokenAware ? (isDarkCanvas ? '#E2E8F0' : '#0F172A') : '#0F172A';
      const cardBorder = tokenAware ? (isDarkCanvas ? '#334155' : '#E2E8F0') : '#E2E8F0';

      const passAA = contrast >= 4.5;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🎨 배경 전환 프리뷰 — 라이트/다크 대비</h2>
            <span className="text-[10px] text-slate-400 font-mono">bg: {bg}</span>
          </div>

          {/* 툴바 배경 프리셋 드롭다운 흉내 */}
          <div className="flex items-center gap-2 mb-3">
            <span className="text-[10px] text-slate-500 font-medium">Backgrounds</span>
            <div className="flex gap-1.5">
              {preset.map((p) => {
                const active = p === bg;
                return (
                  <span
                    key={p}
                    title={BG_PRESET[p].hex}
                    className={`flex items-center gap-1 px-2 py-1 rounded text-[10px] font-mono border transition ${active ? 'border-pink-400 bg-pink-50 text-pink-700' : 'border-slate-200 text-slate-500'}`}
                  >
                    <span className={`w-3 h-3 rounded ${BG_PRESET[p].swatch} border border-slate-300`}></span>
                    {p}
                  </span>
                );
              })}
            </div>
          </div>

          {/* 프리뷰 캔버스 — 배경색 트랜지션 */}
          <div
            className="rounded-lg p-6 min-h-[220px] flex items-center justify-center transition-colors duration-700"
            style={{ backgroundColor: canvasHex, backgroundImage: bg === 'grid' ? 'linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px)' : 'none', backgroundSize: '16px 16px' }}
          >
            {/* 검증 대상 컴포넌트 카드 */}
            <div
              className="w-full max-w-[260px] rounded-xl p-4 shadow-lg transition-colors duration-700"
              style={{ backgroundColor: cardBg, color: cardText, border: `1px solid ${cardBorder}` }}
            >
              <div className="text-sm font-bold mb-1">결제 카드</div>
              <div className="text-xs mb-3" style={{ opacity: 0.75 }}>월 구독 · 자동 갱신</div>
              <button
                className="w-full py-2 rounded-lg text-sm font-bold text-white"
                style={{ backgroundColor: '#FF4785' }}
              >
                결제하기
              </button>
              {!tokenAware && (
                <div className="mt-3 text-[10px] font-bold px-2 py-1 rounded bg-red-100 text-red-700 border border-red-300">
                  ⚠ 토큰 미반영 — 검은 글씨가 다크 배경에 묻힘
                </div>
              )}
            </div>
          </div>

          {/* 대비 게이지 */}
          <div className="mt-4">
            <div className="flex items-center justify-between text-[11px] mb-1">
              <span className="text-slate-500 font-medium">본문 대비비 (WCAG)</span>
              <span className={`font-mono font-bold ${passAA ? 'text-emerald-600' : 'text-red-600'}`}>{contrast.toFixed(1)} : 1</span>
            </div>
            <div className="h-2.5 rounded-full bg-slate-100 overflow-hidden">
              <div
                className={`h-full rounded-full transition-all duration-700 ${passAA ? 'bg-emerald-500' : 'bg-red-500'}`}
                style={{ width: `${Math.min(100, (contrast / 12) * 100)}%` }}
              ></div>
            </div>
            <div className="flex items-center gap-3 mt-2 text-[10px]">
              <span className={`px-1.5 py-0.5 rounded font-bold ${passAA ? 'bg-emerald-50 text-emerald-700 border border-emerald-300' : 'bg-red-50 text-red-700 border border-red-300'}`}>
                {passAA ? '✓ AA 통과' : '✗ AA 미달 (< 4.5)'}
              </span>
              <span className="text-slate-400">테마 토큰: {tokenAware ? '✓ 반영' : '✗ 고정(하드코딩)'}</span>
            </div>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-50 border border-slate-300"></span>light</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-900"></span>dark</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 단계별 코드 (언어 javascript, 주석은 // =>)
    // ─────────────────────────────────────────────────────
    const CODES = [
      {
        lang: 'javascript',
        filename: 'src/components/PayCard.stories.jsx',
        lines: [
          "import { PayCard } from './PayCard';",
          '',

          '    return <Story />;',

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];
      const code = CODES[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 컴포넌트 카탈로그 &gt; Chapter 2. Addons</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Backgrounds — 라이트/다크</h1>
                  <p className="text-sm text-slate-500 mt-0.5">배경을 전환하며 테마·대비를 검증한다</p>
                </div>
              </div>
              {/* 진행바 */}
              <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500" style={{ width: `${progress}%`, backgroundColor: '#FF4785' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(III-1-1)에서는 <strong>Play function</strong> — 렌더 후 사용자 인터랙션(클릭·입력)을 스토리 안에서 자동 실행하는 법
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="text-pink-700 hover:text-pink-900 font-medium">III-1-1 Play function &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
