<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />

  <title>Storybook 학습 — II-2-1. Viewport — 반응형 확인</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!--
    II-2-1. Viewport — 반응형 확인
    학습 목표: addon-viewport로 모바일·태블릿·데스크톱 프리셋을 즉시 전환하고,
              parameters.viewport로 스토리별 기본값을 고정하며, 커스텀 뷰포트를
              정의해 반응형 브레이크포인트를 검증하는 흐름을 6단계로 이해한다.
    핵심 비유: "한 컴포넌트를 여러 크기의 액자에 끼워 보는 진열대"
    패턴: 좌(LiveDataPane: 디바이스 프레임이 리사이즈되며 레이아웃 리플로우) / 우(VSCode CodeViewer)
    브랜드: Storybook pink (#FF4785 / #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 뷰포트 프리셋 — width(px)에 따라 그리드 열 수(cols)가 바뀐다
    //   width < 480  → 1열 (mobile)
    //   width < 900  → 2열 (tablet)
    //   그 이상       → 3열 (desktop)
    // ─────────────────────────────────────────────────────
    function colsForWidth(width) {
      if (width < 480) return 1;
      if (width < 900) return 2;
      return 3;
    }

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   frame: { name, width, height } — 좌측 프레임이 이 크기로 애니메이션 전환
    //   breakpoint: 현재 활성 CSS 브레이크포인트 라벨
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      grid: {lang:"javascript", filename:"src/components/ProductCard.jsx", lines:[
        "// 화면 폭에 따라 열 수가 바뀌는 반응형 그리드",
        "// Tailwind 브레이크포인트: sm=640 md=768 lg=1024",
        "",
        "export function ProductGrid({ items }) {",
        "  return (",
        "    <div className=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4\">",
        "      {items.map((it) => (",
        "        <ProductCard key={it.id} item={it} />",
        "      ))}",
        "    </div>",
        "  );",
        "}",
        "",
        "// 확인 방법(지금까지):",
        "//   1) npm run dev",
        "//   2) 브라우저 창을 손으로 줄인다",
        "//   3) \"대충 이쯤이 모바일이겠지\" 눈대중",
        "//   => 정확한 폭을 재현할 수 없다",
        "//   => 리뷰어/QA가 같은 폭을 못 맞춘다",
      ]},
      mainJs: {lang:"javascript", filename:".storybook/main.js", lines:[
        "// addon-essentials 안에 viewport가 이미 들어 있다.",
        "// 개별 설치가 필요하면: npm i -D @storybook/addon-viewport",
        "",
        "/** @type { import(\"@storybook/react-vite\").StorybookConfig } */",
        "const config = {",
        "  stories: ['../src/**/*.stories.@(js|jsx|ts|tsx)'],",
        "  addons: [",
        "    '@storybook/addon-essentials', // viewport 포함",
        "  ],",
        "  framework: { name: '@storybook/react-vite', options: {} },",
        "};",
        "",
        "export default config;",
        "",
        "// => 툴바에 디바이스 아이콘이 생긴다",
        "// => \"Small mobile / Large mobile / Tablet\" 기본 프리셋 제공",
        "// => 클릭하면 캔버스 폭이 정확히 그 px로 고정",
      ]},
      storyDefault: {lang:"javascript", filename:"src/components/ProductGrid.stories.jsx", lines:[
        "import { INITIAL_VIEWPORTS } from '@storybook/addon-viewport';",
        "import { ProductGrid } from './ProductCard';",
        "",
        "export default {",
        "  title: 'Catalog/ProductGrid',",
        "  component: ProductGrid,",
        "  parameters: {",
        "    viewport: {",
        "      viewports: INITIAL_VIEWPORTS, // 기본 디바이스 목록",
        "      defaultViewport: 'tablet',   // 열리자마자 768px",
        "    },",
        "  },",
        "};",
        "",
        "export const OnTablet = { args: { items: sample } };",
        "",
        "// => OnTablet 스토리를 열면 곧장 태블릿 폭",
        "// => 리뷰어가 툴바를 만질 필요 없음",
        "// => autodocs 미리보기도 이 폭으로 캡처",
      ]},
      viewportStories: {lang:"javascript", filename:"src/components/ProductGrid.stories.jsx", lines:[
        "// 한 컴포넌트 → 여러 뷰포트 스토리로 나눠 경계를 검증",
        "",
        "export const OnMobile = {",
        "  args: { items: sample },",
        "  parameters: { viewport: { defaultViewport: 'mobile1' } },",
        "};",
        "",
        "export const OnTablet = {",
        "  args: { items: sample },",
        "  parameters: { viewport: { defaultViewport: 'tablet' } },",
        "};",
        "",

    const S1 = {"title":"Step 1. 문제 — 반응형은 브라우저를 손으로 늘려 확인했다","desc":"ProductCard는 화면 폭에 따라 1열·2열·3열로 바뀌도록 만들었다. 그런데 이 세 상태를 확인하려면 브라우저 창을 손으로 줄였다 늘렸다 하며 눈대중해야 한다. 정확히 375px인지, 리뷰어가 같은 폭을 재현했는지 알 수 없고, 스크린샷 회귀 테스트도 매번 폭이 달라 흔들린다. \"폭\"이라는 변수를 고정값 프리셋으로 다루지 못하는 게 통증의 핵심이다."};
    const S2 = {"title":"Step 2. addon-viewport 설치 — 툴바에서 폭을 고정값으로 전환","desc":"@storybook/addon-viewport(최신 배포는 addon-essentials에 기본 포함)를 켜면 상단 툴바에 디바이스 아이콘이 생긴다. 클릭 한 번으로 캔버스 폭이 정확히 375px 같은 고정값으로 바뀐다. 손으로 늘리는 대신 \"모바일\" 프리셋을 누르면 팀 전원이 같은 폭을 본다. 폭이 재현 가능한 값이 되는 순간, 스크린샷 회귀·디자인 리뷰가 안정된다."};
    const S3 = {"title":"Step 3. parameters.viewport — 스토리가 열리자마자 태블릿 폭","desc":"툴바를 매번 누르는 대신, 스토리 파일에서 defaultViewport로 기본 폭을 못박을 수 있다. \"이 스토리는 태블릿에서만 의미 있다\"면 tablet을 기본값으로 두어, 스토리를 열면 곧장 768px로 렌더된다. 이렇게 하면 리뷰어가 툴바 조작 없이도 의도된 폭을 보고, autodocs 문서에도 그 폭이 반영된다. 폭이 \"스토리의 속성\"으로 코드에 남는 게 핵심이다."};
    const S4 = {"title":"Step 4. 데스크톱 브레이크포인트 검증 — 3열로 리플로우","desc":"같은 컴포넌트를 desktop 프리셋(1280px)으로 열면 lg 브레이크포인트가 걸려 3열로 펼쳐진다. 여기서 확인할 것은 \"폭이 커졌을 때 카드가 늘어져 보기 흉하지 않은가\", \"최대 너비(max-width)를 걸어야 하는가\"다. 하나의 스토리를 여러 뷰포트로 돌려 보며 브레이크포인트 경계(가장 깨지기 쉬운 지점)를 눈으로 확인하는 것이 addon-viewport의 실전 용도다."};
    const S5 = {"title":"Step 5. 커스텀 뷰포트 — 사내 키오스크·폴더블도 프리셋으로","desc":"기본 프리셋에 없는 기기도 직접 정의할 수 있다. 폭 280px 폴더블, 세로형 키오스크(1080×1920)처럼 우리 서비스가 실제로 돌아가는 기기를 프리셋으로 등록해 두면, 담당자가 바뀌어도 \"그 이상한 폭\"을 매번 손으로 입력할 필요가 없다. 재현 조건을 코드에 박아 팀 지식으로 남기는 것이다. INITIAL_VIEWPORTS와 병합해 함께 노출한다."};
    const S6 = {"title":"Step 6. 함정 — 뷰포트는 실기기가 아니다","desc":"addon-viewport는 \"폭을 흉내 낼 뿐\"이다. 터치 이벤트, 실제 폰트 렌더링, DPR(레티나), OS 스크롤바 폭, 노치·안전영역은 재현되지 않는다. 또 요즘 레이아웃은 뷰포트가 아니라 부모 폭에 반응하는 컨테이너 쿼리(@container)를 쓰는데, 이건 뷰포트를 바꿔도 부모가 그대로면 안 바뀐다. 그래서 뷰포트 프리셋으로 1차 검증하고, 최종은 반드시 실기기(또는 BrowserStack류)로 확인해야 한다."};

        beat:{ label:"기본 목록과 병합", at:".storybook/preview.js L17–21",
               caption:"스프레드로 합쳐야 기본 기기와 커스텀 기기가 함께 툴바에 뜬다.",
               changes:[{"mark":"new","text":"병합된 viewports"},{"mark":"gone","text":"기본 목록 통째 교체"}] },
        frame:{"name":"Small mobile — 375 × 667","width":375,"height":380},
        breakpoint:"base (모바일)",
        code:{...CODE.customViewports, highlight:[17,18,19,20,21]},
      },
      { ...S5,
        beat:{ label:"팀 지식으로 남는다", at:".storybook/preview.js L23",
               caption:"담당자가 바뀌어도 \"그 이상한 폭\"을 한 번에 재현할 수 있다.",
               changes:[{"mark":"new","text":"재현 조건이 코드에 남음"}] },
        frame:{"name":"Custom Foldable — 280 × 653","width":280,"height":380},
        breakpoint:"base (초협폭)",
        code:{...CODE.customViewports, highlight:[23]},
      },
      // ── Step 6 ──────────────────────────────
      { ...S6,
        beat:{ label:"폭만 흉내 낸다", at:"viewport-caveats.md.js L1",
               caption:"addon-viewport 가 바꾸는 것은 캔버스 폭뿐이라는 전제를 먼저 못박는다.",
               changes:[{"mark":"read","text":"재현 범위 = 폭"}] },
        frame:{"name":"⚠ 폭만 흉내 낸다","width":375,"height":380},
        breakpoint:"trap",
        code:{...CODE.caveats, highlight:[1]},
      },
      { ...S6,
        beat:{ label:"재현되지 않는 다섯 가지", at:"viewport-caveats.md.js L3–7",
               caption:"터치·폰트·DPR·스크롤바·안전영역은 실기기에서만 드러난다.",
               changes:[{"mark":"gone","text":"터치/제스처"},{"mark":"gone","text":"DPR·노치·스크롤바"}] },
        frame:{"name":"⚠ 터치·DPR·노치 미재현","width":414,"height":380},
        breakpoint:"trap",
        code:{...CODE.caveats, highlight:[3,4,5,6,7]},
      },
      { ...S6,
        beat:{ label:"컨테이너 쿼리 선언", at:"viewport-caveats.md.js L9–12",
               caption:"container-type 을 준 요소는 뷰포트가 아니라 부모 폭을 기준으로 삼는다.",
               changes:[{"mark":"new","text":"container-type: inline-size"},{"mark":"changed","text":"기준이 부모 폭으로"}] },
        frame:{"name":"Tablet — 부모 폭 기준","width":768,"height":380},
        breakpoint:"md (태블릿)",
        code:{...CODE.caveats, highlight:[9,10,11,12]},
      },
      { ...S6,
        beat:{ label:"@container 는 안 움직인다", at:"viewport-caveats.md.js L13–16",
               caption:"뷰포트를 데스크톱으로 키워도 부모 폭이 그대로면 레이아웃은 그대로다.",
               changes:[{"mark":"gone","text":"뷰포트 전환 효과"},{"mark":"read","text":"부모 폭 400px 기준"}] },
        frame:{"name":"Desktop — 뷰포트만 커짐","width":1180,"height":380},
        breakpoint:"lg (데스크톱)",
        code:{...CODE.caveats, highlight:[13,14,15,16]},
      },
      { ...S6,
        beat:{ label:"결론 — 1차 검증용", at:"viewport-caveats.md.js L18–19",
               caption:"프리셋으로 빠르게 훑고, 마지막 판단은 실기기나 BrowserStack 으로 한다.",
               changes:[{"mark":"read","text":"1차: 뷰포트 프리셋"},{"mark":"new","text":"최종: 실기기 확인"}] },
        frame:{"name":"⚠ Viewport ≠ Real Device","width":375,"height":380},
        breakpoint:"trap",
        code:{...CODE.caveats, highlight:[18,19]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 샘플 카드 데이터
    // ─────────────────────────────────────────────────────
    const CARDS = [
      { id: 1, name: '무선 이어폰', price: '129,000', tag: 'NEW' },
      { id: 2, name: '기계식 키보드', price: '89,000', tag: 'HOT' },
      { id: 3, name: '4K 웹캠', price: '65,000', tag: '' },
      { id: 4, name: 'USB-C 허브', price: '42,000', tag: '' },
      { id: 5, name: '노트북 스탠드', price: '38,000', tag: 'SALE' },
      { id: 6, name: '모니터 암', price: '110,000', tag: '' },
    ];

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 디바이스 프레임이 폭에 맞춰 리사이즈되고
    //                내부 그리드가 1→2→3열로 리플로우된다
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      const { frame, breakpoint } = step;
      const isTrap = breakpoint === 'trap';
      const cols = colsForWidth(frame.width);
      // 실제 표시 폭은 패널에 맞게 비율 축소 (최대 520px 컨테이너)
      const MAX = 520;
      const displayW = Math.min(frame.width, MAX);
      const scale = displayW / frame.width; // 참고용

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📱 뷰포트 진열대 — 한 컴포넌트, 여러 액자</h2>
            <span className="text-[10px] text-slate-400 font-mono">{cols}열</span>
          </div>

          {/* 디바이스 프레임 */}
          <div className="bg-slate-50 rounded-lg p-4 min-h-[340px] flex flex-col items-center justify-start">
            <div className="text-[11px] font-bold text-slate-600 mb-2 flex items-center gap-2">
              <span>{frame.name}</span>
            </div>

            <div
              className={`relative mx-auto rounded-xl border-4 bg-white overflow-hidden transition-all duration-700 ease-in-out ${isTrap ? 'border-red-400' : 'border-slate-800'}`}
              style={{ width: displayW + 'px', maxWidth: '100%' }}
            >
              {/* 상단 브라우저 바 */}
              <div className="h-5 bg-slate-800 flex items-center gap-1 px-2">
                <span className="w-1.5 h-1.5 rounded-full bg-red-400"></span>
                <span className="w-1.5 h-1.5 rounded-full bg-yellow-400"></span>
                <span className="w-1.5 h-1.5 rounded-full bg-green-400"></span>
                <span className="ml-2 text-[8px] text-slate-300 font-mono">{frame.width}px</span>
              </div>

              {/* 리플로우되는 그리드 */}
              <div
                className="p-2 gap-2 transition-all duration-500"
                style={{
                  display: 'grid',
                  gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))`,
                }}
              >
                {CARDS.slice(0, cols === 1 ? 3 : 6).map((c) => (
                  <MiniCard key={c.id} card={c} />
                ))}
              </div>

              {isTrap && (
                <div className="absolute inset-0 flex items-center justify-center bg-red-500/10 backdrop-blur-[1px]">
                  <div className="bg-white/95 border-2 border-red-300 rounded-lg px-3 py-2 text-center shadow">
                    <div className="text-xs font-bold text-red-700">👆 터치·DPR·노치 미재현</div>
                    <div className="text-[10px] text-red-600 mt-0.5">폭만 흉내 — 실기기 필요</div>
                  </div>
                </div>
              )}
            </div>

            {/* 폭 눈금자 */}
            <div className="mt-3 w-full max-w-[520px]">
              <div className="h-1.5 rounded-full bg-slate-200 relative overflow-hidden">
                <div
                  className="h-full bg-pink-500 transition-all duration-700"
                  style={{ width: Math.min(100, (frame.width / 1280) * 100) + '%' }}
                ></div>
              </div>
              <div className="flex justify-between text-[9px] text-slate-400 font-mono mt-1">
                <span>0</span><span>480</span><span>900</span><span>1280px</span>
              </div>
            </div>
          </div>

          {/* 메트릭 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="캔버스 폭" value={`${frame.width}px`} good={!isTrap} />
            <Metric label="그리드 열" value={`${cols}열`} good={!isTrap} />
            <Metric label="브레이크포인트" value={breakpoint} good={!isTrap} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-500"></span>활성 폭</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-800"></span>디바이스 프레임</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    function MiniCard({ card }) {
      return (
        <div className="border border-slate-200 rounded-md p-2 flex flex-col gap-1 bg-slate-50">
          <div className="h-8 rounded bg-gradient-to-br from-pink-100 to-slate-100 flex items-center justify-center">
            {card.tag && (
              <span className="text-[7px] font-bold text-pink-700 bg-white/80 rounded px-1">{card.tag}</span>
            )}
          </div>
          <div className="text-[9px] font-medium text-slate-700 truncate">{card.name}</div>
          <div className="text-[9px] font-bold text-slate-900">{card.price}원</div>
        </div>
      );
    }

    function Metric({ label, value, good }) {
      const tone = good ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-red-50 border-red-300 text-red-700';
      return (
        <div className={`p-2 rounded border-2 ${tone}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-sm font-bold tabular-nums truncate">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js atom-one-dark
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 컴포넌트 카탈로그 &gt; II-2-1</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Viewport — 반응형 확인</h1>
                  <p className="text-sm text-slate-500 mt-0.5">여러 디바이스 크기에서 컴포넌트가 어떻게 보이는지 즉시 전환</p>
                </div>
              </div>
              {/* 진행바 */}
              <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden">
                <div className="h-full transition-all duration-500" style={{ width: progress + '%', backgroundColor: '#FF4785' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(II-2-2)에서는 <strong>Backgrounds &amp; Layout</strong>으로 배경색·여백을 스토리별로 전환해 대비 검증하는 법을 다룬다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="./II-2-2.html" className="text-pink-700 hover:text-pink-900 font-medium">II-2-2 Backgrounds &amp; Layout &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
