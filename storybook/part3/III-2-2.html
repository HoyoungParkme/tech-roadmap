<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — III-2-2. Visual regression 시각 회귀</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    III-2-2. Visual regression — 시각 회귀
    학습 목표: 기준 스냅샷(baseline)과 현재 렌더를 픽셀 단위로 비교해
              의도치 않은 UI 변화를 자동으로 잡아내는 흐름을 5단계로 이해한다.
    핵심 비유: "틀린 그림 찾기 자동화" — 사람 눈 대신 픽셀 diff가 변경 영역을 형광펜으로 칠해준다
    패턴: fastapi v1 — 좌(LiveDataPane: baseline/current/diff 스냅샷 비교 + 승인·거부) / 우(VSCode CodeViewer)
    브랜드: Storybook pink (#FF4785 / dark #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   scene: 'baseline' | 'capture' | 'review' | 'flaky' | 'ci'
    //   baseline / current: 스냅샷 되는 컴포넌트의 렌더 상태 { label, bg, px, radius }
    //   diffPct: 픽셀 변경 비율(%) — 0이면 통과
    //   decision: null | 'approved' | 'rejected'
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 기준 스냅샷 — "정답 이미지"를 한 장 박제한다',
        desc: '시각 회귀 테스트는 사람이 눈으로 확인한 "지금 이 화면이 맞다"는 순간을 baseline 이미지로 저장하는 데서 출발한다. 각 Story마다 렌더 결과를 PNG로 캡처해 git에 커밋하거나 Chromatic 서버에 올려두면, 이후 모든 변경은 이 기준과 비교된다. 기준이 없으면 비교 대상도 없으니, 처음 한 번은 반드시 사람이 승인해 baseline을 확정해야 한다. 단위 테스트가 "값"을 검증한다면 시각 회귀는 "픽셀"을 검증한다는 점이 핵심이다.',
        scene: 'baseline',
        baseline: { label: 'Save', bg: '#FF4785', px: 14, radius: 8 },
        current:  { label: 'Save', bg: '#FF4785', px: 14, radius: 8 },
        diffPct: 0,
        decision: null,
        code: {
          lang: 'javascript',
          filename: '.storybook/test-runner.js',
          lines: [
            "const { waitForPageReady } = require('@storybook/test-runner');",
            '',
            '// 각 Story를 방문한 뒤 스크린샷을 찍어 baseline과 비교한다',
            'module.exports = {',
            '  async postVisit(page, context) {',
            '    // 폰트/이미지 로딩까지 끝난 안정 상태를 기다림',
            '    await waitForPageReady(page);',
            '',
            '    // Story 캔버스 전체를 PNG로 캡처',
            '    const image = await page.screenshot();',
            '',
            '    // 최초 실행이면 이 이미지가 곧 기준(baseline)이 된다',
            '    // 이후 실행이면 저장된 기준과 픽셀 비교',
            '    expect(image).toMatchImageSnapshot({',
            "      customSnapshotsDir: '__snapshots__',",
            '      customSnapshotIdentifier: context.id,',
            '    });',
            '    // => 최초 1회: __snapshots__/<story-id>.png 생성',
            '    // => 사람이 눈으로 확인 후 git commit → 기준 확정',
            '  },',
            '};',
          ],
          highlight: [9, 10, 13, 14, 15, 16, 17, 18],
        },
      },
      {
        title: 'Step 2. 현재 렌더 캡처 & 픽셀 비교 — diff가 변경 영역을 칠한다',
        desc: '코드를 고친 뒤 테스트를 다시 돌리면 현재 렌더를 새로 캡처해 baseline과 픽셀 단위로 겹쳐 본다. 색이 다른 픽셀이 임계값(threshold)을 넘으면 실패로 처리하고, 어긋난 좌표를 모아 diff 이미지에 형광색으로 표시한다. 아래 예시는 버튼 배경을 실수로 빨강으로 바꾼 경우로, 텍스트는 그대로지만 배경 픽셀 3.2%가 달라져 회귀로 잡혔다. 이렇게 "의도 안 한 변화"를 코드 리뷰 전에 기계가 먼저 찾아준다는 점이 시각 회귀의 최대 가치다.',
        scene: 'capture',
        baseline: { label: 'Save', bg: '#FF4785', px: 14, radius: 8 },
        current:  { label: 'Save', bg: '#DC2626', px: 14, radius: 8 },
        diffPct: 3.2,
        decision: null,
        code: {
          lang: 'javascript',
          filename: 'Button.snapshot.test.js',
          lines: [
            "import { render } from '@testing-library/react';",
            "import { toMatchImageSnapshot } from 'jest-image-snapshot';",
            "import { Button } from './Button';",
            '',
            'expect.extend({ toMatchImageSnapshot });',
            '',
            "test('Primary 버튼은 기준 스냅샷과 일치해야 한다', async () => {",
            "  const image = await captureStory('atoms-button--primary');",
            '',
            '  // 픽셀 비교: 미세한 안티에일리어싱 오차는 무시,',
            '  // 실제 색/모양 변화만 실패로 잡는다',
            '  expect(image).toMatchImageSnapshot({',
            '    failureThreshold: 0.01,        // 1% 이하 차이는 통과',
            "    failureThresholdType: 'percent',",
            "    comparisonMethod: 'pixelmatch',",
            '  });',
            '  // => baseline: 분홍 배경 (#FF4785)',
            '  // => current : 빨강 배경 (#DC2626)  ← 실수로 변경됨',
            '  // => diff    : 배경 픽셀 3.2% 불일치 → FAIL',
            '});',
          ],
          highlight: [12, 13, 14, 15, 16, 17, 18, 19],
        },
      },
      {
        title: 'Step 3. 승인 / 거부 워크플로우 — 사람이 최종 판단한다',
        desc: '픽셀이 달라졌다고 항상 버그는 아니다. 디자인을 일부러 바꾼 것일 수도 있으니, diff가 뜨면 리뷰어가 "의도한 변경이면 승인, 회귀면 거부"를 결정한다. 승인하면 현재 렌더가 새 baseline으로 갱신되고, 거부하면 CI가 실패해 머지를 막는다. Chromatic은 이 승인/거부를 PR 화면에서 클릭 한 번으로 처리하고 팀원 간 리뷰까지 붙인다. 주의할 점은 "귀찮다고 전부 승인"하는 습관인데, 이러면 기준이 오염돼 회귀 감지가 무력화되므로 반드시 diff를 눈으로 보고 판단해야 한다.',
        scene: 'review',
        baseline: { label: 'Save', bg: '#FF4785', px: 14, radius: 8 },
        current:  { label: 'Save', bg: '#DC2626', px: 14, radius: 8 },
        diffPct: 3.2,
        decision: 'rejected',
        code: {
          lang: 'bash',
          filename: 'review-workflow.sh',
          lines: [
            '# Chromatic: PR마다 스냅샷을 클라우드에 올리고 diff를 리뷰',
            'npx chromatic --project-token=$CHROMATIC_TOKEN',
            '',
            '# => 빌드 결과 URL이 출력된다',
            '#    "2 changes must be reviewed"',
            '',
            '# 리뷰어가 웹 UI에서 각 diff를 확인하고 판단',
            '#   [Accept] 의도한 디자인 변경 → 현재 렌더가 새 baseline',
            '#   [Deny]   의도치 않은 회귀    → CI 실패, 머지 차단',
            '',
            '# 이번 케이스: 배경색이 실수로 빨강이 됨 → Deny',
            '# => PR 상태 체크가 빨간불로 유지되어 머지 불가',
            '',
            '# 반대로 정말 디자인을 바꾼 경우엔 Accept 후',
            '# 기준이 갱신되어 다음 PR부터는 빨강이 정답이 된다',
            '',
            '# 안티패턴: 확인 없이 전부 Accept 하면',
            '# baseline이 오염되어 회귀 감지가 무력화된다',
          ],
          highlight: [7, 8, 9, 11, 12],
        },
      },
      {
        title: 'Step 4. 플레이키 관리 — 시간·랜덤·폰트·애니메이션을 고정',
        desc: '시각 회귀에서 가장 흔한 좌절은 코드를 안 고쳤는데 매번 diff가 뜨는 "플레이키(flaky)" 실패다. 원인은 대부분 매 렌더마다 달라지는 값들이다. 현재 시각을 그리는 시계, 랜덤 아바타, 아직 안 끝난 애니메이션, 웹폰트 로딩 타이밍 등이 픽셀을 흔든다. 그래서 스냅샷 직전에 애니메이션을 정지시키고, Date와 Math.random을 고정하며, 폰트가 다 로드될 때까지 기다리는 안정화 작업이 필수다. 이걸 안 하면 팀이 실패에 무뎌져 "또 그 테스트야" 하고 무시하게 되는데, 그 순간 진짜 회귀도 함께 묻힌다.',
        scene: 'flaky',
        baseline: { label: '12:00', bg: '#FF4785', px: 14, radius: 8 },
        current:  { label: '12:07', bg: '#FF4785', px: 14, radius: 8 },
        diffPct: 1.1,
        decision: null,
        code: {
          lang: 'javascript',
          filename: '.storybook/preview.js',
          lines: [
            '// 스냅샷을 흔드는 비결정적 요소를 전부 고정한다',
            'export const parameters = {',
            '  // 1) 애니메이션/트랜지션 정지 → 중간 프레임이 안 찍히게',
            '  chromatic: { pauseAnimationAtEnd: true },',
            '};',
            '',
            'export const decorators = [',
            '  (Story) => {',
            '    // 2) 시간 고정 — 시계/날짜 컴포넌트 안정화',
            "    const FIXED = new Date('2026-01-01T12:00:00Z');",
            '    jest.useFakeTimers().setSystemTime(FIXED);',
            '',
            '    // 3) 랜덤 고정 — 아바타/셔플 결과 고정',
            '    Math.random = () => 0.42;',
            '',
            '    return Story();',
            '  },',
            '];',
            '',
            '// => 시각(12:00)·랜덤·애니메이션이 매번 동일',
            '// => 코드가 안 바뀌면 diff도 0%  (플레이키 제거)',
          ],
          highlight: [3, 4, 9, 10, 11, 13, 14],
        },
      },
      {
        title: 'Step 5. CI 통합 — PR마다 자동으로 회귀를 막는다',
        desc: '시각 회귀는 로컬에서 가끔 돌리면 의미가 없고, PR 파이프라인에 붙어 자동으로 돌아야 안전망이 된다. GitHub Actions에서 Chromatic 액션을 실행하면 브랜치의 스냅샷을 기준과 비교해 변경이 있으면 PR 상태 체크를 실패로 만들고, 리뷰어가 승인해야 초록불로 바뀐다. 이렇게 하면 디자인 시스템을 리팩터링하거나 공용 컴포넌트를 고칠 때 수백 개 화면을 사람이 일일이 확인하지 않아도 기계가 달라진 곳만 콕 집어준다. 언제 특히 유용한지 한 줄로 요약하면 "많은 화면이 한 컴포넌트에 의존할 때"의 리팩터링 안전망이다.',
        scene: 'ci',
        baseline: { label: 'Save', bg: '#FF4785', px: 14, radius: 8 },
        current:  { label: 'Save', bg: '#FF4785', px: 14, radius: 8 },
        diffPct: 0,
        decision: 'approved',
        code: {
          lang: 'bash',
          filename: '.github/workflows/chromatic.yml',
          lines: [
            '# PR이 열릴 때마다 시각 회귀를 자동 실행',
            'name: Visual regression',
            'on: [pull_request]',
            '',
            'jobs:',
            '  chromatic:',
            '    runs-on: ubuntu-latest',
            '    steps:',
            '      - uses: actions/checkout@v4',
            '        with: { fetch-depth: 0 }   # 기준 비교에 히스토리 필요',
            '      - run: npm ci',
            '      # Storybook을 빌드하고 스냅샷을 업로드·비교',
            '      - uses: chromaui/action@latest',
            '        with:',
            '          projectToken: ${{ secrets.CHROMATIC_TOKEN }}',
            '          exitZeroOnChanges: false   # 변경 있으면 CI 실패',
            '',
            '# => 회귀 없음: 초록불, 머지 가능',
            '# => 변경 감지: 빨간불, 리뷰어 승인 전까지 머지 차단',
            '# => 디자인 시스템 리팩터링의 자동 안전망 완성',
          ],
          highlight: [12, 13, 14, 15, 16],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 스냅샷 미리보기 — 컴포넌트 렌더를 "찍힌 이미지"처럼 그림
    // ─────────────────────────────────────────────────────
    function Snapshot({ shot, tag, tone, diff }) {
      const border = tone === 'base' ? 'border-slate-300' : (diff ? 'border-pink-400' : 'border-emerald-300');
      return (
        <div className="flex flex-col items-center gap-1.5">
          <div className="text-[10px] font-mono text-slate-400">{tag}</div>
          <div className={`relative bg-slate-100 rounded-md border-2 ${border} w-full h-24 flex items-center justify-center overflow-hidden`}>
            <button
              className="text-white font-medium shadow-sm"
              style={{ backgroundColor: shot.bg, padding: `${shot.px * 0.6}px ${shot.px}px`, borderRadius: shot.radius, fontSize: 13 }}
            >
              {shot.label}
            </button>
            {diff && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div className="border-2 border-fuchsia-500 bg-fuchsia-500/20 rounded animate-pulse" style={{ width: '70%', height: '52%' }}></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — baseline vs current 비교 + diff + 승인/거부
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const { scene, baseline, current, diffPct, decision } = step;
      const hasDiff = diffPct > 0;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🔍 틀린 그림 찾기 — 스냅샷 픽셀 비교</h2>
            <span className="text-[10px] text-slate-400 font-mono">{scene}</span>
          </div>

          <div className="bg-slate-50 rounded-lg p-4 min-h-[320px] flex flex-col gap-3">
            {/* 세 장의 스냅샷: 기준 / 현재 / diff */}
            <div className="grid grid-cols-3 gap-3">
              <Snapshot shot={baseline} tag="baseline" tone="base" diff={false} />
              <Snapshot shot={current} tag="current" tone="cur" diff={false} />
              <Snapshot shot={current} tag="diff" tone="cur" diff={hasDiff} />
            </div>

            {/* 비교 결과 바 */}
            <div className={`mt-1 p-3 rounded-lg border-2 ${hasDiff ? 'bg-pink-50 border-pink-300' : 'bg-emerald-50 border-emerald-300'}`}>
              <div className="flex items-center justify-between">
                <span className={`text-xs font-bold ${hasDiff ? 'text-pink-700' : 'text-emerald-700'}`}>
                  {hasDiff ? `⚠ 변경 감지 — 픽셀 ${diffPct}% 불일치` : '✓ 일치 — 회귀 없음'}
                </span>
                <span className="text-[10px] font-mono text-slate-400">threshold 1%</span>
              </div>
              <div className="mt-2 h-2 rounded-full bg-slate-200 overflow-hidden">
                <div
                  className={`h-full ${hasDiff ? 'bg-pink-500' : 'bg-emerald-500'}`}
                  style={{ width: `${Math.max(4, Math.min(100, diffPct * 12))}%` }}
                ></div>
              </div>
            </div>

            {/* Scene별 부가 정보 */}
            {scene === 'baseline' && (
              <div className="p-3 rounded-lg bg-white border border-slate-200 text-[11px] text-slate-600">
                📌 이 렌더를 <strong>기준 이미지</strong>로 확정한다. 이후 모든 비교의 정답.
              </div>
            )}
            {scene === 'review' && (
              <div className="flex gap-2">
                <DecisionTag active={decision === 'approved'} kind="approve" />
                <DecisionTag active={decision === 'rejected'} kind="reject" />
              </div>
            )}
            {scene === 'flaky' && (
              <div className="p-3 rounded-lg bg-amber-50 border-2 border-amber-300 text-[11px] text-amber-800">
                🎲 코드는 그대로인데 <strong>시각(12:00 → 12:07)</strong>이 달라 diff 발생 — 시간·랜덤·애니메이션을 고정해야 함
              </div>
            )}
            {scene === 'ci' && (
              <div className="p-3 rounded-lg bg-emerald-50 border-2 border-emerald-300 text-[11px] text-emerald-800">
                🟢 PR 상태 체크 통과 — 리팩터링 후에도 달라진 화면만 기계가 짚어준다
              </div>
            )}
          </div>

          {/* 워크플로우 요약 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="변경 픽셀" value={`${diffPct}%`} good={diffPct === 0} />
            <Metric label="판정" value={hasDiff ? 'FAIL' : 'PASS'} good={!hasDiff} />
            <Metric label="머지" value={decision === 'rejected' ? '차단' : (hasDiff ? '보류' : '가능')} good={!hasDiff} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>일치</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-500"></span>회귀</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded border-2 border-fuchsia-500"></span>diff 영역</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    function DecisionTag({ active, kind }) {
      const isApprove = kind === 'approve';
      const base = isApprove ? 'emerald' : 'pink';
      const label = isApprove ? '✓ Accept (의도한 변경)' : '✗ Deny (회귀)';
      const activeCls = isApprove
        ? 'bg-emerald-500 text-white border-emerald-600'
        : 'bg-pink-500 text-white border-pink-600';
      const idleCls = `bg-white text-${base}-700 border-${base}-200`;
      return (
        <div className={`flex-1 text-center text-[11px] font-bold rounded-lg border-2 py-2 ${active ? activeCls + ' ' + (active ? 'animate-pulse' : '') : idleCls}`}>
          {label}
        </div>
      );
    }

    function Metric({ label, value, good }) {
      const tone = good ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-amber-50 border-amber-300 text-amber-700';
      return (
        <div className={`p-2 rounded border-2 ${tone}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-sm font-bold tabular-nums">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 테스트 &gt; Chapter 2. 자동화된 회귀 방어</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Visual regression — 시각 회귀</h1>
                  <p className="text-sm text-slate-500 mt-0.5">스냅샷으로 UI 변화를 픽셀 단위로 감지</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 Part III 완주 — 다음 <strong>Part IV</strong>에서는 컴포넌트를 문서로 엮는 <strong>Autodocs와 MDX</strong>로 넘어간다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="../part4/IV-1-1.html" className="text-pink-700 hover:text-pink-900 font-medium">IV-1-1 Autodocs &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
