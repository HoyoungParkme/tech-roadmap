<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — III-2-1. Accessibility addon — a11y</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>♿</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!--
    III-2-1. Accessibility addon — a11y
    학습 목표: addon-a11y가 각 스토리에서 axe-core를 실행해 접근성 위반(대비·ARIA·레이블)을
              자동 검출하고, 규칙 설정과 CI(test-runner) 통합으로 위반을 수정하는 흐름을 이해한다.
    핵심 비유: "품질 검사관이 진열대의 옷마다 라벨/치수를 확인" — 스토리마다 axe가 순회 점검
    패턴: fastapi v1 — 좌(LiveDataPane: 위반 리스트 → 수정 → 통과 애니메이션) / 우(VSCode CodeViewer)
    브랜드: Storybook pink (#FF4785)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   storyState: 'broken' | 'checking' | 'fixed' | 'configured' | 'ci'
    //   violations: [{ id, impact, help }]  — axe-core 위반 리포트
    //   passes:     통과한 규칙 수
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:'javascript', filename:'src/components/Button.jsx', lines:[
        '// 눈으로는 멀쩡 — 그러나 접근성 결함이 숨어 있다',
        'export function Button({ icon, children, onClick }) {',
        '  return (',
        '    <button',
        '      onClick={onClick}',
        '      // 대비 부족: 연회색 배경 + 흰 텍스트 => 2.1:1',
        '      style={{ background: \'#c9c9c9\', color: \'#ffffff\' }}',
        '    >',
        '      {icon ? icon : children}',
        '      // icon만 있으면 텍스트가 없어',
        '      // 스크린리더는 그냥 \'button\'이라고만 읽는다',
        '    </button>',
        '  );',
        '}',
        '',
        '// => 화면 검수만으로는 이 3가지를 놓친다:',
        '//    1) color-contrast  2) button-name  3) label',
      ]},
      s2: {lang:'javascript', filename:'.storybook/main.js', lines:[
        '// 1) 애드온 설치',
        '//    npm i -D @storybook/addon-a11y',
        '',
        '// 2) main.js 에 등록',
        'export default {',
        '  stories: [\'../src/**/*.stories.@(js|jsx|ts|tsx)\'],',
        '  addons: [',
        '    \'@storybook/addon-essentials\',',
        '    \'@storybook/addon-a11y\',',
        '  ],',
        '};',
        '',
        '// => 이제 모든 스토리 하단 패널에 [Accessibility] 탭 생성',
        '// => 스토리를 열 때마다 axe-core 가 DOM 을 자동 스캔',
        '// => Violations / Passes / Incomplete 로 결과 분류',
      ]},
      s3: {lang:'javascript', filename:'a11y-report.txt', lines:[
        '// axe-core Violations (3)',
        '',
        '[critical] button-name',
        '  요소: button > svg (아이콘만 있음)',
        '  해결: aria-label=\'삭제\' 를 추가',
        '',
        '[critical] label',
        '  요소: input#email (연결된 label 없음)',
        '  해결: <label htmlFor=\'email\'> 로 연결',
        '',
        '[serious] color-contrast',
        '  요소: button (fg #fff / bg #c9c9c9 = 2.1:1)',
        '  해결: 배경을 #FF4785 로 => 4.5:1 이상',
        '',
        '// => critical 부터 고친다: 사용자를 완전히 차단하므로',
      ]},
      s4: {lang:'javascript', filename:'src/components/Button.jsx', lines:[
        '// 3가지 위반을 코드로 수정',
        'export function IconButton({ onClick }) {',
        '  return (',
        '    <button',
        '      onClick={onClick}',
        '      aria-label=\'삭제\'            // button-name 해결',
        '      style={{ background: \'#FF4785\', color: \'#fff\' }}',
        '      // 대비 4.6:1 => color-contrast 해결',
        '    >',
        '      <TrashIcon />',
        '    </button>',
        '  );',
        '}',
        '',
        '// 폼도 label 로 연결',
        '// <label htmlFor=\'email\'>이메일</label>',
        '// <input id=\'email\' name=\'email\' />   // label 해결',
        '',
        '// => 저장 즉시 axe 재실행 => Violations 0, Passes 12',
      ]},
      s5: {lang:'javascript', filename:'Button.stories.jsx', lines:[
        'export const BrandBanner = {',
        '  parameters: {',
        '    a11y: {',
        '      // 이 스토리에서만 규칙 조정',
        '      config: {',
        '        rules: [',
        '          // 브랜드 승인 색이라 대비 규칙만 예외 처리',
        '          // (반드시 이유를 남긴다 — 남용 금지)',
        '          { id: \'color-contrast\', enabled: false },',
        '        ],',
        '      },',
        '    },',

        code:{...CODE.s5, highlight:[5,6,7,8]},
      },
      { ...S5,
        beat:{
          label:'color-contrast off',
          at:'Button.stories.jsx L9–11',
          caption:'{ id: \'color-contrast\', enabled: false } 한 줄로 이 스토리에서만 규칙을 끈다.',
          changes:[
            {mark:'changed', text:'enabled: false'},
            {mark:'gone', text:'대비 오탐 사라짐'},
          ],
        },
        storyState:'configured',
        badgeContrast:'4.6:1',
        violations:[],
        passes:12,
        code:{...CODE.s5, highlight:[9,10,11]},
      },
      { ...S5,
        beat:{
          label:'전역과 예외의 계층',
          at:'Button.stories.jsx L16–18',
          caption:'기본은 preview.js 의 parameters.a11y, 예외만 스토리에서 덮어쓴다. 끈 규칙은 Passes 집계에서도 빠져 11 이 된다.',
          changes:[
            {mark:'changed', text:'Passes 12 → 11'},
            {mark:'gone', text:'검사 대상에서 제외'},
          ],
        },
        storyState:'configured',
        badgeContrast:'4.6:1',
        violations:[],
        passes:11,
        code:{...CODE.s5, highlight:[16,17,18]},
      },
      // ── Step 6 ────────────────────────────────────────────────────────────
      { ...S6,
        beat:{
          label:'axe-playwright import',
          at:'.storybook/test-runner.js L1',
          caption:'test-runner 설정에서 injectAxe 와 checkA11y 두 함수를 가져온다.',
          changes:[
            {mark:'new', text:'injectAxe, checkA11y'},
            {mark:'read', text:'axe-playwright'},
          ],
        },
        storyState:'configured',
        badgeContrast:'4.6:1',
        violations:[],
        passes:11,
        code:{...CODE.s6, highlight:[1]},
      },
      { ...S6,
        beat:{
          label:'preVisit 에 axe 주입',
          at:'.storybook/test-runner.js L3–6',
          caption:'각 스토리 렌더 직전에 axe 를 페이지에 심는다. 준비 단계다.',
          changes:[
            {mark:'new', text:'preVisit 훅'},
            {mark:'changed', text:'헤드리스 CI 모드'},
          ],
        },
        storyState:'ci',
        badgeContrast:'4.6:1',
        violations:[],
        passes:11,
        code:{...CODE.s6, highlight:[3,4,5,6]},
      },
      { ...S6,
        beat:{
          label:'postVisit 에서 검사',
          at:'.storybook/test-runner.js L7–12',
          caption:'렌더가 끝난 뒤 #storybook-root 를 대상으로 checkA11y 를 돌린다. detailedReport 로 원인까지 남긴다.',
          changes:[
            {mark:'new', text:'postVisit + checkA11y'},
            {mark:'changed', text:'Passes 12'},
          ],
        },
        storyState:'ci',
        badgeContrast:'4.6:1',
        violations:[],
        passes:12,
        code:{...CODE.s6, highlight:[7,8,9,10,11,12]},
      },
      { ...S6,
        beat:{
          label:'위반이면 exit 1',
          at:'.storybook/test-runner.js L15–16',
          caption:'test-storybook --ci 는 위반이 하나라도 있으면 실패로 끝난다. PR 머지가 막힌다.',
          changes:[
            {mark:'new', text:'exit 1 로 CI 실패'},
            {mark:'changed', text:'회귀 시 머지 차단'},
          ],
        },
        storyState:'ci',
        badgeContrast:'4.6:1',
        violations:[
          {id:'color-contrast', impact:'serious', help:'회귀 예시 — CI 에서 1건이면 머지 차단'}
        ],
        passes:12,
        code:{...CODE.s6, highlight:[15,16]},
      },
      { ...S6,
        beat:{
          label:'한계와 수동 점검',
          at:'.storybook/test-runner.js L17–18',
          caption:'axe 가 잡는 것은 전체의 30~40%. 키보드 이동과 스크린리더 흐름은 사람이 직접 확인해야 한다.',
          changes:[
            {mark:'gone', text:'자동 검출 60~70% 사각'},
            {mark:'new', text:'수동 점검 필수'},
          ],
        },
        storyState:'ci',
        badgeContrast:'4.6:1',
        violations:[],
        passes:12,
        code:{...CODE.s6, highlight:[17,18]},
      },
    ];

    const IMPACT_STYLE = {
      critical: 'bg-red-100 text-red-700 border-red-300',
      serious:  'bg-orange-100 text-orange-700 border-orange-300',
      moderate: 'bg-amber-100 text-amber-700 border-amber-300',
      minor:    'bg-slate-100 text-slate-600 border-slate-300',
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 스토리 프리뷰 + a11y 검사 결과
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      const { storyState, violations, passes, badgeContrast } = step;
      const isFixed = violations.length === 0;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">♿ Accessibility 패널 — axe-core</h2>
            <span className="text-[10px] text-slate-400 font-mono">{storyState}</span>
          </div>

          <div className="bg-slate-50 rounded-lg p-4 min-h-[320px] flex flex-col gap-3">
            {/* 스토리 프리뷰 */}
            <StoryPreview storyState={storyState} badgeContrast={badgeContrast} />

            {/* a11y 결과 */}
            <div className="flex-1">
              <div className="flex items-center justify-between mb-2">
                <span className="text-[11px] font-bold text-slate-600">axe-core 결과</span>
                {isFixed ? (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-300">
                    ✓ Violations 0
                  </span>
                ) : (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700 border border-red-300 animate-pulse">
                    ✗ Violations {violations.length}
                  </span>
                )}
              </div>

              {isFixed ? (
                <div className="p-3 rounded-lg bg-emerald-50 border-2 border-emerald-300 text-center">
                  <div className="text-2xl">✅</div>
                  <div className="text-xs font-bold text-emerald-700 mt-1">모든 규칙 통과</div>
                  <div className="text-[11px] text-emerald-600 mt-0.5">
                    {storyState === 'ci' ? 'CI 통과 — PR 머지 가능' : storyState === 'configured' ? '규칙 조정 후 통과' : '수정 완료 — HMR 재검사 통과'}
                  </div>
                </div>
              ) : (
                <div className="flex flex-col gap-1.5">
                  {violations.map((v, i) => (
                    <ViolationRow key={v.id} v={v} checking={storyState === 'checking'} delay={i} />
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* 메트릭 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="Violations" value={`${violations.length}`} good={violations.length === 0} />
            <Metric label="Passes" value={`${passes}`} good={passes >= 10} />
            <Metric label="텍스트 대비" value={badgeContrast} good={parseFloat(badgeContrast) >= 4.5} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-red-500"></span>critical</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-orange-500"></span>serious</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>pass</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    // 스토리 프리뷰 — 상태에 따라 결함/정상 UI
    function StoryPreview({ storyState, badgeContrast }) {
      const broken = storyState === 'broken' || storyState === 'checking';
      const btnStyle = broken
        ? { background: '#c9c9c9', color: '#ffffff' }
        : { background: '#FF4785', color: '#ffffff' };
      return (
        <div className="bg-white rounded-lg border border-slate-200 p-3">
          <div className="text-[10px] text-slate-400 font-mono mb-2">Atoms / IconButton — 스토리 프리뷰</div>
          <div className="flex items-center gap-3">
            <button
              aria-label={broken ? undefined : '삭제'}
              className="px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1"
              style={btnStyle}
            >
              <span>🗑</span>{!broken && <span>삭제</span>}
            </button>
            <div className="flex flex-col gap-0.5">
              {!broken && <label htmlFor="prev-email" className="text-[10px] text-slate-600">이메일</label>}
              <input
                id="prev-email"
                placeholder="email"
                className="text-[11px] px-2 py-1 rounded border border-slate-300 w-28"
              />
            </div>
            <span className="text-[10px] font-mono text-slate-500 ml-auto">대비 {badgeContrast}</span>
          </div>
        </div>
      );
    }

    function ViolationRow({ v, checking, delay }) {
      const tone = IMPACT_STYLE[v.impact] || IMPACT_STYLE.minor;
      return (
        <div
          className={`flex items-start gap-2 p-2 rounded-md border ${tone} ${checking ? 'animate-pulse' : ''}`}
          style={{ animationDelay: `${delay * 120}ms` }}
        >
          <span className="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-white/60 shrink-0">{v.impact}</span>
          <div className="min-w-0">
            <div className="text-[11px] font-mono font-bold">{v.id}</div>
            <div className="text-[10px] opacity-80">{v.help}</div>
          </div>
        </div>
      );
    }

    function Metric({ label, value, good }) {
      const tone = good ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-amber-50 border-amber-300 text-amber-700';
      return (
        <div className={`p-2 rounded border-2 ${tone}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-sm font-bold tabular-nums">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 테스트 &gt; Chapter 2. 접근성 · 시각</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Accessibility addon — a11y</h1>
                  <p className="text-sm text-slate-500 mt-0.5">axe-core로 접근성 위반을 스토리에서 자동 검출</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 axe 자동 검사는 안전망일 뿐 — <strong>키보드 조작·스크린리더 흐름은 사람이 직접</strong> 확인해야 접근성이 완성된다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./III-2-2.html" className="text-pink-700 hover:text-pink-900 font-medium">III-2-2 다음 주제 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
