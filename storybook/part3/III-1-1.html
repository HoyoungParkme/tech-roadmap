  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!-- Storybook III-1-1 — Play function (비유: 자동 연주 피아노) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#FF4785';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      whyPlay: {lang:"markdown", filename:"why-play.md", lines:[
        "# 왜 Play function 인가",
        "",
        "## 시나리오",
        "Modal 컴포넌트의 Story 를 만든다 — 보통은 `open=true` 인 상태 한 컷만 보여준다.",
        "하지만 실전에서 검증하고 싶은 것은 \"트리거 버튼을 누르면 열리고, ESC 를 누르면 닫힌다\" 같은 **흐름**.",
        "",
        "## Play 없이 — 사람이 클릭해야 함",
        "",
        "```",
        "Story: Modal (open=false)",
        "  ↓  (개발자가 화면에서 버튼 클릭)",
        "Modal 열림",
        "  ↓  (개발자가 ESC 키)",
        "Modal 닫힘",
        "```",
        "",
        "- 매번 마우스로 따라해야 함 — QA 비용 ↑",
        "- 회귀 테스트 안 됨 (PR 마다 사람이 클릭?)",
        "- 캡처/문서는 멈춘 한 컷",
        "",
        "## Play 로 — 코드가 클릭함",
        "",
        "```",
        "Story: Modal (open=false) + play()",
        "  ↓  await userEvent.click(triggerButton)",
        "Modal 열림 (자동)",
        "  ↓  await userEvent.keyboard(\"{Escape}\")",
        "Modal 닫힘 (자동)",
        "```",
        "",
        "- Story 를 열면 흐름이 자동 재생",
        "- Interactions 패널에서 단계별 리플레이",
        "- Chromatic 등에서 회귀 검증 가능",
        "",
        "## Play 가 푸는 것",
        "✓ 사용자 흐름을 코드로 명세 (일종의 living spec)",
        "✓ Story 렌더 직후 자동 실행 → 한 번에 결과 확인",
        "✓ Vitest/Jest 와 동일한 expect API → 친숙",
        "✓ Storybook UI 의 Interactions 패널과 통합",
        "✓ 실패 시 단계별 리플레이 (다음 챕터)",
        "",
        "## 비유",
        "- Story: 자동 연주 피아노의 **악보 한 페이지**",
        "- Play: 그 페이지를 **자동으로 연주**하는 기계",
        "- 사람이 건반(마우스) 안 눌러도 곡(흐름)이 들린다",
      ]},
      counter: {lang:"typescript", filename:"Counter.stories.tsx", lines:[
        "// Counter.stories.tsx — Play function 첫 예시",
        "",
        "import type { Meta, StoryObj } from \"@storybook/react\";",
        "import { within, userEvent, expect } from \"@storybook/test\";",
        "import { Counter } from \"./Counter\";",
        "",
        "const meta: Meta<typeof Counter> = {",
        "  title: \"Example/Counter\",",
        "  component: Counter,",
        "};",
        "export default meta;",
        "",
        "type Story = StoryObj<typeof Counter>;",
        "",
        "// (1) 기본 Story — 초기 상태만",
        "export const Default: Story = {",
        "  args: { initial: 0 },",
        "};",
        "",
        "// (2) Play — 자동으로 + 버튼 3회 클릭 후 3 인지 확인",
        "export const ClickedThreeTimes: Story = {",
        "  args: { initial: 0 },",
        "  play: async ({ canvasElement }) => {",
        "    // 쿼리 헬퍼 — 이 story 안에서만 검색",
        "    const canvas = within(canvasElement);",
        "",
        "    // DOM 요소 찾기 — 사용자 시점의 셀렉터",
        "    const incBtn = canvas.getByRole(\"button\", { name: /증가/i });",
        "    const display = canvas.getByTestId(\"count\");",
        "",
        "    // 인터랙션 — 사람처럼 클릭",
        "    await userEvent.click(incBtn);",
        "    await userEvent.click(incBtn);",
        "    await userEvent.click(incBtn);",
        "",
        "    // assertion — 화면에 \"3\" 이 보이는가",
        "    await expect(display).toHaveTextContent(\"3\");",
        "  },",
        "};",
        "",
        "// (3) 키보드 입력도 가능",
        "export const KeyboardIncrement: Story = {",
        "  args: { initial: 5 },",
        "  play: async ({ canvasElement }) => {",
        "    const canvas = within(canvasElement);",
        "    const input = canvas.getByLabelText(/검색/i);",
        "",
        "    await userEvent.type(input, \"storybook\");",
        "    await userEvent.keyboard(\"{Enter}\");",
        "",
        "    await expect(input).toHaveValue(\"storybook\");",
        "  },",
        "};",
        "",
        "/* 핵심 정리",
        "   - play 는 async 함수, canvasElement 를 받는다",
        "   - within(canvasElement) 로 쿼리 범위를 좁힘",
        "   - userEvent (NOT fireEvent) 가 현실에 가까움",
        "   - expect 는 Vitest 호환 — toBeVisible / toHaveTextContent 등",

        "    await step(\"로그인 제출\", async () => {",
        "      const submit = canvas.getByRole(\"button\", { name: /로그인/i });",

        "    await step(\"환영 메시지 확인\", async () => {",

      searchBox: {lang:"typescript", filename:"SearchBox.stories.tsx", lines:[
        "// SearchBox.stories.tsx — 비동기 흐름 정복",
        "",
        "import type { Meta, StoryObj } from \"@storybook/react\";",
        "import { within, userEvent, waitFor, expect } from \"@storybook/test\";",
        "import { SearchBox } from \"./SearchBox\";",
        "",
        "const meta: Meta<typeof SearchBox> = {",
        "  title: \"Forms/SearchBox\",",
        "  component: SearchBox,",
        "};",
        "export default meta;",
        "type Story = StoryObj<typeof SearchBox>;",
        "",
        "// 검색 결과가 비동기로 나타나는 케이스",
        "export const SearchWithDebounce: Story = {",
        "  play: async ({ canvasElement }) => {",
        "    const canvas = within(canvasElement);",
        "    const input = canvas.getByPlaceholderText(/검색/i);",
        "",
        "    // 사용자처럼 타이핑 (각 글자마다 약간의 delay)",
        "    await userEvent.type(input, \"storybook\", { delay: 50 });",
        "",
        "    // ── 비동기 결과 1: findByRole — 자체 polling",
        "    const list = await canvas.findByRole(\"list\", { name: /검색 결과/i });",
        "    await expect(list).toBeInTheDocument();",
        "",
        "    // ── 비동기 결과 2: waitFor — 복합 조건",
        "    await waitFor(",
        "      async () => {",
        "        const items = await canvas.findAllByRole(\"listitem\");",
        "        await expect(items.length).toBeGreaterThan(0);",
        "      },",
        "      { timeout: 3000 }  // 최대 3초 폴링",
        "    );",
        "  },",
        "};",
        "",
        "// 검색 결과 없음 케이스 — queryBy 로 부재 검증",
        "export const NoResults: Story = {",
        "  play: async ({ canvasElement }) => {",
        "    const canvas = within(canvasElement);",
        "    const input = canvas.getByPlaceholderText(/검색/i);",
        "",
        "    await userEvent.type(input, \"xyzxyz-no-match\");",
        "",
        "    // 결과 없음을 확인 — getBy 면 throw, query 면 null",
        "    await waitFor(async () => {",
        "      const list = canvas.queryByRole(\"list\", { name: /검색 결과/i });",
        "      await expect(list).toBeNull();",
        "    });",
        "",
        "    // 빈 상태 메시지",
        "    const empty = await canvas.findByText(/결과가 없습니다/i);",
        "    await expect(empty).toBeVisible();",
        "  },",
        "};",
        "",
        "/* 쿼리 3 종 분류",
        "   - getByX : 즉시, 없으면 throw → 있다고 확신할 때",
        "   - queryByX : 즉시, 없으면 null → 부재 검증",
        "   - findByX : async, polling → 비동기로 나타날 때",
        "",
        "   waitFor :",
        "   - 임의 조건을 폴링 (interval 기본 50ms, timeout 1000ms)",
        "   - 부작용 있는 코드 X — 순수 assertion 만 */",
      ]},
      bestPractices: {lang:"typescript", filename:"best-practices.tsx", lines:[
        "// Play function 베스트 프랙티스 모음",
        "",
        "import type { Meta, StoryObj } from \"@storybook/react\";",
        "import { within, userEvent, expect, fn } from \"@storybook/test\";",
        "import { Checkout } from \"./Checkout\";",
        "",
        "const meta: Meta<typeof Checkout> = {",
        "  title: \"Cart/Checkout\",",
        "  component: Checkout,",
        "  args: {",
        "    // 1) 핸들러는 fn() 으로 mock — 호출 검증 가능",
        "    onSubmit: fn(),",
        "    onCancel: fn(),",
        "  },",
        "};",
        "export default meta;",
        "type Story = StoryObj<typeof Checkout>;",
        "",
        "// ✓ 좋은 예: 한 시나리오, step 으로 단락, role/label 셀렉터",
        "export const HappyPath: Story = {",
        "  play: async ({ canvasElement, args, step }) => {",
        "    const canvas = within(canvasElement);",
        "",
        "    await step(\"쿠폰 적용\", async () => {",
        "      const coupon = canvas.getByLabelText(/쿠폰/i);  // ← label",
        "      await userEvent.type(coupon, \"WELCOME10\");",
        "      await userEvent.click(canvas.getByRole(\"button\", { name: /적용/i }));",
        "    });",
        "",
        "    await step(\"결제 진행\", async () => {",
        "      await userEvent.click(canvas.getByRole(\"button\", { name: /결제/i }));",
        "    });",
        "",
        "    await step(\"onSubmit 1회 호출\", async () => {",
        "      // fn() mock — 호출 횟수/인자 검증",
        "      await expect(args.onSubmit).toHaveBeenCalledOnce();",
        "      await expect(args.onSubmit).toHaveBeenCalledWith(",
        "        expect.objectContaining({ coupon: \"WELCOME10\" })",
        "      );",
        "    });",
        "  },",
        "};",
        "",
        "// ✓ 실패 케이스는 별도 Story — 독립",
        "export const InvalidCoupon: Story = {",
        "  play: async ({ canvasElement, args, step }) => {",
        "    const canvas = within(canvasElement);",
        "",
        "    await step(\"잘못된 쿠폰\", async () => {",
        "      const coupon = canvas.getByLabelText(/쿠폰/i);",
        "      await userEvent.type(coupon, \"INVALID\");",
        "      await userEvent.click(canvas.getByRole(\"button\", { name: /적용/i }));",
        "    });",
        "",
        "    await step(\"에러 토스트\", async () => {",
        "      const error = await canvas.findByRole(\"alert\");",
        "      await expect(error).toHaveTextContent(/유효하지 않은/i);",
        "    });",
        "",
        "    await step(\"onSubmit 호출 안 됨\", async () => {",
        "      await expect(args.onSubmit).not.toHaveBeenCalled();",
        "    });",
        "  },",
        "};",
        "",
        "/* ❌ 안티 패턴 모음 ─────────────────────────",
        "",
        "   // ❌ 1) 셀렉터: getByTestId 남발 + CSS 셀렉터",
        "   canvas.container.querySelector(\".btn-primary\")",
        "   ✓ 사용자 시점: getByRole(\"button\", { name: /결제/i })",
        "",
        "   // ❌ 2) await 누락 — race condition",
        "   userEvent.click(btn);  // await 없음!",
        "   expect(...).toBe(...);  // 클릭 전에 검증할 수도",
        "   ✓ await userEvent.click(btn);",
        "",
        "   // ❌ 3) sleep 으로 기다림",
        "   await new Promise(r => setTimeout(r, 1000));",
        "   ✓ await waitFor(async () => { ... });",
        "",
        "   // ❌ 4) 한 Story 에 여러 시나리오 욱여넣기",
        "   play: async () => { 성공(); 실패(); 재시도(); }  // 70 줄 ↑",
        "   ✓ Story 3 개로 분리 — 각각 짧고 명확",
        "",
        "   // ❌ 5) Story 끼리 의존 (전역 state 공유 등)",
        "   ✓ args 와 mocks 로 각 Story 가 자기 데이터 가짐 */",
      ]},
    };

    const S1 = {"title":"Step 1. 왜 Play function — 사용자가 안 와도 흐름을 본다","desc":"Story 는 컴포넌트의 한 상태(state)를 보여주지만, \"버튼을 클릭하면 모달이 열린다\" 같은 흐름(flow)은 보여주지 못한다. Play function 은 Story 가 렌더된 직후 자동으로 클릭/입력/대기 등 사용자 인터랙션을 실행해서 흐름을 시연한다. QA·디자이너가 마우스로 따라하지 않아도 된다."};
    const S2 = {"title":"Step 2. 첫 Play — userEvent.click + expect","desc":"Story 객체에 play 비동기 함수를 추가한다. canvasElement 인자에서 within(canvasElement) 로 쿼리 헬퍼를 얻고, userEvent 로 인터랙션, expect 로 assertion. Testing Library + Vitest 의 익숙한 API 그대로. await 를 꼭 붙여서 비동기 흐름을 보장한다."};
    const S3 = {"title":"Step 3. 폼 흐름 — type + select + click 조합","desc":"실제 로그인/검색/주문 같은 폼 흐름은 여러 인터랙션의 조합. userEvent.type 으로 입력, selectOptions 로 select, click 으로 제출. 각 단계마다 await + 중간 assertion 으로 흐름을 검증한다. 한 Story 가 짧은 사용자 시나리오 한 편이 된다."};
    const S4 = {"title":"Step 4. 비동기 + waitFor — 데이터 로딩 / 토스트","desc":"실전에서 toast/모달/검색 결과는 비동기로 나타난다. waitFor 는 조건이 참이 될 때까지 짧게 폴링한다. findBy* 쿼리는 자체 waitFor 내장. 잘못된 setTimeout 대신 이걸 써야 flaky 한 테스트를 피한다."};
    const S5 = {"title":"Step 5. Play 베스트 프랙티스 — 작게, 명확하게, 시나리오 단위로","desc":"Play function 을 잘 쓰는 5 가지 원칙. (1) 한 Story 는 한 시나리오. (2) step 으로 단락 구분. (3) 사용자 시점 셀렉터 (role/label) 사용. (4) await 필수. (5) Story 들 사이 의존 금지 — 각 Story 는 독립."};

        alert:{"tone":"good","text":"마크업이 바뀌어도 사용자 시점 셀렉터는 살아남는다."},
        code:{...CODE.bestPractices, highlight:[30,31,32]},
      },
      { ...S5,
        beat:{ label:"4. 모두 await 하고 mock 검증", at:"best-practices.tsx L34–40",
               caption:"호출 횟수와 인자를 확인한다. 모든 expect 앞에도 await 를 붙인다.",
               changes:[{"mark":"new","text":"toHaveBeenCalledOnce"},{"mark":"read","text":"objectContaining"}] },
        kind:"best",
        flow:[{"step":"2. step 으로 단락","state":"Interactions 패널 가독성","good":true},{"step":"3. 사용자 셀렉터","state":"role / label / placeholder","good":true},{"step":"4. await 모두","state":"비동기 race 방지","good":true}],
        alert:{"tone":"good","text":"await 하나 빠지면 간헐적으로 깨지는 테스트가 된다."},
        code:{...CODE.bestPractices, highlight:[34,35,36,37,38,39,40]},
      },
      { ...S5,
        beat:{ label:"5. Story 독립", at:"best-practices.tsx L45–47",
               caption:"실패 케이스는 InvalidCoupon 이라는 별도 Story 로 두고, 서로의 상태에 기대지 않는다.",
               changes:[{"mark":"new","text":"InvalidCoupon Story"},{"mark":"gone","text":"Story 간 전역 state 공유"}] },
        kind:"best",
        flow:[{"step":"1. 한 Story = 한 시나리오","state":"\"성공\"과 \"실패\"는 별도 Story","good":true},{"step":"2. step 으로 단락","state":"Interactions 패널 가독성","good":true},{"step":"3. 사용자 셀렉터","state":"role / label / placeholder","good":true},{"step":"4. await 모두","state":"비동기 race 방지","good":true},{"step":"5. Story 독립","state":"서로 영향 X — 순서 무관","good":true}],
        alert:{"tone":"good","text":"순서를 바꿔 돌려도 결과가 같아야 한다."},
        code:{...CODE.bestPractices, highlight:[45,46,47]},
      },
      { ...S5,
        beat:{ label:"안티패턴 — 셀렉터와 await 누락", at:"best-practices.tsx L68–75",
               caption:"querySelector 로 클래스를 잡거나 await 를 빠뜨리면 race condition 이 생긴다.",
               changes:[{"mark":"gone","text":"querySelector(\".btn-primary\")"},{"mark":"gone","text":"await 없는 click"},{"mark":"new","text":"getByRole + await"}] },
        kind:"best",
        flow:[{"step":"❌ CSS 셀렉터","state":".btn-primary 에 의존","good":false},{"step":"❌ await 누락","state":"클릭 전에 검증될 수 있음","good":false},{"step":"✓ 사용자 셀렉터 + await","state":"role/label · 항상 await","good":true}],
        alert:{"tone":"danger","text":"이 둘이 flaky 테스트의 대표 원인이다."},
        code:{...CODE.bestPractices, highlight:[68,69,70,71,72,73,74,75]},
      },
      { ...S5,
        beat:{ label:"안티패턴 — 몰아넣기와 의존", at:"best-practices.tsx L81–86",
               caption:"한 Story 에 성공·실패·재시도를 몰면 길어지고, 전역 state 를 공유하면 순서에 묶인다.",
               changes:[{"mark":"gone","text":"한 Story 70줄"},{"mark":"gone","text":"Story 간 의존"},{"mark":"new","text":"args 와 mocks 로 분리"}] },
        kind:"best",
        flow:[{"step":"1. 한 Story = 한 시나리오","state":"\"성공\"과 \"실패\"는 별도 Story","good":true},{"step":"2. step 으로 단락","state":"Interactions 패널 가독성","good":true},{"step":"3. 사용자 셀렉터","state":"role / label / placeholder","good":true},{"step":"4. await 모두","state":"비동기 race 방지","good":true},{"step":"5. Story 독립","state":"서로 영향 X — 순서 무관","good":true}],
        alert:{"tone":"good","text":"Play = 작은 시나리오 + 사용자 시점 + 항상 await. 다음은 Interactions addon."},
        code:{...CODE.bestPractices, highlight:[81,82,83,84,85,86]},
      },
    ];

    const KIND_BADGE = {
      why:   { label: '왜 Play', color: '#F59E0B' },
      first: { label: '첫 Play', color: '#FF4785' },
      form:  { label: '폼 흐름', color: '#0EA5E9' },
      async: { label: '비동기', color: '#6366F1' },
      best:  { label: '베스트', color: '#10B981' },
    };

    function FlowView({ items }) {
      if (!items) return null;
      return (
        <div className="space-y-1.5">
          {items.map((it, i) => {
            const bg = it.good === false ? '#FEE2E2' : it.good ? '#FCE7F3' : '#F9FAFB';
            const border = it.good === false ? '#FCA5A5' : it.good ? '#FF4785' : '#E5E7EB';
            return (
              <div key={i} className="flex items-stretch rounded border overflow-hidden" style={{ borderColor: border }}>
                <div className="w-28 px-2 py-1.5 text-xs font-bold text-white text-center" style={{ backgroundColor: BRAND }}>{it.step}</div>
                <div className="flex-1 px-2 py-1.5 text-xs font-mono" style={{ backgroundColor: bg, color: '#1F2937' }}>{it.state}</div>
              </div>
            );
          })}
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      const badge = KIND_BADGE[state.kind] || KIND_BADGE.first;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FBCFE8' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9D174D' }}>Play function — 자동 연주</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="rounded-lg border-2 p-3 flex-1" style={{ borderColor: BRAND }}>
            <div className="text-xs font-bold mb-2" style={{ color: '#9D174D' }}>▶️ 자동 흐름</div>
            <FlowView items={state.flow} />
          </div>
          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FDF2F8', border: '#FBCFE8', text: '#9D174D', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FDF2F8', border: '#FF4785', text: '#9D174D', icon: '✅' },
    };
    function AlertBox({ alert }) { if (!alert) return null; const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info; return (<div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}><span>{s.icon}</span><span>{alert.text}</span></div>); }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n')); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span><span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1; const isHi = highlightSet.has(lineNo);
                return (<div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`} style={isHi ? { backgroundColor: 'rgba(255,71,133,0.15)', borderColor: BRAND } : {}}><span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span><span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} /></div>);
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400"><span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span></div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0); const [playing, setPlaying] = useState(false); const intervalRef = useRef(null); const step = STEPS[stepIdx];
      useEffect(() => { const onKey = (e) => { if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1)); else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1)); }; window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, []);
      useEffect(() => { if (!playing) return; intervalRef.current = setInterval(() => { setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; }); }, 3000); return () => clearInterval(intervalRef.current); }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FDF2F8, #FFF1F2)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: BRAND }}>S</span>
              <div><h1 className="text-2xl font-bold" style={{ color: '#9D174D' }}>III-1-1. Play function — 사용자 흐름 자동 실행</h1><p className="text-sm" style={{ color: '#9D174D' }}>자동 연주 피아노 — Story 가 자기 흐름을 보여준다</p></div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9D174D' }}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">{STEPS.map((_, i) => (<div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? BRAND : '#FBCFE8' }} />))}</div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9D174D, #FF4785)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4"><LiveDataPane beat={step.beat} state={step} /><CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} /></div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80" style={{ borderColor: BRAND, color: '#9D174D' }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40" style={{ borderColor: BRAND, color: '#9D174D' }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#9D174D' : BRAND }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40" style={{ borderColor: BRAND, color: '#9D174D' }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9D174D' }}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (<div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: BRAND, color: '#9D174D' }}><div className="font-bold mb-1">✅ 핵심 정리</div>Play = async + within + userEvent + expect. step 으로 단락 + await 필수 + Story 독립. 다음은 Interactions addon 으로 실패 리플레이.</div>)}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">{['play', 'userEvent', 'within', 'expect', 'step', 'waitFor', 'testingLibrary'].map((k) => (<span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FDF2F8', color: '#9D174D', borderColor: '#FBCFE8' }}>#{k}</span>))}</div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9D174D' }}>
              <a href="../part2/II-2-2.html" className="underline hover:no-underline">← 이전: II-2-2</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
