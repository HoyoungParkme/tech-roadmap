<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — V-2-1. GitHub Pages / Vercel 배포</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!--
    V-2-1. GitHub Pages / Vercel 배포 — 정적 스토리북을 무료 호스팅에 올려 팀과 공유
    학습 목표: build-storybook 산출물(storybook-static/)을 GitHub Pages / Vercel / Netlify에
              올려 공개 URL로 서빙하는 파이프라인과, base path·접근 권한·빌드 명령 함정을 이해한다.
    패턴: fastapi v1 — 좌(LiveDataPane: build → upload → CDN → URL 배포 파이프라인) / 우(VSCode CodeViewer)
    브랜드: Storybook pink (#FF4785)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   stage: 'build' | 'ghpages' | 'vercel' | 'preview' | 'pitfall'
    //   pipeline: 파이프라인 4노드의 활성/완료 상태
    //   host: 배포 대상 호스트 메타 정보
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      build: {lang:"bash", filename:"build-storybook.sh", lines:[
        "# 1) 정적 사이트로 빌드 — 개발 서버가 아니라 배포용 산출물",
        "npm run build-storybook",
        "#   package.json scripts:",
        "#   \"build-storybook\": \"storybook build\"",
        "",
        "# => storybook-static/ 폴더 생성",
        "#    ├─ index.html      # 진입 페이지",
        "#    ├─ iframe.html     # Story 렌더 프레임",
        "#    ├─ assets/         # JS/CSS 번들",
        "#    └─ *.json          # Story 인덱스",
        "",
        "# 2) 로컬에서 산출물이 진짜 열리는지 먼저 확인 (배포 전 필수)",
        "npx http-server storybook-static -p 6006",
        "#   => http://localhost:6006 에서 정상 렌더되면 OK",
        "#   => 여기서 깨지면 어떤 호스팅에 올려도 깨진다",
        "",
        "# 3) 산출물은 커밋하지 않는다 — .gitignore 에 추가",
        "echo \"storybook-static/\" >> .gitignore",
      ]},
      ghpages: {lang:"yaml", filename:".github/workflows/deploy-storybook.yml", lines:[
        "name: Deploy Storybook to GitHub Pages",
        "on:",
        "  push:",
        "    branches: [main]",
        "",
        "permissions:",
        "  contents: write   # gh-pages 브랜치 push 권한",
        "",
        "jobs:",
        "  deploy:",
        "    runs-on: ubuntu-latest",
        "    steps:",
        "      - uses: actions/checkout@v4",
        "      - uses: actions/setup-node@v4",
        "        with: { node-version: 20, cache: npm }",
        "      - run: npm ci",
        "",
        "      # 함정: base 경로를 반드시 알려준다 (레포명)",
        "      - run: npm run build-storybook",
        "        # storybook build --base-path=/repo/ 로 설정하면",
        "        # 에셋이 /repo/assets/... 로 올바르게 참조된다",
        "",
        "      - uses: peaceiris/actions-gh-pages@v4",
        "        with:",
        "          github_token: ${{ secrets.GITHUB_TOKEN }}",
        "          publish_dir: ./storybook-static",
        "          # => gh-pages 브랜치로 산출물 push",
      ]},
      vercel: {lang:"json", filename:"vercel.json", lines:[
        "{",
        "  \"$schema\": \"https://openapi.vercel.sh/vercel.json\",",
        "",
        "  // 함정 1: 빌드 명령이 storybook build 여야 한다",
        "  \"buildCommand\": \"npm run build-storybook\",",
        "",
        "  // 함정 2: 출력 디렉터리를 정확히 맞춘다",
        "  //         dist/build 로 두면 404 (산출물 없음)",
        "  \"outputDirectory\": \"storybook-static\",",
        "",
        "  \"installCommand\": \"npm ci\",",
        "",
        "  // SPA 라우팅 — iframe.html 등 정적 파일 우선",
        "  \"cleanUrls\": true",
        "}",
        "",
        "// => Vercel 대시보드에서 동일하게 설정 가능:",
        "//    Framework Preset : Other",
        "//    Build Command    : npm run build-storybook",
        "//    Output Directory : storybook-static",
        "//    Install Command  : npm ci",
      ]},
      preview: {lang:"yaml", filename:".github/workflows/pr-preview.yml", lines:[
        "name: PR Preview URL 코멘트",
        "on: pull_request",
        "",
        "jobs:",
        "  preview:",
        "    runs-on: ubuntu-latest",
        "    steps:",
        "      # Vercel/Netlify 연동 시 프리뷰는 자동 생성된다.",
        "      # 아래는 그 URL을 PR 코멘트로 남기는 예.",
        "      - uses: actions/checkout@v4",
        "      - name: Comment preview link",
        "        uses: thollander/actions-comment-pull-request@v3",
        "        with:",

    const S2 = { title:"Step 2. GitHub Pages — Actions로 빌드하고 gh-pages에 배포", desc:"GitHub Pages는 저장소에 무료로 딸려오는 정적 호스팅이라 사내 예제·오픈소스 카탈로그에 잘 맞는다. 핵심 함정은 base path다. Pages는 https://org.github.io/repo/ 처럼 하위 경로로 서빙되므로, storybook build에 그 경로를 알려주지 않으면 에셋이 루트(/)에서 404가 난다. Actions로 빌드해 gh-pages 브랜치(또는 artifact)로 올리고, Settings > Pages에서 소스를 그 브랜치로 지정한다. 비공개 저장소의 Pages는 유료 플랜에서만 열리니 공개 여부도 미리 확인한다." };

        code:{...CODE.preview, highlight:[19,20,21]},
      },
      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{
          label:"함정 1 · base path",
          at:"deploy-checklist.sh L1–5",
          caption:"에셋이 전부 404 이고 화면이 하야면 base path 부터 의심한다.",
          changes:[{mark:"read", text:"증상: assets 404"}, {mark:"changed", text:"--base-path=/repo/"}],
        },
        stage:"pitfall",
        pipeline:{ build:"done", upload:"done", cdn:"done", url:"idle" },
        host:{ name:"배포 전 점검", tone:"slate", note:"[1] base path" },
        code:{...CODE.checklist, highlight:[1,2,3,4,5]},
      },
      { ...S5,
        beat:{
          label:"함정 2 · 출력 디렉터리",
          at:"deploy-checklist.sh L7–9",
          caption:"빌드는 성공인데 404 면 출력 디렉터리 이름을 확인한다.",
          changes:[{mark:"read", text:"증상: 빈 페이지"}, {mark:"changed", text:"outputDirectory 오타 점검"}],
        },
        stage:"pitfall",
        pipeline:{ build:"done", upload:"done", cdn:"done", url:"idle" },
        host:{ name:"배포 전 점검", tone:"slate", note:"[2] 출력 디렉터리" },
        code:{...CODE.checklist, highlight:[7,8,9]},
      },
      { ...S5,
        beat:{
          label:"함정 3 · 접근 권한",
          at:"deploy-checklist.sh L11–13",
          caption:"비공개 레포는 Pages 가 열리지 않는다. 사내 공유는 SSO 뒤에 둔다.",
          changes:[{mark:"read", text:"증상: 외부 공유 실패"}, {mark:"changed", text:"공개 여부 · SSO 결정"}],
        },
        stage:"pitfall",
        pipeline:{ build:"done", upload:"done", cdn:"done", url:"idle" },
        host:{ name:"배포 전 점검", tone:"slate", note:"[3] 접근 권한" },
        code:{...CODE.checklist, highlight:[11,12,13]},
      },
      { ...S5,
        beat:{
          label:"최종 확인 — 로컬 재검증",
          at:"deploy-checklist.sh L15–18",
          caption:"올리기 전에 빌드와 로컬 서빙을 한 번에 돌려 산출물을 다시 확인한다.",
          changes:[{mark:"new", text:"build + http-server 연결 실행"}, {mark:"read", text:"localhost:6006 정상"}],
        },
        stage:"pitfall",
        pipeline:{ build:"done", upload:"done", cdn:"done", url:"active" },
        host:{ name:"배포 전 점검", tone:"slate", note:"[4] 로컬 산출물 재검증" },
        code:{...CODE.checklist, highlight:[15,16,17,18]},
      },
      { ...S5,
        beat:{
          label:"공유 준비 완료",
          at:"deploy-checklist.sh L20–21",
          caption:"파이프라인 네 단계가 모두 끝났다. 다음은 Chromatic 으로 시각 회귀까지 자동화한다.",
          changes:[{mark:"new", text:"팀 공용 URL"}, {mark:"read", text:"다음: V-2-2 Chromatic"}],
        },
        stage:"pitfall",
        pipeline:{ build:"done", upload:"done", cdn:"done", url:"done" },
        host:{ name:"점검 완료", tone:"emerald", note:"팀 공용 URL 공유 준비 완료" },
        code:{...CODE.checklist, highlight:[20,21]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 파이프라인 노드 정의 (build → upload → cdn → url)
    // ─────────────────────────────────────────────────────
    const PIPE_NODES = [
      { key: 'build',  emoji: '📦', label: 'build', sub: 'storybook-static/' },
      { key: 'upload', emoji: '⬆️', label: 'upload', sub: 'Actions / Git push' },
      { key: 'cdn',    emoji: '🌐', label: 'CDN',    sub: 'Pages / Vercel edge' },
      { key: 'url',    emoji: '🔗', label: 'URL',    sub: '팀 공용 링크' },
    ];

    const STATE_STYLE = {
      idle:   'bg-slate-100 border-slate-200 text-slate-400',
      active: 'bg-pink-50 border-pink-400 text-pink-700 ring-2 ring-pink-200 animate-pulse',
      done:   'bg-emerald-50 border-emerald-300 text-emerald-700',
    };

    const HOST_TONE = {
      slate:   'bg-slate-100 border-slate-300 text-slate-700',
      pink:    'bg-pink-50 border-pink-300 text-pink-800',
      emerald: 'bg-emerald-50 border-emerald-300 text-emerald-800',
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 배포 파이프라인 시각화
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      const { pipeline, host, stage } = step;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🚀 배포 파이프라인 — 정적 스토리북을 팀에게</h2>
            <span className="text-[10px] text-slate-400 font-mono">{stage}</span>
          </div>

          <div className="bg-slate-50 rounded-lg p-4 min-h-[320px] flex flex-col gap-4">
            {/* 파이프라인 4노드 */}
            <div className="flex items-stretch gap-1">
              {PIPE_NODES.map((n, i) => (
                <React.Fragment key={n.key}>
                  <PipeNode node={n} state={pipeline[n.key]} />
                  {i < PIPE_NODES.length - 1 && (
                    <div className="flex items-center text-slate-300 text-lg font-bold">
                      {pipeline[PIPE_NODES[i + 1].key] === 'idle' ? '→' : '➜'}
                    </div>
                  )}
                </React.Fragment>
              ))}
            </div>

            {/* 배포 대상 호스트 카드 */}
            <div className={`mt-2 p-3 rounded-lg border-2 ${HOST_TONE[host.tone]}`}>
              <div className="text-[10px] uppercase tracking-wider opacity-70">배포 대상</div>
              <div className="text-base font-bold">{host.name}</div>
              <div className="text-xs font-mono mt-0.5 opacity-80">{host.note}</div>
            </div>

            {/* stage별 안내 배너 */}
            <StageBanner stage={stage} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-300"></span>대기</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-500"></span>진행</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>완료</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    function PipeNode({ node, state }) {
      return (
        <div className={`flex-1 rounded-lg border-2 p-2 flex flex-col items-center text-center transition ${STATE_STYLE[state]}`}>
          <span className="text-xl leading-none mb-1">{node.emoji}</span>
          <span className="text-xs font-bold">{node.label}</span>
          <span className="text-[9px] font-mono mt-0.5 opacity-80 break-all">{node.sub}</span>
          <span className="text-[9px] mt-1 font-semibold">
            {state === 'done' ? '✓' : state === 'active' ? '●' : '○'}
          </span>
        </div>
      );
    }

    function StageBanner({ stage }) {
      const MAP = {
        build:   { tone: 'bg-slate-100 border-slate-300 text-slate-700', text: '먼저 로컬에서 build 산출물이 열리는지 확인 — 여기서 깨지면 어디 올려도 깨진다.' },
        ghpages: { tone: 'bg-amber-50 border-amber-300 text-amber-800', text: '함정: GitHub Pages는 하위 경로 서빙 → base path 미설정 시 에셋 404.' },
        vercel:  { tone: 'bg-pink-50 border-pink-300 text-pink-800', text: 'Vercel은 루트 서빙이라 단순 — 빌드 명령과 출력 디렉터리만 맞추면 끝.' },
        preview: { tone: 'bg-pink-50 border-pink-300 text-pink-800', text: 'PR마다 격리 프리뷰 URL — 디자이너/QA가 코드 없이 링크로 검수.' },
        pitfall: { tone: 'bg-emerald-50 border-emerald-300 text-emerald-800', text: 'base path · 출력 디렉터리 · 접근 권한 — 세 함정만 막으면 배포는 안정된다.' },
      };
      const b = MAP[stage] || MAP.build;
      return (
        <div className={`mt-auto p-3 rounded-lg border-2 text-xs font-medium leading-relaxed ${b.tone}`}>
          {b.text}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. CI / 배포 &gt; V-2-1</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">GitHub Pages / Vercel 배포</h1>
                  <p className="text-sm text-slate-500 mt-0.5">정적 스토리북을 무료 호스팅에 올려 팀과 공유</p>
                </div>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500" style={{ width: `${progress}%`, backgroundColor: '#FF4785' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(V-2-2)에서는 <strong>Chromatic 시각 회귀 테스트</strong>로 배포와 UI 검수를 자동화한다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 챕터 목록</a>
              <a href="./V-2-2.html" className="text-pink-700 hover:text-pink-900 font-medium">V-2-2 Chromatic 시각 회귀 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
