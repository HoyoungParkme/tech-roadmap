<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — V-1-2. Chromatic 시각 테스트·배포</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📸</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    V-1-2. Chromatic — 시각 테스트·배포
    학습 목표: 스토리북을 클라우드에 배포하고, 스토리별 스냅샷으로 시각 회귀를 자동 감지하며,
              PR마다 UI diff를 리뷰어가 승인하는 워크플로우를 5단계로 이해한다.
    핵심 비유: "지난 사진과 오늘 사진을 겹쳐 틀린 그림 찾기" — 픽셀 diff → 사람이 승인
    패턴: fastapi v1 — 좌(LiveDataPane: PR→스냅샷→diff→승인 파이프라인) / 우(VSCode CodeViewer: bash/yaml)
    브랜드: Storybook pink (#FF4785 / dark #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   stage: 'push' | 'capture' | 'diff' | 'review' | 'ci' | 'turbosnap'
    //   pipeline: 파이프라인 각 노드의 활성 상태
    //   stories: 스냅샷 대상 스토리 카드 (status로 색 결정)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. PR 푸시 — Chromatic이 스토리북을 클라우드에 올린다',
        desc: 'Chromatic은 스토리북을 만든 팀이 운영하는 전용 클라우드다. 코드를 푸시하면 CI가 스토리북을 빌드해 업로드하고, 브랜치마다 고유한 배포 URL이 생긴다. 앱을 로컬에 띄우지 않아도 리뷰어가 이 URL로 실제 컴포넌트를 눌러볼 수 있어, "내 PC에선 되는데" 문제가 사라진다.',
        stage: 'push',
        active: 'push',
        deployUrl: 'https://pr-142--myapp.chromatic.com',
        stories: [
          { id: 'Button/Primary',   status: 'pending' },
          { id: 'Button/Danger',    status: 'pending' },
          { id: 'Card/Default',     status: 'pending' },
          { id: 'Modal/Open',       status: 'pending' },
        ],
        metric: { snapshots: 0, changed: 0, accepted: 0 },
        code: {
          lang: 'bash',
          filename: 'terminal — first run',
          lines: [
            '# 1) Chromatic CLI 설치 (스토리북 팀 공식 도구)',
            'npm install --save-dev chromatic',
            '',
            '# 2) 프로젝트 토큰으로 최초 배포',
            '#    토큰은 chromatic.com 프로젝트 설정에서 발급',
            'npx chromatic --project-token=chpt_xxxxxxxxxxxx',
            '',
            '# => 스토리북을 빌드하고 클라우드에 업로드',
            '# => Build 1 published',
            '# => View your Storybook at:',
            '# =>   https://pr-142--myapp.chromatic.com',
            '',
            '# 브랜치마다 고유 URL이 생겨 리뷰어가 바로 접속',
            '# 로컬에 앱을 띄우지 않아도 실제 컴포넌트를 클릭 가능',
          ],
          highlight: [2, 6, 10, 11],
        },
      },
      {
        title: 'Step 2. 스냅샷 캡처 — 스토리마다 사진을 한 장씩 찍는다',
        desc: 'Chromatic은 클라우드 브라우저에서 스토리를 하나씩 렌더링하고 화면을 픽셀 이미지로 캡처한다. 스토리 개수 × 브라우저 × 뷰포트만큼 스냅샷이 생기므로, 스토리 400개에 브라우저 2종이면 800장이 찍힌다. 이 숫자가 곧 요금·시간이라, 무엇을 스냅샷할지가 첫 번째 실무 결정이 된다.',
        stage: 'capture',
        active: 'capture',
        deployUrl: 'https://pr-142--myapp.chromatic.com',
        stories: [
          { id: 'Button/Primary',   status: 'captured' },
          { id: 'Button/Danger',    status: 'captured' },
          { id: 'Card/Default',     status: 'captured' },
          { id: 'Modal/Open',       status: 'captured' },
        ],
        metric: { snapshots: 4, changed: 0, accepted: 0 },
        code: {
          lang: 'yaml',
          filename: '.storybook/main.ts (발췌 · 개념)',
          lines: [
            '# 스냅샷 대상과 파라미터를 스토리 단에서 제어',
            '# 예: 특정 스토리는 여러 뷰포트로 캡처',
            '',
            'Button/Primary:',
            '  chromatic:',
            '    viewports: [320, 1200]   # 모바일 + 데스크톱 2장',
            '    delay: 300               # 애니메이션 끝난 뒤 캡처',
            '',
            'Modal/Open:',
            '  chromatic:',
            '    pauseAnimationAtEnd: true  # 깜빡임(flaky) 방지',
            '',
            '# => 스냅샷 수 = 스토리 x 뷰포트 x 브라우저',
            '# => 이 수가 곧 요금과 실행 시간 → 남발 금지',
          ],
          highlight: [4, 5, 6, 9, 10, 11],
        },
      },
      {
        title: 'Step 3. 기준과 diff — 지난 사진과 겹쳐 바뀐 픽셀을 찾는다',
        desc: '이번 스냅샷을 직전에 승인된 "기준(baseline)" 이미지와 픽셀 단위로 비교한다. 달라진 영역이 있으면 그 스토리를 "변경(changed)"으로 표시하는데, 이건 실패가 아니라 "사람 확인이 필요하다"는 신호다. 의도한 변경과 실수로 깨진 UI를 기계는 구분하지 못하기 때문에, 여기서 반드시 사람이 개입한다.',
        stage: 'diff',
        active: 'diff',
        deployUrl: 'https://pr-142--myapp.chromatic.com',
        stories: [
          { id: 'Button/Primary',   status: 'unchanged' },
          { id: 'Button/Danger',    status: 'changed' },
          { id: 'Card/Default',     status: 'unchanged' },
          { id: 'Modal/Open',       status: 'changed' },
        ],
        metric: { snapshots: 4, changed: 2, accepted: 0 },
        code: {
          lang: 'bash',
          filename: 'terminal — CI 요약 출력',
          lines: [
            '# baseline(직전 승인 이미지)과 이번 스냅샷을 비교',
            'npx chromatic --project-token=chpt_xxxxxxxxxxxx',
            '',
            '# => Build 42: 4 snapshots',
            '# =>   2 unchanged   (기준과 동일 → 자동 통과)',
            '# =>   2 changed     (픽셀 차이 → 리뷰 필요)',
            '# =>',
            '# => Button/Danger : 배경색 red-600 -> red-500',
            '# => Modal/Open    : 그림자 오프셋 2px 이동',
            '# =>',
            '# => changed 는 "실패"가 아니라 "사람 확인 대기"',
            '# => 의도한 변경 vs 회귀 버그는 사람이 판단',
            '# => Review changes at: https://chromatic.com/build?...',
          ],
          highlight: [5, 6, 8, 9, 11, 12],
        },
      },
      {
        title: 'Step 4. 리뷰 승인 — 사람이 Accept 하면 새 기준이 된다',
        desc: 'Chromatic 웹에서 변경된 스토리를 좌우 비교로 보고, 의도한 변경이면 Accept, 회귀 버그면 Deny를 누른다. Accept한 스냅샷은 다음 비교의 기준이 되고, 하나라도 미해결이면 PR 체크가 빨간불로 막힌다. 디자이너도 코드 없이 이 화면에서 리뷰할 수 있어, UI 승인이 개발자 병목에서 팀 공동 작업으로 바뀐다.',
        stage: 'review',
        active: 'review',
        deployUrl: 'https://pr-142--myapp.chromatic.com',
        stories: [
          { id: 'Button/Primary',   status: 'unchanged' },
          { id: 'Button/Danger',    status: 'accepted' },
          { id: 'Card/Default',     status: 'unchanged' },
          { id: 'Modal/Open',       status: 'accepted' },
        ],
        metric: { snapshots: 4, changed: 2, accepted: 2 },
        code: {
          lang: 'yaml',
          filename: '.github/workflows/chromatic.yml',
          lines: [
            'name: Chromatic',
            'on: push',
            'jobs:',
            '  visual-test:',
            '    runs-on: ubuntu-latest',
            '    steps:',
            '      - uses: actions/checkout@v4',
            '        with: { fetch-depth: 0 }   # 히스토리 전체 필요',
            '      - uses: actions/setup-node@v4',
            '      - run: npm ci',
            '      - uses: chromaui/action@latest',
            '        with:',
            '          # 토큰은 절대 코드에 쓰지 않고 Secrets 로',
            '          projectToken: ${{ secrets.CHROMATIC_TOKEN }}',
            '          exitZeroOnChanges: false  # 미승인 변경 = PR 차단',
            '',
            '# => 리뷰어가 Accept 하기 전엔 PR 체크가 빨간불',
            '# => Accept 된 스냅샷이 다음 빌드의 baseline 이 됨',
          ],
          highlight: [8, 11, 13, 14, 15],
        },
      },
      {
        title: 'Step 5. TurboSnap — 바뀐 것만 다시 찍어 비용·시간을 줄인다',
        desc: 'PR에서 CSS 한 줄만 고쳐도 스토리 전체를 다시 찍으면 요금과 대기 시간이 폭발한다. TurboSnap은 Git diff와 의존성 그래프를 분석해 실제로 영향받은 스토리만 스냅샷하고, 나머지는 이전 결과를 재사용한다. 남은 실무 함정은 flaky(폰트·애니메이션·시간에 따라 흔들리는 스냅샷)와 승인 병목이니, delay·모킹으로 안정화하고 리뷰 담당을 정해두면 파이프라인이 매끄럽게 돈다.',
        stage: 'turbosnap',
        active: 'turbosnap',
        deployUrl: 'https://main--myapp.chromatic.com',
        stories: [
          { id: 'Button/Primary',   status: 'skipped' },
          { id: 'Button/Danger',    status: 'captured' },
          { id: 'Card/Default',     status: 'skipped' },
          { id: 'Modal/Open',       status: 'skipped' },
        ],
        metric: { snapshots: 1, changed: 1, accepted: 0 },
        code: {
          lang: 'bash',
          filename: 'terminal — TurboSnap 적용',
          lines: [
            '# 변경 파일과 의존성 그래프로 영향받은 스토리만 캡처',
            'npx chromatic \\',
            '  --project-token=$CHROMATIC_TOKEN \\',
            '  --only-changed            # TurboSnap 활성화',
            '',
            '# => Build 43: 1 snapshot captured, 3 reused',
            '# =>   Button/Danger  : 재촬영 (Button.css 변경 감지)',
            '# =>   나머지 3개      : 이전 스냅샷 재사용 → 요금 0',
            '',
            '# 실무 함정 체크리스트',
            '#   - flaky   : delay / pauseAnimationAtEnd 로 안정화',
            '#   - 토큰    : Secrets 로만 주입, 로그에 찍히지 않게',
            '#   - 병목    : 리뷰 담당·SLA 정해 승인 지연 방지',
            '#   - 비용    : --only-changed 로 스냅샷 총량 관리',
          ],
          highlight: [2, 3, 4, 6, 7, 8],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 스토리 스냅샷 상태별 스타일
    // ─────────────────────────────────────────────────────
    const STATUS_STYLE = {
      pending:   { dot: 'bg-slate-300',   text: 'text-slate-400', label: '대기',   badge: 'bg-slate-100 text-slate-500' },
      captured:  { dot: 'bg-sky-400',     text: 'text-sky-600',   label: '캡처됨', badge: 'bg-sky-100 text-sky-700' },
      unchanged: { dot: 'bg-emerald-500', text: 'text-emerald-600', label: '동일', badge: 'bg-emerald-100 text-emerald-700' },
      changed:   { dot: 'bg-amber-500',   text: 'text-amber-600', label: '변경', badge: 'bg-amber-100 text-amber-700' },
      accepted:  { dot: 'bg-emerald-600', text: 'text-emerald-700', label: '승인', badge: 'bg-emerald-100 text-emerald-800' },
      skipped:   { dot: 'bg-slate-300',   text: 'text-slate-400', label: '재사용', badge: 'bg-slate-100 text-slate-500' },
    };

    // 파이프라인 노드 정의 (좌→우 흐름)
    const PIPELINE = [
      { id: 'push',      icon: '⬆️', label: 'PR 푸시' },
      { id: 'capture',   icon: '📸', label: '스냅샷' },
      { id: 'diff',      icon: '🔍', label: 'diff 비교' },
      { id: 'review',    icon: '✅', label: '리뷰 승인' },
    ];

    // ─────────────────────────────────────────────────────
    // LiveDataPane — PR → 스냅샷 → diff → 승인 파이프라인 시각화
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const { active, stories, metric, deployUrl, stage } = step;
      const activeIdx = PIPELINE.findIndex((n) => n.id === active);
      const isTurbo = stage === 'turbosnap';

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📸 Chromatic 파이프라인 — 스냅샷·diff·승인</h2>
            <span className="text-[10px] text-slate-400 font-mono">{stage}</span>
          </div>

          {/* 파이프라인 흐름 */}
          <div className="bg-slate-50 rounded-lg p-4">
            <div className="flex items-center justify-between">
              {PIPELINE.map((node, i) => {
                const done = i < activeIdx || (isTurbo && true);
                const isActive = node.id === active || (isTurbo && node.id === 'capture');
                const tone = isActive
                  ? 'bg-pink-100 border-pink-400 text-pink-700 scale-110 shadow'
                  : done
                  ? 'bg-emerald-50 border-emerald-300 text-emerald-600'
                  : 'bg-white border-slate-200 text-slate-400';
                return (
                  <React.Fragment key={node.id}>
                    <div className={`flex flex-col items-center gap-1 rounded-lg border-2 px-2.5 py-2 transition-all ${tone} ${isActive ? 'animate-pulse' : ''}`}>
                      <span className="text-lg leading-none">{node.icon}</span>
                      <span className="text-[10px] font-bold whitespace-nowrap">{node.label}</span>
                    </div>
                    {i < PIPELINE.length - 1 && (
                      <span className={`text-lg ${i < activeIdx ? 'text-emerald-400' : 'text-slate-300'}`}>&rarr;</span>
                    )}
                  </React.Fragment>
                );
              })}
            </div>
            {isTurbo && (
              <div className="mt-3 text-center text-[11px] font-bold text-pink-700 bg-pink-50 border border-pink-200 rounded py-1">
                ⚡ TurboSnap — 바뀐 스토리 1개만 재촬영, 3개 재사용
              </div>
            )}
          </div>

          {/* 배포 URL */}
          <div className="mt-4 flex items-center gap-2 bg-slate-900 rounded-lg px-3 py-2">
            <span className="text-[10px] text-slate-400 font-mono">deploy</span>
            <span className="text-xs text-emerald-300 font-mono truncate">{deployUrl}</span>
          </div>

          {/* 스토리 스냅샷 카드 */}
          <div className="mt-4">
            <div className="text-[11px] font-bold text-slate-600 mb-2">스토리별 스냅샷 상태</div>
            <div className="grid grid-cols-2 gap-2">
              {stories.map((s) => (
                <SnapshotCard key={s.id} story={s} />
              ))}
            </div>
          </div>

          {/* 메트릭 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="스냅샷" value={`${metric.snapshots}`} tone="sky" />
            <Metric label="변경 감지" value={`${metric.changed}`} tone={metric.changed > 0 ? 'amber' : 'slate'} />
            <Metric label="승인" value={`${metric.accepted}`} tone={metric.accepted > 0 ? 'emerald' : 'slate'} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>동일/승인</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>변경(확인 필요)</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-sky-400"></span>캡처</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    // 스토리 스냅샷 카드 (좌: 기준 / 우: 이번) — changed면 diff 강조
    function SnapshotCard({ story }) {
      const sty = STATUS_STYLE[story.status];
      const isChanged = story.status === 'changed' || story.status === 'accepted';
      return (
        <div className={`bg-white border rounded-md p-2 ${isChanged ? 'border-amber-300' : 'border-slate-200'}`}>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[10px] text-slate-500 font-mono truncate">{story.id}</span>
            <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${sty.badge}`}>{sty.label}</span>
          </div>
          <div className="flex items-center gap-1">
            <MiniShot label="기준" tone="base" />
            <span className="text-slate-300 text-xs">{isChanged ? '≠' : '='}</span>
            <MiniShot label="이번" tone={story.status} changed={isChanged} />
          </div>
        </div>
      );
    }

    // 스냅샷 썸네일 (개념적 이미지)
    function MiniShot({ label, tone, changed }) {
      const bg = changed ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-200';
      return (
        <div className={`flex-1 rounded border ${bg} h-9 flex flex-col items-center justify-center`}>
          <span className={`w-6 h-1.5 rounded-full ${changed ? 'bg-amber-400' : 'bg-slate-300'}`}></span>
          <span className="text-[8px] text-slate-400 mt-1">{label}</span>
        </div>
      );
    }

    function Metric({ label, value, tone }) {
      const tones = {
        sky:     'bg-sky-50 border-sky-300 text-sky-700',
        amber:   'bg-amber-50 border-amber-300 text-amber-700',
        emerald: 'bg-emerald-50 border-emerald-300 text-emerald-700',
        slate:   'bg-slate-50 border-slate-200 text-slate-500',
      };
      return (
        <div className={`p-2 rounded border-2 ${tones[tone]}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-lg font-bold tabular-nums">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js (bash / yaml)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
          setRenderedLines(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];
      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-3">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. CI / 배포 &gt; V-1-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Chromatic — 시각 테스트·배포</h1>
                  <p className="text-sm text-slate-500 mt-0.5">스토리북 전용 클라우드, 시각 회귀와 리뷰를 자동화</p>
                </div>
              </div>
              {/* 진행바 */}
              <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500" style={{ width: `${progress}%`, backgroundColor: '#FF4785' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(V-2-1)에서는 <strong>스토리북 정적 빌드를 GitHub Pages·S3 등 사내 URL로 배포</strong>하는 방법을 다룬다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./V-2-1.html" className="text-pink-700 hover:text-pink-900 font-medium">V-2-1 정적 빌드 배포 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
