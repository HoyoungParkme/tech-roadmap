<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — V-1-1. storybook build 정적 빌드</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    V-1-1. storybook build — 정적 빌드
    학습 목표: storybook build 로 스토리들을 정적 HTML/JS 번들(storybook-static/)로 컴파일해
              어떤 호스팅에도 배포할 수 있게 만드는 과정을 5단계로 이해한다.
    핵심 비유: "진열대(개발 서버)를 통째로 사진 찍어 카탈로그 책자로 인쇄" — 서버 없이도 열람 가능
    패턴: fastapi v1 — 좌(LiveDataPane: 빌드 파이프라인 SVG) / 우(VSCode CodeViewer)
    브랜드: Storybook pink (#FF4785 / dark #C5306A)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   phase: 'command' | 'config' | 'assets' | 'output' | 'preview'
    //   progress: 빌드 진행률(%) — 파이프라인 게이지
    //   files: storybook-static/ 안에 쌓이는 산출물 목록
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. storybook build — 한 줄로 정적 사이트를 굽는다',
        desc: '개발 중에는 storybook dev 가 메모리에서 스토리를 실시간으로 서빙하지만, 남에게 보여주려면 서버가 필요하다. storybook build 는 모든 스토리를 미리 컴파일해 storybook-static/ 폴더 하나로 뽑아낸다. 이 폴더는 순수 HTML/CSS/JS라 Node 없이 어떤 정적 호스팅에도 그대로 올라간다. 그래서 CI에서 이 한 줄만 돌리면 배포 산출물이 준비된다.',
        phase: 'command',
        progress: 5,
        files: [],
        metrics: { built: false, size: '—', static: true },
        code: {
          lang: 'bash',
          filename: 'terminal — build',
          lines: [
            '# package.json 에 이미 스크립트가 등록돼 있다',
            '#   "scripts": { "build-storybook": "storybook build" }',
            '',
            '# 실행 — 개발 서버가 아니라 "정적 빌드"',
            'npm run build-storybook',
            '# 또는 직접',
            'npx storybook build',
            '',
            '# => storybook-static/ 폴더가 생성된다 (기본 출력 경로)',
            '# => 결과물은 순수 HTML/JS — Node 런타임 불필요',
            '',
            '# 출력 경로를 바꾸고 싶으면 -o',
            'npx storybook build -o dist/storybook',
            '',
            '# 자주 쓰는 옵션',
            '#   --quiet        로그 최소화 (CI 로그 깔끔)',
            '#   --test         테스트용 경량 빌드 (docs/addon 일부 제외)',
            '#   -o <dir>       출력 디렉터리 지정',
          ],
          highlight: [4, 5, 6, 7, 9, 10],
        },
      },
      {
        title: 'Step 2. main.js — 무엇을 어떻게 빌드할지 정의',
        desc: '빌드가 어떤 파일을 스토리로 인식할지는 .storybook/main.js 의 stories 글롭이 결정한다. 글롭이 좁으면 방금 만든 스토리가 산출물에서 통째로 누락되는데, 로컬 dev에서는 캐시로 보이다가 배포본에서만 사라져 디버깅이 까다롭다. addons는 빌드 시 함께 번들되므로 여기 등록을 빠뜨리면 Controls·Docs 같은 기능이 배포본에서 동작하지 않는다. framework 필드는 Vite/Webpack 등 번들러를 고르는 스위치다.',
        phase: 'config',
        progress: 25,
        files: [],
        metrics: { built: false, size: '—', static: true },
        code: {
          lang: 'javascript',
          filename: '.storybook/main.js',
          lines: [
            "import type { StorybookConfig } from '@storybook/react-vite';",
            '',
            'const config = {',
            '  // 어떤 파일을 스토리로 인식할지 — 빌드 대상의 뿌리',
            "  stories: ['../src/**/*.stories.@(js|jsx|ts|tsx)'],",
            '',
            '  // 빌드 시 함께 번들되는 애드온 (누락 => 배포본에서 기능 사라짐)',
            '  addons: [',
            "    '@storybook/addon-essentials',  // Controls · Docs · Actions",
            "    '@storybook/addon-a11y',",
            '  ],',
            '',
            '  // 번들러/렌더러 선택 스위치',
            "  framework: { name: '@storybook/react-vite', options: {} },",
            '',
            '  // 자동 문서 페이지 생성',
            "  docs: { autodocs: 'tag' },",
            '};',
            'export default config;',
            '',
            '# => stories 글롭을 벗어난 파일은 산출물에서 통째로 빠진다',
          ],
          highlight: [4, 5, 7, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 3. 정적 자산 — 폰트·이미지를 산출물에 함께 담기',
        desc: '스토리가 참조하는 로고·폰트·목업 이미지는 자동으로 번들되지 않는다. staticDirs 에 등록한 폴더는 빌드 시 storybook-static/ 루트로 그대로 복사돼 절대경로(/logo.svg)로 접근할 수 있다. 이걸 빠뜨리면 로컬에서는 public 서버가 채워주다가 배포본에서만 이미지가 깨진다. base(경로) 설정도 중요한데, 하위 경로(/design-system/)에 배포하면서 절대경로를 쓰면 자산 404가 난다.',
        phase: 'assets',
        progress: 45,
        files: ['favicon.ico', 'logo.svg', 'fonts/Pretendard.woff2'],
        metrics: { built: false, size: '~1.2 MB', static: true },
        code: {
          lang: 'javascript',
          filename: '.storybook/main.js — staticDirs',
          lines: [
            'const config = {',
            "  stories: ['../src/**/*.stories.@(js|jsx|ts|tsx)'],",
            "  framework: { name: '@storybook/react-vite', options: {} },",
            '',
            '  // public/ 폴더를 산출물 루트로 그대로 복사',
            "  staticDirs: ['../public'],",
            '',
            '  // 하위 경로 배포 시 base 를 맞춰야 자산 404 안 남',
            '  //   예) https://team.io/design-system/ 에 배포하면',
            "  //   viteFinal 로 base: '/design-system/' 지정",
            '  async viteFinal(cfg) {',
            "    cfg.base = process.env.SB_BASE || '/';",
            '    return cfg;',
            '  },',
            '};',
            'export default config;',
            '',
            '# public/logo.svg  => 산출물 루트 /logo.svg 로 복사',
            '# 스토리에서는 <img src="/logo.svg"> 로 참조',
          ],
          highlight: [5, 6, 8, 11, 12, 13],
        },
      },
      {
        title: 'Step 4. 산출물 구조 — storybook-static/ 안을 열어보기',
        desc: 'index.html 이 진입점이고, iframe.html 이 실제 스토리를 렌더하는 캔버스다. 스토리 목록은 index.json(구 stories.json)에 색인돼 검색·딥링크에 쓰인다. assets 폴더에는 해시가 붙은 청크가 쌓이는데, 이 통짜 번들이 커지면 첫 로딩이 느려진다 — 무거운 애드온 정리와 코드 스플리팅이 대응책이다. 이 폴더 전체가 곧 배포 단위이므로, CI 아티팩트로 올려 다음 잡에서 그대로 배포한다.',
        phase: 'output',
        progress: 85,
        files: ['index.html', 'iframe.html', 'index.json', 'assets/main-a1b2.js', 'assets/preview-c3d4.js', 'logo.svg'],
        metrics: { built: true, size: '3.4 MB', static: true },
        code: {
          lang: 'bash',
          filename: 'terminal — 산출물 확인',
          lines: [
            '# 빌드가 끝나면 폴더 구조를 확인한다',
            'ls -1 storybook-static/',
            '',
            '# storybook-static/',
            '#   index.html          <- 진입점 (배포 루트)',
            '#   iframe.html         <- 스토리를 렌더하는 캔버스',
            '#   index.json          <- 스토리 색인 (검색/딥링크)',
            '#   assets/',
            '#     main-a1b2.js       <- Manager UI 번들',
            '#     preview-c3d4.js    <- Preview(스토리) 번들',
            '#   logo.svg  favicon.ico  <- staticDirs 로 복사된 자산',
            '',
            '# 번들 용량 점검 (커지면 첫 로딩이 느려짐)',
            'du -sh storybook-static/',
            '# => 3.4M    storybook-static/',
            '',
            '# 이 폴더 전체가 배포 단위 = CI 아티팩트로 업로드',
          ],
          highlight: [4, 5, 6, 7, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 5. 미리보기 & 함정 — 그리고 다음 단계',
        desc: '배포 전 반드시 로컬에서 산출물을 정적 서버로 띄워 확인한다 — dev 서버에서 멀쩡하던 것이 정적 빌드에서만 깨지는 경우가 흔하기 때문이다. 대표 함정은 애드온 미등록, base 경로 불일치, 커진 번들, 그리고 빌드 시점에 고정되는 환경변수다. Vite는 STORYBOOK_ 접두사 변수만 클라이언트에 주입하며, 이 값은 런타임이 아니라 빌드 순간에 박제된다. 다음 단계에서는 이 산출물을 Chromatic·GitHub Pages로 실제 배포한다.',
        phase: 'preview',
        progress: 100,
        files: ['index.html', 'iframe.html', 'index.json', 'assets/main-a1b2.js', 'assets/preview-c3d4.js', 'logo.svg'],
        metrics: { built: true, size: '3.4 MB', static: true },
        code: {
          lang: 'bash',
          filename: 'terminal — preview & 함정',
          lines: [
            '# 1) 로컬에서 산출물을 정적 서버로 미리보기',
            'npx http-server storybook-static -p 6006',
            '#   => http://localhost:6006 에서 배포본 그대로 확인',
            '#   (npx serve storybook-static 도 동일)',
            '',
            '# 2) 자주 밟는 함정 체크리스트',
            '#   [ ] 애드온을 main.js addons 에 등록했는가',
            '#   [ ] 하위 경로 배포면 base 를 맞췄는가',
            '#   [ ] 번들이 너무 커지지 않았는가 (무거운 addon 정리)',
            '#   [ ] 환경변수는 STORYBOOK_ 접두사만 주입된다',
            '',
            '# 3) 환경변수는 "빌드 시점"에 박제된다 (런타임 X)',
            'STORYBOOK_API_URL=https://api.team.io npm run build-storybook',
            '#   => 코드에서 process.env.STORYBOOK_API_URL 로 접근',
            '',
            '# 다음(V-1-2): 이 storybook-static/ 를',
            '#   Chromatic / GitHub Pages 로 실제 배포한다',
          ],
          highlight: [1, 2, 6, 7, 8, 9, 10, 12, 13],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 빌드 파이프라인 (소스 스토리 → build → storybook-static/)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const { phase, progress, files, metrics } = step;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📦 정적 빌드 파이프라인 — storybook build</h2>
            <span className="text-[10px] text-slate-400 font-mono">{phase}</span>
          </div>

          <div className="bg-slate-50 rounded-lg p-4 min-h-[320px] flex flex-col gap-3">
            <PipelineView phase={phase} progress={progress} />
            <StaticFolderView files={files} phase={phase} />
          </div>

          {/* 진행 게이지 */}
          <div className="mt-4">
            <div className="flex items-center justify-between text-[11px] text-slate-500 mb-1">
              <span>빌드 진행률</span>
              <span className="font-mono font-bold tabular-nums" style={{ color: '#C5306A' }}>{progress}%</span>
            </div>
            <div className="h-2.5 w-full bg-slate-200 rounded-full overflow-hidden">
              <div
                className="h-full rounded-full transition-all duration-700"
                style={{ width: `${progress}%`, backgroundColor: '#FF4785' }}
              />
            </div>
          </div>

          {/* 메트릭 */}
          <div className="grid grid-cols-3 gap-2 mt-4 text-center">
            <Metric label="상태" value={metrics.built ? '✓ 완료' : '빌드 중'} good={metrics.built} />
            <Metric label="산출물 크기" value={metrics.size} good={metrics.built} />
            <Metric label="정적 배포" value={metrics.static ? '✓ 가능' : '✗'} good={metrics.static} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-500"></span>빌드 단계</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>산출 완료</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-300"></span>대기</span>
            <span className="flex items-center gap-1 ml-auto">brand <span className="font-mono">#FF4785</span></span>
          </div>
        </div>
      );
    }

    // 파이프라인: 소스 → 번들러 → 산출물
    function PipelineView({ phase, progress }) {
      const order = ['command', 'config', 'assets', 'output', 'preview'];
      const activeIdx = order.indexOf(phase);
      const nodes = [
        { key: 'src', label: '.stories.tsx', emoji: '📝', sub: '소스 스토리' },
        { key: 'bundle', label: 'Vite / Webpack', emoji: '⚙️', sub: '컴파일·번들' },
        { key: 'out', label: 'storybook-static/', emoji: '📦', sub: '정적 산출물' },
      ];
      // phase → 파이프라인상 활성 노드
      const litUpto = phase === 'command' ? 0 : phase === 'config' ? 1 : phase === 'assets' ? 1 : 2;
      return (
        <div>
          <div className="text-[11px] font-bold text-slate-600 mb-2">
            스토리를 정적 번들로 컴파일 — 서버 없이 열람 가능
          </div>
          <div className="flex items-stretch justify-between gap-2">
            {nodes.map((n, i) => (
              <React.Fragment key={n.key}>
                <div
                  className={`flex-1 rounded-lg border-2 p-2 text-center transition-all duration-500 ${
                    i <= litUpto
                      ? 'bg-pink-50 border-pink-400'
                      : 'bg-white border-slate-200 opacity-60'
                  }`}
                >
                  <div className={`text-xl ${i === 1 && phase !== 'command' && litUpto >= 1 && progress < 100 ? 'animate-spin-slow' : ''}`}>{n.emoji}</div>
                  <div className="text-[11px] font-mono font-bold text-slate-700 mt-0.5 break-all">{n.label}</div>
                  <div className="text-[9px] text-slate-500">{n.sub}</div>
                </div>
                {i < nodes.length - 1 && (
                  <div className="flex items-center">
                    <span className={`text-lg ${i < litUpto ? 'text-pink-500' : 'text-slate-300'}`}>→</span>
                  </div>
                )}
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    // storybook-static/ 폴더가 채워지는 모습
    function StaticFolderView({ files, phase }) {
      const done = phase === 'output' || phase === 'preview';
      return (
        <div className="flex-1 mt-1">
          <div className="flex items-center gap-2 mb-1.5">
            <span className="text-sm">📁</span>
            <span className="text-[11px] font-mono font-bold text-slate-700">storybook-static/</span>
            {done && <span className="text-[9px] bg-emerald-100 text-emerald-700 rounded px-1.5 py-0.5 font-bold">배포 준비 완료</span>}
          </div>
          {files.length === 0 ? (
            <div className="text-[11px] text-slate-400 italic pl-6 py-4 border border-dashed border-slate-200 rounded-lg text-center">
              아직 비어 있음 — 빌드가 파일을 채운다
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-1.5 pl-1">
              {files.map((f, i) => (
                <div
                  key={f}
                  className={`flex items-center gap-1.5 text-[10px] font-mono rounded px-2 py-1 border ${
                    done ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-white border-slate-200 text-slate-600'
                  }`}
                  style={{ animation: `fadeIn 0.4s ease ${i * 0.06}s both` }}
                >
                  <span>{f.endsWith('/') ? '📂' : '📄'}</span>
                  <span className="truncate">{f}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function Metric({ label, value, good }) {
      const tone = good ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-amber-50 border-amber-300 text-amber-700';
      return (
        <div className={`p-2 rounded border-2 ${tone}`}>
          <div className="text-[9px] uppercase opacity-80">{label}</div>
          <div className="text-sm font-bold tabular-nums">{value}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. CI / 배포 &gt; Chapter 1. 정적 빌드</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">storybook build — 정적 빌드</h1>
                  <p className="text-sm text-slate-500 mt-0.5">스토리북을 정적 사이트로 빌드해 어디든 배포</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(V-1-2)에서는 이 <strong>storybook-static/ 산출물을 Chromatic·GitHub Pages</strong>로 실제 배포한다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]"
                style={{ backgroundColor: '#FF4785' }}
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./V-1-2.html" className="text-pink-700 hover:text-pink-900 font-medium">V-1-2 Chromatic·Pages 배포 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 2s linear infinite; display: inline-block; }
  </style>
</body>
</html>
