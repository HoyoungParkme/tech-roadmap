    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

      },
      { ...S3,
        beat:{ label:"복붙이 남는다", at:"src/components/ThemedButton.stories.tsx L23–24",
               caption:"이 Story 하나는 고쳤지만, Story 를 새로 만들 때마다 같은 decorator 를 복사해야 한다.",
               changes:[{mark:"read", text:"useContext 정상 동작"},
                        {mark:"changed", text:"Story 마다 복붙 필요"}] },
        layers:[
          {"id":"component","label":"ThemedButton","on":true,"type":"comp","color":"pink"},
          {"id":"render","label":"render() 추가 props","on":true,"type":"render","color":"amber"},
          {"id":"story-dec","label":"Story decorator: ThemeProvider","on":true,"type":"decorator","color":"rose"},
        ],
        error:null,
        code:{...CODE.storyDecorator, highlight:[23,24]},
      },
      // ── Step 4 ────────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:"preview.ts 로 자리 옮김", at:".storybook/preview.ts L1–3",
               caption:".storybook/preview.ts 에서 ThemeProvider 와 BrowserRouter 를 가져온다. 여기 적은 설정은 모든 Story 에 걸린다.",
               changes:[{mark:"new", text:"preview.ts 파일"},
                        {mark:"read", text:"ThemeProvider · BrowserRouter"}] },
        layers:[
          {"id":"component","label":"ThemedButton (속)","on":true,"type":"comp","color":"pink"},
          {"id":"render","label":"render() 추가 props","on":true,"type":"render","color":"amber"},
          {"id":"story-dec","label":"Story decorator: ThemeProvider","on":true,"type":"decorator","color":"rose"},
        ],
        error:null,
        code:{...CODE.globalDecorator, highlight:[1,2,3]},
      },
      { ...S4,
        beat:{ label:"전역 decorators 열기", at:".storybook/preview.ts L5–7",
               caption:"preview 객체에 decorators 배열을 연다. 아직 비어 있어 감싸는 것은 없다.",
               changes:[{mark:"new", text:"preview.decorators"}] },
        layers:[
          {"id":"component","label":"ThemedButton (속)","on":true,"type":"comp","color":"pink"},
          {"id":"render","label":"render() 추가 props","on":true,"type":"render","color":"amber"},
          {"id":"story-dec","label":"Story decorator: ThemeProvider","on":true,"type":"decorator","color":"rose"},
          {"id":"global-dec","label":"global decorator (preview.ts)","on":false,"type":"decorator","color":"sky"},
        ],
        error:null,
        code:{...CODE.globalDecorator, highlight:[5,6,7]},
      },
      { ...S4,
        beat:{ label:"가장 바깥 껍질", at:".storybook/preview.ts L9–10",
               caption:"(Story) => <ThemeProvider ...> 가 모든 Story 를 감싸는 제일 바깥 껍질이 된다.",
               changes:[{mark:"new", text:"global ThemeProvider"}] },
        layers:[
          {"id":"component","label":"ThemedButton (속)","on":true,"type":"comp","color":"pink"},
          {"id":"render","label":"render() 추가 props","on":true,"type":"render","color":"amber"},
          {"id":"story-dec","label":"Story decorator: ThemeProvider","on":true,"type":"decorator","color":"rose"},
          {"id":"global-dec","label":"global decorator (preview.ts)","on":true,"type":"decorator","color":"sky"},
        ],
        error:null,
        code:{...CODE.globalDecorator, highlight:[9,10]},
      },
      { ...S4,
        beat:{ label:"Router 껍질도 함께", at:".storybook/preview.ts L11–14",
               caption:"BrowserRouter 를 한 겹 더 씌우고 그 안에 <Story /> 를 둔다. meta decorator 자리는 그 사이에 놓인다.",
               changes:[{mark:"new", text:"BrowserRouter 껍질"},
                        {mark:"read", text:"<Story /> 는 가장 안쪽"}] },
        layers:[
          {"id":"component","label":"ThemedButton (속)","on":true,"type":"comp","color":"pink"},
          {"id":"render","label":"render() 추가 props","on":true,"type":"render","color":"amber"},
          {"id":"story-dec","label":"Story decorator: ThemeProvider","on":true,"type":"decorator","color":"rose"},
          {"id":"meta-dec","label":"meta decorator (파일 공통)","on":false,"type":"decorator","color":"violet"},
          {"id":"global-dec","label":"global decorator (preview.ts)","on":true,"type":"decorator","color":"sky"},
        ],
        error:null,
        code:{...CODE.globalDecorator, highlight:[11,12,13,14]},
      },
      { ...S4,
        beat:{ label:"적용 순서 확인", at:".storybook/preview.ts L19–24",
               caption:"안에서 밖으로 render → story decorator → meta decorator → global decorator 순으로 겹친다.",
               changes:[{mark:"read", text:"① render ② story ③ meta ④ global"}] },
        layers:[
          {"id":"component","label":"ThemedButton (속)","on":true,"type":"comp","color":"pink"},
          {"id":"render","label":"render() 추가 props","on":true,"type":"render","color":"amber"},
          {"id":"story-dec","label":"Story decorator (생략 가능)","on":true,"type":"decorator","color":"rose"},
          {"id":"meta-dec","label":"meta decorator (파일 공통)","on":false,"type":"decorator","color":"violet"},
          {"id":"global-dec","label":"global decorator (preview.ts)","on":true,"type":"decorator","color":"sky"},
        ],
        error:null,
        code:{...CODE.globalDecorator, highlight:[19,20,21,22,23,24]},
      },
      { ...S4,
        beat:{ label:"개별 복붙 제거", at:".storybook/preview.ts L26–27",
               caption:"글로벌 껍질 하나로 끝나서 Story 파일의 ThemeProvider 는 지워도 된다. 새 Story 도 그냥 만들면 된다.",
               changes:[{mark:"gone", text:"Story 마다 decorator 복붙"},
                        {mark:"changed", text:"새 Story 는 설정 없이 동작"}] },
        layers:[
          {"id":"component","label":"ThemedButton (속)","on":true,"type":"comp","color":"pink"},
          {"id":"render","label":"render() 추가 props","on":true,"type":"render","color":"amber"},
          {"id":"story-dec","label":"Story decorator (생략 가능)","on":false,"type":"decorator","color":"rose"},
          {"id":"meta-dec","label":"meta decorator (파일 공통)","on":false,"type":"decorator","color":"violet"},
          {"id":"global-dec","label":"global decorator (preview.ts)","on":true,"type":"decorator","color":"sky"},
        ],
        error:null,
        code:{...CODE.globalDecorator, highlight:[26,27]},
      },
    ];

    const LAYER_COLOR = {
      pink:   { on: 'bg-pink-100 border-pink-400 text-pink-800',     off: 'bg-slate-100 border-slate-300 text-slate-400' },
      amber:  { on: 'bg-amber-100 border-amber-400 text-amber-800',   off: 'bg-slate-100 border-slate-300 text-slate-400' },
      rose:   { on: 'bg-rose-100 border-rose-400 text-rose-800',      off: 'bg-slate-100 border-slate-300 text-slate-400' },
      violet: { on: 'bg-violet-100 border-violet-400 text-violet-800', off: 'bg-slate-100 border-slate-300 text-slate-400' },
      sky:    { on: 'bg-sky-100 border-sky-400 text-sky-800',          off: 'bg-slate-100 border-slate-300 text-slate-400' },
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 양파 껍질 레이어
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      const { layers, error } = step;
      // 양파: 첫 element가 가장 안쪽 → 바깥으로 감싸야 하므로 reverse
      const outer = [...layers].reverse();

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🧅 양파 껍질 — 컴포넌트 감싸기</h2>
            <span className="text-[10px] text-slate-400 font-mono">render / decorators</span>
          </div>

          {/* 양파 레이어 (바깥 → 안쪽으로 들여쓰기) */}
          <div className="space-y-2 min-h-[280px]">
            {outer.map((l, i) => {
              const sty = LAYER_COLOR[l.color][l.on ? 'on' : 'off'];
              const indent = i * 10;
              return (
                <div key={l.id}
                  className={`rounded-lg border-2 p-3 transition-all duration-500 ${sty} ${l.on ? '' : 'opacity-50 line-through'}`}
                  style={{ marginLeft: `${indent}px`, marginRight: `${indent}px` }}
                >
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold">
                      {l.type === 'comp'      ? '🧩' : ''}
                      {l.type === 'render'    ? '🎨' : ''}
                      {l.type === 'decorator' ? '🧅' : ''}
                      {' '}{l.label}
                    </span>
                    <span className="text-[10px] opacity-70">{l.type}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* 에러 박스 */}
          {error && (
            <div className="mt-4 p-3 rounded-lg bg-red-50 border-2 border-red-400 animate-pulse">
              <div className="text-xs font-bold text-red-800">💥 런타임 에러</div>
              <div className="text-[11px] text-red-700 font-mono mt-1">{error}</div>
            </div>
          )}
          {!error && (
            <div className="mt-4 p-3 rounded-lg bg-emerald-50 border-2 border-emerald-300">
              <div className="text-xs font-bold text-emerald-800">✓ 컨텍스트 채워짐 — 정상 렌더</div>
            </div>
          )}

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">🧩 컴포넌트</span>
            <span className="flex items-center gap-1">🎨 render</span>
            <span className="flex items-center gap-1">🧅 decorator</span>
            <span className="flex items-center gap-1 ml-auto">바깥 → 안 적용</span>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        setRenderedLines(codeRef.current.innerHTML.split('\n'));
      }, [code]);
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>
          <pre className="hidden"><code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code></pre>
          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const hi = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} className={`flex hover:bg-slate-800/50 ${hi ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => setStepIdx((i) => {
        if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
        return i + 1;
      });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Storybook 기초 &gt; Chapter 2. Render &amp; Decorator</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Render와 Decorator</h1>
                  <p className="text-sm text-slate-500 mt-0.5">양파 껍질 — ThemeProvider/Router 같은 컨텍스트 감싸기</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 Part I 완료! 다음(II-1-1)에서 <strong>Controls 패널</strong> — argTypes로 props 리모컨 만들기로 Part II 시작
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]" style={{ backgroundColor: '#FF4785' }}>
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-2-1.html" className="text-slate-500 hover:text-slate-700">&larr; I-2-1</a>
              <a href="../part2/II-1-1.html" className="text-pink-700 hover:text-pink-900 font-medium">II-1-1 Controls &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
