<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — I-2-1. Args — Story의 props를 데이터로</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    I-2-1. Args — Story의 props를 데이터로
    학습 목표: args가 단순 props 별칭이 아니라 "데이터로 표현된 상태"이며,
              하나의 args 객체가 Story 렌더 / Controls 패널 / Docs 표 / Actions를
              동시에 구동한다는 흐름을 4단계로 이해한다.
    핵심 비유: "주문서" — args = 음식 주문서. 주방(컴포넌트)이 같은 주문서를 받아 음식(UI)을 만들고,
              종업원(Controls)이 주문서를 수정할 수 있고, 영수증(Docs)에 그대로 인쇄된다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   args:          현재 args 객체 (Button props)
    //   feeds:         args가 흘러가는 대상 — [{key, label, ready}]
    //                  story / controls / docs / actions
    //   highlight:     현재 단계에서 강조할 args 키
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. args — props를 객체로 적기',
        desc: 'Story 객체 안 args 키에 props를 적는다. 단순해 보이지만 이 한 객체가 4가지 채널을 동시에 먹인다. 먼저 가장 기본 — Story 렌더에 그대로 props로 전달된다.',
        args: { variant: 'primary', children: 'Save', disabled: false },
        feeds: [
          { key: 'story',    label: 'Story 렌더 → <Button {...args} />', ready: true },
          { key: 'controls', label: 'Controls 패널 (아직 미정의)',         ready: false },
          { key: 'docs',     label: 'Docs 표 (아직 미정의)',                ready: false },
          { key: 'actions',  label: 'Actions 패널 (아직 미정의)',           ready: false },
        ],
        highlight: ['variant'],
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            '};',
            'export default meta;',
            'type Story = StoryObj<typeof Button>;',
            '',
            '// args = 음식 주문서 (데이터)',
            'export const Primary: Story = {',
            '  args: {',
            "    variant: 'primary',   // ← Button의 variant prop",
            "    children: 'Save',     // ← Button 안에 들어갈 텍스트",
            '    disabled: false,',
            '  },',
            '};',
            '',
            '// Storybook은 이 args를 spread해서',
            '// <Button variant="primary" disabled={false}>Save</Button>',
            '// 와 동등하게 렌더링한다',
          ],
          highlight: [12, 13, 14, 15, 16, 17],
        },
      },
      {
        title: 'Step 2. argTypes로 Controls 활성화',
        desc: 'meta.argTypes에 각 prop의 control 타입을 명시하면 → Storybook UI에 "리모컨"이 자동 생성된다. select / boolean / text — 어떤 컨트롤이 떠야 하는지 데이터로 선언. (자세한 내용은 II-1-1)',
        args: { variant: 'primary', children: 'Save', disabled: false },
        feeds: [
          { key: 'story',    label: 'Story 렌더',                            ready: true },
          { key: 'controls', label: 'Controls 패널 ✓ select+text+boolean', ready: true },
          { key: 'docs',     label: 'Docs 표 (아직)',                       ready: false },
          { key: 'actions',  label: 'Actions 패널 (아직)',                  ready: false },
        ],
        highlight: ['variant', 'disabled'],
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            '  argTypes: {',
            '    variant: {',
            "      control: { type: 'select' },",
            "      options: ['primary', 'secondary', 'danger'],",
            '    },',
            "    disabled: { control: 'boolean' },",
            "    children: { control: 'text' },",
            '  },',
            '};',
            'export default meta;',
            'type Story = StoryObj<typeof Button>;',
            '',
            'export const Primary: Story = {',
            "  args: { variant: 'primary', children: 'Save', disabled: false },",
            '};',
            '',
            '// → Controls 패널: variant 드롭다운 / disabled 토글 / children 텍스트',
            '// → 디자이너/QA가 코드 없이 props 조합 실험 가능',
          ],
          highlight: [7, 8, 9, 10, 11, 12, 13],
        },
      },
      {
        title: 'Step 3. autodocs — Docs 표에 args가 그대로 인쇄',
        desc: 'meta.tags: ["autodocs"] 한 줄로 Docs 페이지가 자동 생성된다. argTypes에 작성한 type/options/description이 표로 인쇄되고, 각 Story의 args가 prop 예시로 들어간다. 같은 데이터, 다른 채널.',
        args: { variant: 'primary', children: 'Save', disabled: false },
        feeds: [
          { key: 'story',    label: 'Story 렌더',                              ready: true },
          { key: 'controls', label: 'Controls 패널',                           ready: true },
          { key: 'docs',     label: 'Docs 표 ✓ Args 그대로 인쇄',             ready: true },
          { key: 'actions',  label: 'Actions 패널 (아직)',                    ready: false },
        ],
        highlight: ['variant', 'disabled', 'children'],
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            "  tags: ['autodocs'],          // ← Docs 페이지 자동 생성",
            '  argTypes: {',
            '    variant: {',
            "      control: { type: 'select' },",
            "      options: ['primary', 'secondary', 'danger'],",
            "      description: '버튼 시각 강조 수준',",
            "      table: { defaultValue: { summary: 'primary' } },",
            '    },',
            "    disabled: { control: 'boolean', description: '비활성화 여부' },",
            "    children: { control: 'text',    description: '버튼 라벨' },",
            '  },',
            '};',
            'export default meta;',
            'type Story = StoryObj<typeof Button>;',
            '',
            'export const Primary: Story = {',
            "  args: { variant: 'primary', children: 'Save', disabled: false },",
            '};',
            '',
            '// → Docs 탭: 컴포넌트 설명 + Props 표 + Story 예시 자동 인쇄',
          ],
          highlight: [7, 12, 13, 15, 16],
        },
      },
      {
        title: 'Step 4. action arg — 이벤트 핸들러도 args로',
        desc: 'argTypes에 { onClick: { action: "clicked" } }를 적으면 onClick prop이 자동 모의 함수가 되고, 호출되면 Actions 패널에 인자가 로그된다. args 객체 하나가 4개 채널을 모두 먹였다 — Story / Controls / Docs / Actions.',
        args: { variant: 'primary', children: 'Save', disabled: false, onClick: 'fn()' },
        feeds: [
          { key: 'story',    label: 'Story 렌더',                       ready: true },
          { key: 'controls', label: 'Controls 패널',                    ready: true },
          { key: 'docs',     label: 'Docs 표',                          ready: true },
          { key: 'actions',  label: 'Actions 패널 ✓ onClick 자동 로그', ready: true },
        ],
        highlight: ['onClick'],
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { fn } from '@storybook/test';",
            "import { Button } from './Button';",
            '',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            "  tags: ['autodocs'],",
            '  argTypes: {',
            "    variant:  { control: { type: 'select' }, options: ['primary', 'secondary', 'danger'] },",
            "    disabled: { control: 'boolean' },",
            "    children: { control: 'text' },",
            "    onClick:  { action: 'clicked' },     // ← 자동 모의 핸들러 + Actions 로그",
            '  },',
            '  args: {',
            "    onClick: fn(),                       // ← @storybook/test의 모의 함수",
            '  },',
            '};',
            'export default meta;',
            'type Story = StoryObj<typeof Button>;',
            '',
            'export const Primary: Story = {',
            "  args: { variant: 'primary', children: 'Save', disabled: false },",
            '};',
            '',
            '// args 객체 1개 → 4채널 동시 구동',
            '//   ① Story 렌더 ② Controls 리모컨',
            '//   ③ Docs 표    ④ Actions 로그',
            '//',
            '// 다음(I-2-2)에서는 render 함수와 decorator로',
            '// args 외 컨텍스트(테마/Router)를 감싸는 법을 본다',
          ],
          highlight: [2, 13, 15, 16],
        },
      },
    ];

    const FEED_ICON = {
      story:    '🎭',
      controls: '🎚️',
      docs:     '📄',
      actions:  '📞',
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — args 카드 + 4채널 데이터플로우
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const { args, feeds, highlight } = step;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🍽️ args 주문서 — 4채널 동시 구동</h2>
            <span className="text-[10px] text-slate-400 font-mono">data flow</span>
          </div>

          {/* args 객체 카드 */}
          <div className="bg-slate-900 rounded-lg p-4 mb-4">
            <div className="text-[10px] text-slate-400 mb-1 font-mono">args = {`{`}</div>
            {Object.entries(args).map(([k, v]) => {
              const hi = highlight.includes(k);
              return (
                <div key={k} className={`text-xs font-mono pl-4 py-0.5 transition-colors ${hi ? 'bg-pink-500/20 rounded' : ''}`}>
                  <span className={hi ? 'text-pink-300 font-bold' : 'text-slate-400'}>{k}</span>
                  <span className="text-slate-500">: </span>
                  <span className={hi ? 'text-pink-200' : 'text-slate-300'}>
                    {typeof v === 'string' && v !== 'fn()' ? `'${v}'` : String(v)}
                  </span>
                  <span className="text-slate-500">,</span>
                </div>
              );
            })}
            <div className="text-[10px] text-slate-400 mt-1 font-mono">{`}`}</div>
          </div>

          {/* 4채널 흐름 */}
          <div className="space-y-2">
            <div className="text-[11px] text-slate-500 mb-1 font-medium">↓ 같은 args가 4채널을 동시에 먹인다</div>
            {feeds.map((f) => (
              <div key={f.key}
                className={`flex items-center gap-2 p-2 rounded-lg border-2 transition-all ${
                  f.ready
                    ? 'bg-pink-50 border-pink-300 text-pink-900'
                    : 'bg-slate-100 border-slate-200 text-slate-400'
                }`}
              >
                <span className="text-base">{FEED_ICON[f.key]}</span>
                <span className="text-xs font-medium flex-1">{f.label}</span>
                <span className="text-[10px]">{f.ready ? '✓' : '○'}</span>
              </div>
            ))}
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-400"></span>활성</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-300"></span>미정의</span>
            <span className="flex items-center gap-1 ml-auto">CSF 3 + Storybook 8+</span>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        setRenderedLines(codeRef.current.innerHTML.split('\n'));
      }, [code]);
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>
          <pre className="hidden"><code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code></pre>
          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const hi = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} className={`flex hover:bg-slate-800/50 ${hi ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => setStepIdx((i) => {
        if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
        return i + 1;
      });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Storybook 기초 &gt; Chapter 2. Args</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Args — Story의 props를 데이터로</h1>
                  <p className="text-sm text-slate-500 mt-0.5">args 객체 1개 → Story / Controls / Docs / Actions 4채널 동시 구동</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(I-2-2)에서는 <strong>render 함수 + decorators</strong>로 ThemeProvider/Router 같은 컨텍스트를 args 외에 감싸는 법을 본다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]" style={{ backgroundColor: '#FF4785' }}>
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-1-2.html" className="text-slate-500 hover:text-slate-700">&larr; I-1-2</a>
              <a href="./I-2-2.html" className="text-pink-700 hover:text-pink-900 font-medium">I-2-2 Render &amp; Decorator &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
