<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 학습 — I-1-2. Story와 CSF 포맷</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    I-1-2. Story와 CSF (Component Story Format) 3
    학습 목표: .stories.tsx 파일 1개에서 component import → meta(default export)
              → Story(named export) → args 4단계로 CSF3 구조를 해부한다.
    핵심 비유: "옷장 안 = 컴포넌트 / meta = 옷걸이 / Story = 입혀진 마네킹"
    패턴: fastapi v1 — 좌(LiveDataPane: 파일 해부 카드 + Storybook 사이드바 미러) / 우(CodeViewer)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   parts: 4가지 영역 상태 — 'empty' | 'active' | 'done'
    //          (component / meta / stories / args)
    //   sidebar: Storybook 좌측 메뉴에 보이는 항목 — [{title, type, active}]
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. component import — 카탈로그에 올릴 옷을 가져온다',
        desc: 'Button.stories.tsx 파일 맨 위. 우리가 보여줄 컴포넌트 자체를 import. 이 한 줄이 없으면 어떤 옷도 진열할 수 없다.',
        parts: { component: 'active', meta: 'empty', stories: 'empty', args: 'empty' },
        sidebar: [
          { title: 'Atoms', type: 'group', active: false },
          { title: '(아직 비어 있음)', type: 'empty', active: false },
        ],
        currentScope: 'component',
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "// 1) 옷 가져오기 — 컴포넌트와 타입",
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            '// ↓ 다음 단계에서 meta 객체 작성',
            '',
            '// ↓ 그 다음 Story 객체들 추가',
            '',
            '// 이 시점에서는 Storybook이 이 파일을 모른다',
            '// (default export가 없어서)',
          ],
          highlight: [1, 2, 3],
        },
      },
      {
        title: 'Step 2. meta(default export) — 옷걸이 등록',
        desc: 'meta 객체에 title("Atoms/Button")과 component를 적고 default export로 내보낸다. Storybook은 이 파일을 발견하고, 사이드바에 "Atoms > Button" 그룹을 만든다. 아직 Story가 없어서 클릭은 안 되지만, 옷걸이는 걸렸다.',
        parts: { component: 'done', meta: 'active', stories: 'empty', args: 'empty' },
        sidebar: [
          { title: 'Atoms', type: 'group', active: false },
          { title: '  Button', type: 'component', active: false },
          { title: '  (Story 없음)', type: 'empty', active: false },
        ],
        currentScope: 'meta',
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            '// 2) 옷걸이 등록 — meta 객체 + default export',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',         // 사이드바 경로 (/로 그룹 구분)",
            '  component: Button,              // 어떤 컴포넌트인지',
            "  tags: ['autodocs'],             // 자동 문서 생성 (Part IV)",
            "  parameters: { layout: 'centered' },",
            '};',
            'export default meta;             // ← 반드시 default export',
            '',
            'type Story = StoryObj<typeof Button>;',
            '',
            '// ↓ 다음 단계에서 named export로 Story 추가',
          ],
          highlight: [4, 5, 6, 7, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 3. Story(named export) — 마네킹 한 개 입히기',
        desc: 'export const Primary: Story = { ... }로 첫 Story를 만든다. named export 이름이 그대로 Storybook 메뉴 항목 이름이 된다. 한 파일에 여러 named export = 여러 Story. CSF 3에서는 함수가 아니라 객체로 적는다 — 이것이 핵심.',
        parts: { component: 'done', meta: 'done', stories: 'active', args: 'empty' },
        sidebar: [
          { title: 'Atoms', type: 'group', active: false },
          { title: '  Button', type: 'component', active: false },
          { title: '    Primary', type: 'story', active: true },
        ],
        currentScope: 'stories',
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            "  tags: ['autodocs'],",
            '};',
            'export default meta;',
            '',
            'type Story = StoryObj<typeof Button>;',
            '',
            '// 3) Story 객체 (named export) — CSF 3 포맷',
            "export const Primary: Story = {",
            '  // 아직 args 비어 있음 → Button 기본값으로 렌더',
            '};',
            '',
            "// 함수 아님!  ❌ export const Primary = () => <Button />;",
            '// 객체로 적기 → render 함수, args, play 등을 같은 객체에 묶는다',
          ],
          highlight: [13, 14, 15, 18],
        },
      },
      {
        title: 'Step 4. args — Story에 데이터로 props를 주입',
        desc: 'args에 객체로 props를 적으면, Story가 그 props로 렌더된다. 같은 컴포넌트에 args만 다른 Story 여러 개를 만들면 → 카탈로그 완성. Controls 패널(II-1-1)이 이 args를 GUI로 조작하게 된다.',
        parts: { component: 'done', meta: 'done', stories: 'done', args: 'done' },
        sidebar: [
          { title: 'Atoms', type: 'group', active: false },
          { title: '  Button', type: 'component', active: false },
          { title: '    Primary', type: 'story', active: false },
          { title: '    Secondary', type: 'story', active: false },
          { title: '    Danger', type: 'story', active: true },
        ],
        currentScope: 'args',
        code: {
          lang: 'typescript',
          filename: 'src/components/Button.stories.tsx',
          lines: [
            "import type { Meta, StoryObj } from '@storybook/react';",
            "import { Button } from './Button';",
            '',
            'const meta: Meta<typeof Button> = {',
            "  title: 'Atoms/Button',",
            '  component: Button,',
            "  tags: ['autodocs'],",
            '};',
            'export default meta;',
            'type Story = StoryObj<typeof Button>;',
            '',
            '// 4) args — Story마다 다른 props',
            'export const Primary: Story = {',
            '  args: {',
            "    variant: 'primary',",
            "    children: 'Save',",
            '  },',
            '};',
            '',
            'export const Secondary: Story = {',
            "  args: { variant: 'secondary', children: 'Cancel' },",
            '};',
            '',
            'export const Danger: Story = {',
            "  args: { variant: 'danger', children: 'Delete', disabled: false },",
            '};',
            '',
            '// → 사이드바: Primary / Secondary / Danger 3개 Story',
            '// → 각 Story 클릭하면 args대로 즉시 렌더',
            '// 다음(I-2-1)에서는 args를 더 깊이 본다',
          ],
          highlight: [12, 13, 14, 15, 16, 17, 20, 21, 24, 25],
        },
      },
    ];

    const PART_STYLE = {
      empty:  { card: 'bg-slate-100 border-slate-300 text-slate-500',     ring: '',                         emoji: '⬜' },
      active: { card: 'bg-pink-100 border-pink-500 text-pink-800',         ring: 'ring-2 ring-pink-300',     emoji: '✏️' },
      done:   { card: 'bg-emerald-50 border-emerald-400 text-emerald-700', ring: '',                         emoji: '✅' },
    };

    const PARTS = [
      { key: 'component', emoji: '🧩', name: 'component', sub: 'import { Button }' },
      { key: 'meta',      emoji: '🪝', name: 'meta',      sub: 'default export — 옷걸이' },
      { key: 'stories',   emoji: '🎭', name: 'Story',     sub: 'named export — 마네킹' },
      { key: 'args',      emoji: '🎚️', name: 'args',      sub: 'props 데이터' },
    ];

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 파일 해부 + Storybook 사이드바 미러
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const { parts, sidebar } = step;
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📂 .stories.tsx 파일 해부 + 사이드바</h2>
            <span className="text-[10px] text-slate-400 font-mono">CSF 3</span>
          </div>

          {/* 4가지 영역 카드 */}
          <div className="grid grid-cols-2 gap-2">
            {PARTS.map((p) => {
              const sty = PART_STYLE[parts[p.key]];
              return (
                <div key={p.key} className={`rounded-lg border-2 p-3 transition-all duration-500 ${sty.card} ${sty.ring}`}>
                  <div className="flex items-center justify-between mb-1">
                    <div className="flex items-center gap-1.5">
                      <span aria-hidden="true">{p.emoji}</span>
                      <span className="text-xs font-bold">{p.name}</span>
                    </div>
                    <span className="text-[10px]">{sty.emoji}</span>
                  </div>
                  <div className="text-[10px] opacity-80">{p.sub}</div>
                </div>
              );
            })}
          </div>

          {/* Storybook 사이드바 미러 */}
          <div className="mt-4 bg-slate-900 rounded-lg overflow-hidden">
            <div className="bg-slate-800 px-3 py-1.5 flex items-center gap-2">
              <div className="w-4 h-4 rounded" style={{ backgroundColor: '#FF4785' }}></div>
              <span className="text-xs text-slate-200 font-bold">Storybook 6006</span>
              <span className="ml-auto text-[10px] text-slate-400 font-mono">live preview</span>
            </div>
            <div className="p-2 min-h-[140px]">
              {sidebar.map((item, i) => {
                const colorMap = {
                  group:     'text-slate-300 font-bold',
                  component: 'text-slate-200',
                  story:     item.active ? 'text-white bg-pink-600 px-2 rounded' : 'text-slate-300',
                  empty:     'text-slate-500 italic',
                };
                return (
                  <div key={i} className={`text-xs font-mono py-0.5 ${colorMap[item.type]}`}>
                    {item.type === 'story' && <span className="opacity-50 mr-1">●</span>}
                    {item.title}
                  </div>
                );
              })}
            </div>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-300"></span>empty</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-pink-500"></span>active(현재)</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>done</span>
          </div>
        </div>
      );
    }

    // CodeViewer
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        setRenderedLines(codeRef.current.innerHTML.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>
          <pre className="hidden"><code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code></pre>
          <div className="overflow-auto max-h-[30rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const hi = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} className={`flex hover:bg-slate-800/50 ${hi ? 'bg-pink-500/10 border-l-2 border-pink-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => setStepIdx((i) => {
        if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
        return i + 1;
      });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-pink-700 hover:text-pink-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Storybook 기초 &gt; Chapter 1. CSF 포맷</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Story와 CSF (Component Story Format)</h1>
                  <p className="text-sm text-slate-500 mt-0.5">컴포넌트 / meta / Story / args — 한 파일에 4 부품</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-pink-50 border-2 border-pink-300 rounded-xl p-3 text-sm text-pink-900">
                💡 다음(I-2-1)에서는 <strong>Args</strong> — Story의 props를 "데이터로 표현된 상태"로 보고 Controls/Actions와 어떻게 연결되는지 본다
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#C5306A' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-pink-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-pink-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]" style={{ backgroundColor: '#FF4785' }}>
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계" className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-1-1.html" className="text-slate-500 hover:text-slate-700">&larr; I-1-1</a>
              <a href="./I-2-1.html" className="text-pink-700 hover:text-pink-900 font-medium">I-2-1 Args &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
