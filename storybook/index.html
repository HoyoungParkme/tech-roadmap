<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Storybook 인터랙티브 학습</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
  </style>
  <!-- 필기노트 공통 스킨(hub) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-image:none !important; background-color:#fffdf7 !important; font-family:Pretendard, system-ui, sans-serif; }
    #root > div { background-image:none !important; background-color:#fffdf7 !important; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color:#faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color:#2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color:#57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color:#8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color:#cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow:3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius:8px !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color:#faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!--
    Storybook 인터랙티브 학습 — 사이드바 + iframe 레이아웃 (ai-agent 표준)
    역할: 5 Parts × 20 sections, Phase A 8/20 (Part I 4 + Part II 4)
    브랜드: #FF4785 (Storybook pink) — Tailwind 클래스로 pink/rose 계열 매핑
  -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SECTIONS = [
      {
        part: 'I',
        label: 'Part I. Storybook 기초',
        color: 'bg-pink-600',
        items: [
          { id: 'I-1-1', title: 'Storybook이 푸는 문제', file: './part1/I-1-1.html' },
          { id: 'I-1-2', title: 'Story와 CSF 포맷', file: './part1/I-1-2.html' },
          { id: 'I-2-1', title: 'Args — props를 데이터로', file: './part1/I-2-1.html' },
          { id: 'I-2-2', title: 'Render와 Decorator', file: './part1/I-2-2.html' },
        ],
      },
      {
        part: 'II',
        label: 'Part II. 컴포넌트 카탈로그',
        color: 'bg-rose-600',
        items: [
          { id: 'II-1-1', title: 'Controls — props 리모컨', file: './part2/II-1-1.html' },
          { id: 'II-1-2', title: 'Actions — 이벤트 로그', file: './part2/II-1-2.html' },
          { id: 'II-2-1', title: 'Viewport — 반응형', file: './part2/II-2-1.html' },
          { id: 'II-2-2', title: 'Backgrounds — 라이트/다크', file: './part2/II-2-2.html' },
        ],
      },
      {
        part: 'III',
        label: 'Part III. 테스트 (Play/A11y/Visual)',
        color: 'bg-fuchsia-600',
        items: [
          { id: 'III-1-1', title: 'Play function', file: './part3/III-1-1.html' },
          { id: 'III-1-2', title: 'Interactions addon', file: './part3/III-1-2.html' },
          { id: 'III-2-1', title: 'Accessibility addon', file: './part3/III-2-1.html' },
          { id: 'III-2-2', title: 'Visual regression', file: './part3/III-2-2.html' },
        ],
      },
      {
        part: 'IV',
        label: 'Part IV. 자동 문서화',
        color: 'bg-purple-600',
        items: [
          { id: 'IV-1-1', title: 'Autodocs', file: './part4/IV-1-1.html' },
          { id: 'IV-1-2', title: 'MDX', file: './part4/IV-1-2.html' },
          { id: 'IV-2-1', title: 'JSDoc 추출', file: './part4/IV-2-1.html' },
          { id: 'IV-2-2', title: 'Doc Block', file: './part4/IV-2-2.html' },
        ],
      },
      {
        part: 'V',
        label: 'Part V. CI / 배포',
        color: 'bg-violet-600',
        items: [
          { id: 'V-1-1', title: 'storybook build', file: './part5/V-1-1.html' },
          { id: 'V-1-2', title: 'Chromatic', file: './part5/V-1-2.html' },
          { id: 'V-2-1', title: 'GitHub Pages / Vercel', file: './part5/V-2-1.html' },
          { id: 'V-2-2', title: 'GitHub Actions', file: './part5/V-2-2.html' },
        ],
      },
    ];

    const TOTAL = SECTIONS.reduce((s, sec) => s + sec.items.length, 0);
    const READY = SECTIONS.reduce((s, sec) => s + sec.items.filter(i => i.file).length, 0);

    const PART_BG = {
      I:   'hover:bg-pink-50',
      II:  'hover:bg-rose-50',
      III: 'hover:bg-fuchsia-50',
      IV:  'hover:bg-purple-50',
      V:   'hover:bg-violet-50',
    };

    const PART_ACTIVE = {
      I:   'bg-pink-100 text-pink-800 font-bold',
      II:  'bg-rose-100 text-rose-800 font-bold',
      III: 'bg-fuchsia-100 text-fuchsia-800 font-bold',
      IV:  'bg-purple-100 text-purple-800 font-bold',
      V:   'bg-violet-100 text-violet-800 font-bold',
    };

    function findItemById(id) {
      for (const section of SECTIONS) {
        const found = section.items.find(item => item.id === id);
        if (found) return { ...found, part: section.part };
      }
      return null;
    }

    function GiscusPanel({ term }) {
      const [open, setOpen] = React.useState(false);
      const [width, setWidth] = React.useState(() => Math.min(480, Math.round(window.innerWidth * 0.9)));
      const bodyRef = React.useRef(null);
      const loadedRef = React.useRef(false);

      React.useEffect(() => {
        if (!open || loadedRef.current || !bodyRef.current) return;
        const s = document.createElement('script');
        s.src = 'https://giscus.app/client.js';
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.setAttribute('data-repo', 'HoyoungParkme/tech-roadmap');
        s.setAttribute('data-repo-id', 'R_kgDOSIZCtg');
        s.setAttribute('data-category', 'General');
        s.setAttribute('data-category-id', 'DIC_kwDOSIZCts4C7lgx');
        s.setAttribute('data-mapping', 'specific');
        s.setAttribute('data-term', term);
        s.setAttribute('data-strict', '0');
        s.setAttribute('data-reactions-enabled', '1');
        s.setAttribute('data-emit-metadata', '0');
        s.setAttribute('data-input-position', 'bottom');
        s.setAttribute('data-theme', 'light');
        s.setAttribute('data-lang', 'ko');
        bodyRef.current.appendChild(s);
        loadedRef.current = true;
      }, [open, term]);

      const onResizeStart = (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = width;
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:ew-resize;';
        document.body.appendChild(overlay);
        const onMove = (ev) => {
          const newW = Math.max(320, Math.min(window.innerWidth * 0.9, startW + (startX - ev.clientX)));
          setWidth(newW);
        };
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          overlay.remove();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      };

      const buttonRight = open ? Math.min(width, window.innerWidth - 40) + 'px' : 0;

      return (
        <React.Fragment>
          <button
            onClick={() => setOpen(o => !o)}
            aria-expanded={open}
            aria-label={open ? '댓글 패널 닫기' : '댓글 패널 열기'}
            style={{ position: 'fixed', top: '40%', right: buttonRight, zIndex: 51, writingMode: 'vertical-rl', transition: 'right 0.25s ease' }}
            className="bg-slate-800 text-white px-2 py-3 rounded-l-lg text-sm font-medium shadow-md hover:bg-slate-700"
          >
            💬 {open ? '닫기' : '댓글'}
          </button>
          <div
            role="complementary"
            aria-label="댓글 패널"
            style={{ position: 'fixed', top: 0, right: 0, height: '100vh', width: width + 'px', transform: open ? 'translateX(0)' : 'translateX(100%)', transition: 'transform 0.25s ease', zIndex: 50, background: '#fff', boxShadow: '-4px 0 12px rgba(0,0,0,0.08)' }}
          >
            <div onMouseDown={onResizeStart} style={{ position: 'absolute', left: '-4px', top: 0, width: '8px', height: '100%', cursor: 'ew-resize', zIndex: 52 }} aria-hidden="true" />
            <div className="border-b border-slate-200 px-4 py-3 flex items-center justify-between">
              <span className="font-bold text-slate-800">💬 댓글 / 질문</span>
              <button onClick={() => setOpen(false)} aria-label="댓글 패널 닫기" className="text-slate-500 hover:text-slate-800 px-2">✕</button>
            </div>
            <div ref={bodyRef} className="p-4 overflow-y-auto" style={{ height: 'calc(100vh - 56px)' }} />
          </div>
        </React.Fragment>
      );
    }

    function App() {
      const [activeId, setActiveId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [expandedParts, setExpandedParts] = useState({ I: true, II: true, III: true, IV: true, V: true });

      const activeItem = activeId ? findItemById(activeId) : null;

      const navigate = useCallback((id, file) => {
        if (!file) return;
        setActiveId(id);
        window.location.hash = id;
        if (window.innerWidth < 1024) setSidebarOpen(false);
      }, []);

      useEffect(() => {
        const hash = window.location.hash.slice(1);
        if (hash) {
          const it = findItemById(hash);
          if (it && it.file) setActiveId(hash);
        }
        const onHash = () => {
          const h = window.location.hash.slice(1);
          const it = findItemById(h);
          if (it && it.file) setActiveId(h);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const togglePart = (part) => {
        setExpandedParts(prev => ({ ...prev, [part]: !prev[part] }));
      };

      return (
        <React.Fragment>
        <div className="h-full flex bg-slate-100">
          {sidebarOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-30 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />
          )}
          <aside className={`fixed lg:static z-40 h-full w-72 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0 lg:w-72'}`}>
            <div className="p-4 border-b border-slate-200 shrink-0">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 text-white flex items-center justify-center rounded-lg font-bold text-sm" style={{ backgroundColor: '#FF4785' }}>S</div>
                <div>
                  <div className="font-bold text-slate-800 text-sm">Storybook 학습</div>
                  <div className="text-[11px] text-slate-500">{READY}/{TOTAL} 시각화 (Phase A)</div>
                </div>
              </div>
            </div>
            <nav className="flex-1 overflow-y-auto p-2">
              {SECTIONS.map((section) => (
                <div key={section.part} className="mb-1">
                  <button
                    onClick={() => togglePart(section.part)}
                    className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left hover:bg-slate-50 transition"
                  >
                    <span className={`w-5 h-5 rounded text-white text-[10px] flex items-center justify-center font-bold ${section.color}`}>
                      {section.part}
                    </span>
                    <span className="text-xs font-bold text-slate-700 flex-1 truncate">{section.label}</span>
                    <span className="text-[10px] text-slate-400">{section.items.filter(i => i.file).length}/{section.items.length}</span>
                    <span className={`text-slate-400 text-xs transition-transform ${expandedParts[section.part] ? 'rotate-90' : ''}`}>&#9654;</span>
                  </button>
                  {expandedParts[section.part] && (
                    <div className="ml-4 border-l border-slate-100 pl-2 space-y-0.5">
                      {section.items.map((item) => {
                        const isActive = activeId === item.id;
                        const isPlanned = !item.file;
                        return (
                          <button
                            key={item.id}
                            onClick={() => navigate(item.id, item.file)}
                            disabled={isPlanned}
                            className={`w-full text-left px-2 py-1.5 rounded-md text-xs transition-all truncate ${
                              isActive ? PART_ACTIVE[section.part] : `text-slate-600 ${isPlanned ? 'opacity-40 cursor-not-allowed' : PART_BG[section.part]}`
                            }`}
                          >
                            <span className="font-mono text-[10px] opacity-60 mr-1">{item.id}</span>
                            {item.title}
                            {isPlanned && <span className="ml-1 text-[9px] text-slate-400">(예정)</span>}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              ))}
            </nav>
            <div className="p-3 border-t border-slate-200 shrink-0 text-[10px] text-slate-400 text-center">
              React + Tailwind + Babel CDN
            </div>
          </aside>
          <main className="flex-1 flex flex-col min-w-0">
            <div className="h-12 bg-white border-b border-slate-200 flex items-center px-4 shrink-0 gap-3">
              <button
                onClick={() => setSidebarOpen(prev => !prev)}
                className="lg:hidden p-1.5 rounded-md hover:bg-slate-100 text-slate-600"
                aria-label="사이드바 토글"
              >
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M3 5h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2z" />
                </svg>
              </button>
              {activeItem ? (
                <div className="flex items-center gap-2 min-w-0">
                  <span className={`w-5 h-5 rounded text-white text-[10px] flex items-center justify-center font-bold shrink-0 ${
                    SECTIONS.find(s => s.part === activeItem.part)?.color || 'bg-slate-600'
                  }`}>{activeItem.part}</span>
                  <span className="font-mono text-xs text-slate-500 shrink-0">{activeItem.id}</span>
                  <span className="text-sm font-bold text-slate-800 truncate">{activeItem.title}</span>
                </div>
              ) : (
                <span className="text-sm text-slate-500">시각화를 선택하세요</span>
              )}
            </div>
            {activeItem ? (
              <iframe
                key={activeItem.id}
                src={activeItem.file}
                className="flex-1 w-full border-0"
                title={activeItem.title}
              />
            ) : (
              <div className="flex-1 flex items-center justify-center p-8">
                <div className="text-center max-w-md">
                  <div className="w-16 h-16 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl font-bold" style={{ backgroundColor: '#FF4785' }}>S</div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-3">Storybook 인터랙티브 학습</h2>
                  <p className="text-slate-600 mb-6 leading-relaxed">
                    UI 컴포넌트를 앱과 분리해 만드는 <strong>독립 워크숍</strong> —<br/>
                    Story / Controls / Actions / 시각 회귀 / 자동 문서까지.
                  </p>
                  <div className="grid grid-cols-5 gap-2 mb-6">
                    {SECTIONS.map(s => (
                      <div key={s.part} className="text-center">
                        <div className={`w-8 h-8 rounded-lg text-white text-xs flex items-center justify-center font-bold mx-auto mb-1 ${s.color}`}>{s.part}</div>
                        <div className="text-[10px] text-slate-500">{s.items.filter(i => i.file).length}/{s.items.length}</div>
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-slate-400">{READY}/{TOTAL} 시각화 ready · Phase A (Part I + II)</p>
                </div>
              </div>
            )}
          </main>
        </div>
        <GiscusPanel term="storybook" />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
