<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphQL 학습 — II-2-2. Input / Enum / Interface / Union</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>◆</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    GraphQL Chapter II-2-2 — Input / Enum / Interface / Union
    학습 목표: 입력 형태 (Input), 한정된 값 (Enum), 추상화 (Interface), 합집합 (Union) 4 개의
              고급 타입을 한 화면에서 차례대로 익힌다.
    핵심 비유: 주문서 양식(Input) / 사이즈 옵션(Enum) / 공통 속성(Interface) / "둘 중 하나"(Union)
    패턴: fastapi v1 — 좌(LiveDataPane: 4 타입 카드) / 우(CodeViewer)
    색상: GraphQL magenta (#e10098)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang: 'graphql', filename: 'step1-input.graphql', lines: [
            '# Step 1. Input — 변경 작업의 인자',
            '',
            '# ❌ Bad — 인자가 늘어날 때마다 시그니처 깨짐',
            'type Mutation {',
            '  updateUserBad(',
            '    id:       ID!,',
            '    name:     String,',
            '    email:    String,',
            '    bio:      String,',
            '    timezone: String,',
            '  ): User!',
            '}',
            '',
            '# ✅ Good — input 타입으로 묶음',
            'input UpdateUserInput {',
            '  name:     String',
            '  email:    String',
            '  bio:      String',
            '  timezone: String',
            '}',
            '',
            'type Mutation {',
            '  updateUser(id: ID!, input: UpdateUserInput!): User!',
            '}',
            '',
            '# === 장점 ===',
            '# 1) 새 필드 추가 시 시그니처 변동 없음 (Backward compatible)',
            '# 2) input 자체에 default value, deprecation 사용 가능',
            '# 3) 클라이언트 variables 가 깔끔: $input: UpdateUserInput!',
            '# 4) 같은 input 을 여러 mutation 이 공유',
            '',
            '# === 규칙 ===',
            '# • input 타입은 input 끼리만 중첩 가능 (output type 못 넣음)',
            '# • interface/union 등도 input 안에 못 들어감',
            '# • 그래서 input/object 가 완전히 별개 트리',
      ]},
      s2: {lang: 'graphql', filename: 'step2-enum.graphql', lines: [
            '# Step 2. Enum — 한정된 값',
            '',
            '# === 정의 ===',
            'enum Role {',
            '  ADMIN',
            '  USER',
            '  GUEST',
            '}',
            '',
            'enum OrderStatus {',
            '  PENDING',
            '  PAID',
            '  SHIPPED',
            '  DELIVERED',
            '  CANCELLED',
            '}',
            '',
            'type User {',
            '  id:    ID!',
            '  name:  String!',
            '  role:  Role!',
            '}',
            '',
            '# === 클라이언트에서 사용 ===',
            '# query { users(role: ADMIN) { id name } }',
            '# 따옴표 X — enum literal 은 식별자 (예약어 아님)',
            '',
            '# === 응답 ===',
            '# { "users": [{ "id":"1", "name":"...", "role": "ADMIN" }] }',
            '# JSON 에선 결국 문자열로 직렬화',
            '',
            '# === 서버 resolver 매핑 ===',
            '# DB 가 0/1/2 로 저장하면 resolver 가 변환',
            '# const RoleMap = { 0: "ADMIN", 1: "USER", 2: "GUEST" };',
            '# User.role: (p) => RoleMap[p.role]',
            '',
            '# === 진화 규칙 ===',
            '# • 값 추가:   OK (클라이언트에 deprecated 알림 권장)',
            '# • 값 제거:   ❌ breaking change',
            '# • 이름 변경: ❌ breaking change',
            '# • @deprecated(reason: "...") 로 점진 제거',
      ]},
      s3: {lang: 'graphql', filename: 'step3-interface.graphql', lines: [
            '# Step 3. Interface — 공통 필드 추상화',
            '',
            '# === Node interface (Relay 표준) ===',
            'interface Node {',
            '  id: ID!',
            '}',
            '',
            'type User implements Node {',
            '  id:    ID!',
            '  name:  String!',
            '  email: String',
            '}',
            '',
            'type Post implements Node {',
            '  id:    ID!',
            '  title: String!',
            '  body:  String!',
            '}',
            '',
            'type Query {',
            '  node(id: ID!): Node  # interface 반환 — 어떤 타입이든 OK',
            '}',
            '',
            '# === 클라이언트 ===',
            'query {',
            '  node(id: "Post:42") {',
            '    id',
            '    ... on Post {  # 인라인 fragment 로 타입별 필드',
            '      title',
            '    }',
            '    ... on User {',
            '      name',
            '    }',
            '  }',
            '}',
            '',
            '# === resolver — __resolveType 필요 ===',
            '# Node: { __resolveType: (obj) => obj.__typename }',

        verdictTone: "good",
        keyPoint: "비즈니스 에러를 예외가 아니라 데이터 타입으로 다루는 준비 단계.",
        code: {...CODE.s4, highlight: [20, 21, 22, 23, 24, 25, 26, 27]},
      },
      { ...S4,
        beat: { label: "응답을 union 으로", at: "step4-union.graphql L28–32",
                caption: "두 타입을 union 으로 묶어 mutation 의 반환 타입으로 쓴다.",
                changes: [{"mark":"new","text":"union CreatePostResult"},{"mark":"changed","text":"createPost 반환 타입"}] },
        focus: "union",
        verdict: "Union Type",
        verdictTone: "good",
        keyPoint: "errors as data — 200 응답 안에서 성공과 실패를 타입으로 구분한다.",
        code: {...CODE.s4, highlight: [28, 29, 30, 31, 32]},
      },
      { ...S4,
        beat: { label: "분기와 __resolveType", at: "step4-union.graphql L34–37, L39–40",
                caption: "클라이언트는 __typename 으로 분기하고, 서버는 __resolveType 으로 실제 타입을 알려준다.",
                changes: [{"mark":"new","text":"TS Discriminated Union"},{"mark":"new","text":"__resolveType"}] },
        focus: "union",
        verdict: "Union Type",
        verdictTone: "good",
        keyPoint: "Union 은 \"공통점 없는 여러 종류\" 를 한 필드로 묶을 때. mutation 응답을 union 으로 만들면 분기 안전.",
        code: {...CODE.s4, highlight: [34, 35, 36, 37, 39, 40]},
      },
      // ── Step 5 ──────────────────────────────────────────────────
      { ...S5,
        beat: { label: "상태값은 Enum", at: "step5-combined.graphql L3–4",
                caption: "주문 상태를 다섯 값으로 못 박는다.",
                changes: [{"mark":"new","text":"enum OrderStatus"}] },
        focus: "enum",
        verdict: "함께 사용",
        verdictTone: "good",
        keyPoint: "도메인의 \"정해진 값\" 은 전부 enum 후보다.",
        code: {...CODE.s5, highlight: [3, 4]},
      },
      { ...S5,
        beat: { label: "공통 키는 Interface", at: "step5-combined.graphql L6–7",
                caption: "모든 엔터티가 id 를 갖도록 Node 를 둔다.",
                changes: [{"mark":"new","text":"interface Node"}] },
        focus: "interface",
        verdict: "함께 사용",
        verdictTone: "good",
        keyPoint: "Node 하나로 캐시 키와 공통 mutation 의 기반이 생긴다.",
        code: {...CODE.s5, highlight: [6, 7]},
      },
      { ...S5,
        beat: { label: "본체 타입 조립", at: "step5-combined.graphql L9–16",
                caption: "Order 가 Node 를 구현하고, 상태 필드는 OrderStatus enum 을 쓴다.",
                changes: [{"mark":"new","text":"type Order implements Node"},{"mark":"read","text":"status: OrderStatus!"}] },
        focus: "interface",
        verdict: "함께 사용",
        verdictTone: "good",
        keyPoint: "하나의 타입 안에서 interface 계약과 enum 값이 함께 쓰인다.",
        code: {...CODE.s5, highlight: [9, 10, 11, 12, 13, 14, 15, 16]},
      },
      { ...S5,
        beat: { label: "입력은 Input", at: "step5-combined.graphql L18–22",
                caption: "주문 생성 인자를 input 하나로 묶는다.",
                changes: [{"mark":"new","text":"input CreateOrderInput"}] },
        focus: "input",
        verdict: "함께 사용",
        verdictTone: "good",
        keyPoint: "쓰기 인자는 output type 을 재사용하지 않고 별도 input 으로 만든다.",
        code: {...CODE.s5, highlight: [18, 19, 20, 21, 22]},
      },
      { ...S5,
        beat: { label: "input 은 input 을 품는다", at: "step5-combined.graphql L23–26",
                caption: "중첩도 input 끼리만 된다. OrderItem(출력) 이 아니라 OrderItemInput 이다.",
                changes: [{"mark":"new","text":"input OrderItemInput"},{"mark":"gone","text":"output type 중첩"}] },
        focus: "input",
        verdict: "함께 사용",
        verdictTone: "good",
        keyPoint: "같은 개념이라도 읽기용 type 과 쓰기용 input 을 따로 둔다.",
        code: {...CODE.s5, highlight: [23, 24, 25, 26]},
      },
      { ...S5,
        beat: { label: "결과는 Union", at: "step5-combined.graphql L28–32, L34–36",
                caption: "성공 1 개와 실패 2 개를 union 으로 묶어 createOrder 의 반환 타입으로 삼는다.",
                changes: [{"mark":"new","text":"union CreateOrderResult"},{"mark":"changed","text":"createOrder 반환 타입"}] },
        focus: "union",
        verdict: "함께 사용",
        verdictTone: "good",
        keyPoint: "실패 종류마다 필요한 필드가 다르다. 그래서 union 이 맞다.",
        code: {...CODE.s5, highlight: [28, 29, 30, 31, 32, 34, 35, 36]},
      },
      { ...S5,
        beat: { label: "클라이언트가 전부 처리", at: "step5-combined.graphql L38–44",
                caption: "__typename switch 로 모든 경우가 타입 수준에서 강제된다.",
                changes: [{"mark":"read","text":"__typename"},{"mark":"new","text":"모든 분기 보장"}] },
        focus: "all",
        verdict: "함께 사용",
        verdictTone: "good",
        summary: {"title":"4 타입 요약","rows":[{"metric":"Input","before":"mutation 인자","after":"input UpdateUserInput {...}","delta":"✓"},{"metric":"Enum","before":"한정 값","after":"enum Role { ADMIN USER }","delta":"✓"},{"metric":"Interface","before":"공통 필드","after":"type X implements Node","delta":"✓"},{"metric":"Union","before":"여러 중 하나","after":"union Result = OK | Err","delta":"✓"},{"metric":"__resolveType","before":"interface/union 필수","after":"실제 타입 판별","delta":"✓"}]},
        keyPoint: "Input(쓰기) + Enum(값) + Interface(공통) + Union(분기) — 도메인을 스키마로 옮기는 4 도구.",
        code: {...CODE.s5, highlight: [38, 39, 40, 41, 42, 43, 44]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    badge: 'bg-rose-200 text-rose-800' },
    };

    const TYPES = [
      { id: 'input',     name: 'Input',     icon: '📝', desc: 'mutation 인자 묶음' },
      { id: 'enum',      name: 'Enum',      icon: '🎯', desc: '한정된 값 집합' },
      { id: 'interface', name: 'Interface', icon: '🧬', desc: '공통 필드 강제' },
      { id: 'union',     name: 'Union',     icon: '🔀', desc: '여러 중 하나' },
    ];

    function TypeCard({ t, active }) {
      return (
        <div className={`rounded-lg border-2 p-3 transition ${active ? 'border-pink-400 bg-pink-50 shadow' : 'border-zinc-200 bg-white opacity-60'}`}>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-lg">{t.icon}</span>
              <span className={`text-sm font-bold ${active ? 'text-pink-800' : 'text-zinc-600'}`}>{t.name}</span>
            </div>
            <span className="text-[10px] text-zinc-500">{t.desc}</span>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-pink-400 bg-white p-3">
          <div className="text-sm font-bold mb-2" style={{color:'#e10098'}}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-pink-700 border-b border-pink-200">
                <th className="py-1 pr-2">타입</th><th className="py-1 pr-2">용도</th><th className="py-1 pr-2">예시</th><th className="py-1"></th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-pink-100">
                  <td className="py-1 pr-2 font-bold text-pink-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-zinc-600">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono text-[11px]">{r.after}</td>
                  <td className="py-1 text-pink-900 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.good;
      return (
        <div className="rounded-xl border border-pink-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#e10098'}}>고급 타입 4 종</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="grid grid-cols-2 gap-2">
            {TYPES.map((tt) => (
              <TypeCard key={tt.id} t={tt} active={state.focus === 'all' || state.focus === tt.id} />
            ))}
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-pink-900 bg-pink-100 border border-pink-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-pink-500/25 border-l-2 border-pink-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-pink-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{backgroundColor:'#e10098'}}>◆</span>
              <div>
                <h1 className="text-2xl font-bold text-pink-900">Chapter II-2-2. Input / Enum / Interface / Union</h1>
                <p className="text-sm text-pink-700/80">스키마 직관성 폭증의 4 도구</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-pink-800 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{backgroundColor: i <= stepIdx ? '#e10098' : '#fce7f3'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{backgroundColor:'#e10098'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-pink-50/95 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-pink-300 bg-white text-pink-800 hover:bg-pink-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-pink-300 bg-white text-pink-800 hover:bg-pink-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold text-white ${playing ? 'bg-pink-900' : 'bg-pink-700 hover:bg-pink-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-pink-300 bg-white text-pink-800 hover:bg-pink-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-pink-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-pink-400 bg-white px-4 py-3 text-sm text-pink-900">
                <div className="font-bold mb-1" style={{color:'#e10098'}}>✅ 핵심 정리</div>
                Input(쓰기 인자), Enum(한정값), Interface(공통필드), Union(여러 중 하나). 네 도구가 합쳐지면 스키마가 도메인을 거의 그대로 표현한다. mutation 응답은 Union 으로 만들어 errors as data 패턴을 적용하자.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['input', 'enum', 'interface', 'union', '__resolveType', 'Relay Node'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-pink-100 text-pink-800 border border-pink-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-pink-800">
              <a href="./II-2-1.html" className="underline hover:no-underline">← II-2-1 Resolver</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 Variables + Fragment →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
