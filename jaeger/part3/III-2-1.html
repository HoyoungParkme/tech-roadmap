  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    III-2-1. Cassandra 스토리지
    학습 목표: 대규모 trace를 저장하는 Cassandra 백엔드의 스키마·쓰기/읽기 경로·TTL·운영 함정을 이해한다.
    핵심 비유: "trace_id로 사물함 번호를 정하고, 여러 사물함에 복제해서 나눠 넣는다"
    구조: 5단계 — 클러스터/파티션 → 스키마 → 쓰기 → 읽기 → TTL/함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#67CFE9';
    const DEEP = '#0E7B91';

    const STEPS = [
      {
        key: 'cluster',
        title: 'Step 1. Cassandra — trace_id로 파티션을 나누는 분산 NoSQL',
        desc: 'Cassandra는 마스터가 없는 P2P 링 구조라 노드를 더 붙이면 쓰기 처리량이 선형으로 늘어난다. Jaeger는 저장할 데이터가 append-only(한 번 쓰고 거의 수정 안 함)라 쓰기 최적화된 LSM 트리 엔진과 궁합이 좋다. 어떤 span이 어느 노드에 저장될지는 파티션 키인 trace_id의 해시(토큰)로 결정된다. 그래서 같은 trace의 span은 항상 같은 파티션에 모여, 한 번의 조회로 전체 trace를 긁어올 수 있다.',
        legend: 'trace_id 해시 → 토큰 → 담당 노드. 같은 trace의 span은 한 파티션에 모인다',
        code: {
          lang: 'yaml',
          filename: 'jaeger-cassandra.yaml — 스토리지 백엔드 지정',
          lines: [
            '# collector / query 가 바라보는 Cassandra 백엔드 설정',
            'apiVersion: jaegertracing.io/v1',
            'kind: Jaeger',
            'metadata:',
            '  name: jaeger-prod',
            'spec:',
            '  strategy: production',
            '  storage:',
            '    type: cassandra              # es 대신 cassandra 선택',
            '    options:',
            '      cassandra:',
            '        servers: cass-0,cass-1,cass-2   # 접속 시드 노드',
            '        keyspace: jaeger_v1_dc1',
            '        local-dc: dc1',
            '        connections-per-host: 4',
            '        # 쓰기 일관성: 빠르되 다수 복제본에 확인',
            '        consistency: LOCAL_QUORUM',
            '',
            '# 왜 Cassandra 인가 ─────────────────────────',
            '#  1) 마스터리스 링: 노드 추가 = 쓰기 TPS 선형 증가',
            '#  2) LSM 트리: append 위주 트레이스에 쓰기 최적화',
            '#  3) trace_id 파티셔닝: 한 trace = 한 파티션 조회',
            '#  4) rack/dc 인지 복제로 장애·지역 분산 대응',
          ],
          highlight: [8, 9, 12, 13, 17],
        },
      },
      {
        key: 'schema',
        title: 'Step 2. 스키마 — traces + 조회용 인덱스 테이블들',
        desc: 'Cassandra는 조인이 없어서 "조회하는 방식대로" 테이블을 미리 나눠 설계한다. 실제 span 본문은 traces 테이블에 trace_id 파티션으로 저장한다. UI의 검색 드롭다운을 채우려고 service_names, operation_names를 따로 둔다. 태그로 trace를 찾으려면 tag_index 같은 역인덱스가 필요한데, 여기가 카디널리티 폭탄이 터지는 지점이다. 즉 저장 스키마가 곧 가능한 쿼리의 한계를 규정한다.',
        legend: 'traces(본문) + service_names·operation_names·tag_index(조회용). 쿼리 패턴대로 테이블 분리',
        code: {
          lang: 'sql',
          filename: 'jaeger_v1_dc1.cql — Jaeger 코어 스키마 (요약)',
          lines: [
            '-- 1) span 본문: trace_id 로 파티셔닝, span_id 로 정렬',
            'CREATE TABLE traces (',
            '  trace_id     blob,',
            '  span_id      bigint,',
            '  span         blob,       -- 직렬화된 span (Thrift/Proto)',
            '  PRIMARY KEY (trace_id, span_id)',
            ') WITH default_time_to_live = 172800;   -- 2일 TTL',
            '',
            '-- 2) 검색 드롭다운 채우기용',
            'CREATE TABLE service_names (service_name text PRIMARY KEY);',
            '',
            'CREATE TABLE operation_names (',
            '  service_name   text,',
            '  operation_name text,',
            '  PRIMARY KEY (service_name, operation_name)',
            ');',
            '',
            '-- 3) 태그로 trace 찾기용 역인덱스 (카디널리티 주의)',
            'CREATE TABLE tag_index (',
            '  service_name text,',
            '  tag_key      text,',
            '  tag_value    text,',
            '  start_time   bigint,',
            '  trace_id     blob,',
            '  PRIMARY KEY ((service_name, tag_key, tag_value), start_time)',
            ') WITH CLUSTERING ORDER BY (start_time DESC);',
          ],
          highlight: [2, 6, 7, 19, 25],
        },
      },
      {
        key: 'write',
        title: 'Step 3. 쓰기 경로 — collector가 파티션에 복제하며 넣는다',
        desc: 'collector는 span을 받으면 trace_id로 토큰을 계산해 담당 노드(코디네이터)에게 넘긴다. 코디네이터는 복제 계수(RF=3)만큼 여러 노드에 동시에 쓰고, LOCAL_QUORUM이면 과반(3 중 2)의 ack만 받으면 성공으로 응답한다. 쓰기는 커밋로그 + 메모리(memtable)에 먼저 떨어져서 매우 빠르고, 나중에 디스크(SSTable)로 flush된다. 덕분에 초당 수십만 span도 흡수하지만, 한 노드가 죽어도 남은 복제본이 데이터를 지킨다.',
        legend: 'coordinator → RF=3 복제 → LOCAL_QUORUM(2 ack)면 성공. commitlog+memtable로 빠른 쓰기',
        code: {
          lang: 'sql',
          filename: 'write-path.cql — collector 가 실행하는 삽입',
          lines: [

    // ─────────────────────────────────────────────────────────
    // 좌측 시각화 — 단계별 컴포넌트
    // ─────────────────────────────────────────────────────────

    // Step 1: 링 클러스터 — trace_id 해시가 담당 노드로
    function ClusterRing() {
      const nodes = Array.from({ length: 6 }, (_, i) => {
        const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
        return {
          i,
          x: 50 + 38 * Math.cos(angle),
          y: 50 + 38 * Math.sin(angle),
          hot: i === 2,
        };
      });
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">💍</span>
            <span className="text-xs font-bold">Cassandra 링 — trace_id 해시로 파티션 배치</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">RF=3</span>
          </div>
          <div className="p-3">
            <div className="relative w-full" style={{ paddingTop: '72%' }}>
              <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full">
                <circle cx="50" cy="50" r="38" fill="none" stroke="#e2e8f0" strokeWidth="1.5" />
                {nodes.map((n) => (
                  <g key={n.i} className="fade-in" style={{ animationDelay: `${n.i * 90}ms` }}>
                    <circle cx={n.x} cy={n.y} r="7"
                      fill={n.hot ? BRAND : '#fff'}
                      stroke={DEEP} strokeWidth="1.5" />
                    <text x={n.x} y={n.y + 2.4} textAnchor="middle" fontSize="5" fontFamily="monospace" fill={DEEP}>
                      n{n.i}
                    </text>
                  </g>
                ))}
                <text x="50" y="49" textAnchor="middle" fontSize="5.5" fontFamily="monospace" fill="#334155">trace_id</text>
                <text x="50" y="56" textAnchor="middle" fontSize="4.5" fontFamily="monospace" fill="#94a3b8">0x9f2a..e1</text>
              </svg>
            </div>
            <div className="mt-2 p-2 rounded text-[11px]" style={{ background: '#E6F8FC', color: DEEP, border: '1px solid #B7EAF5' }}>
              <span className="font-bold">hash(trace_id) → token → n2.</span> 복제본은 n3, n4 에도 저장. 같은 trace 의 모든 span 은 한 파티션에.
            </div>
          </div>
        </div>
      );
    }

    // Step 2: 스키마 테이블 카드들
    function SchemaTables() {
      const tables = [
        { name: 'traces', pk: '(trace_id, span_id)', role: 'span 본문 저장', cols: ['trace_id', 'span_id', 'span'] },
        { name: 'service_names', pk: '(service_name)', role: '검색 드롭다운', cols: ['service_name'] },
        { name: 'operation_names', pk: '(service_name, op)', role: '오퍼레이션 목록', cols: ['service_name', 'operation_name'] },
        { name: 'tag_index', pk: '((svc,key,val), time)', role: '태그 역인덱스', cols: ['tag_key', 'tag_value', 'trace_id'] },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🗂️</span>
            <span className="text-xs font-bold">Jaeger 스키마 — 쿼리 패턴대로 나눈 테이블</span>
          </div>
          <div className="p-3 grid grid-cols-2 gap-2">
            {tables.map((t, i) => (
              <div key={t.name} className="fade-in rounded-lg border p-2"
                   style={{ animationDelay: `${i * 110}ms`, borderColor: '#B7EAF5', background: '#E6F8FC' }}>
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold font-mono" style={{ color: DEEP }}>{t.name}</span>
                  <span className="text-[9px] text-slate-500">{t.role}</span>
                </div>
                <div className="text-[9px] font-mono text-slate-500 mt-0.5">PK {t.pk}</div>
                <div className="flex flex-wrap gap-0.5 mt-1">
                  {t.cols.map((c) => (
                    <span key={c} className="px-1 py-0.5 rounded bg-white text-[8px] font-mono text-slate-600 border border-slate-200">{c}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="px-3 pb-3 text-[10px] text-slate-500">조인 없음 — 검색하려는 방식대로 미리 테이블을 나눠 둔다.</div>
        </div>
      );
    }

    // Step 3: 쓰기 경로 — collector → coordinator → 복제본
    function WritePath() {
      const replicas = [
        { n: 'n2', ack: true },
        { n: 'n3', ack: true },
        { n: 'n4', ack: false },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">✍️</span>
            <span className="text-xs font-bold">쓰기 경로 — collector → 복제 → LOCAL_QUORUM</span>
          </div>
          <div className="p-3">
            <div className="flex items-center gap-2 mb-3">
              <div className="px-2 py-1.5 rounded text-[10px] font-mono text-white fade-in" style={{ background: DEEP }}>collector</div>
              <span className="text-slate-400">→</span>
              <div className="px-2 py-1.5 rounded text-[10px] font-mono fade-in" style={{ background: BRAND, color: '#083344', animationDelay: '120ms' }}>coordinator (n2)</div>
            </div>
            <div className="text-[10px] text-slate-500 mb-1">복제 계수 RF=3 병렬 쓰기</div>
            <div className="space-y-1.5">
              {replicas.map((r, i) => (
                <div key={r.n} className="fade-in flex items-center gap-2" style={{ animationDelay: `${200 + i * 130}ms` }}>
                  <span className="text-[10px] font-mono text-slate-600 w-8">{r.n}</span>
                  <div className="flex-1 h-3 bg-slate-100 rounded overflow-hidden">
                    <div className="h-full grow-bar" style={{ '--target-width': r.ack ? '100%' : '55%', background: r.ack ? BRAND : '#cbd5e1', animationDelay: `${200 + i * 130}ms` }} />
                  </div>
                  <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${r.ack ? '' : 'text-slate-400 bg-slate-100'}`}
                        style={r.ack ? { background: '#E6F8FC', color: DEEP } : {}}>
                    {r.ack ? 'ack' : '…'}
                  </span>
                </div>
              ))}
            </div>
            <div className="mt-3 p-2 rounded text-[11px]" style={{ background: '#E6F8FC', color: DEEP, border: '1px solid #B7EAF5' }}>
              <span className="font-bold">2 / 3 ack → 성공 응답.</span> commitlog + memtable 에 먼저 기록해 초당 수십만 span 을 흡수한다.
            </div>
          </div>
        </div>
      );
    }

    // Step 4: 읽기 경로 — 인덱스로 좁힌 뒤 본문 조회
    function ReadPath() {
      const candidates = ['0x9f2a..e1', '0x71c4..a0', '0x33be..5d'];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🔎</span>
            <span className="text-xs font-bold">읽기 경로 — tag_index → traces 2단계</span>
          </div>
          <div className="p-3">
            <div className="rounded-lg border p-2 fade-in" style={{ borderColor: '#B7EAF5', background: '#E6F8FC' }}>
              <div className="text-[10px] font-bold" style={{ color: DEEP }}>1단계 · tag_index 조회</div>
              <div className="text-[9px] font-mono text-slate-500 mt-0.5">svc=checkout-api · status=500</div>
            </div>
            <div className="text-center text-slate-400 text-xs my-1">↓ trace_id 후보</div>
            <div className="grid grid-cols-3 gap-1 mb-2">
              {candidates.map((c, i) => (
                <div key={c} className="fade-in text-center px-1 py-1 rounded bg-white border text-[9px] font-mono text-slate-600"
                     style={{ animationDelay: `${150 + i * 120}ms`, borderColor: '#B7EAF5' }}>{c}</div>
              ))}
            </div>
            <div className="text-center text-slate-400 text-xs my-1">↓ 각 trace_id 로 단일 파티션 조회</div>
            <div className="rounded-lg border p-2 fade-in" style={{ animationDelay: '520ms', borderColor: '#B7EAF5', background: '#E6F8FC' }}>
              <div className="text-[10px] font-bold" style={{ color: DEEP }}>2단계 · traces 파티션</div>
              <div className="flex gap-0.5 mt-1">
                {Array.from({ length: 12 }, (_, i) => (
                  <div key={i} className="h-4 flex-1 rounded-sm fade-in" style={{ background: BRAND, opacity: 0.5 + (i % 3) * 0.2, animationDelay: `${560 + i * 25}ms` }} />
                ))}
              </div>
              <div className="text-[9px] text-slate-500 mt-1">span 12개 = 완성된 trace</div>
            </div>
          </div>
        </div>
      );
    }

    // Step 5: TTL 만료 + 함정
    function TtlPitfalls() {
      const rows = Array.from({ length: 8 }, (_, i) => ({ i, expired: i >= 5 }));
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">⏳</span>
            <span className="text-xs font-bold">TTL 만료 · 운영 함정</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">ttl=2d</span>
          </div>
          <div className="p-3">
            <div className="text-[10px] text-slate-500 mb-1">오래된 row 는 TTL 로 자동 만료 (회색)</div>
            <div className="space-y-1 mb-3">
              {rows.map((r) => (
                <div key={r.i} className="fade-in flex items-center gap-2" style={{ animationDelay: `${r.i * 60}ms` }}>
                  <span className="text-[9px] font-mono text-slate-400 w-14">day-{r.i}</span>
                  <div className="flex-1 h-2.5 rounded overflow-hidden bg-slate-100">
                    <div className="h-full" style={{ width: '100%', background: r.expired ? '#e2e8f0' : BRAND }} />
                  </div>
                  <span className="text-[9px] font-mono w-14 text-right" style={{ color: r.expired ? '#94a3b8' : DEEP }}>
                    {r.expired ? 'expired' : 'live'}
                  </span>
                </div>
              ))}
            </div>
            <div className="space-y-1 text-[10px]">
              <div className="p-1.5 rounded bg-red-50 border border-red-200 text-red-700"><span className="font-bold">TTL 미설정</span> → disk 무한 증가</div>
              <div className="p-1.5 rounded bg-red-50 border border-red-200 text-red-700"><span className="font-bold">고카디널리티 태그</span> → tag_index 폭발</div>
              <div className="p-1.5 rounded bg-red-50 border border-red-200 text-red-700"><span className="font-bold">핫스팟 / 넓은 시간 쿼리</span> → 타임아웃</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      let inner = null;
      if (step.key === 'cluster') inner = <ClusterRing />;
      else if (step.key === 'schema') inner = <SchemaTables />;
      else if (step.key === 'write') inner = <WritePath />;
      else if (step.key === 'read') inner = <ReadPath />;
      else if (step.key === 'ttl') inner = <TtlPitfalls />;
      return (
        <div className="space-y-2">
          {inner}
          <div className="px-3 py-2 bg-slate-50 rounded-lg border border-slate-200 text-[10px] text-slate-500 leading-snug">
            {step.legend}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 코드 뷰어
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { opacity: 0; animation: fadeIn 360ms ease-out forwards; }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar { width: 0; animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium" style={{ color: DEEP }}>&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm"
                     style={{ background: DEEP }}>III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 샘플링 · 스토리지 &gt; Chapter 2. 스토리지 백엔드</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Cassandra 스토리지</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                대규모 트레이스를 저장하는 <strong>Cassandra 백엔드</strong> — trace_id 파티셔닝·스키마·쓰기/읽기 경로·TTL 보존과
                실무 함정을 익힌다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: DEEP }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider" style={{ color: '#B7EAF5' }}>Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs" style={{ color: '#B7EAF5' }}>키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="h-1.5 rounded-full bg-slate-200 overflow-hidden">
              <div className="h-full transition-all duration-300" style={{ width: `${((stepIdx + 1) / STEPS.length) * 100}%`, background: BRAND }} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl border-2 text-sm" style={{ background: '#E6F8FC', borderColor: '#B7EAF5', color: DEEP }}>
                💡 다음(III-2-2)에서는 <strong>Elasticsearch 스토리지</strong> — 풍부한 태그 검색과 인덱싱 트레이드오프를 비교한다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[96px]"
                style={{ background: DEEP }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./III-2-2.html" className="font-medium" style={{ color: DEEP }}>III-2-2 Elasticsearch 스토리지 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
