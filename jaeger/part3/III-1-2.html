  <!--
    III-1-2. Adaptive / Tail-based 샘플링
    학습 목표: head-based의 한계를 넘어, 트래픽에 맞춰 비율을 자동 조정하거나(adaptive)
              트레이스 완료 후 에러·느린 것을 우선 보존하는(tail) 고급 전략을 익힌다.
    핵심 비유: "자동 온도조절기(adaptive) vs 시험 채점 후 우수답안 보존(tail)"
    구조: 5단계 — head 한계 → adaptive 자동조정 → tail 사후결정 → 에러 100% 정책 → 3전략 비교
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#67CFE9';
    const DEEP = '#0E7B91';

    const STEPS = [
      {
        key: 'limit',
        title: 'Step 1. head-based의 한계 — 저트래픽 서비스는 굶고, 희소 에러는 놓친다',

        legend: '고정 비율의 두 맹점 — 저트래픽 과소 샘플 + 결과를 모른 채 앞에서 결정',
        code: {
          lang: 'yaml',
          filename: 'problem-recap.yaml — 고정 비율의 두 맹점',
          lines: [
            '# III-1-1 복습: probabilistic 1% 고정의 문제점',
            'default_strategy:',
            '  type: probabilistic',

            '# 맹점 1) 저트래픽 서비스 과소 샘플 ─────────',
            '#  checkout-api : 5,000 rps × 1% = 50 trace/s  (충분)',

            '# 맹점 2) 결과를 모른 채 앞(head)에서 결정 ──',

      {
        key: 'adaptive',

        desc: 'Adaptive 샘플링은 head-based의 진화다. collector가 서비스·operation별 실제 처리량을 계속 관측하다가, 각각이 목표 trace/s(target)에 수렴하도록 확률을 주기적으로(예: 1분마다) 다시 계산한다. 저트래픽 admin-api는 비율을 확 올려 목표를 채우고, 폭주하는 checkout-api는 비율을 내려 과금을 막는다. 운영자가 서비스마다 손으로 튜닝하던 per_service_strategies를 collector가 대신 해주는 셈이다. 저장에는 메모리 기반 또는 스토리지 기반 전략 저장소가 필요하다.',
        legend: '목표 target trace/s로 수렴 — 비율은 트래픽에 반비례해 collector가 자동 조정',
        code: {
          lang: 'yaml',
          filename: 'jaeger-adaptive.yaml — collector 자동 조정',
          lines: [
            '# Adaptive: collector가 목표 처리량에 맞춰 비율 자동 계산',
            'apiVersion: jaegertracing.io/v1',
            'kind: Jaeger',
            'metadata:',
            '  name: jaeger-adaptive',
            'spec:',
            '  strategy: production',
            '  collector:',
            '    options:',
            '      sampling:',
            '        strategies:',
            '          # adaptive 모드 활성화',

            '    type: elasticsearch          # 전략 저장소로도 사용',

            '#   2) target(1/s) 대비 필요한 확률 재계산',
            '#      p = target / observed_qps  (상·하한 clamp)',
            '#   3) 새 확률을 각 client에 원격 전파',
            '#  → admin-api(3qps): p≈0.33  (거의 다 잡음)',
            '#  → checkout-api(5000qps): p≈0.0002 (과금 방지)',

          highlight: [12, 13, 15, 17, 19, 21],
        },
      },
      {
        key: 'tail',
        title: 'Step 3. Tail-based — trace 완료까지 기다렸다가 결과를 보고 결정',
        desc: 'Tail-based는 결정 시점을 아예 뒤(tail)로 옮긴다. OTel Collector의 tail_sampling processor가 한 trace의 모든 span을 decision_wait 시간 동안 메모리에 모은 뒤, 그 trace가 에러였는지·느렸는지 보고 나서 보존 여부를 정한다. 그래서 "에러 난 trace는 100% 보존" 같은, head-based로는 불가능한 정책이 가능하다. 대신 완성될 때까지 버퍼링하므로 메모리를 많이 쓰고, 모든 span이 같은 collector로 모여야 해서(trace_id 기반 로드밸런싱) 아키텍처가 복잡해진다.',
        legend: 'decision_wait 동안 span 모아 완성 → 결과(에러·지연)를 보고 사후 판정',
        code: {
          lang: 'yaml',
          filename: 'otel-collector.yaml — tail_sampling processor',
          lines: [
            '# OpenTelemetry Collector: 완료된 trace를 보고 결정',
            'processors:',
            '  tail_sampling:',
            '    # trace 완성을 기다리는 시간 (첫 span 이후)',
            '    decision_wait: 10s',
            '    # 동시에 추적 중인 최대 trace 수 (메모리 상한)',
            '    num_traces: 100000',
            '    # 초당 신규 trace 유입 상한',
            '    expected_new_traces_per_sec: 2000',
            '    policies:',
            '      # 1) 에러는 무조건 100% 보존',
            '      - name: keep-errors',
            '        type: status_code',
            '        status_code:',
            '          status_codes: [ERROR]',

          ],
          highlight: [3, 5, 11, 12, 13, 16, 17, 18, 21, 22, 23],
        },
      },
      {
        key: 'policy',
        title: 'Step 4. 에러 100% 보존 — tail 정책은 위에서 아래로, OR 결합',
        desc: 'tail_sampling의 policies는 배열 순서대로 평가되고 "하나라도 통과하면 보존"하는 OR 결합이다. 그래서 status_code=ERROR와 latency>500ms를 앞에 두면, 정상 trace를 1%로 줄이면서도 에러와 느린 요청은 빠짐없이 잡는다. 실무에선 여기에 특정 고객(attribute)·특정 endpoint를 and_policy로 조합해 "VIP의 결제 실패는 전량 보존" 같은 정교한 규칙을 만든다. 함정은 정책이 늘수록 튜닝이 어려워지고, decision_wait보다 늦게 도착한 span은 판정에서 누락된다는 점이다.',
        legend: '정책 OR 평가 — 에러·지연은 전량, 정상은 소량. 순서와 결합이 핵심',

          lang: 'yaml',
          filename: 'tail-policies-advanced.yaml — 조합 정책',
          lines: [
            '# 정교한 정책: and_policy로 조건 결합',
            'tail_sampling:',
            '  decision_wait: 10s',
            '  policies:',

            '      and:',
            '        and_sub_policy:',
            '          - name: is-error',
            '            type: status_code',
            '            status_code:',
            '              status_codes: [ERROR]',
            '          - name: is-vip',
            '            type: string_attribute',
            '            string_attribute:',
            '              key: customer.tier',
            '              values: [vip, enterprise]',
            '    # B) 그 외 모든 에러도 보존',
            '    - name: all-errors',
            '      type: status_code',
            '      status_code:',
            '        status_codes: [ERROR]',
            '    # C) 정상 trace는 0.5%만',
            '    - name: baseline',
            '      type: probabilistic',
            '      probabilistic:',
            '        sampling_percentage: 0.5',
            '',
            '# 평가 규칙 ─────────────────────────────',
            '#  policies는 OR — 하나라도 keep이면 보존',
            '#  and 내부의 and_sub_policy는 AND — 모두 참이어야',
            '#  함정: decision_wait 후 도착한 span은 누락',
          ],
          highlight: [6, 7, 8, 10, 11, 14, 15, 19, 20, 21],
        },
      },
      {
        key: 'compare',
        title: 'Step 5. 언제 무엇을 — head / adaptive / tail 선택 기준',
        desc: '세 전략은 대체재가 아니라 계층이다. 시작은 head-based probabilistic(단순·저비용)로 하고, 서비스별 트래픽 편차가 커서 손튜닝이 힘들면 adaptive로 올린다. 에러·지연을 반드시 놓치지 말아야 하는 핵심 서비스에는 tail-based를 붙인다. 흔한 프로덕션 구성은 "엣지에서 head로 1차 걸러 collector 부하를 줄이고, tail collector에서 에러·느린 것을 다시 건져 올리는" 2단 구조다. tail은 메모리·완성 대기·로드밸런싱 비용이 크므로 전 구간이 아니라 중요한 경로에만 선택 적용한다.',
        legend: 'head→adaptive→tail은 계층 — 단순·저비용에서 정교·고비용으로. 핵심 경로만 tail',
        code: {
          lang: 'yaml',
          filename: 'decision-guide.yaml — 선택 기준 요약',
          lines: [
            '# 세 전략 비교표 ─────────────────────────',
            '#                    head      adaptive   tail',
            '#  결정 시점         시작       시작        완료 후',
            '#  에러 100% 보존    ✕          ✕           ◎',
            '#  저트래픽 보정     ✕          ◎           △',
            '#  비용(메모리)      낮음       낮음        높음',
            '#  구현/운영 난이도  ◎ 단순     △           ✕ 복잡',
            '#  서비스간 일관성   ◎          ◎           ◎(완성 대기)',

            '# 선택 플로우 ───────────────────────────',

            '#  3) 에러/지연 절대 놓치면 안 됨 → tail 추가',
            '',
            '# 실무 2단 구성 (권장) ──────────────────',
            'pipeline:',
            '  edge-agent:',
            '    sampling: head-probabilistic   # 1차 부하 차단',
            '    param: 0.1',
            '  tail-collector:',
            '    sampling: tail_sampling        # 2차 정밀 선별',
            '    keep: [errors, slow>500ms]',
            '    loadbalancing: by-trace-id     # 같은 trace는 한 곳으로',
            '',
            '# 흔한 함정 ─────────────────────────────',
            '#  ✗ adaptive 파라미터가 많아 초기 튜닝이 까다로움',
            '#  ✗ tail decision_wait만큼 결과가 지연 노출',
            '#  ✗ tail은 메모리·LB 비용 → 전 구간 적용 금물',
            '#  ✗ 저트래픽 서비스는 여전히 min-probability로 방어',
          ],
          highlight: [16, 17, 18, 19, 20, 21, 22, 23],
        },
      },
    ];

    // ─────────────────────────────────────────────────────────
    // 좌측 시각화 — 단계별 컴포넌트
    // ─────────────────────────────────────────────────────────

    // Step 1: head-based 한계 — 저트래픽 과소 + 희소 에러 놓침
    function HeadLimit() {
      const svcs = [
        { name: 'checkout-api', qps: 5000, sampled: 50, ok: true },
        { name: 'search-api', qps: 1200, sampled: 12, ok: true },
        { name: 'admin-api', qps: 3, sampled: 0, ok: false },
        { name: 'batch-worker', qps: 8, sampled: 0, ok: false },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">📉</span>
            <span className="text-xs font-bold">고정 1% 샘플 — 서비스별 실제 획득량</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">param=0.01</span>
          </div>
          <div className="p-3 space-y-2">
            {svcs.map((s, i) => (
              <div key={i} className="fade-in flex items-center gap-2 text-[10px] font-mono"
                   style={{ animationDelay: `${i * 90}ms` }}>
                <span className="w-24 text-slate-700">{s.name}</span>
                <span className="w-16 text-slate-400 text-right">{s.qps} qps</span>
                <div className="flex-1 h-3 bg-slate-100 rounded overflow-hidden">
                  <div className="h-full grow-bar" style={{
                    '--target-width': `${Math.min(100, s.sampled * 2)}%`,
                    background: s.ok ? BRAND : '#dc2626',
                    animationDelay: `${i * 90}ms`,
                  }} />
                </div>
                <span className={`w-20 text-right font-bold ${s.ok ? 'text-cyan-700' : 'text-red-600'}`}>
                  {s.sampled}/s
                </span>
              </div>
            ))}
            <div className="mt-2 p-2 rounded bg-red-50 border border-red-200 text-[11px] text-red-700">
              <span className="font-bold">⚠ 저트래픽 서비스 굶음</span> — admin-api는 하루 종일 거의 trace 없음. 희소 에러는 1%로만 포착.
            </div>
          </div>
        </div>
      );
    }

    // Step 2: Adaptive — 목표 target으로 자동 수렴
    function AdaptiveTune() {
      const svcs = [
        { name: 'admin-api', qps: 3, before: 0.01, after: 0.33, dir: 'up' },
        { name: 'search-api', qps: 1200, before: 0.01, after: 0.0008, dir: 'down' },
        { name: 'checkout-api', qps: 5000, before: 0.01, after: 0.0002, dir: 'down' },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🎚️</span>
            <span className="text-xs font-bold">Adaptive — collector 자동 조정 (target 1/s)</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">1분마다 재계산</span>
          </div>
          <div className="p-3 space-y-2">
            {svcs.map((s, i) => (
              <div key={i} className="fade-in" style={{ animationDelay: `${i * 120}ms` }}>
                <div className="flex items-center gap-2 text-[10px] font-mono mb-0.5">
                  <span className="w-24 text-slate-700">{s.name}</span>
                  <span className="w-16 text-slate-400 text-right">{s.qps} qps</span>
                  <span className="text-slate-400">p:</span>
                  <span className="text-slate-400 line-through">{s.before}</span>
                  <span style={{ color: s.dir === 'up' ? '#059669' : DEEP }} className="font-bold">
                    → {s.after}
                  </span>
                  <span className="ml-auto" style={{ color: s.dir === 'up' ? '#059669' : '#0891b2' }}>
                    {s.dir === 'up' ? '▲ 올림' : '▼ 내림'}
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <div className="flex-1 h-2 bg-slate-100 rounded overflow-hidden">
                    <div className="h-full grow-bar" style={{
                      '--target-width': '100%', background: BRAND, animationDelay: `${i * 120 + 200}ms`,
                    }} />
                  </div>
                  <span className="text-[9px] font-mono text-cyan-700 w-20 text-right">≈ 1 trace/s</span>
                </div>
              </div>
            ))}
            <div className="mt-2 p-2 rounded border text-[11px]" style={{ background: '#E6F8FC', borderColor: '#B7EAF5', color: DEEP }}>
              <span className="font-bold">모두 목표 1/s로 수렴.</span> 저트래픽은 비율↑, 폭주는 비율↓ — 손튜닝 없이 collector가 조정.
            </div>
          </div>
        </div>
      );
    }

    // Step 3: Tail-based — 버퍼에 모아 완성 후 판정
    function TailBuffer() {
      const traces = [
        { id: 'a1f3', spans: 6, verdict: 'error', keep: true, why: 'status=ERROR' },
        { id: 'b7c2', spans: 4, verdict: 'slow', keep: true, why: '720ms > 500ms' },
        { id: 'c9d1', spans: 5, verdict: 'ok', keep: false, why: '정상 · 1% 탈락' },
        { id: 'e2a8', spans: 3, verdict: 'ok', keep: true, why: '정상 · 1% 당첨' },
      ];
      const color = (v) => v === 'error' ? '#dc2626' : v === 'slow' ? '#d97706' : '#64748b';
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">⏳</span>
            <span className="text-xs font-bold">Tail — decision_wait 후 완성 trace 판정</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">buffer 10s</span>
          </div>
          <div className="p-3 space-y-1.5">
            {traces.map((t, i) => (
              <div key={i} className="fade-in flex items-center gap-2 text-[10px] font-mono"
                   style={{ animationDelay: `${i * 110}ms` }}>
                <span className="text-slate-500 w-10">{t.id}</span>
                <div className="flex gap-0.5 w-20">
                  {Array.from({ length: t.spans }).map((_, j) => (
                    <span key={j} className="h-3 w-2 rounded-sm" style={{ background: color(t.verdict) }} />
                  ))}
                </div>
                <span className="w-28 text-slate-500">{t.why}</span>
                <span className={`ml-auto px-1.5 py-0.5 rounded text-[9px] font-bold ${t.keep ? 'text-white' : 'bg-slate-100 text-slate-400'}`}
                      style={t.keep ? { background: DEEP } : {}}>
                  {t.keep ? 'KEEP' : 'drop'}
                </span>
              </div>
            ))}
            <div className="mt-2 p-2 rounded border text-[11px]" style={{ background: '#E6F8FC', borderColor: '#B7EAF5', color: DEEP }}>
              <span className="font-bold">완성된 뒤 결과로 판정.</span> 에러·느린 것은 100% KEEP, 정상은 1%만. head로는 불가능한 정책.
            </div>
          </div>
        </div>
      );
    }

    // Step 4: 정책 OR 평가 파이프
    function PolicyPipe() {
      const req = { tier: 'vip', status: 'ERROR', ms: 240 };
      const rules = [
        { name: 'A. VIP AND error', hit: true, note: 'tier=vip ∧ ERROR → 참' },
        { name: 'B. all errors', hit: true, note: 'ERROR → 참' },
        { name: 'C. baseline 0.5%', hit: false, note: '앞서 KEEP되어 미평가' },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🧭</span>
            <span className="text-xs font-bold">정책 평가 — 위에서 아래로, OR 결합</span>
          </div>
          <div className="p-3">
            <div className="mb-3 p-2 rounded bg-slate-50 border border-slate-200 text-[10px] font-mono text-slate-600 fade-in">
              입력 trace: customer.tier=<span className="font-bold text-slate-800">vip</span> · status=<span className="font-bold text-red-600">ERROR</span> · latency=240ms
            </div>
            <div className="space-y-1.5">
              {rules.map((r, i) => (
                <div key={i} className="fade-in flex items-center gap-2 text-[11px] font-mono px-2 py-1.5 rounded border"
                     style={{
                       animationDelay: `${i * 160}ms`,
                       background: r.hit ? '#E6F8FC' : '#f8fafc',
                       borderColor: r.hit ? '#B7EAF5' : '#e2e8f0',
                     }}>
                  <span className={`w-4 text-center font-bold ${r.hit ? 'text-cyan-700' : 'text-slate-300'}`}>
                    {r.hit ? '✓' : '·'}
                  </span>
                  <span className={r.hit ? 'text-slate-800 font-bold' : 'text-slate-400'}>{r.name}</span>
                  <span className="ml-auto text-[9px] text-slate-400">{r.note}</span>
                </div>
              ))}
            </div>
            <div className="mt-3 p-2 rounded text-white text-[11px] text-center font-bold fade-in"
                 style={{ background: DEEP, animationDelay: '560ms' }}>
              하나라도 참(A) → 이 trace는 보존(KEEP)
            </div>
          </div>
        </div>
      );
    }

    // Step 5: 3전략 비교표
    function CompareMatrix() {
      const rows = [
        ['결정 시점', '시작', '시작', '완료 후'],
        ['에러 100%', '✕', '✕', '◎'],
        ['저트래픽 보정', '✕', '◎', '△'],
        ['메모리 비용', '낮음', '낮음', '높음'],
        ['운영 난이도', '◎ 단순', '△', '✕ 복잡'],
      ];
      const mark = (v) => v === '◎' ? 'text-cyan-700 font-bold' : v === '✕' ? 'text-red-500' : v === '△' ? 'text-amber-600' : 'text-slate-600';
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🧮</span>
            <span className="text-xs font-bold">head · adaptive · tail 비교</span>
          </div>
          <div className="p-3">
            <table className="w-full text-[10px] font-mono">
              <thead>
                <tr className="text-slate-500">
                  <th className="text-left py-1"></th>
                  <th className="py-1">head</th>
                  <th className="py-1">adaptive</th>
                  <th className="py-1" style={{ color: DEEP }}>tail</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => (
                  <tr key={i} className="fade-in border-t border-slate-100" style={{ animationDelay: `${i * 90}ms` }}>
                    <td className="text-left py-1.5 text-slate-600">{r[0]}</td>
                    <td className={`text-center ${mark(r[1])}`}>{r[1]}</td>
                    <td className={`text-center ${mark(r[2])}`}>{r[2]}</td>
                    <td className={`text-center ${mark(r[3])}`}>{r[3]}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-3 p-2 rounded border text-[11px] leading-snug" style={{ background: '#E6F8FC', borderColor: '#B7EAF5', color: DEEP }}>
              <span className="font-bold">계층으로 쌓는다.</span> head로 시작 → 편차 크면 adaptive → 핵심 경로엔 tail. 흔한 구성은 엣지 head + tail collector 2단.
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      let inner = null;
      if (step.key === 'limit') inner = <HeadLimit />;
      else if (step.key === 'adaptive') inner = <AdaptiveTune />;
      else if (step.key === 'tail') inner = <TailBuffer />;
      else if (step.key === 'policy') inner = <PolicyPipe />;
      else if (step.key === 'compare') inner = <CompareMatrix />;
      return (
        <div className="space-y-2">
          {inner}
          <div className="px-3 py-2 bg-slate-50 rounded-lg border border-slate-200 text-[10px] text-slate-500 leading-snug">
            {step.legend}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 코드 뷰어
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[30rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { opacity: 0; animation: fadeIn 360ms ease-out forwards; }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar { width: 0; animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium" style={{ color: DEEP }}>&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm"
                     style={{ background: BRAND }}>III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 샘플링 · 스토리지 &gt; Chapter 1. 고급 샘플링</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Adaptive / Tail-based 샘플링</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                상황에 맞춰 샘플링 비율을 조정하는 고급 전략 — <strong>collector가 트래픽에 맞춰 비율을 자동 조정(adaptive)</strong>하고,
                <strong> trace 완료 후 에러·느린 것을 우선 보존(tail-based)</strong>하는 두 진화를 익힌다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: DEEP }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-100">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-cyan-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl border-2 text-cyan-900 text-sm" style={{ background: '#E6F8FC', borderColor: '#B7EAF5' }}>
                💡 다음(III-2-1)에서는 <strong>스토리지 백엔드</strong> — 샘플링으로 걸러낸 trace를 어디에 어떻게 저장할지 다룬다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[96px]"
                style={{ background: BRAND }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./III-2-1.html" className="font-medium" style={{ color: DEEP }}>III-2-1 스토리지 백엔드 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
