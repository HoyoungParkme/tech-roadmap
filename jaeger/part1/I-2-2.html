    // ── 좌측: LiveDataPane — 자동/수동 계측 + OTLP + 문맥 전파 시각화
    function LiveDataPane({ step, stepIdx }) {
      const animKey = `step-${stepIdx}`;
      const isAuto     = step.focus === 'auto';
      const isManual   = step.focus === 'manual';
      const isExport   = step.focus === 'export';
      const isProp     = step.focus === 'propagate';
      const isPitfall  = step.focus === 'pitfall';

      const spanStyle = (kind) => {
        switch (kind) {
          case 'auto':   return { cls: 'bg-cyan-50 border-cyan-300 text-cyan-900', badge: 'bg-cyan-100 text-cyan-800 border-cyan-300', icon: '⚙️' };
          case 'manual': return { cls: 'bg-emerald-50 border-emerald-300 text-emerald-900', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300', icon: '✍️' };
          case 'gap':    return { cls: 'bg-slate-50 border-dashed border-slate-400 text-slate-500', badge: 'bg-slate-100 text-slate-500 border-slate-300', icon: '⬚' };
          case 'pipe':   return { cls: 'bg-sky-50 border-sky-300 text-sky-900', badge: 'bg-sky-100 text-sky-800 border-sky-300', icon: '🔧' };
          case 'sink':   return { cls: 'bg-cyan-50 border-cyan-400 text-cyan-900 ring-2 ring-cyan-200', badge: 'bg-cyan-100 text-cyan-800 border-cyan-300', icon: '🗄️' };
          case 'ctx':    return { cls: 'bg-cyan-50 border-cyan-300 text-cyan-900', badge: 'bg-cyan-100 text-cyan-800 border-cyan-300', icon: '🔗' };
          case 'broken': return { cls: 'bg-rose-50 border-rose-400 text-rose-900', badge: 'bg-rose-100 text-rose-800 border-rose-300', icon: '⛓️‍💥' };
          case 'bad':    return { cls: 'bg-rose-50 border-rose-300 text-rose-900', badge: 'bg-rose-100 text-rose-800 border-rose-300', icon: '⚠️' };
          case 'good':   return { cls: 'bg-emerald-50 border-emerald-400 text-emerald-900 ring-2 ring-emerald-200', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300', icon: '✅' };
          default:       return { cls: 'bg-slate-50 border-slate-300 text-slate-700', badge: 'bg-slate-100 text-slate-600 border-slate-300', icon: '📦' };
        }
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm" key={animKey}>
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🩺</span>
              <span className="text-xs font-bold text-slate-700">계측(Instrumentation) — Live View</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">step {stepIdx + 1}/5</span>
          </div>

          <div className="p-4 space-y-4 min-h-[420px]">

            {/* 계측 단계 5 카드 */}
            <div className="grid grid-cols-5 gap-1.5">
              {[
                { key: 'auto',      emoji: '⚙️', name: '자동',   note: '라이브러리' },
                { key: 'manual',    emoji: '✍️', name: '수동',   note: '비즈니스' },
                { key: 'export',    emoji: '📤', name: 'OTLP',   note: 'Jaeger 전송' },
                { key: 'propagate', emoji: '🔗', name: '전파',   note: '서비스 간' },
                { key: 'pitfall',   emoji: '⚠️', name: '함정',   note: '안티패턴' },
              ].map((p) => {
                const active = step.focus === p.key;
                return (
                  <div
                    key={p.key}
                    className={`rounded-lg p-1.5 text-center transition-all duration-300 ${active ? 'bg-cyan-100 border-2 border-cyan-400 scale-105 shadow-sm' : 'bg-slate-50 border border-slate-200'}`}
                  >
                    <div className="text-lg">{p.emoji}</div>
                    <div className="text-[10px] font-bold text-slate-800 mt-0.5">{p.name}</div>
                    <div className="text-[8px] text-slate-500 mt-0.5 leading-tight">{p.note}</div>
                  </div>
                );
              })}
            </div>

            {/* 요청 흐름 다이어그램 (자동/수동/함정) */}
            {(isAuto || isManual || isPitfall) && (
              <div className="space-y-2 fade-in">
                <div className="text-[10px] text-slate-500 font-mono px-1">
                  {isPitfall ? '계측 함정 4종 — 무엇을 span 으로 만들지가 관건' : '요청 경로의 span 트리 — ⚙️자동 · ✍️수동 · ⬚공백'}
                </div>
                {step.spans.map((s, idx) => {
                  const st = spanStyle(s.kind);
                  return (
                    <div
                      key={`${stepIdx}-${s.id}`}
                      className={`rounded-lg border-2 px-3 py-2 flex items-center justify-between transition-all duration-500 fade-in ${st.cls}`}
                      style={{ animationDelay: `${idx * 120}ms` }}
                    >
                      <div className="flex items-center gap-2">
                        <span className="text-sm">{st.icon}</span>
                        <span className="text-[11px] font-mono font-bold">{s.name}</span>
                      </div>
                      <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded border ${st.badge}`}>{s.note}</span>
                    </div>
                  );
                })}
              </div>
            )}

            {/* OTLP export 파이프라인 */}
            {isExport && (
              <div className="space-y-2 fade-in">
                <div className="text-[10px] text-slate-500 font-mono px-1">SDK 파이프라인 — span 수집 → OTLP 전송 → Jaeger 수신</div>
                {step.spans.map((s, idx) => {
                  const st = spanStyle(s.kind);
                  return (
                    <div key={`${stepIdx}-${s.id}`} className="fade-in" style={{ animationDelay: `${idx * 150}ms` }}>
                      <div className={`rounded-lg border-2 px-3 py-2 flex items-center justify-between ${st.cls}`}>
                        <div className="flex items-center gap-2">
                          <span className="text-sm">{st.icon}</span>
                          <span className="text-[11px] font-mono font-bold">{s.name}</span>
                        </div>
                        <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded border ${st.badge}`}>{s.note}</span>
                      </div>
                      {idx < step.spans.length - 1 && (
                        <div className="text-center text-cyan-500 text-sm leading-none my-0.5">▼</div>
                      )}
                    </div>
                  );
                })}
                <div className="mt-2 p-2 rounded-lg" style={{ backgroundColor: '#E6F8FC', borderLeft: '4px solid #67CFE9' }}>
                  <div className="text-[10px] text-cyan-700">endpoint 주소만 바꾸면 개발(console) ↔ 운영(Jaeger) 전환</div>
                </div>
              </div>
            )}

            {/* 문맥 전파 — inject/extract 흐름 */}
            {isProp && (
              <div className="space-y-3 fade-in">
                <div className="text-[10px] text-slate-500 font-mono px-1">문맥 전파 — traceparent 헤더로 trace_id 를 넘긴다</div>
                <div className="flex items-center gap-2">
                  <div className="flex-1 rounded-lg border-2 border-cyan-300 bg-cyan-50 px-3 py-2 text-center">
                    <div className="text-[11px] font-mono font-bold text-cyan-900">checkout</div>
                    <div className="text-[9px] text-cyan-700 mt-0.5">inject(headers)</div>
                  </div>
                  <div className="text-center">
                    <div className="text-cyan-500 text-lg leading-none">→</div>
                    <div className="text-[8px] text-slate-500 font-mono">traceparent</div>
                  </div>
                  <div className="flex-1 rounded-lg border-2 border-cyan-300 bg-cyan-50 px-3 py-2 text-center">
                    <div className="text-[11px] font-mono font-bold text-cyan-900">pricing</div>
                    <div className="text-[9px] text-cyan-700 mt-0.5">extract(headers)</div>
                  </div>
                </div>
                <div className="p-2 rounded-lg" style={{ backgroundColor: '#E6F8FC', borderLeft: '4px solid #67CFE9' }}>
                  <div className="text-[10px] font-mono text-cyan-900">traceparent: 00-<span className="font-bold">4bf92f…a3ce</span>-00f067aa0ba9-01</div>
                  <div className="text-[10px] text-cyan-700 mt-0.5">→ 같은 trace_id 로 두 서비스 span 이 하나로 연결</div>
                </div>
                <div className="rounded-lg border-2 border-rose-300 bg-rose-50 px-3 py-2 flex items-center justify-between">
                  <span className="text-[11px] font-mono font-bold text-rose-900">헤더 전파 누락 시</span>
                  <span className="text-[9px] font-mono px-1.5 py-0.5 rounded border bg-rose-100 text-rose-800 border-rose-300">span 고아 = trace 끊김</span>
                </div>
              </div>
            )}

          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[10px] text-slate-600 leading-snug font-medium">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
              opacity: 0;
              animation: fadeIn 360ms ease-out forwards;
            }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium" style={{ color: '#0E7B91' }}>&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ backgroundColor: '#67CFE9' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. 분산 추적 기초 &gt; Chapter 2. 계측</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Instrumentation (계측)</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                코드에 트레이싱을 넣는 자동·수동 계측 —
                <code className="bg-slate-100 px-1 rounded text-xs">자동 계측</code>은 프레임워크·HTTP·DB 라이브러리가 span 을 자동 생성하고,
                <code className="bg-slate-100 px-1 rounded text-xs">수동 계측</code>은 비즈니스 로직에 span·태그를 더한다.
                OpenTelemetry SDK 로 계측해 <code className="bg-slate-100 px-1 rounded text-xs">OTLP</code> 로 Jaeger 에 보낸다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ backgroundColor: '#0E7B91' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider" style={{ color: '#B7EAF5' }}>Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs" style={{ color: '#B7EAF5' }}>키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl text-sm" style={{ backgroundColor: '#E6F8FC', border: '2px solid #67CFE9', color: '#0E5567' }}>
                💡 다음(Part II)에서는 <strong>Jaeger 아키텍처</strong> — Collector · Query · Storage 로 span 이 수집·저장·조회되는 흐름
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[96px]" style={{ backgroundColor: '#0E7B91' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="../part2/II-1-1.html" className="font-medium" style={{ color: '#0E7B91' }}>II-1-1 Jaeger 아키텍처 &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
