<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaeger 인터랙티브 학습</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔭</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
  </style>
  <!-- 필기노트 공통 스킨(hub) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-image:none !important; background-color:#fffdf7 !important; font-family:Pretendard, system-ui, sans-serif; }
    #root > div { background-image:none !important; background-color:#fffdf7 !important; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color:#faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color:#2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color:#57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color:#8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color:#cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow:3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius:8px !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color:#faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!--
    Jaeger 인터랙티브 학습 — 사이드바 + iframe (observability/k8s 표준 패턴)
    역할: 5 Parts × 20 sections, Phase A 시점 8개 ready / 12 planned
    색상: cyan / #67CFE9 (Jaeger 공식 청록)
  -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SECTIONS = [
      {
        part: 'I',
        label: 'Part I. 분산 추적 기초',
        color: 'bg-cyan-700',
        items: [
          { id: 'I-1-1', title: '분산 추적이란 무엇인가', file: './part1/I-1-1.html' },
          { id: 'I-1-2', title: 'Trace와 Span 모델', file: './part1/I-1-2.html' },
          { id: 'I-2-1', title: 'Jaeger 아키텍처 개요', file: './part1/I-2-1.html' },
          { id: 'I-2-2', title: 'Instrumentation (계측)', file: './part1/I-2-2.html' },
        ],
      },
      {
        part: 'II',
        label: 'Part II. Agent · Collector · Query',
        color: 'bg-cyan-600',
        items: [
          { id: 'II-1-1', title: 'jaeger-agent (sidecar)', file: './part2/II-1-1.html' },
          { id: 'II-1-2', title: 'jaeger-collector', file: './part2/II-1-2.html' },
          { id: 'II-2-1', title: 'jaeger-query + Storage 읽기', file: './part2/II-2-1.html' },
          { id: 'II-2-2', title: 'Jaeger UI 구조', file: './part2/II-2-2.html' },
        ],
      },
      {
        part: 'III',
        label: 'Part III. 샘플링 · 스토리지',
        color: 'bg-cyan-500',
        items: [
          { id: 'III-1-1', title: 'Probabilistic / Rate-Limiting 샘플링', file: './part3/III-1-1.html' },
          { id: 'III-1-2', title: 'Adaptive / Tail-based 샘플링', file: './part3/III-1-2.html' },
          { id: 'III-2-1', title: 'Cassandra 스토리지', file: './part3/III-2-1.html' },
          { id: 'III-2-2', title: 'Elasticsearch + Badger', file: './part3/III-2-2.html' },
        ],
      },
      {
        part: 'IV',
        label: 'Part IV. UI · 분석',
        color: 'bg-cyan-400',
        items: [
          { id: 'IV-1-1', title: 'Timeline 폭포수 읽기', file: './part4/IV-1-1.html' },
          { id: 'IV-1-2', title: 'Dependencies 그래프', file: './part4/IV-1-2.html' },
          { id: 'IV-2-1', title: 'Trace Comparison', file: './part4/IV-2-1.html' },
          { id: 'IV-2-2', title: 'Critical Path 분석', file: './part4/IV-2-2.html' },
        ],
      },
      {
        part: 'V',
        label: 'Part V. 실전 운영',
        color: 'bg-cyan-300',
        items: [
          { id: 'V-1-1', title: 'HA / Sharding', file: './part5/V-1-1.html' },
          { id: 'V-1-2', title: 'Retention 정책', file: './part5/V-1-2.html' },
          { id: 'V-2-1', title: 'OpenTelemetry 마이그레이션', file: './part5/V-2-1.html' },
          { id: 'V-2-2', title: '실전 체크리스트', file: './part5/V-2-2.html' },
        ],
      },
    ];

    const TOTAL = SECTIONS.reduce((s, sec) => s + sec.items.length, 0);
    const READY = SECTIONS.reduce((s, sec) => s + sec.items.filter(i => i.file).length, 0);

    const PART_BG = {
      I: 'hover:bg-cyan-50', II: 'hover:bg-cyan-50', III: 'hover:bg-cyan-50',
      IV: 'hover:bg-cyan-50', V: 'hover:bg-cyan-50',
    };
    const PART_ACTIVE = {
      I: 'bg-cyan-100 text-cyan-800 font-bold',
      II: 'bg-cyan-100 text-cyan-800 font-bold',
      III: 'bg-cyan-100 text-cyan-800 font-bold',
      IV: 'bg-cyan-100 text-cyan-800 font-bold',
      V: 'bg-cyan-100 text-cyan-800 font-bold',
    };

    function findItemById(id) {
      for (const section of SECTIONS) {
        const found = section.items.find(item => item.id === id);
        if (found) return { ...found, part: section.part };
      }
      return null;
    }

    function App() {
      const [activeId, setActiveId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [expandedParts, setExpandedParts] = useState({ I: true, II: true, III: true, IV: true, V: true });

      const activeItem = activeId ? findItemById(activeId) : null;

      const navigate = useCallback((id, file) => {
        if (!file) return;
        setActiveId(id);
        window.location.hash = id;
        if (window.innerWidth < 1024) setSidebarOpen(false);
      }, []);

      useEffect(() => {
        const hash = window.location.hash.slice(1);
        if (hash) {
          const it = findItemById(hash);
          if (it && it.file) setActiveId(hash);
        }
        const onHash = () => {
          const h = window.location.hash.slice(1);
          const it = findItemById(h);
          if (it && it.file) setActiveId(h);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const togglePart = (part) => {
        setExpandedParts(prev => ({ ...prev, [part]: !prev[part] }));
      };

      return (
        <div className="h-full flex bg-slate-100">
          {sidebarOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-30 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />
          )}
          <aside className={`fixed lg:static z-40 h-full w-72 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0 lg:w-72'}`}>
            <div className="p-4 border-b border-slate-200 shrink-0">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 flex items-center justify-center rounded-lg font-bold text-sm text-white" style={{ backgroundColor: '#67CFE9' }}>J</div>
                <div>
                  <div className="font-bold text-slate-800 text-sm">Jaeger 학습</div>
                  <div className="text-[11px] text-slate-500">{READY}/{TOTAL} 시각화 (Phase A — 40%)</div>
                </div>
              </div>
            </div>
            <nav className="flex-1 overflow-y-auto p-2">
              {SECTIONS.map((section) => (
                <div key={section.part} className="mb-1">
                  <button
                    onClick={() => togglePart(section.part)}
                    className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left hover:bg-slate-50 transition"
                  >
                    <span className={`w-5 h-5 rounded text-white text-[10px] flex items-center justify-center font-bold ${section.color}`}>
                      {section.part}
                    </span>
                    <span className="text-xs font-bold text-slate-700 flex-1 truncate">{section.label}</span>
                    <span className="text-[10px] text-slate-400">{section.items.filter(i => i.file).length}/{section.items.length}</span>
                    <span className={`text-slate-400 text-xs transition-transform ${expandedParts[section.part] ? 'rotate-90' : ''}`}>&#9654;</span>
                  </button>
                  {expandedParts[section.part] && (
                    <div className="ml-4 border-l border-slate-100 pl-2 space-y-0.5">
                      {section.items.map((item) => {
                        const isActive = activeId === item.id;
                        const isPlanned = !item.file;
                        return (
                          <button
                            key={item.id}
                            onClick={() => navigate(item.id, item.file)}
                            disabled={isPlanned}
                            className={`w-full text-left px-2 py-1.5 rounded-md text-xs transition-all truncate ${
                              isActive ? PART_ACTIVE[section.part] : `text-slate-600 ${isPlanned ? 'opacity-40 cursor-not-allowed' : PART_BG[section.part]}`
                            }`}
                          >
                            <span className="font-mono text-[10px] opacity-60 mr-1">{item.id}</span>
                            {item.title}
                            {isPlanned && <span className="ml-1 text-[9px] text-slate-400">(예정)</span>}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              ))}
            </nav>
            <div className="p-3 border-t border-slate-200 shrink-0 text-[10px] text-slate-400 text-center">
              React + Tailwind + Babel CDN
            </div>
          </aside>
          <main className="flex-1 flex flex-col min-w-0">
            <div className="h-12 bg-white border-b border-slate-200 flex items-center px-4 shrink-0 gap-3">
              <button
                onClick={() => setSidebarOpen(prev => !prev)}
                className="lg:hidden p-1.5 rounded-md hover:bg-slate-100 text-slate-600"
                aria-label="사이드바 토글"
              >
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M3 5h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2zm0 4h14a1 1 0 010 2H3a1 1 0 010-2z" />
                </svg>
              </button>
              {activeItem ? (
                <div className="flex items-center gap-2 min-w-0">
                  <span className={`w-5 h-5 rounded text-white text-[10px] flex items-center justify-center font-bold shrink-0 ${
                    SECTIONS.find(s => s.part === activeItem.part)?.color || 'bg-slate-600'
                  }`}>{activeItem.part}</span>
                  <span className="font-mono text-xs text-slate-500 shrink-0">{activeItem.id}</span>
                  <span className="text-sm font-bold text-slate-800 truncate">{activeItem.title}</span>
                </div>
              ) : (
                <span className="text-sm text-slate-500">시각화를 선택하세요</span>
              )}
            </div>
            {activeItem ? (
              <iframe
                key={activeItem.id}
                src={activeItem.file}
                className="flex-1 w-full border-0"
                title={activeItem.title}
              />
            ) : (
              <div className="flex-1 flex items-center justify-center p-8">
                <div className="text-center max-w-md">
                  <div className="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl font-bold text-white" style={{ backgroundColor: '#67CFE9' }}>J</div>
                  <h2 className="text-2xl font-bold text-slate-800 mb-3">Jaeger 인터랙티브 학습</h2>
                  <p className="text-slate-600 mb-6 leading-relaxed">
                    분산 추적(Distributed Tracing)의 사실상 표준 — <strong>trace / span</strong>으로 마이크로서비스 한 요청이 어디서 얼마나 걸렸는지 가시화한다.<br/>
                    Agent · Collector · Query · Storage · UI 5 컴포넌트, OpenTelemetry 호환.
                  </p>
                  <div className="grid grid-cols-5 gap-2 mb-6">
                    {SECTIONS.map(s => (
                      <div key={s.part} className="text-center">
                        <div className={`w-8 h-8 rounded-lg text-white text-xs flex items-center justify-center font-bold mx-auto mb-1 ${s.color}`}>{s.part}</div>
                        <div className="text-[10px] text-slate-500">{s.items.filter(i => i.file).length}/{s.items.length}</div>
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-slate-400">{READY}/{TOTAL} 시각화 ready · Phase A (Part I + II) 완료</p>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
