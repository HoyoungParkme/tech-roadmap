  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    IV-1-1. Timeline 폭포수 읽기
    학습 목표: 트레이스 타임라인(폭포수)에서 병목 span과 대기 gap을 읽어 근본 원인을 찾는다.
    핵심 비유: "폭포수를 위에서 아래로 읽으면 어디서 물이 고이는지 보인다"
    구조: 5단계 — 폭포수 기초 → 병목(self vs total) → 직렬 vs 병렬 → span 드릴다운(N+1) → 실무 함정(gap·clock skew)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#67CFE9';
    const INK = '#0E7B91';

    // 트레이스 총 길이(ms)
    const TOTAL = 400;

    // 서비스별 색 (색상 = 서비스)
    const SVC_COLOR = {
      gateway: '#0E7B91',
      auth:    '#67CFE9',
      catalog: '#F59E0B',
      db:      '#10B981',
      payment: '#8B5CF6',
      stripe:  '#EF4444',
    };

    // 하나의 트레이스 = span 목록 (start/dur ms, depth = 들여쓰기)
    const SPANS = [
      { id: 'gw',     name: 'GET /checkout',    svc: 'gateway', depth: 0, start: 0,   dur: 400 },
      { id: 'auth',   name: 'authorize()',      svc: 'auth',    depth: 1, start: 5,   dur: 40  },
      { id: 'cat',    name: 'catalog.list',     svc: 'catalog', depth: 1, start: 50,  dur: 210 },
      { id: 'q1',     name: 'SELECT item #1',   svc: 'db',      depth: 2, start: 55,  dur: 40  },
      { id: 'q2',     name: 'SELECT item #2',   svc: 'db',      depth: 2, start: 100, dur: 40  },
      { id: 'q3',     name: 'SELECT item #3',   svc: 'db',      depth: 2, start: 145, dur: 40  },
      { id: 'q4',     name: 'SELECT item #4',   svc: 'db',      depth: 2, start: 190, dur: 40  },
      { id: 'pay',    name: 'charge()',         svc: 'payment', depth: 1, start: 270, dur: 115 },
      { id: 'stripe', name: 'POST api.stripe',  svc: 'stripe',  depth: 2, start: 275, dur: 105 },
    ];

    const STEPS = [
      {
        key: 'basic',
        mode: 'basic',
        title: 'Step 1. 폭포수 뷰 — 시간축 · 들여쓰기 · 막대 길이',
        desc: '타임라인은 왼쪽→오른쪽이 시간이다. 각 span은 막대 하나이고, 막대의 왼쪽 끝=시작 시각, 길이=duration이다. 들여쓰기는 부모-자식(호출 관계)을 뜻한다. 위에서 아래로 읽으면 "요청이 어떤 순서로 어디를 거쳤는지"가 한눈에 보인다. 먼저 전체 폭(root span = 400ms)을 100%로 잡고, 어떤 자식이 그 폭의 대부분을 먹는지 감을 잡는 것이 시작이다.',
        legend: 'root(GET /checkout) 400ms를 100%로. 들여쓰기=호출 깊이, 막대 길이=소요 시간.',
        code: {
          lang: 'json',
          filename: 'trace.json — Jaeger API가 돌려주는 span 구조',
          lines: [
            '{',
            '  "traceID": "a1b2c3d4e5f6",',
            '  "spans": [',
            '    {',
            '      "spanID": "gw01", "operationName": "GET /checkout",',
            '      "references": [],',
            '      "startTime": 1000000, "duration": 400000,',
            '      "process": { "serviceName": "gateway" }',
            '    },',
            '    {',
            '      "spanID": "cat01", "operationName": "catalog.list",',
            '      "references": [{ "refType": "CHILD_OF", "spanID": "gw01" }],',
            '      "startTime": 1050000, "duration": 210000,',
            '      "process": { "serviceName": "catalog" }',
            '    }',
            '  ]',
            '}',
            '',
            '// 읽는 법',
            '//  startTime(us) = 막대의 왼쪽 위치 (시간축)',
            '//  duration(us)  = 막대의 길이',
            '//  references CHILD_OF = 부모 span -> 들여쓰기 한 칸',
            '//  process.serviceName = 막대 색상',
          ],
          highlight: [7, 8, 12, 13, 14],
        },
      },
      {
        key: 'bottleneck',
        mode: 'bottleneck',
        title: 'Step 2. 병목 찾기 — 가장 넓은 span, self-time vs total',
        desc: '가장 먼저 "제일 넓은 막대"를 찾는다. 여기선 catalog.list(210ms)가 트레이스의 절반 이상을 먹는다. 단, 넓다고 그 span 자체가 느린 건 아니다. total(210ms)에서 자식들이 실행된 시간을 빼면 self-time(자기 코드에서 쓴 시간)이 나온다. catalog는 자식 DB 쿼리들이 대부분을 차지하므로 self-time은 작다 — 즉 범인은 catalog가 아니라 그 안의 DB 호출이다. 이 구분을 못 하면 엉뚱한 서비스를 튜닝하게 된다.',
        legend: 'catalog.list = 최장 span(210ms). 하지만 self-time은 작다 → 자식(DB)이 진짜 범인.',
        code: {
          lang: 'python',
          filename: 'self_time.py — total과 self-time을 분리해 병목을 특정',
          lines: [
            'from collections import defaultdict',
            '',
            'def self_time(spans):',
            '    """각 span의 self-time = duration - 자식들이 점유한 시간."""',
            '    children = defaultdict(list)',
            '    for s in spans:',
            '        if s.get("parent"):',
            '            children[s["parent"]].append(s)',
            '',
            '    result = {}',
            '    for s in spans:',
            '        busy = sum(c["dur"] for c in children[s["id"]])',
            '        result[s["id"]] = {',
            '            "name": s["name"],',
            '            "total": s["dur"],',
            '            "self": s["dur"] - busy,   # 자기 코드 시간',
            '        }',
            '    return result',
            '',
            '# 출력 (ms)',
            '#  catalog.list  total=210  self=50    <- 넓지만 self 작음',
            '#  SELECT item*4 total=160  self=160   <- 진짜 범인(합산)',
            '#  charge()      total=115  self=10',
            '#',
            '# 교훈: "가장 넓은 span"이 아니라 "self-time이 큰 span"을 고쳐라.',
          ],
          highlight: [11, 12, 16, 21, 22],
        },
      },
      {
        key: 'serial',
        mode: 'serial',

        legend: '계단(끝→시작 반복)=직렬 160ms. 겹치게(병렬) 바꾸면 ~40ms. N+1의 전형.',
        code: {
          lang: 'python',

          lines: [
            'def is_serial(siblings):',
            '    """형제 span들이 겹치지 않고 순차 실행되면 True (직렬)."""',
            '    ordered = sorted(siblings, key=lambda s: s["start"])',
            '    for prev, cur in zip(ordered, ordered[1:]):',
            '        prev_end = prev["start"] + prev["dur"]',

            'db_calls = [',

            '    {"name": "SELECT #3", "start": 145, "dur": 40},',
            '    {"name": "SELECT #4", "start": 190, "dur": 40},',

            '# 개선안',

        },
      },
      {
        key: 'drill',
        mode: 'drill',
        title: 'Step 4. span 드릴다운 — 태그 · 로그 · 에러로 원인 확정',
        desc: '막대를 클릭하면 그 span의 태그(tags)·로그(logs)·에러가 펼쳐진다. 여기서 db.statement 태그를 보면 4개 쿼리가 동일한 SELECT를 id만 바꿔 반복한다 — N+1 쿼리가 확정된다. 폭포수 모양(계단)은 "의심"이고, 태그·로그는 "증거"다. error=true 태그나 event 로그(exception, retry)까지 확인해야 추측이 아닌 사실로 리포트할 수 있다. 넓은 막대만 보고 클릭을 건너뛰면 원인을 절반만 아는 셈이다.',
        legend: '클릭 → tags/logs. db.statement가 반복 SELECT = N+1 확정. 모양은 의심, 태그는 증거.',
        code: {
          lang: 'json',
          filename: 'span_detail.json — 클릭한 span의 tags/logs',
          lines: [
            '{',
            '  "spanID": "q1",',
            '  "operationName": "SELECT item #1",',
            '  "duration": 40000,',
            '  "tags": [',
            '    { "key": "db.system",    "value": "postgresql" },',
            '    { "key": "db.statement", "value": "SELECT * FROM item WHERE id = 1" },',
            '    { "key": "db.rows",      "value": 1 },',
            '    { "key": "error",        "value": false }',
            '  ],',
            '  "logs": [',
            '    { "timestamp": 1055000, "fields": [',

          ],
          highlight: [7, 8, 12, 13, 19],
        },
      },
      {
        key: 'pitfall',
        mode: 'pitfall',

        desc: 'gap(막대 사이 빈 공간)을 무조건 "대기"로 읽으면 안 된다. 실제 대기(락·큐)일 수도, 계측이 안 된 구간(SDK 미적용 코드)일 수도 있다 — 둘은 다르게 고쳐야 한다. 또 서비스마다 시계가 미세하게 달라 자식 span이 부모보다 먼저 시작한 것처럼 보이는 clock skew가 생긴다(음수 gap). 마지막으로 "가장 넓은 span"만 쫓는 편향을 조심하라 — self-time·gap·로그를 함께 봐야 오진을 피한다.',
        legend: 'gap=대기? 계측 공백? 구분하라. 음수 gap=clock skew. 넓은 span만 보지 마라.',
        code: {
          lang: 'python',
          filename: 'audit_gaps.py — 의심 gap과 clock skew 자동 점검',
          lines: [
            'def audit(parent, children):',
            '    """부모-자식 사이의 gap과 시계 오차를 점검."""',
            '    ordered = sorted(children, key=lambda s: s["start"])',
            '    warnings = []',
            '',
            '    for prev, cur in zip(ordered, ordered[1:]):',
            '        gap = cur["start"] - (prev["start"] + prev["dur"])',
            '        if gap > 20:',
            '            warnings.append(f"gap {gap}ms: 대기? 계측 공백? 로그 확인")',
            '        if gap < 0:',
            '            warnings.append(f"음수 gap {gap}ms: clock skew 의심")',
            '',
            '    if children and children[0]["start"] < parent["start"]:',
            '        warnings.append("자식이 부모보다 먼저 시작 = clock skew")',
            '    return warnings',
            '',
            '# 체크리스트',
            '#  [ ] 넓은 span뿐 아니라 self-time 큰 span도 봤는가',
            '#  [ ] gap이 실제 대기인지 계측 공백인지 로그로 확인했는가',
            '#  [ ] 음수/이상 타임스탬프(clock skew)를 걸렀는가',
            '#  [ ] error 태그/exception 로그를 열어봤는가',

        },
      },

    // ─────────────────────────────────────────────────────────
    // 좌측 시각화 — 폭포수(Waterfall) 뷰
    // ─────────────────────────────────────────────────────────

    // 시간 눈금자
    function TimeRuler() {
      const marks = [0, 100, 200, 300, 400];
      return (
        <div className="relative h-4 ml-40 border-b border-slate-200 mb-1">
          {marks.map((m) => (
            <div key={m} className="absolute top-0 text-[9px] font-mono text-slate-400"
                 style={{ left: `${(m / TOTAL) * 100}%`, transform: 'translateX(-50%)' }}>
              {m}ms
            </div>
          ))}
        </div>
      );
    }

    // 한 줄 = span 막대
    function SpanRow({ span, i, mode }) {
      const left = (span.start / TOTAL) * 100;
      const width = Math.max((span.dur / TOTAL) * 100, 1.5);
      const color = SVC_COLOR[span.svc] || BRAND;

      // 모드별 강조 여부
      const isDbSerial = span.svc === 'db';
      let dim = false, ring = false, pulse = false;
      if (mode === 'bottleneck') { ring = span.id === 'cat'; dim = !ring; }
      if (mode === 'serial')     { ring = isDbSerial; dim = !isDbSerial; }
      if (mode === 'drill')      { ring = span.id === 'q1'; pulse = ring; dim = !ring; }

      return (
        <div className="fade-in flex items-center h-6 group" style={{ animationDelay: `${i * 60}ms` }}>
          <div className="w-40 shrink-0 flex items-center overflow-hidden"
               style={{ paddingLeft: `${span.depth * 12 + 4}px` }}>
            <span className="w-1.5 h-1.5 rounded-full mr-1 shrink-0" style={{ background: color }} />
            <span className={`text-[10px] font-mono truncate ${dim ? 'text-slate-300' : 'text-slate-600'}`}>
              {span.name}
            </span>
          </div>
          <div className="relative flex-1 h-full">
            <div className={`absolute top-1 h-4 rounded-sm ${pulse ? 'pulse-ring' : ''}`}
                 style={{
                   left: `${left}%`, width: `${width}%`,
                   background: color,
                   opacity: dim ? 0.25 : 1,
                   outline: ring ? `2px solid ${INK}` : 'none',
                   outlineOffset: '1px',
                 }}>
              <span className="absolute right-1 top-1/2 -translate-y-1/2 text-[8px] font-mono text-white/90 whitespace-nowrap">
                {span.dur}ms
              </span>
            </div>
          </div>
        </div>
      );
    }

    // 병목 배지 (bottleneck 모드)
    function BottleneckBadge() {
      return (
        <div className="mt-2 p-2 rounded bg-amber-50 border border-amber-300 text-[11px] text-amber-800">
          <span className="font-bold">최장 span = catalog.list 210ms.</span> 그러나 self-time은 ~50ms.
          진짜 시간은 자식 DB 쿼리 160ms가 먹는다.
        </div>
      );
    }

    // 직렬 표시 (serial 모드)
    function SerialNote() {
      return (
        <div className="mt-2 p-2 rounded text-[11px]" style={{ background: '#E6F8FC', border: '1px solid #B7EAF5', color: INK }}>
          <span className="font-bold">계단형 4회 = 직렬 160ms.</span> 병렬화하면 막대가 겹쳐 ~40ms.
          독립 쿼리면 배치(IN)로 한 방에.
        </div>
      );
    }

    // 드릴다운 상세 패널 (drill 모드)
    function DrillPanel() {
      const rows = [
        { k: 'db.system', v: 'postgresql' },
        { k: 'db.statement', v: 'SELECT * FROM item WHERE id = 1' },
        { k: 'db.rows', v: '1' },
        { k: 'error', v: 'false' },
      ];
      return (
        <div className="mt-2 rounded-lg border border-slate-200 overflow-hidden fade-in" style={{ animationDelay: '300ms' }}>
          <div className="px-3 py-1.5 text-white text-[10px] font-bold flex items-center gap-1" style={{ background: INK }}>
            <span>🔎</span> SELECT item #1 — tags
          </div>
          <div className="p-2 space-y-1 bg-white">
            {rows.map((r) => (
              <div key={r.k} className="flex items-center gap-2 text-[10px] font-mono">
                <span className="text-slate-400 w-24 shrink-0">{r.k}</span>
                <span className="text-slate-700 truncate">{r.v}</span>
              </div>
            ))}
            <div className="mt-1 pt-1 border-t border-slate-100 text-[10px] text-red-600 font-bold">
              형제 q1..q4가 id만 다른 동일 쿼리 → N+1 확정
            </div>
          </div>
        </div>
      );
    }

    // gap / clock skew 표시 (pitfall 모드)
    function PitfallNote() {
      return (
        <div className="mt-2 space-y-1">
          <div className="p-2 rounded bg-slate-50 border border-slate-200 text-[11px] text-slate-600">
            <span className="font-bold text-slate-700">gap 10ms</span> (catalog 끝 → payment 시작):
            실제 대기인가, 계측 안 된 구간인가? 로그로 구분.
          </div>
          <div className="p-2 rounded bg-red-50 border border-red-200 text-[11px] text-red-700">
            <span className="font-bold">음수 gap</span>이 보이면 clock skew — 자식이 부모보다 먼저 시작한 착시.
          </div>
        </div>
      );
    }

    function LiveDataPane({ step }) {
      const mode = step.mode;
      return (
        <div className="space-y-2">
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div className="px-4 py-2 flex items-center gap-2 text-white" style={{ background: INK }}>
              <span className="text-base">🌊</span>
              <span className="text-xs font-bold">Trace a1b2c3d4 — Timeline (폭포수)</span>
              <span className="ml-auto text-[10px] font-mono opacity-80">total 400ms</span>
            </div>
            <div className="p-3">
              <TimeRuler />
              <div className="space-y-0.5">
                {SPANS.map((s, i) => (
                  <SpanRow key={s.id} span={s} i={i} mode={mode} />
                ))}
              </div>
              {mode === 'bottleneck' && <BottleneckBadge />}
              {mode === 'serial' && <SerialNote />}
              {mode === 'drill' && <DrillPanel />}
              {mode === 'pitfall' && <PitfallNote />}
            </div>
          </div>
          <div className="px-3 py-2 bg-slate-50 rounded-lg border border-slate-200 text-[10px] text-slate-500 leading-snug">
            {step.legend}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 코드 뷰어
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[30rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { opacity: 0; animation: fadeIn 360ms ease-out forwards; }
            @keyframes pulseRing {
              0%,100% { outline-color: ${INK}; }
              50%     { outline-color: #B7EAF5; }
            }
            .pulse-ring { animation: pulseRing 1.2s ease-in-out infinite; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium" style={{ color: BRAND }}>&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm"
                     style={{ background: BRAND }}>IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. UI &middot; 분석 &gt; Chapter 1. Timeline 뷰</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Timeline 폭포수 읽기</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                트레이스 타임라인에서 병목을 찾는 법 — <strong>가장 넓은 막대·긴 gap·직렬 계단</strong>을 읽어
                self-time과 태그로 근본 원인을 특정한다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: INK }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-100">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-cyan-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl border-2 text-sm" style={{ background: '#E6F8FC', borderColor: '#B7EAF5', color: INK }}>
                💡 다음(IV-1-2)에서는 <strong>서비스 의존성 그래프</strong> — 폭포수를 넘어 시스템 전체의 호출 관계를 본다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[96px]"
                style={{ background: BRAND }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
