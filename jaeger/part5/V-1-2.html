    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!--
    V-1-2. Retention 정책 — 보존 관리
    학습 목표: 트레이스 데이터의 보존 기간과 비용을 스토리지별로 제어하는 법을 익힌다.
    핵심 비유: "냉장고 유통기한 — 넣어두면 언젠가 자동으로 버려져야 한다"
    구조: 5단계 — 보존 필요성 → Cassandra TTL → ES ILM → Badger TTL → 보존 설계(단기/장기·아카이빙·샘플링)
    강조색: #67CFE9 / #0E7B91 / #E6F8FC / #B7EAF5
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#67CFE9';
    const DEEP = '#0E7B91';
    const LIGHT = '#E6F8FC';
    const MID = '#B7EAF5';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        key: 'why',
        title: 'Step 1. 왜 보존 정책인가 — 트레이스는 켜두면 무한히 쌓인다',
        desc: '트레이스는 로그·메트릭보다 훨씬 무겁다. 요청 하나가 수십 개 span으로 쪼개지고 각 span에 태그·로그·타이밍이 붙는다. TTL(Time To Live)을 설정하지 않으면 데이터는 지워지지 않고 스토리지가 선형으로 증가한다. 며칠은 멀쩡해 보이다가 디스크가 가득 차는 순간 collector가 write에 실패하고 새 트레이스마저 유실된다. 보존 정책의 목적은 "가장 최근의, 디버깅에 쓸모 있는 데이터만 남기고 나머지는 자동으로 버리는 것"이다.',
        legend: 'TTL 미설정 → 스토리지 무한 증가 → 디스크 풀 → write 실패로 신규 트레이스까지 유실',
        code: {
          lang: 'yaml',
          filename: 'jaeger-no-retention.yaml — 위험: TTL 없음',
          lines: [
            '# 안티패턴: 보존 정책을 아무 데도 지정하지 않았다',
            'apiVersion: jaegertracing.io/v1',
            'kind: Jaeger',
            'metadata:',
            '  name: jaeger-danger',
            'spec:',
            '  strategy: production',
            '  storage:',
            '    type: elasticsearch',
            '    options:',
            '      es:',
            '        server-urls: http://es:9200',
            '        index-prefix: jaeger',
            '        # ILM / rollover / delete 정책이 전혀 없다  <-- 문제',
            '',
            '# 무슨 일이 벌어지나 ────────────────────────',
            '#  day 1   :  120 GB   (여유 충분해 보임)',
            '#  day 7   :  840 GB',
            '#  day 30  :  3.6 TB   (디스크 85% 경고)',
            '#  day 34  :  disk full -> ES read-only 전환',
            '#            -> collector bulk write 429/503',
            '#            -> 신규 trace 유실 (디버깅 불가)',
            '#',
            '# 교훈: 보존은 "언젠가 하는 일"이 아니라',
            '#       스토리지를 켜는 날 함께 정하는 기본 설정이다.',
          ],
          highlight: [13, 14, 20, 21, 22],
        },
      },
      {
        key: 'cassandra',
        title: 'Step 2. Cassandra TTL — 로우 단위 자동 만료',
        desc: 'Cassandra 백엔드는 TTL을 초 단위로 각 로우에 붙인다. 스키마 생성 시 --cas.trace.ttl 값(예: 172800초 = 2일)이 write마다 적용되어, 만료된 span은 compaction 과정에서 tombstone으로 표시되고 결국 물리 삭제된다. 별도의 삭제 배치가 필요 없다는 것이 장점이다. 함정은 두 가지다. 첫째, TTL을 나중에 바꿔도 이미 저장된 로우에는 소급 적용되지 않는다. 둘째, TTL이 너무 짧으면 tombstone이 폭증해 읽기 성능이 떨어진다. TTL은 처음에 신중히 정하고 자주 바꾸지 않는다.',
        legend: 'write마다 TTL 초를 부여 → 만료 로우는 compaction에서 tombstone → 물리 삭제. 소급 적용 안 됨',
        code: {
          lang: 'yaml',
          filename: 'jaeger-cassandra-ttl.yaml — 2일 보존',
          lines: [
            '# Cassandra: 스키마 생성 시 TTL(초)을 지정한다',
            'apiVersion: jaegertracing.io/v1',
            'kind: Jaeger',
            'metadata:',
            '  name: jaeger-cassandra',
            'spec:',
            '  storage:',

    // 공통: 스토리지 게이지
    function StorageGauge({ pct, color, label, sub }) {
      return (
        <div className="flex items-center gap-2 text-[10px] font-mono text-slate-600">
          <span className="w-16 text-slate-500">{label}</span>

          </div>
          <span className="w-20 text-right" style={{ color }}>{sub}</span>
        </div>
      );
    }

    // Step 1: TTL 없음 — 무한 증가
    function NoRetention() {
      const days = [
        { d: 'day 1', pct: 12, sub: '120 GB' },
        { d: 'day 7', pct: 28, sub: '840 GB' },
        { d: 'day 30', pct: 78, sub: '3.6 TB' },
        { d: 'day 34', pct: 100, sub: 'FULL' },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">📈</span>
            <span className="text-xs font-bold">TTL 미설정 — 스토리지 무한 증가</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">삭제 정책 없음</span>
          </div>
          <div className="p-3 space-y-2">
            {days.map((x, i) => (
              <div key={i} className="fade-in" style={{ animationDelay: (i * 120) + 'ms' }}>
                <StorageGauge pct={x.pct} color={x.pct >= 100 ? '#dc2626' : (x.pct > 60 ? '#d97706' : BRAND)}
                  label={x.d} sub={x.sub} />
              </div>
            ))}
            <div className="mt-2 p-2 rounded bg-red-50 border border-red-200 text-[11px] text-red-700">
              <span className="font-bold">⚠ disk full</span> — ES read-only 전환 → collector write 실패 → 신규 trace 유실.
            </div>
          </div>
        </div>
      );
    }

    // Step 2: Cassandra TTL — 로우 만료
    function CassandraTTL() {
      const rows = Array.from({ length: 12 }, (_, i) => ({
        id: i,
        age: i,
        expired: i >= 8, // 2일(=8칸) 넘으면 만료
      }));
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🪦</span>
            <span className="text-xs font-bold">Cassandra TTL — 로우 단위 자동 만료</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">TTL=172800s</span>
          </div>
          <div className="p-3">
            <div className="text-[10px] text-slate-500 mb-1">오래된 로우 → tombstone → compaction 삭제</div>
            <div className="grid grid-cols-12 gap-1 mb-3">
              {rows.map((r) => (
                <div key={r.id}
                  className="fade-in h-8 rounded flex items-center justify-center text-[9px] font-mono"
                  style={{
                    background: r.expired ? '#f1f5f9' : LIGHT,
                    border: '1px solid ' + (r.expired ? '#e2e8f0' : MID),
                    color: r.expired ? '#94a3b8' : DEEP,
                    animationDelay: (r.id * 40) + 'ms',
                  }}>
                  {r.expired ? '🪦' : 'span'}
                </div>
              ))}
            </div>
            <div className="flex items-center justify-between text-[10px] font-mono mb-2">
              <span style={{ color: DEEP }}>✓ 최근 2일 보존</span>
              <span className="text-slate-400">🪦 만료 → 물리 삭제</span>
            </div>
            <div className="p-2 rounded border text-[11px]" style={{ background: LIGHT, borderColor: MID, color: DEEP }}>
              <span className="font-bold">소급 적용 안 됨.</span> TTL을 바꿔도 이미 저장된 로우는 옛 TTL을 따른다. 처음에 신중히 정한다.
            </div>
          </div>
        </div>
      );
    }

    // Step 3: ES ILM — hot/warm/delete
    function EsIlm() {
      const phases = [
        { name: 'hot', desc: '조회 활발 · rollover', color: DEEP, txt: '#fff', age: '0~1d' },
        { name: 'warm', desc: '저렴 노드 · shrink/merge', color: MID, txt: DEEP, age: '2~6d' },
        { name: 'delete', desc: '인덱스 통째 삭제', color: '#f1f5f9', txt: '#64748b', age: '7d~' },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🔄</span>
            <span className="text-xs font-bold">Elasticsearch ILM — 인덱스 수명주기</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">rollover 1d / delete 7d</span>
          </div>
          <div className="p-3">
            <div className="flex items-stretch gap-1 mb-3">
              {phases.map((p, i) => (
                <React.Fragment key={p.name}>
                  <div className="fade-in flex-1 rounded-lg p-2 text-center"
                    style={{ background: p.color, color: p.txt, border: '1px solid ' + MID, animationDelay: (i * 200) + 'ms' }}>
                    <div className="text-xs font-bold">{p.name}</div>
                    <div className="text-[9px] opacity-90 mt-0.5">{p.age}</div>
                    <div className="text-[9px] opacity-80 mt-1 leading-tight">{p.desc}</div>
                  </div>
                  {i < phases.length - 1 && (
                    <div className="flex items-center text-slate-400 text-sm fade-in"
                      style={{ animationDelay: (i * 200 + 120) + 'ms' }}>→</div>
                  )}
                </React.Fragment>
              ))}
            </div>
            <div className="space-y-1 mb-2">
              <StorageGauge pct={35} color={DEEP} label="jaeger-000042" sub="hot" />
              <StorageGauge pct={20} color={BRAND} label="jaeger-000039" sub="warm" />
              <StorageGauge pct={0} color="#94a3b8" label="jaeger-000031" sub="deleted" />
            </div>
            <div className="p-2 rounded border text-[11px]" style={{ background: LIGHT, borderColor: MID, color: DEEP }}>
              <span className="font-bold">배포 후 확인 필수.</span> 별칭·정책 오연결 시 인덱스가 hot에 머물러 delete가 안 돈다.
            </div>
          </div>
        </div>
      );
    }

    // Step 4: Badger TTL
    function BadgerTTL() {
      const keys = Array.from({ length: 16 }, (_, i) => ({ id: i, gc: i >= 11 }));
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">🦡</span>
            <span className="text-xs font-bold">Badger TTL — 임베디드 KV 자동 GC</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">span-store-ttl=72h</span>
          </div>
          <div className="p-3">
            <div className="text-[10px] text-slate-500 mb-1">로컬 디스크 KV — 만료 키는 백그라운드 GC가 회수</div>
            <div className="grid grid-cols-8 gap-1 mb-3">
              {keys.map((k) => (
                <div key={k.id}
                  className="fade-in h-6 rounded-sm"
                  style={{
                    background: k.gc ? '#f1f5f9' : BRAND,
                    opacity: k.gc ? 0.5 : (0.55 + (k.id % 4) * 0.12),
                    border: '1px solid ' + (k.gc ? '#e2e8f0' : MID),
                    animationDelay: (k.id * 35) + 'ms',
                  }} />
              ))}
            </div>
            <div className="flex items-center justify-between text-[10px] font-mono mb-2">
              <span style={{ color: DEEP }}>■ 유효 키</span>
              <span className="text-slate-400">□ GC 회수 대상</span>
            </div>
            <div className="grid grid-cols-2 gap-2 text-[10px]">
              <div className="p-2 rounded border" style={{ background: LIGHT, borderColor: MID, color: DEEP }}>
                <div className="font-bold mb-0.5">+ 장점</div>
                외부 DB 불필요 · 설정 최소 · TTL 하나로 끝
              </div>
              <div className="p-2 rounded border bg-slate-50 border-slate-200 text-slate-600">
                <div className="font-bold mb-0.5">- 한계</div>
                수평 확장 불가 · 노드 유실 = 데이터 유실
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Step 5: 보존 설계 — 비용 vs 가시성
    function RetentionDesign() {
      const tiers = [
        { name: '상세 (디버깅)', period: '3~7일', where: 'ES hot/warm', cost: 80, color: DEEP },
        { name: '요약 (규정)', period: '90~365일', where: '다운샘플링', cost: 25, color: BRAND },
        { name: '아카이브', period: '수년', where: 'S3 + lifecycle', cost: 10, color: MID },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">⚖️</span>
            <span className="text-xs font-bold">계층형 보존 — 비용 vs 가시성</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">목적별 분리</span>
          </div>
          <div className="p-3">
            <div className="space-y-2 mb-3">
              {tiers.map((t, i) => (
                <div key={i} className="fade-in" style={{ animationDelay: (i * 130) + 'ms' }}>
                  <div className="flex items-center justify-between text-[10px] mb-0.5">
                    <span className="font-bold" style={{ color: t.color === MID ? DEEP : t.color }}>{t.name}</span>
                    <span className="font-mono text-slate-500">{t.period} · {t.where}</span>
                  </div>
                  <div className="h-3 bg-slate-100 rounded overflow-hidden">
                    <div className="h-full grow-bar" style={{ '--target-width': t.cost + '%', background: t.color }} />
                  </div>
                </div>
              ))}
            </div>
            <div className="flex items-center gap-2 text-[10px] font-mono text-slate-500 mb-2">
              <span>최근</span>
              <div className="flex-1 h-1.5 rounded" style={{ background: 'linear-gradient(90deg,' + DEEP + ',' + MID + ',#e2e8f0)' }} />
              <span>과거</span>
            </div>
            <div className="p-2 rounded border text-[11px]" style={{ background: LIGHT, borderColor: MID, color: DEEP }}>
              <span className="font-bold">샘플링과 짝이다.</span> 적게 저장할수록(head/tail) 보존 비용도 준다. 아카이브엔 S3 lifecycle을 반드시 건다.
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ beat, step }) {
      let inner = null;
      if (step.key === 'why') inner = <NoRetention />;
      else if (step.key === 'cassandra') inner = <CassandraTTL />;
      else if (step.key === 'es-ilm') inner = <EsIlm />;
      else if (step.key === 'badger') inner = <BadgerTTL />;
      else if (step.key === 'design') inner = <RetentionDesign />;
      return (
        <div className="space-y-2">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {inner}
          <div className="px-3 py-2 bg-slate-50 rounded-lg border border-slate-200 text-[10px] text-slate-500 leading-snug">
            {step.legend}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 코드 뷰어
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[30rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { opacity: 0; animation: fadeIn 360ms ease-out forwards; }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar { width: 0; animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium" style={{ color: DEEP }}>&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm"
                     style={{ background: DEEP }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 실전 운영 &gt; Chapter 1. 스케일 · 보존 운영</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Retention 정책 — 보존 관리</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                트레이스 데이터의 <strong>보존 기간과 비용</strong>을 관리한다 — 스토리지별 TTL(Cassandra · ES ILM · Badger)과
                계층형 보존 · 아카이빙 전략으로 <strong>디스크 풀 없이 필요한 가시성만</strong> 유지한다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: DEEP }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider" style={{ color: LIGHT }}>세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs" style={{ color: MID }}>키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl border-2 text-sm" style={{ background: LIGHT, borderColor: MID, color: DEEP }}>
                💡 다음(V-2-1)에서는 <strong>OpenTelemetry 마이그레이션</strong> — Jaeger 클라이언트에서 OTel SDK/Collector로 전환하는 실전 경로
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[96px]"
                style={{ background: DEEP }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./V-2-1.html" className="font-medium" style={{ color: DEEP }}>V-2-1 OpenTelemetry 마이그레이션 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
