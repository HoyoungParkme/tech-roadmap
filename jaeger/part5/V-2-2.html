            '    - 원인 span → 담당 서비스팀 라우팅',
            '    - SLO 위반 알람을 trace 링크로 연결',
            '',
            '# 프로덕션 5대 함정 (마지막 점검) ──────────',
            '#  1) all-in-one 프로덕션 배포 → 재시작 시 소실',
            '#  2) TTL 미설정 → 무한 증가 → disk full',
            '#  3) 계측 공백 → 중간이 끊긴 반쪽 trace',
            '#  4) collector 병목 → span drop 폭증',
            '#  5) 샘플링 편향 → 희소 에러 실종',
            '#',
            '# ── Jaeger 완주 ──────────────────────────',
            '#  계측 → 샘플링 → 스토리지 → 확장/HA → 운영',
            '#  다섯 축이 모두 통과하면 프로덕션 준비 완료.',
          ],
          highlight: [3, 7, 12, 19, 20, 21],
        },
      },
    ];

    // ─────────────────────────────────────────────────────────
    // 좌측 시각화 — 프로덕션 준비도 체크리스트 보드
    // ─────────────────────────────────────────────────────────

    // 누적 준비도 게이지 (현재 단계까지 통과한 항목 비율)
    function ReadinessGauge({ stepIdx }) {
      let total = 0;
      let passed = 0;
      for (let i = 0; i <= stepIdx; i++) {
        STEPS[i].check.items.forEach((it) => {
          total += 1;
          if (it.status === 'pass') passed += 1;
        });
      }
      const pct = Math.round((passed / total) * 100);
      return (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold" style={{ color: DEEP }}>프로덕션 준비도 (누적)</span>
            <span className="text-xs font-mono text-slate-500">{passed} / {total} 통과</span>
          </div>
          <div className="h-3 rounded-full overflow-hidden" style={{ background: LIGHT }}>
            <div className="h-full grow-bar" style={{ '--target-width': `${pct}%`, background: DEEP }} />
          </div>
          <div className="mt-1 text-right text-[11px] font-bold" style={{ color: DEEP }}>{pct}%</div>
        </div>
      );
    }

    // 단계별 카테고리 체크리스트 카드
    function ChecklistCard({ check }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="text-white px-4 py-2 flex items-center gap-2" style={{ background: DEEP }}>
            <span className="text-base">{check.icon}</span>
            <span className="text-xs font-bold">{check.category}</span>
            <span className="ml-auto text-[10px] font-mono opacity-80">배포 전 점검</span>
          </div>
          <div className="p-3 space-y-1.5">
            {check.items.map((it, i) => {
              const ok = it.status === 'pass';
              return (
                <div key={i}
                  className="fade-in flex items-center gap-2 p-2 rounded-lg border"
                  style={{
                    animationDelay: `${i * 120}ms`,
                    background: ok ? '#ecfdf5' : '#fffbeb',
                    borderColor: ok ? '#a7f3d0' : '#fde68a',
                  }}>
                  <span className={`text-sm font-bold ${ok ? 'text-emerald-600' : 'text-amber-600'}`}>
                    {ok ? '✓' : '!'}
                  </span>
                  <div className="flex-1 min-w-0">
                    <div className="text-[11px] font-medium text-slate-700 leading-tight">{it.label}</div>
                    <div className="text-[10px] text-slate-400 leading-tight">{it.note}</div>
                  </div>
                  <span className="shrink-0 text-white text-[9px] font-mono font-bold px-1.5 py-0.5 rounded"
                        style={{ background: BRAND }}>{it.chapter}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Step 5 전용 — 프로덕션 5대 함정 패널
    function TrapsPanel({ traps }) {
      return (
        <div className="bg-white rounded-xl border-2 overflow-hidden shadow-sm" style={{ borderColor: '#fca5a5' }}>
          <div className="px-4 py-2 flex items-center gap-2 bg-red-500 text-white">
            <span className="text-base">⚠</span>
            <span className="text-xs font-bold">프로덕션 5대 함정 — 마지막 점검</span>
          </div>
          <div className="p-3 space-y-1">
            {traps.map((t, i) => (
              <div key={i} className="fade-in flex items-start gap-2 text-[11px] text-red-800"
                   style={{ animationDelay: `${i * 100}ms` }}>
                <span className="font-mono font-bold text-red-500">{i + 1}.</span>
                <span className="leading-snug">{t}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LiveDataPane({ step, stepIdx }) {
      return (
        <div className="space-y-2">
          <ReadinessGauge stepIdx={stepIdx} />
          <ChecklistCard check={step.check} />
          {step.traps && <TrapsPanel traps={step.traps} />}
          <div className="px-3 py-2 rounded-lg border text-[10px] text-slate-500 leading-snug"
               style={{ background: LIGHT, borderColor: MID }}>
            {step.legend}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측 코드 뷰어
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[34rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in { opacity: 0; animation: fadeIn 360ms ease-out forwards; }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar { width: 0; animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards; }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="font-medium" style={{ color: DEEP }}>&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm"
                     style={{ background: DEEP }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 실전 운영 &gt; Chapter 2. 표준 전환</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">실전 체크리스트 (Jaeger 완주)</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                앞서 배운 모든 것을 종합한 <strong>프로덕션 Jaeger 점검</strong> — 계측 · 샘플링 · 스토리지 · 확장/HA · 운영을
                하나의 체크리스트로 꿰고, 항목마다 어느 챕터에서 배웠는지 배지로 연결한다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: DEEP }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-100">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-cyan-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl border-2 text-sm" style={{ background: LIGHT, borderColor: BRAND, color: DEEP }}>
                🏁 <strong>Jaeger 완주</strong> — 계측 → 샘플링 → 스토리지 → 확장/HA → 운영, 다섯 축을 모두 통과했다면 프로덕션 배포 준비 완료. 수고했다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label="자동 재생 시작/정지" aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[96px]"
                style={{ background: DEEP }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="../index.html" className="font-medium" style={{ color: DEEP }}>🏁 Jaeger 완주 — 허브로 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
