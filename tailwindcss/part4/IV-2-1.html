<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind 학습 — IV-2-1. plugin — 커스텀 유틸/컴포넌트</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌬️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    Tailwind IV-2-1 — plugin: 커스텀 유틸/컴포넌트 (비유: 공장에 새 금형을 추가한다)
    plugin() 으로 addUtilities / addComponents / addBase / matchUtilities / theme 를 다뤄
    "내 프로젝트만의 클래스" 를 만드는 과정을 5단계로 시각화
    1) addUtilities 로 새 유틸 → 2) addComponents 로 컴포넌트 → 3) matchUtilities 동적 유틸 →
    4) 공식 플러그인(forms/typography/aspect-ratio) → 5) 실무 함정(우선순위·성능·@apply 남용)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#38B2AC';
    const DEEP = '#234E52';

    const STEPS = [
      {
        title: 'Step 1. addUtilities — 새 유틸리티 클래스를 등록한다',
        desc: 'Tailwind 에 없는 CSS 속성(예: text-shadow)이 필요할 때, CSS 파일에 흩뿌리는 대신 plugin() 안에서 addUtilities 로 등록한다. 그러면 .text-shadow 가 진짜 utility 처럼 마크업에서 바로 쓰이고, hover:/md: 같은 variant prefix 도 자동으로 붙는다. 핵심은 "일회성 CSS" 를 "재사용 가능한 토큰화된 유틸" 로 승격시키는 것이다. 등록된 클래스는 실제 사용된 것만 빌드에 포함되므로 번들이 불지 않는다.',
        flow: { api:'addUtilities({ ... })', gen:'.text-shadow 생성', use:'class="text-shadow"' },
        cards: [
          { label:'plugin()', desc:'tailwindcss/plugin 을 require 해서 감싼다', tone:'ok' },
          { label:'addUtilities', desc:'{ 클래스명: { CSS속성 } } 객체를 등록', tone:'ok' },
          { label:'variant 자동', desc:'hover:text-shadow, md:text-shadow 도 동작', tone:'good' },
          { label:'언제', desc:'Tailwind 에 없는 저수준 속성이 반복될 때', tone:'warn' },
        ],
        alert: { tone:'info', text:'addUtilities 는 utilities 레이어에 들어간다 — 우선순위가 높아 컴포넌트 스타일을 덮어쓸 수 있다.' },
        code: {
          lang:'javascript', filename:'tailwind.config.js',
          lines:[
            '// tailwind.config.js — 새 유틸리티 등록',
            "const plugin = require('tailwindcss/plugin')",
            '',
            'module.exports = {',
            '  plugins: [',
            '    plugin(function ({ addUtilities }) {',
            '      addUtilities({',
            "        '.text-shadow': {",
            "          textShadow: '0 2px 4px rgba(0,0,0,0.25)',",
            '        },',
            "        '.text-shadow-none': {",
            "          textShadow: 'none',",
            '        },',
            '      })',
            '    }),',
            '  ],',
            '}',
            '',
            '// 사용 — 마크업에서 바로 (variant 도 자동)',
            '// class="text-shadow hover:text-shadow-none md:text-shadow"',
          ],
          highlight:[1,5,6,7,8,9,11,12,13],
        },
      },
      {
        title: 'Step 2. addComponents — @apply 대신 컴포넌트 클래스를 추출한다',
        desc: '.btn 같은 재사용 컴포넌트가 필요할 때, 많은 사람이 CSS 파일에서 .btn { @apply p-2 ... } 를 쓴다. 하지만 @apply 는 CSS 로의 회귀이고 theme 값을 코드로 다루기 어렵다. addComponents 는 theme() 함수로 디자인 토큰을 직접 읽어 컴포넌트를 만든다. addComponents 는 components 레이어라 우선순위가 낮아, 마크업에서 붙인 utility(예: bg-red-500)가 자연스럽게 컴포넌트 기본값을 덮어쓴다. 이게 @apply 보다 안전한 이유다.',
        flow: { api:'addComponents({ ... })', gen:'.btn / .btn-primary', use:'class="btn btn-primary"' },
        cards: [
          { label:'addComponents', desc:'컴포넌트 클래스를 components 레이어에 등록', tone:'ok' },
          { label:'theme()', desc:"theme('colors.teal.500') 로 토큰 직접 참조", tone:'ok' },
          { label:'우선순위 낮음', desc:'마크업 utility 가 컴포넌트를 덮어쓸 수 있다', tone:'good' },
          { label:'함정', desc:'@apply 남용은 CSS 로의 회귀 — 플러그인이 낫다', tone:'warn' },
        ],
        alert: { tone:'good', text:'컴포넌트는 낮은 우선순위, 유틸은 높은 우선순위 — 이 위계 덕에 예외 스타일을 마크업에서 간단히 얹는다.' },
        code: {
          lang:'javascript', filename:'tailwind.config.js',
          lines:[
            '// tailwind.config.js — 컴포넌트 추출',
            "const plugin = require('tailwindcss/plugin')",
            '',
            'module.exports = {',
            '  plugins: [',
            '    plugin(function ({ addComponents, theme }) {',
            '      addComponents({',
            "        '.btn': {",
            "          padding: theme('spacing.2') + ' ' + theme('spacing.4'),",
            "          borderRadius: theme('borderRadius.md'),",
            "          fontWeight: theme('fontWeight.semibold'),",
            '        },',
            "        '.btn-primary': {",
            "          backgroundColor: theme('colors.teal.500'),",
            "          color: '#fff',",
            "          '&:hover': { backgroundColor: theme('colors.teal.600') },",
            '        },',
            '      })',
            '    }),',
            '  ],',
            '}',
            '',
            '// 사용 — class="btn btn-primary"',
            '// 예외는 마크업에서: class="btn btn-primary bg-red-500"',
          ],
          highlight:[6,7,8,9,10,11,13,14,15,16],
        },
      },
      {
        title: 'Step 3. matchUtilities — theme 값에 매핑되는 동적 유틸',
        desc: 'addUtilities 는 클래스를 하나하나 나열하지만, "값이 바뀌는 유틸" 은 그렇게 못 만든다. matchUtilities 는 theme 의 값 집합을 받아 tab-1, tab-2, tab-4 처럼 값별 클래스를 한 번에 찍어낸다. 게다가 tab-[13] 같은 임의값(arbitrary value)까지 자동 지원한다. 콜백은 값을 받아 CSS 객체를 돌려주는 함수다. 주의: values 가 커질수록 생성 클래스가 늘어 빌드 시간과 CSS 크기가 커지므로, 필요한 값만 theme 에 둔다.',
        flow: { api:'matchUtilities({ tab })', gen:'tab-1 · tab-2 · tab-[13]', use:'class="tab-4"' },
        cards: [
          { label:'matchUtilities', desc:'{ 이름: (value) => ({CSS}) } + values 옵션', tone:'ok' },
          { label:'values', desc:"theme('tabSize') 등 값 집합을 매핑", tone:'ok' },
          { label:'임의값 지원', desc:'tab-[13] 같은 arbitrary value 자동 처리', tone:'good' },
          { label:'성능 함정', desc:'values 가 많으면 클래스 폭증 → 빌드 느려짐', tone:'danger' },
        ],
        alert: { tone:'warn', text:'matchUtilities 는 강력하지만, 값 집합을 크게 잡으면 사용하지도 않을 클래스 후보가 폭증한다 — 딱 필요한 값만.' },
        code: {
          lang:'javascript', filename:'tailwind.config.js',
          lines:[
            '// tailwind.config.js — 동적 유틸(값 매핑)',
            "const plugin = require('tailwindcss/plugin')",
            '',
            'module.exports = {',
            '  theme: {',
            '    extend: {',
            "      tabSize: { 1: '1', 2: '2', 4: '4', 8: '8' },",
            '    },',
            '  },',
            '  plugins: [',
            '    plugin(function ({ matchUtilities, theme }) {',
            '      matchUtilities(',
            '        {',
            '          tab: (value) => ({ tabSize: value }),',
            '        },',
            "        { values: theme('tabSize') },",
            '      )',
            '    }),',
            '  ],',
            '}',
            '',
            '// class="tab-4" · 임의값도 class="tab-[13]"',
          ],
          highlight:[5,6,7,11,12,13,14,15,16],
        },
      },
      {
        title: 'Step 4. 공식 플러그인 — forms · typography · aspect-ratio',
        desc: '바퀴를 다시 발명하지 말자. Tailwind 팀이 만든 공식 플러그인은 require 한 줄로 검증된 스타일을 얹는다. @tailwindcss/forms 는 제각각인 브라우저 폼 요소(체크박스·셀렉트 등)를 일관되게 리셋해 utility 로 스타일링 가능하게 만든다. typography 는 .prose 하나로 마크다운/CMS 본문에 읽기 좋은 서식을 자동 적용한다. aspect-ratio 는 비율 박스(16:9 등)를 쉽게 만든다. 직접 addBase/addComponents 로 짜기 전에 공식 플러그인부터 확인한다.',
        flow: { api:"require('@tailwindcss/forms')", gen:'폼 요소 스타일 정규화', use:'class="form-checkbox"' },
        cards: [
          { label:'forms', desc:'checkbox/select 등 폼 요소를 일관 리셋', tone:'ok' },
          { label:'typography', desc:'.prose — 본문(마크다운) 자동 서식', tone:'ok' },
          { label:'aspect-ratio', desc:'16:9 등 비율 박스 손쉽게', tone:'ok' },
          { label:'원칙', desc:'직접 만들기 전에 공식 플러그인부터 확인', tone:'good' },
        ],
        alert: { tone:'info', text:'공식 플러그인은 addBase/addComponents/matchUtilities 를 우리 대신 잘 짜 둔 결과물이다 — 내부 원리는 앞 단계와 같다.' },
        code: {
          lang:'javascript', filename:'tailwind.config.js',
          lines:[
            '// npm i -D @tailwindcss/forms @tailwindcss/typography',
            '// tailwind.config.js — 공식 플러그인 조합',
            'module.exports = {',
            '  plugins: [',
            "    require('@tailwindcss/forms'),",
            "    require('@tailwindcss/typography'),",
            "    require('@tailwindcss/aspect-ratio'),",
            '  ],',
            '}',
            '',
            '// forms: 폼 요소가 utility 로 스타일 가능해진다',
            '// class="form-checkbox text-teal-500 rounded"',
            '',
            '// typography: 본문 한 방에',
            '// article class="prose prose-teal max-w-none"',
            '',
            '// aspect-ratio: 비율 박스',
            '// div class="aspect-w-16 aspect-h-9"',
          ],
          highlight:[3,4,5,6,7],
        },
      },
      {
        title: 'Step 5. 실무 함정 — 우선순위 · 성능 · @apply 남용',
        desc: '플러그인은 강력한 만큼 오용도 쉽다. 첫째, @apply 로 컴포넌트를 만들면 CSS 파일이 다시 비대해지고 토큰을 코드로 다루기 어렵다 — 반복 컴포넌트는 addComponents 나 UI 컴포넌트로 뽑는다. 둘째, 레이어 우선순위를 기억하라: base < components < utilities. addComponents 기본값을 마크업 utility 가 덮는 건 정상이다. 셋째, matchUtilities 의 values 를 과하게 잡으면 클래스가 폭증한다. 넷째, 대부분의 "확장" 은 플러그인 없이 theme.extend 만으로 충분하다 — 플러그인은 로직/동적 생성이 필요할 때만.',
        flow: { api:'addBase / addComponents / addUtilities', gen:'base < components < utilities', use:'우선순위 위계 이해' },
        cards: [
          { label:'@apply 남용', desc:'컴포넌트는 플러그인/JSX 로 — CSS 회귀 금지', tone:'danger' },
          { label:'레이어 위계', desc:'base < components < utilities 우선순위', tone:'warn' },
          { label:'matchUtilities', desc:'values 과다 → 클래스 폭증 → 빌드 느림', tone:'danger' },
          { label:'과설계 주의', desc:'대부분은 theme.extend 로 충분하다', tone:'warn' },
        ],
        wins:[
          '반복 저수준 속성 → addUtilities 로 토큰화',
          '반복 컴포넌트 → addComponents (theme() 로 토큰 참조)',
          '값이 변하는 유틸 → matchUtilities (필요한 값만)',
          '검증된 스타일 → 공식 플러그인부터 확인',
          '단순 확장 → 플러그인 말고 theme.extend',
        ],
        alert: { tone:'good', text:'플러그인은 "로직/동적 생성" 이 필요할 때의 도구다. 정적 확장은 theme.extend, 반복 마크업은 컴포넌트가 먼저다.' },
        code: {
          lang:'javascript', filename:'pitfalls.config.js',
          lines:[
            '// 함정 1: @apply 로 컴포넌트 — CSS 로 회귀',
            '// .card { @apply p-4 rounded-lg shadow bg-white; }  // 지양',
            '// → addComponents 나 <Card> 컴포넌트로 추출',
            '',
            '// 함정 2: 레이어 우선순위',
            "const plugin = require('tailwindcss/plugin')",
            'plugin(function ({ addBase, theme }) {',
            '  addBase({',
            "    h1: { fontSize: theme('fontSize.2xl') },  // base = 최하위",
            '  })',
            '})',
            '// base < components < utilities — utility 가 항상 이긴다',
            '',
            '// 함정 3: matchUtilities values 과다 → 클래스 폭증',
            '// 함정 4: 단순 확장은 theme.extend 로 충분',
            'module.exports = {',
            "  theme: { extend: { colors: { brand: '#38B2AC' } } },",
            '  // 플러그인 없이 bg-brand / text-brand 사용 가능',
            '}',
          ],
          highlight:[1,2,3,5,7,8,9,12,15,16,17],
        },
      },
    ];

    function FlowDiagram({ flow }) {
      if (!flow) return null;
      const boxes = [
        { tag:'플러그인 API', val:flow.api, bg:'#f0fdfa', bd:'#99f6e4' },
        { tag:'생성 클래스', val:flow.gen, bg:'#dbf3e6', bd:'#86efac' },
        { tag:'마크업 사용', val:flow.use, bg:'#fef3c7', bd:'#fde68a' },
      ];
      return (
        <div className="rounded-lg overflow-hidden bg-white mb-3" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🌬️</span><span>플러그인이 클래스를 만들어내는 흐름</span>
          </div>
          <div className="p-3 flex items-stretch gap-1.5">
            {boxes.map((b, i) => (
              <React.Fragment key={i}>
                <div className="flex-1 rounded p-2 text-center" style={{background:b.bg, border:`1px solid ${b.bd}`}}>
                  <div className="text-[9px] font-bold mb-1" style={{color:DEEP}}>{b.tag}</div>
                  <div className="text-[10px] font-mono break-all" style={{color:'#334155'}}>{b.val}</div>
                </div>
                {i < boxes.length - 1 && (
                  <span className="self-center text-lg font-bold" style={{color:BRAND}}>→</span>
                )}
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    function CardList({ cards }) {
      const TONE = {
        ok:    { bg:'#f0fdfa', tx:DEEP, bd:'#99f6e4' },
        good:  { bg:'#dbf3e6', tx:'#166534', bd:'#86efac' },
        warn:  { bg:'#fef3c7', tx:'#92400e', bd:'#fde68a' },
        danger:{ bg:'#fee2e2', tx:'#991b1b', bd:'#fecaca' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🧩</span><span>플러그인 API 요점</span>
          </div>
          <div className="p-3 space-y-2">
            {cards.map((c, i) => {
              const s = TONE[c.tone] || TONE.ok;
              return (
                <div key={i} className="flex items-start gap-2 text-xs rounded p-2" style={{background:s.bg, border:`1px solid ${s.bd}`}}>
                  <span className="font-mono font-bold w-32 shrink-0" style={{color:s.tx}}>{c.label}</span>
                  <span className="flex-1" style={{color:s.tx}}>{c.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f0fdfa'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🌬️</span>
            <span className="text-lg font-bold" style={{color:DEEP}}>플러그인 선택 가이드 — 무엇을 언제</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f0fdfa', bd:'#99f6e4', tx:DEEP, icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DEEP}}>플러그인 확장 시각화</h3>
            <span className="text-[10px] text-slate-500">공장에 새 금형 추가</span>
          </div>
          <FlowDiagram flow={state.flow} />
          <CardList cards={state.cards} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.2)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TW</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:DEEP}}>Part IV. 설정 · 확장</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:`1px solid ${BRAND}`}}>IV-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>plugin — 커스텀 유틸/컴포넌트</h1>
                <p className="text-sm" style={{color:BRAND}}>플러그인으로 유틸리티와 컴포넌트를 확장 — 비유: 공장에 새 금형을 추가한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#99f6e4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#38B2ACaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                플러그인은 addUtilities(저수준 유틸)·addComponents(컴포넌트)·matchUtilities(동적 유틸)·addBase(기본 스타일)를 theme 토큰과 함께 다루는 확장 지점이다. 정적 확장은 theme.extend, 반복 마크업은 컴포넌트가 먼저이고, 플러그인은 로직·동적 생성이 필요할 때 쓴다. 레이어 우선순위(base 〈 components 〈 utilities)를 기억하면 스타일이 예상대로 겹친다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['plugin', 'addUtilities', 'addComponents', 'matchUtilities', '공식플러그인', '레이어우선순위'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
