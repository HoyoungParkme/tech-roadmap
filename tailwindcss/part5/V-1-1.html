  <div id="root"></div>
  <!--
    Tailwind V-1-1 — purge / content (미사용 제거)
    "수 MB의 유틸리티 후보에서 실제 쓴 클래스만 남긴다" 를 6단계로 검증
    1) 방대한 후보 → 2) content 글롭 → 3) JIT 스캔·제거 →
    4) 동적 클래스 함정 → 5) safelist 로 보존 → 6) 결과·체크리스트
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#38B2AC';
    const DEEP = '#234E52';

    const STEPS = [
      {
        title: 'Step 1. 문제 — 유틸리티 후보는 방대하다',
        desc: 'Tailwind 는 색·간격·폰트·상태 변형을 조합해 수십만 개의 유틸리티 클래스를 만들 수 있다. 아무 처리 없이 이 후보를 전부 CSS 로 담으면 파일이 수 MB 에 이른다. 하지만 실제 프로젝트가 쓰는 클래스는 그중 극히 일부(보통 수백 개)뿐이다. 그래서 빌드 단계에서 안 쓰는 클래스를 잘라내(purge) 최종 CSS 를 수 KB 로 줄인다. 이 원리를 알아야 프로덕션 번들이 왜 작은지, 그리고 왜 가끔 스타일이 갑자기 사라지는지 이해할 수 있다.',
        gauge: { pct: 100, label: '~3.8 MB (전부 담을 때)', tone: 'danger' },
        chips: [
          { cls:'flex', st:'candidate' }, { cls:'px-4', st:'candidate' }, { cls:'py-2', st:'candidate' },
          { cls:'bg-teal-500', st:'candidate' }, { cls:'text-white', st:'candidate' }, { cls:'rounded-md', st:'candidate' },
          { cls:'hover:bg-teal-600', st:'candidate' }, { cls:'md:flex-row', st:'candidate' }, { cls:'bg-fuchsia-700', st:'candidate' },
          { cls:'rotate-45', st:'candidate' }, { cls:'skew-y-12', st:'candidate' }, { cls:'tracking-widest', st:'candidate' },
        ],
        alert: { tone:'info', text:'후보(생성 가능한 모든 클래스)와 실사용(소스에 등장한 클래스)은 다르다. purge 는 이 둘의 차이를 없애는 최적화다.' },
        code: {
          lang:'javascript', filename:'tailwind.config.js',
          lines:[
            '// tailwind.config.js',
            "/** @type {import('tailwindcss').Config} */",
            'module.exports = {',
            '  // Tailwind 는 색·간격·폰트 조합으로',
            '  // 수십만 개의 유틸리티 클래스를 "생성할 수 있다".',
            '  // 아무 설정 없이 전부 담으면 CSS 는 수 MB.',
            '  content: [], // 아직 스캔 대상이 없음 → 위험',
            '  theme: { extend: {} },',
            '  plugins: [],',
            '};',
            '// 목표: 실제 쓴 클래스만 남겨 수 KB 로 줄인다.',
          ],
          highlight:[4,5,6,7,11],
        },
      },
      {
        title: 'Step 2. content 글롭 — 스캔 대상을 지정한다',
        desc: 'purge 의 출발점은 "어떤 파일을 훑을 것인가" 다. tailwind.config.js 의 content 배열에 글롭 패턴으로 소스 경로를 적으면, Tailwind 가 그 파일들을 읽어 클래스 문자열을 수집한다. 여기에 없는 파일의 클래스는 아예 존재하지 않는 것으로 취급되어 통째로 사라진다. 실무 최다 사고가 바로 이 경로 누락(예: 새로 만든 components 폴더 빠뜨림, 외부 UI 라이브러리 미포함)이며, 증상은 "그 컴포넌트만 스타일이 안 먹는다" 로 나타난다.',
        gauge: { pct: 100, label: '~3.8 MB (아직 purge 전)', tone: 'danger' },
        content: [
          './index.html',
          './src/**/*.{js,jsx,ts,tsx}',
          './components/**/*.{js,jsx}',
          './node_modules/my-ui/**/*.js',
        ],
        chips: [
          { cls:'flex', st:'candidate' }, { cls:'px-4', st:'candidate' }, { cls:'py-2', st:'candidate' },
          { cls:'bg-teal-500', st:'candidate' }, { cls:'text-white', st:'candidate' }, { cls:'rounded-md', st:'candidate' },
          { cls:'hover:bg-teal-600', st:'candidate' }, { cls:'md:flex-row', st:'candidate' }, { cls:'bg-fuchsia-700', st:'candidate' },
          { cls:'rotate-45', st:'candidate' }, { cls:'skew-y-12', st:'candidate' }, { cls:'tracking-widest', st:'candidate' },
        ],
        cards: [
          { label:'글롭', desc:'src/**/*.{js,jsx} — 하위 전부 스캔', tone:'ok' },
          { label:'외부 UI', desc:'node_modules 라이브러리도 넣어야 남는다', tone:'ok' },
          { label:'함정', desc:'경로 누락 → 그 파일 클래스 전멸', tone:'danger' },
          { label:'증상', desc:'"이 컴포넌트만 스타일이 안 먹어요"', tone:'warn' },
        ],
        alert: { tone:'warn', text:'content 가 비었거나 경로가 틀리면 결과 CSS 가 사실상 텅 빈다. 빌드는 성공(exit 0)하지만 화면이 무너진다.' },
        code: {
          lang:'javascript', filename:'tailwind.config.js',
          lines:[
            '// content 글롭으로 스캔 대상 지정',
            'module.exports = {',
            '  content: [',
            "    './index.html',",
            "    './src/**/*.{js,jsx,ts,tsx}',    // 컴포넌트 전부",
            "    './components/**/*.{js,jsx}',",
            "    './node_modules/my-ui/**/*.js',  // 외부 UI도 스캔",
            '  ],',
            '  theme: { extend: {} },',
            '  plugins: [],',
            '};',
            '// 경로 하나라도 빠지면 그 파일의 클래스는 사라진다.',
          ],
          highlight:[3,4,5,6,7,8,12],
        },
      },
      {
        title: 'Step 3. JIT 스캔 — 실제 쓴 클래스만 남는다',
        desc: 'Tailwind 의 JIT(Just-In-Time) 엔진은 content 파일을 정규식으로 훑어 "클래스처럼 보이는 문자열" 을 추출하고, 매칭되는 유틸리티만 생성한다. 개발 모드에서는 요청이 올 때마다 즉시(on-demand) 만들고, 프로덕션 빌드에서는 사용된 클래스만 골라 최종 CSS 를 뽑는다. 그래서 방대한 후보 중 소스에 등장한 것만 살아남고 나머지(bg-fuchsia-700, rotate-45 등)는 제거되어 파일이 수 MB 에서 수 KB 로 급감한다. 이것이 프로덕션 번들이 작은 진짜 이유다.',
        gauge: { pct: 4, label: '9.8 KB (purge 완료)', tone: 'ok' },
        chips: [
          { cls:'flex', st:'kept' }, { cls:'px-4', st:'kept' }, { cls:'py-2', st:'kept' },
          { cls:'bg-teal-500', st:'kept' }, { cls:'text-white', st:'kept' }, { cls:'rounded-md', st:'kept' },
          { cls:'hover:bg-teal-600', st:'kept' }, { cls:'md:flex-row', st:'kept' }, { cls:'bg-fuchsia-700', st:'purged' },
          { cls:'rotate-45', st:'purged' }, { cls:'skew-y-12', st:'purged' }, { cls:'tracking-widest', st:'purged' },
        ],
        alert: { tone:'good', text:'JIT 는 "요청 시 생성" + "빌드 시 사용분만 추출" 을 한 엔진으로 처리한다. 개발은 빠르고, 프로덕션은 작다.' },
        code: {
          lang:'bash', filename:'build.sh',
          lines:[
            '# 프로덕션 빌드 — JIT 가 content 를 스캔해 사용분만 생성',
            '$ npx tailwindcss -i ./src/input.css -o ./dist/out.css --minify',
            '',
            'Rebuilding...',
            'Done in 412ms.',
            '',
            '# 결과 크기 확인',
            '$ ls -lh dist/out.css',
            '-rw-r--r--  1 dev  staff   9.8K  out.css   # 수 MB → 9.8KB',
          ],
          highlight:[2,8,9],
        },
      },
      {
        title: 'Step 4. 함정 — 동적 클래스는 스캔되지 않는다',
        desc: '정규식 스캐너는 "완전한 클래스 문자열" 만 인식한다. 그래서 bg-${color}-500 처럼 접두사와 변수를 런타임에 이어 붙이면, 소스 코드 어디에도 bg-red-500 이라는 온전한 문자열이 없어 스캔에 잡히지 않는다. 결과적으로 그 클래스는 purge 되어 프로덕션에서 배경색이 증발한다. 더 위험한 건 개발 모드(JIT 실시간)에서는 멀쩡해 보인다는 점이다. 배포 후에야 깨지므로 원인 추적이 어렵다.',
        gauge: { pct: 4, label: '9.8 KB (하지만 bg-red-500 누락)', tone: 'warn' },
        chips: [
          { cls:'flex', st:'kept' }, { cls:'px-4', st:'kept' }, { cls:'py-2', st:'kept' },
          { cls:'bg-teal-500', st:'kept' }, { cls:'text-white', st:'kept' }, { cls:'rounded-md', st:'kept' },
          { cls:'hover:bg-teal-600', st:'kept' }, { cls:'md:flex-row', st:'kept' },
          { cls:'bg-red-500', st:'danger', note:'동적→소멸' },
        ],
        cards: [
          { label:'스캐너 규칙', desc:'완전한 문자열만 매칭 (조각 X)', tone:'ok' },
          { label:'나쁜 예', desc:'bg-${color}-500 → 소스에 없음', tone:'danger' },
          { label:'결과', desc:'purge 됨 → 프로덕션 색상 증발', tone:'danger' },
          { label:'무서운 점', desc:'개발에선 멀쩡, 배포 후 깨짐', tone:'warn' },
        ],
        alert: { tone:'danger', text:'문자열 연결로 만든 클래스명은 스캐너에게 보이지 않는다. "왜 프로덕션에서만 스타일이 사라지지?" 의 90%가 이 함정이다.' },
        code: {
          lang:'javascript', filename:'Badge.jsx',
          lines:[
            '// 함정: 클래스명을 조각으로 이어 붙이면 못 찾는다',
            'function Badge({ color }) {',
            '  // 스캐너는 "완전한 문자열" 만 인식한다.',
            "  // 아래는 'bg-' 와 color 가 런타임에 합쳐지므로",
            "  // 소스에는 'bg-red-500' 이라는 문자열이 없다.",
            '  return <span className={`bg-${color}-500 text-white px-2`}>NEW</span>;',
            '}',
            '// 빌드 시 bg-red-500 이 purge → 배경색 증발.',
            '// 개발(JIT 실시간)에선 멀쩡해 더 무섭다.',
          ],
          highlight:[3,4,5,6,8],
        },
      },
      {
        title: 'Step 5. 해결 — 정적 매핑과 safelist',
        desc: '가장 좋은 해결은 완전한 클래스명을 소스에 문자열로 남기는 것이다. color 값을 미리 만든 매핑 객체(예: COLOR.red === "bg-red-500")로 바꾸면 스캐너가 그 문자열을 그대로 발견한다. 매핑이 불가능할 만큼 정말 동적인 경우에만 config 의 safelist 에 클래스명이나 정규식 패턴을 명시해 강제로 보존한다. safelist 는 편리하지만 남용하면 purge 효과가 줄어드니, "정적 매핑 우선, safelist 는 최후" 순서를 지킨다.',
        gauge: { pct: 5, label: '10.2 KB (safelist 포함, 정상)', tone: 'ok' },
        chips: [
          { cls:'flex', st:'kept' }, { cls:'px-4', st:'kept' }, { cls:'py-2', st:'kept' },
          { cls:'bg-teal-500', st:'kept' }, { cls:'text-white', st:'kept' }, { cls:'rounded-md', st:'kept' },
          { cls:'hover:bg-teal-600', st:'kept' }, { cls:'md:flex-row', st:'kept' },
          { cls:'bg-red-500', st:'safe', note:'safelist' }, { cls:'bg-amber-500', st:'safe', note:'pattern' },
        ],
        cards: [
          { label:'해결 1', desc:'정적 매핑 — COLOR[color] 로 완전 문자열', tone:'good' },
          { label:'해결 2', desc:'safelist: ["bg-red-500", ...]', tone:'ok' },
          { label:'패턴', desc:'{ pattern: /bg-(red|teal)-500/ }', tone:'ok' },
          { label:'주의', desc:'safelist 남용 → purge 이득 감소', tone:'warn' },
        ],
        alert: { tone:'good', text:'우선순위: 완전한 문자열(정적 매핑) → 그래도 안 되면 safelist. 순서만 지켜도 대부분의 동적 클래스 사고가 사라진다.' },
        code: {
          lang:'javascript', filename:'safelist.js',
          lines:[
            '// 해결 1: 완전한 클래스명을 정적으로 매핑 (권장)',
            "const COLOR = { red:'bg-red-500', teal:'bg-teal-500', amber:'bg-amber-500' };",
            '// COLOR[color] 는 소스에 완전한 문자열로 존재 → 스캔됨.',
            '',
            '// 해결 2: 정말 동적이면 safelist 로 보존',
            '// tailwind.config.js',
            'module.exports = {',
            "  content: ['./src/**/*.{js,jsx}'],",
            '  safelist: [',
            "    'bg-red-500', 'bg-teal-500',",
            '    { pattern: /bg-(red|teal|amber)-(400|500|600)/ },',
            '  ],',
            '};',
          ],
          highlight:[1,2,3,9,10,11],
        },
      },
      {
        title: 'Step 6. 결과 — 수 MB에서 수 KB로',
        desc: 'content 로 스캔 대상을 정하고, JIT 로 사용분만 생성하고, 동적 클래스는 정적 매핑이나 safelist 로 보존하면 최종 CSS 는 수 MB 후보에서 수 KB 로 줄어든다. 크기가 작아지면 다운로드·파싱이 빨라져 첫 렌더가 개선된다. 마지막으로 배포 전 세 가지(경로 포함·동적 클래스 처리·프로덕션 빌드 스모크 테스트)만 확인하면 "프로덕션에서만 깨지는" 사고를 예방할 수 있다.',
        gauge: { pct: 3, label: '9.8 KB (최종 · 99.7% 감소)', tone: 'ok' },
        chips: [
          { cls:'flex', st:'kept' }, { cls:'px-4', st:'kept' }, { cls:'py-2', st:'kept' },
          { cls:'bg-teal-500', st:'kept' }, { cls:'text-white', st:'kept' }, { cls:'rounded-md', st:'kept' },
          { cls:'hover:bg-teal-600', st:'kept' }, { cls:'md:flex-row', st:'kept' }, { cls:'bg-red-500', st:'safe', note:'보존' },
        ],
        wins:[
          'content 글롭 = purge 의 출발점 — 모든 소스 경로를 넣는다',
          'JIT = 개발은 요청 시 생성, 프로덕션은 사용분만 추출',
          '동적 클래스는 정적 매핑 우선, 안 되면 safelist',
          '결과 CSS 수 MB → 수 KB — 다운로드·파싱·첫 렌더 개선',
          '배포 전 프로덕션 빌드로 실제 페이지 스모크 테스트 필수',
        ],
        alert: { tone:'good', text:'purge 는 마법이 아니라 "스캔 가능한 문자열" 에 대한 최적화다. 스캐너가 볼 수 있게 코드를 짜는 것이 핵심이다.' },
        code: {
          lang:'bash', filename:'verify.sh',
          lines:[
            '# 최종 확인 — 번들 크기 급감',
            '$ ls -lh dist/*.css',
            '-rw-r--r--  full-untreeshaken.css   3.8M   # content 없이 전부',
            '-rw-r--r--  out.css                  9.8K   # purge 후 (99.7% 감소)',
            '',
            '# 배포 전 체크리스트',
            '# [1] content 글롭에 모든 소스 경로 포함?',
            '# [2] 동적 클래스는 정적 매핑 또는 safelist?',
            '# [3] 프로덕션 빌드로 실제 페이지 스모크 테스트?',
          ],
          highlight:[2,3,4,7,8,9],
        },
      },
    ];

    const CHIP_STYLE = {
      candidate:{ bg:'#f1f5f9', tx:'#64748b', bd:'#e2e8f0', line:false },
      kept:     { bg:'#f0fdfa', tx:DEEP,      bd:'#5eead4', line:false },
      purged:   { bg:'#f8fafc', tx:'#cbd5e1', bd:'#e2e8f0', line:true },
      danger:   { bg:'#fee2e2', tx:'#991b1b', bd:'#fecaca', line:false },
      safe:     { bg:'#fef3c7', tx:'#92400e', bd:'#fde68a', line:false },
    };

    function SizeGauge({ gauge }) {
      const tone = gauge.tone;
      const barColor = tone === 'ok' ? BRAND : tone === 'warn' ? '#d97706' : '#dc2626';
      const trackColor = '#e2e8f0';
      return (
        <div className="rounded-lg bg-white p-3" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-xs font-bold" style={{color:DEEP}}>최종 CSS 크기</span>
            <span className="text-xs font-mono font-bold" style={{color:barColor}}>{gauge.label}</span>
          </div>
          <div className="h-3 w-full rounded-full overflow-hidden" style={{background:trackColor}}>
            <div className="h-full rounded-full transition-all duration-700" style={{width:`${gauge.pct}%`, background:barColor}} />
          </div>
        </div>
      );
    }

    function ContentGlobs({ content }) {
      if (!content) return null;
      return (
        <div className="mt-3 rounded-lg bg-white p-3" style={{border:`1px solid ${BRAND}`}}>
          <div className="text-xs font-bold mb-1.5" style={{color:DEEP}}>content 스캔 대상 (글롭)</div>
          <div className="space-y-1">
            {content.map((g, i) => (
              <div key={i} className="flex items-center gap-1.5 text-[11px] font-mono rounded px-2 py-1" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>
                <span style={{color:BRAND}}>▸</span><span>{g}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ChipGrid({ chips }) {
      return (
        <div className="mt-3 rounded-lg bg-white p-3" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold" style={{color:DEEP}}>유틸리티 클래스 후보</span>
            <div className="flex gap-2 text-[10px]">
              <span style={{color:DEEP}}>■ 유지</span>
              <span style={{color:'#cbd5e1'}}>■ 제거</span>
              <span style={{color:'#dc2626'}}>■ 위험</span>
              <span style={{color:'#92400e'}}>■ 보존</span>
            </div>
          </div>
          <div className="flex flex-wrap gap-1.5">
            {chips.map((c, i) => {
              const s = CHIP_STYLE[c.st] || CHIP_STYLE.candidate;
              return (
                <span key={i} className="text-[11px] font-mono rounded px-2 py-1 transition" style={{background:s.bg, color:s.tx, border:`1px solid ${s.bd}`, textDecoration:s.line ? 'line-through' : 'none'}}>
                  {c.cls}{c.note ? ` · ${c.note}` : ''}
                </span>
              );
            })}
          </div>
        </div>
      );
    }

    function CardList({ cards }) {
      if (!cards) return null;
      const TONE = {
        ok:    { bg:'#f0fdfa', tx:DEEP,      bd:'#99f6e4' },
        good:  { bg:'#dbf3e6', tx:'#166534', bd:'#86efac' },
        warn:  { bg:'#fef3c7', tx:'#92400e', bd:'#fde68a' },
        danger:{ bg:'#fee2e2', tx:'#991b1b', bd:'#fecaca' },
      };
      return (
        <div className="mt-3 rounded-lg bg-white p-3 space-y-2" style={{border:`1px solid ${BRAND}`}}>
          {cards.map((c, i) => {
            const s = TONE[c.tone] || TONE.ok;
            return (
              <div key={i} className="flex items-start gap-2 text-xs rounded p-2" style={{background:s.bg, border:`1px solid ${s.bd}`}}>
                <span className="font-mono font-bold w-24 shrink-0" style={{color:s.tx}}>{c.label}</span>
                <span className="flex-1" style={{color:s.tx}}>{c.desc}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f0fdfa'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🌬️</span>
            <span className="text-lg font-bold" style={{color:DEEP}}>purge 를 안전하게 쓰는 5가지</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f0fdfa', bd:'#99f6e4', tx:DEEP,      icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DEEP}}>purge 파이프라인</h3>
            <span className="text-[10px] text-slate-500">후보 → 스캔 → 최소화</span>
          </div>
          <SizeGauge gauge={state.gauge} />
          <ContentGlobs content={state.content} />
          <ChipGrid chips={state.chips} />
          <CardList cards={state.cards} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.2)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TW</span>
              <div>
                <div className="mb-1">
                  <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style={{background:DEEP}}>Part V · 프로덕션</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>V-1-1. purge / content — 미사용 제거</h1>
                <p className="text-sm" style={{color:BRAND}}>실제 사용한 클래스만 남겨 CSS 를 최소화</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#99f6e4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#38B2ACaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                purge 는 content 로 스캔 대상을 정하고, JIT 로 실제 쓴 클래스만 뽑아 CSS 를 수 MB 에서 수 KB 로 줄이는 최적화다. 스캐너는 완전한 문자열만 인식하므로 동적 클래스는 정적 매핑을 우선하고, 불가피할 때만 safelist 로 보존한다. 다음에는 프로덕션 빌드 파이프라인과 캐싱 전략을 이어서 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['purge', 'content글롭', 'JIT', 'safelist', '동적클래스함정', '번들최소화'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
