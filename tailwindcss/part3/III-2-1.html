<!DOCTYPE html>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧩</text></svg>" />

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>

  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#38B2AC';

          { name: '문제 상황', state: 'X', use: '카드 hover → 자식 아이콘 변화' },

          { name: '부모 영역 전체', state: '필요', use: '부모 어디에 올려도 자식 변화' },
        ],
        alert: { tone: 'info', text: '자식이 부모 hover 를 인지하려면 신호가 필요하다.' },
        code: {
          lang: 'html',
          filename: 'naive-card.html',
          lines: [
            '<!-- 잘못된 접근 — 자식에 hover -->',
            '<a href="/post/1" class="block border rounded-lg p-4 hover:border-teal-500">',
            '  <h3 class="text-lg font-bold">제목</h3>',
            '  <p class="text-sm text-slate-600">설명</p>',
            '',
            '  <!-- 화살표가 자기 위에 올릴 때만 움직임 ✗ -->',
            '  <span class="inline-block mt-2 hover:translate-x-1 transition">→</span>',
            '</a>',
            '',
            '<!-- 부모 hover 를 자식이 받아야 함 -->',
            '<!-- → group / group-hover 가 그 도구 -->',
          ],
          highlight: [1, 2, 6, 7, 10, 11],
        },
      },
      {
        title: 'Step 2. 해결 — 부모에 group, 자식에 group-hover:',
        desc: '부모 요소에 class="group" 을 붙이면 자식에서 group-hover: 같은 변형이 가능해진다. 같은 방식으로 group-focus, group-active, group-disabled, group-focus-within 도 동작.',
        rows: [
          { name: 'group', state: '부모', use: '마커 클래스 (자식에게 신호)' },
          { name: 'group-hover:', state: '자식', use: '부모 hover 시' },
          { name: 'group-focus:', state: '자식', use: '부모 focus 시' },
          { name: 'group-focus-within:', state: '자식', use: '부모 내부에 focus 시' },
          { name: 'group-active:', state: '자식', use: '부모 click 시' },
        ],
        alert: { tone: 'good', text: '부모에 group, 자식에 group-* — 이 두 줄이 핵심.' },
        code: {
          lang: 'html',
          filename: 'group-card.html',
          lines: [
            '<!-- 부모에 group 마커 -->',
            '<a href="/post/1" class="',
            '  group',
            '  block border rounded-lg p-4 transition',
            '  hover:border-teal-500 hover:shadow-md',
            '">',
            '  <h3 class="text-lg font-bold',
            '             group-hover:text-teal-600">',

            '',

            '               group-hover:text-teal-600">',

        title: 'Step 3. 중첩 그룹 — group/name 으로 구분',
        desc: '카드 안에 또 카드(중첩). 모두 group 이면 어느 group 의 hover 인지 구분 못 함. group/name 문법으로 이름을 붙이면 group-hover/name 으로 정확히 가리킬 수 있다.',
        rows: [
          { name: 'group/card', state: '바깥', use: '카드 그룹 이름' },
          { name: 'group/avatar', state: '안쪽', use: '아바타 그룹 이름' },
          { name: 'group-hover/card:', state: '자식', use: '카드 hover 시' },
          { name: 'group-hover/avatar:', state: '자식', use: '아바타 hover 시' },
        ],
        alert: { tone: 'info', text: '슬래시 뒤에 이름을 적어 충돌을 해결.' },
        code: {
          lang: 'html',
          filename: 'nested-groups.html',
          lines: [
            '<!-- 카드(바깥) 안에 아바타(안쪽) 그룹 -->',
            '<article class="group/card border rounded-xl p-4 hover:shadow-lg">',
            '  <header class="flex items-center gap-3">',
            '    <!-- 안쪽 그룹 — 이름 avatar -->',
            '    <div class="group/avatar relative">',
            '      <img src="/me.jpg" class="w-10 h-10 rounded-full" />',
            '',
            '      <!-- 아바타에 hover 했을 때만 표시 -->',
            '      <span class="absolute -top-1 -right-1 text-xs',
            '                   opacity-0 group-hover/avatar:opacity-100',
            '                   transition">',
            '        ✏️',
            '      </span>',
            '    </div>',
            '',
            '    <!-- 카드 어디에 hover 해도 색이 바뀜 -->',
            '    <h3 class="text-lg font-bold',
            '               group-hover/card:text-teal-600">',
            '      포스트 제목',

      {
        title: 'Step 4. 실전 — 메뉴 아이템 / dropdown 화살표 회전',
        desc: '실무에서 가장 흔한 두 패턴: 1) 메뉴 아이템 hover 시 아이콘 색상/위치 변경, 2) dropdown 트리거 hover/open 시 화살표 회전. group/group-open(headless ui) 까지 함께 쓰면 표현력이 크게 늘어남.',
        rows: [
          { name: '메뉴 아이콘', state: 'hover', use: '색상 + 위치 이동' },
          { name: 'dropdown 화살표', state: 'hover/open', use: '180도 회전' },
          { name: '카드 더보기', state: 'hover', use: 'opacity 0 → 100' },
          { name: '이미지 zoom', state: 'hover', use: 'scale 1 → 1.05' },
        ],
        alert: { tone: 'good', text: 'group 은 한 컴포넌트 안의 마이크로 인터랙션 도구.' },
        code: {
          lang: 'html',
          filename: 'real-patterns.html',
          lines: [
            '<!-- 1) 메뉴 아이템 -->',
            '<nav class="space-y-1">',
            '  <a href="/dashboard" class="',
            '    group flex items-center gap-3 px-3 py-2 rounded',
            '    hover:bg-teal-50 text-slate-700 hover:text-teal-700',
            '  ">',
            '    <svg class="w-4 h-4 text-slate-400',
            '                group-hover:text-teal-500',
            '                group-hover:scale-110 transition">',
            '      <!-- icon -->',
            '    </svg>',
            '    <span>대시보드</span>',
            '    <span class="ml-auto text-xs opacity-0',
            '                 group-hover:opacity-100">⌘D</span>',
            '  </a>',
            '</nav>',
            '',
            '<!-- 2) dropdown 트리거 -->',
            '<details class="group open:rounded-lg open:bg-slate-50">',
            '  <summary class="cursor-pointer px-3 py-2 flex items-center">',
            '    <span>옵션</span>',
            '    <svg class="ml-auto w-4 h-4 transition',
            '                group-open:rotate-180">▼</svg>',
            '  </summary>',
            '  <div class="px-3 pb-2 text-sm">…</div>',
            '</details>',
            '',
            '<!-- 3) 이미지 zoom 카드 -->',
            '<div class="group overflow-hidden rounded-lg">',
            '  <img class="transition group-hover:scale-105" src="/hero.jpg" />',
            '</div>',
          ],
          highlight: [3, 4, 7, 8, 9, 13, 14, 19, 22, 23, 29, 30],
        },
      },
      {
        title: 'Step 5. 정리 — group 사고 5규칙',
        desc: 'group 은 단순한 마커지만 디자인 표현력을 크게 늘려준다. 중첩이 필요하면 이름 붙이기, 형제 상태가 필요하면 다음 강의의 peer 가 짝꿍.',
        rows: [
          { name: '규칙', state: '내용', use: '비고' },
        ],
        wins: [
          '부모 hover → 자식 변형은 group + group-hover: 조합',
          'group/name 으로 중첩 그룹 구분',
          'group-focus / group-focus-within / group-active 모두 동작',
          '실전: 메뉴 아이콘, dropdown 회전, 이미지 zoom',
          '형제 상태에 반응하려면 peer 사용 (다음 강의)',
        ],
        alert: { tone: 'good', text: 'CSS :has() 가 없던 시절의 우아한 해결책.' },
        code: {
          lang: 'css',
          filename: 'how-it-compiles.css',
          lines: [
            '/* Tailwind 가 컴파일하는 모습 — group/group-hover */',
            '',
            '.group:hover .group-hover\\:translate-x-1 {',
            '  --tw-translate-x: 0.25rem;',
            '  transform: translate(var(--tw-translate-x), 0);',
            '}',
            '',
            '/* 이름 있는 그룹 */',
            '.group\\/card:hover .group-hover\\/card\\:text-teal-600 {',
            '  color: rgb(13 148 136);',
            '}',
            '',
            '/* 즉 .group 부모가 :hover 상태일 때 */',
            '/* 자식의 group-hover\\:... 가 활성화된다 */',
            '/* CSS 의 자식 셀렉터로 거꾸로 올라가지 않고 */',
            '/* 부모 셀렉터에서 정상 방향으로 내려감 */',
          ],
          highlight: [1, 3, 4, 5, 6, 9, 10, 11, 13, 14, 15, 16],
        },
      },
    ];

    function Table({ rows }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>🧩 group 패턴</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-44 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="w-20 px-2 py-0.5 rounded font-mono" style={{background:SOFT, color:DEEP}}>{r.state}</span>
                <span className="flex-1" style={{color:DEEP}}>{r.use}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:SOFT}}>
          <div className="text-lg font-bold mb-2" style={{color:DEEP}}>🧩 핵심 정리</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info: { bg:SOFT, bd:'#99f6e4', tx:DEEP, icon:'💡' },
      warn: { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      good: { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-3 text-sm font-bold" style={{color:DEEP}}>부모에 group, 자식에 group-* 로 신호 전달</div>
          <Table rows={state.rows} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TW</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>III-2-1. group + group-hover (부모 hover로 자식 변형)</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 부모 카드에 손이 가면 자식 아이콘이 반응</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : MINT}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                group + group-hover 로 부모→자식 신호. 중첩은 이름으로 분리.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["group","group-hover","group-focus","nested"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:SOFT, color:DEEP, border:`1px solid ${MINT}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./III-1-2.html" className="underline hover:no-underline">← 이전</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
