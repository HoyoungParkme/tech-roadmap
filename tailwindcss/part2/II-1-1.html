  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

<body>
  <div id="root"></div>
  <!--
    Tailwind II-1-1 — spacing scale (비유: 눈금자)
    "왜 아무 px 이나 쓰면 안 되는가" 를 5단계로 검증
    1) 4px 베이스 스케일 → 2) padding·margin·gap → 3) gap vs space-x →
    4) 반응형 간격 → 5) 임의값 남발이 스케일을 붕괴시킨다
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#38B2AC';
    const DEEP = '#234E52';

    // 4px 베이스 스케일 — 실제 픽셀 값과 매핑
    const SCALE = [
      { t:'p-1', rem:'0.25rem', px:4 },
      { t:'p-2', rem:'0.5rem',  px:8 },
      { t:'p-3', rem:'0.75rem', px:12 },
      { t:'p-4', rem:'1rem',    px:16 },
      { t:'p-6', rem:'1.5rem',  px:24 },
      { t:'p-8', rem:'2rem',    px:32 },
    ];

    const STEPS = [
      {
        mode: 'scale',
        title: 'Step 1. 4px 베이스 스케일 — 눈금자를 먼저 정한다',
        desc: 'Tailwind 의 spacing 은 0.25rem(=4px) 을 1칸으로 하는 눈금자다. p-1 은 4px, p-2 는 8px, p-4 는 16px 처럼 숫자에 4를 곱하면 픽셀이 된다. 왜 이렇게 고정할까? 사람의 눈은 4·8·16 같은 규칙적 배수에서 리듬을 느끼고, 13px 과 15px 의 차이는 구분하지 못한다. 스케일을 정해두면 "이 여백 몇 px 이 맞지?" 라는 눈대중 논쟁이 사라진다.',
        cards: [
          { label:'베이스', desc:'0.25rem = 4px — 모든 값의 최소 단위', tone:'ok' },
          { label:'p-1 / p-4', desc:'숫자 × 4 = px (1→4px, 4→16px)', tone:'ok' },
          { label:'왜', desc:'규칙적 배수가 시각적 리듬을 만든다', tone:'good' },
          { label:'효과', desc:'여백 논쟁 종료 — 디자인 시스템의 뼈대', tone:'good' },
        ],
        alert: { tone:'info', text:'rem 단위라 사용자가 브라우저 기본 글자 크기를 키우면 여백도 함께 커진다 — 접근성에도 유리하다.' },
        code: {
          lang:'xml', filename:'scale.html',
          lines:[
            '<!-- spacing 유틸리티는 4px 베이스 스케일 -->',
            '<div class="p-1">4px</div>   <!-- 0.25rem -->',
            '<div class="p-2">8px</div>   <!-- 0.5rem  -->',
            '<div class="p-3">12px</div>  <!-- 0.75rem -->',
            '<div class="p-4">16px</div>  <!-- 1rem    -->',
            '<div class="p-6">24px</div>  <!-- 1.5rem  -->',
            '<div class="p-8">32px</div>  <!-- 2rem    -->',
            '',
            '<!-- 규칙: className 숫자 × 4 = 실제 픽셀 -->',
            '<!-- p-4 → 4 × 4 = 16px, m-6 → 6 × 4 = 24px -->',
            '',
            '<!-- 이 눈금자를 팀 전체가 공유한다 -->',
            '<!-- "몇 px 쓸까" 대신 "몇 칸 쓸까" 로 대화한다 -->',
          ],
          highlight:[1,2,3,4,5,6,7,9,10],
        },
      },
      {
        mode: 'boxmodel',
        title: 'Step 2. padding · margin · gap — 같은 스케일, 다른 위치',
        desc: '같은 4px 스케일이 세 방향에 쓰인다. padding(p-*) 은 테두리 안쪽 여백, margin(m-*) 은 바깥쪽 여백, gap(gap-*) 은 flex/grid 자식들 사이의 간격이다. 핵심은 셋이 같은 숫자 체계를 공유한다는 점이다. p-4·m-4·gap-4 가 모두 16px 이므로 요소 안팎과 사이가 같은 리듬으로 정렬된다. 방향별 축약(px-·py-·mt-·mx-auto)도 같은 스케일을 따른다.',
        cards: [
          { label:'p-4 / px-4', desc:'padding — 테두리 안쪽 여백', tone:'ok' },
          { label:'m-4 / mt-2', desc:'margin — 요소 바깥 여백', tone:'ok' },
          { label:'gap-4', desc:'flex/grid 자식 사이 간격', tone:'ok' },
          { label:'공통점', desc:'셋 다 같은 4px 스케일 숫자를 공유', tone:'good' },
        ],
        alert: { tone:'warn', text:'요소 사이 간격은 인접 margin 보다 부모의 gap 으로 주는 편이 예측 가능하다 — margin 겹침(collapse) 문제가 없다.' },
        code: {
          lang:'xml', filename:'box.html',
          lines:[
            '<!-- 같은 스케일이 세 위치에서 쓰인다 -->',
            '',
            '<!-- padding: 안쪽 여백 -->',
            '<button class="px-4 py-2">저장</button>',
            '',
            '<!-- margin: 바깥 여백 (mt = margin-top) -->',
            '<h2 class="mt-6 mb-2">제목</h2>',
            '',
            '<!-- gap: 자식들 사이 간격 (부모에 지정) -->',
            '<div class="flex gap-4">',
            '  <div class="p-4">A</div>',
            '  <div class="p-4">B</div>',
            '</div>',
            '',
            '<!-- 방향 축약: px/py, mx/my, mt/mr/mb/ml -->',
            '<!-- mx-auto 는 가로 중앙 정렬 (margin 자동) -->',
            '<div class="mx-auto w-64">가운데</div>',
          ],
          highlight:[3,4,6,7,9,10,11,12,13],
        },
      },
      {
        mode: 'gap',
        title: 'Step 3. gap vs space-x — flex-wrap 앞에서 갈린다',
        desc: 'gap-4 와 space-x-4 는 겉보기엔 자식 사이 16px 간격으로 똑같아 보인다. 차이는 동작 방식이다. gap 은 부모의 CSS 속성이라 어느 자식이 접히든 항상 옳게 동작한다. 반면 space-x 는 첫 자식을 제외한 나머지에 margin-left 를 주입하는 트릭이라, flex-wrap 으로 줄이 바뀌면 새 줄 첫 요소에도 왼쪽 여백이 남아 정렬이 어긋난다. 그래서 실무 기본값은 gap 이고, space-x 는 레거시나 특수한 경우에만 쓴다.',
        cards: [
          { label:'gap-4', desc:'부모 속성 — wrap 돼도 항상 정확', tone:'good' },
          { label:'space-x-4', desc:'자식에 margin-left 주입하는 트릭', tone:'warn' },
          { label:'함정', desc:'flex-wrap 시 새 줄 첫 요소 여백 어긋남', tone:'danger' },
          { label:'권장', desc:'기본은 gap, space-x 는 레거시용', tone:'ok' },
        ],
        alert: { tone:'danger', text:'space-x + flex-wrap 조합은 줄바꿈되는 순간 정렬이 깨진다. 반응형에서 자주 터지는 함정이니 gap 을 기본으로 삼아라.' },
        code: {
          lang:'xml', filename:'gap.html',
          lines:[
            '<!-- 권장: gap — 부모 속성이라 wrap 안전 -->',
            '<div class="flex flex-wrap gap-4">',
            '  <span class="p-2">태그1</span>',
            '  <span class="p-2">태그2</span>',
            '  <span class="p-2">태그3</span>',
            '</div>',
            '',
            '<!-- 주의: space-x 는 margin-left 트릭 -->',
            '<div class="flex flex-wrap space-x-4">',
            '  <span class="p-2">태그1</span>',
            '  <!-- 줄바꿈되면 아래 첫 요소에도 -->',
            '  <!-- 왼쪽 margin 이 남아 어긋난다 -->',
            '  <span class="p-2">태그2</span>',
            '</div>',
            '',
            '<!-- 결론: wrap 가능성이 있으면 무조건 gap -->',
          ],
          highlight:[1,2,3,4,5,6,8,9,11,12],
        },
      },
      {
        mode: 'responsive',
        title: 'Step 4. 반응형 간격 — 화면이 커지면 여백도 자란다',
        desc: '모바일에서 여유였던 여백이 데스크톱에서는 답답해 보인다. Tailwind 는 breakpoint prefix 로 같은 스케일을 화면 크기별로 바꾼다. p-4 md:p-8 은 기본 16px, 768px 이상에서 32px 를 뜻한다. gap-2 md:gap-6 처럼 간격도 반응형으로 준다. 중요한 건 여전히 스케일 안의 값만 쓴다는 점이다 — 반응형이라고 17px, 29px 같은 임의값을 끌어오면 리듬이 다시 깨진다.',
        cards: [
          { label:'p-4 md:p-8', desc:'기본 16px → 768px+ 32px', tone:'ok' },
          { label:'gap-2 md:gap-6', desc:'간격도 breakpoint 별로', tone:'ok' },
          { label:'모바일 우선', desc:'prefix 없는 값이 기본, md/lg 로 확장', tone:'good' },
          { label:'주의', desc:'반응형이어도 스케일 값만 사용', tone:'warn' },
        ],
        alert: { tone:'info', text:'모바일 우선 원칙 — prefix 없는 유틸리티가 작은 화면 기본값이고, md·lg·xl 은 그 위에 덮어쓴다.' },
        code: {
          lang:'xml', filename:'responsive.html',
          lines:[
            '<!-- 화면이 커지면 여백도 스케일 안에서 확장 -->',
            '<section class="p-4 md:p-8 lg:p-12">',
            '  <h2 class="mb-2 md:mb-4">반응형 카드</h2>',
            '  <div class="flex gap-2 md:gap-6">',
            '    <div class="p-3 md:p-4">A</div>',
            '    <div class="p-3 md:p-4">B</div>',
            '  </div>',
            '</section>',
            '',
            '<!-- 모바일 우선: prefix 없는 값이 기본 -->',
            '<!-- md: 는 768px 이상에서 덮어쓴다 -->',
            '',
            '<!-- 나쁜 예: 반응형인데 임의값 -->',
            '<!-- p-[17px] md:p-[29px] → 스케일 이탈 -->',
          ],
          highlight:[1,2,3,4,5,6,7,8,10,11],
        },
      },
      {
        mode: 'contrast',
        title: 'Step 5. 임의값 남발 — 스케일이 붕괴하는 순간',
        desc: 'p-[13px], p-[7px], gap-[19px] 같은 임의값(arbitrary value)은 급할 때 탈출구지만, 남발하면 눈금자 자체가 무너진다. 한 화면에 13·15·18px 이 섞이면 사람 눈은 "정렬이 안 맞는데 왜인지 모르겠다" 는 불쾌감을 느낀다. 임의값은 스케일에 없는 딱 한 값이 진짜 필요할 때(브랜드 로고 정렬 등) 예외로만 쓴다. 큰 값을 하드코딩하기 전에 p-10·p-12 로 스케일을 확장할 수 있는지 먼저 본다. 규칙은 하나 — 기본은 스케일, 임의값은 최후의 예외.',
        cards: [
          { label:'임의값 [13px]', desc:'대괄호 문법 — 스케일 밖 값', tone:'warn' },
          { label:'남발 결과', desc:'13/15/18px 혼용 → 리듬 붕괴', tone:'danger' },
          { label:'예외 허용', desc:'로고 정렬 등 딱 한 값이 필요할 때만', tone:'ok' },
          { label:'큰 값', desc:'하드코딩 전에 p-10/p-12 확장 검토', tone:'ok' },
        ],
        wins:[
          '스케일 값만 쓰면 정렬이 자동으로 맞아 리뷰 부담이 줄어든다',
          'p-1~p-8 몇 칸이라는 공용 언어로 팀 커뮤니케이션이 빨라진다',
          '반응형·다크모드에서도 같은 눈금자라 예측 가능하다',
          'gap 을 기본으로 쓰면 flex-wrap 정렬 사고가 사라진다',
          '임의값은 예외로만 — 남발하지 않으면 시스템이 유지된다',
        ],
        alert: { tone:'good', text:'"스케일이 답답하다" 고 느끼면 임의값을 흩뿌리지 말고 theme.spacing 에 새 토큰을 추가해라 — 예외를 규칙으로 승격시키는 방법이다.' },
        code: {
          lang:'xml', filename:'pitfall.html',
          lines:[
            '<!-- 나쁜 예: 임의값 남발 → 스케일 붕괴 -->',

            '<div class="p-[18px] gap-[19px]">C</div>',
            '<!-- 13/7/18 — 아무도 이유를 설명 못 한다 -->',
            '',
            '<!-- 좋은 예: 스케일 값만 사용 -->',
            '<div class="p-3">A</div>',

            '<div class="p-4 gap-4">C</div>',

          ],
          highlight:[1,2,3,4,5,7,8,9,10,12,13,14],
        },
      },
    ];

    function CardList({ cards }) {
      const TONE = {
        ok:    { bg:'#f0fdfa', tx:DEEP, bd:'#99f6e4' },
        good:  { bg:'#dbf3e6', tx:'#166534', bd:'#86efac' },
        warn:  { bg:'#fef3c7', tx:'#92400e', bd:'#fde68a' },
        danger:{ bg:'#fee2e2', tx:'#991b1b', bd:'#fecaca' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>📏</span><span>spacing 스케일 핵심</span>
          </div>
          <div className="p-3 space-y-2">
            {cards.map((c, i) => {
              const s = TONE[c.tone] || TONE.ok;
              return (
                <div key={i} className="flex items-start gap-2 text-xs rounded p-2" style={{background:s.bg, border:`1px solid ${s.bd}`}}>
                  <span className="font-mono font-bold w-28 shrink-0" style={{color:s.tx}}>{c.label}</span>
                  <span className="flex-1" style={{color:s.tx}}>{c.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f0fdfa'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">📏</span>
            <span className="text-lg font-bold" style={{color:DEEP}}>스케일을 지키면 얻는 것</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f0fdfa', bd:'#99f6e4', tx:DEEP, icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    // 픽셀을 화면에서 보기 좋게 키우는 배율 (실제 px 라벨은 그대로 유지)
    const SC = 2.5;

    // Step 1 — 4px 베이스 스케일 사다리 (눈금자와 함께)
    function ScaleLadder() {
      return (
        <div className="rounded-lg bg-white p-3" style={{border:`1px solid ${BRAND}`}}>
          <div className="text-[11px] font-bold mb-2" style={{color:DEEP}}>4px 베이스 눈금자 — 칸 하나 = 4px</div>
          <div className="space-y-2">
            {SCALE.map((s) => (
              <div key={s.t} className="flex items-center gap-2">
                <span className="font-mono text-[11px] w-10 text-right" style={{color:DEEP}}>{s.t}</span>
                <div className="flex-1 relative h-5 rounded bg-slate-50 overflow-hidden" style={{backgroundImage:`repeating-linear-gradient(90deg, #e2e8f0 0 1px, transparent 1px ${4*SC}px)`}}>
                  <div className="h-full rounded flex items-center justify-end pr-1" style={{width:`${s.px*SC}px`, background:BRAND}}>
                    <span className="text-[9px] font-bold text-white">{s.px}px</span>
                  </div>
                </div>
                <span className="font-mono text-[10px] w-14 text-slate-500">{s.rem}</span>
              </div>
            ))}
          </div>
          <div className="text-[10px] text-slate-500 mt-2">회색 눈금 한 칸이 4px — 모든 막대가 눈금에 딱 맞는다</div>
        </div>
      );
    }

    // Step 2 — box model: margin > border > padding > content
    function BoxModelViz() {
      return (
        <div className="rounded-lg bg-white p-3" style={{border:`1px solid ${BRAND}`}}>
          <div className="text-[11px] font-bold mb-2" style={{color:DEEP}}>같은 16px 스케일이 세 위치에</div>
          <div className="rounded" style={{background:'#fee2e2', padding:`${16}px`}}>
            <div className="text-[9px] font-mono text-red-700 mb-1">margin (m-4 = 16px)</div>
            <div className="rounded" style={{background:'#fef3c7', padding:`${16}px`}}>
              <div className="text-[9px] font-mono text-amber-700 mb-1">padding (p-4 = 16px)</div>
              <div className="rounded flex" style={{background:'#f0fdfa', gap:`${16}px`, padding:'8px'}}>
                <div className="flex-1 rounded text-center py-2 text-[10px] font-mono text-white" style={{background:BRAND}}>content A</div>
                <div className="flex-1 rounded text-center py-2 text-[10px] font-mono text-white" style={{background:BRAND}}>content B</div>
              </div>
              <div className="text-[9px] font-mono text-teal-700 mt-1">gap-4 = 16px (자식 사이)</div>
            </div>
          </div>
        </div>
      );
    }

    // Step 3 — gap vs space-x with flex-wrap
    function GapViz() {
      const items = ['태그1','태그2','태그3','태그4','태그5'];
      return (
        <div className="rounded-lg bg-white p-3 space-y-3" style={{border:`1px solid ${BRAND}`}}>
          <div>
            <div className="text-[11px] font-bold mb-1" style={{color:'#166534'}}>✅ gap — wrap 돼도 항상 정렬</div>
            <div className="flex flex-wrap" style={{gap:'8px'}}>
              {items.map((t,i)=>(<span key={i} className="px-2 py-1 rounded text-[10px] font-mono text-white" style={{background:BRAND}}>{t}</span>))}
            </div>
          </div>
          <div>
            <div className="text-[11px] font-bold mb-1" style={{color:'#991b1b'}}>🚨 space-x — wrap 시 새 줄 첫 요소 어긋남</div>
            <div className="flex flex-wrap" style={{maxWidth:'180px'}}>
              {items.map((t,i)=>(<span key={i} className="px-2 py-1 rounded text-[10px] font-mono text-white" style={{background:'#f59e0b', marginLeft: i===0?0:'8px'}}>{t}</span>))}
            </div>
            <div className="text-[10px] text-slate-500 mt-1">둘째 줄이 왼쪽 margin 만큼 밀려 시작선이 안 맞는다</div>
          </div>
        </div>
      );
    }

    // Step 4 — responsive: mobile vs desktop
    function ResponsiveViz() {
      const Card = ({ pad, gap, label }) => (
        <div className="rounded flex-1" style={{background:'#f0fdfa', padding:`${pad}px`, border:`1px solid ${BRAND}`}}>
          <div className="text-[10px] font-mono mb-2" style={{color:DEEP}}>{label}</div>
          <div className="flex" style={{gap:`${gap}px`}}>
            <div className="flex-1 rounded text-center py-1.5 text-[9px] text-white" style={{background:BRAND}}>A</div>
            <div className="flex-1 rounded text-center py-1.5 text-[9px] text-white" style={{background:BRAND}}>B</div>
          </div>
        </div>
      );
      return (
        <div className="rounded-lg bg-white p-3" style={{border:`1px solid ${BRAND}`}}>
          <div className="text-[11px] font-bold mb-2" style={{color:DEEP}}>같은 스케일, 화면 크기별 값</div>
          <div className="flex gap-3 items-start">
            <div className="text-center">
              <Card pad={8} gap={8} label="📱 기본 p-4 gap-2" />
              <div className="text-[9px] text-slate-500 mt-1">모바일 (좁은 여백)</div>
            </div>
            <div className="text-center flex-1">
              <Card pad={16} gap={24} label="🖥️ md:p-8 md:gap-6" />
              <div className="text-[9px] text-slate-500 mt-1">데스크톱 (넉넉한 여백)</div>
            </div>
          </div>
        </div>
      );
    }

    // Step 5 — consistent vs arbitrary contrast
    function ContrastViz() {
      const good = [12,8,16,12];
      const bad = [13,7,18,15];
      return (
        <div className="rounded-lg bg-white p-3 space-y-3" style={{border:`1px solid ${BRAND}`}}>
          <div>
            <div className="text-[11px] font-bold mb-1" style={{color:'#166534'}}>✅ 스케일 값 (p-3/p-2/p-4) — 리듬이 산다</div>
            <div className="space-y-1">
              {good.map((px,i)=>(
                <div key={i} className="rounded text-[10px] font-mono text-white flex items-center" style={{background:BRAND, padding:`${px}px`}}>
                  <span>{px}px · 스케일</span>
                </div>
              ))}
            </div>
          </div>
          <div>
            <div className="text-[11px] font-bold mb-1" style={{color:'#991b1b'}}>🚨 임의값 (p-[13px]/[7px]/[18px]) — 어긋남</div>
            <div className="space-y-1">
              {bad.map((px,i)=>(
                <div key={i} className="rounded text-[10px] font-mono text-white flex items-center" style={{background:'#ef4444', padding:`${px}px`}}>
                  <span>{px}px · 임의값</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function SpacingViz({ mode }) {
      if (mode === 'scale') return <ScaleLadder />;
      if (mode === 'boxmodel') return <BoxModelViz />;
      if (mode === 'gap') return <GapViz />;
      if (mode === 'responsive') return <ResponsiveViz />;
      if (mode === 'contrast') return <ContrastViz />;
      return null;
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DEEP}}>spacing 눈금자 시각화</h3>
            <span className="text-[10px] text-slate-500">비유: 눈금자 = 4px 베이스</span>
          </div>
          <SpacingViz mode={state.mode} />
          <div className="mt-3">
            <CardList cards={state.cards} />
          </div>
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.2)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg text-white font-bold text-sm" style={{background:BRAND}}>Part II. 디자인 시스템</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>II-1-1. spacing scale — 4px 베이스 일관성</h1>
                <p className="text-sm" style={{color:BRAND}}>4px 배수 스케일이 만드는 시각적 리듬</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#99f6e4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#38B2ACaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                spacing 은 4px 베이스 눈금자다. padding·margin·gap 이 같은 스케일을 공유하고, 자식 사이는 gap 을 기본으로 쓴다. 반응형도 스케일 안에서 확장하며, 임의값은 최후의 예외로만 둔다. 다음에는 이 스케일 위에 얹히는 color 토큰 시스템을 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['spacing스케일', '4px베이스', 'padding', 'margin', 'gap vs space-x', '반응형간격', '임의값주의'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
