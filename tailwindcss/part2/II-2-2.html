<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind 학습 — II-2-2. border + rounded — radius / divide</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌬️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    Tailwind II-2-2 — border + rounded — radius / divide (비유: 액자와 모서리 다듬기)
    테두리(굵기·색·스타일), 모서리(radius·개별 모서리), 구분선(divide), ring/outline 차이를 6단계로 시각화
    1) border 기본 → 2) rounded radius → 3) 개별 모서리 → 4) divide 구분선 →
    5) ring vs border vs outline → 6) 실무 조합/함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#38B2AC';
    const DEEP = '#234E52';

    const STEPS = [
      {
        title: 'Step 1. border — 굵기·색·스타일의 3요소',
        desc: '테두리는 border 유틸 하나로 켜지지 않는다. Tailwind 에서 border 는 "굵기(width)"만 담당하고, 색은 border-color, 선 종류는 border-style 로 따로 지정한다. 기본 border 는 1px 이고, border-2 / border-4 로 굵어진다. 색을 빼먹으면 브라우저 기본색(대개 회색)이 나와 의도와 다른 화면이 되니, 테두리를 그릴 때는 border + border-{color} 를 한 쌍으로 외워두는 편이 안전하다. border-t / border-b 처럼 특정 변만 켤 수도 있어서, 표의 행 구분이나 하단 라인에 자주 쓴다.',
        cards: [
          { label:'border', desc:'너비 1px — 테두리를 켜는 스위치', tone:'ok' },
          { label:'border-2 / border-4', desc:'2px·4px 로 굵기 조절', tone:'ok' },
          { label:'border-teal-500', desc:'색은 반드시 별도로 지정', tone:'warn' },
          { label:'border-t / border-b', desc:'특정 변만 — 표·하단 라인', tone:'good' },
        ],
        demo: 'border',
        alert: { tone:'info', text:'border 는 "너비"만 켠다. 색을 함께 주지 않으면 브라우저 기본 회색이 나온다 — border 와 border-{color} 는 한 쌍이다.' },
        code: {
          lang:'html', filename:'border-basics.html',
          lines:[
            '<!-- border 는 너비만 켠다. 색은 별도 -->',
            '<div class="border border-slate-300 p-4">',
            '  기본 1px 테두리 (색 지정 필수)',
            '</div>',
            '',
            '<!-- 굵기: border-2 / border-4 / border-8 -->',
            '<div class="border-2 border-teal-500 p-4">2px 강조</div>',
            '',
            '<!-- 스타일: solid(기본) / dashed / dotted -->',
            '<div class="border-2 border-dashed border-teal-500 p-4">',
            '  점선 안내 박스',
            '</div>',
            '',
            '<!-- 특정 변만: border-t / border-b -->',
            '<div class="border-b border-slate-200 py-2">행 하단 라인</div>',
          ],
          highlight:[1,2,3,4,7,10,11,12,15],
        },
      },
      {
        title: 'Step 2. rounded — radius 로 모서리를 깎는다',
        desc: 'rounded 는 모서리를 둥글게 깎는 유틸이다. 값이 커질수록 반경이 커진다: rounded-sm(2px) → rounded(4px) → rounded-md(6px) → rounded-lg(8px) → rounded-xl(12px) → rounded-2xl(16px) → rounded-full(완전한 원/알약). 실무에서 카드·입력창은 rounded-lg 정도가 무난하고, 버튼은 rounded-md, 아바타·아이콘 배경은 rounded-full 을 쓴다. radius 값을 페이지마다 제각각 쓰면 디자인이 흔들리므로, 컴포넌트별로 한두 개 값만 정해 일관되게 쓰는 것이 핵심이다.',
        cards: [
          { label:'rounded-sm / md', desc:'2px·6px — 잔잔한 둥글기', tone:'ok' },
          { label:'rounded-lg / xl', desc:'8px·12px — 카드 표준', tone:'ok' },
          { label:'rounded-2xl', desc:'16px — 부드러운 큰 카드', tone:'good' },
          { label:'rounded-full', desc:'알약 버튼·원형 아바타', tone:'good' },
        ],
        demo: 'radius',
        alert: { tone:'info', text:'radius 값은 컴포넌트별로 1~2개만 고정하라. 카드마다 sm/lg/xl 이 섞이면 디자인 시스템이 무너진다.' },
        code: {
          lang:'html', filename:'radius-scale.html',
          lines:[
            '<!-- radius 스케일: 값이 클수록 더 둥글다 -->',
            '<div class="rounded-sm  border p-3">rounded-sm  2px</div>',
            '<div class="rounded-md  border p-3">rounded-md  6px</div>',
            '<div class="rounded-lg  border p-3">rounded-lg  8px</div>',
            '<div class="rounded-xl  border p-3">rounded-xl  12px</div>',
            '<div class="rounded-2xl border p-3">rounded-2xl 16px</div>',
            '',
            '<!-- 원형 아바타: 정사각형 + rounded-full -->',
            '<img class="w-12 h-12 rounded-full" src="/avatar.png" />',
            '',
            '<!-- 알약 버튼 -->',
            '<button class="rounded-full px-5 py-2 bg-teal-500 text-white">',
            '  Pill Button',
            '</button>',
          ],
          highlight:[1,2,3,4,5,6,9,12,13,14],
        },
      },
      {
        title: 'Step 3. 개별 모서리 — rounded-t / rounded-tl',
        desc: '모서리를 한꺼번에가 아니라 부분만 둥글게 하고 싶을 때가 많다. 변 단위로는 rounded-t(위 두 모서리), rounded-b(아래 두 모서리), rounded-l / rounded-r 이 있고, 꼭짓점 단위로는 rounded-tl(왼쪽 위), rounded-tr, rounded-bl, rounded-br 이 있다. 대표적으로 탭 헤더는 위만 둥글게 rounded-t-lg, 붙어 있는 버튼 그룹은 첫 버튼 왼쪽만·마지막 버튼 오른쪽만 둥글게 처리한다. 이미지 위에 캡션이 붙는 카드도 이미지에는 rounded-t-lg, 하단 텍스트 영역에는 rounded-b-lg 를 준다.',
        cards: [
          { label:'rounded-t-lg', desc:'위 두 모서리 — 탭·이미지 상단', tone:'ok' },
          { label:'rounded-b-lg', desc:'아래 두 모서리 — 카드 하단', tone:'ok' },
          { label:'rounded-l / r', desc:'붙은 버튼 그룹 양끝', tone:'good' },
          { label:'rounded-tl / br', desc:'꼭짓점 하나만 정밀 제어', tone:'good' },
        ],
        demo: 'corners',
        alert: { tone:'info', text:'탭 헤더·이미지 카드·버튼 그룹은 "부분 radius"가 정석이다. 전체 rounded 를 주면 붙은 요소 사이가 어색해진다.' },
        code: {
          lang:'html', filename:'per-corner.html',
          lines:[
            '<!-- 탭 헤더: 위만 둥글게 -->',
            '<div class="rounded-t-lg bg-teal-500 text-white px-4 py-2">',
            '  활성 탭',
            '</div>',
            '',
            '<!-- 이미지 카드: 이미지 상단 + 본문 하단 -->',
            '<article class="border rounded-lg overflow-hidden">',
            '  <img class="rounded-t-lg w-full" src="/cover.png" />',
            '  <div class="rounded-b-lg p-4">캡션 영역</div>',
            '</article>',
            '',
            '<!-- 붙은 버튼 그룹: 양끝만 둥글게 -->',
            '<div class="inline-flex">',
            '  <button class="rounded-l-md border px-3 py-1">이전</button>',
            '  <button class="rounded-r-md border px-3 py-1">다음</button>',
            '</div>',
          ],
          highlight:[1,2,3,4,7,8,9,10,14,15,16,17],
        },
      },
      {
        title: 'Step 4. divide — 자식 "사이"에만 구분선',
        desc: 'divide-y 는 자식 요소들 사이에만 가로 구분선을 자동으로 넣어준다. 리스트나 메뉴에서 각 항목마다 border-b 를 일일이 붙이고 마지막 항목의 선을 지우는 번거로움을 없애준다 — divide 는 첫 항목 위나 마지막 항목 아래에는 선을 넣지 않는다. divide-x 는 가로로 나란한 자식들 사이에 세로선을 넣는다. 색은 divide-slate-200 처럼 지정한다. 주의할 점: divide 는 자식들이 서로 붙어 있어야(gap 없이) 선이 자연스럽다. gap 을 주면 선과 항목 사이가 벌어져 어색해지므로, divide 를 쓸 땐 gap 대신 각 항목의 py 로 여백을 준다.',
        cards: [
          { label:'divide-y', desc:'자식 사이 가로선 — 리스트', tone:'ok' },
          { label:'divide-x', desc:'가로 배치 자식 사이 세로선', tone:'ok' },
          { label:'divide-slate-200', desc:'구분선 색 지정', tone:'warn' },
          { label:'gap 금지', desc:'divide 와 gap 은 충돌 — py 로 여백', tone:'danger' },
        ],
        demo: 'divide',
        alert: { tone:'warn', text:'divide 와 gap 을 함께 쓰지 마라. 간격이 벌어지면 구분선이 항목에서 떨어져 보인다 — 여백은 각 항목의 padding 으로 준다.' },
        code: {
          lang:'html', filename:'divide-list.html',
          lines:[
            '<!-- divide-y: 항목 "사이"에만 선 (양 끝 X) -->',
            '<ul class="divide-y divide-slate-200 border rounded-lg">',
            '  <li class="px-4 py-3">첫 번째 항목</li>',
            '  <li class="px-4 py-3">두 번째 항목</li>',
            '  <li class="px-4 py-3">세 번째 항목</li>',
            '</ul>',
            '',
            '<!-- divide-x: 가로 통계 카드 사이 세로선 -->',
            '<div class="flex divide-x divide-slate-200 border rounded-lg">',
            '  <div class="px-6 py-3">방문 1.2k</div>',
            '  <div class="px-6 py-3">가입 340</div>',
            '  <div class="px-6 py-3">전환 5.1%</div>',
            '</div>',
            '',
            '<!-- 함정: gap 을 주면 선이 항목에서 떨어진다 -->',
            '<!-- gap 대신 각 항목의 py 로 여백을 준다 -->',
          ],
          highlight:[1,2,3,4,5,6,9,10,11,12,13,16],
        },
      },
      {
        title: 'Step 5. ring vs border vs outline',
        desc: 'border 는 요소의 박스 크기에 포함되는 실제 테두리라 border-2 를 켜면 레이아웃이 2px 밀린다. ring 은 box-shadow 로 그려지는 "겹쳐지는 링"이라 레이아웃을 밀지 않고, 그래서 focus 강조에 가장 많이 쓴다: focus:ring-2 focus:ring-teal-400. outline 은 접근성용 포커스 표시로, outline-none 으로 브라우저 기본선을 끄되 반드시 ring 같은 대체 표시를 줘야 키보드 사용자가 초점을 볼 수 있다. 요약하면 정적 테두리는 border, 포커스/상태 강조는 ring, 기본 아웃라인 제거+대체는 outline-none + ring 조합이 실무 공식이다.',
        cards: [
          { label:'border', desc:'박스 크기 포함 — 레이아웃 밀림', tone:'warn' },
          { label:'ring-2', desc:'shadow 링 — 레이아웃 안 밀림', tone:'good' },
          { label:'focus:ring', desc:'포커스 강조의 표준', tone:'good' },
          { label:'outline-none + ring', desc:'접근성: 대체 표시 필수', tone:'danger' },
        ],
        demo: 'ring',
        alert: { tone:'danger', text:'outline-none 만 주고 대체 표시를 안 하면 키보드 사용자가 초점을 못 본다 — 반드시 focus:ring 을 함께 준다.' },
        code: {
          lang:'html', filename:'ring-vs-border.html',
          lines:[
            '<!-- border: 실제 테두리 → 레이아웃 2px 밀림 -->',
            '<button class="border-2 border-teal-500 px-4 py-2">border</button>',
            '',
            '<!-- ring: box-shadow 링 → 레이아웃 안 밀림 -->',
            '<button class="ring-2 ring-teal-400 px-4 py-2">ring</button>',
            '',
            '<!-- 포커스 강조의 표준 조합 -->',
            '<input class="border rounded-md px-3 py-2',
            '              outline-none',
            '              focus:ring-2 focus:ring-teal-400',
            '              focus:border-teal-400" />',
            '',
            '<!-- ring-offset: 링과 요소 사이 간격 -->',
            '<button class="ring-2 ring-teal-400 ring-offset-2 px-4 py-2">',
            '  offset ring',
            '</button>',
          ],
          highlight:[1,2,4,5,8,9,10,11,12],
        },
      },
      {
        title: 'Step 6. 실무 조합 — 카드·입력·함정 정리',
        desc: '실전에서는 지금까지의 유틸을 조합한다. 카드는 border + rounded-lg + 은은한 그림자, 입력창은 border + rounded-md + focus:ring, 리스트는 divide-y 가 기본 골격이다. 흔한 함정 네 가지를 기억하자. 첫째, rounded-full 을 정사각형이 아닌 요소에 주면 타원이 되니 아바타는 w·h 를 같게 준다. 둘째, box-sizing 기본이 border-box 라 padding·border 가 width 안에 포함된다는 점을 계산에 넣는다. 셋째, divide 와 gap 을 섞지 않는다. 넷째, 테두리를 너무 많이 쓰면 화면이 답답해지니, 구분이 필요한 곳은 테두리 대신 배경색 차이나 그림자로 푸는 것도 방법이다.',
        cards: [
          { label:'카드', desc:'border + rounded-lg + shadow-sm', tone:'good' },
          { label:'입력', desc:'border + rounded-md + focus:ring', tone:'good' },
          { label:'rounded-full 함정', desc:'정사각형 아니면 타원 됨', tone:'danger' },
          { label:'과한 테두리', desc:'배경/그림자로 대체 고려', tone:'warn' },
        ],
        demo: 'combo',
        wins:[
          '카드 = border + rounded-lg + shadow-sm — 표준 골격',
          '입력 = border + rounded-md + focus:ring-2 — 포커스 명확',
          '리스트 = divide-y divide-slate-200 — 항목 사이만 선',
          'rounded-full 은 w·h 가 같은 정사각형에만',
          '테두리 남발 대신 배경색·그림자로 층위를 준다',
        ],
        alert: { tone:'good', text:'테두리·모서리·구분선은 "형태를 다듬는" 도구다. 최소한으로 쓰되 일관되게 — 값은 컴포넌트별로 고정하라.' },
        code: {
          lang:'html', filename:'real-world.html',
          lines:[
            '<!-- 카드: 테두리 + 모서리 + 은은한 그림자 -->',
            '<article class="border border-slate-200 rounded-lg shadow-sm p-5">',
            '  <h3 class="font-bold">프로필 카드</h3>',
            '  <p class="text-slate-500 mt-1">border + rounded + shadow</p>',
            '</article>',
            '',
            '<!-- 입력: 포커스에서 ring 강조 -->',
            '<input placeholder="이메일"',
            '  class="w-full border border-slate-300 rounded-md px-3 py-2',
            '         outline-none focus:ring-2 focus:ring-teal-400',
            '         focus:border-teal-400" />',
            '',
            '<!-- 아바타: 정사각형(w=h) + rounded-full -->',
            '<img class="w-12 h-12 rounded-full object-cover" src="/me.png" />',
            '',
            '<!-- 리스트: 항목 사이만 divide -->',
            '<ul class="divide-y divide-slate-200 border rounded-lg">',
            '  <li class="px-4 py-3 hover:border-teal-400">항목</li>',
            '</ul>',
          ],
          highlight:[1,2,3,4,5,8,9,10,11,14,17,18,19],
        },
      },
    ];

    function CardList({ cards }) {
      const TONE = {
        ok:    { bg:'#f0fdfa', tx:DEEP, bd:'#99f6e4' },
        good:  { bg:'#dbf3e6', tx:'#166534', bd:'#86efac' },
        warn:  { bg:'#fef3c7', tx:'#92400e', bd:'#fde68a' },
        danger:{ bg:'#fee2e2', tx:'#991b1b', bd:'#fecaca' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🌬️</span><span>핵심 유틸 정리</span>
          </div>
          <div className="p-3 space-y-2">
            {cards.map((c, i) => {
              const s = TONE[c.tone] || TONE.ok;
              return (
                <div key={i} className="flex items-start gap-2 text-xs rounded p-2" style={{background:s.bg, border:`1px solid ${s.bd}`}}>
                  <span className="font-mono font-bold w-36 shrink-0" style={{color:s.tx}}>{c.label}</span>
                  <span className="flex-1" style={{color:s.tx}}>{c.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function DemoVisual({ demo }) {
      if (demo === 'border') {
        return (
          <div className="space-y-2">
            <div className="border border-slate-300 rounded p-2 text-xs text-slate-600">border · 1px 회색</div>
            <div className="rounded p-2 text-xs" style={{border:`2px solid ${BRAND}`, color:DEEP}}>border-2 · teal 강조</div>
            <div className="rounded p-2 text-xs" style={{border:`2px dashed ${BRAND}`, color:DEEP}}>border-dashed · 점선</div>
            <div className="py-2 text-xs text-slate-600" style={{borderBottom:`1px solid #cbd5e1`}}>border-b · 하단만</div>
          </div>
        );
      }
      if (demo === 'radius') {
        const items = [['sm','4px'],['md','8px'],['lg','12px'],['xl','16px'],['2xl','20px'],['full','999px']];
        return (
          <div className="grid grid-cols-3 gap-2">
            {items.map(([name, r]) => (
              <div key={name} className="flex flex-col items-center gap-1">
                <div className="w-14 h-14 flex items-center justify-center text-white text-[10px]" style={{background:BRAND, borderRadius:r}}>{name}</div>
                <span className="text-[10px] text-slate-500">{r}</span>
              </div>
            ))}
          </div>
        );
      }
      if (demo === 'corners') {
        return (
          <div className="space-y-3">
            <div>
              <div className="inline-block text-white text-xs px-4 py-2" style={{background:BRAND, borderRadius:'10px 10px 0 0'}}>rounded-t · 탭</div>
            </div>
            <div className="w-40 bg-white" style={{border:`1px solid ${BRAND}`, borderRadius:'12px', overflow:'hidden'}}>
              <div className="h-10 text-white text-[10px] flex items-center justify-center" style={{background:BRAND, borderRadius:'11px 11px 0 0'}}>이미지 (rounded-t)</div>
              <div className="p-2 text-[10px]" style={{color:DEEP}}>캡션 (rounded-b)</div>
            </div>
            <div className="inline-flex text-xs">
              <button className="px-3 py-1" style={{border:`1px solid ${BRAND}`, borderRadius:'8px 0 0 8px', color:DEEP}}>이전</button>
              <button className="px-3 py-1" style={{border:`1px solid ${BRAND}`, borderLeft:'none', borderRadius:'0 8px 8px 0', color:DEEP}}>다음</button>
            </div>
          </div>
        );
      }
      if (demo === 'divide') {
        return (
          <div className="space-y-3">
            <ul className="bg-white rounded-lg divide-y" style={{border:'1px solid #e2e8f0'}}>
              {['첫 번째 항목','두 번째 항목','세 번째 항목'].map((t) => (
                <li key={t} className="px-3 py-2 text-xs" style={{color:DEEP}}>{t}</li>
              ))}
            </ul>
            <div className="flex bg-white rounded-lg divide-x text-center" style={{border:'1px solid #e2e8f0'}}>
              {[['방문','1.2k'],['가입','340'],['전환','5.1%']].map(([k,v]) => (
                <div key={k} className="flex-1 px-3 py-2">
                  <div className="text-sm font-bold" style={{color:BRAND}}>{v}</div>
                  <div className="text-[10px] text-slate-500">{k}</div>
                </div>
              ))}
            </div>
          </div>
        );
      }
      if (demo === 'ring') {
        return (
          <div className="space-y-3">
            <div className="flex gap-3 items-center">
              <span className="text-xs px-3 py-1.5 rounded" style={{border:`2px solid ${BRAND}`, color:DEEP}}>border-2</span>
              <span className="text-xs px-3 py-1.5 rounded bg-white" style={{boxShadow:`0 0 0 2px ${BRAND}`, color:DEEP}}>ring-2</span>
              <span className="text-xs px-3 py-1.5 rounded bg-white" style={{boxShadow:`0 0 0 2px #fff, 0 0 0 4px ${BRAND}`, color:DEEP}}>ring+offset</span>
            </div>
            <div>
              <div className="text-[10px] text-slate-500 mb-1">focus 강조 입력 (항상 켠 모습)</div>
              <input readOnly value="focus:ring-2" className="w-full rounded-md px-3 py-2 text-xs bg-white" style={{border:`1px solid ${BRAND}`, boxShadow:`0 0 0 2px rgba(56,178,172,0.4)`, color:DEEP}} />
            </div>
          </div>
        );
      }
      // combo
      return (
        <div className="space-y-3">
          <article className="bg-white rounded-lg p-3" style={{border:'1px solid #e2e8f0', boxShadow:'0 1px 2px rgba(0,0,0,0.06)'}}>
            <div className="font-bold text-xs" style={{color:DEEP}}>프로필 카드</div>
            <div className="text-[10px] text-slate-500 mt-0.5">border + rounded-lg + shadow-sm</div>
          </article>
          <input readOnly value="이메일 입력" className="w-full rounded-md px-3 py-2 text-xs bg-white" style={{border:`1px solid ${BRAND}`, boxShadow:`0 0 0 2px rgba(56,178,172,0.35)`, color:DEEP}} />
          <div className="flex items-center gap-2">
            <div className="w-10 h-10 rounded-full flex items-center justify-center text-white text-xs" style={{background:BRAND}}>ME</div>
            <span className="text-[10px] text-slate-500">정사각형 + rounded-full 아바타</span>
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f0fdfa'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🌬️</span>
            <span className="text-lg font-bold" style={{color:DEEP}}>형태를 다듬는 실무 공식</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f0fdfa', bd:'#99f6e4', tx:DEEP, icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DEEP}}>테두리 · 모서리 · 구분선 미리보기</h3>
            <span className="text-[10px] text-slate-500">액자 = border</span>
          </div>
          <div className="rounded-lg p-3 mb-1" style={{background:'#f8fafc', border:'1px dashed #cbd5e1'}}>
            <DemoVisual demo={state.demo} />
          </div>
          <CardList cards={state.cards} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.2)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TW</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mb-1" style={{background:'#ccfbf1', color:DEEP}}>Part II. 디자인 시스템 · II-2-2</span>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>border + rounded — radius / divide</h1>
                <p className="text-sm" style={{color:BRAND}}>테두리와 모서리, 구분선으로 형태 다듬기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#99f6e4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#38B2ACaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                border 는 너비만 켜고 색은 별도, rounded 는 값이 클수록 둥글며 개별 모서리도 제어할 수 있다. divide 는 자식 "사이"에만 선을 긋고 gap 과 섞지 않는다. 포커스 강조는 레이아웃을 밀지 않는 ring, 정적 테두리는 border 로 나눠 쓴다. 값은 컴포넌트별로 고정해 일관성을 지키는 것이 마지막 열쇠다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['border', 'rounded', 'radius', 'divide', 'ring', 'outline', 'focus강조', '카드형태'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
