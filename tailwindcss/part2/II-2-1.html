    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    Tailwind II-2-1 — shadow + ring — depth 표현 (비유: 종이와 조명)
    그림자로 요소를 띄우고(elevation), 링으로 포커스를 알린다
    1) shadow scale → 2) elevation(카드/모달/inner) → 3) ring 기본 →
    4) focus ring(접근성) → 5) 다크모드 그림자 & 실무 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#38B2AC';
    const DEEP = '#234E52';

    const STEPS = [
      {
        title: 'Step 1. box-shadow scale — shadow-sm ~ shadow-2xl',
        desc: 'Tailwind 는 그림자를 6단계 토큰(shadow-sm · shadow · shadow-md · shadow-lg · shadow-xl · shadow-2xl)과 shadow-none 으로 제공한다. 숫자가 커질수록 blur 반경과 offset 이 커져 요소가 화면에서 더 높이 떠 보인다. 핵심은 "임의의 px 를 직접 쓰지 않고 정해진 단계만 고른다" 는 점이다. 덕분에 팀 전체가 같은 깊이 언어를 공유하고, 카드 하나만 유독 무겁거나 가벼워 보이는 사고를 막는다.',
        demo: { type:'scale' },
        cards: [
          { label:'shadow-sm', desc:'가장 얕음 — 입력창·구분선 강조용', tone:'ok' },
          { label:'shadow-md', desc:'기본 카드 — 목록 아이템의 표준 깊이', tone:'ok' },
          { label:'shadow-lg / xl', desc:'드롭다운·팝오버 — 떠 있는 레이어', tone:'good' },
          { label:'shadow-2xl', desc:'모달 — 화면에서 가장 높은 층', tone:'good' },
        ],
        alert: { tone:'info', text:'그림자는 "높이(elevation)" 를 표현하는 토큰이다. 단계를 섞어 쓰면 층위가 생기고, 다 같은 단계면 평평해 보인다.' },
        code: {
          lang:'html', filename:'shadow-scale.html',
          lines:[
            '<!-- 그림자 6단계 + none — 값이 아니라 토큰을 고른다 -->',
            '<div class="shadow-sm  rounded-lg p-4 bg-white">shadow-sm</div>',
            '<div class="shadow     rounded-lg p-4 bg-white">shadow</div>',
            '<div class="shadow-md  rounded-lg p-4 bg-white">shadow-md</div>',
            '<div class="shadow-lg  rounded-lg p-4 bg-white">shadow-lg</div>',
            '<div class="shadow-xl  rounded-lg p-4 bg-white">shadow-xl</div>',
            '<div class="shadow-2xl rounded-lg p-4 bg-white">shadow-2xl</div>',
            '',
            '<!-- 그림자 제거 — 이미 그림자가 있는 요소를 평평하게 -->',
            '<div class="shadow-none rounded-lg p-4 border">shadow-none</div>',
            '',
            '<!-- 규칙: 숫자가 클수록 더 높이 떠 보인다 -->',
            '<!-- 같은 화면에서 최대 2~3단계만 섞어 층위를 만든다 -->',
          ],
          highlight:[1,2,3,4,5,6,7,9,10],
        },
      },
      {
        title: 'Step 2. elevation — 카드 · 모달 · inner shadow',
        desc: '그림자의 실무 용도는 "층위(z 축) 표현" 이다. 바닥에 붙은 배경, 그 위의 카드(shadow-md), 다시 그 위의 모달(shadow-2xl) 처럼 위로 갈수록 그림자를 키워 사용자가 무엇이 앞에 있는지 직관적으로 알게 한다. 반대로 shadow-inner 는 안쪽으로 파인 느낌을 줘서 입력창이나 눌린 토글처럼 "들어간" 요소를 표현한다. elevation 을 일관되게 쓰면 UI 의 공간감이 자연스러워진다.',
        demo: { type:'elevation' },
        cards: [
          { label:'배경', desc:'그림자 없음 — 바닥 레이어', tone:'ok' },
          { label:'카드 shadow-md', desc:'바닥에서 한 단계 떠오름', tone:'ok' },
          { label:'모달 shadow-2xl', desc:'가장 앞 — 뒤 배경은 어둡게', tone:'good' },
          { label:'shadow-inner', desc:'안으로 파임 — 입력창·눌린 상태', tone:'warn' },
        ],
        alert: { tone:'good', text:'모달에는 반드시 어두운 backdrop 을 함께 둔다. 그림자만으로는 "뒤가 잠겼다" 는 신호가 약하다.' },
        code: {
          lang:'html', filename:'elevation.html',
          lines:[
            '<!-- 3층 구조 — 위로 갈수록 그림자를 키운다 -->',
            '<section class="bg-slate-100 p-6">        <!-- 바닥 -->',
            '  <article class="shadow-md rounded-xl p-4 bg-white">',
            '    목록 카드 — shadow-md 로 살짝 떠 있음',
            '  </article>',
            '</section>',
            '',
            '<!-- 모달: 어두운 backdrop + 가장 강한 그림자 -->',
            '<div class="fixed inset-0 bg-black/50">          <!-- backdrop -->',
            '  <div class="shadow-2xl rounded-2xl p-6 bg-white">',
            '    삭제하시겠습니까?',
            '  </div>',
            '</div>',
            '',
            '<!-- inner shadow: 안으로 파인 입력창 -->',
            '<input class="shadow-inner rounded-lg px-3 py-2 bg-slate-50" />',
          ],
          highlight:[1,2,3,4,5,8,9,10,11,12,15,16],
        },
      },
      {
        title: 'Step 3. ring — 테두리를 대신하는 아웃라인',
        desc: 'ring 은 box-shadow 로 그려지는 "링(테두리)" 이다. ring-2 는 2px 두께, ring-teal-500 은 색, ring-offset-2 는 요소와 링 사이에 간격(보통 배경색)을 준다. border 와 달리 ring 은 레이아웃 크기를 밀지 않는다. border 는 요소의 box 크기를 늘려 옆 요소를 밀지만, ring 은 그림자라서 자리를 차지하지 않는다. 그래서 hover·selected·focus 처럼 "잠깐 강조" 에는 ring 이 border 보다 깔끔하다.',
        demo: { type:'ring' },
        cards: [
          { label:'ring-2', desc:'2px 링 — 기본 강조 두께', tone:'ok' },
          { label:'ring-teal-500', desc:'ring 색 지정 — 상태별 색 분리', tone:'ok' },
          { label:'ring-offset-2', desc:'요소와 링 사이 간격 — 또렷하게', tone:'good' },
          { label:'ring vs border', desc:'ring 은 레이아웃을 밀지 않는다', tone:'warn' },
        ],
        alert: { tone:'info', text:'ring-offset 은 offset 영역을 배경색으로 칠한다. 카드 배경과 페이지 배경이 다르면 ring-offset-{color} 로 맞춰야 자연스럽다.' },
        code: {
          lang:'html', filename:'ring.html',
          lines:[
            '<!-- ring 기본: 두께 + 색 -->',
            '<button class="ring-2 ring-teal-500 rounded-lg px-4 py-2">',
            '  선택됨',
            '</button>',
            '',
            '<!-- ring-offset: 링과 요소 사이 간격(배경색으로 칠함) -->',
            '<button class="ring-2 ring-teal-500 ring-offset-2 rounded-lg px-4 py-2">',
            '  또렷한 강조',
            '</button>',
            '',
            '<!-- border 는 크기를 밀지만 ring 은 안 민다 -->',
            '<div class="border-4 border-red-400">  <!-- 8px 만큼 커짐 -->',
            '<div class="ring-4  ring-red-400">   <!-- 크기 그대로 -->',
            '',
            '<!-- 그래서 hover/selected 강조엔 ring 이 깔끔 -->',
            '<div class="hover:ring-2 hover:ring-teal-400 rounded-lg">card</div>',
          ],
          highlight:[1,2,3,4,6,7,8,9,11,12,13],
        },
      },
      {
        title: 'Step 4. focus ring — 접근성의 핵심',
        desc: '키보드 사용자는 지금 어디에 포커스가 있는지 눈으로 봐야 한다. 그 신호가 바로 focus ring 이다. focus:ring-2 focus:ring-teal-400 처럼 focus 변형에 링을 붙이면, Tab 으로 이동할 때 또렷한 테두리가 나타난다. 흔한 실수는 디자인이 지저분하다며 outline-none 으로 기본 포커스 표시를 지우고 대체 링을 안 주는 것 — 이는 명백한 접근성 위반이다. 반드시 focus-visible 링으로 대체해야 한다.',
        demo: { type:'focus' },
        cards: [
          { label:'focus:ring-2', desc:'포커스 시 링 표시 — 키보드 신호', tone:'ok' },
          { label:'focus-visible', desc:'키보드 포커스에만 링 — 마우스엔 X', tone:'good' },
          { label:'outline-none 단독', desc:'대체 없이 제거 → 접근성 위반', tone:'danger' },
          { label:'아래 입력창', desc:'Tab 또는 클릭해서 링을 확인', tone:'warn' },
        ],
        alert: { tone:'danger', text:'outline-none 을 쓸 거면 반드시 focus:ring 으로 대체하라. 포커스 표시를 없애면 키보드 사용자는 길을 잃는다.' },
        code: {
          lang:'html', filename:'focus-ring.html',
          lines:[
            '<!-- 좋은 예: 기본 outline 대신 또렷한 focus ring -->',
            '<input class="outline-none',
            '              focus:ring-2 focus:ring-teal-400 focus:ring-offset-1',
            '              rounded-lg px-3 py-2 border" />',
            '',
            '<!-- focus-visible: 마우스 클릭엔 링 없이, 키보드에만 -->',
            '<button class="focus-visible:ring-2 focus-visible:ring-teal-500',
            '               rounded-lg px-4 py-2">',
            '  저장',
            '</button>',
            '',
            '<!-- 나쁜 예: 대체 없이 포커스 표시 제거 (접근성 위반) -->',
            '<input class="outline-none" />   <!-- 절대 이렇게만 쓰지 말 것 -->',
          ],
          highlight:[1,2,3,4,6,7,8,9,12,13],
        },
      },
      {
        title: 'Step 5. 다크모드 그림자 & 실무 함정',
        desc: '그림자는 "밝은 배경 위 종이" 를 가정한 검은 반투명이라, 어두운 배경에서는 거의 안 보인다. 그래서 다크모드에서는 그림자를 약하게 쓰거나(dark:shadow-none), 대신 밝은 테두리(dark:ring-1)로 층위를 표현한다. 실무 함정도 정리한다. 과한 그림자는 UI 를 무겁고 촌스럽게 만들고, focus ring 제거는 접근성을 깨며, ring-offset 배경색을 안 맞추면 링 주변이 어색해진다. 그림자 애니메이션 남발은 리페인트로 성능을 갉아먹는다.',
        demo: { type:'dark' },
        cards: [
          { label:'dark:shadow-none', desc:'어두운 배경엔 그림자 대신 테두리', tone:'ok' },
          { label:'dark:ring-1', desc:'밝은 링으로 층위 표현', tone:'good' },
          { label:'과한 그림자', desc:'shadow-2xl 남발 → 무겁고 촌스러움', tone:'danger' },
          { label:'성능', desc:'shadow 트랜지션 남발 → 리페인트 비용', tone:'warn' },
        ],
        wins:[
          '그림자는 값이 아니라 단계 토큰으로 — 팀 전체가 같은 깊이 언어',
          'elevation 을 층위로 — 배경 < 카드 < 모달 순으로 그림자를 키운다',
          'ring 은 레이아웃을 밀지 않아 hover/selected 강조에 유리',
          'focus ring 은 접근성 필수 — outline-none 은 반드시 대체한다',
          '다크모드는 그림자를 약하게, 밝은 ring 으로 층위를 대신한다',
        ],
        alert: { tone:'good', text:'shadow 는 "높이", ring 은 "상태(선택·포커스)" 라는 역할 구분을 지키면 UI 언어가 명확해진다.' },
        code: {
          lang:'html', filename:'darkmode-and-traps.html',
          lines:[
            '<!-- 다크모드: 그림자 대신 밝은 링으로 층위 -->',
            '<div class="shadow-lg dark:shadow-none',
            '            dark:ring-1 dark:ring-white/10',
            '            rounded-xl p-4 bg-white dark:bg-slate-800">',
            '  다크에서는 그림자가 안 보이니 ring 으로 대체',
            '</div>',
            '',
            '<!-- 함정 1: 과한 그림자 — 모든 카드가 shadow-2xl -->',
            '<!-- → 층위가 사라지고 무겁다. 카드는 md, 모달만 2xl -->',
            '',
            '<!-- 함정 2: focus 제거 — outline-none 만 -->',
            '<!-- → focus:ring 으로 반드시 대체 -->',
            '',
            '<!-- 함정 3: 성능 — hover 마다 shadow 트랜지션 남발 -->',
            '<!-- → transition-shadow 는 꼭 필요한 요소에만 -->',
          ],
          highlight:[1,2,3,4,5,8,9,11,12,14,15],
        },
      },
    ];

    function CardList({ cards }) {
      const TONE = {
        ok:    { bg:'#f0fdfa', tx:DEEP, bd:'#99f6e4' },
        good:  { bg:'#dbf3e6', tx:'#166534', bd:'#86efac' },
        warn:  { bg:'#fef3c7', tx:'#92400e', bd:'#fde68a' },
        danger:{ bg:'#fee2e2', tx:'#991b1b', bd:'#fecaca' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🌬️</span><span>핵심 포인트</span>
          </div>
          <div className="p-3 space-y-2">
            {cards.map((c, i) => {
              const s = TONE[c.tone] || TONE.ok;
              return (
                <div key={i} className="flex items-start gap-2 text-xs rounded p-2" style={{background:s.bg, border:`1px solid ${s.bd}`}}>
                  <span className="font-mono font-bold w-32 shrink-0" style={{color:s.tx}}>{c.label}</span>
                  <span className="flex-1" style={{color:s.tx}}>{c.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f0fdfa'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🌬️</span>
            <span className="text-lg font-bold" style={{color:DEEP}}>shadow + ring 5가지 원칙</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f0fdfa', bd:'#99f6e4', tx:DEEP, icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    // 실제 요소에 그림자·링을 적용해 깊이/포커스를 눈으로 보여주는 데모
    function ShadowDemo({ demo }) {
      if (demo.type === 'scale') {
        const items = [
          { cls:'shadow-sm',  label:'sm' },
          { cls:'shadow',     label:'base' },
          { cls:'shadow-md',  label:'md' },
          { cls:'shadow-lg',  label:'lg' },
          { cls:'shadow-xl',  label:'xl' },
          { cls:'shadow-2xl', label:'2xl' },
        ];
        return (
          <div className="rounded-lg p-4 bg-slate-100">
            <div className="grid grid-cols-3 gap-4">
              {items.map((it, i) => (
                <div key={i} className={`${it.cls} bg-white rounded-lg h-16 flex items-center justify-center text-xs font-mono font-bold`} style={{color:DEEP}}>
                  {it.label}
                </div>
              ))}
            </div>
            <div className="mt-3 text-[10px] text-center text-slate-500">왼쪽 위(얕음) → 오른쪽 아래(높이 떠오름)</div>
          </div>
        );
      }
      if (demo.type === 'elevation') {
        return (
          <div className="rounded-lg p-4 bg-slate-100 relative overflow-hidden" style={{minHeight:'190px'}}>
            <div className="shadow-md bg-white rounded-xl p-3 text-xs font-semibold" style={{color:DEEP}}>
              목록 카드 · shadow-md
              <div className="mt-2 shadow-inner bg-slate-50 rounded px-2 py-1 text-[11px] text-slate-500">shadow-inner 입력창</div>
            </div>
            <div className="absolute inset-0 flex items-center justify-center" style={{background:'rgba(0,0,0,0.45)'}}>
              <div className="shadow-2xl bg-white rounded-2xl px-5 py-4 text-xs font-bold text-center" style={{color:DEEP}}>
                모달 · shadow-2xl
                <div className="mt-1 text-[10px] font-normal text-slate-500">뒤 배경은 backdrop 으로 어둡게</div>
              </div>
            </div>
          </div>
        );
      }
      if (demo.type === 'ring') {
        return (
          <div className="rounded-lg p-4 bg-white">
            <div className="grid grid-cols-2 gap-4 place-items-center">
              <div className="ring-2 ring-teal-500 rounded-lg h-14 w-full flex items-center justify-center text-xs font-mono">ring-2</div>
              <div className="ring-2 ring-teal-500 ring-offset-2 rounded-lg h-14 w-full flex items-center justify-center text-xs font-mono">ring-offset-2</div>
              <div className="border-4 border-red-400 rounded-lg h-14 w-full flex items-center justify-center text-[11px] font-mono text-red-600">border-4 (크기 밀림)</div>
              <div className="ring-4 ring-teal-400 rounded-lg h-14 w-full flex items-center justify-center text-[11px] font-mono" style={{color:DEEP}}>ring-4 (크기 유지)</div>
            </div>
          </div>
        );
      }
      if (demo.type === 'focus') {
        return (
          <div className="rounded-lg p-4 bg-white space-y-3">
            <input
              placeholder="여기를 클릭하거나 Tab 으로 포커스"
              className="w-full outline-none focus:ring-2 focus:ring-teal-400 focus:ring-offset-1 rounded-lg px-3 py-2 border border-slate-300 text-xs"
            />
            <button className="w-full outline-none focus:ring-2 focus:ring-teal-500 rounded-lg px-4 py-2 text-xs font-bold text-white" style={{background:BRAND}}>
              Tab 으로 이동하면 링이 보인다
            </button>
            <div className="text-[10px] text-center text-slate-500">키보드 Tab · Shift+Tab 으로 포커스 링을 확인하세요</div>
          </div>
        );
      }
      if (demo.type === 'dark') {
        return (
          <div className="rounded-lg p-4" style={{background:'#0f172a'}}>
            <div className="grid grid-cols-2 gap-4">
              <div className="shadow-2xl bg-white rounded-lg h-16 flex items-center justify-center text-[11px] font-mono text-slate-400">shadow (안 보임)</div>
              <div className="rounded-lg h-16 flex items-center justify-center text-[11px] font-mono text-slate-200" style={{background:'#1e293b', boxShadow:'inset 0 0 0 1px rgba(255,255,255,0.12)'}}>ring-1 (또렷)</div>
            </div>
            <div className="mt-3 text-[10px] text-center text-slate-400">어두운 배경: 그림자 대신 밝은 링으로 층위를 표현</div>
          </div>
        );
      }
      return null;
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DEEP}}>깊이 · 포커스 시각화</h3>
            <span className="text-[10px] text-slate-500">종이와 조명</span>
          </div>
          <ShadowDemo demo={state.demo} />
          <div className="mt-3">
            <CardList cards={state.cards} />
          </div>
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.2)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TW</span>
              <div>
                <div className="inline-flex items-center gap-2 mb-1">
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style={{background:DEEP}}>Part II. 디자인 시스템</span>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{background:'#f0fdfa', color:DEEP, border:`1px solid ${BRAND}`}}>II-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>shadow + ring — depth 표현</h1>
                <p className="text-sm" style={{color:BRAND}}>그림자와 링으로 입체감과 포커스를 표현한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#99f6e4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#38B2ACaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                shadow 는 "높이(elevation)", ring 은 "상태(선택·포커스)" 를 표현하는 서로 다른 도구다. 그림자는 단계 토큰으로 층위를 만들고, ring 은 레이아웃을 밀지 않아 강조에 유리하며, focus ring 은 접근성의 필수 요소다. 다음에는 같은 디자인 시스템 관점에서 색과 대비를 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['box-shadow', 'elevation', 'inner-shadow', 'ring', 'ring-offset', 'focus-ring', '접근성', '다크모드'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
