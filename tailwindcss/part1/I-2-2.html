  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    Tailwind I-2-2 — typography utility (font / text / leading / tracking)
    텍스트 스타일을 유틸리티로 다루는 법을 5단계로 본다
    1) font-size + family → 2) weight + leading + tracking →
    3) align + color + 줄바꿈(truncate/line-clamp) →
    4) 반응형 타이포(md:text-lg) → 5) prose(@tailwindcss/typography)
  -->
  <script type="text/babel">

    const BRAND = '#38B2AC';
    const DEEP = '#234E52';

    const STEPS = [

        preview: { size:'text-3xl', family:'font-sans', weight:'font-normal', tone:'ink' },
        cards: [
          { label:'text-sm', desc:'0.875rem — 캡션·보조 텍스트', tone:'ok' },
          { label:'text-base', desc:'1rem — 본문 기본값', tone:'ok' },
          { label:'text-3xl', desc:'1.875rem — 섹션 제목', tone:'ok' },
          { label:'font-mono', desc:'숫자·코드 정렬용 고정폭 서체', tone:'good' },
        ],
        alert: { tone:'info', text:'text-* 토큰은 line-height 를 함께 품는다. 그래서 크기만 바꿔도 행간이 깨지지 않는다.' },
        code: {
          lang:'html', filename:'font-size.html',
          lines:[
            '<!-- 크기 토큰 — px 대신 text-* -->',
            '<p class="text-sm">작은 캡션 (0.875rem)</p>',
            '<p class="text-base">본문 기본 (1rem)</p>',
            '<h2 class="text-3xl">섹션 제목 (1.875rem)</h2>',
            '<h1 class="text-6xl">히어로 타이틀 (3.75rem)</h1>',
            '',
            '<!-- 서체 토큰 — sans / serif / mono -->',
            '<p class="font-sans">본문은 sans 가 기본</p>',
            '<p class="font-serif">인용·장식은 serif</p>',
            '<code class="font-mono">order_id = 10293</code>',
            '',
            '<!-- 좋은 습관: 숫자 정렬은 mono 로 -->',
            '<span class="font-mono tabular-nums">1,204,900</span>',
          ],
          highlight:[1,2,3,4,5,7,8,9,10],
        },
      },
      {
        title: 'Step 2. font-weight + leading + tracking — 무게·행간·자간',
        desc: '같은 글자라도 굵기(font-weight)·행간(leading)·자간(tracking)이 인상을 바꾼다. 제목은 font-bold 로 힘을 주고, 본문은 font-normal 을 유지한다. 문단이 답답해 보이면 leading-relaxed 로 행간을 넓혀 가독성을 살린다. 대문자 로고나 버튼 라벨은 tracking-wide 로 자간을 벌리면 세련돼 보인다. 초보가 가장 많이 놓치는 것이 바로 이 leading·tracking 이다.',
        preview: { size:'text-2xl', family:'font-sans', weight:'font-bold', leading:'leading-relaxed', tracking:'tracking-wide', tone:'ink' },
        cards: [
          { label:'font-medium', desc:'500 — 살짝 강조', tone:'ok' },
          { label:'font-bold', desc:'700 — 제목·강조', tone:'ok' },
          { label:'leading-relaxed', desc:'행간 1.625 — 긴 문단 가독성', tone:'good' },
          { label:'tracking-wide', desc:'자간 +0.025em — 라벨·로고', tone:'good' },
        ],
        alert: { tone:'warn', text:'본문에 tracking-wide 를 남발하면 오히려 읽기 어렵다. 자간 조정은 짧은 라벨·대문자에만.' },
        code: {
          lang:'html', filename:'weight-leading.html',
          lines:[
            '<!-- 무게 — medium / semibold / bold -->',
            '<h3 class="font-bold">굵은 제목</h3>',
            '<p class="font-medium">살짝 강조된 문장</p>',
            '',
            '<!-- 행간 — 긴 문단은 넉넉하게 -->',
            '<p class="leading-relaxed">',
            '  여러 줄에 걸친 본문은 leading-relaxed 로',
            '  숨통을 틔워 주면 훨씬 읽기 편하다.',
            '</p>',
            '',
            '<!-- 자간 — 라벨·대문자에만 -->',
            '<span class="uppercase tracking-wide font-semibold">',
            '  New Arrival',
            '</span>',
            '',
            '<!-- 함정: 본문 tracking-wide 는 가독성 저하 -->',
          ],
          highlight:[1,2,3,5,6,7,8,9,11,12,13,14],
        },
      },
      {
        title: 'Step 3. align + color + 줄바꿈 — truncate / line-clamp',
        desc: '정렬(text-center)·색상(text-gray-700)은 자주 쓰는 표현 유틸이다. 실무에서 특히 중요한 건 넘치는 텍스트 처리다. 한 줄만 보여주고 말줄임(…)하려면 truncate, 여러 줄 뒤 자르려면 line-clamp-2 를 쓴다. 카드 리스트·상품명·댓글 미리보기에서 레이아웃이 깨지지 않게 막아 준다. 색상도 토큰이라 text-gray-700 처럼 명도 단계를 골라 대비를 맞춘다.',
        preview: { size:'text-lg', family:'font-sans', weight:'font-normal', align:'text-center', color:'text-gray-500', clamp:true, tone:'gray' },
        cards: [
          { label:'text-center', desc:'가운데 정렬 — 히어로·캡션', tone:'ok' },
          { label:'text-gray-700', desc:'명도 토큰으로 대비 조절', tone:'ok' },
          { label:'truncate', desc:'한 줄 말줄임 (…) — 상품명', tone:'good' },
          { label:'line-clamp-2', desc:'2줄 뒤 말줄임 — 미리보기', tone:'good' },
        ],
        alert: { tone:'info', text:'truncate 는 부모에 폭 제약(예: max-w-xs)이 있어야 동작한다. flex 자식이면 min-w-0 도 필요할 수 있다.' },
        code: {
          lang:'html', filename:'align-clamp.html',
          lines:[
            '<!-- 정렬 + 색상 토큰 -->',
            '<p class="text-center text-gray-700">가운데 정렬 본문</p>',
            '',
            '<!-- 한 줄 말줄임 — 폭 제약 필수 -->',
            '<div class="max-w-xs">',
            '  <p class="truncate">',
            '    아주 긴 상품명이 한 줄을 넘으면 말줄임표로 처리된다',
            '  </p>',
            '</div>',
            '',
            '<!-- 여러 줄 뒤 자르기 -->',
            '<p class="line-clamp-2">',
            '  댓글 미리보기처럼 두 줄까지만 보이고',
            '  나머지는 잘라 카드 높이를 일정하게 맞춘다.',
            '</p>',
            '',
            '<!-- flex 안이면 min-w-0 도 함께 -->',
            '<div class="flex min-w-0"><span class="truncate">...</span></div>',
          ],
          highlight:[1,2,5,6,7,8,9,12,13,14,15],
        },
      },
      {
        title: 'Step 4. 반응형 타이포 — md:text-lg 로 화면별 크기',
        desc: '모바일과 데스크톱은 알맞은 글자 크기가 다르다. 반응형 prefix 로 화면 폭에 따라 크기를 바꾼다. text-base md:text-lg lg:text-xl 처럼 breakpoint 마다 토큰을 겹쳐 쓰면 된다. 히어로 제목은 text-3xl md:text-5xl 처럼 격차를 크게 준다. 반응형 크기를 빼먹으면 모바일에서 제목이 화면을 뚫거나, 데스크톱에서 본문이 초라해 보인다.',
        preview: { size:'text-xl md:text-3xl', family:'font-sans', weight:'font-bold', tone:'ink', badge:'md:text-3xl' },
        cards: [
          { label:'text-base', desc:'모바일 기본 크기', tone:'ok' },
          { label:'md:text-lg', desc:'768px 이상에서 확대', tone:'ok' },
          { label:'lg:text-xl', desc:'1024px 이상 추가 확대', tone:'good' },
          { label:'text-3xl md:text-5xl', desc:'히어로 — 격차를 크게', tone:'good' },
        ],
        alert: { tone:'warn', text:'모바일 우선. prefix 없는 값이 기본이고, md:·lg: 는 그 위에 덮어쓴다. 반응형 크기 누락이 흔한 실무 함정.' },
        code: {
          lang:'html', filename:'responsive.html',
          lines:[
            '<!-- 모바일 우선 — 기본은 prefix 없이 -->',
            '<p class="text-base md:text-lg lg:text-xl">',
            '  화면이 커질수록 본문도 조금씩 커진다',
            '</p>',
            '',
            '<!-- 히어로 제목 — 격차를 크게 -->',
            '<h1 class="text-3xl md:text-5xl font-bold">',
            '  화면을 압도하는 타이틀',
            '</h1>',
            '',
            '<!-- 행간도 반응형으로 -->',
            '<p class="leading-snug md:leading-relaxed">...</p>',
            '',
            '<!-- 함정: 반응형 누락 시 -->',
            '<!-- 모바일에서 text-5xl 이 화면을 뚫는다 -->',
          ],
          highlight:[1,2,3,4,6,7,8,9,11,12],
        },
      },
      {

        cards: [
          { label:'prose', desc:'자식 요소 일괄 타이포 스타일', tone:'ok' },
          { label:'prose-lg', desc:'본문 크기 한 단계 확대', tone:'ok' },
          { label:'prose-slate', desc:'색 테마 프리셋', tone:'good' },
          { label:'not-prose', desc:'특정 블록만 prose 예외', tone:'warn' },
        ],
        wins:[
          'text-* 토큰은 크기+행간을 함께 품어 균형이 자동이다',

        ],
        alert: { tone:'good', text:'짧은 UI 텍스트는 유틸, 긴 마크다운 본문은 prose. 임의값([13px]) 남용 대신 토큰을 먼저 쓴다.' },
        code: {
          lang:'html', filename:'prose.html',
          lines:[
            '<!-- tailwind.config: plugins:[require("@tailwindcss/typography")] -->',
            '',
            '<!-- 마크다운 본문 — 부모에 prose 한 번 -->',
            '<article class="prose prose-slate prose-lg max-w-none">',
            '  <h1>제목은 알아서 크고 굵게</h1>',

            '  <ul>',

            '  </ul>',
            '</article>',
            '',
            '<!-- 유틸과 충돌하는 블록만 예외 -->',
            '<div class="prose">',
            '  <div class="not-prose">',
            '    <button class="px-4 py-2 bg-teal-500 text-white">직접 스타일</button>',
            '  </div>',
            '</div>',
          ],

        },
      },
    ];

    function TypePreview({ preview }) {
      if (!preview) return null;
      const TONE = {
        ink:   '#2b2b2b',
        gray:  '#6b7280',
        prose: '#334155',
      };
      const color = TONE[preview.tone] || TONE.ink;
      const cls = [
        preview.size, preview.family, preview.weight,
        preview.leading, preview.tracking, preview.align,
      ].filter(Boolean).join(' ');
      const utilList = [
        preview.size, preview.family, preview.weight,
        preview.leading, preview.tracking, preview.align, preview.color,
      ].filter(Boolean);
      const sample = preview.clamp
        ? '가독성은 크기·행간·자간의 균형에서 나온다. 넘치는 텍스트는 잘라서 레이아웃을 지킨다. 이 문장은 두 줄까지만 보이도록 line-clamp 로 잘려 카드 높이가 일정하게 유지된다.'
        : '가독성은 균형에서 온다 Typography 12345';
      return (
        <div className="rounded-lg overflow-hidden bg-white mb-3" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🌬️</span><span>실시간 타이포 미리보기</span>
            {preview.badge && <span className="ml-auto font-mono text-[10px] opacity-90">{preview.badge}</span>}
          </div>
          <div className="p-4 flex items-center justify-center min-h-[96px]" style={{background:'#f8fafc'}}>
            <p
              className={preview.clamp ? cls + ' line-clamp-2' : cls}
              style={{color, maxWidth:'20rem'}}
            >
              {sample}
            </p>
          </div>
          <div className="px-3 py-2 flex flex-wrap gap-1.5 border-t" style={{borderColor:'#99f6e4'}}>
            {utilList.map((u, i) => (
              <span key={i} className="font-mono text-[10px] px-1.5 py-0.5 rounded" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>{u}</span>
            ))}
          </div>
        </div>
      );
    }

    function CardList({ cards }) {
      const TONE = {
        ok:    { bg:'#f0fdfa', tx:DEEP, bd:'#99f6e4' },
        good:  { bg:'#dbf3e6', tx:'#166534', bd:'#86efac' },
        warn:  { bg:'#fef3c7', tx:'#92400e', bd:'#fde68a' },
        danger:{ bg:'#fee2e2', tx:'#991b1b', bd:'#fecaca' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🔤</span><span>이번 단계의 핵심 유틸리티</span>
          </div>
          <div className="p-3 space-y-2">
            {cards.map((c, i) => {
              const s = TONE[c.tone] || TONE.ok;
              return (
                <div key={i} className="flex items-start gap-2 text-xs rounded p-2" style={{background:s.bg, border:`1px solid ${s.bd}`}}>
                  <span className="font-mono font-bold w-36 shrink-0" style={{color:s.tx}}>{c.label}</span>
                  <span className="flex-1" style={{color:s.tx}}>{c.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f0fdfa'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🌬️</span>
            <span className="text-lg font-bold" style={{color:DEEP}}>typography 유틸 5줄 요약</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f0fdfa', bd:'#99f6e4', tx:DEEP, icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DEEP}}>텍스트 스타일 미리보기</h3>
            <span className="text-[10px] text-slate-500">utility → 실제 렌더</span>
          </div>
          <TypePreview preview={state.preview} />
          <CardList cards={state.cards} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.2)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TW</span>
              <div>
                <span className="inline-block mb-1 px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style={{background:DEEP}}>Part I. 기초 (Utility-First) · I-2-2</span>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>typography utility — font / text / leading</h1>
                <p className="text-sm" style={{color:BRAND}}>텍스트 스타일을 유틸리티로 다루기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#99f6e4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#38B2ACaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                typography 는 크기(text-*)·서체(font-*)·무게(font-bold)·행간(leading-)·자간(tracking-)·정렬·색을 모두 토큰으로 다룬다. 넘침은 truncate / line-clamp 로 막고, 화면별 크기는 반응형 prefix(md:text-lg)로 준다. 긴 마크다운 본문은 prose 한 방으로 정돈하고, 임의값 남용 대신 토큰을 먼저 쓴다. 다음 Part II 에서는 레이아웃(flex/grid)로 넘어간다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['text-size', 'font-weight', 'leading', 'tracking', 'truncate', 'line-clamp', '반응형타이포', 'prose'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
