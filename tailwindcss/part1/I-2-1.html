<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind 학습 — I-2-1. state variant (hover / focus / disabled)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌬️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!--
    Tailwind I-2-1 — state variant (hover / focus / disabled)
    상태에 따라 스타일을 바꾸는 변형 접두사
    1) hover: → 2) focus vs focus-visible → 3) disabled/active →
    4) 폼 상태(checked/required/invalid) → 5) transition·우선순위(md:hover:) → 6) group/peer·커스텀 변형
    좌: 실제 인터랙티브 요소(버튼/입력)로 각 variant 가 적용되는 순간을 눈으로 확인
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#38B2AC';
    const DEEP = '#234E52';

    const STEPS = [
      {
        title: 'Step 1. hover: — 마우스를 올리면 스타일이 바뀐다',
        desc: 'Tailwind 는 pseudo-class 를 접두사로 표현한다. hover:bg-teal-600 은 "마우스가 올라간 동안 배경을 진하게" 라는 뜻이다. 별도 CSS 파일이나 :hover 규칙을 쓰지 않고, 평상시 스타일과 변형 스타일을 같은 className 안에 나란히 둔다. 오른쪽 데모 버튼에 실제로 마우스를 올려 보면 배경색이 즉시 바뀐다. 주의할 점은 hover 는 마우스가 있는 기기 전제라는 것이다 — 모바일 터치에는 hover 상태가 사실상 없으므로 hover 에만 의존하는 UX 는 위험하다.',
        variantKey: 'hover',
        demo: 'button',
        note: '데모 버튼에 마우스를 올려 보세요 — hover:bg 가 적용됩니다.',
        alert: { tone:'warn', text:'hover 만으로 정보를 전달하지 마라. 모바일에는 hover 상태가 없어 그 정보가 통째로 사라진다.' },
        code: {
          lang:'html', filename:'hover.html',
          lines:[
            '<!-- pseudo-class 를 접두사로 표현 -->',
            '<button class="px-4 py-2 rounded-md font-semibold',
            '               bg-teal-500 text-white',
            '               hover:bg-teal-600">',
            '  저장',
            '</button>',
            '',
            '<!-- 위 한 줄은 아래 CSS 와 같은 의미다 -->',
            '<style>',
            '  .btn:hover { background-color: #0d9488; }',
            '</style>',
            '',
            '<!-- hover 는 여러 속성에 붙을 수 있다 -->',
            '<a class="text-teal-600 hover:text-teal-800',
            '          hover:underline">링크</a>',
          ],
          highlight:[1,2,3,4,5,6],
        },
      },
      {
        title: 'Step 2. focus 대신 focus-visible — 키보드 사용자를 위한 링',
        desc: 'focus: 는 요소가 포커스를 받은 동안 적용된다. 하지만 마우스로 클릭만 해도 focus 가 걸려서, 클릭할 때마다 링이 번쩍이는 게 거슬릴 수 있다. focus-visible: 는 브라우저가 "키보드로 이동한 경우" 라고 판단할 때만 적용된다. 실무 기본값은 focus-visible 이다 — 키보드 사용자에게는 반드시 보이는 포커스 링을 주고, 마우스 클릭에는 링을 띄우지 않는다. 접근성(WCAG) 상 포커스 표시는 필수이므로 outline-none 만 쓰고 대체 링을 안 주는 것은 금물이다.',
        variantKey: 'focus',
        demo: 'button',
        note: 'Tab 키로 데모 버튼에 이동해 보세요 — focus-visible 링이 나타납니다.',
        alert: { tone:'danger', text:'focus:outline-none 만 쓰고 대체 링을 안 주면 키보드 사용자가 지금 어디에 있는지 알 수 없다 — 접근성 위반이다.' },
        code: {
          lang:'html', filename:'focus.html',
          lines:[
            '<!-- 나쁜 예: 링을 없애기만 함 -->',
            '<button class="focus:outline-none">위험</button>',
            '',
            '<!-- 좋은 예: 키보드일 때만 링 -->',
            '<button class="px-4 py-2 rounded-md',
            '               bg-teal-500 text-white',
            '               focus:outline-none',
            '               focus-visible:ring-2',
            '               focus-visible:ring-teal-300',
            '               focus-visible:ring-offset-2">',
            '  저장',
            '</button>',
            '',
            '<!-- focus 는 클릭에도 걸리지만 -->',
            '<!-- focus-visible 은 키보드 이동에만 걸린다 -->',
          ],
          highlight:[4,5,6,7,8,9,10,11,12],
        },
      },
      {
        title: 'Step 3. disabled / active — 상호작용 불가와 눌린 순간',
        desc: 'disabled: 는 <button disabled> 처럼 요소가 비활성일 때 적용된다. 보통 disabled:opacity-50 과 disabled:cursor-not-allowed 를 함께 써서 "지금은 누를 수 없다" 를 시각·커서로 알린다. active: 는 마우스로 누르고 있는 짧은 순간에 적용되어, 눌리는 느낌(active:scale-95 등)을 준다. 오른쪽 데모의 토글로 버튼을 비활성화하면 hover 스타일이 더 이상 걸리지 않는 것도 확인할 수 있다 — disabled 상태에서는 상호작용 변형이 자연스럽게 죽는다.',
        variantKey: 'disabled',
        demo: 'button',
        note: '아래 토글로 disabled 를 켜 보세요 — 흐려지고 hover 가 멈춥니다.',
        alert: { tone:'info', text:'disabled 는 opacity 로만 표시하지 말고 cursor-not-allowed 도 함께 줘라. 시각과 커서 두 채널로 알리는 것이 안전하다.' },
        code: {
          lang:'html', filename:'disabled-active.html',
          lines:[
            '<!-- 비활성 상태 표현 -->',
            '<button disabled',
            '        class="px-4 py-2 rounded-md',
            '               bg-teal-500 text-white',
            '               hover:bg-teal-600',
            '               active:scale-95',
            '               disabled:opacity-50',
            '               disabled:cursor-not-allowed',
            '               disabled:hover:bg-teal-500">',
            '  전송',
            '</button>',
            '',
            '<!-- active: 는 누르는 순간의 피드백 -->',
            '<!-- disabled 면 hover/active 는 죽는다 -->',
          ],
          highlight:[2,6,7,8,9],
        },
      },
      {
        title: 'Step 4. 폼 상태 — checked / required / invalid',
        desc: '입력 요소는 자체 상태가 있고 Tailwind 는 그것도 접두사로 잡는다. checked: 는 체크박스·라디오가 선택됐을 때, required: 는 필수 입력에, invalid: 는 브라우저 검증이 실패했을 때 적용된다. 예를 들어 invalid:border-red-500 을 주면 이메일 형식이 틀린 순간 테두리가 빨개진다 — JS 없이 CSS 만으로 즉시 피드백을 준다. 오른쪽 입력창에 잘못된 이메일을 넣어 보면 테두리 색이 바뀐다. 다만 빈 값에도 invalid 가 걸릴 수 있으니 required 와 함께 UX 를 설계해야 한다.',
        variantKey: 'invalid',
        demo: 'input',
        note: '입력창에 잘못된 이메일(예: abc)을 넣어 보세요 — invalid 테두리가 뜹니다.',
        alert: { tone:'warn', text:'invalid: 는 빈 값에도 걸릴 수 있다. 처음부터 빨갛게 보이지 않게 required 조합·포커스 후 표시 전략을 함께 고려하라.' },
        code: {
          lang:'html', filename:'form-states.html',
          lines:[
            '<!-- 체크 상태 -->',
            '<input type="checkbox"',
            '       class="accent-teal-500',
            '              checked:ring-2">',
            '',
            '<!-- 검증 실패 시 테두리 강조 -->',
            '<input type="email" required',
            '       class="border rounded px-3 py-2',
            '              border-slate-300',
            '              focus:border-teal-500',
            '              required:border-l-4',
            '              invalid:border-red-500',
            '              invalid:text-red-600">',
            '',
            '<!-- JS 없이 CSS 만으로 즉시 피드백 -->',
          ],
          highlight:[6,7,8,9,10,11,12,13],
        },
      },
      {
        title: 'Step 5. 조합과 우선순위 — transition · md:hover:',
        desc: 'state 변형은 다른 접두사와 겹쳐 쓸 수 있다. md:hover:bg-teal-600 은 "md 이상 화면에서, 마우스를 올렸을 때" 라는 두 조건의 교집합이다. 접두사를 읽는 순서는 반응형 → 상태 순으로 왼쪽부터다. 그리고 상태가 바뀔 때 값이 뚝 끊기지 않게 transition 과 duration 을 꼭 함께 줘라 — transition-colors duration-200 이 없으면 hover 색이 부드럽지 않고 툭 바뀐다. 실무에서 가장 흔한 함정이 바로 이 transition 누락이다.',
        variantKey: 'hover',
        demo: 'button',
        note: 'transition 이 있는 버튼은 색이 부드럽게, 없는 쪽은 툭 바뀝니다.',
        alert: { tone:'good', text:'상태 변형에는 거의 항상 transition 을 짝지어라. transition-colors duration-200 한 줄이 체감 품질을 크게 올린다.' },
        code: {
          lang:'html', filename:'combine.html',
          lines:[
            '<!-- 반응형 + 상태 조합: 왼쪽부터 읽는다 -->',
            '<button class="bg-teal-500 text-white',
            '               md:hover:bg-teal-600',
            '               transition-colors duration-200',
            '               px-4 py-2 rounded-md">',
            '  md 이상에서만 hover 색 변경',
            '</button>',
            '',
            '<!-- 여러 상태를 한 요소에 -->',
            '<button class="bg-teal-500 text-white',
            '               hover:bg-teal-600',
            '               focus-visible:ring-2',
            '               active:scale-95',
            '               disabled:opacity-50',
            '               transition">종합</button>',
          ],
          highlight:[2,3,4,5],
        },
      },
      {
        title: 'Step 6. group / peer · 커스텀 변형 — 다음 이야기',
        desc: '지금까지는 "자기 자신" 의 상태였다. 부모에 hover 하면 자식 스타일을 바꾸고 싶을 때는 group / group-hover: 를, 형제 입력의 상태를 반영하고 싶을 때는 peer / peer-invalid: 를 쓴다. 카드 전체에 마우스를 올리면 안의 화살표가 움직이는 UI 가 대표적인 group 예시다. 또한 자주 쓰는 변형 조합은 tailwind.config 의 addVariant 로 이름을 붙여 재사용할 수 있다. 이 group/peer 는 다음 페이지에서 실제 인터랙션으로 자세히 다룬다.',
        variantKey: 'group',
        demo: 'group',
        note: '아래 카드 전체에 마우스를 올려 보세요 — 자식 화살표가 group-hover 로 움직입니다.',
        wins:[
          'hover / focus-visible / active / disabled — 상호작용 상태를 접두사로',
          'checked / required / invalid — 폼 상태도 CSS 만으로 즉시 반영',
          '조합은 왼쪽부터: 반응형 → 상태 (md:hover:)',
          '상태 변형에는 transition 을 짝지어 부드럽게',
          'group / peer 로 부모·형제 상태까지, addVariant 로 커스텀',
        ],
        alert: { tone:'good', text:'state variant 는 "상태 → 스타일" 매핑을 마크업 안에 담는다. JS 상태 관리 없이도 상호작용 피드백의 8할이 해결된다.' },
        code: {
          lang:'html', filename:'group-peer.html',
          lines:[
            '<!-- 부모 hover 로 자식 제어: group -->',
            '<a class="group flex items-center gap-2 p-4',
            '          rounded-lg hover:bg-teal-50">',
            '  <span>자세히 보기</span>',
            '  <span class="transition-transform',
            '               group-hover:translate-x-1">→</span>',
            '</a>',
            '',
            '<!-- 형제 상태 반영: peer -->',
            '<input type="email" class="peer border" />',
            '<p class="hidden peer-invalid:block',
            '          text-red-500 text-xs">',
            '  이메일 형식이 아닙니다',
            '</p>',
          ],
          highlight:[1,2,3,4,5,6,7],
        },
      },
    ];

    // 각 STEP 이 강조하는 variant 를 실제 클래스로 매핑 (데모 요소에 그대로 적용)
    const VARIANT_INFO = {
      hover:    { label:'hover:',         css:':hover',          tip:'마우스가 올라간 동안' },
      focus:    { label:'focus-visible:', css:':focus-visible',  tip:'키보드로 포커스했을 때' },
      disabled: { label:'disabled:',      css:':disabled',       tip:'요소가 비활성일 때' },
      invalid:  { label:'invalid:',       css:':invalid',        tip:'입력 검증이 실패했을 때' },
      group:    { label:'group-hover:',   css:'.group:hover 자식', tip:'부모에 마우스를 올렸을 때' },
    };

    function DemoButton({ variantKey, disabled }) {
      // 실제 Tailwind state variant 가 적용된 버튼 — 사용자가 직접 hover/focus 가능
      return (
        <button
          disabled={disabled}
          className="px-5 py-2.5 rounded-md font-semibold text-white bg-teal-500
                     transition-colors duration-200
                     hover:bg-teal-600
                     focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-300 focus-visible:ring-offset-2
                     active:scale-95
                     disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-teal-500">
          저장하기
        </button>
      );
    }

    function DemoInput() {
      // required + type=email → 잘못된 값이면 invalid: 로 테두리가 빨개진다
      return (
        <input
          type="email"
          required
          placeholder="you@example.com"
          className="w-full border rounded-md px-3 py-2 text-sm outline-none
                     border-slate-300
                     focus:border-teal-500
                     invalid:border-red-500 invalid:text-red-600
                     transition-colors" />
      );
    }

    function DemoGroup() {
      // 부모(group)에 hover → 자식 화살표가 group-hover 로 이동
      return (
        <a className="group flex items-center gap-2 p-4 rounded-lg border cursor-pointer transition-colors
                      border-teal-200 hover:bg-teal-50" style={{color:DEEP}}>
          <span className="font-semibold">자세히 보기</span>
          <span className="transition-transform duration-200 group-hover:translate-x-2 text-teal-600 text-lg">→</span>
        </a>
      );
    }

    function VariantBadge({ variantKey }) {
      const v = VARIANT_INFO[variantKey] || VARIANT_INFO.hover;
      return (
        <div className="flex items-center gap-2 text-xs rounded-lg px-3 py-2"
             style={{background:'#f0fdfa', border:`1px solid #99f6e4`, color:DEEP}}>
          <span className="font-mono font-bold px-2 py-0.5 rounded text-white" style={{background:BRAND}}>{v.label}</span>
          <span className="font-mono text-slate-500">{v.css}</span>
          <span className="ml-auto">{v.tip}</span>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f0fdfa', bd:'#99f6e4', tx:DEEP, icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f0fdfa'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🌬️</span>
            <span className="text-lg font-bold" style={{color:DEEP}}>state variant 핵심 5가지</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DEEP}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const [disabled, setDisabled] = useState(false);
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DEEP}}>인터랙티브 데모</h3>
            <span className="text-[10px] text-slate-500">직접 hover · focus · 입력해 보세요</span>
          </div>

          <VariantBadge variantKey={state.variantKey} />

          <div className="mt-3 rounded-lg p-6 flex flex-col items-center justify-center gap-4 min-h-[150px]"
               style={{background:'#f8fafc', border:'1px dashed #cbd5e1'}}>
            {state.demo === 'button' && <DemoButton variantKey={state.variantKey} disabled={disabled} />}
            {state.demo === 'input' && <div className="w-full max-w-xs"><DemoInput /></div>}
            {state.demo === 'group' && <div className="w-full max-w-xs"><DemoGroup /></div>}

            {state.demo === 'button' && (
              <label className="flex items-center gap-2 text-xs text-slate-600 cursor-pointer select-none">
                <input type="checkbox" className="accent-teal-500"
                       checked={disabled} onChange={(e) => setDisabled(e.target.checked)} />
                disabled 상태 켜기
              </label>
            )}
          </div>

          <div className="mt-3 text-xs rounded-lg px-3 py-2" style={{background:'#fefce8', border:'1px solid #fde68a', color:'#92400e'}}>
            {state.note}
          </div>

          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(56,178,172,0.2)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f0fdfa 0%,#ccfbf1 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TW</span>
              <div>
                <div className="text-[11px] font-bold mb-0.5" style={{color:BRAND}}>Part I. 기초 (Utility-First) · I-2-1</div>
                <h1 className="text-2xl font-bold" style={{color:DEEP}}>state variant — hover / focus / disabled</h1>
                <p className="text-sm" style={{color:BRAND}}>상태에 따라 스타일을 바꾸는 변형 접두사</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#99f6e4'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#38B2ACaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DEEP}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                state variant 는 "상태 → 스타일" 매핑을 마크업 안에 담는 방식이다. hover · focus-visible · active · disabled 로 상호작용을, checked · required · invalid 로 폼 상태를 CSS 만으로 표현한다. 조합은 왼쪽부터 반응형 → 상태 순으로 읽고, 항상 transition 을 짝지어라. 다음에는 부모·형제 상태를 반영하는 group / peer 를 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['hover', 'focus-visible', 'disabled', 'invalid', 'transition', 'group-peer'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f0fdfa', color:DEEP, border:'1px solid #99f6e4'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
