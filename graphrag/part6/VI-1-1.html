  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    VI-1-1. GraphRAG 온톨로지 상세 — 스키마 설계
    학습 목표: 온톨로지가 "무엇을 어떻게 담을지"의 약속임을 이해하고,
              자유 추출의 혼돈 → 구성 요소(클래스/속성/제약) → RDF vs 프로퍼티 그래프 →
              실전 스키마 설계 과정 → LLM 추출 가드레일까지 5단계로 추적한다.
    핵심 비유: 온톨로지 = 그래프의 건축 설계도. 없으면 그래프는 쓰레기장이 된다.
    패턴: fastapi v1 — 좌(LiveDataPane: 스키마 다이어그램/비교) / 우(VSCode CodeViewer: ontology_design.py + schema.ttl)
    색상: violet (graphrag 도메인 톤)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 온톨로지란 → 해부 → 두 진영 → 설계 과정 → LLM 시대
    //   각 step: { title, desc, actor, engine/engineDetail, viz(좌측 시각화 종류),
    //             viz별 데이터, alert, code(우측 CodeViewer) }
    // ─────────────────────────────────────────────────────
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };
    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      chaos: { lang: "python", filename: "chaos_demo.py — 온톨로지 없는 자유 추출", lines: [
        "\"\"\"",
        "chaos_demo.py — 온톨로지가 없을 때 생기는 혼돈 재현",
        "",
        "같은 사실 \"김이사가 우리회사에 재직\"이 파이프라인마다",
        "다른 어휘(worksFor / employedBy / 재직)로 저장된다.",
        "\"\"\"",
        "",
        "# 세 파이프라인이 \"자유롭게\" 추출한 결과",
        "raw_triples = [",
        "    (\"김이사\", \"worksFor\",   \"우리회사\"),   # 추출기 A",
        "    (\"Kim\",    \"employedBy\", \"OurCorp\"),    # 추출기 B",
        "    (\"김이사\", \"재직\",       \"우리회사\"),   # 수기 입력",
        "]",
        "",
        "",
        "def find_employees(triples: list, company: str) -> list:",
        "    \"\"\"특정 회사 재직자를 관계 이름으로 조회.\"\"\"",
        "    # 문제: 관계 이름을 하나로 못 박지 않았다",
        "    return [s for s, p, o in triples",
        "            if p == \"worksFor\" and o == company]",
        "",
        "",
        "hits = find_employees(raw_triples, \"우리회사\")",
        "print(hits)          # -> [\"김이사\"]  (Kim, 재직은 누락!)",
        "print(len(raw_triples))  # 3건 저장, 실질 1명",
        "",
        "# 근본 원인: \"무엇을 어떻게 부를지\"에 대한 약속이 없다.",
        "#   - 엔티티: 김이사 vs Kim (동일인이 안 묶임)",
        "#   - 관계  : worksFor / employedBy / 재직 (3중 파편)",
        "#   - 회사  : 우리회사 vs OurCorp (동일 회사가 안 묶임)",
        "# 해결: 온톨로지로 클래스·관계 어휘를 표준화한다 (Step 2~).",
      ] },
      schema: { lang: "python", filename: "ontology_design.py — 스키마 정의", lines: [
        "\"\"\"",
        "ontology_design.py — 회사 도메인 온톨로지 스키마",
        "",
        "클래스 계층 + 데이터/객체 속성 + 관계 제약을 파이썬 dict로.",
        "(표준 표기는 Turtle/OWL — schema.ttl 탭 참고)",
        "\"\"\"",
        "from dataclasses import dataclass, field",
        "",
        "",
        "@dataclass",
        "class RelationSchema:",
        "    \"\"\"관계의 도메인·레인지·카디널리티 제약.\"\"\"",
        "    domain: str            # 관계의 출발 클래스",
        "    range: str             # 관계의 도착 클래스",
        "    cardinality: str = \"N:N\"",
        "",
        "",
        "# 1) 클래스 계층 — 하위: 상위 (상속 관계)",
        "CLASS_HIERARCHY = {",
        "    \"Agent\":   \"Thing\",",
        "    \"Person\":  \"Agent\",    # Person ⊂ Agent",
        "    \"Company\": \"Agent\",",
        "    \"City\":    \"Thing\",",
        "}",
        "",
        "# 2) 데이터 속성 — 값이 리터럴(문자열/숫자)",
        "DATA_PROPERTIES = {",
        "    \"Person\":  {\"name\": \"str\", \"birthCity\": \"str\"},",
        "    \"Company\": {\"name\": \"str\", \"foundedYear\": \"int\"},",

    function Triple({ s, p, o, tone = 'violet' }) {
      const toneCls = {
        violet: 'border-violet-300 bg-violet-50 text-violet-900',
        red:    'border-red-300 bg-red-50 text-red-900',
        emerald:'border-emerald-300 bg-emerald-50 text-emerald-900',
        slate:  'border-slate-300 bg-white text-slate-700',
      }[tone];
      return (
        <div className={`flex items-center gap-1 text-[10px] font-mono rounded border px-1.5 py-1 ${toneCls}`}>
          <span className="font-bold truncate">{s}</span>
          <span className="text-[9px] px-1 rounded bg-white/70 border border-current/30 whitespace-nowrap">{p}</span>
          <span className="opacity-60">→</span>
          <span className="font-bold truncate">{o}</span>
        </div>
      );
    }

              ))}

            <div className="mt-1.5 text-[9px] text-red-900">worksFor / employedBy / 재직 = 셋 다 "다닌다" — 검색이 파편을 놓친다.</div>
          </div>
          <div className="flex items-center justify-center text-violet-500 text-sm font-bold">⬇ 온톨로지로 어휘 표준화 ⬇</div>
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1.5">✅ 온톨로지 정렬 — WORKS_AT 하나로</div>
            <div className="space-y-1.5">
              {state.alignedTriples.map((t, i) => (
                <Triple key={i} s={t.s} p={t.p} o={t.o} tone="emerald" />
              ))}
            </div>
            <div className="mt-1.5 text-[9px] text-emerald-900">엔티티·관계·회사가 표준 어휘로 묶여 "재직자" 한 번에 조회된다.</div>
          </div>
        </div>
      );
    }

    // ── Step 2: 클래스 계층 + 제약 + 검증 ──
    function AnatomyViz({ state }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-violet-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-violet-900 mb-1.5">🏛 클래스 계층 (하위 ⊂ 상위)</div>
            <div className="space-y-1">
              {state.hierarchy.map((h, i) => (
                <div key={i} className="flex items-center gap-2" style={{ paddingLeft: `${h.level * 16}px` }}>
                  {h.level > 0 && <span className="text-violet-400 text-[10px]">└</span>}
                  <span className="text-[11px] font-mono font-bold px-1.5 py-0.5 rounded bg-violet-100 text-violet-900 border border-violet-300">{h.cls}</span>
                  <span className="text-[9px] text-slate-500">{h.note}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-violet-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-violet-900 mb-1.5">🔗 관계 제약 (도메인 → 레인지 · 카디널리티)</div>
            <table className="w-full text-[10px]">
              <tbody>
                {state.constraints.map((c, i) => (
                  <tr key={i} className="border-t border-violet-100">
                    <td className="py-1 font-mono font-bold text-violet-800">{c.rel}</td>
                    <td className="py-1 font-mono text-slate-700">{c.domain} → {c.range}</td>
                    <td className="py-1 text-right text-[9px] text-slate-500">{c.card}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-slate-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-slate-700 mb-1.5">🧪 제약이 걸러내는 트리플</div>
            <div className="space-y-1.5">
              {state.validation.map((v, i) => (
                <div key={i} className={`rounded border px-2 py-1 ${v.ok ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                  <div className="text-[10px] font-mono font-bold text-slate-800">{v.ok ? '✓' : '✗'} {v.triple}</div>
                  <div className={`text-[9px] ${v.ok ? 'text-emerald-700' : 'text-red-700'}`}>{v.why}</div>
                </div>

            </div>
          </div>
        </div>

    // ── Step 3: RDF vs 프로퍼티 그래프 ──
    function CampsViz({ state }) {
      return (
        <div className="space-y-3">
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-2.5">
              <div className="text-[11px] font-bold text-sky-800 mb-1.5">📐 RDF/OWL — 트리플 + URI</div>
              <div className="space-y-0.5">
                {state.rdfLines.map((l, i) => (
                  <div key={i} className="text-[9px] font-mono text-sky-900 bg-white/70 rounded px-1 py-0.5 border border-sky-200 truncate">{l}</div>
                ))}
              </div>
              <div className="mt-1.5 text-[9px] text-sky-700">사실 1개 = 트리플 여러 개. URI로 외부 연결·OWL 추론.</div>
            </div>
            <div className="rounded-lg border-2 border-violet-300 bg-violet-50 p-2.5">
              <div className="text-[11px] font-bold text-violet-900 mb-1.5">🕸 프로퍼티 그래프 — 노드+속성</div>
              <div className="flex flex-col items-center gap-1 mt-2">
                <div className="rounded-lg border-2 border-violet-400 bg-white px-2 py-1 text-center">
                  <div className="text-[10px] font-bold text-violet-900">{state.pgNode.label}</div>
                  <div className="text-[8px] font-mono text-slate-600">{state.pgNode.props}</div>
                </div>
                <div className="text-[9px] font-mono text-violet-600">│ {state.pgRel} ▼</div>
                <div className="rounded-lg border-2 border-violet-400 bg-white px-2 py-1 text-center">
                  <div className="text-[10px] font-bold text-violet-900">{state.pgNode2.label}</div>
                  <div className="text-[8px] font-mono text-slate-600">{state.pgNode2.props}</div>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-violet-700">속성을 노드에 직접. 앱 개발 직관·순회 빠름.</div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-violet-400 bg-white p-2.5">
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-violet-900 border-b-2 border-violet-300">
                  <th className="text-left py-1">기준</th>
                  <th className="text-left py-1 pl-2">RDF/OWL</th>
                  <th className="text-left py-1 pl-2">프로퍼티 그래프</th>
                </tr>
              </thead>
              <tbody>
                {state.compareRows.map((r, i) => (
                  <tr key={i} className="border-t border-violet-100">
                    <td className="py-1 text-slate-800">{r.crit}</td>
                    <td className={`py-1 pl-2 font-bold ${r.rdf.startsWith('◎') ? 'text-emerald-700' : r.rdf.startsWith('✗') ? 'text-red-700' : 'text-slate-600'}`}>{r.rdf}</td>
                    <td className={`py-1 pl-2 font-bold ${r.pg.startsWith('◎') ? 'text-emerald-700' : r.pg.startsWith('✗') ? 'text-red-700' : 'text-slate-600'}`}>{r.pg}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ── Step 4: 반복 설계 과정 ──
    function DesignViz({ state }) {
      const toneCls = {
        q: 'border-amber-300 bg-amber-50 text-amber-900',
        c: 'border-sky-300 bg-sky-50 text-sky-900',
        s: 'border-violet-300 bg-violet-50 text-violet-900',
        v: 'border-emerald-300 bg-emerald-50 text-emerald-900',
        r: 'border-fuchsia-300 bg-fuchsia-50 text-fuchsia-900',
      };
      return (
        <div className="space-y-2">
          {state.designSteps.map((d, i) => (
            <React.Fragment key={i}>
              {i > 0 && <div className="text-center text-violet-400 text-[11px] -my-1">▼</div>}
              <div className={`rounded-lg border-2 p-2.5 ${toneCls[d.tone]}`}>
                <div className="text-[11px] font-bold mb-1">{d.phase}</div>
                <div className="space-y-0.5">
                  {d.items.map((it, j) => (
                    <div key={j} className="text-[10px] font-mono bg-white/70 rounded px-1.5 py-0.5 border border-current/20">{it}</div>
                  ))}
                </div>
              </div>
            </React.Fragment>
          ))}
        </div>

    }

    // ── Step 5: LLM 가드레일 (before/after + 진화 + 재사용) ──
    function LlmViz({ state }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-violet-400 bg-violet-50 p-2.5">
            <div className="text-[11px] font-bold text-violet-900 mb-1.5">📌 프롬프트에 주입하는 스키마</div>
            <div className="space-y-0.5">
              {state.promptSchema.map((l, i) => (
                <div key={i} className="text-[10px] font-mono text-violet-900 bg-white/70 rounded px-1.5 py-0.5 border border-violet-200">{l}</div>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2">
              <div className="text-[10px] font-bold text-red-800 mb-1">전: 자유 어휘</div>
              <div className="space-y-1">
                {state.beforeAfter.before.map((t, i) => <Triple key={i} s={t.s} p={t.p} o={t.o} tone="red" />)}
              </div>
            </div>
            <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2">
              <div className="text-[10px] font-bold text-emerald-800 mb-1">후: 스키마 정렬 ✓</div>
              <div className="space-y-1">
                {state.beforeAfter.after.map((t, i) => <Triple key={i} s={t.s} p={t.p} o={t.o} tone="emerald" />)}
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-slate-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-slate-700 mb-1.5">🔁 스키마 진화 (버전 · 마이그레이션)</div>
            <table className="w-full text-[10px]">
              <tbody>
                {state.evolveRows.map((r, i) => (
                  <tr key={i} className="border-t border-slate-100">
                    <td className="py-1 font-mono font-bold text-violet-800 w-8">{r.v}</td>
                    <td className="py-1 font-mono text-slate-700">{r.change}</td>
                    <td className="py-1 text-right text-[9px] text-slate-500">{r.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-2 pt-2 border-t border-slate-200">
              <div className="text-[10px] font-bold text-slate-700 mb-1">♻ 재사용 (바닥부터 X)</div>
              <div className="flex flex-wrap gap-1">
                {state.reuse.map((r, i) => (
                  <span key={i} className="text-[9px] font-mono px-1.5 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200">{r}</span>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — viz 종류에 따라 시각화 분기 (violet 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      chaos:   { icon: '🌪', label: '자유 추출' },
      anatomy: { icon: '🔬', label: '스키마 해부' },
      camps:   { icon: '⚖️', label: '두 진영' },
      design:  { icon: '🛠', label: '반복 설계' },
      llm:     { icon: '🤖', label: 'LLM 가드레일' },
    };

    function VizSwitch({ state }) {
      switch (state.viz) {
        case 'chaos':   return <ChaosViz state={state} />;
        case 'anatomy': return <AnatomyViz state={state} />;
        case 'camps':   return <CampsViz state={state} />;
        case 'design':  return <DesignViz state={state} />;
        case 'llm':     return <LlmViz state={state} />;
        default:        return null;
      }
    }

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.chaos;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>온톨로지 스튜디오 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            모드: {state.engineDetail}
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}
          <VizSwitch state={state} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-violet-600 text-white font-bold">GraphRAG</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">VI-1-1. 온톨로지 상세 — 스키마 설계</h1>
                <p className="text-sm text-violet-800/80">그래프에 "무엇을 어떻게 담을지"의 약속 — 온톨로지가 없으면 그래프는 쓰레기장이 된다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                온톨로지는 그래프에 "무엇을 어떻게 담을지"를 팀 전체가 합의한 표준 어휘집이다.
                이 약속이 없으면 같은 사실이 worksFor/employedBy/재직으로 파편화되어 그래프가 쓰레기장이 된다.
                클래스 계층·데이터/객체 속성·도메인·레인지·카디널리티 제약이 데이터 품질을 저장 전에 지킨다.
                표현 표준은 두 진영 — 공공·표준 연계는 RDF/OWL, 앱·성능은 프로퍼티 그래프.
                스키마는 "답할 질문"에서 출발해 샘플로 검증하며 반복 설계하고, LLM 시대에는 추출 프롬프트의 가드레일로서 오히려 더 중요해졌다.
                다음 장에서는 이 스키마를 실제 LLM 추출 파이프라인에 연결한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['온톨로지', '스키마설계', '클래스계층', '도메인레인지', '카디널리티', 'RDF', 'OWL', '프로퍼티그래프', 'Turtle', 'schema.org', 'LLM추출', '가드레일'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-2-2.html" className="underline hover:no-underline">이전 파트: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
