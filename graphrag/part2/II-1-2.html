  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    II-1-2. 속성(Property)과 라벨(Label)
    학습 목표:
      - 라벨(Label) = 노드 타입 분류  (예: :Person, :Company)
      - 속성(Property) = 노드/엣지의 key-value 데이터 (예: {name: "Alice", age: 30})
      - 다중 라벨, 인덱스까지 5단계로 익힌다.
    핵심 비유: 주민등록증 — 라벨(시민/외국인 같은 분류) + 속성(이름/생년월일 키-값)
    패턴: fastapi v1 — 좌(LiveDataPane: 그래프 SVG + 속성 패널) / 우(VSCode CodeViewer)
    색상: violet (graphrag base)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 — 라벨/속성/엣지 속성/다중 라벨/인덱스
    //   nodes[i] = {
    //     id, x, y,
    //     labels: ['Person', 'Engineer'],   // 라벨 배열 (다중 라벨 가능)
    //     name: 'Alice',                    // 표시용
    //     props: { name: '"Alice"', age: 30 },
    //     indexed: false,                   // 인덱스 노드 = 두꺼운 외곽
    //   }
    //   edges[i] = { from, to, type: 'WORKS_AT', props: {...} }
    //   selected = { kind: 'node'|'edge', id }   // 속성 패널 열린 대상
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 라벨(Label) — 노드 타입 분류',
        desc: '주민등록증에서 라벨은 "한국 시민 / 외국인" 같은 큰 분류다. 노드 위에 콜론으로 :Person, :Company처럼 붙여 타입을 표시한다. 라벨이 같은 노드끼리 같은 그룹 — Cypher 쿼리에서 (p:Person)으로 한 번에 잡는다.',
        nodes: [
          { id: 'alice',  x: 110, y: 130, labels: ['Person'],  name: 'Alice', props: {}, indexed: false },
          { id: 'bob',    x: 110, y: 250, labels: ['Person'],  name: 'Bob',   props: {}, indexed: false },
          { id: 'apple',  x: 410, y: 190, labels: ['Company'], name: 'Apple', props: {}, indexed: false },
        ],
        edges: [],
        selected: { kind: 'node', id: 'alice' },
        showCount: false,
        showIndexBadge: false,
        code: {
          lang: 'cypher',
          filename: 'properties.cypher',
          lines: [
            '// Step 1. 라벨 — 노드의 분류',
            '// :Person, :Company처럼 콜론으로 붙는다.',
            '// 같은 라벨 = 같은 타입 (RDB의 테이블 같은 역할)',
            '',
            'CREATE (alice:Person)',
            'CREATE (bob:Person)',
            'CREATE (apple:Company)',
            '',
            '// 라벨로 한 번에 조회',
            'MATCH (p:Person)   RETURN p   // Alice, Bob',
            'MATCH (c:Company)  RETURN c   // Apple',
            '',
            '// 라벨이 없는 노드는 type 없는 데이터 — 위험',
            'CREATE (x)   // 가능은 하지만 비추천',
          ],
          highlight: [5, 6, 7, 10, 11],
        },
      },
      {
        title: 'Step 2. 노드 속성(Property) — key-value 데이터',
        desc: '라벨로 분류를 정했으면, 구체적인 값은 속성(Property)으로 붙인다. {name: "Alice", age: 30}처럼 key-value. 속성은 검색/필터의 기반 — Cypher에서 {name: "Alice"} 형태로 매칭한다. 클릭하면 우측 SVG에서 속성 패널이 펼쳐진다.',
        nodes: [
          { id: 'alice', x: 110, y: 130, labels: ['Person'],  name: 'Alice',
            props: { name: '"Alice"', age: '30' }, indexed: false },
          { id: 'bob',   x: 110, y: 250, labels: ['Person'],  name: 'Bob',
            props: { name: '"Bob"',   age: '28' }, indexed: false },
          { id: 'apple', x: 410, y: 190, labels: ['Company'], name: 'Apple',
            props: { name: '"Apple"', founded: '1976' }, indexed: false },
        ],
        edges: [],
        selected: { kind: 'node', id: 'alice' },
        showCount: false,
        showIndexBadge: false,
        code: {
          lang: 'cypher',
          filename: 'properties.cypher',
          lines: [
            '// Step 2. 노드 속성 — key-value 데이터',
            '// 라벨이 분류라면, 속성은 그 안의 구체적인 값.',
            '',
            'CREATE (alice:Person {name: "Alice", age: 30})',
            'CREATE (bob:Person   {name: "Bob",   age: 28})',
            'CREATE (apple:Company {name: "Apple", founded: 1976})',
            '',
            '// 속성으로 필터링 — Cypher의 핵심',
            'MATCH (p:Person {name: "Alice"}) RETURN p',
            'MATCH (p:Person) WHERE p.age > 29 RETURN p.name',
            '',
            '// 타입: string / number / boolean / list',
            '// (객체 중첩은 불가 — 정규화 필요)',
            'CREATE (c:Company {',
            '  name: "Apple",',
            '  tags: ["Tech", "Hardware"],   // list OK',
            '  active: true                   // boolean OK',
            '})',
          ],
          highlight: [4, 5, 6, 9, 10],
        },
      },
      {
        title: 'Step 3. 엣지에도 속성 — 관계의 메타데이터',
        desc: '엣지(관계)에도 {since: 2020, role: "engineer"}처럼 속성을 붙일 수 있다. "언제부터", "어떤 역할로" 같은 관계의 디테일을 엣지가 직접 들고 있다 — RDB의 JOIN 테이블이 갖는 정보를 엣지가 직접 보존한다. 엣지를 클릭하면 우측 SVG에서 엣지 속성 패널이 열린다.',
        nodes: [
          { id: 'alice', x: 110, y: 130, labels: ['Person'],  name: 'Alice',
            props: { name: '"Alice"', age: '30' }, indexed: false },
          { id: 'bob',   x: 110, y: 250, labels: ['Person'],  name: 'Bob',
            props: { name: '"Bob"',   age: '28' }, indexed: false },
          { id: 'apple', x: 410, y: 190, labels: ['Company'], name: 'Apple',
            props: { name: '"Apple"', founded: '1976' }, indexed: false },
        ],
        edges: [
          { id: 'e1', from: 'alice', to: 'apple', type: 'WORKS_AT',
            props: { since: '2020', role: '"engineer"' } },
          { id: 'e2', from: 'bob',   to: 'apple', type: 'WORKS_AT',

    // ─────────────────────────────────────────────────────
    // 라벨 → 색상 매핑 (정적 — Tailwind purge 안전 + SVG 인라인)
    // ─────────────────────────────────────────────────────
    const LABEL_COLOR = {
      Person:   { fill: '#a78bfa', stroke: '#7c3aed', text: '#ffffff' },  // violet
      Company:  { fill: '#34d399', stroke: '#059669', text: '#ffffff' },  // emerald
      Engineer: { fill: '#fb923c', stroke: '#c2410c', text: '#ffffff' },  // orange
      Designer: { fill: '#f472b6', stroke: '#be185d', text: '#ffffff' },  // pink
    };

    function getNodeColor(node) {
      // 첫 라벨 기준 — 다중 라벨이라도 1차 분류는 첫 라벨
      const primary = node.labels[0] || 'Person';
      return LABEL_COLOR[primary] || LABEL_COLOR.Person;
    }

    // ─────────────────────────────────────────────────────
    // 노드 SVG — 라벨, 다중 라벨 칩, 인덱스 외곽선
    // ─────────────────────────────────────────────────────
    function NodeSvg({ node, isSelected, onClick, showIndexBadge }) {
      const color = getNodeColor(node);
      const r = 36;
      const isMulti = node.labels.length > 1;

      return (
        <g
          onClick={() => onClick({ kind: 'node', id: node.id })}
          style={{ cursor: 'pointer' }}
        >
          {/* 인덱스 외곽 (두꺼운 violet 링) */}
          {node.indexed && showIndexBadge && (
            <circle cx={node.x} cy={node.y} r={r + 6} fill="none"
              stroke="#7c3aed" strokeWidth="3" strokeDasharray="4 3" opacity="0.7" />
          )}

          {/* 선택 하이라이트 */}
          {isSelected && (
            <circle cx={node.x} cy={node.y} r={r + 3} fill="none"
              stroke="#facc15" strokeWidth="3" />
          )}

          {/* 노드 본체 */}
          <circle cx={node.x} cy={node.y} r={r} fill={color.fill}
            stroke={color.stroke} strokeWidth="2" className="transition-all duration-500" />

          {/* 노드 이름 */}
          <text x={node.x} y={node.y + 4} textAnchor="middle" fontSize="12"
            fontWeight="bold" fill={color.text} pointerEvents="none">
            {node.name}
          </text>

          {/* 라벨 칩 (위쪽) — 다중 라벨이면 여러 개 */}
          {node.labels.map((label, idx) => {
            const c = LABEL_COLOR[label] || LABEL_COLOR.Person;
            const chipY = node.y - r - 10 - idx * 14;
            return (
              <g key={label} pointerEvents="none">
                <rect x={node.x - 32} y={chipY - 9} width="64" height="14"
                  rx="3" fill={c.stroke} opacity="0.95" />
                <text x={node.x} y={chipY + 1} textAnchor="middle" fontSize="9"
                  fontFamily="monospace" fontWeight="bold" fill="#ffffff">
                  :{label}
                </text>
              </g>
            );
          })}

          {/* 인덱스 뱃지 */}
          {node.indexed && showIndexBadge && (
            <g pointerEvents="none">
              <circle cx={node.x + r - 4} cy={node.y - r + 4} r={9}
                fill="#7c3aed" stroke="#ffffff" strokeWidth="2" />
              <text x={node.x + r - 4} y={node.y - r + 7} textAnchor="middle"
                fontSize="10" fill="#ffffff">🔎</text>
            </g>
          )}

          {/* 다중 라벨 카운트 */}
          {isMulti && (
            <g pointerEvents="none">
              <circle cx={node.x - r + 4} cy={node.y - r + 4} r={8}
                fill="#facc15" stroke="#ca8a04" strokeWidth="1.5" />
              <text x={node.x - r + 4} y={node.y - r + 7} textAnchor="middle"
                fontSize="9" fontWeight="bold" fill="#78350f">
                {node.labels.length}
              </text>
            </g>
          )}
        </g>
      );
    }

    // ─────────────────────────────────────────────────────
    // 엣지 SVG — 화살표 + type 라벨 + 속성 칩
    // ─────────────────────────────────────────────────────
    function EdgeSvg({ edge, fromNode, toNode, isSelected, onClick, hasProps }) {
      const dx = toNode.x - fromNode.x;
      const dy = toNode.y - fromNode.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const r = 36;
      const x1 = fromNode.x + ux * r;
      const y1 = fromNode.y + uy * r;
      const x2 = toNode.x - ux * r;
      const y2 = toNode.y - uy * r;
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;

      return (
        <g onClick={() => onClick({ kind: 'edge', id: edge.id })} style={{ cursor: 'pointer' }}>
          {/* 클릭 영역 (투명, 두꺼운) */}
          <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="transparent" strokeWidth="14" />

          {/* 본 화살표 */}
          <line x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={isSelected ? '#facc15' : '#64748b'}
            strokeWidth={isSelected ? 3 : 2}
            markerEnd={isSelected ? 'url(#arrow-active)' : 'url(#arrow)'}
            className="transition-all duration-300" />

          {/* type 라벨 */}
          <g pointerEvents="none">
            <rect x={mx - 42} y={my - 9} width="84" height="16" rx="3"
              fill="#1e293b" opacity="0.9" />
            <text x={mx} y={my + 2} textAnchor="middle" fontSize="10"
              fontFamily="monospace" fontWeight="bold" fill="#ffffff">
              :{edge.type}
            </text>
          </g>

          {/* 엣지 속성 표시 */}
          {hasProps && Object.keys(edge.props || {}).length > 0 && (
            <g pointerEvents="none">
              <rect
                x={mx - 56}
                y={my + 10}
                width="112"
                height="16"
                rx="3"
                fill="#fef3c7"
                stroke="#d97706"
                strokeWidth="1"
              />
              <text
                x={mx}
                y={my + 21}
                textAnchor="middle"
                fontSize="9"
                fontFamily="monospace"
                fill="#92400e"
              >
                {Object.entries(edge.props)
                  .map(([k, v]) => `${k}: ${v}`)
                  .join(', ')}
              </text>
            </g>
          )}
        </g>
      );
    }

    // ─────────────────────────────────────────────────────
    // 속성 패널 — 우측에 펼쳐지는 카드
    // ─────────────────────────────────────────────────────
    function PropPanel({ selected, nodes, edges }) {
      if (!selected) {
        return (
          <div className="rounded-lg bg-slate-50 border border-dashed border-slate-300 p-3 text-center text-xs text-slate-400 italic">
            노드 또는 엣지를 클릭하면 속성이 여기에 표시됩니다
          </div>
        );
      }

      if (selected.kind === 'node') {
        const node = nodes.find((n) => n.id === selected.id);
        if (!node) return null;
        const propEntries = Object.entries(node.props || {});
        return (
          <div className="rounded-lg bg-violet-50 border-2 border-violet-300 p-3 shadow-sm">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[10px] font-bold uppercase tracking-wider text-violet-700">
                Node 속성
              </span>
              {node.indexed && (
                <span className="text-[10px] font-mono bg-violet-700 text-white px-1.5 py-0.5 rounded">
                  🔎 INDEXED
                </span>
              )}
            </div>

            {/* 라벨 칩들 */}
            <div className="flex flex-wrap gap-1 mb-2">
              {node.labels.map((label) => {
                const c = LABEL_COLOR[label] || LABEL_COLOR.Person;
                return (
                  <span key={label}
                    className="text-[10px] font-mono font-bold px-2 py-0.5 rounded"
                    style={{ background: c.stroke, color: c.text }}>:{label}</span>
                );
              })}
            </div>

            {/* 속성 key:value */}
            {propEntries.length === 0 ? (
              <div className="text-[11px] text-slate-400 italic">속성 없음</div>
            ) : (
              <div className="space-y-1 font-mono text-[11px] bg-white rounded p-2 border border-violet-200">
                <div className="text-slate-400 text-[10px]">{`{`}</div>
                {propEntries.map(([k, v], i) => (
                  <div key={k} className="flex pl-3">
                    <span className="text-slate-700 font-bold">{k}</span>
                    <span className="text-slate-500 mx-1">:</span>
                    <span className="text-violet-700">{v}</span>
                    {i < propEntries.length - 1 && <span className="text-slate-400">,</span>}
                  </div>
                ))}
                <div className="text-slate-400 text-[10px]">{`}`}</div>
              </div>
            )}
          </div>
        );
      }

      // 엣지
      const edge = edges.find((e) => e.id === selected.id);
      if (!edge) return null;
      const propEntries = Object.entries(edge.props || {});
      const fromNode = nodes.find((n) => n.id === edge.from);
      const toNode = nodes.find((n) => n.id === edge.to);

      return (
        <div className="rounded-lg bg-amber-50 border-2 border-amber-400 p-3 shadow-sm">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[10px] font-bold uppercase tracking-wider text-amber-700">Edge 속성</span>
            <span className="text-[10px] font-mono bg-amber-700 text-white px-1.5 py-0.5 rounded">:{edge.type}</span>
          </div>
          <div className="text-[11px] text-slate-600 mb-2 font-mono">
            ({fromNode?.name}) → ({toNode?.name})
          </div>
          {propEntries.length === 0 ? (
            <div className="text-[11px] text-slate-400 italic">속성 없음</div>
          ) : (
            <div className="space-y-1 font-mono text-[11px] bg-white rounded p-2 border border-amber-200">
              <div className="text-slate-400 text-[10px]">{`{`}</div>
              {propEntries.map(([k, v], i) => (
                <div key={k} className="flex pl-3">
                  <span className="text-slate-700 font-bold">{k}</span>
                  <span className="text-slate-500 mx-1">:</span>
                  <span className="text-amber-700">{v}</span>
                  {i < propEntries.length - 1 && <span className="text-slate-400">,</span>}
                </div>
              ))}
              <div className="text-slate-400 text-[10px]">{`}`}</div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 그래프 SVG + 속성 패널
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step, stepIdx, localSelected, setLocalSelected }) {
      const { nodes, edges, showIndexBadge, showCount } = step;

      // 노드/엣지 카운트
      const labelSet = new Set();
      nodes.forEach((n) => n.labels.forEach((l) => labelSet.add(l)));
      const indexedCount = nodes.filter((n) => n.indexed).length;

      // SVG 영역
      const svgW = 540;
      const svgH = 360;

      // 클릭 핸들러
      const handleSelect = (sel) => setLocalSelected(sel);

      // 현재 step의 selected (로컬 우선, 없으면 step 기본값)
      const currentSelected = localSelected || step.selected;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📇 그래프 — 라벨 + 속성</h2>
            <span className="text-[10px] text-slate-400 font-mono">
              클릭으로 속성 보기
            </span>
          </div>

          {/* 카운트 카드 */}
          <div className="grid grid-cols-3 gap-2 mb-3">
            <div className="rounded-lg bg-violet-50 border border-violet-300 p-2 text-center">
              <div className="text-[10px] text-violet-700 font-bold uppercase">Nodes</div>
              <div className="text-xl font-extrabold text-violet-700 tabular-nums">
                {nodes.length}
              </div>
            </div>
            <div className="rounded-lg bg-slate-50 border border-slate-300 p-2 text-center">
              <div className="text-[10px] text-slate-600 font-bold uppercase">Labels</div>
              <div className="text-xl font-extrabold text-slate-700 tabular-nums">
                {labelSet.size}
                {showCount && (
                  <span className="text-[10px] text-amber-700 ml-1">+multi</span>
                )}
              </div>
            </div>
            <div className="rounded-lg bg-slate-50 border border-slate-300 p-2 text-center">
              <div className="text-[10px] text-slate-600 font-bold uppercase">Indexes</div>
              <div className="text-xl font-extrabold text-slate-700 tabular-nums">
                {showIndexBadge ? indexedCount : 0}
              </div>
            </div>
          </div>

          {/* 그래프 SVG */}
          <div className="rounded-lg bg-gradient-to-b from-violet-50 to-violet-100 border border-violet-200 p-2 mb-3">
            <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto">
              <defs>
                <marker
                  id="arrow"
                  viewBox="0 0 10 10"
                  refX="9"
                  refY="5"
                  markerWidth="6"
                  markerHeight="6"
                  orient="auto"
                >
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
                </marker>
                <marker
                  id="arrow-active"
                  viewBox="0 0 10 10"
                  refX="9"
                  refY="5"
                  markerWidth="6"
                  markerHeight="6"
                  orient="auto"
                >
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#facc15" />
                </marker>
              </defs>

              {/* 엣지 먼저 (노드 아래에 깔리게) */}
              {edges.map((edge) => {
                const fromNode = nodes.find((n) => n.id === edge.from);
                const toNode = nodes.find((n) => n.id === edge.to);
                if (!fromNode || !toNode) return null;
                const isSelected = currentSelected && currentSelected.kind === 'edge' && currentSelected.id === edge.id;
                return (
                  <EdgeSvg key={edge.id} edge={edge} fromNode={fromNode} toNode={toNode}
                    isSelected={isSelected} onClick={handleSelect} hasProps={true} />
                );
              })}

              {/* 노드 */}
              {nodes.map((node) => {
                const isSelected = currentSelected && currentSelected.kind === 'node' && currentSelected.id === node.id;
                return (
                  <NodeSvg key={`${stepIdx}-${node.id}`} node={node}
                    isSelected={isSelected} onClick={handleSelect} showIndexBadge={showIndexBadge} />
                );
              })}
            </svg>
          </div>

          {/* 속성 패널 */}
          <PropPanel selected={currentSelected} nodes={nodes} edges={edges} />

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: '#a78bfa' }}></span>:Person</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: '#34d399' }}></span>:Company</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: '#fb923c' }}></span>:Engineer</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full" style={{ background: '#f472b6' }}></span>:Designer</span>
            {showIndexBadge && (
              <span className="flex items-center gap-1 ml-auto"><span className="text-[12px]">🔎</span>인덱스</span>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js (cypher 등)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          // cypher는 hljs 기본 미지원 → sql 폴백 (라벨/속성 syntax 비슷)
          const langClass =
            code.lang === 'cypher' ? 'language-sql' : `language-${code.lang}`;
          codeRef.current.className = langClass;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      const langClass = code.lang === 'cypher' ? 'language-sql' : `language-${code.lang}`;
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code (innerHTML 추출) */}
          <pre className="hidden">
            <code ref={codeRef} className={langClass}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-violet-500/15 border-l-2 border-violet-400' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 — 단계 번호 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines · cypher</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      // step 변경 시 localSelected는 초기화 — step.selected가 기본
      const [localSelected, setLocalSelected] = useState(null);

      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
        setLocalSelected(null);
      };

      // step 바뀌면 클릭 선택 초기화
      useEffect(() => {
        setLocalSelected(null);
      }, [stepIdx]);

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 그래프 기초 &gt; Chapter 1. 노드와 엣지</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">속성과 라벨</h1>
                  <p className="text-sm text-slate-500 mt-0.5">주민등록증 — Label(타입 분류) + Property(key-value 데이터)</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx}
                localSelected={localSelected} setLocalSelected={setLocalSelected} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음(II-2-1)에서는 <strong>그래프 모델 vs RDB</strong> — 같은 도메인을 두 모델로 표현했을 때의 차이
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay} aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[100px]">
                {isPlaying ? '⏸ 정지' : stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생'}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-1-1.html" className="text-slate-500 hover:text-slate-700">&larr; II-1-1 노드와 엣지</a>
              <a href="./II-2-1.html" className="text-violet-700 hover:text-violet-900 font-medium">II-2-1 그래프 vs RDB &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
