  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-2-1. 온톨로지 — 도메인 스키마 (클래스/관계 정의)
    학습 목표: 온톨로지가 노드/관계의 어휘 표준을 잡고, 클래스 계층/도메인-레인지/일관성 검증/추론으로
              GraphRAG 품질을 보장하는 과정을 5단계로 이해한다.
    핵심 비유: "조직의 직무 사양서" — 누가 어떤 일을 할 수 있는지 미리 정의 → 누구든 따라 쓰면 일관성
    패턴: fastapi v1 — 좌(LiveDataPane: 클래스 계층 트리 + 인스턴스 그래프 SVG) / 우(VSCode CodeViewer)
    색상: graphrag violet
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 단계별 데이터 — 클래스 트리 + 인스턴스 그래프 + 검증/추론 상태
    //   classTree   : 좌측 클래스 계층 트리 (null이면 온톨로지 없음)
    //   instances   : 노드 배열 (mixed=Step1 색상 제각각, typed=클래스 정의 후)
    //   edges       : 엣지 배열 (ok=true 정상 / ok=false 위반 / isInferred 점선)
    //   ontologyDefined / hasDomainRange / showViolation / showInference : 단계별 토글
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      noOnto: {lang:"python", filename:"extract-no-ontology.py", lines:[
        "# 온톨로지 없이 LLM에 그냥 \"엔티티 뽑아\"라고 시키면",
        "from openai import OpenAI",
        "",
        "def extract(text: str) -> list[dict]:",
        "    prompt = f\"이 문서에서 엔티티와 관계를 추출해.\\n{text}\"",
        "    return llm.chat(prompt).json()",
        "",
        "# 문서 A → \"김철수가 Acme에 다닌다\"",
        "#   → (:Person {name:\"김철수\"})-[:WORKS_AT]->(:Company)",
        "# 문서 B → \"유저 김철수가 Acme를 이용\"",
        "#   → (:User {name:\"김철수\"})-[:USES]->(:Org)",
        "# 문서 C → \"회원 김철수가 Acme 소속\"",
        "#   → (:Member {name:\"김철수\"})-[:BELONGS_TO]->(:Firm)",
        "",
        "# 결과 — 같은 김철수가 그래프에서 3명!",
        "# MATCH (p:Person {name:\"김철수\"})  → 1명",
        "# MATCH (u:User   {name:\"김철수\"})  → 또 1명",
        "# MATCH (m:Member {name:\"김철수\"})  → 또또 1명",
        "#",
        "# 검색·집계·추론이 전부 깨진다.",
        "# → 라벨 표준이 필요하다 = 온톨로지",
      ]},
      ontology: {lang:"turtle", filename:"ontology.ttl", lines:[
        "# RDF/Turtle 형식 — 클래스 계층 선언",
        "@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .",
        "@prefix :    <http://example.com/onto#> .",
        "",
        "# 최상위 클래스",
        ":Entity   a rdfs:Class .",
        "",
        "# Person 계층",
        ":Person   a rdfs:Class ;",
        "          rdfs:subClassOf :Entity .",
        ":Employee a rdfs:Class ;",
        "          rdfs:subClassOf :Person .  # Employee ⊂ Person",
        "",
        "# Organization 계층",
        ":Org      a rdfs:Class ;",
        "          rdfs:subClassOf :Entity .",
        ":Company  a rdfs:Class ;",
        "          rdfs:subClassOf :Org .     # Company ⊂ Org",
        "",
        "# 인스턴스는 정확히 한 클래스에 매핑",
        ":kim     a :Employee ; :name \"김철수\" .",
        ":lee     a :Employee ; :name \"이영희\" .",
        ":acme    a :Company  ; :name \"Acme\"   .",
        ":beta    a :Company  ; :name \"Beta\"   .",
      ]},
      domainRange: {lang:"yaml", filename:"domain-range.yaml", lines:[
        "# 관계의 도메인(출발)과 레인지(도착) 클래스 선언",
        "relations:",
        "  WORKS_AT:",
        "    domain: Person     # 출발: Person (또는 그 하위)",
        "    range:  Company    # 도착: Company",
        "    desc:   \"사람이 어느 회사에 다니는가\"",
        "",
        "  EMPLOYS:",
        "    domain: Company    # 역방향 관계",
        "    range:  Person",
        "    inverse_of: WORKS_AT",
        "",
        "  LOCATED_IN:",
        "    domain: Company",
        "    range:  City",
        "",
        "# 인스턴스 적용 (정상)",

    // 인스턴스 색상 (SVG hex)
    const NODE_COLOR = {
      violet: { fill: '#8b5cf6', stroke: '#6d28d9', text: '#ffffff' },
      amber:  { fill: '#f59e0b', stroke: '#b45309', text: '#ffffff' },

    };

    // 클래스 계층 트리 (재귀 렌더, highlightClasses는 배경 강조)
    function ClassTreeNode({ node, depth, highlightClasses }) {
      const isHighlighted = highlightClasses && highlightClasses.includes(node.name);
      return (
        <div className="relative">
          <div className="flex items-center gap-1" style={{ marginLeft: depth * 14 }}>
            {depth > 0 && <span className="text-violet-400 select-none">└▸</span>}
            <div
              className={`rounded-md px-2 py-1 border text-[11px] font-mono font-bold transition-all duration-500 ${
                isHighlighted
                  ? 'bg-violet-200 border-violet-500 text-violet-900 shadow-sm'
                  : 'bg-violet-50 border-violet-200 text-violet-700'
              }`}
            >
              :{node.name}
            </div>
          </div>
          {node.children && node.children.length > 0 && (
            <div className="mt-1 space-y-1">
              {node.children.map((child) => (
                <ClassTreeNode
                  key={child.name}
                  node={child}
                  depth={depth + 1}
                  highlightClasses={highlightClasses}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function ClassTreePane({ tree, highlightClasses, ontologyDefined }) {
      if (!ontologyDefined || !tree) {
        return (
          <div className="bg-rose-50 border-2 border-rose-300 rounded-lg p-3 h-full flex flex-col items-center justify-center text-center">

            <div className="text-xs font-bold text-rose-700 mb-1">온톨로지 없음</div>

              아무 라벨이나 등장

        );

      return (

          <div className="text-[10px] font-bold text-violet-700 mb-2 flex items-center gap-1">
            🌳 클래스 계층
          </div>
          <div className="space-y-1">
            <ClassTreeNode node={tree} depth={0} highlightClasses={highlightClasses} />
          </div>

      );
    }

    // 인스턴스 그래프 SVG — 노드 + 엣지 (정상/위반/추론)
    function InstanceGraphSvg({ instances, edges, showViolation, showInference, hasDomainRange }) {
      const svgW = 560;
      const svgH = 290;

      // 노드 ID로 인스턴스 찾기
      const findById = (id) => instances.find((n) => n.id === id);

      const NODE_W = 110;
      const NODE_H = 44;

      return (
        <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto">
          {/* SVG 화살표 마커 (정상 violet / 위반 red / 추론 emerald) */}
          <defs>
            {[
              { id: 'arrow-violet',  fill: '#7c3aed' },
              { id: 'arrow-red',     fill: '#dc2626' },
              { id: 'arrow-emerald', fill: '#059669' },
            ].map((m) => (
              <marker key={m.id} id={m.id} viewBox="0 0 10 10" refX="9" refY="5"
                      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill={m.fill} />
              </marker>
            ))}
          </defs>

          {/* 엣지 먼저 (노드 뒤에 깔리도록) */}
          {edges.map((edge, idx) => {
            const from = findById(edge.from);
            const to = findById(edge.to);
            if (!from || !to) return null;

            // 노드 중심 좌표 + 박스 가장자리에서 시작/끝
            const fromCx = from.x + NODE_W / 2;
            const fromCy = from.y + NODE_H / 2;
            const toCx = to.x + NODE_W / 2;
            const toCy = to.y + NODE_H / 2;

            // 단순화: 박스 가장자리 근사 (수평 우선)
            const dx = toCx - fromCx;
            const dy = toCy - fromCy;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            let x1 = fromCx, y1 = fromCy, x2 = toCx, y2 = toCy;
            if (absDx > absDy) {
              const sign = dx > 0 ? 1 : -1;
              x1 = fromCx + (NODE_W / 2) * sign;
              x2 = toCx - (NODE_W / 2) * sign;
            } else {
              const sign = dy > 0 ? 1 : -1;
              y1 = fromCy + (NODE_H / 2) * sign;
              y2 = toCy - (NODE_H / 2) * sign;
            }

            // 색상 / 스타일 결정
            let stroke = '#7c3aed';
            let marker = 'url(#arrow-violet)';
            let strokeDasharray = 'none';
            let labelBg = '#ede9fe';
            let labelText = '#6d28d9';

            if (edge.ok === false) {
              stroke = '#dc2626';
              marker = 'url(#arrow-red)';
              labelBg = '#fee2e2';
              labelText = '#991b1b';
            } else if (edge.isInferred) {
              stroke = '#059669';
              marker = 'url(#arrow-emerald)';
              strokeDasharray = '6 4';
              labelBg = '#d1fae5';
              labelText = '#065f46';
            }

            // 라벨 위치 (선 중앙)
            const labelX = (x1 + x2) / 2;
            const labelY = (y1 + y2) / 2;
            const labelW = Math.max(70, edge.type.length * 7 + 10);

            return (
              <g key={`edge-${idx}`}>
                <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={stroke}
                      strokeWidth={edge.ok === false ? 2.5 : 2}
                      strokeDasharray={strokeDasharray} markerEnd={marker}
                      className="transition-all duration-700" />
                {/* 라벨 박스 */}
                <rect x={labelX - labelW / 2} y={labelY - 9} width={labelW} height={18}
                      rx={4} fill={labelBg} stroke={stroke} strokeWidth={1} />
                <text x={labelX} y={labelY + 4} textAnchor="middle" fontSize={10}
                      fontFamily="monospace" fontWeight="bold" fill={labelText}>
                  {edge.isInferred ? '⤳ ' : ''}:{edge.type}
                </text>

                {/* 위반 시 빨간 X 표시 (선 중앙 위쪽) */}
                {showViolation && edge.ok === false && (
                  <g>
                    <circle cx={labelX} cy={labelY - 24} r={11} fill="#dc2626" stroke="#7f1d1d" strokeWidth={1.5} />
                    <text x={labelX} y={labelY - 20} textAnchor="middle" fontSize={14} fontWeight="bold" fill="#ffffff">✗</text>
                  </g>
                )}
              </g>
            );
          })}

          {/* 노드 — mixed(Step1)는 색상 직접, typed는 NODE_COLOR 매핑 */}
          {instances.map((node) => {
            const isMixed = node.kind === 'mixed';
            const fill = isMixed ? node.mixedColor : (NODE_COLOR[node.color] || NODE_COLOR.violet).fill;
            const stroke = isMixed ? '#1e293b' : (NODE_COLOR[node.color] || NODE_COLOR.violet).stroke;
            const inferred = showInference && node.inferredLabels;
            return (
              <g key={node.id}>
                <rect x={node.x} y={node.y} width={NODE_W} height={NODE_H} rx={8}
                      fill={fill} stroke={stroke} strokeWidth={isMixed ? 1 : 2}
                      opacity={isMixed ? 0.85 : 1} className="transition-all duration-500" />
                <text x={node.x + NODE_W / 2} y={node.y + 16} textAnchor="middle"
                      fontSize={9} fontFamily="monospace" fontWeight="bold" fill="#ffffff">
                  :{node.label}
                </text>
                <text x={node.x + NODE_W / 2} y={node.y + 32} textAnchor="middle"
                      fontSize={11} fontWeight="bold" fill="#ffffff">
                  {node.name}
                </text>
                {/* 추론된 상위 라벨 */}
                {inferred && (
                  <text x={node.x + NODE_W / 2} y={node.y + NODE_H + 12} textAnchor="middle"
                        fontSize={9} fontFamily="monospace" fill="#059669" fontWeight="bold">
                    ⤳ :{node.inferredLabels.join(', :')}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      );
    }

    // LiveDataPane — 좌(클래스 트리) / 우(인스턴스 그래프)
    function LiveDataPane({ beat, step }) {
      const totalNodes = step.instances.length;
      const distinctLabels = new Set(step.instances.map((n) => n.label)).size;
      const totalEdges = step.edges.length;
      const violationCount = step.edges.filter((e) => e.ok === false).length;
      const inferredCount = step.edges.filter((e) => e.isInferred).length;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📚 도메인 온톨로지 — 클래스 ↔ 인스턴스</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 요약 카운트 */}
          <div className="grid grid-cols-4 gap-2 mb-3">
            <div className="rounded-lg bg-violet-50 border border-violet-300 p-2 text-center">
              <div className="text-[9px] text-violet-700 font-bold uppercase">Nodes</div>
              <div className="text-lg font-extrabold text-violet-700 tabular-nums">{totalNodes}</div>
            </div>
            <div className="rounded-lg bg-slate-50 border border-slate-300 p-2 text-center">
              <div className="text-[9px] text-slate-600 font-bold uppercase">Labels</div>
              <div className="text-lg font-extrabold text-slate-700 tabular-nums">
                {distinctLabels}
                {!step.ontologyDefined && (
                  <span className="text-[9px] text-rose-600 ml-0.5">⚠</span>
                )}
              </div>
            </div>
            <div className="rounded-lg bg-slate-50 border border-slate-300 p-2 text-center">
              <div className="text-[9px] text-slate-600 font-bold uppercase">Edges</div>
              <div className="text-lg font-extrabold text-slate-700 tabular-nums">{totalEdges}</div>
            </div>
            <div className="rounded-lg bg-slate-50 border border-slate-300 p-2 text-center">
              <div className="text-[9px] text-slate-600 font-bold uppercase">
                {step.showViolation ? 'Violation' : (step.showInference ? 'Inferred' : 'Status')}
              </div>
              <div className={`text-lg font-extrabold tabular-nums ${
                violationCount > 0 ? 'text-red-600' :
                inferredCount > 0 ? 'text-emerald-600' : 'text-slate-700'
              }`}>
                {step.showViolation
                  ? violationCount
                  : step.showInference
                    ? inferredCount
                    : (step.ontologyDefined ? '✓' : '?')}
              </div>
            </div>
          </div>

          {/* 좌(트리) / 우(그래프) 분할 — 트리는 너비 비율 작게 */}
          <div className="grid grid-cols-5 gap-2 mb-3">
            {/* 좌측: 클래스 계층 트리 */}
            <div className="col-span-2 min-h-[290px]">
              <ClassTreePane
                tree={step.classTree}
                highlightClasses={step.highlightClasses}
                ontologyDefined={step.ontologyDefined}
              />
            </div>
            {/* 우측: 인스턴스 그래프 SVG */}
            <div className="col-span-3 rounded-lg bg-gradient-to-br from-violet-50 via-white to-amber-50 border border-violet-200 p-1">
              <InstanceGraphSvg
                instances={step.instances}
                edges={step.edges}
                showViolation={step.showViolation}
                showInference={step.showInference}
                hasDomainRange={step.hasDomainRange}
              />
            </div>
          </div>

          {/* 단계별 상태 배너 */}
          {!step.ontologyDefined && (
            <div className="p-2.5 rounded-lg bg-rose-50 border-2 border-rose-300 text-rose-800 text-xs font-bold animate-pulse mb-2">
              ⚠ 라벨 표준 없음 — 같은 인물이 {distinctLabels}개 라벨로 분리됨
            </div>
          )}
          {step.ontologyDefined && !step.hasDomainRange && (
            <div className="p-2.5 rounded-lg bg-violet-50 border-2 border-violet-300 text-violet-900 text-xs font-bold mb-2">
              📜 클래스 계층 정의됨 — 다음: 관계의 domain/range 선언
            </div>
          )}
          {step.hasDomainRange && !step.showViolation && !step.showInference && (
            <div className="p-2.5 rounded-lg bg-violet-50 border-2 border-violet-300 text-violet-900 text-xs font-bold mb-2">
              ✅ WORKS_AT: Person → Company — 도메인/레인지 적용
            </div>
          )}
          {step.showViolation && (
            <div className="p-2.5 rounded-lg bg-red-50 border-2 border-red-400 text-red-800 text-xs font-bold animate-pulse mb-2">
              🚨 위반 검출 — Company → WORKS_AT → City (domain은 Person이어야 함) → 적재 거부
            </div>
          )}
          {step.showInference && (
            <div className="p-2.5 rounded-lg bg-emerald-50 border-2 border-emerald-400 text-emerald-900 text-xs font-bold mb-2">
              💡 추론 활성 — Employee → Person/Entity 자동 부여, EMPLOYS 역관계 자동 생성 (점선)
            </div>
          )}

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm" style={{ background: '#8b5cf6' }}></span>Person 계열
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm" style={{ background: '#f59e0b' }}></span>Company 계열
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5" style={{ background: '#7c3aed' }}></span>정상 관계
            </span>
            {step.showInference && (
              <span className="flex items-center gap-1">
                <span className="w-3 border-t-2 border-dashed" style={{ borderColor: '#059669' }}></span>추론 관계
              </span>
            )}
            {step.showViolation && (
              <span className="flex items-center gap-1 ml-auto">
                <span className="w-2.5 h-2.5 rounded-full bg-red-600 text-white text-[8px] flex items-center justify-center font-bold">✗</span>위반
              </span>
            )}
          </div>
        </div>
      );
    }

    // VSCode 스타일 CodeViewer — highlight.js
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-violet-500/15 border-l-2 border-violet-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // App 메인
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 그래프 인덱싱 &gt; Chapter 2. 도메인 모델링</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">온톨로지 — 도메인 스키마 (클래스/관계 정의)</h1>
                  <p className="text-sm text-slate-500 mt-0.5">조직의 직무 사양서 — 라벨 표준 + 관계 도메인/레인지 + 일관성 검증 + 추론</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음(II-2-2)에서는 <strong>스키마 vs 자유 그래프</strong> — 사양서 강제 정도와 유연성의 trade-off
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로"
                      className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계"
                      className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                      className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[100px]">
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계"
                      className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./II-2-2.html" className="text-violet-700 hover:text-violet-900 font-medium">II-2-2 스키마 vs 자유 그래프 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
