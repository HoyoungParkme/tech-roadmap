  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-3-1. 평가 지표 — RAGAS 4축
    학습 목표: GraphRAG 답변 품질을 4 지표(Faithfulness / Answer Relevancy / Context Recall / Context Precision)로 측정한다.
    핵심 비유: "성적표" — 답이 사실에 충실한가, 질문에 부합하는가, 빠진 정보 없는가, 노이즈 적은가
    패턴: fastapi v1 패턴 — 좌(LiveDataPane 4 metric bar chart) / 우(VSCode CodeViewer)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 메트릭 메타 (이름/아이콘 고정)
    // ─────────────────────────────────────────────────────
    const METRIC_META = [
      { key: 'faith',     emoji: '🎯', name: 'Faithfulness',      sub: '그래프 사실과 일치' },
      { key: 'relevancy', emoji: '🧭', name: 'Answer Relevancy',  sub: '질문에 부합' },
      { key: 'recall',    emoji: '📥', name: 'Context Recall',    sub: 'ground truth 포함률' },
      { key: 'precision', emoji: '✂️', name: 'Context Precision', sub: '노이즈 적은 정도' },
    ];

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    // dataState.metrics[key] = { score: 0~1, state: 'good'|'warn'|'crit'|'unknown', focus: bool }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      faith: {lang: 'python', filename: 'evaluate.py', lines: [
        '"""Faithfulness 측정 — RAGAS 표준 메트릭"""',
        'from ragas import evaluate',
        'from ragas.metrics import faithfulness',
        'from datasets import Dataset',
        '',
        '# GraphRAG 결과 1건 평가용 데이터셋',
        'sample = {',
        '    "question":   "잡스가 공동 창업한 회사는?",',
        '    "answer":     "잡스는 1976년 워즈니악과 애플을, 1986년 MS도 공동 창업했다.",',
        '    "contexts":   [  # 그래프 traverse 결과',
        '        "(Jobs)-[founded:1976]->(Apple)",',
        '        "(Wozniak)-[co_founded]->(Apple)",',
        '    ],',
        '    "ground_truth": "잡스는 워즈니악과 함께 애플을 공동 창업했다.",',
        '}',
        'ds = Dataset.from_list([sample])',
        '',
        '# Faithfulness: 답변의 각 문장이 contexts에서 추론 가능한가?',
        'result = evaluate(ds, metrics=[faithfulness])',
        'print(result["faithfulness"])  # → 0.40 (낮음 = hallucination)',
        '',
        '# 내부 동작:',
        '#   1) 답변을 claims로 분해 ["잡스가 애플 창업", "MS도 창업"]',
        '#   2) 각 claim을 contexts와 LLM이 NLI 비교',
        '#   3) supported / total = 1/2 = 0.50 → 보정 후 0.40',
      ]},
      relevancy: {lang: 'python', filename: 'evaluate.py', lines: [
        '"""Answer Relevancy 측정"""',
        'from ragas.metrics import answer_relevancy',
        '',
        'sample = {',
        '    "question": "애플의 창업자는 누구인가?",',
        '    "answer":   "애플은 1976년에 캘리포니아에서 만들어진 회사이다.",',
        '    "contexts": [',
        '        "(Jobs)-[founded]->(Apple)",',
        '        "(Apple)-[located_in]->(California)",',
        '    ],',
        '}',
        '',
        'result = evaluate(ds, metrics=[answer_relevancy])',
        'print(result["answer_relevancy"])  # → 0.30 (off-topic)',
        '',
        '# 내부 동작:',
        '#   1) LLM이 답변에서 역으로 질문 N개 생성',
        '#      → ["애플은 언제 창업?", "애플 위치는?", ...]',
        '#   2) 생성 질문 ↔ 원래 질문 embedding cosine 유사도',
        '#   3) 평균값이 relevancy score',
        '',
        '# 실무 팁: faithfulness 높아도 relevancy 낮으면',
        '#   → 모델이 "안전하게 일반론으로 회피"하는 패턴',
        '#   → 프롬프트에 "질문에 직접 답하라" 추가',
      ]},
      recall: {lang: 'python', filename: 'evaluate.py', lines: [
        '"""Context Recall — ground truth 포함률"""',
        'from ragas.metrics import context_recall',
        '',
        'sample = {',
        '    "question": "애플 창업자 4명을 모두 알려줘",',
        '    "answer":   "잡스, 워즈니악이 공동 창업했다.",',
        '    "contexts": [  # 1-hop만 가져옴',
        '        "(Jobs)-[founded]->(Apple)",',
        '        "(Wozniak)-[co_founded]->(Apple)",',

            {mark: 'read', text: 'graphrag_answer → answer 매핑'},
          ],
        },
        focusMetric: 'overall',
        sample: { question: 'Q: "잡스가 공동 창업한 회사는?"', answer: 'A: "잡스는 1976년 워즈니악과 함께 애플을 공동 창업했다."', verdict: '50문항 golden set 기준 평균 — 대표 케이스 1건을 표시한다.', isBad: false },
        dataState: { metrics: { faith: { score: 0.95, state: 'good', focus: true }, relevancy: { score: 0.92, state: 'good', focus: true }, recall: { score: 0.88, state: 'good', focus: true }, precision: { score: 0.82, state: 'good', focus: true } }, overall: 0.89, alert: null },
        code: {...CODE.config, highlight: [16, 17, 18, 19, 20, 21, 22]},
      },
      { ...S5,
        beat: {
          label: '임계치로 회귀 차단',
          at: 'ragas-config.yaml L24–28',
          caption: '지표별 하한을 정해 두면 PR 이 이 선을 넘지 못할 때 CI 가 막는다.',
          changes: [
            {mark: 'new', text: '임계치 4개 설정'},
            {mark: 'read', text: '4개 모두 통과 (0.82 > 0.70)'},
          ],
        },
        focusMetric: 'overall',
        sample: { question: 'Q: "잡스가 공동 창업한 회사는?"', answer: 'A: "잡스는 1976년 워즈니악과 함께 애플을 공동 창업했다."', verdict: '임계치 4개 모두 통과 — 회귀 없음.', isBad: false },
        dataState: { metrics: { faith: { score: 0.95, state: 'good', focus: true }, relevancy: { score: 0.92, state: 'good', focus: true }, recall: { score: 0.88, state: 'good', focus: true }, precision: { score: 0.82, state: 'good', focus: true } }, overall: 0.89, alert: null },
        code: {...CODE.config, highlight: [24, 25, 26, 27, 28]},
      },
      { ...S5,
        beat: {
          label: '리포트와 대안 도구',
          at: 'ragas-config.yaml L30–36',
          caption: '결과를 metrics.json 으로 떨군다. TruLens 는 trace, DeepEval 은 pytest 쪽이 강하다.',
          changes: [
            {mark: 'new', text: 'metrics.json 출력'},
            {mark: 'read', text: 'TruLens · DeepEval 대안'},
          ],
        },
        focusMetric: 'overall',
        sample: { question: 'Q: "잡스가 공동 창업한 회사는?"', answer: 'A: "잡스는 1976년 워즈니악과 함께 애플을 공동 창업했다."', verdict: '✅ 4지표 모두 양호 — Faithfulness 0.95 / Relevancy 0.92 / Recall 0.88 / Precision 0.82', isBad: false },
        dataState: { metrics: { faith: { score: 0.95, state: 'good', focus: true }, relevancy: { score: 0.92, state: 'good', focus: true }, recall: { score: 0.88, state: 'good', focus: true }, precision: { score: 0.82, state: 'good', focus: true } }, overall: 0.89, alert: null },
        code: {...CODE.config, highlight: [30, 31, 32, 33, 34, 35, 36]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 정적 Tailwind 클래스 (purge 안전)
    // ─────────────────────────────────────────────────────
    const STATE_STYLE = {
      unknown: { card: 'bg-slate-100 border-slate-300', value: 'text-slate-400', bar: 'bg-slate-300', badge: 'bg-slate-200 text-slate-500', label: '—' },
      good:    { card: 'bg-emerald-50 border-emerald-300', value: 'text-emerald-700', bar: 'bg-emerald-400', badge: 'bg-emerald-100 text-emerald-700', label: 'OK' },
      warn:    { card: 'bg-yellow-50 border-yellow-400',   value: 'text-yellow-700',  bar: 'bg-yellow-400',  badge: 'bg-yellow-100 text-yellow-700',   label: '주의' },
      crit:    { card: 'bg-red-50 border-red-500',         value: 'text-red-700',     bar: 'bg-red-500',     badge: 'bg-red-100 text-red-700',         label: '위험' },
    };

    const FOCUS_RING = 'ring-2 ring-violet-500 ring-offset-2 ring-offset-white shadow-lg scale-[1.02]';

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 4 지표 막대 그래프 + 종합 점수 카드
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, dataState, sample, focusMetric }) {
      const { metrics, overall, alert } = dataState;

      // 종합 점수 색상
      const overallState =
        overall >= 0.85 ? 'good' :
        overall >= 0.70 ? 'warn' : 'crit';
      const overallStyle = STATE_STYLE[overallState];

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">📊 RAGAS 평가 대시보드</h2>
            <span className="text-[10px] text-slate-400 font-mono">4 metrics · 0~1 scale</span>
          </div>

          {/* 4 지표 막대 그래프 */}
          <div className="space-y-2.5 mb-4">
            {METRIC_META.map((m) => {
              const d = metrics[m.key];
              const style = STATE_STYLE[d.state];
              const isFocused = d.focus;
              const pct = Math.round(d.score * 100);
              const isCrit = d.state === 'crit';

              return (
                <div
                  key={m.key}
                  className={`rounded-lg border-2 p-2.5 transition-all duration-500 ${style.card} ${isFocused ? FOCUS_RING : 'opacity-70'} ${isCrit && isFocused ? 'animate-pulse' : ''}`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <div className="flex items-center gap-1.5">
                      <span aria-hidden="true">{m.emoji}</span>
                      <span className="text-xs font-bold text-slate-700">{m.name}</span>
                      {isFocused && <span className="text-[9px] text-violet-700 font-mono bg-violet-100 px-1.5 py-0.5 rounded">FOCUS</span>}
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${style.badge}`}>
                        {isCrit ? '🚨 ' : ''}{style.label}
                      </span>
                      <span className={`text-base font-extrabold tabular-nums ${style.value} w-12 text-right`}>
                        {d.score.toFixed(2)}
                      </span>
                    </div>
                  </div>

                  {/* 막대 그래프 */}
                  <div className="relative h-2.5 bg-slate-100 rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all duration-700 ${style.bar}`}
                      style={{ width: `${pct}%` }}
                    />
                    {/* 임계치 라인 (0.75 표시) */}
                    <div
                      className="absolute top-0 bottom-0 w-px bg-slate-400"
                      style={{ left: '75%' }}
                      aria-hidden="true"
                      title="임계치 0.75"
                    />
                  </div>

                  <div className="text-[10px] text-slate-500 mt-1">{m.sub}</div>
                </div>
              );
            })}
          </div>

          {/* 알람 박스 (위험 케이스) */}
          {alert && (
            <div className="mb-4 p-3 rounded-lg bg-red-50 border-2 border-red-400 animate-pulse">
              <div className="flex items-center gap-2 text-red-800 font-bold text-sm">
                <span>{alert.text}</span>
              </div>
              <div className="text-[10px] text-red-700 mt-1 font-mono uppercase">
                kind = {alert.kind}
              </div>
            </div>
          )}

          {/* 종합 점수 카드 */}
          <div className={`rounded-lg border-2 p-3 ${overallStyle.card} ${focusMetric === 'overall' ? FOCUS_RING : ''}`}>
            <div className="flex items-center justify-between mb-1">
              <span className="text-xs font-bold text-slate-700">📈 종합 점수 (4 metrics 평균)</span>
              <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${overallStyle.badge}`}>
                {overallStyle.label}
              </span>
            </div>
            <div className="flex items-end gap-2">
              <span className={`text-3xl font-extrabold tabular-nums ${overallStyle.value}`}>{overall.toFixed(2)}</span>
              <span className="text-xs text-slate-500 mb-1">/ 1.00</span>
            </div>
            <div className="relative h-2 bg-slate-100 rounded-full overflow-hidden mt-1.5">
              <div
                className={`h-full transition-all duration-700 ${overallStyle.bar}`}
                style={{ width: `${Math.round(overall * 100)}%` }}
              />
            </div>
          </div>

          {/* 샘플 케이스 (Q&A + 평가) */}
          <div className={`mt-4 p-3 rounded-lg border ${sample.isBad ? 'bg-rose-50 border-rose-200' : 'bg-emerald-50 border-emerald-200'}`}>
            <div className="text-[10px] font-bold text-slate-600 mb-1 uppercase tracking-wider">샘플 평가</div>
            <div className="text-[11px] text-slate-700 mb-1"><span className="font-mono">{sample.question}</span></div>
            <div className="text-[11px] text-slate-700 mb-2"><span className="font-mono">{sample.answer}</span></div>
            <div className={`text-[10px] font-medium ${sample.isBad ? 'text-rose-700' : 'text-emerald-700'}`}>
              {sample.isBad ? '❌ ' : '✅ '}{sample.verdict}
            </div>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-400"></span>OK (≥0.85)</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-yellow-400"></span>주의 (0.70~0.85)</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-red-500"></span>위험 (&lt;0.70)</span>
            <span className="flex items-center gap-1 ml-auto"><span className="w-px h-3 bg-slate-400"></span>임계치 0.75</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // 파일명 탭 (evaluate.py / ragas-config.yaml / metrics.json)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      // 파일명 탭 — 현재 step의 filename + 다른 lang 표시
      const FILE_TABS = [
        { name: 'evaluate.py',       lang: 'python' },
        { name: 'ragas-config.yaml', lang: 'yaml' },
        { name: 'metrics.json',      lang: 'json' },
      ];

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 (활성 탭 강조) */}
          <div className="bg-[#21252b] border-b border-slate-700">
            <div className="px-4 py-2 flex items-center gap-2">
              <div className="flex gap-1.5">
                <span className="w-3 h-3 rounded-full bg-red-500"></span>
                <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span className="w-3 h-3 rounded-full bg-green-500"></span>
              </div>
              <span className="ml-2 text-[10px] text-slate-500 font-mono uppercase">RAGAS evaluator</span>
              <span className="ml-auto text-[10px] text-slate-500 font-mono">{code.lang}</span>
            </div>
            <div className="flex border-t border-slate-700">
              {FILE_TABS.map((t) => {
                const active = t.name === code.filename;
                return (
                  <div
                    key={t.name}
                    className={`px-3 py-1.5 text-xs font-mono border-r border-slate-700 ${active
                      ? 'bg-[#282c34] text-violet-300 border-t-2 border-t-violet-500'
                      : 'bg-[#21252b] text-slate-500'}`}
                  >
                    {t.name}
                  </div>
                );
              })}
            </div>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-violet-500/15 border-l-2 border-violet-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines · {code.filename}</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-3-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. 평가 &amp; 운영 &gt; Chapter 3. 품질 측정</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">평가 지표</h1>
                  <p className="text-sm text-slate-500 mt-0.5">성적표 — Faithfulness / Answer Relevancy / Context Recall / Context Precision</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat}
                dataState={step.dataState}
                sample={step.sample}
                focusMetric={step.focusMetric}
              />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 안내 */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음 학습은 <strong>허브에서</strong> — 4 지표를 CI에 붙여 회귀 테스트 자동화하면 GraphRAG가 production-ready
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./IV-2-2.html" className="text-slate-500 hover:text-slate-700">&larr; IV-2-2</a>
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">허브로 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
