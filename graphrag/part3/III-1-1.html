  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-1-1. Neo4j 개론 — 대표 Property Graph DB
    학습 목표: Neo4j를 직접 띄우고(Step 1), 접속하고(Step 2), 첫 데이터를 넣어보고(Step 3),
              내부 아키텍처(Step 4)와 클러스터(Step 5)까지 5단계로 이해한다.
    핵심 비유: "그래프 노트북 한 권" — 컨테이너 1개로 시작해 점점 컴포넌트가 붙는다
    패턴: fastapi v1 — 좌(LiveDataPane: Neo4j 컨테이너 박스 + 단계별 컴포넌트 확장 + Cypher 미리보기) /
                       우(VSCode CodeViewer)
    색상: violet
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터
    //  components — Neo4j 박스 안에 표시될 내부 컴포넌트들 (단계마다 추가)
    //  external   — 박스 바깥 클라이언트 / 클러스터 노드
    //  graph      — Cypher 결과 미리보기 (노드/관계)
    //  cypher     — 입력창에 표시될 Cypher 쿼리
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      docker: {lang:"bash", filename:"docker-run.sh", lines:[
        "# Neo4j Community 5.x — Docker 한 줄로 시작",
        "# 7474 = Browser UI (HTTP),  7687 = Bolt (앱 연결)",
        "",
        "docker run -d \\",
        "  --name neo4j \\",
        "  -p 7474:7474 -p 7687:7687 \\",
        "  -e NEO4J_AUTH=neo4j/test12345 \\",
        "  -v $HOME/neo4j/data:/data \\",
        "  -v $HOME/neo4j/logs:/logs \\",
        "  neo4j:5",
        "",
        "# 30초 뒤 헬스체크",
        "$ docker logs neo4j | tail -3",
        "Bolt enabled on 0.0.0.0:7687.",
        "HTTP enabled on 0.0.0.0:7474.",
        "Started.",
        "",
        "# Tip: 데이터 볼륨을 호스트에 mount해야",
        "#      컨테이너 재시작 시에도 그래프가 살아남는다.",
      ]},
      connect: {lang:"python", filename:"connect.py", lines:[
        "\"\"\"",
        "Neo4j 접속 테스트 — 공식 driver 한 번이면 끝",
        "경로: scripts/connect.py",
        "목적: Browser(7474) 접속 + Python driver(7687) 연결 확인",
        "\"\"\"",
        "from neo4j import GraphDatabase",
        "",
        "URI  = \"bolt://localhost:7687\"     # Bolt 프로토콜",
        "AUTH = (\"neo4j\", \"test12345\")      # Browser에서 변경한 PW",
        "",
        "driver = GraphDatabase.driver(URI, auth=AUTH)",
        "driver.verify_connectivity()       # ping",
        "",
        "with driver.session() as s:",
        "    record = s.run(\"RETURN 1 AS hello\").single()",
        "    print(record[\"hello\"])         # → 1",
        "",
        "driver.close()",
        "",
        "# Browser UI 접속 (별도 창)",
        "#   1) http://localhost:7474 열기",
        "#   2) 초기 PW(neo4j) → 새 PW(test12345)로 변경",
        "#   3) 좌측 사이드바 \"Database Information\" 확인",
      ]},
      create: {lang:"cypher", filename:"first-create.cypher", lines:[
        "// 첫 그래프 — 인물 2명 + KNOWS 관계 1개",
        "// 노드 표기:    (변수:Label {속성})",
        "// 관계 표기:    -[:TYPE {속성}]->",
        "",
        "CREATE (a:Person {name: \"Alice\", age: 30})",
        "CREATE (b:Person {name: \"Bob\",   age: 28})",
        "CREATE (a)-[:KNOWS {since: 2020}]->(b)",
        "RETURN a, b;",
        "",
        "// 한 줄로도 가능 — 같은 결과",
        "CREATE (a:Person {name: \"Alice\"})",
        "       -[:KNOWS {since: 2020}]->",
        "       (b:Person {name: \"Bob\"})",
        "RETURN a, b;",
        "",
        "// 결과 (Browser에 그래프로 즉시 표시)",
        "//   Created 2 nodes, created 1 relationship,",
        "//   set 5 properties, completed after 12 ms.",
        "",
        "// Tip: SQL은 INSERT 3번 + JOIN으로 표현하지만",
        "//      Cypher는 그림 그대로를 한 줄로 쓴다.",
      ]},
      arch: {lang:"yaml", filename:"architecture.yaml", lines:[
        "# Neo4j 내부 아키텍처 — 3 레이어",
        "neo4j:",
        "  # 1) Bolt Listener — 클라이언트 프로토콜 종단",
        "  bolt:",
        "    port: 7687",
        "    encoding: binary    # PackStream",
        "",
        "  # 2) Cypher Engine — 쿼리 처리",
        "  cypher_engine:",
        "    parser:    \"Cypher → AST\"",
        "    planner:   \"AST → Logical Plan → Physical Plan\"",
        "    runtime:   [\"interpreted\", \"slotted\", \"pipelined\"]",
        "",

    // ─────────────────────────────────────────────────────
    // GraphPreview — Cypher 결과 미리보기 SVG (노드 + 관계)
    // ─────────────────────────────────────────────────────
    function GraphPreview({ graph }) {
      if (!graph) {
        return (
          <div className="h-28 flex items-center justify-center text-[11px] text-slate-400 italic font-mono bg-slate-50 rounded border border-dashed border-slate-300">
            그래프 결과가 여기에 표시됩니다 (Step 3+)
          </div>
        );
      }
      const w = 360;
      const h = 180;
      const radius = 22;
      return (
        <div className="bg-slate-50 rounded border border-slate-200 p-1">
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            {/* 관계 (먼저 그려야 노드 아래로) */}
            {graph.edges.map((e, i) => {
              const a = graph.nodes.find((n) => n.id === e.from);
              const b = graph.nodes.find((n) => n.id === e.to);
              if (!a || !b) return null;
              const mx = (a.x + b.x) / 2;
              const my = (a.y + b.y) / 2 - 6;
              return (
                <g key={`e${i}`}>
                  <defs>
                    <marker id={`arrow-${i}`} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
                    </marker>
                  </defs>
                  <line
                    x1={a.x} y1={a.y}
                    x2={b.x} y2={b.y}
                    stroke="#64748b" strokeWidth="1.5"
                    markerEnd={`url(#arrow-${i})`}
                  />
                  <text x={mx} y={my} textAnchor="middle" fontSize="9" fill="#475569" fontFamily="monospace">
                    :{e.label}
                  </text>
                </g>
              );
            })}
            {/* 노드 */}
            {graph.nodes.map((n) => (
              <g key={n.id}>
                <circle cx={n.x} cy={n.y} r={radius} fill={n.color} stroke="#4c1d95" strokeWidth="2" />
                <text x={n.x} y={n.y + 3} textAnchor="middle" fontSize="9" fill="white" fontWeight="bold">
                  {n.name}
                </text>
                <text x={n.x} y={n.y + radius + 11} textAnchor="middle" fontSize="8" fill="#64748b" fontFamily="monospace">
                  :{n.label}
                </text>
              </g>
            ))}
          </svg>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ClusterView — Step 5 클러스터 토폴로지 SVG
    // ─────────────────────────────────────────────────────
    function ClusterView({ cluster }) {
      if (!cluster) return null;
      const w = 420;
      const h = 160;
      const coreY = 50;
      const replicaY = 130;
      const coreSpacing = w / (cluster.cores.length + 1);
      const replicaSpacing = w / (cluster.replicas.length + 1);
      return (
        <div className="bg-gradient-to-b from-violet-50 to-violet-100 rounded-lg border border-violet-200 p-2 mt-2">
          <div className="text-[10px] text-violet-700 font-bold mb-1">
            🌐 Causal Cluster — Core 3 (Raft) + Read Replicas
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            {/* 점선 그룹 박스 */}
            <rect x="8" y="22" width={w - 16} height="56" rx="6"
                  fill="none" stroke="#a78bfa" strokeWidth="1" strokeDasharray="3 2" />
            <text x={w / 2} y="20" textAnchor="middle" fontSize="9" fill="#6d28d9" fontFamily="monospace">
              Core Servers (Raft 쿼럼)
            </text>
            {/* Cores */}
            {cluster.cores.map((c, i) => {
              const x = coreSpacing * (i + 1);
              const isLeader = c.role === 'LEADER';
              return (
                <g key={c.id}>
                  <rect
                    x={x - 50} y={coreY - 14} width="100" height="34" rx="6"
                    fill={isLeader ? '#7c3aed' : '#ede9fe'}
                    stroke={isLeader ? '#4c1d95' : '#a78bfa'}
                    strokeWidth={isLeader ? 2.5 : 1.5}
                  />
                  <text x={x} y={coreY - 1} textAnchor="middle" fontSize="9.5" fontWeight="bold"
                        fill={isLeader ? 'white' : '#4c1d95'} fontFamily="monospace">
                    {isLeader ? '★ ' : ''}{c.label}
                  </text>
                  <text x={x} y={coreY + 12} textAnchor="middle" fontSize="8.5"
                        fill={isLeader ? '#ddd6fe' : '#6d28d9'} fontFamily="monospace">
                    {c.role}
                  </text>
                </g>
              );
            })}
            {/* Core 사이 Raft 연결선 */}
            <line x1={coreSpacing} y1={coreY + 8} x2={coreSpacing * cluster.cores.length} y2={coreY + 8}
                  stroke="#a78bfa" strokeWidth="1" strokeDasharray="2 2" />

            {/* Replicas */}
            <rect x="8" y={replicaY - 18} width={w - 16} height="40" rx="6"
                  fill="none" stroke="#86efac" strokeWidth="1" strokeDasharray="3 2" />
            <text x={w / 2} y={replicaY - 22} textAnchor="middle" fontSize="9" fill="#15803d" fontFamily="monospace">
              Read Replicas (수평 확장)
            </text>
            {cluster.replicas.map((r, i) => {
              const x = replicaSpacing * (i + 1);
              return (
                <g key={r.id}>
                  <rect x={x - 45} y={replicaY - 10} width="90" height="24" rx="6"
                        fill="#dcfce7" stroke="#22c55e" strokeWidth="1.5" />
                  <text x={x} y={replicaY + 5} textAnchor="middle" fontSize="9.5" fontWeight="bold"
                        fill="#15803d" fontFamily="monospace">
                    {r.label}
                  </text>
                </g>
              );
            })}

            {/* Leader → Replica 복제 화살표 */}
            <defs>
              <marker id="repl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M0,0 L10,5 L0,10 z" fill="#22c55e" />
              </marker>
            </defs>
            {cluster.replicas.map((r, i) => {
              const x = replicaSpacing * (i + 1);
              const leaderX = coreSpacing;
              return (
                <line key={`repl${i}`}
                      x1={leaderX} y1={coreY + 20}
                      x2={x} y2={replicaY - 10}
                      stroke="#22c55e" strokeWidth="1.2" strokeDasharray="2 2"
                      markerEnd="url(#repl-arrow)" opacity="0.6" />
              );
            })}
          </svg>
          <div className="text-[9.5px] text-slate-600 mt-1 font-mono leading-snug">
            <span className="text-violet-700 font-bold">★ Leader</span> = 쓰기 ·
            <span className="text-violet-700 font-bold"> Follower</span> = Raft 합의 ·
            <span className="text-emerald-700 font-bold"> Replica</span> = 읽기 부하 분산
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — Neo4j 컨테이너 박스 + 외부 클라이언트 + Cypher 입력 + 그래프 결과
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📓 Neo4j 컨테이너</h2>
            <span className="text-[10px] text-slate-400 font-mono">live · violet</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 외부 클라이언트 */}
          <div className="grid grid-cols-2 gap-2 mb-3">
            {step.external.length === 0 ? (
              <div className="col-span-2 rounded-lg bg-slate-50 border border-dashed border-slate-300 p-2 text-center text-[11px] text-slate-400 italic">
                외부 클라이언트는 Step 2부터 연결됩니다
              </div>
            ) : (
              step.external.map((c) => (
                <div key={c.id} className="rounded-lg bg-slate-50 border border-slate-300 p-2 flex items-center gap-2">
                  <span className="text-lg">{c.kind === 'browser' ? '🌐' : '🐍'}</span>
                  <div className="flex-1">
                    <div className="text-xs font-bold text-slate-800">{c.label}</div>
                    <div className="text-[10px] text-slate-500 font-mono">→ {c.via}</div>
                  </div>
                  <span className="text-violet-500 text-lg animate-pulse">↓</span>
                </div>
              ))
            )}
          </div>

          {/* Neo4j 컨테이너 박스 */}
          <div className="relative rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 via-white to-violet-50 p-3 shadow-inner">
            <div className="absolute -top-2.5 left-3 bg-white px-2 text-[10px] font-mono text-violet-700 font-bold">
              container: neo4j:5
            </div>

            {/* 포트 표시 */}
            <div className="flex flex-wrap gap-2 mb-3 mt-1">
              {step.ports.map((p) => (
                <div
                  key={p.num}
                  className={`text-[10px] font-mono px-2 py-1 rounded border transition-all ${
                    p.hot
                      ? 'bg-violet-600 text-white border-violet-700 shadow-md animate-pulse'
                      : 'bg-white text-violet-700 border-violet-300'
                  }`}
                >
                  :{p.num} <span className="opacity-80">· {p.label}</span>
                </div>
              ))}
            </div>

            {/* 내부 컴포넌트 그리드 */}
            <div className="grid grid-cols-2 gap-2">
              {step.components.map((c) => {
                const s = COMP_STYLE[c.color] || COMP_STYLE.violet;
                return (
                  <div
                    key={c.id}
                    className={`rounded-lg border-2 p-2.5 transition-all duration-500 ${s.bg} ${s.border} ${
                      c.hot ? 'ring-2 ring-offset-1 ring-violet-400' : ''
                    }`}
                  >
                    <div className="flex items-center gap-2 mb-0.5">
                      <span className={`w-2 h-2 rounded-full ${s.dot} ${c.hot ? 'animate-pulse' : ''}`}></span>
                      <span className={`text-xs font-bold ${s.text}`}>{c.label}</span>
                    </div>
                    <div className="text-[10px] text-slate-600 font-mono ml-4">{c.sub}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Cypher 입력 박스 + 결과 미리보기 */}
          <div className="mt-3 rounded-lg border border-slate-300 overflow-hidden">
            <div className="bg-slate-800 text-violet-300 text-[11px] font-mono px-3 py-1.5 flex items-center gap-2">
              <span className="text-violet-400">cypher&gt;</span>
              <span className="text-slate-100 truncate">{step.cypher}</span>
              {step.cypherStatus === 'success' && (
                <span className="ml-auto text-[9px] text-emerald-400 font-bold">✓ OK</span>
              )}
              {step.cypherStatus === 'idle' && (
                <span className="ml-auto text-[9px] text-slate-500 font-bold">idle</span>
              )}
            </div>
            <div className="p-2 bg-white">
              <GraphPreview graph={step.graph} />
            </div>
          </div>

          {/* Step 5 클러스터 뷰 */}
          {step.showCluster && <ClusterView cluster={step.cluster} />}

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-violet-500"></span>Neo4j 코어</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-sky-500"></span>HTTP/Browser</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-fuchsia-500"></span>Bolt</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>Storage</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-amber-500"></span>TX/Raft</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-violet-500/15 border-l-2 border-violet-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. Neo4j &amp; Cypher &gt; Chapter 1. Neo4j 시작</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Neo4j 개론</h1>
                  <p className="text-sm text-slate-500 mt-0.5">대표 Property Graph DB — 컨테이너 1개에서 클러스터까지</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음(III-1-2)에서는 <strong>Cypher 기본 문법</strong> — CREATE / MATCH / WHERE / RETURN을 직접 작성해본다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./III-1-2.html" className="text-violet-700 hover:text-violet-900 font-medium">III-1-2 Cypher 기본 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
