  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    V-1-2. LangChain GraphRAG 통합 — Neo4j Vector + Graph 하이브리드
    학습 목표: LangChain의 Neo4jVector(벡터 검색)와 GraphCypherQAChain(그래프 순회)을
              하나의 HybridChain으로 결합해, 답변과 함께 인용된 노드/엣지를 같이 보여준다.
    핵심 비유: "두 정보원 합치기" — 벡터 retriever가 비슷한 청크 찾고,
              cypher chain이 그 노드의 관계까지 따라가서 LLM에게 통합 컨텍스트로 전달
    패턴: fastapi v1 — 좌(LangChain 흐름 박스 다이어그램) / 우(VSCode CodeViewer 4 탭)
    색상: graphrag violet
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // LangChain 컴포넌트 정의 (좌측 흐름 다이어그램용)
    //   key   : 식별자
    //   label : 박스 안 큰 글씨
    //   sub   : 박스 안 작은 글씨
    //   emoji : 아이콘
    //   row   : 다이어그램 grid row (1=상단, 2=중단, 3=하단)
    //   col   : grid column 시작
    //   span  : col span
    // ─────────────────────────────────────────────────────
    const FLOW_NODES = [
      { key: 'question',  label: '질문',         sub: '"마틴 스콜세지 영화 줄거리?"', emoji: '❓', row: 1, col: 2, span: 2 },
      { key: 'vector',    label: 'Vector Retriever', sub: 'Neo4jVector · 임베딩 KNN', emoji: '🔍', row: 2, col: 1, span: 2 },
      { key: 'cypher',    label: 'Cypher Chain',  sub: 'LLM이 자연어→Cypher 작성',  emoji: '🌀', row: 2, col: 3, span: 2 },
      { key: 'combiner',  label: 'Combiner',      sub: '두 결과를 하나의 컨텍스트로', emoji: '🔗', row: 3, col: 2, span: 2 },
      { key: 'llm',       label: 'LLM (답변)',    sub: 'gpt-4o-mini · 자연어 합성',  emoji: '🧠', row: 4, col: 2, span: 2 },
      { key: 'answer',    label: '답 + 인용 그래프', sub: '본문 + cited nodes/edges', emoji: '📄', row: 5, col: 2, span: 2 },
    ];

    // 단계마다 어떤 흐름 노드가 활성화되는지
    const ACTIVE_NODES_BY_STEP = [
      ['question', 'vector'],                                         // Step 1: 벡터만
      ['question', 'vector'],                                         // Step 2: 한계 (벡터만)
      ['question', 'cypher'],                                         // Step 3: cypher chain 도입
      ['question', 'vector', 'cypher', 'combiner', 'llm'],            // Step 4: Hybrid 결합
      ['question', 'vector', 'cypher', 'combiner', 'llm', 'answer'],  // Step 5: 출력
    ];

    // 단계마다 어떤 화살표(엣지)가 활성화되는지
    //   엣지: from → to (FLOW_NODES key 기준)
    const FLOW_EDGES = [
      { from: 'question', to: 'vector' },
      { from: 'question', to: 'cypher' },
      { from: 'vector',   to: 'combiner' },
      { from: 'cypher',   to: 'combiner' },
      { from: 'combiner', to: 'llm' },
      { from: 'llm',      to: 'answer' },
    ];

    const ACTIVE_EDGES_BY_STEP = [
      [{ from: 'question', to: 'vector' }],
      [{ from: 'question', to: 'vector' }],
      [{ from: 'question', to: 'cypher' }],
      [
        { from: 'question', to: 'vector' },
        { from: 'question', to: 'cypher' },
        { from: 'vector',   to: 'combiner' },
        { from: 'cypher',   to: 'combiner' },
        { from: 'combiner', to: 'llm' },
      ],
      [
        { from: 'question', to: 'vector' },
        { from: 'question', to: 'cypher' },
        { from: 'vector',   to: 'combiner' },
        { from: 'cypher',   to: 'combiner' },
        { from: 'combiner', to: 'llm' },
        { from: 'llm',      to: 'answer' },
      ],
    ];

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. Neo4jVector — 벡터 검색만',
        desc: 'LangChain의 Neo4jVector로 텍스트 청크를 임베딩 인덱싱한다. 질문이 들어오면 KNN으로 비슷한 청크 k개를 가져와 LLM 컨텍스트에 넣는다. 일반 RAG와 동일 — "비슷한 글" 위주.',
        outputBox: {
          kind: 'partial',
          title: '벡터 검색 결과 (top-3 청크)',
          chunks: [
            { id: 'c-101', score: 0.89, text: '마틴 스콜세지가 감독한 영화는 다수가 폭력과 구원을 다룬다...' },
            { id: 'c-204', score: 0.84, text: '굿펠라스(1990)는 갱스터 회고록을 영화화한 작품이며...' },
            { id: 'c-318', score: 0.81, text: '디카프리오와의 협업이 이어진 시기에는 캐릭터 심리 묘사가...' },
          ],
          citedNodes: [],
          citedEdges: [],
          answer: null,
        },
        code: {
          filename: 'vector-only.py',
          lang: 'python',
          lines: [
            '# Step 1: Neo4jVector — 벡터 검색만 사용',
            'from langchain_community.vectorstores import Neo4jVector',
            'from langchain_openai import OpenAIEmbeddings',
            '',
            'embeddings = OpenAIEmbeddings(model="text-embedding-3-small")',

    // ─────────────────────────────────────────────────────
    // LiveDataPane — LangChain 흐름 박스 + 출력 박스
    // ─────────────────────────────────────────────────────
    function FlowBox({ node, isActive }) {
      const colStart = `col-start-${node.col}`;
      const colSpan  = `col-span-${node.span}`;
      const base = 'rounded-lg border-2 p-2 text-center transition-all duration-500';
      const active = isActive
        ? 'bg-violet-100 border-violet-500 shadow-md scale-105'
        : 'bg-slate-50 border-slate-200 opacity-50';
      return (
        <div className={`${colStart} ${colSpan} ${base} ${active}`}>
          <div className="text-xl">{node.emoji}</div>
          <div className={`text-[11px] font-bold mt-0.5 ${isActive ? 'text-violet-800' : 'text-slate-600'}`}>{node.label}</div>
          <div className="text-[9px] text-slate-500 leading-tight mt-0.5">{node.sub}</div>
        </div>
      );
    }

    function FlowDiagram({ activeKeys }) {
      // FLOW_NODES를 row별로 그룹화
      const rows = {};
      FLOW_NODES.forEach((n) => {
        if (!rows[n.row]) rows[n.row] = [];
        rows[n.row].push(n);
      });
      const rowKeys = Object.keys(rows).map(Number).sort((a, b) => a - b);

      return (
        <div className="space-y-1">
          {rowKeys.map((rowIdx) => (
            <React.Fragment key={rowIdx}>
              <div className="grid grid-cols-4 gap-2">
                {rows[rowIdx].map((n) => (
                  <FlowBox key={n.key} node={n} isActive={activeKeys.includes(n.key)} />
                ))}
              </div>
              {rowIdx < rowKeys.length && (
                <div className="grid grid-cols-4 gap-2 h-3">
                  {rowIdx === 1 && (
                    <>
                      <div className="col-start-2 col-span-1 flex justify-center"><span className="text-violet-400 text-xs">↘</span></div>
                      <div className="col-start-3 col-span-1 flex justify-center"><span className="text-violet-400 text-xs">↙</span></div>
                    </>
                  )}
                  {rowIdx === 2 && (
                    <>
                      <div className="col-start-2 col-span-1 flex justify-end pr-1"><span className="text-violet-400 text-xs">↘</span></div>
                      <div className="col-start-3 col-span-1 flex justify-start pl-1"><span className="text-violet-400 text-xs">↙</span></div>
                    </>
                  )}
                  {rowIdx === 3 && (
                    <div className="col-start-2 col-span-2 flex justify-center"><span className="text-violet-400 text-xs">↓</span></div>
                  )}
                  {rowIdx === 4 && (
                    <div className="col-start-2 col-span-2 flex justify-center"><span className="text-violet-400 text-xs">↓</span></div>
                  )}
                </div>
              )}
            </React.Fragment>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // OutputBox — 단계별 출력 (청크 / 노드·엣지 / 최종답)
    // ─────────────────────────────────────────────────────
    function OutputBox({ box }) {
      return (
        <div className="mt-4 border-2 border-violet-200 bg-violet-50/50 rounded-lg p-3">
          <div className="text-[11px] font-bold text-violet-700 uppercase tracking-wider mb-2">
            📤 {box.title}
          </div>

          {/* 벡터 청크 */}
          {box.chunks && box.chunks.length > 0 && (
            <div className="mb-3">
              <div className="text-[10px] font-bold text-slate-600 mb-1">Vector chunks</div>
              <div className="space-y-1">
                {box.chunks.map((c) => (
                  <div key={c.id} className="bg-white border border-slate-200 rounded px-2 py-1.5 text-[10px] flex gap-2">
                    <span className="font-mono text-violet-700 flex-shrink-0">{c.id}</span>
                    <span className="font-mono text-emerald-600 flex-shrink-0">{c.score.toFixed(2)}</span>
                    <span className="text-slate-700 truncate">{c.text}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 생성된 Cypher (Step 3 전용) */}
          {box.generatedCypher && (
            <div className="mb-3">
              <div className="text-[10px] font-bold text-slate-600 mb-1">Generated Cypher (LLM)</div>
              <pre className="bg-slate-900 text-emerald-300 text-[10px] font-mono p-2 rounded whitespace-pre-wrap">
{box.generatedCypher}
              </pre>
            </div>
          )}

          {/* 인용된 노드·엣지 (그래프 미니뷰) */}
          {box.citedNodes && box.citedNodes.length > 0 && (
            <div className="mb-3">
              <div className="text-[10px] font-bold text-slate-600 mb-1">Cited graph ({box.citedNodes.length} nodes · {box.citedEdges.length} edges)</div>
              <CitedGraph nodes={box.citedNodes} edges={box.citedEdges} />
            </div>
          )}

          {/* 한계 메시지 (Step 2) */}
          {box.missing && (
            <div className="bg-amber-50 border border-amber-300 rounded p-2 text-[10px] text-amber-900">
              <div className="font-bold mb-1">⚠ 벡터만으로 부족한 점</div>
              <ul className="list-disc pl-4 space-y-0.5">
                {box.missing.map((m, i) => <li key={i}>{m}</li>)}

            </div>
          )}

          {/* 최종 답변 (Step 5) */}
          {box.answer && (
            <div className="bg-violet-700 text-white rounded p-2 text-[11px] leading-relaxed">
              <div className="font-bold text-violet-200 mb-1">💬 Answer</div>
              <p>{box.answer}</p>
            </div>
          )}
        </div>
      );
    }

    // 인용된 노드/엣지를 간단 SVG로 보여주는 미니 그래프
    function CitedGraph({ nodes, edges }) {
      // 간단 layout — Person 좌측 / Movie 우측
      const persons = nodes.filter((n) => n.label === 'Person');
      const movies  = nodes.filter((n) => n.label === 'Movie');
      const W = 460, H = 140;
      const personX = 70, movieX = 380;
      const positions = {};
      persons.forEach((p, i) => {
        positions[p.id] = { x: personX, y: 30 + i * (H - 60) / Math.max(persons.length - 1, 1) };
      });
      movies.forEach((m, i) => {
        positions[m.id] = { x: movieX, y: 20 + i * (H - 40) / Math.max(movies.length - 1, 1) };
      });

      const edgeColor = { DIRECTED: '#8b5cf6', ACTED_IN: '#10b981' };

      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full bg-white border border-slate-200 rounded" style={{ maxHeight: '170px' }}>
          {edges.map((e, i) => {
            const src = positions[e.from];
            const dst = positions[e.to];
            if (!src || !dst) return null;
            return (
              <g key={i}>
                <line x1={src.x + 18} y1={src.y} x2={dst.x - 18} y2={dst.y}
                      stroke={edgeColor[e.type] || '#94a3b8'} strokeWidth="1.2" />
                <text x={(src.x + dst.x) / 2} y={(src.y + dst.y) / 2 - 3}
                      fontSize="7" fill={edgeColor[e.type] || '#475569'} textAnchor="middle">
                  {e.type}
                </text>
              </g>
            );
          })}
          {nodes.map((n) => {
            const p = positions[n.id];
            if (!p) return null;
            const fill = n.label === 'Person' ? '#a78bfa' : '#fbbf24';
            return (
              <g key={n.id}>
                <circle cx={p.x} cy={p.y} r="14" fill={fill} stroke="#1e293b" strokeWidth="0.8" />
                <text x={p.x} y={p.y + 3} fontSize="8" textAnchor="middle" fill="#1e293b" fontWeight="bold">
                  {n.label === 'Person' ? '👤' : '🎬'}
                </text>
                <text x={p.x} y={p.y + 28} fontSize="8" textAnchor="middle" fill="#334155">
                  {n.name.length > 18 ? n.name.slice(0, 17) + '…' : n.name}
                </text>
              </g>
            );
          })}
        </svg>
      );
    }

    function LiveDataPane({ stepIdx, outputBox }) {
      const activeKeys = ACTIVE_NODES_BY_STEP[stepIdx];
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🔗 LangChain Hybrid 흐름</h2>
            <span className="text-[10px] text-slate-400 font-mono">vector + graph · live</span>
          </div>

          <FlowDiagram activeKeys={activeKeys} />

          <OutputBox box={outputBox} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // CodeViewer — VSCode 스타일 + highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      // 4 파일 탭 (현재 파일 강조)
      const TAB_FILES = ['vector-only.py', 'cypher-chain.py', 'hybrid.py', 'output-format.py'];

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 라인 */}
          <div className="bg-[#21252b] px-3 pt-2 border-b border-slate-700">
            <div className="flex items-center gap-2 mb-2">
              <div className="flex gap-1.5">
                <span className="w-3 h-3 rounded-full bg-red-500"></span>
                <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span className="w-3 h-3 rounded-full bg-green-500"></span>
              </div>
              <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
            </div>
            <div className="flex gap-0.5 overflow-x-auto">
              {TAB_FILES.map((fn) => {
                const isActive = fn === code.filename;
                return (
                  <div
                    key={fn}
                    className={`px-3 py-1.5 text-[11px] font-mono rounded-t border-t border-l border-r ${
                      isActive
                        ? 'bg-[#282c34] text-violet-300 border-slate-600'
                        : 'bg-[#1c1f24] text-slate-500 border-transparent hover:text-slate-300'
                    }`}
                  >
                    {fn}
                  </div>
                );
              })}
            </div>
          </div>

          {/* hljs 토큰화용 hidden source */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 라인 번호 + 강조 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/40 ${highlighted ? 'bg-violet-500/10 border-l-2 border-violet-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines · {code.filename}</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 통합 &amp; 운영 &gt; Chapter 1. 프레임워크 통합</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">LangChain GraphRAG 통합</h1>
                  <p className="text-sm text-slate-500 mt-0.5">Neo4j Vector + Graph 하이브리드 — 답 + 인용 노드/엣지를 한번에</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane stepIdx={stepIdx} outputBox={step.outputBox} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음(V-2-1)에서는 <strong>운영 체크리스트</strong> — 데이터 갱신·정합성 모니터링·비용 알림
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./V-1-1.html" className="text-slate-500 hover:text-slate-700">&larr; V-1-1 Microsoft GraphRAG</a>
              <a href="./V-2-1.html" className="text-violet-700 hover:text-violet-900 font-medium">V-2-1 운영 체크리스트 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
