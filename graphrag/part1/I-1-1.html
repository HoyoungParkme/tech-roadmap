  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }

  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-1-1. GraphRAG란 무엇인가 — 벡터 RAG 한계 → 그래프로 관계 보존
    학습 목표: 벡터 RAG가 "관계 질문"에 약한 이유와, 같은 청크를 엔티티/관계 그래프로
              재구성하면 다중 hop 추론이 어떻게 가능해지는지 5단계로 이해한다.
    핵심 비유: 도서관 사서 — 키워드만 보는 사서(벡터 RAG) vs 책 사이 관계까지 보는 사서(GraphRAG)
    패턴: fastapi v1 — 좌(LiveDataPane: 벡터공간 SVG + 그래프 SVG) / 우(VSCode CodeViewer)
    색상: graphrag violet
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   chunks   : 벡터 공간에 흩뿌려진 점들 [{ id, x, y, label, hit }]
    //   graph    : 노드/엣지 [{ nodes: [{id,x,y,label,hit}], edges:[{from,to,label,hit}] }]
    //   question : 사용자 질문 텍스트
    //   answer   : 시스템 응답 ('?' / 단편 / 관계 답)
    //   answerType: 'unknown' | 'fail' | 'success'
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 기존 RAG — 청크가 따로따로',
        desc: '문서를 잘게 쪼개 임베딩(벡터)으로 변환 → 벡터 공간에 점으로 흩뿌려 저장한다. 비슷한 의미 청크는 가깝게, 다른 의미는 멀리. 문제는 점 사이에 "선(관계)"이 없다 — 각 청크가 무엇이고 누구와 연결되는지 모른다.',
        chunks: [
          { id: 'c1', x: 80,  y: 60,  label: 'Apple 창업', hit: false },
          { id: 'c2', x: 160, y: 90,  label: '잡스 인도여행', hit: false },
          { id: 'c3', x: 230, y: 50,  label: 'Friedland 영성', hit: false },
          { id: 'c4', x: 110, y: 150, label: 'NeXT 설립', hit: false },
          { id: 'c5', x: 200, y: 170, label: 'Pixar 인수', hit: false },
          { id: 'c6', x: 280, y: 130, label: 'Wozniak 합류', hit: false },
          { id: 'c7', x: 60,  y: 200, label: 'Zen 불교', hit: false },
        ],
        graph: null,
        question: null,
        answer: null,
        answerType: null,
        showCompare: false,
        code: {
          lang: 'python',
          filename: 'vector-rag.py',
          lines: [
            '# 기존 벡터 RAG — 청크 단위 임베딩 + 코사인 유사도 검색',
            'from langchain.text_splitter import RecursiveCharacterTextSplitter',
            'from langchain.embeddings import OpenAIEmbeddings',
            'from langchain.vectorstores import Chroma',
            '',
            '# 1) 문서 → 작은 청크로 자르기',
            'splitter = RecursiveCharacterTextSplitter(chunk_size=500, chunk_overlap=50)',
            'chunks = splitter.split_text(document)',
            '',
            '# 2) 각 청크를 1536차원 벡터로 임베딩',
            'embedder = OpenAIEmbeddings(model="text-embedding-3-small")',
            'vectors = [embedder.embed_query(c) for c in chunks]',
            '',
            '# 3) 벡터 DB에 저장 — 점들이 공간에 흩뿌려진 상태',
            'db = Chroma.from_texts(chunks, embedder)',
            '',
            '# 핵심: 청크들 사이에 "관계"는 저장되지 않는다',
            '#   - 각 청크는 독립된 점(point)',
            '#   - 의미가 비슷하면 가까이, 다르면 멀리',
            '#   - 하지만 "A는 B의 멘토" 같은 명시적 연결은 없음',
            '#',
            '# 그래서 "X와 Y의 관계는?" 질문에 약하다.',
          ],
          highlight: [10, 11, 14, 15, 17, 18, 19],
        },
      },
      {
        title: 'Step 2. 질문 "잡스와 Friedland의 연관" → 관계는 못 찾음',
        desc: '사용자가 "잡스와 Friedland의 관계는?"이라고 묻는다. 임베딩 검색은 "잡스" "Friedland" 키워드가 들어간 청크를 가까운 점으로 찾아준다. 하지만 두 사람 사이의 관계(멘토/영성/인도 여행)는 한 청크에 직접 적혀 있지 않으면 못 찾는다 — 점만 있고 선이 없으니까.',

    // ─────────────────────────────────────────────────────
    // 노드 id → 좌표 lookup (엣지 그릴 때 사용)
    // ─────────────────────────────────────────────────────
    function buildNodeMap(graph) {
      if (!graph) return {};
      return Object.fromEntries(graph.nodes.map((n) => [n.id, n]));
    }

    // ─────────────────────────────────────────────────────
    // 좌측 SVG: 벡터 공간 (점들 흩뿌린 상태)
    // ─────────────────────────────────────────────────────
    function VectorSpace({ chunks }) {
      const w = 360;
      const h = 260;

      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-violet-100 border border-violet-200 p-2">
          <div className="text-[11px] font-bold text-violet-800 mb-1 flex items-center gap-1">
            <span>📍</span>
            <span>벡터 공간 (1536차원 → 2D 투영)</span>
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            {/* 격자 배경 */}
            <defs>
              <pattern id="grid-vec" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e9d5ff" strokeWidth="0.5" />
              </pattern>
            </defs>
            <rect width={w} height={h} fill="url(#grid-vec)" />

            {/* 청크 점들 */}
            {chunks && chunks.map((c) => {
              const fill = c.hit ? '#7c3aed' : (c.faded ? '#cbd5e1' : '#a78bfa');
              const stroke = c.hit ? '#5b21b6' : (c.faded ? '#94a3b8' : '#7c3aed');
              const r = c.hit ? 12 : 8;
              return (
                <g key={c.id} className="transition-all duration-700">
                  {c.hit && (
                    <circle
                      cx={c.x}
                      cy={c.y}
                      r={20}
                      fill="none"
                      stroke="#7c3aed"
                      strokeWidth="2"
                      opacity="0.4"
                    >
                      <animate attributeName="r" from="14" to="24" dur="1.4s" repeatCount="indefinite" />
                      <animate attributeName="opacity" from="0.6" to="0" dur="1.4s" repeatCount="indefinite" />
                    </circle>
                  )}
                  <circle
                    cx={c.x}
                    cy={c.y}
                    r={r}
                    fill={fill}
                    stroke={stroke}
                    strokeWidth="2"
                    opacity={c.faded ? 0.35 : 1}
                  />
                  <text
                    x={c.x}
                    y={c.y - r - 4}
                    textAnchor="middle"
                    fontSize="9"
                    fontWeight={c.hit ? 'bold' : 'normal'}
                    fill={c.faded ? '#94a3b8' : '#4c1d95'}
                    fontFamily="monospace"
                  >
                    {c.label}
                  </text>
                </g>
              );
            })}

            {!chunks && (
              <text x={w / 2} y={h / 2} textAnchor="middle" fontSize="11" fill="#a78bfa" fontFamily="monospace">
                (청크 표현 사용 안 함)
              </text>
            )}
          </svg>
          <div className="text-[9px] text-violet-700 mt-1 text-center font-mono">
            {chunks ? '점 = 청크 임베딩 · 가까울수록 의미 유사' : '벡터 RAG 미사용'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 SVG: 그래프 (노드 + 엣지)
    // ─────────────────────────────────────────────────────
    function GraphSpace({ graph }) {
      const w = 380;
      const h = 260;
      const nodeMap = buildNodeMap(graph);

      return (
        <div className="rounded-lg bg-gradient-to-br from-violet-50 to-violet-100 border border-violet-200 p-2">
          <div className="text-[11px] font-bold text-violet-800 mb-1 flex items-center gap-1">
            <span>🕸️</span>
            <span>지식 그래프 (엔티티 + 관계)</span>
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            {/* 격자 배경 */}
            <defs>
              <pattern id="grid-graph" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e9d5ff" strokeWidth="0.5" />
              </pattern>
              <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed" />
              </marker>
              <marker id="arrow-hit" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto">
                <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626" />
              </marker>
            </defs>
            <rect width={w} height={h} fill="url(#grid-graph)" />

            {/* 엣지 먼저 그려야 노드 위로 안 가림 */}
            {graph && graph.edges.map((e, i) => {
              const a = nodeMap[e.from];
              const b = nodeMap[e.to];
              if (!a || !b) return null;
              const stroke = e.hit ? '#dc2626' : '#a78bfa';
              const strokeW = e.hit ? 2.5 : 1.5;
              const opacity = e.hit ? 1 : 0.5;
              const midX = (a.x + b.x) / 2;
              const midY = (a.y + b.y) / 2;
              return (
                <g key={`e${i}`} className="transition-all duration-700">
                  <line
                    x1={a.x}
                    y1={a.y}
                    x2={b.x}
                    y2={b.y}
                    stroke={stroke}
                    strokeWidth={strokeW}
                    opacity={opacity}
                    markerEnd={e.hit ? 'url(#arrow-hit)' : 'url(#arrow)'}
                  />
                  <text
                    x={midX}
                    y={midY - 3}
                    textAnchor="middle"
                    fontSize="8"
                    fontWeight={e.hit ? 'bold' : 'normal'}
                    fill={e.hit ? '#991b1b' : '#6d28d9'}
                    fontFamily="monospace"
                    opacity={e.hit ? 1 : 0.7}
                  >
                    {e.label}
                  </text>
                </g>
              );
            })}

            {/* 노드 */}
            {graph && graph.nodes.map((n) => {
              const fill = n.hit ? '#7c3aed' : '#ddd6fe';
              const stroke = n.hit ? '#4c1d95' : '#7c3aed';
              const textColor = n.hit ? 'white' : '#4c1d95';
              const r = n.hit ? 22 : 18;
              return (
                <g key={n.id} className="transition-all duration-700">
                  {n.hit && (
                    <circle
                      cx={n.x}
                      cy={n.y}
                      r={r + 6}
                      fill="none"
                      stroke="#7c3aed"
                      strokeWidth="2"
                      opacity="0.5"
                    >
                      <animate attributeName="r" from={r + 2} to={r + 12} dur="1.4s" repeatCount="indefinite" />
                      <animate attributeName="opacity" from="0.6" to="0" dur="1.4s" repeatCount="indefinite" />
                    </circle>
                  )}
                  <circle
                    cx={n.x}
                    cy={n.y}
                    r={r}
                    fill={fill}
                    stroke={stroke}
                    strokeWidth="2"
                  />
                  <text
                    x={n.x}
                    y={n.y + 3}
                    textAnchor="middle"
                    fontSize="10"
                    fontWeight="bold"
                    fill={textColor}
                    fontFamily="monospace"
                    pointerEvents="none"
                  >
                    {n.label}
                  </text>
                </g>
              );
            })}

            {!graph && (
              <text x={w / 2} y={h / 2} textAnchor="middle" fontSize="11" fill="#a78bfa" fontFamily="monospace">
                (Step 3에서 그래프 생성)
              </text>
            )}
          </svg>
          <div className="text-[9px] text-violet-700 mt-1 text-center font-mono">
            {graph ? '노드 = 엔티티 · 선 = 관계 (엣지 타입)' : '아직 그래프 없음'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 비교 표 (Step 5)
    // ─────────────────────────────────────────────────────
    function CompareTable() {
      const rows = [
        { k: '데이터 표현',  rag: '벡터 점(point)',     graph: '엔티티 노드 + 관계 엣지' },
        { k: '검색 단계',    rag: '1단계 (top-k)',      graph: '다중 hop traverse' },
        { k: '관계 보존',    rag: '✗ 청크 단위 단편',    graph: '✓ 명시적 엣지' },
        { k: '다중 hop',     rag: '✗ 약함',             graph: '✓ 강함' },
        { k: '인덱싱 비용',  rag: '낮음 (임베딩만)',    graph: '높음 (LLM 추출 추가)' },
        { k: '질의 비용',    rag: '낮음',               graph: '중간~높음' },
        { k: '적합 질문',    rag: '"X 알려줘"',          graph: '"X와 Y의 관계?"' },
      ];

      return (
        <div className="rounded-lg bg-white border-2 border-violet-300 overflow-hidden">
          <div className="bg-violet-100 px-3 py-2 border-b border-violet-200">
            <div className="text-xs font-bold text-violet-900">📊 벡터 RAG vs GraphRAG</div>
          </div>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="bg-violet-50 text-left">
                <th className="px-3 py-2 font-bold text-violet-700 w-1/4">기준</th>
                <th className="px-3 py-2 font-bold text-slate-700">벡터 RAG</th>
                <th className="px-3 py-2 font-bold text-violet-700">GraphRAG</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={r.k} className={i % 2 === 0 ? 'bg-white' : 'bg-violet-50/40'}>
                  <td className="px-3 py-1.5 font-bold text-slate-700 border-r border-slate-100">{r.k}</td>
                  <td className="px-3 py-1.5 text-slate-700 font-mono">{r.rag}</td>
                  <td className="px-3 py-1.5 text-violet-800 font-mono font-semibold">{r.graph}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌(벡터공간) + 우(그래프) + 질문/답
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      const ansStyle = {
        unknown: 'bg-slate-50 border-slate-300 text-slate-600',
        fail:    'bg-red-50 border-red-400 text-red-800',
        success: 'bg-emerald-50 border-emerald-400 text-emerald-800',
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📚 도서관 사서 — 벡터 vs 그래프</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 비교 표 (Step 5에서만) */}
          {step.showCompare ? (
            <CompareTable />
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3">
              <VectorSpace chunks={step.chunks} />
              <GraphSpace graph={step.graph} />
            </div>
          )}

          {/* 질문 + 답 박스 */}
          {!step.showCompare && step.question && (
            <div className="mt-3 space-y-2">
              <div className="rounded-lg bg-violet-600 text-white p-3 flex items-start gap-2 shadow-sm">
                <span className="text-lg leading-none">❓</span>
                <div className="flex-1">
                  <div className="text-[10px] uppercase tracking-wider text-violet-200 font-bold">사용자 질문</div>
                  <div className="text-sm font-bold mt-0.5">{step.question}</div>
                </div>
              </div>

              {step.answer && (
                <div className={`rounded-lg border-2 p-3 flex items-start gap-2 ${ansStyle[step.answerType]}`}>
                  <span className="text-lg leading-none">
                    {step.answerType === 'success' ? '✅' : step.answerType === 'fail' ? '⚠️' : '💬'}
                  </span>
                  <div className="flex-1">
                    <div className="text-[10px] uppercase tracking-wider font-bold opacity-70">시스템 응답</div>
                    <div className="text-sm font-medium mt-0.5">{step.answer}</div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* 범례 */}
          {!step.showCompare && (
            <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#a78bfa' }}></span>
                일반 청크/노드
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#7c3aed' }}></span>
                검색 매칭
              </span>
              <span className="flex items-center gap-1">
                <span className="w-3 h-0.5" style={{ background: '#dc2626' }}></span>
                traverse 경로
              </span>
              <span className="flex items-center gap-1 ml-auto">
                <span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
                미사용
              </span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-violet-500/15 border-l-2 border-violet-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-violet-700 hover:text-violet-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-violet-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. GraphRAG 기초 &gt; Chapter 1. RAG에서 GraphRAG로</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">GraphRAG란 무엇인가</h1>
                  <p className="text-sm text-slate-500 mt-0.5">도서관 사서 — 벡터 RAG의 한계와 그래프로 관계 보존</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-violet-50 border-2 border-violet-300 rounded-xl p-3 text-sm text-violet-900">
                💡 다음(I-1-2)에서는 <strong>지식 그래프</strong>의 구성 요소(엔티티/관계/속성)와 모델링 원칙을 자세히 다룬다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-violet-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-violet-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-violet-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-violet-600 text-white hover:bg-violet-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./I-1-2.html" className="text-violet-700 hover:text-violet-900 font-medium">I-1-2 지식 그래프 구성요소 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
