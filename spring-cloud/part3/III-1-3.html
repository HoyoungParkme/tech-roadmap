    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Spring Cloud Chapter III-1-3 — Route Predicate & Filter
    학습 목표: Route = id+uri+predicates+filters. predicate 매칭 판정 → 필터 체인(pre→proxy→post).
    패턴: fastapi v1 — 좌(LiveDataPane: 요청 매칭·필터 체인 시뮬레이션) / 우(CodeViewer)
    색상: #4A8C2A (Spring Cloud green)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#4A8C2A';
    const BRAND_DARK = '#2F5C19';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      anatomy: {lang:'yaml', filename:'application.yml', lines:[
            '# Route 하나의 완전한 구조 — 4요소',
            '',
            'spring:',
            '  cloud:',
            '    gateway:',
            '      routes:',
            '        - id: order-route          # 1) id  — 로그/식별용 이름',
            '          uri: http://order-service:8082  # 2) uri — 프록시 대상',
            '          predicates:               # 3) predicates — 매칭 조건 (AND)',
            '            - Path=/api/orders/**',
            '          filters:                  # 4) filters — 요청/응답 가공',
            '            - StripPrefix=1',
            '',
            '# 판정 과정',
            '#   요청 GET /api/orders/42',
            '#   → Path=/api/orders/** 매칭? YES',
            '#   → 이 Route 선택',
            '#   → StripPrefix=1 적용: /api/orders/42 → /orders/42',
            '#   → http://order-service:8082/orders/42 로 프록시',
            '',
            '# predicate 가 하나라도 false 면 이 Route 는 건너뛴다.',
            '# 위에서부터 순서대로 평가, 첫 매칭 Route 가 승자.',
      ]},
      predicate: {lang:'yaml', filename:'predicates.yml', lines:[
            '# Predicate 종류 — 나열하면 모두 AND',
            '',
            'spring:',
            '  cloud:',
            '    gateway:',
            '      routes:',
            '        - id: orders-write',
            '          uri: http://order-service:8082',
            '          predicates:',
            '            - Path=/api/orders/**        # URL 경로 패턴',
            '            - Method=POST,PUT,DELETE     # HTTP 메서드',
            '            - Header=X-Tenant, .+        # 헤더 이름 + 정규식',
            '            - Query=source, mobile       # 쿼리 파라미터 값',
            '            - Host=**.example.com        # 도메인(멀티테넌트)',
            '            # 시간대 predicate — 점진적 출시에 유용',
            '            - After=2026-06-01T00:00:00+09:00[Asia/Seoul]',
            '          filters:',
            '            - StripPrefix=1',
            '',
            '# 위 5개 조건이 전부 참이어야 이 Route 가 매칭된다.',
            '# 자주 쓰는 predicate 목록',
            '#   Path    : 경로 패턴 (가장 많이 씀)',
            '#   Method  : GET / POST / ...',
            '#   Header  : 헤더 이름 + 정규식 (AB 그룹 분기)',
            '#   Query   : 쿼리 파라미터 (debug=true 등)',
            '#   Host    : Host 헤더 (도메인별 라우팅)',
            '#   Cookie  : 쿠키 이름 + 값',
            '#   Weight  : 가중치 분기 (90/10 카나리)',
            '#   After / Before / Between : 시간 조건',
      ]},
      filter: {lang:'yaml', filename:'filters.yml', lines:[
            '# Filter 종류 — 실무 정석 조합',
            '',
            'spring:',
            '  cloud:',
            '    gateway:',
            '      routes:',
            '        - id: order-route',
            '          uri: http://order-service:8082',
            '          predicates:',
            '            - Path=/api/v1/orders/**',
            '          filters:',
            '            # 1) 앞 경로 제거: /api/v1/orders/42 → /orders/42',
            '            - StripPrefix=2',
            '            # 2) 정규식 경로 치환 (StripPrefix 대신 정밀 제어)',
            '            - RewritePath=/api/v1/orders/(?<seg>.*), /orders/${seg}',
            '            # 3) 백엔드로 갈 요청에 헤더 주입',
            '            - AddRequestHeader=X-Gateway, spring-cloud',
            '            # 4) 클라이언트로 갈 응답에 헤더 추가',
            '            - AddResponseHeader=X-Cache, MISS',
            '            # 5) 초당 요청 제한 (Redis 토큰버킷)',
            '            - name: RequestRateLimiter',
            '              args:',
            '                redis-rate-limiter.replenishRate: 10',
            '                redis-rate-limiter.burstCapacity: 20',
            '            # 6) 재시도 — 5xx 일 때 2회',
            '            - name: Retry',
            '              args:',
            '                retries: 2',
            '                statuses: BAD_GATEWAY',
            '',
            '      default-filters:          # 모든 Route 공통 적용',
            '        - AddResponseHeader=X-Powered-By, gateway',
            '',
            '# 자주 쓰는 필터: RewritePath · StripPrefix · AddRequestHeader',
            '#   AddResponseHeader · RequestRateLimiter · CircuitBreaker · Retry',
      ]},
      order: {lang:'java', filename:'LoggingGlobalFilter.java', lines:[
            '// 글로벌 필터 — pre 와 post 를 한 메서드에서',
            '',
            'package com.example.gateway.filter;',
            '',
            'import org.slf4j.Logger;',
            'import org.slf4j.LoggerFactory;',
            'import org.springframework.cloud.gateway.filter.GatewayFilterChain;',
            'import org.springframework.cloud.gateway.filter.GlobalFilter;',
            'import org.springframework.core.Ordered;',
            'import org.springframework.http.server.reactive.ServerHttpRequest;',
            'import org.springframework.stereotype.Component;',
            'import org.springframework.web.server.ServerWebExchange;',
            'import reactor.core.publisher.Mono;',
            '',
            'import java.util.UUID;',
            '',
            '@Component',
            'public class LoggingGlobalFilter implements GlobalFilter, Ordered {',
            '',
            '    private static final Logger log =',
            '        LoggerFactory.getLogger(LoggingGlobalFilter.class);',
            '',
            '    @Override',
            '    public Mono<Void> filter(ServerWebExchange exchange,',
            '                             GatewayFilterChain chain) {',
            '        // ===== pre: 프록시 전에 실행 =====',
            '        long start = System.currentTimeMillis();',
            '        String rid = UUID.randomUUID().toString();',
            '        ServerHttpRequest mutated = exchange.getRequest().mutate()',
            '            .header("X-Request-Id", rid)',
            '            .build();',
            '        ServerWebExchange exch =',
            '            exchange.mutate().request(mutated).build();',
            '',
            '        // chain.filter() 이후가 백엔드 프록시 지점',
            '        return chain.filter(exch)',
            '            // ===== post: 응답이 돌아온 뒤 실행 =====',
            '            .then(Mono.fromRunnable(() -> {',
            '                long ms = System.currentTimeMillis() - start;',
            '                log.info("rid={} path={} elapsed={}ms",',
            '                    rid,',
            '                    exch.getRequest().getURI().getPath(),',
            '                    ms);',
            '            }));',
            '    }',
            '',
            '    @Override',
            '    public int getOrder() {',
            '        return -100;   // 낮을수록 pre 먼저 / post 나중',
            '    }',
            '}',
            '',
            '// 실행 순서 (양파 껍질 모델)',
            '//   요청 → [pre A] → [pre B] → 프록시(백엔드)',
            '//        → [post B] → [post A] → 응답',
            '//   pre 는 선언 순서, post 는 역순.',
      ]},
      summary: {lang:'java', filename:'GatewayRoutes.java', lines:[
            '// 같은 라우팅을 Java DSL 로 — 동적 라우팅에 유리',
            '',
            'package com.example.gateway;',
            '',
            'import org.springframework.cloud.gateway.route.RouteLocator;',
            'import org.springframework.cloud.gateway.route.builder.RouteLocatorBuilder;',
            'import org.springframework.context.annotation.Bean;',
            'import org.springframework.context.annotation.Configuration;',
            '',
            '@Configuration',
            'public class GatewayRoutes {',
            '',
            '    @Bean',
            '    public RouteLocator routes(RouteLocatorBuilder builder) {',
            '        return builder.routes()',
            '            // /api/users/** → user-service (실무 정석)',
            '            .route("user-route", r -> r',
            '                .path("/api/users/**")',
            '                .filters(f -> f',
            '                    .stripPrefix(1)        // /api 제거',
            '                    .rewritePath("/users/(?<s>.*)", "/v2/users/${s}")',
            '                    .addResponseHeader("X-Powered-By", "gateway"))',
            '                .uri("http://user-service:8081"))',
            '',
            '            // Path + Method + Header 조합 매칭',
            '            .route("orders-write", r -> r',
            '                .path("/api/orders/**")',
            '                .and().method("POST", "PUT")',
            '                .and().header("X-Tenant", ".+")',
            '                .filters(f -> f.stripPrefix(1))',
            '                .uri("http://order-service:8082"))',
            '',
            '            // Host 기반 멀티테넌트',
            '            .route("tenant-acme", r -> r',
            '                .host("acme.example.com")',
            '                .uri("http://acme-backend:8090"))',
            '',
            '            .build();',
            '    }',
            '}',
            '',

    const S1 = { title:'Step 1. Route 의 4요소 — id + uri + predicates + filters', desc:'Gateway 의 라우팅 단위는 Route 하나다. Route 는 딱 4가지로 구성된다. id(식별자), uri(어디로 보낼지), predicates(어떤 요청을 받을지 = 매칭 조건), filters(요청/응답을 어떻게 가공할지). predicate 가 모두 참이면 그 Route 가 선택되고, 필터 체인을 거쳐 uri 로 프록시된다. 이 4요소만 이해하면 Gateway 설정의 90%는 끝난다.' };
    const S2 = { title:'Step 2. Predicate — 요청을 매칭하는 조건들', desc:'Predicate 는 "이 요청을 이 Route 가 받을까?" 를 판정하는 boolean 함수다. Path 만 있는 게 아니다. Host(도메인), Method(GET/POST), Header(헤더 정규식), Query(쿼리 파라미터), 그리고 After/Before/Between(시간대) 까지. 여러 predicate 를 나열하면 AND 로 결합된다. 예: Path + Method + Header 를 모두 만족해야 매칭. 카나리·AB 테스트·시간대 출시가 조건 몇 줄로 표현된다.' };
    const S3 = { title:'Step 3. Filter — 요청/응답을 가공한다', desc:'매칭된 Route 는 uri 로 그냥 보내지 않고 필터 체인을 거친다. 대표 필터: StripPrefix(앞 경로 제거), RewritePath(정규식 경로 치환), AddRequestHeader/AddResponseHeader(헤더 주입), RequestRateLimiter(초당 요청 제한), CircuitBreaker(장애 격리), Retry(재시도). 필터는 route 별로도, default-filters 로 전체 공통으로도 건다. 실무 정석: /api/** 로 들어온 요청을 StripPrefix + RewritePath 로 대상 서비스 실제 경로로 변환.' };
    const S4 = { title:'Step 4. 실행 순서 — 요청 → pre 필터 → 프록시 → post 필터 → 응답', desc:'Gateway 필터는 두 단계로 나뉜다. pre 필터는 요청이 백엔드로 나가기 전에 실행되고(경로 변환·헤더 주입·인증), post 필터는 백엔드 응답이 돌아온 뒤 실행된다(응답 헤더·로깅·본문 가공). 핵심은 대칭 구조다. pre 는 선언 순서대로, post 는 역순으로 실행된다(양파 껍질 모델). GlobalFilter 의 getOrder() 로 전체 순서를 제어한다. 트레이싱·로깅이 post 에서 응답 시간을 측정하는 이유가 여기 있다.' };
    const S5 = { title:'Step 5. yaml vs Java DSL — 그리고 실무 정석 예제', desc:'같은 Route 를 application.yml 선언형으로도, RouteLocator Java DSL 로도 정의할 수 있다. yaml 은 정적·가독성 좋고 운영자가 고치기 쉽다. Java DSL 은 조건 분기·동적 생성·재사용에 강하다. 실무 정석: /api/** 로 들어온 요청을 StripPrefix 로 접두사를 떼고 대상 서비스의 실제 경로로 rewrite 한 뒤 프록시. 이 챕터의 predicate + filter + 실행순서를 모두 합치면 Gateway 라우팅을 자유롭게 설계할 수 있다.' };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-sm font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    // 요청 → predicate 매칭 → 필터 체인(pre→proxy→post) 흐름 시각화
    function FlowSim({ state }) {
      const pre = state.filters.filter((f) => f.phase === 'pre');
      const post = state.filters.filter((f) => f.phase === 'post');
      const allMatch = state.predicates.every((p) => p.match);
      return (
        <div className="mt-2 space-y-2">
          {/* 들어온 요청 */}
          <div className="rounded bg-lime-100 border border-lime-300 px-2 py-1 text-[10px] font-mono text-lime-900 flex items-center justify-between">
            <span><b>{state.request.method}</b> {state.request.path}</span>
            <span className="opacity-70">요청</span>
          </div>

          {/* predicate 매칭 판정 */}
          <div className="rounded border p-2" style={{borderColor: '#bef264', backgroundColor: '#f7fee7'}}>
            <div className="text-[10px] font-bold mb-1" style={{color: BRAND_DARK}}>① Predicate 매칭 판정 (AND)</div>
            <div className="space-y-0.5">
              {state.predicates.map((p, i) => (
                <div key={i} className="flex items-center justify-between text-[10px] font-mono">
                  <span className="text-lime-900">{p.label}={p.cond}</span>
                  <span className={p.match ? 'text-emerald-700' : 'text-rose-600'}>{p.match ? '✓ match' : '✗ no'}</span>
                </div>
              ))}
            </div>
            <div className={`mt-1 text-[10px] text-center rounded py-0.5 ${allMatch ? 'bg-emerald-200 text-emerald-900' : 'bg-rose-200 text-rose-900'}`}>
              {allMatch ? '→ 이 Route 선택됨' : '→ 매칭 실패, 다음 Route 로'}
            </div>
          </div>

          {/* 필터 체인 pre → proxy → post */}
          <div className="rounded border p-2" style={{borderColor: '#86efac', backgroundColor: 'white'}}>
            <div className="text-[10px] font-bold mb-1" style={{color: BRAND_DARK}}>② 필터 체인 (pre → proxy → post)</div>
            <div className="space-y-1">
              {pre.map((f, i) => (
                <div key={'pre'+i} className="rounded bg-sky-50 border border-sky-200 px-2 py-0.5 text-[10px] font-mono text-sky-900 flex justify-between">
                  <span>{f.name}</span><span className="opacity-60">pre ↓</span>
                </div>
              ))}
              <div className="rounded px-2 py-1 text-[10px] font-mono text-white text-center" style={{backgroundColor: BRAND}}>
                ▶ proxy → {state.target}
              </div>
              {post.length === 0 ? (
                <div className="text-[9px] text-center text-zinc-400">(post 필터 없음)</div>
              ) : post.map((f, i) => (
                <div key={'post'+i} className="rounded bg-violet-50 border border-violet-200 px-2 py-0.5 text-[10px] font-mono text-violet-900 flex justify-between">
                  <span>{f.name}</span><span className="opacity-60">post ↑</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="grid grid-cols-1 gap-2">
            <MetricCard label="활성 Route 수" value={state.routes} unit="개" max={5} current={state.routes} tone="good" />
            <MetricCard label="Predicate 종류" value={state.predicateKinds} unit="종" max={5} current={state.predicateKinds} tone="good" />
            <MetricCard label="필터 (Pre+Post)" value={state.filterCount} unit="개" max={5} current={state.filterCount} tone="good" />
          </div>

          <FlowSim state={state} />

          <SummaryTable summary={state.summary} />

          <div className="mt-auto pt-3 text-xs rounded p-2" style={{backgroundColor: '#f7fee7', borderWidth: 1, borderColor: '#bef264', color: BRAND_DARK}}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border bg-[#282c34] h-full flex flex-col shadow-lg" style={{borderColor: BRAND_DARK}}>
          <div className="flex items-center gap-2 px-3 py-2 border-b" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-lime-100 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-lime-200">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-lime-500/25 border-l-2 border-lime-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 border-t flex items-center justify-between text-[10px] text-lime-200" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background: 'linear-gradient(to bottom right, #f7fee7, #ecfccb)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap" style={{padding:'0.5rem'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{backgroundColor: BRAND}}>SC</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color: BRAND_DARK}}>Chapter III-1-3. Route Predicate & Filter</h1>
                <p className="text-sm" style={{color: BRAND_DARK, opacity: 0.8}}>Route 4요소 · Predicate 매칭 · Filter 체인(pre→proxy→post)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color: BRAND_DARK}}>← 목차</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{backgroundColor: i <= stepIdx ? BRAND : '#d9f99d'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{backgroundColor: BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{color: '#f7fee7'}}>{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50" style={{borderColor: '#86efac', color: BRAND_DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{backgroundColor: playing ? BRAND_DARK : BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color: BRAND_DARK}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{borderColor: BRAND, color: BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Route = id + uri + predicates + filters. predicate 는 AND 결합 매칭 조건(Path·Method·Header·Query·Host·시간). filter 는 요청/응답 가공(StripPrefix·RewritePath·AddHeader·RateLimiter·CircuitBreaker·Retry). 실행은 요청 → pre(선언순) → proxy → post(역순) → 응답. yaml=정적·가독성, Java DSL=동적·재사용. 실무 정석은 /api/** → StripPrefix + RewritePath.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Route', 'Predicate', 'Filter', 'Path', 'StripPrefix', 'RewritePath', 'pre/post', 'RouteLocator DSL'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{backgroundColor: '#ecfccb', color: BRAND_DARK, borderColor: '#bef264'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color: BRAND_DARK}}>
              <a href="./III-1-2.html" className="underline hover:no-underline">← 이전: III-1-2</a>
              <a href="./III-1-4.html" className="underline hover:no-underline">다음: III-1-4 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
