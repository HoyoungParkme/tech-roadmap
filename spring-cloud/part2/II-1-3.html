    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-sm font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

          <div className="mt-2 rounded bg-lime-50 border border-lime-200 p-2 text-[10px] font-mono text-lime-900">
            서비스 부팅 &rarr; register &rarr; 레지스트리에 추가<br/>
            <span className="opacity-70">spring.application.name 이 서비스 키</span>
          </div>
        );
      }
      if (variant === 'lifecycle') {
        return (
          <div className="mt-2 rounded bg-amber-50 border border-amber-200 p-2 text-[10px] font-mono text-amber-900">
            register &rarr; renew(30s) &rarr; fetch &rarr; eviction(90s)<br/>
            <span className="opacity-70">self-preservation: 대량 유실 시 삭제 보류</span>
          </div>
        );
      }
      if (variant === 'call') {
        return (
          <div className="mt-2 rounded bg-lime-50 border border-lime-200 p-2 text-[10px] font-mono text-lime-900">
            http://user-service/users/42 &rarr; LoadBalancer &rarr; UP 1대<br/>
            <span className="opacity-70">라운드로빈 · 인스턴스 증감 자동 반영</span>
          </div>
        );
      }
      return null;
    }

    function RegistryTable({ registry, heartbeat, tick }) {
      if (!registry || registry.length === 0) {
        return (
          <div className="mt-3 rounded-lg border border-dashed p-4 text-center text-[11px] text-rose-500" style={{borderColor: '#fecaca'}}>
            레지스트리 없음 — 주소를 직접 알아야 함
          </div>
        );
      }
      return (
        <div className="mt-3 rounded-lg border overflow-hidden" style={{borderColor: '#bbf7d0'}}>
          <div className="px-2 py-1 text-[10px] font-bold text-white flex justify-between" style={{backgroundColor: BRAND_DARK}}>
            <span>Eureka Registry</span>
            <span className="font-mono">DS Replicas · {registry.length} apps</span>
          </div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-left" style={{color: BRAND_DARK, backgroundColor: '#f0fdf4'}}>
                <th className="py-1 px-2">Application</th>
                <th className="py-1 px-1">Instance</th>
                <th className="py-1 px-1">Status</th>
                <th className="py-1 px-1">Renew</th>
              </tr>
            </thead>
            <tbody>
              {registry.map((r, i) => {
                const up = r.status === 'UP';
                const beat = heartbeat && up && (tick % registry.length === i);
                return (
                  <tr key={i} className="border-t" style={{borderColor: '#dcfce7'}}>
                    <td className="py-1 px-2 font-mono font-bold" style={{color: BRAND_DARK}}>{r.name}</td>
                    <td className="py-1 px-1 font-mono text-zinc-600">{r.ip}</td>
                    <td className="py-1 px-1">
                      <span className={`px-1.5 py-0.5 rounded font-bold ${up ? 'bg-emerald-200 text-emerald-800' : 'bg-rose-200 text-rose-800'}`}>{r.status}</span>
                    </td>
                    <td className="py-1 px-1 font-mono">
                      <span className={beat ? 'text-lime-600 font-bold' : 'text-zinc-400'}>
                        {beat ? '♥ renew' : (up ? '· ' + r.renew : '✕')}
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{borderColor: BRAND}}>
          <div className="text-sm font-bold mb-2" style={{color: BRAND_DARK}}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left border-b" style={{color: BRAND_DARK, borderColor: '#bbf7d0'}}>
                <th className="py-1 pr-2">측면</th><th className="py-1 pr-2">IP 직결</th><th className="py-1">Eureka</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b" style={{borderColor: '#dcfce7'}}>
                  <td className="py-1 pr-2 font-medium" style={{color: BRAND_DARK}}>{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-800 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 text-emerald-800 font-mono text-[10px]">{r.after}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const [tick, setTick] = useState(0);
      useEffect(() => {
        if (!state.heartbeat) return;
        const id = setInterval(() => setTick((x) => x + 1), 800);
        return () => clearInterval(id);
      }, [state.heartbeat, state.registry]);

      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{borderColor: '#86efac'}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color: BRAND_DARK}}>서비스 레지스트리 시뮬레이션</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-1 gap-2">
            <MetricCard label="등록 인스턴스" value={state.metrics.instances} unit="개" max={5} current={state.metrics.instances} tone="good" />
            <MetricCard label="UP 상태" value={state.metrics.up} unit="개" max={5} current={state.metrics.up} tone="good" />
            <MetricCard label="만료(eviction)" value={state.metrics.evicted} unit="개" max={5} current={state.metrics.evicted} tone={state.metrics.evicted > 0 ? 'warn' : 'good'} />
          </div>

          <DiscoveryDiagram variant={state.diagram} />

          <RegistryTable registry={state.registry} heartbeat={state.heartbeat} tick={tick} />

          <SummaryTable summary={state.summary} />

          <div className="mt-auto pt-3 text-xs rounded p-2" style={{backgroundColor: '#f7fee7', borderWidth: 1, borderColor: '#bef264', color: BRAND_DARK}}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border bg-[#282c34] h-full flex flex-col shadow-lg" style={{borderColor: BRAND_DARK}}>
          <div className="flex items-center gap-2 px-3 py-2 border-b" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-lime-100 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-lime-200">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-lime-500/25 border-l-2 border-lime-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 border-t flex items-center justify-between text-[10px] text-lime-200" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background: 'linear-gradient(to bottom right, #f7fee7, #ecfccb)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap" style={{padding:'0.5rem'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{backgroundColor: BRAND}}>SC</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color: BRAND_DARK}}>Chapter II-1-3. Eureka 서비스 디스커버리</h1>
                <p className="text-sm" style={{color: BRAND_DARK, opacity: 0.8}}>Netflix Eureka · register · renew · fetch · eviction</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color: BRAND_DARK}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{backgroundColor: i <= stepIdx ? BRAND : '#d9f99d'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{backgroundColor: BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{color: '#f7fee7'}}>{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50" style={{borderColor: '#86efac', color: BRAND_DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{backgroundColor: playing ? BRAND_DARK : BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color: BRAND_DARK}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{borderColor: BRAND, color: BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Eureka = 런타임 서비스 레지스트리. Server(@EnableEurekaServer) + Client(스타터 자동 등록). 생명주기 register → renew(30s) → fetch → eviction(90s), self-preservation 으로 오탐 방지. 호출은 IP 대신 spring.application.name 으로, @LoadBalanced 가 UP 인스턴스에 라운드로빈 분산. 스케일 증감은 코드 변경 0줄로 자동 반영.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Eureka', 'Service Discovery', '@EnableEurekaServer', 'register', 'renew', 'eviction', 'self-preservation', '@LoadBalanced'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{backgroundColor: '#ecfccb', color: BRAND_DARK, borderColor: '#bef264'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color: BRAND_DARK}}>
              <a href="./II-1-2.html" className="underline hover:no-underline">← 이전: II-1-2</a>
              <a href="./II-1-4.html" className="underline hover:no-underline">다음: II-1-4 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
