  <!--
    Spring Cloud Chapter V-1-2 — Zipkin 분산 추적 수집/시각화
    학습 목표: Micrometer Tracing span 을 Zipkin 으로 export → 폭포수 타임라인으로 병목 진단.
    패턴: fastapi v1 — 좌(LiveDataPane: span 이 Zipkin 폭포수로 모이는 시뮬레이션) / 우(CodeViewer)
    색상: #4A8C2A (Spring Cloud green)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#4A8C2A';
    const BRAND_DARK = '#2F5C19';

    // 폭포수용 span 데이터: name(서비스), start(ms), dur(ms), depth(들여쓰기), bottleneck 여부

      { name: 'gateway GET /api/orders/42', start: 0,   dur: 320, depth: 0, tag: '200' },
      { name: 'order-service getOrder',     start: 18,  dur: 288, depth: 1, tag: '200' },
      { name: 'catalog-service getProduct', start: 40,  dur: 45,  depth: 2, tag: '200' },
      { name: 'payment-service charge',     start: 95,  dur: 190, depth: 2, tag: '200', slow: true },
      { name: 'db INSERT payment',          start: 120, dur: 150, depth: 3, tag: 'slow' },
    ];

    const STEPS = [
      {
        title: 'Step 1. 문제 — span 은 서비스마다 흩어져 있다',

        spansShown: 0,
        sampling: 0,

        code: {
          lang: 'yaml',
          filename: 'without-zipkin.log',

            '',
            '# gateway.log',
            '2026-08-11 10:22:01.011  traceId=a1b2c3 spanId=001  GET /api/orders/42',
            '2026-08-11 10:22:01.331  traceId=a1b2c3 spanId=001  status=200 elapsed=320ms',
            '',
            '# order-service.log',
            '2026-08-11 10:22:01.029  traceId=a1b2c3 spanId=002  getOrder(42)',
            '2026-08-11 10:22:01.317  traceId=a1b2c3 spanId=002  done elapsed=288ms',
            '',
            '# payment-service.log',
            '2026-08-11 10:22:01.106  traceId=a1b2c3 spanId=004  charge(42)',
            '2026-08-11 10:22:01.296  traceId=a1b2c3 spanId=004  done elapsed=190ms',
            '',
            '# 문제',
            '#   - 서비스마다 로그 파일이 다름 → grep 3~5번',

            '',
            '# → span 을 한 곳으로 export 하고 폭포수로 그려주는 도구가 필요',

        },
      },
      {
        title: 'Step 2. Zipkin 서버 실행 — docker 한 줄',
        desc: 'Zipkin 은 단일 실행 파일/컨테이너로 뜬다. 기본은 인메모리 저장(데모용), 운영은 Elasticsearch/MySQL 백엔드로 붙인다. 9411 포트가 UI 이자 span 수집 엔드포인트(POST /api/v2/spans). 이제 span 을 받을 창구가 생겼다.',
        spansShown: 0,
        sampling: 0,
        traceLatency: 0,
        verdict: 'Zipkin :9411',
        verdictTone: 'good',
        diagram: 'server',
        keyPoint: 'Zipkin :9411 은 UI + 수집 엔드포인트를 겸한다. 데모는 인메모리, 운영은 ES 백엔드.',
        code: {
          lang: 'bash',
          filename: 'run-zipkin.sh',
          lines: [
            '#!/usr/bin/env bash',
            '# Zipkin 서버 실행 — 데모(인메모리)',
            '',
            'docker run -d --name zipkin -p 9411:9411 openzipkin/zipkin',
            '',
            '# UI: http://localhost:9411',
            '# 수집 엔드포인트: POST http://localhost:9411/api/v2/spans',
            '',
            '# 운영: Elasticsearch 백엔드로 영속 저장',
            'docker run -d --name zipkin -p 9411:9411 \\',
            '  -e STORAGE_TYPE=elasticsearch \\',
            '  -e ES_HOSTS=http://elasticsearch:9200 \\',
            '  openzipkin/zipkin',
            '',
            '# 저장소 옵션',
            '#   STORAGE_TYPE=mem            기본, 재시작 시 소실 (데모)',
            '#   STORAGE_TYPE=elasticsearch  운영 권장, 검색/보존',
            '#   STORAGE_TYPE=mysql          RDB 저장',
            '',
            '# span 수집 방식 (reporter)',
            '#   HTTP      기본. 앱이 POST /api/v2/spans 로 전송',
            '#   RabbitMQ  zipkin-rabbitmq. 앱 부하 분리, 유실 감소',
            '#   Kafka     대용량. zipkin-kafka collector',
            '',
            '# 상태 확인',
            'curl -s http://localhost:9411/health',
          ],
          highlight: [1, 4, 6, 7, 10, 11, 12, 13, 16, 17, 18, 19, 21, 22, 23, 24, 27],
        },
      },
      {
        title: 'Step 3. 앱 설정 — Micrometer Tracing span 을 Zipkin 으로 export',
        desc: 'micrometer-tracing-bridge-brave 로 span 을 만들고, zipkin-reporter-brave 로 9411 로 보낸다. management.zipkin.tracing.endpoint 로 수집 URL, management.tracing.sampling.probability 로 샘플링 비율을 정한다. 운영은 0.1(10%) 처럼 낮춰 오버헤드를 줄인다.',
        spansShown: 2,
        sampling: 100,
        traceLatency: 320,
        verdict: 'export ON',
        verdictTone: 'good',
        diagram: 'export',
        keyPoint: 'endpoint = 어디로 보낼지, probability = 얼마나 보낼지. 운영은 0.1 로 오버헤드 절감.',
        code: {
          lang: 'yaml',
          filename: 'application.yml',
          lines: [
            '# 각 서비스(gateway/order/payment...)에 동일 적용',
            '',
            'spring:',
            '  application:',
            '    name: order-service       # Zipkin 에 표시될 서비스명',
            '',
            'management:',
            '  tracing:',
            '    sampling:',
            '      probability: 1.0        # 데모 100%. 운영은 0.1 (10%)',
            '  zipkin:',
            '    tracing:',
            '      endpoint: http://localhost:9411/api/v2/spans',
            '',
            '# 필요 의존성 (build.gradle)',
            '#   implementation "io.micrometer:micrometer-tracing-bridge-brave"',
            '#   implementation "io.zipkin.reporter2:zipkin-reporter-brave"',
            '',
            '# RabbitMQ reporter 로 보낼 때 (앱 부하 분리)',
            '#   implementation "io.zipkin.reporter2:zipkin-reporter-brave"',
            '#   implementation "io.zipkin.reporter2:zipkin-sender-rabbitmq"',
            'spring-rabbitmq-example:',
            '  management:',
            '    zipkin:',
            '      tracing:',
            '        # HTTP 대신 큐로 전송 → 앱은 발행만, 수집은 Zipkin 이',
            '        encoding: JSON',
            '',
            '# 샘플링 트레이드오프',
            '#   1.0  = 모든 요청 추적. 상세하지만 오버헤드/저장량 큼',
            '#   0.1  = 10%만 추적. 운영 기본값',
            '#   병목 재현이 잦은 요청이면 낮은 비율로도 충분히 잡힘',
          ],
          highlight: [1, 3, 4, 5, 7, 8, 9, 10, 11, 12, 13, 15, 16, 17, 29, 30, 31, 32],
        },
      },
      {
        title: 'Step 4. span 의 구조 — 부모-자식 + 태그',
        desc: 'Zipkin 이 받는 span 은 JSON. traceId 는 요청 전체가 공유, id 는 span 고유, parentId 로 트리를 만든다. timestamp/duration 으로 폭포수 위치가 정해지고, localEndpoint.serviceName 이 어느 서비스인지, tags 에 http.status_code·에러 등이 붙는다. 이 조각들이 모여 하나의 trace 가 된다.',
        spansShown: 5,
        sampling: 100,
        traceLatency: 320,
        verdict: 'span JSON',
        verdictTone: 'good',
        diagram: 'json',
        keyPoint: 'traceId(공유) + id + parentId 로 트리 구성. timestamp/duration 이 폭포수 좌표, tags 가 상태.',
        code: {
          lang: 'json',
          filename: 'span.json',
          lines: [
            '[',
            '  {',
            '    "traceId": "a1b2c3d4e5f60718",',
            '    "id": "0000000000000002",',
            '    "parentId": "0000000000000001",',
            '    "name": "get /api/orders/{id}",',
            '    "timestamp": 1754876521029000,',
            '    "duration": 288000,',
            '    "kind": "SERVER",',
            '    "localEndpoint": { "serviceName": "order-service" },',
            '    "tags": {',
            '      "http.method": "GET",',
            '      "http.path": "/orders/42",',
            '      "http.status_code": "200"',
            '    }',
            '  },',
            '  {',
            '    "traceId": "a1b2c3d4e5f60718",',
            '    "id": "0000000000000004",',
            '    "parentId": "0000000000000002",',
            '    "name": "charge",',
            '    "timestamp": 1754876521106000,',
            '    "duration": 190000,',
            '    "kind": "CLIENT",',
            '    "localEndpoint": { "serviceName": "payment-service" },',
            '    "tags": {',
            '      "peer.service": "payment-db",',
            '      "http.status_code": "200"',
            '    }',
            '  }',
            ']',
            '',
            "// timestamp/duration 은 마이크로초(us). duration 288000us = 288ms",
            "// traceId 동일 → 같은 요청. parentId 로 부모 span 을 가리킴",
            "// tags 에 error=true 가 붙으면 Zipkin UI 가 붉게 표시",
          ],
          highlight: [3, 4, 5, 6, 7, 8, 10, 11, 12, 13, 14, 18, 19, 20, 21, 22, 24, 32, 33, 34],
        },
      },
      {
        title: 'Step 5. 폭포수 타임라인으로 병목 진단',
        desc: 'Zipkin UI 에서 traceId 나 서비스/기간으로 검색하면 폭포수(waterfall) 가 뜬다. 가로축은 시간, 각 막대는 span. 막대가 길고 깊은 곳이 병목이다. 여기선 payment-service → db INSERT 구간이 전체 320ms 중 190ms 를 먹는다. 어느 서비스·어느 구간이 느린지 한눈에 보인다.',
        spansShown: 5,
        sampling: 10,
        traceLatency: 320,
        verdict: '병목: payment',
        verdictTone: 'warn',
        diagram: 'json',
        summary: {
          title: 'Zipkin 도입 전후',
          rows: [
            { metric: '수집', before: '서비스별 로그 파일', after: '9411 한 곳' },
            { metric: '전체 그림', before: '사람이 grep 조립', after: '폭포수 한 화면' },
            { metric: '병목 식별', before: '추측/감', after: '가장 긴 막대' },
            { metric: '부모-자식', before: 'spanId 수동 매칭', after: 'parentId 트리' },
            { metric: '에러 span', before: '따로 로그 검색', after: 'tags 붉게 표시' },
            { metric: '오버헤드', before: '전량 로깅', after: 'sampling 0.1' },
          ],
        },
        keyPoint: '가장 길고 깊은 막대 = 병목. payment→db 190ms 가 범인. 폭포수는 추측을 데이터로 바꾼다.',
        code: {
          lang: 'json',
          filename: 'trace-analysis.json',
          lines: [
            '// Zipkin 폭포수에서 읽어낸 병목 분석',
            '{',
            '  "traceId": "a1b2c3d4e5f60718",',
            '  "totalDuration": "320ms",',
            '  "spans": [',
            '    { "service": "gateway",  "span": "GET /api/orders/42", "dur": "320ms", "self": "12ms"  },',
            '    { "service": "order",    "span": "getOrder",           "dur": "288ms", "self": "8ms"   },',
            '    { "service": "catalog",  "span": "getProduct",         "dur": "45ms",  "self": "45ms"  },',
            '    { "service": "payment",  "span": "charge",             "dur": "190ms", "self": "40ms"  },',
            '    { "service": "payment",  "span": "db INSERT payment",  "dur": "150ms", "self": "150ms" }',
            '  ],',
            '  "bottleneck": {',
            '    "span": "db INSERT payment",',
            '    "self": "150ms",',
            '    "share": "47% of total",',
            '    "action": "인덱스 추가 / 커넥션풀 점검 / 배치 INSERT 검토"',
            '  }',
            '}',
            '',
            "// self = 자식 제외한 순수 자기 구간. self 가 큰 곳이 진짜 범인",
            "// gateway/order 는 dur 는 크지만 self 는 작음 → 하위 대기일 뿐",
            "// db INSERT 의 self 150ms 가 전체의 47% → 여기를 고친다",
            '',
            "// 진단 절차",
            "//   1) 검색: serviceName=gateway, minDuration=300ms",
            "//   2) 폭포수에서 가장 긴 막대 클릭 → span 상세/tags",
            "//   3) self time 큰 span 을 최적화 대상으로 확정",
          ],
          highlight: [1, 4, 9, 10, 12, 13, 14, 15, 16, 19, 20, 21, 24, 25, 26, 27],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800', bar: 'bg-emerald-400' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800',     bar: 'bg-amber-400' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800',       bar: 'bg-rose-400' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-sm font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    // 폭포수 다이어그램: 서비스 span 을 시간축 막대로. 병목 span 강조.
    function Waterfall({ count }) {
      const TOTAL = 320; // ms
      const shown = TRACE_SPANS.slice(0, count);
      return (
        <div className="mt-2 rounded bg-zinc-900 border border-lime-800 p-2">
          <div className="text-[9px] font-mono text-lime-300 mb-1">Zipkin 폭포수 · 0 → 320ms</div>
          {shown.length === 0 && (
            <div className="text-[10px] font-mono text-zinc-500 py-3 text-center">아직 수집된 span 없음</div>
          )}
          {shown.map((s, i) => {
            const left = (s.start / TOTAL) * 100;
            const width = Math.max(3, (s.dur / TOTAL) * 100);
            const isBottleneck = s.slow || s.tag === 'slow';
            return (
              <div key={i} className="flex items-center gap-1 mb-0.5">
                <span className="text-[8px] font-mono text-zinc-400 truncate" style={{ width: '38%', paddingLeft: `${s.depth * 6}px` }}>{s.name}</span>
                <div className="relative flex-1 h-3 bg-zinc-800 rounded-sm overflow-hidden">
                  <div
                    className="absolute h-3 rounded-sm flex items-center"
                    style={{ left: `${left}%`, width: `${width}%`, backgroundColor: isBottleneck ? '#f59e0b' : BRAND }}
                    title={`${s.dur}ms`}
                  >
                    <span className="text-[7px] text-white/90 font-mono pl-0.5">{s.dur}ms</span>
                  </div>
                </div>
              </div>
            );
          })}
          {count >= TRACE_SPANS.length && (
            <div className="text-[8px] font-mono text-amber-300 mt-1">🟠 = 병목 span (self time 큼)</div>
          )}
        </div>
      );
    }

    function ZipkinDiagram({ variant }) {
      if (variant === 'scatter') {
        return (
          <div className="mt-2 rounded bg-rose-50 border border-rose-200 p-2 text-[10px] font-mono text-rose-900">
            gateway.log · order.log · payment.log — 조각들이 파일마다 흩어짐<br/>
            <span className="opacity-70">사람이 traceId 로 grep 해서 머릿속에서 조립</span>
          </div>
        );
      }
      if (variant === 'server') {
        return (
          <div className="mt-2 rounded bg-lime-50 border border-lime-200 p-2 text-[10px] font-mono text-lime-900">
            openzipkin/zipkin :9411 (UI + POST /api/v2/spans)<br/>
            <span className="opacity-70">reporter: HTTP · RabbitMQ · Kafka / storage: mem · ES · MySQL</span>
          </div>
        );
      }
      if (variant === 'export') {
        return (
          <div className="mt-2 grid grid-cols-2 gap-1">
            {['gateway → :9411', 'order → :9411', 'catalog → :9411', 'payment → :9411'].map((s) => (
              <div key={s} className="rounded bg-lime-100 border border-lime-300 text-[9px] text-center py-1 text-lime-900 font-mono">
                {s}
              </div>
            ))}
          </div>
        );
      }
      // json / 폭포수
      return <Waterfall count={5} />;
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{borderColor: BRAND}}>
          <div className="text-sm font-bold mb-2" style={{color: BRAND_DARK}}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left border-b" style={{color: BRAND_DARK, borderColor: '#bbf7d0'}}>
                <th className="py-1 pr-2">측면</th><th className="py-1 pr-2">Zipkin 전</th><th className="py-1">Zipkin 후</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b" style={{borderColor: '#dcfce7'}}>
                  <td className="py-1 pr-2 font-medium" style={{color: BRAND_DARK}}>{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-800 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 text-emerald-800 font-mono text-[10px]">{r.after}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{borderColor: '#86efac'}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color: BRAND_DARK}}>Zipkin 수집 · 폭포수 시뮬레이션</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-1 gap-2">
            <MetricCard label="수집된 span 수" value={state.spansShown} unit="개" max={5} current={state.spansShown} tone="good" />
            <MetricCard label="샘플링 비율" value={state.sampling} unit="%" max={100} current={state.sampling} tone="good" />
            <MetricCard label="trace 전체 지연" value={state.traceLatency} unit="ms" max={320} current={state.traceLatency} tone={state.traceLatency >= 300 ? 'warn' : 'good'} />
          </div>

          <ZipkinDiagram variant={state.diagram} />

          <SummaryTable summary={state.summary} />

          <div className="mt-auto pt-3 text-xs rounded p-2" style={{backgroundColor: '#f7fee7', borderWidth: 1, borderColor: '#bef264', color: BRAND_DARK}}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border bg-[#282c34] h-full flex flex-col shadow-lg" style={{borderColor: BRAND_DARK}}>
          <div className="flex items-center gap-2 px-3 py-2 border-b" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-lime-100 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-lime-200">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-lime-500/25 border-l-2 border-lime-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 border-t flex items-center justify-between text-[10px] text-lime-200" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background: 'linear-gradient(to bottom right, #f7fee7, #ecfccb)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap" style={{padding:'0.5rem'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{backgroundColor: BRAND}}>SC</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color: BRAND_DARK}}>Chapter V-1-2. Zipkin 분산 추적</h1>
                <p className="text-sm" style={{color: BRAND_DARK, opacity: 0.8}}>Micrometer span → Zipkin export · 폭포수 타임라인 · 병목 진단</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color: BRAND_DARK}}>&larr; 목차</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{backgroundColor: i <= stepIdx ? BRAND : '#d9f99d'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{backgroundColor: BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{color: '#f7fee7'}}>{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50" style={{borderColor: '#86efac', color: BRAND_DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>&larr; 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{backgroundColor: playing ? BRAND_DARK : BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>다음 &rarr;</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color: BRAND_DARK}}>키보드 &larr;/&rarr; · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{borderColor: BRAND, color: BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Micrometer Tracing 이 만든 span 을 zipkin-reporter 로 :9411 에 export 한다. endpoint 로 수집 URL, sampling.probability 로 오버헤드(운영 0.1)를 조절. span JSON 은 traceId·parentId 로 트리를, timestamp/duration 으로 폭포수 좌표를 이룬다. 폭포수에서 가장 길고 self time 이 큰 막대가 병목 — 여기선 payment→db INSERT 150ms.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Zipkin', 'Micrometer Tracing', 'traceId', 'span', 'waterfall', 'sampling', 'bottleneck', 'zipkin-reporter'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{backgroundColor: '#ecfccb', color: BRAND_DARK, borderColor: '#bef264'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color: BRAND_DARK}}>
              <a href="./V-1-1.html" className="underline hover:no-underline">&larr; 이전: V-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">&larr; 목차</a>
              <a href="./V-1-3.html" className="underline hover:no-underline">다음: V-1-3 &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
