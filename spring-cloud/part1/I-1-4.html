          title: 'BOM 있음 vs 없음',
          rows: [
            { metric: '버전 지정', before: '모듈마다 손으로', after: 'BOM 한 곳' },
            { metric: '호환 보장', before: '개발자 책임', after: '릴리스 트레인 검증' },
            { metric: '업그레이드', before: '수십 줄 수정', after: 'BOM 버전 한 줄' },
            { metric: '충돌 위험', before: '조합 폭발', after: '못박힌 세트' },
            { metric: 'Java', before: '8/11 혼재', after: '17+ 통일' },
            { metric: '네임스페이스', before: 'javax', after: 'jakarta' },
          ],
        },
        keyPoint: 'Boot 확정 → 매트릭스로 Cloud 선택 → BOM import → starter 추가 → Java17/jakarta 확인. 이 5단계가 전부다.',
        code: {
          activeDefault: 0,
          files: [
            {
              filename: 'build.gradle',
              lang: 'yaml',
              lines: [
                '// ── 충돌 없는 스택: 완성형 build.gradle ──',
                'plugins {',
                "    id 'org.springframework.boot' version '3.4.1'          // (1) Boot 확정",
                "    id 'io.spring.dependency-management' version '1.1.7'",
                "    id 'java'",
                '}',
                '',
                'java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }  // (5)',
                '',
                'ext {',
                "    set('springCloudVersion', \"2024.0.0\")   // (2) 매트릭스로 짝 선택",
                '}',
                '',
                'dependencyManagement {',
                '    imports {',
                "        mavenBom \"org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}\"  // (3) BOM",
                '    }',
                '}',
                '',
                'dependencies {   // (4) starter 추가 — 버전 없음',
                "    implementation 'org.springframework.cloud:spring-cloud-starter-config'",
                "    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'",
                "    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'",
                "    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'",
                "    implementation 'org.springframework.boot:spring-boot-starter-actuator'",
                '}',
              ],
              highlight: [2, 3, 8, 10, 11, 14, 15, 16, 19, 20, 21, 22, 23],
            },
            {
              filename: 'pom.xml',
              lang: 'xml',
              lines: [
                '&lt;!-- 같은 순서를 Maven 으로 압축 --&gt;',
                '&lt;parent&gt;                              &lt;!-- (1) Boot --&gt;',
                '  &lt;artifactId&gt;spring-boot-starter-parent&lt;/artifactId&gt;',
                '  &lt;version&gt;3.4.1&lt;/version&gt;',
                '&lt;/parent&gt;',
                '&lt;properties&gt;',
                '  &lt;java.version&gt;17&lt;/java.version&gt;                        &lt;!-- (5) --&gt;',
                '  &lt;spring-cloud.version&gt;2024.0.0&lt;/spring-cloud.version&gt;   &lt;!-- (2) --&gt;',
                '&lt;/properties&gt;',
                '&lt;dependencyManagement&gt;&lt;dependencies&gt;&lt;dependency&gt;   &lt;!-- (3) BOM --&gt;',
                '  &lt;groupId&gt;org.springframework.cloud&lt;/groupId&gt;',
                '  &lt;artifactId&gt;spring-cloud-dependencies&lt;/artifactId&gt;',
                '  &lt;version&gt;${spring-cloud.version}&lt;/version&gt;',
                '  &lt;type&gt;pom&lt;/type&gt;&lt;scope&gt;import&lt;/scope&gt;',
                '&lt;/dependency&gt;&lt;/dependencies&gt;&lt;/dependencyManagement&gt;',
                '&lt;!-- (4) starter 는 dependencies 에서 version 없이 --&gt;',
              ],
              highlight: [2, 3, 4, 7, 8, 10, 12, 13, 14, 16],
            },
          ],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800', bar: 'bg-emerald-400' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800',     bar: 'bg-amber-400' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800',       bar: 'bg-rose-400' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-sm font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    // 호환 매트릭스: Cloud 릴리스 트레인 ↔ Boot 라인
    const MATRIX = [
      { cloud: '2024.0.x', boot: '3.4.x', active: true },
      { cloud: '2023.0.x', boot: '3.2.x / 3.3.x', active: false },
      { cloud: '2022.0.x', boot: '3.0.x / 3.1.x', active: false },
      { cloud: '2021.0.x', boot: '2.6.x / 2.7.x', active: false },
    ];

    // BOM 이 정렬하는 모듈 목록
    const MODULES = [
      { name: 'starter-config', bad: '4.1.0', good: '4.2.0' },
      { name: 'starter-gateway', bad: '4.0.2', good: '4.2.0' },
      { name: 'eureka-client', bad: '4.2.0', good: '4.2.0' },
      { name: 'circuitbreaker-r4j', bad: '3.1.0', good: '3.2.0' },
      { name: 'starter-actuator', bad: '3.3.0', good: '3.4.1' },
    ];

    function BomDiagram({ variant }) {
      if (variant === 'matrix') {
        return (
          <div className="mt-2 rounded border border-amber-200 bg-amber-50 p-2">
            <div className="text-[10px] font-bold text-amber-800 mb-1">호환 매트릭스 (짝을 어기면 런타임 폭발)</div>
            <div className="grid grid-cols-2 gap-1 text-[9px] font-mono">
              <div className="text-amber-700 font-bold">Spring Cloud</div>
              <div className="text-amber-700 font-bold">Spring Boot</div>
              {MATRIX.map((m) => (
                <React.Fragment key={m.cloud}>
                  <div className={`rounded px-1 py-0.5 ${m.active ? 'bg-lime-200 text-lime-900 font-bold' : 'bg-white text-zinc-500'}`}>{m.cloud}{m.active ? ' ✓' : ''}</div>
                  <div className={`rounded px-1 py-0.5 ${m.active ? 'bg-lime-200 text-lime-900 font-bold' : 'bg-white text-zinc-500'}`}>{m.boot}</div>
                </React.Fragment>
              ))}
            </div>
          </div>
        );
      }
      if (variant === 'bom') {
        return (
          <div className="mt-2 rounded border border-lime-300 bg-lime-50 p-2">
            <div className="text-[10px] font-bold text-lime-900 mb-1">BOM 이 버전을 한 세트로 정렬</div>
            <div className="space-y-0.5 text-[9px] font-mono">
              {MODULES.map((m) => (
                <div key={m.name} className="flex items-center gap-1">
                  <span className="flex-1 text-lime-900">{m.name}</span>
                  <span className="text-rose-500 line-through">{m.bad}</span>
                  <span className="text-lime-700">&rarr;</span>
                  <span className="bg-lime-200 text-lime-900 rounded px-1 font-bold">{m.good}</span>
                </div>
              ))}
            </div>
            <div className="text-[9px] text-lime-700 mt-1">모두 2024.0.0 세트로 못박힘</div>
          </div>
        );
      }
      if (variant === 'starters') {
        return (
          <div className="mt-2 grid grid-cols-2 gap-1">
            {['config', 'eureka-client', 'gateway', 'circuitbreaker-r4j'].map((s) => (
              <div key={s} className="rounded bg-lime-100 border border-lime-300 text-[9px] text-center py-1 text-lime-900 font-mono">
                + {s}
              </div>
            ))}
          </div>
        );
      }
      if (variant === 'jakarta') {
        return (
          <div className="mt-2 rounded border border-amber-200 bg-amber-50 p-2 text-[10px] font-mono">
            {['servlet', 'persistence', 'validation'].map((p) => (
              <div key={p} className="flex items-center gap-1 text-amber-900">
                <span className="bg-rose-100 text-rose-700 rounded px-1 line-through">javax.{p}</span>
                <span>&rarr;</span>
                <span className="bg-lime-200 text-lime-900 rounded px-1 font-bold">jakarta.{p}</span>
              </div>
            ))}
            <div className="text-[9px] text-amber-700 mt-1">+ Java 17+ 필수</div>
          </div>
        );
      }
      if (variant === 'recipe') {
        return (
          <div className="mt-2 rounded border border-lime-300 bg-lime-50 p-2 text-[10px] text-lime-900 font-mono leading-5">
            1) Boot 버전 확정 &rarr; 2) 매트릭스로 Cloud 선택<br/>
            3) BOM import &rarr; 4) starter 추가(버전 X) &rarr; 5) Java17 · jakarta
          </div>
        );
      }
      return null;
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{borderColor: BRAND}}>
          <div className="text-sm font-bold mb-2" style={{color: BRAND_DARK}}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left border-b" style={{color: BRAND_DARK, borderColor: '#bbf7d0'}}>
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">BOM 없음</th><th className="py-1">BOM 있음</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b" style={{borderColor: '#dcfce7'}}>
                  <td className="py-1 pr-2 font-medium" style={{color: BRAND_DARK}}>{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-800 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 text-emerald-800 font-mono text-[10px]">{r.after}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{borderColor: '#86efac'}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color: BRAND_DARK}}>BOM · 버전 정렬 시뮬레이션</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-1 gap-2">
            <MetricCard label="BOM 관리 모듈" value={state.modules} unit="개" max={5} current={state.modules} tone="good" />
            <MetricCard label="버전 충돌" value={state.conflicts} unit="건" max={3} current={state.conflicts} tone={state.conflicts > 0 ? 'danger' : 'good'} />
            <MetricCard label="정렬 완료" value={state.aligned} unit="개" max={5} current={state.aligned} tone="good" />
          </div>

          <BomDiagram variant={state.diagram} />

          <SummaryTable summary={state.summary} />

          <div className="mt-auto pt-3 text-xs rounded p-2" style={{backgroundColor: '#f7fee7', borderWidth: 1, borderColor: '#bef264', color: BRAND_DARK}}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const [activeTab, setActiveTab] = useState(0);
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      const file = code.files[activeTab] || code.files[0];

      // STEP 이 바뀌면 기본 탭으로 리셋
      useEffect(() => {
        setActiveTab(code.activeDefault || 0);
      }, [code]);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = file.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [file]);

      const highlightSet = new Set(file.highlight || []);
      const tokenLines = file.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border bg-[#282c34] h-full flex flex-col shadow-lg" style={{borderColor: BRAND_DARK}}>
          <div className="flex items-center gap-2 px-3 py-2 border-b" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {code.files.map((f, i) => (
                <button
                  key={f.filename}
                  onClick={() => setActiveTab(i)}
                  aria-pressed={i === activeTab}
                  className="text-xs font-mono px-2 py-0.5 rounded-t"
                  style={i === activeTab
                    ? { backgroundColor: '#282c34', color: '#d9f99d', fontWeight: 700 }
                    : { color: '#a3e635', opacity: 0.6 }}
                >
                  {f.filename}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-lime-200">{file.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${file.lang}`}>{file.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-lime-500/25 border-l-2 border-lime-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 border-t flex items-center justify-between text-[10px] text-lime-200" style={{backgroundColor: BRAND_DARK, borderColor: BRAND_DARK}}>
            <span>{file.lines.length} lines · {file.filename}</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background: 'linear-gradient(to bottom right, #f7fee7, #ecfccb)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap" style={{padding:'0.5rem'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{backgroundColor: BRAND}}>SC</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color: BRAND_DARK}}>Chapter I-1-4. 2024 릴리스 트레인 · BOM · 모듈 구성</h1>
                <p className="text-sm" style={{color: BRAND_DARK, opacity: 0.8}}>Spring Cloud 2024.x · Boot 3.x · BOM(dependencyManagement) · starter · Jakarta</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color: BRAND_DARK}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{backgroundColor: i <= stepIdx ? BRAND : '#d9f99d'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{backgroundColor: BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{color: '#f7fee7'}}>{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50" style={{borderColor: '#86efac', color: BRAND_DARK}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{backgroundColor: playing ? BRAND_DARK : BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-lime-50 disabled:opacity-40" style={{borderColor: '#86efac', color: BRAND_DARK}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color: BRAND_DARK}}>키보드 ←/→ · 자동재생 3초/단계 · 파일 탭 클릭으로 build.gradle ↔ pom.xml 전환</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{borderColor: BRAND, color: BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                릴리스 트레인(2024.0.x)은 Boot 3.4.x 와 짝. BOM 을 dependencyManagement 로 import 하면 starter 를 버전 없이 추가해도 호환 세트로 못박힌다. Boot 3.x 는 Java 17+ · jakarta 네임스페이스가 전제. 구성 순서는 Boot 확정 → 매트릭스로 Cloud 선택 → BOM → starter → Java/jakarta 확인.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Spring Cloud 2024', 'Release Train', 'BOM', 'dependencyManagement', 'Boot 3.x', 'starter', 'Jakarta EE', 'Java 17'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{backgroundColor: '#ecfccb', color: BRAND_DARK, borderColor: '#bef264'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color: BRAND_DARK}}>
              <a href="./I-1-3.html" className="underline hover:no-underline">← 이전: I-1-3</a>
              <a href="../index.html" className="underline hover:no-underline">← 목차</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
