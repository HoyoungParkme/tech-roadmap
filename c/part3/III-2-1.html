            '    // ❌ off-by-one: 널 자리를 빼먹음',
            '    // char buf[5];',
            '    // strcpy(buf, "hello");   // 5글자+\\0=6 > 5칸',
            '    char buf[6];               // ✅ 글자 수 + 1',
            '    strcpy(buf, "hello");      // OK (정확히 6바이트)',
            '',
            '    // ❌ gets: 길이 제한이 없어 어떤 버퍼든 넘긴다',
            '    // gets(buf);              // C11 에서 삭제된 함수',

            '        in[strcspn(in, "\\n")] = \'\\0\';  // 개행 제거 + 널 보장',

      },
      {
        title: 'Step 5. 안전한 문자열 처리 — 실무 체크리스트',
        desc: '지금까지의 위험을 하나의 습관으로 묶자. 첫째, 버퍼 크기는 sizeof로 계산하고 항상 널 자리(+1)를 포함한다. 둘째, 복사·조립은 snprintf를 기본으로 쓰고 반환값으로 잘림 여부를 확인한다(반환값이 버퍼 크기 이상이면 잘린 것). 셋째, strncpy처럼 널 종료를 보장하지 않는 함수를 쓴 뒤에는 buf[n-1]=\\0로 직접 마무리한다. 넷째, 사용자·네트워크 입력은 절대 신뢰하지 말고 길이를 먼저 검증하며, 입력은 gets가 아닌 fgets로 받는다. 다섯째, 컴파일러·도구의 힘을 빌린다 — -Wall -Wextra 경고, -fstack-protector(스택 카나리), AddressSanitizer(-fsanitize=address)는 오버플로를 실행 중에 잡아준다. 요약하면 "크기를 알고 쓰는 함수 + 널 종료 보장 + 입력 검증 + 도구 검증"이다. 이 네 가지만 몸에 배면 C 문자열의 가장 흔한 사고 대부분을 막을 수 있다. 다음 장 III-2-2에서는 이 위에서 동적 메모리(malloc/free)와 관련한 힙 오류를 이어서 다룬다.',
        actor: '🛡 snprintf · fgets · 널 종료 보장 · 입력 검증 · 도구',
        stage: 'safe',

        checklist: [

          { do: '복사·조립은 크기 제한 함수', tool: 'snprintf / strncat', note: '반환값으로 잘림 확인' },
          { do: '널 종료 직접 보장', tool: "buf[n-1] = '\\0'", note: 'strncpy 뒤 필수' },
          { do: '입력은 검증 후 사용', tool: 'fgets + 길이 체크', note: 'gets 절대 금지' },
          { do: '도구로 실행 중 탐지', tool: '-fsanitize=address', note: '-Wall / 스택 카나리' },
        ],
        alert: { tone: 'good', text: '안전 공식: 크기를 알고 쓰는 함수(snprintf/fgets) + 널 종료 보장 + 입력 검증 + 컴파일러/ASan 검증. 이 네 가지가 C 문자열 사고 대부분을 막는다.' },
        code: {
          lang: 'c',
          filename: 'safe_string.c — 안전한 조립의 완성형',
          lines: [
            '#include <stdio.h>',
            '#include <string.h>',
            '',
            '// 사용자 이름으로 인사말을 안전하게 만든다',
            'int make_greeting(char *out, size_t cap, const char *name) {',
            '    // snprintf 반환값 = "쓰려 했던 전체 길이"',
            '    int n = snprintf(out, cap, "Hello, %s!", name);',
            '    if (n < 0 || (size_t)n >= cap) {',
            '        return -1;   // 잘림 발생 → 호출자에게 알림',
            '    }',
            '    return n;        // 성공: 실제 길이',
            '}',
            '',
            'int main(void) {',

            '    char msg[16];',
            '    if (make_greeting(msg, sizeof(msg), line) < 0)',
            '        printf("이름이 너무 깁니다(잘림)\\n");',
            '    else',
            '        printf("%s\\n", msg);',
            '    // 빌드: gcc -Wall -Wextra -fsanitize=address safe_string.c',
            '    return 0;',
            '}',
          ],
          highlight: [7, 8, 9, 11, 17, 18, 21, 25],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 공용 — 메모리 셀 한 칸
    // ─────────────────────────────────────────────────────
    const CELL_STYLE = {
      data:    'bg-indigo-100 border-indigo-400 text-indigo-900',
      nul:     'bg-emerald-100 border-emerald-500 text-emerald-800 font-bold',
      unused:  'bg-slate-50 border-slate-300 text-slate-400',
      corrupt: 'bg-red-200 border-red-500 text-red-800 font-bold',
      writing: 'bg-amber-200 border-amber-500 text-amber-900 font-bold',
    };

    function MemCell({ ch, kind, idx }) {
      return (
        <div className="flex flex-col items-center">
          <div className={`w-9 h-9 flex items-center justify-center rounded border-2 text-sm font-mono ${CELL_STYLE[kind] || CELL_STYLE.unused}`}>
            {ch}
          </div>
          <span className="text-[8px] text-slate-400 mt-0.5 font-mono">{idx}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 문자열 저장 구조: char 배열 + 널 종료
    // ─────────────────────────────────────────────────────
    function StringView({ cells, facts, note }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🧱 char msg[8] = "Hello" — 메모리 한 칸 = 1바이트</div>
            <div className="flex gap-1 flex-wrap">
              {cells.map((c, i) => <MemCell key={i} ch={c.ch} kind={c.kind} idx={i} />)}
            </div>
            <div className="flex gap-3 mt-2 text-[9px]">
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-indigo-100 border border-indigo-400 inline-block"></span>글자</span>
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-emerald-100 border border-emerald-500 inline-block"></span>널 종료 \0</span>
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-slate-50 border border-slate-300 inline-block"></span>여분(미사용)</span>
            </div>
          </div>
          <div className="flex gap-2">
            {facts.map((f, i) => (
              <div key={i} className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2 text-center">
                <div className="text-[10px] font-mono text-sky-800">{f.k}</div>
                <div className="text-2xl font-bold text-sky-700">{f.v}</div>
                <div className="text-[9px] text-slate-500 mt-0.5">{f.note}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">📌 {note.title}</div>
            <div className="text-[10px] text-amber-900">{note.text}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 위험 함수 vs 안전 함수 대비표
    // ─────────────────────────────────────────────────────
    function FuncsView({ pairs, note }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">⚖️ 경계 검사가 없는 함수 → 크기를 받는 함수</div>
            <div className="space-y-1.5">
              {pairs.map((p, i) => (
                <div key={i} className="flex items-stretch gap-1.5 text-[10px] font-mono">
                  <span className="flex-1 rounded border border-red-300 bg-red-50 px-2 py-1 text-red-700 flex items-center gap-1"><span>❌</span>{p.danger}</span>
                  <span className="flex items-center text-indigo-500 font-bold">→</span>
                  <span className="flex-1 rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-emerald-900 flex items-center gap-1"><span>✅</span>{p.safe}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">🩹 {note.title}</div>
            <div className="text-[10px] text-amber-900">{note.text}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 버퍼 오버플로 애니메이션
    //   버퍼(bufSize칸) + 인접 변수 영역을 그리고, src 문자를 한 칸씩 써 나간다.
    //   버퍼 경계를 넘어가는 칸은 corrupt(빨강)로 표시된다.
    // ─────────────────────────────────────────────────────
    function OverflowView({ overflow }) {
      const { bufSize, src, adjacentLabel } = overflow;
      const totalCells = bufSize + 6;           // 버퍼 + 인접 6칸
      const chars = (src + '\\0').split('');     // 표시용: 널까지 쓴다
      const [written, setWritten] = useState(0); // 지금까지 쓴 칸 수
      const timerRef = useRef(null);

      // stage 진입 시 애니메이션 재생 (0 → chars.length 반복)
      useEffect(() => {
        setWritten(0);
        timerRef.current = setInterval(() => {
          setWritten((w) => {
            if (w >= chars.length) return 0;     // 끝나면 처음부터 반복
            return w + 1;
          });
        }, 550);
        return () => clearInterval(timerRef.current);
      }, [src]);

      const overflowed = written > bufSize;

      const cells = [];
      for (let i = 0; i < totalCells; i++) {
        let ch = '·', kind = i < bufSize ? 'unused' : 'unused';
        if (i < written) {
          ch = chars[i];
          if (i < bufSize) kind = (i === written - 1) ? 'writing' : (ch === '\\0' ? 'nul' : 'data');
          else kind = 'corrupt';                 // 버퍼 밖 = 훼손
        }
        cells.push({ ch, kind, idx: i });
      }

      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">
              💥 strcpy(dst /*[{bufSize}]*/, "{src}") — 한 칸씩 복사
            </div>
            <div className="flex gap-1 flex-wrap items-start">
              {cells.map((c, i) => (
                <React.Fragment key={i}>
                  {i === bufSize && <div className="w-0.5 h-9 bg-red-500 mx-0.5 rounded" title="버퍼 경계"></div>}
                  <MemCell ch={c.ch} kind={c.kind} idx={c.idx} />
                </React.Fragment>
              ))}
            </div>
            <div className="flex justify-between mt-2 text-[9px] font-mono">
              <span className="text-indigo-700">◀ dst[{bufSize}] 버퍼</span>
              <span className="text-red-600">{adjacentLabel} ▶</span>
            </div>
            <div className={`mt-2 rounded px-2 py-1 text-[10px] font-bold text-center ${overflowed ? 'bg-red-100 text-red-700 border border-red-400' : 'bg-emerald-50 text-emerald-800 border border-emerald-300'}`}>
              {overflowed
                ? `🚨 ${written - bufSize}칸 초과! 인접 메모리(is_admin) 훼손 중`
                : `쓴 바이트: ${written} / 버퍼 ${bufSize}칸 (아직 안전)`}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-800 mb-1">🚨 {overflow_noteTitle}</div>
            <div className="text-[10px] text-red-900">{overflow_noteText}</div>
          </div>
        </div>
      );
    }
    // OverflowView 가 참조하는 note 상수 (JSX 밖에서 선언)
    const overflow_noteTitle = '왜 위험한가';
    const overflow_noteText = '스택에서 버퍼 뒤에는 다른 지역변수·복귀 주소(return address)가 있다. 이를 덮으면 값 오염을 넘어 프로그램 흐름 탈취(코드 실행)까지 가능하다 — 고전적 스택 스매싱 공격.';

    // ─────────────────────────────────────────────────────
    // Step 4 — 흔한 함정 3종
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-amber-300 bg-white p-2.5">
              <div className="text-[10px] font-bold text-amber-900 mb-1 flex items-center gap-1">
                <span className="px-1.5 py-0.5 rounded bg-amber-100 border border-amber-300">{p.tag}</span>
              </div>
              <div className="space-y-1 text-[10px] font-mono">
                <div className="rounded bg-red-50 border border-red-300 px-2 py-1 text-red-700"><span className="font-bold">❌ </span>{p.bad}</div>
                <div className="text-[9px] text-slate-600 px-1">→ {p.eff}</div>
                <div className="rounded bg-emerald-50 border border-emerald-300 px-2 py-1 text-emerald-900"><span className="font-bold">✅ </span>{p.fix}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 안전 처리 체크리스트
    // ─────────────────────────────────────────────────────
    function SafeView({ checklist }) {
      return (
        <div className="rounded-lg border-2 border-emerald-300 bg-white p-3">
          <div className="text-[11px] font-bold text-emerald-800 mb-2">🛡 안전한 문자열 처리 — 5가지 습관</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-emerald-900 border-b border-emerald-200">
                <th className="text-left py-0.5 w-5"></th>
                <th className="text-left py-0.5">해야 할 것</th>
                <th className="text-left py-0.5 pl-1">도구 · 근거</th>
              </tr>
            </thead>
            <tbody>
              {checklist.map((c, i) => (
                <tr key={i} className="border-t border-emerald-100 align-top">
                  <td className="py-1 text-emerald-600">✓</td>
                  <td className="py-1 text-slate-700 font-bold">{c.do}</td>
                  <td className="py-1 pl-1">
                    <div className="font-mono text-emerald-800">{c.tool}</div>
                    <div className="text-[9px] text-slate-500">{c.note}</div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (slate blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      string:   { icon: '📝', label: '문자열 구조' },
      funcs:    { icon: '⚖️', label: '함수 안전성' },
      overflow: { icon: '💥', label: '버퍼 오버플로' },
      pitfall:  { icon: '🩹', label: '흔한 함정' },
      safe:     { icon: '🛡', label: '안전 처리' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.string;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>C 문자열 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-indigo-700 font-mono mb-3 px-2 py-1 rounded bg-indigo-50 border border-indigo-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'string' && <StringView cells={state.cells} facts={state.facts} note={state.note} />}
          {state.stage === 'funcs' && <FuncsView pairs={state.pairs} note={state.note} />}
          {state.stage === 'overflow' && <OverflowView overflow={state.overflow} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          {state.stage === 'safe' && <SafeView checklist={state.checklist} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-indigo-400/20 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg text-white font-bold text-lg" style={{ backgroundColor: '#5C6BC0' }}>C</span>
              <div>
                <div className="inline-block text-[11px] font-bold px-2 py-0.5 rounded mb-1" style={{ backgroundColor: '#cfd8dc', color: '#33475b' }}>Ⅲ. 메모리 관리 · III-2-1</div>
                <h1 className="text-2xl font-bold" style={{ color: '#33475b' }}>III-2-1. 문자열과 버퍼 오버플로</h1>
                <p className="text-sm" style={{ color: '#5C6BC0' }}>C 문자열(널 종료 배열)의 원리와 버퍼 오버플로 취약점·안전한 처리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#33475b' }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#5C6BC0' : '#cfd8dc' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#33475b' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#dfe3ea' }}>{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white hover:opacity-90"
                style={{ backgroundColor: playing ? '#33475b' : '#5C6BC0' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#8a95a6' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#5C6BC0', color: '#33475b' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                C 문자열은 char 배열 끝에 널 종료(\0)가 붙은 것이고, strlen은 \0까지 세므로 배열 크기(sizeof)와 다르다 — 널 자리(+1)를 항상 계산에 넣어야 한다.
                strcpy·strcat·sprintf·gets 는 경계 검사가 없어 버퍼를 넘겨 인접 메모리(지역변수·복귀 주소)를 훼손하고, 이것이 크래시나 코드 실행 취약점(스택 스매싱)이 된다.
                가장 흔한 사고는 널 자리를 빼먹는 off-by-one과 널 종료 누락(over-read), 그리고 gets 사용이다.
                안전 공식은 하나다: 크기를 아는 함수(snprintf·fgets·strncat) + 널 종료 보장 + 입력 검증 + 컴파일러/ASan 검증.
                다음 장 III-2-2에서는 malloc/free 로 다루는 동적 메모리의 힙 오류를 이어서 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['문자열', '널종료', 'strlen', '버퍼오버플로', 'strcpy', 'snprintf', 'strncpy', 'off-by-one', 'gets금지', 'fgets', '스택스매싱', '입력검증', 'ASan'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#eef0f7', color: '#33475b', borderColor: '#cfd8dc' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#33475b' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
