  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    C I-1-2 — 타입·크기·정수 오버플로
    학습 목표: C 정수/실수 타입의 크기·표현 범위와 오버플로·부호 문제를
              비트 관점으로 추적한다. sizeof·플랫폼 의존·stdint.h,
              2의 보수·unsigned 언더플로, signed 오버플로(UB)·랩어라운드,
              형변환 시 잘림·부호 확장, 실수 정밀도·== 비교까지 5단계.
    패턴: fastapi v1 — 좌(LiveDataPane: 비트 폭 막대·랩어라운드·부호 확장 시각화) / 우(VSCode CodeViewer: types.c)
    색상: C 슬레이트 (슬레이트 블루 #5C6BC0 / 다크 슬레이트 #33475b / 옅은 회색 #cfd8dc)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 크기 → 부호/2의보수 → 오버플로 → 형변환 → 실수
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 정수 타입과 크기 — sizeof는 플랫폼이 정한다',
        desc: 'C의 int가 몇 바이트냐고 물으면 정답은 "환경마다 다르다"이다. 표준은 char ≤ short ≤ int ≤ long ≤ long long 이라는 순서와 최소 크기만 보장할 뿐, 정확한 바이트 수는 컴파일러·CPU·OS(ABI)가 정한다. 실제로 64비트 리눅스에서 long은 8바이트지만 64비트 윈도우에서는 4바이트라, "long이면 8바이트겠지" 하고 짠 코드가 플랫폼을 옮기는 순간 조용히 깨진다. 그래서 크기가 중요한 자리(파일 포맷, 네트워크 프로토콜, 하드웨어 레지스터)에는 stdint.h의 고정폭 타입 int32_t·uint64_t를 쓴다 — 이름 자체가 비트 수를 못 박아 어느 플랫폼에서든 같은 크기를 보장한다. 크기를 확인할 때는 상수를 외우지 말고 항상 sizeof로 물어보는 습관이 안전하다.',
        actor: '📏 sizeof(int) → 환경(ABI)이 결정',
        stage: 'sizes',
        stageLabel: '정수 타입별 비트 폭과 표현 범위',
        rows: [
          { name: 'char',       bits: 8,  fixed: 'int8_t',  range: '-128 ~ 127' },
          { name: 'short',      bits: 16, fixed: 'int16_t', range: '-32,768 ~ 32,767' },
          { name: 'int',        bits: 32, fixed: 'int32_t', range: '약 ±21억' },
          { name: 'long*',      bits: 64, fixed: 'int64_t', range: '약 ±9.2×10¹⁸' },
          { name: 'long long',  bits: 64, fixed: 'int64_t', range: '약 ±9.2×10¹⁸' },
        ],
        alert: { tone: 'warn', text: 'long*은 플랫폼 의존: 64비트 리눅스=8바이트, 64비트 윈도우=4바이트. 크기가 중요하면 상수를 가정하지 말고 stdint.h(int32_t/uint64_t) + sizeof로 확정하라.' },
        code: {
          lang: 'c',
          filename: 'types.c — 크기와 고정폭',
          lines: [
            '#include <stdio.h>',
            '#include <stdint.h>   // 고정폭 정수 타입',
            '',
            'int main(void) {',
            '    // 크기는 상수가 아니라 sizeof 로 물어본다',
            '    printf("char      = %zu bytes\\n", sizeof(char));',
            '    printf("short     = %zu bytes\\n", sizeof(short));',
            '    printf("int       = %zu bytes\\n", sizeof(int));',
            '    printf("long      = %zu bytes\\n", sizeof(long));',
            '    printf("long long = %zu bytes\\n", sizeof(long long));',
            '',
            '    // 플랫폼이 옮겨가도 크기가 고정되는 타입',
            '    int32_t  a = 100;      // 항상 4바이트',
            '    uint64_t b = 100;      // 항상 8바이트',
            '    printf("int32_t=%zu uint64_t=%zu\\n",',
            '           sizeof a, sizeof b);',
            '    return 0;',
            '}',
            '',
            '/* 출력 (64비트 리눅스 gcc):',
            '   char=1 short=2 int=4 long=8 long long=8',
            '   int32_t=4 uint64_t=8',
            '   ── 같은 코드, 64비트 윈도우면 long=4 로 바뀐다 */',
          ],
          highlight: [1, 5, 6, 7, 8, 9, 12, 13, 14],
        },
      },
      {
        title: 'Step 2. 부호와 2의 보수 — 같은 비트, 다른 해석',
        desc: '메모리에는 0과 1만 있고 "음수"라는 표시는 없다. 부호가 있고 없고는 오직 타입이 그 비트를 어떻게 읽느냐의 문제다. C는 음수를 2의 보수로 표현하는데, 규칙은 간단하다: 맨 앞 비트(부호 비트)가 1이면 음수이고, 값은 "비트 반전 후 +1"로 읽는다. 그래서 똑같은 8비트 11111111을 signed char로 읽으면 -1, unsigned char로 읽으면 255가 된다 — 비트는 하나도 안 바뀌었는데 값이 완전히 달라진다. 여기서 unsigned의 함정이 나온다: unsigned는 음수를 표현할 수 없어서 0에서 1을 빼면 음수로 가는 게 아니라 최댓값으로 한 바퀴 돈다(0 - 1 = UINT_MAX). 반복문에서 unsigned 카운터를 0 밑으로 내리거나, size_t(부호 없음)를 음수와 비교하면 이 랩어라운드가 무한 루프나 엉뚱한 분기를 만든다.',
        actor: '🔀 11111111 → signed:-1 / unsigned:255',
        stage: 'signed',

    // ─────────────────────────────────────────────────────
    // 공용: 8비트 비트 열 렌더

    function BitRow({ bits, hiFirst }) {
      return (
        <div className="flex gap-0.5 font-mono">
          {bits.split('').map((b, i) => (
            <span
              key={i}
              className={`w-5 h-6 flex items-center justify-center rounded text-[11px] font-bold border ${
                b === '1'
                  ? 'bg-[#5C6BC0] text-white border-[#5C6BC0]'
                  : 'bg-white text-slate-400 border-slate-300'
              } ${hiFirst && i === 0 ? 'ring-2 ring-red-400' : ''}`}
            >{b}</span>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 정수 타입별 비트 폭 막대 + 고정폭/범위
    // ─────────────────────────────────────────────────────
    function SizesView({ rows }) {
      const maxBits = 64;
      return (
        <div className="rounded-lg border-2 border-[#5C6BC0]/40 bg-white p-3 space-y-2">
          <div className="text-[11px] font-bold text-[#33475b] mb-1">📏 정수 타입 — 비트 폭이 곧 표현 범위</div>
          {rows.map((r, i) => (
            <div key={i} className="flex items-center gap-2 text-[10px]">
              <span className="w-20 font-mono font-bold text-[#33475b] text-right">{r.name}</span>
              <div className="flex-1 h-5 rounded bg-slate-100 overflow-hidden border border-slate-300">
                <div
                  className="h-full bg-[#5C6BC0] flex items-center justify-end pr-1.5 text-white font-bold text-[9px]"
                  style={{ width: (r.bits / maxBits) * 100 + '%' }}
                >{r.bits}bit</div>
              </div>
              <span className="w-14 font-mono text-[#5C6BC0]">{r.fixed}</span>
              <span className="w-32 text-slate-500 text-[9px]">{r.range}</span>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────

      const TONE = { blue: 'border-[#5C6BC0] text-[#33475b] bg-[#5C6BC0]/5', red: 'border-red-300 text-red-700 bg-red-50' };

        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#5C6BC0]/40 bg-white p-3">
            <div className="text-[11px] font-bold text-[#33475b] mb-2">🔀 같은 8비트, 타입이 정하는 해석</div>
            <div className="flex justify-center mb-2"><BitRow bits={bitsByte} hiFirst /></div>
            <div className="text-center text-[9px] text-slate-500 mb-2">↑ 빨간 테두리 = 부호 비트 (signed일 때 음수 표시)</div>
            <div className="grid grid-cols-2 gap-2">
              {interp.map((it, i) => (
                <div key={i} className={`rounded border-2 p-2 ${TONE[it.tone]}`}>

                  <div key={i} className={`flex items-center gap-2 text-[10px] rounded px-1.5 py-1 ${isWrap ? 'bg-red-50 border border-red-300' : ''}`}>
                    <BitRow bits={w.bits} hiFirst />
                    <span className={`font-mono font-bold w-28 ${isWrap ? 'text-red-700' : 'text-[#33475b]'}`}>signed {w.s}</span>
                    <span className="font-mono text-slate-500">unsigned {w.u}</span>
                  </div>
                );
              })}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">부호 비트가 0→1로 넘어가는 순간, signed 해석은 +127에서 -128로 점프한다.</div>
          </div>
          <div className="rounded-lg border-2 border-slate-300 bg-white p-2.5">
            <table className="w-full text-[10px]">
              <tbody>
                {compare.rows.map((r, i) => (
                  <tr key={i} className="border-t border-slate-200 align-top">
                    <td className={`py-1 font-bold w-28 ${TONE[r.tone]}`}>{r.kind}</td>
                    <td className="py-1 text-slate-700">
                      {r.rule}
                      <div className="font-mono text-[9px] text-slate-500 mt-0.5">{r.ex}</div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 잘림 / 부호·제로 확장 / signed 비교
    // ─────────────────────────────────────────────────────
    function ConvertView({ trunc, extend, signedCmp }) {
      const TONE = { red: 'border-red-300 bg-red-50 text-red-700', blue: 'border-[#5C6BC0] bg-[#5C6BC0]/5 text-[#33475b]' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#5C6BC0]/40 bg-white p-3">
            <div className="text-[11px] font-bold text-[#33475b] mb-1.5">✂️ {trunc.title}</div>
            <div className="font-mono text-[9px] text-slate-500">{trunc.from}</div>
            <div className="text-center text-[#5C6BC0] my-0.5">▼ 상위 비트 버림</div>
            <div className="flex justify-center"><BitRow bits={trunc.keep} /></div>
            <div className="text-center font-mono text-[10px] font-bold text-red-700 mt-1">{trunc.to}</div>
          </div>
          <div className="rounded-lg border-2 border-slate-300 bg-white p-2.5 space-y-1.5">
            <div className="text-[11px] font-bold text-[#33475b]">↔ 확장 — 부호 유무가 채우는 비트를 바꾼다</div>
            {extend.map((e, i) => (
              <div key={i} className={`rounded border-2 p-1.5 ${TONE[e.tone]}`}>
                <div className="text-[10px] font-mono font-bold">{e.as} (8bit: {e.bits})</div>
                <div className="font-mono text-[9px] mt-0.5 break-all">→ {e.ext}</div>
                <div className="text-[9px] font-bold mt-0.5">{e.to}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-800 mb-1">🚨 {signedCmp.title}</div>
            <div className="font-mono text-[10px] text-slate-700">{signedCmp.expr}</div>
            <div className="font-mono text-[10px] font-bold text-red-700 mt-1">{signedCmp.bad}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실수 정밀도 + 접미사 + 실패 지도
    // ─────────────────────────────────────────────────────
    function FloatView({ floatDemo, precision, suffix, pitfalls }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-800 mb-1.5">🎯 부동소수점은 근사값 — == 금지</div>
            <div className="font-mono text-[10px] space-y-0.5">
              <div className="text-slate-700">{floatDemo.expr} =</div>
              <div className="text-red-700 font-bold text-[11px]">{floatDemo.got}  ≠  {floatDemo.want}</div>
              <div className="mt-1 rounded bg-white border border-emerald-300 px-2 py-1 text-emerald-800">✓ {floatDemo.fix}</div>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            {precision.map((p, i) => (
              <div key={i} className="rounded-lg border-2 border-[#5C6BC0]/40 bg-white p-2">
                <div className="text-[11px] font-mono font-bold text-[#33475b]">{p.t}</div>
                <div className="text-[10px] text-[#5C6BC0] font-bold">{p.bits} · {p.digits}</div>
                <div className="text-[9px] text-slate-500 mt-0.5">{p.use}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-slate-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#33475b] mb-1">🏷 리터럴 접미사 = 타입 못박기</div>
            <div className="flex flex-wrap gap-1.5">
              {suffix.map((s, i) => (
                <span key={i} className="text-[9px] font-mono rounded border border-slate-300 bg-slate-50 px-1.5 py-0.5 text-slate-700">
                  <b className="text-[#5C6BC0]">{s.lit}</b> → {s.t}
                </span>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#33475b]/30 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#33475b] mb-1.5">🗺 실무 실패 지도 — 원인 → 처방</div>
            <table className="w-full text-[10px]">
              <tbody>
                {pitfalls.map((p, i) => (
                  <tr key={i} className="border-t border-slate-200">
                    <td className="py-1 text-red-700 font-bold w-1/2">✗ {p.bug}</td>
                    <td className="py-1 text-emerald-700">✓ {p.fix}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#5C6BC0]/5', border: 'border-[#5C6BC0]/40', text: 'text-[#33475b]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-300',    text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',      border: 'border-red-300',      text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300',  text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (슬레이트 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      sizes:    { icon: '📏', label: '타입 크기' },
      signed:   { icon: '🔀', label: '부호·2의 보수' },
      overflow: { icon: '💥', label: '오버플로' },
      convert:  { icon: '✂️', label: '형변환' },
      float:    { icon: '🎯', label: '실수·정밀도' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.sizes;
      return (
        <div className="rounded-xl border border-[#5C6BC0]/40 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#33475b] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>정수/실수 타입 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#5C6BC0] font-mono mb-3 px-2 py-1 rounded bg-[#5C6BC0]/5 border border-[#5C6BC0]/30">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'sizes' && <SizesView rows={state.rows} />}
          {state.stage === 'signed' && <SignedView bitsByte={state.bitsByte} interp={state.interp} underflow={state.underflow} />}
          {state.stage === 'overflow' && <OverflowView wheel={state.wheel} compare={state.compare} />}
          {state.stage === 'convert' && <ConvertView trunc={state.trunc} extend={state.extend} signedCmp={state.signedCmp} />}
          {state.stage === 'float' && <FloatView floatDemo={state.floatDemo} precision={state.precision} suffix={state.suffix} pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#5C6BC0]/20 border-l-2 border-[#5C6BC0] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#eceff4] to-[#e0e4ef] px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2.5 h-10 rounded-lg bg-[#33475b] text-white font-bold text-xs whitespace-nowrap">Ⅰ. 컴파일과 기초</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[11px] font-mono text-[#5C6BC0] font-bold">I-1-2</span>
                </div>
                <h1 className="text-2xl font-bold text-[#33475b]">타입·크기·정수 오버플로</h1>
                <p className="text-sm text-slate-600">C 정수/실수 타입의 크기·표현 범위와 오버플로·부호 문제</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#5C6BC0] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#5C6BC0]' : 'bg-[#cfd8dc]'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#33475b] text-slate-100 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#5C6BC0] bg-white text-[#33475b] hover:bg-[#5C6BC0]/5"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#5C6BC0] bg-white text-[#33475b] hover:bg-[#5C6BC0]/5 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#33475b] text-white' : 'bg-[#5C6BC0] text-white hover:bg-[#4d5bb0]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#5C6BC0] bg-white text-[#33475b] hover:bg-[#5C6BC0]/5 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#5C6BC0] bg-white px-4 py-3 text-sm text-[#33475b]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                C의 타입은 "몇 비트로, 부호가 있게" 값을 담느냐가 전부다. 크기는 플랫폼 의존이니 중요하면 stdint.h(int32_t)와 sizeof로 확정하고,
                unsigned는 음수가 없어 0-1이 최댓값으로 도는 것에 주의한다. signed 오버플로는 UB라 연산 전에 범위를 검사하고,
                형변환의 잘림·부호 확장·signed↔unsigned 비교(-1 &lt; 1u = false)를 항상 의식한다. 실수는 근사값이라 ==대신 epsilon으로 비교한다.
                다음 장 I-2-1에서는 이 타입들이 메모리에 놓이는 방식 — 포인터와 주소를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['sizeof', 'stdint.h', '2의보수', 'unsigned', '언더플로', '오버플로', 'UB', '부호확장', '정수승격', 'epsilon'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfd8dc]/50 text-[#33475b] border border-[#cfd8dc]">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#33475b]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
