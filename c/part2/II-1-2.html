  <!--
    C II-1-2 — 포인터 연산·배열과의 관계

              배열 이름이 첫 원소 주소로 붕괴(decay)하여 a[i] == *(a+i) 로 계산되는 원리,
              배열을 함수에 넘기면 크기 정보가 사라지는 문제, 경계 초과(버퍼 오버런)와
              off-by-one, 문자열(char 배열 + 널 종료)까지 실무 감각으로 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: 연속 메모리 슬롯 + 포인터 이동 시각화) / 우(VSCode CodeViewer: C)

  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 포인터 산술 → 배열 붕괴 → 크기 소실 → 경계 초과 → 문자열/다차원
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(arith/decay/sizeloss/bounds/string)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 포인터 산술 — p+1은 "바이트 1"이 아니라 "요소 1"만큼 움직인다',
        desc: '포인터에 1을 더하면 주소가 1바이트 증가할 것 같지만 실제로는 그렇지 않다. 컴파일러는 포인터가 가리키는 타입의 크기(sizeof)를 알기 때문에, p+1은 "다음 요소"로 이동하도록 주소를 sizeof(타입)만큼 증가시킨다. 예를 들어 int(4바이트)를 가리키는 포인터에 +1을 하면 주소는 4가 커진다. 이 규칙 덕분에 우리는 바이트 계산 없이 배열을 한 칸씩 순회할 수 있다. 같은 배열 안의 두 포인터를 빼면 그 결과도 바이트 수가 아니라 "요소 개수"(ptrdiff_t)로 나온다. 포인터 비교(<, >, ==)도 같은 배열 안에서만 의미가 있으며, 서로 다른 배열의 포인터를 비교하는 것은 정의되지 않은 동작이다.',
        actor: '👉 int *p = &a[0];  p+1 은 주소 +4 (요소 1칸)',
        stage: 'arith',
        stageLabel: '포인터 산술 · p+1 = 주소 + sizeof(요소)',
        arith: {
          base: 0x1000,
          elemSize: 4,
          values: [10, 20, 30, 40, 50],
          from: 1,
          to: 3,
          fromLabel: 'p',
          toLabel: 'p+2',
        },
        diff: {
          title: '포인터 차이 · 비교',

            { expr: '(p+2) - p', result: '2   (요소 개수, 바이트 아님)' },

        },
        alert: { tone: 'info', text: 'p+1 은 sizeof(*p) 만큼 주소를 옮긴다 = "다음 요소". 두 포인터의 차는 요소 개수(ptrdiff_t)로 나온다. 포인터 비교는 같은 배열 안에서만 정의된다.' },

            'int main(void) {',
            '    int a[5] = {10, 20, 30, 40, 50};',
            '    int *p = &a[0];        // p 는 a[0] 을 가리킴 (주소 0x1000 가정)',

            '    printf("%p\\n", (void*)p);       // => 0x1000',
            '    printf("%p\\n", (void*)(p + 1)); // => 0x1004  (+4 = sizeof(int))',
            '    printf("%p\\n", (void*)(p + 2)); // => 0x1008  (+8, 두 칸)',
            '',
            '    printf("%d\\n", *(p + 2));       // => 30  (a[2] 와 동일)',
            '',
            '    int *q = &a[3];',
            '    printf("%td\\n", q - p);         // => 3  (바이트 12 아님! 요소 3개)',
            '',
            '    // 포인터 비교는 같은 배열 안에서만 의미가 있다',

      },
      {
        title: 'Step 2. 배열 붕괴 — 배열 이름은 첫 원소 주소로 변하고, a[i] == *(a+i)',
        desc: 'C에서 배열 이름을 식(expression) 안에서 쓰면 대부분의 상황에서 "첫 원소의 주소"로 자동 변환된다. 이것을 배열-포인터 붕괴(decay)라고 부른다. 그래서 a라고 쓰면 사실상 &a[0]과 같고, 인덱싱 a[i]는 컴파일러 입장에서 *(a+i)로 번역된다. 여기서 재미있는 사실은 덧셈이 교환법칙을 따르므로 *(a+i)는 *(i+a)와 같고, 따라서 문법적으로는 i[a]도 합법이라는 점이다(실무에서 쓰면 안 되지만 원리를 보여준다). 이 붕괴 규칙 때문에 "배열은 포인터다"라는 오해가 생기는데, 정확히는 다르다: 배열은 연속된 저장 공간 그 자체이고, 포인터는 주소를 담는 별개의 변수다. 다만 식에서 배열을 쓰면 주소로 붕괴할 뿐이다. sizeof와 &(주소 연산자) 앞에서는 붕괴가 일어나지 않는다는 예외가 다음 단계의 핵심이 된다.',

        stage: 'decay',
        stageLabel: '배열 붕괴 · a → &a[0], a[i] = *(a+i)',
        decay: {
          base: 0x1000,
          elemSize: 4,
          values: [10, 20, 30, 40, 50],
          idx: 2,
        },
        equiv: {
          title: '같은 것을 네 가지로 쓴다',
          rows: [
            { a: 'a[2]', b: '*(a + 2)', note: '인덱싱 = 붕괴 후 포인터 산술' },
            { a: 'a', b: '&a[0]', note: '배열 이름 → 첫 원소 주소' },

        alert: { tone: 'info', text: '식 안의 배열 이름은 첫 원소 주소로 붕괴한다. a[i] 는 컴파일러가 *(a+i) 로 번역한다. "배열=포인터"는 오해 — 배열은 저장 공간, 포인터는 주소 변수다.' },
        code: {
          lang: 'c',
          filename: 'array_decay.c — a[i] 는 *(a+i) 다',
          lines: [
            '#include <stdio.h>',
            '',
            'int main(void) {',

            '    return 0;',
            '}',
          ],
          highlight: [4, 7, 8, 9, 10, 13, 16, 18],

      },
      {
        title: 'Step 3. 크기 소실 — 배열을 함수에 넘기면 sizeof 가 포인터 크기가 된다',
        desc: '배열을 함수 인자로 넘기면 방금 배운 붕괴가 일어나, 함수는 배열 전체가 아니라 첫 원소의 주소(포인터) 하나만 받는다. 그래서 함수 매개변수를 int arr[]라고 써도 컴파일러는 이를 int *arr로 취급한다. 가장 치명적인 실무 실수가 여기서 나온다: 함수 안에서 sizeof(arr)를 하면 배열 전체 바이트가 아니라 포인터 크기(64비트에서 8바이트)가 나온다. 호출한 쪽에서는 sizeof(a)가 20바이트(int 5개)였는데, 함수로 넘어가는 순간 그 크기 정보가 완전히 사라진다. 따라서 sizeof(arr)/sizeof(arr[0])로 길이를 구하는 관용구는 오직 배열이 선언된 그 스코프에서만 통하고, 함수 안에서는 절대 통하지 않는다. 해결책은 명확하다: 배열을 넘길 때는 반드시 길이(size_t n)를 별도 인자로 함께 넘겨야 한다. 이걸 빠뜨리면 함수는 어디까지가 유효한 데이터인지 알 방법이 없다.',

      {
        title: 'Step 4. 경계 초과 — off-by-one 한 칸이 버퍼 오버런이 된다',
        desc: 'C는 배열 인덱스가 유효 범위 안에 있는지 전혀 검사하지 않는다. 길이 5인 배열의 유효 인덱스는 0..4인데, 실수로 a[5]에 접근하면 배열 바로 뒤의 남의 메모리를 건드린다 — 이것이 버퍼 오버런이다. 가장 흔한 원인이 off-by-one, 즉 반복문 조건을 i <= n처럼 등호를 잘못 넣어 한 칸 더 나가는 것이다. 읽기만 하면 쓰레기 값을 읽는 정도지만, 쓰기(write)로 넘어가면 인접 변수·스택 프레임·리턴 주소를 덮어써 크래시나 보안 취약점(스택 스매싱)이 된다. 포인터 산술로 순회할 때도 같은 위험이 있다: p가 배열 끝을 지나도 컴파일러는 막아주지 않는다. C 표준은 "배열의 한 칸 뒤 주소(one-past-the-end)"까지 계산하는 것만 허용하고, 그 주소를 역참조(*)하는 것은 정의되지 않은 동작으로 규정한다. 그래서 순회 종료 조건은 반드시 p < a+n(끝 다음 직전까지)이어야 하며, p <= a+n으로 쓰면 마지막 반복에서 경계를 넘는다. 실무에서는 경계를 넘겨도 당장은 멀쩡히 돌다가 나중에 엉뚱한 곳에서 터지기 때문에 디버깅이 매우 어렵다.',
        actor: '👉 int a[5];  a[5] 접근 = 배열 밖 = 미정의 동작',

        stageLabel: '경계 초과 · 유효 인덱스 0..n-1',
        bounds: {
          base: 0x1000,

          overIndex: 5,
        },

            { bad: 'for (p = a; p <= a+n; p++)', good: 'for (p = a; p < a+n; p++)', note: 'one-past-the-end 역참조 = 미정의' },
            { bad: 'char buf[8]; strcpy(buf, "123456789")', good: 'snprintf(buf, sizeof buf, ...)', note: '널 문자까지 9바이트 > 8 → 오버런' },
          ],
        },
        alert: { tone: 'danger', text: 'C는 인덱스 검사를 안 한다. 유효 범위는 0..n-1. a[n] 접근(특히 쓰기)은 버퍼 오버런 → 크래시·보안 취약점. 순회 종료는 p < a+n 이어야 하고 p <= a+n 은 경계를 넘는다.' },
        code: {
          lang: 'c',
          filename: 'overrun.c — 한 칸이 버퍼 오버런',
          lines: [
            '#include <stdio.h>',
            '#include <string.h>',
            '',
            'int main(void) {',
            '    int a[5] = {10, 20, 30, 40, 50};',
            '',
            '    // ❌ off-by-one: i <= 5 는 a[5] 를 건드린다 (배열 밖!)',
            '    for (int i = 0; i <= 5; i++)',
            '        printf("%d ", a[i]);      // a[5] = 쓰레기/크래시',

            '    // ✅ 포인터 순회도 끝 "직전"까지: p < a + 5',

            '        printf("%d ", *p);        // p == a+5 는 역참조 금지',

            '    // strcpy(buf, "123456789");  // 오버런 — 절대 금지',

            '    printf("\\n%s\\n", buf);       // => 1234567',

          ],

        },
      },
      {
        title: 'Step 5. 문자열과 다차원 배열 — char 배열 + 널 종료, 그리고 행 우선 저장',
        desc: 'C에는 전용 문자열 타입이 없다. 문자열은 그냥 char 배열이고, 끝을 알리는 널 문자 \'\\0\'(값 0)로 종료된다. 그래서 "abc"는 실제로 4바이트({\'a\',\'b\',\'c\',\'\\0\'})를 차지하고, strlen은 이 널을 만날 때까지 세므로 3을 반환하지만 저장에는 4바이트가 필요하다 — 버퍼 크기를 잡을 때 널 한 칸을 빼먹는 것이 문자열 오버런의 단골 원인이다. 문자열 순회도 결국 포인터 산술이라, char *s를 s+1로 옮기며 *s가 \'\\0\'이 될 때까지 도는 것이 strlen의 본질이다. 다차원 배열 int m[2][3]은 메모리에 행 우선(row-major)으로 연속 저장된다: m[0][0], m[0][1], m[0][2], m[1][0]... 순서다. 따라서 m[i][j]는 *(&m[0][0] + i*3 + j)로 계산된다 — 열 개수(3)를 곱하는 이유가 여기 있고, 그래서 함수에 2차원 배열을 넘길 때 열 크기 int m[][3]는 반드시 알려줘야 컴파일러가 주소를 계산할 수 있다. 이제 다음 장 II-2-1에서는 이렇게 다룬 메모리를 직접 할당·해제하는 동적 메모리(malloc/free)로 넘어간다.',
        actor: '👉 "abc" = {\'a\',\'b\',\'c\',\'\\0\'} · m[i][j] = *(base + i*cols + j)',

        stageLabel: '문자열(널 종료) · 다차원 배열(행 우선)',

          chars: [
            { ch: "'a'", code: 97 },
            { ch: "'b'", code: 98 },
            { ch: "'c'", code: 99 },
            { ch: "'\\0'", code: 0, nul: true },
          ],
          note: "strlen(\"abc\") == 3 (널 제외) 이지만 저장은 4바이트 필요.",
        },
        matrix: {
          title: 'int m[2][3] — 행 우선 연속 저장',
          rows: 2,
          cols: 3,
          values: [1, 2, 3, 4, 5, 6],
          note: 'm[1][1] = *(&m[0][0] + 1*3 + 1) = 5. 함수엔 열 개수 m[][3] 필수.',
        },
        alert: { tone: 'good', text: '문자열 = char 배열 + \\0 종료 → 저장은 항상 +1바이트. strlen 은 널까지의 포인터 순회. 다차원은 행 우선 연속: m[i][j] = *(base + i*cols + j), 그래서 열 개수는 반드시 알려야 한다.' },
        code: {
          lang: 'c',
          filename: 'string_matrix.c — 널 종료와 행 우선',
          lines: [
            '#include <stdio.h>',
            '#include <string.h>',
            '',
            '// strlen 의 본질: 널을 만날 때까지 포인터를 전진',
            'size_t my_strlen(const char *s) {',
            '    const char *p = s;',
            "    while (*p != '\\0') p++;   // s+1, s+2 ... 널까지",
            '    return p - s;             // 요소(문자) 개수',
            '}',
            '',
            'int main(void) {',
            '    char msg[] = "abc";       // 4바이트: a b c \\0',
            '    printf("len=%zu size=%zu\\n",',
            '           my_strlen(msg), sizeof(msg));  // => len=3 size=4',
            '',
            '    // 다차원 배열은 메모리에 행 우선으로 연속 저장',
            '    int m[2][3] = {{1, 2, 3}, {4, 5, 6}};',
            '    int *base = &m[0][0];',
            '    // m[1][1] 은 base + 1*3 + 1 번째 요소',
            '    printf("%d\\n", *(base + 1 * 3 + 1)); // => 5 (== m[1][1])',
            '    return 0;',
            '}',
          ],
          highlight: [5, 6, 7, 8, 12, 14, 17, 18, 20],
        },
      },

    // ─────────────────────────────────────────────────────
    // 공용 — 연속 메모리 슬롯 렌더 (배열을 주소가 붙은 칸으로 그림)
    //   highlightIdx: 강조할 인덱스 집합, tone: 강조색
    // ─────────────────────────────────────────────────────
    function MemoryStrip({ base, elemSize, values, marks }) {
      const hex = (n) => '0x' + n.toString(16).toUpperCase();
      return (
        <div className="flex gap-1 items-end overflow-x-auto pb-1">
          {values.map((v, i) => {
            const m = (marks && marks[i]) || {};
            const toneCls = m.over
              ? 'bg-red-100 border-red-400 text-red-800'
              : m.hi
              ? 'bg-indigo-100 border-indigo-500 text-indigo-900'
              : 'bg-white border-slate-300 text-slate-700';
            return (
              <div key={i} className="flex flex-col items-center">
                <div className={`w-14 rounded border-2 px-1 py-1.5 text-center font-mono ${toneCls}`}>
                  <div className="text-[8px] opacity-70">a[{i}]</div>
                  <div className="text-sm font-bold">{v}</div>
                </div>
                <div className="text-[8px] font-mono text-slate-400 mt-0.5">{hex(base + i * elemSize)}</div>
                {m.ptr && <div className="text-[9px] font-bold text-indigo-600 mt-0.5">▲ {m.ptr}</div>}
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 포인터 산술: 슬롯 위 포인터가 p → p+2 로 점프
    // ─────────────────────────────────────────────────────
    function ArithView({ arith, diff }) {
      const marks = {};
      marks[arith.from] = { ptr: arith.fromLabel, hi: false };
      marks[arith.to] = { ptr: arith.toLabel, hi: true };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">👉 int(4바이트) 배열 — p+1 은 주소를 +4</div>
            <MemoryStrip base={arith.base} elemSize={arith.elemSize} values={arith.values} marks={marks} />
            <div className="mt-2 text-center text-[10px] font-mono text-indigo-700">
              p = 0x1004 · p+2 = 0x100C · 주소차 = 8바이트 = 요소 2칸
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">🧮 {diff.title}</div>
            <div className="space-y-1">
              {diff.rows.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] font-mono">
                  <span className="rounded bg-slate-50 border border-slate-300 px-2 py-1 text-slate-700 w-32">{r.expr}</span>
                  <span className="text-sky-500 font-bold">=</span>
                  <span className="flex-1 rounded bg-sky-50 border border-sky-300 px-2 py-1 text-sky-900">{r.result}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 배열 붕괴: a[i] == *(a+i) 등가 표현
    // ─────────────────────────────────────────────────────
    function DecayView({ decay, equiv }) {
      const marks = {};
      marks[decay.idx] = { ptr: 'a+' + decay.idx, hi: true };
      marks[0] = { ptr: 'a (=&a[0])' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🪂 배열 이름 a 는 첫 원소 주소로 붕괴</div>
            <MemoryStrip base={decay.base} elemSize={decay.elemSize} values={decay.values} marks={marks} />
            <div className="mt-2 text-center text-[11px] font-mono text-indigo-800 font-bold">
              a[{decay.idx}] &nbsp;≡&nbsp; *(a + {decay.idx}) &nbsp;=&nbsp; {decay.values[decay.idx]}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">🟰 {equiv.title}</div>
            <div className="space-y-1">
              {equiv.rows.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono rounded bg-indigo-50 border border-indigo-300 px-2 py-1 text-indigo-900 w-20 text-center font-bold">{r.a}</span>
                  <span className="text-sky-500 font-bold">≡</span>
                  <span className="font-mono rounded bg-slate-50 border border-slate-300 px-2 py-1 text-slate-700 w-24 text-center">{r.b}</span>
                  <span className="flex-1 text-[9px] text-slate-500">{r.note}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 크기 소실: 호출측 vs 함수측 sizeof 비교
    // ─────────────────────────────────────────────────────
    function SizeLossView({ sizeloss, fix }) {
      const Card = ({ d }) => (
        <div className={`flex-1 rounded-lg border-2 p-3 ${d.ok ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
          <div className={`text-[10px] font-bold mb-1 ${d.ok ? 'text-emerald-800' : 'text-red-800'}`}>{d.label}</div>
          <div className="font-mono text-[11px] text-slate-700 mb-1">{d.expr}</div>
          <div className={`text-2xl font-bold font-mono ${d.ok ? 'text-emerald-700' : 'text-red-600'}`}>{d.bytes}<span className="text-xs"> 바이트</span></div>
          <div className="text-[9px] text-slate-500 mt-1">{d.note}</div>
        </div>
      );
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">📏 같은 배열, 다른 sizeof — 함수로 넘기면 크기가 증발</div>
            <div className="flex gap-2 items-stretch">
              <Card d={sizeloss.caller} />
              <div className="flex items-center text-indigo-400 text-lg font-bold">→</div>
              <Card d={sizeloss.callee} />
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1.5">🩹 {fix.title}</div>
            <div className="space-y-1 text-[10px] font-mono">
              <div className="rounded bg-white border border-red-300 px-2 py-1 text-red-700">❌ {fix.bad}</div>
              <div className="rounded bg-white border border-emerald-300 px-2 py-1 text-emerald-800 font-bold">✅ {fix.good}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 경계 초과: 배열 밖 슬롯을 빨강으로, off-by-one 패턴표
    // ─────────────────────────────────────────────────────
    function BoundsView({ bounds, cases }) {
      const marks = {};
      const withOver = [...bounds.values, '??'];
      marks[bounds.overIndex] = { over: true, ptr: 'a[5] 배열 밖!' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🚧 유효 인덱스 0..4 — a[5] 는 남의 메모리</div>
            <MemoryStrip base={bounds.base} elemSize={bounds.elemSize} values={withOver} marks={marks} />
            <div className="mt-2 text-center text-[10px] text-red-600 font-mono">
              a[5] 접근 = one-past-the-end 역참조 = 정의되지 않은 동작(UB)
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-800 mb-1.5">🚨 {cases.title}</div>
            <div className="space-y-1.5">
              {cases.rows.map((r, i) => (
                <div key={i} className="text-[10px]">
                  <div className="flex items-center gap-1.5 font-mono">
                    <span className="flex-1 rounded bg-white border border-red-300 px-2 py-1 text-red-700">❌ {r.bad}</span>
                    <span className="flex-1 rounded bg-white border border-emerald-300 px-2 py-1 text-emerald-800">✅ {r.good}</span>
                  </div>
                  <div className="text-[9px] text-slate-500 mt-0.5 pl-1">{r.note}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 문자열(널 종료) + 다차원 배열(행 우선) 시각화
    // ─────────────────────────────────────────────────────
    function StringView({ strBytes, matrix }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🔤 {strBytes.title}</div>
            <div className="flex gap-1">
              {strBytes.chars.map((c, i) => (
                <div key={i} className={`flex-1 rounded border-2 px-1 py-1.5 text-center font-mono ${c.nul ? 'bg-amber-100 border-amber-400 text-amber-800' : 'bg-indigo-50 border-indigo-300 text-indigo-900'}`}>
                  <div className="text-sm font-bold">{c.ch}</div>
                  <div className="text-[8px] opacity-70">코드 {c.code}</div>
                </div>
              ))}
            </div>
            <div className="text-[9px] text-slate-500 mt-1.5">{strBytes.note}</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-sky-800 mb-2">🧱 {matrix.title}</div>
            <div className="flex gap-1 overflow-x-auto">
              {matrix.values.map((v, i) => {
                const r = Math.floor(i / matrix.cols);
                const c = i % matrix.cols;
                const hi = r === 1 && c === 1;
                return (
                  <div key={i} className={`flex flex-col items-center rounded border px-2 py-1 font-mono ${hi ? 'bg-sky-100 border-sky-500 text-sky-900' : 'bg-slate-50 border-slate-300 text-slate-700'}`}>
                    <div className="text-[8px] opacity-70">m[{r}][{c}]</div>
                    <div className="text-sm font-bold">{v}</div>
                    <div className="text-[7px] text-slate-400">#{i}</div>
                  </div>
                );
              })}
            </div>
            <div className="text-[9px] text-slate-500 mt-1.5">{matrix.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (slate blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      arith:    { icon: '👉', label: '포인터 산술' },
      decay:    { icon: '🪂', label: '배열 붕괴' },
      sizeloss: { icon: '📏', label: '크기 소실' },
      bounds:   { icon: '🚧', label: '경계 초과' },
      string:   { icon: '🔤', label: '문자열·다차원' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.arith;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>포인터·배열 메모리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-indigo-700 font-mono mb-3 px-2 py-1 rounded bg-indigo-50 border border-indigo-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'arith' && <ArithView arith={state.arith} diff={state.diff} />}
          {state.stage === 'decay' && <DecayView decay={state.decay} equiv={state.equiv} />}
          {state.stage === 'sizeloss' && <SizeLossView sizeloss={state.sizeloss} fix={state.fix} />}
          {state.stage === 'bounds' && <BoundsView bounds={state.bounds} cases={state.cases} />}
          {state.stage === 'string' && <StringView strBytes={state.strBytes} matrix={state.matrix} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-400/20 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg text-white font-bold text-lg" style={{ backgroundColor: '#5C6BC0' }}>C</span>
              <div>
                <div className="inline-block text-[11px] font-bold px-2 py-0.5 rounded mb-1" style={{ backgroundColor: '#cfd8dc', color: '#33475b' }}>Ⅱ. 포인터 · II-1-2</div>
                <h1 className="text-2xl font-bold" style={{ color: '#33475b' }}>II-1-2. 포인터 연산·배열과의 관계</h1>
                <p className="text-sm" style={{ color: '#5C6BC0' }}>포인터 산술과 배열이 사실상 포인터로 동작하는 원리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#33475b' }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#5C6BC0' : '#cfd8dc' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#33475b' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#dfe3ea' }}>{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white hover:opacity-90"
                style={{ backgroundColor: playing ? '#33475b' : '#5C6BC0' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#8a95a6' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#5C6BC0', color: '#33475b' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                포인터 산술은 바이트가 아니라 "요소" 단위로 움직인다: p+1 은 sizeof(*p) 만큼 주소를 옮기고, 두 포인터의 차는 요소 개수다.
                식 안의 배열 이름은 첫 원소 주소로 붕괴하므로 a[i] 는 곧 *(a+i) 이고, 그래서 배열을 함수에 넘기면 포인터가 되어 sizeof 로 길이를 구할 수 없다 — 반드시 길이 n 을 함께 넘긴다.
                C는 경계를 검사하지 않으니 유효 범위 0..n-1 을 지키고, 순회 종료는 p &lt; a+n 이어야 한다(p &lt;= a+n 은 버퍼 오버런).
                문자열은 char 배열 + 널 종료라 저장에 항상 +1바이트가 필요하고, 다차원 배열은 행 우선으로 연속 저장되어 m[i][j] = *(base + i*cols + j) 로 계산된다.
                다음 장 II-2-1 에서는 이 메모리를 직접 할당·해제하는 동적 메모리(malloc/free)로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['포인터산술', '요소단위', '배열붕괴', 'decay', 'a[i]=*(a+i)', 'sizeof소실', 'off-by-one', '버퍼오버런', 'one-past-the-end', '널종료', 'char배열', '다차원배열', '행우선'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#eef0f7', color: '#33475b', borderColor: '#cfd8dc' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#33475b' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
