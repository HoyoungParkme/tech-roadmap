        desc: '포인터 버그는 개별 규칙을 외우기보다 습관과 도구로 막는 것이 실무 정답이다. 코딩 습관: 포인터는 선언 즉시 초기화, malloc 반환값은 항상 검사, free 직후 NULL 대입, 소유권(누가 해제하는가)을 한 곳으로 명확히, 배열은 경계 검사, 포인터를 품은 구조체는 깊은 복사. 이것으로도 놓치는 사고는 도구가 잡는다: 컴파일할 때 -fsanitize=address(ASan)를 켜면 use-after-free·오버런·이중 free를 발생 지점에서 스택 트레이스와 함께 잡아 주고, valgrind(memcheck)는 재빌드 없이 실행 파일을 감싸 실행하며 잘못된 접근과 메모리 누수를 보고한다. 두 도구는 개발·CI 단계에서 켜고, 배포 빌드에서는 성능을 위해 끈다. 다음 파트에서는 이런 메모리 관리를 좀 더 큰 자료구조 위에서 다룬다.',
        actor: '🛡 습관 6가지 + ASan/valgrind 로 자동 검출',
        stage: 'defense',
        stageLabel: '방어 종합 · 도구',
        alert: { tone: 'good', text: '기억: 초기화 → 실패 검사 → free 후 NULL → 소유권 단일화 → 경계 검사 → 깊은 복사. 그리고 개발/CI에서 -fsanitize=address 와 valgrind 를 항상 켠다.' },
        code: {
          lang: 'c',
          filename: 'defense.sh — 도구로 검출',
          lines: [
            '# ── ASan: 컴파일 옵션 하나로 런타임 검사 ──',
            'gcc -g -fsanitize=address dangling.c -o app',
            './app',
            '# ==ERROR: AddressSanitizer: heap-use-after-free',
            '#   READ of size 4 ... freed by thread T0 here:',
            '#   → 문제가 난 줄과 free 한 줄을 함께 알려줌',
            '',
            '# ── valgrind: 재빌드 없이 실행을 감싸 검사 ──',
            'gcc -g dangling.c -o app',
            'valgrind --leak-check=full ./app',
            '# Invalid read of size 4   ← use-after-free',
            '# Invalid write of size 4  ← 버퍼 오버런',
            '# definitely lost: 32 bytes in 1 blocks  ← 메모리 누수',
            '#',
            '# 방어 체크리스트 (코드 리뷰 때 확인):',
            '#   [1] 포인터 선언 즉시 초기화(=NULL)',
            '#   [2] malloc 반환값 NULL 검사',
            '#   [3] free 직후 포인터 = NULL',
            '#   [4] 소유권(해제 책임) 한 곳으로',
            '#   [5] 배열/버퍼 경계 검사 (0..n-1)',
            '#   [6] 포인터 가진 구조체는 깊은 복사',
          ],
          highlight: [2, 3, 4, 10, 16, 17, 18, 19, 20, 21],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 댕글링 포인터: 힙 블록 상태를 4단계로 애니메이션
    //   phase: 0 할당 → 1 free(반납) → 2 use-after-free(쓰레기) → 3 방어(NULL)
    // ─────────────────────────────────────────────────────
    function DanglingView() {
      const [phase, setPhase] = useState(0);
      useEffect(() => {
        const t = setInterval(() => setPhase((p) => (p + 1) % 4), 1400);
        return () => clearInterval(t);
      }, []);
      const phases = [
        { label: '① malloc — 블록 할당', block: '42', owner: 'p 소유', tone: 'ok', ptr: 'p → 0x1000', danger: false },
        { label: '② free(p) — 블록 반납, p 는 그대로', block: '(반납됨)', owner: '할당자에게 반환', tone: 'free', ptr: 'p → 0x1000 (댕글링!)', danger: true },
        { label: '③ *p 사용 — 재사용된 쓰레기 읽기/쓰기', block: '?? 남의 값', owner: '다른 malloc 이 차지', tone: 'bad', ptr: 'p → 0x1000 (UB)', danger: true },
        { label: '④ 방어: p = NULL — 댕글링 제거', block: '(반납됨)', owner: '접근 시 즉시 크래시', tone: 'safe', ptr: 'p → NULL ✓', danger: false },
      ];
      const cur = phases[phase];
      const blockStyle = {
        ok:   'bg-emerald-50 border-emerald-400 text-emerald-900',
        free: 'bg-slate-100 border-slate-400 text-slate-500 border-dashed',
        bad:  'bg-red-50 border-red-400 text-red-700',
        safe: 'bg-slate-100 border-slate-400 text-slate-400 border-dashed',
      }[cur.tone];
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🧷 힙 메모리와 포인터 — 4단계 애니메이션</div>
            <div className="flex items-center gap-3">
              {/* 포인터 변수 */}
              <div className="text-center">
                <div className="text-[9px] text-slate-500 mb-1">포인터 p (스택)</div>
                <div className={`rounded-lg border-2 px-3 py-2 font-mono text-[11px] font-bold ${cur.danger ? 'bg-red-50 border-red-400 text-red-700' : 'bg-indigo-50 border-indigo-400 text-indigo-900'}`}>
                  {cur.ptr}
                </div>
              </div>
              <div className="text-2xl font-bold text-indigo-400">{cur.tone === 'safe' ? '✕' : '→'}</div>
              {/* 힙 블록 */}
              <div className="text-center flex-1">
                <div className="text-[9px] text-slate-500 mb-1">힙 블록 0x1000</div>
                <div className={`rounded-lg border-2 px-3 py-2 font-mono text-[12px] font-bold ${blockStyle}`}>
                  {cur.block}
                </div>
                <div className="text-[9px] text-slate-500 mt-1">{cur.owner}</div>
              </div>
            </div>
            <div className="mt-3 rounded px-2 py-1.5 text-[11px] font-bold text-center" style={{ backgroundColor: cur.danger ? '#fee2e2' : '#dcfce7', color: cur.danger ? '#b91c1c' : '#166534' }}>
              {cur.label}
            </div>
            {/* phase 진행 점 */}
            <div className="flex justify-center gap-1.5 mt-2">
              {phases.map((_, i) => (
                <span key={i} className="w-2 h-2 rounded-full" style={{ backgroundColor: i === phase ? '#5C6BC0' : '#cfd8dc' }} />
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5 text-[10px] text-amber-900">
            <span className="font-bold">왜 위험한가:</span> free 직후엔 값이 남아 있어 "잘 도는 척"하다가, 그 블록이 재사용되는 순간 간헐적으로 터진다.
            <span className="font-bold"> 방어:</span> free 후 곧바로 p = NULL → 재접근이 UB가 아니라 즉시·재현 가능한 크래시가 된다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 미초기화(wild) 포인터 & NULL 역참조
    // ─────────────────────────────────────────────────────
    function WildView() {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">🎯 미초기화 포인터(wild) — 아무 데나 가리킴</div>
            <div className="flex items-center gap-2 font-mono text-[10px]">
              <span className="rounded border-2 border-red-400 bg-white px-2 py-1.5 text-red-700 font-bold">int *p;</span>
              <span className="text-red-500 font-bold">→</span>
              <div className="flex-1 grid grid-cols-4 gap-1">
                {['0x??', '0x??', '0x??', '0x??'].map((a, i) => (
                  <span key={i} className="rounded border border-slate-300 bg-slate-100 text-center py-1 text-slate-500">{a}</span>
                ))}
              </div>
            </div>
            <div className="text-[10px] text-red-800 mt-2">*p = 10 → 스택 쓰레기 주소 어딘가에 씀. 즉사하거나(운 좋게) 조용히 데이터 오염(운 나쁘게).</div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🕳 NULL 역참조 — 검사 없이 malloc 결과 사용</div>
            <div className="space-y-1 text-[10px] font-mono">
              <div className="rounded bg-slate-50 border border-slate-300 px-2 py-1 text-slate-700">int *buf = malloc(n); <span className="text-slate-400">// 실패 시 NULL 반환</span></div>
              <div className="text-center text-red-400">▼ 검사 없이</div>
              <div className="rounded bg-red-50 border border-red-300 px-2 py-1 text-red-700 font-bold">buf[0] = 1; → Segmentation fault</div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5 text-[10px] text-emerald-900">
            <span className="font-bold">방어:</span> int *p = NULL; 로 초기화 + if (buf == NULL) return; 로 반환값을 쓰기 전에 항상 검사.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 이중 free: free list 손상
    // ─────────────────────────────────────────────────────
    function DoubleFreeView() {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">♻️ 이중 free — 같은 블록을 두 번 반납</div>
            <div className="flex items-center gap-2 text-[10px] font-mono">
              <span className="rounded border-2 border-slate-400 bg-slate-50 px-2 py-1.5 text-slate-700 text-center">블록<br/>0x1000</span>
              <div className="flex-1 space-y-1">
                <div className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-emerald-900">free(s) ① → free list 에 반납 ✓</div>
                <div className="rounded border border-red-400 bg-red-50 px-2 py-1 text-red-700 font-bold">free(s) ② → 같은 블록 또 반납 ✗</div>
              </div>
            </div>
            <div className="mt-2 rounded bg-red-100 border border-red-300 px-2 py-1 text-[10px] text-red-800 font-bold text-center">free list 손상 → abort / 힙 취약점</div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">👑 소유권 — 누가 해제하는가</div>
            <div className="space-y-1 text-[10px]">
              <div className="rounded border border-red-200 bg-red-50 px-2 py-1 text-red-700">✗ 두 함수가 각자 "내가 free" → 이중 free</div>
              <div className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-emerald-900">✓ 만든 쪽만 해제 · 빌린 쪽은 사용만</div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5 text-[10px] text-emerald-900">
            <span className="font-bold">방어:</span> free(s); s = NULL; → 두 번째 free(NULL)은 표준상 안전한 no-op.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 버퍼 오버런(off-by-one) & 얕은 복사
    // ─────────────────────────────────────────────────────
    function OverrunView() {
      const n = 4;
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">📏 off-by-one — n칸 버퍼에 i &lt;= n</div>
            <div className="flex items-center gap-1 font-mono text-[10px]">
              {Array.from({ length: n }).map((_, i) => (
                <span key={i} className="w-9 text-center rounded border border-indigo-300 bg-indigo-50 py-1.5 text-indigo-900">buf[{i}]</span>
              ))}
              <span className="w-9 text-center rounded border-2 border-red-400 bg-red-50 py-1.5 text-red-700 font-bold">buf[{n}]</span>
            </div>
            <div className="flex items-center gap-1 mt-1 text-[9px] text-slate-500">
              {Array.from({ length: n }).map((_, i) => (<span key={i} className="w-9 text-center">유효</span>))}
              <span className="w-9 text-center text-red-600 font-bold">경계밖</span>
            </div>
            <div className="text-[10px] text-red-800 mt-2">i &lt;= n 은 buf[n]에 씀 → 인접 메타데이터/변수 오염. 조건을 i &lt; n 으로.</div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🔗 얕은 복사 — 포인터 주소만 복사</div>
            <div className="flex items-center gap-2 text-[10px] font-mono">
              <div className="space-y-1">
                <div className="rounded border border-slate-300 bg-slate-50 px-2 py-1 text-slate-700">a.name ↘</div>
                <div className="rounded border border-slate-300 bg-slate-50 px-2 py-1 text-slate-700">b.name ↗</div>
              </div>
              <span className="text-red-500 font-bold">→</span>
              <span className="rounded border-2 border-red-400 bg-red-50 px-3 py-2 text-red-700 font-bold text-center">같은 블록<br/>"kim"</span>
            </div>
            <div className="text-[10px] text-red-800 mt-2">둘 다 free → 이중 free / 한쪽 free → 다른 쪽 댕글링. 깊은 복사(malloc+strcpy)로 분리.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 방어 종합 체크리스트 + 도구 표
    // ─────────────────────────────────────────────────────
    function DefenseView() {
      const rules = [
        '포인터 선언 즉시 초기화 (= NULL)',
        'malloc 반환값 NULL 검사 후 사용',
        'free 직후 포인터 = NULL',
        '소유권(해제 책임) 한 곳으로 단일화',
        '배열/버퍼 경계 검사 (인덱스 0..n-1)',
        '포인터 가진 구조체는 깊은 복사',
      ];
      const tools = [
        { name: 'ASan', how: '-fsanitize=address 로 재컴파일', find: 'use-after-free · 오버런 · 이중 free를 발생 지점 스택트레이스와 함께', when: '개발/CI 빌드' },
        { name: 'valgrind', how: '재빌드 없이 실행을 감싸 실행', find: '잘못된 읽기/쓰기 · 메모리 누수(definitely lost)', when: '개발/CI 실행' },
      ];
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">🛡 방어 습관 6가지 체크리스트</div>
            <div className="grid grid-cols-1 gap-1">
              {rules.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] rounded border border-emerald-200 bg-emerald-50 px-2 py-1 text-emerald-900">
                  <span className="w-4 h-4 rounded-full bg-emerald-500 text-white text-[9px] font-bold flex items-center justify-center">{i + 1}</span>
                  <span>{r}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">🔍 도구 — 사람이 놓친 것을 잡는다</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-sky-900 border-b border-sky-200">
                  <th className="text-left py-0.5">도구</th>
                  <th className="text-left py-0.5 pl-1">사용법 · 무엇을 잡나</th>
                </tr>
              </thead>
              <tbody>
                {tools.map((t, i) => (
                  <tr key={i} className="border-t border-sky-100 align-top">
                    <td className="py-1 font-mono font-bold text-sky-800 whitespace-nowrap">{t.name}<div className="text-[8px] font-normal text-slate-500">{t.when}</div></td>
                    <td className="py-1 pl-1 text-slate-700">
                      <div>{t.how}</div>
                      <div className="text-emerald-700">✓ {t.find}</div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[9px] text-slate-500">두 도구는 개발·CI에서 켜고, 배포 빌드에서는 성능을 위해 끈다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (slate blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      dangling:   { icon: '🧷', label: '댕글링 포인터' },
      wild:       { icon: '🎯', label: '미초기화 · NULL' },
      doublefree: { icon: '♻️', label: '이중 free' },
      overrun:    { icon: '📏', label: '오버런 · 얕은복사' },
      defense:    { icon: '🛡', label: '방어 종합' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.dangling;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>포인터 버그 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-indigo-700 font-mono mb-3 px-2 py-1 rounded bg-indigo-50 border border-indigo-200">
            현재 주제: {state.stageLabel}
          </div>
          {state.stage === 'dangling' && <DanglingView />}
          {state.stage === 'wild' && <WildView />}
          {state.stage === 'doublefree' && <DoubleFreeView />}
          {state.stage === 'overrun' && <OverrunView />}
          {state.stage === 'defense' && <DefenseView />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-400/20 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg text-white font-bold text-lg" style={{ backgroundColor: '#5C6BC0' }}>C</span>
              <div>
                <div className="inline-block text-[11px] font-bold px-2 py-0.5 rounded mb-1" style={{ backgroundColor: '#cfd8dc', color: '#33475b' }}>Ⅱ. 포인터 · II-2-2</div>
                <h1 className="text-2xl font-bold" style={{ color: '#33475b' }}>II-2-2. 흔한 포인터 버그 — 댕글링·NULL</h1>
                <p className="text-sm" style={{ color: '#5C6BC0' }}>실무에서 반복되는 포인터 버그와 방어 습관</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#33475b' }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#5C6BC0' : '#cfd8dc' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#33475b' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#dfe3ea' }}>{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white hover:opacity-90"
                style={{ backgroundColor: playing ? '#33475b' : '#5C6BC0' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#8a95a6' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#5C6BC0', color: '#33475b' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                포인터 버그 5종은 원인이 다르지만 방어 습관은 겹친다: 댕글링·use-after-free는 free 후 NULL 대입으로,
                미초기화(wild)·NULL 역참조는 선언 즉시 초기화와 malloc 반환값 검사로, 이중 free는 소유권 단일화와 free(NULL) no-op으로,
                버퍼 오버런은 경계 검사(0..n-1)로, 얕은 복사는 깊은 복사로 소유권을 분리해 막는다.
                여섯 가지 습관을 코드 리뷰 체크리스트로 삼고, 개발·CI에서 -fsanitize=address 와 valgrind 를 항상 켜서 사람이 놓친 사고를 도구가 잡게 하라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['댕글링포인터', 'use-after-free', 'free후NULL', '미초기화포인터', 'wildpointer', 'NULL역참조', '이중free', '소유권', '버퍼오버런', 'off-by-one', '얕은복사', '깊은복사', 'valgrind', 'ASan'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#eef0f7', color: '#33475b', borderColor: '#cfd8dc' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#33475b' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
