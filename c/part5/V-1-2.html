  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });

    // Step 1 — 디버그 빌드: 플래그 표 + 심볼 유무 비교

    function GdbView({ cmds, stopped }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🐛 {cmds.title}</div>
            <div className="grid grid-cols-2 gap-1">
              {cmds.rows.map((r, i) => (

                  <span className="font-mono font-bold text-indigo-900">{r.cmd}</span>
                  <span className="block text-slate-600">{r.desc}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
            <div className="text-[11px] font-bold text-amber-900 mb-1.5">⏸ 멈춘 순간 — 상태를 들여다본다</div>

            <div className="text-[10px] font-mono rounded bg-white border border-amber-300 px-2 py-1 text-slate-700 mb-2">{stopped.src}</div>
            <div className="space-y-1">

                <div key={i} className="text-[10px] font-mono rounded border border-slate-300 bg-white px-2 py-0.5 flex items-center gap-2">

              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────

      return (
        <div className="space-y-2">

                <div key={i} className={`text-[10px] font-mono rounded border px-2 py-1 flex items-start gap-2 ${f.bad ? 'bg-white border-red-400 text-red-700' : 'bg-white border-slate-300 text-slate-700'}`}>

            </div>

          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1">🎯 {cond.title}</div>

            <div className="mt-1.5 text-[10px] text-slate-700">{cond.note}</div>
          </div>
        </div>
      );
    }

      leak: 'bg-amber-50 border-amber-300 text-amber-900',
      bad:  'bg-red-50 border-red-300 text-red-700',
      warn: 'bg-sky-50 border-sky-300 text-sky-900',
    };
    function ValgrindView({ report, summary }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🧪 {report.title}</div>
            <div className="space-y-1.5">
              {report.rows.map((r, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 ${SEV_STYLE[r.sev]}`}>
                  <span className="font-mono font-bold">{r.kind}</span>
                  <span className="block font-mono text-[9px] opacity-90">{r.detail}</span>
                  <span className="block text-[9px] font-sans opacity-80">↳ {r.where}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-slate-400 bg-slate-800 p-2.5 font-mono">
            <div className="text-[10px] text-amber-300">{summary.heapLine}</div>
            <div className="text-[10px] text-red-300 mt-0.5">{summary.errLine}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — ASan / assert / printf vs 디버거 비교
    // ─────────────────────────────────────────────────────
    function SanitizerView({ asan, compare, assertBox }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">🛡 {asan.title}</div>
            <div className="text-[10px] font-mono rounded bg-slate-800 text-emerald-300 px-2 py-1">{asan.build}</div>
            <div className="text-[10px] font-mono rounded bg-red-50 border border-red-300 text-red-700 px-2 py-1 mt-1">{asan.hit}</div>
            <div className="mt-1.5 text-[10px] text-slate-700">{asan.note}</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">⚖️ {compare.title}</div>
            <table className="w-full text-[9px]">
              <tbody>
                {compare.rows.map((r, i) => (
                  <tr key={i} className="border-t border-sky-100 align-top">
                    <td className="py-1 font-bold text-sky-800 whitespace-nowrap pr-1">{r.k}</td>
                    <td className="py-1 pl-1">
                      <div className="text-emerald-700">✓ {r.good}</div>
                      <div className="text-red-600">✗ {r.bad}</div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">🔒 {assertBox.title}</div>
            <div className="text-[10px] font-mono rounded bg-white border border-amber-300 px-2 py-1 text-amber-900">{assertBox.code}</div>
            <div className="mt-1 text-[10px] text-amber-900">{assertBox.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실패 지도 + 실전 루틴
    // ─────────────────────────────────────────────────────
    function PitfallsView({ fails, routine }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">🚨 {fails.title}</div>
            <div className="space-y-1.5">
              {fails.rows.map((r, i) => (
                <div key={i} className="text-[10px] rounded border border-red-300 bg-white px-2 py-1">
                  <span className="font-bold text-red-700">✗ {r.bad}</span>
                  <span className="block text-slate-600 text-[9px]">{r.why}</span>
                  <span className="block text-emerald-700 text-[9px]">→ 해법: {r.fix}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">✅ {routine.title}</div>
            <div className="flex flex-wrap items-center gap-1">
              {routine.steps.map((s, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-emerald-400 text-xs font-bold">→</span>}
                  <span className="text-[9px] rounded px-2 py-1 border bg-emerald-50 border-emerald-300 text-emerald-900">{s}</span>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (slate blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      build:     { icon: '🔨', label: '디버그 빌드' },
      gdb:       { icon: '🐛', label: 'gdb 조작' },
      segfault:  { icon: '💥', label: '세그폴트 추적' },
      valgrind:  { icon: '🧪', label: 'valgrind' },
      sanitizer: { icon: '🛡', label: 'ASan / assert' },
      pitfalls:  { icon: '🗺', label: '실패 지도' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.build;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>디버깅 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-indigo-700 font-mono mb-3 px-2 py-1 rounded bg-indigo-50 border border-indigo-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'build' && <BuildView flags={state.flags} symtab={state.symtab} />}
          {state.stage === 'gdb' && <GdbView cmds={state.cmds} stopped={state.stopped} />}
          {state.stage === 'segfault' && <SegfaultView crash={state.crash} cond={state.cond} />}
          {state.stage === 'valgrind' && <ValgrindView report={state.report} summary={state.summary} />}
          {state.stage === 'sanitizer' && <SanitizerView asan={state.asan} compare={state.compare} assertBox={state.assertBox} />}
          {state.stage === 'pitfalls' && <PitfallsView fails={state.fails} routine={state.routine} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-400/20 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg text-white font-bold text-lg" style={{ backgroundColor: '#5C6BC0' }}>C</span>
              <div>
                <div className="inline-block text-[11px] font-bold px-2 py-0.5 rounded mb-1" style={{ backgroundColor: '#cfd8dc', color: '#33475b' }}>Ⅴ. 현장 감각 · V-1-2</div>
                <h1 className="text-2xl font-bold" style={{ color: '#33475b' }}>V-1-2. 디버깅 — gdb·valgrind</h1>
                <p className="text-sm" style={{ color: '#5C6BC0' }}>gdb로 실행을 멈춰 들여다보고 valgrind로 메모리 오류를 잡기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#33475b' }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#5C6BC0' : '#cfd8dc' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#33475b' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#dfe3ea' }}>{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white hover:opacity-90"
                style={{ backgroundColor: playing ? '#33475b' : '#5C6BC0' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#8a95a6' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#5C6BC0', color: '#33475b' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                디버깅은 추측이 아니라 사실로 한다. 항상 -g -O0 로 빌드해 심볼을 넣고, gdb 의 break·run·print·next·step·watch·backtrace 로 실행을 멈춰 상태를 관찰한다.
                세그폴트는 backtrace(bt) 가 크래시 줄과 콜스택을 짚어주고, gdb 밖 크래시는 core dump 로 사후 분석한다.
                눈에 안 보이는 메모리 오류(누수·범위 밖 접근·미초기화·이중 free)는 valgrind memcheck 나 -fsanitize=address(ASan)가 자동으로 고발한다.
                핵심 가정은 assert 로 못 박고, printf 는 빠른 감 잡기용으로만 쓴다. 다음 장 V-2-1 에서는 이렇게 검증한 코드를 빌드/배포로 잇는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['gdb', 'valgrind', '-g', 'backtrace', 'breakpoint', 'watch', 'next vs step', 'segfault', 'core dump', 'memcheck', '메모리누수', 'AddressSanitizer', 'assert', 'printf디버깅'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#eef0f7', color: '#33475b', borderColor: '#cfd8dc' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#33475b' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
