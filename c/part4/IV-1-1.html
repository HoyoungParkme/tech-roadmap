<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔗</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 강조 슬레이트블루 #5C6BC0) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C IV-1-1 — 연결 리스트 (Linked List)
    학습 목표: 노드(data + next 포인터)와 head 포인터로 단일 연결 리스트를 직접 구현한다.
              malloc 노드 할당, 삽입(head/중간/tail)·삭제(포인터 재연결)·탐색·순회,
              O(1) 삽입 vs O(n) 탐색, 배열과의 비교, free/이중 포인터 메모리 관리까지
              실무 실패 사례(끊김/누수/NULL 체크 누락)와 함께 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: 노드+화살표 리스트, 삽입/삭제 애니메이션) / 우(VSCode CodeViewer: C 소스)
    색상: slate blue (#5C6BC0 기조 / 텍스트 #33475b / 채움 #cfd8dc)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 노드 → 삽입 → 삭제 → 순회 → 메모리 → 배열비교
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      node: {lang:"c", filename:"node.c — 노드 정의와 head", lines:[
        "#include <stdio.h>",
        "#include <stdlib.h>   // malloc, free",
        "",
        "// 노드 하나 = 값 + 다음 노드 주소",
        "typedef struct Node {",
        "    int data;             // 실제 저장할 값",
        "    struct Node* next;    // 다음 노드를 가리키는 포인터",
        "} Node;",
        "",
        "// 값 하나로 새 노드를 힙에 할당한다",
        "Node* new_node(int value) {",
        "    Node* n = malloc(sizeof(Node));   // 힙에 노드 크기만큼 확보",
        "    if (n == NULL) return NULL;        // 할당 실패 방어",
        "    n->data = value;",
        "    n->next = NULL;                    // 아직 다음 없음 = 끝",
        "    return n;",
        "}",
        "",
        "int main(void) {",
        "    // head 하나로 리스트 전체 입구를 잡는다",
        "    Node* head = new_node(10);",
        "    head->next = new_node(20);",
        "    head->next->next = new_node(30);",
        "    // head → [10] → [20] → [30] → NULL",
        "    printf(\"%d\\n\", head->next->data);  // => 20",
        "    return 0;",
        "}",
      ]},
      insert: {lang:"c", filename:"insert.c — head/중간/tail 삽입", lines:[
        "// 맨 앞 삽입 — 위치를 이미 알므로 O(1)",
        "void push_front(Node** head, int value) {",
        "    Node* n = new_node(value);",
        "    n->next = *head;    // 1) 새 노드가 기존 첫 노드를 가리키게",
        "    *head = n;          // 2) head 를 새 노드로 (이중 포인터로 수정)",
        "}",
        "",
        "// value 뒤(prev 다음)에 삽입 — 순서가 생명",
        "void insert_after(Node* prev, int value) {",
        "    if (prev == NULL) return;",
        "    Node* n = new_node(value);",
        "    n->next = prev->next;   // 1) 먼저 뒷사슬을 잇고",
        "    prev->next = n;         // 2) 그 다음 앞을 바꾼다",
        "    // 순서를 뒤집으면 prev->next 뒤가 통째로 유실!",
        "}",
        "",
        "// 맨 뒤 삽입 — tail 포인터 없으면 O(n) 순회",
        "void push_back(Node** head, int value) {",
        "    Node* n = new_node(value);",
        "    if (*head == NULL) { *head = n; return; }",
        "    Node* cur = *head;",
        "    while (cur->next != NULL) cur = cur->next;  // 끝까지 걷기",
        "    cur->next = n;",
        "}",
      ]},
      delete: {lang:"c", filename:"delete.c — 재연결 후 free", lines:[
        "// value 를 가진 첫 노드를 삭제한다",
        "// head 가 바뀔 수 있으므로 이중 포인터(Node**)",
        "void delete_value(Node** head, int value) {",
        "    Node* cur = *head;",
        "    Node* prev = NULL;",
        "",
        "    while (cur != NULL && cur->data != value) {",
        "        prev = cur;",
        "        cur = cur->next;   // 지울 노드와 그 앞을 함께 추적",
        "    }",

      { ...S5,

    // ─────────────────────────────────────────────────────
    // 공통 — 노드 사슬 그리기 ([값]→[값]→NULL)
    // ─────────────────────────────────────────────────────
    function NodeChain({ values, highlightIdx, dimIdx, insertIdx, insertVal }) {
      return (
        <div className="flex flex-wrap items-center gap-1">
          <span className="text-[10px] font-mono font-bold text-indigo-700 mr-1">head →</span>
          {values.map((v, i) => {
            const isHi = highlightIdx === i;
            const isDim = dimIdx === i;
            const isNew = insertIdx === i;
            return (
              <React.Fragment key={i}>
                <span className={`inline-flex items-stretch rounded border-2 font-mono text-[11px] ${isNew ? 'border-emerald-500 bg-emerald-50' : isHi ? 'border-amber-500 bg-amber-100' : isDim ? 'border-red-300 bg-red-50 opacity-50 line-through' : 'border-indigo-400 bg-white'}`}>
                  <span className={`px-2 py-1 font-bold ${isNew ? 'text-emerald-900' : isDim ? 'text-red-500' : 'text-indigo-900'}`}>{v}</span>
                  <span className="px-1 py-1 border-l border-indigo-200 text-[8px] text-slate-400 flex items-center">next</span>
                </span>
                <span className="text-indigo-400 text-xs font-bold">→</span>
              </React.Fragment>
            );
          })}
          <span className="inline-block rounded border-2 border-slate-400 bg-slate-100 px-2 py-1 font-mono text-[10px] font-bold text-slate-500">NULL</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 노드 해부 (data + next)
    // ─────────────────────────────────────────────────────
    function NodeView({ list, anatomy }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🔗 리스트 = 노드들이 next 로 이어진 사슬</div>
            <NodeChain values={list} />
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-sky-800 mb-2">🧩 {anatomy.title}</div>
            <div className="flex gap-2">
              {anatomy.fields.map((f, i) => (
                <div key={i} className="flex-1 rounded-lg border border-indigo-300 bg-indigo-50 p-2">
                  <div className="text-[10px] font-mono font-bold text-indigo-900">{f.name}</div>
                  <div className="text-[13px] font-mono font-bold text-indigo-700 my-0.5">{f.val}</div>
                  <div className="text-[9px] text-slate-600">{f.note}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 삽입: before/after + 비용 표
    // ─────────────────────────────────────────────────────
    function InsertView({ listBefore, listAfter, insertValue, insertPos, costs, costNote }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">➕ head 앞에 [{insertValue}] 삽입</div>
            <div className="text-[9px] font-bold text-slate-500 mb-1">before</div>
            <NodeChain values={listBefore} />
            <div className="text-center text-indigo-400 text-sm my-1">▼ new-&gt;next = head;  head = new;</div>
            <div className="text-[9px] font-bold text-emerald-600 mb-1">after</div>
            <NodeChain values={listAfter} insertIdx={insertPos} insertVal={insertValue} />
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">⏱ 삽입 위치별 비용</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-sky-900 border-b border-sky-200">
                  <th className="text-left py-0.5">위치</th>
                  <th className="text-left py-0.5">위치 찾기</th>
                  <th className="text-left py-0.5">잇기</th>
                  <th className="text-left py-0.5">합계</th>
                </tr>
              </thead>
              <tbody>
                {costs.map((c, i) => (
                  <tr key={i} className="border-t border-sky-100">
                    <td className="py-1 font-mono font-bold text-slate-700">{c.where}</td>
                    <td className="py-1 font-mono text-slate-600">{c.find}</td>
                    <td className="py-1 font-mono text-emerald-700">{c.link}</td>
                    <td className={`py-1 font-mono font-bold ${c.good ? 'text-emerald-700' : 'text-amber-700'}`}>{c.total}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[10px] text-slate-600">{costNote}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 삭제: before/after + 순서 대비(올바름/뒤집음)
    // ─────────────────────────────────────────────────────
    function DeleteView({ listBefore, listAfter, deleteValue, order }) {
      const dimIdx = listBefore.indexOf(deleteValue);
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🗑 [{deleteValue}] 삭제 — 건너뛰고 free</div>
            <div className="text-[9px] font-bold text-slate-500 mb-1">before (지울 노드 = 빨강)</div>
            <NodeChain values={listBefore} dimIdx={dimIdx} />
            <div className="text-center text-red-400 text-sm my-1">▼ prev-&gt;next = target-&gt;next;  free(target);</div>
            <div className="text-[9px] font-bold text-emerald-600 mb-1">after</div>
            <NodeChain values={listAfter} />
          </div>
          <div className="flex gap-2">
            <div className="flex-1 rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2">
              <div className="text-[10px] font-bold text-emerald-900 mb-1">✅ {order.good.title}</div>
              {order.good.steps.map((s, i) => (
                <div key={i} className="text-[9px] font-mono text-emerald-800 rounded bg-white border border-emerald-200 px-1.5 py-0.5 mb-0.5">{s}</div>
              ))}
            </div>
            <div className="flex-1 rounded-lg border-2 border-red-300 bg-red-50 p-2">
              <div className="text-[10px] font-bold text-red-900 mb-1">🚨 {order.bad.title}</div>
              {order.bad.steps.map((s, i) => (
                <div key={i} className="text-[9px] font-mono text-red-800 rounded bg-white border border-red-200 px-1.5 py-0.5 mb-0.5">{s}</div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 탐색/순회: head부터 걷기 애니메이션
    // ─────────────────────────────────────────────────────
    function TraverseView({ list, searchValue }) {
      const [pos, setPos] = useState(0);
      useEffect(() => {
        setPos(0);
        const id = setInterval(() => {
          setPos((p) => (p >= list.length ? 0 : p + 1));
        }, 900);
        return () => clearInterval(id);
      }, [list, searchValue]);
      const found = pos < list.length && list[pos] === searchValue;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-[11px] font-bold text-indigo-800 mb-2">🔎 head부터 next 따라 {searchValue} 찾기 (O(n))</div>
            <NodeChain values={list} highlightIdx={pos < list.length ? pos : -1} />
            <div className="mt-2 text-[10px] font-mono px-2 py-1 rounded bg-indigo-50 border border-indigo-200 text-indigo-900">
              {pos >= list.length
                ? 'cur == NULL → 순회 끝 (못 찾으면 여기서 멈춤)'
                : found
                  ? `cur->data == ${searchValue} → 발견! return cur;`
                  : `cur->data(${list[pos]}) != ${searchValue} → cur = cur->next`}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">🩹 순회 2대 실수</div>
            <div className="text-[10px] text-amber-900 space-y-0.5">
              <div>• <span className="font-mono font-bold">cur != NULL</span> 빠뜨림 → 끝 넘어 NULL 역참조 → 세그폴트</div>
              <div>• <span className="font-mono font-bold">cur = cur-&gt;next</span> 빠뜨림 → 제자리 → 무한 루프</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 배열 vs 연결 리스트 비교 표
    // ─────────────────────────────────────────────────────
    function CompareView({ compare, pick }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-indigo-800 mb-1.5">⚖️ 배열 vs 연결 리스트</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-indigo-900 border-b border-indigo-200">
                  <th className="text-left py-0.5">연산</th>
                  <th className="text-left py-0.5">배열</th>
                  <th className="text-left py-0.5">연결 리스트</th>
                </tr>
              </thead>
              <tbody>
                {compare.rows.map((r, i) => (
                  <tr key={i} className="border-t border-indigo-100 align-top">
                    <td className="py-1 font-bold text-slate-700">{r.op}</td>
                    <td className={`py-1 font-mono ${r.arrGood ? 'text-emerald-700' : 'text-red-600'}`}>{r.arrGood ? '✓ ' : '✗ '}{r.arr}</td>
                    <td className={`py-1 font-mono ${r.listGood ? 'text-emerald-700' : 'text-red-600'}`}>{r.listGood ? '✓ ' : '✗ '}{r.list}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">🎯 {pick.title}</div>
            <div className="text-[10px] space-y-1">
              <div className="rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-emerald-900">📦 {pick.arr}</div>
              <div className="rounded bg-indigo-50 border border-indigo-200 px-2 py-1 text-indigo-900">🔗 {pick.list}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-indigo-50',  border: 'border-indigo-300',  text: 'text-indigo-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (slate blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      node:     { icon: '🔗', label: '노드와 head' },
      insert:   { icon: '➕', label: '삽입' },
      delete:   { icon: '🗑', label: '삭제' },
      traverse: { icon: '🔎', label: '탐색·순회' },
      compare:  { icon: '⚖️', label: '배열 vs 리스트' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.node;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>연결 리스트 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-indigo-700 font-mono mb-3 px-2 py-1 rounded bg-indigo-50 border border-indigo-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'node' && <NodeView list={state.list} anatomy={state.anatomy} />}
          {state.stage === 'insert' && <InsertView listBefore={state.listBefore} listAfter={state.listAfter} insertValue={state.insertValue} insertPos={state.insertPos} costs={state.costs} costNote={state.costNote} />}
          {state.stage === 'delete' && <DeleteView listBefore={state.listBefore} listAfter={state.listAfter} deleteValue={state.deleteValue} order={state.order} />}
          {state.stage === 'traverse' && <TraverseView list={state.list} searchValue={state.searchValue} />}
          {state.stage === 'compare' && <CompareView compare={state.compare} pick={state.pick} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-indigo-400/20 border-l-2 border-indigo-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-12 h-10 rounded-lg text-white font-bold text-lg" style={{ backgroundColor: '#5C6BC0' }}>C</span>
              <div>
                <div className="inline-block text-[11px] font-bold px-2 py-0.5 rounded mb-1" style={{ backgroundColor: '#cfd8dc', color: '#33475b' }}>Ⅳ. 자료구조 직접 만들기 · IV-1-1</div>
                <h1 className="text-2xl font-bold" style={{ color: '#33475b' }}>IV-1-1. 연결 리스트</h1>
                <p className="text-sm" style={{ color: '#5C6BC0' }}>노드와 포인터로 연결 리스트를 직접 구현하며 동적 자료구조 이해</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#33475b' }}>← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? '#5C6BC0' : '#cfd8dc' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#33475b' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#dfe3ea' }}>{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white hover:opacity-90"
                style={{ backgroundColor: playing ? '#33475b' : '#5C6BC0' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-slate-50 disabled:opacity-40"
                style={{ borderColor: '#5C6BC0', color: '#33475b' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#8a95a6' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#5C6BC0', color: '#33475b' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                연결 리스트는 노드(data + next)를 malloc으로 힙에 흩뿌리고 head 포인터와 next 사슬로만 잇는 동적 자료구조다.
                삽입은 "잇고 → 바꾼다" 순서로 head는 O(1), 중간/tail은 위치 찾기 O(n)이고,
                삭제는 재연결(prev-&gt;next = target-&gt;next)을 먼저, free를 나중에 해야 use-after-free·dangling pointer를 피한다.
                탐색·순회는 head부터 걷는 O(n)이며 cur != NULL 체크가 멈춤 신호다.
                배열과의 트레이드오프(연속·인덱스 O(1)·캐시 친화 vs 분산·삽입 O(1))를 이해하고,
                head 수정에는 이중 포인터, 종료에는 노드마다 free를 잊지 말자. 다음 장 IV-1-2에서는 이중 연결 리스트를 이어서 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['노드', 'head포인터', 'next', 'malloc', '삽입O(1)', '탐색O(n)', '포인터재연결', 'free', '누수방지', 'use-after-free', '이중포인터', 'NULL체크', '배열vs리스트', '이중연결리스트'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#eef0f7', color: '#33475b', borderColor: '#cfd8dc' }}>#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#33475b' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
