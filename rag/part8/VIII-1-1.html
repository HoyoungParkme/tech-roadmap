      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 검색기 4단계 사다리 (recall·비용 게이지) + 문서별 추천
    // ─────────────────────────────────────────────────────
    function LadderView({ state }) {
      return (
        <div>
          <div className="space-y-1.5">
            {[...state.ladder].reverse().map((rung) => {
              const c = TONE[rung.tone] || TONE.rose;
              return (
                <div key={rung.tier} className={`rounded-lg border-2 ${c.border} bg-white p-2`}>
                  <div className="flex items-center gap-2 mb-1">
                    <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${c.chip}`}>{rung.tier}층</span>
                    <span className="text-xs font-bold text-slate-800">{rung.name}</span>
                    <span className="ml-auto text-[9px] font-mono text-slate-500">{rung.latency}</span>
                  </div>
                  <div className="flex gap-3 items-center">
                    <div className="flex-1">
                      <div className="flex justify-between text-[9px] text-slate-500"><span>recall</span><span className="font-mono">{rung.recall}%</span></div>
                      <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className={`h-full ${c.bar}`} style={{ width: `${rung.recall}%` }} /></div>
                    </div>
                    <div className="flex-1">
                      <div className="flex justify-between text-[9px] text-slate-500"><span>비용</span><span className="font-mono">{rung.cost}</span></div>
                      <div className="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full bg-slate-400" style={{ width: `${rung.cost}%` }} /></div>
                    </div>
                  </div>
                  <div className="mt-1 flex gap-2 text-[9px]">
                    <span className="text-emerald-700">👍 {rung.good}</span>
                    <span className="text-red-700 ml-auto">👎 {rung.bad}</span>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1.5">📄 문서·질의 특성별 추천</div>
            <table className="w-full text-[10px]">
              <tbody>
                {state.recommend.map((r, i) => (
                  <tr key={i} className="border-t border-rose-100">
                    <td className="py-1 text-slate-800">{r.doc}</td>
                    <td className="py-1 px-1"><span className="px-1.5 py-0.5 rounded bg-rose-100 text-rose-900 font-bold whitespace-nowrap">{r.pick}</span></td>
                    <td className="py-1 text-slate-500">{r.why}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 프레임워크 3사 비교 카드 + 직접 구현 노트
    // ─────────────────────────────────────────────────────
    function FrameworksView({ state }) {
      return (
        <div>
          <div className="space-y-2">
            {state.frameworks.map((f) => {
              const c = TONE[f.tone] || TONE.sky;
              return (
                <div key={f.name} className={`rounded-lg border-2 ${c.border} bg-white p-2.5`}>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-sm font-bold text-slate-800">{f.name}</span>
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${c.chip}`}>{f.tag}</span>
                  </div>
                  <div className="text-[10px] text-emerald-700 leading-snug">👍 {f.strength}</div>
                  <div className="text-[10px] text-red-700 leading-snug">👎 {f.weak}</div>
                  <div className="mt-1 text-[10px] text-slate-600"><b>맞는 상황:</b> {f.fit}</div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">🛠 {state.diyNote.title}</div>
            <ul className="space-y-0.5">
              {state.diyNote.points.map((p, i) => (
                <li key={i} className="text-[10px] text-amber-900 flex gap-1"><span>▸</span><span>{p}</span></li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 스택 조합 축 + 규모별 추천 3안
    // ─────────────────────────────────────────────────────
    function StackMatrixView({ state }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5 mb-3">
            <div className="text-[11px] font-bold text-rose-900 mb-1.5">🧮 조합 축 (셋을 곱한다)</div>
            {state.axes.map((a, i) => (
              <div key={i} className="flex items-center gap-1.5 mb-1">
                <span className="text-[10px] font-bold text-slate-700 w-16 shrink-0">{a.axis}</span>
                <span className="text-slate-300">×</span>
                <div className="flex gap-1 flex-wrap">
                  {a.options.map((o, j) => (
                    <span key={j} className="text-[9px] px-1.5 py-0.5 rounded bg-rose-50 border border-rose-200 text-rose-900">{o}</span>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="space-y-2">
            {state.stacks.map((s) => {
              const c = TONE[s.tone] || TONE.sky;
              return (
                <div key={s.scale} className={`rounded-lg border-2 ${c.border} bg-white p-2.5`}>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-xs font-bold text-slate-800">{s.scale}</span>
                    <span className="ml-auto text-[9px] font-mono text-slate-500">{s.qps}</span>
                  </div>
                  <div className="flex gap-1 flex-wrap mb-1">
                    <span className={`text-[9px] px-1.5 py-0.5 rounded ${c.chip}`}>저장 {s.store}</span>
                    <span className={`text-[9px] px-1.5 py-0.5 rounded ${c.chip}`}>임베딩 {s.embed}</span>
                    <span className={`text-[9px] px-1.5 py-0.5 rounded ${c.chip}`}>리랭커 {s.rerank}</span>
                  </div>
                  <div className="text-[10px] text-slate-600 leading-snug">{s.why}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 결정 플로차트 + 안티패턴 + 다음 장 예고
    // ─────────────────────────────────────────────────────
    function DecisionView({ state }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-900 mb-2">🧭 결정 플로차트</div>
            {state.flow.map((f, i) => {
              const c = TONE[f.tone] || TONE.rose;
              return (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-slate-300 text-xs leading-none my-0.5">▼</div>}
                  <div className={`rounded-md border-2 ${c.border} ${c.soft} p-2`}>
                    <div className="text-[11px] font-bold text-slate-800 mb-1">{f.q}</div>
                    <div className="flex gap-2 text-[9px]">
                      <span className="flex-1 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-900">예 → {f.yes}</span>
                      <span className="flex-1 px-1.5 py-0.5 rounded bg-slate-100 text-slate-700">아니오 → {f.no}</span>
                    </div>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
          <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-800 mb-1.5">🚫 안티패턴</div>
            <ul className="space-y-1">
              {state.antipatterns.map((a, i) => (
                <li key={i} className="text-[10px] text-red-900 flex gap-1.5"><span>{a.icon}</span><span>{a.text}</span></li>
              ))}
            </ul>
          </div>
          <div className="mt-3 rounded-lg border-2 border-rose-400 bg-rose-50 p-2.5">
            <div className="text-[10px] font-bold text-rose-900">➡️ {state.nextHint}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 뷰 스위치 (rose 톤)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      const b = state.badge;
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{b.icon}</span>
              <span>{b.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-rose-700 font-mono mb-2 px-2 py-1 rounded bg-rose-50 border border-rose-200">
            {state.subtitle}
          </div>
          <div className="flex-1">
            {state.viewKind === 'failTree' && <FailTreeView state={state} />}
            {state.viewKind === 'ladder' && <LadderView state={state} />}
            {state.viewKind === 'frameworks' && <FrameworksView state={state} />}
            {state.viewKind === 'stackMatrix' && <StackMatrixView state={state} />}
            {state.viewKind === 'decision' && <DecisionView state={state} />}
          </div>
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-pink-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">RAG</span>
              <div>
                <div className="text-xs text-slate-500 font-medium">Part Ⅷ. 보강 &gt; Chapter 1. 검색기 &amp; 툴 선택</div>
                <h1 className="text-xl md:text-2xl font-bold text-rose-900">VIII-1-1. 검색기 선택 가이드와 툴 지도</h1>
                <p className="text-sm text-rose-800/80">RAG 품질의 상한선은 검색기가 정한다 — 그리고 프레임워크는 어디까지 맡길 것인가</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                RAG 품질의 상한선은 검색기가 정한다 — 그래서 먼저 recall@k를 재고(search V-1-1), 부족한 만큼만
                검색기 사다리(BM25→벡터→하이브리드+RRF→리랭커)를 올린다. 이 사다리는 그대로 search Part Ⅳ의 retriever다.
                프레임워크(LangChain·LlamaIndex·Haystack)는 파이프라인이 복잡할 때만 쓰고, 단순하면 직접 구현이 더 투명하다.
                스택(저장×임베딩×리랭커)은 "지금 규모"에 맞는 최소 조합에서 시작해 병목이 보일 때 한 축씩 올린다.
                다음 장(VIII-1-2)에서는 문서 단위 검색이 "엔티티 간 관계"를 요구하는 질의에서 무너지는 RAG vs GraphRAG를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RAG', 'recall@k', 'BM25', '벡터검색', '하이브리드', 'RRF', '리랭커', 'LangChain', 'LlamaIndex', 'Haystack', 'pgvector', '스택선택'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./VIII-1-2.html" className="underline hover:no-underline">다음: VIII-1-2 (RAG vs GraphRAG) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
