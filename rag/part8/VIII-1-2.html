          })}
          <div className="rounded-lg border-2 border-rose-300 bg-rose-50 p-2 text-[10px] text-rose-900">
            같은 검색기·같은 LLM인데 운명이 갈린다 — 변수는 <b>질문 유형</b>이다. 답이 한 청크에 있으면 검색이 답을, 관계로 계산돼야 하면 순회가 답을 만든다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — RAG 수비 범위 지도 + 검색기 사다리 노트
    // ─────────────────────────────────────────────────────
    function RagScopeView({ state }) {
      return (
        <div>
          <div className="grid grid-cols-2 gap-2">
            {state.scope.map((s, i) => {
              const c = TONE[s.tone] || TONE.emerald;
              return (
                <div key={i} className={`rounded-lg border-2 ${c.border} bg-white p-2`}>
                  <div className="flex items-center gap-1.5 mb-0.5">
                    <span>{s.icon}</span>
                    <span className="text-[11px] font-bold text-slate-800">{s.name}</span>
                  </div>
                  <div className="text-[10px] font-mono text-slate-600 mb-0.5">{s.ex}</div>
                  <div className={`text-[9px] px-1.5 py-0.5 rounded inline-block ${c.chip}`}>{s.why}</div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1.5">🪜 {state.ladderNote.title}</div>
            <div className="flex items-center gap-1 flex-wrap mb-1.5">
              {state.ladderNote.rungs.map((r, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <span className="text-slate-300 text-[10px]">→</span>}
                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-rose-50 border border-rose-200 text-rose-900">{r}</span>
                </React.Fragment>
              ))}
            </div>
            <div className="text-[10px] text-slate-600">{state.ladderNote.tail}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 그래프 순회 애니메이션(경로) + 강점/비용
    // ─────────────────────────────────────────────────────
    function GraphScopeView({ state }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-2">🕸 다중 홉 순회 경로</div>
            {state.graph.hops.map((h, i) => {
              const c = TONE[h.tone] || TONE.sky;
              return (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-slate-300 text-xs leading-none my-0.5">▼</div>}
                  <div className={`rounded-md border-2 ${c.border} ${c.soft} px-2 py-1 flex items-center gap-2`}>
                    <span className="text-[10px] font-bold text-slate-700 whitespace-nowrap">{h.from}</span>
                    <span className="text-[10px] font-mono text-slate-500">{h.edge}</span>
                    <span className="text-[11px] font-bold text-slate-800 ml-auto text-right">{h.to}</span>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
          <div className="mt-3 grid grid-cols-1 gap-1.5">
            {state.wins.map((w, i) => (
              <div key={i} className="rounded-md border-2 border-emerald-300 bg-white px-2 py-1 flex items-center gap-2">
                <span>{w.icon}</span>
                <span className="text-[11px] font-bold text-slate-800">{w.name}</span>
                <span className="text-[9px] font-mono text-slate-500">{w.ex}</span>
                <span className="ml-auto text-[9px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-900">{w.why}</span>
              </div>
            ))}
          </div>
          <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">💸 대가 — 그래프는 공짜가 아니다</div>
            <ul className="space-y-0.5">
              {state.costs.map((ct, i) => (
                <li key={i} className="text-[10px] text-amber-900 flex gap-1.5"><span>{ct.icon}</span><span>{ct.text}</span></li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 질문 유형별 비교 실험 표 + 라우팅 하이브리드 노트
    // ─────────────────────────────────────────────────────
    function ExperimentView({ state }) {
      const Bar = ({ acc }) => (
        <div className="flex items-center gap-1">
          <div className="w-12 h-1.5 rounded-full bg-slate-100 overflow-hidden">
            <div className={`h-full ${acc >= 80 ? 'bg-emerald-500' : acc >= 60 ? 'bg-amber-500' : 'bg-red-500'}`} style={{ width: `${acc}%` }} />
          </div>
          <span className="font-mono text-[9px]">{acc}%</span>
        </div>
      );
      return (
        <div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-2.5">
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-rose-900 border-b-2 border-rose-200">
                  <th className="text-left py-1">질문 유형</th>
                  <th className="text-left py-1 px-1">벡터 RAG</th>
                  <th className="text-left py-1 px-1">GraphRAG</th>
                  <th className="text-left py-1">승자</th>
                </tr>
              </thead>
              <tbody>
                {state.experiment.map((e, i) => (
                  <tr key={i} className="border-t border-rose-100 align-top">
                    <td className="py-1.5 font-bold text-slate-800">{e.qtype}</td>
                    <td className="py-1.5 px-1">
                      <Bar acc={e.rag.acc} />
                      <div className="text-[8px] text-slate-500 font-mono mt-0.5">{e.rag.lat} · ×{e.rag.cost}</div>
                    </td>
                    <td className="py-1.5 px-1">
                      <Bar acc={e.graph.acc} />
                      <div className="text-[8px] text-slate-500 font-mono mt-0.5">{e.graph.lat} · ×{e.graph.cost}</div>
                    </td>
                    <td className="py-1.5">
                      <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${e.winner === 'RAG' ? 'bg-sky-100 text-sky-900' : 'bg-emerald-100 text-emerald-900'}`}>{e.winner}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="mt-1.5 text-[9px] text-slate-500">지연·비용은 상대값(×1 = RAG 기준). 정확도는 개념 실험값.</div>
          </div>
          <div className="mt-3 rounded-lg border-2 border-rose-400 bg-rose-50 p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1">🔀 {state.hybridNote.title}</div>
            <ul className="space-y-0.5">
              {state.hybridNote.points.map((p, i) => (
                <li key={i} className="text-[10px] text-rose-900 flex gap-1.5"><span>▸</span><span>{p}</span></li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 선택 플로차트 + 안티패턴 + 학습 지도 크로스링크
    // ─────────────────────────────────────────────────────
    function DecisionView({ state }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-[11px] font-bold text-rose-900 mb-2">🧭 선택 플로차트</div>
            {state.flow.map((f, i) => {
              const c = TONE[f.tone] || TONE.rose;
              return (
                <React.Fragment key={i}>
                  {i > 0 && <div className="text-center text-slate-300 text-xs leading-none my-0.5">▼</div>}
                  <div className={`rounded-md border-2 ${c.border} ${c.soft} p-2`}>
                    <div className="text-[11px] font-bold text-slate-800 mb-1">{f.q}</div>
                    <div className="flex gap-2 text-[9px]">
                      <span className="flex-1 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-900">예 → {f.yes}</span>
                      <span className="flex-1 px-1.5 py-0.5 rounded bg-slate-100 text-slate-700">아니오 → {f.no}</span>
                    </div>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
          <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-800 mb-1.5">🚫 안티패턴</div>
            <ul className="space-y-1">
              {state.antipatterns.map((a, i) => (
                <li key={i} className="text-[10px] text-red-900 flex gap-1.5"><span>{a.icon}</span><span>{a.text}</span></li>
              ))}
            </ul>
          </div>
          <div className="mt-3 rounded-lg border-2 border-rose-400 bg-rose-50 p-2.5">
            <div className="text-[11px] font-bold text-rose-900 mb-1.5">🗺 학습 지도 — 두 과정을 오가며</div>
            <ul className="space-y-1">
              {state.crosslinks.map((cl, i) => (
                <li key={i} className="text-[10px] text-rose-900 flex gap-1.5"><span>{cl.icon}</span><span>{cl.text}</span></li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-rose-50',    border: 'border-rose-300',    text: 'text-rose-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 뷰 스위치 (rose 톤)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      const b = state.badge;
      return (
        <div className="rounded-xl border border-rose-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-rose-900 flex items-center gap-1.5">
              <span>{b.icon}</span>
              <span>{b.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-rose-700 font-mono mb-2 px-2 py-1 rounded bg-rose-50 border border-rose-200">
            {state.subtitle}
          </div>
          <div className="flex-1">
            {state.viewKind === 'twoQueries' && <TwoQueriesView state={state} />}
            {state.viewKind === 'ragScope' && <RagScopeView state={state} />}
            {state.viewKind === 'graphScope' && <GraphScopeView state={state} />}
            {state.viewKind === 'experiment' && <ExperimentView state={state} />}
            {state.viewKind === 'decision' && <DecisionView state={state} />}
          </div>
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-rose-400/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-rose-50 to-pink-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-rose-600 text-white font-bold">RAG</span>
              <div>
                <div className="text-xs text-slate-500 font-medium">Part Ⅷ. 보강 &gt; Chapter 1. 검색기 &amp; 툴 선택</div>
                <h1 className="text-xl md:text-2xl font-bold text-rose-900">VIII-1-2. RAG vs GraphRAG — 선택 기준</h1>
                <p className="text-sm text-rose-800/80">청크 검색으로 충분한가, 그래프 추론이 필요한가 — 질문 유형이 답을 정한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-rose-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-rose-500' : 'bg-rose-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-rose-800 text-rose-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-rose-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-rose-800 text-white' : 'bg-rose-600 text-white hover:bg-rose-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-rose-400 bg-white text-rose-800 hover:bg-rose-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-rose-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-rose-500 bg-white px-4 py-3 text-sm text-rose-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                RAG 실패의 갈림길은 검색기 성능이 아니라 질문 유형이다 — 답이 한 청크에 국소적이면 벡터 RAG로 충분하고(사실·정의·요약·유사 사례),
                여러 문서의 관계로 계산돼야 하면(다중 홉·집계·전역 요약) 청크 검색은 구조적으로 실패한다. GraphRAG는 그래프 순회로 그 질문을 풀지만
                구축 비용·온톨로지 관리(VI-1-1)를 대가로 치른다. 실무 최적점은 라우팅 하이브리드 — 질문 유형을 분류해 다수는 값싼 RAG로, 소수의 관계형만 그래프로 보낸다.
                점진 도입이 원칙이다: RAG로 시작해 recall을 맞추고(VIII-1-1), 다중 홉이 실제로 쌓일 때 그래프를 얹어라. 여기서부터는 graphrag 과정이 그래프 구축·커뮤니티 요약을 심화한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RAG', 'GraphRAG', '다중홉', '지식그래프', '트리플추출', '커뮤니티요약', '집계질의', '전역요약', '라우팅하이브리드', '질문분류', '점진도입', '온톨로지'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-rose-100 text-rose-900 border border-rose-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-rose-800">
              <a href="./VIII-1-1.html" className="underline hover:no-underline">← 이전: VIII-1-1 (검색기 선택)</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
