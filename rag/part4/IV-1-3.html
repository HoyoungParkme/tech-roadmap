  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }

  <script>window.LESSON = {"topic": "rag", "topicName": "RAG 파이프라인", "topicHref": "../index.html", "id": "IV-1-3", "title": "Hybrid Search", "sub": "의미 사서 + 키워드 사서 → RRF / Weighted Sum 으로 합산", "path": "part4/IV-1-3.html", "prev": {"id": "IV-1-2", "title": "Sparse Retrieval (BM25)", "href": "../part4/IV-1-2.html"}, "next": {"id": "IV-2-1", "title": "Re-ranking", "href": "../part4/IV-2-1.html"}, "wrap": "빠른 PoC는 튜닝이 필요 없는 RRF, 도메인에 맞춰 비중을 정해야 하면 α를 조정하는 Weighted Sum을 쓴다. 다음 IV-2-1에서는 hybrid 결과를 cross-encoder Re-ranking으로 한 번 더 줄 세운다."};</script>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-1-3. Hybrid Search — Dense + Sparse 결합으로 recall 극대화
    학습 목표: 의미 검색(Dense)과 키워드 검색(Sparse)이 각각 잡지 못하는 약점을
              어떻게 fusion으로 보완하는지를 5단계로 이해한다.
    핵심 비유: 두 명의 사서가 협력 — 의미 사서 + 키워드 사서 → 합산 위원회
    패턴: fastapi v1 — 좌(LiveDataPane: 두 retriever + fusion 박스) / 우(VSCode CodeViewer)
    색상: rose
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {
        lang: "python",
        filename: "dense-only.py",
        lines: [
          "# Step 1. Dense Retrieval 단독 — 의미 임베딩 검색",
          "from langchain_openai import OpenAIEmbeddings",
          "from langchain_community.vectorstores import FAISS",
          "embeddings = OpenAIEmbeddings(model=\"text-embedding-3-small\")",
          "vectorstore = FAISS.load_local(\"indexes/ml_docs\", embeddings,",
          "                               allow_dangerous_deserialization=True)",
          "# 의미 검색 — top-4",
          "dense_retriever = vectorstore.as_retriever(search_kwargs={\"k\": 4})",
          "docs = dense_retriever.invoke(\"XGBoost 튜닝\")",
          "",
          "# 결과 — 의미가 가까운 순 (점수는 예시 값)",
          "#   #1 D3 \"머신러닝 알고리즘 개요\" 0.92   #3 D1 \"딥러닝 기초\" 0.85",
          "#   #2 D7 \"XGBoost 튜닝\"           0.88   #4 D5 \"전처리 방법\" 0.70",
          "# ⚠ 한계: \"XGBoost vs LightGBM\"(D12) 누락 → 고유명사 임베딩 약점",
          "# 다음: Sparse(BM25)로 키워드 정확도를 보완",
        ],
      },
      s2: {
        lang: "python",
        filename: "sparse-only.py",
        lines: [
          "# Step 2. Sparse Retrieval 단독 — BM25 키워드 검색",
          "from langchain_community.retrievers import BM25Retriever",
          "from langchain.schema import Document",
          "# 동일 문서 6건을 BM25 인덱스로 적재",
          "docs_corpus = [",
          "    Document(page_content=\"머신러닝 알고리즘 개요...\",   metadata={\"id\": \"D3\"}),",
          "    Document(page_content=\"XGBoost 하이퍼파라미터 튜닝...\", metadata={\"id\": \"D7\"}),",
          "    Document(page_content=\"딥러닝 기초 가이드...\",        metadata={\"id\": \"D1\"}),",
          "    Document(page_content=\"데이터 전처리 방법...\",        metadata={\"id\": \"D5\"}),",
          "    Document(page_content=\"XGBoost vs LightGBM 비교...\", metadata={\"id\": \"D12\"}),",
          "    Document(page_content=\"Gradient Boosting 원리...\",   metadata={\"id\": \"D15\"}),",
          "]",
          "# BM25Retriever — TF·IDF 기반 (정확 토큰 일치)",
          "sparse_retriever = BM25Retriever.from_documents(docs_corpus)",
          "sparse_retriever.k = 4",
          "docs = sparse_retriever.invoke(\"XGBoost 튜닝\")",
          "",
          "# 결과 — 키워드 일치 강도 순 (예시 점수, D3·D15 본문에도 \"XGBoost\"가 있다)",
          "#   #1 D7  \"XGBoost 튜닝\"     8.5   #3 D3  \"머신러닝 개요\"    5.1",

        rrf: [{"id":"D7","v":0.0325,"src":"both","f":"1/62 + 1/61"},{"id":"D3","v":0.0323,"src":"both","f":"1/61 + 1/63"},{"id":"D12","v":0.0161,"src":"sparse","f":"1/62"},{"id":"D1","v":0.0159,"src":"dense","f":"1/63"},{"id":"D5","v":0.0156,"src":"dense","f":"1/64"},{"id":"D15","v":0.0156,"src":"sparse","f":"1/64"}],
        note: true,
        code: { ...CODE.s3, highlight: [23,24] },
      },
      // ── Step 4. Weighted Sum — 점수 정규화 + 가중치(alpha)
      { ...S4,
        beat: {
          label: "점수를 직접 받는다",
          at: "weighted.py L3–5",
          caption: "이번엔 순위가 아니라 점수를 쓴다. 한 축에 놓으면 dense 0.70~0.92와 sparse 3.8~8.5는 단위가 달라 그대로 더할 수 없다.",
          changes: [
            { mark: "changed", text: "fusion: RRF → Weighted" },
          ],
        },
        dense: [{"id":"D3","s":0.92},{"id":"D7","s":0.88},{"id":"D1","s":0.85},{"id":"D5","s":0.7}],
        sparse: [{"id":"D7","s":8.5},{"id":"D12","s":7.2},{"id":"D3","s":5.1},{"id":"D15","s":3.8}],
        code: { ...CODE.s4, highlight: [3,4,5] },
      },
      { ...S4,
        beat: {
          label: "min-max 정규화",
          at: "weighted.py L6–13",
          caption: "각 목록 안에서 최솟값을 0, 최댓값을 1로 맞춘다. D7은 dense 0.82, sparse 1.00이 되고, 목록의 꼴찌 D5·D15는 0이 된다.",
          changes: [
            { mark: "new", text: "D7: 0.82 · 1.00" },
            { mark: "read", text: "두 점수를 같은 0~1 자로" },
          ],
        },
        dense: [{"id":"D3","s":0.92},{"id":"D7","s":0.88},{"id":"D1","s":0.85},{"id":"D5","s":0.7}],
        sparse: [{"id":"D7","s":8.5},{"id":"D12","s":7.2},{"id":"D3","s":5.1},{"id":"D15","s":3.8}],
        norm: {"dense":{"D3":1,"D7":0.82,"D1":0.68,"D5":0},"sparse":{"D7":1,"D12":0.72,"D3":0.28,"D15":0}},
        code: { ...CODE.s4, highlight: [6,7,8,9,10,11,12,13] },
      },
      { ...S4,
        beat: {
          label: "α 가중 합산",
          at: "weighted.py L14–19",
          caption: "α = 0.5로 α·dense + (1−α)·sparse를 더한다. D7 0.909, D3 0.638, D12 0.362, D1 0.341이다.",
          changes: [
            { mark: "new", text: "가중합 6건" },
            { mark: "read", text: "D7 = 0.5·0.82 + 0.5·1.00" },
          ],
        },
        norm: {"dense":{"D3":1,"D7":0.82,"D1":0.68,"D5":0},"sparse":{"D7":1,"D12":0.72,"D3":0.28,"D15":0}},
        w: [["D7",0.909],["D3",0.638],["D12",0.362],["D1",0.341],["D5",0],["D15",0]],
        alpha: 0.5,
        code: { ...CODE.s4, highlight: [14,15,16,17,18,19] },
      },
      { ...S4,
        beat: {
          label: "정렬 출력",
          at: "weighted.py L20–21",
          caption: "합산 점수 내림차순으로 6건이 줄을 선다. D7이 0.909로 1위이고, 정규화에서 0이 된 D5·D15는 0.000으로 맨 뒤다.",
          changes: [
            { mark: "new", text: "가중합 순위 6건" },
          ],
        },
        norm: {"dense":{"D3":1,"D7":0.82,"D1":0.68,"D5":0},"sparse":{"D7":1,"D12":0.72,"D3":0.28,"D15":0}},
        w: [["D7",0.909],["D3",0.638],["D12",0.362],["D1",0.341],["D5",0],["D15",0]],
        alpha: 0.5,
        sorted: true,
        code: { ...CODE.s4, highlight: [20,21] },
      },
      { ...S4,
        beat: {
          label: "RRF vs Weighted",
          at: "weighted.py L23–24",
          caption: "α를 0.7로 올리면 D1(0.477)이 D12(0.217)를 앞지르고, 0.3으로 내리면 D12(0.506)가 2위로 오른다. RRF는 튜닝할 것이 없고 Weighted는 α로 도메인에 맞춘다.",
          changes: [
            { mark: "read", text: "α ↑ 의미 쪽 · α ↓ 키워드 쪽" },
          ],
        },
        wa: {"0.5":[["D7",0.909],["D3",0.638],["D12",0.362],["D1",0.341],["D5",0],["D15",0]],"0.7":[["D7",0.873],["D3",0.783],["D1",0.477],["D12",0.217],["D5",0],["D15",0]],"0.3":[["D7",0.945],["D12",0.506],["D3",0.494],["D1",0.205],["D5",0],["D15",0]]},
        code: { ...CODE.s4, highlight: [23,24] },
      },
      // ── Step 5. 최종 결과 — 두 방식의 장점 결합 (recall ↑, precision ↑)
      { ...S5,
        beat: {
          label: "세 방식 비교 표",
          at: "result.md L5–10",
          caption: "후보 풀 6건 기준으로 Dense 4건, Sparse 4건을 회수하고, Hybrid는 두 목록의 합집합 6건을 모두 회수한다.",
          changes: [
            { mark: "new", text: "회수 비교 4/6 · 4/6 · 6/6" },
          ],
        },
        cover: true,
        code: { ...CODE.s5, highlight: [5,6,7,8,9,10] },
      },
      { ...S5,
        beat: {
          label: "최종 통합 순위",
          at: "result.md L12–18",
          caption: "RRF 최종 1위는 양쪽이 모두 추천한 D7이다. top-4로 잘라도 D7·D3·D12·D1이 남아 Dense가 놓친 D12와 Sparse가 놓친 D1이 함께 들어온다.",
          changes: [
            { mark: "new", text: "순위별 출처" },
            { mark: "read", text: "top-4 = D7 · D3 · D12 · D1" },
          ],
        },
        rrf: [{"id":"D7","v":0.0325,"src":"both","f":"1/62 + 1/61"},{"id":"D3","v":0.0323,"src":"both","f":"1/61 + 1/63"},{"id":"D12","v":0.0161,"src":"sparse","f":"1/62"},{"id":"D1","v":0.0159,"src":"dense","f":"1/63"},{"id":"D5","v":0.0156,"src":"dense","f":"1/64"},{"id":"D15","v":0.0156,"src":"sparse","f":"1/64"}],
        code: { ...CODE.s5, highlight: [12,13,14,15,16,17,18] },
      },
      { ...S5,
        beat: {
          label: "왜 하이브리드인가",
          at: "result.md L20–24",
          caption: "서로의 빈칸을 메운다. 고유명사 문서 D12는 Sparse가, 의미가 가까운 D1은 Dense가 잡았다.",
          changes: [
            { mark: "read", text: "D12 ← Sparse · D1 ← Dense" },
          ],
        },
        rrf: [{"id":"D7","v":0.0325,"src":"both","f":"1/62 + 1/61"},{"id":"D3","v":0.0323,"src":"both","f":"1/61 + 1/63"},{"id":"D12","v":0.0161,"src":"sparse","f":"1/62"},{"id":"D1","v":0.0159,"src":"dense","f":"1/63"},{"id":"D5","v":0.0156,"src":"dense","f":"1/64"},{"id":"D15","v":0.0156,"src":"sparse","f":"1/64"}],
        why: true,
        code: { ...CODE.s5, highlight: [20,21,22,23,24] },
      },
      { ...S5,
        beat: {
          label: "fusion 선택 기준과 다음",
          at: "result.md L26–31",
          caption: "빠른 PoC는 RRF, 도메인 튜닝은 Weighted가 맞다. 다음 IV-2-1 Re-ranking에서는 hybrid top-20을 cross-encoder로 다시 정렬한다.",
          changes: [
            { mark: "read", text: "다음: Re-ranking" },
          ],
        },
        guide: true,
        code: { ...CODE.s5, highlight: [26,27,28,29,30,31] },
      },
    ];

    // ── RefPanel ── 예전 왼쪽 패널에만 있던 표·링크 (레슨 화면의 "표·정리 보기" 상자에 들어간다)
    const RA_TITLE = { D1: '딥러닝 기초 가이드', D3: '머신러닝 알고리즘 개요', D5: '데이터 전처리 방법', D7: 'XGBoost 하이퍼파라미터 튜닝', D12: 'XGBoost vs LightGBM 비교', D15: 'Gradient Boosting 원리' };
    function RefPanel({ step }) {
      const lists = (step.dense || step.sparse) && (
        <div key="ls">
          <h4>두 검색기의 top-4 (점수는 예시 값)</h4>
          <table>
            <thead><tr><th>순위</th><th>Dense (코사인)</th><th>Sparse (BM25)</th></tr></thead>
            <tbody>{[0, 1, 2, 3].map((i) => (
              <tr key={i}><td>#{i + 1}</td>
                <td>{['D3 머신러닝 알고리즘 개요 · 0.92', 'D7 XGBoost 하이퍼파라미터 튜닝 · 0.88', 'D1 딥러닝 기초 가이드 · 0.85', 'D5 데이터 전처리 방법 · 0.70'][i]}</td>
                <td>{['D7 XGBoost 하이퍼파라미터 튜닝 · 8.5', 'D12 XGBoost vs LightGBM 비교 · 7.2', 'D3 머신러닝 알고리즘 개요 · 5.1', 'D15 Gradient Boosting 원리 · 3.8'][i]}</td></tr>))}</tbody>
          </table>
        </div>);
      if (step.rrf && step.rrf.length) return (
        <div>
          {lists}
          <h4>RRF 합산 (k = 60)</h4>
          <table>
            <thead><tr><th>문서</th><th>제목</th><th>계산</th><th>RRF</th><th>출처</th></tr></thead>
            <tbody>{step.rrf.map((r) => (<tr key={r.id}><td>{r.id}</td><td>{RA_TITLE[r.id]}</td><td className="font-mono">{r.f}</td><td className="font-mono font-bold">{r.v.toFixed(4)}</td><td>{r.src === 'both' ? '양쪽' : r.src}</td></tr>))}</tbody>
          </table>
          <p className="mt-1">LangChain EnsembleRetriever는 각 항에 weights를 곱한다(0.5면 값이 절반). 가중치가 같으면 순위는 위 표와 같다.</p>
        </div>
      );
      if (step.wa || step.w) return (
        <div>
          <h4>α에 따른 가중합 순위 (min-max 정규화 후, numpy 계산)</h4>
          <table>
            <thead><tr><th>순위</th><th>α = 0.3 (키워드 쪽)</th><th>α = 0.5</th><th>α = 0.7 (의미 쪽)</th></tr></thead>
            <tbody>{[0, 1, 2, 3, 4, 5].map((i) => (<tr key={i}><td>#{i + 1}</td>
              {[['D7 0.945', 'D12 0.506', 'D3 0.494', 'D1 0.205', 'D5 0.000', 'D15 0.000'], ['D7 0.909', 'D3 0.638', 'D12 0.362', 'D1 0.341', 'D5 0.000', 'D15 0.000'], ['D7 0.873', 'D3 0.783', 'D1 0.477', 'D12 0.217', 'D5 0.000', 'D15 0.000']].map((col, j) => <td key={j} className="font-mono">{col[i]}</td>)}</tr>))}</tbody>
          </table>
          <p className="mt-1">min-max는 목록 안의 최솟값을 0으로 만들기 때문에 각 목록의 4위(D5, D15)는 어느 α에서도 0이다.</p>
        </div>
      );
      if (step.dense || step.sparse) return lists;
      if (step.cover || step.why || step.guide) return (
        <div>
          <h4>세 방식 비교 (질의 "XGBoost 튜닝", 후보 풀 6건)</h4>
          <table>
            <thead><tr><th>지표</th><th>Dense</th><th>Sparse</th><th>Hybrid (RRF)</th></tr></thead>
            <tbody>
              <tr><td>회수한 후보</td><td>4/6</td><td>4/6</td><td>6/6 (합집합)</td></tr>
              <tr><td>D12 포함</td><td>✗ 누락</td><td>✓ #2</td><td>✓ #3</td></tr>
              <tr><td>D1 포함</td><td>✓ #3</td><td>✗ 누락</td><td>✓ #4</td></tr>
              <tr><td>1위</td><td>D3 (의미만 가까움)</td><td>D7 (키워드 직격)</td><td>D7 (양쪽 추천)</td></tr>
            </tbody>
          </table>
          <h4>fusion 고르기</h4>
          <ul>
            <li>빠른 PoC, 점수 스케일을 모름 → <b>RRF</b> (튜닝 없음, 정규화 불필요)</li>
            <li>도메인 튜닝 (법률·의료) → <b>Weighted</b> (α 조정)</li>
            <li>한쪽 검색기가 매우 강함 → <b>RRF</b> (순위 기반이 안전)</li>
          </ul>
          <p>다음: <a href="./IV-2-1.html">IV-2-1 Re-ranking</a> — hybrid top-20을 cross-encoder로 다시 정렬한다.</p>
        </div>
      );
      return null;
    }
    // ── /RefPanel ──

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[44rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-rose-500/15 border-l-2 border-rose-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
