  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;

    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-2-4. Parent Document Retriever — small-to-big 검색
    학습 목표: 작은 chunk 정밀도 + 큰 chunk 풍부한 context를 동시에 얻는 전략
    핵심 비유: 책의 "목차"로 찾고 → 해당 "절 전체"를 가져와 읽기
    패턴: fastapi v1 — 좌(LiveDataPane: child 트리 + parent 박스 + 정확도/context 비교) / 우(VSCode CodeViewer)
    색상: rag rose
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 도메인 데이터 — FastAPI 인증 시스템 (3장) 문서
    //   parent: 절 단위 (1장 = 1 parent)
    //   child : 소절(목차) 단위 (1 parent에 4 child)
    //   질의  : "OAuth2 인증 방법" → C2가 정답 매칭
    // ─────────────────────────────────────────────────────
    const QUERY = 'OAuth2 인증 방법';

    const PARENT_DOC = {
      id: 'P3',
      title: '3장. FastAPI 인증 시스템',
      tokens: 1000,
      fullText:
        '3장에서는 FastAPI 인증 시스템을 다룹니다. JWT 토큰 구조(헤더·페이로드·서명), ' +
        'OAuth2 비밀번호 인증 플로우(/token 엔드포인트), 토큰 갱신과 만료 처리(refresh token), ' +
        '역할 기반 접근 제어(RBAC, scope) 를 순서대로 설명합니다. 이 장의 모든 내용은 ' +
        '서로 연결되어 있어서 앞부분을 이해해야 뒷부분이 이해됩니다.',
      children: [
        { id: 'C1', text: '3.1 JWT 토큰의 구조와 원리 (header.payload.signature)', tokens: 200, score: 0.42 },
        { id: 'C2', text: '3.2 OAuth2 비밀번호 인증 플로우 (/token 엔드포인트)', tokens: 200, score: 0.92, isMatch: true },
        { id: 'C3', text: '3.3 토큰 갱신과 만료 처리 (refresh token)', tokens: 200, score: 0.51 },
        { id: 'C4', text: '3.4 역할 기반 접근 제어 (RBAC, scope)', tokens: 200, score: 0.38 },
      ],
    };

    // 비교 메트릭 (각 step에 표시)
    //   precision : child만 / child→parent / parent만 / 비교
    //   context   : child만(부족) / 풍부 / 노이즈 섞임
    const METRICS = {
      childOnly:    { precision: 0.92, context: 0.25, label: 'Child만 (작은 chunk)', color: 'blue' },
      parentOnly:   { precision: 0.55, context: 0.95, label: 'Parent만 (큰 chunk)',  color: 'amber' },
      smallToBig:   { precision: 0.92, context: 0.95, label: 'Child→Parent (정답)',  color: 'emerald' },
    };

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 small-to-big 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      smallSearch: {lang:"python", filename:"small-search.py", lines:[
        "# Step 1. 작은 chunk 로 검색 — 정밀도 우선",
        "from langchain.text_splitter import RecursiveCharacterTextSplitter",
        "from langchain_community.vectorstores import Chroma",
        "from langchain_openai import OpenAIEmbeddings",
        "",
        "# 1) 200 토큰 작은 chunk = 목차 수준 (소절)",
        "child_splitter = RecursiveCharacterTextSplitter.from_tiktoken_encoder(",
        "    chunk_size=200,",
        "    chunk_overlap=20,",
        ")",

        showParent: true,
        showMapping: true,
        returnedTo: null,
        metric: null,
        code:{ ...CODE.parentReturn, highlight:[9,10,11,12,13,14,15] },
      },
      { ...S4,
        beat:{ label:"P3를 context로", at:"parent-return.py L31–34",
               caption:"④ 이번엔 {context}에 C2 200토큰이 아니라 P3 1000토큰 절 전체가 들어간다.",
               changes:[{mark:"new", text:"P3 1000tok 반환"},
                        {mark:"changed", text:"context 200 → 1000 tok"}] },
        phase: "parent-return",
        showChildren: true,
        searchActive: true,
        showParent: true,
        showMapping: true,
        returnedTo: "parent",
        metric: null,
        code:{ ...CODE.parentReturn, highlight:[31,32,33,34] },
      },
      { ...S4,
        beat:{ label:"답변 완전 ✅", at:"parent-return.py L36–41",
               caption:"OAuth2 플로우·refresh token·RBAC까지 한 절 안에 다 있다 — 정밀도 92% + 풍부도 95% 동시 확보.",
               changes:[{mark:"new", text:"small-to-big 카드 (92/95)"}] },
        phase: "parent-return",
        showChildren: true,
        searchActive: true,
        showParent: true,
        showMapping: true,
        returnedTo: "parent",
        metric: "smallToBig",
        code:{ ...CODE.parentReturn, highlight:[36,37,38,39,40,41] },
      },
      // ── Step 5 ──────────────────────────────────────────────
      { ...S5,
        beat:{ label:"Child만 행", at:"result.md L5–7",
               caption:"Child만 쓰면 정밀도 92% 지만 context 25% — 답변이 빈약하다.",
               changes:[{mark:"read", text:"Child만: 92% / 25%"}] },
        phase: "result",
        showChildren: true,
        searchActive: false,
        showParent: true,
        showMapping: false,
        returnedTo: "parent",
        metric: "childOnly",
        showCompare: false,
        code:{ ...CODE.result, highlight:[5,6,7] },
      },
      { ...S5,
        beat:{ label:"Parent만 행", at:"result.md L8",
               caption:"Parent만 쓰면 context 95% 지만 정밀도 55% — 큰 chunk는 keyword가 흐려진다.",
               changes:[{mark:"changed", text:"Parent만: 55% / 95%"}] },
        phase: "result",
        showChildren: true,
        searchActive: false,
        showParent: true,
        showMapping: false,
        returnedTo: "parent",
        metric: "parentOnly",
        showCompare: false,
        code:{ ...CODE.result, highlight:[8] },
      },
      { ...S5,
        beat:{ label:"small-to-big 행", at:"result.md L9",
               caption:"child로 찾고 parent를 읽으면 92% / 95% — 양쪽 다 확보한 정답 전략이다.",
               changes:[{mark:"changed", text:"small-to-big: 92% / 95%"}] },
        phase: "result",
        showChildren: true,
        searchActive: false,
        showParent: true,
        showMapping: false,
        returnedTo: "parent",
        metric: "smallToBig",
        showCompare: false,
        code:{ ...CODE.result, highlight:[9] },
      },
      { ...S5,
        beat:{ label:"세 전략 비교표", at:"result.md L13–17",
               caption:"검색용/전달용 chunk를 분리해 청크 크기 trade-off 자체를 회피한다 — 세 전략을 한 평면에 놓고 비교한다.",
               changes:[{mark:"new", text:"3전략 비교 막대"}] },
        phase: "result",
        showChildren: true,
        searchActive: false,
        showParent: true,
        showMapping: false,
        returnedTo: "parent",
        metric: "smallToBig",
        showCompare: true,
        code:{ ...CODE.result, highlight:[13,14,15,16,17] },
      },
      { ...S5,
        beat:{ label:"청크 크기 가이드", at:"result.md L21–24",
               caption:"Parent는 800~2000토큰을 DocStore에, Child는 100~400토큰을 VectorStore에 — 둘을 잇는 끈은 parent_id 하나다.",
               changes:[{mark:"read", text:"권장 크기·저장 위치"},
                        {mark:"read", text:"parent_id 끈 재강조"}] },
        phase: "result",
        showChildren: true,
        searchActive: false,
        showParent: true,
        showMapping: true,
        returnedTo: "parent",
        metric: "smallToBig",
        showCompare: true,
        code:{ ...CODE.result, highlight:[21,22,23,24] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 위 — Document 트리 (parent + children + mapping)
    // ─────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────
    // 좌측 아래 — 메트릭 / 비교 박스
    //   metric === 'childOnly' | 'parentOnly' | 'smallToBig' 일 때 단일 카드
    //   showCompare 일 때 3 전략 비교 막대 그래프
    // ─────────────────────────────────────────────────────


    // ─────────────────────────────────────────────────────
    // ─────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    // ── RefPanel ── 예전 왼쪽 패널에만 있던 문서 트리·비교표·쓰임 (lesson.jsx 가 "표·정리 보기" 상자에 넣는다)
    function RefPanel({ step }) {
      const doc = (
        <div>
          <h4>{PARENT_DOC.id} · {PARENT_DOC.title} ({PARENT_DOC.tokens} tok)</h4>
          <p>{PARENT_DOC.fullText}</p>
          <table>
            <thead><tr><th>child</th><th>소절</th><th>크기</th><th>"{QUERY}" 유사도</th></tr></thead>
            <tbody>{PARENT_DOC.children.map((c) => (
              <tr key={c.id}><td className="font-mono">{c.id}</td><td>{c.text}</td><td className="font-mono">{c.tokens} tok</td><td className="font-mono">{c.score.toFixed(2)}</td></tr>))}</tbody>
          </table>
          <ul>
            <li>RecursiveCharacterTextSplitter의 chunk_size는 기본이 글자 수다. 토큰으로 자르려면 from_tiktoken_encoder로 만든다.</li>
            <li>ParentDocumentRetriever가 child metadata에 적는 키의 기본 이름은 doc_id이고 값은 uuid다. 이 장은 id_key="parent_id"로 바꾸고 id를 "P3"로 줄여 보였다.</li>
          </ul>
        </div>);
      if (step.phase !== 'result') return doc;
      return (
        <div>
          <h4>세 전략 비교 (평가 수치는 예시)</h4>
          <table>
            <thead><tr><th>전략</th><th>검색 정밀도</th><th>context 풍부도</th><th>답변</th></tr></thead>
            <tbody>
              <tr><td>Child만 (200 tok)</td><td className="font-mono">{Math.round(METRICS.childOnly.precision * 100)}%</td><td className="font-mono">{Math.round(METRICS.childOnly.context * 100)}%</td><td>빈약</td></tr>
              <tr><td>Parent만 (1000 tok)</td><td className="font-mono">{Math.round(METRICS.parentOnly.precision * 100)}%</td><td className="font-mono">{Math.round(METRICS.parentOnly.context * 100)}%</td><td>노이즈 섞임</td></tr>
              <tr><td>small-to-big</td><td className="font-mono">{Math.round(METRICS.smallToBig.precision * 100)}%</td><td className="font-mono">{Math.round(METRICS.smallToBig.context * 100)}%</td><td>완전</td></tr>
            </tbody>
          </table>
          <h4>청크 크기 가이드</h4>
          <table>
            <thead><tr><th>역할</th><th>권장 크기</th><th>저장 위치</th></tr></thead>
            <tbody><tr><td>Parent</td><td>800 ~ 2000 tok</td><td>DocStore (KV)</td></tr><tr><td>Child</td><td>100 ~ 400 tok</td><td>VectorStore</td></tr></tbody>
          </table>
          <h4>언제 쓰나</h4>
          <ul>
            <li>긴 문서에서 정밀하게 찾아야 할 때 (논문·기술 문서)</li>
            <li>챕터·절 구조가 있는 문서 (법률·교과서)</li>
            <li>답이 절 하나 분량의 맥락을 요구할 때</li>
          </ul>
          <h4>안 쓰는 편이 나을 때</h4>
          <ul>
            <li>문서가 매우 짧아 한 chunk면 충분할 때</li>
            <li>FAQ처럼 질문 하나에 답 하나가 분명할 때</li>
            <li>토큰 비용이 아주 빠듯할 때 (parent 1000 tok 부담)</li>
          </ul>
        </div>);
    }
    // ── /RefPanel ──

    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const isHi = highlightSet.has(i + 1);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-rose-500/15 border-l-2 border-rose-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{i + 1}</span>
                    <span className="flex-1 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines · {code.filename}</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
