<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG 학습 — VI-2-1. Agentic RAG</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    VI-2-1. Agentic RAG — Agent가 검색 도구를 ReAct로 활용
    학습 목표: 정적 RAG의 한계(한 번 검색·끝)를 Agent가 도구를 자율적으로 호출하는
              패턴이 어떻게 보완하는지 5단계 ReAct cycle 누적으로 이해한다.
    핵심 비유: 탐정 사무소 — 정해진 질의 1회 vs 단서 따라 도구 여러 번 호출
    패턴: fastapi v1 — 좌(LiveDataPane: Agent 박스 + Tools + ReAct cycle 누적)
                       / 우(VSCode CodeViewer: 5개 파일명 탭)
    색상: rose
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 도구 마스터 — Step에 따라 일부만 활성화됨
    //   id : 내부 키 / icon / name / desc
    // ─────────────────────────────────────────────────────
    const TOOLS = [
      { id: 'retriever', icon: '🗄️', name: 'Retriever',  desc: '벡터 DB 검색' },
      { id: 'calc',      icon: '🧮', name: 'Calculator', desc: '수치 계산'   },
      { id: 'api',       icon: '🔌', name: 'API',        desc: '외부 시세 조회' },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 데이터
    //   각 STEP 은 ReAct cycle 누적 — 이전까지의 cycles 를 모두 보여주고,
    //   현재 step 에 새로 추가되는 cycle 만 강조한다.
    //
    //   cycle 한 개 = { thought, action: {tool,query}, observation, isNew }
    //   tools         : 활성 도구 id 배열 (좌측 박스 색칠)
    //   mode          : 'static' | 'agentic' | 'multi-call' | 'multi-tool' | 'react-trace'
    //   finalAnswer   : 마지막 종합 답변 (있으면 표시)
    // ─────────────────────────────────────────────────────
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };
    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"python", filename:"static-rag.py", lines:[
        "# Step 1. 정적 RAG — 한 번 검색하고 끝",
        "from langchain_openai import ChatOpenAI, OpenAIEmbeddings",
        "from langchain_community.vectorstores import FAISS",
        "",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\")",
        "vectorstore = FAISS.load_local(\"./db\", OpenAIEmbeddings())",
        "retriever = vectorstore.as_retriever(search_kwargs={\"k\": 3})",
        "",
        "# 1) 사용자 질문",
        "question = \"아이폰 16 프로 출고가와 달러 가격?\"",
        "",
        "# 2) 단 1회 벡터 검색 — Agent 없음",
        "docs = retriever.invoke(question)",
        "",
        "# 3) 검색 결과를 prompt 에 끼워 LLM 호출",
        "context = \"\\n\".join(d.page_content for d in docs)",
        "prompt = f\"\"\"다음 자료를 참고해 답하라.",
        "",
        "자료:",
        "{context}",
        "",
        "질문: {question}\"\"\"",
        "",
        "answer = llm.invoke(prompt)",
        "#  → \"한국 출고가는 1,550,000원\" (달러 가격은 모름)",
        "",
        "# ⚠ 한계: 검색이 부족해도 추가 행동 불가",
        "#         환율·계산 같은 후속 도구를 호출 못 함",
        "#         \"한 번 검색 → 답변\" 의 단방향 파이프라인",
        "#",
        "# 다음 단계: Agent 가 retriever 를 \"도구\"로 호출하게 만들어",
        "#            필요할 때마다 자율적으로 검색하게 한다",
      ]},
      s2: {lang:"python", filename:"agent.py", lines:[
        "# Step 2. Agentic RAG — retriever 를 tool 로 등록",
        "from langchain.agents import create_react_agent, AgentExecutor",
        "from langchain.tools import tool",
        "from langchain_openai import ChatOpenAI",
        "",
        "# 1) retriever 를 @tool 데코레이터로 감싼다",
        "@tool",
        "def search_docs(query: str) -> str:",
        "    \"\"\"사내 문서 벡터 DB 에서 query 와 관련된 문서를 검색한다.\"\"\"",
        "    docs = retriever.invoke(query)",
        "    return \"\\n\".join(d.page_content for d in docs)",
        "",
        "# 2) Agent 가 사용할 도구 목록",
        "tools = [search_docs]",
        "",
        "# 3) ReAct 패턴 Agent 생성",
        "#    LLM 이 Thought → Action(tool 호출) → Observation 루프를 돈다",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\")",
        "agent = create_react_agent(llm, tools)",
        "executor = AgentExecutor(agent=agent, tools=tools, verbose=True)",
        "",
        "# 4) 호출 — Agent 가 알아서 tool 을 골라 쓴다",
        "result = executor.invoke({",
        "    \"input\": \"아이폰 16 프로 한국 출고가는?\"",
        "})",

              <span className="text-[11px] font-bold text-rose-800">Agent</span>
            </div>
            <span className={`text-[9px] px-1.5 py-0.5 rounded font-mono font-bold ${modeLabel.cls}`}>
              {modeLabel.icon} {modeLabel.txt}
            </span>
          </div>
          <div className="bg-rose-50 rounded border border-rose-200 p-2">
            <div className="text-[9px] font-bold text-rose-700 uppercase tracking-wider mb-0.5">user question</div>
            <div className="text-[10px] text-rose-900 leading-snug">"{question}"</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Tools 박스 — 좌측 중단
    //   activeTools 에 포함된 도구는 활성, 나머지는 회색 처리
    // ─────────────────────────────────────────────────────
    function ToolsBox({ activeTools, mode }) {
      return (
        <div className="bg-white rounded-lg border-2 border-rose-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🧰</span>
              <span className="text-[11px] font-bold text-rose-800">Tools 등록 현황</span>
            </div>
            <span className="text-[9px] bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded font-mono">
              {activeTools.length}/{TOOLS.length} active
            </span>
          </div>
          <div className="grid grid-cols-3 gap-1.5">
            {TOOLS.map((tool) => {
              const active = activeTools.includes(tool.id);
              return (
                <div
                  key={tool.id}
                  className={`p-1.5 rounded border-2 transition-all duration-300 ${
                    active
                      ? 'bg-rose-50 border-rose-400 shadow-sm'
                      : 'bg-slate-50 border-slate-200 opacity-40'
                  }`}
                >
                  <div className="text-center">
                    <div className="text-lg mb-0.5">{tool.icon}</div>
                    <div className={`text-[10px] font-bold ${active ? 'text-rose-800' : 'text-slate-500'}`}>
                      {tool.name}
                    </div>
                    <div className={`text-[8px] mt-0.5 ${active ? 'text-rose-600' : 'text-slate-400'}`}>
                      {tool.desc}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          {mode === 'static' && (
            <div className="text-[9px] text-slate-500 mt-1.5 italic">
              ※ 정적 RAG: 도구 개념 없이 retriever 를 직접 호출
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Cycle 한 개 — Thought / Action / Observation 박스
    //   isNew  : 이번 step 에 새로 추가된 cycle (강조)
    //   isFinal: 최종 답변 생성 cycle (action/observation 없음)
    // ─────────────────────────────────────────────────────
    function CycleCard({ cycle, idx, isStaticMode }) {
      const tool = cycle.action ? TOOLS.find((t) => t.id === cycle.action.tool) : null;
      const newRing = cycle.isNew ? 'ring-2 ring-rose-400 ring-offset-1' : '';

      if (cycle.isFinal) {
        return (
          <div className={`bg-emerald-50 border-2 border-emerald-300 rounded-lg p-2 ${newRing} transition-all duration-500`}>
            <div className="flex items-center gap-1.5 mb-1">
              <span className="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                cycle #{idx + 1} · FINAL
              </span>
              {cycle.isNew && (
                <span className="text-[8px] bg-rose-600 text-white px-1 rounded font-bold animate-pulse">NEW</span>
              )}
            </div>
            <div className="bg-white rounded border border-emerald-200 p-1.5">
              <div className="text-[9px] font-bold text-emerald-700 mb-0.5">🤔 Thought</div>
              <div className="text-[10px] text-emerald-900 italic leading-snug">"{cycle.thought}"</div>
            </div>
            <div className="text-center text-[10px] text-emerald-600 my-1">↓ 정보 충분 → 답변 생성</div>
          </div>
        );
      }

      return (
        <div
          className={`bg-white border-2 rounded-lg p-2 ${
            cycle.isNew ? 'border-rose-400 shadow-md' : 'border-slate-200'
          } ${newRing} transition-all duration-500`}
        >
          <div className="flex items-center gap-1.5 mb-1.5">
            <span className="text-[9px] bg-slate-700 text-white px-1.5 py-0.5 rounded font-mono font-bold">
              cycle #{idx + 1}
            </span>
            {cycle.isNew && (
              <span className="text-[8px] bg-rose-600 text-white px-1 rounded font-bold animate-pulse">NEW</span>
            )}
            {isStaticMode && (
              <span className="text-[8px] bg-slate-400 text-white px-1 rounded font-bold">no-thought</span>
            )}
          </div>

          {/* Thought */}
          {cycle.thought && (
            <div className="bg-amber-50 rounded border border-amber-200 p-1.5 mb-1">
              <div className="text-[9px] font-bold text-amber-700 mb-0.5">🤔 Thought</div>
              <div className="text-[10px] text-amber-900 italic leading-snug">"{cycle.thought}"</div>
            </div>
          )}

          {/* Action */}
          {cycle.action && (
            <div className="bg-blue-50 rounded border border-blue-200 p-1.5 mb-1">
              <div className="flex items-center gap-1 mb-0.5">
                <span className="text-[9px] font-bold text-blue-700">⚡ Action</span>
                {tool && (
                  <span className="text-[9px] bg-blue-600 text-white px-1 rounded font-mono">
                    {tool.icon} {tool.name}
                  </span>
                )}
              </div>
              <div className="text-[10px] text-blue-900 font-mono leading-snug">
                {tool ? `${tool.id}("${cycle.action.query}")` : cycle.action.query}
              </div>
            </div>
          )}

          {/* Observation */}
          {cycle.observation && (
            <div className="bg-green-50 rounded border border-green-200 p-1.5">
              <div className="text-[9px] font-bold text-green-700 mb-0.5">👁 Observation</div>
              <div className="text-[10px] text-green-900 font-mono leading-snug">{cycle.observation}</div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ReAct Trace — Cycle 들을 누적해서 보여주는 박스
    // ─────────────────────────────────────────────────────
    function ReactTraceBox({ cycles, mode, finalAnswer, finalIsFail }) {
      const isStaticMode = mode === 'static';
      return (
        <div className="bg-rose-50 border-2 border-rose-300 rounded-lg p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🧭</span>
              <span className="text-[11px] font-bold text-rose-800">ReAct Cycle 누적</span>
            </div>
            <span className="text-[9px] bg-rose-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
              {cycles.length} cycle{cycles.length > 1 ? 's' : ''}
            </span>
          </div>

          <div className="space-y-1.5 max-h-64 overflow-y-auto pr-1">
            {cycles.map((c, i) => (
              <CycleCard key={i} cycle={c} idx={i} isStaticMode={isStaticMode} />
            ))}
          </div>

          {/* 최종 답변 */}
          {finalAnswer && (
            <div
              className={`mt-2 p-2 rounded border-2 ${
                finalIsFail
                  ? 'bg-yellow-50 border-yellow-300'
                  : 'bg-emerald-50 border-emerald-400'
              }`}
            >
              <div
                className={`text-[9px] font-bold uppercase tracking-wider mb-0.5 ${
                  finalIsFail ? 'text-yellow-700' : 'text-emerald-700'
                }`}
              >
                {finalIsFail ? '⚠ 부분 답변 (도구 부족)' : '✅ Final Answer'}
              </div>
              <div className={`text-[10px] leading-snug ${finalIsFail ? 'text-yellow-900' : 'text-emerald-900 font-medium'}`}>
                {finalAnswer}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: AgentBox / 중단: ToolsBox / 하단: ReactTraceBox
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🕵️ Agentic RAG — ReAct Cycle 시뮬레이터</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>

          <div className="space-y-3">
            <AgentBox mode={step.mode} question={step.question} />
            <ToolsBox activeTools={step.tools} mode={step.mode} />
            <ReactTraceBox
              cycles={step.cycles}
              mode={step.mode}
              finalAnswer={step.finalAnswer}
              finalIsFail={step.finalIsFail}
            />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-500"></span>Thought
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-blue-500"></span>Action
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-green-500"></span>Observation
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-500"></span>NEW cycle
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>Final
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[44rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-rose-500/15 border-l-2 border-rose-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-rose-700 hover:text-rose-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum VI-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-rose-600 text-white flex items-center justify-center rounded-full font-bold text-sm">VI</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part VI. Advanced RAG 패턴 &gt; Chapter 2. Agentic &amp; Adaptive</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">VI-2-1. Agentic RAG — Agent가 검색 도구를 ReAct로 활용</h1>
                  <p className="text-sm text-slate-500 mt-0.5">탐정 사무소의 단서 추적 — 정적 RAG → Agent → 다중 호출 → 도구 결합 → ReAct trace</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-rose-50 border-2 border-rose-300 rounded-xl p-3 text-sm text-rose-900">
                💡 정리: <strong>정적 RAG</strong> 는 한 번 검색 → 끝, <strong>Agentic RAG</strong> 는 ReAct cycle 로 도구를 자율 활용한다. 단서 부족하면 <strong>다시 호출</strong>, 다른 종류의 정보가 필요하면 <strong>다른 도구</strong>로 갈아탄다. 다음(VI-2-2)에서는 질문 난이도에 따라 RAG 전략을 바꾸는 Adaptive RAG 를 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-rose-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-rose-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-rose-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-rose-600 text-white hover:bg-rose-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['Agentic RAG', 'ReAct', 'Tool Use', 'AgentExecutor', 'multi-call', 'multi-tool', 'trace'].map((kw) => (
                <span key={kw} className="bg-rose-50 text-rose-700 px-3 py-1 rounded-full text-xs font-medium border border-rose-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./VI-1-2.html" className="text-rose-700 hover:text-rose-900 font-medium">&larr; VI-1-2 CRAG</a>
              <a href="./VI-2-2.html" className="text-rose-700 hover:text-rose-900 font-medium">VI-2-2 Adaptive RAG &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
