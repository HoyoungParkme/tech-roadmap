  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-1-2. 전처리 파이프라인 — clean / normalize / dedupe / OCR
    학습 목표: 로딩된 원본의 잡음을 5단계로 깨끗한 텍스트로 만들어
              검색 품질을 끌어올리는 과정을 직관적으로 이해한다.
    핵심 비유: 음식 재료 손질 — 씻기 → 껍질 → 상한 부분 → 스캔 텍스트 살리기 → 완성
    패턴: fastapi v1 — 좌(LiveDataPane: raw/cleaned 박스 + 변환 시각화) / 우(VSCode CodeViewer)
    색상: rag rose
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 원본 문서 — 잡음이 가득한 사내 인사규정 페이지
    //   각 라인에 line 번호 / 카테고리 / 텍스트
    //   카테고리(kind):
    //     'noise'   : 헤더/푸터/광고 — Step 2에서 line-through
    //     'normal'  : 본문이지만 공백/전각 미정규 — Step 2에서 cleaned
    //     'dupe'    : 중복 문서 — Step 3에서 line-through
    //     'image'   : 스캔 이미지 placeholder — Step 4에서 OCR로 텍스트 채워짐
    // ─────────────────────────────────────────────────────
    const RAW_LINES = [
      { n: 1,  kind: 'noise',  raw: '===== 헤더: 주식회사 ABC =====' },
      { n: 2,  kind: 'noise',  raw: 'Navigation: Home | About | Contact' },
      { n: 3,  kind: 'noise',  raw: 'Copyright 2024 ABC Corp.' },
      { n: 4,  kind: 'normal', raw: '제1장   인사규정' },
      { n: 5,  kind: 'normal', raw: '1.1 근무시간은　오전 9시부터 오후 6시까지로 한다．' },
      { n: 6,  kind: 'noise',  raw: '[광고] 신입사원 모집중! 지금 바로 지원하세요!' },
      { n: 7,  kind: 'normal', raw: '1.2 연차 휴가는 다음과 같다:' },
      { n: 8,  kind: 'dupe',   raw: '1.2 연차 휴가는 다음과 같다:  (중복 페이지)' },
      { n: 9,  kind: 'image',  raw: '[image: scan_p3.png — 스캔 이미지]', ocr: '   - 1년 미만: 월 1일' },
      { n: 10, kind: 'image',  raw: '[image: scan_p4.png — 스캔 이미지]', ocr: '   - 3년 이상: 15일 + 근속년수×1일' },
      { n: 11, kind: 'noise',  raw: '===== 푸터: Copyright 2024 =====' },
    ];

    // 정제된 라인 (Step 2 normalize 적용 후) — 잡음 제거 + 전각/이상 공백 정규화
    const CLEANED_NORMAL = {
      4:  '제1장 인사규정',
      5:  '1.1 근무시간은 오전 9시부터 오후 6시까지로 한다.',
      7:  '1.2 연차 휴가는 다음과 같다:',
    };

    // ─────────────────────────────────────────────────────
    // 5단계 STEPS 정의
    //   각 step의 dataState:
    //     leftLines  : 좌측 raw 박스에 표시할 라인 (kind/state 포함)
    //     rightLines : 우측 cleaned 박스에 표시할 라인 (없으면 빈 박스)
    //     stats      : 하단 통계 패널 (raw bytes / cleaned bytes / 잡음 비율 …)
    //     highlightKind : 이 step에서 강조할 카테고리 (raw 박스에서 깜빡)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang: "python", filename: "raw.py", lines: [
        "# Step 1. 원본 페이지 — 잡음 가득한 그대로의 텍스트",
        "from langchain_community.document_loaders import WebBaseLoader",
        "",
        "# 사내 인사규정 페이지 (HTML)를 그대로 로딩",
        "loader = WebBaseLoader(\"https://abc.corp/hr/policy.html\")",
        "docs = loader.load()",
        "",
        "print(docs[0].page_content[:200])",
        "#  ===== 헤더: 주식회사 ABC =====",
        "#  Navigation: Home | About | Contact",
        "#  Copyright 2024 ABC Corp.",
        "#  제1장   인사규정                          ← 전각 공백",
        "#  1.1 근무시간은　오전 9시부터 오후 6시까지로 한다．  ← 전각 마침표",

    // ─────────────────────────────────────────────────────
    // 좌측 위: Raw 박스 — 원본 라인을 색·취소선으로 표시
    //   state:
    //     'raw'      : 정상 (slate)
    //     'removed'  : 제거됨 (line-through, 회색)
    //     'ocred'    : OCR 처리됨 (rose 강조 + 화살표)
    //   highlightKind 가 일치하면 살짝 ring 효과
    // ─────────────────────────────────────────────────────
    function RawPane({ lines, highlightKind }) {
      return (
        <div className="bg-white rounded-lg border-2 border-rose-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">📄</span>
              <span className="text-[11px] font-bold text-rose-800">raw text (원본)</span>
            </div>
            <span className="text-[9px] bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded font-mono">
              {lines.length} lines
            </span>
          </div>
          <div className="bg-rose-50/40 rounded border border-rose-100 p-2 max-h-72 overflow-y-auto">
            <div className="space-y-0.5 font-mono text-[10px] leading-snug">
              {lines.map((l) => {
                const isRemoved = l.state === 'removed';
                const isOcred = l.state === 'ocred';
                const focus = highlightKind && l.kind === highlightKind;
                let cls = 'text-slate-700';
                if (isRemoved) cls = 'text-slate-400 line-through';
                if (l.kind === 'noise' && !isRemoved) cls = 'text-slate-700';
                if (l.kind === 'dupe' && !isRemoved) cls = 'text-amber-700';
                if (l.kind === 'image' && !isRemoved && !isOcred) cls = 'text-purple-700';
                if (isOcred) cls = 'text-emerald-700 font-semibold';
                let badge = null;
                if (l.kind === 'noise') {
                  badge = <span className={`text-[8px] px-1 rounded font-bold ${isRemoved ? 'bg-slate-300 text-slate-500' : 'bg-rose-200 text-rose-800'}`}>noise</span>;
                } else if (l.kind === 'dupe') {
                  badge = <span className={`text-[8px] px-1 rounded font-bold ${isRemoved ? 'bg-slate-300 text-slate-500' : 'bg-amber-300 text-amber-800'}`}>dupe</span>;
                } else if (l.kind === 'image') {
                  badge = <span className={`text-[8px] px-1 rounded font-bold ${isOcred ? 'bg-emerald-500 text-white' : 'bg-purple-300 text-purple-800'}`}>{isOcred ? 'OCR ✓' : 'image'}</span>;
                }
                return (
                  <div key={l.n} className={`flex items-start gap-1.5 px-1 py-0.5 rounded transition-all duration-500 ${focus ? 'bg-rose-200/50 ring-1 ring-rose-300' : ''}`}>
                    <span className="select-none text-slate-400 w-5 text-right flex-shrink-0">{l.n}</span>
                    <span className="w-12 flex-shrink-0">{badge}</span>
                    <span className={`flex-1 whitespace-pre-wrap break-all ${cls}`}>
                      {isOcred && l.ocr ? (
                        <>
                          <span className="line-through text-slate-400">{l.raw}</span>
                          <span className="text-emerald-600 mx-1">→</span>
                          <span>{l.ocr}</span>
                        </>
                      ) : l.raw}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 아래: Cleaned 박스 — 정제된 라인이 단계별로 채워짐
    //   state:
    //     'new'      : 이번 단계에서 새로 들어옴 (rose ring + animate)
    //     'kept'     : 유지 (rose 채움)
    //     'pending'  : 아직 미해결 (점선 회색 — 다음 단계가 처리)
    // ─────────────────────────────────────────────────────
    function CleanedPane({ lines, stats }) {
      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">✨</span>
              <span className="text-[11px] font-bold text-emerald-800">cleaned text (정제)</span>
            </div>
            <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-mono">
              {lines.length} lines · {stats.cleanedBytes}B
            </span>
          </div>
          <div className="bg-emerald-50/40 rounded border border-emerald-100 p-2 min-h-[10rem] max-h-72 overflow-y-auto">
            {lines.length === 0 ? (
              <div className="text-center text-[10px] text-slate-400 italic py-10">
                (아직 비어있음 — 정제 시작 전)
              </div>
            ) : (
              <div className="space-y-0.5 font-mono text-[10px] leading-snug">
                {lines.map((l) => {
                  let frame = 'border border-emerald-200 bg-white';
                  let textCls = 'text-emerald-900';
                  if (l.state === 'new') {
                    frame = 'border border-emerald-400 bg-emerald-100 ring-2 ring-emerald-300';
                    textCls = 'text-emerald-900 font-semibold';
                  } else if (l.state === 'pending') {
                    frame = 'border border-dashed border-slate-300 bg-slate-50';
                    textCls = 'text-slate-400 italic';
                  }
                  return (
                    <div key={l.n} className={`flex items-start gap-1.5 px-1.5 py-1 rounded transition-all duration-500 ${frame}`}>
                      <span className="select-none text-slate-400 w-5 text-right flex-shrink-0">{l.n}</span>
                      {l.label && (
                        <span className={`text-[8px] px-1 rounded font-bold flex-shrink-0 ${l.state === 'new' ? 'bg-emerald-500 text-white animate-pulse' : 'bg-slate-300 text-slate-500'}`}>
                          {l.label}
                        </span>
                      )}
                      <span className={`flex-1 whitespace-pre-wrap break-all ${textCls}`}>{l.text}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
          {/* 통계 패널 */}
          <div className="grid grid-cols-3 gap-1.5 mt-2 text-[9px] font-mono">
            <div className="bg-rose-50 border border-rose-200 rounded px-1.5 py-1 text-center">
              <div className="text-rose-500 uppercase tracking-wider text-[8px]">raw</div>
              <div className="text-rose-700 font-bold">{stats.rawBytes} B</div>
            </div>
            <div className="bg-emerald-50 border border-emerald-200 rounded px-1.5 py-1 text-center">
              <div className="text-emerald-500 uppercase tracking-wider text-[8px]">cleaned</div>
              <div className="text-emerald-700 font-bold">{stats.cleanedBytes} B</div>
            </div>
            <div className="bg-slate-50 border border-slate-200 rounded px-1.5 py-1 text-center">
              <div className="text-slate-500 uppercase tracking-wider text-[8px]">noise</div>
              <div className="text-slate-700 font-bold">
                {stats.noiseRatio === null ? '—' : `${stats.noiseRatio}%`}
              </div>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-1.5 mt-1.5 text-[9px] font-mono">
            <div className="bg-amber-50 border border-amber-200 rounded px-1.5 py-1 text-center">
              <div className="text-amber-500 uppercase tracking-wider text-[8px]">dupes removed</div>
              <div className="text-amber-700 font-bold">{stats.dupes}</div>
            </div>
            <div className="bg-purple-50 border border-purple-200 rounded px-1.5 py-1 text-center">
              <div className="text-purple-500 uppercase tracking-wider text-[8px]">ocr recovered</div>
              <div className="text-purple-700 font-bold">{stats.ocr}</div>
            </div>
          </div>
          {stats.final && (
            <div className="mt-2 text-[10px] text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-1.5 font-medium">
              ✓ 다음 단계 Chunking 으로 안전 전달 가능
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: Raw 박스 / 하단: Cleaned 박스 + 통계
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📑 raw → cleaned 변환</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-3">
            <RawPane lines={step.leftLines} highlightKind={step.highlightKind} />
            <CleanedPane lines={step.rightLines} stats={step.stats} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-300"></span>noise
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-300"></span>dupe
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-purple-300"></span>image (OCR)
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>cleaned
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + 라인 번호
    //   파일명 탭(raw.py, clean.py, dedupe.py, ocr.py, pipeline.py)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      // 5개 파일 탭 — 현재 step의 filename이 active
      const tabs = ['raw.py', 'clean.py', 'dedupe.py', 'ocr.py', 'pipeline.py'];

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 (5개) */}
          <div className="bg-[#21252b] px-3 pt-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5 mb-1">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <div className="flex items-end gap-0.5 ml-2 overflow-x-auto">
              {tabs.map((t) => {
                const active = t === code.filename;
                return (
                  <span
                    key={t}
                    className={`px-2.5 py-1 text-[10px] font-mono rounded-t-md whitespace-nowrap transition ${
                      active
                        ? 'bg-[#282c34] text-rose-300 border-t border-l border-r border-slate-700 font-bold'
                        : 'text-slate-500 hover:text-slate-300'
                    }`}
                  >
                    {t}
                  </span>
                );
              })}
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase pb-1">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[42rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-rose-500/15 border-l-2 border-rose-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines · {code.filename}</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인 — 4 버튼 + 키보드 + 3000ms 자동재생
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-rose-700 hover:text-rose-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-rose-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 데이터 준비 &gt; Chapter 1. 문서 수집과 전처리</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">II-1-2. 전처리 파이프라인 — clean / normalize / dedupe / OCR</h1>
                  <p className="text-sm text-slate-500 mt-0.5">음식 재료 손질 — 잡음 제거 → 정규화 → 중복 컷 → OCR 복원</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-rose-50 border-2 border-rose-300 rounded-xl p-3 text-sm text-rose-900">
                💡 정리: <strong>clean</strong>(잡음 컷) → <strong>NFKC</strong>(전각 통일) → <strong>dedupe</strong>(중복 제거) → <strong>OCR</strong>(이미지 복원). 이 4단계만 거쳐도 검색 품질이 눈에 띄게 올라간다. 다음(II-1-3)에서는 메타데이터 보존과 활용을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-rose-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-rose-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-rose-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-rose-600 text-white hover:bg-rose-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['전처리', 'clean', 'NFKC', 'dedupe (hash)', 'OCR', 'tesseract', 'pipeline'].map((kw) => (
                <span key={kw} className="bg-rose-50 text-rose-700 px-3 py-1 rounded-full text-xs font-medium border border-rose-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-1-1.html" className="text-rose-700 hover:text-rose-900 font-medium">&larr; II-1-1. Document Loading</a>
              <a href="./II-1-3.html" className="text-rose-700 hover:text-rose-900 font-medium">II-1-3. 메타데이터 보존과 활용 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
