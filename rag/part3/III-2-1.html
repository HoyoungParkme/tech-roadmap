  <!--
    III-2-1. Vector Store — ANN 검색 (Approximate Nearest Neighbor)
    학습 목표: Brute force(KNN) 한계를 이해하고, ANN의 정확도-속도 trade-off,
              recall@k 측정 방식, HNSW/IVF 알고리즘 예고까지 5단계로 학습.
    핵심 비유: 도서관 100만 권에서 책 찾기 — 모든 책장 뒤지기 vs 사서 추천 코너만
    패턴: fastapi v1 — 좌(LiveDataPane: 벡터 공간 + 시간/recall 막대) / 우(VSCode CodeViewer)
    색상: rag rose
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 벡터 공간 데이터 — 시드 고정으로 매번 같은 좌표 사용
    //   Query는 정중앙 (50, 50)
    //   POINTS 24개를 고정 좌표로 배치 (랜덤 X — 재현성 보장)
    // ─────────────────────────────────────────────────────
    const POINTS = [
      { id: 0,  x: 18, y: 22 }, { id: 1,  x: 35, y: 18 },
      { id: 2,  x: 52, y: 14 }, { id: 3,  x: 70, y: 20 },
      { id: 4,  x: 84, y: 28 }, { id: 5,  x: 22, y: 38 },
      { id: 6,  x: 40, y: 42 }, { id: 7,  x: 58, y: 44 }, // 7번 = top-1 후보 (정답)
      { id: 8,  x: 44, y: 56 }, // 8번 = top-2 후보 (정답)
      { id: 9,  x: 62, y: 58 }, // 9번 = top-3 후보 (정답)
      { id: 10, x: 28, y: 60 }, { id: 11, x: 78, y: 50 },
      { id: 12, x: 16, y: 72 }, { id: 13, x: 38, y: 78 },
      { id: 14, x: 56, y: 80 }, { id: 15, x: 76, y: 76 },
      { id: 16, x: 88, y: 62 }, { id: 17, x: 12, y: 50 },
      { id: 18, x: 90, y: 42 }, { id: 19, x: 24, y: 12 },
      { id: 20, x: 68, y: 10 }, { id: 21, x: 86, y: 14 },
      { id: 22, x: 14, y: 88 }, { id: 23, x: 82, y: 90 },
    ];
    const QUERY = { x: 50, y: 50 };

    // 거리 계산 — Euclidean
    const dist = (p) => Math.sqrt((p.x - QUERY.x) ** 2 + (p.y - QUERY.y) ** 2);
    const SORTED = [...POINTS].map((p) => ({ ...p, d: dist(p) })).sort((a, b) => a.d - b.d);

    // 정답 top-3 (KNN — 정확): 8번 8.49 · 7번 10.00 · 6번 12.81
    const TRUE_TOP3 = SORTED.slice(0, 3).map((p) => p.id); // [8, 7, 6]
    // ANN 후보 셀: x 10~52, y 36~64 안의 점 5개 [5, 6, 8, 10, 17] — 7번(58, 44)은 셀 바로 밖
    const ANN_CELL = POINTS.filter((p) => p.x >= 10 && p.x <= 52 && p.y >= 36 && p.y <= 64).map((p) => p.id);
    // ANN top-3 — 후보 셀 안에서만 거리순: 7번을 놓치고 10번을 회수 (recall 2/3 = 67%)
    const ANN_TOP3 = SORTED.filter((p) => ANN_CELL.includes(p.id)).slice(0, 3).map((p) => p.id); // [8, 6, 10]

    // recall@3 계산
    const recallAt3 = (predicted, truth) => {
      const hit = predicted.filter((id) => truth.includes(id)).length;
      return hit / truth.length;
    };

    // 벤치마크 데이터 (시간 단위 ms)
    const BENCH = [
      { size: '1K',    bf: 0.5,    ann: 0.3,  ratio: '1.7x'    },
      { size: '100K',  bf: 50,     ann: 0.8,  ratio: '62x'     },
      { size: '1M',    bf: 500,    ann: 1.2,  ratio: '416x'    },
      { size: '100M',  bf: 50000,  ann: 2,    ratio: '25,000x' },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 STEPS — dataState로 그림(./III-2-1.anim.js) 변화 제어
    //   mode  : 'brute' | 'ann' | 'tradeoff' | 'recall' | 'algo'
    //   scan  : Brute force 단계에서 "검사된" 포인트 ID 배열 (전체)
    //   probe : ANN 단계에서 "후보 셀에 들어온" 포인트 ID 배열 (좁은 영역)
    //   resultIds : 최종 회수된 top-k 포인트 ID 배열
    //   timeMs : 검색 소요 시간 (ms) — 막대 폭 계산용
    //   recall : 0~1 (recall@3)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"python", filename:"brute-force.py", lines:[
        "# Step 1. Brute Force — 모든 벡터와 거리 비교 (정확 100%)",
        "import numpy as np",
        "",
        "def brute_force_search(query, vectors, k=3):",
        "    \"\"\"KNN 정공법 — n번 거리 계산 후 정렬\"\"\"",
        "    distances = []",
        "    for i, vec in enumerate(vectors):",
        "        # 모든 벡터와 L2 거리 계산",
        "        d = np.linalg.norm(query - vec)",
        "        distances.append((i, d))",
        "",
        "    # 거리순 정렬 → 상위 k개 반환",
        "    distances.sort(key=lambda x: x[1])",
        "    return distances[:k]",
        "",
        "",
        "# 100만 벡터에서 검색",
        "vectors = np.random.rand(1_000_000, 1536)",
        "query   = np.random.rand(1536)",
        "results = brute_force_search(query, vectors, k=3)",
        "#  ✓ 정확도 100% — 진짜 최근접 3개 반환",
        "#  ✗ 1M × 1536차원 → 최적화 라이브러리로도 수백 ms (예시 500ms)",
        "#  ✗ QPS 100이면 CPU 한 대로는 감당 불가",
        "",
        "# ─── 결론: 작은 데이터(<10K)에만 쓸 만함 ───",
        "# 다음 단계 → ANN으로 후보군 좁히기",
      ]},
      s2: {lang:"python", filename:"ann.py", lines:[
        "# Step 2. ANN — 인덱스로 후보 셀만 검색 (속도 ↑, 정확도 약간 ↓)",
        "from langchain_community.vectorstores import Chroma",
        "from langchain_openai import OpenAIEmbeddings",
        "",
        "# 1) 임베딩 모델 + ANN Vector Store (내부적으로 HNSW)",
        "embeddings  = OpenAIEmbeddings(model=\"text-embedding-3-small\")",
        "vectorstore = Chroma.from_documents(",
        "    documents=chunks,",
        "    embedding=embeddings,",
        "    persist_directory=\"./chroma_db\",",
        ")",
        "",
        "# 2) 검색 — 내부에서 ANN 알고리즘으로 후보 좁힘",
        "results = vectorstore.similarity_search(query=\"연차 휴가 정책\", k=3)",
        "",
        "# ─── ANN 동작 핵심 ───",
        "#  ① 인덱스 빌드 시 벡터를 \"셀/그래프\"로 분할",
        "#  ② 쿼리 시 가까운 셀만 골라 brute force",
        "#  ③ 24개 중 5개만 비교 → 규모가 크면 수백 배 빠름",
        "",
        "#  ⚠ 단점: 셀 경계에 걸친 진짜 정답은 놓칠 수 있음",
        "#         이번 예시 정답 [8,7,6] 중 7번 miss",
        "#         ANN 결과 [8,6,10] → recall@3 = 2/3 = 67%",
        "",
        "# ─── 그래도 ANN을 쓰는 이유 ───",
        "#  실제 임베딩 + 좋은 알고리즘이면 95~99% recall 유지",
        "#  속도는 수백~수만 배 빠름 → trade-off 가치 있음",
      ]},
      s3: {lang:"markdown", filename:"tradeoff.md", lines:[
        "# Brute Force vs ANN — 데이터 크기별 비교",
        "",
        "| 벡터 수      | Brute Force        | ANN     | 속도 차이 |",
        "|-------------|--------------------|---------|----------|",
        "| 1,000       | 0.5 ms             | 0.3 ms  | 1.7x     |",
        "| 100,000     | 50 ms              | 0.8 ms  | 62x      |",
        "| 1,000,000   | 500 ms             | 1.2 ms  | 416x     |",
        "| 100,000,000 | 50,000 ms (50초!)  | 2 ms    | 25,000x  |",
        "",
        "## 핵심 통찰",
        "- 데이터가 작을수록 차이가 작다 — **10K 미만은 Brute force도 OK**",
        "- 100만 벡터부터는 ANN이 사실상 유일한 선택",
        "- 1억 벡터에서 50초는 SLA 초과 — **서비스 자체가 불가능**",
        "",
        "## Trade-off 매트릭스",
        "",
        "| 항목          | Brute Force | ANN              |",
        "|--------------|-------------|------------------|",
        "| 정확도(recall)| 100%        | 95~99%           |",
        "| 시간 복잡도   | O(n)        | O(log n) ~ O(1)  |",
        "| 인덱스 빌드   | 불필요       | 필요 (수~수십초) |",
        "| 메모리        | 원본만       | 원본 + 인덱스    |",
        "| 적합 케이스   | < 10K 벡터   | 100K+ 프로덕션   |",
        "",
        "## 실무 결론",
        "",
        "> \"정확도 1~5%를 양보하고 속도를 1000배 이상 얻는다.\"",
        "> — Chroma · FAISS · Pinecone · Weaviate의 기본값",
        "",
        "단, **얼마나 양보했는지는 측정해야 한다** — 다음: recall@k",
      ]},
      s4: {lang:"python", filename:"recall.py", lines:[
        "# Step 4. recall@k — ANN 정확도 측정의 표준 지표",
        "import numpy as np",
        "",
        "def recall_at_k(predicted_ids, truth_ids, k):",
        "    \"\"\"ANN이 회수한 top-k 중 진짜 정답에 속한 비율 (0.0 ~ 1.0)\"\"\"",
        "    truth_set = set(truth_ids[:k])",
        "    hit = sum(1 for pid in predicted_ids[:k] if pid in truth_set)",
        "    return hit / k",
        "",
        "# ─── 이번 시각화 예시 ───",
        "truth     = [8, 7, 6]      # 진짜 최근접 3개 (Brute force)",
        "predicted = [8, 6, 10]     # ANN 결과 (7번 miss, 10번 잘못)",
        "",
        "r = recall_at_k(predicted, truth, k=3)",
        "#  → hit = {8, 6} = 2개",
        "#  → recall@3 = 2 / 3 ≈ 0.67  (67%)",
        "",
        "# ─── 실무 평가 루프 ───",
        "queries  = load_eval_queries(n=1000)         # 평가 쿼리 1000개",
        "truth_db = build_brute_force_truth(queries)  # 정답 미리 계산",
        "",
        "recalls = []",
        "for q, truth in zip(queries, truth_db):",
        "    pred = vectorstore.similarity_search(q, k=10)",
        "    recalls.append(recall_at_k(pred, truth, k=10))",
        "",
        "print(f\"평균 recall@10 = {np.mean(recalls):.3f}\")",
        "#  목표: 0.95 이상 (인덱스 파라미터 efSearch/nprobe로 튜닝)",
        "",
        "# 💡 recall ↑ → 후보 셀을 더 많이 보면 됨 (속도 ↓)",
        "#    recall ↓ 허용 → 더 적게 봐도 됨 (속도 ↑↑)",
      ]},
      s5: {lang:"markdown", filename:"next-algo.md", lines:[
        "# 다음 자료(III-2-2) 예고 — ANN 알고리즘 3대장",
        "",
        "## 1. HNSW (Hierarchical Navigable Small World)",
        "- **아이디어**: 그래프를 층층이(skip list 처럼) 쌓는다",
        "- **검색**: 최상층(노드 적음)에서 큰 점프 → 하위층 세밀하게",
        "- **속도/메모리**: O(log n) / 큼 (그래프 엣지 저장)",
        "- **사용처**: Chroma · Weaviate · Qdrant · pgvector(0.5+) 기본",
        "",
        "## 2. IVF (Inverted File Index)",
        "- **아이디어**: k-means로 벡터 공간을 voronoi 셀로 분할",
        "- **검색**: 쿼리에 가까운 nprobe 개 셀만 brute force",
        "- **속도/메모리**: 빠름 / 작음 (centroids만 저장)",
        "- **사용처**: FAISS IndexIVFFlat / IVFPQ",
        "",
        "## 3. PQ (Product Quantization)",
        "- **아이디어**: 1536차원을 sub-vector로 쪼개 8bit로 압축",
        "- **검색**: 압축 코드끼리 lookup table로 빠르게 거리 계산",

            <thead><tr><th>알고리즘</th><th>아이디어</th><th>속도 / 메모리</th><th>쓰는 곳</th></tr></thead>
            <tbody>
              <tr><td><b>HNSW</b></td><td>그래프를 층층이 쌓아 큰 점프 → 작은 점프</td><td>O(log n) / 큼</td><td>Chroma · Weaviate · Qdrant · pgvector(0.5+)</td></tr>
              <tr><td><b>IVF</b></td><td>k-means 셀로 나누고 nprobe개 셀만 비교</td><td>빠름 / 작음</td><td>FAISS IndexIVFFlat · IVFPQ</td></tr>
              <tr><td><b>PQ</b></td><td>벡터를 조각내 1바이트 코드로 압축</td><td>매우 빠름 / 32배 절약 (8차원 조각 기준)</td><td>1억+ 벡터 (FAISS IVFPQ)</td></tr>
            </tbody>
          </table>
          <p className="mt-1"><a href="./III-2-2.html">III-2-2 인덱싱 전략 IVF / HNSW / PQ</a>에서 각각의 동작을 그려 본다.</p>
        </div>);
      return null;
    }

    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일명 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0"><code className="block">
              {(renderedLines || code.lines).map((lineHtml, i) => {
                const hi = code.highlight && code.highlight.includes(i + 1);
                return (
                  <div key={i} className={`flex hover:bg-slate-800/50 ${hi ? 'bg-rose-500/15 border-l-2 border-rose-400' : ''}`}>
                    <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                    <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                  </div>
                );
              })}
            </code></pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인 — 4 버튼 + 키보드 + 3000ms 자동재생
    // ─────────────────────────────────────────────────────
    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
