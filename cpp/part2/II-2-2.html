    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C++ II-2-2 — Rule of 0·3·5
    학습 목표: 자원을 다루는 클래스가 지켜야 할 특수 멤버 함수 5종(소멸자·복사생성·복사대입·
              이동생성·이동대입)을 이해하고, 얕은 복사가 일으키는 이중 해제 문제를 Rule of 3/5의
              깊은 복사·이동으로 막고, 궁극적으로 RAII 타입에 위임하는 Rule of 0(권장)로 가는 길을
              6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 힙 메모리·소유권 화살표·이중 해제 시각화) / 우(VSCode CodeViewer: main.cpp)
    색상: C++ blue (#00599C 기조 / 형광펜 #cfe4f2 / 텍스트·배지 #003b66)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 특수함수 5종 → Rule of 3 → Rule of 5 → default/delete → Rule of 0 → 실무 실패
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(special/rule3/rule5/defaults/rule0/pitfall)에 따라
    //   서로 다른 소유권·메모리 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      special: {lang:"cpp", filename:"buffer.hpp — 특수 멤버 함수 5종", lines:[
        "#include <cstddef>",
        "",
        "class Buffer {",
        "    int* data;          // 직접 관리하는 자원(힙)",
        "    std::size_t n;",
        "public:",
        "    Buffer(std::size_t n) : data(new int[n]), n(n) {}",
        "",
        "    ~Buffer();                            // 1. 소멸자",
        "    Buffer(const Buffer&);                // 2. 복사 생성자",
        "    Buffer& operator=(const Buffer&);     // 3. 복사 대입",
        "    Buffer(Buffer&&) noexcept;            // 4. 이동 생성자",
        "    Buffer& operator=(Buffer&&) noexcept; // 5. 이동 대입",
        "};",
        "// 이 5개가 \"특수 멤버 함수\" — 자원을 쥐면 서로 얽힌다",
      ]},
      rule3: {lang:"cpp", filename:"buffer.hpp — Rule of 3 (깊은 복사)", lines:[
        "#include <cstddef>",
        "#include <algorithm>",
        "",
        "class Buffer {",
        "    int* data;",
        "    std::size_t n;",
        "public:",
        "    Buffer(std::size_t n) : data(new int[n]), n(n) {}",
        "",
        "    ~Buffer() { delete[] data; }          // 자원 해제",
        "",
        "    // 깊은 복사: 새 버퍼를 할당해 내용을 옮긴다",
        "    Buffer(const Buffer& o) : data(new int[o.n]), n(o.n) {",
        "        std::copy(o.data, o.data + n, data);",
        "    }",
        "    Buffer& operator=(const Buffer& o) {",
        "        if (this == &o) return *this;     // 자기 대입 방어",
        "        delete[] data;                    // 기존 자원 해제",
        "        n = o.n; data = new int[n];",
        "        std::copy(o.data, o.data + n, data);",
        "        return *this;",
        "    }",
        "};",
        "// 소멸자 + 복사생성 + 복사대입 = 한 세트 (Rule of 3)",
      ]},
      rule5: {lang:"cpp", filename:"buffer.hpp — Rule of 5 (이동 추가)", lines:[
        "#include <cstddef>",
        "#include <algorithm>",
        "",
        "class Buffer {",
        "    int* data; std::size_t n;",
        "public:",
        "    Buffer(std::size_t n) : data(new int[n]), n(n) {}",
        "    ~Buffer() { delete[] data; }",
        "    Buffer(const Buffer& o);              // (복사 생성)",
        "    Buffer& operator=(const Buffer& o);   // (복사 대입)",
        "",
        "    // 이동 생성자 — 소유권만 훔치고 원본은 비운다",
        "    Buffer(Buffer&& o) noexcept : data(o.data), n(o.n) {",
        "        o.data = nullptr; o.n = 0;        // 원본 무효화",
        "    }",
        "    // 이동 대입",
        "    Buffer& operator=(Buffer&& o) noexcept {",
        "        if (this == &o) return *this;",
        "        delete[] data;                    // 내 자원 먼저 해제",
        "        data = o.data; n = o.n;",
        "        o.data = nullptr; o.n = 0;        // 원본 비우기",
        "        return *this;",
        "    }",
        "};",
        "// 복사(2) + 이동(2) + 소멸자(1) = 5 (Rule of 5)",
      ]},
      defaults: {lang:"cpp", filename:"widget.hpp — default / delete", lines:[
        "#include <string>",
        "",
        "class Widget {",
        "    std::string name;",
        "public:",

    const S2 = { title:"Step 2. Rule of 3 — 소멸자를 만들면 복사도 만들어라", desc:"핵심 통찰은 이것이다: \"소멸자에서 delete를 해야 할 만큼 자원을 직접 관리한다면, 복사 생성자와 복사 대입도 반드시 직접 정의해야 한다.\" 왜냐하면 컴파일러의 기본 복사는 포인터 값(주소)만 베끼는 얕은 복사이기 때문이다. Buffer b = a; 를 하면 a.data와 b.data가 똑같은 힙 주소를 가리키고, 함수가 끝나 두 객체가 소멸할 때 소멸자가 같은 주소를 두 번 delete[] 한다 — 이것이 이중 해제(double free)이며 미정의 동작(UB)이다. 해결은 복사 생성자에서 새 버퍼를 할당해 내용을 복사하는 깊은 복사를 구현하는 것이다. 복사 대입도 마찬가지로 기존 자원을 해제하고 새로 할당해 복사하되, 자기 자신에게 대입하는 경우(this == &o)를 먼저 방어해야 한다. 이렇게 소멸자·복사 생성자·복사 대입 셋을 한 세트로 정의하는 것이 Rule of 3다." };
    const S3 = { title:"Step 3. Rule of 5 — 이동까지 더해 5개", desc:"Rule of 3에 이동 생성자와 이동 대입을 더하면 Rule of 5다. 이동이 왜 필요한가? 임시 객체나 std::move로 표시된 객체는 \"곧 사라질 것\"이므로, 굳이 힙을 새로 할당해 내용을 복사(깊은 복사)할 필요가 없다. 대신 원본의 포인터를 그대로 훔쳐 오고(data = o.data) 원본은 nullptr로 비워 두면(o.data = nullptr), 할당도 복사도 없이 소유권만 넘어가 훨씬 빠르다. 원본을 비우는 이유가 중요하다 — 비우지 않으면 원본이 소멸할 때 이미 넘겨 준 버퍼를 또 delete 해서 다시 이중 해제가 나기 때문이다. 이동 함수에는 noexcept를 붙이는 것이 실무 관례인데, std::vector 같은 컨테이너가 재할당 시 \"이동이 예외를 안 던진다\"는 보장이 있어야 복사 대신 이동을 선택해 성능을 살리기 때문이다. 정리하면 Rule of 5 = 복사 2개 + 이동 2개 + 소멸자 1개를 한 세트로 관리하는 것이다." };
    const S4 = { title:"Step 4. = default 와 = delete — 의도를 코드로 말하기", desc:"특수 멤버 함수를 \"직접 구현\" 하지 않고도, 컴파일러에게 명확히 지시하는 두 키워드가 있다. = default는 \"기본 구현을 그대로 써라\"는 뜻으로, 함수를 선언만 하고 몸통은 컴파일러에게 맡긴다 — 문서화 효과가 있고, 다른 특수 함수를 정의하느라 자동 생성이 막힌 경우 이를 되살린다. 이 되살리기가 실무에서 자주 걸린다: 소멸자를 직접 정의하면 컴파일러는 이동 연산을 자동 생성하지 않으므로, 이동이 필요하면 Buffer(Buffer&&) = default; 처럼 명시해 줘야 한다(안 그러면 조용히 복사로 폴백해 느려진다). 반대로 = delete는 \"이 연산을 아예 막아라\"는 뜻으로, 호출하면 컴파일 에러가 난다 — std::unique_ptr가 복사를 delete해서 \"소유권은 하나뿐\"을 강제하는 것이 대표 예다. 복사를 막고 이동만 허용하면 \"이동만 가능한(move-only)\" 타입이 되고, 이는 소유권을 명확히 표현하는 강력한 도구다." };

        alert:{ tone:'danger', text:'가장 흔한 사고다. 소멸자에서 delete 를 쓰는 순간 복사 두 개도 함께 챙겨야 한다.' },

               changes:[{mark:'changed', text:'a.p 와 b.p 가 같은 주소'},

               caption:'char* 를 unique_ptr<char[]> 로 바꾸면 해제·이동이 그 타입 안으로 들어간다. 손으로 쓸 코드가 없다.',
               changes:[{mark:'new', text:'std::unique_ptr<char[]> p'},
                        {mark:'gone', text:'직접 구현할 5종 보일러플레이트'}] },
        actor:'✅ unique_ptr 로 교체 — Rule of 0',
        stage:'pitfall',
        stageLabel:'4대 실패 사례와 수정',

        alert:{ tone:'warn', text:'Rule of 0 으로 갈 수 있는데 5종을 손으로 구현하면 유지보수할 코드와 버그 표면만 늘어난다.' },

      { ...S6,
        beat:{ label:'소멸자를 안 쓰니 이동도 산다', at:'main.cpp L15–16',

               changes:[{mark:'new', text:'이동 연산 자동 생성 유지'},
                        {mark:'gone', text:'복사로 폴백하는 성능 저하'}] },
        actor:'✅ 특수 함수 0개 — 이동 유지',
        stage:'pitfall',
        stageLabel:'4대 실패 사례와 수정',
        pitfalls:PITFALLS,
        alert:{ tone:'warn', text:'소멸자를 직접 정의하는 순간 이동 자동 생성이 멈춘다. 정의하지 않는 것이 가장 확실한 예방이다.' },

      { ...S6,
        beat:{ label:'쓰는 쪽은 아무것도 안 한다', at:'main.cpp L18–21',
               caption:'GoodBuf 를 그냥 만들고 버리면 된다. 누수도 이중 해제도 코드에 나타날 자리가 없다.',
               changes:[{mark:'new', text:'GoodBuf g; — 그대로 안전'},
                        {mark:'gone', text:'수동 정리 코드'}] },
        actor:'💥 얕은 복사 · 누수 · 과잉 구현 · 이동 유실',
        stage:'pitfall',
        stageLabel:'4대 실패 사례와 수정',
        pitfalls:PITFALLS,
        alert:{ tone:'danger', text:'단 하나만 기억하면: 직접 자원을 쥐지 말고 RAII에 위임하라(Rule of 0). 정말 래퍼를 손으로 만들어야 하면 5개를 반드시 한 세트로 — 소멸자만 정의하고 복사·이동을 빼는 순간 얕은 복사가 코드를 죽인다.' },
        code:{...CODE.pitfall, highlight:[18,19,20,21]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 공통 조각 — 스택 객체 카드 / 힙 블록
    // ─────────────────────────────────────────────────────
    function ObjCard({ name, ptr, tone }) {
      const c = tone === 'bad' ? 'border-red-300' : 'border-[#00599C]';
      return (
        <div className={`rounded border-2 ${c} bg-white px-2 py-1 text-center`}>
          <div className="text-[10px] font-bold font-mono text-[#003b66]">{name}.data</div>
          <div className={`text-[9px] font-mono ${ptr === 'nullptr' ? 'text-red-600 font-bold' : 'text-slate-500'}`}>= {ptr}</div>
        </div>
      );
    }

    function HeapBlock({ addr, cells }) {
      return (
        <div className="rounded border-2 border-[#00599C] bg-[#cfe4f2] p-1.5">
          <div className="text-[8px] font-mono text-slate-500 mb-0.5 text-center">heap @ {addr}</div>
          <div className="flex gap-0.5 justify-center">
            {cells.map((c, i) => (
              <span key={i} className="font-mono text-[10px] font-bold text-[#003b66] bg-white border border-sky-200 rounded px-1">{c}</span>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 특수 멤버 함수 5종 카드
    // ─────────────────────────────────────────────────────
    function SpecialView({ functions }) {
      const TONE = { dtor: 'border-red-300', copy: 'border-sky-300', move: 'border-emerald-300' };
      const LABEL = { dtor: '소멸', copy: '복사', move: '이동' };
      return (
        <div className="space-y-1.5">
          {functions.map((f, i) => (
            <div key={i} className={`rounded-lg border-2 ${TONE[f.group]} bg-white p-2`}>
              <div className="flex items-center gap-2">
                <span className="text-[9px] font-bold text-slate-400 w-6">{i + 1}.</span>
                <span className="font-mono text-[10px] font-bold text-[#003b66] bg-[#cfe4f2] border border-sky-300 rounded px-1.5 py-0.5 whitespace-nowrap">{f.sig}</span>
                <span className="text-[11px] font-bold text-slate-700">{f.name}</span>
                <span className="ml-auto text-[8px] text-slate-400 border border-slate-200 rounded px-1">{LABEL[f.group]}</span>
              </div>
              <div className="mt-1 flex items-center justify-between text-[9px] pl-8">
                <span className="text-slate-600">{f.role}</span>
                <span className="font-mono text-slate-400">{f.trigger}</span>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — Rule of 3: 얕은 복사(이중 해제) vs 깊은 복사
    // ─────────────────────────────────────────────────────
    function Rule3View() {
      return (
        <div className="space-y-3">
          {/* 문제: 얕은 복사 */}
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">❌ 기본 복사(얕은 복사) — Buffer b = a;</div>
            <div className="flex items-center justify-center gap-2">
              <div className="space-y-1">
                <ObjCard name="a" ptr="0x9000" tone="bad" />
                <ObjCard name="b" ptr="0x9000" tone="bad" />
              </div>
              <div className="flex flex-col items-center text-red-500">
                <span className="text-lg leading-none">──▶</span>
                <span className="text-[8px]">둘 다 같은 곳</span>
              </div>
              <HeapBlock addr="0x9000" cells={['10', '20', '30']} />
            </div>
            <div className="mt-2 text-[9px] text-center text-red-700 font-bold">소멸 시 delete[] 0x9000 을 두 번 → 💥 이중 해제 (UB)</div>
          </div>
          {/* 해결: 깊은 복사 */}
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">✅ Rule of 3 — 깊은 복사</div>
            <div className="space-y-2">
              <div className="flex items-center justify-center gap-1.5">
                <ObjCard name="a" ptr="0x9000" tone="good" />
                <span className="text-[#00599C]">▶</span>
                <HeapBlock addr="0x9000" cells={['10', '20', '30']} />
              </div>
              <div className="flex items-center justify-center gap-1.5">
                <ObjCard name="b" ptr="0xA000" tone="good" />
                <span className="text-[#00599C]">▶</span>
                <HeapBlock addr="0xA000" cells={['10', '20', '30']} />
              </div>
            </div>
            <div className="mt-2 text-[9px] text-center text-[#003b66]">각자 자기 버퍼를 소유 → 각자 한 번씩 안전하게 해제</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — Rule of 5: 이동 (소유권 이전)
    // ─────────────────────────────────────────────────────
    function Rule5View({ move }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🚚 이동 — Buffer b = std::move(a);</div>
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded border border-sky-200 bg-white p-2 space-y-1.5">
                <div className="text-[9px] font-bold text-slate-500">이동 전</div>
                <ObjCard name="a" ptr={move.before.a} tone="good" />
                <div className="text-center text-[8px] text-slate-400">b: 아직 없음</div>
                <HeapBlock addr="0x9000" cells={['10', '20', '30']} />
              </div>
              <div className="rounded border-2 border-emerald-300 bg-emerald-50 p-2 space-y-1.5">
                <div className="text-[9px] font-bold text-emerald-700">이동 후</div>
                <ObjCard name="a" ptr={move.after.a} tone="bad" />
                <ObjCard name="b" ptr={move.after.b} tone="good" />
                <HeapBlock addr="0x9000" cells={['10', '20', '30']} />
              </div>
            </div>
            <div className="mt-2 text-[9px] text-center text-[#003b66]">새 할당·복사 없음 — 포인터만 넘기고 a 를 nullptr 로 비운다 (a 소멸해도 안전)</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5 text-[10px] text-slate-600">
            <span className="font-bold text-[#003b66]">Rule of 5 = </span>
            복사 생성 + 복사 대입 + 이동 생성 + 이동 대입 + 소멸자 <span className="font-mono text-[#003b66]">(2 + 2 + 1)</span> — 한 세트로 관리
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — = default / = delete 표
    // ─────────────────────────────────────────────────────
    function DefaultsView({ rows }) {
      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-2">🔧 = default / = delete 의 의미</div>
          <div className="space-y-1.5">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <span className={`font-mono rounded px-1.5 py-0.5 border w-52 text-center whitespace-nowrap overflow-hidden text-ellipsis ${r.kind === 'delete' ? 'bg-red-50 border-red-300 text-red-700' : 'bg-[#cfe4f2] border-sky-300 text-[#003b66]'}`}>{r.code}</span>
                <span className="text-slate-600 flex-1">{r.mean}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500 border-t border-sky-100 pt-2">소멸자를 직접 정의하면 이동 연산이 자동 생성되지 않는다 → 필요하면 <span className="font-mono text-[#003b66]">= default</span> 로 되살린다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — Rule of 0: RAII 멤버에 위임
    // ─────────────────────────────────────────────────────
    function Rule0View({ members }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-3">
            <div className="text-[11px] font-bold text-emerald-800 mb-2">🌿 Rule of 0 — RAII 멤버에 위임</div>
            <div className="rounded-lg border-2 border-[#00599C] bg-[#cfe4f2] p-2">
              <div className="text-[10px] font-mono font-bold text-[#003b66] mb-1.5">class Widget {'{'}</div>
              <div className="space-y-1 pl-2">
                {members.map((m, i) => (
                  <div key={i} className="flex items-center gap-2 text-[10px] flex-wrap">
                    <span className="font-mono text-[#003b66] bg-white border border-sky-200 rounded px-1.5 py-0.5">{m.decl}</span>
                    <span className="text-[9px] text-slate-600">{m.note}</span>
                  </div>
                ))}
              </div>
              <div className="text-[10px] font-mono font-bold text-[#003b66] mt-1.5">{'};'}</div>
            </div>
            <div className="mt-2 grid grid-cols-5 gap-1 text-center">
              {['소멸자', '복사생성', '복사대입', '이동생성', '이동대입'].map((k, i) => (
                <div key={i} className="rounded bg-emerald-50 border border-emerald-300 py-1">
                  <div className="text-[8px] text-slate-600">{k}</div>
                  <div className="text-[11px] font-bold text-emerald-700">자동 ✓</div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-center text-emerald-800 font-bold">직접 정의한 특수 함수: 0개 — 컴파일러가 멤버별로 올바르게 생성</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실패 사례 카드 (bad → fix)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 {p.title}</div>
              <div className="space-y-1 font-mono text-[10px]">
                <div className="flex items-center gap-2">
                  <span className="w-8 text-red-600 font-bold">❌</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through">{p.bad}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-8 text-emerald-600 font-bold">✅</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{p.fix}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-slate-500">왜: {p.why}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      special:  { icon: '🧱', label: '특수 함수 5종' },
      rule3:    { icon: '⚠️', label: 'Rule of 3' },
      rule5:    { icon: '🚚', label: 'Rule of 5' },
      defaults: { icon: '🔧', label: 'default / delete' },
      rule0:    { icon: '🌿', label: 'Rule of 0' },
      pitfall:  { icon: '💥', label: '실무 실패' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.special;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>Rule of 0·3·5 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'special' && <SpecialView functions={state.functions} />}
          {state.stage === 'rule3' && <Rule3View />}
          {state.stage === 'rule5' && <Rule5View move={state.move} />}
          {state.stage === 'defaults' && <DefaultsView rows={state.rows} />}
          {state.stage === 'rule0' && <Rule0View members={state.members} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅱ. 소유권과 수명 · II-2-2</div>
                <h1 className="text-2xl font-bold text-[#003b66]">Rule of 0·3·5</h1>
                <p className="text-sm text-[#003b66]/80">자원을 다루는 클래스가 지켜야 할 특수 멤버 함수 규칙</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                특수 멤버 함수는 소멸자·복사(2)·이동(2) 다섯이며, 자원을 직접 쥐는 순간 서로 얽힌다.
                소멸자에서 delete를 하면 복사도 정의해야 한다(<b>Rule of 3</b> — 얕은 복사 이중 해제 방지),
                여기에 이동을 더하면 소유권만 넘겨 빨라진다(<b>Rule of 5</b>, noexcept 권장).
                <span className="font-mono">= default</span>·<span className="font-mono">= delete</span> 로 자동 생성/금지를 명시하고,
                가장 좋은 길은 자원을 RAII 타입(unique_ptr·vector·string)에 위임해 특수 함수를 하나도 안 쓰는 <b>Rule of 0</b>(권장)다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rule of 0', 'Rule of 3', 'Rule of 5', '특수 멤버 함수', '소멸자', '이동 시맨틱', '얕은 복사', '깊은 복사', 'RAII', '= default', '= delete', '이중 해제'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
