  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <style id="trn-note-skin">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C++ II-1-1 — 복사·이동 시맨틱
    학습 목표: 복사(자원 복제)와 이동(자원 소유권 이전)의 차이를 자원 박스·화살표로
              대비하고, lvalue/rvalue 와 std::move 가 어떻게 이동을 촉발하는지, 왜 이동이
              대용량 vector·string 성능에 결정적인지(RVO 포함), 그리고 실무에서 무엇이
              복사 폭증·크래시를 부르는지를 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 자원 소유권 박스·화살표 애니메이션) / 우(VSCode CodeViewer: main.cpp)
    색상: C++ blue (#00599C 기조 / 형광펜 #cfe4f2 / 텍스트·배지 #003b66)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 복사 → 이동 → lvalue/rvalue·std::move → 성능/RVO → 실무 실패
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(copy/move/move-req/perf/pitfall)에 따라
    //   서로 다른 자원 소유권 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      copy: {
        lang: 'cpp',
        filename: 'main.cpp — 복사 (깊은 복사)',
        lines: [
          '#include <iostream>',
          '#include <string>',
          '',
          'int main() {',
          '    std::string a = "Hello";',
          '    std::string b = a;      // 복사 생성자: 새 버퍼 malloc + 복제',
          '',
          "    b[0] = 'J';             // b 만 수정 (독립된 버퍼)",
          "    std::cout << a << \"\\n\";  // => Hello  (원본 그대로)",
          "    std::cout << b << \"\\n\";  // => Jello",
          '',
          '    std::string c;',
          '    c = a;                  // 복사 대입: c 기존 버퍼 해제 후 복제',
          "    std::cout << c << \"\\n\";  // => Hello",
          '',
          '    // a, b, c 모두 각자의 힙 버퍼를 소유 → 3벌',
          '    return 0;',
          '}',
        ],
      },
      move: {
        lang: 'cpp',
        filename: 'main.cpp — 이동 (소유권 이전)',
        lines: [
          '#include <iostream>',
          '#include <string>',
          '#include <utility>       // std::move',
          '',
          'int main() {',
          '    std::string a = "Hello";',
          '    std::string b = std::move(a);  // 이동 생성자: 포인터만 이전',
          '',
          "    std::cout << b << \"\\n\";        // => Hello  (b 가 새 주인)",
          "    std::cout << a.size() << \"\\n\"; // => 0      (a 는 빈 상태)",
          '    // std::cout << a;             // ⚠️ 유효하나 값은 비어있음',
          '',
          '    a = "World";                   // 재대입은 안전 → 다시 사용 가능',
          "    std::cout << a << \"\\n\";        // => World",
          '    return 0;',
          '}',
        ],
      },
      valcat: {
        lang: 'cpp',
        filename: 'main.cpp — lvalue / rvalue / std::move',
        lines: [
          '#include <iostream>',
          '#include <string>',
          '#include <utility>',
          '',
          "void take(const std::string& s) { std::cout << \"복사경로(lvalue)\\n\"; }",
          "void take(std::string&& s)      { std::cout << \"이동경로(rvalue)\\n\"; }",
          '',
          'std::string makeStr() { return std::string("temp"); }',
          '',
          'int main() {',
          '    std::string a = "Hello";',
          '    take(a);              // => 복사경로  (a 는 lvalue)',
          '    take(makeStr());      // => 이동경로  (반환 임시 = rvalue)',
          '    take(std::move(a));   // => 이동경로  (move 로 캐스팅)',
          '    // 이후 a 는 이동됐을 수 있음 → 값 읽기 금지',
          '    return 0;',
          '}',
        ],
      },
      perf: {
        lang: 'cpp',
        filename: 'main.cpp — 이동 · RVO 성능',
        lines: [
          '#include <vector>',
          '#include <string>',
          '#include <utility>',
          '',
          'std::vector<int> makeBig() {',
          '    std::vector<int> v(1000000, 7);',
          '    return v;              // RVO: 복사도 이동도 생략',
          '}',

        alert: { tone: 'warn', text: '이동 생성자가 없으면 컴파일러는 조용히 복사를 쓴다 — 이동한 줄 알았는데 실은 복사다.' },
        code: { ...CODE.pitfall, highlight: [10, 11, 12, 13] },
      },
      { ...S5,
        beat: {
          label: 'Rule of Five 를 채운다',
          at: 'main.cpp — 실패와 수정 L14–17',
          caption: '소멸자를 직접 정의하면 이동 연산이 자동 생성되지 않는다 — 5종을 함께 선언한다.',
          changes: [{ mark: 'new', text: '복사·소멸까지 5종' },
                    { mark: 'changed', text: '자동 생성 규칙 복구' }],
        },
        actor: '💥 Rule of Five 위반 — 이동 자동생성 중단',
        stage: 'pitfall',
        stageLabel: '3) Rule of Five — 5종을 함께 정의',
        pitfalls: [Q1, Q3, Q4],
        alert: { tone: 'warn', text: '하나를 직접 정의하면 나머지도 함께 결정하라. = default 로 명시하는 것만으로 충분하다.' },
        code: { ...CODE.pitfall, highlight: [14, 15, 16, 17] },
      },
      { ...S5,
        beat: {
          label: '이동한 원본은 건드리지 않는다',
          at: 'main.cpp — 실패와 수정 L20–22',
          caption: 'std::move(a) 뒤의 a 는 비어 있다. 이 상태에서 값을 읽으면 빈 값을 만난다.',
          changes: [{ mark: 'gone', text: '이동 후 a 읽기 금지' },
                    { mark: 'changed', text: 'b 가 버퍼의 주인' }],
        },
        actor: '💥 이동 후 사용 — 빈 값을 읽는다',
        stage: 'pitfall',
        stageLabel: '4) 이동 후 원본 사용 — 재대입 전 금지',
        pitfalls: [Q1, Q2, Q3, Q4],
        alert: { tone: 'danger', text: '이동은 "곧 버릴 원본"에만 쓴다. 이동한 뒤에도 계속 쓸 값이라면 애초에 이동해선 안 된다.' },
        code: { ...CODE.pitfall, highlight: [20, 21, 22] },
      },
      { ...S5,
        beat: {
          label: '재대입하면 다시 안전',
          at: 'main.cpp — 실패와 수정 L23–25',
          caption: '새 값을 넣는 순간 a 는 정상 객체로 돌아온다 — 그 뒤로는 마음껏 써도 된다.',
          changes: [{ mark: 'new', text: 'a = "reset" — 새 버퍼' },
                    { mark: 'changed', text: 'a 다시 사용 가능' }],
        },
        actor: '💥 복사 폭증 · 이동 후 사용 · 이동 미구현 fallback',
        stage: 'pitfall',
        stageLabel: '4대 실패 사례와 수정',
        pitfalls: [Q1, Q2, Q3, Q4],
        alert: { tone: 'danger', text: '기억할 것: 이동은 "곧 버릴 원본"에만. 읽기 전용은 const&, 소유권 이전은 std::move. 자원 소유 클래스는 이동 생성자·대입을 명시(noexcept)로 갖춰라 — 없으면 조용히 복사로 대체돼 이득이 사라진다.' },
        code: { ...CODE.pitfall, highlight: [23, 24, 25] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 자원 박스 (변수 이름 + 힙 버퍼 + 유효 여부)
    // ─────────────────────────────────────────────────────
    function ResourceBox({ name, heap, alive, role }) {
      const empty = !alive;
      return (
        <div className={`rounded-lg border-2 p-2 min-w-[118px] ${empty ? 'border-slate-300 bg-slate-50' : 'border-[#00599C] bg-[#cfe4f2]'}`}>
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-bold font-mono text-[#003b66]">{name}</span>
            <span className={`text-[8px] px-1 rounded ${empty ? 'bg-slate-200 text-slate-500' : 'bg-[#00599C] text-white'}`}>{role}</span>
          </div>
          <div className={`text-center font-mono text-sm font-bold rounded border py-1 ${empty ? 'text-slate-400 bg-white/60 border-slate-200 line-through' : 'text-[#003b66] bg-white/70 border-sky-200'}`}>
            {heap}
          </div>
          <div className="text-[9px] text-center mt-1 text-slate-500">
            {empty ? '빈 껍데기 (valid but empty)' : '힙 버퍼 소유'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1·2 — 복사 vs 이동: 두 박스 + 화살표 애니메이션
    // ─────────────────────────────────────────────────────
    function OwnershipView({ state }) {
      const TONE = { good: 'text-emerald-700', mid: 'text-amber-700', bad: 'text-red-700' };
      const isMove = state.arrowTone === 'move';
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-3">
              {isMove ? '🚚 이동 — a 의 소유권이 b 로 넘어가고 a 는 빈다' : '📋 복사 — a 를 새 버퍼에 통째로 복제, 둘 다 유효'}
            </div>
            <div className="flex items-center justify-center gap-2">
              <ResourceBox name={state.srcName} heap={state.srcHeap} alive={state.srcAlive} role="원본" />
              <div className="flex flex-col items-center px-1">
                <span className={`text-xl leading-none trn-pulse ${isMove ? 'text-[#00599C]' : 'text-amber-600'}`}>
                  {isMove ? '🚚▶' : '⧉▶'}
                </span>
                <span className="text-[8px] font-mono text-slate-500 mt-0.5 max-w-[92px] text-center">{state.arrowLabel}</span>
              </div>
              <ResourceBox name={state.dstName} heap={state.dstHeap} alive={state.dstAlive} role="사본" />
            </div>
            <div className="mt-3 text-[9px] text-center font-mono text-slate-500">
              {isMove
                ? '버퍼는 자리 그대로 — 옮긴 건 포인터·길이 몇 바이트뿐'
                : '두 벌의 버퍼 — 힙 할당 + 전체 바이트 복사가 일어남'}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">{isMove ? '이동의 특징' : '복사의 특징'}</div>
            <div className="space-y-1">
              {state.facts.map((f, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66] w-44 text-center whitespace-nowrap overflow-hidden text-ellipsis">{f.code}</span>
                  <span className={`font-bold ${TONE[f.tone]}`}>{f.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — lvalue / rvalue 판별 → 복사/이동 선택
    // ─────────────────────────────────────────────────────
    function MoveReqView({ categories }) {
      const KIND = {
        lvalue: 'bg-amber-100 text-amber-800 border-amber-300',
        rvalue: 'bg-emerald-100 text-emerald-800 border-emerald-300',
        xvalue: 'bg-sky-100 text-[#003b66] border-sky-300',
      };
      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-2">🏷️ 표현식의 값 범주가 복사/이동을 결정</div>
          <div className="space-y-1.5">
            {categories.map((c, i) => (
              <div key={i} className="rounded border-2 border-sky-100 bg-slate-50 p-2">
                <div className="flex items-center gap-2 mb-1">
                  <span className="font-mono text-[10px] font-bold text-[#003b66] flex-1 whitespace-nowrap overflow-hidden text-ellipsis">{c.expr}</span>
                  <span className={`text-[9px] px-1.5 py-0.5 rounded border font-bold ${KIND[c.kind]}`}>{c.kind}</span>
                </div>
                <div className="flex items-center gap-1.5 text-[9px]">
                  <span className="text-slate-400">▶</span>
                  <span className={`px-1.5 py-0.5 rounded font-bold ${c.picks === '이동' ? 'bg-[#00599C] text-white' : 'bg-amber-200 text-amber-800'}`}>
                    {c.picks} 선택
                  </span>
                  <span className="text-slate-600">{c.note}</span>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500">rvalue(임시)는 자동 이동 · lvalue는 std::move 로 이동 요청</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 대용량 반환 비용 막대 비교
    // ─────────────────────────────────────────────────────
    function PerfView({ perfRows }) {
      const BAR = { good: 'bg-emerald-500', bad: 'bg-red-500' };
      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-3">⚡ 100만 원소 vector 반환 — 실제 옮기는 양</div>
          <div className="space-y-3">
            {perfRows.map((r, i) => (
              <div key={i}>
                <div className="flex items-center justify-between text-[10px] mb-1">
                  <span className="font-bold text-[#003b66]">{r.label}</span>
                  <span className={`font-mono font-bold ${r.tone === 'bad' ? 'text-red-600' : 'text-emerald-700'}`}>{r.unit}</span>
                </div>
                <div className="h-4 rounded bg-slate-100 overflow-hidden border border-slate-200">
                  <div
                    className={`h-full ${BAR[r.tone]} transition-all duration-700 flex items-center`}
                    style={{ width: r.bars + '%' }}
                  >
                    <span className="text-[8px] text-white font-bold pl-1.5 whitespace-nowrap">{r.cost}</span>
                  </div>
                </div>
                <div className="text-[9px] text-slate-500 mt-0.5">{r.note}</div>
              </div>
            ))}
          </div>
          <div className="mt-3 text-[9px] text-slate-500 text-center font-mono">막대 = 실제로 옮기는 데이터 양 (작을수록 빠름)</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실패 사례 카드 (bad → fix)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 {p.title}</div>
              <div className="space-y-1 font-mono text-[10px]">
                <div className="flex items-center gap-2">
                  <span className="w-8 text-red-600 font-bold">❌</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through">{p.bad}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-8 text-emerald-600 font-bold">✅</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{p.fix}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-slate-500">왜: {p.why}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      copy:       { icon: '📋', label: '복사' },
      move:       { icon: '🚚', label: '이동' },
      'move-req': { icon: '🏷️', label: 'lvalue/rvalue' },
      perf:       { icon: '⚡', label: '성능·RVO' },
      pitfall:    { icon: '💥', label: '실무 실패' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.copy;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>복사·이동 시맨틱 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {(state.stage === 'copy' || state.stage === 'move') && <OwnershipView state={state} />}
          {state.stage === 'move-req' && <MoveReqView categories={state.categories} />}
          {state.stage === 'perf' && <PerfView perfRows={state.perfRows} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅱ. 소유권과 수명 · II-1-1</div>
                <h1 className="text-2xl font-bold text-[#003b66]">복사·이동 시맨틱</h1>
                <p className="text-sm text-[#003b66]/80">복사와 이동의 차이, 이동 시맨틱으로 불필요한 복사를 없애는 원리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                복사는 힙 자원을 통째로 깊은 복사해 원본·사본이 각자 소유하지만 매번 비싸다. 이동은 소유권(포인터)만 넘기고
                원본을 "유효하지만 빈 상태"로 두어 대용량도 상수 시간이다. rvalue(임시)는 자동으로 이동되고, lvalue는
                std::move 로 이동을 요청한다 — std::move 는 옮기지 않고 캐스팅만 한다. 값 반환은 이동·RVO 로 이미 싸니
                큰 객체도 값으로 반환하라. 위험은 복사 폭증·이동 후 원본 사용·이동 미구현 fallback(Rule of Five)에서 온다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['복사생성자', '이동생성자', '깊은복사', 'std::move', 'lvalue', 'rvalue', 'RVO', '소유권이전', 'RuleOfFive', 'noexcept'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
