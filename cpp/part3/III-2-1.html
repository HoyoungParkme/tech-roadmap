  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C++ III-2-1 — 알고리즘·이터레이터
    학습 목표: 이터레이터가 컨테이너 순회를 어떻게 추상화하는지([begin, end) 반개구간),
              이터레이터 범주(input·forward·bidirectional·random access),
              STL 알고리즘(sort·find·transform·accumulate·count_if·remove_if)이
              이터레이터 범위에 어떻게 적용되는지, 알고리즘과 컨테이너를 분리하면
              무엇이 좋아지는지, ranges(C++20), 그리고 실무 실패 사례(erase-remove·
              이터레이터 무효화·잘못된 범주·end 포함 오해)를 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 컨테이너·이터레이터·범위 애니메이션) / 우(VSCode CodeViewer: main.cpp)
    색상: C++ blue (#00599C 기조 / 형광펜 #cfe4f2 / 텍스트·배지 #003b66)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 이터레이터 순회 → 범주 → 알고리즘 → 조합/ranges → 술어·비교자 → 실무 실패
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      iter: {lang:"cpp", filename:"main.cpp — 이터레이터 순회", lines:[
        "#include <iostream>",
        "#include <vector>",
        "",
        "int main() {",
        "    std::vector<int> v{10, 20, 30, 40, 50};",
        "",
        "    // begin() → 첫 원소, end() → 마지막의 \"다음\"(past-the-end)",
        "    for (auto it = v.begin(); it != v.end(); ++it) {",
        "        std::cout << *it << \" \";   // *it: 가리키는 원소",
        "    }                              // => 10 20 30 40 50",
        "    std::cout << \"\\n\";",
        "",
        "    std::cout << v.end() - v.begin() << \"\\n\"; // => 5 (원소 수)",
        "    std::cout << (v.begin() == v.end()) << \"\\n\"; // => 0 (비어있지 않음)",
        "",
        "    // 범위 기반 for 도 내부적으로 begin()/end() 를 쓴다",
        "    for (int x : v) std::cout << x << \" \";  // => 10 20 30 40 50",
        "    return 0;",
        "}",
      ]},
      category: {lang:"cpp", filename:"main.cpp — 범주와 지원 연산", lines:[
        "#include <vector>",
        "#include <list>",
        "#include <algorithm>",
        "",
        "int main() {",
        "    std::vector<int> v{3, 1, 2};",
        "    auto it = v.begin();",
        "    it += 2;          // ✅ random access: 상수시간 점프",
        "    int x = it[-1];   // ✅ 첨자 접근도 가능",
        "",
        "    std::list<int> l{3, 1, 2};",
        "    auto lit = l.begin();",
        "    ++lit; --lit;     // ✅ bidirectional: 앞뒤 이동",
        "    // lit += 2;      // ❌ 컴파일 에러: list 는 random access 아님",
        "",
        "    std::sort(v.begin(), v.end());  // ✅ vector = random access",
        "    // std::sort(l.begin(), l.end()); // ❌ list 는 불가",
        "    l.sort();          // ✅ list 는 멤버 함수를 쓴다",
        "    return 0;",
        "}",
      ]},
      algo: {lang:"cpp", filename:"main.cpp — 대표 알고리즘 5종", lines:[
        "#include <iostream>",
        "#include <vector>",
        "#include <algorithm>   // sort, find, transform, count_if",
        "#include <numeric>     // accumulate",
        "",
        "int main() {",
        "    std::vector<int> v{30, 10, 50, 20, 40};",
        "",
        "    std::sort(v.begin(), v.end());          // 10 20 30 40 50",
        "",
        "    auto it = std::find(v.begin(), v.end(), 50);",
        "    if (it != v.end())                      // 찾음 → 위치 사용",
        "        std::cout << \"idx \" << it - v.begin() << \"\\n\"; // => idx 4",
        "",
        "    std::vector<int> doubled(v.size());",
        "    std::transform(v.begin(), v.end(), doubled.begin(),",
        "                   [](int x){ return x * 2; });  // 20 40 60 80 100",
        "",
        "    int sum = std::accumulate(v.begin(), v.end(), 0); // => 150",
        "    int big = std::count_if(v.begin(), v.end(),",
        "                            [](int x){ return x > 25; }); // => 3",
        "    std::cout << sum << \" \" << big << \"\\n\";",
        "    return 0;",

    const S1 = { title:"Step 1. 이터레이터 — [begin, end) 반개구간 순회", desc:"이터레이터는 \"컨테이너의 한 원소를 가리키는, 포인터처럼 생긴 물건\"이다. c.begin() 은 첫 원소를, c.end() 는 마지막 원소의 \"바로 다음\"(past-the-end)을 가리킨다 — end 는 실제 원소가 아니라 \"여기서 멈춰라\"는 경계 표시다. 그래서 범위는 항상 반개구간 [begin, end) 로 표현되고, 순회는 while (it != end) { ...; ++it; } 처럼 end 와 같아지면 끝난다. 이 규칙이 좋은 이유는 빈 컨테이너를 begin == end 하나로 자연스럽게 표현하고, 원소 개수가 정확히 end - begin 이 되며, end 를 절대 역참조하지 않는다는 계약을 코드 전체가 공유하기 때문이다." };
    const S2 = { title:"Step 2. 이터레이터 범주 — 무엇을 할 수 있나", desc:"모든 이터레이터가 똑같지 않다. 컨테이너 구조에 따라 \"지원하는 연산\"이 다르고, 그 능력에 따라 5가지 범주로 나뉜다. input 은 한 번 읽으며 앞으로만 가고(스트림 입력처럼 재순회 불가), forward 는 여러 번 앞으로 갈 수 있으며(forward_list), bidirectional 은 ++ 뿐 아니라 -- 로 뒤로도 간다(list·map·set), random access 는 it + n · it[k] 처럼 상수 시간에 임의 위치로 점프한다(vector·array·deque). 이 범주가 중요한 이유는 알고리즘이 요구하는 최소 범주가 정해져 있기 때문이다 — 예컨대 std::sort 는 random access 를 요구해서 std::list 에는 못 쓰고(대신 list::sort 멤버를 쓴다), std::find 는 input 만 있으면 된다. 범주를 알면 \"이 알고리즘이 이 컨테이너에 되는지\"를 컴파일 전에 판단할 수 있다." };
    const S3 = { title:"Step 3. STL 알고리즘 — 범위에 적용하는 함수들", desc:"STL 알고리즘은 컨테이너가 아니라 \"이터레이터 범위 [first, last)\"를 받아 동작하는 자유 함수다. sort(b, e) 는 범위를 정렬하고, find(b, e, val) 은 값을 찾아 그 위치 이터레이터(없으면 end)를 돌려주며, transform(b, e, out, f) 은 각 원소에 f 를 적용해 결과를 out 에 쓰고, accumulate(b, e, init) 은 합·곱 같은 누적을 만든다. count_if(b, e, pred) 는 술어가 참인 원소 수를 센다. 직접 for 루프를 도는 대신 이 이름들을 쓰면 \"무엇을 하는지\"가 코드에 드러나고(sort/find/count 라는 의도), off-by-one 같은 루프 버그가 사라지며, 표준 구현의 최적화를 공짜로 얻는다. 실무에서는 \"루프를 짜기 전에 이 동작에 맞는 알고리즘이 이미 있는지\" 먼저 떠올리는 게 습관이다." };
    const S4 = { title:"Step 4. 조합 — 알고리즘과 컨테이너의 분리 (ranges)", desc:"이터레이터의 진짜 힘은 \"알고리즘을 컨테이너로부터 떼어놓는\" 데 있다. std::find 는 vector 인지 list 인지 array 인지 전혀 모른다 — 오직 \"[first, last) 범위와 == 비교\"만 안다. 그래서 알고리즘 M개와 컨테이너 N개가 있어도 M×N 개를 각각 구현할 필요 없이, 이터레이터라는 얇은 계약 하나로 M+N 만에 조합된다. 이것이 STL 설계의 핵심이다. C++20 ranges 는 여기서 한 걸음 더 나아가 begin/end 쌍 대신 \"범위 객체\"를 직접 넘기고(std::ranges::sort(v)), views 로 필터·변환을 지연 평가 파이프라인(v | filter | transform)으로 조합한다 — 중간 컨테이너를 만들지 않아 간결하고 종종 더 빠르다. 실무 감각: 새 코드는 begin()/end() 대신 ranges 버전을 먼저 고려하되, 팀의 컴파일러가 C++20 을 지원하는지부터 확인한다." };
    const S5 = { title:"Step 5. 술어·비교자 — 람다로 규칙을 주입", desc:"알고리즘의 \"무엇을 기준으로\"는 대개 마지막 인자로 넘기는 함수(술어 predicate / 비교자 comparator)가 결정한다. sort 는 기본이 오름차순이지만, 세 번째 인자로 비교자를 주면 정렬 기준을 바꾼다 — [](auto& a, auto& b){ return a.age < b.age; } 처럼 \"무엇이 앞서는가\"를 반환하는 이항 술어다. find_if · count_if · remove_if · all_of 같은 _if 계열은 단항 술어(원소 하나를 받아 bool 반환)를 받아 \"조건에 맞는 것\"을 처리한다. 이 규칙을 람다로 주면 알고리즘 본체는 그대로 두고 정책만 바꿔 끼울 수 있어, 정렬·검색 로직을 매번 새로 짜지 않는다. 주의점: 비교자는 반드시 strict weak ordering(a<b 와 b<a 가 동시에 참이면 안 됨)을 지켜야 하고, 이를 어기면 sort 가 정의되지 않은 동작으로 크래시할 수 있다 — <= 를 쓰는 흔한 실수를 조심하라." };
    const S6 = { title:"Step 6. 실무 실패 사례 — 무엇이 코드를 죽이나", desc:"이터레이터·알고리즘의 함정은 대부분 \"범위가 이미 무효가 됐는데 계속 쓸 때\" 생긴다. (1) erase-remove 관용구: std::remove 는 원소를 실제로 지우지 않는다 — 지울 것을 뒤로 밀고 \"새로운 논리적 끝\" 이터레이터만 돌려준다. 그래서 반드시 v.erase(remove(...), v.end()) 로 꼬리를 잘라내야 실제로 크기가 준다. remove 만 하면 크기는 그대로고 뒤에 쓰레기 값이 남는다. (2) 이터레이터 무효화: vector 에 push_back 하다 재할당이 일어나면 이전 이터레이터·포인터·참조가 전부 무효가 되고, erase 는 지운 지점 이후를 무효화한다 — 순회 중 삽입/삭제는 반환된 새 이터레이터로 갱신해야 한다. (3) 잘못된 범주: std::sort 를 list 에 쓰면 컴파일 에러, 되더라도 성능이 엉망일 수 있다. (4) end 포함 오해: [begin, end) 는 반개구간이라 end 를 역참조하거나 범위에 포함시키면 미정의 동작이다. 핵심: 알고리즘이 돌려준 이터레이터가 \"무엇을 가리키는지\"를 문서로 확인하고, 컨테이너를 바꾼 순간 이전 이터레이터를 버려라." };

    // ─────────────────────────────────────────────────────
    // Step 1 — 이터레이터: [begin, end) 반개구간 + 순회 커서 애니메이션
    // ─────────────────────────────────────────────────────
    function IteratorView({ data }) {
      const [cursor, setCursor] = useState(0); // 0..data.length (마지막 = end 위치)
      useEffect(() => {
        const id = setInterval(() => {
          setCursor((c) => (c + 1) % (data.length + 1));
        }, 700);
        return () => clearInterval(id);
      }, [data.length]);
      const atEnd = cursor === data.length;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-3">🧭 순회 커서가 begin 에서 end 까지 (end 는 역참조 금지)</div>
            <div className="flex items-end gap-1.5 justify-center">
              {data.map((val, i) => (
                <div key={i} className="flex flex-col items-center">
                  <span className={`text-[9px] font-mono h-4 ${cursor === i ? 'text-[#00599C] font-bold' : 'text-transparent'}`}>▼it</span>
                  <div className={`w-11 h-11 flex items-center justify-center rounded border-2 font-mono text-sm font-bold transition ${cursor === i ? 'border-[#00599C] bg-[#cfe4f2] text-[#003b66] scale-110' : 'border-sky-300 bg-white text-[#003b66]'}`}>
                    {val}
                  </div>
                  <span className="text-[8px] font-mono text-slate-400 mt-0.5">[{i}]</span>
                </div>
              ))}
              {/* past-the-end 경계 */}
              <div className="flex flex-col items-center">
                <span className={`text-[9px] font-mono h-4 ${atEnd ? 'text-red-600 font-bold' : 'text-transparent'}`}>▼it</span>
                <div className={`w-11 h-11 flex items-center justify-center rounded border-2 border-dashed font-mono text-[9px] transition ${atEnd ? 'border-red-500 bg-red-50 text-red-600 scale-110' : 'border-slate-300 bg-white text-slate-400'}`}>
                  end
                </div>
                <span className="text-[8px] font-mono text-slate-400 mt-0.5">past</span>
              </div>
            </div>
            <div className="mt-3 flex items-center justify-between text-[10px] font-mono">
              <span className="text-[#00599C]">begin() ─ 첫 원소</span>
              <span className="px-2 py-0.5 rounded bg-[#cfe4f2] border border-sky-300 text-[#003b66]">
                {atEnd ? 'it == end() → 순회 종료' : `*it == ${data[cursor]}`}
              </span>
              <span className="text-red-500">end() ─ 경계 (past)</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">반개구간 [begin, end) 이 주는 것</div>
            <div className="space-y-1 text-[10px]">
              {[
                ['원소 수 = end - begin', `${data.length} 개`],
                ['빈 컨테이너 = (begin == end)', '경계 하나로 표현'],
                ['end 는 역참조 금지', '실제 원소가 아님'],
              ].map(([k, val], i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="font-mono rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66] w-52">{k}</span>
                  <span className="font-bold text-emerald-700">{val}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function AlgorithmView({ source, algos }) {
      const TONE = { good: 'bg-emerald-50 border-emerald-300', mid: 'bg-amber-50 border-amber-300' };
      const renderResult = (r) => {
        if (Array.isArray(r)) {
          return (
            <div className="flex gap-1">
              {r.map((x, i) => (
                <span key={i} className="w-7 h-7 flex items-center justify-center rounded border border-sky-300 bg-[#cfe4f2] text-[#003b66] font-mono text-[10px] font-bold">{x}</span>
              ))}
            </div>
          );
        }
        return <span className="font-mono text-[11px] font-bold text-[#003b66]">{r}</span>;
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">⚙️ 원본 범위 [begin, end)</div>
            <div className="flex gap-1 justify-center">
              {source.map((x, i) => (
                <span key={i} className="w-8 h-8 flex items-center justify-center rounded border-2 border-sky-300 bg-white text-[#003b66] font-mono text-xs font-bold">{x}</span>
              ))}
            </div>
          </div>
          <div className="space-y-1.5">

                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[#00599C] text-xs">→</span>
                  {renderResult(a.result)}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

              <div className="flex flex-col gap-1">
                {algoList.map((a) => (
                  <span key={a} className="font-mono rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66] text-center">{a}</span>
                ))}
              </div>
              <div className="flex flex-col items-center text-[#00599C] px-1">
                <span className="text-[9px] font-mono">begin()</span>
                <span className="text-lg leading-none">⇄</span>
                <span className="text-[9px] font-mono">end()</span>
                <span className="text-[8px] text-slate-500 mt-0.5">이터레이터</span>
              </div>
              <div className="flex flex-col gap-1">
                {contList.map((c) => (
                  <span key={c} className="font-mono rounded bg-white border border-sky-300 px-1.5 py-0.5 text-[#003b66] text-center">{c}</span>
                ))}
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">M개 × N개를 각각 구현? ❌ → 이터레이터 계약 하나로 M+N 만에 조합 ✔</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">C++20 views — 지연 평가 파이프라인</div>
            <div className="flex items-center gap-1 flex-wrap">
              {pipeline.map((p, i) => (
                <React.Fragment key={i}>
                  <div className={`rounded border px-2 py-1 text-[10px] font-mono ${p.kind === 'src' ? 'bg-white border-sky-300 text-[#003b66]' : 'bg-[#cfe4f2] border-[#00599C] text-[#003b66]'}`}>
                    <div className="font-bold">{p.stage}</div>
                    {p.out && <div className="text-[9px] text-emerald-700">→ {p.out}</div>}
                  </div>
                  {i < pipeline.length - 1 && <span className="text-[#00599C] font-bold">|</span>}
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500">중간 컨테이너를 만들지 않고, 실제로 훑을 때 한 번에 계산된다</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 술어·비교자: 같은 데이터 다른 규칙
    // ─────────────────────────────────────────────────────
    function PredicateView({ people, predRows }) {
      const TONE = { good: 'bg-emerald-50 border-emerald-300', mid: 'bg-amber-50 border-amber-300' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🎯 원본 데이터 (Person)</div>
            <div className="flex gap-2 justify-center">
              {people.map((p, i) => (
                <div key={i} className="rounded border-2 border-sky-300 bg-white px-2.5 py-1.5 text-center">
                  <div className="font-mono text-[11px] font-bold text-[#003b66]">{p.name}</div>
                  <div className="text-[10px] text-slate-500">age {p.age}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="space-y-1.5">
            {predRows.map((r, i) => (
              <div key={i} className={`rounded border-2 p-2 ${TONE[r.tone]}`}>
                <div className="flex items-center justify-between gap-2 mb-1">
                  <span className="font-mono text-[10px] font-bold text-[#003b66]">{r.call}</span>
                  <span className="text-[9px] text-slate-500">{r.note}</span>
                </div>
                <div className="text-[10px] text-slate-700 font-mono">→ {r.effect}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실패 사례 카드 (bad → fix)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 {p.title}</div>
              <div className="space-y-1 font-mono text-[10px]">
                <div className="flex items-start gap-2">
                  <span className="w-6 text-red-600 font-bold shrink-0">❌</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through break-all">{p.bad}</span>
                </div>
                <div className="flex items-start gap-2">
                  <span className="w-6 text-emerald-600 font-bold shrink-0">✅</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700 break-all">{p.fix}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-slate-500">왜: {p.why}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      iterator:  { icon: '🧭', label: '이터레이터' },
      category:  { icon: '📊', label: '이터레이터 범주' },
      algorithm: { icon: '⚙️', label: 'STL 알고리즘' },
      compose:   { icon: '🔗', label: '조합·ranges' },
      predicate: { icon: '🎯', label: '술어·비교자' },
      pitfall:   { icon: '💥', label: '실무 실패' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.iterator;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>알고리즘·이터레이터 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'iterator' && <IteratorView data={state.data} />}
          {state.stage === 'category' && <CategoryView categories={state.categories} />}
          {state.stage === 'algorithm' && <AlgorithmView source={state.source} algos={state.algos} />}
          {state.stage === 'compose' && <ComposeView algoList={state.algoList} contList={state.contList} pipeline={state.pipeline} />}
          {state.stage === 'predicate' && <PredicateView people={state.people} predRows={state.predRows} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅲ. 템플릿과 STL · III-2-1</div>
                <h1 className="text-2xl font-bold text-[#003b66]">알고리즘·이터레이터</h1>
                <p className="text-sm text-[#003b66]/80">이터레이터로 컨테이너를 추상화하고 STL 알고리즘을 조합하기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                이터레이터는 컨테이너 순회를 [begin, end) 반개구간으로 추상화하고(end 는 경계, 역참조 금지),
                능력에 따라 input·forward·bidirectional·random access 범주로 나뉜다. STL 알고리즘(sort·find·transform·
                accumulate·count_if·remove_if)은 컨테이너가 아니라 이터레이터 범위를 받으므로, 알고리즘과 컨테이너가
                분리되어 M+N 으로 조합되고 C++20 ranges 로 파이프라인까지 이어진다. 규칙은 술어·비교자(람다)로 주입하되
                비교자는 strict weak ordering(&lt; , &lt;= 금지)을 지켜야 한다. 위험은 대부분 무효화에서 온다 —
                erase-remove 관용구, 순회 중 삭제 시 반환 이터레이터 갱신, 잘못된 범주, end 포함 오해를 조심하라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['이터레이터', 'begin/end', '반개구간', 'random access', 'sort', 'find', 'transform', 'accumulate', 'count_if', 'erase-remove', 'ranges', '술어', '비교자', '무효화'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
