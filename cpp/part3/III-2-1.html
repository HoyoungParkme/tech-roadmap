    // ─────────────────────────────────────────────────────
    // Step 1 — 이터레이터: [begin, end) 반개구간 + 순회 커서 애니메이션
    // ─────────────────────────────────────────────────────
    function IteratorView({ data }) {
      const [cursor, setCursor] = useState(0); // 0..data.length (마지막 = end 위치)
      useEffect(() => {
        const id = setInterval(() => {
          setCursor((c) => (c + 1) % (data.length + 1));
        }, 700);
        return () => clearInterval(id);
      }, [data.length]);
      const atEnd = cursor === data.length;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-3">🧭 순회 커서가 begin 에서 end 까지 (end 는 역참조 금지)</div>
            <div className="flex items-end gap-1.5 justify-center">
              {data.map((val, i) => (
                <div key={i} className="flex flex-col items-center">
                  <span className={`text-[9px] font-mono h-4 ${cursor === i ? 'text-[#00599C] font-bold' : 'text-transparent'}`}>▼it</span>
                  <div className={`w-11 h-11 flex items-center justify-center rounded border-2 font-mono text-sm font-bold transition ${cursor === i ? 'border-[#00599C] bg-[#cfe4f2] text-[#003b66] scale-110' : 'border-sky-300 bg-white text-[#003b66]'}`}>
                    {val}
                  </div>
                  <span className="text-[8px] font-mono text-slate-400 mt-0.5">[{i}]</span>
                </div>
              ))}
              {/* past-the-end 경계 */}
              <div className="flex flex-col items-center">
                <span className={`text-[9px] font-mono h-4 ${atEnd ? 'text-red-600 font-bold' : 'text-transparent'}`}>▼it</span>
                <div className={`w-11 h-11 flex items-center justify-center rounded border-2 border-dashed font-mono text-[9px] transition ${atEnd ? 'border-red-500 bg-red-50 text-red-600 scale-110' : 'border-slate-300 bg-white text-slate-400'}`}>
                  end
                </div>
                <span className="text-[8px] font-mono text-slate-400 mt-0.5">past</span>
              </div>
            </div>
            <div className="mt-3 flex items-center justify-between text-[10px] font-mono">
              <span className="text-[#00599C]">begin() ─ 첫 원소</span>
              <span className="px-2 py-0.5 rounded bg-[#cfe4f2] border border-sky-300 text-[#003b66]">
                {atEnd ? 'it == end() → 순회 종료' : `*it == ${data[cursor]}`}
              </span>
              <span className="text-red-500">end() ─ 경계 (past)</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">반개구간 [begin, end) 이 주는 것</div>
            <div className="space-y-1 text-[10px]">
              {[
                ['원소 수 = end - begin', `${data.length} 개`],
                ['빈 컨테이너 = (begin == end)', '경계 하나로 표현'],
                ['end 는 역참조 금지', '실제 원소가 아님'],
              ].map(([k, val], i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="font-mono rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66] w-52">{k}</span>
                  <span className="font-bold text-emerald-700">{val}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 이터레이터 범주 계층

    function CategoryView({ categories }) {

    // ─────────────────────────────────────────────────────

    function AlgorithmView({ source, algos }) {

            </div>
          );
        }
        return <span className="font-mono text-[11px] font-bold text-[#003b66]">{r}</span>;
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">⚙️ 원본 범위 [begin, end)</div>
            <div className="flex gap-1 justify-center">
              {source.map((x, i) => (
                <span key={i} className="w-8 h-8 flex items-center justify-center rounded border-2 border-sky-300 bg-white text-[#003b66] font-mono text-xs font-bold">{x}</span>

          <div className="space-y-1.5">
            {algos.map((a, i) => (
              <div key={i} className={`rounded border-2 p-2 ${TONE[a.tone]}`}>

                  <span className="font-mono text-[10px] font-bold text-[#003b66]">{a.name}</span>
                  <span className="text-[9px] text-slate-500">{a.note}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[#00599C] text-xs">→</span>
                  {renderResult(a.result)}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 조합: M×N 격자 + ranges 파이프라인
    // ─────────────────────────────────────────────────────
    function ComposeView({ algoList, contList, pipeline }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🔗 이터레이터 = 알고리즘 × 컨테이너 접착제</div>
            <div className="flex items-center gap-2 text-[10px]">
              <div className="flex flex-col gap-1">
                {algoList.map((a) => (
                  <span key={a} className="font-mono rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66] text-center">{a}</span>
                ))}
              </div>
              <div className="flex flex-col items-center text-[#00599C] px-1">
                <span className="text-[9px] font-mono">begin()</span>
                <span className="text-lg leading-none">⇄</span>
                <span className="text-[9px] font-mono">end()</span>
                <span className="text-[8px] text-slate-500 mt-0.5">이터레이터</span>
              </div>
              <div className="flex flex-col gap-1">
                {contList.map((c) => (
                  <span key={c} className="font-mono rounded bg-white border border-sky-300 px-1.5 py-0.5 text-[#003b66] text-center">{c}</span>

            <div className="mt-2 text-[9px] text-slate-500 text-center">M개 × N개를 각각 구현? ❌ → 이터레이터 계약 하나로 M+N 만에 조합 ✔</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">C++20 views — 지연 평가 파이프라인</div>

                <React.Fragment key={i}>

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      iterator:  { icon: '🧭', label: '이터레이터' },
      category:  { icon: '📊', label: '이터레이터 범주' },
      algorithm: { icon: '⚙️', label: 'STL 알고리즘' },
      compose:   { icon: '🔗', label: '조합·ranges' },
      predicate: { icon: '🎯', label: '술어·비교자' },

    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.iterator;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>알고리즘·이터레이터 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'iterator' && <IteratorView data={state.data} />}
          {state.stage === 'category' && <CategoryView categories={state.categories} />}
          {state.stage === 'algorithm' && <AlgorithmView source={state.source} algos={state.algos} />}
          {state.stage === 'compose' && <ComposeView algoList={state.algoList} contList={state.contList} pipeline={state.pipeline} />}
          {state.stage === 'predicate' && <PredicateView people={state.people} predRows={state.predRows} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅲ. 템플릿과 STL · III-2-1</div>
                <h1 className="text-2xl font-bold text-[#003b66]">알고리즘·이터레이터</h1>
                <p className="text-sm text-[#003b66]/80">이터레이터로 컨테이너를 추상화하고 STL 알고리즘을 조합하기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                이터레이터는 컨테이너 순회를 [begin, end) 반개구간으로 추상화하고(end 는 경계, 역참조 금지),
                능력에 따라 input·forward·bidirectional·random access 범주로 나뉜다. STL 알고리즘(sort·find·transform·
                accumulate·count_if·remove_if)은 컨테이너가 아니라 이터레이터 범위를 받으므로, 알고리즘과 컨테이너가
                분리되어 M+N 으로 조합되고 C++20 ranges 로 파이프라인까지 이어진다. 규칙은 술어·비교자(람다)로 주입하되
                비교자는 strict weak ordering(&lt; , &lt;= 금지)을 지켜야 한다. 위험은 대부분 무효화에서 온다 —
                erase-remove 관용구, 순회 중 삭제 시 반환 이터레이터 갱신, 잘못된 범주, end 포함 오해를 조심하라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['이터레이터', 'begin/end', '반개구간', 'random access', 'sort', 'find', 'transform', 'accumulate', 'count_if', 'erase-remove', 'ranges', '술어', '비교자', '무효화'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
