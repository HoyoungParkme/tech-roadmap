  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

      setTimeout(focusFirst, 500);
    });

        desc: 'CMake 가 어려워지는 지점은 대부분 "옛날 방식(전역)"과 "수동 관리" 때문이다. (1) in-source 빌드: 소스 폴더에서 그냥 cmake . 를 돌리면 CMakeCache.txt·Makefile 이 소스와 뒤섞여 git 이 더러워지고 지우기도 어렵다 — 항상 -B build 로 분리한다. (2) 전역 플래그 남용: CMAKE_CXX_FLAGS 나 전역 include_directories 로 모든 타깃에 설정을 뿌리면, 어느 타깃이 무엇에 의존하는지 추적 불가능해진다 — target_* 로 그 타깃에만 붙인다. (3) 헤더 경로 수동 관리: -I 를 직접 나열하면 라이브러리가 바뀔 때마다 깨진다 — target_link_libraries 로 매달아 전이 의존성이 자동으로 따라오게 한다. (4) 의존성 수동 링크: .a/.so 파일 경로를 하드코딩하면 플랫폼마다 부서진다 — find_package/FetchContent 로 이식성 있게 가져온다. 핵심 원칙: 전역 대신 타깃, 수동 대신 선언.',
        actor: '💥 in-source · 전역 플래그 · 수동 경로 · 수동 링크',
        stage: 'pitfall',
        stageLabel: '4대 실패 사례와 수정',
        pitfalls: [
          { title: 'in-source 빌드로 소스 오염', bad: 'cmake .   # 소스 폴더에서', fix: 'cmake -B build -S .', why: '캐시·Makefile 이 소스와 뒤섞여 git 오염' },
          { title: '전역 플래그 남용', bad: 'include_directories(inc/)', fix: 'target_include_directories(app PUBLIC inc/)', why: '모든 타깃에 전파 → 의존 관계 추적 불가' },
          { title: '헤더 경로 수동 관리', bad: 'target_compile_options(app -I/usr/..)', fix: 'target_link_libraries(app PRIVATE fmt::fmt)', why: '라이브러리 변경 시마다 경로가 깨짐' },
          { title: '의존성 파일 하드코딩', bad: 'target_link_libraries(app /lib/x.a)', fix: 'find_package(x REQUIRED) # 타깃으로', why: '플랫폼마다 경로 달라 이식 불가' },
        ],
        alert: { tone: 'danger', text: '단 하나만 기억하면: "전역 대신 타깃, 수동 대신 선언". out-of-source(-B build)로 짓고, 설정은 target_* 로 그 타깃에만 붙이고, 의존성은 find_package/FetchContent 로 가져와 target_link_libraries 로 매단다.' },
        code: {
          lang: 'cmake',
          filename: 'CMakeLists.txt — 나쁜 방식 vs 좋은 방식',
          lines: [
            '# ❌ 옛날 방식: 전역 설정 — 모든 타깃에 새어나감',
            'include_directories(include)',
            'set(CMAKE_CXX_FLAGS "-I/usr/local/include")',
            'target_link_libraries(app /usr/lib/libfmt.a)  # 경로 하드코딩',
            '',
            '# ✅ 현대 방식: 타깃마다 필요한 것만 선언',
            'add_executable(app src/main.cpp)',
            'target_include_directories(app PUBLIC include)',
            'find_package(fmt REQUIRED)',
            'target_link_libraries(app PRIVATE fmt::fmt)',
            '',
            '# 그리고 빌드는 항상 out-of-source 로',
            '#   cmake -B build -S . && cmake --build build',
          ],
          highlight: [1, 2, 3, 4, 6, 7, 8, 9, 10],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 왜 CMake: 선언 1개 → 생성기 여러 개로 분기
    // ─────────────────────────────────────────────────────
    function WhyView({ source, generators }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🏗️ 하나의 선언이 플랫폼별 빌드로 갈라진다</div>
            <div className="flex items-center gap-2">
              <div className="rounded-lg border-2 border-[#00599C] bg-[#cfe4f2] px-3 py-3 text-center min-w-[110px]">
                <div className="text-2xl">📄</div>
                <div className="text-[10px] font-mono font-bold text-[#003b66] mt-1">{source}</div>
                <div className="text-[8px] text-slate-500 mt-0.5">무엇을 빌드할지</div>
              </div>
              <div className="flex flex-col items-center text-[#00599C]">
                <span className="text-lg leading-none">──▶</span>
                <span className="text-[8px] font-mono">CMake 생성</span>
              </div>
              <div className="flex-1 grid grid-cols-2 gap-1.5">
                {generators.map((g, i) => (
                  <div key={i} className="rounded border border-sky-300 bg-white px-2 py-1.5">
                    <div className="text-[10px] font-bold text-[#003b66]">{g.os}</div>
                    <div className="text-[9px] font-mono text-slate-700">{g.name}</div>
                    <div className="text-[8px] text-slate-500">{g.target}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500 font-mono text-center">CMake 자체는 컴파일러가 아니다 — 빌드 파일을 만들어내는 메타 빌드 시스템</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — CMakeLists 핵심 명령 목록
    // ─────────────────────────────────────────────────────
    function CmakeListsView({ commands }) {
      const TONE = { good: 'text-emerald-700', mid: 'text-amber-700', bad: 'text-red-700' };
      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-2">📝 CMakeLists.txt 의 핵심 명령</div>
          <div className="space-y-1.5">
            {commands.map((c, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <span className="font-mono rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66] w-52 text-center whitespace-nowrap overflow-hidden text-ellipsis">{c.cmd}</span>
                <span className={`font-bold ${TONE[c.tone]}`}>{c.role}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500">target_ 접두 명령 = "그 타깃에만" 붙는 현대 CMake 방식</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 빌드 파이프라인 (configure → generate → build)
    // ─────────────────────────────────────────────────────
    function FlowView({ pipeline }) {
      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-2">⚙️ out-of-source 빌드 파이프라인</div>
          <div className="space-y-2">
            {pipeline.map((p, i) => (
              <div key={i}>
                <div className="flex items-center gap-2 rounded border-2 border-sky-300 bg-white p-2">
                  <span className="text-lg">{p.icon}</span>
                  <div className="flex-1">
                    <div className="text-[11px] font-bold text-[#003b66]">{p.phase}</div>
                    <div className="text-[9px] font-mono text-slate-600">{p.cmd}</div>
                  </div>
                  <span className="text-[9px] text-slate-500 rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5">{p.out}</span>
                </div>
                {i < pipeline.length - 1 && (
                  <div className="text-center text-[#00599C] text-sm leading-none my-0.5">▼</div>
                )}
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500 font-mono text-center">모든 산출물은 build/ 한 곳으로 — 정리는 build/ 삭제 한 번</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 의존성 타깃 그래프 + 빌드 타입
    // ─────────────────────────────────────────────────────
    function TargetsView({ graph, buildTypes }) {
      const KIND = {
        local:    { label: 'add_library', color: 'bg-[#cfe4f2] border-[#00599C] text-[#003b66]' },
        external: { label: 'find_package', color: 'bg-emerald-50 border-emerald-300 text-emerald-800' },
        fetched:  { label: 'FetchContent', color: 'bg-amber-50 border-amber-300 text-amber-800' },
      };
      const TONE = { good: 'bg-emerald-50 border-emerald-300', mid: 'bg-amber-50 border-amber-300' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🔗 타깃 의존성 그래프 — {graph.root} 이 링크하는 것</div>
            <div className="flex items-center gap-3">
              <div className="rounded-lg border-2 border-[#00599C] bg-[#cfe4f2] px-3 py-2 text-center">
                <div className="text-[11px] font-mono font-bold text-[#003b66]">🎯 {graph.root}</div>
                <div className="text-[8px] text-slate-500">실행파일 타깃</div>
              </div>
              <span className="text-[#00599C] text-lg">──▶</span>
              <div className="flex-1 space-y-1.5">
                {graph.deps.map((d, i) => {
                  const k = KIND[d.kind];
                  return (
                    <div key={i} className={`rounded border px-2 py-1 flex items-center justify-between ${k.color}`}>
                      <span className="text-[10px] font-mono font-bold">{d.name}</span>
                      <span className="text-[8px] font-mono opacity-80">{k.label}</span>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500 font-mono text-center">target_link_libraries 로 매달면 헤더·플래그·전이 의존성이 자동으로 따라온다</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">빌드 타입 (-DCMAKE_BUILD_TYPE)</div>
            <div className="grid grid-cols-2 gap-2">
              {buildTypes.map((b, i) => (
                <div key={i} className={`rounded border-2 p-2 ${TONE[b.tone]}`}>
                  <div className="text-[11px] font-mono font-bold text-[#003b66]">{b.type}</div>
                  <div className="text-[9px] font-mono text-slate-700">{b.flags}</div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{b.use}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실패 사례 카드 (bad → fix)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 {p.title}</div>
              <div className="space-y-1 font-mono text-[10px]">
                <div className="flex items-center gap-2">
                  <span className="w-8 text-red-600 font-bold">❌</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through">{p.bad}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-8 text-emerald-600 font-bold">✅</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{p.fix}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-slate-500">왜: {p.why}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      why:        { icon: '🏗️', label: '왜 CMake' },
      cmakelists: { icon: '📝', label: 'CMakeLists.txt' },
      flow:       { icon: '⚙️', label: '빌드 흐름' },
      targets:    { icon: '🔗', label: '의존성·타깃' },
      pitfall:    { icon: '💥', label: '실무 실패' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.why;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>빌드(CMake) — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'why' && <WhyView source={state.source} generators={state.generators} />}
          {state.stage === 'cmakelists' && <CmakeListsView commands={state.commands} />}
          {state.stage === 'flow' && <FlowView pipeline={state.pipeline} />}
          {state.stage === 'targets' && <TargetsView graph={state.graph} buildTypes={state.buildTypes} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅴ. 현장 감각 · V-1-1</div>
                <h1 className="text-2xl font-bold text-[#003b66]">빌드(CMake)</h1>
                <p className="text-sm text-[#003b66]/80">CMake로 크로스플랫폼 C++ 빌드를 선언적으로 구성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                CMake 는 컴파일러가 아니라 "무엇을 빌드할지"의 선언을 각 플랫폼의 실제 빌드 파일로 생성하는 메타 빌드 시스템이다.
                CMakeLists.txt 에 project·add_executable·add_library 로 타깃을 만들고, target_link_libraries·target_include_directories 로
                "그 타깃에만" 필요한 것을 붙인다. 빌드는 항상 out-of-source(cmake -B build → cmake --build build)로 짓는다.
                의존성은 find_package(설치된 것)·FetchContent(소스 고정)로 가져와 타깃에 매단다. 위험은 대부분 "전역·수동"에서 온다 —
                in-source 오염, 전역 플래그, 수동 헤더 경로, 하드코딩 링크를 피하고 "전역 대신 타깃, 수동 대신 선언"을 지켜라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['CMake', 'CMakeLists', '생성기', 'add_executable', 'target_link_libraries', 'out-of-source', 'find_package', 'FetchContent', '타깃기반', 'BuildType'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
