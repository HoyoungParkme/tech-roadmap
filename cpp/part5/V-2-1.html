    @media (min-width: 768px) {

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    C++ V-2-1 — 멀티스레딩 기초: mutex·atomic
    학습 목표: std::thread 로 스레드를 만들고(join/detach), 공유 상태를 여러 스레드가
              동시에 건드릴 때 왜 값이 유실되는지(레이스 컨디션), mutex(lock_guard/RAII)와
              atomic(무잠금·CAS)으로 어떻게 안전하게 만드는지, 그리고 데드락·가시성 같은
              실무 함정을 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 스레드·공유 카운터·인터리빙·락 시각화) / 우(VSCode CodeViewer: main.cpp)
    색상: C++ blue (#00599C 기조 / 형광펜 #cfe4f2 / 텍스트·배지 #003b66)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 스레드 → 레이스 → mutex/RAII → 데드락 → atomic → 고수준(cv/async/pool)
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 서로 다른 동시성 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. std::thread — 실행 흐름을 하나 더 띄운다',
        desc: 'std::thread t(fn) 는 그 자리에서 새 실행 흐름을 만들어 fn 을 지금 흐름과 "동시에" 돌린다. 여기서 반드시 짝을 맞춰야 하는 규칙이 하나 있다 — 스레드는 소멸되기 전에 join()(끝날 때까지 기다림) 또는 detach()(떼어내 독립 실행) 중 하나를 반드시 호출해야 한다. 둘 다 안 하고 thread 객체가 파괴되면 std::terminate 로 프로그램이 즉사한다. join 은 결과를 받아야 하거나 스레드가 참조하는 지역 변수가 살아 있어야 할 때 쓰고, detach 는 "던지고 잊는" 백그라운드 작업에 쓰되 detach 된 스레드가 이미 사라진 변수를 붙잡고 있으면 크래시한다. 그래서 실무 기본값은 join 이다.',
        actor: '🧵 std::thread t(work); ... t.join();',
        stage: 'thread',
        stageLabel: 'main + worker — 두 흐름이 동시에',
        threads: [
          { name: 'main', role: '메인 흐름', color: 'sky', note: 't.join() 에서 대기' },
          { name: 'worker', role: 't 가 실행', color: 'blue', note: 'work() 를 병렬 수행' },
        ],
        lifecycle: [
          { code: 'std::thread t(work);', label: '새 실행 흐름 시작 (즉시 병렬)', tone: 'good' },
          { code: 't.join();', label: '끝날 때까지 대기 — 실무 기본값', tone: 'good' },
          { code: 't.detach();', label: '떼어내 독립 실행 (던지고 잊기)', tone: 'mid' },
          { code: '// 둘 다 안 함', label: '소멸 시 std::terminate 💥', tone: 'bad' },
        ],
        alert: { tone: 'warn', text: 'thread 는 파괴 전에 반드시 join() 또는 detach(). 안 하면 std::terminate 로 즉사한다. 결과가 필요하거나 지역 변수를 참조하면 join, 순수 백그라운드면 detach — 확신 없으면 join.' },
        code: {
          lang: 'cpp',
          filename: 'main.cpp — std::thread 기본',
          lines: [
            '#include <iostream>',
            '#include <thread>',
            '',
            'void work(int id) {',
            '    std::cout << "worker " << id << " 실행\\n";',
            '}',
            '',
            'int main() {',
            '    std::thread t(work, 1);   // 새 흐름에서 work(1) 시작',
            '',
            '    std::cout << "main 은 계속 진행\\n";',
            '',
            '    t.join();                 // work 가 끝날 때까지 대기',
            '    // t.detach();            // 또는: 떼어내 백그라운드 실행',
            '',
            '    // join/detach 를 안 하고 t 가 파괴되면',
            '    // => std::terminate (프로그램 즉사)',
            '    return 0;',
            '}',
          ],
          highlight: [4, 9, 13, 16, 17],
        },
      },
      {
        title: 'Step 2. 레이스 컨디션 — 공유 카운터의 값이 새어 나간다',
        desc: '여러 스레드가 같은 변수를 동기화 없이 건드리면 결과가 조용히 틀어진다. counter++ 는 한 줄이지만 실제로는 "① 읽기 → ② +1 → ③ 쓰기" 세 단계로 쪼개지고(비원자적 읽기-수정-쓰기), 두 스레드가 이 사이를 파고들면 서로의 갱신을 덮어쓴다. 예: A가 5를 읽고, B도 5를 읽고, 둘 다 6을 쓰면 두 번 증가시켰는데 결과는 6 — 한 번이 통째로 유실된다. 두 스레드가 각각 100,000번 증가시키면 기대값은 200,000 이지만 실제로는 매 실행마다 그보다 적은, 예측 불가능한 값이 나온다. 이것이 레이스 컨디션이며, 동기화 없는 공유 가변 상태(shared mutable state)는 그 자체로 버그다.',
        actor: '⚠️ counter++ 를 두 스레드가 동시에',
        stage: 'race',
        stageLabel: '읽기-수정-쓰기 인터리빙으로 갱신 유실',
        interleave: [
          { t: 'T1', op: 'read counter', val: '5', ghost: false },
          { t: 'T2', op: 'read counter', val: '5', ghost: false },
          { t: 'T1', op: '+1 → 6, write', val: '6', ghost: false },
          { t: 'T2', op: '+1 → 6, write', val: '6', ghost: true },

              {gate.map((g, i) => (
                <React.Fragment key={i}>
                  <div className={`rounded-lg border-2 p-2 text-center min-w-[92px] ${g.status === 'in' ? 'border-emerald-400 bg-emerald-50' : 'border-amber-300 bg-amber-50'}`}>
                    <div className="font-mono text-[11px] font-bold text-[#003b66]">{g.name}</div>
                    <div className={`text-[9px] font-bold ${g.status === 'in' ? 'text-emerald-700' : 'text-amber-700'}`}>{g.status === 'in' ? '🔓 통과 중' : '⏳ 대기'}</div>
                    <div className="text-[8px] text-slate-500 mt-0.5">{g.note}</div>
                  </div>
                  {i === 0 && <span className="text-[#00599C] text-xl font-bold">🔒</span>}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">lock_guard = RAII 잠금 (자동 해제)</div>
            <div className="space-y-1 font-mono text-[10px]">
              {raii.map((r, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66] w-40">{r.code}</span>
                  <span className="text-emerald-700 font-bold text-[9px]">{r.label}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="flex gap-2">
            <div className="flex-1 rounded-lg border-2 border-emerald-300 bg-white p-2 text-center">
              <div className="text-[9px] text-slate-500">기대값</div>
              <div className="font-mono text-lg font-bold text-emerald-700">{expected}</div>
            </div>
            <div className="flex-1 rounded-lg border-2 border-emerald-300 bg-white p-2 text-center">
              <div className="text-[9px] text-slate-500">실제 (항상)</div>
              <div className="font-mono text-lg font-bold text-emerald-700">{got} ✓</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 데드락: 순환 대기 도식 + 해법
    // ─────────────────────────────────────────────────────
    function DeadlockView({ cycle, fix }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">💀 순환 대기 — 서로 상대의 락을 영원히 기다림</div>
            <div className="flex items-center justify-around">
              {cycle.map((c, i) => (
                <div key={i} className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5 text-center min-w-[120px]">
                  <div className="font-mono text-[11px] font-bold text-[#003b66]">{c.who}</div>
                  <div className="text-[9px] text-emerald-700 font-bold mt-1">🔒 쥠: {c.holds}</div>
                  <div className="text-[9px] text-red-700 font-bold">⏳ 기다림: {c.waits}</div>
                </div>
              ))}
            </div>
            <div className="text-center text-red-600 text-lg my-1">↻ 순환 → 둘 다 멈춤 (프로그램 얼어붙음)</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5 font-mono text-[10px] space-y-1.5">
            <div className="flex items-start gap-2">
              <span className="text-red-600 font-bold">❌</span>
              <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through">{fix.bad}</span>
            </div>
            <div className="flex items-start gap-2">
              <span className="text-emerald-600 font-bold">✅</span>
              <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{fix.good}</span>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — atomic: CAS 흐름 + volatile 대비
    // ─────────────────────────────────────────────────────
    function AtomicView({ cas, vsVolatile }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">⚛️ CAS — Compare-And-Swap (무잠금 재시도)</div>
            <div className="flex items-center gap-1.5">
              {cas.map((c, i) => (
                <React.Fragment key={i}>
                  <div className="flex-1 rounded-lg border-2 border-[#00599C] bg-[#cfe4f2] p-2 text-center">
                    <div className="text-[9px] font-mono font-bold text-[#003b66] uppercase">{c.step}</div>
                    <div className="text-[9px] text-slate-600 mt-0.5">{c.text}</div>
                  </div>
                  {i < cas.length - 1 && <span className="text-[#00599C] font-bold">→</span>}
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">교체 실패(그 사이 값이 바뀜)하면 다시 load 부터 재시도 → 락 없이 원자성 보장</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">C 의 volatile vs std::atomic</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-[#003b66] border-b-2 border-sky-300">
                  <th className="text-left py-1">항목</th>
                  <th className="text-left py-1 px-1">volatile</th>
                  <th className="text-left py-1 px-1">atomic</th>
                </tr>
              </thead>
              <tbody>
                {vsVolatile.map((v, i) => (
                  <tr key={i} className="border-t border-sky-100 align-top">
                    <td className="py-1 font-bold text-slate-700">{v.aspect}</td>
                    <td className="py-1 px-1 text-red-600">{v.vol}</td>
                    <td className="py-1 px-1 font-bold text-[#003b66] bg-[#cfe4f2]">{v.at}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 고수준 도구 + 함정
    // ─────────────────────────────────────────────────────
    function HighLevelView({ tools, pitfalls }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🚀 목적별 고수준 선택</div>
            <div className="space-y-1.5">
              {tools.map((t, i) => (
                <div key={i} className="rounded border-2 border-emerald-300 bg-emerald-50 p-2">
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="font-mono text-[10px] font-bold text-[#003b66]">{t.name}</span>
                    <span className="text-[9px] text-slate-600">{t.use}</span>
                  </div>
                  <div className="font-mono text-[9px] text-emerald-800 bg-white/70 rounded border border-emerald-200 px-1.5 py-0.5">{t.ex}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">실무 함정 → 수정</div>
            <div className="space-y-1 font-mono text-[10px]">
              {pitfalls.map((p, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through">{p.bad}</span>
                  <span className="text-[#00599C] font-bold">→</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{p.fix}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      thread:    { icon: '🧵', label: 'std::thread' },
      race:      { icon: '⚠️', label: '레이스 컨디션' },
      mutex:     { icon: '🔒', label: 'mutex · RAII' },
      deadlock:  { icon: '💀', label: '데드락' },
      atomic:    { icon: '⚛️', label: 'atomic' },
      highlevel: { icon: '🚀', label: '고수준 도구' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.thread;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>멀티스레딩 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'thread' && <ThreadView threads={state.threads} lifecycle={state.lifecycle} />}
          {state.stage === 'race' && <RaceView interleave={state.interleave} expected={state.expected} got={state.got} />}
          {state.stage === 'mutex' && <MutexView gate={state.gate} raii={state.raii} expected={state.expected} got={state.got} />}
          {state.stage === 'deadlock' && <DeadlockView cycle={state.cycle} fix={state.fix} />}
          {state.stage === 'atomic' && <AtomicView cas={state.cas} vsVolatile={state.vsVolatile} />}
          {state.stage === 'highlevel' && <HighLevelView tools={state.tools} pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅴ. 현장 감각 · V-2-1</div>
                <h1 className="text-2xl font-bold text-[#003b66]">멀티스레딩 기초 — mutex·atomic</h1>
                <p className="text-sm text-[#003b66]/80">std::thread와 mutex·atomic으로 안전한 동시성 프로그래밍</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                std::thread 는 파괴 전 반드시 join/detach 한다. 동기화 없는 공유 가변 상태는 읽기-수정-쓰기가 끼어들어 값이
                유실되는 레이스 컨디션이 된다. mutex 는 lock_guard/unique_lock(RAII)으로 감싸 임계 구역을 한 스레드만
                통과시키되, 락 순서가 어긋나면 데드락이니 항상 같은 순서로(또는 scoped_lock) 잡는다. 단순 카운터는 atomic 으로
                무잠금 원자화하고, C 의 volatile 은 동시성 도구가 아님을 기억한다(단 atomic 도 복합 연산은 여전히 레이스).
                고수준으로는 결과는 async/future, 대기·통지는 condition_variable, 대량 작업은 스레드 풀을 고른다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['std::thread', 'join', 'detach', '레이스컨디션', 'mutex', 'lock_guard', 'RAII', '데드락', 'atomic', 'CAS', 'volatile', 'condition_variable', 'async', 'future', '스레드풀'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
