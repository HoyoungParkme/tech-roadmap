  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔷</text></svg>" />

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    C++ V-1-2 — 성능 측정과 캐시 친화성
    학습 목표: (1) 추측 대신 chrono 로 측정하는 벤치마크 습관, (2) 메모리 계층과
              캐시 라인·지역성의 개념, (3) 연속 배치(vector)가 분산 배치(list)보다
              왜 빠른지, (4) 행 우선 순회·AoS vs SoA·false sharing 같은 데이터 배치
              기법, (5) 실무에서 성능을 죽이는 대표 실패를 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 메모리 계층·캐시 스캔 애니메이션) / 우(VSCode CodeViewer: bench.cpp)
    색상: C++ blue (#00599C 기조 / 형광펜 #cfe4f2 / 텍스트·배지 #003b66)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 측정 → 메모리 계층 → 연속 배치 → 행 우선 → SoA/false sharing → 실패
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      c1: {lang:"cpp", filename:"bench.cpp — chrono 벤치마크", lines:[
        "#include <chrono>",
        "#include <cstdio>",
        "#include <vector>",
        "",
        "using Clock = std::chrono::steady_clock;   // 단조 증가 시계",
        "",
        "long sumAll(const std::vector<int>& v) {",
        "    long s = 0;",
        "    for (int x : v) s += x;",
        "    return s;                              // 결과를 실제로 사용",
        "}",
        "",
        "int main() {",
        "    std::vector<int> data(1000000, 1);",
        "    volatile long sink = 0;                // 삭제 방지용",
        "",
        "    for (int i = 0; i < 3; ++i) sink += sumAll(data); // 워밍업",
        "",
        "    auto t0 = Clock::now();",
        "    for (int i = 0; i < 1000; ++i) sink += sumAll(data); // 반복",
        "    auto t1 = Clock::now();",
        "",
        "    auto ns = std::chrono::duration_cast<std::chrono::nanoseconds>(",
        "                  t1 - t0).count() / 1000;  // => 회당 평균 ns",
        "    std::printf(\"avg: %ld ns\\n\", ns);       // => avg: 210 ns",
        "    return 0;",
        "}",
      ]},
      c2: {lang:"cpp", filename:"bench.cpp — 캐시 라인 확인", lines:[
        "#include <cstddef>",
        "#include <new>",
        "",
        "// 하드웨어 캐시 라인 크기 (C++17)",
        "constexpr std::size_t LINE =",
        "    std::hardware_destructive_interference_size; // 보통 64",
        "",
        "// int 는 4바이트 → 라인 하나에 16개가 담긴다",
        "constexpr std::size_t INTS_PER_LINE = LINE / sizeof(int); // => 16",
        "",
        "// arr[0] 을 읽으면 arr[0..15] 가 같은 라인으로 딸려 온다.",
        "// 그래서 arr[1], arr[2] ... 는 캐시 히트 (RAM 재접근 없음)",
        "int sumLine(const int* arr) {",
        "    int s = 0;",
        "    for (std::size_t i = 0; i < INTS_PER_LINE; ++i)",
        "        s += arr[i];       // 첫 접근만 미스, 나머진 히트",
        "    return s;",
        "}",
      ]},
      c3: {lang:"cpp", filename:"bench.cpp — vector vs list 순회", lines:[
        "#include <chrono>",
        "#include <vector>",
        "#include <list>",
        "#include <cstdio>",
        "",
        "using Clock = std::chrono::steady_clock;",
        "",
        "template <class C>",
        "long timeSum(const C& c) {",
        "    auto t0 = Clock::now();",
        "    long s = 0;",
        "    for (int x : c) s += x;          // 순회하며 합산",
        "    auto t1 = Clock::now();",
        "    (void)s;",
        "    return std::chrono::duration_cast<",
        "        std::chrono::microseconds>(t1 - t0).count();",
        "}",
        "",
        "int main() {",
        "    std::vector<int> v(10000000, 1); // 연속 배치",
        "    std::list<int>   l(v.begin(), v.end()); // 분산 배치",
        "    std::printf(\"vector: %ld us\\n\", timeSum(v)); // => ~9000 us",
        "    std::printf(\"list  : %ld us\\n\", timeSum(l)); // => ~55000 us",
        "    return 0;                          // list 가 ~6배 느림",
        "}",
      ]},
      c4: {lang:"cpp", filename:"bench.cpp — 행 우선 vs 열 우선", lines:[
        "#include <vector>",
        "",
        "constexpr int N = 4096;",
        "",

    const S2 = { title:"Step 2. 메모리 계층 — CPU 는 RAM 을 통째로 못 기다린다", desc:"현대 CPU 는 연산은 눈 깜짝할 새 하지만, 데이터를 RAM 에서 가져오는 데는 상대적으로 100배 넘게 걸린다. 그래서 CPU 와 RAM 사이에 여러 층의 캐시(L1·L2·L3)를 두고, 자주 쓰는 데이터를 가까이 복사해 둔다. 위로 갈수록 빠르지만 작고(L1 은 수십 KB, RAM 은 수 GB), 아래로 갈수록 크지만 느리다. 핵심은 캐시가 데이터를 낱개가 아니라 캐시 라인(보통 64바이트, int 16개 분량) 단위로 통째로 가져온다는 점이다 — 하나를 읽으면 그 옆 이웃들이 공짜로 캐시에 딸려 온다. 원하는 데이터가 캐시에 있으면 캐시 히트(빠름), 없어서 아래층까지 내려가면 캐시 미스(느림)다. 지역성 — 방금 쓴 걸 곧 또 쓰고(시간적), 가까운 걸 함께 쓰는(공간적) — 이 캐시가 잘 맞는 조건이다." };
    const S3 = { title:"Step 3. 연속 배치가 이긴다 — vector vs list", desc:"같은 정수들을 더해도 어디에 어떻게 놓였느냐가 속도를 가른다. std::vector 는 원소들이 메모리에 한 줄로 연속해 있어서, 앞에서부터 순회하면 캐시 라인 하나에 딸려 온 이웃 16개를 연달아 히트한다 — 하드웨어 프리페처까지 \"다음 라인도 미리 가져와\" 라며 도와준다. 반대로 std::list 는 노드마다 힙 여기저기에 흩어져 있고 포인터로 연결될 뿐이라, 다음 원소로 갈 때마다 전혀 다른 주소로 점프해 매번 새 캐시 라인을 부른다(캐시 미스). 원소 하나 크기(4B)를 넘어 노드에 포인터·헤더까지 붙으니 메모리도 더 쓴다. 그래서 \"중간 삽입/삭제가 많다\"는 특별한 이유가 없다면, 실무의 기본 컨테이너는 vector 다 — 순회 성능이 흔히 몇 배 차이 난다. 빅오(둘 다 순회 O(n))만 보면 같아 보이지만, 상수와 캐시가 실제 시간을 결정한다." };
    const S4 = { title:"Step 4. 순회 순서 — 행 우선으로 훑어라", desc:"2차원 배열도 메모리에는 결국 1차원으로 펼쳐진다. C++ 의 2차원 배열과 흔한 행렬 표현은 행 우선(row-major) — 한 행이 통째로 연속하고, 그 다음 행이 이어진다. 그래서 바깥 루프가 행, 안쪽 루프가 열이면(m[i][j] 를 j 로 훑음) 메모리를 순서대로 읽어 캐시 라인을 알뜰히 쓴다. 반대로 안쪽 루프가 행이면(열 우선 순회, m[i][j] 를 i 로 훑음) 한 원소마다 한 행만큼(수 KB) 건너뛰어 매번 새 라인을 불러 캐시 미스가 폭증한다 — 결과는 같은데 몇 배씩 느려진다. 큰 행렬일수록 이 차이가 커진다. 규칙은 간단하다: 데이터가 놓인 순서대로 접근하라. 순회 순서를 메모리 레이아웃에 맞추는 것만으로, 알고리즘을 바꾸지 않고도 공짜 성능을 얻는다." };
    const S5 = { title:"Step 5. 데이터 배치 — SoA 와 false sharing", desc:"\"필요한 것만 연속으로\" 놓는 것이 캐시 친화의 다음 단계다. 파티클처럼 여러 필드를 가진 구조체를 배열로 담을 때, AoS(Array of Structs)는 {x,y,z,mass} 를 한 덩어리로 늘어놓는다 — 그런데 x 만 순회하고 싶어도 캐시 라인엔 안 쓰는 y·z·mass 가 함께 실려 라인의 절반이 낭비된다. SoA(Struct of Arrays)는 x 만 모은 배열, y 만 모은 배열로 쪼갠다 — x 를 훑으면 라인이 전부 x 라 100% 활용하고, SIMD 벡터화도 잘 붙는다. 반대편 함정이 false sharing 이다: 서로 다른 스레드가 서로 다른 변수를 고쳐도, 그 둘이 같은 64B 라인에 얹혀 있으면 한쪽이 쓸 때마다 상대의 캐시가 통째로 무효화돼 조용히 느려진다. 스레드별 데이터는 라인 경계로 떼어놓아(패딩/alignas(64)) 이 충돌을 없앤다. 요지는 하나 — 함께 쓰는 것은 붙이고, 따로 쓰는 것은 떼어라." };
    const S6 = { title:"Step 6. 실무 실패 사례 — 무엇이 성능을 죽이나", desc:"성능 문제는 대부분 \"화려한 알고리즘 부족\"이 아니라 \"기본 위생 실패\"에서 온다. (1) 측정 없이 최적화: 직감으로 안 느린 곳을 고치느라 코드만 꼬이고, 진짜 핫스팟은 그대로 남는다 — 항상 프로파일러로 먼저 찾아라. (2) list 남용: \"삽입이 빠르다\"는 말만 믿고 순회 위주 코드에 list 를 쓰면 캐시 미스로 vector 보다 몇 배 느리다. (3) 열 우선 순회: 이차원 데이터를 저장 순서와 반대로 훑어 캐시 라인을 매번 버린다. (4) false sharing: 멀티스레드 성능이 코어를 늘려도 안 오르면 인접 변수 충돌을 의심하라. 공통 처방은 같다 — 재고(측정), 연속으로 놓고(vector·SoA), 놓인 순서대로 접근하고(행 우선), 스레드 데이터는 떼어놓아라(패딩). 빅오가 같아도 상수와 캐시가 실제 시간을 정한다는 사실을 잊지 마라." };

    // ─────────────────────────────────────────────────────
    // 공통 톤 팔레트
    // ─────────────────────────────────────────────────────
    const TEXT_TONE = { good: 'text-emerald-700', mid: 'text-amber-700', bad: 'text-red-700' };

    // ─────────────────────────────────────────────────────
    // Step 1 — 벤치마크 막대 + 체크리스트
    // ─────────────────────────────────────────────────────
    function MeasureView({ bench, maxNs, checklist }) {
      const BAR = { good: 'bg-[#00599C]', mid: 'bg-amber-400', bad: 'bg-red-300' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">

              {bench.map((b, i) => (
                <div key={i}>
                  <div className="flex items-center justify-between text-[10px] mb-0.5">

                  </div>
                  <div className="h-4 rounded bg-sky-50 border border-sky-200 overflow-hidden">
                    {b.ns === null ? (
                      <div className="h-full w-full flex items-center px-2 text-[8px] text-red-400 font-mono">? ? ? — 알 수 없음</div>
                    ) : (
                      <div className={`h-full ${BAR[b.tone]} transition-all duration-700`} style={{ width: (b.ns / maxNs * 100) + '%' }} />
                    )}
                  </div>
                  <div className="text-[8px] text-slate-500 mt-0.5">{b.note}</div>
                </div>
              ))}
            </div>
          </div>

            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">신뢰할 수 있는 벤치마크 체크리스트</div>
            <div className="grid grid-cols-2 gap-1">
              {checklist.map((c, i) => (
                <div key={i} className="flex items-center gap-1.5 text-[10px]">
                  <span className="text-emerald-600 font-bold">✓</span>
                  <span className="text-slate-700">{c.text}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 메모리 계층 피라미드
    // ─────────────────────────────────────────────────────
    function HierarchyView({ levels }) {
      const TONE = { top: 'border-[#00599C] bg-[#cfe4f2]', mid: 'border-sky-300 bg-sky-50', bot: 'border-slate-300 bg-slate-50' };
      const LATBAR = { top: 'bg-emerald-400', mid: 'bg-amber-400', bot: 'bg-red-400' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🧱 메모리 계층 — 위로 갈수록 빠르고 작다</div>
            <div className="space-y-1.5">
              {levels.map((lv, i) => (
                <div key={i} className={`rounded border-2 ${TONE[lv.tone]} p-1.5`} style={{ marginLeft: (i * 10) + 'px', marginRight: (i * 10) + 'px' }}>
                  <div className="flex items-center justify-between mb-0.5">
                    <span className="text-[10px] font-bold text-[#003b66]">{lv.name}</span>
                    <span className="text-[9px] font-mono text-slate-500">{lv.size}</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <div className="flex-1 h-2 rounded bg-white/70 overflow-hidden border border-white">
                      <div className={`h-full ${LATBAR[lv.tone]}`} style={{ width: Math.min(100, lv.bar) + '%' }} />
                    </div>
                    <span className="text-[9px] font-mono text-slate-600 w-16 text-right">{lv.latency}</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">막대 = 접근 지연(길수록 느림) · RAM 은 L1 의 ~100배</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">캐시 라인 = 64바이트 (int 16개가 한 번에)</div>

              {Array.from({ length: 16 }).map((_, i) => (
                <div key={i} className={`flex-1 h-6 rounded-sm border flex items-center justify-center text-[8px] font-mono ${i === 0 ? 'bg-[#00599C] text-white border-[#00599C]' : 'bg-[#cfe4f2] text-[#003b66] border-sky-300'}`}>
                  {i}
                </div>
              ))}
            </div>
            <div className="mt-1 text-[9px] text-slate-500 text-center">arr[0](진한 칸) 하나 읽으면 arr[1..15] 가 공짜로 딸려 옴</div>
          </div>
        </div>
      );

    // ─────────────────────────────────────────────────────
    // Step 3 — 연속(vector) vs 분산(list) 캐시 스캔 애니메이션
    // ─────────────────────────────────────────────────────
    function ContiguousView() {
      const N = 12;
      const [pos, setPos] = useState(0);
      // list 노드의 흩어진 배치(주소가 뒤죽박죽) — 매 접근이 새 라인
      const scatter = React.useMemo(() => [7, 2, 11, 0, 5, 9, 3, 1, 10, 4, 8, 6], []);
      useEffect(() => {
        const id = setInterval(() => setPos((p) => (p + 1) % N), 550);
        return () => clearInterval(id);
      }, []);
      const vHits = pos + 1;                 // vector: 첫 칸만 미스, 나머지 히트
      const vMiss = Math.floor(pos / 4) + 1; // 4칸(라인)마다 새 라인 1미스
      const lMiss = pos + 1;                 // list: 매 접근 미스
      return (
        <div className="space-y-3">
          {/* vector 레인 */}
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[11px] font-bold text-[#003b66]">🟦 std::vector — 연속 배치</span>
              <span className="text-[9px] font-mono text-emerald-700">히트 {vHits - vMiss} · 미스 {vMiss}</span>
            </div>
            <div className="flex gap-0.5">
              {Array.from({ length: N }).map((_, i) => {
                const active = i === pos;
                const done = i < pos;
                const lineStart = i % 4 === 0;
                return (
                  <div key={i} className={`flex-1 h-8 rounded-sm border flex items-center justify-center text-[9px] font-mono relative
                    ${active ? 'bg-[#00599C] text-white border-[#00599C]' : done ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : 'bg-white text-slate-400 border-sky-200'}`}>
                    {i}
                    {lineStart && <span className="absolute -top-2 left-0 text-[7px] text-[#00599C]">|라인</span>}
                  </div>
                );
              })}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">4칸(라인)마다 한 번만 미스, 이웃은 히트 · 프리페처가 다음 라인 예약</div>
          </div>
          {/* list 레인 */}
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[11px] font-bold text-red-700">🟥 std::list — 힙에 분산</span>
              <span className="text-[9px] font-mono text-red-700">히트 0 · 미스 {lMiss}</span>
            </div>
            <div className="flex gap-0.5">
              {scatter.map((addr, i) => {
                const active = i === pos;
                const done = i < pos;
                return (
                  <div key={i} className={`flex-1 h-8 rounded-sm border flex flex-col items-center justify-center text-[8px] font-mono
                    ${active ? 'bg-red-500 text-white border-red-500' : done ? 'bg-red-100 text-red-600 border-red-300' : 'bg-white text-slate-400 border-red-200'}`}>
                    <span>{i}</span>
                    <span className="text-[6px] opacity-70">@{addr}</span>
                  </div>
                );
              })}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">다음 노드가 엉뚱한 주소(@) → 매 접근 새 캐시 라인 = 미스</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 행 우선 vs 열 우선 순회 애니메이션
    // ─────────────────────────────────────────────────────
    function TraversalView({ rows, cols }) {
      const total = rows * cols;
      const [k, setK] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setK((v) => (v + 1) % total), 320);
        return () => clearInterval(id);
      }, [total]);
      // 행 우선: 순서대로 인덱스, 열 우선: 열을 먼저 채움
      const rowIdx = k;
      const rC = k % cols, rR = Math.floor(k / cols);           // 행 우선 현재
      const cC = Math.floor(k / rows), cR = k % rows;            // 열 우선 현재
      const Cell = ({ r, c, curR, curC, curOrder, order, good }) => {
        const active = r === curR && c === curC;
        const done = order < curOrder;
        return (
          <div className={`h-5 rounded-sm border flex items-center justify-center text-[7px] font-mono
            ${active ? (good ? 'bg-[#00599C] text-white border-[#00599C]' : 'bg-red-500 text-white border-red-500')
              : done ? (good ? 'bg-emerald-100 border-emerald-300' : 'bg-red-100 border-red-300')
              : 'bg-white text-slate-300 border-sky-200'}`}>
          </div>
        );
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">✅ 행 우선 순회 — 저장 순서대로 (연속)</div>
            <div className="grid gap-0.5" style={{ gridTemplateColumns: `repeat(${cols}, 1fr)` }}>
              {Array.from({ length: rows }).map((_, r) =>
                Array.from({ length: cols }).map((_, c) => {
                  const order = r * cols + c;
                  return <Cell key={r + '-' + c} r={r} c={c} curR={rR} curC={rC} curOrder={rowIdx} order={order} good />;
                })
              )}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">한 행을 끝까지 → 캐시 라인 알뜰히 재사용</div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1.5">❌ 열 우선 순회 — 저장 순서 역행 (점프)</div>
            <div className="grid gap-0.5" style={{ gridTemplateColumns: `repeat(${cols}, 1fr)` }}>
              {Array.from({ length: rows }).map((_, r) =>
                Array.from({ length: cols }).map((_, c) => {
                  const order = c * rows + r; // 열 우선 방문 순서
                  return <Cell key={r + '-' + c} r={r} c={c} curR={cR} curC={cC} curOrder={k} order={order} good={false} />;
                })
              )}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">한 칸마다 한 행씩 점프 → 매번 새 라인 = 미스</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — AoS vs SoA + false sharing
    // ─────────────────────────────────────────────────────
    function LayoutView() {
      const FIELDS = ['x', 'y', 'z', 'm'];
      const FCOL = { x: 'bg-[#00599C] text-white', y: 'bg-sky-200 text-[#003b66]', z: 'bg-sky-100 text-slate-500', m: 'bg-slate-100 text-slate-400' };
      return (
        <div className="space-y-2.5">
          {/* AoS */}
          <div className="rounded-lg border-2 border-red-300 bg-white p-2.5">
            <div className="text-[10px] font-bold text-red-700 mb-1.5">❌ AoS — x 만 훑어도 y·z·m 이 라인 차지</div>
            <div className="flex gap-0.5">
              {Array.from({ length: 4 }).map((_, p) =>
                FIELDS.map((f) => (
                  <div key={p + f} className={`flex-1 h-6 rounded-sm flex items-center justify-center text-[8px] font-mono ${FCOL[f]}`}>{f}</div>
                ))
              )}
            </div>
            <div className="mt-1 text-[8px] text-slate-500">x 순회 시 라인의 3/4(y·z·m)이 낭비</div>
          </div>
          {/* SoA */}
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-2.5">
            <div className="text-[10px] font-bold text-[#003b66] mb-1.5">✅ SoA — x 만 연속 → 라인 100% 활용 + SIMD</div>
            <div className="flex gap-0.5">
              {Array.from({ length: 8 }).map((_, i) => (
                <div key={i} className="flex-1 h-6 rounded-sm bg-[#00599C] text-white flex items-center justify-center text-[8px] font-mono">x</div>
              ))}
            </div>
            <div className="mt-1 text-[8px] text-slate-500">x 배열만 순회 → 캐시 라인 전부 x, 벡터화 친화</div>
          </div>
          {/* false sharing */}
          <div className="rounded-lg border-2 border-amber-300 bg-white p-2.5">
            <div className="text-[10px] font-bold text-amber-800 mb-1.5">⚠️ false sharing — 두 스레드가 같은 64B 라인을 다툼</div>
            <div className="flex items-center gap-2">
              <div className="flex-1">
                <div className="text-[8px] text-red-600 mb-0.5">❌ 같은 라인</div>
                <div className="flex gap-0.5">
                  <div className="flex-1 h-6 rounded-sm bg-red-400 text-white flex items-center justify-center text-[8px] font-mono">a·T1</div>
                  <div className="flex-1 h-6 rounded-sm bg-red-300 text-white flex items-center justify-center text-[8px] font-mono">b·T2</div>
                </div>
              </div>
              <span className="text-slate-400 text-xs">→</span>
              <div className="flex-1">
                <div className="text-[8px] text-emerald-600 mb-0.5">✅ alignas(64) 분리</div>
                <div className="flex gap-0.5">
                  <div className="flex-1 h-6 rounded-sm bg-emerald-500 text-white flex items-center justify-center text-[8px] font-mono">a</div>
                  <div className="flex-1 h-6 rounded-sm bg-white border border-slate-200"></div>
                  <div className="flex-1 h-6 rounded-sm bg-emerald-500 text-white flex items-center justify-center text-[8px] font-mono">b</div>
                </div>
              </div>
            </div>
            <div className="mt-1 text-[8px] text-slate-500">같은 라인이면 한쪽 쓰기가 상대 캐시를 무효화 → 코어 늘려도 안 빨라짐</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실패 사례 카드 (bad → fix)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 {p.title}</div>
              <div className="space-y-1 font-mono text-[10px]">
                <div className="flex items-center gap-2">
                  <span className="w-8 text-red-600 font-bold">❌</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through">{p.bad}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-8 text-emerald-600 font-bold">✅</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{p.fix}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-slate-500">왜: {p.why}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      measure:    { icon: '⏱️', label: '측정 우선' },
      hierarchy:  { icon: '🧱', label: '메모리 계층' },
      contiguous: { icon: '🏃', label: '연속 배치' },
      traversal:  { icon: '🧭', label: '순회 순서' },
      layout:     { icon: '📦', label: '데이터 배치' },
      pitfall:    { icon: '💥', label: '실무 실패' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.measure;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>성능 · 캐시 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'measure' && <MeasureView bench={state.bench} maxNs={state.maxNs} checklist={state.checklist} />}
          {state.stage === 'hierarchy' && <HierarchyView levels={state.levels} />}
          {state.stage === 'contiguous' && <ContiguousView />}
          {state.stage === 'traversal' && <TraversalView rows={state.rows} cols={state.cols} />}
          {state.stage === 'layout' && <LayoutView />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅴ. 현장 감각 · V-1-2</div>
                <h1 className="text-2xl font-bold text-[#003b66]">성능 측정과 캐시 친화성</h1>
                <p className="text-sm text-[#003b66]/80">벤치마크로 성능을 재고, 캐시 친화적 데이터 배치로 속도를 끌어올리기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                최적화는 직감이 아니라 측정에서 시작한다 — 프로파일러로 핫스팟을 찾고 chrono(워밍업·반복·평균)로 전후를 잰다.
                CPU 와 RAM 사이 캐시는 64바이트 라인 단위로 움직이니, 데이터를 연속으로 놓고(vector·SoA) 놓인 순서대로 접근하면(행 우선)
                이웃이 공짜로 딸려 와 빨라진다. list 남용·열 우선 순회·false sharing 은 빅오가 같아도 캐시 미스로 몇 배 느려지는 대표 함정이다.
                한 줄 원칙: 함께 쓰는 것은 붙이고, 따로 쓰는 것은 떼어라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['벤치마크', 'chrono', '캐시라인', '지역성', 'L1L2L3', 'vector', 'list', '행우선', 'SoA', 'false_sharing'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
