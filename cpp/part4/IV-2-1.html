  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    C++ IV-2-1 — string_view · ranges
    학습 목표: string_view 가 원본 문자열을 복사 없이 "포인터+길이"로 가리키는 비소유 뷰라는 것,
              그 성능 이점과 댕글링 위험, 그리고 C++20 ranges 가 view 파이프라인(filter|transform|take)을
              지연 평가로 조합하는 방식을 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 버퍼 슬라이스·파이프라인 흐름 시각화) / 우(VSCode CodeViewer: main.cpp)
    색상: C++ blue (#00599C 기조 / 형광펜 #cfe4f2 / 텍스트·배지 #003b66)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오
    //   string_view 개념 → substr 복사 대비 → 수명/댕글링 →
    //   ranges 지연 파이프라인 → ranges 알고리즘+프로젝션 → 실무 실패
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. string_view — 복사 없는 문자열 뷰',
        desc: 'std::string_view 는 문자열의 내용을 소유하지 않는 "뷰"다. 내부는 딱 두 값 — 원본 문자들의 첫 글자를 가리키는 포인터와 길이(size) — 뿐이라, 어떤 길이의 문자열이든 16바이트짜리 작은 값 하나로 표현된다. 그래서 함수 인자를 const std::string& 대신 std::string_view 로 받으면, 호출자가 std::string 이든 const char* 리터럴이든 char 배열이든 복사·할당 없이 그대로 받아 읽을 수 있다. 핵심은 "읽기 전용 창문"이라는 점 — 뷰는 가리키는 문자들을 바꾸지 못하고, 그 문자들이 살아있는 동안에만 유효하다. 이 한 겹의 간접 덕분에 파싱·검색 같은 읽기 위주 코드가 메모리 할당 없이 돌아간다.',
        actor: '🔎 string_view = 포인터 + 길이 (비소유)',
        stage: 'view',
        stageLabel: 'string_view 의 내부 = ptr + size, 원본을 가리킴',
        buffer: 'Hello, Modern C++',
        viewStart: 7,
        viewLen: 6,
        viewLabel: 'sv',
        fields: [
          { name: 'data()', value: '&buf[7]', note: '원본 8번째 글자 주소' },
          { name: 'size()', value: '6', note: '가리키는 길이' },
        ],
        alert: { tone: 'info', text: 'string_view 는 문자열을 복사하지 않는다 — 포인터와 길이 두 값뿐이라 매우 가볍다. 대신 원본 문자들이 살아있는 "동안에만" 유효한 읽기 전용 창문이다.' },
        code: {
          lang: 'cpp',
          filename: 'main.cpp — string_view 기본',
          lines: [
            '#include <iostream>',
            '#include <string>',
            '#include <string_view>',
            '',
            '// const std::string& 대신 string_view — 복사·할당 없이 받는다',
            'void printLen(std::string_view sv) {',
            '    std::cout << sv << " (" << sv.size() << ")\\n";',
            '}',
            '',
            'int main() {',
            '    std::string s = "Hello, Modern C++";',
            '    std::string_view sv = s;      // 복사 아님 — s 를 가리킴',
            '',
            '    printLen(sv);                 // => Hello, Modern C++ (17)',
            '    printLen("literal");          // => literal (7)  리터럴도 그대로',
            '    printLen(s);                  // => ... string 도 그대로',
            '',
            '    std::cout << sizeof(sv) << "\\n"; // => 16  (ptr+size, 내용과 무관)',
            '    return 0;',
            '}',
          ],
          highlight: [5, 6, 11, 12, 18],
        },
      },
      {
        title: 'Step 2. substr — 복사냐 뷰냐',
        desc: 'string_view 의 성능 이점이 가장 극적으로 드러나는 곳이 부분 문자열(substr)이다. std::string::substr(pos, n) 은 잘라낸 조각을 담을 새 std::string 을 만들어 문자들을 통째로 복사한다 — 힙 할당 한 번, memcpy 한 번이 매번 일어난다. 반면 std::string_view::substr(pos, n) 은 자기 포인터를 pos 만큼 앞으로 옮기고 길이만 n 으로 줄인 또 하나의 뷰를 돌려준다 — 할당도 복사도 0이다. 그래서 큰 로그 한 줄을 토큰 수십 개로 쪼개 파싱하는 코드가, string 이면 토큰마다 할당하지만 string_view 면 원본 버퍼 위를 미끄러지기만 한다. 읽기만 하는 파싱·검색·토크나이즈에서 string_view 는 사실상 공짜 substr 을 준다.',
        actor: '✂️ string.substr = 복사 · string_view.substr = 뷰 이동',
        stage: 'substr',
        stageLabel: 'substr(7, 6) — string 은 복사, view 는 포인터 이동',
        buffer: 'Hello, Modern C++',
        viewStart: 7,

      return (
        <div className="space-y-3">
          <BufferSlice buffer={state.buffer} start={state.viewStart} len={state.viewLen} viewLabel={state.viewLabel} />
          <ViewFieldsCard fields={state.fields} />
        </div>
      );
    }

    function SubstrStage({ state }) {
      const TONE = { good: 'bg-emerald-50 border-emerald-300', bad: 'bg-red-50 border-red-300' };
      return (
        <div className="space-y-3">
          <BufferSlice buffer={state.buffer} start={state.viewStart} len={state.viewLen} viewLabel="v" />
          <div className="space-y-1.5">
            {state.rows.map((r, i) => (
              <div key={i} className={`rounded border-2 p-2 ${TONE[r.tone]}`}>
                <div className="font-mono text-[10px] font-bold text-[#003b66] mb-1">{r.sig}</div>
                <div className="flex items-center gap-1.5 text-[9px]">
                  <span className={`rounded px-1.5 py-0.5 font-bold ${r.alloc ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                    {r.alloc ? '힙 할당 + 복사 ✂️' : '할당 0 · 뷰만 이동 ✓'}
                  </span>
                  <span className="text-slate-600">{r.note}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 수명/댕글링 타임라인
    // ─────────────────────────────────────────────────────
    function LifetimeStage({ state }) {
      const TONE = { mid: 'border-amber-300 bg-amber-50', bad: 'border-red-300 bg-red-50' };
      const DOT = { mid: 'bg-amber-500', bad: 'bg-red-500' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">⏱️ 임시 문자열을 가리킨 뷰의 수명</div>
            <div className="space-y-2">
              {state.timeline.map((t, i) => (
                <div key={i} className={`rounded border-2 p-2 ${TONE[t.tone]}`}>
                  <div className="flex items-start gap-2">
                    <span className={`mt-1 w-2 h-2 rounded-full ${DOT[t.tone]} shrink-0`}></span>
                    <div>
                      <div className="font-mono text-[10px] font-bold text-[#003b66]">{t.t}</div>
                      <div className="text-[10px] text-slate-600 mt-0.5">{t.state}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-800 mb-1">✅ 수정</div>
            <div className="font-mono text-[10px] rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{state.fix}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — ranges 지연 파이프라인 흐름
    //   원소 하나가 filter → transform → take 를 통과하는 것을 시뮬레이션
    // ─────────────────────────────────────────────────────
    function PipelineStage({ state }) {
      // 지연 평가 시뮬레이션: take 개수가 찰 때까지 원소를 하나씩 흘려보낸다
      const takeN = state.pipeStages.find((s) => s.take)?.take ?? 99;
      const flow = [];
      let taken = 0;
      for (const n of state.source) {
        if (taken >= takeN) { flow.push({ n, passedFilter: null, out: null, skipped: true }); continue; }
        const passed = n % 2 === 0;
        if (!passed) { flow.push({ n, passedFilter: false, out: null }); continue; }
        const out = n * n;
        taken += 1;
        flow.push({ n, passedFilter: true, out, kept: taken });
      }
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🔗 파이프라인 정의 (지연 — 아직 계산 0)</div>
            <div className="flex items-center gap-1 flex-wrap text-[10px] font-mono">
              <span className="rounded bg-slate-100 border border-slate-300 px-1.5 py-0.5 text-slate-700">nums</span>
              {state.pipeStages.map((s, i) => (
                <React.Fragment key={i}>
                  <span className="text-[#00599C] font-bold">|</span>
                  <span className="rounded bg-[#cfe4f2] border border-[#00599C] px-1.5 py-0.5 text-[#003b66] font-bold">{s.op}<span className="text-slate-500 font-normal"> {s.label}</span></span>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-1 text-[9px] text-slate-500">각 어댑터는 원본을 감싸는 얇은 뷰 — 중간 vector 할당 0</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">순회 시 원소별 흐름 (take {takeN} 차면 단락)</div>
            <div className="space-y-1">
              {flow.map((f, i) => (
                <div key={i} className="flex items-center gap-1.5 text-[10px] font-mono">
                  <span className="w-6 text-center rounded bg-slate-100 border border-slate-300 text-slate-700">{f.n}</span>
                  <span className="text-slate-400">→</span>
                  {f.skipped ? (
                    <span className="text-slate-400 italic">take 다 참 — 계산 안 함 (단락) ✋</span>
                  ) : f.passedFilter ? (
                    <>
                      <span className="rounded bg-emerald-100 text-emerald-700 px-1 font-bold">filter ✓</span>
                      <span className="text-slate-400">→</span>
                      <span className="rounded bg-[#cfe4f2] text-[#003b66] px-1 font-bold">²={f.out}</span>
                      <span className="text-slate-400">→</span>
                      <span className="rounded bg-[#00599C] text-white px-1 font-bold">take #{f.kept}</span>
                    </>
                  ) : (
                    <span className="rounded bg-red-100 text-red-600 px-1 font-bold">filter ✗ (버림)</span>
                  )}
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-[#003b66] font-bold">결과: {flow.filter((f) => f.out != null).map((f) => f.out).join(' , ')}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — ranges::sort + 프로젝션 (정렬 전/후)
    // ─────────────────────────────────────────────────────
    function AlgoStage({ state }) {
      const sorted = [...state.people].sort((a, b) => a[state.projKey] - b[state.projKey]);
      const Row = ({ p, hi }) => (
        <div className={`flex items-center justify-between rounded border px-2 py-1 text-[10px] ${hi ? 'bg-[#cfe4f2] border-[#00599C]' : 'bg-white border-sky-200'}`}>
          <span className="font-bold text-[#003b66]">{p.name}</span>
          <span className="font-mono text-slate-600">{state.projKey} = {p[state.projKey]}</span>
        </div>
      );
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🎯 ranges::sort(people, {`{}`}, &Person::{state.projKey})</div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <div className="text-[9px] font-bold text-slate-500 mb-1">정렬 전</div>
                <div className="space-y-1">{state.people.map((p, i) => <Row key={i} p={p} />)}</div>
              </div>
              <div>
                <div className="text-[9px] font-bold text-[#00599C] mb-1">{state.projKey} 로 투영 → 오름차순</div>
                <div className="space-y-1">{sorted.map((p, i) => <Row key={i} p={p} hi />)}</div>
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">프로젝션 = "무엇을 기준으로"(<span className="font-mono">&Person::{state.projKey}</span>)를 비교 로직과 분리 → 별도 비교 람다 불필요</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실패 사례 카드 (bad → fix)
    // ─────────────────────────────────────────────────────
    function PitfallStage({ state }) {
      return (
        <div className="space-y-2">
          {state.pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 {p.title}</div>
              <div className="space-y-1 font-mono text-[10px]">
                <div className="flex items-center gap-2">
                  <span className="w-6 text-red-600 font-bold shrink-0">❌</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through break-all">{p.bad}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-6 text-emerald-600 font-bold shrink-0">✅</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700 break-all">{p.fix}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-slate-500">왜: {p.why}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      view:     { icon: '🔎', label: 'string_view' },
      substr:   { icon: '✂️', label: 'substr 대비' },
      lifetime: { icon: '💀', label: '수명·댕글링' },
      pipeline: { icon: '🔗', label: 'ranges 파이프라인' },
      algo:     { icon: '🎯', label: 'ranges 알고리즘' },
      pitfall:  { icon: '💥', label: '실무 실패' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.view;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>string_view · ranges — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'view' && <ViewStage state={state} />}
          {state.stage === 'substr' && <SubstrStage state={state} />}
          {state.stage === 'lifetime' && <LifetimeStage state={state} />}
          {state.stage === 'pipeline' && <PipelineStage state={state} />}
          {state.stage === 'algo' && <AlgoStage state={state} />}
          {state.stage === 'pitfall' && <PitfallStage state={state} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅳ. 모던 C++(17/20) · IV-2-1</div>
                <h1 className="text-2xl font-bold text-[#003b66]">string_view · ranges</h1>
                <p className="text-sm text-[#003b66]/80">복사 없는 문자열 뷰와 지연 평가 파이프라인 ranges</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                string_view 는 "포인터 + 길이"로 문자열을 복사 없이 가리키는 비소유 뷰라, const std::string&amp; 대신 받아 파싱·검색을
                할당 없이 처리하고 substr 조차 복사가 사라진다 — 단, 원본보다 오래 살면 댕글링하고 널 종료가 아니다.
                ranges 는 view 어댑터(filter·transform·take)를 <span className="font-mono">|</span> 로 이어 지연 평가 파이프라인을 만들어
                중간 컨테이너 없이 원소별로 흘리고, ranges::sort 는 범위 하나 + 프로젝션으로 의도를 드러낸다.
                공통 원칙: 뷰는 "복사본"이 아니라 원본이 살아있고 바뀌지 않는 동안만 유효한 "창문"이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['string_view', '비소유뷰', 'ptr+size', 'substr복사제거', '댕글링', '널종료아님', 'ranges', '지연평가', 'filter', 'transform', 'take', '프로젝션', 'ranges::sort'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
