    // ─────────────────────────────────────────────────────
    // Step 1 — 런타임 vs 컴파일 타임: 같은 계산의 시점 대비 애니메이션
    // ─────────────────────────────────────────────────────
    function BasicView({ runtime, compileTime }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setTick((t) => (t + 1) % 4), 700);
        return () => clearInterval(id);
      }, []);
      // 런타임: 매 프레임 계산이 "다시" 도는 느낌 (펄스). 컴파일 타임: 첫 프레임 후 상수로 고정.
      const rtPulse = tick % 2 === 0;
      const ctBaked = tick >= 1;
      return (
        <div className="space-y-3">
          {/* 런타임 트랙 */}
          <div className="rounded-lg border-2 border-amber-300 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[11px] font-bold text-amber-800">🔁 런타임 — 실행할 때마다 다시 계산</span>
              <span className="text-[9px] text-slate-500">{runtime.when}</span>
            </div>
            <div className="font-mono text-[11px] text-[#003b66] mb-2">{runtime.expr}</div>
            <div className="flex items-center gap-2">
              {[0, 1, 2].map((r) => (
                <div key={r} className="flex-1 rounded border border-amber-300 bg-amber-50 px-2 py-1.5 text-center">
                  <div className="text-[8px] text-slate-500">실행 #{r + 1}</div>
                  <div className={`font-mono text-[11px] font-bold ${rtPulse ? 'text-amber-700' : 'text-slate-400'}`}>
                    {rtPulse ? runtime.calc : '···'}
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-amber-700 font-bold">{runtime.cost} · CPU 가 매번 곱셈 수행</div>
          </div>
          {/* 컴파일 타임 트랙 */}
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[11px] font-bold text-[#003b66]">🏗️ 컴파일 타임 — 빌드 때 1회, 상수로 박힘</span>
              <span className="text-[9px] text-slate-500">{compileTime.when}</span>
            </div>
            <div className="font-mono text-[11px] text-[#003b66] mb-2">{compileTime.expr}</div>
            <div className="flex items-center gap-2">
              <div className="rounded border border-[#00599C] bg-[#cfe4f2] px-2 py-1.5 text-center">
                <div className="text-[8px] text-slate-500">빌드 1회</div>
                <div className="font-mono text-[11px] font-bold text-[#003b66]">12 * 12</div>
              </div>
              <span className="text-[#00599C] text-lg">▶</span>
              {[0, 1, 2].map((r) => (
                <div key={r} className="flex-1 rounded border border-[#00599C] bg-[#cfe4f2] px-2 py-1.5 text-center">
                  <div className="text-[8px] text-slate-500">실행 #{r + 1}</div>
                  <div className={`font-mono text-[11px] font-bold text-[#003b66] transition ${ctBaked ? 'opacity-100' : 'opacity-30'}`}>
                    {compileTime.calc}
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-emerald-700 font-bold">{compileTime.cost} · 실행 파일은 상수 144 만 읽음</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 키워드 비교표
    // ─────────────────────────────────────────────────────
    function CompareView({ keywords }) {
      const TONE = { good: 'bg-[#cfe4f2] border-[#00599C]', mid: 'bg-amber-50 border-amber-300' };
      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-2">🔑 4개 키워드 — 무엇을 보장하나</div>
          <div className="space-y-1.5">
            {keywords.map((k, i) => (
              <div key={i} className={`rounded border-2 p-2 ${TONE[k.tone]}`}>
                <div className="flex items-center gap-2 mb-1">
                  <span className="font-mono text-[11px] font-bold text-[#003b66] w-24">{k.kw}</span>
                  <span className="text-[10px] font-bold text-slate-700">{k.guarantee}</span>
                </div>
                <div className="flex gap-1.5 text-[9px]">
                  <span className="rounded px-1.5 py-0.5 font-bold bg-sky-100 text-[#003b66]">CT: {k.ct}</span>
                  <span className="rounded px-1.5 py-0.5 font-bold bg-slate-100 text-slate-600">RT: {k.rt}</span>

                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500">CT = 컴파일 타임 · RT = 런타임</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 팩토리얼 재귀 펼침 + 룩업 테이블
    // ─────────────────────────────────────────────────────
    function ComputeView({ factSteps, factResult, lut }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🧮 factorial(5) — 빌드 때 재귀 펼침</div>
            <div className="space-y-1">
              {factSteps.map((s, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]" style={{ paddingLeft: i * 10 }}>
                  <span className="font-mono rounded bg-[#cfe4f2] border border-sky-300 px-1.5 py-0.5 text-[#003b66]">{s.call}</span>
                  <span className="text-[#00599C]">→</span>
                  <span className="font-mono text-slate-600">{s.expand}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 flex items-center gap-2">
              <span className="text-[10px] text-slate-500">접어 올리면</span>
              <span className="font-mono text-sm font-bold text-[#003b66] bg-[#cfe4f2] border border-[#00599C] rounded px-2 py-0.5">= {factResult}</span>
              <span className="text-[9px] text-emerald-700 font-bold">실행 파일에 상수로 박힘</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">📦 SQUARES[] — 빌드 때 구운 룩업 테이블 (.rodata)</div>
            <div className="grid grid-cols-8 gap-1">
              {lut.map((c) => (
                <div key={c.i} className="rounded border border-sky-300 bg-[#cfe4f2] text-center py-1">
                  <div className="text-[8px] text-slate-500 font-mono">[{c.i}]</div>
                  <div className="text-[11px] font-bold font-mono text-[#003b66]">{c.v}</div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500">런타임 초기화 0 · 스레드 경쟁 없음 · 즉시 읽기</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — if constexpr 분기 선택 + constexpr 규칙
    // ─────────────────────────────────────────────────────
    function BranchView({ branches, rules }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">🔀 if constexpr — 참인 가지만 코드로 남음</div>
            <div className="space-y-2">
              {branches.map((b, i) => (
                <div key={i} className={`rounded border-2 p-2 ${b.kept ? 'border-[#00599C] bg-[#cfe4f2]' : 'border-slate-300 bg-slate-50 opacity-60'}`}>
                  <div className="flex items-center gap-2">
                    <span className={`text-[9px] font-bold rounded px-1.5 py-0.5 ${b.kept ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-600'}`}>
                      {b.kept ? '✅ 채택' : '✂️ 버림'}
                    </span>
                    <span className="font-mono text-[10px] text-[#003b66]">{b.cond}</span>
                  </div>
                  <div className={`mt-1 font-mono text-[11px] ${b.kept ? 'text-[#003b66] font-bold' : 'text-slate-400 line-through'}`}>{b.body}</div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{b.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2">📏 constexpr 함수 규칙</div>
            <div className="space-y-1">
              {rules.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className={`font-bold ${r.ok ? 'text-emerald-600' : 'text-red-600'}`}>{r.ok ? '✅' : '❌'}</span>
                  <span className="text-slate-700">{r.text}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실패 사례 카드 (bad → fix)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5">💥 {p.title}</div>
              <div className="space-y-1 font-mono text-[10px]">
                <div className="flex items-center gap-2">
                  <span className="w-8 text-red-600 font-bold">❌</span>
                  <span className="flex-1 rounded bg-red-50 border border-red-200 px-2 py-1 text-slate-700 line-through">{p.bad}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-8 text-emerald-600 font-bold">✅</span>
                  <span className="flex-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-slate-700">{p.fix}</span>
                </div>
              </div>
              <div className="mt-1.5 text-[9px] text-slate-500">왜: {p.why}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-[#003b66]',   icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ blue 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      basic:   { icon: '⏱️', label: '계산 시점' },
      compare: { icon: '🔑', label: '키워드 비교' },
      compute: { icon: '🧮', label: '컴파일 타임 계산' },
      branch:  { icon: '🔀', label: 'if constexpr' },
      pitfall: { icon: '💥', label: '실무 실패' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.basic;
      return (
        <div className="rounded-xl border border-[#00599C] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>constexpr — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#cfe4f2] border border-sky-300">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'basic' && <BasicView runtime={state.runtime} compileTime={state.compileTime} />}
          {state.stage === 'compare' && <CompareView keywords={state.keywords} />}
          {state.stage === 'compute' && <ComputeView factSteps={state.factSteps} factResult={state.factResult} lut={state.lut} />}
          {state.stage === 'branch' && <BranchView branches={state.branches} rules={state.rules} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/20 border-l-2 border-[#4fa3d1] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">C++</span>
              <div>
                <div className="text-[11px] font-bold text-[#00599C] mb-0.5">Ⅳ. 모던 C++(17/20) · IV-2-2</div>
                <h1 className="text-2xl font-bold text-[#003b66]">컴파일타임(constexpr)</h1>
                <p className="text-sm text-[#003b66]/80">constexpr 로 계산을 컴파일 타임에 수행해 런타임 비용을 없애기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#00599C] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#004c85]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#00599C] bg-white text-[#003b66] hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                constexpr 은 "값"이 아니라 "계산 시점"을 런타임에서 컴파일 타임으로 옮겨, 입력이 컴파일 타임 상수인
                순수 계산의 런타임 비용을 상수 폴딩으로 0 으로 만든다. const(불변)·constexpr(컴파일 타임 상수식)·
                consteval(강제 컴파일 타임)·constinit(초기화 시점 강제)은 보장하는 바가 다르다. 재귀·반복 constexpr 로
                팩토리얼·룩업 테이블을 빌드 때 구우면 TMP 를 평범한 함수로 대체할 수 있고, if constexpr 로 타입별 코드를
                컴파일 타임에 고른다. 위험은 오해에서 온다 — 런타임 값으로 constexpr 초기화, const 를 상수식으로 착각,
                과한 컴파일 타임 계산으로 인한 빌드 폭증을 조심하라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['constexpr', 'consteval', 'constinit', 'const', '상수폴딩', 'if_constexpr', '룩업테이블', 'static_assert', 'TMP대체', '컴파일타임'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#cfe4f2] text-[#003b66] border border-sky-300">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
