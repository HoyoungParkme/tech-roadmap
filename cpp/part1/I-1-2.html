    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    C++ I-1-2 — 클래스·생성자·소멸자(RAII)
    학습 목표: 생성자에서 자원을 획득하고 소멸자에서 자동 반납하는 RAII로
              자원 수명을 객체 수명(스코프)에 묶는다는 C++의 핵심 관용구를 5단계로 추적.
    패턴: fastapi v1 — 좌(LiveDataPane: 클래스 레이아웃 → 생성 → RAII 생명주기 → 수동 vs RAII → 역순 소멸)
                       우(VSCode CodeViewer: cpp 코드, 단계별 하이라이트)
    색상: C++ 파랑 (#00599C / 옅은 하늘 #cfe4f2 / 다크 파랑 #003b66)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 클래스 → 생성자 → RAII 생명주기 → 수동 vs RAII → 역순 소멸
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 클래스 — 데이터와 동작을 하나로 묶고 접근을 통제한다',
        desc: '클래스는 서로 관련된 데이터(멤버 변수)와 그 데이터를 다루는 함수(멤버 함수)를 하나의 타입으로 묶는다. 핵심은 접근 제어다 — private 멤버는 클래스 바깥에서 직접 손댈 수 없고 오직 public 멤버 함수를 통해서만 다뤄진다. 이렇게 내부 표현을 숨기면(캡슐화) "언제나 유효한 상태"를 클래스 스스로 보장할 수 있어, 호출자가 실수로 불변식을 깨뜨리는 사고를 막는다. 멤버 함수 안에서 자기 객체를 가리키는 포인터가 this이며, 멤버 이름과 매개변수 이름이 겹칠 때 this->로 구분한다. 실무에서 struct는 보통 public 데이터 묶음, class는 불변식을 지켜야 하는 타입에 쓴다(문법 차이는 기본 접근 지정자뿐).',
        actor: '🧱 멤버 변수 + 멤버 함수 + 접근 제어(public/private)',
        stage: 'class',
        stageLabel: '클래스 구조 — 캡슐화',
        klass: {
          name: 'Counter',
          members: [
            { access: 'private', sig: 'int count_;', note: '내부 상태 — 바깥에서 직접 못 건드림' },
          ],
          methods: [
            { access: 'public', sig: 'Counter()', note: '생성자 — count_ 를 0으로 초기화' },
            { access: 'public', sig: 'void increment()', note: '유효성 지키며 상태 변경' },
            { access: 'public', sig: 'int value() const', note: '읽기 전용 접근(const)' },
          ],
        },
        alert: { tone: 'info', text: 'private 로 감추고 public 함수로만 여닫는 것이 캡슐화. 내부 표현을 바꿔도 호출부는 그대로 — 클래스가 "항상 유효한 상태"를 스스로 보장한다.' },
        code: {
          lang: 'cpp',
          filename: 'counter.hpp — 클래스 기본',
          lines: [
            '#include <iostream>',
            '',
            'class Counter {',
            'private:',
            '    int count_;   // 멤버 변수 — 바깥에서 직접 접근 불가',
            '',
            'public:',
            '    Counter() : count_(0) {}   // 생성자',
            '',
            '    void increment() {',
            '        this->count_ += 1;     // this = 자기 객체',
            '    }',
            '',
            '    int value() const {        // const: 상태를 안 바꿈',
            '        return count_;',
            '    }',
            '};',
            '',
            'int main() {',
            '    Counter c;',
            '    c.increment();',
            '    c.increment();',
            '    std::cout << c.value();  // => 2',
            '    // c.count_ = 99;  // 컴파일 에러: private',
            '}',
          ],
          highlight: [3, 4, 5, 7, 8, 10, 11, 14, 24],
        },
      },
      {
        title: 'Step 2. 생성자와 초기화 리스트 — 태어나는 순간 자원을 쥔다',
        desc: '생성자는 객체가 만들어질 때 딱 한 번 자동 호출되어, 멤버를 유효한 초기 상태로 세팅한다. 이때 반드시 초기화 리스트(: member(value))를 쓰는 습관이 중요하다 — 본문 { } 안에서 대입하면 "기본 생성 후 다시 대입"이라 두 번 일하는 꼴이고, const 멤버나 참조 멤버는 아예 대입이 불가능해 초기화 리스트가 유일한 방법이다. 생성자는 목적에 따라 여러 개를 둘 수 있는데(기본·매개변수·복사 생성자), 이 오버로딩 이야기는 다음 장들에서 이어진다. RAII의 첫 절반이 바로 여기다: "자원 획득 = 초기화" — 파일을 열거나 메모리를 잡는 일을 생성자 안에서 끝내면, 객체가 존재하는 한 그 자원도 확보되어 있음이 보장된다.',
        actor: '🏗 생성자 호출 → 초기화 리스트로 멤버 확정',
        stage: 'ctor',
        stageLabel: '생성자 — 자원 획득 = 초기화',
        ctor: {
          bad: {

    // ─────────────────────────────────────────────────────
    // Step 3 — RAII 생명주기 (내부 자동 애니메이션)
    // ─────────────────────────────────────────────────────
    function RaiiLifecycleView({ raii }) {
      const phases = raii.phases;
      const [idx, setIdx] = useState(0);
      // 스텝이 열려 있는 동안 생명주기를 반복 재생 (스코프 진입→획득→사용→종료→반납)
      useEffect(() => {
        setIdx(0);
        const t = setInterval(() => setIdx((i) => (i + 1) % phases.length), 1100);
        return () => clearInterval(t);
      }, [raii]);

      const cur = phases[idx];
      const resStyle = {
        none:  { txt: '자원 없음',        cls: 'bg-slate-100 border-slate-300 text-slate-500' },
        held:  { txt: '자원 확보됨 (열림)', cls: 'bg-emerald-50 border-emerald-400 text-emerald-800' },
        freed: { txt: '자원 반납됨 (닫힘)', cls: 'bg-[#cfe4f2] border-[#00599C] text-[#003b66]' },
      }[cur.res];

      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-2 flex items-center gap-1.5">

            </div>

            </div>
            <div className="text-[9px] font-mono text-slate-400 mt-2">{'}  // 스코프 끝 → ~File() 자동'}</div>

              <div key={p.key}
                className={`flex items-center gap-2 rounded border px-2 py-1 transition-all duration-300 ${i === idx
                  ? 'bg-[#cfe4f2] border-[#00599C] text-[#003b66] font-bold shadow'
                  : 'bg-white border-slate-200 text-slate-400'}`}>

        </div>
      );

    function CompareView({ compare }) {
      const STEP_TONE = {
        ok:   'bg-emerald-50 border-emerald-300 text-emerald-800',
        bad:  'bg-red-50 border-red-300 text-red-700 font-bold',
        skip: 'bg-slate-100 border-slate-300 text-slate-400 line-through',
        done: 'bg-[#cfe4f2] border-[#00599C] text-[#003b66] font-bold',
      };
      const Col = ({ c }) => {
        const good = c.vtone === 'good';
        return (
          <div className={`flex-1 rounded-lg border-2 p-2.5 ${good ? 'border-emerald-400' : 'border-red-300'} bg-white`}>
            <div className={`text-[11px] font-bold mb-2 ${good ? 'text-emerald-800' : 'text-red-700'}`}>{c.title}</div>
            <div className="space-y-1">
              {c.steps.map((s, i) => (
                <div key={i} className={`text-[10px] font-mono rounded border px-2 py-1 ${STEP_TONE[s.tone]}`}>{s.text}</div>
              ))}
            </div>
            <div className={`mt-2 text-[10px] text-center rounded px-2 py-1 border ${good
              ? 'bg-emerald-50 border-emerald-300 text-emerald-800'
              : 'bg-red-50 border-red-300 text-red-700'}`}>{c.verdict}</div>
          </div>
        );
      };
      return (
        <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
          <div className="text-[11px] font-bold text-[#003b66] mb-2 flex items-center gap-1.5">
            <span>🧪</span><span>예외가 터졌을 때 — 자원은 반납되는가?</span>
          </div>
          <div className="flex gap-2 items-stretch">
            <Col c={compare.manual} />
            <Col c={compare.raii} />
          </div>
          <div className="mt-2 text-[9px] text-slate-500 text-center">
            예외가 스택을 되감을 때(unwinding) 지역 객체 소멸자는 반드시 불린다 → RAII만 안전
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 역순 소멸 + 다음 여정
    // ─────────────────────────────────────────────────────
    function DestroyView({ destroy }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#00599C] bg-white p-3">
            <div className="text-[11px] font-bold text-[#003b66] mb-2 flex items-center gap-1.5">
              <span>🔁</span><span>소멸은 생성의 역순 (LIFO)</span>
            </div>
            <div className="flex gap-2">
              <div className="flex-1">
                <div className="text-[9px] font-bold text-slate-500 mb-1">생성 순서 ↓</div>
                {destroy.construct.map((c, i) => (
                  <div key={i} className="text-[10px] font-mono rounded border border-emerald-300 bg-emerald-50 text-emerald-800 px-2 py-1 mb-1">
                    {i + 1}. {c}
                  </div>
                ))}
              </div>
              <div className="flex items-center text-[#00599C] text-xl font-bold">⇄</div>
              <div className="flex-1">
                <div className="text-[9px] font-bold text-slate-500 mb-1">소멸 순서 ↓ (역순)</div>
                {destroy.order.map((o, i) => (
                  <div key={i} className="rounded border border-[#8fc0e0] bg-[#cfe4f2] px-2 py-1 mb-1">
                    <div className="text-[10px] font-mono text-[#003b66]">{i + 1}. {o.label}</div>
                    <div className="text-[9px] text-slate-500">{o.note}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#8fc0e0] bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#003b66] mb-1.5">🧭 다음 여정 — 표준 RAII 도구</div>
            <table className="w-full text-[10px]">
              <tbody>
                {destroy.next.map((n, i) => (
                  <tr key={i} className="border-t border-slate-100">
                    <td className="py-1 pr-2 font-mono font-bold text-[#00599C] whitespace-nowrap align-top">{n.id}</td>
                    <td className="py-1 text-slate-700">{n.t}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf3fa]', border: 'border-[#8fc0e0]',   text: 'text-[#003b66]',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',  icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',    icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900',icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (C++ 파랑 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      class:   { icon: '🧱', label: '클래스 구조' },
      ctor:    { icon: '🏗', label: '생성자 획득' },
      raii:    { icon: '♻️', label: 'RAII 생명주기' },
      compare: { icon: '🧪', label: '예외 안전' },
      destroy: { icon: '🔁', label: '역순 소멸' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.class;
      return (
        <div className="rounded-xl border border-[#8fc0e0] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#003b66] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>클래스 & RAII — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#00599C] font-mono mb-3 px-2 py-1 rounded bg-[#eaf3fa] border border-[#8fc0e0]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'class' && <ClassView klass={state.klass} />}
          {state.stage === 'ctor' && <CtorView ctor={state.ctor} />}
          {state.stage === 'raii' && <RaiiLifecycleView raii={state.raii} />}
          {state.stage === 'compare' && <CompareView compare={state.compare} />}
          {state.stage === 'destroy' && <DestroyView destroy={state.destroy} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#cfe4f2]/20 border-l-2 border-[#00599C] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#eaf3fa] to-[#f2f8fc] px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#00599C] text-white font-bold text-sm">Ⅰ. C에서 C++로</span>
              <div>
                <h1 className="text-2xl font-bold text-[#003b66]">I-1-2. 클래스·생성자·소멸자(RAII)</h1>
                <p className="text-sm text-[#00599C]">생성자·소멸자로 자원 수명을 객체에 묶는 RAII — C++ 자원 관리의 핵심</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#00599C] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#00599C]' : 'bg-[#cfe4f2]'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#003b66] text-[#eaf3fa] px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-[#cfe4f2] leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#8fc0e0] bg-white text-[#003b66] hover:bg-[#eaf3fa]"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#8fc0e0] bg-white text-[#003b66] hover:bg-[#eaf3fa] disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003b66] text-white' : 'bg-[#00599C] text-white hover:bg-[#003b66]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#8fc0e0] bg-white text-[#003b66] hover:bg-[#eaf3fa] disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#00599C] mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#00599C] bg-white px-4 py-3 text-sm text-[#003b66]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                클래스는 데이터와 동작을 묶고 private로 불변식을 지킨다. 생성자에서 자원을 획득(초기화 리스트)하고 소멸자에서 반납하면,
                자원 수명이 객체 수명(스코프)에 묶인다 — 이것이 RAII다. 스택 객체는 스코프를 벗어날 때 소멸자가 반드시 불리고(결정적 소멸),
                예외로 스택을 되감을 때도 소멸자가 호출되어 누수·이중 해제 없이 예외 안전을 얻는다. 소멸은 생성의 역순이며 소멸자는 noexcept가 원칙이다.
                실무에서는 손수 만든 래퍼 대신 unique_ptr·shared_ptr·lock_guard·fstream을 쓴다(→ II-1-2).
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['클래스', '캡슐화', '접근제어', '생성자', '초기화리스트', '소멸자', 'RAII', '결정적소멸', '예외안전', '역순소멸', '스마트포인터'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-[#eaf3fa] text-[#003b66] border border-[#8fc0e0]">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#003b66]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
