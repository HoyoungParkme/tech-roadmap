  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {

      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Nginx Chapter I-2-1 — nginx.conf 구조
    학습 목표: main / events / http / server / location 블록의 계층 구조를 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: 블록 트리) / 우(CodeViewer)
    색상: green
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 최상위 (main) — user / worker_processes',
        desc: '파일 전체 가장 바깥쪽이 main 컨텍스트. 어떤 OS 사용자로 worker 를 돌릴지, worker 프로세스를 몇 개 띄울지 같은 글로벌 설정이 들어간다. 운영체제 차원의 권한과 리소스 한도가 여기서 정해진다.',
        level: 'main',
        depth: 0,
        verdict: '최상위',
        verdictTone: 'good',
        keyPoint: 'worker_processes auto 면 CPU 코어 수만큼 자동 지정. 거의 항상 이게 정답.',
        code: {
          lang: 'nginx',
          filename: 'nginx.conf · main',
          lines: [
            '# main 컨텍스트 — 파일 최상위',
            '# /etc/nginx/nginx.conf',
            '',
            'user www-data;                # worker 프로세스 OS 사용자',
            'worker_processes auto;        # CPU 코어 수 만큼',
            'worker_rlimit_nofile 65535;   # 프로세스당 열 수 있는 FD 수',
            'pid /run/nginx.pid;           # PID 파일 위치',
            '',
            'error_log /var/log/nginx/error.log warn;',
            '',
            '# 모듈 로드 (dynamic module)',
            'load_module modules/ngx_http_brotli_filter_module.so;',
            'load_module modules/ngx_http_brotli_static_module.so;',
            '',
            '# 이 아래로 events {}, http {} 가 이어진다',
            '',
            '# 주요 main 지시자',
            '#  • user           : worker 실행 OS 계정 (보안)',
            '#  • worker_processes : 코어 활용',
            '#  • error_log      : 모든 컨텍스트에서 사용 가능',
            '#  • pid            : process management',
            '#  • load_module    : .so 동적 모듈',
            '',
            '# Tip',
            '# - master 는 root 로 떠야 80/443 바인딩 가능',
            '# - worker 만 www-data 같은 비특권 사용자로 내려감',
          ],
          highlight: [4, 5, 6, 7, 9, 12, 13, 17, 18, 19, 20, 21, 22, 25, 26],
        },
      },
      {
        title: 'Step 2. events { } — 연결 처리 설정',
        desc: 'events 블록은 worker 1개가 어떻게 동시 연결을 처리할지를 정한다. epoll (Linux) / kqueue (BSD) 같은 I/O 멀티플렉싱 방식, worker_connections 로 worker 당 최대 연결 수 등.',
        level: 'events',
        depth: 1,
        verdict: 'I/O 모델',
        verdictTone: 'good',
        keyPoint: '전체 동시 연결 한도 = worker_processes × worker_connections. 8 × 4096 = 32,768.',
        code: {
          lang: 'nginx',
          filename: 'nginx.conf · events',
          lines: [
            '# events 컨텍스트',
            '',
            'events {',
            '    use epoll;                  # Linux 2.6+ 기본. 명시 안 해도 자동',
            '    worker_connections 4096;    # worker 당 최대 동시 연결',
            '    multi_accept on;            # 한 번에 여러 새 연결 accept()',
            '    accept_mutex off;           # 최신 커널은 off 가 빠름 (SO_REUSEPORT 활용)',
            '}',
            '',
            '# I/O 멀티플렉서 옵션',
            '#  • epoll       (Linux 2.6+) ← 거의 항상 이것',
            '#  • kqueue      (FreeBSD, macOS)',
            '#  • select/poll (오래된 시스템 fallback)',
            '',
            '# worker_connections 의 의미',
            '#  • TCP 연결 1개 = FD 1개',
            '#  • client ↔ nginx 연결 + nginx ↔ upstream 연결 모두 카운트',
            '#  • 즉 리버스 프록시면 사용자 N명에 FD 2N개 필요',
            '',
            '# 동시 처리 상한 계산',
            '#  worker_processes 8 × worker_connections 4096 = 32,768',
            '#  하지만 worker_rlimit_nofile 이 이보다 커야 함',
            '',
            '# multi_accept on',
            '#  • epoll 이 깨어났을 때 새 연결을 한 번에 다 처리',
            '#  • 대량 신규 연결이 몰릴 때 유리',
          ],
          highlight: [3, 4, 5, 6, 7, 8, 10, 11, 12, 13, 15, 16, 17, 18, 20, 21, 22, 24, 25, 26],
        },
      },
      {
        title: 'Step 3. http { } — HTTP 전역 설정',
        desc: 'http 블록은 HTTP 프로토콜에 관한 모든 글로벌 설정을 담는다. mime types, gzip, log_format, keepalive, sendfile, 그리고 이 안에 여러 server 블록(virtual host)이 들어간다.',
        level: 'http',
        depth: 1,
        verdict: 'HTTP 글로벌',
        verdictTone: 'good',
        keyPoint: 'http 안에서 정의한 설정은 안쪽 server / location 에서 override 하지 않는 한 그대로 상속된다.',
        code: {
          lang: 'nginx',
          filename: 'nginx.conf · http',
          lines: [
            '# http 컨텍스트',
            '',
            'http {',
            '    include /etc/nginx/mime.types;',
            '    default_type application/octet-stream;',
            '',
            '    # 로그 형식',
            '    log_format main \'$remote_addr - $remote_user [$time_local] "$request" \'',
            '                    \'$status $body_bytes_sent "$http_referer" \'',
            '                    \'"$http_user_agent"\';',
            '    access_log /var/log/nginx/access.log main;',
            '',
            '    # 성능',
            '    sendfile on;                # 커널의 zero-copy',
            '    tcp_nopush on;              # 패킷 합쳐 보내기 (sendfile 과 짝)',
            '    tcp_nodelay on;             # 작은 패킷도 즉시 전송 (keepalive 시)',
            '    keepalive_timeout 65;       # 유휴 연결 유지 시간',
            '    types_hash_max_size 2048;',
            '    server_tokens off;          # Server 헤더에서 버전 숨김',
            '',
            '    # 압축',
            '    gzip on;',
            '    gzip_types text/plain text/css application/javascript application/json;',
            '',
            '    # upstream (다음 챕터에서 자세히)',
            '    upstream backend {',
            '        server app1:8000;',
            '        server app2:8000;',
            '    }',
            '',
            '    # 추가 server 들은 conf.d 에서 include',
            '    include /etc/nginx/conf.d/*.conf;',
            '    include /etc/nginx/sites-enabled/*;',
            '}',
          ],
          highlight: [3, 4, 5, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 18, 19, 21, 22, 23, 25, 26, 27, 28, 29, 31, 32, 33, 34],
        },
      },
      {
        title: 'Step 4. server { } — virtual host',
        desc: 'server 블록 하나가 하나의 가상 호스트. listen 으로 듣는 포트, server_name 으로 도메인을 매칭한다. 한 Nginx 가 example.com, api.example.com, admin.example.com 을 각각 다른 server 블록으로 받을 수 있다.',
        level: 'server',
        depth: 2,
        verdict: 'virtual host',
        verdictTone: 'good',
        keyPoint: 'Host 헤더 → server_name 매칭. 일치하는 server 가 없으면 default_server 또는 listen 매칭의 첫 server.',
        code: {
          lang: 'nginx',
          filename: 'conf.d/api.example.com.conf',
          lines: [
            '# server 컨텍스트 — virtual host',
            '# http {} 안에 여러 server {} 가 들어간다',
            '',
            'server {',
            '    listen 80 default_server;       # 80 포트, 매칭 안 되는 요청의 fallback',
            '    listen [::]:80 default_server;  # IPv6',
            '    server_name _;                  # 모든 호스트 매칭',
            '    return 444;                     # 잘못된 Host 는 그냥 끊음',
            '}',
            '',
            'server {',
            '    listen 443 ssl http2;',
            '    server_name api.example.com;',
            '',
            '    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;',
            '    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;',
            '',
            '    # 이 안에 여러 location {} 이 들어간다',
            '    location /v1/ {',
            '        proxy_pass http://backend;',
            '    }',
            '    location /health {',
            '        return 200 "ok";',
            '    }',
            '}',
            '',
            'server {',
            '    listen 80;',
            '    server_name www.example.com example.com;',
            '    return 301 https://example.com$request_uri;   # http→https 리디렉트',
            '}',
            '',
            '# 매칭 우선순위',
            '# 1) exact server_name 일치',
            '# 2) 시작 와일드카드 *.example.com',
            '# 3) 끝 와일드카드 mail.*',
            '# 4) 정규식 ~^api\\d+\\.example',
            '# 5) default_server',
          ],
          highlight: [4, 5, 6, 7, 8, 9, 11, 12, 13, 15, 16, 19, 20, 21, 22, 23, 24, 27, 28, 29, 30, 31, 34, 35, 36, 37, 38, 39],
        },
      },
      {
        title: 'Step 5. location { } — 경로 매칭의 핵심',
        desc: 'server 안에 있는 location 블록은 URL 경로별 동작을 정한다. /static/ 은 정적 파일, /api/ 는 백엔드 프록시, /ws/ 는 WebSocket. modifier (=, ^~, ~, ~*) 가 매칭 우선순위를 결정한다.',
        level: 'location',
        depth: 3,
        verdict: '경로 라우팅',
        verdictTone: 'good',
        summary: {
          title: 'location modifier 우선순위',
          rows: [
            { metric: '=', before: 'exact match', after: '최우선', delta: '1순위' },
            { metric: '^~', before: 'prefix 우선', after: '정규식보다 먼저', delta: '2순위' },
            { metric: '~', before: 'regex (대소문자 구분)', after: '순서대로 평가', delta: '3순위' },
            { metric: '~*', before: 'regex (대소문자 무시)', after: '순서대로 평가', delta: '3순위' },
            { metric: '(없음)', before: 'prefix match', after: '가장 긴 것 선택', delta: '4순위' },
          ],
        },
        keyPoint: '정적 파일은 prefix, 정확한 경로는 =, 패턴은 ~* 를 쓴다. 우선순위와 가장 긴 매칭을 기억하자.',
        code: {
          lang: 'nginx',
          filename: 'conf.d/locations.conf',
          lines: [
            '# location 매칭 예제',
            '',
            'server {',
            '    listen 80;',
            '    server_name example.com;',
            '    root /var/www/html;',
            '',
            '    # ① exact match — favicon 같은 단일 파일',
            '    location = /favicon.ico {',
            '        log_not_found off;',
            '        access_log off;',
            '    }',
            '',
            '    # ② ^~ — prefix 가 정규식보다 우선',
            '    location ^~ /static/ {',
            '        expires 1y;',
            '        add_header Cache-Control "public, immutable";',
            '    }',
            '',
            '    # ③ ~* — regex, 대소문자 무시',
            '    location ~* \\.(jpg|jpeg|png|gif|webp)$ {',
            '        expires 30d;',
            '    }',
            '',
            '    # ④ prefix match — 가장 긴 것 우선',
            '    location /api/ {',
            '        proxy_pass http://backend;',
            '    }',
            '',
            '    # ⑤ 더 구체적인 prefix → 위 /api/ 보다 우선',
            '    location /api/internal/ {',
            '        deny all;',
            '    }',
            '',
            '    # ⑥ fallback — SPA',
            '    location / {',
            '        try_files $uri $uri/ /index.html;',
            '    }',
            '}',
            '',
            '# 매칭 흐름 (요청: GET /api/v1/users)',
            '#  1) = /favicon.ico ? 아니오',
            '#  2) ^~ 중에 매칭? 아니오',
            '#  3) /api/internal/ 더 긴 prefix? 아니오',
            '#  4) /api/ 매칭 → proxy_pass',
          ],
          highlight: [9, 10, 11, 15, 16, 17, 18, 21, 22, 23, 26, 27, 28, 31, 32, 33, 36, 37, 38, 39, 42, 43, 44, 45, 46],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-green-400 bg-white p-3">
          <div className="text-sm font-bold text-green-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-green-700 border-b border-green-200">
                <th className="py-1 pr-2">기호</th><th className="py-1 pr-2">의미</th><th className="py-1 pr-2">동작</th><th className="py-1">순위</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-green-100">
                  <td className="py-1 pr-2 font-mono font-bold text-green-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.before}</td>
                  <td className="py-1 pr-2 text-green-800">{r.after}</td>
                  <td className="py-1 text-green-900 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function BlockTree({ activeLevel }) {
      const blocks = [
        { name: 'main', label: 'user / worker_processes', depth: 0, key: 'main' },
        { name: 'events', label: 'epoll / worker_connections', depth: 1, key: 'events' },
        { name: 'http', label: 'mime / gzip / log / upstream', depth: 1, key: 'http' },
        { name: '  server', label: 'listen 80 / server_name', depth: 2, key: 'server' },
        { name: '    location', label: 'path → root / proxy_pass', depth: 3, key: 'location' },
      ];
      return (
        <div className="rounded-lg bg-green-50 border border-green-200 p-3 font-mono text-xs">
          {blocks.map((b, i) => {
            const active = b.key === activeLevel;
            return (
              <div key={i} className={`flex items-center gap-2 py-0.5 ${active ? 'bg-green-200 text-green-900 font-bold rounded px-1 -mx-1' : 'text-green-800'}`} style={{paddingLeft: `${b.depth * 12}px`}}>
                <span className="text-green-600">{active ? '▶' : ' '}</span>
                <span>{b.name.trim()} {'{'}</span>
                <span className="text-green-600/80 text-[10px]">{b.label}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-green-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-green-900">nginx.conf 블록 트리</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <BlockTree activeLevel={state.level} />

          <div className="mt-3 rounded-lg bg-white border border-green-200 p-3">
            <div className="text-xs text-green-700 mb-1">현재 컨텍스트</div>
            <div className="text-lg font-mono font-bold text-green-900">{state.level} {'{ ... }'}</div>
            <div className="text-[10px] text-green-700/80 mt-1">depth: {state.depth} · {state.depth === 0 ? '최상위' : `중첩 ${state.depth}단계`}</div>
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-green-900 bg-green-100 border border-green-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-green-500/25 border-l-2 border-green-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-green-700 text-white font-bold">N</span>
              <div>
                <h1 className="text-2xl font-bold text-green-900">Chapter I-2-1. nginx.conf 구조</h1>
                <p className="text-sm text-green-800/80">main → events → http → server → location</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-green-800 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-green-700' : 'bg-green-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-green-700 text-white px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-50/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-green-300 bg-white text-green-800 hover:bg-green-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-green-300 bg-white text-green-800 hover:bg-green-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-green-900 text-white' : 'bg-green-700 text-white hover:bg-green-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-green-300 bg-white text-green-800 hover:bg-green-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-green-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-green-400 bg-white px-4 py-3 text-sm text-green-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                main(전역) → events(I/O) → http(HTTP 전역) → server(가상호스트) → location(경로). 안쪽 블록은 바깥쪽 설정을 상속/오버라이드한다. location 매칭은 = ^~ ~ ~* 우선순위와 "가장 긴 prefix" 룰이 핵심.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['main', 'events', 'http', 'server', 'location', 'context'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-green-800 border border-green-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-green-800">
              <a href="./I-1-2.html" className="underline hover:no-underline">← I-1-2 설치 + 첫 페이지</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 정적 파일 서빙 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
