    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Nginx Chapter I-1-2 — 설치 + 첫 페이지
    학습 목표: docker 로 Nginx 를 띄우고 기본 페이지, conf 위치, reload/restart 차이를 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: 컨테이너 상태) / 우(CodeViewer)
    색상: green
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      dockerRun: {lang:'bash', filename:'docker-run.sh', lines:[
        '# Step 1. docker 로 Nginx 한 줄 실행',
        '',
        '# 가장 간단한 형태',
        'docker run -d --name web -p 80:80 nginx:1.27-alpine',
        '',
        '# 옵션 설명',
        '#  -d              : detached (백그라운드)',
        '#  --name web      : 컨테이너 이름',
        '#  -p 80:80        : 호스트 80 → 컨테이너 80 매핑',
        '#  nginx:1.27-alpine : 22MB alpine 기반 이미지',
        '',
        '# 상태 확인',
        'docker ps',
        '# CONTAINER ID   IMAGE                COMMAND                  STATUS         PORTS',
        '# 7a3f9e1c       nginx:1.27-alpine    "/docker-entrypoint…"   Up 5 seconds   0.0.0.0:80->80/tcp',
        '',
        '# 로그',
        'docker logs -f web',
        '# /docker-entrypoint.sh: /docker-entrypoint.d/ is not empty, will attempt to perform configuration',
        '# /docker-entrypoint.sh: Looking for shell scripts in /docker-entrypoint.d/',
        '# nginx: using the "epoll" event method',
        '# start worker processes',
        '# start worker process 30',
        '',
        '# 정리',
        'docker stop web && docker rm web',
      ]},
      curlCheck: {lang:'bash', filename:'curl-check.sh', lines:[
        '# Step 2. 응답 확인',
        '',
        '# 헤더 + 본문',
        'curl -i http://localhost/',
        '',
        '# 응답',
        '# HTTP/1.1 200 OK',
        '# Server: nginx/1.27.3',
        '# Date: Thu, 19 May 2026 02:30:00 GMT',
        '# Content-Type: text/html',
        '# Content-Length: 615',
        '# Last-Modified: Tue, 13 Aug 2024 14:48:18 GMT',
        '# Connection: keep-alive',
        '# ETag: "66bbcb52-267"',
        '# Accept-Ranges: bytes',
        '#',
        '# <!DOCTYPE html>',
        '# <html>',
        '# <head><title>Welcome to nginx!</title>',
        '# ...',
        '# <h1>Welcome to nginx!</h1>',
        '# <p>If you see this page, the nginx web server is successfully installed',
        '# and working. Further configuration is required.</p>',
        '# ...',
        '',
        '# 헤더만',
        'curl -I http://localhost/',
        '',
        '# 헤더가 의미하는 것',
        '#  • Server: nginx/x.y.z       → 어떤 서버인지 (보안상 숨기는 곳도 많음)',
        '#  • Content-Length: 615       → HTML 본문 바이트',
        '#  • ETag                      → 변경 감지용 캐시 키',
        '#  • Last-Modified             → 파일 수정 시간',
        '#  • Connection: keep-alive    → TCP 재사용',
      ]},
      mountHtml: {lang:'bash', filename:'mount-html.sh', lines:[
        '# Step 3. 정적 파일 위치 + 호스트 마운트',
        '',
        '# 컨테이너 내부 webroot',
        'docker exec -it web ls /usr/share/nginx/html',
        '# 50x.html  index.html',
        '',
        '# 기본 index.html 확인',
        'docker exec -it web cat /usr/share/nginx/html/index.html',
        '',
        '# ── 호스트 디렉토리 마운트 패턴 ──────────────',
        'mkdir -p ./public',
        'echo "<h1>Hello Nginx</h1>" > ./public/index.html',
        '',
        '# 호스트의 ./public 을 컨테이너의 webroot 로',
        'docker run -d --name web \\',
        '  -p 80:80 \\',
        '  -v $(pwd)/public:/usr/share/nginx/html:ro \\',
        '  nginx:1.27-alpine',
        '',
        '# 확인',
        'curl http://localhost/',
        '# <h1>Hello Nginx</h1>',
        '',
        '# ro 옵션',
        '#  • read-only 마운트 → 컨테이너가 호스트 파일을 변경 못 함',
        '#  • 정적 파일 서빙은 항상 ro 가 안전',
        '',
        '# 실제 디렉토리 구조 예시',
        '#  ./public/',
        '#    ├── index.html',
        '#    ├── about.html',
        '#    └── assets/',
        '#         ├── logo.png',
        '#         └── style.css',
      ]},
      inspectConf: {lang:'bash', filename:'inspect-conf.sh', lines:[
        '# Step 4. 컨테이너 안 conf 보기',
        '',
        '# 메인 설정 파일',
        'docker exec -it web cat /etc/nginx/nginx.conf',

               changes:[{mark:'new',     text:'conf 를 호스트로 추출'},
                        {mark:'changed', text:'conf.d 마운트 운영'},
                        {mark:'gone',    text:'컨테이너 안에서 직접 편집'}] },
        status: 'serving', port: 80, image: 'nginx:1.27-alpine', sizeMB: 22,
        verdict: 'conf 확인', verdictTone: 'good',
        keyPoint: 'conf 는 코드처럼 저장소에서 관리한다. 컨테이너 안에서 고치면 재생성 순간 사라진다.',
        code:{...CODE.inspectConf, highlight:[31,32,34,35,36,37,38]},
      },

      // ── Step 5. reload vs restart ─────────────────────────────────────
      { ...S5,
        beat:{ label:'먼저 문법 검사', at:'reload-restart.sh L4–7',
               caption:'nginx -t 가 syntax is ok / test is successful 두 줄을 뱉어야 다음으로 간다. 여기서 걸리면 reload 하지 않는다.',
               changes:[{mark:'new',  text:'nginx -t 검증'},
                        {mark:'read', text:'syntax is ok'}] },
        status: 'serving', port: 80, image: 'nginx:1.27-alpine', sizeMB: 22,
        verdict: 'syntax ok', verdictTone: 'good',
        keyPoint: '검증 없이 reload 하면 잘못된 conf 로 서비스가 내려갈 수 있다.',
        code:{...CODE.reload, highlight:[4,5,6,7]},
      },
      { ...S5,
        beat:{ label:'reload 신호를 보낸다', at:'reload-restart.sh L9–10',
               caption:'nginx -s reload 는 master 에게 SIGHUP 을 보내는 것과 같다. 프로세스를 죽이지 않는다.',
               changes:[{mark:'new',     text:'SIGHUP 전달'},
                        {mark:'changed', text:'새 conf 적용 시작'}] },
        status: 'serving', port: 80, image: 'nginx:1.27-alpine', sizeMB: 22,
        verdict: 'SIGHUP', verdictTone: 'good',
        keyPoint: 'reload 는 명령이 아니라 신호다. master 가 알아서 교대를 진행한다.',
        code:{...CODE.reload, highlight:[9,10]},
      },
      { ...S5,
        beat:{ label:'worker 를 교대시킨다', at:'reload-restart.sh L12–16',
               caption:'master 가 새 conf 로 worker 를 새로 띄우고, 기존 worker 는 처리 중인 요청을 끝낸 뒤 스스로 종료한다. 다운타임 0.',
               changes:[{mark:'new',     text:'새 worker spawn'},
                        {mark:'gone',    text:'기존 worker 자연 종료'},
                        {mark:'changed', text:'downtime 0'}] },
        status: 'serving', port: 80, image: 'nginx:1.27-alpine', sizeMB: 22,
        verdict: 'graceful', verdictTone: 'good',
        keyPoint: '이미 붙어 있던 연결이 끊기지 않는 이유는 기존 worker 가 끝까지 살아 있기 때문이다.',
        code:{...CODE.reload, highlight:[12,13,14,15,16]},
      },
      { ...S5,
        beat:{ label:'restart 명령', at:'reload-restart.sh L19–22',
               caption:'호스트면 systemctl restart, 컨테이너면 docker restart. 둘 다 프로세스를 내렸다 다시 올린다.',
               changes:[{mark:'changed', text:'프로세스 재시작'},
                        {mark:'read',    text:'systemd / docker 두 경로'}] },
        status: 'restarting', port: 80, image: 'nginx:1.27-alpine', sizeMB: 22,
        verdict: 'restart', verdictTone: 'warn',
        keyPoint: 'conf 만 바꿨는데 restart 를 쓰는 것이 가장 흔한 낭비다.',
        code:{...CODE.reload, highlight:[19,20,21,22]},
      },
      { ...S5,
        beat:{ label:'restart 의 대가', at:'reload-restart.sh L24–28',
               caption:'SIGTERM 으로 모두 내려가고 처리 중이던 요청 일부가 끊긴다. listen 소켓을 다시 바인딩하는 동안 50ms~1s 가 빈다.',
               changes:[{mark:'gone',    text:'처리 중 요청 끊김'},
                        {mark:'changed', text:'50ms~1s 다운타임'}] },
        status: 'restarting', port: 80, image: 'nginx:1.27-alpine', sizeMB: 22,
        verdict: '다운타임', verdictTone: 'danger',
        keyPoint: '짧아 보이는 1초도 초당 수천 요청에서는 수천 건의 실패다.',
        code:{...CODE.reload, highlight:[24,25,26,27,28]},
      },
      { ...S5,
        beat:{ label:'안 먹을 때 볼 4가지', at:'reload-restart.sh L31–35, L37–38',
               caption:'nginx -t 통과 여부, 컨테이너인지 호스트인지, include 경로, 파일 확장자. 그리고 황금률 — 변경 → -t → reload.',
               changes:[{mark:'read',    text:'점검 4가지'},
                        {mark:'new',     text:'황금률 고정'}] },
        status: 'serving', port: 80, image: 'nginx:1.27-alpine', sizeMB: 22,
        verdict: '무중단 reload', verdictTone: 'good',
        summary: {
          title: 'reload vs restart',
          rows: [
            { metric: '신호', before: 'SIGHUP (reload)', after: 'SIGTERM (restart)', delta: '' },
            { metric: '다운타임', before: '0ms', after: '~수백 ms', delta: 'reload 승' },
            { metric: '기존 연결', before: 'graceful 종료', after: '강제 종료', delta: 'reload 승' },
            { metric: '용도', before: 'conf 변경', after: '바이너리 교체/심각 오류', delta: '' },
            { metric: '명령', before: 'nginx -s reload', after: 'systemctl restart nginx', delta: '' },
          ],
        },
        keyPoint: 'conf 만 바꿨다면 무조건 reload. restart 는 정말 필요한 경우만.',
        code:{...CODE.reload, highlight:[31,32,33,34,35,37,38]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.badge.split(' ')[0]}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-green-400 bg-white p-3">
          <div className="text-sm font-bold text-green-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-green-700 border-b border-green-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">A</th><th className="py-1 pr-2">B</th><th className="py-1">비고</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-green-100">
                  <td className="py-1 pr-2 font-medium text-green-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.after}</td>
                  <td className="py-1 text-green-900 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-green-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-green-900">컨테이너 상태</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="grid grid-cols-1 gap-2">
            <MetricCard label="상태" value={state.status} unit="" max={1} current={1} tone="good" />
            <MetricCard label="포트" value={state.port} unit="" max={80} current={state.port} tone="good" />
            <MetricCard label="이미지 크기" value={state.sizeMB} unit="MB" max={100} current={state.sizeMB} tone="good" />
          </div>

          <div className="mt-3 rounded-lg bg-green-50 border border-green-200 p-3">
            <div className="text-[10px] text-green-700 mb-1 font-mono">이미지: {state.image}</div>
            <div className="flex items-center justify-between text-xs font-mono">
              <span className="px-2 py-1 rounded bg-white border border-green-300">🖥️ Host :80</span>
              <span className="text-green-400">→</span>
              <span className="px-2 py-1 rounded bg-green-700 text-white">📦 Container</span>
              <span className="text-green-400">→</span>
              <span className="px-2 py-1 rounded bg-emerald-600 text-white">⚡ Nginx</span>
            </div>
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-green-900 bg-green-100 border border-green-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-green-500/25 border-l-2 border-green-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-green-700 text-white font-bold">N</span>
              <div>
                <h1 className="text-2xl font-bold text-green-900">Chapter I-1-2. 설치 + 첫 페이지</h1>
                <p className="text-sm text-green-800/80">docker run → curl → conf 위치 → reload vs restart</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-green-800 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-green-700' : 'bg-green-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-green-700 text-white px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-50/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-green-300 bg-white text-green-800 hover:bg-green-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-green-300 bg-white text-green-800 hover:bg-green-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-green-900 text-white' : 'bg-green-700 text-white hover:bg-green-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-green-300 bg-white text-green-800 hover:bg-green-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-green-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-green-400 bg-white px-4 py-3 text-sm text-green-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                docker run -p 80:80 nginx 한 줄로 시작. webroot 는 /usr/share/nginx/html, conf 는 /etc/nginx/conf.d/. 변경 후엔 nginx -t → nginx -s reload (무중단).
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['docker', 'webroot', 'conf.d', 'reload', 'SIGHUP', 'graceful'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-green-800 border border-green-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-green-800">
              <a href="./I-1-1.html" className="underline hover:no-underline">← I-1-1 웹 서버란</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 nginx.conf 구조 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
