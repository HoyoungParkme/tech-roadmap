              <div className="space-y-3">
                <div className="rounded-lg bg-slate-50 border-2 border-slate-300 p-3 text-center">
                  <div className="inline-block rounded-lg bg-white border-2 border-slate-400 px-4 py-2 text-xs font-bold text-slate-700">
                    단일 Prometheus
                  </div>
                  <div className="text-[10px] text-slate-500 mt-1 font-mono">로컬 디스크 TSDB · retention 15d</div>
                </div>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { t: '장기저장 X', d: '15일 지나면 삭제' },
                    { t: '글로벌뷰 X', d: '리전별로 따로 존재' },
                    { t: '수평확장 X', d: '한 대의 한계' },
                  ].map((x, i) => (
                    <div key={i}
                      className={`rounded-lg border-2 p-2 text-center transition-all duration-500 ${tick > i ? 'bg-red-50 border-red-300 opacity-100' : 'bg-slate-50 border-slate-200 opacity-40'}`}>
                      <div className="text-lg">🚫</div>
                      <div className="text-[11px] font-bold text-red-700 mt-1">{x.t}</div>
                      <div className="text-[9px] text-slate-500 leading-tight mt-0.5">{x.d}</div>
                    </div>
                  ))}
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  세 개의 벽을 동시에 넘으려면 <strong className="text-orange-700">장기저장 · 글로벌뷰 · 수평확장</strong> 계층이 따로 필요하다.
                </div>
              </div>
            )}

            {/* Step2: Thanos 흐름 */}
            {step.focus === 'thanos' && (
              <div className="space-y-2">
                <div className="text-[11px] font-bold text-orange-800 mb-1">🛰 Thanos — 사이드카가 블록을 올리고 Querier가 훑어 합친다 (pull)</div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="rounded-lg bg-orange-50 border-2 border-orange-200 p-2 space-y-1.5">
                    <Box tone="bg-white border-orange-300 text-orange-800" dim={tick < 1}>Prometheus + sidecar</Box>
                    <div className="text-center text-orange-400 text-xs">↓ 2h 블록 업로드</div>
                    <Box tone="bg-white border-orange-300 text-orange-800" dim={tick < 2}>🪣 오브젝트 스토리지(S3)</Box>
                  </div>
                  <div className="rounded-lg bg-orange-50 border-2 border-orange-200 p-2 space-y-1.5">
                    <Box tone="bg-white border-orange-300 text-orange-800" dim={tick < 3}>Store Gateway (과거 블록)</Box>
                    <div className="text-center text-orange-400 text-xs">↓ 팬아웃 · dedup</div>
                    <Box tone="bg-orange-500 border-orange-500 text-white" dim={tick < 4}>Querier → 글로벌 뷰</Box>
                  </div>
                </div>
                <div className={`rounded-lg border-2 p-2 text-center transition-all duration-500 ${tick > 4 ? 'bg-orange-50 border-orange-300 opacity-100' : 'opacity-40 border-slate-200'}`}>
                  <span className="text-[11px] font-bold text-orange-700">Compactor</span>
                  <span className="text-[10px] text-slate-600"> — 오래된 블록 다운샘플링(5m · 1h)으로 장기 조회 경량화</span>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  기존 Prometheus를 유지한 채 <strong className="text-orange-700">사이드카만 얹는다</strong> → 도입 저항이 작다.
                </div>
              </div>
            )}

            {/* Step3: Cortex/Mimir 흐름 */}
            {step.focus === 'cortex' && (
              <div className="space-y-2">
                <div className="text-[11px] font-bold text-sky-800 mb-1">📦 Cortex/Mimir — remote_write 로 중앙에 밀어넣는다 (push)</div>
                <div className="rounded-lg bg-sky-50 border-2 border-sky-200 p-2 space-y-1.5">
                  <Box tone="bg-white border-sky-300 text-sky-800" dim={tick < 1}>Prometheus(agent) → remote_write</Box>
                  <div className="text-center text-sky-400 text-xs">↓ X-Scope-OrgID(테넌트)</div>
                  <Box tone="bg-white border-sky-300 text-sky-800" dim={tick < 2}>Distributor (해시 링 분산)</Box>
                  <div className="text-center text-sky-400 text-xs">↓ 3벌 복제</div>
                  <div className="grid grid-cols-3 gap-1.5">
                    <Box tone="bg-white border-sky-300 text-sky-800" dim={tick < 3}>Ingester</Box>
                    <Box tone="bg-white border-sky-300 text-sky-800" dim={tick < 3}>Ingester</Box>
                    <Box tone="bg-white border-sky-300 text-sky-800" dim={tick < 3}>Ingester</Box>
                  </div>
                  <div className="text-center text-sky-400 text-xs">↓ flush</div>
                  <Box tone="bg-sky-500 border-sky-500 text-white" dim={tick < 4}>🪣 오브젝트 스토리지(S3) 블록</Box>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  각 컴포넌트를 <strong className="text-sky-700">수평으로 늘려</strong> 대규모·멀티테넌트를 감당한다. Mimir는 Cortex 개선 포크.
                </div>
              </div>
            )}

            {/* Step4: 공통 + 비교표 */}
            {step.focus === 'common' && (
              <div className="space-y-2">
                <div className="rounded-lg bg-purple-50 border-2 border-purple-200 p-2 text-center text-[11px] font-bold text-purple-800">
                  🪣 목적지는 같다 — 오브젝트 스토리지 · 장기보관 · 글로벌 쿼리 · replica dedup
                </div>
                <div className="rounded-lg border border-slate-200 overflow-hidden">
                  <div className="grid grid-cols-3 bg-slate-100 text-[10px] font-bold text-slate-600">
                    <div className="px-2 py-1.5">항목</div>
                    <div className="px-2 py-1.5 border-l border-slate-200">🛰 Thanos</div>
                    <div className="px-2 py-1.5 border-l border-slate-200">📦 Cortex/Mimir</div>
                  </div>
                  {COMPARE.map((row, i) => (
                    <div key={i}
                      className={`grid grid-cols-3 text-[10px] border-t border-slate-100 transition-all duration-500 ${tick > i ? 'opacity-100' : 'opacity-20'}`}>
                      <div className="px-2 py-1.5 font-bold text-slate-700">{row.label}</div>
                      <div className="px-2 py-1.5 border-l border-slate-100 text-orange-700">{tick > i ? row.thanos : '…'}</div>
                      <div className="px-2 py-1.5 border-l border-slate-100 text-sky-700">{tick > i ? row.cortex : '…'}</div>
                    </div>
                  ))}
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  차이는 <strong>누가 데이터를 옮기는가</strong>와 <strong>멀티테넌시가 필수인가</strong> — 이게 운영 복잡도를 가른다.
                </div>
              </div>
            )}

            {/* Step5: 선택 기준 + 함정 */}
            {step.focus === 'choose' && (
              <div className="space-y-2">
                <div className="text-[11px] font-bold text-emerald-800 mb-1">🧭 언제 무엇을 고를까</div>
                {[
                  { c: '기존 Prometheus 유지 + 장기보관/글로벌뷰만', p: 'Thanos', tone: 'bg-orange-50 border-orange-300 text-orange-800' },
                  { c: '멀티테넌트 + 대규모 수평확장', p: 'Cortex / Mimir', tone: 'bg-sky-50 border-sky-300 text-sky-800' },
                  { c: '신규 도입 · 운영성 우선', p: 'Mimir', tone: 'bg-indigo-50 border-indigo-300 text-indigo-800' },
                ].map((x, i) => (
                  <div key={i}
                    className={`rounded-lg border-2 px-3 py-1.5 flex items-center justify-between transition-all duration-500 ${tick > i ? 'opacity-100' : 'opacity-30'} ${x.tone}`}>
                    <span className="text-[10px]">{x.c}</span>
                    <span className="text-[11px] font-bold">{x.p}</span>
                  </div>
                ))}
                <div className={`rounded-lg bg-red-50 border-2 border-red-200 p-2 transition-all duration-500 ${tick > 3 ? 'opacity-100' : 'opacity-30'}`}>
                  <div className="text-[10px] font-bold text-red-700 mb-1">⚠ 실무 함정</div>
                  <div className="text-[10px] text-slate-600 leading-tight">과도한 도입(컴포넌트 폭증) · S3 스토리지 비용 · 상시 운영부담 → 먼저 retention을 늘리고 remote_write 한 곳만 붙여보라.</div>
                </div>
                <div className="rounded-lg bg-emerald-500 text-white text-center py-2 text-xs font-bold">
                  ✅ Prometheus 완주 — metric 모델부터 장기저장까지
                </div>
              </div>
            )}
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];
      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="챕터 목록으로">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 운영 &gt; Chapter 2. 장기저장 &gt; V-2-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Thanos vs Cortex vs Mimir</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                장기 저장 · 글로벌 뷰를 위한 대표 솔루션 비교 — 단일 Prometheus의 한계를 넘는 세 가지 접근
                (<strong>Thanos</strong> 사이드카 pull · <strong>Cortex/Mimir</strong> remote_write push). <strong className="text-orange-700">Prometheus 완주</strong>.
              </p>
              <div className="mt-3 h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500" style={{ width: `${progress}%`, background: '#E6522C' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                🎉 <strong>Prometheus 완주!</strong> — Metric 모델 · Scrape · PromQL · Alerting · HA · Federation · remote_write · 장기저장(Thanos·Cortex·Mimir)까지 한 흐름으로 이어졌다. 실무에선 먼저 retention을 늘리고, 필요할 때 이 계층을 얹어라.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="챕터 목록">&larr; 챕터 목록</a>
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="Prometheus 완주 — 챕터 목록으로">🎉 Prometheus 완주 — 챕터 목록 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
