<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus 학습 — V-1-2. Federation — 계층적 수집</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📊</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    V-1-2. Federation — 계층적 수집
    학습 목표: /federate 엔드포인트로 하위 Prometheus의 선별된 집계 지표를 상위로 끌어올리는 계층 구조를 이해한다.
    핵심 비유: "지역 지사 → 본사 대시보드" — 각 지사(DC별 하위)가 상세 지표를 모으고, 본사(글로벌 상위)는 요약치만 끌어온다.
    패턴: 좌(LiveDataPane — 계층 수집 애니메이션) / 우(VSCode CodeViewer — yaml federate 설정)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      problem: {lang:"yaml", filename:"global/prometheus.yml — 문제 상황", lines:[
        "# 상황: DC가 3곳, 각 DC마다 하위 Prometheus가 상세 지표 수집",
        "#   - dc-a-prometheus : 노드/컨테이너/앱 메트릭 (~50만 시계열)",
        "#   - dc-b-prometheus : 동일 규모",
        "#   - dc-c-prometheus : 동일 규모",
        "#",
        "# 만약 글로벌 Prometheus가 모든 타깃을 \"직접\" 긁으면?",
        "#   → 150만+ 시계열을 한 서버가 감당 → OOM / 카디널리티 폭발",
        "#",
        "# 우리가 원하는 것: 글로벌은 \"요약치\"만 본다",
        "#   - 예: DC별 초당 요청수, 에러율, p95 지연 (집계된 소수 시계열)",
        "#   - 상세 per-pod 지표는 각 DC 하위에만 남긴다",
        "#",
        "# 해법 = Federation: 상위가 하위의 /federate 를 스크랩한다",
        "global:",
        "  scrape_interval: 15s",
        "  external_labels:",
        "    role: global          # 이 서버의 정체성(상위)",
      ]},
      federateJob: {lang:"yaml", filename:"global/prometheus.yml — federate job", lines:[
        "scrape_configs:",
        "  - job_name: \"federate\"",
        "    scrape_interval: 30s        # 글로벌은 조금 느슨하게",
        "    honor_labels: true          # (Step 4에서 설명)",
        "    metrics_path: \"/federate\"   # 핵심: 전용 엔드포인트",
        "",
        "    params:",
        "      # match[] 로 가져올 시계열을 선별 (Step 3)",
        "      \"match[]\":",
        "        - \"up\"",
        "",
        "    static_configs:",
        "      - targets:",
        "          - \"dc-a-prometheus:9090\"",
        "          - \"dc-b-prometheus:9090\"",
        "          - \"dc-c-prometheus:9090\"",
        "        labels:",
        "          tier: \"dc\"          # 출처 구분용 정적 레이블",
      ]},
      matchSelect: {lang:"yaml", filename:"global/prometheus.yml — match[] 선별", lines:[
        "# ✅ 좋은 예: 하위에서 recording rule 로 미리 집계한 지표만",
        "#    (하위 rules.yml 예)",
        "#    - record: job:http_requests:rate5m",
        "#      expr: sum by (job) (rate(http_requests_total[5m]))",
        "",
        "params:",
        "  \"match[]\":",
        "    - '{__name__=~\"job:.*\"}'   # 집계 규칙 결과(job: 접두)",
        "    - \"up\"                       # 타깃 헬스",
        "    - 'node_memory_MemAvailable_bytes'",
        "",
        "# ❌ 나쁜 예 — 전체를 긁어 글로벌을 폭발시킴",
        "# params:",
        "#   \"match[]\":",
        "#     - '{__name__=~\".+\"}'      # 모든 시계열 → 재앙",
        "",
        "# 원칙: Federation 으로 가져오는 것은",
        "#   \"요약된 소수 지표\" 여야 한다. 상세는 하위에 남긴다.",
      ]},
      honorLabels: {lang:"yaml", filename:"global/prometheus.yml — honor_labels 동작", lines:[
        "# honor_labels: true  → 하위가 가진 job/instance 를 보존",
        "#",
        "# 하위(dc-a)가 노출하는 시계열 예:",
        "#   job:http_requests:rate5m{job=\"api\", instance=\"pod-7\"}  42.1",
        "#",
        "# [honor_labels: false] (기본) — 충돌 시 상위 값이 이김",
        "#   job      → \"federate\"          (덮어써짐 ❌)",
        "#   instance → \"dc-a-prometheus\"   (덮어써짐 ❌)",
        "#   → 원래 어느 서비스였는지 사라진다",
        "#",
        "# [honor_labels: true] — 하위 값 유지",
        "#   job      → \"api\"      ✅",
        "#   instance → \"pod-7\"    ✅",
        "",

        code:{...CODE.topology, highlight:[14, 15, 16]},
      },
      { ...S5,
        beat:{ label:"그 이상은 전용 솔루션", at:"topology.yml L17–18",
               caption:"장기 저장과 전역 원본 쿼리가 필요하면 Thanos·Cortex·Mimir 를 검토한다.",
               changes:[{mark:"new", text:"Thanos / Cortex / Mimir 검토"},
                        {mark:"changed", text:"Federation 의 적용 범위 확정"}] },
        focus:"scale",
        legend:"수직 파티셔닝 · 기능별 샤딩 → 상위는 집계치만. 원본 복제/장기저장은 별도 솔루션",
        code:{...CODE.topology, highlight:[17, 18]},
      },
    ];

    // 하위 Prometheus 3개 (DC별) — 상세 지표 수 vs 상위로 올리는 집계 수
    const CHILDREN = [
      { id: 'dc-a', name: 'dc-a-prometheus', region: 'APAC', detail: 512000, fed: 6 },
      { id: 'dc-b', name: 'dc-b-prometheus', region: 'EU',   detail: 498000, fed: 6 },
      { id: 'dc-c', name: 'dc-c-prometheus', region: 'US',   detail: 530000, fed: 6 },
    ];

    // ── 좌측: 계층적 수집 시각화
    function LiveDataPane({ beat, step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => (t + 1) % 100), 600);
        return () => clearInterval(id);
      }, [stepIdx]);

      const focus = step.focus;
      const showFlow = focus !== 'problem';       // Step1은 글로벌 뷰가 아직 없음
      const flowOn = showFlow && tick % 2 === 0;   // 스크랩 펄스
      const showLabels = focus === 'honor';
      const showLimit = focus === 'scale';

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🏛️</span>
              <span className="text-xs font-bold text-slate-700">Hierarchical Federation</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">/federate scrape</span>
          </div>

          <div className="p-4 min-h-[380px] flex flex-col">
            {/* 상위: 글로벌 Prometheus */}
            <div className="flex justify-center mb-2">
              {focus === 'problem' ? (
                <div className="rounded-lg px-4 py-3 border-2 border-dashed border-slate-300 bg-slate-50 text-center w-64">
                  <div className="text-[11px] font-bold text-slate-400">Global Prometheus</div>
                  <div className="text-[10px] text-slate-400 mt-0.5">아직 없음 — 글로벌 뷰 부재</div>
                </div>
              ) : (
                <div className={`rounded-lg px-4 py-3 border-2 text-center w-64 transition-all duration-300 ${flowOn ? 'border-orange-400 bg-orange-100 shadow-sm' : 'border-orange-300 bg-orange-50'}`}>
                  <div className="text-[11px] font-bold text-orange-800">🌐 Global Prometheus</div>
                  <div className="text-[10px] text-orange-600 mt-0.5 font-mono">role="global" · honor_labels</div>
                  <div className="mt-1 inline-block text-[10px] font-mono text-orange-700 bg-white/70 rounded px-2 py-0.5 border border-orange-200">
                    집계 시계열 {CHILDREN.reduce((s, c) => s + c.fed, 0)}개 보관
                  </div>
                </div>
              )}
            </div>

            {/* 화살표 영역 */}
            <div className="relative h-16">
              <svg viewBox="0 0 300 60" preserveAspectRatio="none" className="w-full h-full">
                {showFlow && CHILDREN.map((c, i) => {
                  const x = 50 + i * 100;
                  return (
                    <g key={c.id}>
                      <line x1={x} y1="56" x2="150" y2="6" stroke={flowOn ? '#E6522C' : '#fcd9c8'} strokeWidth="2" strokeDasharray="4 3" />
                    </g>
                  );
                })}
                {showFlow && flowOn && CHILDREN.map((c, i) => {
                  const x = 50 + i * 100;
                  const t = (tick % 10) / 10;
                  const px = x + (150 - x) * t;
                  const py = 56 + (6 - 56) * t;
                  return <circle key={c.id} cx={px} cy={py} r="3.5" fill="#B8421F" />;
                })}
              </svg>
              {showFlow && (
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <span className="text-[10px] font-mono text-orange-700 bg-white/80 rounded px-2 py-0.5 border border-orange-200">
                    {focus === 'match' ? 'match[] 로 선별' : focus === 'honor' ? 'honor_labels 보존' : 'GET /federate'}
                  </span>
                </div>
              )}
            </div>

            {/* 하위: DC별 Prometheus 3개 */}
            <div className="grid grid-cols-3 gap-2">
              {CHILDREN.map((c) => (
                <div key={c.id} className="rounded-lg border-2 border-sky-300 bg-sky-50 p-2 text-center">
                  <div className="text-[10px] font-bold text-sky-800">🛰️ {c.region}</div>
                  <div className="text-[9px] text-sky-600 font-mono truncate">{c.name}</div>
                  <div className="mt-1 text-[9px] font-mono text-slate-500 bg-white rounded px-1 py-0.5 border border-sky-100">
                    상세 {(c.detail / 1000).toFixed(0)}k
                  </div>
                  <div className={`mt-1 text-[9px] font-mono rounded px-1 py-0.5 border transition-colors duration-300 ${showFlow ? 'text-orange-700 bg-orange-50 border-orange-200' : 'text-slate-400 bg-slate-50 border-slate-200'}`}>
                    ↑ 올림 {c.fed}개
                  </div>
                  {showLabels && (
                    <div className="mt-1 text-[8px] font-mono text-emerald-700 bg-emerald-50 rounded px-1 py-0.5 border border-emerald-200 leading-tight">
                      job=api<br />instance=pod-7 유지
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* 상태 설명 박스 */}
            <div className="mt-3 text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
              {focus === 'problem' && (
                <span><strong className="text-slate-700">📦 계층의 필요</strong> — 하위 3곳이 각각 50만+ 상세 시계열을 로컬 수집한다. 이걸 한 서버가 직접 다 긁으면 폭발. 글로벌 뷰가 비어 있는 것이 문제다.</span>
              )}
              {focus === 'federate' && (
                <span><strong className="text-orange-700">🔗 스크랩일 뿐</strong> — 특별 프로토콜이 아니다. 상위가 하위의 <code className="bg-orange-100 px-1 rounded">/federate</code> 를 일반 타깃처럼 주기적으로 GET 한다.</span>
              )}
              {focus === 'match' && (
                <span><strong className="text-orange-700">🎯 선별 수집</strong> — <code className="bg-orange-100 px-1 rounded">match[]</code> 로 집계된 소수(각 6개)만 올린다. 상세 50만은 하위에 남는다. <strong className="text-red-600">전체 복제가 아니다.</strong></span>
              )}
              {focus === 'honor' && (
                <span><strong className="text-emerald-700">🏷️ 레이블 보존</strong> — <code className="bg-emerald-100 px-1 rounded">honor_labels: true</code> 로 하위의 <code className="bg-emerald-100 px-1 rounded">job</code>/<code className="bg-emerald-100 px-1 rounded">instance</code> 를 지킨다. 끄면 모두 하위 주소로 뭉개진다.</span>
              )}
              {showLimit && (
                <span><strong className="text-red-700">⚠️ 한계</strong> — 스크랩 간격만큼 <strong>지연</strong>, 원본 raw 복제 아님. 장기저장·전역 원본 쿼리는 <strong>Thanos/Mimir</strong> 영역.</span>
              )}
            </div>
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="챕터 목록으로">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 운영 &gt; Chapter 1. 확장 &gt; V-1-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Federation — 계층적 수집</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                여러 프로메테우스의 핵심 지표를 상위로 끌어올린다 — 하위(DC별)는 상세 지표를 로컬 수집하고,
                상위(글로벌)는 <code className="bg-orange-100 text-orange-800 px-1 rounded">/federate</code> 로 선별된 집계치만 스크랩한다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(V-2-1)에서는 <strong>운영 심화</strong> — Federation을 넘어선 확장/저장 전략으로 이어진다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="챕터 목록">&larr; 챕터 목록</a>
              <a href="./V-2-1.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 V-2-1">V-2-1 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
