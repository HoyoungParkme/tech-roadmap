      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    V-1-2. Federation — 계층적 수집
    학습 목표: /federate 엔드포인트로 하위 Prometheus의 선별된 집계 지표를 상위로 끌어올리는 계층 구조를 이해한다.
    핵심 비유: "지역 지사 → 본사 대시보드" — 각 지사(DC별 하위)가 상세 지표를 모으고, 본사(글로벌 상위)는 요약치만 끌어온다.
    패턴: 좌(LiveDataPane — 계층 수집 애니메이션) / 우(VSCode CodeViewer — yaml federate 설정)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 왜 Federation인가 — 단일 Prometheus의 벽',
        desc: '하나의 Prometheus로는 수백 개 타깃을 다 긁으면 메모리와 카디널리티가 폭발한다. 그래서 데이터센터(DC)마다 하위 Prometheus를 두어 상세 지표를 로컬에서 수집하게 한다. 문제는 "전 지역을 한눈에 보는 글로벌 뷰"가 필요할 때다. 각 하위를 일일이 열어볼 수는 없다. Federation은 이 계층 문제를 푸는 표준 답이다.',
        focus: 'problem',
        legend: 'DC별 하위 Prometheus는 상세 지표를 로컬 수집 — 글로벌 뷰가 빠져 있다',
        code: {
          lang: 'yaml',
          filename: 'global/prometheus.yml — 문제 상황',
          lines: [
            '# 상황: DC가 3곳, 각 DC마다 하위 Prometheus가 상세 지표 수집',
            '#   - dc-a-prometheus : 노드/컨테이너/앱 메트릭 (~50만 시계열)',
            '#   - dc-b-prometheus : 동일 규모',
            '#   - dc-c-prometheus : 동일 규모',
            '#',
            '# 만약 글로벌 Prometheus가 모든 타깃을 "직접" 긁으면?',
            '#   → 150만+ 시계열을 한 서버가 감당 → OOM / 카디널리티 폭발',
            '#',
            '# 우리가 원하는 것: 글로벌은 "요약치"만 본다',
            '#   - 예: DC별 초당 요청수, 에러율, p95 지연 (집계된 소수 시계열)',
            '#   - 상세 per-pod 지표는 각 DC 하위에만 남긴다',
            '#',
            '# 해법 = Federation: 상위가 하위의 /federate 를 스크랩한다',
            'global:',
            '  scrape_interval: 15s',
            '  external_labels:',
            '    role: global          # 이 서버의 정체성(상위)',
          ],
          highlight: [1, 5, 6, 8, 12, 13],
        },
      },
      {
        title: 'Step 2. /federate 엔드포인트 — 상위가 하위를 스크랩',
        desc: 'Federation의 핵심은 특별한 프로토콜이 아니라 그냥 스크랩이다. 모든 Prometheus는 자기 데이터를 노출하는 /federate 엔드포인트를 갖는다. 상위 Prometheus는 이 엔드포인트를 일반 타깃처럼 긁는다. 다만 job 이름을 federate로 두고 metrics_path를 슬래시 federate로 바꾼다. honor_labels는 뒤 단계에서 다루니 지금은 "상위가 하위를 스크랩한다"는 그림만 잡자.',
        focus: 'federate',
        legend: '글로벌 Prometheus가 각 하위의 /federate 를 주기적으로 스크랩',
        code: {
          lang: 'yaml',
          filename: 'global/prometheus.yml — federate job',
          lines: [
            'scrape_configs:',
            '  - job_name: "federate"',
            '    scrape_interval: 30s        # 글로벌은 조금 느슨하게',
            '    honor_labels: true          # (Step 4에서 설명)',
            '    metrics_path: "/federate"   # 핵심: 전용 엔드포인트',
            '',
            '    params:',
            '      # match[] 로 가져올 시계열을 선별 (Step 3)',
            '      "match[]":',
            '        - "up"',
            '',
            '    static_configs:',
            '      - targets:',
            '          - "dc-a-prometheus:9090"',
            '          - "dc-b-prometheus:9090"',
            '          - "dc-c-prometheus:9090"',
            '        labels:',
            '          tier: "dc"          # 출처 구분용 정적 레이블',
          ],
          highlight: [2, 5, 12, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 3. match[] — 집계된 시계열만 골라온다',
        desc: '가장 흔한 실무 사고는 match[] 없이 혹은 너무 넓게 잡아 하위의 전체 시계열을 통째로 끌어오는 것이다. 그러면 글로벌이 다시 폭발한다. Federation은 복제가 아니다. match[] 에는 이미 recording rule로 집계해 둔 소수의 지표만 지정한다. 예를 들어 원시 http_requests_total 대신 job:http_requests:rate5m 같은 집계 결과만 가져온다. 여러 match[] 를 나열하면 합집합으로 선택된다.',
        focus: 'match',
        legend: 'match[] 로 "집계된 소수 시계열"만 선택 — 전체 복제가 아니다',
        code: {
          lang: 'yaml',
          filename: 'global/prometheus.yml — match[] 선별',
          lines: [
            '# ✅ 좋은 예: 하위에서 recording rule 로 미리 집계한 지표만',
            '#    (하위 rules.yml 예)',
            '#    - record: job:http_requests:rate5m',
            '#      expr: sum by (job) (rate(http_requests_total[5m]))',
            '',
            'params:',
            '  "match[]":',
            '    - \'{__name__=~"job:.*"}\'   # 집계 규칙 결과(job: 접두)',
            '    - "up"                       # 타깃 헬스',
            '    - \'node_memory_MemAvailable_bytes\'',
            '',
            '# ❌ 나쁜 예 — 전체를 긁어 글로벌을 폭발시킴',
            '# params:',
            '#   "match[]":',
            '#     - \'{__name__=~".+"}\'      # 모든 시계열 → 재앙',
            '',
            '# 원칙: Federation 으로 가져오는 것은',
            '#   "요약된 소수 지표" 여야 한다. 상세는 하위에 남긴다.',
          ],
          highlight: [6, 7, 8, 9, 10, 13, 14, 15],
        },
      },
      {
        title: 'Step 4. honor_labels — 레이블 충돌 방지',
        desc: '스크랩할 때 Prometheus는 보통 타깃의 job, instance 레이블을 스크랩하는 쪽 값으로 덮어쓴다. 그런데 Federation에서는 하위가 붙여 둔 원래 job, instance 를 그대로 보존해야 어느 서비스의 지표인지 안다. honor_labels 를 true 로 두면 하위가 이미 가진 레이블을 상위가 덮어쓰지 않는다. 반대로 tier 나 region 같은 상위 전용 레이블은 static_configs 에서 추가해 출처를 표시한다. 이 설정을 빠뜨리면 모든 DC 지표의 instance 가 하위 주소로 뭉개진다.',
        focus: 'honor',
        legend: 'honor_labels: true — 하위 원본 레이블 보존, 상위는 tier/region만 덧붙임',
        code: {
          lang: 'yaml',
          filename: 'global/prometheus.yml — honor_labels 동작',
          lines: [
            '# honor_labels: true  → 하위가 가진 job/instance 를 보존',
            '#',
            '# 하위(dc-a)가 노출하는 시계열 예:',
            '#   job:http_requests:rate5m{job="api", instance="pod-7"}  42.1',
            '#',
            '# [honor_labels: false] (기본) — 충돌 시 상위 값이 이김',
            '#   job      → "federate"          (덮어써짐 ❌)',
            '#   instance → "dc-a-prometheus"   (덮어써짐 ❌)',
            '#   → 원래 어느 서비스였는지 사라진다',
            '#',
            '# [honor_labels: true] — 하위 값 유지',
            '#   job      → "api"      ✅',
            '#   instance → "pod-7"    ✅',
            '',
            'scrape_configs:',
            '  - job_name: "federate"',
            '    honor_labels: true',
            '    static_configs:',
            '      - targets: ["dc-a-prometheus:9090"]',
            '        labels: { region: "apac", tier: "dc" }  # 상위 전용',
          ],
          highlight: [1, 6, 7, 8, 11, 12, 13, 17, 20],
        },
      },
      {
        title: 'Step 5. 스케일 전략과 한계 — 남용하지 말 것',
        desc: 'Federation은 만능이 아니다. 스케일 축은 둘이다. 수직 파티셔닝은 DC/팀별로 하위를 쪼개는 것이고, 기능별 샤딩은 지표 종류(앱/인프라)별로 하위를 나누는 것이다. 상위는 여기서 나온 집계치만 모은다. 한계도 분명하다. 상위는 하위의 최신 스냅샷을 스크랩 간격마다 당기므로 지연이 생기고, 원시 데이터의 완전한 복제도 아니다. 장기 저장이나 전역 원본 쿼리가 필요하면 Thanos, Cortex, Mimir 같은 전용 솔루션을 검토한다.',
        focus: 'scale',
        legend: '수직 파티셔닝 · 기능별 샤딩 → 상위는 집계치만. 원본 복제/장기저장은 별도 솔루션',
        code: {
          lang: 'yaml',
          filename: 'topology.yml — 스케일 토폴로지 정리',
          lines: [
            '# 스케일 전략 1) 수직 파티셔닝 (지역/팀별 하위)',
            '#   global',
            '#   ├── dc-a-prometheus   (APAC)',
            '#   ├── dc-b-prometheus   (EU)',
            '#   └── dc-c-prometheus   (US)',
            '#',
            '# 스케일 전략 2) 기능별 샤딩 (지표 종류별 하위)',
            '#   global',
            '#   ├── app-prometheus    (애플리케이션 메트릭)',
            '#   └── infra-prometheus  (노드/네트워크 메트릭)',
            '#',
            '# Federation 의 한계 (반드시 인지)',
            '#   - 전체 복제가 아니다 → 상위엔 집계 소수만',
            '#   - 스크랩 간격만큼 지연(staleness) 발생',
            '#   - 원본 raw 데이터 전역 쿼리는 불가',
            '#',
            '# 그 이상이 필요하면:',
            '#   Thanos / Cortex / Mimir (장기저장 · 전역 쿼리)',
          ],
          highlight: [1, 7, 12, 13, 14, 15, 17, 18],
        },
      },
    ];

    // 하위 Prometheus 3개 (DC별) — 상세 지표 수 vs 상위로 올리는 집계 수
    const CHILDREN = [
      { id: 'dc-a', name: 'dc-a-prometheus', region: 'APAC', detail: 512000, fed: 6 },
      { id: 'dc-b', name: 'dc-b-prometheus', region: 'EU',   detail: 498000, fed: 6 },
      { id: 'dc-c', name: 'dc-c-prometheus', region: 'US',   detail: 530000, fed: 6 },
    ];

    // ── 좌측: 계층적 수집 시각화
    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => (t + 1) % 100), 600);
        return () => clearInterval(id);
      }, [stepIdx]);

      const focus = step.focus;
      const showFlow = focus !== 'problem';       // Step1은 글로벌 뷰가 아직 없음
      const flowOn = showFlow && tick % 2 === 0;   // 스크랩 펄스
      const showLabels = focus === 'honor';
      const showLimit = focus === 'scale';

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🏛️</span>
              <span className="text-xs font-bold text-slate-700">Hierarchical Federation</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">/federate scrape</span>
          </div>

          <div className="p-4 min-h-[380px] flex flex-col">
            {/* 상위: 글로벌 Prometheus */}
            <div className="flex justify-center mb-2">
              {focus === 'problem' ? (
                <div className="rounded-lg px-4 py-3 border-2 border-dashed border-slate-300 bg-slate-50 text-center w-64">
                  <div className="text-[11px] font-bold text-slate-400">Global Prometheus</div>
                  <div className="text-[10px] text-slate-400 mt-0.5">아직 없음 — 글로벌 뷰 부재</div>
                </div>
              ) : (
                <div className={`rounded-lg px-4 py-3 border-2 text-center w-64 transition-all duration-300 ${flowOn ? 'border-orange-400 bg-orange-100 shadow-sm' : 'border-orange-300 bg-orange-50'}`}>
                  <div className="text-[11px] font-bold text-orange-800">🌐 Global Prometheus</div>
                  <div className="text-[10px] text-orange-600 mt-0.5 font-mono">role="global" · honor_labels</div>
                  <div className="mt-1 inline-block text-[10px] font-mono text-orange-700 bg-white/70 rounded px-2 py-0.5 border border-orange-200">
                    집계 시계열 {CHILDREN.reduce((s, c) => s + c.fed, 0)}개 보관
                  </div>
                </div>
              )}
            </div>

            {/* 화살표 영역 */}
            <div className="relative h-16">
              <svg viewBox="0 0 300 60" preserveAspectRatio="none" className="w-full h-full">
                {showFlow && CHILDREN.map((c, i) => {
                  const x = 50 + i * 100;
                  return (
                    <g key={c.id}>
                      <line x1={x} y1="56" x2="150" y2="6" stroke={flowOn ? '#E6522C' : '#fcd9c8'} strokeWidth="2" strokeDasharray="4 3" />
                    </g>
                  );
                })}
                {showFlow && flowOn && CHILDREN.map((c, i) => {
                  const x = 50 + i * 100;
                  const t = (tick % 10) / 10;
                  const px = x + (150 - x) * t;
                  const py = 56 + (6 - 56) * t;
                  return <circle key={c.id} cx={px} cy={py} r="3.5" fill="#B8421F" />;
                })}
              </svg>
              {showFlow && (
                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                  <span className="text-[10px] font-mono text-orange-700 bg-white/80 rounded px-2 py-0.5 border border-orange-200">
                    {focus === 'match' ? 'match[] 로 선별' : focus === 'honor' ? 'honor_labels 보존' : 'GET /federate'}
                  </span>
                </div>
              )}
            </div>

            {/* 하위: DC별 Prometheus 3개 */}
            <div className="grid grid-cols-3 gap-2">
              {CHILDREN.map((c) => (
                <div key={c.id} className="rounded-lg border-2 border-sky-300 bg-sky-50 p-2 text-center">
                  <div className="text-[10px] font-bold text-sky-800">🛰️ {c.region}</div>
                  <div className="text-[9px] text-sky-600 font-mono truncate">{c.name}</div>
                  <div className="mt-1 text-[9px] font-mono text-slate-500 bg-white rounded px-1 py-0.5 border border-sky-100">
                    상세 {(c.detail / 1000).toFixed(0)}k
                  </div>
                  <div className={`mt-1 text-[9px] font-mono rounded px-1 py-0.5 border transition-colors duration-300 ${showFlow ? 'text-orange-700 bg-orange-50 border-orange-200' : 'text-slate-400 bg-slate-50 border-slate-200'}`}>
                    ↑ 올림 {c.fed}개
                  </div>
                  {showLabels && (
                    <div className="mt-1 text-[8px] font-mono text-emerald-700 bg-emerald-50 rounded px-1 py-0.5 border border-emerald-200 leading-tight">
                      job=api<br />instance=pod-7 유지
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* 상태 설명 박스 */}
            <div className="mt-3 text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
              {focus === 'problem' && (
                <span><strong className="text-slate-700">📦 계층의 필요</strong> — 하위 3곳이 각각 50만+ 상세 시계열을 로컬 수집한다. 이걸 한 서버가 직접 다 긁으면 폭발. 글로벌 뷰가 비어 있는 것이 문제다.</span>
              )}
              {focus === 'federate' && (
                <span><strong className="text-orange-700">🔗 스크랩일 뿐</strong> — 특별 프로토콜이 아니다. 상위가 하위의 <code className="bg-orange-100 px-1 rounded">/federate</code> 를 일반 타깃처럼 주기적으로 GET 한다.</span>
              )}
              {focus === 'match' && (
                <span><strong className="text-orange-700">🎯 선별 수집</strong> — <code className="bg-orange-100 px-1 rounded">match[]</code> 로 집계된 소수(각 6개)만 올린다. 상세 50만은 하위에 남는다. <strong className="text-red-600">전체 복제가 아니다.</strong></span>
              )}
              {focus === 'honor' && (
                <span><strong className="text-emerald-700">🏷️ 레이블 보존</strong> — <code className="bg-emerald-100 px-1 rounded">honor_labels: true</code> 로 하위의 <code className="bg-emerald-100 px-1 rounded">job</code>/<code className="bg-emerald-100 px-1 rounded">instance</code> 를 지킨다. 끄면 모두 하위 주소로 뭉개진다.</span>
              )}
              {showLimit && (
                <span><strong className="text-red-700">⚠️ 한계</strong> — 스크랩 간격만큼 <strong>지연</strong>, 원본 raw 복제 아님. 장기저장·전역 원본 쿼리는 <strong>Thanos/Mimir</strong> 영역.</span>
              )}
            </div>
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="챕터 목록으로">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 운영 &gt; Chapter 1. 확장 &gt; V-1-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Federation — 계층적 수집</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                여러 프로메테우스의 핵심 지표를 상위로 끌어올린다 — 하위(DC별)는 상세 지표를 로컬 수집하고,
                상위(글로벌)는 <code className="bg-orange-100 text-orange-800 px-1 rounded">/federate</code> 로 선별된 집계치만 스크랩한다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(V-2-1)에서는 <strong>운영 심화</strong> — Federation을 넘어선 확장/저장 전략으로 이어진다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="챕터 목록">&larr; 챕터 목록</a>
              <a href="./V-2-1.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 V-2-1">V-2-1 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
