    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>

  <div id="root"></div>

  <!--
    III-2-1. Alertmanager 라우팅
    학습 목표: 발생한 알림이 라벨(severity/team) 기준으로 route 트리를 타고 내려가
               올바른 receiver(slack/pagerduty/email/webhook)로 배달되는 과정을 이해한다.
    패턴: 좌(LiveDataPane — 알림이 route 트리를 따라 내려가는 애니메이션) / 우(VSCode CodeViewer — alertmanager.yml)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#E6522C';
    const BRAND_DARK = '#B8421F';

    const STEPS = [
      {
        title: 'Step 1. 알림 전송 — Prometheus가 firing 알림을 Alertmanager로 push',
        desc: 'Prometheus는 알림을 직접 사람에게 보내지 않는다. alerting rule이 firing되면 라벨이 붙은 알림 객체를 Alertmanager로 HTTP push할 뿐이다. 배달 대상을 정하고, 묶고, 침묵시키고, 재전송하는 일은 전부 Alertmanager의 몫이다. 그래서 "누구에게 보낼지"는 rule이 아니라 alertmanager.yml의 route 트리에서 결정된다. 이 역할 분리를 모르면 rule 파일에서 수신자를 찾다가 시간을 버린다.',
        focus: 'send',
        activePath: [],
        legend: 'Prometheus는 라벨 붙은 알림을 밀어줄 뿐, 배달 규칙은 Alertmanager가 담당',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — Alertmanager 연결',
          lines: [
            '# Prometheus는 firing된 알림을 이 주소로 push 한다',
            'alerting:',
            '  alertmanagers:',
            '    - static_configs:',
            '        - targets: ["alertmanager:9093"]',
            '',
            '# 이렇게 넘어가는 알림 1건의 실제 모습(라벨이 배달 기준):',
            '# {',
            '#   alertname: "HighErrorRate",',
            '#   severity:  "critical",',
            '#   team:      "payments",',
            '#   instance:  "api-7f9c",',
            '# }',
            '',
            '# 핵심: Prometheus는 "누구에게" 보낼지 모른다.',
            '# 배달 대상 결정은 전부 alertmanager.yml의 route 트리가 한다.',
          ],
          highlight: [2, 3, 4, 5, 15, 16],
        },
      },
      {
        title: 'Step 2. route 트리 — root에서 시작해 자식으로 내려가는 분기',
        desc: 'Alertmanager 설정의 심장은 하나의 route 트리다. 최상단 root route는 매칭 조건이 없어 모든 알림을 받는 기본 수신자이자 group_by 같은 공통 옵션의 기준점이다. 그 아래 routes에 자식 route를 중첩해 세부 분기를 만든다. 알림은 항상 root에서 출발해 위에서 아래로, 먼저 매칭되는 자식으로 흘러 내려간다. 트리를 얕고 명확하게 유지해야 나중에 "이 알림이 왜 여기로 갔지"를 추적할 수 있다.',
        focus: 'tree',
        activePath: ['root'],
        legend: 'root route가 모든 알림의 진입점 — 자식 routes로 위에서 아래로 분기',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — route 트리 뼈대',
          lines: [
            'route:',
            '  # root route: 매처 없음 → 모든 알림이 여기서 출발',
            '  receiver: "default-slack"        # 아무 자식도 안 맞으면 여기로',
            '  group_by: ["alertname", "cluster"]',
            '  group_wait: 30s',
            '  group_interval: 5m',
            '  repeat_interval: 4h',
            '',
            '  routes:                          # 자식 route들 (위→아래 순서 평가)',
            '    - matchers: [ team="payments" ]',
            '      receiver: "payments-slack"',
            '',
            '    - matchers: [ team="infra" ]',
            '      receiver: "infra-slack"',
            '',
            '# 알림은 root에서 시작해 first-match 자식으로 내려간다.',
          ],
          highlight: [1, 2, 3, 9],
        },
      },
      {
        title: 'Step 3. 라벨 매칭 — matchers로 severity·team 기준 분기',
        desc: 'route가 알림을 잡는 기준은 오직 라벨이다. matchers에 team="payments"를 쓰면 그 라벨을 가진 알림만 이 가지로 들어온다. 자식 route는 다시 자기 자식을 둘 수 있어 team으로 1차 분기한 뒤 severity로 2차 분기하는 식으로 좁혀 나간다. 중요한 점은 first-match: 형제 route 중 위에서부터 처음 맞는 하나로 확정되고, 그 안에서 다시 자식을 평가한다. 그래서 좁고 구체적인 조건(critical)을 넓은 조건보다 위에 둬야 원하는 대로 걸린다.',
        focus: 'match',
        activePath: ['root', 'payments', 'payments-crit'],
        legend: 'matchers는 라벨 값으로 분기 — 구체적 조건을 위에, first-match로 확정',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — 중첩 matchers',
          lines: [
            'route:',
            '  receiver: "default-slack"',
            '  group_by: ["alertname", "cluster"]',
            '  routes:',
            '    - matchers: [ team="payments" ]   # 1차 분기: 팀',
            '      receiver: "payments-slack"',
            '      routes:',
            '        # 2차 분기: 같은 팀이라도 critical은 따로',
            '        - matchers: [ severity="critical" ]',
            '          receiver: "payments-pagerduty"',
            '',
            '    - matchers: [ team="infra" ]',
            '      receiver: "infra-slack"',
            '',
            '# 예: severity="critical", team="payments" 알림은',
            '#   root → team=payments → severity=critical',
            '#   ⇒ payments-pagerduty 로 확정.',
          ],
          highlight: [5, 6, 9, 10, 16],
        },
      },
      {
        title: 'Step 4. receiver 도착 — group_by로 묶어 실제 채널로 배달',
        desc: 'route 트리의 끝에서 확정된 receiver가 실제 배달 방식을 정의한다. slack·email·pagerduty·webhook 등 통합별로 receivers 목록에 채널과 토큰을 적어 둔다. 배달 직전 Alertmanager는 group_by 라벨이 같은 알림들을 하나의 알림으로 묶어(grouping) 폭주를 막는다. group_wait은 첫 알림을 잠깐 기다렸다 모아 보내는 시간, repeat_interval은 해결 안 된 알림을 다시 알리는 간격이다. 이 묶기 덕분에 인시던트 1건이 수십 개 핑으로 쪼개지지 않는다.',
        focus: 'receiver',
        activePath: ['root', 'payments', 'payments-crit', 'recv'],
        legend: 'receiver가 채널·토큰을 정의 — group_by로 묶어 알림 폭주 방지',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — receivers 정의',
          lines: [
            'receivers:',
            '  - name: "default-slack"',
            '    slack_configs:',
            '      - channel: "#alerts"',
            '        send_resolved: true',
            '',
            '  - name: "payments-slack"',
            '    slack_configs:',
            '      - channel: "#pay-alerts"',
            '',
            '  - name: "payments-pagerduty"        # critical → 호출기',
            '    pagerduty_configs:',
            '      - routing_key: "R0ABCD1234EFGH"',
            '',
            '  - name: "infra-slack"',
            '    slack_configs:',
            '      - channel: "#infra-alerts"',
            '',
            '# group_by 라벨이 같은 알림은 1건으로 묶여 배달된다.',
          ],
          highlight: [11, 12, 13, 19],
        },
      },
      {
        title: 'Step 5. 실무 함정 — 매처 오류·continue 오해·receiver 미설정',
        desc: '라우팅이 조용히 어긋나는 지점들이다. 첫째, matchers 오타나 잘못된 라벨 이름은 에러 없이 그냥 안 걸려 알림이 default로 새거나 유실된다. 둘째, first-match라 continue: true를 안 주면 알림은 처음 맞는 형제 하나에서 멈춘다. 온콜 호출과 팀 슬랙에 동시에 보내려면 그 route에 continue: true가 필요하다. 셋째, receiver 이름 오타는 설정 로드 자체를 실패시키니 amtool로 미리 검증한다. 넷째, 넓은 조건을 위에 두면 아래의 구체 조건이 영영 안 걸린다 — 순서가 곧 우선순위다.',
        focus: 'pitfall',
        activePath: ['root', 'infra', 'infra-crit', 'recv2'],
        legend: 'continue 없으면 first-match에서 멈춤 · 매처 오타는 조용한 유실 · 순서=우선순위',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — continue와 함정 회피',
          lines: [
            'route:',
            '  receiver: "default-slack"',
            '  routes:',
            '    # continue: true → 여기로도 보내고 다음 형제도 계속 평가',
            '    - matchers: [ severity="critical" ]',
            '      receiver: "oncall-pagerduty"',
            '      continue: true',
            '',
            '    - matchers: [ team="infra" ]',
            '      receiver: "infra-slack"       # critical이어도 여기까지 옴',
            '',
            '# 함정 체크리스트',
            '# 1) 매처 오타: team="payment" (s 빠짐) → 조용히 default로 샘',
            '# 2) continue 누락 → 첫 매칭에서 멈춰 이중 통지 실패',
            '# 3) receiver 이름 오타 → 설정 로드 실패 (amtool로 검증)',
            '# 4) 넓은 조건을 위에 두면 아래 구체 조건이 영영 안 걸림',
            '',
            '# 배포 전 필수: amtool check-config alertmanager.yml',
          ],
          highlight: [5, 6, 7, 13, 14, 18],
        },
      },
    ];

    // route 트리 노드 정의 (좌측 시각화용)
    const TREE = [
      { id: 'root',          depth: 0, label: 'route (root)',      match: '매처 없음 · 모든 알림',        recv: 'default-slack',       kind: 'route' },
      { id: 'payments',      depth: 1, label: 'match team=payments', match: 'team = "payments"',           recv: 'payments-slack',      kind: 'route' },
      { id: 'payments-crit', depth: 2, label: 'match severity=critical', match: 'severity = "critical"',   recv: 'payments-pagerduty',  kind: 'route' },
      { id: 'recv',          depth: 3, label: 'receiver 도착',      match: 'group_by로 묶어 배달',         recv: 'payments-pagerduty',  kind: 'receiver', channel: 'PagerDuty · 온콜 호출' },
      { id: 'infra',         depth: 1, label: 'match team=infra',   match: 'team = "infra"',               recv: 'infra-slack',         kind: 'route' },
      { id: 'infra-crit',    depth: 2, label: 'continue 형제',      match: 'severity="critical" continue', recv: 'oncall-pagerduty',    kind: 'route' },
      { id: 'recv2',         depth: 3, label: 'receiver 도착',      match: 'infra-slack 채널',             recv: 'infra-slack',         kind: 'receiver', channel: 'Slack · #infra-alerts' },
    ];

    const RECEIVERS = [
      { key: 'slack',     emoji: '💬', name: 'Slack' },
      { key: 'email',     emoji: '📧', name: 'Email' },
      { key: 'pagerduty', emoji: '📟', name: 'PagerDuty' },
      { key: 'webhook',   emoji: '🪝', name: 'Webhook' },
    ];

    // ── 좌측: 알림이 route 트리를 타고 내려가는 시각화
    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, [stepIdx]);

      const path = step.activePath || [];
      // 애니메이션: tick에 따라 path를 한 단계씩 점등 (최대 path.length까지)
      const litCount = path.length === 0 ? 0 : Math.min(path.length, (tick % (path.length + 2)) + 1);
      const litSet = new Set(path.slice(0, litCount));
      const arrivedAt = litCount > 0 ? path[litCount - 1] : null;
      const arrivedNode = TREE.find((n) => n.id === arrivedAt);

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🚦</span>
              <span className="text-xs font-bold text-slate-700">Alertmanager 라우팅 트리</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">route → receiver</span>
          </div>

          {/* 발생한 알림 카드 (라벨) */}
          <div className="px-4 pt-3">
            <div className={`rounded-lg p-3 border-2 transition-all duration-300 ${step.focus === 'send' ? 'border-orange-400 bg-orange-50 shadow-sm' : 'border-slate-200 bg-slate-50'}`}>
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold text-slate-700">🔥 firing 알림 1건</span>
                <span className="text-[10px] font-mono text-slate-500">Prometheus → AM</span>
              </div>
              <div className="flex flex-wrap gap-1.5">
                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-200 text-slate-700">alertname=HighErrorRate</span>
                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-red-100 text-red-700 border border-red-300">severity=critical</span>
                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-sky-100 text-sky-700 border border-sky-300">team=payments</span>
              </div>
            </div>
          </div>

          {/* route 트리 */}
          <div className="p-4 min-h-[300px]">
            <div className="space-y-1.5">
              {TREE.map((node) => {
                const lit = litSet.has(node.id);
                const isArrived = node.id === arrivedAt;
                const isReceiver = node.kind === 'receiver';
                return (
                  <div key={node.id} className="flex items-stretch" style={{ paddingLeft: node.depth * 22 }}>
                    {node.depth > 0 && (
                      <span className={`select-none mr-1 font-mono text-sm ${lit ? 'text-orange-500' : 'text-slate-300'}`}>└─</span>
                    )}
                    <div
                      className={`flex-1 rounded-lg px-3 py-1.5 border transition-all duration-300 ${
                        isReceiver
                          ? (lit ? 'border-emerald-400 bg-emerald-50' : 'border-dashed border-slate-200 bg-white')
                          : (lit ? 'border-orange-400 bg-orange-50 shadow-sm' : 'border-slate-200 bg-white')
                      } ${isArrived ? 'scale-[1.02]' : ''}`}
                    >
                      <div className="flex items-center justify-between gap-2">
                        <span className={`text-[11px] font-bold ${lit ? (isReceiver ? 'text-emerald-700' : 'text-orange-800') : 'text-slate-600'}`}>
                          {isReceiver ? '📬 ' : '🔀 '}{node.label}
                        </span>
                        {lit && isArrived && !isReceiver && (
                          <span className="text-[9px] text-orange-500 font-mono animate-pulse">▼ 통과</span>
                        )}
                      </div>
                      <div className="text-[9px] font-mono text-slate-500 mt-0.5 leading-tight">
                        {node.match}
                        {isReceiver && node.channel ? ` · ${node.channel}` : ''}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* 도착 배너 */}
            <div className="mt-3 rounded-lg p-2 border border-slate-200 bg-slate-50 text-[11px] text-slate-600 leading-snug min-h-[38px]">
              {step.focus === 'send' && (
                <span><strong className="text-orange-700">1) 전송</strong> — Prometheus는 라벨만 붙여 밀어준다. 배달 규칙은 아래 트리가 결정.</span>
              )}
              {step.focus === 'tree' && (
                <span><strong className="text-orange-700">2) root 진입</strong> — 매처 없는 root가 모든 알림의 출발점. 자식 routes로 위에서 아래로 분기.</span>
              )}
              {step.focus === 'match' && arrivedNode && (
                <span><strong className="text-orange-700">3) 라벨 매칭</strong> — team=payments → severity=critical 로 좁혀 <code className="bg-orange-100 px-1 rounded">payments-pagerduty</code> 확정.</span>
              )}
              {step.focus === 'receiver' && (
                <span><strong className="text-emerald-700">4) 배달</strong> — 확정된 receiver로 group_by 묶어 전송. 인시던트 1건이 한 통으로.</span>
              )}
              {step.focus === 'pitfall' && (
                <span><strong className="text-red-700">5) 함정</strong> — <code className="bg-red-100 px-1 rounded">continue: true</code> 덕에 severity=critical이 온콜에도 가고, 이어서 team=infra 슬랙까지 도달.</span>
              )}
            </div>
          </div>

          {/* receiver 종류 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="flex items-center gap-2 mb-1.5">
              {RECEIVERS.map((r) => (
                <span key={r.key} className="text-[10px] px-2 py-0.5 rounded bg-white border border-slate-200 text-slate-600">
                  {r.emoji} {r.name}
                </span>
              ))}
            </div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="허브로 돌아가기">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: BRAND }}>III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. Recording + Alerting &gt; Chapter 2. Alertmanager</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Alertmanager 라우팅</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                발생한 알림을 올바른 수신자에게 보내는 <strong>라우팅 트리</strong> — 라벨(severity·team) 기준으로
                <strong> route</strong>를 타고 내려가 <strong>receiver</strong>(slack·pagerduty·email·webhook)로 배달된다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: BRAND_DARK }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(III-2-2)에서는 <strong>Grouping · Silence · Inhibition</strong> — 알림을 묶고, 침묵시키고, 억제하는 법
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동재생 일시정지' : '자동재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: BRAND }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="허브">&larr; 허브</a>
              <a href="./III-2-2.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 III-2-2">III-2-2 Grouping · Silence &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
