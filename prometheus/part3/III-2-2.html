  <!--
    III-2-2. Grouping / Silence / Inhibit
    학습 목표: 알림 폭주를 다루는 Alertmanager의 3대 무기(그룹핑·음소거·억제)를 구분해서 쓴다.
    핵심 비유: "관제탑" — 유사 알림을 한 봉투로 묶고(grouping), 점검 중인 알림은 잠시 끄고(silence), 상위 장애가 하위 소음을 덮는다(inhibit)
    패턴: 좌(LiveDataPane — 알림이 묶이고·꺼지고·억제되는 흐름) / 우(VSCode CodeViewer — alertmanager.yml)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 문제 — 알림 폭주(Alert Storm)',
        desc: '스위치 하나가 죽으면 그 뒤의 수십 개 서비스가 동시에 알림을 쏜다. 개별 알림을 그대로 통지하면 슬랙이 수백 줄로 도배되고, 정작 중요한 원인 알림이 소음에 묻힌다. 사람은 알림이 많아질수록 오히려 무시하게 된다(alert fatigue). 그래서 Alertmanager는 firing 알림을 "그대로 보내지 않고" 그룹핑·억제·음소거로 한 번 가공한 뒤 통지한다.',
        focus: 'storm',
        legend: '가공 없이 개별 통지하면 → 슬랙 도배 → 알림 피로 → 무시',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — 왜 가공이 필요한가',
          lines: [
            '# ────────────────────────────────────────────────',
            '# 상황: node-01 이 다운되면 그 위의 모든 서비스가',
            '#       동시에 firing 상태가 된다.',
            '#',
            '#   NodeDown{node="node-01"}',
            '#   ApiDown{node="node-01", service="api"}',
            '#   ApiDown{node="node-01", service="auth"}',
            '#   ApiDown{node="node-01", service="cart"}',
            '#   HighLatency{node="node-01", service="api"}',
            '#   ... 수십 개 ...',
            '#',
            '# 이걸 개별 메시지로 보내면 슬랙이 도배된다.',
            '# → 진짜 원인(NodeDown)이 소음에 묻힌다.',
            '# ────────────────────────────────────────────────',
            '',
            '# Alertmanager 의 3대 무기로 가공한다:',
            '#   1) grouping   유사 알림을 한 통지로 묶기',
            '#   2) inhibit    상위 알림이 하위 알림을 억제',
            '#   3) silence    점검 중 알림을 일시 음소거',
            '',
            'route:',
            '  receiver: "slack-default"',
            '  # ↓ 이 아래 단계에서 하나씩 채워 나간다',
          ],
          highlight: [17, 18, 19, 20],
        },
      },
      {
        title: 'Step 2. Grouping — group_by 로 묶어 한 번에',
        desc: 'grouping은 같은 라벨 값을 가진 알림을 하나의 통지로 묶는다. group_by에 지정한 라벨(예: alertname, cluster)이 같으면 한 봉투에 담긴다. group_wait은 첫 알림 후 잠깐 기다려 같은 그룹의 형제 알림을 모으는 시간이고, group_interval은 이미 통지한 그룹에 새 멤버가 생겼을 때 다음 통지까지의 간격이다. 너무 크게 묶으면 서로 무관한 알림이 뭉치고, 너무 잘게 묶으면 폭주가 그대로 통과한다.',
        focus: 'group',
        legend: 'group_by 라벨이 같은 알림 → 한 통지로 병합 (group_wait 만큼 대기)',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — route.group_by',
          lines: [
            'route:',
            '  receiver: "slack-default"',
            '',
            '  # ── Grouping: 같은 라벨 조합이면 한 통지로 묶는다',
            '  group_by: ["alertname", "cluster"]',
            '',
            '  # 첫 알림 후 30s 대기 → 형제 알림을 모아서 함께 발송',
            '  group_wait: 30s',
            '',
            '  # 이미 통지한 그룹에 새 멤버가 붙으면 5m 뒤 재통지',
            '  group_interval: 5m',
            '',
            '  # 상황이 그대로면 4h 마다 리마인드(repeat_interval)',
            '  repeat_interval: 4h',
            '',
            '  routes:',
            '    # 팀별로 다른 그룹핑을 줄 수도 있다',
            '    - matchers: [ team="payments" ]',
            '      group_by: ["alertname", "service"]',
            '      receiver: "slack-payments"',
            '',
            '# 함정:',
            '#   group_by: ["..."]  (전부 한 그룹)   → 무관한 알림이 뭉침',
            '#   group_by 미지정                     → 알림마다 개별 통지(폭주)',
          ],
          highlight: [4, 5, 7, 8, 10, 11],
        },
      },
      {
        title: 'Step 3. Inhibition — 상위 장애가 하위 소음을 억제',
        desc: 'inhibition은 상위 원인 알림이 firing이면, 그로 인해 파생된 하위 알림의 통지를 막는 규칙이다. 예를 들어 NodeDown이 켜져 있으면 그 노드의 개별 ServiceDown은 어차피 당연한 결과이므로 통지하지 않는다. source_match(억제하는 쪽)와 target_match(억제당하는 쪽)를 정의하고, equal에 나열한 라벨이 서로 같을 때만 억제가 성립한다. 규칙을 잘못 짜면 중요한 알림까지 숨겨지므로 equal 라벨 매칭을 반드시 검증한다.',
        focus: 'inhibit',
        legend: 'source(상위) firing → equal 라벨 같은 target(하위) 통지 억제',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — inhibit_rules',
          lines: [
            'inhibit_rules:',
            '  # 노드가 죽으면, 그 노드의 개별 서비스 알림은 숨긴다',
            '  - source_matchers: [ alertname="NodeDown" ]',
            '    target_matchers: [ severity="warning" ]',
            '',
            '    # source 와 target 의 이 라벨들이 같을 때만 억제',
            '    equal: ["node"]',
            '',
            '  # critical 이 켜지면 같은 대상의 warning 은 억제',
            '  - source_matchers: [ severity="critical" ]',
            '    target_matchers: [ severity="warning" ]',
            '    equal: ["alertname", "instance"]',
            '',
            '# 동작 예시:',
            '#   NodeDown{node="node-01"}                 ← source firing',
            '#   ApiDown{node="node-01", severity="warning"}  → 억제(숨김)',
            '#   ApiDown{node="node-02", severity="warning"}  → node 다름 → 통지',
            '#',
            '# 함정:',
            '#   equal 라벨 누락  → 엉뚱한 알림까지 싹 억제됨',
            '#   source 가 resolved 되면 억제 해제 → 하위 알림이 되살아남',
          ],
          highlight: [2, 3, 4, 7],
        },
      },
      {
        title: 'Step 4. Silence — 점검 시간 동안 일시 음소거',
        desc: 'silence는 특정 라벨에 매칭되는 알림을 정해진 기간 동안 통지하지 않게 임시로 끄는 장치다. 배포·점검처럼 "지금 울릴 게 뻔한" 알림을 사람이 손으로 잠재울 때 쓴다. 라벨 matcher와 시작/종료 시각, 사유(comment)를 남긴다. 가장 흔한 실수는 종료 시각을 잊고 길게 잡아 두어, 점검이 끝난 뒤에도 실제 장애 알림까지 계속 묵살되는 것이다. 그래서 silence는 짧게 잡고 필요하면 갱신한다.',
        focus: 'silence',
        legend: 'matcher 매칭 알림을 endsAt 까지 음소거 (만료되면 자동 해제)',
        code: {
          lang: 'yaml',
          filename: 'silence — amtool / API 로 생성',
          lines: [
            '# Silence 는 설정 파일이 아니라 런타임에 만든다.',
            '# (amtool CLI 또는 Alertmanager UI / API)',
            '',
            '# ── amtool 로 2시간짜리 silence 생성 ──',
            'amtool silence add \\',
            '  alertname="ApiDown" \\',
            '  service="cart" \\',
            '  --duration="2h" \\',
            '  --comment="cart 배포 점검 (JIRA-1234)" \\',
            '  --author="hoyoung"',
            '',
            '# 활성 silence 목록 확인',
            'amtool silence query',
            '',
            '# 실수로 만든 silence 는 만료 전 취소',
            'amtool silence expire <SILENCE_ID>',
            '',
            '# API 로 만들 때의 payload 형태',
            '# {',
            '#   "matchers": [',
            '#     { "name": "service", "value": "cart", "isRegex": false }',
            '#   ],',
            '#   "startsAt": "2026-08-11T09:00:00Z",',
            '#   "endsAt":   "2026-08-11T11:00:00Z",',
            '#   "comment":  "cart 배포 점검"',
            '# }',
            '',
            '# 함정: endsAt 을 너무 길게 → 점검 후 실제 장애도 계속 묵살',
          ],
          highlight: [5, 6, 7, 8, 9, 10],
        },
      },
      {
        title: 'Step 5. 라이프사이클 — firing → resolved 와 통지 반복',
        desc: '알림은 규칙 조건이 참이 되면 pending을 거쳐 firing이 되고, 조건이 거짓이 되면 resolved로 바뀐다. Alertmanager는 firing 그룹을 repeat_interval마다 다시 통지해 "아직 안 고쳐졌음"을 상기시키고, resolved가 되면 send_resolved 설정에 따라 해제 알림을 보낸다. 결국 grouping은 묶고, inhibit은 파생 소음을 지우고, silence는 사람이 잠재우고, repeat는 잊지 않게 상기시키는 네 축이 함께 알림 피로를 줄인다.',
        focus: 'lifecycle',
        legend: 'firing 유지 → repeat_interval 마다 재통지 · resolved → 해제 통지',
        code: {
          lang: 'yaml',
          filename: 'alertmanager.yml — receiver 와 통지 반복',
          lines: [
            'route:',
            '  receiver: "slack-default"',
            '  group_by: ["alertname", "cluster"]',
            '  group_wait: 30s',
            '  group_interval: 5m',
            '  repeat_interval: 4h        # firing 유지 시 4h 마다 리마인드',
            '',
            'receivers:',
            '  - name: "slack-default"',
            '    slack_configs:',
            '      - channel: "#alerts"',
            '        send_resolved: true   # resolved 되면 해제 알림도 발송',
            '        title: "{{ .CommonLabels.alertname }}"',
            '        text: "{{ .CommonAnnotations.summary }}"',
            '',
            '# 알림 라이프사이클:',
            '#   inactive → pending(for:) → firing → resolved',
            '#',
            '#   firing   : 그룹으로 묶여 통지, repeat_interval 마다 재통지',
            '#   resolved : send_resolved=true 면 "해제됨" 통지',
            '#',
            '# 3대 무기 요약:',
            '#   grouping  : 유사 알림을 한 통지로 (group_by)',
            '#   inhibit   : 상위 장애가 하위 소음을 억제 (equal)',
            '#   silence   : 점검 중 일시 음소거 (endsAt)',
          ],
          highlight: [6, 12, 19, 20],
        },
      },
    ];

    // ── 좌측: 알림이 묶이고·억제되고·음소거되는 흐름 시각화
    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => t + 1), 500);
        return () => clearInterval(id);
      }, [stepIdx]);

      // 원본 알림들 (node-01 장애 시나리오)
      const rawAlerts = [
        { name: 'NodeDown',    node: 'node-01', sev: 'critical', role: 'source' },
        { name: 'ApiDown',     node: 'node-01', sev: 'warning',  svc: 'auth', role: 'child' },
        { name: 'ApiDown',     node: 'node-01', sev: 'warning',  svc: 'cart', role: 'child' },
        { name: 'HighLatency', node: 'node-01', sev: 'warning',  svc: 'api',  role: 'child' },
        { name: 'ApiDown',     node: 'node-02', sev: 'warning',  svc: 'api',  role: 'other' },
      ];

      const focus = step.focus;

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🔔</span>
              <span className="text-xs font-bold text-slate-700">Alertmanager 파이프라인</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">firing → 통지</span>
          </div>

          {/* 단계 배지 */}
          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-2">
              {[
                { key: 'group',   emoji: '🧷', name: 'Grouping', on: focus === 'group' || focus === 'lifecycle' },
                { key: 'inhibit', emoji: '🚫', name: 'Inhibit',  on: focus === 'inhibit' || focus === 'lifecycle' },
                { key: 'silence', emoji: '🔕', name: 'Silence',  on: focus === 'silence' },
                { key: 'notify',  emoji: '📨', name: 'Notify',   on: focus === 'lifecycle' || focus === 'storm' },
              ].map((t) => (
                <div key={t.key}
                  className={`rounded-lg p-2 text-center transition-all duration-300 ${t.on ? 'bg-orange-100 border-2 border-orange-400 scale-105 shadow-sm' : 'bg-slate-50 border border-slate-200'}`}>
                  <div className="text-lg">{t.emoji}</div>
                  <div className="text-[10px] font-bold text-slate-800 mt-1">{t.name}</div>
                </div>
              ))}
            </div>
          </div>

          {/* 본문 */}
          <div className="p-4 min-h-[320px]">

            {/* Step1 storm: 개별 알림이 우르르 */}
            {focus === 'storm' && (
              <div className="space-y-2">
                <div className="text-[11px] font-bold text-red-700 mb-1">💥 node-01 장애 → firing 알림 폭주</div>
                <div className="space-y-1.5">
                  {rawAlerts.map((a, i) => {
                    const visible = i <= tick % 7;
                    return (
                      <div key={i}
                        className={`flex items-center gap-2 rounded px-2 py-1.5 border text-[11px] transition-all duration-300 ${visible ? 'opacity-100 translate-x-0' : 'opacity-20 -translate-x-2'} ${a.sev === 'critical' ? 'bg-red-50 border-red-300' : 'bg-amber-50 border-amber-200'}`}>
                        <span className={`w-2 h-2 rounded-full ${a.sev === 'critical' ? 'bg-red-500' : 'bg-amber-400'}`}></span>
                        <span className="font-mono font-bold text-slate-700">{a.name}</span>
                        <span className="font-mono text-slate-500 text-[10px]">node={a.node}{a.svc ? ` svc=${a.svc}` : ''}</span>
                      </div>
                    );
                  })}
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200 mt-2">
                  개별로 통지하면 슬랙이 이렇게 도배된다. <strong className="text-orange-700">묶고 · 억제하고 · 음소거</strong>해서 한 번에 이해되게 만든다.
                </div>
              </div>
            )}

            {/* Step2 group: 같은 라벨끼리 봉투로 */}
            {focus === 'group' && (
              <div className="space-y-2">
                <div className="text-[11px] font-bold text-slate-700 mb-1">🧷 group_by: [alertname, node] 로 묶기</div>
                <div className="rounded-lg bg-orange-50 border-2 border-orange-300 p-2">
                  <div className="text-[10px] font-mono font-bold text-orange-800 mb-1">📦 그룹 A · ApiDown / node-01 ({tick % 2 === 0 ? '대기중' : '발송'})</div>
                  <div className="space-y-1 pl-2">
                    <div className="text-[10px] font-mono text-slate-600">ApiDown · svc=auth</div>
                    <div className="text-[10px] font-mono text-slate-600">ApiDown · svc=cart</div>
                  </div>
                </div>
                <div className="rounded-lg bg-purple-50 border-2 border-purple-300 p-2">
                  <div className="text-[10px] font-mono font-bold text-purple-800 mb-1">📦 그룹 B · NodeDown / node-01</div>
                  <div className="text-[10px] font-mono text-slate-600 pl-2">NodeDown · critical</div>
                </div>
                <div className="flex items-center justify-center gap-2 text-[10px] text-slate-500 py-1">
                  <span>group_wait 30s</span>
                  <span className="w-16 h-1.5 bg-slate-200 rounded overflow-hidden">
                    <span className="block h-full bg-orange-400 transition-all duration-500" style={{ width: `${((tick % 6) / 5) * 100}%` }}></span>
                  </span>
                  <span>→ 한 통지</span>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  같은 <code className="bg-orange-100 px-1 rounded">alertname+node</code>는 한 봉투로. 너무 크게 묶으면 무관한 알림이 뭉치고, 미지정이면 폭주가 그대로 통과한다.
                </div>
              </div>
            )}

            {/* Step3 inhibit: source가 child를 가림 */}
            {focus === 'inhibit' && (
              <div className="space-y-2">
                <div className="rounded-lg bg-red-50 border-2 border-red-400 p-2 flex items-center gap-2">
                  <span className="text-lg">🔴</span>
                  <div>
                    <div className="text-[11px] font-mono font-bold text-red-800">NodeDown · node=node-01 (source, firing)</div>
                    <div className="text-[10px] text-red-600">이게 켜져 있는 동안 하위 알림을 억제</div>
                  </div>
                </div>
                <div className="text-center text-slate-400 text-lg leading-none">↓ equal:["node"]</div>
                <div className="space-y-1.5">
                  {rawAlerts.filter(a => a.role !== 'source').map((a, i) => {
                    const suppressed = a.node === 'node-01';
                    return (
                      <div key={i}
                        className={`flex items-center gap-2 rounded px-2 py-1.5 border text-[11px] transition-all duration-500 ${suppressed ? 'bg-slate-100 border-slate-200 line-through opacity-50' : 'bg-emerald-50 border-emerald-300'}`}>
                        <span>{suppressed ? '🚫' : '📨'}</span>
                        <span className="font-mono font-bold text-slate-700">{a.name}</span>
                        <span className="font-mono text-slate-500 text-[10px]">node={a.node} svc={a.svc}</span>
                        <span className={`ml-auto text-[9px] font-bold ${suppressed ? 'text-slate-400' : 'text-emerald-600'}`}>{suppressed ? '억제됨' : '통지'}</span>
                      </div>
                    );
                  })}
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <code className="bg-red-100 px-1 rounded">node</code>가 같은 하위 warning만 억제. <strong className="text-emerald-700">node-02</strong>는 무관하므로 살아남는다. equal 누락 시 엉뚱한 알림까지 싹 사라진다.
                </div>
              </div>
            )}

            {/* Step4 silence: matcher가 특정 알림을 끔 */}
            {focus === 'silence' && (
              <div className="space-y-2">
                <div className="rounded-lg bg-slate-800 text-slate-100 p-2 font-mono text-[10px]">
                  <div>🔕 silence: service="cart"</div>
                  <div className="text-slate-400">endsAt: 11:00 · "cart 배포 점검"</div>
                </div>
                <div className="flex items-center justify-center gap-2 text-[10px] text-slate-500 py-1">
                  <span>남은 시간</span>
                  <span className="w-24 h-1.5 bg-slate-200 rounded overflow-hidden">
                    <span className="block h-full bg-orange-400 transition-all duration-500" style={{ width: `${100 - ((tick % 8) / 7) * 100}%` }}></span>
                  </span>
                  <span>만료 → 자동 해제</span>
                </div>
                <div className="space-y-1.5">
                  {rawAlerts.filter(a => a.role !== 'source').map((a, i) => {
                    const silenced = a.svc === 'cart';
                    return (
                      <div key={i}
                        className={`flex items-center gap-2 rounded px-2 py-1.5 border text-[11px] transition-all ${silenced ? 'bg-slate-100 border-slate-200 opacity-50' : 'bg-emerald-50 border-emerald-300'}`}>
                        <span>{silenced ? '🔕' : '📨'}</span>
                        <span className="font-mono font-bold text-slate-700">{a.name}</span>
                        <span className="font-mono text-slate-500 text-[10px]">svc={a.svc}</span>
                        <span className={`ml-auto text-[9px] font-bold ${silenced ? 'text-slate-400' : 'text-emerald-600'}`}>{silenced ? '음소거' : '통지'}</span>
                      </div>
                    );
                  })}
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  matcher(<code className="bg-orange-100 px-1 rounded">service="cart"</code>) 매칭 알림만 침묵. <strong className="text-red-600">endsAt을 길게 잡으면</strong> 점검 후 실제 장애도 계속 묵살되니 짧게 잡는다.
                </div>
              </div>
            )}

            {/* Step5 lifecycle: 상태 전이 */}
            {focus === 'lifecycle' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between gap-1">
                  {['inactive', 'pending', 'firing', 'resolved'].map((s, i) => {
                    const active = (tick % 4) === i;
                    const color = s === 'firing' ? 'red' : s === 'resolved' ? 'emerald' : 'slate';
                    return (
                      <React.Fragment key={s}>
                        <div className={`flex-1 rounded-lg py-2 text-center text-[10px] font-bold transition-all duration-300 border-2 ${active ? `bg-${color}-100 border-${color}-400 scale-105` : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                          {s}
                        </div>
                        {i < 3 && <span className="text-slate-300 text-xs">→</span>}
                      </React.Fragment>
                    );
                  })}
                </div>
                <div className="rounded-lg bg-orange-50 border-2 border-orange-300 p-3 space-y-1.5">
                  <div className="text-[11px] font-bold text-orange-800">📨 통지 타임라인 (repeat_interval 4h)</div>
                  <div className="flex items-center gap-1 mt-1">
                    {Array.from({ length: 6 }).map((_, i) => {
                      const sent = i <= tick % 7;
                      const isResolve = i === 5;
                      return (
                        <div key={i} className="flex-1 flex flex-col items-center">
                          <div className={`w-full h-8 rounded transition-all duration-500 ${sent ? (isResolve ? 'bg-emerald-500' : 'bg-orange-400') : 'bg-slate-100'}`}></div>
                          <div className="text-[8px] text-slate-500 mt-0.5">{isResolve ? '해제' : `+${i * 4}h`}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  firing이 유지되면 <code className="bg-orange-100 px-1 rounded">repeat_interval</code>마다 리마인드, resolved면 <strong className="text-emerald-700">send_resolved</strong>로 해제 통지. 네 무기가 함께 알림 피로를 줄인다.
                </div>
              </div>
            )}
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="챕터 목록으로">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. Recording + Alerting &gt; Chapter 2. Alertmanager</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Grouping / Silence / Inhibit</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                알림 폭주를 다루는 그룹핑·묶음·억제 — <strong>Grouping</strong>(유사 알림 병합) · <strong>Silence</strong>(점검 중 음소거) · <strong>Inhibit</strong>(상위 장애가 하위 소음 억제).
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 Part III 완료. 다음(Part IV)에서는 <strong>실전 운영</strong> — Grafana 연동과 대시보드로 넘어간다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="챕터 목록">&larr; 챕터 목록</a>
              <a href="../part4/IV-1-1.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 IV-1-1">IV-1-1 실전 운영 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
