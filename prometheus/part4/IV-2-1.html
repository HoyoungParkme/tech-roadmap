      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    IV-2-1. file SD — 파일 기반 서비스 디스커버리
    학습 목표: static_configs의 한계를 이해하고 file_sd_configs로 타깃을 동적으로 관리한다.
    핵심 비유: "주소록 파일" — 외부 시스템(CMDB/스크립트)이 targets.json을 갱신하면 Prometheus가 재시작 없이 자동으로 스크랩 대상을 갱신한다.
    패턴: 좌(LiveDataPane — 파일 갱신 → 자동 감지 → 타깃 추가/제거 흐름) / 우(VSCode CodeViewer — yaml/json)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. static_configs 의 한계 — "타깃이 바뀌면 재시작"',
        desc: 'static_configs는 prometheus.yml 안에 타깃 IP를 직접 박아 넣는다. 처음엔 편하지만 서버가 오토스케일로 늘거나 배포로 IP가 바뀌면 매번 설정을 고치고 리로드해야 한다. 실무에서 인스턴스가 수십 대씩 뜨고 지는 클라우드 환경에서는 사람이 손으로 따라갈 수 없다. 그래서 "타깃 목록"을 코드/설정에서 분리해 외부에서 관리할 수단이 필요하다.',
        focus: 'static',
        legend: '타깃이 설정 파일에 하드코딩 → 변경 때마다 수정·리로드 필요',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — static_configs (한계)',
          lines: [
            '# static_configs — 타깃을 설정 파일에 직접 나열',
            '# 문제: 인스턴스가 추가/삭제될 때마다 이 파일을 고쳐야 한다',
            '',
            'scrape_configs:',
            '  - job_name: "api"',
            '    static_configs:',
            '      - targets:',
            '          - "10.0.1.11:9100"   # 손으로 관리',
            '          - "10.0.1.12:9100"   # 오토스케일 되면?',
            '          - "10.0.1.13:9100"   # IP 바뀌면?',
            '        labels:',
            '          env: "prod"',
            '          team: "api"',
            '',
            '# 인스턴스가 뜰 때마다:',
            '#   1) 이 yml 을 수정하고',
            '#   2) SIGHUP 또는 /-/reload 로 리로드',
            '# → 수십 대 규모에서는 사람이 따라갈 수 없다',
          ],
          highlight: [7, 8, 9, 10, 16, 17, 18],
        },
      },
      {
        title: 'Step 2. file_sd_configs 도입 — "타깃을 파일로 분리"',
        desc: 'file_sd_configs는 타깃 목록을 별도 JSON/YAML 파일에서 읽어 온다. prometheus.yml에는 "이 경로의 파일을 보라"고만 적고, 실제 타깃은 targets.json이 갖는다. 핵심 이점은 이 파일이 바뀌면 Prometheus가 재시작 없이 자동으로 다시 읽는다는 것이다. 설정(정책)과 타깃 목록(데이터)을 분리해, 목록은 외부 시스템이 마음껏 갱신할 수 있게 된다.',
        focus: 'filesd',
        legend: 'prometheus.yml 은 "파일 경로"만 → 실제 타깃은 외부 파일이 관리',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — file_sd_configs',
          lines: [
            '# file_sd_configs — 타깃 목록을 외부 파일에서 로드',
            '# prometheus.yml 은 "어떤 파일을 볼지"만 지정한다',
            '',
            'scrape_configs:',
            '  - job_name: "api"',
            '    file_sd_configs:',
            '      - files:',
            '          - "targets/api-*.json"   # glob 패턴 OK',
            '          - "targets/api.yml"',
            '        refresh_interval: 30s        # 파일 재확인 주기',
            '',
            '# 동작:',
            '#   - Prometheus 가 지정 파일들을 감시(watch)',
            '#   - 파일 내용이 바뀌면 재시작 없이 타깃 갱신',
            '#   - refresh_interval 마다 안전하게 재확인',
            '#',
            '# static_configs 와 달리 yml 자체는 거의 안 바뀐다',
            '# → 바뀌는 건 targets/*.json (다음 스텝)',
          ],
          highlight: [6, 7, 8, 9, 10],
        },
      },
      {
        title: 'Step 3. 파일 형식 — "targets + labels 배열"',
        desc: 'file SD 파일은 객체의 배열이다. 각 객체는 targets(호스트:포트 문자열 배열)와 labels(그 타깃들에 공통으로 붙일 레이블 맵)를 갖는다. 하나의 파일에 여러 그룹을 넣어 그룹마다 다른 레이블을 줄 수 있다. 여기서 붙인 레이블은 나중에 쿼리·알림에서 필터 기준이 되므로 env·team·region 같은 키를 일관된 규칙으로 채우는 것이 중요하다.',
        focus: 'format',
        legend: 'JSON 배열: 각 그룹 = { targets: [...], labels: {...} }',
        code: {
          lang: 'json',
          filename: 'targets/api-prod.json',
          lines: [
            '[',
            '  {',
            '    "targets": [',
            '      "10.0.1.11:9100",',
            '      "10.0.1.12:9100"',
            '    ],',
            '    "labels": {',
            '      "env": "prod",',
            '      "team": "api",',
            '      "region": "ap-northeast-2"',
            '    }',
            '  },',
            '  {',
            '    "targets": ["10.0.2.21:9100"],',
            '    "labels": {',
            '      "env": "prod",',
            '      "team": "api",',
            '      "region": "us-east-1"',
            '    }',
            '  }',
            ']',
            '// targets = 스크랩할 host:port 목록',
            '// labels  = 이 그룹 전체에 붙는 공통 레이블',
          ],
          highlight: [3, 4, 5, 7, 8, 9, 10],
        },
      },
      {
        title: 'Step 4. 외부 시스템이 파일을 갱신 — "자동 리로드"',
        desc: 'targets.json을 사람이 손으로 고치는 게 아니라, CMDB·클라우드 API·배포 스크립트가 현재 살아있는 인스턴스 목록을 뽑아 파일로 써 준다. 파일은 원자적으로 교체(임시 파일에 쓴 뒤 rename)해서 반쯤 쓰인 파일을 Prometheus가 읽는 사고를 막는다. 파일이 바뀌면 Prometheus가 즉시 감지해 새 타깃을 스크랩 대상에 추가하고, 사라진 타깃은 제거한다. 재시작이 전혀 필요 없다.',
        focus: 'refresh',
        legend: '스크립트가 파일을 원자적 교체 → Prometheus 즉시 감지 → 타깃 추가/제거',
        code: {
          lang: 'yaml',
          filename: 'gen_targets.sh — 외부 시스템이 파일 생성',
          lines: [
            '#!/usr/bin/env bash',
            '# CMDB/클라우드에서 살아있는 인스턴스를 뽑아 targets.json 생성',
            'set -euo pipefail',
            '',
            'OUT="targets/api-prod.json"',
            'TMP="$(mktemp)"',
            '',
            '# 예: AWS 에서 running 인스턴스의 private IP 조회',
            'aws ec2 describe-instances \\',
            '  --filters "Name=tag:team,Values=api" \\',
            '            "Name=instance-state-name,Values=running" \\',
            '  --query "Reservations[].Instances[].PrivateIpAddress" \\',
            '  --output text \\',
            '| jq -R -s -c \'{',
            '    targets: (split("\\n") | map(select(. != "")) | map(. + ":9100")),',
            '    labels: { env: "prod", team: "api" }',
            '  } | [.]\' > "$TMP"',
            '',
            '# 원자적 교체 — 반쯤 쓰인 파일을 읽지 않도록 rename',
            'mv "$TMP" "$OUT"',
            '',
            '# cron/systemd timer 로 1분마다 실행 → 목록 자동 최신화',
          ],
          highlight: [5, 6, 19, 20],
        },
      },
      {
        title: 'Step 5. relabel 과 조합 · 실무 함정',
        desc: 'file SD가 붙여 준 레이블은 relabel_configs로 다듬을 수 있다. __meta_filepath 같은 메타 레이블로 어느 파일에서 온 타깃인지 알 수 있고, 필요 없는 타깃을 drop 하거나 레이블 이름을 표준화한다. 실무 함정은 넷이다: 파일 JSON 형식 오류(한 글자만 틀려도 그 파일 전체 무시), 경로·권한 문제(Prometheus가 못 읽음), refresh_interval보다 잦은 변경으로 인한 갱신 지연, 그리고 팀마다 제각각인 레이블 키로 인한 쿼리 파편화다.',
        focus: 'relabel',
        legend: 'relabel 로 메타 레이블 활용·표준화 / 형식·권한·지연·레이블 일관성 주의',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — file_sd + relabel',
          lines: [
            'scrape_configs:',
            '  - job_name: "api"',
            '    file_sd_configs:',
            '      - files: ["targets/api-*.json"]',
            '        refresh_interval: 30s',
            '    relabel_configs:',
            '      # 어느 파일에서 왔는지 메타 레이블로 확인',
            '      - source_labels: ["__meta_filepath"]',
            '        target_label: "sd_file"',
            '      # canary 레이블 달린 타깃은 스크랩에서 제외',
            '      - source_labels: ["tier"]',
            '        regex: "canary"',
            '        action: "drop"',
            '',
            '# 실무 함정 체크리스트',
            '#  1) JSON 형식 오류 → 그 파일 전체 무시 (promtool 로 검증)',
            '#  2) 경로/권한     → Prometheus 프로세스가 읽을 수 있는지',
            '#  3) 갱신 지연     → refresh_interval 과 생성 주기 정렬',
            '#  4) 레이블 일관성 → env/team/region 키 규칙 통일',
          ],
          highlight: [6, 7, 8, 9, 10, 11, 12, 13],
        },
      },
    ];

    // file SD 흐름에 등장하는 타깃 — 스텝/틱에 따라 추가·제거를 시뮬레이션
    const BASE_TARGETS = [
      { addr: '10.0.1.11:9100', env: 'prod', team: 'api' },
      { addr: '10.0.1.12:9100', env: 'prod', team: 'api' },
      { addr: '10.0.1.13:9100', env: 'prod', team: 'api' },
    ];

    // ── 좌측: 파일 갱신 → 자동 감지 → 타깃 추가/제거 흐름
    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => t + 1), 900);
        return () => clearInterval(id);
      }, [stepIdx]);

      // refresh 스텝에서만 동적으로 타깃이 추가/제거되는 애니메이션
      const dynamic = step.focus === 'refresh';
      const phase = dynamic ? tick % 4 : 0;
      // phase 0: 3개 / 1: 파일 write 중 / 2: 4개(추가) / 3: 2개(제거)
      let fileTargets = BASE_TARGETS.slice(0, 3);
      let writing = false;
      let changedAddr = null;
      if (dynamic) {
        if (phase === 0) { fileTargets = BASE_TARGETS.slice(0, 3); }
        if (phase === 1) { fileTargets = BASE_TARGETS.slice(0, 3); writing = true; }
        if (phase === 2) { fileTargets = [...BASE_TARGETS.slice(0, 3), { addr: '10.0.1.14:9100', env: 'prod', team: 'api', added: true }]; changedAddr = '10.0.1.14:9100'; }
        if (phase === 3) { fileTargets = BASE_TARGETS.slice(0, 2); changedAddr = '10.0.1.13:9100'; }
      }

      const stageActive = {
        script: step.focus === 'refresh',
        file: ['filesd', 'format', 'refresh', 'relabel'].includes(step.focus),
        prom: ['filesd', 'refresh', 'relabel'].includes(step.focus),
        relabel: step.focus === 'relabel',
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">📁</span>
              <span className="text-xs font-bold text-slate-700">file SD 동적 흐름</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">targets.json → scrape</span>
          </div>

          {/* 파이프라인 4단계 */}
          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-1.5 text-center">
              {[
                { key: 'script', emoji: '🛠', name: '외부 시스템', note: 'CMDB/스크립트' },
                { key: 'file', emoji: '📄', name: 'targets.json', note: 'targets+labels' },
                { key: 'prom', emoji: '🔥', name: 'Prometheus', note: '자동 감지' },
                { key: 'relabel', emoji: '🏷', name: 'relabel', note: '레이블 정리' },
              ].map((s, i) => (
                <div key={s.key} className="flex flex-col items-center">
                  <div className={`w-full rounded-lg p-2 transition-all duration-300 ${stageActive[s.key] ? 'bg-orange-100 border-2 border-orange-400 shadow-sm' : 'bg-slate-50 border border-slate-200 opacity-60'}`}>
                    <div className="text-lg">{s.emoji}</div>
                    <div className="text-[10px] font-bold text-slate-800 mt-0.5 leading-tight">{s.name}</div>
                    <div className="text-[8px] text-slate-500 leading-tight">{s.note}</div>
                  </div>
                  {i < 3 && <div className="text-orange-400 text-xs -mt-4 hidden" />}
                </div>
              ))}
            </div>
            <div className="flex justify-between px-6 mt-1 text-orange-400 text-sm font-bold">
              <span>→</span><span>→</span><span>→</span>
            </div>
          </div>

          {/* 본문 */}
          <div className="p-4 min-h-[300px]">
            {/* Step 1: static 한계 */}
            {step.focus === 'static' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-slate-800 border-2 border-slate-600 p-3 text-slate-100">
                  <div className="text-[11px] font-bold text-slate-300 mb-2 font-mono">prometheus.yml (static_configs)</div>
                  <div className="space-y-1 font-mono text-[11px]">
                    {BASE_TARGETS.map((t) => (
                      <div key={t.addr} className="flex items-center gap-2">
                        <span className="text-orange-400">- targets:</span>
                        <span className="text-emerald-300">{t.addr}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="rounded-lg bg-red-50 border-2 border-red-300 p-3">
                  <div className="text-xs font-bold text-red-800 mb-1">⚠ 인스턴스가 바뀌면?</div>
                  <div className="text-[11px] text-red-700 leading-snug">
                    IP 하나만 바뀌어도 이 파일을 직접 고치고 <code className="bg-red-100 px-1 rounded">/-/reload</code> 를 호출해야 한다. 오토스케일 환경에서는 사람이 따라갈 수 없다.
                  </div>
                </div>
              </div>
            )}

            {/* Step 2: file_sd 도입 */}
            {step.focus === 'filesd' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-slate-800 border-2 border-slate-600 p-3 text-slate-100">
                  <div className="text-[11px] font-bold text-slate-300 mb-1 font-mono">prometheus.yml</div>
                  <div className="font-mono text-[11px] leading-relaxed">
                    <div><span className="text-sky-300">file_sd_configs:</span></div>
                    <div className="pl-3"><span className="text-orange-400">- files:</span> <span className="text-emerald-300">["targets/api-*.json"]</span></div>
                  </div>
                  <div className="text-center text-orange-400 text-lg my-1">↓ 참조</div>
                  <div className="rounded bg-slate-900 border border-slate-700 p-2 font-mono text-[11px]">
                    <span className="text-yellow-300">📄 targets/api-prod.json</span>
                    <span className="text-slate-400"> — 실제 타깃은 여기</span>
                  </div>
                </div>
                <div className="rounded-lg bg-emerald-50 border-2 border-emerald-300 p-3">
                  <div className="text-[11px] text-emerald-800 leading-snug">
                    <strong>설정과 타깃을 분리</strong> — yml 은 "파일 경로"만 갖고, 목록은 외부 파일이 관리한다. 파일이 바뀌면 재시작 없이 자동 반영.
                  </div>
                </div>
              </div>
            )}

            {/* Step 3: 파일 형식 */}
            {step.focus === 'format' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-slate-800 border-2 border-orange-400 p-3">
                  <div className="text-[11px] font-bold text-orange-300 mb-2 font-mono">targets/api-prod.json</div>
                  <div className="space-y-2">
                    {[
                      { targets: ['10.0.1.11:9100', '10.0.1.12:9100'], region: 'ap-northeast-2' },
                      { targets: ['10.0.2.21:9100'], region: 'us-east-1' },
                    ].map((g, gi) => (
                      <div key={gi} className="rounded bg-slate-900 border border-slate-700 p-2">
                        <div className="font-mono text-[11px] space-y-0.5">
                          <div className="text-sky-300">targets:</div>
                          {g.targets.map((t) => (
                            <div key={t} className="pl-3 text-emerald-300">{t}</div>
                          ))}
                          <div className="text-sky-300 mt-1">labels:</div>
                          <div className="pl-3 text-yellow-300">env=prod · team=api · region={g.region}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <strong className="text-orange-700">🏷 labels 는 필터 기준</strong> — 이 레이블이 쿼리·알림의 조건이 된다. env·team·region 키를 팀 공통 규칙으로 채워야 한다.
                </div>
              </div>
            )}

            {/* Step 4: 자동 리로드 애니메이션 */}
            {step.focus === 'refresh' && (
              <div className="space-y-3">
                <div className="flex items-center gap-2 text-[10px] font-mono">
                  <span className={`px-2 py-0.5 rounded ${writing ? 'bg-amber-200 text-amber-800 font-bold' : 'bg-slate-100 text-slate-500'}`}>🛠 스크립트 write</span>
                  <span className="text-orange-400">→</span>
                  <span className="px-2 py-0.5 rounded bg-yellow-100 text-yellow-800">📄 파일 갱신</span>
                  <span className="text-orange-400">→</span>
                  <span className="px-2 py-0.5 rounded bg-orange-100 text-orange-800 font-bold">🔥 자동 감지</span>
                </div>
                <div className="rounded-lg bg-slate-800 border-2 border-orange-400 p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[11px] font-bold text-orange-300 font-mono">현재 스크랩 대상</span>
                    <span className="text-[10px] font-mono text-slate-400">{fileTargets.length} targets {writing ? '(쓰는 중…)' : ''}</span>
                  </div>
                  <div className="space-y-1">
                    {fileTargets.map((t) => {
                      const isAdded = t.added;
                      return (
                        <div key={t.addr} className={`flex items-center gap-2 font-mono text-[11px] rounded px-2 py-1 transition-all duration-500 ${isAdded ? 'bg-emerald-900/60 border border-emerald-500' : 'bg-slate-900 border border-slate-700'}`}>
                          <span className={`w-2 h-2 rounded-full ${isAdded ? 'bg-emerald-400 animate-pulse' : 'bg-orange-400'}`}></span>
                          <span className="text-emerald-300">{t.addr}</span>
                          {isAdded && <span className="ml-auto text-[9px] text-emerald-400 font-bold">+ 추가됨</span>}
                        </div>
                      );
                    })}
                    {phase === 3 && (
                      <div className="flex items-center gap-2 font-mono text-[11px] rounded px-2 py-1 bg-red-900/50 border border-red-600 line-through opacity-70">
                        <span className="w-2 h-2 rounded-full bg-red-500"></span>
                        <span className="text-red-300">10.0.1.13:9100</span>
                        <span className="ml-auto text-[9px] text-red-400 font-bold">− 제거됨</span>
                      </div>
                    )}
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-emerald-50 rounded p-2 border border-emerald-200">
                  <strong className="text-emerald-700">재시작 0회</strong> — 파일을 원자적으로 교체하면 Prometheus 가 즉시 감지해 타깃을 추가/제거한다.
                </div>
              </div>
            )}

            {/* Step 5: relabel */}
            {step.focus === 'relabel' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-slate-800 border-2 border-slate-600 p-3">
                  <div className="text-[11px] font-bold text-slate-300 mb-2 font-mono">relabel_configs 처리</div>
                  <div className="space-y-1.5 font-mono text-[11px]">
                    <div className="flex items-center gap-2">
                      <span className="text-slate-400 w-28 shrink-0">__meta_filepath</span>
                      <span className="text-orange-400">→</span>
                      <span className="text-emerald-300">sd_file="api-prod.json"</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-slate-400 w-28 shrink-0">tier="canary"</span>
                      <span className="text-orange-400">→</span>
                      <span className="text-red-300">action: drop (제외)</span>
                    </div>
                  </div>
                </div>
                <div className="rounded-lg bg-amber-50 border-2 border-amber-300 p-3">
                  <div className="text-xs font-bold text-amber-800 mb-1">⚠ 실무 함정 4</div>
                  <ul className="text-[11px] text-amber-800 leading-snug space-y-0.5">
                    <li>1) JSON 형식 오류 → 그 파일 전체 무시</li>
                    <li>2) 경로/권한 → Prometheus 가 못 읽음</li>
                    <li>3) 갱신 지연 → refresh_interval 과 생성 주기 정렬</li>
                    <li>4) 레이블 키 제각각 → 쿼리 파편화</li>
                  </ul>
                </div>
              </div>
            )}
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];
      const progress = ((stepIdx + 1) / STEPS.length) * 100;

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="챕터 목록으로">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. Exporter + SD &gt; Chapter 2. Service Discovery</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">file SD — 파일 기반 서비스 디스커버리</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                타깃 목록을 파일로 관리해 동적으로 갱신 — 외부 시스템이 <strong>targets.json</strong> 을 쓰면 Prometheus 가 재시작 없이 스크랩 대상을 자동 갱신한다.
              </p>
              {/* 진행바 */}
              <div className="mt-3 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full rounded-full transition-all duration-500" style={{ width: `${progress}%`, background: '#E6522C' }}></div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(IV-2-2)에서는 <strong>Kubernetes SD</strong> — 클러스터 API 로 Pod·Service 타깃을 자동 발견하는 법
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="챕터 목록">&larr; 챕터 목록</a>
              <a href="./IV-2-2.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 IV-2-2 Kubernetes SD">IV-2-2 Kubernetes SD &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
