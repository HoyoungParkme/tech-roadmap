  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->

    @media (min-width: 768px) {

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-1-2. blackbox_exporter — 외부 프로빙 (Black-box Monitoring)
    학습 목표: 밖에서 서비스의 가용성·응답·인증서를 찔러보는 프로빙 파이프라인을 이해한다.
    핵심 비유: "문 밖에서 초인종 누르기" — 안을 몰라도 응답 여부·속도·문패(인증서)를 확인
    패턴: 좌(LiveDataPane — Prometheus→blackbox→외부 URL 프로빙/relabel 주입) / 우(VSCode CodeViewer — yaml/promql)
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      intro: {lang:'yaml', filename:'blackbox_exporter — 실행과 프로브 엔드포인트', lines:[
        '# blackbox_exporter — 밖에서 엔드포인트를 프로빙하는 독립 exporter',
        '# white-box(앱이 /metrics 노출)와 반대: 대상 내부를 몰라도 됨',
        '',
        '# 1) 실행 (Docker)',
        '# docker run -d -p 9115:9115 \\',
        '#   -v $PWD/blackbox.yml:/etc/blackbox_exporter/config.yml \\',
        '#   prom/blackbox-exporter:v0.25.0',
        '',
        '# 2) 프로브 엔드포인트 직접 호출 (사람이 테스트할 때)',
        '#   GET /probe?module=http_2xx&target=https://example.com',
        '#        ^module: 어떤 방식으로 찌를지   ^target: 찌를 대상',
        '',
        '# 3) 지원 프로토콜(module type)',
        '#   http  : URL 응답코드/본문/리다이렉트/인증서',
        '#   tcp   : 포트 열림 + 배너/STARTTLS',
        '#   icmp  : ping 도달성 (root/CAP_NET_RAW 필요)',
        '#   dns   : 특정 레코드 응답 검증',
        '',
        '# 반환 예시 (probe 결과는 metric으로 나옴)',
        '# probe_success 1              → 1=성공 0=실패',
        '# probe_duration_seconds 0.24  → 전체 소요',
        '# probe_http_status_code 200',
      ]},
      module: {lang:'yaml', filename:'blackbox.yml — module 정의 (config.yml)', lines:[
        '# blackbox.yml — exporter 자체 설정. target은 여기 두지 않는다.',
        'modules:',
        '  # 가장 흔한 모듈: 2xx 응답이면 성공',
        '  http_2xx:',
        '    prober: http',
        '    timeout: 5s',
        '    http:',
        '      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]',
        '      valid_status_codes: []        # 비우면 2xx 전체를 성공 처리',
        '      method: GET',
        '      follow_redirects: true',
        '      fail_if_not_ssl: false        # true면 평문 HTTP(TLS 없음)를 실패로',
        '      preferred_ip_protocol: "ip4"  # IPv6 오작동 방지 (실무 함정)',
        '',
        '  # 헬스체크 API가 특정 JSON을 돌려주는지 검증',
        '  http_health:',
        '    prober: http',
        '    http:',
        '      valid_status_codes: [200]',
        '      fail_if_body_not_matches_regexp:',
        '        - \'"status"\\s*:\\s*"ok"\'',
        '',
        '  # DB/브로커 포트가 열려 있는지 (TCP 연결만)',
        '  tcp_connect:',
        '    prober: tcp',
        '    timeout: 5s',
        '',
        '  # ping 도달성 (컨테이너에 CAP_NET_RAW 필요)',
        '  icmp_ping:',
        '    prober: icmp',
      ]},
      relabel: {lang:'yaml', filename:'prometheus.yml — blackbox scrape + relabel', lines:[

          at:'alerts.yml / PromQL — 가용성 알람 L7–9',
          caption:'probe_success가 0인 상태가 5분 이어질 때만 알람이 발동한다.',
          changes:[
            {mark:'new', text:'EndpointDown 알람'},
            {mark:'gone', text:'1회 실패로 인한 오탐'},
          ],
        },
        legend:'for: 5m — 순간 실패로는 깨우지 않는다',
        code:{...CODE.success, highlight:[7,8,9]},
      },
      { ...S4,
        beat:{
          label:'심각도와 문구',
          at:'alerts.yml / PromQL — 가용성 알람 L10–12',
          caption:'severity로 호출 등급을 나누고, 어느 대상이 죽었는지 instance 라벨로 찍는다.',
          changes:[
            {mark:'new', text:'severity=page'},
            {mark:'read', text:'$labels.instance'},
          ],
        },
        legend:'instance 라벨이 있어야 어느 URL 인지 알 수 있다',
        code:{...CODE.success, highlight:[10,11,12]},
      },
      { ...S4,
        beat:{
          label:'30일 가용성 SLO',
          at:'alerts.yml / PromQL — 가용성 알람 L14–15',
          caption:'성공 프로브의 평균이 그대로 가용성 비율이 된다. 별도 계산이 필요 없다.',
          changes:[
            {mark:'new', text:'30일 가용성 수치'},
            {mark:'read', text:'probe_success 이력'},
          ],
        },
        legend:'avg_over_time(probe_success[30d]) = 가용성 SLO',
        code:{...CODE.success, highlight:[14,15]},
      },
      { ...S4,
        beat:{
          label:'전체 소요 시간',
          at:'alerts.yml / PromQL — 가용성 알람 L17–18',
          caption:'probe_duration_seconds는 프로브 한 번의 총 소요 시간이다.',
          changes:[
            {mark:'new', text:'응답 지연 지표'},
            {mark:'read', text:'probe_duration_seconds'},
          ],
        },
        legend:'느려졌는지는 probe_duration_seconds 로 본다',
        code:{...CODE.success, highlight:[17,18]},
      },
      { ...S4,
        beat:{
          label:'단계별 원인 분해',
          at:'alerts.yml / PromQL — 가용성 알람 L20–24',
          caption:'phase 라벨로 DNS·TCP·TLS·서버 처리 중 어디가 느린지 좁힌다.',
          changes:[
            {mark:'new', text:'phase 별 소요 시간'},
            {mark:'changed', text:'느림 → 원인 구간 특정'},
          ],
        },
        legend:'phase 로 resolve·connect·tls·processing 을 갈라 본다',
        code:{...CODE.success, highlight:[20,21,22,23,24]},
      },
      { ...S4,
        beat:{
          label:'상태 코드 감시',
          at:'alerts.yml / PromQL — 가용성 알람 L26–27',
          caption:'성공 코드를 넓게 잡은 모듈은 5xx를 성공으로 넘길 수 있다. 상태 코드를 따로 보면 원인까지 보인다.',
          changes:[
            {mark:'new', text:'5xx 감시 조건'},
            {mark:'read', text:'probe_http_status_code'},
          ],
        },
        legend:'probe_success=0이면 다운, avg_over_time은 그대로 가용성 SLO',
        code:{...CODE.success, highlight:[26,27]},
      },
      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{
          label:'남은 시간 계산법',
          at:'alerts.yml — 인증서 만료 + 함정 체크리스트 L1–2',
          caption:'HTTPS 프로빙은 인증서 만료 시각을 덤으로 준다. 현재 시각을 빼면 남은 초다.',
          changes:[
            {mark:'new', text:'probe_ssl_earliest_cert_expiry'},
            {mark:'read', text:'time()'},
          ],
        },
        legend:'만료 시각 − 현재 시각 = 남은 초',
        code:{...CODE.cert, highlight:[1,2]},
      },
      { ...S5,
        beat:{
          label:'14일 전 경고',
          at:'alerts.yml — 인증서 만료 + 함정 체크리스트 L4–7',
          caption:'남은 시간이 14일 미만인 상태가 1시간 지속되면 경고를 올린다.',
          changes:[
            {mark:'new', text:'TLSCertExpiringSoon 알람'},
            {mark:'gone', text:'말없이 만료되는 인증서'},
          ],
        },
        legend:'임계값 14일 — 갱신할 시간을 남기고 알린다',
        code:{...CODE.cert, highlight:[4,5,6,7]},
      },
      { ...S5,
        beat:{
          label:'등급과 안내 문구',
          at:'alerts.yml — 인증서 만료 + 함정 체크리스트 L8–10',
          caption:'즉시 호출이 아니라 warning으로 두고, 어느 대상인지 문구에 넣는다.',
          changes:[
            {mark:'new', text:'severity=warning'},
            {mark:'read', text:'$labels.instance'},
          ],
        },
        legend:'만료는 예고된 사고 — 호출보다 경고로 충분하다',
        code:{...CODE.cert, highlight:[8,9,10]},
      },
      { ...S5,
        beat:{
          label:'패널용 남은 일수',
          at:'alerts.yml — 인증서 만료 + 함정 체크리스트 L12–13',
          caption:'초를 86400으로 나눠 대시보드에 "며칠 남았는지"로 보여 준다.',
          changes:[
            {mark:'changed', text:'남은 초 → 남은 일수'},
            {mark:'new', text:'대시보드 패널 식'},
          ],
        },
        legend:'대시보드에는 초 대신 남은 일수로 보여 준다',
        code:{...CODE.cert, highlight:[12,13]},
      },
      { ...S5,
        beat:{
          label:'함정 1 — 프로브 위치',
          at:'alerts.yml — 인증서 만료 + 함정 체크리스트 L15–17',
          caption:'방화벽 안에서 찌르면 내부 시야만 본다. 진짜 밖에 둬야 black-box다.',
          changes:[
            {mark:'gone', text:'내부망에서만 프로빙'},
            {mark:'changed', text:'프로브를 외부망·타 리전으로'},
          ],
        },
        legend:'함정 1 — 방화벽 안의 프로브는 사용자 시야를 못 본다',
        code:{...CODE.cert, highlight:[15,16,17]},
      },
      { ...S5,
        beat:{
          label:'함정 2·3 — 타임아웃과 relabel',
          at:'alerts.yml — 인증서 만료 + 함정 체크리스트 L18–20',
          caption:'module timeout을 늘려도 scrape_timeout보다 오래 기다리지 못하고, relabel이 빠지면 조용히 실패한다.',
          changes:[
            {mark:'changed', text:'module timeout ≤ scrape_timeout'},
            {mark:'gone', text:'relabel 3단 누락'},
          ],
        },
        legend:'함정 2·3 — 겹치는 프로브, 빠뜨린 relabel 단계',
        code:{...CODE.cert, highlight:[18,19,20]},
      },
      { ...S5,
        beat:{
          label:'함정 4·5 — 권한과 IP',
          at:'alerts.yml — 인증서 만료 + 함정 체크리스트 L21–22',
          caption:'icmp는 권한이 없으면 항상 실패하고, IP 프로토콜을 안 정하면 IPv6로 헛돈다.',
          changes:[
            {mark:'read', text:'CAP_NET_RAW 필요'},
            {mark:'gone', text:'preferred_ip_protocol 미지정'},
          ],
        },
        legend:'cert_expiry - time() = 만료까지 남은 초, 임계값으로 사전 알림',
        code:{...CODE.cert, highlight:[21,22]},
      },
    ];

    const PROTOCOLS = [
      { key: 'http', emoji: '🌐', name: 'HTTP/S', note: '응답·본문·인증서' },
      { key: 'tcp',  emoji: '🔌', name: 'TCP',    note: '포트 열림' },
      { key: 'icmp', emoji: '📶', name: 'ICMP',   note: 'ping 도달성' },
      { key: 'dns',  emoji: '🧭', name: 'DNS',    note: '레코드 검증' },
    ];

    // 표·정리 보기: 예전 왼쪽 패널에만 있던 표 (그림 아래 접는 상자)
    const PROBE_TARGETS = [
      { url: 'https://example.com',          success: 1, dur: 0.24, certDays: 62 },
      { url: 'https://api.myshop.io/health', success: 1, dur: 0.41, certDays: 11 },
      { url: 'https://checkout.myshop.io',   success: 0, dur: 5.00, certDays: 3 },
    ];
    function RefPanel({ step, stepIdx }) {
      const f = step.focus, out = [];
      if (step.legend) out.push(<p key="lg"><b>이 단계 한 줄:</b> {step.legend}</p>);
      if (f === 'intro') out.push(
        <div key="in">
          <table><thead><tr><th>white-box</th><th>black-box</th></tr></thead>
            <tbody><tr><td>앱이 /metrics 로 내부 수치를 노출. 안은 멀쩡해도 밖에서 안 될 수 있다.</td><td>밖에서 찔러 응답·지연·인증서를 확인. 사용자가 겪는 진짜 가용성.</td></tr></tbody></table>
          <h4>프로토콜 4종</h4>
          <table><thead><tr><th>prober</th><th>확인하는 것</th></tr></thead>
            <tbody>{PROTOCOLS.map((p) => (<tr key={p.key}><td>{p.emoji} {p.name}</td><td>{p.note}</td></tr>))}</tbody></table>
        </div>);
      if (f === 'module') out.push(<p key="md"><code>GET /probe?module=http_2xx&amp;target=https://example.com</code> — module 은 http_2xx / http_health / tcp_connect / icmp_ping 처럼 찌르는 방법, target 은 Prometheus 가 넣어 주는 실제 주소다.</p>);
      if (f === 'relabel') out.push(
        <div key="rl">
          <h4>relabel 3단</h4>
          <table><thead><tr><th>단</th><th>바꾸는 것</th><th>왜</th></tr></thead>
            <tbody>
              <tr><td>1</td><td className="font-mono">__address__ → __param_target</td><td>프로빙 대상을 ?target= 으로</td></tr>
              <tr><td>2</td><td className="font-mono">__param_target → instance</td><td>그래프에서 어느 URL 인지 식별</td></tr>
              <tr><td>3</td><td className="font-mono">(replacement) → __address__</td><td>실제 접속은 blackbox:9115 로</td></tr>
            </tbody></table>
        </div>);
      if (f === 'success' || f === 'cert') out.push(
        <div key="tg">
          <h4>예시 대상 3개</h4>
          <table><thead><tr><th>대상</th><th>probe_success</th><th>소요</th><th>인증서</th></tr></thead>
            <tbody>{PROBE_TARGETS.map((t) => (<tr key={t.url}><td className="font-mono">{t.url}</td><td>{t.success}</td><td className="font-mono">{t.dur.toFixed(2)}s</td><td>{t.certDays}일{t.certDays <= 14 ? ' (14일 이하 경고)' : ''}</td></tr>))}</tbody></table>
          {f === 'success' && <p className="mt-1">가용성 SLO = <code>avg_over_time(probe_success[30d])</code>. 그림의 99.93% 는 15초 간격 172800번 중 120번 실패라는 예시로 계산했다.</p>}
        </div>);
      if (f === 'cert') out.push(
        <div key="pf">
          <h4>실무 함정 체크리스트</h4>
          <ul>
            <li>프로브 위치: 방화벽 안이면 외부 사용자 시야를 못 본다. 다른 리전·외부망에 둔다.</li>
            <li>timeout: 실제 한도는 module timeout 과 scrape_timeout(기본 10초) 중 짧은 쪽.</li>
            <li>relabel 3단 누락: 대상 URL 을 직접 긁거나 target 이 비어 실패한다.</li>
            <li>icmp 모듈은 CAP_NET_RAW 권한이 필요하다.</li>
            <li>preferred_ip_protocol 기본값은 ip6. 미지정 시 IPv6 로 헛돌 수 있다.</li>
          </ul>
          {stepIdx === STEPS.length - 1 && <p className="mt-1">다음 장: <a href="./IV-2-1.html">IV-2-1 Service Discovery</a> — target 을 정적 리스트가 아니라 동적으로 발견하는 방법.</p>}
        </div>);
      return out.length ? <div>{out}</div> : null;
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
