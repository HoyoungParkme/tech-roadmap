    핵심 비유: "출입 명부 자동화" — API 서버가 명부(파드/서비스)를 주면, relabel이 문지기가 되어 필요한 대상만 통과시킨다.
    패턴: 좌(LiveDataPane — API 발견 → relabel 필터 → 대상 목록 애니메이션) / 우(VSCode CodeViewer — kubernetes_sd yaml)
  -->

      {

            '# 어노테이션은 그 자체론 아무 일도 안 한다',

          ],
          highlight: [10, 12, 14],
        },
      },
      {
        title: 'Step 3. relabel_configs — 메타 레이블을 실제 레이블로',
        desc: 'API 서버가 준 정보는 __meta_kubernetes_* 라는 임시 메타 레이블로 붙어 온다. 이건 발견용 재료일 뿐, 그대로 두면 스크랩도 안 되고 저장도 안 된다. relabel_configs가 이 메타 레이블을 읽어 대상 후보를 걸러내고(keep), 주소·경로를 조립하고, 파드 이름·네임스페이스 같은 값을 진짜 레이블로 승격시킨다. Kubernetes SD의 난이도 대부분이 여기 있다 — relabel을 못 읽으면 왜 대상이 안 잡히는지 영원히 모른다.',
        focus: 'relabel',
        legend: '__meta_kubernetes_* → keep 필터 → 주소 조립 → 실제 레이블',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — relabel_configs',
          lines: [
            '    relabel_configs:',
            '      # 1) 어노테이션 scrape=true 인 파드만 남긴다 (나머지 버림)',
            '      - source_labels:',
            '          [__meta_kubernetes_pod_annotation_prometheus_io_scrape]',
            '        action: keep',
            '        regex: "true"',
            '',
            '      # 2) path 어노테이션이 있으면 __metrics_path__ 로',
            '      - source_labels:',
            '          [__meta_kubernetes_pod_annotation_prometheus_io_path]',
            '        action: replace',
            '        target_label: __metrics_path__',

            '',
            '      # 3) IP 와 port 어노테이션을 합쳐 스크랩 주소 완성',
            '      - source_labels:',
            '          [__address__,',
            '           __meta_kubernetes_pod_annotation_prometheus_io_port]',
            '        action: replace',
            '        target_label: __address__',
            '        regex: "([^:]+)(?::\\d+)?;(\\d+)"',
            '        replacement: "$1:$2"',
            '',
            '      # 4) 메타 → 사람이 보는 실제 레이블로 승격',

            '      - source_labels: [__meta_kubernetes_pod_name]',
            '        target_label: pod',
          ],
          highlight: [1, 3, 4, 5, 6],
        },
      },
      {
        title: 'Step 4. 동적 반영 — 파드가 뜨고 죽으면 즉시 갱신',
        desc: '쿠버네티스에서 파드는 배포·오토스케일·장애로 수시로 생겼다 사라진다. Kubernetes SD는 API 서버의 watch를 통해 이 변화를 거의 실시간으로 받아, 대상 목록을 자동으로 더하고 뺀다. 새 파드는 다음 스크랩 주기에 자동 편입되고, 죽은 파드는 목록에서 빠져 up 지표가 사라진다. 이 자동성 덕분에 정적 SD와 달리 "리로드 깜빡"으로 인한 모니터링 공백이 없다.',

        legend: 'watch 이벤트로 대상 목록을 실시간 add / remove',

          lang: 'yaml',
          filename: 'kubectl — 스케일 변화가 대상에 반영',
          lines: [
            '# 파드 3개 → 5개로 스케일',
            '$ kubectl scale deploy/payment-api --replicas=5',
            'deployment.apps/payment-api scaled',
            '',
            '# Prometheus 는 API watch 로 새 파드 2개를 자동 발견',
            '#  → 다음 스크랩 주기에 targets 에 편입 (설정 리로드 불필요)',
            '',
            '# Targets 상태 확인 (API)',
            '$ curl -s localhost:9090/api/v1/targets | jq ".data.activeTargets | length"',
            '5',
            '',
            '# 파드 하나가 죽으면?',
            '$ kubectl delete pod payment-api-7c9f-abcde',
            '#  → watch DELETE 이벤트 → 대상에서 제거',
            '#  → 해당 up 시계열은 stale 처리되어 사라진다',
            '',
            '# 정적(static_configs)이었다면 매번 파일 고치고 리로드해야 했다',
            '# 동적 SD 는 그 수작업을 통째로 없앤다',
          ],
          highlight: [5, 6, 14, 15],
        },
      },
      {
        title: 'Step 5. Prometheus Operator · ServiceMonitor',
        desc: 'relabel_configs를 손으로 쓰는 건 강력하지만 실수가 잦고 팀 간 공유가 어렵다. Prometheus Operator는 이 복잡함을 ServiceMonitor·PodMonitor라는 쿠버네티스 CRD로 감싼다. 앱 팀은 셀렉터·포트·경로만 선언하면 되고, Operator가 그걸 읽어 실제 relabel 설정을 생성·주입한다. 즉 "긁을 대상 명세"를 매니페스트로 관리(GitOps)하게 되어, 운영자가 중앙 prometheus.yml을 직접 손대는 일이 사라진다.',
        focus: 'operator',
        legend: 'ServiceMonitor(CRD) → Operator 가 relabel 설정을 자동 생성',
        code: {
          lang: 'yaml',
          filename: 'servicemonitor.yaml — Operator 방식',
          lines: [
            '# Prometheus Operator: relabel 을 직접 안 쓰고 CRD 로 선언',
            'apiVersion: monitoring.coreos.com/v1',
            'kind: ServiceMonitor',
            'metadata:',
            '  name: payment-api',
            '  labels:',

            '  # 어떤 Service 를 대상으로 할지 라벨로 선택',

            '  endpoints:',
            '    - port: http-metrics       # Service 포트 "이름"',
            '      path: /actuator/prometheus',
            '      interval: 15s',
            '',
            '# Operator 가 이 CRD 를 읽어',
            '#  → 내부적으로 relabel_configs 를 생성해 Prometheus 에 주입',
            '# 앱 팀은 relabel 문법을 몰라도 된다 (GitOps 친화)',
          ],
          highlight: [2, 3, 10, 11, 12, 14, 15],
        },
      },
      {
        title: 'Step 6. 실무 함정 — 과다 발견 · RBAC · 카디널리티',
        desc: 'Kubernetes SD는 편하지만 방심하면 사고가 난다. keep 필터를 빼먹으면 클러스터의 모든 파드를 긁으려다 부하가 폭증한다(과다 발견). Prometheus 서비스 어카운트에 pods·endpoints list/watch 권한(RBAC)이 없으면 아무 대상도 안 잡히는데 에러가 조용하다. 또 pod_name·pod_ip 같은 고유값을 그대로 레이블로 승격하면 시계열이 폭발(카디널리티)해 메모리를 잡아먹는다. relabel로 걸러내고, 승격할 레이블을 신중히 고르는 것이 핵심이다.',
        focus: 'pitfall',
        legend: 'keep 로 필터 · RBAC 권한 · 고유값 레이블 승격 주의',
        code: {
          lang: 'yaml',
          filename: 'rbac.yaml — 최소 권한 + 필터 주의',
          lines: [
            '# 함정 1) 과다 발견 — keep 를 빼면 전체 파드를 긁는다',
            '#   반드시 scrape=true 로 좁히거나 namespaces 로 범위 제한',
            '    kubernetes_sd_configs:',
            '      - role: pod',
            '        namespaces:',
            '          names: ["prod", "payment"]   # 발견 범위 제한',
            '',
            '# 함정 2) RBAC — 이 권한이 없으면 조용히 0 targets',
            '---',
            'apiVersion: rbac.authorization.k8s.io/v1',
            'kind: ClusterRole',
            'metadata:',
            '  name: prometheus',
            'rules:',
            '  - apiGroups: [""]',
            '    resources: ["pods", "services", "endpoints", "nodes"]',
            '    verbs: ["get", "list", "watch"]   # list/watch 필수',

            '# 함정 3) 카디널리티 — 고유값을 레이블로 올리지 말 것',
            '#   pod_ip, pod_name 남발 → 시계열 폭발 → OOM',

    const ROLES = [
      { key: 'pod',       emoji: '📦', name: 'pod',       note: '파드 단위' },
      { key: 'endpoints', emoji: '🔌', name: 'endpoints', note: '서비스 뒤 파드' },
      { key: 'service',   emoji: '🧭', name: 'service',   note: 'ClusterIP' },
      { key: 'node',      emoji: '🖥', name: 'node',      note: 'kubelet' },
    ];

    // 발견된 파드 후보 (scrape 어노테이션 유무 표시)
    const DISCOVERED = [
      { name: 'payment-api-7c9f-aa', ns: 'payment', scrape: true,  port: '8080' },
      { name: 'payment-api-7c9f-bb', ns: 'payment', scrape: true,  port: '8080' },
      { name: 'redis-cache-55d-x1',  ns: 'payment', scrape: false, port: '6379' },
      { name: 'order-api-9ab-c2',    ns: 'order',   scrape: true,  port: '9090' },
      { name: 'batch-job-3ff-zz',    ns: 'order',   scrape: false, port: '—'    },
    ];

    // ── 좌측: 쿠버네티스 자동 발견 파이프라인 시각화
    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      const focus = step.focus;

      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, [stepIdx]);

      // dynamic 단계: 파드 수를 tick 에 따라 3 → 5 로 늘렸다 줄임
      const replicaCount = focus === 'dynamic' ? [3, 3, 4, 5, 5, 5, 4][tick % 7] : DISCOVERED.length;

      // relabel/operator/pitfall 에서는 필터 통과 대상만
      const keepFilter = focus === 'relabel' || focus === 'operator' || focus === 'pitfall';

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">☸️</span>
              <span className="text-xs font-bold text-slate-700">Kubernetes 자동 발견</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">API server → targets</span>
          </div>

          {/* role 카드 — roles 단계에서 강조 */}
          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-2">
              {ROLES.map((r) => {
                const active = focus === 'roles' && (tick % ROLES.length) === ROLES.indexOf(r);
                const dim = focus !== 'roles';
                return (
                  <div
                    key={r.key}
                    className={`rounded-lg p-2 text-center transition-all duration-300 ${active ? 'bg-orange-100 border-2 border-orange-400 scale-105 shadow-sm' : dim ? 'bg-slate-50 border border-slate-200 opacity-70' : 'bg-slate-50 border border-slate-200'}`}
                  >
                    <div className="text-lg">{r.emoji}</div>
                    <div className="text-[10px] font-bold text-slate-800 mt-0.5">{r.name}</div>
                    <div className="text-[8px] text-slate-500 leading-tight">{r.note}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 파이프라인: API 서버 → relabel 문지기 → 대상 */}
          <div className="p-4 min-h-[300px]">
            <div className="flex items-stretch gap-2">

              {/* 좌: API 서버가 발견한 파드들 */}
              <div className="flex-1">
                <div className="text-[10px] font-bold text-slate-500 mb-1 text-center">
                  API 서버 발견 {focus === 'dynamic' ? `(${replicaCount} 파드)` : ''}
                </div>
                <div className="space-y-1.5">
                  {DISCOVERED.map((p, i) => {
                    // dynamic: replicaCount 만큼만 payment 파드를 보임 (간단화: 앞에서부터)
                    const hiddenByScale = focus === 'dynamic' && i >= replicaCount;
                    const isNew = focus === 'dynamic' && i >= 3 && i < replicaCount;
                    return (
                      <div
                        key={p.name}
                        className={`rounded-md border px-2 py-1 text-[9px] font-mono transition-all duration-500 ${hiddenByScale ? 'opacity-20 border-dashed border-slate-300 bg-slate-50' : isNew ? 'border-emerald-400 bg-emerald-50 shadow-sm' : 'border-slate-300 bg-white'}`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-slate-700 truncate">{p.name}</span>
                          {isNew && <span className="text-emerald-600 text-[8px] ml-1 shrink-0">＋new</span>}
                        </div>
                        <div className="flex items-center gap-1 mt-0.5">
                          <span className="text-slate-400">ns={p.ns}</span>
                          {focus === 'annotation' && (
                            <span className={p.scrape ? 'text-emerald-600 font-bold' : 'text-slate-400'}>
                              scrape={String(p.scrape)}
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* 중앙: relabel 문지기 */}
              <div className="flex flex-col items-center justify-center px-1">
                <div className={`rounded-lg px-2 py-3 text-center transition-all duration-300 ${keepFilter ? 'bg-orange-500 text-white shadow-md scale-105' : 'bg-slate-200 text-slate-500'}`}>
                  <div className="text-lg leading-none">🚦</div>
                  <div className="text-[8px] font-bold mt-1 leading-tight">relabel<br/>keep</div>
                </div>
                <div className="text-[16px] text-slate-400 my-1">→</div>
              </div>

              {/* 우: 실제 스크랩 대상 */}
              <div className="flex-1">
                <div className="text-[10px] font-bold text-slate-500 mb-1 text-center">스크랩 대상 (up)</div>
                <div className="space-y-1.5">
                  {DISCOVERED.map((p, i) => {
                    const hiddenByScale = focus === 'dynamic' && i >= replicaCount;
                    // 통과 조건: annotation 이후 단계에서는 scrape=true 만
                    const passes = focus === 'roles' ? true
                      : focus === 'annotation' ? p.scrape
                      : p.scrape;
                    const show = passes && !hiddenByScale;
                    if (!show) {
                      return (
                        <div key={p.name} className="rounded-md border border-dashed border-slate-200 px-2 py-1 text-[9px] font-mono text-slate-300 bg-slate-50 flex items-center justify-between">
                          <span className="truncate">{p.name.split('-').slice(0,2).join('-')}</span>
                          <span className="text-[8px]">✕ drop</span>
                        </div>
                      );
                    }
                    return (
                      <div key={p.name} className="rounded-md border border-emerald-300 bg-emerald-50 px-2 py-1 text-[9px] font-mono transition-all duration-500">
                        <div className="flex items-center justify-between">
                          <span className="text-emerald-800 font-bold truncate">{p.name.split('-').slice(0,2).join('-')}:{p.port}</span>
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 shrink-0"></span>
                        </div>
                        {(focus === 'relabel' || focus === 'operator' || focus === 'pitfall') && (
                          <div className="text-[8px] text-slate-500 mt-0.5">namespace="{p.ns}" pod="…"</div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* 하단 상태 배지 */}
            <div className="mt-3 rounded-lg bg-slate-50 border border-slate-200 p-2 text-[10px] text-slate-600 leading-snug">
              {focus === 'roles' && (<><strong className="text-orange-700">role 선택</strong> — API 서버에서 pod/endpoints/service/node 중 무엇을 발견할지 정한다. 정적 목록 없이 클러스터 상태가 곧 대상.</>)}
              {focus === 'annotation' && (<><strong className="text-orange-700">어노테이션 필터</strong> — <code className="bg-orange-100 px-1 rounded">scrape="true"</code> 를 단 파드만 대상 후보. redis·batch 처럼 없는 파드는 후보에서 제외된다.</>)}
              {focus === 'relabel' && (<><strong className="text-orange-700">relabel 파이프라인</strong> — <code className="bg-orange-100 px-1 rounded">__meta_kubernetes_*</code> 를 keep 로 거르고 주소를 조립, namespace·pod 를 실제 레이블로 승격.</>)}
              {focus === 'dynamic' && (<><strong className="text-emerald-700">동적 반영</strong> — 스케일·장애로 파드가 뜨고 죽으면 watch 로 대상 목록이 자동 add/remove. 리로드 불필요.</>)}
              {focus === 'operator' && (<><strong className="text-orange-700">ServiceMonitor</strong> — Operator 가 CRD 를 읽어 relabel 을 자동 생성. 앱 팀은 셀렉터·포트만 선언하면 된다.</>)}
              {focus === 'pitfall' && (<><strong className="text-red-700">함정</strong> — keep 없으면 과다 발견, RBAC 없으면 0 targets, 고유값 승격은 카디널리티 폭발.</>)}
            </div>
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="챕터 목록으로 돌아가기">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. Exporter + SD &gt; IV-2-2</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Kubernetes SD — 자동 발견</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                쿠버네티스의 파드·서비스를 자동으로 스크랩 대상으로 —
                <strong> API 서버 발견</strong> → <strong>어노테이션 선언</strong> → <strong>relabel 필터</strong> → <strong>동적 반영</strong>.
                정적 목록 없이 클러스터 상태가 곧 모니터링 대상이 된다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(V-1-1)부터는 <strong>PromQL</strong> — 수집한 지표를 실제로 질의하고 알람으로 잇는 단계로 넘어간다.
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="챕터 목록">&larr; 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 V-1-1">V-1-1 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
