<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus 학습 — I-1-1. Metric Type 4종</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📊</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-1-1. Metric Type 4종 (Counter / Gauge / Histogram / Summary)
    학습 목표: 4가지 metric type의 의미와 쓰임을 구분한다.
    핵심 비유: "계량기 4종" — 전기 누적(counter) / 온도계(gauge) / 응답시간 히스토그램(histogram) / 분포 요약(summary)
    패턴: 좌(LiveDataPane — 4 type 시각화) / 우(VSCode CodeViewer — /metrics expose 포맷)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      counter: {lang:'yaml', filename:'/metrics — Counter expose 포맷', lines:[
        '# Counter — 단조 증가만 가능 (감소 불가, 재시작 시 0)',
        '# 용도: 요청 수, 에러 수, 처리 바이트, 발행 이벤트 수',
        '',
        '# HELP http_requests_total Total HTTP requests',
        '# TYPE http_requests_total counter',
        'http_requests_total{method="GET",status="200"} 1027',
        'http_requests_total{method="POST",status="200"} 412',
        'http_requests_total{method="POST",status="500"} 3',
        '',
        '# HELP errors_total Total errors',
        '# TYPE errors_total counter',
        'errors_total{kind="db_timeout"} 8',
        'errors_total{kind="upstream_5xx"} 21',
        '',
        '# Python client',
        'from prometheus_client import Counter',
        '',
        'requests_total = Counter(',
        '    "http_requests_total",',
        '    "Total HTTP requests",',
        '    ["method", "status"],',
        ')',
        '',
        '@app.middleware("http")',
        'async def metrics(request, call_next):',
        '    resp = await call_next(request)',
        '    requests_total.labels(',
        '        method=request.method,',
        '        status=str(resp.status_code),',
        '    ).inc()                # ← 단조 증가만',
        '    return resp',
        '',
        '# 쿼리는 보통 rate()로:',
        '# rate(http_requests_total[5m])  → 초당 요청 수',
      ]},
      gauge: {lang:'yaml', filename:'/metrics — Gauge expose 포맷', lines:[
        '# Gauge — 자유로운 증감 (현재값 측정)',
        '# 용도: 메모리, 활성 커넥션, 큐 길이, CPU 사용률, 온도',
        '',
        '# HELP process_resident_memory_bytes Resident memory in bytes',
        '# TYPE process_resident_memory_bytes gauge',
        'process_resident_memory_bytes 134217728',
        '',
        '# HELP db_pool_active Active DB connections',
        '# TYPE db_pool_active gauge',
        'db_pool_active{pool="primary"} 12',
        'db_pool_active{pool="replica"} 3',
        '',
        '# HELP queue_depth Pending messages',
        '# TYPE queue_depth gauge',
        'queue_depth{queue="emails"} 47',
        '',
        '# Python client',
        'from prometheus_client import Gauge',
        '',
        'pool_active = Gauge(',
        '    "db_pool_active",',
        '    "Active DB connections",',
        '    ["pool"],',
        ')',
        '',
        '# 증감 API 모두 사용 가능',
        'pool_active.labels(pool="primary").inc()        # +1',
        'pool_active.labels(pool="primary").dec()        # -1',
        'pool_active.labels(pool="primary").set(12)      # 절대값 설정',
        '',
        '# 쿼리는 그대로 (rate 불필요):',
        '# db_pool_active{pool="primary"}',
        '# avg_over_time(queue_depth[5m])',
      ]},
      histogram: {lang:'yaml', filename:'/metrics — Histogram expose 포맷', lines:[
        '# Histogram — bucket(누적) + _sum + _count 세 묶음',
        '# 용도: 응답시간, payload 크기 등 "분포" 분석',
        '',
        '# HELP http_request_duration_seconds Request latency',
        '# TYPE http_request_duration_seconds histogram',
        'http_request_duration_seconds_bucket{le="0.05"}  120',
        'http_request_duration_seconds_bucket{le="0.1"}   340',
        'http_request_duration_seconds_bucket{le="0.25"}  620',
        'http_request_duration_seconds_bucket{le="0.5"}   810',
        'http_request_duration_seconds_bucket{le="1.0"}   950',
        'http_request_duration_seconds_bucket{le="+Inf"}  1000   # 전체',
        'http_request_duration_seconds_sum    180.42',
        'http_request_duration_seconds_count  1000',
        '',
        '# Python client',
        'from prometheus_client import Histogram',
        '',
        'latency = Histogram(',
        '    "http_request_duration_seconds",',
        '    "Request latency",',
        '    buckets=(0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0),',
        ')',
        '',
        'with latency.time():',
        '    handle(request)             # 자동으로 elapsed 측정',
        '',
        '# 쿼리 — p95 응답시간 (서버 측 계산, 여러 instance 합산 가능)',
        'histogram_quantile(',
        '  0.95,',
        '  sum by (le) (',
        '    rate(http_request_duration_seconds_bucket[5m])',
        '  )',
        ')',
      ]},
      summary: {lang:'yaml', filename:'/metrics — Summary expose 포맷', lines:[
        '# Summary — client에서 quantile 미리 계산 (집계 불가)',
        '# 용도: legacy 시스템 호환 / 단일 instance 정밀 quantile',
        '',
        '# HELP rpc_duration_seconds RPC latency',
        '# TYPE rpc_duration_seconds summary',
        'rpc_duration_seconds{quantile="0.5"}   0.012',

      }, [stepIdx]);

      // counter 데이터 — 매 tick마다 +N
      const counterSeries = Array.from({ length: 16 }, (_, i) => {
        if (i > tick) return null;
        return 5 + i * 4 + (i % 3) * 2;
      }).filter(v => v !== null);

      // gauge 데이터 — sin
      const gaugeSeries = Array.from({ length: 16 }, (_, i) => {
        if (i > tick) return null;
        return 50 + Math.sin(i * 0.7) * 25 + Math.cos(i * 0.4) * 8;
      }).filter(v => v !== null);

      // histogram bucket — 누적 분포
      const buckets = [
        { le: '0.05', count: 120 },
        { le: '0.1',  count: 340 },
        { le: '0.25', count: 620 },
        { le: '0.5',  count: 810 },
        { le: '1.0',  count: 950 },
        { le: '+Inf', count: 1000 },
      ];

      // summary quantile — pre-calculated
      const quantiles = [
        { q: '0.5',  v: 0.012, h: 12 },
        { q: '0.9',  v: 0.041, h: 41 },
        { q: '0.95', v: 0.072, h: 60 },
        { q: '0.99', v: 0.118, h: 85 },
      ];

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">📊</span>
              <span className="text-xs font-bold text-slate-700">4 Metric Type</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">/metrics expose</span>
          </div>

          {/* 4 type 카드 — 현재 focus 강조 */}
          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-2">
              {TYPES.map((t) => {
                const active = step.focus === t.key;
                return (
                  <div
                    key={t.key}
                    className={`rounded-lg p-2 text-center transition-all duration-300 ${active ? 'bg-orange-100 border-2 border-orange-400 scale-105 shadow-sm' : 'bg-slate-50 border border-slate-200'}`}
                  >
                    <div className="text-xl">{t.emoji}</div>
                    <div className="text-[11px] font-bold text-slate-800 mt-1">{t.name}</div>
                    <div className="text-[9px] text-slate-500 mt-0.5 leading-tight">{t.note}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 본문 시각화 */}
          <div className="p-4 min-h-[300px]">
            {/* Counter: 단조 증가 라인 */}
            {step.focus === 'counter' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-orange-50 border-2 border-orange-300 p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-orange-800">http_requests_total (counter)</span>
                    <span className="text-[10px] font-mono text-orange-600">현재값 {counterSeries[counterSeries.length - 1] || 0}</span>
                  </div>
                  <div className="h-32 bg-white rounded border border-orange-200 p-2 relative">
                    <svg viewBox="0 0 240 100" preserveAspectRatio="none" className="w-full h-full">
                      <line x1="0" y1="80" x2="240" y2="80" stroke="#e5e7eb" />
                      {counterSeries.length > 1 && (
                        <polyline
                          fill="none"
                          stroke="#E6522C"
                          strokeWidth="2"
                          points={counterSeries.map((v, i) => `${(i / 15) * 240},${90 - (v / 100) * 80}`).join(' ')}
                        />
                      )}
                      {counterSeries.map((v, i) => (
                        <circle key={i} cx={(i / 15) * 240} cy={90 - (v / 100) * 80} r="2" fill="#E6522C" />
                      ))}
                    </svg>
                    <div className="absolute bottom-1 right-2 text-[9px] font-mono text-slate-500">시간 →</div>
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <strong className="text-orange-700">⏫ 단조 증가만</strong> — 한번 올라가면 내려오지 않는다. 재시작 시 0으로 리셋. 의미를 보려면 <code className="bg-orange-100 px-1 rounded">rate()</code>로 초당 증가율을 본다.
                </div>
              </div>
            )}

            {/* Gauge: 출렁이는 라인 */}
            {step.focus === 'gauge' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-sky-50 border-2 border-sky-300 p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-sky-800">db_pool_active (gauge)</span>
                    <span className="text-[10px] font-mono text-sky-600">현재값 {(gaugeSeries[gaugeSeries.length - 1] || 0).toFixed(0)}</span>
                  </div>
                  <div className="h-32 bg-white rounded border border-sky-200 p-2 relative">
                    <svg viewBox="0 0 240 100" preserveAspectRatio="none" className="w-full h-full">
                      <line x1="0" y1="50" x2="240" y2="50" stroke="#e5e7eb" strokeDasharray="2 3" />
                      {gaugeSeries.length > 1 && (
                        <polyline
                          fill="none"
                          stroke="#0284c7"
                          strokeWidth="2"
                          points={gaugeSeries.map((v, i) => `${(i / 15) * 240},${90 - (v / 100) * 80}`).join(' ')}
                        />
                      )}
                      {gaugeSeries.map((v, i) => (
                        <circle key={i} cx={(i / 15) * 240} cy={90 - (v / 100) * 80} r="2" fill="#0284c7" />
                      ))}
                    </svg>
                    <div className="absolute bottom-1 right-2 text-[9px] font-mono text-slate-500">시간 →</div>
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <strong className="text-sky-700">🌡 자유 증감</strong> — 메모리, 연결 수, 큐 길이처럼 "지금 얼마"가 중요한 값. <code className="bg-sky-100 px-1 rounded">.inc()</code> / <code className="bg-sky-100 px-1 rounded">.dec()</code> / <code className="bg-sky-100 px-1 rounded">.set()</code> 모두 사용.
                </div>
              </div>
            )}

            {/* Histogram: bucket 누적 막대 */}
            {step.focus === 'histogram' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-purple-50 border-2 border-purple-300 p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-purple-800">http_request_duration_seconds (histogram)</span>
                    <span className="text-[10px] font-mono text-purple-600">total 1000</span>
                  </div>
                  <div className="h-40 bg-white rounded border border-purple-200 p-2 flex items-end gap-1.5">
                    {buckets.map((b, i) => {
                      const visible = i <= tick;
                      const h = (b.count / 1000) * 100;
                      const p95cut = b.count >= 950;
                      return (
                        <div key={b.le} className="flex-1 flex flex-col items-center justify-end h-full">
                          <div
                            className={`w-full rounded-t transition-all duration-500 ${visible ? (p95cut ? 'bg-red-500' : 'bg-purple-500') : 'bg-slate-100'}`}
                            style={{ height: visible ? `${h}%` : '0%' }}
                            title={`le=${b.le}: ${b.count}`}
                          />
                          <div className="text-[9px] font-mono text-slate-600 mt-1">{b.le}</div>
                          <div className="text-[9px] font-mono text-slate-500">{visible ? b.count : '—'}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <strong className="text-purple-700">📊 bucket 누적</strong> — <code className="bg-purple-100 px-1 rounded">le="0.5"</code>는 "0.5초 이하"가 몇 번. <strong className="text-red-600">p95</strong>는 950/1000 지점 ⇒ <code className="bg-purple-100 px-1 rounded">histogram_quantile(0.95, ...)</code>로 서버에서 계산.
                </div>
              </div>
            )}

            {/* Summary: pre-calculated quantile */}
            {step.focus === 'summary' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-rose-50 border-2 border-rose-300 p-3">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-rose-800">rpc_duration_seconds (summary)</span>
                    <span className="text-[10px] font-mono text-rose-600">client 측 계산값</span>
                  </div>
                  <div className="h-40 bg-white rounded border border-rose-200 p-2 flex items-end gap-3">
                    {quantiles.map((q, i) => {
                      const visible = i <= tick;
                      return (
                        <div key={q.q} className="flex-1 flex flex-col items-center justify-end h-full">
                          <div className="text-[10px] font-bold text-rose-700">{q.v.toFixed(3)}s</div>
                          <div
                            className={`w-full rounded-t transition-all duration-500 ${visible ? 'bg-rose-500' : 'bg-slate-100'}`}
                            style={{ height: visible ? `${q.h}%` : '0%' }}
                          />
                          <div className="text-[10px] font-mono text-slate-600 mt-1">q={q.q}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <strong className="text-rose-700">📐 client quantile</strong> — SDK가 직접 계산해서 expose. 단일 instance엔 정확하지만 <strong className="text-red-700">여러 instance 합산이 불가</strong>(비가산). 새 코드는 보통 Histogram을 쓴다.
                </div>
              </div>
            )}
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="허브로 돌아가기">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. 기초 &gt; Chapter 1. Metric 모델</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Metric Type 4종 (Counter / Gauge / Histogram / Summary)</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                계량기 4종 비유 — <strong>Counter</strong>(주행거리계) · <strong>Gauge</strong>(온도계) · <strong>Histogram</strong>(분포 막대) · <strong>Summary</strong>(요약치).
                각 type의 expose 포맷과 쿼리 방식이 다르다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(I-1-2)에서는 <strong>Scrape</strong> — Prometheus가 어떻게 /metrics를 가지러 오는지
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동재생 일시정지' : '자동재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="허브">&larr; 허브</a>
              <a href="./I-1-2.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 I-1-2 Scrape">I-1-2 Scrape &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
