<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus 학습 — I-1-2. Scrape</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🥛</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    I-1-2. Scrape — Prometheus가 가지러 온다
    학습 목표: scrape_interval / scrape_timeout / expose 포맷 / up 메트릭 의미.
    핵심 비유: "우유 배달부" — 정해진 시간에 /metrics 통을 가지러 온다.
    패턴: 좌(LiveDataPane — 시계열 scrape 사이클) / 우(VSCode CodeViewer — prometheus.yml + /metrics)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. scrape_interval — "15초마다 GET /metrics"',
        desc: 'global.scrape_interval 으로 모든 job 기본 주기를 정한다. 짧으면 그래프 해상도가 좋지만 부하/저장량 증가. 보통 15s ~ 60s를 쓴다. job별로 override 가능.',
        focus: 'interval',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — scrape_interval 기본',
          lines: [
            '# prometheus.yml — 수집 주기 기본 설정',
            'global:',
            '  scrape_interval:     15s    # 기본: 15초마다',
            '  scrape_timeout:      10s    # 응답 10초 안에 못 받으면 실패',
            '  evaluation_interval: 15s    # rule 평가 주기 (보통 동일)',
            '',
            'scrape_configs:',
            '  - job_name: "api"',
            '    scrape_interval: 10s      # ← override: 더 짧게',
            '    static_configs:',
            '      - targets: ["api:9090"]',
            '',
            '  - job_name: "batch"',
            '    scrape_interval: 60s      # ← override: 더 길게',
            '    static_configs:',
            '      - targets: ["batch:9090"]',
            '',
            '# 가이드',
            '# 10s ~ 15s: 자주 보는 핵심 (HTTP API, K8s 자원)',
            '# 30s ~ 60s: 변동 적음 (DB stats, GC)',
            '# 1m ~ 5m : 외부 probe (blackbox)',
            '',
            '# scrape_interval은 저장량과 직결:',
            '# 15s → 하루 5760 datapoint/series',
            '# 60s → 하루 1440 datapoint/series',
          ],
          highlight: [3, 4, 9, 14],
        },
      },
      {
        title: 'Step 2. scrape_timeout — "응답이 늦으면 실패"',
        desc: 'scrape_timeout 안에 응답이 안 오면 그 scrape는 실패다. up = 0이 되고, 부분 데이터도 버려진다. timeout < interval 이어야 한다.',
        focus: 'timeout',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — scrape_timeout',
          lines: [
            '# scrape_timeout — 응답을 얼마나 기다릴지',
            '#',
            '# t=0     t=10s              t=15s',
            '# scrape  ──────timeout──────│ next scrape',
            '#         GET /metrics       │',
            '#         (응답 못 받으면     │',
            '#          이 cycle 실패)    │',
            '',
            'global:',
            '  scrape_interval: 15s',
            '  scrape_timeout:  10s        # ← 반드시 interval보다 작게',
            '',
            'scrape_configs:',
            '  # 느린 backend는 더 넉넉히',
            '  - job_name: "slow-cron-exporter"',
            '    scrape_interval: 60s',
            '    scrape_timeout:  45s',
            '    static_configs:',
            '      - targets: ["cron:9090"]',
            '',
            '# 실패 시',
            '# - up{instance="cron:9090"} = 0',
            '# - scrape_duration_seconds 측정 안 됨',
            '# - 그래프는 그 시점 gap이 생김',
            '#',
            '# Tip: scrape_duration_seconds > 0.7 * scrape_timeout 알람을',
            '#      걸어두면 임박한 실패를 감지할 수 있다.',
          ],
          highlight: [11, 16, 17, 22, 23],
        },
      },
      {
        title: 'Step 3. /metrics expose 포맷 — "텍스트 한 줄이 곧 시계열"',
        desc: 'expose 포맷은 매우 단순한 텍스트다. HELP/TYPE 주석 + `metric{label="..."} value` 라인. 어떤 언어든 이 포맷으로 출력만 하면 Prometheus가 알아본다.',
        focus: 'expose',
        code: {
          lang: 'yaml',
          filename: 'GET /metrics — expose 텍스트 응답',
          lines: [
            'HTTP/1.1 200 OK',
            'Content-Type: text/plain; version=0.0.4',
            '',
            '# HELP http_requests_total Total HTTP requests',
            '# TYPE http_requests_total counter',
            'http_requests_total{method="GET",status="200"} 1027',
            'http_requests_total{method="POST",status="200"} 412',
            'http_requests_total{method="POST",status="500"} 3',
            '',
            '# HELP process_resident_memory_bytes Resident memory',
            '# TYPE process_resident_memory_bytes gauge',
            'process_resident_memory_bytes 1.34217728e+08',
            '',
            '# HELP up 1 = scrape OK, 0 = scrape 실패',
            '# TYPE up gauge',
            'up 1',
            '',
            '# 규칙',
            '# 1) # HELP <name> <desc>',
            '# 2) # TYPE <name> {counter|gauge|histogram|summary}',
            '# 3) <name>{label="...",label="..."} <number> [<timestamp_ms>]',
            '#',
            '# label은 순서 무관, 같은 label 조합은 한 시계열',
            '# label 값은 UTF-8 — high cardinality 주의 (user_id 같은 거 금지)',
            '#',
            '# OpenMetrics — Prometheus가 채택한 공식 표준',
            '# Content-Type: application/openmetrics-text; version=1.0.0',
          ],
          highlight: [4, 5, 6, 7, 8, 19, 20, 21],
        },
      },
      {
        title: 'Step 4. up 메트릭 — "scrape 자체가 메트릭"',
        desc: 'Prometheus는 매 scrape마다 자체적으로 `up{job, instance}` = 1/0 을 기록한다. 앱이 답이 없어도 그 사실 자체가 메트릭이 된다 → "왜 안 오는지" 알 수 있다.',
        focus: 'up',
        code: {
          lang: 'promql',
          filename: 'up 메트릭 활용 — health 모니터링',
          lines: [
            '# Prometheus가 자동으로 만드는 메타 메트릭',
            '# up = 1 → scrape 성공',
            '# up = 0 → scrape 실패 (DNS / 연결 / timeout / 404 / 500)',
            '',
            '# 현재 죽은 instance 목록',
            'up == 0',
            '',
            '# job별 살아있는 비율',
            'avg by (job) (up)',
            '',
            '# 5분 이상 죽어있는 instance 알람',
            'up == 0',
            '  # for: 5m  (rule 정의시)',
            '',
            '# 함께 자동 생성되는 메트릭',
            '# scrape_duration_seconds        — 이번 scrape이 걸린 시간',
            '# scrape_samples_scraped         — 받은 sample 수',
            '# scrape_samples_post_metric_relabeling',
            '# scrape_series_added',
            '',
            '# 느려지는 endpoint 감지',
            'scrape_duration_seconds > 0.5',
            '',
            '# series 폭증 감지 (high cardinality)',
            'topk(10,',
            '  delta(scrape_series_added[1h])',
            ')',
            '',
            '# Alertmanager 규칙 예시 (다음 챕터에서 다룸)',
            '# - alert: InstanceDown',
            '#   expr:  up == 0',
            '#   for:   5m',
            '#   labels: { severity: critical }',
          ],
          highlight: [2, 3, 6, 9, 22, 26, 27],
        },
      },
    ];

    const PHASES = [
      { key: 'interval', emoji: '⏱', name: 'scrape_interval', note: '주기 (15s)' },
      { key: 'timeout',  emoji: '⌛', name: 'scrape_timeout',  note: '응답 한계 (10s)' },
      { key: 'expose',   emoji: '📜', name: 'expose 포맷',     note: '텍스트 라인' },
      { key: 'up',       emoji: '✅', name: 'up 메트릭',       note: 'scrape 자체' },
    ];

    function LiveDataPane({ step, stepIdx }) {
      // 시계열 sin scrape 시각화 — interval 막대 그래프, timeout 시 회색 점
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => Math.min(t + 1, 14)), 350);
        return () => clearInterval(id);
      }, [stepIdx]);

      const SCRAPES = Array.from({ length: 12 }, (_, i) => ({
        t: i * 15,
        ok: !(i === 5 && step.focus === 'timeout'),  // timeout 단계에서 한 번 실패 시뮬
      }));

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🥛</span>
              <span className="text-xs font-bold text-slate-700">Scrape 사이클</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">scrape_interval=15s</span>
          </div>

          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-2">
              {PHASES.map((p) => {
                const active = step.focus === p.key;
                return (
                  <div key={p.key}
                    className={`rounded-lg p-2 text-center transition-all duration-300 ${active ? 'bg-orange-100 border-2 border-orange-400 scale-105 shadow-sm' : 'bg-slate-50 border border-slate-200'}`}>
                    <div className="text-xl">{p.emoji}</div>
                    <div className="text-[11px] font-bold text-slate-800 mt-1">{p.name}</div>
                    <div className="text-[9px] text-slate-500 mt-0.5 leading-tight">{p.note}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="p-4 min-h-[280px] space-y-3">
            {/* 가로 타임라인: scrape 도트 */}
            <div className="bg-orange-50 rounded-lg p-3 border border-orange-200">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold text-orange-800">Prometheus → api:9090/metrics</span>
                <span className="text-[10px] font-mono text-orange-600">시간 →</span>
              </div>
              <div className="h-20 bg-white rounded border border-orange-200 relative p-2">
                <div className="absolute inset-x-2 top-1/2 h-0.5 bg-slate-200" />
                {SCRAPES.map((s, i) => {
                  const visible = i <= tick;
                  return (
                    <div key={i} className="absolute top-1/2 -translate-y-1/2 transition-all duration-500"
                         style={{ left: `${(i / 11) * 95 + 1}%` }}>
                      {visible && (
                        <div className="flex flex-col items-center">
                          <div className={`w-3 h-3 rounded-full border-2 ${s.ok ? 'bg-orange-500 border-orange-700' : 'bg-slate-300 border-slate-500'} shadow`} />
                          <div className={`text-[8px] font-mono mt-1 ${s.ok ? 'text-orange-700' : 'text-slate-500'}`}>{s.ok ? `up=1` : 'up=0'}</div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div className="flex justify-between text-[9px] text-slate-500 mt-1 font-mono">
                <span>t=0s</span>
                <span>t=75s</span>
                <span>t=150s</span>
              </div>
            </div>

            {/* 단계별 보조 시각화 */}
            {step.focus === 'interval' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-orange-700">⏱ 15초 주기</strong> — 모든 점은 정확히 15초 간격. 짧으면 그래프가 더 부드럽지만 저장량/부하 증가. 보통 15s를 기본으로.
              </div>
            )}
            {step.focus === 'timeout' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-red-700">⌛ 5번째 scrape이 timeout</strong> — 회색 점(up=0)으로 표시. 응답 데이터가 부분적이어도 모두 버려진다.
              </div>
            )}
            {step.focus === 'expose' && (
              <div className="space-y-2">
                <div className="bg-slate-900 text-slate-100 rounded-lg p-3 font-mono text-[10px] leading-relaxed">
                  <div className="text-green-400"># HELP http_requests_total Total HTTP requests</div>
                  <div className="text-green-400"># TYPE http_requests_total counter</div>
                  <div><span className="text-orange-300">http_requests_total</span><span className="text-slate-300">{`{method="GET",status="200"}`}</span> <span className="text-yellow-300">1027</span></div>
                  <div><span className="text-orange-300">http_requests_total</span><span className="text-slate-300">{`{method="POST",status="500"}`}</span> <span className="text-yellow-300">3</span></div>
                  <div className="text-green-400 mt-2"># TYPE up gauge</div>
                  <div><span className="text-orange-300">up</span> <span className="text-yellow-300">1</span></div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <strong className="text-orange-700">📜 한 줄 = 한 시계열</strong> — 텍스트 라인 그대로 파싱. label 조합이 같으면 같은 시계열.
                </div>
              </div>
            )}
            {step.focus === 'up' && (
              <div className="grid grid-cols-2 gap-2">
                <div className="rounded-lg bg-emerald-50 border-2 border-emerald-300 p-2 text-center">
                  <div className="text-2xl">✅</div>
                  <div className="text-[11px] font-bold text-emerald-700 mt-1">up = 1</div>
                  <div className="text-[10px] text-emerald-600 mt-0.5">scrape 성공</div>
                </div>
                <div className="rounded-lg bg-rose-50 border-2 border-rose-300 p-2 text-center">
                  <div className="text-2xl">❌</div>
                  <div className="text-[11px] font-bold text-rose-700 mt-1">up = 0</div>
                  <div className="text-[10px] text-rose-600 mt-0.5">DNS/conn/timeout/5xx</div>
                </div>
                <div className="col-span-2 text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  <strong className="text-orange-700">✅ up 메트릭</strong> — 앱이 답이 없어도 그 사실 자체가 시계열로 기록된다. <code className="bg-orange-100 px-1 rounded">up == 0</code> 으로 다운 인스턴스를 즉시 쿼리.
                </div>
              </div>
            )}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="허브로 돌아가기">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. 기초 &gt; Chapter 1. Scrape</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Scrape — Prometheus가 가지러 온다</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                우유 배달부 비유 — <strong>scrape_interval</strong>마다 각 타깃의 <code className="bg-slate-100 px-1 rounded text-xs">/metrics</code>를 GET 한다.
                응답 못 받으면 up=0 — 죽음 자체가 메트릭이다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(I-2-1)에서는 <strong>Target</strong> — 무엇을(어느 endpoint를) 가져갈지
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동재생 일시정지' : '자동재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-1-1.html" className="text-slate-500 hover:text-slate-700" aria-label="이전 자료 I-1-1">&larr; I-1-1 Metric Type</a>
              <a href="./I-2-1.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 I-2-1 Target">I-2-1 Target &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
