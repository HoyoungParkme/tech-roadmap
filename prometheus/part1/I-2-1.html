<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus 학습 — I-2-1. Target</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎯</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    I-2-1. Target — 무엇을 가져갈지
    학습 목표: target = 한 endpoint(host:port/metrics) + instance label + health 상태.
    핵심 비유: "배달 주소 카드" — 한 장이 곧 한 target. 건강 상태(up=0/1)도 카드에 적힘.
    패턴: 좌(LiveDataPane — 4개 target 카드 + 상태 표) / 우(VSCode CodeViewer — prometheus.yml + UI 상태)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. Target = 하나의 endpoint',
        desc: 'target은 Prometheus가 GET 할 endpoint 하나다. 보통 `host:port/metrics`. instance label에 그 주소가 들어간다. 같은 앱을 3대 띄우면 target 3개, instance 3개.',
        focus: 'def',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — static_configs',
          lines: [
            '# Target 정의 — static_configs',
            '#   target = host:port  (path는 기본 /metrics)',
            '#   instance label = host:port',
            '',
            'scrape_configs:',
            '  - job_name: "api"',
            '    static_configs:',
            '      - targets:',
            '          - "api-1:9090"     # ← target #1 (instance="api-1:9090")',
            '          - "api-2:9090"     # ← target #2',
            '          - "api-3:9090"     # ← target #3',
            '',
            '  - job_name: "db"',
            '    metrics_path: /probe       # /metrics 가 아닌 경우',
            '    scheme: https              # http 가 아닌 경우',
            '    static_configs:',
            '      - targets: ["db-1:9187"]',
            '',
            '# Prometheus가 GET 하는 URL',
            '# http://api-1:9090/metrics',
            '# http://api-2:9090/metrics',
            '# https://db-1:9187/probe',
            '',
            '# 자동으로 붙는 label',
            '# job      = "api"',
            '# instance = "api-1:9090"',
          ],
          highlight: [9, 10, 11, 14, 15, 26],
        },
      },
      {
        title: 'Step 2. UI Targets 페이지 — "지금 누가 살아있나"',
        desc: 'Prometheus 웹 UI의 Status → Targets에서 모든 target의 health, 마지막 scrape 시간, scrape 소요시간을 한눈에 본다. UP / DOWN / UNKNOWN 세 상태.',
        focus: 'ui',
        code: {
          lang: 'yaml',
          filename: 'http://localhost:9090/targets — UI 화면',
          lines: [
            '# Prometheus UI : Status → Targets',
            '',
            'Endpoint                            State    Labels                              Last Scrape   Scrape Duration   Error',
            '─────────────────────────────────── ────── ─────────────────────────────────── ───────────── ───────────────── ──────────────',
            'http://api-1:9090/metrics           UP     job="api" instance="api-1:9090"     2s ago        42ms',
            'http://api-2:9090/metrics           UP     job="api" instance="api-2:9090"     3s ago        38ms',
            'http://api-3:9090/metrics           DOWN   job="api" instance="api-3:9090"     12s ago       —                 connection refused',
            'https://db-1:9187/probe             UP     job="db"  instance="db-1:9187"     1s ago        180ms',
            '',
            '# 3 가지 상태',
            '# UP        : 마지막 scrape 성공      → up = 1',
            '# DOWN      : 마지막 scrape 실패      → up = 0  + Error 사유 표시',
            '# UNKNOWN   : 아직 한 번도 시도 안 함 (방금 추가된 직후)',
            '',
            '# 자주 보는 Error',
            '# connection refused          : 포트 안 떠 있음',
            '# context deadline exceeded   : scrape_timeout 초과',
            '# server returned HTTP status 500 : 앱이 500 응답',
            '# x509: certificate signed by unknown authority : TLS 검증 실패',
          ],
          highlight: [5, 6, 7, 8, 11, 12, 13],
        },
      },
      {
        title: 'Step 3. instance label — "어느 한 대인지"',
        desc: 'instance label은 host:port. 같은 job 안에서 instance로 한 대를 식별한다. PromQL에서 `sum by (instance)` / `topk(5, ...)` 처럼 인스턴스 단위 비교에 쓴다.',
        focus: 'instance',
        code: {
          lang: 'promql',
          filename: 'instance 활용 — PromQL 예시',
          lines: [
            '# instance label은 host:port — 한 target = 한 instance',
            '',
            '# 특정 인스턴스만',
            'http_requests_total{instance="api-1:9090"}',
            '',
            '# 인스턴스별 합산 (job 안에서 한 대씩)',
            'sum by (instance) (',
            '  rate(http_requests_total{job="api"}[5m])',
            ')',
            '',
            '# 가장 바쁜 5개 인스턴스',
            'topk(5,',
            '  sum by (instance) (',
            '    rate(http_requests_total[5m])',
            '  )',
            ')',
            '',
            '# 인스턴스 health',
            'up{job="api"}',
            '#   →  up{instance="api-1:9090",job="api"} 1',
            '#       up{instance="api-2:9090",job="api"} 1',
            '#       up{instance="api-3:9090",job="api"} 0',
            '',
            '# 다운된 인스턴스 개수',
            'sum by (job) (up == 0)',
            '',
            '# 가장 느린 scrape 인스턴스 (성능 이슈 감지)',
            'topk(5, scrape_duration_seconds)',
          ],
          highlight: [4, 7, 8, 19, 20, 21, 22],
        },
      },
      {
        title: 'Step 4. Health 라이프사이클 — UNKNOWN → UP → DOWN',
        desc: 'target이 처음 추가되면 UNKNOWN. 첫 scrape이 성공하면 UP, 실패하면 DOWN. 그 뒤로는 매 scrape마다 갱신. up 메트릭은 DOWN 때도 1 sample 기록되어 "왜 안 오는지" 알 수 있다.',
        focus: 'lifecycle',
        code: {
          lang: 'yaml',
          filename: 'health 라이프사이클 + 자주 쓰는 알람',
          lines: [
            '# Target Health 상태 전이',
            '#',
            '#   [UNKNOWN] ── first scrape ──► [UP] ──► [DOWN] ──► [UP] ...',
            '#                                        실패 발생       복구',
            '',
            '# 라이프사이클 (시각화 비유)',
            '# 1) 설정에 target 추가         → UNKNOWN',
            '# 2) 첫 scrape 성공             → UP   (up=1 기록)',
            '# 3) network 단절 / 앱 crash    → DOWN (up=0 기록)',
            '# 4) 복구되면                   → UP   (up=1 기록)',
            '#',
            '# DOWN일 때도 up=0 sample이 매 scrape마다 들어가므로',
            '# 그래프에 "끊김 없이" 0이 찍히고, 알람이 동작한다.',
            '',
            '# Alertmanager 예시 — instance 5분 다운',
            'groups:',
            '  - name: target-health',
            '    rules:',
            '      - alert: InstanceDown',
            '        expr: up == 0',
            '        for: 5m',
            '        labels:',
            '          severity: critical',
            '        annotations:',
            '          summary: "{{ $labels.instance }} 다운"',
            '          description: "{{ $labels.job }} job의 {{ $labels.instance }} 가 5분간 응답 없음"',
            '',
            '      # job 전체가 절반 이상 다운 — 더 심각',
            '      - alert: JobMajorityDown',
            '        expr: avg by (job) (up) < 0.5',
            '        for: 2m',
            '        labels:',
            '          severity: page',
          ],
          highlight: [3, 4, 19, 20, 21, 22, 23, 30, 31, 32],
        },
      },
    ];

    const PHASES = [
      { key: 'def',       emoji: '🎯', name: 'Target 정의',      note: 'host:port/metrics' },
      { key: 'ui',        emoji: '🖥', name: 'UI Targets',       note: 'UP/DOWN 표시' },
      { key: 'instance',  emoji: '🏷', name: 'instance label',  note: '인스턴스 식별' },
      { key: 'lifecycle', emoji: '🔁', name: 'Health 전이',       note: 'UP↔DOWN' },
    ];

    // 4개 target 시뮬레이션
    const TARGETS = [
      { id: 't1', name: 'api-1:9090', job: 'api', up: 1, ms: 42 },
      { id: 't2', name: 'api-2:9090', job: 'api', up: 1, ms: 38 },
      { id: 't3', name: 'api-3:9090', job: 'api', up: 0, ms: null, err: 'connection refused' },
      { id: 't4', name: 'db-1:9187',  job: 'db',  up: 1, ms: 180 },
    ];

    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => Math.min(t + 1, 6)), 400);
        return () => clearInterval(id);
      }, [stepIdx]);

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🎯</span>
              <span className="text-xs font-bold text-slate-700">Target 4개 (배달 주소 카드)</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">job=api,db</span>
          </div>

          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-2">
              {PHASES.map((p) => {
                const active = step.focus === p.key;
                return (
                  <div key={p.key}
                    className={`rounded-lg p-2 text-center transition-all duration-300 ${active ? 'bg-orange-100 border-2 border-orange-400 scale-105 shadow-sm' : 'bg-slate-50 border border-slate-200'}`}>
                    <div className="text-xl">{p.emoji}</div>
                    <div className="text-[11px] font-bold text-slate-800 mt-1">{p.name}</div>
                    <div className="text-[9px] text-slate-500 mt-0.5 leading-tight">{p.note}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 4 target 카드 그리드 */}
          <div className="p-4 min-h-[300px] space-y-3">
            <div className="grid grid-cols-2 gap-2">
              {TARGETS.map((t, i) => {
                const visible = i <= tick;
                const isHighlightInstance = step.focus === 'instance' && t.id === 't1';
                const isDown = t.up === 0;
                let stateLabel = 'UP';
                let cls = 'bg-emerald-50 border-emerald-300 text-emerald-800';
                let badgeCls = 'bg-emerald-100 text-emerald-700 border-emerald-300';
                if (isDown) {
                  stateLabel = 'DOWN';
                  cls = 'bg-rose-50 border-rose-400 text-rose-800';
                  badgeCls = 'bg-rose-100 text-rose-700 border-rose-300';
                }
                if (step.focus === 'lifecycle' && i === 3) {
                  stateLabel = 'UNKNOWN';
                  cls = 'bg-slate-100 border-slate-300 text-slate-700';
                  badgeCls = 'bg-slate-200 text-slate-700 border-slate-300';
                }
                return (
                  <div key={t.id}
                    className={`rounded-lg border-2 p-3 transition-all duration-500 ${visible ? cls : 'bg-slate-50 border-slate-200 opacity-30'} ${isHighlightInstance ? 'ring-2 ring-orange-400 ring-offset-1' : ''}`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[11px] font-mono font-bold">{t.name}</span>
                      <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded border ${badgeCls}`}>{visible ? stateLabel : '—'}</span>
                    </div>
                    <div className="text-[10px] font-mono text-slate-600">job=<span className="font-bold">{t.job}</span></div>
                    {visible && (
                      <div className="text-[10px] font-mono text-slate-500 mt-1">
                        {isDown ? <span className="text-rose-600">{t.err}</span> : <span>scrape {t.ms}ms · up=1</span>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* 단계별 보조 메세지 */}
            {step.focus === 'def' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-orange-700">🎯 target = host:port</strong> — 한 endpoint가 한 target. instance label에 그대로 들어간다.
              </div>
            )}
            {step.focus === 'ui' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-orange-700">🖥 UI Status → Targets</strong> — UP/DOWN/UNKNOWN, 마지막 scrape 시간, 소요시간, 에러 사유를 표로.
              </div>
            )}
            {step.focus === 'instance' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-orange-700">🏷 instance label</strong> — 모든 메트릭에 자동으로 붙는다. <code className="bg-orange-100 px-1 rounded">sum by (instance) (...)</code> 로 인스턴스 단위 비교.
              </div>
            )}
            {step.focus === 'lifecycle' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-orange-700">🔁 Health 전이</strong> — UNKNOWN(아직 시도 전) → UP/DOWN. DOWN일 때도 <code className="bg-orange-100 px-1 rounded">up=0</code> sample이 매 scrape마다 기록된다.
              </div>
            )}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="허브로 돌아가기">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. 기초 &gt; Chapter 2. Target / Job</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Target — 무엇을 가져갈지</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                배달 주소 카드 비유 — 한 장이 곧 하나의 <strong>target</strong>(<code className="bg-slate-100 px-1 rounded text-xs">host:port</code>).
                instance label과 health(UP/DOWN/UNKNOWN)로 살아있는지 알 수 있다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(I-2-2)에서는 <strong>Job</strong> — 같은 종류의 target을 묶는 단위
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동재생 일시정지' : '자동재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-1-2.html" className="text-slate-500 hover:text-slate-700" aria-label="이전 자료 I-1-2 Scrape">&larr; I-1-2 Scrape</a>
