<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus 학습 — I-2-2. Job</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    I-2-2. Job — 같은 종류 묶음
    학습 목표: job = 같은 종류 target의 그룹. job_name label로 묶인다.
    핵심 비유: "동일한 역할의 묶음 박스" — api job 3개, db job 2개 처럼 묶음.
    패턴: 좌(LiveDataPane — 2 job × N instance 묶음 시각화) / 우(VSCode CodeViewer — prometheus.yml + relabel)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. Job = 같은 종류의 target 그룹',
        desc: 'job_name 한 줄이 곧 하나의 job. 그 아래 여러 instance(target)를 묶는다. 같은 앱을 N대 띄우면 모두 한 job 안에 들어간다.',
        focus: 'group',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — 2 job × N instance',
          lines: [
            '# Job 정의 — 같은 종류 target을 묶는 그룹',
            'scrape_configs:',
            '',
            '  # === job 1 === API (3 instance)',
            '  - job_name: "api"',
            '    scrape_interval: 15s',
            '    static_configs:',
            '      - targets:',
            '          - "api-1:9090"',
            '          - "api-2:9090"',
            '          - "api-3:9090"',
            '',
            '  # === job 2 === DB exporter (2 instance)',
            '  - job_name: "db"',
            '    scrape_interval: 30s',
            '    metrics_path: /metrics',
            '    static_configs:',
            '      - targets:',
            '          - "db-1:9187"',
            '          - "db-2:9187"',
            '',
            '# 결과 — 모든 메트릭에 자동 label',
            '# {job="api", instance="api-1:9090", ...}',
            '# {job="api", instance="api-2:9090", ...}',
            '# {job="api", instance="api-3:9090", ...}',
            '# {job="db",  instance="db-1:9187",  ...}',
            '# {job="db",  instance="db-2:9187",  ...}',
            '',
            '# job 단위로 설정을 분리 가능',
            '# - 다른 scrape_interval / scrape_timeout',
            '# - 다른 metrics_path / scheme / TLS',
            '# - 다른 service discovery 방식',
          ],
          highlight: [5, 9, 10, 11, 14, 19, 20],
        },
      },
      {
        title: 'Step 2. job_name label — "PromQL의 1차 차원"',
        desc: '모든 메트릭에 자동으로 `job` label이 붙는다. PromQL에서 가장 먼저 거는 필터가 보통 `{job="api"}`. job별 분리 분석/대시보드가 가능.',
        focus: 'label',
        code: {
          lang: 'promql',
          filename: 'job label로 분리하기 — PromQL',
          lines: [
            '# 모든 메트릭에 자동으로 job label이 붙는다',
            '',
            '# 1) job으로 1차 필터',
            'http_requests_total{job="api"}',
            'db_queries_total{job="db"}',
            '',
            '# 2) job별 합산 — 한 job 안 모든 instance 합',
            'sum by (job) (',
            '  rate(http_requests_total[5m])',
            ')',
            '#   →  {job="api"} 312.4',
            '#       {job="batch"} 8.1',
            '',
            '# 3) job 평균 인스턴스 헬스 (1.0 = 모두 살아있음)',
            'avg by (job) (up)',
            '#   →  {job="api"} 1.0',
            '#       {job="db"}  0.5      ← 절반 다운!',
            '',
            '# 4) job + status 2차원 분해 (Grafana 패널 자주 쓰는 패턴)',
            'sum by (job, status) (',
            '  rate(http_requests_total[5m])',
            ')',
            '',
            '# 5) job 단위 에러율',
            'sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))',
            '/ sum by (job) (rate(http_requests_total[5m]))',
          ],
          highlight: [4, 5, 8, 9, 10, 15, 25, 26],
        },
      },
      {
        title: 'Step 3. relabel — "label을 가공해서 보관"',
        desc: 'relabel_configs로 scrape 직전에 label을 추가/변경/삭제한다. service discovery로 자동 발견된 meta label에서 원하는 정보를 뽑아 새 label로 만든다.',
        focus: 'relabel',
        code: {
          lang: 'yaml',
          filename: 'prometheus.yml — relabel_configs',
          lines: [
            '# relabel_configs — scrape 직전 label 가공',
            '#   동작 시점:  SD → relabel → scrape → metric_relabel → 저장',
            '',
            'scrape_configs:',
            '  - job_name: "api"',
            '    kubernetes_sd_configs:',
            '      - role: pod',
            '    relabel_configs:',
            '',
            '      # ① keep — annotation prometheus.io/scrape=true인 Pod만',
            '      - source_labels:',
            '          - __meta_kubernetes_pod_annotation_prometheus_io_scrape',
            '        action: keep',
            '        regex: "true"',
            '',
            '      # ② replace — namespace를 ns label로',
            '      - source_labels: [__meta_kubernetes_namespace]',
            '        target_label: ns',
            '        action: replace',
            '',
            '      # ③ replace — pod name → pod label',
            '      - source_labels: [__meta_kubernetes_pod_name]',
            '        target_label: pod',
            '',
            '      # ④ labelmap — 모든 pod label을 그대로 복사',
            '      - action: labelmap',
            '        regex: __meta_kubernetes_pod_label_(.+)',
            '',
            '      # ⑤ drop — namespace=kube-system은 제외',
            '      - source_labels: [ns]',
            '        regex: "kube-system"',
            '        action: drop',
            '',
            '# 결과 — 메트릭에 ns / pod / app 등 label 자동 부여',
            '# http_requests_total{job="api", ns="prod", pod="api-7f8...", app="api"}',
          ],
          highlight: [10, 13, 14, 16, 17, 18, 29, 30, 31],
        },
      },
      {
        title: 'Step 4. job 분리 가이드 — "언제 나누고 언제 합치나"',
        desc: '같은 종류는 한 job으로 묶고, 설정이 다르면 (scrape_interval, TLS, path) 별도 job. job이 너무 많아지면 관리 어려워지고, 너무 적으면 설정을 못 나눈다.',
        focus: 'guide',
        code: {
          lang: 'yaml',
          filename: '실전 — job 나누기 패턴',
          lines: [
            '# 패턴 1) 한 앱을 여러 환경에서 → job은 같게, env label로 구분',
            'scrape_configs:',
            '  - job_name: "api"',
            '    static_configs:',
            '      - targets: ["api-prod-1:9090", "api-prod-2:9090"]',
            '        labels: { env: "prod" }',
            '      - targets: ["api-staging-1:9090"]',
            '        labels: { env: "staging" }',
            '',
            '# 패턴 2) 종류가 다르면 job 분리',
            '  - job_name: "node"',
            '    static_configs:',
            '      - targets: ["node-1:9100", "node-2:9100"]',
            '',
            '  - job_name: "cadvisor"',
            '    static_configs:',
            '      - targets: ["node-1:8080", "node-2:8080"]',
            '',
            '# 패턴 3) 설정이 다르면 job 분리 (scheme/path/TLS)',
            '  - job_name: "external-https"',
            '    scheme: https',
            '    metrics_path: /probe',
            '    tls_config:',
            '      ca_file: /etc/ssl/ca.crt',
            '    static_configs:',
            '      - targets: ["external.example.com"]',
            '',
            '# ❌ 안티 패턴 — 모든 걸 한 job에 우겨넣기',
            '#  job_name: "everything"  ← 설정 분리 불가, label 혼란',
            '',
            '# ❌ 안티 패턴 — 인스턴스마다 job 분리',
            '#  job_name: "api-1", job_name: "api-2", ...',
            '#  ← sum by (job) 못 함, 알람 룰 N배 작성',
          ],
          highlight: [3, 5, 6, 7, 8, 11, 15, 20, 28, 31],
        },
      },
    ];

    const PHASES = [
      { key: 'group',   emoji: '📦', name: 'Job 그룹',     note: '같은 종류 묶음' },
      { key: 'label',   emoji: '🏷', name: 'job label',   note: 'PromQL 1차원' },
      { key: 'relabel', emoji: '🔧', name: 'relabel',      note: 'label 가공' },
      { key: 'guide',   emoji: '📐', name: '분리 가이드',  note: '언제 나눌지' },
    ];

    // 2 job × N instance 시각화
    const JOBS = [
      { name: 'api', color: 'orange', instances: ['api-1:9090', 'api-2:9090', 'api-3:9090'] },
      { name: 'db',  color: 'sky',    instances: ['db-1:9187', 'db-2:9187'] },
    ];

    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => Math.min(t + 1, 5)), 380);
        return () => clearInterval(id);
      }, [stepIdx]);

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">📦</span>
              <span className="text-xs font-bold text-slate-700">Job 그룹 (2 job × N instance)</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">api + db</span>
          </div>

          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-2">
              {PHASES.map((p) => {
                const active = step.focus === p.key;
                return (
                  <div key={p.key}
                    className={`rounded-lg p-2 text-center transition-all duration-300 ${active ? 'bg-orange-100 border-2 border-orange-400 scale-105 shadow-sm' : 'bg-slate-50 border border-slate-200'}`}>
                    <div className="text-xl">{p.emoji}</div>
                    <div className="text-[11px] font-bold text-slate-800 mt-1">{p.name}</div>
                    <div className="text-[9px] text-slate-500 mt-0.5 leading-tight">{p.note}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="p-4 min-h-[300px] space-y-3">
            {/* 2 job 박스 */}
            <div className="grid grid-cols-2 gap-3">
              {JOBS.map((job, jIdx) => {
                const colorMap = {
                  orange: { bg: 'bg-orange-50', border: 'border-orange-300', text: 'text-orange-800', badge: 'bg-orange-100 text-orange-700 border-orange-300' },
                  sky:    { bg: 'bg-sky-50',    border: 'border-sky-300',    text: 'text-sky-800',    badge: 'bg-sky-100 text-sky-700 border-sky-300' },
                };
                const c = colorMap[job.color];
                return (
                  <div key={job.name} className={`rounded-lg border-2 ${c.border} ${c.bg} p-2`}>
                    <div className="flex items-center justify-between mb-2">
                      <span className={`text-xs font-bold ${c.text}`}>📦 job="{job.name}"</span>
                      <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded border ${c.badge}`}>{job.instances.length} instance</span>
                    </div>
                    <div className="space-y-1">
                      {job.instances.map((inst, iIdx) => {
                        const visible = (jIdx * 3 + iIdx) <= tick;
                        const isLabelStep = step.focus === 'label';
                        return (
                          <div key={inst}
                            className={`bg-white border ${c.border} rounded px-2 py-1 flex items-center justify-between transition-all duration-500 ${visible ? 'opacity-100' : 'opacity-30'}`}>
                            <span className="text-[10px] font-mono font-bold text-slate-700">{inst}</span>
                            {isLabelStep && visible && (
                              <span className={`text-[8px] font-mono px-1 py-0.5 rounded border ${c.badge}`}>job="{job.name}"</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>

            {/* 단계별 메세지 */}
            {step.focus === 'group' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-orange-700">📦 job_name = 묶음 이름</strong> — 같은 종류 N개를 한 job 안에 모은다. api job 안의 3 instance, db job 안의 2 instance.
              </div>
            )}
            {step.focus === 'label' && (
              <div className="text-[11px] text-slate-600 bg-slate-50 rounded p-2 border border-slate-200 leading-snug">
                <strong className="text-orange-700">🏷 모든 메트릭에 job label 자동</strong> — PromQL의 1차 필터. <code className="bg-orange-100 px-1 rounded">{`{job="api"}`}</code> / <code className="bg-orange-100 px-1 rounded">sum by (job) (...)</code>.
              </div>
            )}
            {step.focus === 'relabel' && (
              <div className="bg-slate-900 rounded-lg p-3 font-mono text-[10px] leading-relaxed text-slate-100">
                <div className="text-slate-400"># scrape 직전 label 변환</div>
                <div className="mt-1">__meta_kubernetes_namespace="prod" <span className="text-yellow-400">→</span> <span className="text-orange-300">ns="prod"</span></div>
                <div>__meta_kubernetes_pod_name="api-7f8" <span className="text-yellow-400">→</span> <span className="text-orange-300">pod="api-7f8"</span></div>
                <div>__meta_kubernetes_pod_label_app="api" <span className="text-yellow-400">→</span> <span className="text-orange-300">app="api"</span></div>
                <div className="text-slate-400 mt-1"># 결과 메트릭</div>
                <div><span className="text-orange-300">http_requests_total</span><span className="text-slate-300">{`{job="api",ns="prod",pod="api-7f8",app="api"}`}</span></div>
              </div>
            )}
            {step.focus === 'guide' && (
              <div className="grid grid-cols-2 gap-2">
                <div className="rounded-lg bg-emerald-50 border-2 border-emerald-300 p-2">
                  <div className="text-xs font-bold text-emerald-700 mb-1">✅ 같은 종류 = 한 job</div>
                  <div className="text-[10px] text-emerald-700 font-mono">api job + env label로 환경 구분</div>
                </div>
                <div className="rounded-lg bg-rose-50 border-2 border-rose-300 p-2">
                  <div className="text-xs font-bold text-rose-700 mb-1">❌ 인스턴스마다 job 분리</div>
                  <div className="text-[10px] text-rose-700 font-mono">sum by (job) 못함, rule N배</div>
                </div>
              </div>
            )}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
            return i + 1;
          });
        }, 3500);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="허브로 돌아가기">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. 기초 &gt; Chapter 2. Target / Job</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Job — 같은 종류 묶음</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                묶음 박스 비유 — <strong>job_name</strong> 한 줄이 곧 하나의 그룹.
                <code className="bg-slate-100 px-1 rounded text-xs">api</code> job 안에 3 instance, <code className="bg-slate-100 px-1 rounded text-xs">db</code> job 안에 2 instance.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 다음(II-1-1)에서는 <strong>PromQL — Instant vs Range Vector</strong> 시계열 쿼리의 핵심
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동재생 일시정지' : '자동재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-2-1.html" className="text-slate-500 hover:text-slate-700" aria-label="이전 자료 I-2-1 Target">&larr; I-2-1 Target</a>
              <a href="../part2/II-1-1.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 II-1-1 Instant vs Range Vector">II-1-1 Instant vs Range &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
