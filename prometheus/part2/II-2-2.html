<body>
  <div id="root"></div>

  <!--
    II-2-2. histogram_quantile — p95 지연
    학습 목표: Histogram 메트릭에서 백분위수(p95)를 계산하고 SLO를 판정한다.
    핵심 비유: "줄 세우기" — 요청 1000건을 지연 오름차순으로 세우면 950번째가 p95
    패턴: 좌(LiveDataPane — bucket 누적 → 누적분포에서 p95 지점 탐색) / 우(VSCode CodeViewer — PromQL)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 히스토그램 원본 데이터 (누적 count, total=1000)
    //    p95 목표 순위 = 0.95 * 1000 = 950 → bucket [0.5, 1.0] 안에서 선형 보간
    const BUCKETS = [
      { le: '0.1',  cum: 200 },
      { le: '0.25', cum: 550 },
      { le: '0.5',  cum: 780 },
      { le: '1.0',  cum: 970 },
      { le: '2.5',  cum: 995 },
      { le: '+Inf', cum: 1000 },
    ];
    const TOTAL = 1000;
    const SUM = 420;                 // _sum (초 단위 누적)
    const MEAN = SUM / TOTAL;        // 0.42s — 평균
    const P95_RANK = 0.95 * TOTAL;   // 950
    const P95_EST = 0.9474;          // 0.5 + (950-780)/(970-780)*(1.0-0.5)

    const STEPS = [
      {
        title: 'Step 1. Histogram 3형제 — _bucket(le) · _sum · _count',
        desc: 'Histogram은 하나의 관측을 세 가지로 노출한다. _bucket{le="x"}는 "x초 이하 응답이 누적 몇 건"이라 항상 단조 증가하고, +Inf 버킷은 전체 건수와 같다. _sum은 지연의 총합, _count는 전체 건수여서 둘을 나누면 평균이 나온다. p95는 이 누적 버킷에서 사후에 뽑아내므로, 애플리케이션은 버킷만 잘 쌓아두면 된다. 그래서 여러 인스턴스의 값을 더해도 의미가 깨지지 않는다(가산성).',
        focus: 'structure',
        legend: '_bucket은 누적(cumulative) — le가 커질수록 count 증가, +Inf = _count',
        code: {
          lang: 'promql',
          filename: '/metrics — Histogram 노출 포맷',
          lines: [
            '# Histogram 하나 = _bucket 여러 개 + _sum + _count',
            '# _bucket{le="x"} = "x초 이하" 누적 건수 (단조 증가)',
            '',
            '# HELP http_request_duration_seconds Request latency',
            '# TYPE http_request_duration_seconds histogram',
            'http_request_duration_seconds_bucket{le="0.1"}   200',
            'http_request_duration_seconds_bucket{le="0.25"}  550',
            'http_request_duration_seconds_bucket{le="0.5"}   780',
            'http_request_duration_seconds_bucket{le="1.0"}   970',
            'http_request_duration_seconds_bucket{le="2.5"}   995',
            'http_request_duration_seconds_bucket{le="+Inf"}  1000',
            'http_request_duration_seconds_sum    420',
            'http_request_duration_seconds_count  1000',
            '',
            '# 평균 지연 = _sum / _count = 0.42s',
            '# 하지만 평균은 "꼬리 지연"을 숨긴다 → 백분위수가 필요',
          ],
          highlight: [6, 7, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 2. sum by(le) — le 레이블을 유지한 채 집계',
        desc: 'p95를 구하기 전에 여러 인스턴스·경로의 버킷을 하나로 합쳐야 한다. 이때 반드시 by(le)로 le 레이블을 남겨야 한다. le는 버킷 경계를 나타내는 축이므로, 이걸 날리면 histogram_quantile이 분포를 복원할 수 없다. rate(_bucket[5m])로 초당 증가율(=최근 관측 밀도)로 바꾼 뒤 sum by(le)로 합치는 것이 정석이다. le를 빼먹고 sum만 하는 것이 현업에서 가장 흔한 실수다.',
        focus: 'aggregate',
        legend: 'sum by(le) — le만 남기고 instance/path 등은 합산',
        code: {
          lang: 'promql',
          filename: 'promql — instance 3대를 le 기준으로 합산',
          lines: [
            '# 3대의 pod가 같은 histogram을 노출한다고 하자',
            '# 목표: le 경계별로 rate를 더해 하나의 분포로 만든다',
            '',
            '# 1) 각 버킷을 초당 증가율로 변환 (Counter이므로 rate 필수)',
            'rate(http_request_duration_seconds_bucket[5m])',
            '',
            '# 2) le는 남기고 pod/instance는 합산 → by(le)가 핵심',
            'sum by (le) (',
            '  rate(http_request_duration_seconds_bucket[5m])',
            ')',
            '',
            '# le를 빼먹으면? → 분포 축이 사라져 quantile 계산 불가',
            '# sum(rate(...))            # BAD: le 소실',
            '# sum without (le) (...)    # BAD: le 제거',
          ],
          highlight: [7, 8, 9, 10],
        },
      },
      {
        title: 'Step 3. histogram_quantile(0.95, ...) — 누적분포에서 p95',
        desc: 'histogram_quantile(0.95, ...)는 "요청 1000건을 지연 오름차순으로 줄 세웠을 때 950번째가 어디냐"를 계산한다. 누적 버킷을 보고 950번째 순위가 걸치는 버킷을 찾는다. 여기서는 le=0.5(누적 780)와 le=1.0(누적 970) 사이에 950이 들어가므로 p95는 0.5초~1.0초 구간에 있다. 평균 0.42초와 비교하면 p95는 0.95초로, 꼬리 지연이 평균의 두 배가 넘는다는 사실이 드러난다. 이것이 평균 대신 백분위수를 보는 이유다.',
        focus: 'quantile',
        legend: '950번째(=95%) 순위가 걸치는 버킷 구간을 탐색',
        code: {
          lang: 'promql',
          filename: 'promql — p95 지연 (서버 측 계산)',
          lines: [
            '# p95 지연 = 상위 5%를 제외한 최악의 응답시간',
            '# 0.95 분위 = 1000건 중 950번째 요청의 지연',
            '',
            'histogram_quantile(',
            '  0.95,',
            '  sum by (le) (',
            '    rate(http_request_duration_seconds_bucket[5m])',
            '  )',
            ')',
            '# → 약 0.95s  (누적 780@0.5s ~ 970@1.0s 사이)',
            '',
            '# 평균과 비교 (같은 데이터, 전혀 다른 그림)',
            'rate(http_request_duration_seconds_sum[5m])',
            '  / rate(http_request_duration_seconds_count[5m])',
            '# → 0.42s  (평균은 꼬리를 감춘다)',
          ],
          highlight: [4, 5, 6, 7, 8, 9],
        },
      },
      {
        title: 'Step 4. 버킷 경계와 선형 보간 — p95는 "근사치"',
        desc: 'Prometheus는 버킷 안의 분포를 모른다. 그래서 목표 순위가 걸친 버킷의 하한과 상한 사이를 직선으로 가정하고 보간한다. 950번째는 le=0.5(누적 780)와 le=1.0(누적 970) 사이에서 (950-780)/(970-780)=89.5% 지점이므로, 0.5 + 0.895*(1.0-0.5) ≈ 0.947초로 추정한다. 즉 실제 값이 아니라 버킷 해상도에 묶인 근사치다. 관심 구간(SLO 근처)에 버킷을 촘촘히 두지 않으면 p95 오차가 커진다. 이것이 버킷 설계가 중요한 이유다.',
        focus: 'interpolation',
        legend: '보간: lower_le + 비율 * (upper_le - lower_le), 비율=(rank-lowerCum)/(upperCum-lowerCum)',
        code: {
          lang: 'sql',
          filename: 'sql — histogram_quantile 보간을 SQL로 재현',
          lines: [
            '-- Prometheus 내부 보간 로직을 SQL로 풀어보면:',
            '-- 목표 순위(rank) = quantile * total = 0.95 * 1000 = 950',
            '',
            'WITH b(le, cum) AS (',
            '  VALUES (0.1,200),(0.25,550),(0.5,780),',
            '         (1.0,970),(2.5,995)',
            '),',
            'bounds AS (            -- 950이 걸친 하한/상한 버킷',
            '  SELECT 0.5 AS lower_le, 780 AS lower_cum,',
            '         1.0 AS upper_le, 970 AS upper_cum,',
            '         950 AS rank',
            ')',
            'SELECT lower_le',
            '  + (rank - lower_cum) / (upper_cum - lower_cum)',
            '    * (upper_le - lower_le)  AS p95_estimate',
            'FROM bounds;',
            '-- p95_estimate ≈ 0.947  (버킷 해상도에 묶인 근사치)',
          ],
          highlight: [13, 14, 15],
        },
      },
      {
        title: 'Step 5. SLO 판정 · Summary와의 차이 · 실무 함정',
        desc: 'SLO(예: "p99 지연 1초 이하")는 histogram_quantile(0.99, ...) 결과를 임계선과 비교해 판정한다. Summary도 quantile을 주지만 클라이언트가 미리 계산해 노출하므로 여러 인스턴스를 합칠 수 없다(비가산). 반면 Histogram은 버킷이 가산적이라 서버에서 전체 분포를 합쳐 정확히 집계된다. 실무 함정은 네 가지다: by(le) 누락, SLO 근처 버킷 부족으로 인한 보간 오차, rate 이전에 quantile을 계산하는 집계 순서 실수, 그리고 카디널리티 폭증(버킷을 너무 잘게 나눔). 새 코드는 특별한 이유가 없으면 Histogram을 쓴다.',
        focus: 'slo',
        legend: 'p99 vs SLO 임계선 비교로 위반 판정 — Histogram은 가산, Summary는 비가산',
        code: {
          lang: 'promql',
          filename: 'promql — SLO 위반 알림 규칙',
          lines: [
            '# p99 지연이 1초를 넘으면 SLO 위반',
            'histogram_quantile(',
            '  0.99,',
            '  sum by (le) (',
            '    rate(http_request_duration_seconds_bucket[5m])',
            '  )',
            ') > 1.0',
            '',
            '# 경로별 p95를 한 번에 (le + path 유지)',
            'histogram_quantile(',
            '  0.95,',
            '  sum by (le, path) (',
            '    rate(http_request_duration_seconds_bucket[5m])',
            '  )',
            ')',
            '',
            '# 함정 요약',
            '# 1) by(le) 누락 → 계산 불가',
            '# 2) SLO 근처 버킷 부족 → 보간 오차',
            '# 3) 집계 순서: rate → sum by(le) → quantile',
            '# 4) 버킷 과다 → 카디널리티 폭증',
          ],
          highlight: [2, 3, 4, 5, 6, 7],
        },
      },
    ];

    // 버킷별 비누적(개별) count 계산
    function perBucket() {
      let prev = 0;
      return BUCKETS.map((b) => {
        const c = b.cum - prev;
        prev = b.cum;
        return { le: b.le, cum: b.cum, count: c };
      });
    }

    // ── 좌측: bucket 누적 → 누적분포에서 p95 탐색 시각화
    function LiveDataPane({ step, stepIdx }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((t) => Math.min(t + 1, 12)), 400);
        return () => clearInterval(id);
      }, [stepIdx]);

      const rows = perBucket();
      // 누적분포 곡선용 좌표 (le를 로그느낌 균등 배치)
      const xs = [0.1, 0.25, 0.5, 1.0, 2.5, 4.0];
      const chartW = 260, chartH = 130;
      const xScale = (i) => 15 + (i / (BUCKETS.length - 1)) * (chartW - 25);
      const yScale = (cum) => chartH - 12 - (cum / TOTAL) * (chartH - 24);
      // p95 지점: le=0.5(idx2)와 le=1.0(idx3) 사이 89.5%
      const frac = (P95_RANK - 780) / (970 - 780);
      const p95x = xScale(2) + frac * (xScale(3) - xScale(2));
      const p95y = yScale(P95_RANK);

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">📊</span>
              <span className="text-xs font-bold text-slate-700">Latency Histogram · p95</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">total {TOTAL} req</span>
          </div>

          <div className="p-4 min-h-[340px]">
            {/* Step 1: bucket 3형제 구조 */}
            {step.focus === 'structure' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-purple-50 border-2 border-purple-300 p-3">
                  <div className="text-xs font-bold text-purple-800 mb-2">_bucket{'{le}'} — 누적 건수 (단조 증가)</div>
                  <div className="h-36 bg-white rounded border border-purple-200 p-2 flex items-end gap-2">
                    {BUCKETS.map((b, i) => {
                      const visible = i <= tick;
                      const h = (b.cum / TOTAL) * 100;
                      return (
                        <div key={b.le} className="flex-1 flex flex-col items-center justify-end h-full">
                          <div className="text-[9px] font-mono text-purple-700">{visible ? b.cum : '—'}</div>
                          <div
                            className={`w-full rounded-t transition-all duration-500 ${visible ? 'bg-purple-500' : 'bg-slate-100'}`}
                            style={{ height: visible ? `${h}%` : '2%' }}
                            title={`le=${b.le}: ${b.cum}`}
                          />
                          <div className="text-[9px] font-mono text-slate-600 mt-1">{b.le}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="rounded-lg bg-orange-50 border border-orange-200 p-2 text-center">
                    <div className="text-[10px] text-orange-700 font-bold">_sum</div>
                    <div className="text-sm font-mono text-orange-800">{SUM}s</div>
                  </div>
                  <div className="rounded-lg bg-orange-50 border border-orange-200 p-2 text-center">
                    <div className="text-[10px] text-orange-700 font-bold">_count</div>
                    <div className="text-sm font-mono text-orange-800">{TOTAL}</div>
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  평균 = _sum / _count = <strong className="text-orange-700">{MEAN.toFixed(2)}s</strong> — 하지만 평균은 꼬리 지연을 감춘다.
                </div>
              </div>
            )}

            {/* Step 2: sum by(le) 집계 */}
            {step.focus === 'aggregate' && (
              <div className="space-y-3">
                <div className="grid grid-cols-3 gap-2">
                  {['pod-a', 'pod-b', 'pod-c'].map((pod, pi) => (
                    <div key={pod} className={`rounded-lg border p-2 transition-all duration-300 ${pi <= tick ? 'bg-sky-50 border-sky-300' : 'bg-slate-50 border-slate-200 opacity-50'}`}>
                      <div className="text-[10px] font-bold text-sky-800 mb-1">{pod}</div>
                      <div className="h-16 flex items-end gap-0.5">
                        {rows.map((r, ri) => (
                          <div key={ri} className="flex-1 bg-sky-400 rounded-t" style={{ height: `${(r.cum / TOTAL) * 100 * (0.7 + pi * 0.15)}%` }} />
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex items-center justify-center text-purple-600 font-bold text-lg">↓ sum by (le)</div>
                <div className="rounded-lg bg-purple-50 border-2 border-purple-300 p-3">
                  <div className="text-xs font-bold text-purple-800 mb-2">le 축은 유지, pod는 합산된 분포</div>
                  <div className="h-24 bg-white rounded border border-purple-200 p-2 flex items-end gap-2">
                    {BUCKETS.map((b, i) => (
                      <div key={b.le} className="flex-1 flex flex-col items-center justify-end h-full">
                        <div className={`w-full rounded-t transition-all duration-500 ${tick >= 3 ? 'bg-purple-500' : 'bg-slate-200'}`} style={{ height: `${(b.cum / TOTAL) * 100}%` }} />
                        <div className="text-[9px] font-mono text-slate-600 mt-1">{b.le}</div>
                      </div>
                    ))}
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-red-200">
                  <strong className="text-red-600">le를 빼면</strong> 분포 축이 사라져 <code className="bg-red-100 px-1 rounded">histogram_quantile</code>이 동작하지 않는다.
                </div>
              </div>
            )}

            {/* Step 3: 누적분포에서 p95 탐색 */}
            {step.focus === 'quantile' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-white border-2 border-purple-300 p-3">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-xs font-bold text-purple-800">누적 분포 (CDF) — 95% 선과의 교점</span>
                    <span className="text-[10px] font-mono text-red-600">p95 ≈ {P95_EST.toFixed(2)}s</span>
                  </div>
                  <svg viewBox={`0 0 ${chartW} ${chartH}`} className="w-full">
                    {/* 95% 가로선 */}
                    <line x1="15" y1={yScale(P95_RANK)} x2={chartW - 10} y2={yScale(P95_RANK)} stroke="#ef4444" strokeWidth="1" strokeDasharray="3 3" />
                    <text x={chartW - 10} y={yScale(P95_RANK) - 3} textAnchor="end" fontSize="8" fill="#ef4444">95%</text>
                    {/* 누적 계단 곡선 */}
                    <polyline
                      fill="none" stroke="#7c3aed" strokeWidth="2"
                      points={BUCKETS.map((b, i) => `${xScale(i)},${yScale(tick >= i ? b.cum : 0)}`).join(' ')}
                    />
                    {BUCKETS.map((b, i) => (
                      <g key={b.le}>
                        <circle cx={xScale(i)} cy={yScale(tick >= i ? b.cum : 0)} r="2.5" fill="#7c3aed" />
                        <text x={xScale(i)} y={chartH - 2} textAnchor="middle" fontSize="7" fill="#64748b">{b.le}</text>
                      </g>
                    ))}
                    {/* p95 세로선 + 마커 */}
                    {tick >= 5 && (
                      <g>
                        <line x1={p95x} y1={p95y} x2={p95x} y2={chartH - 12} stroke="#ef4444" strokeWidth="1.5" />
                        <circle cx={p95x} cy={p95y} r="4" fill="#ef4444" />
                        <text x={p95x} y={chartH - 14} textAnchor="middle" fontSize="8" fill="#ef4444" fontWeight="bold">{P95_EST.toFixed(2)}s</text>
                      </g>
                    )}
                  </svg>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="rounded-lg bg-slate-50 border border-slate-200 p-2 text-center">
                    <div className="text-[10px] text-slate-500 font-bold">평균 (mean)</div>
                    <div className="text-sm font-mono text-slate-700">{MEAN.toFixed(2)}s</div>
                  </div>
                  <div className="rounded-lg bg-red-50 border-2 border-red-300 p-2 text-center">
                    <div className="text-[10px] text-red-600 font-bold">p95 (꼬리)</div>
                    <div className="text-sm font-mono text-red-700">{P95_EST.toFixed(2)}s</div>
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  1000건을 지연 오름차순으로 세운 <strong className="text-red-600">950번째</strong>가 p95. 평균의 두 배가 넘는 꼬리 지연이 드러난다.
                </div>
              </div>
            )}

            {/* Step 4: 선형 보간 확대 */}
            {step.focus === 'interpolation' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-white border-2 border-amber-300 p-3">
                  <div className="text-xs font-bold text-amber-800 mb-1">버킷 [0.5s ~ 1.0s] 확대 — 직선 보간</div>
                  <svg viewBox="0 0 260 150" className="w-full">
                    {/* 하한/상한 점 */}
                    <line x1="40" y1="120" x2="220" y2="30" stroke="#f59e0b" strokeWidth="2" />
                    <circle cx="40" cy="120" r="4" fill="#7c3aed" />
                    <text x="40" y="138" textAnchor="middle" fontSize="9" fill="#334155">le=0.5</text>
                    <text x="40" y="112" textAnchor="middle" fontSize="8" fill="#7c3aed">780</text>
                    <circle cx="220" cy="30" r="4" fill="#7c3aed" />
                    <text x="220" y="138" textAnchor="middle" fontSize="9" fill="#334155">le=1.0</text>
                    <text x="220" y="24" textAnchor="middle" fontSize="8" fill="#7c3aed">970</text>
                    {/* 목표 rank 950 가로선 */}
                    <line x1="40" y1="47" x2="220" y2="47" stroke="#ef4444" strokeWidth="1" strokeDasharray="3 3" />
                    <text x="228" y="50" fontSize="8" fill="#ef4444">rank 950</text>
                    {/* 교점 (89.5%) */}
                    {tick >= 3 && (
                      <g>
                        <circle cx={40 + 0.895 * 180} cy="47" r="4.5" fill="#ef4444" />
                        <line x1={40 + 0.895 * 180} y1="47" x2={40 + 0.895 * 180} y2="130" stroke="#ef4444" strokeWidth="1.5" />
                        <text x={40 + 0.895 * 180} y="147" textAnchor="middle" fontSize="9" fill="#ef4444" fontWeight="bold">≈0.95s</text>
                      </g>
                    )}
                  </svg>
                </div>
                <div className="text-[11px] font-mono text-slate-700 bg-amber-50 rounded p-2 border border-amber-200 leading-relaxed">
                  비율 = (950-780)/(970-780) = <strong>0.895</strong><br/>
                  p95 = 0.5 + 0.895 × (1.0-0.5) ≈ <strong className="text-red-600">0.947s</strong>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  버킷 안 분포는 모르므로 <strong>직선 가정</strong>. SLO 근처에 버킷이 성글면 오차가 커진다.
                </div>
              </div>
            )}

            {/* Step 5: SLO 판정 + summary vs histogram */}
            {step.focus === 'slo' && (
              <div className="space-y-3">
                <div className="rounded-lg bg-white border-2 border-emerald-300 p-3">
                  <div className="text-xs font-bold text-emerald-800 mb-2">SLO: p99 ≤ 1.0s 판정</div>
                  <div className="space-y-2">
                    {[
                      { label: 'mean', val: 0.42, w: 42, cls: 'bg-slate-400' },
                      { label: 'p95', val: 0.95, w: 63, cls: 'bg-purple-500' },
                      { label: 'p99', val: 1.30, w: 87, cls: 'bg-red-500' },
                    ].map((row, i) => (
                      <div key={row.label} className="flex items-center gap-2">
                        <span className="w-10 text-[10px] font-mono text-slate-600">{row.label}</span>
                        <div className="flex-1 h-5 bg-slate-100 rounded relative overflow-hidden">
                          <div className={`h-full ${row.cls} rounded transition-all duration-500`} style={{ width: tick > i ? `${row.w}%` : '0%' }} />
                        </div>
                        <span className="w-12 text-[10px] font-mono text-slate-700">{row.val}s</span>
                      </div>
                    ))}
                    <div className="relative h-4">
                      <div className="absolute" style={{ left: 'calc(2.5rem + 66%)' }}>
                        <div className="text-[9px] text-red-600 font-bold">SLO 1.0s ↑ 위반</div>
                      </div>
                    </div>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="rounded-lg bg-purple-50 border-2 border-purple-300 p-2">
                    <div className="text-[11px] font-bold text-purple-800">Histogram</div>
                    <div className="text-[10px] text-purple-700 leading-tight mt-1">버킷 가산 → 서버에서 합쳐 정확히 집계 ✅</div>
                  </div>
                  <div className="rounded-lg bg-rose-50 border-2 border-rose-300 p-2">
                    <div className="text-[11px] font-bold text-rose-800">Summary</div>
                    <div className="text-[10px] text-rose-700 leading-tight mt-1">client 계산 → 인스턴스 합산 불가 ❌</div>
                  </div>
                </div>
                <div className="text-[11px] text-slate-600 leading-snug bg-slate-50 rounded p-2 border border-slate-200">
                  p99가 <strong className="text-red-600">1.3s</strong>로 SLO(1.0s)를 위반 → 알림 발동. 새 코드는 보통 Histogram.
                </div>
              </div>
            )}
          </div>

          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <code ref={codeRef} className={`language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="챕터 목록으로">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-2</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#E6522C' }}>II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. PromQL &gt; Chapter 2. 집계 함수</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">histogram_quantile — p95 지연</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                히스토그램에서 백분위수 계산 — <strong>지연 SLO의 핵심</strong>. 평균이 감추는 꼬리 지연을
                누적 버킷과 <code className="bg-orange-100 px-1 rounded">histogram_quantile</code>로 드러낸다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#B8421F' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider opacity-80">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs opacity-80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-orange-50 border-2 border-orange-300 text-orange-900 text-sm">
                💡 Part II 완료 — 다음(III-1-1)부터는 <strong>Alerting</strong> — 규칙과 알림 라우팅
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'} aria-pressed={isPlaying}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white hover:opacity-90 transition min-w-[96px]" style={{ background: '#E6522C' }}>
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700" aria-label="챕터 목록">&larr; 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="text-orange-600 hover:text-orange-800 font-medium" aria-label="다음 자료 III-1-1">III-1-1 Alerting &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
