  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Elasticsearch Chapter IV-1-1 — Cluster Node 역할
    학습 목표: master / data / coordinating / ingest 노드의 역할 분리
    핵심 비유: 조직 구조 — 의장(master) / 창고(data) / 안내데스크(coordinating) / 가공실(ingest)
    패턴: fastapi v1 — 좌(LiveDataPane: 클러스터 토폴로지) / 우(VSCode CodeViewer)
    색상: zinc
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      master: {lang:'yaml', filename:'step1-master.yml', lines:[
        '# Step 1. Master 노드 — 클러스터의 두뇌',
        '',
        '# elasticsearch.yml',
        'cluster.name: prod-cluster',
        'node.name: master-1',
        'node.roles: [master]               # ← master 전용',
        '',
        '# master-eligible 노드 (master 후보) 는 보통 3개',
        'discovery.seed_hosts:',
        '  - master-1:9300',
        '  - master-2:9300',
        '  - master-3:9300',
        '',
        'cluster.initial_master_nodes:        # 첫 부트스트랩 시',
        '  - master-1',
        '  - master-2',
        '  - master-3',
        '',
        '# Master 가 하는 일',
        '#  ✅ 인덱스 생성/삭제 메타 관리',
        '#  ✅ shard 배치 결정',
        '#  ✅ 노드 합류/이탈 감지',
        '#  ✅ 클러스터 상태 broadcast',
        '#',
        '# Master 가 안 하는 일',
        '#  ❌ 데이터 저장',
        '#  ❌ 검색/색인 요청 처리',
        '#  ❌ HTTP 받음 (운영에선 보통)',
        '',
        '# 사양',
        '#  • CPU: 4 vCPU (가벼움)',
        '#  • RAM: 8GB (heap 4GB)',
        '#  • Disk: 50GB (메타만)',
        '#  • 비싼 노드 X — 가벼운 노드 3개가 정답',
        '',
        '# Master 후보 수와 quorum',
        '#  3 노드 → quorum = 2 (1 장애 견딤)',
        '#  5 노드 → quorum = 3 (2 장애 견딤)',
        '#  짝수 X — 정확히 반 분할 시 결정 불가',
      ]},
      data: {lang:'yaml', filename:'step2-data.yml', lines:[
        '# Step 2. Data 노드 — 실제 작업자',
        '',
        'node.name: data-hot-1',
        'node.roles: [data_hot]              # hot tier 전용',
        '',
        '# 또는 일반 data 노드 (소형 클러스터)',
        '# node.roles: [data]',
        '',
        '# Data 노드 종류 (8.x)',
        '#  • data           — 모든 tier 처리 (소형)',
        '#  • data_content   — 검색 데이터 (UI 검색)',
        '#  • data_hot       — 활성 쓰기 + 검색',
        '#  • data_warm      — 읽기 위주',
        '#  • data_cold      — searchable snapshot',
        '#  • data_frozen    — partial snapshot (가장 저렴)',
        '',
        '# Hot 노드 사양 (가장 비쌈)',
        '#  • CPU: 8~16 vCPU',
        '#  • RAM: 32~64GB (heap 30GB 한계)',
        '#  • Disk: NVMe SSD 1~2TB',
        '#  • 비용 단위: 100',
        '',
        '# Warm 노드 사양',
        '#  • CPU: 4~8 vCPU',
        '#  • RAM: 16GB',
        '#  • Disk: 저가 SSD 또는 HDD 4TB',
        '#  • 비용 단위: 30',
        '',
        '# 확장',
        '#  • 처리량 부족 → data 노드 추가 (수평 확장)',
        '#  • shard 가 자동으로 새 노드로 rebalance',
        '#  • 노드 추가 = 검색 처리량 거의 선형 증가',
        '',
        '# Disk watermark',
        'cluster.routing.allocation.disk.watermark.low:   85%   # 새 shard 안 만듬',
        'cluster.routing.allocation.disk.watermark.high:  90%   # shard 이동 시작',
        'cluster.routing.allocation.disk.watermark.flood_stage: 95%   # 인덱스 read-only',
      ]},
      coord: {lang:'yaml', filename:'step3-coord.yml', lines:[
        '# Step 3. Coordinating-only 노드',
        '',
        '# 모든 역할 빼면 자동으로 coordinating-only',
        'node.name: coord-1',
        'node.roles: []                      # 빈 배열 = coordinating only',
        '',
        '# 역할',
        '#  1) HTTP 받음',
        '#  2) 검색 → 어느 shard 들에 보낼지 결정',

        beat:{ label:'lowercase + geoip', at:'step4-ingest.json L8–13',
               caption:'level 을 소문자로 바꾸고, client_ip 로 국가/도시를 채운 geo 필드를 만든다.',
               changes:[{mark:'changed', text:'level: ERROR → error'},
                        {mark:'new', text:'geo 필드 생성'}] },
        nodeType: 'ingest', nodes: 2, responsibility: '정규화 + GeoIP',
        verdict: '가공', verdictTone: 'good',
        keyPoint: 'GeoIP 는 IP 하나로 지도 시각화를 가능하게 만든다.',
        code:{...CODE.ingest, highlight:[8,9,10,11,12,13]},
      },
      { ...S4,
        beat:{ label:'ts 를 @timestamp 로', at:'step4-ingest.json L14–20',
               caption:'UNIX_MS 숫자를 date 타입으로 파싱해 @timestamp 에 넣는다.',
               changes:[{mark:'new', text:'@timestamp 생성'},
                        {mark:'read', text:'formats: UNIX_MS'}] },
        nodeType: 'ingest', nodes: 2, responsibility: '시간 필드 파싱',
        verdict: '변환', verdictTone: 'good',
        keyPoint: '@timestamp 가 있어야 Kibana 시간축을 쓸 수 있다.',
        code:{...CODE.ingest, highlight:[14,15,16,17,18,19,20]},
      },
      { ...S4,
        beat:{ label:'불필요 필드 제거 + 태깅', at:'step4-ingest.json L21–28',
               caption:'원본 ts 와 내부 id 를 지우고, env=prod 를 모든 문서에 붙인다.',
               changes:[{mark:'gone', text:'ts, trace_id_internal'},
                        {mark:'new', text:'env: prod'}] },
        nodeType: 'ingest', nodes: 2, responsibility: '필드 정리',
        verdict: '정리', verdictTone: 'good',
        keyPoint: '안 쓰는 필드를 지우면 인덱스 크기와 매핑이 같이 준다.',
        code:{...CODE.ingest, highlight:[21,22,23,24,25,26,27,28]},
      },
      { ...S4,
        beat:{ label:'pipeline 지정해 색인', at:'step4-ingest.json L30–37',
               caption:'?pipeline=logs_pipeline 을 붙이면 저장 전에 이 파이프라인을 통과한다.',
               changes:[{mark:'new', text:'?pipeline=logs_pipeline'},
                        {mark:'read', text:'원문 ts / ERROR / IP'}] },
        nodeType: 'ingest', nodes: 2, responsibility: '색인 요청 전처리',
        verdict: '적용', verdictTone: 'good',
        keyPoint: '인덱스 기본값으로 default_pipeline 을 걸어 두면 매번 붙일 필요가 없다.',
        code:{...CODE.ingest, highlight:[30,31,32,33,34,35,36,37]},
      },
      { ...S4,
        beat:{ label:'저장된 문서의 모습', at:'step4-ingest.json L39–46',
               caption:'ts 는 사라지고 @timestamp·geo·env 가 붙은 형태로 저장된다.',
               changes:[{mark:'new', text:'@timestamp / geo / env'},
                        {mark:'changed', text:'level: error'},
                        {mark:'gone', text:'ts 원본 없음'}] },
        nodeType: 'ingest', nodes: 2, responsibility: '색인 전 ETL',
        verdict: '가공실', verdictTone: 'good',
        keyPoint: 'Logstash 없이 가벼운 ETL 처리 가능. data 노드와 분리하면 CPU 분리.',
        code:{...CODE.ingest, highlight:[39,40,41,42,43,44,45,46]},
      },

      // ── Step 5. 토폴로지 ──────────────────────────────────────────────
      { ...S5,
        beat:{ label:'master 3대부터', at:'step5-topology.yml L3–6',
               caption:'가벼운 4 vCPU 노드 3대. quorum 2 로 1대 장애를 견딘다.',
               changes:[{mark:'new', text:'master x 3'},
                        {mark:'read', text:'4 vCPU / 8GB'}] },
        nodeType: 'master', nodes: 3, responsibility: 'master x 3',
        verdict: '3 노드', verdictTone: 'good',
        keyPoint: 'master 는 비싸게 살 이유가 없다. 대신 반드시 3대.',
        code:{...CODE.topology, highlight:[3,4,5,6]},
      },
      { ...S5,
        beat:{ label:'data hot + warm 6대', at:'step5-topology.yml L8–11, L13–16',
               caption:'쓰기용 hot 3대(NVMe) 와 읽기용 warm 3대(HDD) 로 비용을 나눈다.',
               changes:[{mark:'new', text:'data_hot x 3'},
                        {mark:'new', text:'data_warm x 3'}] },
        nodeType: 'data', nodes: 6, responsibility: 'data hot 3 + warm 3',
        verdict: '6 노드', verdictTone: 'good',
        keyPoint: 'hot 은 SSD, warm 은 HDD. ILM 이 둘 사이를 자동으로 옮긴다.',
        code:{...CODE.topology, highlight:[8,9,10,11,13,14,15,16]},
      },
      { ...S5,
        beat:{ label:'coordinating 2대', at:'step5-topology.yml L18–21',
               caption:'빈 roles 2대를 앞에 두어 Kibana·대형 집계 부하를 받아 낸다.',
               changes:[{mark:'new', text:'coord x 2'},
                        {mark:'read', text:'RAM 32GB'}] },
        nodeType: 'coordinating', nodes: 2, responsibility: 'coordinating x 2',
        verdict: '2 노드', verdictTone: 'good',
        keyPoint: '클라이언트와 Kibana 는 이 두 대만 바라보게 한다.',
        code:{...CODE.topology, highlight:[18,19,20,21]},
      },
      { ...S5,
        beat:{ label:'ingest 2대 (선택)', at:'step5-topology.yml L23–25',
               caption:'전처리 CPU 를 data 노드에서 떼어 낸다. 파이프라인이 적으면 생략해도 된다.',
               changes:[{mark:'new', text:'ingest x 2'},
                        {mark:'gone', text:'없어도 동작함'}] },
        nodeType: 'ingest', nodes: 2, responsibility: 'ingest x 2 (선택)',
        verdict: '선택', verdictTone: 'warn',
        keyPoint: 'ingest 는 필요할 때 붙이는 역할. 처음부터 둘 필요는 없다.',
        code:{...CODE.topology, highlight:[23,24,25]},
      },
      { ...S5,
        beat:{ label:'헬스로 13대 확인', at:'step5-topology.yml L30–33',
               caption:'_cluster/health 가 green 이고 노드 13 / data 노드 6 이면 의도대로 구성된 것이다.',
               changes:[{mark:'read', text:'status: green'},
                        {mark:'changed', text:'number_of_nodes: 13'}] },
        nodeType: '전체 토폴로지', nodes: 13, responsibility: '구성 검증',
        verdict: '13 노드', verdictTone: 'good',
        keyPoint: '노드 수와 data 노드 수를 헬스에서 먼저 확인한다.',
        code:{...CODE.topology, highlight:[30,31,32,33]},
      },
      { ...S5,
        beat:{ label:'split-brain 방지 규칙', at:'step5-topology.yml L43–46',
               caption:'master 후보 홀수 + 정확한 seed_hosts. 8.x 는 quorum 을 자동 계산한다.',
               changes:[{mark:'gone', text:'짝수 후보 금지'},
                        {mark:'read', text:'8.x 자동 quorum'}] },
        nodeType: '전체 토폴로지', nodes: 13, responsibility: '운영 권장 구성',
        verdict: '13 노드', verdictTone: 'good',
        summary: {
          title: '권장 토폴로지 (중대형)',
          rows: [
            { metric: 'master', before: '3 노드', after: '4 vCPU, 8GB', delta: 'quorum 2' },
            { metric: 'data_hot', before: '3 노드', after: '16 vCPU, 64GB SSD', delta: '쓰기' },
            { metric: 'data_warm', before: '3 노드', after: '8 vCPU, 16GB HDD', delta: '읽기' },
            { metric: 'coordinating', before: '2 노드', after: '4 vCPU, 32GB', delta: '집계' },
            { metric: 'ingest', before: '2 노드', after: '8 vCPU, 16GB', delta: 'ETL (선택)' },
          ],
        },
        keyPoint: '소형은 master+data 겸용 3노드로 시작. 크면 역할 분리로 안정성/성능 ↑.',
        code:{...CODE.topology, highlight:[43,44,45,46]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-yellow-400 bg-white p-3">
          <div className="text-sm font-bold text-yellow-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-yellow-500 border-b border-yellow-200">
                <th className="py-1 pr-2">역할</th><th className="py-1 pr-2">수량</th><th className="py-1 pr-2">사양</th><th className="py-1">비고</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-yellow-100">
                  <td className="py-1 pr-2 font-medium text-yellow-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-yellow-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-yellow-700 text-[10px]">{r.after}</td>
                  <td className="py-1 text-yellow-800 text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const roleColor = {
        master: 'bg-purple-500',
        data: 'bg-yellow-700',
        coordinating: 'bg-sky-500',
        ingest: 'bg-emerald-500',
      }[state.nodeType] || 'bg-yellow-600';

      return (
        <div className="rounded-xl border border-yellow-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-yellow-800">노드 역할</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className={`rounded-lg p-4 text-white ${roleColor}`}>
            <div className="text-[10px] uppercase opacity-80">node type</div>
            <div className="text-2xl font-bold">{state.nodeType}</div>
            <div className="text-[10px] mt-1 opacity-90">{state.responsibility}</div>
          </div>

          <div className="mt-3 rounded-lg bg-yellow-50 border border-yellow-200 p-3">
            <div className="flex justify-between items-center">
              <span className="text-[11px] font-bold text-yellow-700">노드 수 (권장)</span>
              <span className="text-2xl font-bold text-yellow-800 font-mono">{state.nodes}</span>
            </div>
            <div className="mt-2 flex gap-1">
              {Array.from({ length: Math.min(state.nodes, 15) }, (_, i) => (
                <div key={i} className={`w-4 h-6 rounded ${roleColor} opacity-80`} />
              ))}
            </div>
          </div>

          <div className="mt-3 rounded-lg bg-white border border-yellow-300 p-3">
            <div className="text-[11px] font-bold text-yellow-700 mb-2">전체 토폴로지</div>
            <div className="space-y-1">
              {[
                ['master', 3, 'bg-purple-500'],
                ['data_hot', 3, 'bg-rose-500'],
                ['data_warm', 3, 'bg-amber-500'],
                ['coord', 2, 'bg-sky-500'],
                ['ingest', 2, 'bg-emerald-500'],
              ].map(([name, n, color]) => (
                <div key={name} className="flex items-center gap-2">
                  <span className="text-[10px] text-yellow-700 w-20">{name}</span>
                  <div className="flex gap-0.5">
                    {Array.from({ length: n }, (_, i) => (
                      <span key={i} className={`w-3 h-3 rounded ${color}`} />
                    ))}
                  </div>
                  <span className="text-[10px] text-yellow-500 ml-auto">x{n}</span>
                </div>
              ))}
            </div>
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-yellow-800 bg-yellow-100 border border-yellow-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-yellow-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-yellow-800 border-b border-yellow-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-yellow-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-yellow-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-yellow-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-yellow-500/25 border-l-2 border-yellow-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-yellow-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-yellow-800 border-t border-yellow-700 flex items-center justify-between text-[10px] text-yellow-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-stone-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-yellow-700 text-white font-bold">E</span>
              <div>
                <h1 className="text-2xl font-bold text-yellow-900">Chapter IV-1-1. Cluster 노드 역할</h1>
                <p className="text-sm text-yellow-700/80">master / data / coordinating / ingest — 책임 분리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-yellow-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-yellow-700' : 'bg-yellow-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-yellow-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-yellow-900 text-white' : 'bg-yellow-700 text-white hover:bg-yellow-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-yellow-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-yellow-400 bg-white px-4 py-3 text-sm text-yellow-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                master 3개 (홀수, split-brain 방지) + data (저장/검색) + coordinating (큰 집계 분리) + ingest (ETL). 소형은 겸용 3노드, 대형은 역할 분리.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Master', 'Data', 'Coordinating', 'Ingest', 'Split-brain', 'Topology'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-800 border border-yellow-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-yellow-700">
              <a href="../part3/III-2-2.html" className="underline hover:no-underline">← III-2-2 ILM</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 Shard / Replica →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
