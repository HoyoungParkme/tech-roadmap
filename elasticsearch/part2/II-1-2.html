  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧪</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Elasticsearch Chapter II-1-2 — Analyzer (Tokenizer + Filter)
    학습 목표: 문장이 어떻게 검색 가능한 토큰으로 변환되는지 3단계로 보여준다
    핵심 비유: 식재료 손질 — 씻기(char filter) → 썰기(tokenizer) → 양념(token filter)
    패턴: fastapi v1 — 좌(LiveDataPane: 토큰 변환 단계) / 우(VSCode CodeViewer)
    색상: zinc
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      charFilter: {lang:'json', filename:'step1-char-filter.json', lines:[
        '// Step 1. Char Filter — HTML 태그 제거 + 치환',
        '',
        'PUT /demo_char',
        '{',
        '  "settings": {',
        '    "analysis": {',
        '      "char_filter": {',
        '        "emoji_mapping": {',
        '          "type": "mapping",',
        '          "mappings": [":) => happy", ":( => sad"]',
        '        }',
        '      },',
        '      "analyzer": {',
        '        "my_html_analyzer": {',
        '          "type": "custom",',
        '          "char_filter": ["html_strip", "emoji_mapping"],',
        '          "tokenizer": "standard",',
        '          "filter": ["lowercase"]',
        '        }',
        '      }',
        '    }',
        '  }',
        '}',
        '',
        '// _analyze 로 테스트',
        'POST /demo_char/_analyze',
        '{',
        '  "analyzer": "my_html_analyzer",',
        '  "text": "<b>Kafka</b> :) is awesome"',
        '}',
        '',
        '// 결과 토큰: ["kafka", "happy", "is", "awesome"]',
        '//  • <b></b> 제거 (html_strip)',
        '//  • :) → happy (mapping)',
        '//  • lowercase (token filter)',
      ]},
      tokenizer: {lang:'json', filename:'step2-tokenizer.json', lines:[
        '// Step 2. Tokenizer 종류별 비교',
        '',
        '// (1) standard — 공백 + 구두점 분리',
        'POST _analyze',
        '{ "tokenizer": "standard", "text": "Hello, world!" }',
        '// → ["Hello", "world"]',
        '',
        '// (2) whitespace — 공백만',
        'POST _analyze',
        '{ "tokenizer": "whitespace", "text": "Hello, world!" }',
        '// → ["Hello,", "world!"]   ← 쉼표 안 자름',
        '',
        '// (3) keyword — 자르지 않음 (전체가 토큰 1개)',
        'POST _analyze',
        '{ "tokenizer": "keyword", "text": "Hello, world!" }',
        '// → ["Hello, world!"]',
        '',
        '// (4) ngram — n 글자씩 슬라이딩 (자동완성용)',
        'POST _analyze',
        '{',
        '  "tokenizer": { "type": "ngram", "min_gram": 2, "max_gram": 3 },',
        '  "text": "kafka"',
        '}',
        '// → ["ka", "kaf", "af", "afk", "fk", "fka", "ka"]',
        '',
        '// (5) edge_ngram — 앞에서부터만 (검색바 prefix)',
        'POST _analyze',
        '{',
        '  "tokenizer": { "type": "edge_ngram", "min_gram": 1, "max_gram": 5 },',
        '  "text": "kafka"',
        '}',
        '// → ["k", "ka", "kaf", "kafk", "kafka"]',
        '',
        '// (6) path_hierarchy — 경로 계층 (네비/카테고리)',
        'POST _analyze',
        '{ "tokenizer": "path_hierarchy", "text": "/electronics/laptop/mac" }',
        '// → ["/electronics", "/electronics/laptop", "/electronics/laptop/mac"]',
      ]},
      tokenFilter: {lang:'json', filename:'step3-token-filter.json', lines:[
        '// Step 3. Token Filter 체인 — running → run',
        '',
        'PUT /english_demo',
        '{',
        '  "settings": {',
        '    "analysis": {',
        '      "filter": {',
        '        "english_stop":    { "type": "stop",     "stopwords": "_english_" },',
        '        "english_stemmer": { "type": "stemmer",  "language": "english" },',
        '        "synonym_filter":  {',
        '          "type": "synonym",',
        '          "synonyms": ["laptop, notebook", "tv, television"]',
        '        }',
        '      },',
        '      "analyzer": {',
        '        "english_full": {',
        '          "type": "custom",',
        '          "tokenizer": "standard",',
        '          "filter": [',
        '            "lowercase",',
        '            "english_stop",',
        '            "english_stemmer",',
        '            "synonym_filter"',
        '          ]',
        '        }',
        '      }',
        '    }',
        '  }',
        '}',
        '',
        '// 테스트',
        'POST /english_demo/_analyze',
        '{',
        '  "analyzer": "english_full",',
        '  "text": "The running laptops are fast"',
        '}',
        '',
        '// 결과: ["run", "laptop", "notebook", "fast"]',
        '//  • lowercase: The → the',
        '//  • stop:      the/are 제거',
        '//  • stemmer:   running → run, laptops → laptop',
        '//  • synonym:   laptop → notebook 도 함께 색인',
      ]},

        beat:{ label:'title 필드에 붙인다', at:'step4-nori.sh L22–24',
               caption:'매핑에서 analyzer 를 지정해야 그 필드의 색인에 실제로 적용된다.',
               changes:[{mark:'new',  text:'title: text + analyzer korean'},
                        {mark:'read', text:'다른 필드는 여전히 standard'}] },
        stage: 'Nori (Korean)',
        before: '쿠팡에서 빠른 배송',
        after: 'title 필드에 korean 적용',
        active: 'mappings.title.analyzer',
        verdict: '필드 적용',
        verdictTone: 'good',
        keyPoint: 'analyzer 를 정의만 하고 매핑에 안 붙이면 아무 일도 일어나지 않는다. 흔한 실수다.',
        code:{...CODE.nori, highlight:[22,23,24]},
      },
      { ...S4,
        beat:{ label:'한국어 문장을 넣어 본다', at:'step4-nori.sh L29–30, L33–34',
               caption:'"쿠팡에서 빠른 배송으로 받았다" 를 korean analyzer 로 분석 요청한다.',
               changes:[{mark:'new',  text:'POST /news/_analyze'},
                        {mark:'read', text:'analyzer: korean'}] },
        stage: 'Nori (Korean)',
        before: '쿠팡에서 빠른 배송으로 받았다',
        after: '(형태소 분석 중)',
        active: 'korean analyzer',
        verdict: '테스트',
        verdictTone: 'good',
        keyPoint: '한국어는 눈으로 결과를 봐야 감이 온다. 자주 쓰는 검색어 몇 개는 꼭 돌려 본다.',
        code:{...CODE.nori, highlight:[29,30,33,34]},
      },
      { ...S4,
        beat:{ label:'조사와 어미가 떨어진다', at:'step4-nori.sh L37–39',
               caption:'"쿠팡에서" 가 쿠팡 + 에서 로 갈라진다. 그래서 검색어 "쿠팡" 하나로도 걸린다.',
               changes:[{mark:'changed', text:'쿠팡에서 → 쿠팡 / 에서'},
                        {mark:'changed', text:'빠른 → 빠르 (어간)'},
                        {mark:'new',     text:'"쿠팡" 검색으로 매칭'}] },
        stage: 'Nori (Korean)',
        before: '쿠팡에서 빠른 배송',
        after: '["쿠팡", "에서", "빠르", "배송"]',
        active: 'nori_tokenizer + nori_part_of_speech',
        verdict: '한국어 분석',
        verdictTone: 'good',
        keyPoint: '한국어 검색은 nori 가 사실상 필수. ES 공식 플러그인.',
        code:{...CODE.nori, highlight:[37,38,39]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'아무 설정 없이 문장만 보낸다', at:'step5-analyze-api.sh L3–6',
               caption:'인덱스 없이 _analyze 만 호출하면 기본 standard analyzer 로 분석해 준다.',
               changes:[{mark:'new',  text:'POST /_analyze'},
                        {mark:'read', text:'analyzer 미지정 → standard'}] },
        stage: '_analyze API',
        before: 'The Quick Brown Fox',
        after: '(standard 로 분석 요청)',
        active: 'standard (기본)',
        verdict: '기본 분석',
        verdictTone: 'good',
        keyPoint: '인덱스를 만들지 않고도 쓸 수 있다. analyzer 를 고를 때 가장 빠른 실험 도구.',
        code:{...CODE.analyzeApi, highlight:[3,4,5,6]},
      },
      { ...S5,
        beat:{ label:'응답에 위치 정보까지 들어 있다', at:'step5-analyze-api.sh L8–14',
               caption:'토큰마다 원문에서의 시작/끝 위치와 순서(position)가 함께 온다. 하이라이팅과 구문 검색의 근거다.',
               changes:[{mark:'read',    text:'token / start_offset / end_offset'},
                        {mark:'read',    text:'position — 어순'},
                        {mark:'changed', text:'The → the (소문자)'}] },
        stage: '_analyze API',
        before: 'The Quick Brown Fox',
        after: '["the", "quick", "brown", "fox"]',
        active: 'tokens[] 응답',
        verdict: '토큰 확인',
        verdictTone: 'good',
        keyPoint: 'position 이 어긋나면 match_phrase 가 안 걸린다. 구문 검색 문제는 여기부터 본다.',
        code:{...CODE.analyzeApi, highlight:[8,9,10,11,12,13,14]},
      },
      { ...S5,
        beat:{ label:'field 를 주면 실제 매핑대로 돈다', at:'step5-analyze-api.sh L17–20',
               caption:'analyzer 이름 대신 field 를 주면, 그 필드에 매핑된 analyzer 를 그대로 써서 분석한다.',
               changes:[{mark:'changed', text:'analyzer → field 로 지정'},
                        {mark:'read',    text:'products.title 의 실제 매핑 적용'}] },
        stage: '_analyze API',
        before: '맥북 프로 14',
        after: 'title 필드 매핑대로 분석',
        active: 'field: title',
        verdict: '실제 매핑',
        verdictTone: 'good',
        keyPoint: '운영 문제를 재현할 때는 반드시 field 로 호출한다. 내가 생각한 analyzer 와 실제가 다를 수 있다.',
        code:{...CODE.analyzeApi, highlight:[17,18,19,20]},
      },
      { ...S5,
        beat:{ label:'조합을 즉석에서 만들어 본다', at:'step5-analyze-api.sh L22, L25–28',
               caption:'인덱스를 만들지 않고 tokenizer 와 filter 를 직접 조합해 결과만 확인할 수 있다.',
               changes:[{mark:'new',  text:'tokenizer + filter 직접 조합'},
                        {mark:'gone', text:'인덱스 생성 불필요'}] },
        stage: '_analyze API',
        before: '검색하다',
        after: 'nori + lowercase + 품사 필터 결과',
        active: 'nori_tokenizer + 필터 2종',
        verdict: '즉석 조합',
        verdictTone: 'good',
        keyPoint: '매핑을 고치기 전에 여기서 먼저 실험한다. 인덱스를 지웠다 만들 필요가 없다.',
        code:{...CODE.analyzeApi, highlight:[22,25,26,27,28]},
      },
      { ...S5,
        beat:{ label:'안 찾힐 때 밟는 4단계', at:'step5-analyze-api.sh L31–35',
               caption:'색인 토큰과 검색어 토큰을 각각 뽑아 겹치는지 본다. 안 겹치면 analyzer 를 맞추거나 search_analyzer 를 따로 준다.',
               changes:[{mark:'read',    text:'색인 토큰 vs 검색어 토큰'},
                        {mark:'changed', text:'불일치 → search_analyzer 지정'}] },
        stage: '_analyze API',
        before: '검색어',
        after: '실제 토큰 리스트',
        active: 'debugging',
        verdict: '디버깅',
        verdictTone: 'good',
        summary: {
          title: 'Analyzer 3단계 구조',
          rows: [
            { metric: 'Char Filter', before: '원본 문자열', after: '다듬어진 문자열', delta: '0..N' },
            { metric: 'Tokenizer', before: '문자열', after: '토큰 배열', delta: '1' },
            { metric: 'Token Filter', before: '토큰 배열', after: '가공된 토큰 배열', delta: '0..N' },
            { metric: '결과', before: 'JSON 문장', after: 'Inverted Index 키', delta: '✓' },
          ],
        },
        keyPoint: '"왜 안 찾혀?" 의 90% 는 analyzer 미스매치. _analyze 로 먼저 확인.',
        code:{...CODE.analyzeApi, highlight:[31,32,33,34,35]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-yellow-400 bg-white p-3">
          <div className="text-sm font-bold text-yellow-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-yellow-500 border-b border-yellow-200">
                <th className="py-1 pr-2">단계</th><th className="py-1 pr-2">입력</th><th className="py-1 pr-2">출력</th><th className="py-1">개수</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-yellow-100">
                  <td className="py-1 pr-2 font-medium text-yellow-700 text-[11px]">{r.metric}</td>
                  <td className="py-1 pr-2 text-yellow-700 text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-yellow-700 text-[10px]">{r.after}</td>
                  <td className="py-1 text-yellow-800 font-mono">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-yellow-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-yellow-800">Analyzer 파이프라인</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="rounded-lg border border-yellow-300 bg-yellow-50 p-3">
            <div className="text-[10px] text-yellow-500 mb-1">현재 단계</div>
            <div className="text-sm font-bold text-yellow-800">{state.stage}</div>
            <div className="text-[10px] text-yellow-600 mt-1 font-mono">{state.active}</div>
          </div>

          <div className="mt-3 grid grid-cols-1 gap-2">
            <div className="rounded-lg border border-rose-200 bg-rose-50 p-3">
              <div className="text-[10px] text-rose-600 mb-1">BEFORE</div>
              <div className="text-xs font-mono text-rose-900 break-all">{state.before}</div>
            </div>
            <div className="flex justify-center text-yellow-400">↓</div>
            <div className="rounded-lg border border-emerald-200 bg-emerald-50 p-3">
              <div className="text-[10px] text-emerald-600 mb-1">AFTER</div>
              <div className="text-xs font-mono text-emerald-900 break-all">{state.after}</div>
            </div>
          </div>

          <div className="mt-3 rounded-lg bg-yellow-50 border border-yellow-200 p-3">
            <div className="text-[11px] font-bold text-yellow-700 mb-2">3단계 흐름</div>
            <div className="flex items-center justify-between text-[10px] font-mono">
              <span className={`px-2 py-1 rounded ${state.stage === 'Char Filter' ? 'bg-yellow-700 text-white' : 'bg-white border border-yellow-300'}`}>Char</span>
              <span className="text-yellow-400">→</span>
              <span className={`px-2 py-1 rounded ${state.stage === 'Tokenizer' ? 'bg-yellow-700 text-white' : 'bg-white border border-yellow-300'}`}>Token</span>
              <span className="text-yellow-400">→</span>
              <span className={`px-2 py-1 rounded ${state.stage === 'Token Filter' || state.stage === 'Nori (Korean)' ? 'bg-yellow-700 text-white' : 'bg-white border border-yellow-300'}`}>Filter</span>
              <span className="text-yellow-400">→</span>
              <span className="px-2 py-1 rounded bg-emerald-600 text-white">Index</span>
            </div>
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-yellow-800 bg-yellow-100 border border-yellow-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-yellow-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-yellow-800 border-b border-yellow-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-yellow-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-yellow-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-yellow-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-yellow-500/25 border-l-2 border-yellow-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-yellow-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-yellow-800 border-t border-yellow-700 flex items-center justify-between text-[10px] text-yellow-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-stone-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-yellow-700 text-white font-bold">E</span>
              <div>
                <h1 className="text-2xl font-bold text-yellow-900">Chapter II-1-2. Analyzer</h1>
                <p className="text-sm text-yellow-700/80">Char Filter → Tokenizer → Token Filter — 토큰화의 3단계</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-yellow-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-yellow-700' : 'bg-yellow-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-yellow-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50" aria-label="처음으로">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50 disabled:opacity-40" aria-label="이전 단계">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-yellow-900 text-white' : 'bg-yellow-700 text-white hover:bg-yellow-800'}`} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50 disabled:opacity-40" aria-label="다음 단계">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-yellow-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-yellow-400 bg-white px-4 py-3 text-sm text-yellow-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Analyzer = Char Filter + Tokenizer + Token Filter. 토큰화가 검색 결과를 결정. 한국어는 nori. 안 찾힐 땐 _analyze 로 토큰 먼저 확인.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Analyzer', 'Tokenizer', 'Filter', 'Nori', 'Stemmer', '_analyze'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-800 border border-yellow-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-yellow-700">
              <a href="./II-1-1.html" className="underline hover:no-underline">← II-1-1 Index/Document/Mapping</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 Query DSL →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
