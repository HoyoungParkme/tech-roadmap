<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elasticsearch 학습 — III-2-1. Reindex</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔁</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Elasticsearch Chapter III-2-1 — Reindex
    학습 목표: 매핑 변경 시 새 인덱스로 옮기는 표준 절차 + alias zero-downtime
    핵심 비유: 이사 — 새 집(인덱스) 만들고 짐 옮기고 주소(alias) 만 바꾼다
    패턴: fastapi v1 — 좌(LiveDataPane: alias 전환) / 우(VSCode CodeViewer)
    색상: zinc
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      locked: {lang:'bash', filename:'step1-mapping-locked.sh', lines:[
        '# Step 1. 매핑 변경이 안 되는 케이스',
        '',
        '# 기존 매핑 확인',
        'curl http://localhost:9200/products/_mapping?pretty',
        '# {',
        '#   "products": {',
        '#     "mappings": {',
        '#       "properties": {',
        '#         "price": { "type": "long" }',
        '#       }',
        '#     }',
        '#   }',
        '# }',
        '',
        '# 시도: long → double 로 변경',
        'curl -X PUT "http://localhost:9200/products/_mapping" \\',
        '  -H "Content-Type: application/json" \\',
        '  -d \'{',
        '    "properties": {',
        '      "price": { "type": "double" }    // 변경 시도',
        '    }',
        '  }\'',
        '',
        '# 에러',
        '# {',
        '#   "error": "illegal_argument_exception",',
        '#   "reason": "mapper [price] cannot be changed from type [long] to [double]"',
        '# }',
        '',
        '# ✅ 가능한 변경',
        '#  • 새 필드 추가',
        '#  • multi-fields 추가 (text 에 .keyword 같은)',
        '',
        '# ❌ 불가능한 변경',
        '#  • 기존 필드 타입 변경',
        '#  • 분석기 변경',
        '#  • number_of_shards 변경 (settings)',
        '',
        '# 해결책: 새 인덱스 + Reindex + alias 전환',
      ]},
      newIndex: {lang:'bash', filename:'step2-new-index.sh', lines:[
        '# Step 2. 새 매핑으로 v2 인덱스 생성',
        '',
        'curl -X PUT "http://localhost:9200/products_v2" \\',
        '  -H "Content-Type: application/json" \\',
        '  -d \'{',
        '    "settings": {',
        '      "number_of_shards":   3,         // shard 수 변경 가능',
        '      "number_of_replicas": 1,',
        '      "refresh_interval":   "-1"        // 적재 중 refresh 끔',
        '    },',
        '    "mappings": {',
        '      "properties": {',
        '        "title":      { "type": "text", "analyzer": "nori" },',
        '        "price":      { "type": "double" },   // long → double',
        '        "brand":      { "type": "keyword" },',
        '        "tags":       { "type": "keyword" },',
        '        "discount":   { "type": "scaled_float", "scaling_factor": 100 },',
        '        "created_at": { "type": "date" }',
        '      }',
        '    }',
        '  }\'',
        '',
        '# 명명 규칙',
        '#  ✅ products_v1, products_v2, products_v3',
        '#  ✅ logs-2026.05.19',
        '#  ❌ products_new (다음 변경 시 헷갈림)',
        '',
        '# 이제 v1, v2 두 인덱스가 존재',
        'curl "http://localhost:9200/_cat/indices?v"',
        '# index        docs   size',
        '# products_v1  100000 50mb',
        '# products_v2  0      0',
      ]},
      reindex: {lang:'bash', filename:'step3-reindex.sh', lines:[
        '# Step 3. _reindex 실행',
        '',
        '# (1) 기본 reindex',
        'curl -X POST "http://localhost:9200/_reindex?wait_for_completion=false" \\',
        '  -H "Content-Type: application/json" \\',
        '  -d \'{',
        '    "source": {',
        '      "index": "products_v1",',
        '      "size":  1000                    // batch 크기',
        '    },',
        '    "dest": {',
        '      "index": "products_v2"',
        '    }',
        '  }\'',
        '',
        '# 응답 — task ID 반환',
        '# { "task": "abcDEF:12345" }',
        '',
        '# (2) 진행 상황 확인',
        'curl "http://localhost:9200/_tasks/abcDEF:12345?pretty"',
        '# { "task": {',
        '#   "status": {',
        '#     "total":    100000,',
        '#     "created":   45000,',
        '#     "updated":       0,',
        '#     "batches":      45',
        '#   },',
        '#   "running_time_in_nanos": 30000000000',
        '# }}',
        '',
        '# (3) 필드 변환 — Painless script',
        'curl -X POST "http://localhost:9200/_reindex" \\',
        '  -H "Content-Type: application/json" \\',
        '  -d \'{',
        '    "source": { "index": "products_v1" },',
        '    "dest":   { "index": "products_v2" },',
        '    "script": {',
        '      "source": """',

               caption:'코드 변경 0줄, 다운타임 0. 외부에서는 한 순간에 바뀐 것처럼 보인다.',
               changes:[{mark:'read', text:'코드 변경 0줄'},
                        {mark:'read', text:'다운타임 0'}] },
        oldIndex:'products_v1', newIndex:'products_v2', alias:'products → v2 ✓',
        verdict:'효과', verdictTone:'good',
        keyPoint:'배포 없이 데이터 계층만 갈아끼운 것이다.',
        code:{...CODE.alias, highlight:[17,18,19,20,21]},
      },
      { ...S4,
        beat:{ label:'전환 검증', at:'step4-alias-switch.sh L23–25',
               caption:'같은 alias 로 검색했는데 v2 의 결과가 돌아오는지 확인한다.',
               changes:[{mark:'changed', text:'응답 출처 v1 → v2'}] },
        oldIndex:'products_v1', newIndex:'products_v2', alias:'products → v2 ✓',
        verdict:'검증', verdictTone:'good',
        keyPoint:'문서 수와 샘플 문서를 v1 과 비교해 보는 게 안전하다.',
        code:{...CODE.alias, highlight:[23,24,25]},
      },
      { ...S4,
        beat:{ label:'롤백도 같은 방식', at:'step4-alias-switch.sh L27–33',
               caption:'문제가 보이면 방향만 뒤집은 _aliases 호출로 즉시 되돌린다.',
               changes:[{mark:'changed', text:'alias 다시 v1 로'},
                        {mark:'read', text:'롤백 시간 ms'}] },
        oldIndex:'products_v1', newIndex:'products_v2', alias:'products → v1 (롤백)',
        verdict:'롤백 가능', verdictTone:'warn',
        keyPoint:'v1 을 남겨 두는 이유가 바로 이 즉시 롤백이다.',
        code:{...CODE.alias, highlight:[27,28,29,30,31,32,33]},
      },
      { ...S4,
        beat:{ label:'안정화 후 v1 삭제', at:'step4-alias-switch.sh L37–38',
               caption:'보통 1주일 지켜본 뒤 예전 인덱스를 지워 디스크를 회수한다.',
               changes:[{mark:'gone', text:'products_v1 삭제'}] },
        oldIndex:'products_v1 (삭제 예정)', newIndex:'products_v2', alias:'products → v2 ✓',
        verdict:'정리', verdictTone:'good',
        keyPoint:'삭제를 서두르면 롤백 수단이 사라진다.',
        code:{...CODE.alias, highlight:[37,38]},
      },
      { ...S4,
        beat:{ label:'처음부터 alias 로', at:'step4-alias-switch.sh L40–43',
               caption:'클라이언트 입장에서 alias 와 인덱스 이름은 구분되지 않는다. 그래서 공짜다.',
               changes:[{mark:'read', text:'호출 코드는 동일'}] },
        oldIndex:'products_v1', newIndex:'products_v2', alias:'products → v2 ✓',
        verdict:'전환 완료', verdictTone:'good',
        keyPoint:'alias 사용은 운영의 필수. 처음부터 alias 로 코드 작성.',
        code:{...CODE.alias, highlight:[40,41,42,43]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'이름을 상수로 고정', at:'step5-full-flow.py L8–10',
               caption:'OLD / NEW / ALIAS 만 바꾸면 다음 Reindex 에도 그대로 재사용한다.',
               changes:[{mark:'new', text:'OLD / NEW / ALIAS'}] },
        oldIndex:'products_v1', newIndex:'products_v2', alias:'products → v1',
        verdict:'준비', verdictTone:'good',
        keyPoint:'스크립트로 만들어 두면 매핑 변경이 더 이상 무서운 일이 아니다.',
        code:{...CODE.flow, highlight:[8,9,10]},
      },
      { ...S5,
        beat:{ label:'① 적재용 settings 로 생성', at:'step5-full-flow.py L12–19',
               caption:'replica 0, refresh -1 로 만들어 복사 속도를 최대로 끌어올린다.',
               changes:[{mark:'new', text:'products_v2 생성'},
                        {mark:'changed', text:'replica 0 / refresh -1'}] },
        oldIndex:'products_v1', newIndex:'products_v2 (적재 모드)', alias:'products → v1',
        verdict:'v2 생성', verdictTone:'good',
        keyPoint:'복사 중에는 검색도 복제도 필요 없으니 둘 다 끈다.',
        code:{...CODE.flow, highlight:[12,13,14,15,16,17,18,19]},
      },
      { ...S5,
        beat:{ label:'매핑 정의 후 생성', at:'step5-full-flow.py L21–28',
               caption:'바꾸려던 price: double 을 여기에 넣고 create 호출을 닫는다.',
               changes:[{mark:'changed', text:'price → double'}] },
        oldIndex:'products_v1', newIndex:'products_v2 (0 docs)', alias:'products → v1',
        verdict:'v2 생성', verdictTone:'good',
        keyPoint:'매핑은 이 한 번의 호출로 확정된다. 신중하게 적는다.',
        code:{...CODE.flow, highlight:[21,22,23,24,25,26,27,28]},
      },
      { ...S5,
        beat:{ label:'② 비동기 reindex', at:'step5-full-flow.py L30–35',
               caption:'wait_for_completion=False 로 던지고 task_id 를 받아 둔다.',
               changes:[{mark:'new', text:'task_id 확보'},
                        {mark:'read', text:'OLD → NEW 복사 시작'}] },
        oldIndex:'products_v1', newIndex:'products_v2 (복사 중)', alias:'products → v1',
        verdict:'복사 중', verdictTone:'warn',
        keyPoint:'동기 호출은 커넥션 타임아웃으로 실패하기 쉽다.',
        code:{...CODE.flow, highlight:[30,31,32,33,34,35]},
      },
      { ...S5,
        beat:{ label:'③ 완료까지 폴링', at:'step5-full-flow.py L37–41',
               caption:'tasks.get 을 반복 호출해 completed 가 되면 루프를 빠져나온다.',
               changes:[{mark:'read', text:'completed 확인'}] },
        oldIndex:'products_v1', newIndex:'products_v2 (복사 중)', alias:'products → v1',
        verdict:'대기', verdictTone:'warn',
        keyPoint:'완료 판정은 진행률이 아니라 completed 플래그로 한다.',
        code:{...CODE.flow, highlight:[37,38,39,40,41]},
      },
      { ...S5,
        beat:{ label:'진행률 출력', at:'step5-full-flow.py L42–45',
               caption:'created + updated 를 total 로 나눠 5초마다 진행률을 찍는다.',
               changes:[{mark:'changed', text:'진행률 갱신'}] },
        oldIndex:'products_v1', newIndex:'products_v2 (45,000 / 100,000)', alias:'products → v1',
        verdict:'복사 중', verdictTone:'warn',
        keyPoint:'폴링 간격을 너무 짧게 잡으면 클러스터에 불필요한 부하가 간다.',
        code:{...CODE.flow, highlight:[42,43,44,45]},
      },
      { ...S5,
        beat:{ label:'④ 운영 설정 복구', at:'step5-full-flow.py L47–52',
               caption:'refresh 1s, replica 1 로 되돌리고 forcemerge 로 segment 를 정리한다.',
               changes:[{mark:'changed', text:'refresh -1 → 1s'},
                        {mark:'changed', text:'replica 0 → 1'},
                        {mark:'new', text:'forcemerge 1'}] },
        oldIndex:'products_v1', newIndex:'products_v2 (운영 설정)', alias:'products → v1',
        verdict:'복구', verdictTone:'good',
        keyPoint:'이 복구를 빼먹으면 새 인덱스가 검색되지 않아 장애가 된다.',
        code:{...CODE.flow, highlight:[47,48,49,50,51,52]},
      },
      { ...S5,
        beat:{ label:'⑤ alias 를 넘긴다', at:'step5-full-flow.py L54–61',
               caption:'remove + add 한 번으로 트래픽이 v2 로 넘어가고 스크립트가 끝난다.',
               changes:[{mark:'changed', text:'alias v1 → v2'},
                        {mark:'read', text:'코드 변경 0줄'}] },
        oldIndex:'products_v1 (삭제)', newIndex:'products_v2', alias:'products → v2',
        verdict:'완료', verdictTone:'good',
        summary: {
          title: 'Zero-downtime Reindex 5단계',
          rows: [
            { metric: '① alias', before: 'products → v1', after: '처음부터 alias', delta: '필수' },
            { metric: '② 새 인덱스', before: 'PUT v2', after: '새 mapping', delta: '5초' },
            { metric: '③ _reindex', before: 'v1 → v2', after: '백그라운드', delta: '분~시간' },
            { metric: '④ alias 전환', before: 'remove + add', after: '원자적', delta: 'ms' },
            { metric: '⑤ v1 삭제', before: '1주일 후', after: '롤백 여유', delta: '안전' },
          ],
        },
        keyPoint:'코드는 alias 만 호출. 운영자는 인덱스를 갈아끼운다. 코드-인프라 분리의 완벽한 예.',
        code:{...CODE.flow, highlight:[54,55,56,57,58,59,60,61]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-yellow-400 bg-white p-3">
          <div className="text-sm font-bold text-yellow-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-yellow-500 border-b border-yellow-200">
                <th className="py-1 pr-2">단계</th><th className="py-1 pr-2">동작</th><th className="py-1 pr-2">메모</th><th className="py-1">시간</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-yellow-100">
                  <td className="py-1 pr-2 font-medium text-yellow-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-yellow-700 text-[10px] font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-yellow-700 text-[10px]">{r.after}</td>
                  <td className="py-1 text-yellow-800 text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-yellow-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-yellow-800">Reindex 진행 상황</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="rounded-lg border border-yellow-300 bg-yellow-50 p-3">
            <div className="text-[11px] font-bold text-yellow-700 mb-2">현재 alias 매핑</div>
            <div className="font-mono text-sm text-yellow-800">{state.alias}</div>
          </div>

          <div className="mt-3 grid grid-cols-2 gap-2">
            <div className="rounded-lg border border-yellow-400 bg-white p-3 text-center">
              <div className="text-[10px] text-yellow-500 mb-1">OLD</div>
              <div className="text-sm font-mono text-yellow-700">{state.oldIndex}</div>
            </div>
            <div className="rounded-lg border border-emerald-400 bg-emerald-50 p-3 text-center">
              <div className="text-[10px] text-emerald-700 mb-1">NEW</div>
              <div className="text-sm font-mono text-emerald-800">{state.newIndex}</div>
            </div>
          </div>

          <div className="mt-3 rounded-lg bg-yellow-50 border border-yellow-200 p-3">
            <div className="text-[11px] font-bold text-yellow-700 mb-2">5단계 흐름</div>
            <div className="space-y-1">
              {['alias 사용', 'v2 생성', '_reindex', 'alias 전환', 'v1 삭제'].map((name, i) => (
                <div key={name} className="flex items-center gap-2">
                  <span className={`w-4 h-4 rounded-full text-center text-[10px] leading-4 ${i < 5 ? 'bg-yellow-700 text-white' : 'bg-yellow-200'}`}>{i + 1}</span>
                  <span className="text-[11px] text-yellow-700">{name}</span>
                </div>
              ))}
            </div>
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-yellow-800 bg-yellow-100 border border-yellow-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-yellow-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-yellow-800 border-b border-yellow-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-yellow-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-yellow-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-yellow-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-yellow-500/25 border-l-2 border-yellow-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-yellow-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-yellow-800 border-t border-yellow-700 flex items-center justify-between text-[10px] text-yellow-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-50 to-stone-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-yellow-700 text-white font-bold">E</span>
              <div>
                <h1 className="text-2xl font-bold text-yellow-900">Chapter III-2-1. Reindex</h1>
                <p className="text-sm text-yellow-700/80">매핑 변경 = 새 인덱스 + 복사 + alias 전환</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-yellow-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-yellow-700' : 'bg-yellow-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-yellow-800 text-yellow-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-yellow-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button aria-label="처음으로" onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50">처음</button>
              <button aria-label="이전 단계" onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50 disabled:opacity-40">← 이전</button>
              <button aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-yellow-900 text-white' : 'bg-yellow-700 text-white hover:bg-yellow-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button aria-label="다음 단계" onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-yellow-300 bg-white text-yellow-700 hover:bg-yellow-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-yellow-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-yellow-400 bg-white px-4 py-3 text-sm text-yellow-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                매핑 변경 표준 절차: alias 처음부터 사용 → v2 생성 → _reindex (백그라운드) → alias 원자 전환 → v1 안전 삭제. 다운타임 0, 롤백 즉시.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Reindex', 'Alias', 'Zero Downtime', 'Painless', '_tasks', 'Rollback'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-800 border border-yellow-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-yellow-700">
              <a href="./III-1-2.html" className="underline hover:no-underline">← III-1-2 Refresh interval</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 ILM →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
