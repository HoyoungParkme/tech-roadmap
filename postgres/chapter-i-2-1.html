  <!--
    PostgreSQL Chapter I-2-1 — 텍스트 파일과 CSV의 한계
    학습 목표: CSV로 데이터를 저장할 때 부딪히는 4가지 근본 한계를 단계적으로 시연한다.
              ① 검색 느림 (인덱스 없음) ② Lost Update (동시 수정)
              ③ Torn Write (부분 쓰기/정전) ④ 스키마 강제 불가 (타입 안전성)
              마지막 단계에서 데이터베이스가 어떻게 이 4가지를 모두 해결하는지 보여준다.
    핵심 비유: 카페 매출 CSV 파일 — 1000행은 괜찮지만 100만 행 + 동시 사용자 + 정전이 닥치면?
    패턴: fastapi v1 — 좌(LiveDataPane: CSV 파일 박스 + 4가지 한계 카드) / 우(VSCode CodeViewer)
    색상: orange (postgres 도메인)
  -->

    const { useState, useEffect, useRef } = React;

    // 5단계 시나리오 — CSV의 한계 4가지 + DB 해결
    //   csvBox    : 좌측 CSV 파일 박스 상태 (filename, rows, status, note)
    //   limits    : 4가지 한계 카드 배열 [{id, label, status: 'idle'|'ok'|'active', detail}]
    //   solution  : Step 5 DB 해결 박스 (features 리스트)
    //   keyPoint  : 한 줄 핵심 정리 (하단 띠)
    //   code      : 우측 CodeViewer 파일 (lang, filename, lines, highlight)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang: "csv", filename: "csv-1000.csv", lines: ["# Step 1. sales.csv (1000행) — 잘 동작하는 단계","# 카페 사장이 매일 한 줄씩 직접 입력. 한 달 누적 1000행 정도.","","sold_at,store,product,amount","2026-04-01,강남점,아메리카노,4500","2026-04-01,강남점,라떼,5500","2026-04-01,강남점,아메리카노,4500","2026-04-01,강남점,카푸치노,5500","2026-04-02,강남점,아메리카노,4500","2026-04-02,강남점,에스프레소,3500","... (994 rows omitted) ...","2026-05-13,강남점,아메리카노,4500","2026-05-13,강남점,라떼,5500","2026-05-13,강남점,바닐라라떼,6000","","# 이 단계에서 CSV가 잘 동작하는 이유:","#  • 파일 크기 작음 (약 40KB)","#  • 사용자 1명 — 동시 저장 충돌 없음","#  • 사람이 직접 입력 — \"abc\"를 amount 칸에 넣을 일 없음","#  • 짧은 시간 — 정전 만날 확률 낮음","","# 검색 테스트:","#   $ grep \"2026-04-15\" sales.csv","#   → 즉시 결과 (수십 밀리초)","","# → 다음 단계: 데이터가 1000배 늘어나면 무슨 일이 벌어질까?"]},
      s2: {lang: "bash", filename: "grep-slow.sh", lines: ["#!/bin/bash","# Step 2. 100만 행이 되면 grep이 느려진다","# 이유: CSV는 \"그냥 텍스트 파일\" 이라 처음부터 한 줄씩 읽는 수 외엔 없음","","# 파일 크기 확인","$ ls -lh sales.csv","-rw-r--r-- 1 user user  41M May 13 14:22 sales.csv","","$ wc -l sales.csv","1000000 sales.csv","","# 검색: 강남점 매출 찾기","$ time grep \"강남점\" sales.csv | wc -l","20000","","real    0m4.832s   # 약 5초!","user    0m4.621s","sys     0m0.198s","","# 왜 느린가?","#  • CSV는 텍스트 파일 — 100만 줄을 처음부터 끝까지 읽어야 함","#  • \"강남점이 어디에 있는지\" 알려주는 색인 구조 = 없음","#  • 1000만 행이 되면 50초, 1억 행이면 8분 ...","","# 비교: PostgreSQL 이라면?","#   CREATE INDEX idx_store ON sales(store);","#   SELECT * FROM sales WHERE store = '강남점';","#   → B-Tree 인덱스로 0.001초 (로그 N 복잡도)","","# CSV 는 인덱스를 만들 수 없다.","# \"데이터가 커지는 순간\" 검색은 무조건 무너진다.","","# → 다음 한계: 여러 사람이 동시에 쓰면?"]},
      s3: {lang: "plaintext", filename: "lost-update.txt", lines: ["# Step 3. Lost Update — 동시 수정으로 한 사람 작업이 사라진다","# 시나리오: 강남점 Alice, 홍대점 Bob 이 동시에 sales.csv 편집","","====== T=10:00:00 ======","Alice 가 sales.csv 를 엑셀로 연다 (메모리에 100만 행 로드)","Bob   이 sales.csv 를 엑셀로 연다 (메모리에 100만 행 로드)","","====== T=10:01:00 ======","Alice 가 새 행 추가: 2026-05-13,강남점,라떼,5500","       → 메모리상 100만 1개 행","","====== T=10:01:30 ======","Bob   이 새 행 추가: 2026-05-13,홍대점,아메리카노,4500","       → 메모리상 100만 1개 행 (Alice 행은 아직 없음)","","====== T=10:02:00 ======","Alice 저장 (Ctrl+S)","       → 디스크 파일이 Alice 버전으로 덮어쓰기됨 (강남점 행 포함)","","====== T=10:02:10 ======","Bob 저장 (Ctrl+S)","       → 디스크 파일이 Bob 버전으로 통째로 덮어쓰기됨","       → Alice 가 추가한 강남점 행 = 영구 소실","","------------------------------------------------------------","결과: Alice 의 매출 기록 5500원이 흔적도 없이 사라졌다","------------------------------------------------------------","","# 왜 막을 수 없는가?","#  • CSV 는 운영체제 입장에서 \"파일\" 일 뿐","#  • 파일 쓰기 = \"이 파일을 이 바이트들로 통째로 교체해라\"","#  • Alice 가 행을 추가한 사실 = 파일 시스템은 모름","#  • 따라서 \"마지막에 저장한 사람이 이긴다\" = 데이터 손실","","# 비교: PostgreSQL 이라면?","#   BEGIN;","#   INSERT INTO sales (...) VALUES (...);  -- Alice","#   INSERT INTO sales (...) VALUES (...);  -- Bob","#   COMMIT;","#   → 두 INSERT 모두 보존, 자동으로 row-level lock 처리","","# → 다음 한계: 저장 도중 정전이 나면?"]},
      s4: {lang: "plaintext", filename: "torn-write.txt", lines: ["# Step 4. Torn Write — 정전 시 파일이 깨진다","# 시나리오: sales.csv 에 새 행 100개를 추가하던 중 정전","","====== T=14:30:00 ======","프로그램이 sales.csv 에 100행을 append 시작","디스크 쓰기는 \"한 번에\" 일어나지 않음 → 여러 번에 나누어 진행","","====== T=14:30:01 ======","OS 가 sales.csv 끝부분에 새 데이터 쓰는 중...","  - 60행 디스크에 반영됨","  - 40행 OS 메모리 버퍼에 대기 중 (아직 디스크 미반영)","","====== T=14:30:02  *** 정전 발생 *** ======","서버 꺼짐. OS 메모리 버퍼 내용 = 휘발 = 사라짐.","","====== T=14:35:00  서버 재부팅 ======","sales.csv 열어보니...","  • 정상 부분: 1000001 ~ 1000060 행","  • 그러나 마지막 행이 중간에 잘려있음:","      \"2026-05-13,강남점,라떼,55\"   ← 원래 5500인데 55에서 끊김","  • 또는 더 운 나쁘면 파일 시스템 블록 단위로 손상","      → 헤더 정상이지만 후반부 읽기 시 인코딩 에러","","------------------------------------------------------------","결과: 손상된 행이 어디인지 알 수 없음. 백업이 없으면 추적 불가.","------------------------------------------------------------","","# 왜 막을 수 없는가?","#  • CSV append = \"파일 끝에 바이트 추가\" 라는 단순 OS 호출","#  • 트랜잭션 개념 없음 → \"전부 or 전부 안 됨\" 보장 없음","#  • 60행만 쓰여진 상태로 정지 = 그 상태가 그대로 남음","","# 비교: PostgreSQL 이라면?","#   BEGIN;","#   INSERT ... 100건 ...","#   COMMIT;   ← WAL(Write-Ahead Log) 에 먼저 기록","","#   정전 → 재부팅 시 WAL 보고 자동 복구:","#     - COMMIT 까지 갔다? → 100건 모두 살림","#     - 중간에 죽었다?    → 0건으로 롤백","","#   \"절반만 적용된 상태\" 가 영구히 보이는 일은 없다","#   = Atomicity (전부 or 전무) + Durability (커밋되면 안 사라짐)","","# → 마지막 한계: 데이터 타입을 강제할 수 있을까?"]},
      s5: {lang: "csv", filename: "type-unsafe.csv", lines: ["# Step 5. 스키마 강제 불가 — CSV 는 아무 값이나 받는다","# 카페 알바생이 매출 입력 자동화 스크립트를 작성했는데 버그가 있었다.","","sold_at,store,product,amount","2026-05-10,강남점,아메리카노,4500","2026-05-10,강남점,라떼,5500","2026-05-11,강남점,아메리카노,abc           ← 숫자 자리에 문자","2026-05-11,강남점,카푸치노,5500","내일,강남점,에스프레소,3500                 ← 날짜 자리에 한국어","2026-05-12,강남점,아메리카노,-4500          ← 음수 매출 (현실 불가)","2026-05-12,강남점,라떼,5500","2026-05-12,,아메리카노,4500                 ← store 비어 있음","2026-05-13,강남점,바닐라라떼,6000","2026-05-13,강남점,콜드브루,5500999999999    ← 비현실적 큰 값","","# 결과: 파일은 잘 저장됨. 아무 에러 없음.","# 그러나 분석 시:","#   df = pd.read_csv(\"sales.csv\")","#   df[\"amount\"].mean()","#   → ValueError: could not convert string to float: 'abc'","","# 또는 SUM 계산이 음수로 망가지고, 평균이 5억으로 튀어오른다.","","# 비교: PostgreSQL 이라면?","#   CREATE TABLE sales (","#     id        SERIAL PRIMARY KEY,","#     sold_at   DATE NOT NULL,                       -- 날짜 강제","#     store     TEXT NOT NULL,                       -- 빈 값 거부","#     product   TEXT NOT NULL,","#     amount    INTEGER NOT NULL CHECK (amount > 0)  -- 양수 강제","#   );","","#   INSERT INTO sales VALUES (..., 'abc');","#   → ERROR: invalid input syntax for type integer: \"abc\"","","#   INSERT INTO sales VALUES (..., -4500);","#   → ERROR: violates check constraint \"sales_amount_check\"","","# 핵심: DB 는 잘못된 데이터를 \"입력 시점에\" 거부한다.","#       CSV 는 잘못된 데이터를 \"분석 시점에\" 폭발시킨다.","#       어느 쪽이 데이터를 안전하게 지키는가?","","# → 결론: CSV 의 4가지 한계 = DB 가 존재하는 이유"]},
    };

    const S1 = {title: "Step 1. CSV 1000행 — 그럭저럭 동작", desc: "카페 사장이 매출을 sales.csv 파일에 저장한다. 1000행 정도는 엑셀로 열어도 빠르고, grep으로 검색해도 즉시 결과가 나온다. 한 사람만 쓰고, 정전도 안 나고, 손으로 직접 입력하니 타입도 일정하다. 이 단계에서는 \"굳이 데이터베이스가 왜 필요해? CSV로 충분한데?\" 라는 생각이 든다. 맞다 — 1000행, 1명 사용자, 정전 없음, 타입 일관성 보장 환경이라면 CSV로도 충분하다. 문제는 그 다음부터 시작된다."};
    const S2 = {title: "Step 2. 100만 행 — grep 검색이 수 초 걸림 (인덱스 없음)", desc: "3년이 지나고 매장이 50개로 늘었다. sales.csv는 100만 행, 약 40MB로 커졌다. 사장이 \"지난주 강남점 매출 좀 뽑아줘\" 라고 하면 grep을 돌려야 하는데, 파일 처음부터 끝까지 한 줄씩 읽어야 한다. 수 초가 걸린다. 데이터베이스라면 인덱스(B-Tree)로 0.001초에 찾을 수 있는 작업이다. CSV에는 인덱스가 없다 — 항상 \"처음부터 다 읽기(Full Scan)\"만 가능하다. 데이터가 커질수록 검색은 선형으로 느려진다."};
    const S3 = {title: "Step 3. 동시 수정 — 두 사람 저장 시 마지막 사람만 살아남음 (Lost Update)", desc: "매장 점장 두 명(Alice, Bob)이 동시에 sales.csv를 열어서 새 행을 추가하고 저장 버튼을 눌렀다. 운영체제 입장에서 CSV는 그냥 \"파일\" 이다. Alice가 저장하고 Bob이 저장하면, Bob의 저장이 Alice의 저장을 통째로 덮어쓴다. Alice가 추가한 행은 사라진다 — 이것이 Lost Update다. 데이터베이스라면 트랜잭션과 행 단위 락(row-level lock)으로 두 INSERT를 모두 안전하게 받아준다. CSV에는 그런 게 없다 — \"마지막에 저장한 사람이 이긴다.\""};
    const S4 = {title: "Step 4. 부분 쓰기 — 정전 시 파일 깨짐 (Torn Write)", desc: "운영체제가 CSV에 새 행을 디스크로 쓰는 도중에 정전이 났다. 운 나쁘게 절반만 디스크에 기록되고 나머지는 사라진다 — \"찢어진 쓰기(Torn Write)\" 다. 파일이 깨져서 마지막 줄이 잘려있거나, 다음 사용자가 열면 인코딩 오류가 난다. 데이터베이스에는 WAL(Write-Ahead Log)이라는 안전장치가 있어서 정전이 나도 트랜잭션을 \"전부 적용\" 또는 \"전부 취소\"로 복구한다 (ACID의 Atomicity + Durability). CSV에는 그런 게 없다."};

        limits: [{"id":"search","label":"① 검색 속도","status":"active","detail":"CSV: Full Scan — DB: 인덱스 0.001초"},{"id":"concurrent","label":"② 동시 수정","status":"active","detail":"CSV: Lost Update — DB: 트랜잭션"},{"id":"torn","label":"③ 부분 쓰기","status":"active","detail":"CSV: 깨짐 — DB: WAL 복구"},{"id":"schema","label":"④ 타입 안전성","status":"active","detail":"CSV: 무방비 — DB: 스키마 강제"}],

        keyPoint: "CSV의 4가지 한계는 모두 \"텍스트 파일이라는 본질\" 에서 온다. DB는 그 본질을 바꾼다.",
        code: {...CODE.s5, highlight: [24,25,26,27,28,29,30,31]},
      },
      { ...S5,
        beat: {
          label: "입력 시점에 거부",
          at: "type-unsafe.csv L33–37",
          caption: "문자나 음수를 넣으려 하면 INSERT 시점에 바로 에러가 난다.",
          changes: [{"mark":"read","text":"입력 거부 확인"}],
        },
        csvBox: {"filename":"sales.csv","rows":1000000,"status":"dirty","note":"\"abc\" in amount · \"내일\" in sold_at — 그냥 통과됨"},
        limits: [{"id":"search","label":"① 검색 속도","status":"active","detail":"CSV: Full Scan — DB: 인덱스 0.001초"},{"id":"concurrent","label":"② 동시 수정","status":"active","detail":"CSV: Lost Update — DB: 트랜잭션"},{"id":"torn","label":"③ 부분 쓰기","status":"active","detail":"CSV: 깨짐 — DB: WAL 복구"},{"id":"schema","label":"④ 타입 안전성","status":"active","detail":"CSV: 무방비 — DB: 스키마 강제"}],
        solution: {"title":"PostgreSQL 이 해결하는 방법","features":["스키마 + CHECK 제약 — 타입/범위 어긋난 값 거부"]},
        keyPoint: "CSV의 4가지 한계는 모두 \"텍스트 파일이라는 본질\" 에서 온다. DB는 그 본질을 바꾼다.",
        code: {...CODE.s5, highlight: [33,34,35,36,37]},
      },
      { ...S5,
        beat: {
          label: "핵심 차이",
          at: "type-unsafe.csv L39–41",
          caption: "DB는 입력 시점에 막고, CSV는 분석 시점에 터진다.",

        limits: [{"id":"search","label":"① 검색 속도","status":"active","detail":"CSV: Full Scan — DB: 인덱스 0.001초"},{"id":"concurrent","label":"② 동시 수정","status":"active","detail":"CSV: Lost Update — DB: 트랜잭션"},{"id":"torn","label":"③ 부분 쓰기","status":"active","detail":"CSV: 깨짐 — DB: WAL 복구"},{"id":"schema","label":"④ 타입 안전성","status":"active","detail":"CSV: 무방비 — DB: 스키마 강제"}],
        solution: {"title":"PostgreSQL 이 해결하는 방법","features":["인덱스 (B-Tree, Hash) — 검색을 O(log N) 으로 단축","트랜잭션 + Row Lock — Lost Update 자동 방지","WAL (Write-Ahead Log) — 정전에도 데이터 복구","스키마 + CHECK 제약 — 타입/범위 어긋난 값 거부","ACID 통째로 보장 — Atomicity / Consistency / Isolation / Durability"]},
        keyPoint: "CSV의 4가지 한계는 모두 \"텍스트 파일이라는 본질\" 에서 온다. DB는 그 본질을 바꾼다.",
        code: {...CODE.s5, highlight: [39,40,41]},
      },
      { ...S5,
        beat: {
          label: "결론",
          at: "type-unsafe.csv L43",
          caption: "CSV의 4가지 한계 — 검색, 동시성, 정전, 타입 — 가 DB가 존재하는 이유다.",
          changes: [{"mark":"read","text":"4가지 한계 → DB 필요성"}],
        },
        csvBox: {"filename":"sales.csv","rows":1000000,"status":"dirty","note":"\"abc\" in amount · \"내일\" in sold_at — 그냥 통과됨"},
        limits: [{"id":"search","label":"① 검색 속도","status":"active","detail":"CSV: Full Scan — DB: 인덱스 0.001초"},{"id":"concurrent","label":"② 동시 수정","status":"active","detail":"CSV: Lost Update — DB: 트랜잭션"},{"id":"torn","label":"③ 부분 쓰기","status":"active","detail":"CSV: 깨짐 — DB: WAL 복구"},{"id":"schema","label":"④ 타입 안전성","status":"active","detail":"CSV: 무방비 — DB: 스키마 강제"}],
        solution: {"title":"PostgreSQL 이 해결하는 방법","features":["인덱스 (B-Tree, Hash) — 검색을 O(log N) 으로 단축","트랜잭션 + Row Lock — Lost Update 자동 방지","WAL (Write-Ahead Log) — 정전에도 데이터 복구","스키마 + CHECK 제약 — 타입/범위 어긋난 값 거부","ACID 통째로 보장 — Atomicity / Consistency / Isolation / Durability"]},
        keyPoint: "CSV의 4가지 한계는 모두 \"텍스트 파일이라는 본질\" 에서 온다. DB는 그 본질을 바꾼다.",
        code: {...CODE.s5, highlight: [43]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — CSV 파일 박스 + 4가지 한계 카드 (orange 톤)
    // ─────────────────────────────────────────────────────
    const LIMIT_STYLE = {
      idle:   { bg: 'bg-slate-100',   border: 'border-slate-300',   text: 'text-slate-600',   dot: 'bg-slate-400' },
      ok:     { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', dot: 'bg-emerald-500' },
      active: { bg: 'bg-orange-50',   border: 'border-orange-400',  text: 'text-orange-900',  dot: 'bg-orange-500' },
    };

    const CSV_STATUS_STYLE = {
      healthy:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800', icon: '✓' },
      slow:      { bg: 'bg-amber-50',   border: 'border-amber-400',   text: 'text-amber-900',   icon: '🐢' },
      conflict:  { bg: 'bg-orange-50',  border: 'border-orange-400',  text: 'text-orange-900',  icon: '⚔' },
      corrupted: { bg: 'bg-red-50',     border: 'border-red-400',     text: 'text-red-900',     icon: '⚡' },
      dirty:     { bg: 'bg-rose-50',    border: 'border-rose-400',    text: 'text-rose-900',    icon: '✗' },
    };

    function CsvFileBox({ csvBox }) {
      const s = CSV_STATUS_STYLE[csvBox.status] || CSV_STATUS_STYLE.healthy;
      return (
        <div className={`rounded-lg border-2 ${s.bg} ${s.border} px-3 py-3`}>
          <div className="flex items-center gap-2 mb-1">
            <span className="text-2xl">{s.icon}</span>
            <div className="flex-1">
              <div className={`font-mono text-sm font-bold ${s.text}`}>{csvBox.filename}</div>
              <div className={`text-[11px] ${s.text} opacity-80`}>{csvBox.rows.toLocaleString()} rows</div>
            </div>
          </div>
          <div className={`text-xs ${s.text} mt-1`}>{csvBox.note}</div>
        </div>
      );
    }

    function LimitCard({ item }) {
      const s = LIMIT_STYLE[item.status] || LIMIT_STYLE.idle;
      const isActive = item.status === 'active';
      return (
        <div
          className={`rounded-lg border ${s.bg} ${s.border} px-3 py-2 flex items-center justify-between ${
            isActive ? 'ring-2 ring-orange-400 ring-offset-1' : ''
          }`}
        >
          <div className="flex items-center gap-2 min-w-0">
            <span className={`w-2 h-2 rounded-full ${s.dot} flex-shrink-0`}></span>
            <span className={`text-xs font-bold ${s.text} flex-shrink-0`}>{item.label}</span>
          </div>
          <span className={`text-[10px] ${s.text} text-right ml-2 truncate`} title={item.detail}>
            {item.detail}
          </span>
        </div>
      );
    }

    function SolutionBox({ solution }) {
      if (!solution) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-orange-500 bg-gradient-to-br from-orange-50 to-amber-50 p-4">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🐘</span>
            <span className="text-base font-bold text-orange-800">{solution.title}</span>
          </div>
          <ul className="space-y-1.5">
            {solution.features.map((f, i) => (
              <li key={i} className="text-sm text-orange-900 flex gap-2">
                <span className="text-orange-500 mt-0.5">✓</span>
                <span>{f}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-orange-200 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-orange-800">CSV 파일 상태 + 4가지 한계</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 시나리오 상태</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* CSV 파일 박스 */}
          <CsvFileBox csvBox={state.csvBox} />

          {/* 4가지 한계 카드 */}
          <div className="mt-3 space-y-2">
            {state.limits.map((it) => (
              <LimitCard key={it.id} item={it} />
            ))}
          </div>

          {/* DB 해결 박스 (Step 5만) */}
          <SolutionBox solution={state.solution} />

          {/* keyPoint 띠 */}
          <div className="mt-3 text-xs text-orange-900 bg-orange-50 border border-orange-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">I</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">Chapter I-2-1. 텍스트 파일과 CSV의 한계</h1>
                <p className="text-sm text-orange-800/80">검색 느림 · Lost Update · Torn Write · 스키마 강제 불가 — 4가지 한계로 추적</p>
              </div>
              <a href="./index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-600' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-700 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-700 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                CSV의 4가지 한계 — ① 검색 느림(인덱스 없음) ② Lost Update(동시성 없음) ③ Torn Write(트랜잭션 없음) ④ 타입 안전성 없음(스키마 강제 불가) — 가 곧 데이터베이스가 존재해야 하는 이유다. 다음 챕터(I-2-2)에서는 데이터베이스가 이 4가지를 구체적으로 어떻게 해결하는지 살펴본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['CSV', 'Full Scan', '인덱스', 'Lost Update', 'Torn Write', 'WAL', '스키마', 'ACID', 'PostgreSQL'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-700">
              <a href="./chapter-i-1-2.html" className="underline hover:no-underline">← 이전: I-1-2</a>
              <a href="./chapter-i-2-2.html" className="underline hover:no-underline">다음: I-2-2 데이터베이스가 해결하는 방법 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
