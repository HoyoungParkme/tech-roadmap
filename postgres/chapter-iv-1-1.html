  <!--
    PostgreSQL Chapter IV-1-1 — SQL 쿼리 실행 파이프라인
    학습 목표: 클라이언트가 SQL을 보내면 서버 내부에서
              ① 파서 → ② 옵티마이저 → ③ 실행기 → ④ 결과셋 → ⑤ Fetch
              5단계를 거쳐 결과가 돌아온다. 각 단계에서 무엇이 일어나는지 시각화한다.
    핵심 비유: 카페에 주문이 들어가서 음료가 손님에게 전달되는 5단계
    패턴: fastapi v1 — 좌(LiveDataPane: 5단계 박스 + 활성 단계 강조) / 우(VSCode CodeViewer)
    색상: orange (postgres 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 파이프라인 5단계 박스 — 매 단계마다 어떤 박스가 활성화되는지
    // ─────────────────────────────────────────────────────
    const PIPELINE = [
      { id: 'client',    icon: '💻', label: '클라이언트',  sub: 'psql / app' },
      { id: 'parser',    icon: '📝', label: '파서',         sub: '구문 검사' },
      { id: 'optimizer', icon: '🧠', label: '옵티마이저',   sub: '실행 계획' },
      { id: 'executor',  icon: '⚙️', label: '실행기',       sub: 'Scan/Join' },
      { id: 'result',    icon: '📦', label: '결과셋',       sub: '튜플 모음' },
      { id: 'fetch',     icon: '📤', label: 'Fetch',        sub: '클라이언트' },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 클라이언트 → 파서 → 옵티마이저 → 실행기 → 결과 → Fetch
    //   active   : 이번 단계에서 활성화될 박스 id 배열 (PIPELINE 기준)
    //   focus    : 가장 강조될 박스 id (border 굵게)
    //   detail   : 우측 상단 도메인 상태 (key/value 카드)
    //   note     : 우측 하단 핵심 한 줄
    //   code     : 우측 CodeViewer 탭 (filename, lang, lines, highlight)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      step1: {lang:"markdown", filename:"parser.md", lines:["# Step 1. 파서(Parser) — 구문 검사와 AST 생성","","## 입력","```sql","SELECT * FROM users WHERE age > 25;","```","","## 파서가 하는 일","1. 렉서(Lexer): 문자열을 토큰으로 분리","   - [SELECT] [*] [FROM] [users] [WHERE] [age] [>] [25] [;]","2. 파서(Parser): 문법 규칙에 맞춰 AST(Parse Tree) 생성","3. 분석기(Analyzer): 의미 검사 (테이블/컬럼 존재 확인)","   - users 테이블 존재? OK","   - age 컬럼 존재? OK","   - 비교 타입 일치? integer > integer OK","","## 출력: Parse Tree (단순화)","```","SelectStmt"," ├─ targetList: [* (모든 컬럼)]"," ├─ fromClause: RangeVar(users)"," └─ whereClause:","      A_Expr(>)","       ├─ ColumnRef(age)","       └─ A_Const(25)","```","","## 이 단계에서 잡히는 오류","- ERROR: syntax error at or near \"FORM\"  (오타)","- ERROR: relation \"userz\" does not exist  (분석기 단계)","- ERROR: column \"ag\" does not exist        (분석기 단계)","","## 핵심","- 파서는 \"문장이 SQL 문법에 맞는가?\"만 검증한다","- 결과물은 Parse Tree → Query Tree로 다듬어져 옵티마이저로 전달","- 다음 단계: Step 2 옵티마이저가 \"어떻게 실행할지\" 결정"]},
      step2: {lang:"sql", filename:"optimizer.md", lines:["-- Step 2. 옵티마이저(Planner) — 실행 계획 수립","","-- 같은 결과를 내는 두 가지 실행 경로","--   A) Sequential Scan : 처음부터 끝까지 훑는다","--   B) Index Scan      : B-Tree 인덱스로 점프해서 찾는다","","-- EXPLAIN으로 옵티마이저가 고른 계획을 본다","EXPLAIN SELECT * FROM users WHERE age > 25;","","-- 인덱스 없는 경우 (Seq Scan 선택)","--  Seq Scan on users  (cost=0.00..210.00 rows=600 width=64)","--    Filter: (age > 25)","","-- 인덱스 있는 경우 (Index Scan 선택)","CREATE INDEX idx_users_age ON users(age);","","--  Index Scan using idx_users_age on users","--    (cost=0.29..8.30 rows=600 width=64)","--    Index Cond: (age > 25)","","-- 옵티마이저가 비용을 계산하는 기준","--  • 통계 정보: ANALYZE 명령으로 수집한 행 수/분포","--    pg_statistic 시스템 카탈로그에 저장","--  • 비용 파라미터:","--    seq_page_cost     = 1.0   (순차 페이지 읽기)","--    random_page_cost  = 4.0   (랜덤 페이지 읽기)","--    cpu_tuple_cost    = 0.01  (튜플 처리)","","-- 결정 규칙(요약)","--  • 결과가 테이블의 작은 비율 → Index Scan 유리","--  • 결과가 많은 비율(보통 >5~10%) → Seq Scan이 더 쌀 수도 있음","--  • 통계가 오래되면 잘못된 계획을 고를 수 있음 → 주기적 ANALYZE","","-- 출력: Plan Tree → 실행기로 넘어간다","--   SelectStmt 위에 \"어떻게(How)\"가 붙은 트리"]},
      step3: {lang:"sql", filename:"executor.md", lines:["-- Step 3. 실행기(Executor) — Plan Tree를 실제로 수행","","-- EXPLAIN ANALYZE로 진짜 실행 결과까지 본다","EXPLAIN ANALYZE","SELECT * FROM users WHERE age > 25;","","-- 결과 예시 (Index Scan 노드)","--  Index Scan using idx_users_age on users","--    (cost=0.29..8.30 rows=600 width=64)","--    (actual time=0.018..0.412 rows=612 loops=1)","--    Index Cond: (age > 25)","--  Planning Time: 0.142 ms","--  Execution Time: 0.498 ms","","-- 실행기의 동작 원리: Volcano(Iterator) 모델","--  각 Plan Node는 세 가지 함수를 구현","--   1) Init()  : 초기화 (커서 열기, 인덱스 위치 잡기)","--   2) Next()  : 튜플 하나 생산","--   3) End()   : 정리 (커서 닫기)","--","--  부모 노드가 Next()를 호출 → 자식 노드가 튜플 하나 반환","--  → 부모가 가공 → 더 위의 부모에게 전달","--  → 마지막까지 흘러가면 클라이언트로 전송","","-- 자주 보는 실행 노드들","--   Seq Scan       : 테이블 전체 순차 읽기","--   Index Scan     : B-Tree 인덱스로 위치 → heap 읽기","--   Index Only Scan: 인덱스에 필요한 컬럼이 모두 있으면 heap 생략","--   Bitmap Heap Scan: 인덱스로 위치 모은 뒤 한 번에 heap 읽기","--   Nested Loop    : 외부 row마다 내부 테이블 조회","--   Hash Join      : 한쪽을 해시 테이블로 만들어 매칭","--   Merge Join     : 양쪽을 정렬해 두고 병합","--   Sort           : ORDER BY를 위해 정렬","--   Aggregate      : SUM / AVG / COUNT 등 집계","","-- 이 단계의 출력","--   612개의 튜플이 한 줄씩 흘러나온다","--   → 다음 단계 (Step 4): 결과셋으로 모인다"]},
      step4: {lang:"json", filename:"result.md", lines:["// Step 4. 결과셋(ResultSet) — 컬럼 메타데이터 + 튜플 스트림","","// 클라이언트가 받는 데이터의 개념적 구조","{","  \"rowDescription\": [","    { \"name\": \"id\",    \"type\": \"int4\", \"size\": 4   },","    { \"name\": \"name\",  \"type\": \"text\", \"size\": -1  },","    { \"name\": \"age\",   \"type\": \"int4\", \"size\": 4   },","    { \"name\": \"email\", \"type\": \"text\", \"size\": -1  }","  ],","  \"rows\": [","    [1,   \"Alice\",   26, \"alice@ex.com\"   ],","    [3,   \"Carol\",   31, \"carol@ex.com\"   ],","    [7,   \"Grace\",   42, \"grace@ex.com\"   ],","    [12,  \"Karl\",    34, \"karl@ex.com\"    ],","    [15,  \"Nadia\",   28, \"nadia@ex.com\"   ],","    /* ... 607 rows more ... */","  ],","  \"command\":  \"SELECT\",","  \"rowCount\": 612","}","","// 중요한 사실들","// 1) 스트리밍이다","//    실행기가 튜플을 하나 만들면 곧바로 네트워크 버퍼로 흘러간다.","//    \"전부 모은 다음 한꺼번에\" 보내는 것이 아니다.","//","// 2) ORDER BY / GROUP BY가 있다면","//    실행기 단계에서 Sort/Aggregate 노드를 거치며 모두 모은 뒤","//    정렬/집계가 끝나야 첫 행이 나간다.","//","// 3) 커서를 사용하면 (DECLARE CURSOR)","//    실행기가 FETCH 한 번에 N개씩만 흘려보낸다.","//    수억 행짜리 결과도 메모리 폭발 없이 처리 가능.","//","// → 다음 단계 (Step 5): 클라이언트가 fetch로 가져간다"]},
      step5: {lang:"python", filename:"fetch.md", lines:["\"\"\"Step 5. 클라이언트가 결과를 가져오는 방법 (Fetch).\"\"\"","","import psycopg2","","# 서버와 연결","conn = psycopg2.connect(","    host=\"localhost\", dbname=\"shop\",","    user=\"app\", password=\"secret\",",")","","with conn.cursor() as cur:","    # 1) SQL 전송 → 서버에서 Step 1~4 수행","    cur.execute(\"SELECT * FROM users WHERE age > 25\")","","    # 2) 결과 가져오기 — 3가지 방법","","    # (a) 한 행씩","    row = cur.fetchone()","    # → (1, \"Alice\", 26, \"alice@ex.com\")","","    # (b) N개씩 (대용량 처리에 권장)","    rows = cur.fetchmany(size=100)","    # → 100개 튜플의 리스트","","    # (c) 한꺼번에 (행 수가 적을 때만)","    all_rows = cur.fetchall()","    # → 612개 튜플의 리스트","","    print(f\"총 {cur.rowcount}행 받음\")","","conn.close()","","# ─────────────────────────────────────────────","# PostgreSQL 와이어 프로토콜 (v3) 메시지 순서","#","#   Client → Server :  Parse / Bind / Execute (또는 Simple Query)","#   Server → Client :  RowDescription","#                      DataRow × N","#                      CommandComplete \"SELECT 612\"","#                      ReadyForQuery","#","# 드라이버는 이 바이너리 메시지를 언어에 맞는 객체로 변환한다","#   • psycopg2 : tuple / dict","#   • asyncpg  : Record","#   • JDBC     : ResultSet","#   • Node pg  : { rows: [], rowCount: N }","#","# 파이프라인 전체 흐름 (다시 정리)","#   ① 클라이언트 → 파서   : 구문 검사 + AST","#   ② 파서 → 옵티마이저   : 실행 계획 수립 (cost 기반)","#   ③ 옵티마이저 → 실행기 : Seq/Index Scan, Join 수행","#   ④ 실행기 → 결과셋     : 튜플 스트림 + 메타데이터","#   ⑤ 결과셋 → 클라이언트 : 와이어 프로토콜로 전송"]},
    };

    const S1 = { title:"Step 1. 클라이언트 → 파서 (구문 검사)", desc:"psql 콘솔이나 애플리케이션이 PostgreSQL 서버로 SQL 문자열을 보낸다. 서버는 가장 먼저 \"파서(Parser)\"에게 이 문자열을 넘긴다. 파서는 SQL을 토큰으로 쪼개고(lexing), 문법 규칙에 맞는지 검사하여(parsing) 추상 구문 트리(AST, Parse Tree)를 만든다. 키워드 오타, 따옴표 누락, 괄호 불일치 같은 구문 오류는 이 단계에서 잡힌다. 의미 분석(테이블/컬럼 존재 여부)은 그 다음 분석기(Analyzer) 단계에서 수행되어 Query Tree로 다듬어진다." };
    const S2 = { title:"Step 2. 파서 → 옵티마이저 (실행 계획 수립)", desc:"Parse Tree가 옵티마이저(Planner/Optimizer)로 전달된다. 옵티마이저는 \"이 쿼리를 실제로 어떻게 실행할 것인가\"를 결정한다. 같은 결과를 내는 방법은 여러 가지 — 테이블을 처음부터 끝까지 훑을 수도 있고(Sequential Scan), 인덱스로 빠르게 찾을 수도 있다(Index Scan). 옵티마이저는 통계 정보(pg_statistic)와 비용 모델을 사용해 각 후보의 cost를 계산하고, 가장 저렴한 계획(Plan Tree)을 선택한다. EXPLAIN 명령으로 이 계획을 들여다볼 수 있다." };
    const S3 = { title:"Step 3. 옵티마이저 → 실행기 (Sequential / Index Scan)", desc:"확정된 Plan Tree가 실행기(Executor)로 전달된다. 실행기는 계획대로 실제 데이터 페이지를 읽으며 튜플을 하나씩 생산한다. Plan Tree는 노드 트리 구조이고, 각 노드는 SeqScan / IndexScan / NestLoop / HashJoin / Sort / Aggregate 등 한 가지 연산을 담당한다. 노드는 \"한 번에 한 튜플(volcano/iterator 모델)\" 방식으로 부모 노드에게 행을 흘려보낸다. 우리 쿼리는 Index Scan 노드 하나 — idx_users_age 인덱스로 age=26부터 시작점을 찾고, 일치하는 행을 heap에서 가져온다." };
    const S4 = { title:"Step 4. 실행기 → 결과셋 (튜플 모음)", desc:"실행기가 만들어낸 튜플들은 곧바로 메모리에 다 쌓이는 게 아니다. PostgreSQL은 \"한 번에 한 행씩\" 처리하는 스트리밍 방식이라, 클라이언트가 받을 준비가 된 만큼 흘려보낸다. 다만 클라이언트 입장에서 개념적으로 보면 결과 행들의 집합 — 결과셋(ResultSet) — 이 만들어진다. 결과셋에는 컬럼 메타데이터(이름, 타입, 길이)와 실제 row들이 포함된다. ORDER BY / GROUP BY / DISTINCT 같은 연산이 있으면 이 단계에서 정렬/집계가 마무리되어 최종 행이 결정된다." };

    function PipelineBox({ node, active, focused }) {
      const base = 'rounded-lg border-2 px-3 py-2 transition-all duration-300 flex items-center gap-2';
      const state = focused
        ? 'bg-orange-500 border-orange-700 text-white shadow-lg scale-105'
        : active
        ? 'bg-orange-100 border-orange-400 text-orange-900'
        : 'bg-slate-50 border-slate-200 text-slate-400';
      return (
        <div className={`${base} ${state}`}>
          <span className="text-xl">{node.icon}</span>
          <div className="flex flex-col leading-tight">
            <span className="text-sm font-bold">{node.label}</span>
            <span className="text-[10px] opacity-80">{node.sub}</span>
          </div>
        </div>
      );
    }

    function PipelineDiagram({ activeSet, focus }) {
      return (
        <div className="space-y-2">
          {PIPELINE.map((node, i) => (
            <div key={node.id}>
              <PipelineBox
                node={node}
                active={activeSet.has(node.id)}
                focused={focus === node.id}
              />
              {i < PIPELINE.length - 1 && (
                <div className="flex justify-center my-0.5">
                  <span className={`text-lg ${activeSet.has(node.id) && activeSet.has(PIPELINE[i + 1].id) ? 'text-orange-500' : 'text-slate-300'}`}>↓</span>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

            <span className="text-xs font-mono text-orange-900">{item.v}</span>
          </div>
          <span className="text-[10px] px-2 py-0.5 rounded bg-orange-200 text-orange-800">{item.tag}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const activeSet = new Set(state.active);
      return (
        <div className="rounded-xl border border-orange-200 bg-white p-4 h-full flex flex-col">

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js) — 5단계 탭
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_FILES = [...new Set(STEPS.map((s) => (s.code || s.codeTab).filename))];
    function CodeViewer({ stepIdx, total, onSelectTab }) {
      const step = STEPS[stepIdx];
      const code = step.code;
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 탭 바 */}
          <div className="flex items-center gap-1 px-2 py-1.5 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {TAB_FILES.map((filename) => {
              const active = filename === code.filename;
              return (
                <button
                  key={filename}
                  onClick={() => onSelectTab(STEPS.findIndex((s) => s.code.filename === filename))}
                  className={`px-2.5 py-1 text-[11px] font-mono rounded whitespace-nowrap transition ${
                    active
                      ? 'bg-[#282c34] text-orange-300 border-t-2 border-orange-400'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                  }`}
                >
                  {filename}
                </button>
              );
            })}
          </div>

          {/* 타이틀 바 */}
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>

          {/* 코드 본문 */}
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>

          {/* 상태 바 */}
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">IV</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">Chapter IV-1-1. SQL 쿼리 실행 파이프라인</h1>
                <p className="text-sm text-orange-800/80">파서 → 옵티마이저 → 실행기 → 결과셋 → Fetch. 5단계로 추적</p>
              </div>
              <a href="./index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-600' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-700 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer stepIdx={stepIdx} total={STEPS.length} onSelectTab={setStepIdx} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-700 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 상단 탭 클릭으로 단계 점프</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                SQL 한 줄이 서버 내부에서 파서(구문) → 옵티마이저(계획) → 실행기(Scan/Join) → 결과셋(스트림) → 클라이언트(Fetch) 5단계를 거쳐 돌아온다. 다음 챕터(IV-1-2)에서는 옵티마이저가 비용을 어떻게 계산하는지 더 깊게 들어간다.
              </div>
            )}
