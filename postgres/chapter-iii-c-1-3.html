  <!--
    PostgreSQL Chapter III-C-1-3 — NULL 다루기
    학습 목표: NULL은 0도 아니고 ''도 아니다 → = 로 비교 불가 → IS NULL/IS NOT NULL →
              COALESCE로 기본값 → NULLIF로 특정 값을 NULL 로 바꾸기 (+ 3-valued logic)
    핵심 비유: 회원 테이블의 phone 컬럼 — "전화번호를 안 알려준 사람"의 표현
    패턴: fastapi v1 — 좌(LiveDataPane: 행 카드 + NULL 회색 강조 + 비교 결과) / 우(VSCode CodeViewer)
    색상: orange (postgres 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — NULL ≠ 0 ≠ '' → = 트랩 → IS NULL → COALESCE → NULLIF
    //   rows       : 회원 행 카드 [{id, name, phone, age, isNullCols}]
    //   compare    : 비교 표현식과 결과 [{expr, result}] (true/false/unknown)
    //   keyPoint   : 한 줄 핵심
    //   code       : 우측 CodeViewer 파일
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      concept: {lang:"sql", filename:"null-concept.sql", lines:["-- Step 1. NULL 은 0 도 아니고 빈 문자열도 아니다","--          셋은 완전히 다른 의미를 가진다","","CREATE TABLE members (","  id     SERIAL PRIMARY KEY,","  name   TEXT NOT NULL,","  phone  TEXT,            -- nullable: 안 알려줘도 됨","  age    INTEGER",");","","INSERT INTO members (name, phone, age) VALUES","  ('김민준', '010-1234-5678', 28),  -- 정상 값","  ('이서윤', '',               31),  -- 빈 문자열 (입력했는데 비어 있음)","  ('박지호', '0',              25),  -- 문자열 '0' (의미 없는 값)","  ('최예린', NULL,             34);  -- 값 없음 (모름/미입력)","","-- 세 가지 \"비어있음\" 의 의미 차이","--   0    → 숫자 영. 답이 있고 그 답이 0 이다","--   ''   → 길이 0 인 문자열. 입력은 했지만 내용이 비었다","--   NULL → 값 자체가 없다. 모른다 / 아직 정해지지 않았다","","-- 같은 \"빈 칸\" 으로 보이지만 의미가 다르므로","-- 검색/집계/조건 분기 결과가 모두 달라진다.","","-- → 다음 단계 (Step 2): NULL 은 = 로 비교할 수 없다"]},
      equalTrap: {lang:"sql", filename:"equal-trap.sql", lines:["-- Step 2. = 와 <> 로 NULL 을 비교하면 안 되는 이유","","-- 잘못된 쿼리 ① — 결과가 0건 나온다 (의도와 다름)","SELECT id, name, phone","FROM members","WHERE phone = NULL;","-- 결과: (empty)","-- 왜? NULL 과의 = 비교는 unknown 을 반환하고","--    WHERE 는 unknown 을 false 로 처리하기 때문","","-- 잘못된 쿼리 ② — 이것도 0건","SELECT id, name, phone","FROM members","WHERE phone <> NULL;","-- 역시 unknown 이라서 한 건도 안 걸린다","","-- 잘못된 쿼리 ③ — NULL = NULL 도 true 가 아니다","SELECT 'same' AS r WHERE NULL = NULL;","-- 결과: (empty) — 자기 자신과의 비교조차 unknown","","-- 3-valued logic (3치 논리) — NULL 이 섞이면 세 번째 값이 등장","--   AND :  true  AND unknown = unknown","--          false AND unknown = false","--   OR  :  true  OR  unknown = true","--          false OR  unknown = unknown","--   NOT :  NOT unknown       = unknown","","-- → 다음 단계 (Step 3): NULL 검사는 IS NULL / IS NOT NULL 로"]},
      isNull: {lang:"sql", filename:"is-null.sql", lines:["-- Step 3. IS NULL / IS NOT NULL — NULL 전용 비교 연산자","","-- ① 전화번호를 안 알려준 회원 찾기 (NULL 만)","SELECT id, name, phone","FROM members","WHERE phone IS NULL;","-- 결과: (4, 최예린, NULL)","","-- ② 전화번호를 알려준 회원 (NULL 이 아닌)","SELECT id, name, phone","FROM members","WHERE phone IS NOT NULL;","-- 결과: 김민준, 이서윤, 박지호","--       빈 문자열인 이서윤도 \"NULL 이 아님\" 으로 포함된다","","-- ③ \"사실상 비어있는\" 회원 (NULL + 빈 문자열 모두)","SELECT id, name, phone","FROM members","WHERE phone IS NULL OR phone = '';","-- 결과: 이서윤, 최예린","","-- ④ 흔한 실수 — 부정 조건에서 NULL 이 누락된다","SELECT id, name FROM members","WHERE phone <> '010-1234-5678';","-- 결과: 이서윤, 박지호 (최예린이 빠진다!)","-- 왜? NULL <> 'x' 는 unknown 이므로 WHERE 가 걸러냄","-- 해결: NULL 도 포함하려면 명시적으로","SELECT id, name FROM members","WHERE phone <> '010-1234-5678' OR phone IS NULL;","","-- → 다음 단계 (Step 4): NULL 일 때 기본값을 주는 COALESCE"]},
      coalesce: {lang:"sql", filename:"coalesce.sql", lines:["-- Step 4. COALESCE — NULL 일 때 기본값을 주는 함수","","-- ① 가장 단순한 형태: NULL → 기본 문자열","SELECT","  id,","  name,","  COALESCE(phone, '미입력') AS phone_display","FROM members;","-- 결과:","--   김민준 | 010-1234-5678","--   이서윤 |             (빈 문자열 그대로 — NULL 이 아니므로)","--   박지호 | 0","--   최예린 | 미입력      (NULL 이므로 치환됨)","","-- ② 여러 컬럼 fallback (모바일 → 집 → 회사 → 없음)","SELECT","  name,","  COALESCE(mobile, home, office, '연락처 없음') AS contact","FROM contacts;","-- 왼쪽부터 검사 → 첫 번째 NULL 아닌 값을 반환","","-- ③ 집계에서 NULL → 0 으로 처리","--    SUM 자체는 NULL 을 무시하지만","--    단일 행 계산에서는 NULL 이 섞이면 전체가 NULL 이 됨","SELECT","  id,","  COALESCE(price, 0) + COALESCE(tax, 0) AS total","FROM orders;","-- price + tax 라고만 쓰면 둘 중 하나라도 NULL 이면","-- total 도 NULL 이 되어버린다","","-- ④ 비슷한 함수들 (DB 마다 다름)","--   NVL(x, d)     : Oracle 호환. PostgreSQL 에는 없음","--   IFNULL(x, d)  : MySQL/SQLite. PostgreSQL 에는 없음","--   COALESCE      : SQL 표준. 인자 개수 제한 없음 (권장)","","-- → 다음 단계 (Step 5): 거꾸로 — 특정 값을 NULL 로 바꾸는 NULLIF"]},
      nullif: {lang:"sql", filename:"nullif.sql", lines:["-- Step 5. NULLIF — 특정 값을 NULL 로 바꾸는 함수","--          + 3-valued logic 최종 정리","","-- ① 빈 문자열을 NULL 로 정규화 (가장 흔한 용도)","SELECT","  id,","  name,","  phone,","  NULLIF(phone, '') AS phone_norm","FROM members;","-- 결과:","--   이서윤 | ''   | NULL    (빈 문자열이 NULL 로 통일됨)","--   최예린 | NULL | NULL","-- 이후 IS NULL 한 조건만으로 \"사실상 비어있음\" 을 처리할 수 있다","","-- ② 0 으로 나누기 방지","SELECT","  id,","  numerator / NULLIF(divisor, 0) AS ratio","FROM stats;","-- divisor 가 0 이면 NULLIF 가 NULL 로 바꿔서","-- numerator / NULL = NULL 이 되어 에러 대신 NULL 로 빠져나간다","","-- ③ COALESCE + NULLIF 조합 — 빈 문자열까지 한꺼번에 처리","SELECT COALESCE(NULLIF(phone, ''), '미입력') AS phone_display","FROM members;","-- 빈 문자열도, NULL 도 모두 '미입력' 으로 통일","","-- ④ 3-valued logic — NULL 이 섞인 논리 연산","--   AND: true  AND unknown = unknown","--        false AND unknown = false   (한쪽이 false → false)","--   OR : true  OR  unknown = true    (한쪽이 true  → true)","--        false OR  unknown = unknown","--   NOT: NOT unknown       = unknown","","-- ⑤ NULL 안전 체크리스트 (실무 디버깅용)","--   [ ] 컬럼이 nullable 인가? (NOT NULL 인지 확인)","--   [ ] = / <> 대신 IS NULL / IS NOT NULL 썼는가?","--   [ ] 부정 조건에서 OR x IS NULL 을 빠뜨리지 않았나?","--   [ ] 화면 표시할 때 COALESCE 로 기본값을 줬는가?","--   [ ] 0 으로 나누기 위험에 NULLIF 를 썼는가?","--   [ ] 빈 문자열과 NULL 을 한꺼번에 처리해야 하면","--       COALESCE(NULLIF(x, ''), default) 패턴"]},
    };

    const S1 = { title:"Step 1. NULL 은 0 도 아니고 빈 문자열도 아니다 — 셋은 완전히 다른 개념", desc:"회원 테이블에 phone 컬럼이 있다고 하자. 어떤 회원은 \"010-1234-5678\"이라고 적었고, 어떤 회원은 가입할 때 전화번호 칸을 비웠다. 이 \"비운 칸\"을 표현하는 방식이 세 가지 있다 — 0, 빈 문자열, 그리고 NULL. 셋은 완전히 다르다. 0은 \"숫자 영\"이라는 값이고, 빈 문자열은 \"길이가 0인 문자열\"이라는 값이고, NULL은 \"값 자체가 없다\"는 뜻이다. 즉 0과 빈 문자열은 답이 있는데 그 답이 우연히 작거나 비어있는 거고, NULL은 답을 모르거나 아직 정해지지 않은 상태다." };
    const S2 = { title:"Step 2. x = NULL 은 항상 false — = 로 NULL 을 비교하면 안 된다", desc:"\"phone 이 NULL 인 회원을 찾자\" 라고 phone = NULL 이라고 쓰면 한 건도 안 나온다. SQL 에서 NULL 과의 비교는 \"모름과 모름은 같은가?\" 라는 질문이 되어버려서 결과가 unknown (참도 거짓도 아닌 상태) 이 된다. WHERE 절은 unknown 을 false 로 취급하므로 결과가 비어 나온다. 심지어 NULL = NULL 조차 true 가 아니라 unknown 이다. 이게 SQL 입문자가 가장 많이 빠지는 함정이다." };
    const S3 = { title:"Step 3. NULL 검사는 IS NULL / IS NOT NULL 로 한다", desc:"NULL 을 비교하려면 = 가 아니라 IS NULL / IS NOT NULL 라는 전용 연산자를 써야 한다. 이 두 연산자는 결과가 true / false 둘 중 하나만 나온다 (unknown 이 안 나옴). \"전화번호를 안 알려준 회원\" 을 찾으려면 WHERE phone IS NULL, \"전화번호를 알려준 회원\" 을 찾으려면 WHERE phone IS NOT NULL 이라고 쓴다. IS NULL 은 NULL 인지만 본다 — 빈 문자열은 NULL 이 아니므로 안 걸린다는 점을 꼭 기억하자." };
    const S4 = { title:"Step 4. COALESCE(x, default) — NULL 이면 기본값으로 바꾸기", desc:"phone 이 NULL 인 회원을 화면에 표시할 때 그냥 \"NULL\" 이라고 띄우면 보기 흉하다. 이럴 때 COALESCE(phone, \"미입력\") 이라고 쓰면 phone 이 NULL 이면 \"미입력\" 으로, NULL 이 아니면 원래 값으로 나온다. COALESCE 는 인자를 왼쪽부터 차례로 보다가 NULL 이 아닌 첫 번째 값을 반환한다. 인자가 여러 개여도 된다 — COALESCE(mobile, home, office, \"연락처 없음\") 처럼 우선순위 fallback 으로도 쓴다. 집계에서도 유용 — SUM 은 NULL 을 무시하지만 단일 행 계산에서는 NULL 이 섞이면 결과가 NULL 이 되므로 COALESCE 로 0 처리하면 안전하다." };
    const S5 = { title:"Step 5. NULLIF(x, y) — 특정 값을 NULL 로 바꾸기 + 3치 논리 정리", desc:"NULLIF 는 COALESCE 의 반대 방향이다. NULLIF(x, y) 는 x 와 y 가 같으면 NULL, 다르면 x 를 반환한다. 가장 흔한 용도는 \"빈 문자열을 NULL 로 정규화\" — NULLIF(phone, \"\") 이라고 쓰면 빈 문자열이 NULL 로 바뀐다. 또 다른 용도는 \"나누기 0 방지\" — NULLIF(divisor, 0) 으로 감싸면 0으로 나눌 때 에러 대신 NULL 이 나온다. 마지막으로 3치 논리(true/false/unknown) 핵심 — AND/OR/NOT 이 unknown 을 만나면 어떻게 되는지 표를 기억하면 NULL 관련 버그의 대부분을 막을 수 있다." };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,
        beat:{ label:"테이블 정의", at:"null-concept.sql L4–9",
               caption:"members 테이블에 phone(nullable) 컬럼을 둔다.",
               changes:[{"mark":"new","text":"members 테이블"}] },
        rows: [{"id":1,"name":"김민준","phone":"010-1234-5678","age":28,"isNullCols":[]},{"id":2,"name":"이서윤","phone":"","age":31,"isNullCols":[],"note":"phone = '' (빈 문자열)"},{"id":3,"name":"박지호","phone":"0","age":25,"isNullCols":[],"note":"phone = '0' (문자열 영)"},{"id":4,"name":"최예린","phone":null,"age":34,"isNullCols":["phone"],"note":"phone IS NULL (값 없음)"}],
        compare: [],
        keyPoint: "NULL = \"값을 모름\". 0 (숫자 영) / 빈 문자열 과는 완전히 다른 의미다.",
        code:{...CODE.concept, highlight:[4,5,6,7,8,9]},
      },
      { ...S1,
        beat:{ label:"네 가지 값 삽입", at:"null-concept.sql L11–15",
               caption:"정상 전화번호, 빈 문자열, 문자열 \"0\", NULL 네 가지를 각각 넣는다.",
               changes:[{"mark":"new","text":"4행 삽입 — phone 값 4종"}] },
        rows: [{"id":1,"name":"김민준","phone":"010-1234-5678","age":28,"isNullCols":[]},{"id":2,"name":"이서윤","phone":"","age":31,"isNullCols":[],"note":"phone = '' (빈 문자열)"},{"id":3,"name":"박지호","phone":"0","age":25,"isNullCols":[],"note":"phone = '0' (문자열 영)"},{"id":4,"name":"최예린","phone":null,"age":34,"isNullCols":["phone"],"note":"phone IS NULL (값 없음)"}],
        compare: [],
        keyPoint: "NULL = \"값을 모름\". 0 (숫자 영) / 빈 문자열 과는 완전히 다른 의미다.",
        code:{...CODE.concept, highlight:[11,12,13,14,15]},
      },
      { ...S1,
        beat:{ label:"세 가지 \"비어있음\"의 차이", at:"null-concept.sql L17–20",

        rows: [{"id":1,"name":"김민준","phone":"010-1234-5678","normalized":"010-1234-5678","age":28,"isNullCols":[]},{"id":2,"name":"이서윤","phone":"","normalized":null,"age":31,"isNullCols":["normalized"]},{"id":3,"name":"박지호","phone":"0","normalized":"0","age":25,"isNullCols":[]},{"id":4,"name":"최예린","phone":null,"normalized":null,"age":34,"isNullCols":["phone","normalized"]}],
        compare: [{"expr":"NULLIF(phone, '')","meaning":"빈 문자열을 NULL 로 정규화"}],
        keyPoint: "NULLIF(x, y) = x=y 면 NULL, 아니면 x. 빈 문자열 정규화와 0 나누기 방지에 활용.",
        code:{...CODE.nullif, highlight:[12,13,14]},
      },
      { ...S5,
        beat:{ label:"0으로 나누기 방지", at:"nullif.sql L16–22",
               caption:"NULLIF(divisor, 0)은 나누는 값이 0이면 NULL로 바꿔서 나눗셈 에러 대신 NULL을 반환하게 한다.",
               changes:[{"mark":"new","text":"0 나누기 방지"}] },
        rows: [{"id":1,"name":"김민준","phone":"010-1234-5678","normalized":"010-1234-5678","age":28,"isNullCols":[]},{"id":2,"name":"이서윤","phone":"","normalized":null,"age":31,"isNullCols":["normalized"]},{"id":3,"name":"박지호","phone":"0","normalized":"0","age":25,"isNullCols":[]},{"id":4,"name":"최예린","phone":null,"normalized":null,"age":34,"isNullCols":["phone","normalized"]}],
        compare: [{"expr":"NULLIF(phone, '')","meaning":"빈 문자열을 NULL 로 정규화"},{"expr":"NULLIF(divisor, 0)","meaning":"0 으로 나누기 방지"}],
        keyPoint: "NULLIF(x, y) = x=y 면 NULL, 아니면 x. 빈 문자열 정규화와 0 나누기 방지에 활용.",
        code:{...CODE.nullif, highlight:[16,17,18,19,20,21,22]},
      },
      { ...S5,
        beat:{ label:"COALESCE + NULLIF 조합", at:"nullif.sql L24–27",
               caption:"두 함수를 조합하면 빈 문자열과 NULL을 한 번에 기본값으로 통일할 수 있다.",
               changes:[{"mark":"new","text":"COALESCE(NULLIF(...)) 조합"}] },
        rows: [{"id":1,"name":"김민준","phone":"010-1234-5678","normalized":"010-1234-5678","age":28,"isNullCols":[]},{"id":2,"name":"이서윤","phone":"","normalized":null,"age":31,"isNullCols":["normalized"]},{"id":3,"name":"박지호","phone":"0","normalized":"0","age":25,"isNullCols":[]},{"id":4,"name":"최예린","phone":null,"normalized":null,"age":34,"isNullCols":["phone","normalized"]}],
        compare: [{"expr":"NULLIF(phone, '')","meaning":"빈 문자열을 NULL 로 정규화"},{"expr":"NULLIF(divisor, 0)","meaning":"0 으로 나누기 방지"}],
        keyPoint: "NULLIF(x, y) = x=y 면 NULL, 아니면 x. 빈 문자열 정규화와 0 나누기 방지에 활용.",
        code:{...CODE.nullif, highlight:[24,25,26,27]},
      },
      { ...S5,
        beat:{ label:"3치 논리 최종 정리", at:"nullif.sql L29–34",
               caption:"AND는 한쪽이 false면 false, OR는 한쪽이 true면 true — 그 외에는 unknown이 전파된다.",
               changes:[{"mark":"read","text":"3치 논리 규칙 재확인"}] },
        rows: [{"id":1,"name":"김민준","phone":"010-1234-5678","normalized":"010-1234-5678","age":28,"isNullCols":[]},{"id":2,"name":"이서윤","phone":"","normalized":null,"age":31,"isNullCols":["normalized"]},{"id":3,"name":"박지호","phone":"0","normalized":"0","age":25,"isNullCols":[]},{"id":4,"name":"최예린","phone":null,"normalized":null,"age":34,"isNullCols":["phone","normalized"]}],
        compare: [{"expr":"NULLIF(phone, '')","meaning":"빈 문자열을 NULL 로 정규화"},{"expr":"NULLIF(divisor, 0)","meaning":"0 으로 나누기 방지"},{"expr":"true AND unknown","meaning":"= unknown"},{"expr":"true OR unknown","meaning":"= true (한 쪽이 true 면 즉시 true)"}],
        keyPoint: "NULLIF(x, y) = x=y 면 NULL, 아니면 x. 빈 문자열 정규화와 0 나누기 방지에 활용.",
        code:{...CODE.nullif, highlight:[29,30,31,32,33,34]},
      },
      { ...S5,
        beat:{ label:"NULL 안전 체크리스트", at:"nullif.sql L36–43",
               caption:"컬럼의 nullable 여부, IS NULL 사용, 부정 조건, COALESCE, NULLIF까지 실무 체크리스트로 정리한다.",
               changes:[{"mark":"read","text":"체크리스트 확인"}] },
        rows: [{"id":1,"name":"김민준","phone":"010-1234-5678","normalized":"010-1234-5678","age":28,"isNullCols":[]},{"id":2,"name":"이서윤","phone":"","normalized":null,"age":31,"isNullCols":["normalized"]},{"id":3,"name":"박지호","phone":"0","normalized":"0","age":25,"isNullCols":[]},{"id":4,"name":"최예린","phone":null,"normalized":null,"age":34,"isNullCols":["phone","normalized"]}],
        compare: [{"expr":"NULLIF(phone, '')","meaning":"빈 문자열을 NULL 로 정규화"},{"expr":"NULLIF(divisor, 0)","meaning":"0 으로 나누기 방지"},{"expr":"true AND unknown","meaning":"= unknown"},{"expr":"true OR unknown","meaning":"= true (한 쪽이 true 면 즉시 true)"}],
        keyPoint: "NULLIF(x, y) = x=y 면 NULL, 아니면 x. 빈 문자열 정규화와 0 나누기 방지에 활용.",
        code:{...CODE.nullif, highlight:[36,37,38,39,40,41,42,43]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — orange 톤
    //   회원 행 카드 + NULL 컬럼 회색 강조 + 비교 결과 표
    // ─────────────────────────────────────────────────────
    function renderPhoneCell(phone) {
      if (phone === null) {
        return <span className="italic text-slate-400 font-semibold">NULL</span>;
      }
      if (phone === '') {
        return <span className="text-slate-500">{'(빈 문자열)'}</span>;
      }
      return <span className="text-orange-900 font-semibold">{String(phone)}</span>;
    }

    function MemberRow({ row, highlightHit }) {
      const phoneIsNull = row.isNullCols && row.isNullCols.includes('phone');
      const normIsNull = row.isNullCols && row.isNullCols.includes('normalized');
      const hasNorm = row.normalized !== undefined;
      const hasDisplay = row.display !== undefined;

      const rowCls = highlightHit
        ? 'border-orange-400 bg-orange-100 shadow-sm'
        : 'border-orange-200 bg-white';

      return (
        <div className={`rounded-lg border ${rowCls} px-3 py-2`}>
          <div className="flex items-center gap-2 mb-1">
            <span className="text-[10px] font-mono text-slate-500 w-8">#{row.id}</span>
            <span className="text-sm font-bold text-orange-900 w-16">{row.name}</span>
            <span className="text-[10px] text-slate-500">age</span>
            <span className="text-sm font-mono text-orange-800">{row.age}</span>
            {highlightHit && (
              <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-orange-500 text-white font-bold">MATCH</span>
            )}
          </div>
          <div className="flex items-center gap-2 text-xs flex-wrap">
            <span className="text-[10px] text-slate-500 w-12">phone</span>
            <span className={`px-2 py-0.5 rounded font-mono ${phoneIsNull ? 'bg-slate-200 text-slate-500' : 'bg-orange-50 text-orange-900'}`}>
              {renderPhoneCell(row.phone)}
            </span>
            {hasDisplay && (
              <>
                <span className="text-slate-400">→</span>
                <span className="text-[10px] text-slate-500">display</span>
                <span className="px-2 py-0.5 rounded font-mono bg-amber-100 text-amber-900">
                  {row.display === '' ? <span className="text-slate-500">(빈 문자열)</span> : row.display}
                </span>
              </>
            )}
            {hasNorm && (
              <>
                <span className="text-slate-400">→</span>
                <span className="text-[10px] text-slate-500">norm</span>
                <span className={`px-2 py-0.5 rounded font-mono ${normIsNull ? 'bg-slate-200 text-slate-500 italic' : 'bg-amber-100 text-amber-900'}`}>
                  {row.normalized === null ? 'NULL' : row.normalized}
                </span>
              </>
            )}
          </div>
          {row.note && (
            <div className="mt-1 text-[10px] text-slate-500 italic">{row.note}</div>
          )}
        </div>
      );
    }

    function CompareBox({ compare }) {
      if (!compare || compare.length === 0) return null;

      const renderResult = (item) => {
        if (item.result === 'unknown') {
          return (
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-slate-300 text-slate-700 font-bold">unknown</span>
          );
        }
        if (item.hits) {
          return (
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-orange-500 text-white font-bold whitespace-nowrap">
              {item.hits.length}건 매치
            </span>
          );
        }
        return null;
      };

      return (
        <div className="mt-3 rounded-lg border-2 border-orange-400 bg-orange-50 p-3">
          <div className="text-xs font-bold text-orange-800 mb-2">🔍 비교 결과 (3-valued logic)</div>
          <ul className="space-y-1.5">
            {compare.map((c, i) => (
              <li key={i} className="text-xs text-orange-900 flex items-center gap-2 flex-wrap">
                <span className="font-mono bg-white px-1.5 py-0.5 rounded border border-orange-200 text-orange-800">
                  {c.expr}
                </span>
                <span className="text-orange-800/80">{c.meaning}</span>
                {renderResult(c)}
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      // compare 의 hits 정보로 어떤 행에 MATCH 표시할지 모은다
      const hitSet = new Set();
      if (state.compare) {
        state.compare.forEach((c) => {
          if (c.hits) c.hits.forEach((id) => hitSet.add(id));
        });
      }

      return (
        <div className="rounded-xl border border-orange-200 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-orange-800">members 테이블</h3>
            <span className="text-[10px] text-slate-500">회색 = NULL · 주황 = 값 존재</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="space-y-2">
            {state.rows.map((row) => (
              <MemberRow
                key={row.id}
                row={row}
                highlightHit={hitSet.has(row.id)}
              />
            ))}
          </div>
          <CompareBox compare={state.compare} />
          <div className="mt-3 text-xs text-orange-900 bg-orange-50 border border-orange-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">III</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">Chapter III-C-1-3. NULL 다루기</h1>
                <p className="text-sm text-orange-800/80">NULL 은 값이 아니라 "값 없음" · IS NULL · COALESCE · NULLIF + 3치 논리</p>
              </div>
              <a href="./index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-600' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-700 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-700 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                NULL 은 "값 없음" → = 로 비교 불가 → IS NULL / IS NOT NULL 로 검사 → COALESCE 로 기본값 → NULLIF 로 특정 값을 NULL 로 변환. 3치 논리(true/false/unknown)를 머릿속에 그려두면 NULL 관련 버그의 대부분을 막을 수 있다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['NULL', 'IS NULL', 'IS NOT NULL', 'COALESCE', 'NULLIF', '3-valued logic', 'unknown', '빈 문자열'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-700">
              <a href="./index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./chapter-iii-c-1-4.html" className="underline hover:no-underline">다음: III-C-1-4 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
