    학습 목표: 빈 데이터베이스에서 출발해 ① CREATE DATABASE → ② \c 접속 → ③ CREATE TABLE → ④ INSERT → ⑤ SELECT

    색상: orange (postgres 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — DB 생성 → 접속 → 테이블 생성 → INSERT → SELECT
    //   title      : 단계 제목
    //   desc       : 단계 설명
    //   pane       : 좌측 LiveDataPane 도메인 상태

      createdb: {
        lang: "sql",
        filename: "create-db.sql",
        lines: [
          "-- Step 1. CREATE DATABASE shop",
          "-- 목적: 우리 데이터를 담을 새 데이터베이스를 만든다.",
          "",
          "-- 현재 위치: 기본 데이터베이스(postgres)에 접속된 상태",
          "-- 여기서 새 데이터베이스 \"shop\" 을 생성한다.",
          "",
          "CREATE DATABASE shop;",
          "",
          "-- 실행 결과:",
          "--   postgres=# CREATE DATABASE shop;",
          "--   CREATE DATABASE",
          "",
          "-- 확인: 현재 서버에 어떤 데이터베이스가 있는지 본다.",
          "\\l",
          "",
          "-- 결과 예시:",
          "--    Name      |  Owner   | Encoding |",
          "--   -----------+----------+----------+",
          "--    postgres  | postgres | UTF8     |",
          "--    shop      | postgres | UTF8     |   ← 방금 만든 DB",
          "--    template0 | postgres | UTF8     |",
          "--    template1 | postgres | UTF8     |",
          "",
          "-- 주의: 아직 우리는 \"postgres\" DB 에 접속해 있다.",
          "--       shop DB 안에서 작업하려면 접속을 전환해야 한다.",

          "-- 결과:",

          "",
          "-- → 비어 있다. 그래서 다음 단계에서 테이블을 만든다.",

          "",

          "INSERT INTO products (name, price) VALUES ('카푸치노',   5500);",
          "",
          "-- 또는 한 문장으로 여러 행을 한꺼번에 넣기 (권장)",

          "--   ('카페라떼',   5000),",

          "--       SERIAL 이므로 PostgreSQL 이 자동으로 1, 2, 3 부여한다.",

          "",
          "-- 실행 결과 (3번 실행 시):",
          "--   shop=# INSERT INTO products ...;",

          "--   INSERT 0 1",
          "--   INSERT 0 1",
          "",
          "-- \"INSERT 0 1\" 의 의미:",
          "--    0 → OID(예전 잔재, 의미 없음)",
          "--    1 → 삽입된 행의 개수",
          "",
          "-- 이제 테이블 내부 상태:",
          "--   id |     name     | price",
          "--   ---+--------------+------",
          "--    1 | 아메리카노   | 4500",

          "--    3 | 카푸치노     | 5500",

          "--   ① CREATE DATABASE  : 그릇(DB)을 만든다",
          "--   ② \\c               : 그 그릇 안으로 들어간다",
          "--   ③ CREATE TABLE     : 그릇 안에 빈 격자를 둔다",

          "--   ⑤ SELECT           : 채운 행을 다시 꺼내본다",

          "-- 이 5단계가 SQL 의 가장 기본 CRUD 중 C(생성)와 R(조회)의 출발점이다.",

    const S1 = {

              name: "카페라떼",
              price: 5000,
              highlight: false,
            },
            {
              id: 3,
              name: "카푸치노",
              price: 5500,
              highlight: false,
            },
          ],
          selectMode: true,
          message: "조건을 걸면 일부 행만 나온다.",
        },
        keyPoint: "WHERE 는 SELECT 뿐 아니라 UPDATE/DELETE 에도 똑같이 쓰인다.",
        code: { ...CODE.select, highlight: [22] },
      },
      { ...S5,
        beat: {
          label: "응용 3 — ORDER BY 정렬",
          at: "select.sql L25",
          caption: "ORDER BY price DESC 로 비싼 순서대로 정렬해서 볼 수 있다.",
          changes: [
            {
              mark: "new",
              text: "정렬 조회 (내림차순)",
            },
          ],
        },
        pane: {
          dbName: "shop",
          dbState: "created",
          connected: true,
          tableExists: true,
          gridHeaders: ["id", "name", "price"],
          gridRows: [
            {
              id: 1,
              name: "아메리카노",
              price: 4500,
              highlight: false,
            },
            {
              id: 2,
              name: "카페라떼",
              price: 5000,
              highlight: false,
            },
            {
              id: 3,
              name: "카푸치노",
              price: 5500,
              highlight: false,
            },
          ],
          selectMode: true,
          message: "정렬 기준을 지정할 수 있다.",
        },
        keyPoint: "ORDER BY 로 정렬 기준(오름/내림)을 지정한다.",
        code: { ...CODE.select, highlight: [25] },
      },
      { ...S5,
        beat: {
          label: "응용 4 — COUNT(*) 로 개수 세기",
          at: "select.sql L28–29",
          caption: "SELECT COUNT(*) 로 행 개수만 셀 수도 있다 — 결과는 3.",
          changes: [
            {
              mark: "read",
              text: "COUNT(*) → 3",
            },
          ],
        },
        pane: {
          dbName: "shop",
          dbState: "created",
          connected: true,
          tableExists: true,
          gridHeaders: ["id", "name", "price"],
          gridRows: [
            {
              id: 1,
              name: "아메리카노",
              price: 4500,
              highlight: false,
            },
            {
              id: 2,
              name: "카페라떼",
              price: 5000,
              highlight: false,
            },
            {
              id: 3,
              name: "카푸치노",
              price: 5500,
              highlight: false,
            },
          ],
          selectMode: true,
          message: "개수만 셀 수도 있다 → 결과: 3.",
        },
        keyPoint: "COUNT(*) 는 행 개수만 필요할 때 쓴다.",
        code: { ...CODE.select, highlight: [28,29] },
      },
      { ...S5,
        beat: {
          label: "5단계 전체 정리",
          at: "select.sql L32–37",
          caption: "CREATE DATABASE → \\c → CREATE TABLE → INSERT → SELECT, 이 5단계가 CRUD 의 C(생성)와 R(조회)의 출발점이다.",
          changes: [
            {
              mark: "read",
              text: "5단계 전체 흐름 정리",
            },
          ],
        },
        pane: {
          dbName: "shop",
          dbState: "created",
          connected: true,
          tableExists: true,
          gridHeaders: ["id", "name", "price"],
          gridRows: [
            {
              id: 1,
              name: "아메리카노",
              price: 4500,
              highlight: false,
            },
            {
              id: 2,
              name: "카페라떼",
              price: 5000,
              highlight: false,
            },
            {
              id: 3,
              name: "카푸치노",
              price: 5500,
              highlight: false,
            },
          ],
          selectMode: true,
          message: "SELECT 결과: 3개 행이 그대로 조회된다. id 가 자동 1·2·3 부여됨.",
        },
        keyPoint: "SELECT = 데이터를 꺼내는 명령. * 는 모든 컬럼, WHERE 없으면 모든 행.",
        code: { ...CODE.select, highlight: [32,33,34,35,36,37] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — orange 톤
    //   DB 박스 → 접속 상태 → 테이블 격자 → 메시지
    // ─────────────────────────────────────────────────────
    function DbStatusBox({ pane }) {
      return (
        <div className="rounded-lg border-2 border-orange-300 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
          <div className="flex items-center gap-2 mb-1">
            <span className="text-xl">🐘</span>
            <span className="text-sm font-bold text-orange-900">PostgreSQL Server</span>
          </div>
          <div className="flex items-center gap-2 text-xs">
            <span className="text-orange-700">데이터베이스:</span>
            <span className="font-mono font-bold text-orange-900 bg-orange-100 px-2 py-0.5 rounded border border-orange-300">
              {pane.dbName}
            </span>
            <span className={`ml-auto text-[10px] px-2 py-0.5 rounded font-bold ${
              pane.connected
                ? 'bg-green-200 text-green-800'
                : 'bg-slate-200 text-slate-600'
            }`}>
              {pane.connected ? '● 접속됨 (shop=#)' : '○ 미접속 (postgres=#)'}
            </span>
          </div>
        </div>
      );
    }

    function TableGrid({ pane }) {
      const { gridHeaders, gridRows, tableExists, selectMode } = pane;

      if (!tableExists) {
        return (
          <div className="mt-3 rounded-lg border-2 border-dashed border-orange-200 bg-orange-50/40 p-6 text-center">
            <div className="text-3xl mb-1">📭</div>
            <div className="text-xs text-orange-700 font-bold">아직 테이블이 없다</div>
            <div className="text-[10px] text-orange-600 mt-0.5">CREATE TABLE 을 실행해야 격자가 생긴다</div>
          </div>
        );
      }

      return (
        <div className="mt-3">
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-xs font-bold text-orange-900">테이블: products</span>
            <span className="text-[10px] text-orange-700">
              {gridRows.length === 0 ? '(0 rows — 빈 격자)' : `(${gridRows.length} rows)`}
              {selectMode && <span className="ml-2 px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300">SELECT *</span>}
            </span>
          </div>
          <div className="rounded-lg overflow-hidden border-2 border-orange-300 bg-white">
            {/* 헤더 */}
            <div className="flex bg-orange-100 border-b-2 border-orange-300">
              {gridHeaders.map((h) => (
                <div
                  key={h}
                  className="flex-1 px-3 py-2 text-xs font-bold text-orange-900 font-mono border-r border-orange-200 last:border-r-0"
                >
                  {h}
                </div>
              ))}
            </div>
            {/* 행 */}
            {gridRows.length === 0 ? (
              <div className="px-3 py-6 text-center text-xs text-slate-400 italic">
                — 행 없음 — INSERT 로 채우면 여기에 표시된다 —
              </div>
            ) : (
              gridRows.map((row, i) => (
                <div
                  key={i}
                  className={`flex border-b border-orange-100 last:border-b-0 ${
                    row.highlight ? 'bg-amber-50 animate-pulse' : 'bg-white hover:bg-orange-50/40'
                  }`}
                >
                  <div className="flex-1 px-3 py-2 text-xs font-mono text-orange-800 border-r border-orange-100 font-bold">
                    {row.id}
                  </div>
                  <div className="flex-1 px-3 py-2 text-xs font-mono text-slate-800 border-r border-orange-100">
                    {row.name}
                  </div>
                  <div className="flex-1 px-3 py-2 text-xs font-mono text-slate-800 text-right">
                    {row.price.toLocaleString()}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function PsqlPrompt({ pane }) {
      const promptText = pane.connected ? 'shop=#' : 'postgres=#';
      return (
        <div className="mt-3 rounded bg-slate-900 text-green-300 px-3 py-2 font-mono text-xs flex items-center gap-2">
          <span className="text-slate-500">$</span>
          <span className="text-green-400 font-bold">{promptText}</span>
          <span className="text-slate-400">_</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const pane = state.pane;
      return (
        <div className="rounded-xl border border-orange-200 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-orange-800">테이블/데이터 상태 시뮬레이션</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = DB 안 상태</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <DbStatusBox pane={pane} />
          <TableGrid pane={pane} />
          <PsqlPrompt pane={pane} />

          {pane.message && (
            <div className="mt-3 text-xs text-orange-900 bg-orange-50 border border-orange-200 rounded p-2">
              📝 {pane.message}
            </div>
          )}

          <div className="mt-2 text-xs text-orange-900 bg-amber-50 border border-amber-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js) — 5탭 전환 가능
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_FILES = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ code, stepIdx, total, onTabClick }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 타이틀 바 */}
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>

          {/* 탭 바 — 5개 파일 전환 */}
          <div className="flex bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {TAB_FILES.map((filename) => (
              <button
                key={filename}
                onClick={() => onTabClick(STEPS.findIndex((s) => s.code.filename === filename))}
                className={`px-3 py-1.5 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                  filename === code.filename
                    ? 'bg-[#282c34] text-orange-300 border-t-2 border-t-orange-400'
                    : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                }`}
              >
                {filename}
              </button>
            ))}
          </div>

          {/* 코드 본문 */}
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-500/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>

          {/* 상태 바 */}
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      // 키보드 ←/→ 전환
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // 자동 재생 (3000ms / step)
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">III</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">Chapter III-2-1. 테이블 생성과 데이터 삽입</h1>
                <p className="text-sm text-orange-800/80">CREATE DATABASE → \c → CREATE TABLE → INSERT → SELECT, 5단계 흐름</p>
              </div>
              <a href="./index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-600' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-700 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer
                code={step.code}
                stepIdx={stepIdx}
                total={STEPS.length}
                onTabClick={(i) => setStepIdx(i)}
              />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-700 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 우측 파일 탭 클릭으로도 이동 가능</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-400 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                CREATE DATABASE 로 그릇을 만들고 → \c 로 그릇에 들어가고 → CREATE TABLE 로 빈 격자를 두고 → INSERT 로 행을 채우고 → SELECT 로 다시 꺼내본다. 이 5단계가 SQL CRUD의 출발점이다. 다음 챕터에서는 UPDATE 와 DELETE 로 데이터를 수정·삭제하는 법을 학습한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['CREATE DATABASE', '\\c', 'CREATE TABLE', 'SERIAL', 'PRIMARY KEY', 'INSERT', 'SELECT', 'CRUD'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-700">
              <a href="./index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./chapter-iii-2-2.html" className="underline hover:no-underline">다음: III-2-2 데이터 수정과 삭제 (UPDATE/DELETE) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
