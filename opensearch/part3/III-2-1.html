<body>
  <div id="root"></div>

  <!--
    OpenSearch Chapter III-2-1 — Pipeline Aggregation
    학습 목표: 집계 결과를 다시 집계하는 2차 분석(pipeline)을 왜, 언제, 어떻게 쓰는지 직관적으로 본다.
    핵심 비유: 1차 집계로 만든 표를 "다시 계산" — 변화량/누적/이동평균/커스텀
    패턴: fastapi v1 — 좌(LiveDataPane: date_histogram 버킷 → 파생 시계열 애니메이션) / 우(VSCode CodeViewer, json)
    색상: #005EB8 (OpenSearch 공식 블루) / #003b75
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 좌측 패널 공통 원시 데이터 — 일별 매출(단위: 백만원)
    const BASE_BUCKETS = [
      { label: '05-20', revenue: 100 },
      { label: '05-21', revenue: 140 },
      { label: '05-22', revenue: 120 },
      { label: '05-23', revenue: 200 },
      { label: '05-24', revenue: 260 },
      { label: '05-25', revenue: 240 },
    ];

    const STEPS = [
      {
        title: 'Step 1. Pipeline aggregation 이란 — 집계의 출력을 다시 입력으로',
        desc: '일반 집계(date_histogram, terms 등)는 문서에서 버킷을 만든다. Pipeline aggregation 은 그렇게 만들어진 다른 집계의 결과를 입력으로 받아 한 번 더 계산한다. 참조 방식이 두 가지인데, parent 는 같은 집계 안에서 형제 metric 을 참조하고, sibling 은 다른 집계의 전체 결과를 참조한다. 프론트에서 루프 돌며 후처리하던 계산을 서버가 한 번의 요청으로 끝내주는 게 핵심 가치다.',
        mode: 'base',
        method: 'date_histogram (원시 버킷)',
        verdict: '1차 집계',
        verdictTone: 'warn',
        keyPoint: 'pipeline 은 문서가 아니라 "다른 집계 결과" 를 먹는다. 그래서 반드시 대상 집계가 먼저 있어야 한다.',
        code: {
          lang: 'json',
          filename: 'step1-concept.json',
          lines: [
            '// pipeline aggregation = 집계의 출력을 다시 입력으로',
            '// 1) 먼저 일반 집계로 버킷을 만든다 (date_histogram)',
            'GET /orders/_search',
            '{',
            '  "size": 0,',
            '  "aggs": {',
            '    "sales_per_day": {',
            '      "date_histogram": {',
            '        "field": "ordered_at",',
            '        "calendar_interval": "day"',
            '      },',
            '      "aggs": {',
            '        "revenue": { "sum": { "field": "amount" } }',
            '      }',
            '    }',
            '  }',
            '}',
            '// 2) 이제 sales_per_day 버킷들의 revenue 위에',
            '//    derivative / cumulative_sum / moving_fn 을 얹는다',
            '// parent  = 같은 집계 안에서 형제 metric 참조',
            '// sibling = 다른 집계의 전체 결과 참조 (max_bucket 등)',
          ],
          highlight: [7, 8, 9, 10, 11, 12, 13, 14, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 2. derivative — 이전 버킷 대비 변화량(1차 차분)',
        desc: 'derivative 는 각 버킷의 값에서 바로 앞 버킷 값을 뺀 변화량을 돌려준다. 매출의 증감, 트래픽의 기울기, 재고의 소진 속도처럼 "얼마나 빠르게 변하는가" 를 볼 때 쓴다. buckets_path 에는 같은 버킷의 형제 metric 이름(revenue)을 준다. 첫 버킷은 비교 대상이 없어 결과가 비어 있으니, 프론트에서 null 을 반드시 처리해야 한다.',
        mode: 'derivative',
        method: 'parent · derivative',
        verdict: '변화량',
        verdictTone: 'good',
        keyPoint: '값 자체보다 "변화" 가 중요할 때. 급등/급락은 원본 곡선보다 derivative 에서 훨씬 뚜렷하게 보인다.',
        code: {
          lang: 'json',
          filename: 'step2-derivative.json',
          lines: [
            '// derivative = 이전 버킷 대비 변화량 (1차 차분)',
            '"aggs": {',
            '  "revenue": { "sum": { "field": "amount" } },',
            '  "day_growth": {',
            '    "derivative": { "buckets_path": "revenue" }',
            '  }',
            '}',
            '// buckets_path: "revenue" -> 같은 버킷의 형제 metric 이름',
            '// 첫 버킷은 이전 값이 없어 결과가 비어 있다 (null)',
            '// 매출 증감, 트래픽 기울기, 재고 소진 속도 계산에 쓴다',
          ],
          highlight: [3, 4, 5, 6, 8, 9],
        },
      },
      {
        title: 'Step 3. cumulative_sum — 처음부터 현재까지 누적 합',
        desc: 'cumulative_sum 은 첫 버킷부터 현재 버킷까지 값을 계속 더한 러닝토탈을 만든다. "월 초부터 지금까지 누적 매출" 같은 차트를 서버가 바로 계산해주므로, 프론트에서 루프를 돌며 직접 합산할 필요가 없다. KPI 달성률, 번다운/번업 차트, 누적 사용자 수의 기본기다. parent pipeline 이라 date_histogram 하위 aggs 안에 나란히 둔다.',
        mode: 'cumulative',
        method: 'parent · cumulative_sum',
        verdict: '누적 합',
        verdictTone: 'good',
        keyPoint: '러닝토탈을 프론트 루프로 만들지 마라. 페이지네이션/부분 로드에서 합이 깨진다 — 서버에서 누적하면 항상 정확하다.',
        code: {
          lang: 'json',
          filename: 'step3-cumulative.json',
          lines: [
            '// cumulative_sum = 처음부터 현재 버킷까지 누적 합',
            '"aggs": {',
            '  "revenue": { "sum": { "field": "amount" } },',
            '  "cum_revenue": {',
            '    "cumulative_sum": { "buckets_path": "revenue" }',
            '  }',
            '}',
            '// 월 초부터 지금까지의 누적 매출 차트를 서버가 계산',
            '// 프론트에서 루프 돌며 더하지 않아도 된다',
            '// KPI 달성률, 러닝토탈, 번다운 차트의 기본기',
          ],
          highlight: [3, 4, 5, 6, 8, 9, 10],
        },
      },
      {
        title: 'Step 4. moving_fn — 최근 N개 버킷의 이동평균(추세선)',
        desc: 'moving_fn 은 현재 버킷을 기준으로 최근 window 개 버킷을 모아 이동평균 등을 계산한다. 하루하루 튀는 노이즈를 걸러 추세선(trend)을 만들거나, 이 추세선을 기준으로 급등/급락 이상을 탐지할 때 쓴다. window 가 클수록 곡선은 부드러워지지만 변화에 대한 반응은 그만큼 늦어진다. 구버전 moving_avg 는 deprecated 되었으니 script 기반 moving_fn 을 쓴다.',
        mode: 'moving',
        method: 'parent · moving_fn (window=3)',
        verdict: '이동평균',
        verdictTone: 'good',
        keyPoint: 'window 는 "부드러움 vs 반응속도" 트레이드오프. 이상탐지는 짧게, 장기추세는 길게 잡는다.',
        code: {
          lang: 'json',
          filename: 'step4-moving.json',
          lines: [
            '// moving_fn = 최근 N개 버킷의 이동평균 (노이즈 제거)',
            '"aggs": {',
            '  "revenue": { "sum": { "field": "amount" } },',
            '  "ma_3d": {',
            '    "moving_fn": {',
            '      "buckets_path": "revenue",',
            '      "window": 3,',
            '      "script": "MovingFunctions.unweightedAvg(values)"',
            '    }',
            '  }',
            '}',
            '// window = 관찰 창 크기, 클수록 부드럽지만 반응이 늦다',
            '// 추세선(trend), 급등/급락 이상탐지의 기준선으로 쓴다',
            '// 구버전 moving_avg 는 deprecated -> moving_fn 사용',
          ],
          highlight: [3, 4, 5, 6, 7, 8, 9, 10, 12, 13, 14],
        },
      },
      {
        title: 'Step 5. sibling — max_bucket · bucket_script (형제 집계 참조)',
        desc: 'sibling pipeline 은 형제 집계의 전체 결과를 입력으로 받는다. max_bucket 은 date_histogram 전체에서 값이 가장 큰 버킷(최고 매출일)을 찾아주고, date_histogram 과 같은 레벨에 나란히 둔다. buckets_path 의 > 기호는 하위 집계로 내려가 metric 을 지목한다는 뜻이다. bucket_script 를 쓰면 여러 metric 을 조합해 이익률 같은 커스텀 값을 버킷마다 계산할 수 있다.',
        mode: 'sibling',
        method: 'sibling · max_bucket / bucket_script',
        verdict: '최댓값 버킷',
        verdictTone: 'good',
        keyPoint: 'parent 는 형제 metric 이름 한 개, sibling 은 "집계>metric" 경로. 이 경로 문법 차이가 실무 에러의 단골 원인이다.',
        code: {
          lang: 'json',
          filename: 'step5-sibling.json',
          lines: [
            '// sibling pipeline = 형제 집계 전체를 입력으로',
            '"aggs": {',
            '  "sales_per_day": {',
            '    "date_histogram": { "field": "ordered_at", "calendar_interval": "day" },',
            '    "aggs": { "revenue": { "sum": { "field": "amount" } } }',
            '  },',
            '  "best_day": {',
            '    "max_bucket": { "buckets_path": "sales_per_day>revenue" }',
            '  }',
            '}',
            '// buckets_path 의 > = 하위 집계로 내려가 metric 참조',
            '// max_bucket 은 date_histogram 과 같은 레벨(형제)에 둔다',
            '// bucket_script 로 버킷마다 커스텀 계산도 가능',
            '"profit_rate": {',
            '  "bucket_script": {',
            '    "buckets_path": { "rev": "revenue", "cost": "cost" },',
            '    "script": "(params.rev - params.cost) / params.rev"',
            '  }',
            '}',
          ],
          highlight: [7, 8, 9, 11, 12, 14, 15, 16, 17, 18],
        },
      },
      {
        title: 'Step 6. 실무 함정 — buckets_path · gap_policy · 순서 · 성능',
        desc: 'buckets_path 오타는 에러 대신 결과가 조용히 누락되기도 해서 디버깅이 까다롭다. 중간에 문서가 없는 빈 버킷은 gap_policy(기본 skip, 또는 insert_zeros)로 어떻게 이을지 정해야 누적/이동평균이 어긋나지 않는다. pipeline 은 이미 만들어진 버킷 위에서만 동작하므로 date_histogram 같은 대상 집계 없이 단독으로 못 쓴다. 버킷 수가 곧 계산량이니 interval 과 min_doc_count 로 버킷을 줄여 성능을 지킨다.',
        mode: 'pitfall',
        method: '함정 4종 점검',
        verdict: '주의',
        verdictTone: 'danger',
        keyPoint: '가장 흔한 사고: 경로 오타로 값이 비어도 200 OK 로 응답한다. 응답에서 파생 필드 존재 여부를 반드시 검증하라.',
        code: {
          lang: 'json',
          filename: 'step6-pitfalls.json',
          lines: [
            '// 실무 함정 4가지',
            '// 1) buckets_path 오타 -> 에러가 아니라 조용히 누락될 수 있다',
            '//    parent 는 형제 metric 이름, sibling 은 "agg>metric" 경로',
            '"day_growth": { "derivative": { "buckets_path": "reveune" } }',
            '// 2) gap_policy = 빈 버킷(문서 없는 구간) 처리 방식',
            '"cum_revenue": {',
            '  "cumulative_sum": {',
            '    "buckets_path": "revenue",',
            '    "gap_policy": "insert_zeros"',
            '  }',
            '}',
            '// 3) 순서 의존: pipeline 은 이미 만들어진 버킷 위에서만 동작',
            '//    -> date_histogram 없이 pipeline 단독 사용 불가',
            '// 4) 성능: 버킷 수 = 계산량. interval / min_doc_count 로 줄여라',
          ],
          highlight: [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 13, 14],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    // 파생 시계열 계산 (pipeline aggregation 이 서버에서 하는 일을 그대로 재현)
    function computeSeries() {
      const rev = BASE_BUCKETS.map((b) => b.revenue);
      const derivative = rev.map((v, i) => (i === 0 ? null : v - rev[i - 1]));
      const cumulative = rev.map((_, i) => rev.slice(0, i + 1).reduce((a, b) => a + b, 0));
      const moving = rev.map((_, i) => {
        const w = rev.slice(Math.max(0, i - 2), i + 1);
        return Math.round(w.reduce((a, b) => a + b, 0) / w.length);
      });
      const maxIdx = rev.indexOf(Math.max.apply(null, rev));
      return { rev, derivative, cumulative, moving, maxIdx };
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const { rev, derivative, cumulative, moving, maxIdx } = computeSeries();
      const maxRev = Math.max.apply(null, rev);
      const mode = state.mode;

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold" style={{color:'#005EB8'}}>일별 매출 buckets → pipeline</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          <div className="text-[11px] text-slate-500 mb-2 font-mono">{state.method}</div>

          {/* 원시 버킷 막대 그래프 (date_histogram 결과) */}
          <div className="flex items-end justify-between gap-1.5 h-32 px-1">
            {BASE_BUCKETS.map((b, i) => {
              const isMax = mode === 'sibling' && i === maxIdx;
              return (
                <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
                  <span className="text-[9px] text-slate-500 mb-0.5 font-mono">{b.revenue}</span>
                  <div
                    className="w-full rounded-t transition-all duration-500"
                    style={{
                      height: `${(b.revenue / maxRev) * 100}%`,
                      backgroundColor: isMax ? '#f59e0b' : '#005EB8',
                    }}
                  />
                  <span className="text-[9px] text-slate-500 mt-1 font-mono">{b.label}</span>
                </div>
              );
            })}
          </div>

          {/* 파생 계열 — 단계별로 바뀜 */}
          <div className={`mt-3 rounded-lg border ${t.bg} ${t.border} p-3 flex-1`}>
            {mode === 'base' && (
              <div className="text-xs text-slate-600">
                아직 pipeline 미적용 상태. 위 막대는 date_histogram 이 만든 원시 revenue 버킷이다. 다음 단계부터 이 결과 위에 파생 계열을 얹는다.
              </div>
            )}

            {mode === 'derivative' && (
              <div>
                <div className="text-[11px] font-bold text-slate-700 mb-2">day_growth (전일 대비 변화량)</div>
                <div className="flex items-center justify-between gap-1.5">
                  {derivative.map((d, i) => (
                    <div key={i} className="flex-1 text-center">
                      {d === null ? (
                        <span className="text-[10px] text-slate-400 font-mono">null</span>
                      ) : (
                        <span className={`text-[11px] font-mono font-bold ${d >= 0 ? 'text-emerald-700' : 'text-rose-600'}`}>
                          {d >= 0 ? `+${d}` : d}
                        </span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {mode === 'cumulative' && (
              <div>
                <div className="text-[11px] font-bold text-slate-700 mb-2">cum_revenue (누적 합)</div>
                <div className="flex items-end justify-between gap-1.5 h-16">
                  {cumulative.map((c, i) => (
                    <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
                      <span className="text-[9px] text-slate-500 font-mono">{c}</span>
                      <div className="w-full rounded-t bg-emerald-500 transition-all duration-500"
                        style={{ height: `${(c / cumulative[cumulative.length - 1]) * 100}%` }} />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {mode === 'moving' && (
              <div>
                <div className="text-[11px] font-bold text-slate-700 mb-2">ma_3d (3일 이동평균 — 추세선)</div>
                <div className="flex items-center justify-between gap-1.5">
                  {moving.map((m, i) => (
                    <div key={i} className="flex-1 text-center">
                      <span className="text-[11px] font-mono font-bold text-indigo-700">{m}</span>
                    </div>
                  ))}
                </div>
                <div className="text-[10px] text-slate-500 mt-2">원시값의 노이즈가 완만한 추세선으로 정리된다.</div>
              </div>
            )}

            {mode === 'sibling' && (
              <div className="text-xs text-slate-700">
                <div className="font-bold text-amber-700 mb-1">best_day (max_bucket)</div>
                <div className="font-mono">
                  최고 매출일 = <b>{BASE_BUCKETS[maxIdx].label}</b> · value = <b>{rev[maxIdx]}</b>
                </div>
                <div className="text-[10px] text-slate-500 mt-2">주황 막대가 date_histogram 전체에서 뽑힌 최댓값 버킷이다.</div>
              </div>
            )}

            {mode === 'pitfall' && (
              <ul className="text-[11px] text-slate-700 space-y-1 font-mono">
                <li>1) buckets_path 오타 → 조용한 누락 (200 OK)</li>
                <li>2) gap_policy: skip(기본) vs insert_zeros</li>
                <li>3) 순서 의존: 대상 집계 없이 단독 불가</li>
                <li>4) 성능: 버킷 수 = 계산량 (interval 로 조절)</li>
              </ul>
            )}
          </div>

          <div className="mt-3 text-xs text-slate-800 bg-sky-50 border border-sky-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-sky-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{backgroundColor:'#005EB8'}}>OS</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{backgroundColor:'#003b75'}}>Part III. Aggregation</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300 font-mono">III-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900">Pipeline Aggregation</h1>
                <p className="text-sm text-slate-700/80">집계 결과를 다시 집계하는 2차 분석</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{backgroundColor: i <= stepIdx ? '#005EB8' : '#e2e8f0'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-slate-50 px-5 py-4 shadow" style={{backgroundColor:'#003b75'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{backgroundColor: playing ? '#003b75' : '#005EB8'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{borderColor:'#005EB8'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Pipeline aggregation 은 다른 집계 결과를 다시 계산한다. parent(형제 metric 참조)는 derivative·cumulative_sum·moving_fn·bucket_script 로 버킷마다, sibling(전체 참조)은 max_bucket 처럼 집계 전체에서 계산한다. buckets_path 경로, gap_policy(빈 버킷), 집계 순서 의존, 버킷 수 기반 성능이 4대 함정이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Pipeline', 'derivative', 'cumulative_sum', 'moving_fn', 'max_bucket', 'buckets_path', 'gap_policy'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
