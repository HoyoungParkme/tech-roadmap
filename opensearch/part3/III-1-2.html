                <tr key={i} className="border-b border-sky-100">
                  <td className="py-1 pr-2 font-medium text-sky-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-sky-700 font-mono">{r.after}</td>
                  <td className="py-1 text-sky-900 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const max = Math.max(...state.bars.map((b) => b.value), 1);
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-sky-900">date_histogram 차트</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="rounded-lg border border-sky-300 bg-sky-50 p-3">
            <div className="text-[10px] text-sky-600">방식</div>
            <div className="text-sm font-bold text-sky-900 font-mono">{state.method}</div>
          </div>

          {state.bars.length > 0 ? (
            <div className="mt-3 rounded-lg bg-sky-50 border border-sky-200 p-3">
              <div className="text-[11px] font-bold text-sky-800 mb-2">시간 버킷별 doc_count</div>
              <div className="flex items-end gap-1 h-32">
                {state.bars.map((b, i) => (
                  <div key={i} className="flex-1 flex flex-col items-center justify-end">
                    <div className={`w-full ${b.color} rounded-t`} style={{ height: `${(b.value / max) * 100}%` }} />
                    <span className="text-[9px] font-mono text-sky-800 mt-1">{b.label}</span>
                    <span className="text-[8px] font-mono text-sky-700">{b.value}</span>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="mt-3 rounded-lg bg-amber-50 border border-amber-200 p-3 text-xs text-amber-800">
              아직 집계 전 — 원본 도큐먼트만 있음
            </div>
          )}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-sky-900 bg-sky-100 border border-sky-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-[#005EB8] bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-[#005EB8] border-b border-[#003a73]">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-sky-100 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-sky-200">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-sky-100">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-sky-500/25 border-l-2 border-sky-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-sky-400 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-[#005EB8] border-t border-[#003a73] flex items-center justify-between text-[10px] text-sky-200">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#005EB8] text-white font-bold">O</span>
              <div>
                <h1 className="text-2xl font-bold text-[#003a73]">Chapter III-1-2. Date Histogram</h1>
                <p className="text-sm text-sky-800/80">시간 축 막대 그래프 — fixed / calendar / auto 그리고 pipeline</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#005EB8] underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#005EB8]' : 'bg-sky-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#005EB8] text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-sky-300 bg-white text-[#005EB8] hover:bg-sky-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-sky-300 bg-white text-[#005EB8] hover:bg-sky-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#003a73] text-white' : 'bg-[#005EB8] text-white hover:bg-[#003a73]'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-sky-300 bg-white text-[#005EB8] hover:bg-sky-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700 mt-2">키보드 ← → · 자동재생 3초 단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-400 bg-white px-4 py-3 text-sm text-[#003a73]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                date_histogram = 시간 축 GROUP BY. 시각화는 fixed_interval, 리포트는 calendar_interval, 대시보드 자동축은 auto_date_histogram, 누적/이동평균은 pipeline.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['date_histogram', 'fixed_interval', 'calendar_interval', 'auto', 'cumulative_sum', 'moving_fn'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-[#003a73] border border-sky-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-[#005EB8]">
              <a href="./III-1-1.html" className="underline hover:no-underline">← III-1-1 Terms</a>
              <a href="./III-2-1.html" className="underline hover:no-underline">다음: III-2-1 Cardinality →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
