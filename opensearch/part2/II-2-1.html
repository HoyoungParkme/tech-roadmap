  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    OpenSearch Chapter II-2-1 — Analyzer 파이프라인
    학습 목표: 텍스트가 char filter → tokenizer → token filter 3단계를 거쳐
              검색 가능한 토큰이 되는 과정을 눈으로 확인한다.
    핵심 비유: 원두(원본 텍스트) → 껍질 제거(char filter) → 분쇄(tokenizer) → 추출(token filter)
    패턴: fastapi v1 — 좌(LiveDataPane: 파이프라인 단계별 텍스트 변환 애니메이션) / 우(VSCode CodeViewer, json)
    색상: #005EB8 (OpenSearch 공식 블루)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 모든 단계가 공유하는 예시 텍스트의 변환 흐름 (한 문장이 파이프라인을 통과)
    const FLOW = {
      original: 'The <b>QUICK</b> Brown-Foxes JUMPED over lazy dogs',
      charFiltered: 'The QUICK Brown-Foxes JUMPED over lazy dogs',
      tokens: ['The', 'QUICK', 'Brown', 'Foxes', 'JUMPED', 'over', 'lazy', 'dogs'],
      filtered: ['quick', 'brown', 'fox', 'jump', 'lazi', 'dog'],
    };

    const STEPS = [
      {
        title: 'Step 1. Analyzer = char filter → tokenizer → token filter 3단계',
        desc: 'Analyzer는 텍스트를 검색용 토큰으로 바꾸는 파이프라인이다. 왜 3단계로 나눌까? 각 단계의 책임이 다르기 때문이다. char filter는 문자 수준 정리(HTML 제거 등), tokenizer는 단어 경계로 자르기, token filter는 잘린 토큰을 가공(소문자·어간·불용어)한다. 이 파이프라인은 인덱싱할 때(문서 저장)와 검색할 때(질의 파싱) 양쪽에서 돌아간다. 그래서 저장된 토큰과 질의 토큰이 같은 규칙을 거쳐야 매칭이 된다.',
        active: 4,
        badge: '파이프라인',
        verdictTone: 'good',
        keyPoint: 'tokenizer는 정확히 1개, char filter와 token filter는 0개 이상을 순서대로 연결한다.',
        code: {
          lang: 'json',
          filename: 'create-index-analyzer.json',
          lines: [
            'PUT /articles',
            '{',
            '  "settings": {',
            '    "analysis": {',
            '      "analyzer": {',
            '        "my_analyzer": {',
            '          "type": "custom",',
            '          "char_filter": ["html_strip"],',
            '          "tokenizer": "standard",',
            '          "filter": ["lowercase", "english_stop", "english_stemmer"]',
            '        }',
            '      }',
            '    }',
            '  }',
            '}',
          ],
          highlight: [7, 8, 9, 10],
        },
      },
      {
        title: 'Step 2. char filter — 토큰화 이전에 문자 단위로 정리',
        desc: 'char filter는 텍스트를 tokenizer에 넘기기 전에 문자열 자체를 손본다. 대표적으로 html_strip은 <b>, <p> 같은 태그를 제거해 태그가 검색어로 색인되는 사고를 막는다. mapping char filter는 특정 문자를 치환한다(예: & → and). 왜 여기서 처리할까? 태그나 특수문자를 미리 걷어내야 tokenizer가 엉뚱한 위치에서 단어를 자르지 않는다. 아래 예시에서 <b>QUICK</b>의 태그가 사라져 QUICK만 남는다.',
        active: 1,
        badge: 'char filter',
        verdictTone: 'good',
        keyPoint: 'html_strip을 빼먹으면 본문의 태그가 그대로 토큰이 되어 검색 품질이 망가진다.',
        code: {
          lang: 'json',
          filename: 'char-filter.json',
          lines: [
            '"char_filter": {',
            '  "html_strip_cf": {',
            '    "type": "html_strip"',
            '  },',
            '  "amp_to_and": {',
            '    "type": "mapping",',
            '    "mappings": ["& => and", "@ => at"]',
            '  }',
            '}',
            '// _analyze 로 char filter 단독 확인',
            '// input : The <b>QUICK</b> Foxes',
            '// output: The QUICK Foxes',
          ],
          highlight: [1, 2, 3, 10, 11, 12],
        },
      },
      {
        title: 'Step 3. tokenizer — 정제된 텍스트를 토큰으로 자른다',
        desc: 'tokenizer는 파이프라인에서 정확히 1개만 쓰며 단어 경계를 결정한다. standard tokenizer는 공백과 대부분의 구두점에서 자르고 하이픈으로 이어진 Brown-Foxes를 Brown, Foxes로 나눈다. 각 토큰은 위치(position)와 원문 오프셋(offset)을 함께 갖는다 — 이 정보가 하이라이팅과 구문 검색(match_phrase)의 근거다. 왜 중요할까? tokenizer 선택이 검색 단위를 결정하기 때문이다. keyword tokenizer는 통째로 1토큰, whitespace는 공백만 기준으로 자른다.',
        active: 2,
        badge: 'tokenizer',
        verdictTone: 'good',
        keyPoint: 'tokenizer가 자르는 단위가 곧 검색 최소 단위. standard·whitespace·keyword를 용도에 맞게 고른다.',
        code: {
          lang: 'json',
          filename: 'analyze-tokenizer.json',
          lines: [
            'POST /_analyze',
            '{',
            '  "tokenizer": "standard",',
            '  "text": "Brown-Foxes JUMPED over"',
            '}',
            '// 결과 tokens (position / offset 포함)',
            '// [',
            '//   { "token": "Brown",  "position": 0 },',
            '//   { "token": "Foxes",  "position": 1 },',
            '//   { "token": "JUMPED", "position": 2 },',
            '//   { "token": "over",   "position": 3 }',
            '// ]',
          ],
          highlight: [3, 4, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 4. token filter — 소문자·불용어·어간·동의어로 가공',
        desc: 'token filter는 tokenizer가 만든 토큰들을 순서대로 변형·추가·삭제한다. lowercase는 대소문자 차이를 없애 QUICK과 quick을 같게 만들고, stop은 the·over 같은 불용어를 버리며, stemmer는 Foxes→fox, JUMPED→jump처럼 어간만 남긴다. synonym은 laptop을 notebook과 같은 위치에 심어 어느 쪽으로 검색해도 잡히게 한다. 순서가 핵심이다 — 대개 lowercase를 먼저 둬야 stop·synonym 사전이 소문자 기준으로 정확히 매칭된다. 아래 최종 토큰을 보면 6개만 남는다.',
        active: 3,
        badge: 'token filter',
        verdictTone: 'warn',
        keyPoint: 'filter는 배열 순서대로 적용된다. lowercase → stop → synonym → stemmer 순서를 어기면 매칭이 샌다.',
        code: {
          lang: 'json',
          filename: 'token-filter.json',
          lines: [
            '"filter": {',
            '  "english_stop": {',
            '    "type": "stop",',
            '    "stopwords": "_english_"',
            '  },',
            '  "english_stemmer": {',
            '    "type": "stemmer",',
            '    "language": "english"',
            '  },',
            '  "my_synonym": {',
            '    "type": "synonym",',
            '    "synonyms": ["laptop, notebook", "ny, new york"]',
            '  }',
            '}',
            '// 적용 순서: lowercase, english_stop, my_synonym, english_stemmer',
          ],
          highlight: [2, 3, 4, 6, 7, 8, 15],
        },
      },
      {
        title: 'Step 5. 내장 analyzer — 직접 만들기 전에 standard·english를 먼저 본다',
        desc: '커스텀 analyzer를 짜기 전에 내장 analyzer로 충분한지 확인하는 게 실무 순서다. standard analyzer는 standard tokenizer + lowercase 조합으로 대부분의 다국어 텍스트에 무난하다. english analyzer는 여기에 영어 불용어 제거와 어간 추출(possessive_stemmer 포함)까지 묶여 있어 영문 본문에 바로 쓸 만하다. 왜 굳이 확인할까? 내장 analyzer로 되는 걸 커스텀으로 재발명하면 유지보수 부담만 늘기 때문이다. _analyze의 analyzer 파라미터로 내장 analyzer 결과를 즉시 비교할 수 있다.',
        active: 4,
        badge: '내장 analyzer',
        verdictTone: 'good',
        keyPoint: '내장 analyzer로 되면 커스텀을 만들지 마라. standard는 범용, english는 영문 본문에 최적.',
        code: {
          lang: 'json',
          filename: 'builtin-analyzer.json',
          lines: [
            'POST /_analyze',
            '{',
            '  "analyzer": "english",',
            '  "text": "The Foxes are Running quickly"',
            '}',
            '// standard => [the, foxes, are, running, quickly]',
            '// english  => [fox, run, quickli]  (불용어 제거 + 어간화)',
            '// 커스텀이 필요한 순간:',
            '//   - 한글/일본어 형태소 (nori, kuromoji)',
            '//   - 도메인 동의어 사전 (synonym)',
            '//   - 특수 문자 치환 (mapping char_filter)',
          ],
          highlight: [3, 6, 7],
        },
      },
      {
        title: 'Step 6. 실무 함정 — 인덱스/검색 analyzer 불일치와 한글 Nori',
        desc: '가장 흔한 사고는 인덱싱 analyzer와 검색 analyzer가 다른 경우다. 저장은 stemmer로 fox로 색인했는데 검색은 stemmer 없이 foxes로 질의하면 매칭이 안 된다. 그래서 특별한 이유가 없으면 analyzer 하나로 통일하고, 동의어 확장처럼 검색에서만 필요한 처리는 search_analyzer를 분리하되 규칙을 맞춘다. 한글은 standard tokenizer가 음절 단위로 잘라 검색이 깨진다 — Nori 플러그인을 설치해 형태소 단위로 분석해야 한다. 배포 전 반드시 _analyze로 인덱스/검색 양쪽 토큰이 같은지 눈으로 확인한다.',
        active: 4,
        badge: '실무 함정',
        verdictTone: 'danger',
        keyPoint: '인덱스 토큰과 검색 토큰이 다르면 아무것도 안 잡힌다. 배포 전 _analyze 대조가 필수.',
        code: {
          lang: 'json',
          filename: 'mapping-index-vs-search.json',
          lines: [
            '"mappings": {',
            '  "properties": {',
            '    "title": {',
            '      "type": "text",',
            '      "analyzer": "my_analyzer",',
            '      "search_analyzer": "my_search_analyzer"',
            '    },',
            '    "title_ko": {',
            '      "type": "text",',
            '      "analyzer": "nori"',
            '    }',
            '  }',
            '}',
            '// 함정: analyzer 와 search_analyzer 규칙이 어긋나면 매칭 실패',
            '// 한글: standard 는 음절 분해, nori 로 형태소 분석 필요',
          ],
          highlight: [5, 6, 10, 14, 15],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',    text: 'text-rose-800',     badge: 'bg-rose-200 text-rose-800' },
    };

    // 파이프라인 한 단계(박스) — active 이면 강조
    function StageBox({ label, tag, isActive, children }) {
      return (
        <div
          className={`rounded-lg border px-3 py-2 transition ${isActive ? 'bg-sky-50 shadow-sm' : 'bg-white'}`}
          style={{ borderColor: isActive ? '#005EB8' : '#e2e8f0', borderWidth: isActive ? '2px' : '1px' }}
        >
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-bold" style={{ color: isActive ? '#005EB8' : '#64748b' }}>{label}</span>
            <span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 font-mono">{tag}</span>
          </div>
          {children}
        </div>
      );
    }

    function Chip({ text, dim }) {
      return (
        <span className={`inline-block px-2 py-0.5 m-0.5 rounded text-[11px] font-mono border ${dim ? 'bg-slate-100 text-slate-400 border-slate-200' : 'bg-white border-sky-300 text-slate-800'}`}>
          {text}
        </span>
      );
    }

    function Arrow() {
      return <div className="text-center text-slate-300 text-xs leading-none my-0.5">↓</div>;
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const a = state.active; // 1=char, 2=tokenizer, 3=token filter, 4=전체
      const dropped = new Set(['The', 'over']); // token filter 에서 제거되는 불용어
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#005EB8' }}>Analyzer 파이프라인</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.badge}</span>
          </div>

          <StageBox label="① 원본 텍스트" tag="input" isActive={a === 4}>
            <div className="text-[11px] font-mono text-slate-700 break-all">{FLOW.original}</div>
          </StageBox>
          <Arrow />

          <StageBox label="② char filter" tag="html_strip" isActive={a === 1}>
            <div className="text-[11px] font-mono text-slate-700 break-all">{FLOW.charFiltered}</div>
            {a === 1 && <div className="text-[10px] text-emerald-700 mt-1">HTML 태그 &lt;b&gt; 제거됨</div>}
          </StageBox>
          <Arrow />

          <StageBox label="③ tokenizer" tag="standard" isActive={a === 2}>
            <div>
              {FLOW.tokens.map((tok, i) => <Chip key={i} text={tok} />)}
            </div>
            {a === 2 && <div className="text-[10px] text-emerald-700 mt-1">Brown-Foxes → Brown, Foxes 로 분리</div>}
          </StageBox>
          <Arrow />

          <StageBox label="④ token filter" tag="lowercase · stop · stemmer" isActive={a === 3}>
            <div className="mb-1">
              {FLOW.tokens.map((tok, i) => <Chip key={i} text={tok} dim={dropped.has(tok)} />)}
            </div>
            <div className="text-center text-slate-300 text-xs leading-none">↓</div>
            <div className="mt-1">
              {FLOW.filtered.map((tok, i) => <Chip key={i} text={tok} />)}
            </div>
            {a === 3 && <div className="text-[10px] text-emerald-700 mt-1">소문자화 · the/over 제거 · Foxes→fox 어간화</div>}
          </StageBox>

          <div className="mt-3 rounded-lg bg-sky-50 border border-sky-200 p-2 text-[11px] font-mono flex items-center justify-between">
            <span className="px-2 py-1 rounded bg-white border border-slate-300">인덱싱 시</span>
            <span className="text-slate-400">·같은 규칙·</span>
            <span className="px-2 py-1 rounded text-white" style={{ backgroundColor: '#005EB8' }}>검색 시</span>
          </div>

          <div className="mt-3 text-xs text-slate-800 bg-sky-50 border border-sky-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-sky-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#005EB8' }}>OS</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{ backgroundColor: '#003b75' }}>Part II. Mapping &amp; Analyzer</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300 font-mono">II-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900">Analyzer 파이프라인</h1>
                <p className="text-sm text-slate-700/80">텍스트가 검색 가능한 토큰이 되는 과정</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#005EB8' : '#e2e8f0' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-slate-50 px-5 py-4 shadow" style={{ backgroundColor: '#003b75' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#003b75' : '#005EB8' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{ borderColor: '#005EB8' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Analyzer는 char filter → tokenizer → token filter 3단계 파이프라인이며 인덱싱·검색 양쪽에서 돈다. char filter는 문자 정리(html_strip), tokenizer는 단어 경계 결정(standard), token filter는 소문자·불용어·어간·동의어 가공을 맡는다. _analyze API로 각 단계를 확인하고, 인덱스와 검색 analyzer가 어긋나지 않도록 맞춘다. 한글은 Nori로 형태소 분석해야 검색이 정상 동작한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Analyzer', 'char_filter', 'tokenizer', 'token_filter', 'stemmer', 'Nori', '_analyze'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
