<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSearch 학습 — IV-1-2. Visualize 시각화 만들기</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📊</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    OpenSearch Chapter IV-1-2 — Visualize 시각화 만들기
    학습 목표: 집계(metric + bucket)를 골라 같은 데이터가 어떻게 막대/선/파이 차트로 바뀌는지 직관적으로 본다.
    핵심 비유: 집계 = 재료 손질, 차트 = 담는 그릇. 재료가 같아도 그릇에 따라 전달력이 다르다.
    패턴: fastapi v1 — 좌(LiveDataPane: 집계→차트 애니메이션) / 우(VSCode CodeViewer, 언어 json 집계 쿼리)
    색상: #005EB8 (OpenSearch 공식 블루) / #003b75
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 데모용 카테고리 데이터 (같은 데이터를 여러 차트로 그린다)
    const CATS = [
      { label: 'GET', value: 62 },
      { label: 'POST', value: 34 },
      { label: 'PUT', value: 18 },
      { label: 'DELETE', value: 9 },
    ];
    // 시간대별(date_histogram) 데모 데이터
    const SERIES = [8, 14, 22, 40, 33, 27, 48, 55, 30, 19, 12, 9];

    const STEPS = [
      {
        title: 'Step 1. Visualize = metric(Y축) + bucket(X축)',
        desc: 'Visualize는 인덱스의 원본 문서를 그대로 그리지 않는다. 먼저 집계(aggregation)로 요약한 뒤 그 숫자를 차트로 그린다. Y축은 metric(무엇을 셀지 — count·sum·avg), X축은 bucket(어떻게 나눌지 — terms·date_histogram)이다. 이 두 축을 정하는 순간 차트의 뼈대가 결정된다. 그래서 "차트 유형"보다 "어떤 집계를 얹을지"를 먼저 생각해야 한다.',
        chart: 'bar',
        data: CATS,
        metric: 'Count',
        bucket: 'Terms(method)',
        chartLabel: '세로 막대',
        keyPoint: 'metric은 "값", bucket은 "나누는 기준". 둘을 정하면 차트는 껍데기일 뿐이다.',
        code: {
          lang: 'json',
          filename: 'visualize-skeleton.json',
          lines: [
            '{',
            '  "size": 0,',
            '  "aggs": {',
            '    "x_axis": {',
            '      "terms": { "field": "http.method", "size": 4 },',
            '      "aggs": {',
            '        "y_axis": { "value_count": { "field": "_id" } }',
            '      }',
            '    }',
            '  }',
            '}',
          ],
          highlight: [2, 3, 4, 5, 6, 7, 8],
        },
      },
      {
        title: 'Step 2. terms 버킷 + avg metric — 카테고리 비교',
        desc: 'terms 집계는 필드 값별로 문서를 그룹핑해 카테고리 막대를 만든다. Y축 metric을 count에서 avg로 바꾸면 "건수"가 아니라 "평균 응답시간" 같은 값 비교가 된다. 막대 차트는 카테고리 간 크기 비교에 가장 강하다. 단, terms의 size가 너무 작으면 상위 몇 개만 보이고 나머지는 잘려 착시가 생기니, "기타" 버킷이나 size 조정을 항상 의식해야 한다.',
        chart: 'bar',
        data: CATS,
        metric: 'Avg(latency)',
        bucket: 'Terms(method)',
        chartLabel: '세로 막대',
        keyPoint: 'terms의 size가 데이터를 자른다. 상위 N만 보이면 나머지는 없는 게 아니라 숨은 것이다.',
        code: {
          lang: 'json',
          filename: 'terms-avg.json',
          lines: [
            '{',
            '  "size": 0,',
            '  "aggs": {',
            '    "by_method": {',
            '      "terms": { "field": "http.method", "size": 4 },',
            '      "aggs": {',
            '        "avg_latency": {',
            '          "avg": { "field": "latency_ms" }',
            '        }',
            '      }',
            '    }',
            '  }',
            '}',
          ],
          highlight: [4, 5, 6, 7, 8, 9],
        },
      },
      {
        title: 'Step 3. date_histogram — 시간 기반은 선 차트',
        desc: 'date_histogram은 시간 필드를 일정 간격(calendar_interval: 1h, 1d 등)으로 잘라 시계열 버킷을 만든다. 시간의 흐름·추세를 보여줄 때는 막대보다 선 차트가 자연스럽다. 여기서 가장 흔한 실무 함정이 시간대(timezone)다. UTC로 저장된 데이터를 로컬 시간대 인식 없이 그리면 하루 경계가 어긋나 새벽 트래픽이 전날로 붙는다. time_zone 파라미터를 명시하는 습관이 필요하다.',
        chart: 'line',
        data: SERIES,
        metric: 'Count',
        bucket: 'Date histogram(1h)',
        chartLabel: '선 차트',
        keyPoint: 'UTC 저장 + 로컬 표시. time_zone을 빼먹으면 하루 경계가 통째로 밀린다.',
        code: {
          lang: 'json',
          filename: 'date-histogram.json',
          lines: [
            '{',
            '  "size": 0,',
            '  "aggs": {',
            '    "over_time": {',
            '      "date_histogram": {',
            '        "field": "@timestamp",',
            '        "calendar_interval": "1h",',
            '        "time_zone": "Asia/Seoul"',
            '      }',
            '    }',
            '  }',
            '}',
          ],
          highlight: [4, 5, 6, 7, 8],
        },
      },
      {
        title: 'Step 4. 같은 terms 집계 → 파이 차트(비율)',
        desc: 'Step 2와 완전히 같은 terms + count 집계지만, 그릇만 파이로 바꾸면 이야기가 "크기 비교"에서 "전체 대비 비율"로 바뀐다. 파이는 부분이 전체에서 차지하는 몫을 볼 때 적합하다. 하지만 조각이 5~6개를 넘으면 사람 눈이 각도를 구분하지 못해 오히려 막대만 못하다. 카테고리가 많으면 파이 대신 막대를, 비율 강조가 목적일 때만 파이를 골라야 한다.',
        chart: 'pie',
        data: CATS,
        metric: 'Count',
        bucket: 'Terms(method)',
        chartLabel: '파이',
        keyPoint: '집계는 그대로, 그릇만 교체. 파이는 조각 5개 이하 · 비율 강조일 때만.',
        code: {
          lang: 'json',
          filename: 'terms-pie.json',
          lines: [
            '{',
            '  "size": 0,',
            '  "aggs": {',
            '    "share": {',
            '      "terms": {',
            '        "field": "http.method",',
            '        "size": 5,',
            '        "order": { "_count": "desc" }',
            '      }',
            '    }',
            '  }',
            '}',
          ],
          highlight: [4, 5, 6, 7, 8],
        },
      },
      {
        title: 'Step 5. 저장 → 대시보드 추가 · 실무 함정 정리',
        desc: '완성한 시각화는 저장해야 대시보드에 올릴 수 있고, 대시보드의 시간 범위·필터가 각 패널 집계에 그대로 주입된다. 마지막으로 함정을 되짚자 — 고카디널리티 필드(user_id·url 전체)에 terms를 걸면 버킷 폭발로 쿼리가 느려진다. 잘못된 집계 조합(텍스트 필드 sum), 데이터 성격과 안 맞는 차트 유형, 빠진 time_zone도 단골 실수다. 집계를 먼저 옳게, 차트는 그 다음이다.',
        chart: 'saved',
        data: CATS,
        metric: 'Count',
        bucket: 'Terms(method)',
        chartLabel: '대시보드 패널',
        keyPoint: '고카디널리티 terms = 버킷 폭발. keyword가 아닌 필드에 terms·sum 금지.',
        code: {
          lang: 'json',
          filename: 'pitfalls-check.json',
          lines: [
            '{',
            '  "avoid": {',
            '    "high_cardinality_terms": "user_id 등 → 버킷 폭발/느림",',
            '    "sum_on_text": "text 필드 sum → 매핑 에러",',
            '    "wrong_chart": "시계열을 파이로 → 추세 사라짐",',
            '    "missing_timezone": "UTC 표시 → 하루 경계 밀림"',
            '  },',
            '  "prefer": {',
            '    "terms_field": "http.method (keyword)",',
            '    "size": 5,',
            '    "add_time_zone": "Asia/Seoul"',
            '  }',
            '}',
          ],
          highlight: [1, 2, 3, 4, 5, 6],
        },
      },
    ];

    // ── 차트 렌더러들 (SVG) ──────────────────────────────
    const BLUE = '#005EB8';
    const DARKBLUE = '#003b75';
    const PALETTE = ['#005EB8', '#2f8fd6', '#7bc0ef', '#b9deff'];

    function BarChart({ data }) {
      const max = Math.max(...data.map((d) => d.value));
      const bw = 46, gap = 22, base = 150, left = 34;
      return (
        <svg viewBox="0 0 300 180" className="w-full h-44">
          <line x1={left} y1={base} x2={290} y2={base} stroke="#cbd5e1" />
          <line x1={left} y1={20} x2={left} y2={base} stroke="#cbd5e1" />
          {data.map((d, i) => {
            const h = (d.value / max) * (base - 30);
            const x = left + 8 + i * (bw + gap);
            return (
              <g key={i}>
                <rect x={x} y={base - h} width={bw} height={h} rx="3" fill={BLUE}>
                  <animate attributeName="height" from="0" to={h} dur="0.5s" fill="freeze" />
                  <animate attributeName="y" from={base} to={base - h} dur="0.5s" fill="freeze" />
                </rect>
                <text x={x + bw / 2} y={base + 12} textAnchor="middle" fontSize="9" fill="#475569">{d.label}</text>
                <text x={x + bw / 2} y={base - h - 4} textAnchor="middle" fontSize="9" fill={DARKBLUE} fontWeight="bold">{d.value}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    function LineChart({ data }) {
      const max = Math.max(...data);
      const left = 30, base = 150, w = 258, top = 20;
      const pts = data.map((v, i) => {
        const x = left + (i / (data.length - 1)) * w;
        const y = base - (v / max) * (base - top);
        return [x, y];
      });
      const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const area = path + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + base + ' L' + pts[0][0].toFixed(1) + ' ' + base + ' Z';
      return (
        <svg viewBox="0 0 300 180" className="w-full h-44">
          <line x1={left} y1={base} x2={288} y2={base} stroke="#cbd5e1" />
          <line x1={left} y1={top} x2={left} y2={base} stroke="#cbd5e1" />
          <path d={area} fill="#005EB8" opacity="0.12" />
          <path d={path} fill="none" stroke={BLUE} strokeWidth="2.5" strokeLinejoin="round">
            <animate attributeName="stroke-dasharray" from="0 600" to="600 0" dur="0.8s" fill="freeze" />
          </path>
          {pts.map((p, i) => (
            <circle key={i} cx={p[0]} cy={p[1]} r="2.6" fill={DARKBLUE} />
          ))}
          <text x={left + w / 2} y={172} textAnchor="middle" fontSize="9" fill="#475569">시간 (1h 버킷)</text>
        </svg>
      );
    }

    function PieChart({ data }) {
      const total = data.reduce((s, d) => s + d.value, 0);
      const cx = 100, cy = 90, r = 68;
      let acc = -Math.PI / 2;
      const arcs = data.map((d, i) => {
        const frac = d.value / total;
        const a0 = acc;
        const a1 = acc + frac * Math.PI * 2;
        acc = a1;
        const large = a1 - a0 > Math.PI ? 1 : 0;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const mid = (a0 + a1) / 2;
        const lx = cx + (r + 16) * Math.cos(mid), ly = cy + (r + 16) * Math.sin(mid);
        return { d: 'M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z', color: PALETTE[i % PALETTE.length], label: d.label, pct: Math.round(frac * 100), lx, ly };
      });
      return (
        <svg viewBox="0 0 300 180" className="w-full h-44">
          <g>
            {arcs.map((a, i) => (
              <path key={i} d={a.d} fill={a.color} stroke="#fff" strokeWidth="1.5" />
            ))}
          </g>
          {arcs.map((a, i) => (
            <text key={'t' + i} x={a.lx} y={a.ly} textAnchor="middle" fontSize="8.5" fill="#334155">{a.label} {a.pct}%</text>
          ))}
        </svg>
      );
    }

    function SavedPanel({ data }) {
      return (
        <div className="w-full">
          <div className="rounded-lg border-2 border-dashed p-3" style={{borderColor: BLUE}}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-bold" style={{color: DARKBLUE}}>Dashboard · HTTP 개요</span>
              <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{backgroundColor: BLUE}}>Last 24h</span>
            </div>
            <BarChart data={data} />
          </div>
          <div className="mt-2 grid grid-cols-2 gap-2 text-[10px]">
            <div className="rounded bg-rose-50 border border-rose-200 px-2 py-1 text-rose-700">고카디널리티 terms 금지</div>
            <div className="rounded bg-rose-50 border border-rose-200 px-2 py-1 text-rose-700">text 필드 sum 금지</div>
            <div className="rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-emerald-700">time_zone 명시</div>
            <div className="rounded bg-emerald-50 border border-emerald-200 px-2 py-1 text-emerald-700">차트↔데이터 성격 맞추기</div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      let chart;
      if (state.chart === 'bar') chart = <BarChart data={state.data} />;
      else if (state.chart === 'line') chart = <LineChart data={state.data} />;
      else if (state.chart === 'pie') chart = <PieChart data={state.data} />;
      else chart = <SavedPanel data={state.data} />;

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color: BLUE}}>집계 → 차트</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{backgroundColor: BLUE}}>{state.chartLabel}</span>
          </div>
          <div className="grid grid-cols-2 gap-2 mb-3">
            <div className="rounded-lg border border-sky-200 bg-sky-50 px-3 py-2">
              <div className="text-[10px] text-slate-500">metric (Y축)</div>
              <div className="text-sm font-mono font-bold" style={{color: DARKBLUE}}>{state.metric}</div>
            </div>
            <div className="rounded-lg border border-sky-200 bg-sky-50 px-3 py-2">
              <div className="text-[10px] text-slate-500">bucket (X축)</div>
              <div className="text-sm font-mono font-bold" style={{color: DARKBLUE}}>{state.bucket}</div>
            </div>
          </div>
          <div className="flex-1 rounded-lg border border-slate-200 bg-slate-50 p-2 flex items-center justify-center">
            {chart}
          </div>
          <div className="mt-3 text-xs text-slate-800 bg-sky-50 border border-sky-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-sky-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{backgroundColor: BLUE}}>OS</span>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{backgroundColor: DARKBLUE}}>Part IV. Dashboards</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300 font-mono">IV-1-2</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 mt-1">Visualize — 시각화 만들기</h1>
                <p className="text-sm text-slate-700/80">집계를 차트로, 데이터를 그림으로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{backgroundColor: i <= stepIdx ? BLUE : '#e2e8f0'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-slate-50 px-5 py-4 shadow" style={{backgroundColor: DARKBLUE}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{backgroundColor: playing ? DARKBLUE : BLUE}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-slate-900" style={{borderColor: BLUE}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Visualize는 집계(metric+bucket)로 먼저 요약하고 그 숫자를 차트로 그린다. 같은 terms 집계도 막대는 크기 비교, 파이는 비율 강조로 이야기가 바뀐다. 시계열은 date_histogram+선 차트+time_zone. 고카디널리티 terms·text 필드 sum·차트 부적합은 단골 실수. 집계를 먼저 옳게, 차트는 그 다음이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Visualize', 'Aggregation', 'metric', 'bucket', 'terms', 'date_histogram', 'Dashboard'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
