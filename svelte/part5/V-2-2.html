    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!--

    비유: "비행기 이륙 전 체크리스트" — 렌더·데이터·폼·성능·접근성·보안을 하나씩 통과시켜야 배포한다

        alert: { tone: 'info', text: '페이지를 정적(prerender) · 동적(SSR) · SPA(csr) 세 부류로 나눠라. 기본값 SSR을 맹신하지 말 것.' },

      {
        title: 'Step 6. 에러 페이지 · 상태관리 · 최종 이륙 점검 (Svelte 완주)',
        desc: '마지막으로 실패 경로와 상태 설계를 점검한다. +error.svelte는 load에서 던진 error를 받아 사용자 친화적 화면을 보여준다. 최상위 src/routes/+error.svelte는 404·500 공통 폴백이 된다. 상태관리는 두 갈래다. 여러 컴포넌트가 공유하면 store(또는 Svelte 5의 $state 룬 모듈), 트리 아래로만 내려주면 setContext/getContext. 전역 store에 요청별 사용자 데이터를 담으면 SSR에서 요청 간 데이터가 섞이는 치명적 버그가 생긴다 — 요청 스코프 데이터는 load/locals로 넘겨라. 여기까지가 반응성→컴포넌트→스토어→라우터→트랜지션→운영을 종합한 배포 전 최종 점검이다. Svelte 완주를 축하한다.',
        cat: 'error',
        alert: { tone: 'good', text: '모든 항목 통과 = 이륙 준비 완료. 전역 store에 요청별 데이터 금지(SSR 오염). Svelte 완주!' },
        code: {
          lang: 'html',
          filename: 'src/routes/+error.svelte',
          lines: [
            '<script>',
            '  import { page } from "$app/stores";',
            '<\/script>',
            '',
            '<!-- load 에서 throw 한 error 를 여기서 받는다 -->',
            '<section class="error">',
            '  <h1>{$page.status}</h1>',
            '  <p>{$page.error?.message ?? "문제가 발생했습니다"}</p>',
            '  <a href="/">홈으로</a>',
            '</section>',
            '',
            '<!-- 상태관리 선택 기준 -->',
            '<!--',
            '  공유 범위 넓음  → store (writable) 또는 $state 룬 모듈',
            '  트리 아래로만   → setContext / getContext',
            '  요청별 데이터   → load 반환 / locals (전역 store 금지!)',
            '',
            '  ⚠️ SSR 함정: 모듈 최상위 store 에 사용자 정보를 담으면',
            '     서버가 요청 간 상태를 공유해 데이터가 섞인다.',
            '-->',
            '',
            '<style>',
            '  .error { text-align: center; padding: 4rem 1rem; }',
            '  h1 { color: #FF3E00; font-size: 3rem; margin: 0; }',
            '</style>',
          ],
          highlight: [5, 6, 7, 8, 9, 14, 15, 16, 18, 19],
        },
      },
    ];

    // 종합 체크리스트 마스터 — 각 항목이 어느 챕터에서 왔는지 배지로 연결
    // status: 어느 step 에서 통과/경고 처리되는지 매핑
    const CHECKLIST = [
      { key: 'render',  label: '렌더 전략 (SSR/CSR/prerender)', chapter: '제5장 운영',   passAt: 0 },
      { key: 'data',    label: 'load 데이터 · 에러 처리',        chapter: '제4장 라우터', passAt: 1 },
      { key: 'form',    label: 'form actions 검증 · CSRF',       chapter: '제4장 라우터', passAt: 2 },
      { key: 'perf',    label: '성능 (코드분할 · 프리로드 · 이미지)', chapter: '제5장 운영', passAt: 3 },
      { key: 'a11y',    label: '접근성 · SEO (메타 · 시맨틱)',    chapter: '제5장 운영',   passAt: 3 },
      { key: 'trans',   label: '트랜지션 과용 점검',             chapter: '제3장 트랜지션', passAt: 3, tone: 'warn' },
      { key: 'secret',  label: '환경변수 · 시크릿 · 어댑터',      chapter: '제5장 운영',   passAt: 4 },
      { key: 'state',   label: '상태관리 (store · context)',     chapter: '제3장 스토어', passAt: 5 },
      { key: 'error',   label: '에러 페이지 (+error.svelte) · 404', chapter: '제5장 운영', passAt: 5 },
    ];

    const CAT_BADGE = {
      render: { label: '렌더 전략', color: '#FF3E00' },
      data:   { label: '데이터',   color: '#6366F1' },
      form:   { label: '폼 · 보안', color: '#DC2626' },
      perf:   { label: '성능·접근성', color: '#059669' },
      secret: { label: '시크릿·배포', color: '#9A3412' },
      error:  { label: '에러·상태', color: '#F59E0B' },
    };

    function StatusIcon({ status }) {
      if (status === 'pass') return <span className="text-emerald-600">✓</span>;
      if (status === 'warn') return <span className="text-amber-500">⚠</span>;
      return <span className="text-slate-300">○</span>;
    }

    function LiveDataPane({ state, stepIdx }) {
      const badge = CAT_BADGE[state.cat] || CAT_BADGE.render;

      const items = CHECKLIST.map((c) => {
        let status = 'pending';
        // 현재 단계(passAt)까지 도달한 항목은 통과/경고로 채워진다
        if (c.passAt <= stepIdx) status = c.tone === 'warn' ? 'warn' : 'pass';
        // 현재 단계에서 막 처리된 항목만 활성 강조
        return { ...c, status, active: c.passAt === stepIdx };
      });

      const passed = items.filter((i) => i.status === 'pass').length;
      const warned = items.filter((i) => i.status === 'warn').length;
      const total = items.length;

      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>배포 전 체크리스트 — 이륙 점검</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
            <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
              <span>🛫</span>
              <span>Production Readiness</span>
              <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{passed}/{total} 통과</span>
            </div>
            <div className="p-2 space-y-1 bg-orange-50">
              {items.map((it) => (
                <div
                  key={it.key}
                  className="flex items-center gap-2 rounded px-2 py-1.5 text-[11px] transition"
                  style={{
                    backgroundColor: it.active ? 'rgba(255,62,0,0.12)' : 'white',
                    border: it.active ? '1px solid #FF3E00' : '1px solid #FED7AA',
                    opacity: it.status === 'pending' ? 0.55 : 1,
                  }}
                >
                  <StatusIcon status={it.status} />
                  <span className="flex-1 text-slate-700">{it.label}</span>
                  <span className="text-[9px] px-1.5 py-0.5 rounded-full border" style={{ color: '#9A3412', borderColor: '#FED7AA', backgroundColor: '#FFF7ED' }}>{it.chapter}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="mt-3 grid grid-cols-3 gap-2 text-center">
            <div className="rounded-lg border p-2" style={{ borderColor: '#6EE7B7', backgroundColor: '#ECFDF5' }}>
              <div className="text-lg font-bold text-emerald-700">{passed}</div>
              <div className="text-[10px] text-emerald-800">통과</div>
            </div>
            <div className="rounded-lg border p-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
              <div className="text-lg font-bold text-amber-600">{warned}</div>
              <div className="text-[10px] text-amber-800">경고 점검</div>
            </div>
            <div className="rounded-lg border p-2" style={{ borderColor: '#CBD5E1', backgroundColor: '#F8FAFC' }}>
              <div className="text-lg font-bold text-slate-500">{total - passed - warned}</div>
              <div className="text-[10px] text-slate-600">대기</div>
            </div>
          </div>

          {stepIdx === STEPS.length - 1 && (
            <div className="mt-3 rounded-lg border-2 p-2 text-center text-xs font-bold" style={{ borderColor: '#FF3E00', color: '#9A3412', backgroundColor: '#FFF7ED' }}>
              🔥 전 항목 점검 완료 — 이륙 준비 OK · Svelte 완주
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{ backgroundColor: '#9A3412' }}>Part V. SvelteKit 운영</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full border font-mono" style={{ color: '#9A3412', borderColor: '#FED7AA', backgroundColor: '#FFF7ED' }}>V-2-2</span>
                </div>
                <h1 className="text-2xl font-bold mt-1" style={{ color: '#9A3412' }}>실전 체크리스트 — 프로덕션 준비</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>앞서 배운 것을 종합한 SvelteKit 배포 전 점검 (Svelte 완주)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리 — Svelte 완주</div>
                배포 전 점검은 여섯 축이다. 렌더 전략(페이지별 SSR/CSR/prerender), load 데이터·에러 처리, form actions 검증·CSRF, 성능·접근성·SEO, 환경변수·시크릿·어댑터, 그리고 에러 페이지·상태관리다. 각 항목은 반응성→컴포넌트→스토어→라우터→트랜지션→운영에서 배운 것을 종합한다. 실무 함정 총정리: 시크릿을 PUBLIC_ 없이 노출, 전역 store에 요청별 데이터 저장(SSR 오염), 트랜지션 과용, 어댑터 불일치. 이 네 가지만 피해도 첫 배포 사고의 대부분을 막는다. Svelte 여정을 끝까지 완주한 것을 축하한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['SvelteKit', '프로덕션', 'SSR', 'prerender', 'form-actions', 'CSRF', 'adapter', '$env', 'SEO', '접근성', 'Svelte완주'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">🔥 Svelte 완주 — 챕터 목록으로 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
