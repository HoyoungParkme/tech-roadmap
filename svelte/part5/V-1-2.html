<body>
  <div id="root"></div>

  <!--
    SvelteKit V-1-2 — form actions + endpoint
    비유: "우체국 창구(form action)와 API 배달원(endpoint)" — 폼은 서버 창구가 접수·검증하고,
          엔드포인트는 JSON 소포를 주고받는다. JS가 없어도 창구는 열려 있다(progressive enhancement).
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. form actions — 폼 제출을 서버가 처리한다',
        desc: 'SvelteKit은 폼 제출을 +page.server.js의 actions 함수로 받는다. 브라우저의 기본 폼 동작(POST 후 페이지 이동)을 그대로 쓰기 때문에 JavaScript가 꺼져 있어도 동작한다. 이것이 progressive enhancement의 출발점이다. 먼저 순수 HTML 폼으로 동작을 보장하고, 나중에 JS로 부드럽게 얹는다. action 함수는 request를 받아 formData()로 값을 읽고, 결과를 반환하면 그 값이 page의 form prop으로 돌아온다.',
        api: 'basic',
        flow: 'submit',
        alert: { tone: 'info', text: 'form action은 브라우저 기본 폼 제출을 서버에서 받는다. JS 없이도 동작하는 게 핵심.' },
        code: {
          lang: 'html',
          filename: 'login/+page.svelte',

            '<!-- 순수 HTML form — action 속성 없이도 현재 라우트로 POST 된다 -->',
            '<!-- method="POST" 만 있으면 +page.server.js 의 default action 실행 -->',
            '',
            '<script>',
            '  // form: 서버 action 이 반환한 값이 여기로 돌아온다',
            '  let { form } = $props();',
            '<\/script>',
            '',
            '<h1>로그인</h1>',
            '',
            '<form method="POST">',
            '  <label>',
            '    이메일',
            '    <input name="email" type="email" />',
            '  </label>',
            '  <label>',
            '    비밀번호',
            '    <input name="password" type="password" />',
            '  </label>',
            '  <button>로그인</button>',
            '</form>',
            '',
            '<!-- JS 를 끄고도 이 폼은 제출된다:',
            '     브라우저가 POST 요청을 보내고, 서버가 응답으로 페이지를 다시 그린다.',
            '     SPA 가 아니라 "서버가 렌더하는 전통 폼" 이 기본 동작이다. -->',
          ],
          highlight: [4, 5, 6, 7, 11, 14, 18, 20],
        },
      },
      {
        title: 'Step 2. 기본 action vs named action',
        desc: '한 페이지에 폼이 하나면 default action 하나로 충분하다. 로그인·회원가입처럼 폼이 여러 개면 named action을 쓴다. actions 객체에 login, register 같은 이름을 두고, 폼에서는 action="?/login" 처럼 쿼리로 어떤 action을 부를지 지정한다. 버튼별로 formaction="?/logout"을 줘서 한 폼에서 여러 동작을 분기할 수도 있다. named를 쓰기 시작하면 default는 쓸 수 없으니 전부 이름을 붙인다.',
        api: 'named',
        flow: 'route',
        alert: { tone: 'info', text: '폼 여러 개 = named action. form action="?/login". default 와 named 는 섞어 쓸 수 없다.' },
        code: {
          lang: 'javascript',
          filename: 'login/+page.server.js',
          lines: [
            '// 여러 action 을 이름으로 구분한다',
            'export const actions = {',
            '  // 폼에서 action="?/login" 으로 호출',
            '  login: async ({ request }) => {',
            '    const data = await request.formData();',
            '    const email = data.get("email");',
            '    // ... 인증 처리 ...',
            '    return { success: true, email };',
            '  },',
            '',
            '  // 폼에서 action="?/register" 으로 호출',
            '  register: async ({ request }) => {',
            '    const data = await request.formData();',
            '    // ... 가입 처리 ...',
            '    return { success: true };',
            '  },',
            '};',
            '',
            '/* +page.svelte 쪽',
            '   <form method="POST" action="?/login"> ... </form>',
            '   <form method="POST" action="?/register"> ... </form>',
            '',
            '   또는 한 폼에서 버튼별로 분기:',
            '   <button formaction="?/login">로그인</button>',
            '   <button formaction="?/logout">로그아웃</button>',
            '   주의: named 를 쓰면 default action 은 못 쓴다(전부 이름 지정). */',
          ],
          highlight: [2, 3, 4, 5, 8, 11, 12, 19, 20, 24, 25],
        },
      },
      {
        title: 'Step 3. 검증 + fail() 로 에러를 폼에 돌려준다',
        desc: '검증은 반드시 서버에서 한다. 클라이언트 검증은 UX 보조일 뿐, 공격자는 폼을 우회해 직접 POST할 수 있다. 값이 잘못됐으면 fail(400, {...})로 상태코드와 에러 데이터를 반환한다. 이 값은 예외가 아니라 정상 응답으로 form prop에 담겨 돌아오고, 페이지는 그대로 유지된다. 중요한 함정: 비밀번호 같은 민감값은 되돌리지 말고, 사용자가 다시 입력하기 싫은 email 등만 되돌려 채워준다.',
        api: 'validate',
        flow: 'fail',
        alert: { tone: 'warn', text: '검증은 서버 필수. fail(400, {...}) 는 예외가 아니라 form prop 으로 돌아온다. 비밀번호는 되돌리지 말 것.' },
        code: {
          lang: 'javascript',
          filename: 'login/+page.server.js',
          lines: [
            'import { fail } from "@sveltejs/kit";',
            '',
            'export const actions = {',
            '  login: async ({ request }) => {',
            '    const data = await request.formData();',
            '    const email = data.get("email");',
            '    const password = data.get("password");',
            '',
            '    // 1) 서버 검증 (신뢰할 수 있는 유일한 지점)',
            '    if (!email || !email.includes("@")) {',
            '      // fail: 상태코드 + 폼으로 돌려줄 데이터',
            '      return fail(400, {',
            '        email,               // 다시 채워줄 값 (편의)',
            '        error: "이메일 형식이 올바르지 않습니다",',
            '      });',
            '    }',
            '    if (!password) {',
            '      return fail(400, { email, error: "비밀번호를 입력하세요" });',
            '    }',
            '',
            '    // 2) 통과 → 성공 데이터 반환',
            '    return { success: true };',
            '  },',
            '};',
            '',
            '/* +page.svelte',
            '   let { form } = $props();',
            '   {#if form?.error} <p class="err">{form.error}</p> {/if}',
            '   <input name="email" value={form?.email ?? ""} />',
            '   비밀번호는 절대 form 으로 되돌리지 않는다. */',
          ],
          highlight: [1, 9, 10, 11, 12, 13, 14, 16, 17, 21, 27, 28, 29],
        },
      },
      {
        title: 'Step 4. use:enhance — JS가 있으면 새로고침 없이',
        desc: 'use:enhance는 순수 폼을 점진 향상시킨다. JS가 로드되면 폼 제출을 가로채 fetch로 보내고, 전체 페이지 새로고침 없이 form prop만 갱신한다. JS가 없으면? 그냥 원래의 전통 폼으로 동작한다. 그래서 안전하다. enhance를 빼먹으면 제출할 때마다 화면이 깜빡이며 전체 리로드된다. 콜백으로 로딩 상태 표시나 성공 후 처리를 넣을 수 있고, 기본 동작을 원하면 update()를 호출한다.',
        api: 'enhance',
        flow: 'enhance',
        alert: { tone: 'good', text: 'use:enhance = 점진 향상. JS 있으면 fetch 로 부드럽게, 없으면 전통 폼. 없으면 매 제출마다 전체 리로드.' },
        code: {
          lang: 'html',
          filename: 'login/+page.svelte',
          lines: [
            '<script>',
            '  import { enhance } from "$app/forms";',
            '  let { form } = $props();',
            '  let loading = $state(false);',
            '<\/script>',
            '',
            '<!-- use:enhance 하나로 새로고침 없는 제출이 된다 -->',
            '<form',
            '  method="POST"',
            '  action="?/login"',
            '  use:enhance={() => {',
            '    // 제출 직전 (fetch 보내기 전)',
            '    loading = true;',
            '    return async ({ update }) => {',
            '      // 서버 응답 도착 후',
            '      await update();     // form prop 갱신 + 폼 초기화',
            '      loading = false;',
            '    };',
            '  }}',
            '>',
            '  <input name="email" value={form?.email ?? ""} />',
            '  <input name="password" type="password" />',
            '  <button disabled={loading}>',
            '    {loading ? "처리 중..." : "로그인"}',
            '  </button>',
            '</form>',
            '',
            '{#if form?.error}',
            '  <p class="err">{form.error}</p>',
            '{/if}',
            '',
            '<!-- use:enhance 를 빼면? 제출마다 전체 페이지가 리로드된다.',
            '     JS 가 꺼져 있어도 이 폼은 여전히 동작한다(전통 POST). -->',
          ],
          highlight: [2, 4, 8, 11, 13, 14, 16, 17, 23, 24, 32],
        },
      },
      {
        title: 'Step 5. endpoint(+server.js) — API 라우트',
        desc: '폼이 아니라 순수 데이터 API가 필요하면 +server.js를 만든다. GET/POST/PUT/DELETE 함수를 export하면 그 라우트가 REST 엔드포인트가 된다. json() 헬퍼로 JSON을 응답하고, fetch로 다른 앱이나 클라이언트 JS가 호출한다. form action은 "이 페이지의 폼을 서버가 처리"하는 것이고, endpoint는 "누구나 호출하는 데이터 API"다. 브라우저 폼 UX가 목적이면 action, 모바일 앱·외부 연동·순수 JSON이면 endpoint를 쓴다.',
        api: 'endpoint',
        flow: 'endpoint',
        alert: { tone: 'info', text: '+server.js 는 GET/POST 를 export 하는 JSON API. 폼 UX = action, 외부/앱/순수 JSON = endpoint.' },
        code: {
          lang: 'javascript',
          filename: 'api/todos/+server.js',
          lines: [
            'import { json, error } from "@sveltejs/kit";',
            '',
            '// GET /api/todos  → 목록을 JSON 으로',
            'export async function GET({ url }) {',
            '  const limit = Number(url.searchParams.get("limit") ?? 20);',
            '  const todos = await db.todos.findMany({ take: limit });',
            '  return json(todos);           // Response(JSON) 반환',
            '}',
            '',
            '// POST /api/todos  → 생성',
            'export async function POST({ request }) {',
            '  const body = await request.json();   // JSON 바디 파싱',
            '',
            '  // endpoint 도 검증은 서버에서 필수',
            '  if (!body.title) {',
            '    throw error(400, "title 은 필수입니다");',
            '  }',
            '',
            '  const created = await db.todos.create({ data: body });',
            '  return json(created, { status: 201 });',
            '}',
            '',
            '/* 호출 예 (클라이언트 JS 또는 외부 앱):',
            '   const res = await fetch("/api/todos", {',
            '     method: "POST",',
            '     headers: { "Content-Type": "application/json" },',
            '     body: JSON.stringify({ title: "우유 사기" }),',
            '   });',
            '   const todo = await res.json(); */',
          ],
          highlight: [1, 4, 6, 7, 11, 12, 15, 16, 19, 20, 24, 25, 26, 27],
        },
      },
      {
        title: 'Step 6. 실무 함정 — CSRF·검증·응답 형식',
        desc: 'form action은 SvelteKit이 same-origin 검사(Origin 헤더)로 CSRF를 기본 방어한다. 하지만 +server.js의 POST는 이 보호를 받지 않으니 인증 토큰·Origin 확인을 직접 챙겨야 한다. 검증은 클라이언트가 아니라 항상 서버에서, action은 fail()로, endpoint는 error()로 반환한다. use:enhance를 안 쓰면 매 제출마다 전체 새로고침이 되니 UX가 나쁘다. 응답 형식도 구분: action은 form prop으로 돌아갈 직렬화 가능한 객체, endpoint는 반드시 json() 등 Response 객체다.',
        api: 'pitfall',
        flow: 'pitfall',
        alert: { tone: 'danger', text: 'endpoint(+server.js POST)는 CSRF 자동보호 밖 — 토큰/Origin 직접 확인. action=fail(), endpoint=error(). 응답 형식 혼동 금지.' },
        code: {
          lang: 'javascript',
          filename: 'pitfalls.md',
          lines: [
            '// 실무 체크리스트 — form action & endpoint',
            '',
            '// 1) CSRF',
            '//   form action: SvelteKit 이 Origin 검사로 기본 방어 (same-origin)',
            '//   +server.js POST: 자동 보호 없음 → 인증 토큰 / Origin 직접 확인',
            '',
            '// 2) 검증은 언제나 서버에서',
            '//   클라이언트 검증은 UX 보조일 뿐, 우회 가능',
            'export const actions = {',
            '  save: async ({ request }) => {',
            '    const data = await request.formData();',
            '    // action → 실패는 fail(status, obj)',
            '    if (!data.get("title")) return fail(400, { error: "필수" });',

            '};',
            '',
            '// endpoint → 실패는 throw error(status, msg), 성공은 json()',
            'export async function POST({ request }) {',
            '  const body = await request.json();',
            '  if (!body.title) throw error(400, "필수");',
            '  return json({ ok: true }, { status: 201 });',
            '}',
            '',
            '// 3) use:enhance 없으면 → 제출마다 전체 새로고침 (UX 저하)',
            '// 4) 응답 형식 혼동 금지:',
            '//    action=form prop 객체 / endpoint=Response(json)',
          ],
          highlight: [3, 4, 5, 7, 8, 12, 13, 14, 18, 20, 21, 24, 25, 26],
        },
      },
    ];

    const API_BADGE = {
      basic:    { label: 'form actions', color: '#FF3E00' },
      named:    { label: 'named action', color: '#F59E0B' },
      validate: { label: 'fail() 검증', color: '#DC2626' },
      enhance:  { label: 'use:enhance', color: '#059669' },
      endpoint: { label: '+server.js', color: '#6366F1' },
      pitfall:  { label: '실무 함정', color: '#9A3412' },
    };

    // 흐름 노드: 상태별로 어느 단계가 활성인지 다르게 그린다
    function FlowDiagram({ flow }) {
      const nodes = [
        { key: 'form',   label: 'form 제출', sub: 'method="POST"', emoji: '📝' },
        { key: 'server', label: 'server action', sub: '+page.server.js', emoji: '🖥️' },
        { key: 'check',  label: '검증', sub: 'formData 확인', emoji: '🔎' },
        { key: 'result', label: '결과', sub: 'form prop 반환', emoji: '↩️' },
      ];

      // flow 상태별 활성 노드 / 결과 톤
      const activeByFlow = {
        submit:   { active: ['form', 'server'], tone: 'run' },
        route:    { active: ['form', 'server'], tone: 'run' },
        fail:     { active: ['form', 'server', 'check', 'result'], tone: 'bad' },
        enhance:  { active: ['form', 'server', 'check', 'result'], tone: 'good' },
        endpoint: { active: ['form', 'server'], tone: 'api' },
        pitfall:  { active: ['form', 'server', 'check', 'result'], tone: 'warn' },
      };
      const conf = activeByFlow[flow] || activeByFlow.submit;
      const activeSet = new Set(conf.active);

      const toneColor = {
        run:  '#FF3E00',
        good: '#059669',
        bad:  '#DC2626',
        api:  '#6366F1',
        warn: '#9A3412',
      }[conf.tone];

      return (
        <div className="space-y-2">
          {nodes.map((n, i) => {
            const on = activeSet.has(n.key);
            const isResult = n.key === 'result';
            const nodeColor = isResult && on ? toneColor : (on ? '#FF3E00' : '#FED7AA');
            return (
              <div key={n.key}>
                <div
                  className="rounded-lg border-2 px-3 py-2 flex items-center gap-2 transition"
                  style={{
                    borderColor: nodeColor,
                    backgroundColor: on ? '#FFF7ED' : '#FFFDFB',
                    opacity: on ? 1 : 0.5,
                  }}
                >
                  <span className="text-lg">{n.emoji}</span>
                  <div className="flex-1">
                    <div className="text-xs font-bold" style={{ color: on ? '#9A3412' : '#C2703C' }}>{n.label}</div>
                    <div className="text-[10px] font-mono" style={{ color: '#B45309' }}>{n.sub}</div>
                  </div>
                  {on && (
                    <span
                      className="text-[9px] px-1.5 py-0.5 rounded text-white font-bold"
                      style={{ backgroundColor: nodeColor }}
                    >ON</span>
                  )}
                </div>
                {i < nodes.length - 1 && (
                  <div className="flex justify-center py-0.5">
                    <span
                      className={on && activeSet.has(nodes[i + 1].key) ? 'trn-flow' : ''}
                      style={{ color: on && activeSet.has(nodes[i + 1].key) ? toneColor : '#FED7AA', fontSize: '14px' }}
                    >↓</span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function EnhanceCompare({ flow }) {
      // Step 4(enhance)에서만: enhance 있음/없음 대비
      if (flow !== 'enhance') return null;
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border p-2" style={{ borderColor: '#FCA5A5', backgroundColor: '#FEF2F2' }}>
            <div className="text-[10px] font-bold text-red-700">enhance 없음</div>
            <div className="text-[10px] text-red-900 mt-1">제출 → 전체 새로고침</div>
            <div className="text-[10px] text-red-900">화면 깜빡임 · 스크롤 초기화</div>
          </div>
          <div className="rounded-lg border p-2" style={{ borderColor: '#059669', backgroundColor: '#ECFDF5' }}>
            <div className="text-[10px] font-bold text-emerald-700">use:enhance</div>
            <div className="text-[10px] text-emerald-900 mt-1">fetch 로 제출</div>
            <div className="text-[10px] text-emerald-900">form prop 만 갱신 · 부드러움</div>
          </div>
        </div>
      );
    }

    function FormVsEndpoint({ flow }) {
      // Step 5/6에서: form vs endpoint 선택 기준
      if (flow !== 'endpoint' && flow !== 'pitfall') return null;
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border p-2" style={{ borderColor: '#FF3E00', backgroundColor: '#FFF7ED' }}>
            <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>form action</div>
            <div className="text-[10px] mt-1" style={{ color: '#7C2D12' }}>페이지 폼 UX</div>
            <div className="text-[10px]" style={{ color: '#7C2D12' }}>fail() · form prop · CSRF 기본방어</div>
          </div>
          <div className="rounded-lg border p-2" style={{ borderColor: '#6366F1', backgroundColor: '#EEF2FF' }}>
            <div className="text-[10px] font-bold" style={{ color: '#4338CA' }}>endpoint(+server.js)</div>
            <div className="text-[10px] mt-1" style={{ color: '#3730A3' }}>외부 앱 · 순수 JSON</div>
            <div className="text-[10px]" style={{ color: '#3730A3' }}>error() · json() · CSRF 직접</div>
          </div>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#ECFDF5', border: '#059669', text: '#065F46', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const badge = API_BADGE[state.api] || API_BADGE.basic;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>SvelteKit — 폼 제출 &amp; 응답 흐름</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
            <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
              <span>🔥</span>
              <span>browser → server → form prop</span>
              <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{badge.label}</span>
            </div>
            <div className="p-3 bg-orange-50">
              <FlowDiagram flow={state.flow} />
            </div>
          </div>

          <EnhanceCompare flow={state.flow} />
          <FormVsEndpoint flow={state.flow} />
          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2 h-10 rounded-lg text-white text-xs font-bold" style={{ backgroundColor: '#FF3E00' }}>Part V. SvelteKit 운영</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}><span className="font-mono text-base align-middle mr-1" style={{ color: '#FF3E00' }}>V-1-2</span> form actions + endpoint</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>JS 없이도 동작하는 폼 처리와 API 엔드포인트</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                form action(+page.server.js의 actions)은 브라우저 기본 폼 제출을 서버가 받아 JS 없이도 동작한다. 폼이 여럿이면 named action, 검증 실패는 fail()로 form prop에 돌려준다. use:enhance로 새로고침 없이 부드럽게 얹고, 순수 JSON API는 endpoint(+server.js)로 만든다. 검증은 항상 서버에서, endpoint의 POST는 CSRF 자동보호 밖이라 토큰·Origin을 직접 챙긴다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['SvelteKit', 'form-actions', 'named-action', 'fail', 'use:enhance', 'progressive-enhancement', '+server.js', 'endpoint', 'CSRF', 'json'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
