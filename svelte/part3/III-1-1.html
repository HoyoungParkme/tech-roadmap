<body>
  <div id="root"></div>

  <!--
    Svelte III-1-1 — writable store: 공유 상태
    비유: "사무실 화이트보드" — 스토어는 벽에 걸린 화이트보드. 누구든 값을 고쳐 쓰면(.set/.update),
    그 보드를 보고 있던 모든 사람($ 구독)이 동시에 새 값을 본다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. writable(초기값) — 컴포넌트 밖에서 사는 상태',
        desc: 'writable 은 컴포넌트 트리 밖에 상태를 두는 가장 기본 스토어다. 왜 밖에 둘까? 상단·하단·사이드바처럼 부모·자식 관계가 아닌 컴포넌트끼리 같은 값을 봐야 할 때, props 로 계속 내려보내는 것(prop drilling)은 지옥이 된다. writable(0) 은 초기값을 담은 객체를 돌려주고, 이 객체는 .subscribe / .set / .update 세 메서드를 가진다. 보통 이 스토어를 별도 .js 파일에 만들어 두고, 필요한 컴포넌트가 각자 import 해서 같은 인스턴스를 공유한다.',
        storeVal: 0,
        subs: [],
        action: 'count = writable(0)',
        api: 'create',
        alert: { tone: 'info', text: 'writable(초기값) → { subscribe, set, update }. 스토어는 컴포넌트 밖(.js)에 두고 import 로 공유한다.' },
        code: {
          lang: 'javascript',
          filename: 'stores/count.js',
          lines: [
            '// 스토어는 컴포넌트 밖(별도 .js)에 정의한다',
            'import { writable } from "svelte/store";',
            '',
            '// 초기값 0 으로 쓰기 가능한 스토어 생성',
            'export const count = writable(0);',
            '',
            '// count 는 세 가지 메서드를 가진 객체',
            '//   subscribe(fn) : 값이 바뀔 때마다 fn 실행 (구독)',
            '//   set(value)    : 값을 통째로 교체',
            '//   update(fn)    : 이전 값을 받아 새 값 계산',
            '',
            '// 이 파일을 import 하는 모든 컴포넌트는',
            '// "같은" count 인스턴스를 공유한다 (전역 공유 상태)',
          ],
          highlight: [1, 2, 4, 5],
        },
      },
      {
        title: 'Step 2. $store — 컴포넌트에서 자동 구독 (해제도 자동)',
        desc: '컴포넌트 안에서는 스토어 이름 앞에 $ 만 붙이면 값을 바로 읽는다. $count 라고 쓰면 Svelte 가 알아서 subscribe 를 걸어 값을 꺼내 주고, 값이 바뀌면 화면을 다시 그린다. 더 중요한 건 구독 해제다 — 컴포넌트가 사라질 때 Svelte 가 자동으로 unsubscribe 를 호출해 준다. 수동으로 store.subscribe(...) 를 호출했다면 반환된 해제 함수를 직접 불러 정리해야 하는데, 이걸 빠뜨리면 메모리 누수와 유령 구독이 생긴다. $ 문법은 이 실수를 원천 차단한다.',
        storeVal: 0,
        subs: [{ name: 'Counter.svelte', val: 0 }],
        action: '$count 로 구독',
        api: 'subscribe',
        alert: { tone: 'good', text: '$count = 자동 subscribe + 자동 unsubscribe. 수동 subscribe 는 해제 함수 호출을 잊으면 누수.' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte',
          lines: [
            '<script>',
            '  import { count } from "./stores/count.js";',
            '',
            '  // $ 를 붙이면 자동 구독 + 자동 해제',
            '  // 컴포넌트가 사라질 때 Svelte 가 unsubscribe 호출',
            '',
            '  function increment() {',
            '    // update: 이전 값 n 을 받아 새 값 반환',
            '    count.update((n) => n + 1);',
            '  }',
            '<\/script>',
            '',
            '<!-- $count 로 현재 값을 바로 읽는다 -->',
            '<button onclick={increment}>클릭 수: {$count}<\/button>',
            '',
            '<!-- ❌ 수동 구독은 해제를 직접 해야 한다 (누수 위험)',
            '  const stop = count.subscribe((v) => console.log(v));',
            '  onDestroy(stop);   // ← 이걸 잊으면 유령 구독 -->',
          ],
          highlight: [1, 2, 4, 5, 8, 9, 11, 14],
        },
      },
      {
        title: 'Step 3. 여러 컴포넌트가 같은 스토어 공유 — 전역 상태',
        desc: '스토어의 진짜 힘은 여기서 나온다. 서로 멀리 떨어진 여러 컴포넌트가 같은 count 를 import 하면, 모두 하나의 값을 공유한다. 헤더가 count.update 로 값을 올리면, 그 순간 사이드바·본문·푸터 등 $count 를 구독한 모든 컴포넌트가 동시에 새 값으로 다시 그려진다. 부모·자식 관계도, props 전달도 필요 없다. 한 곳에서 .set/.update 하면 구독한 모두가 반응하는 이 "단일 진실 공급원(single source of truth)" 패턴이 전역 상태 관리의 핵심이다.',
        storeVal: 3,
        subs: [
          { name: 'Header.svelte', val: 3 },
          { name: 'Sidebar.svelte', val: 3 },
          { name: 'Footer.svelte', val: 3 },
        ],
        action: 'count.update(n => n + 1)',
        writer: 'Header.svelte',
        api: 'share',
        alert: { tone: 'good', text: '한 곳에서 .set/.update → $count 구독한 모든 컴포넌트가 동시에 갱신. 단일 진실 공급원.' },
        code: {
          lang: 'html',
          filename: 'App.svelte',
          lines: [
            '<!-- 서로 다른 컴포넌트가 같은 count 를 공유한다 -->',
            '<script>',
            '  import { count } from "./stores/count.js";',
            '  import Header from "./Header.svelte";',
            '  import Sidebar from "./Sidebar.svelte";',
            '<\/script>',
            '',
            '<Header />     <!-- 안에서 count.update 로 올림 -->',
            '<Sidebar />    <!-- $count 로 구독만 -->',
            '',
            '<p>App 도 같은 값: {$count}<\/p>',
            '',
            '<!-- Header 가 값을 올리면',
            '     Sidebar · App · Footer 모두 동시에 갱신된다.',
            '     props 전달도, 부모-자식 관계도 필요 없다. -->',
          ],
          highlight: [3, 8, 9, 11, 13, 14],
        },
      },
      {
        title: 'Step 4. 커스텀 스토어 — 로직을 스토어 안에 캡슐화',
        desc: '외부에서 아무나 count.set(999) 를 부를 수 있으면 상태 변경 규칙이 코드 곳곳에 흩어진다. 커스텀 스토어는 writable 을 함수로 감싸, subscribe 는 그대로 노출하되 set/update 대신 의미 있는 메서드(increment, reset 등)만 밖으로 내보낸다. 사용하는 쪽은 counter.increment() 처럼 "무엇을 하는지"만 부르면 되고, "어떻게 바꾸는지" 규칙은 스토어 안에 모인다. $counter 자동 구독도 그대로 동작한다 — subscribe 를 노출했기 때문이다. 상태 로직을 한 곳에 모으는 실무 표준 패턴이다.',
        storeVal: 1,
        subs: [
          { name: 'Nav.svelte', val: 1 },
          { name: 'Panel.svelte', val: 1 },
        ],
        action: 'counter.increment()',
        writer: 'Nav.svelte',
        api: 'custom',
        alert: { tone: 'info', text: 'writable 을 함수로 감싸 subscribe 는 노출, set/update 는 숨기고 increment/reset 만 공개. 규칙을 한 곳에.' },
        code: {
          lang: 'javascript',
          filename: 'stores/counter.js',
          lines: [
            'import { writable } from "svelte/store";',
            '',
            'function createCounter() {',
            '  // 내부에서만 set/update 를 쓴다',
            '  const { subscribe, set, update } = writable(0);',
            '',
            '  return {',
            '    subscribe,                      // 구독은 그대로 노출 ($counter 가능)',
            '    increment: () => update((n) => n + 1),',
            '    decrement: () => update((n) => n - 1),',
            '    reset: () => set(0),            // 규칙을 메서드로 캡슐화',
            '  };',
            '}',
            '',
            'export const counter = createCounter();',
            '',
            '// 사용: import { counter } from "./stores/counter.js";',
            '//   counter.increment();   // 의미가 드러난다',
            '//   {$counter}             // 자동 구독도 그대로',
          ],
          highlight: [3, 5, 7, 8, 9, 10, 11, 15],
        },
      },
      {
        title: 'Step 5. Svelte 5 $state 와의 관계 · 실무 함정',
        desc: 'Svelte 5 는 컴포넌트 안 상태를 $state 룬으로 다룬다. 그럼 스토어는 죽었을까? 아니다 — $state 는 컴포넌트(또는 모듈) 스코프의 반응형 변수이고, 스토어는 "구독 계약(subscribe)"을 가진 이식 가능한 값이다. 여러 컴포넌트가 공유하는 전역 상태, 그리고 스토어를 요구하는 라이브러리 연동에는 writable 이 여전히 명확하다. 함정 셋만 기억하자. (1) 수동 subscribe 후 해제 누락 → $ 문법으로 해결. (2) SSR 에서 모듈 최상위 writable 은 서버에서 요청 간 공유되어 사용자 데이터가 섞일 수 있다 → 요청별 컨텍스트 사용. (3) 초기값을 빠뜨리면 undefined 가 흘러 첫 렌더가 깨진다.',
        storeVal: 3,
        subs: [
          { name: 'A.svelte', val: 3 },
          { name: 'B.svelte', val: 3 },
        ],
        action: '전역 공유 = store, 지역 = $state',
        api: 'runes',
        alert: { tone: 'warn', text: '함정: ①수동 subscribe 해제 누락 ②SSR 전역 스토어 요청 간 공유 ③초기값 누락 → undefined. 다음 장은 파생(derived).' },
        code: {
          lang: 'javascript',
          filename: 'stores/notes.js',
          lines: [
            'import { writable } from "svelte/store";',
            '',
            '// ✅ 여러 컴포넌트가 공유하는 전역 상태 → 스토어가 적합',
            'export const user = writable(null);',
            '',
            '// ⚠️ 초기값을 반드시 준다 — 빼면 undefined 가 흘러',
            '//    첫 렌더에서 $user.name 접근이 터진다',
            '',
            '// ⚠️ SSR 주의: 모듈 최상위 writable 은 서버에서',
            '//    여러 요청이 "같은 인스턴스"를 공유 → 사용자 데이터 혼선',
            '//    SvelteKit 에서는 요청별 context 로 격리한다',
            '',
            '// 컴포넌트 안 지역 상태라면 Svelte 5 는 $state 가 간결:',
            '//   let n = $state(0);   // 이 컴포넌트만 쓰는 값',
            '// 전역/공유 · 라이브러리 연동 → writable 이 여전히 명확',
          ],
          highlight: [3, 4, 6, 9, 10, 13, 14, 15],
        },
      },
    ];

    const API_BADGE = {
      create:    { label: 'writable()', color: '#FF3E00' },
      subscribe: { label: '$store 구독', color: '#F59E0B' },
      share:     { label: '전역 공유', color: '#9A3412' },
      custom:    { label: '커스텀 스토어', color: '#6366F1' },
      runes:     { label: '$state 관계', color: '#059669' },
    };

    function StoreDiagram({ state, animKey }) {
      const subs = state.subs || [];
      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>공유 상태 흐름 (스토어 → 구독자)</span>
            <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{subs.length === 0 ? '구독자 없음' : subs.length + '개 구독'}</span>
          </div>
          <div className="p-4 bg-orange-50 flex flex-col items-center gap-1">
            <div className="w-full rounded-lg border-2 bg-white px-3 py-2 text-center pulse-glow" style={{ borderColor: '#9A3412' }} key={'s' + animKey}>
              <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>writable 스토어 (컴포넌트 밖 · stores/count.js)</div>
              <div className="text-[13px] font-mono mt-0.5" style={{ color: '#7C2D12' }}>count = {String(state.storeVal)}</div>
              {state.action && (
                <div className="mt-1 inline-block text-[10px] px-2 py-0.5 rounded font-mono" style={{ backgroundColor: '#FED7AA', color: '#9A3412' }}>{state.action}</div>
              )}
            </div>

            <div className="flex flex-col items-center text-[10px]" style={{ color: '#FF3E00' }}>
              <span className="text-lg leading-none">↓</span>
              <span>$count 로 구독 → 값 변경 시 동시 갱신</span>
            </div>

            {subs.length === 0 ? (
              <div className="w-full rounded-lg border-2 border-dashed bg-white/60 px-3 py-3 text-center text-[10px]" style={{ borderColor: '#FED7AA', color: '#9A3412' }}>
                아직 구독하는 컴포넌트가 없다 — import 하고 $count 를 쓰면 구독 시작
              </div>
            ) : (
              <div className="w-full grid gap-1.5" style={{ gridTemplateColumns: 'repeat(' + Math.min(subs.length, 3) + ', minmax(0, 1fr))' }}>
                {subs.map((c, i) => {
                  const isWriter = c.name === state.writer;
                  return (
                    <div key={c.name + animKey} className="rounded-lg border-2 bg-white px-2 py-2 text-center pop-in" style={{ borderColor: isWriter ? '#059669' : '#FF3E00' }}>
                      <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>{c.name}</div>
                      <div className="text-[12px] font-mono mt-0.5" style={{ color: '#7C2D12' }}>{'$count = ' + String(c.val)}</div>
                      {isWriter && (
                        <div className="mt-0.5 text-[9px] font-bold" style={{ color: '#059669' }}>✎ 값을 쓴 곳</div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    function MethodTable() {
      const rows = [
        { m: 'subscribe(fn)', d: '값이 바뀔 때마다 fn 실행 ($ 가 자동 처리)' },
        { m: 'set(value)', d: '값을 통째로 교체' },
        { m: 'update(fn)', d: '이전 값을 받아 새 값 계산' },
      ];
      return (
        <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#FED7AA', backgroundColor: '#FFF7ED' }}>
          <div className="text-[10px] font-bold mb-1" style={{ color: '#9A3412' }}>writable 의 3가지 메서드</div>
          {rows.map((r) => (
            <div key={r.m} className="flex gap-2 text-[10px] py-0.5" style={{ color: '#7C2D12' }}>
              <span className="font-mono font-bold w-24 shrink-0" style={{ color: '#9A3412' }}>{r.m}</span>
              <span>{r.d}</span>
            </div>
          ))}
        </div>
      );
    }

    function RunesCompare() {
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border p-2" style={{ borderColor: '#FF3E00', backgroundColor: '#FFF7ED' }}>
            <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>store (writable)</div>
            <div className="text-[10px] mt-1" style={{ color: '#7C2D12' }}>여러 컴포넌트 공유 · 전역</div>
            <div className="text-[10px]" style={{ color: '#7C2D12' }}>라이브러리 연동 · 구독 계약</div>
          </div>
          <div className="rounded-lg border p-2" style={{ borderColor: '#6EE7B7', backgroundColor: '#ECFDF5' }}>
            <div className="text-[10px] font-bold text-emerald-700">$state (Svelte 5)</div>
            <div className="text-[10px] text-emerald-900 mt-1">컴포넌트 지역 상태</div>
            <div className="text-[10px] text-emerald-900">간결한 반응형 변수</div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state, animKey }) {
      const badge = API_BADGE[state.api] || API_BADGE.create;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>공유 상태 — 스토어를 여러 곳이 구독</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <StoreDiagram state={state} animKey={animKey} />

          {(state.api === 'create' || state.api === 'subscribe') && <MethodTable />}

          {state.api === 'custom' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#C7D2FE', backgroundColor: '#EEF2FF' }}>
              <div className="text-[10px] font-bold text-indigo-700 mb-1">커스텀 스토어 — 밖으로 무엇을 내보내나</div>
              <div className="text-[10px] text-indigo-900">✅ subscribe · increment · reset (의미 있는 메서드)</div>
              <div className="text-[10px] text-indigo-900">🚫 set/update 는 숨김 → 변경 규칙을 한 곳에</div>
            </div>
          )}

          {state.api === 'runes' && <RunesCompare />}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1 text-white" style={{ backgroundColor: '#9A3412' }}>Part III. 상태 + 라우터 · III-1-1</div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>writable store — 공유 상태</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>컴포넌트 밖에서 상태를 공유하는 스토어</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} animKey={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                writable(초기값)은 컴포넌트 밖에 사는 공유 상태다. subscribe·set·update 세 메서드를 갖고, 컴포넌트에서는 $store 로 자동 구독(해제도 자동)한다. 여러 컴포넌트가 같은 스토어를 import 하면 한 곳의 .set/.update 가 구독한 모두를 동시에 갱신하는 단일 진실 공급원이 된다. 변경 규칙은 커스텀 스토어로 캡슐화하고, 전역·공유·라이브러리 연동은 스토어가, 컴포넌트 지역 상태는 Svelte 5의 $state 가 맡는다. 수동 구독 해제 누락·SSR 전역 공유·초기값 누락 세 함정만 피하자. 다음 장에서는 스토어에서 값을 계산하는 파생(derived)을 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'store', 'writable', 'subscribe', 'set', 'update', '$store', '전역 상태', '커스텀 스토어', '$state', 'SSR'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
