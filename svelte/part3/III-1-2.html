  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);

<body>
  <div id="root"></div>

  <!--
    Svelte III-1-2 — readable / derived store
    비유: "수도 배관" — 원본(writable) 물탱크가 차오르면, 파생(derived) 관을 타고 아래로 자동으로 흘러 계산된 값이 나온다.
    readable 은 밖(수원지)에서만 물이 들어오는 관 — 소비자는 잠그거나 채울 수 없고 받아 쓰기만 한다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. readable(초기값, start) — 외부 소스를 읽기 전용 스토어로',
        desc: 'readable(초기값, start)는 소비자가 값을 바꿀 수 없는 읽기 전용 스토어를 만든다. 두 번째 인자 start(set)는 첫 구독자가 생길 때 실행되고, 마지막 구독자가 사라질 때 실행되는 정리 함수를 반환한다. 타이머·웹소켓·브라우저 이벤트처럼 "밖에서 값이 들어오는" 소스를 감쌀 때 쓴다. 구독자가 하나도 없으면 start 자체가 실행되지 않아 자원을 낭비하지 않는다(지연 시작). 정리 함수에서 clearInterval 등을 반드시 호출해 누수를 막는다.',
        api: 'readable',
        external: true,
        sources: [],
        derived: null,
        alert: { tone: 'info', text: 'readable = 밖에서만 값이 들어오는 읽기 전용 스토어. start 의 반환값(cleanup)에서 타이머·소켓을 꼭 정리한다.' },
        code: {
          lang: 'javascript',
          filename: 'stores/time.js',
          lines: [
            '// stores/time.js — 외부 타이머를 읽기 전용 스토어로 감싼다',
            'import { readable } from "svelte/store";',
            '',
            '// readable(초기값, start)',
            '// start(set): 첫 구독자가 생길 때 실행된다',
            'export const time = readable(new Date(), (set) => {',
            '  const id = setInterval(() => set(new Date()), 1000);',
            '',
            '  // 반환한 정리 함수: 마지막 구독자가 사라질 때 실행',
            '  return () => clearInterval(id);',
            '});',
            '',
            '// 소비자는 time 값을 직접 바꿀 수 없다 (읽기 전용)',
            '// 컴포넌트에서 $time 으로 구독하면 1초마다 자동 갱신',
          ],
          highlight: [1, 3, 4, 5, 6, 8, 9, 10],
        },
      },
      {
        title: 'Step 2. derived(store, callback) — 하나의 스토어에서 값 파생',
        desc: 'derived(store, $value => ...)는 다른 스토어의 값이 바뀔 때마다 콜백을 다시 실행해 새 값을 만든다. 원본을 직접 수정하지 않고 "읽어서 변환한 결과"만 노출하므로 데이터 흐름이 한 방향으로 유지된다. 예를 들어 가격 스토어에서 세금 포함 가격을 파생하면, 원본 가격이 바뀔 때 자동으로 다시 계산된다. 파생 스토어도 읽기 전용이라 소비자가 실수로 바꿀 수 없다. 콜백은 순수해야 한다 — 여기서 API 호출이나 다른 상태 변경 같은 부수효과를 넣으면 언제 몇 번 실행될지 예측할 수 없어 버그가 된다.',
        api: 'single',
        external: false,
        sources: [{ id: 'price', label: 'price', value: '1000', color: '#9A3412' }],
        derived: { label: 'priceWithTax', expr: '$price * 1.1', value: '1100' },
        alert: { tone: 'info', text: '원본은 writable, 파생 결과는 읽기 전용 derived. 콜백은 순수 함수로 — 부수효과(fetch·상태변경) 절대 금지.' },
        code: {
          lang: 'javascript',
          filename: 'stores/price.js',
          lines: [
            '// stores/price.js — 하나의 스토어에서 값 파생',
            'import { writable, derived } from "svelte/store";',
            '',
            '// 원본: 소비자가 바꿀 수 있는 writable',
            'export const price = writable(1000);',
            '',
            '// derived(store, callback): price 가 바뀔 때마다 재계산',
            'export const priceWithTax = derived(',
            '  price,',
            '  ($price) => Math.round($price * 1.1)  // 세금 10% 포함',
            ');',
            '',
            '// 파생 스토어도 읽기 전용 — 소비자가 못 바꾼다',
            '// ⚠️ 콜백은 순수하게: 여기서 fetch·상태변경 같은 부수효과 금지',
          ],
          highlight: [3, 4, 6, 7, 8, 9, 10],
        },
      },
      {
        title: 'Step 3. derived([a, b], ...) — 여러 스토어 조합',
        desc: 'derived([a, b], ([$a, $b]) => ...)는 여러 스토어를 배열로 묶어 하나의 값을 만든다. 장바구니처럼 단가와 수량이 각각 다른 스토어일 때, 둘 중 아무거나 바뀌면 합계가 자동으로 재계산된다. 어느 원본이 바뀌든 콜백이 다시 돌기 때문에 두 값을 손으로 "동기화"하는 코드를 쓸 필요가 없다. 배열 구독 순서와 콜백 인자 순서가 반드시 일치해야 하니 주의한다. 파생을 또 파생하는 체인도 가능해서, 합계 → 배송비 포함 총액처럼 단계적으로 값을 쌓을 수 있다.',
        api: 'multi',
        external: false,
        sources: [
          { id: 'unit', label: 'unitPrice', value: '3000', color: '#9A3412' },
          { id: 'qty', label: 'quantity', value: '2', color: '#6366F1' },
        ],
        derived: { label: 'total', expr: '$unitPrice * $quantity', value: '6000' },
        alert: { tone: 'good', text: '배열 구독 순서 = 콜백 인자 순서. 아무 원본이나 바뀌면 재계산 — 수동 동기화 코드가 필요 없다.' },
        code: {
          lang: 'javascript',
          filename: 'stores/cart.js',
          lines: [
            '// stores/cart.js — 여러 스토어를 조합해 파생',
            'import { writable, derived } from "svelte/store";',
            '',
            'export const unitPrice = writable(3000);',
            'export const quantity  = writable(2);',
            '',
            '// derived([a, b], ([$a, $b]) => ...)',
            '// 배열 구독 순서 = 콜백 인자 순서 (반드시 일치)',
            'export const total = derived(',
            '  [unitPrice, quantity],',
            '  ([$unitPrice, $quantity]) => $unitPrice * $quantity',
            ');',
            '',
            '// 파생을 또 파생: 체인으로 단계적 계산',
            'export const grandTotal = derived(',
            '  total,',
            '  ($total) => $total + 2500   // 배송비 포함',
            ');',
          ],
          highlight: [6, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17],
        },
      },
      {
        title: 'Step 4. 비동기 파생 — ($value, set) 와 cleanup',
        desc: 'derived(store, ($value, set) => {...})처럼 콜백이 set을 두 번째 인자로 받으면 비동기 파생이 된다. 원본이 바뀔 때 fetch 같은 비동기 작업을 시작하고, 결과가 도착하면 set(result)로 값을 넣는다. 반환값 대신 set을 쓰므로 로딩 표시용 초기값을 세 번째 인자로 지정할 수 있다. 콜백이 반환하는 함수는 다음 재실행 전이나 구독 해제 시 호출돼, 진행 중이던 요청을 취소(cleanup)하는 데 쓴다. 이 정리를 빼먹으면 값이 빠르게 바뀔 때 이전 응답이 나중에 도착해 최신 값을 덮어쓰는 경쟁 상태(race condition)가 생긴다.',
        api: 'async',
        external: false,
        sources: [{ id: 'userId', label: 'userId', value: '7', color: '#9A3412' }],
        derived: { label: 'profile', expr: 'await fetch(/users/$userId)', value: 'loading... → { name }', async: true },
        alert: { tone: 'warn', text: '비동기 파생은 set(result)로 값 주입 + 초기값은 세 번째 인자. 반환한 cleanup 으로 이전 요청을 취소해 race condition 을 막는다.' },
        code: {
          lang: 'javascript',
          filename: 'stores/profile.js',
          lines: [
            '// stores/profile.js — 비동기 파생 (set + cleanup)',
            'import { writable, derived } from "svelte/store";',
            '',
            'export const userId = writable(7);',
            '',
            '// 콜백이 ($value, set) 를 받으면 비동기 파생이 된다',
            'export const profile = derived(',
            '  userId,',
            '  ($userId, set) => {',
            '    let canceled = false;',
            '    fetch(`/api/users/${$userId}`)',
            '      .then((r) => r.json())',
            '      .then((data) => { if (!canceled) set(data); });',
            '',
            '    // 정리 함수: 다음 재실행·구독해제 시 이전 요청 취소',
            '    return () => { canceled = true; };',
            '  },',
            '  { name: "loading..." }   // 세 번째 인자 = 초기값',
            ');',
          ],
          highlight: [5, 6, 8, 9, 10, 11, 12, 14, 15, 17],
        },
      },
      {
        title: 'Step 5. get() 일회성 읽기 + 선택 기준 · 실무 함정',
        desc: 'get(store)는 구독하지 않고 스토어의 현재 값을 딱 한 번 읽는다. 이벤트 핸들러 안에서 "지금 값"만 필요할 때 편하지만, 반응형이 아니므로 렌더링 로직에서 남용하면 값이 바뀌어도 갱신을 놓친다. 선택 기준은 분명하다 — writable은 소비자가 바꿔야 할 상태에, readable은 밖에서만 들어오는 소스에, derived는 다른 값에서 계산되는 값에 쓴다. 무거운 파생(대량 정렬·필터)은 원본이 자주 바뀌면 성능을 갉아먹으니 변경 빈도를 먼저 확인한다. derived 콜백에서 부수효과 금지, 비동기·구독은 반드시 cleanup — 이 두 가지가 실무 사고의 대부분이다.',
        api: 'get',
        external: false,
        sources: [{ id: 'cart', label: 'cart', value: '[ 3 items ]', color: '#9A3412' }],
        derived: { label: 'itemCount', expr: '$cart.length', value: '3' },
        snapshot: 'get(cart) → [ 3 items ]',
        alert: { tone: 'good', text: 'get()은 렌더링 밖(핸들러)에서 스냅샷 읽기용. 화면 표시는 $store 구독으로. 무거운 파생은 원본 변경 빈도부터 확인.' },
        code: {
          lang: 'html',
          filename: 'Cart.svelte',
          lines: [
            '<!-- Cart.svelte — get() 일회성 읽기 + 선택 기준 -->',
            '<script>',
            '  import { get } from "svelte/store";',
            '  import { cart } from "./stores/cart.js";',
            '',
            '  // 구독 없이 "지금 값" 만 한 번 읽는다',
            '  function checkout() {',
            '    const items = get(cart);        // 스냅샷',
            '    if (items.length === 0) return;',
            '    submitOrder(items);',
            '  }',
            '<\/script>',
            '',
            '<!-- 렌더링에는 get() 대신 $cart 로 구독 (반응형 유지) -->',
            '<p>담긴 상품: {$cart.length}개</p>',
            '<button onclick={checkout}>주문</button>',
            '',
            '<!-- 언제 무엇을?',
            '  · writable : 소비자가 바꾸는 상태',
            '  · readable : 밖에서만 들어오는 소스(타이머·소켓)',
            '  · derived  : 다른 값에서 계산되는 값 -->',
          ],
          highlight: [2, 6, 7, 8, 9, 10, 11, 14, 15],
        },
      },
    ];

    const API_BADGE = {
      readable: { label: 'readable', color: '#FF3E00' },
      single:   { label: 'derived · 단일', color: '#F59E0B' },
      multi:    { label: 'derived · 다중', color: '#6366F1' },
      async:    { label: 'derived · 비동기', color: '#9A3412' },
      get:      { label: 'get() · 선택', color: '#059669' },
    };

    // readable 시각화용 실시간 시계 — start/cleanup 개념을 실제 타이머로 보여준다
    function ReadableSource() {
      const [now, setNow] = useState(new Date());
      const [subscribed, setSubscribed] = useState(true);

      useEffect(() => {
        if (!subscribed) return;
        // 첫 구독자 → start 실행 (setInterval)
        const id = setInterval(() => setNow(new Date()), 1000);
        // 마지막 구독자 → cleanup (clearInterval)
        return () => clearInterval(id);
      }, [subscribed]);

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>외부 소스 → readable 스토어</span>
            <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">읽기 전용</span>
          </div>
          <div className="p-4 bg-orange-50 flex flex-col items-center gap-1">
            <div className="text-[10px]" style={{ color: '#7C2D12' }}>외부 소스 (setInterval · 밖에서 값 주입)</div>
            <span className="text-lg leading-none" style={{ color: '#FF3E00' }}>↓ set(new Date())</span>
            <div className="w-full rounded-lg border-2 bg-white px-3 py-3 text-center pulse-glow" style={{ borderColor: '#9A3412' }} key={subscribed ? 'on' : 'off'}>
              <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>readable store · $time</div>
              <div className="text-2xl font-mono mt-1" style={{ color: '#7C2D12' }}>
                {subscribed ? hh + ':' + mm + ':' + ss : '⏸ 정지됨'}
              </div>
            </div>
            <button
              onClick={() => setSubscribed((s) => !s)}
              className="mt-2 text-[10px] px-2 py-1 rounded border bg-white"
              style={{ borderColor: '#FF3E00', color: '#9A3412' }}
            >
              {subscribed ? '구독 해제 (cleanup 실행)' : '다시 구독 (start 실행)'}
            </button>
            <div className="text-[10px] text-center mt-1" style={{ color: '#9A3412' }}>
              구독자가 0이 되면 start 의 cleanup 이 실행돼 타이머가 멈춘다
            </div>
          </div>
        </div>
      );
    }

    // derived 그래프 — 원본(writable)이 바뀌면 파생 노드가 재계산되어 전파된다
    function DerivedGraph({ state, animKey }) {
      const d = state.derived;
      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>파생 그래프 (원본 → derived 자동 재계산)</span>
            <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{state.sources.length > 1 ? '다중 구독' : '단일 구독'}</span>
          </div>
          <div className="p-4 bg-orange-50 flex flex-col items-center gap-1">
            <div className="w-full flex gap-2 justify-center">
              {state.sources.map((s) => (
                <div key={s.id} className="flex-1 rounded-lg border-2 bg-white px-2 py-2 text-center pulse-glow" style={{ borderColor: s.color }}>
                  <div className="text-[10px] font-bold" style={{ color: s.color }}>writable · {s.label}</div>
                  <div className="text-sm font-mono mt-0.5" style={{ color: '#7C2D12' }}>{s.value}</div>
                </div>
              ))}
            </div>

            <div className="flex flex-col items-center text-[10px]" style={{ color: '#FF3E00' }}>
              <span className="text-lg leading-none">↓</span>
              <span className="font-mono">{d.expr}</span>
              <span>원본이 바뀌면 콜백 재실행</span>
            </div>

            <div className="w-full rounded-lg border-2 bg-white px-3 py-2 text-center flow-anim" style={{ borderColor: '#FF3E00' }} key={'d' + animKey}>
              <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>derived · {d.label} (읽기 전용)</div>
              <div className="text-base font-mono mt-0.5" style={{ color: '#7C2D12' }}>{d.value}</div>
              {d.async && (
                <div className="text-[10px] mt-1" style={{ color: '#92400E' }}>set()으로 주입 · cleanup 으로 이전 요청 취소</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state, animKey }) {
      const badge = API_BADGE[state.api] || API_BADGE.readable;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>스토어 흐름 — 원본에서 파생으로</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          {state.external ? (
            <ReadableSource />
          ) : (
            <DerivedGraph state={state} animKey={animKey} />
          )}

          {state.api === 'multi' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#C7D2FE', backgroundColor: '#EEF2FF' }}>
              <div className="text-[10px] font-bold text-indigo-700 mb-1">체인 파생 (derived → derived)</div>
              <div className="text-[10px] text-indigo-900 font-mono">total(6000) → grandTotal($total + 2500) = 8500</div>
            </div>
          )}

          {state.api === 'async' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
              <div className="text-[10px] font-bold text-amber-700 mb-1">경쟁 상태(race condition) 주의</div>
              <div className="text-[10px] text-amber-900">✅ cleanup 에서 이전 요청 취소 → 최신 응답만 반영</div>
              <div className="text-[10px] text-amber-900">❌ 미취소 시 느린 이전 응답이 새 값을 덮어씀</div>
            </div>
          )}

          {state.api === 'get' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#6EE7B7', backgroundColor: '#ECFDF5' }}>
              <div className="text-[10px] font-bold text-emerald-700 mb-1">get() — 구독 없이 스냅샷 1회</div>
              <div className="text-[10px] text-emerald-900 font-mono">{state.snapshot}</div>
              <div className="text-[10px] text-emerald-900">화면 표시는 $store 구독으로 (반응형 유지)</div>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1 text-white" style={{ backgroundColor: '#9A3412' }}>Part III. 상태 + 라우터 · III-1-2</div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>readable / derived store</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>읽기 전용 스토어와 다른 스토어에서 파생되는 값</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} animKey={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                readable은 타이머·소켓처럼 밖에서만 값이 들어오는 읽기 전용 스토어이고, start 의 cleanup 으로 자원을 정리한다. derived는 하나 또는 여러 스토어에서 값을 파생하며 원본이 바뀌면 자동으로 재계산된다. 비동기 파생은 ($value, set) 형태로 값을 주입하고 cleanup 으로 이전 요청을 취소해 경쟁 상태를 막는다. 렌더링 밖에서 지금 값만 필요하면 get()으로 스냅샷을 읽는다. writable은 바꾸는 상태, readable은 외부 소스, derived는 계산된 값 — 이 선택 기준과 "콜백 부수효과 금지 · cleanup 필수"만 지키면 실무 사고의 대부분을 피한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'store', 'readable', 'derived', 'writable', 'get', '파생', '비동기', 'cleanup', '경쟁상태'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-1.html" className="underline hover:no-underline">다음: III-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
