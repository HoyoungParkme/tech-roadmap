  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Svelte I-1-1 — 첫 컴포넌트: .svelte SFC 구조
    비유: "삼단 도시락" — 한 통(파일) 안에 밥(script 로직) · 반찬(markup) · 뚜껑(scoped style)이 칸칸이 담긴다.
    컴파일러가 이 도시락을 열어 가장 빠른 JS 한 접시로 미리 차려 놓는다(런타임 가상 DOM 없음).
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. .svelte 단일 파일 컴포넌트 — 한 파일에 세 영역',
        desc: '.svelte 파일 하나가 컴포넌트 하나다. 그 안에 로직을 담는 script, 화면을 그리는 markup(HTML), 그리고 그 컴포넌트에만 적용되는 scoped style 세 영역이 함께 산다. 왜 한 파일에 모을까? 버튼 하나를 고치려고 .js·.html·.css 세 파일을 오가는 대신, 관련된 것을 한곳에서 보면 맥락이 끊기지 않기 때문이다. style은 기본으로 이 컴포넌트에만 격리(scoped)되어 다른 곳의 .box 클래스와 충돌하지 않는다. React의 JSX가 로직 안에 마크업을 넣는다면, Svelte는 HTML 파일에 로직을 얹는 느낌에 가깝다.',
        region: 'all',
        count: 0,
        popped: false,
        api: 'structure',
        alert: { tone: 'info', text: '.svelte 1개 = 컴포넌트 1개. script(로직) + markup(HTML) + style(scoped) 세 영역이 한 파일에.' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte',
          lines: [
            '<!-- 영역 1) script: 컴포넌트 로직 -->',
            '<script>',
            '  let count = 0;',
            '<\/script>',
            '',
            '<!-- 영역 2) markup: 화면 -->',
            '<button on:click={() => count += 1}>',
            '  클릭 수: {count}',
            '</button>',
            '',
            '<!-- 영역 3) style: 이 컴포넌트에만 적용(scoped) -->',
            '<style>',
            '  button { font-weight: 700; color: #FF3E00; }',
            '</style>',
          ],
          highlight: [1, 2, 3, 4, 6, 11, 12, 13, 14],
        },
      },
      {
        title: 'Step 2. 컴파일러 프레임워크 — 가상 DOM 없이 최적 JS로',
        desc: 'Svelte는 라이브러리가 아니라 컴파일러다. React·Vue가 브라우저에서 런타임 라이브러리를 싣고 가상 DOM으로 차이를 계산한다면, Svelte는 빌드 시점에 .svelte를 분석해 "이 값이 바뀌면 이 DOM 조각만 갱신하라"는 정확한 JS 코드를 미리 생성한다. 결과적으로 런타임 프레임워크 코드가 번들에 거의 들어가지 않아 번들이 작고, 가상 DOM diff 비용이 없어 빠르다. 대가는 빌드 단계가 필수라는 점이지만, 요즘은 Vite가 이를 자연스럽게 처리한다.',
        region: 'compile',
        count: 0,
        popped: false,
        api: 'compile',
        alert: { tone: 'good', text: '가상 DOM 없음 → 런타임 코드 최소 → 작은 번들·빠른 갱신. 대신 빌드(컴파일) 단계가 필수.' },
        code: {
          lang: 'html',
          filename: 'compile-flow',
          lines: [
            '<!-- 개발자가 쓰는 것: Counter.svelte -->',
            '<script>',
            '  let count = 0;',
            '<\/script>',
            '<button on:click={() => count += 1}>{count}</button>',
            '',
            '<!-- 컴파일러가 만들어내는 것(개념):',
            '  · 딱 필요한 DOM 생성 코드',
            '  · count 변경 시 그 text 노드만 교체하는 코드',
            '  · 가상 DOM diff 없음, 런타임 프레임워크 최소',
            '  → 브라우저는 순수 JS 한 조각만 실행 -->',
            '',
            '<!-- React/Vue: 런타임 + 가상 DOM diff 를 매번 -->',
            '<!-- Svelte  : 빌드 때 최적 JS 를 미리 만들어 둠 -->',
          ],
          highlight: [1, 2, 3, 4, 5, 7, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 3. 마크업 보간 — {표현식}으로 값을 화면에 그린다',
        desc: 'markup 안에서 중괄호를 쓰면 script의 값과 자바스크립트 표현식을 화면에 꽂을 수 있다. 이를 보간(interpolation)이라 부른다. 변수뿐 아니라 count * 2 같은 계산식, 삼항 연산자, 함수 호출 결과도 넣을 수 있다. React의 JSX와 문법이 비슷해 익숙할 것이다. 핵심은 이 값이 반응형이라는 점 — 뒤 단계에서 count가 바뀌면 Svelte가 이 자리만 알아서 다시 그린다. 지금은 "값을 화면에 어떻게 넣는가"만 기억하자.',
        region: 'markup',
        count: 3,
        popped: false,
        api: 'markup',
        alert: { tone: 'info', text: '중괄호 표현식으로 값을 화면에 보간. 변수·계산식·삼항·함수 호출 결과 모두 가능.' },
        code: {
          lang: 'html',
          filename: 'Interpolation.svelte',
          lines: [
            '<script>',
            '  let count = 3;',
            '  let user = "주니어";',
            '<\/script>',
            '',
            '<!-- 변수 그대로 -->',
            '<p>{user}님, 현재 값은 {count}</p>',
            '',
            '<!-- 계산식도 표현식이면 OK -->',
            '<p>두 배: {count * 2}</p>',
            '',
            '<!-- 삼항 연산자로 조건부 텍스트 -->',
            '<p>{count > 0 ? "양수" : "0 이하"}</p>',
          ],
          highlight: [1, 2, 3, 4, 7, 10, 13],
        },
      },
      {
        title: 'Step 4. 이벤트와 상태 — on:click 으로 첫 카운터',
        desc: 'on:click 으로 DOM 이벤트에 핸들러를 연결한다. 핸들러 안에서 script의 변수에 재할당(count += 1)만 하면, Svelte 컴파일러가 "이 변수가 바뀌면 화면의 이 자리를 갱신하라"는 코드를 이미 심어두었기 때문에 화면이 저절로 갱신된다. React처럼 setState를 부르거나 상태 훅을 쓸 필요가 없다 — 그냥 평범한 변수 할당이 곧 반응성이다. 이 "할당 = 갱신" 규칙이 Svelte를 처음 쓸 때 가장 편하게 느껴지는 지점이다. 아래 오른쪽 버튼을 누르면 count가 실제로 오른다.',
        region: 'event',
        count: 1,
        popped: true,
        api: 'event',
        alert: { tone: 'good', text: '이벤트 핸들러에서 변수에 재할당만 하면 화면이 갱신된다. setState 불필요 — "할당 = 반응성".' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte',
          lines: [
            '<script>',
            '  let count = 0;',
            '',
            '  function increment() {',
            '    count += 1;   // 재할당만으로 화면 갱신',
            '  }',
            '<\/script>',
            '',
            '<!-- on:click 으로 이벤트 연결 -->',
            '<button on:click={increment}>',
            '  클릭 수: {count}',
            '</button>',
            '',
            '<!-- 인라인 핸들러도 가능 -->',
            '<!-- <button on:click={() => count += 1}>+1</button> -->',
          ],
          highlight: [1, 2, 4, 5, 6, 7, 10, 11, 12],
        },
      },
      {
        title: 'Step 5. 왜 Svelte인가 + 실무 함정',
        desc: '왜 Svelte를 고를까? 보일러플레이트가 적어 같은 기능을 더 짧은 코드로 쓰고, 런타임이 없어 번들이 작으며, "할당 = 반응성"이라 학습 곡선이 완만하다. React/Vue와의 본질적 차이는 런타임이 아니라 컴파일 타임 프레임워크라는 점이다. 실무 함정도 미리 알아두자 — 컴포넌트 파일과 import 이름은 대문자로 시작해야 컴포넌트로 인식된다(Counter, not counter). script 태그는 파일 최상단에 두는 것이 관례다. 그리고 반응성에는 규칙이 있다: 배열/객체는 push만으로는 갱신 신호가 약해 재할당이 필요할 수 있는데, 이는 다음 장에서 다룬다.',
        region: 'summary',
        count: 1,
        popped: false,
        api: 'summary',
        alert: { tone: 'warn', text: '함정: 컴포넌트명은 대문자(Counter). script는 최상단. 배열/객체 반응성 규칙은 다음 장에서.' },
        code: {
          lang: 'html',
          filename: 'best-practice.svelte',
          lines: [
            '<!-- ✅ 컴포넌트 파일·import 는 대문자로 -->',
            '<script>',
            '  import Counter from "./Counter.svelte";  // O',
            '  // import counter from "./counter.svelte"; ❌ 소문자',
            '<\/script>',
            '',
            '<Counter />',
            '',
            '<!-- ✅ script 는 파일 최상단 관례 -->',
            '<!-- ⚠️ 반응성 규칙 예고:',
            '  let list = [1, 2];',
            '  list.push(3);        // 갱신 신호 약함',
            '  list = [...list, 3]; // 재할당이 안전(다음 장)',
            '-->',
          ],
          highlight: [1, 2, 3, 4, 5, 7, 9, 10, 11, 12, 13],
        },
      },
    ];

    const API_BADGE = {
      structure: { label: 'SFC 구조', color: '#FF3E00' },
      compile:   { label: '컴파일러', color: '#9A3412' },
      markup:    { label: '보간 {}', color: '#6366F1' },
      event:     { label: '이벤트·상태', color: '#059669' },
      summary:   { label: '정리·함정', color: '#F59E0B' },
    };

    const REGIONS = [
      { key: 'script', label: 'script', sub: '로직', color: '#FF3E00' },
      { key: 'markup', label: 'markup', sub: '화면(HTML)', color: '#6366F1' },
      { key: 'style', label: 'style', sub: 'scoped CSS', color: '#059669' },
    ];

    function SfcBox({ state }) {
      // 현재 단계에서 강조할 영역
      const activeMap = {
        all: ['script', 'markup', 'style'],
        compile: ['script', 'markup', 'style'],
        markup: ['markup'],
        event: ['script', 'markup'],
        summary: ['script'],
      };
      const active = new Set(activeMap[state.region] || []);
      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>Counter.svelte — 한 파일, 세 영역</span>
          </div>
          <div className="p-3 bg-orange-50 flex flex-col gap-2">
            {REGIONS.map((r) => {
              const on = active.has(r.key);
              return (
                <div
                  key={r.key}
                  className={`rounded-lg border-2 bg-white px-3 py-2 flex items-center gap-2 ${on ? 'pulse-glow' : ''}`}
                  style={{ borderColor: on ? r.color : '#FED7AA', opacity: on ? 1 : 0.45 }}
                >
                  <span className="text-[11px] font-mono font-bold px-1.5 py-0.5 rounded text-white" style={{ backgroundColor: r.color }}>{r.label}</span>
                  <span className="text-[11px]" style={{ color: '#7C2D12' }}>{r.sub}</span>
                  {on && <span className="ml-auto text-[10px]" style={{ color: r.color }}>● 활성</span>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function CompilePane({ animKey }) {
      return (
        <div className="mt-3 flex items-center gap-2" key={'cmp' + animKey}>
          <div className="flex-1 rounded-lg border-2 bg-white px-2 py-2 text-center" style={{ borderColor: '#FED7AA' }}>
            <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>.svelte 소스</div>
            <div className="text-[10px]" style={{ color: '#7C2D12' }}>script·markup·style</div>
          </div>
          <div className="flex flex-col items-center text-[10px]" style={{ color: '#FF3E00' }}>
            <span className="font-mono">compile</span>
            <span className="text-lg leading-none">→</span>
            <span>빌드 시점</span>
          </div>
          <div className="flex-1 rounded-lg border-2 bg-white px-2 py-2 text-center flow-anim" style={{ borderColor: '#FF3E00' }}>
            <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>최적 JS</div>
            <div className="text-[10px]" style={{ color: '#7C2D12' }}>가상 DOM 없음</div>
          </div>
        </div>
      );
    }

    function RenderedCounter({ state, animKey }) {
      const popped = state.popped;
      return (
        <div className="mt-3 rounded-lg border p-3" style={{ borderColor: '#FED7AA', backgroundColor: '#FFFBEB' }}>
          <div className="text-[10px] font-bold mb-2" style={{ color: '#9A3412' }}>브라우저에 렌더된 컴포넌트</div>
          <div className="flex items-center gap-3">
            <span
              className="inline-flex items-center justify-center rounded-lg border-2 bg-white font-bold font-mono px-3 py-1.5 text-sm"
              style={{ borderColor: '#FF3E00', color: '#FF3E00' }}
            >
              클릭 수:{' '}
              <span key={'n' + animKey} className={popped ? 'pop-count ml-1' : 'ml-1'}>{state.count}</span>
            </span>
            <span className="text-[10px]" style={{ color: '#7C2D12' }}>
              {state.region === 'event' ? 'on:click → count += 1 → 이 자리만 갱신' : 'markup {count} 자리에 값이 보간됨'}
            </span>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state, animKey }) {
      const badge = API_BADGE[state.api] || API_BADGE.structure;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>.svelte 컴포넌트 — 소스에서 화면까지</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <SfcBox state={state} />

          {state.region === 'compile' && <CompilePane animKey={animKey} />}

          {(state.region === 'markup' || state.region === 'event' || state.region === 'summary') && (
            <RenderedCounter state={state} animKey={animKey} />
          )}

          {state.region === 'summary' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
              <div className="text-[10px] font-bold text-amber-700 mb-1">왜 Svelte?</div>
              <div className="text-[10px] text-amber-900">✅ 적은 보일러플레이트 · 작은 번들 · 완만한 학습 곡선</div>
              <div className="text-[10px] text-amber-900">✅ 런타임이 아닌 컴파일 타임 프레임워크</div>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1 text-white" style={{ backgroundColor: '#9A3412' }}>Part I. 기초 · I-1-1</div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>Svelte 첫 컴포넌트 — .svelte SFC 구조</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>script·markup·style 한 파일 컴포넌트, 컴파일러 프레임워크의 시작</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} animKey={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                .svelte 파일 하나가 컴포넌트 하나이며, 그 안에 script(로직)·markup(화면)·scoped style이 함께 산다. Svelte는 런타임 라이브러리가 아니라 컴파일러라서 빌드 시점에 최적 JS를 생성하고, 가상 DOM 없이 필요한 DOM 조각만 갱신한다. 마크업의 중괄호 표현식으로 값을 보간하고, on:click 핸들러에서 변수에 재할당만 하면 화면이 갱신된다(할당 = 반응성). 함정으로 컴포넌트명은 대문자, script는 최상단을 기억하자. 다음 장에서 배열·객체의 반응성 규칙을 이어서 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'SFC', '.svelte', 'script', 'markup', 'scoped style', '컴파일러', '가상DOM 없음', '보간', 'on:click', '반응성', '카운터'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
