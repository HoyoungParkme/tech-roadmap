  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    Svelte I-2-2 — scoped style + class: 디렉티브
    비유: "각자 방에 페인트칠" — 스타일은 그 컴포넌트 방 안에서만 유효하고,
          class: 디렉티브로 조명 스위치처럼 켜고 끈다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. style 블록은 자동 scoped — 밖으로 새지 않는다',
        desc: 'Svelte의 style 블록은 아무 설정 없이도 그 컴포넌트에만 적용된다. 컴파일러가 컴포넌트마다 고유 해시 클래스(예: svelte-abc123)를 만들어 셀렉터와 요소 양쪽에 붙이기 때문이다. 그래서 Card 컴포넌트에서 쓴 p 셀렉터가 다른 컴포넌트의 p를 건드리지 않는다. 전역 CSS 충돌(같은 클래스명이 서로 덮어쓰는 사고)이 구조적으로 사라진다. 팀 규모가 커질수록 이 캡슐화가 유지보수 비용을 크게 줄인다.',
        api: 'scoped',
        dom: { tag: 'p', base: [], hashed: 'svelte-a1b2c3', note: 'p 셀렉터 → p.svelte-a1b2c3 로 자동 변환' },
        css: [
          { sel: 'p.svelte-a1b2c3', on: true, label: 'color 지정 (이 컴포넌트만)' },
        ],
        alert: { tone: 'good', text: 'style 블록은 기본이 scoped. 컴파일러가 해시 클래스로 격리 → 전역 CSS 충돌 원천 차단.' },
        code: {
          lang: 'html',
          filename: 'Card.svelte',
          lines: [
            '<script>',
            '  let title = "결제 완료";',
            '<\/script>',
            '',
            '<div class="card">',
            '  <p class="msg">{title}</p>',
            '<\/div>',
            '',
            '<!-- 이 style 은 자동으로 scoped 된다 -->',
            '<style>',
            '  .card {',
            '    padding: 1rem;',
            '    border-radius: 8px;',
            '    background: #FFF7ED;',
            '  }',
            '  /* 아래 p 는 오직 이 컴포넌트의 p 에만 적용 */',

            '    font-weight: bold;',
            '  }',

            '-->',
          ],

        },
      },
      {
        title: 'Step 2. :global() — 캡슐화를 의도적으로 뚫는 탈출구',
        desc: 'scoped가 기본이라 자식 컴포넌트나 라이브러리가 렌더한 마크업, 서버에서 온 HTML은 스타일이 닿지 않는다. 이때 :global(selector)로 특정 셀렉터만 전역으로 내보낸다. 예를 들어 마크다운 렌더러가 만든 a 태그를 꾸미려면 :global(.prose a)처럼 쓴다. 다만 :global은 격리를 깨는 만큼 남용하면 다시 전역 CSS 지옥으로 돌아간다. 꼭 필요한 셀렉터만, 가급적 부모 scoped 클래스 아래에 한정해서 쓰는 것이 실무 규칙이다.',

          { sel: 'a  (scoped)', on: false, label: 'scoped a 는 외부 HTML 에 안 닿음' },
        ],

        code: {
          lang: 'html',
          filename: 'Article.svelte',
          lines: [
            '<script>',
            '  export let html;  // 서버가 준 마크다운 HTML',

      {

        api: 'classdir',
        toggle: true,
        dom: { tag: 'button', base: ['tab'], hashed: 'svelte-a1b2c3', note: 'isActive 값에 따라 active 클래스 토글' },
        css: [
          { sel: '.tab.svelte-a1b2c3', on: true, label: '기본 스타일 (항상)' },
          { sel: '.active.svelte-a1b2c3', on: 'byToggle', label: 'isActive=true 일 때만' },
        ],
        alert: { tone: 'info', text: 'class:active={isActive} → 참이면 클래스 부착. 이름이 같으면 class:active 단축형. className 문자열 조립보다 안전.' },

          lang: 'html',
          filename: 'Tab.svelte',

            '<script>',
            '  let isActive = false;',

            '   3) 외부 {@html} → :global 로 명시적 허용',
            '   4) Unused selector 경고 = 죽은 CSS, 지운다',
            '-->',
          ],
          highlight: [6, 7, 10, 11, 12, 14, 15, 18, 19, 20],
        },
      },
    ];

    const API_BADGE = {
      scoped:   { label: 'scoped', color: '#FF3E00' },
      global:   { label: ':global()', color: '#F59E0B' },
      classdir: { label: 'class: 디렉티브', color: '#6366F1' },
      styledir: { label: 'style: / CSS 변수', color: '#0891B2' },
      pitfalls: { label: '실무 함정', color: '#9A3412' },
    };

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function DomBox({ dom, toggleOn }) {
      // 렌더된 DOM 요소에 붙는 클래스 목록을 시각화
      const classes = [...(dom.base || [])];
      if (dom.hashed) classes.push(dom.hashed);
      const showActive = toggleOn;
      return (
        <div className="rounded-lg border-2 p-3 bg-white" style={{ borderColor: '#FF3E00' }}>
          <div className="text-[10px] font-bold mb-2" style={{ color: '#9A3412' }}>렌더된 DOM 요소</div>
          <div className="font-mono text-[11px] text-slate-700 flex flex-wrap items-center gap-1">
            <span className="text-slate-400">&lt;{dom.tag}</span>
            {classes.length > 0 && <span className="text-slate-400">class=&quot;</span>}
            {classes.map((c) => (
              <span key={c} className="px-1.5 py-0.5 rounded text-[10px] font-bold text-white"
                style={{ backgroundColor: c.startsWith('svelte-') ? '#9A3412' : '#0891B2' }}>{c}</span>
            ))}
            {showActive && (
              <span className="px-1.5 py-0.5 rounded text-[10px] font-bold text-white animate-pulse" style={{ backgroundColor: '#FF3E00' }}>active</span>
            )}
            {classes.length > 0 && <span className="text-slate-400">&quot;</span>}
            {classes.length === 0 && <span className="text-slate-400 italic">(해시 클래스 없음)</span>}
            <span className="text-slate-400">&gt;</span>
          </div>
          <div className="mt-2 text-[10px] text-slate-500">{dom.note}</div>
        </div>
      );
    }

    function CssRuleRow({ rule, toggleOn }) {
      let active = rule.on;
      if (rule.on === 'byToggle') active = toggleOn;
      return (
        <div className="flex items-center gap-2 rounded border px-2 py-1.5"
          style={{ borderColor: active ? '#FF3E00' : '#E2E8F0', backgroundColor: active ? '#FFF7ED' : '#F8FAFC', opacity: active ? 1 : 0.6 }}>
          <span className="text-sm">{active ? '🟢' : '⚪'}</span>
          <div className="min-w-0">
            <div className="font-mono text-[11px] truncate" style={{ color: active ? '#9A3412' : '#94A3B8' }}>{rule.sel}</div>
            <div className="text-[10px] text-slate-500">{rule.label}</div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state, toggleOn, onToggle }) {
      const badge = API_BADGE[state.api] || API_BADGE.scoped;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>스타일 캡슐화 — 컴포넌트 안에서</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
            <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
              <span>🔥</span>
              <span>{state.code.filename}</span>
              <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{badge.label}</span>
            </div>
            <div className="p-3 space-y-2 bg-orange-50">
              <DomBox dom={state.dom} toggleOn={toggleOn} />
              <div className="space-y-1.5">
                <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>적용되는 CSS 규칙</div>
                {state.css.map((r, i) => <CssRuleRow key={i} rule={r} toggleOn={toggleOn} />)}
              </div>
            </div>
          </div>

          {state.toggle && (
            <div className="mt-3 flex items-center gap-3 rounded-lg border p-2" style={{ borderColor: '#6366F1', backgroundColor: '#EEF2FF' }}>
              <button
                onClick={onToggle}
                aria-pressed={toggleOn}
                className="px-3 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: toggleOn ? '#FF3E00' : '#94A3B8' }}
              >{toggleOn ? 'isActive = true' : 'isActive = false'}</button>
              <span className="text-[11px]" style={{ color: '#3730A3' }}>버튼을 눌러 class:active 토글을 관찰해 보세요.</span>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [toggleOn, setToggleOn] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{ backgroundColor: '#9A3412' }}>Part I. 기초</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-mono" style={{ backgroundColor: '#FED7AA', color: '#9A3412' }}>I-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>scoped style + class: 디렉티브</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>컴포넌트에 갇힌 스타일과 조건부 클래스 바인딩</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} toggleOn={toggleOn} onToggle={() => setToggleOn((v) => !v)} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Svelte의 style 블록은 기본이 scoped라 해시 클래스로 격리된다. 경계를 넘어야 할 때만 :global()을 최소로 쓰고, 자식 테마링은 CSS 변수(--accent)가 우선이다. class:active=&#123;isActive&#125; 로 상태에 따라 클래스를 토글하고, style:prop 으로 계산값을 인라인 반응형으로 건다. 미사용 셀렉터 경고는 죽은 CSS 신호이니 정리한다. 다음 Part II에서는 컴포넌트 합성과 props를 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'scoped-style', 'global', 'class-directive', 'style-directive', 'CSS변수', 'encapsulation', 'unused-selector'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
