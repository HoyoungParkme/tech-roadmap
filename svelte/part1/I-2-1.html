  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });

    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {

<body>
  <div id="root"></div>

  <!--
    Svelte I-2-1 — 반응형 선언: $: vs $derived
    비유: "엑셀 수식 셀" — 원본 셀(count)이 바뀌면 수식 셀(=count*2)이 자동으로 다시 계산된다.
    파생값은 스스로 갱신되고, 사이드이펙트는 값이 바뀔 때 "행동"을 실행한다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 반응형 선언이란? — 원본이 바뀌면 자동으로 다시 계산',
        desc: '반응형 선언은 "다른 값에서 파생되는 계산값"을 자동으로 최신 상태로 유지하는 기능이다. 엑셀에서 A1 셀에 =B1*2 라고 적으면 B1 을 바꿀 때마다 A1 이 알아서 다시 계산되는 것과 똑같다. Svelte 는 파생 계산이 어떤 값에 의존하는지 컴파일 시점에 스스로 추적하므로, 개발자가 "언제 다시 계산하라"고 명령할 필요가 없다. 이 덕분에 원본과 파생값이 항상 일치해, 수동으로 동기화하다 빠뜨리는 버그가 사라진다.',
        sources: [{ name: 'count', value: 3 }],
        deriveds: [{ expr: 'count * 2', name: 'doubled', value: 6 }],
        effect: null,
        api: 'concept',
        recalc: true,
        alert: { tone: 'info', text: '파생값 = 원본에서 계산되는 값. 원본이 바뀌면 Svelte 가 알아서 다시 계산한다(엑셀 수식 셀과 동일).' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte',
          lines: [
            '<!-- 원본 상태(count)에서 파생값(doubled)을 만든다 -->',
            '<script>',
            '  let count = 3;',
            '',
            '  // count 가 바뀌면 doubled 는 자동으로 다시 계산된다',
            '  // (엑셀 =B1*2 처럼, 개발자가 갱신을 명령하지 않는다)',
            '  $: doubled = count * 2;',
            '<\/script>',
            '',
            '<button on:click={() => count += 1}>+1</button>',
            '<p>count: {count}</p>',
            '<p>doubled: {doubled}</p>',
            '',
            '<!-- 흐름',
            '  count = 3  →  doubled = 6',
            '  버튼 클릭 → count = 4 → doubled 가 자동으로 8 -->',
          ],
          highlight: [3, 5, 6, 7, 11, 12],
        },
      },
      {
        title: 'Step 2. Svelte 4 — $: 파생 선언과 여러 의존성 자동 추적',
        desc: 'Svelte 4 의 표준 문법은 $: 라벨이다. $: doubled = count * 2 처럼 쓰면 "이 줄은 오른쪽에 등장한 값들이 바뀔 때마다 다시 실행하라"는 뜻이 된다. 의존성을 배열로 나열할 필요가 없다 — 식 안에 등장한 count 를 컴파일러가 자동으로 의존성으로 잡는다. 여러 값에 의존해도 마찬가지라서, $: total = price * qty 는 price 또는 qty 중 하나만 바뀌어도 다시 계산된다. 파생값이 또 다른 파생값에 의존해도(체인) 순서대로 갱신된다.',
        sources: [{ name: 'price', value: 1000 }, { name: 'qty', value: 3 }],
        deriveds: [{ expr: 'price * qty', name: 'total', value: 3000 }],
        effect: null,
        api: 'derived4',
        recalc: true,
        alert: { tone: 'info', text: 'Svelte 4: $: total = price * qty. 식에 등장한 값이 의존성 — 배열 나열 불필요, 여러 개도 자동 추적.' },
        code: {
          lang: 'html',
          filename: 'Cart.svelte (Svelte 4)',
          lines: [
            '<!-- $: 는 "이 식의 의존 값이 바뀌면 다시 실행" 이라는 표시 -->',
            '<script>',
            '  let price = 1000;',
            '  let qty = 3;',
            '',
            '  // price 또는 qty 가 바뀌면 자동 재계산',
            '  $: total = price * qty;',
            '',
            '  // 파생값이 또 파생값에 의존해도 순서대로 갱신(체인)',
            '  $: withTax = Math.round(total * 1.1);',
            '<\/script>',
            '',
            '<input type="number" bind:value={qty} />',
            '<p>합계: {total}원 (세금 포함 {withTax}원)</p>',
            '',
            '<!-- React useMemo(() => price*qty, [price, qty]) 와 달리',
            '     의존성 배열을 손으로 적지 않는다 → 빠뜨릴 일이 없다 -->',
          ],
          highlight: [3, 4, 6, 7, 9, 10, 16, 17],
        },
      },
      {
        title: 'Step 3. Svelte 4 — $: { } 사이드이펙트 블록',
        desc: '$: 는 값을 계산하는 것뿐 아니라 "행동"도 실행할 수 있다. $: { ... } 처럼 블록으로 감싸면, 블록 안에서 참조한 값이 바뀔 때마다 그 코드가 실행된다. 로그 남기기, 문서 제목 바꾸기, 로컬스토리지 저장처럼 화면 밖 세상에 영향을 주는 일을 여기서 한다. 주의할 점은 파생값 계산과 사이드이펙트를 한 줄에 섞지 말라는 것이다. $: 는 편해서 남용하기 쉬운데, 순수한 파생값(=)과 부수효과(블록)를 분리해야 흐름을 추적하기 쉽다.',
        sources: [{ name: 'count', value: 5 }],
        deriveds: [{ expr: 'count * 2', name: 'doubled', value: 10 }],
        effect: { label: 'document.title = "클릭 " + count', kind: 'title' },
        api: 'effect4',
        recalc: true,
        alert: { tone: 'warn', text: '$: { } 블록은 값이 바뀔 때 "행동"을 실행. 파생값 계산(=)과 사이드이펙트(블록)를 한 줄에 섞지 말 것.' },
        code: {
          lang: 'html',
          filename: 'Logger.svelte (Svelte 4)',
          lines: [
            '<!-- 값 계산은 = 로, 부수효과는 블록 { } 로 분리한다 -->',
            '<script>',
            '  let count = 5;',
            '',
            '  // 파생값: 순수한 계산 (사이드이펙트 없음)',
            '  $: doubled = count * 2;',
            '',
            '  // 사이드이펙트: count 가 바뀌면 문서 제목을 갱신',
            '  $: {',
            '    document.title = "클릭 " + count;',
            '    console.log("count 변경:", count);',
            '  }',
            '<\/script>',
            '',
            '<button on:click={() => count += 1}>클릭</button>',
            '',
            '<!-- 나쁜 예: 계산과 부수효과를 뒤섞음',
            '     $: doubled = (() => { save(count); return count*2; })();',
            '     → 추적이 어렵다. = 와 { } 를 분리하라 -->',
          ],
          highlight: [5, 6, 8, 9, 10, 11, 12],
        },
      },
      {
        title: 'Step 4. Svelte 5 룬 — $derived 로 파생값 만들기',
        desc: 'Svelte 5 는 룬(rune)이라는 명시적 문법을 도입했다. 파생값은 $: 대신 $derived 로 만든다 — let doubled = $derived(count * 2). $: 와 결과는 같지만, "이건 파생값이다"라는 의도가 코드에 또렷이 드러나고 변수 선언처럼 보여 읽기 쉽다. 원본 상태는 $state 로 만들며, $derived 는 그 $state 를 참조해 자동으로 최신값을 유지한다. 복잡한 계산이라 여러 줄이 필요하면 $derived.by(() => { ... return v; }) 형태를 쓴다.',
        sources: [{ name: 'count', value: 4 }],
        deriveds: [{ expr: 'count * 2', name: 'doubled', value: 8 }],
        effect: null,
        api: 'derived5',
        recalc: true,
        alert: { tone: 'good', text: 'Svelte 5: let doubled = $derived(count * 2). 파생값임이 명시적. 여러 줄은 $derived.by(() => ...).' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte (Svelte 5)',
          lines: [
            '<!-- 룬: 원본은 $state, 파생값은 $derived 로 명시 -->',
            '<script>',
            '  let count = $state(4);',
            '',
            '  // "이 변수는 파생값" 이라는 의도가 또렷하다',
            '  let doubled = $derived(count * 2);',
            '',
            '  // 계산이 여러 줄이면 $derived.by 사용',
            '  let label = $derived.by(() => {',
            '    const t = count * 2;',
            '    return "두 배는 " + t;',
            '  });',
            '<\/script>',
            '',
            '<button onclick={() => count += 1}>+1</button>',
            '<p>{doubled} / {label}</p>',
            '',
            '<!-- $: doubled = count*2  ≡  let doubled = $derived(count*2)',
            '     결과는 같고, 룬 쪽이 의도가 더 명시적이다 -->',
          ],
          highlight: [3, 5, 6, 8, 9, 10, 11, 12],
        },
      },
      {
        title: 'Step 5. Svelte 5 룬 — $effect 로 사이드이펙트',
        desc: 'Svelte 5 에서 사이드이펙트는 $effect(() => { ... }) 로 쓴다. $: { } 블록의 룬 버전이며, 콜백 안에서 참조한 $state·$derived 값이 바뀌면 콜백이 다시 실행된다. 로그, DOM 직접 조작, 외부 구독처럼 화면 밖 작업에 쓴다. 함수를 return 하면 정리(cleanup) 코드가 되어, 다음 실행 전이나 컴포넌트가 사라질 때 호출된다 — 타이머 해제나 구독 취소에 유용하다. 파생값을 만들 때 $effect 로 다른 변수에 대입하지 말 것 — 그건 $derived 의 일이다.',
        sources: [{ name: 'count', value: 6 }],
        deriveds: [{ expr: 'count * 2', name: 'doubled', value: 12 }],
        effect: { label: 'console.log("count:", count) + cleanup', kind: 'effect' },
        api: 'effect5',
        recalc: true,
        alert: { tone: 'good', text: 'Svelte 5: $effect(() => { ...; return cleanup; }). 함수 return 은 정리 코드(타이머 해제·구독 취소).' },
        code: {
          lang: 'html',
          filename: 'Timer.svelte (Svelte 5)',
          lines: [
            '<!-- 사이드이펙트는 $effect, 정리(cleanup)는 return 함수 -->',
            '<script>',
            '  let count = $state(6);',
            '',
            '  $effect(() => {',
            '    // count 가 바뀔 때마다 실행',
            '    console.log("count:", count);',
            '',
            '    const id = setInterval(() => {}, 1000);',
            '    // return 한 함수 = 정리 코드 (다음 실행 전/파괴 시)',
            '    return () => clearInterval(id);',
            '  });',
            '<\/script>',
            '',
            '<!-- 안티패턴: $effect 안에서 파생값을 대입하지 말 것',
            '     $effect(() => { doubled = count * 2; })  ← 나쁨',
            '     → 파생은 $derived 의 일이다 -->',
          ],
          highlight: [5, 6, 7, 9, 10, 11, 12],
        },
      },
      {
        title: 'Step 6. 실무 함정 — 무한 루프 · 의존성 오해 · 룬 전환',
        desc: '가장 흔한 사고는 사이드이펙트 안에서 자신이 의존하는 값을 다시 바꿔 무한 루프에 빠지는 것이다($effect 안에서 count 를 읽고 또 count 를 증가). 두 번째 함정은 의존성 추적 오해다 — 조건문에 가려 실제로 읽히지 않은 값은 의존성으로 잡히지 않으므로, 필요한 값은 반드시 콜백 본문에서 읽어야 한다. 세 번째는 룬 전환 규칙이다: 한 컴포넌트에서 $: 와 $derived 를 섞지 말고, $state 를 쓰기 시작하면 파생·이펙트도 룬으로 통일한다. 원칙은 "파생은 $derived, 행동은 $effect".',
        sources: [{ name: 'count', value: 7 }],
        deriveds: [{ expr: 'count * 2', name: 'doubled', value: 14 }],
        effect: { label: '⚠ count 를 읽고 또 바꿈 → 무한 루프', kind: 'danger' },
        api: 'pitfall',
        recalc: true,
        alert: { tone: 'danger', text: '무한 루프: 이펙트가 자기 의존 값을 다시 변경. 파생은 $derived, 행동은 $effect 로 분리하면 대부분 예방된다.' },
        code: {
          lang: 'html',
          filename: 'Pitfalls.svelte',
          lines: [
            '<script>',
            '  let count = $state(7);',
            '',
            '  // 함정 1: 무한 루프 — 의존 값을 이펙트가 다시 변경',
            '  // $effect(() => { count = count + 1; });  ❌ 멈추지 않음',
            '',
            '  // 함정 2: 의존성 추적 오해',
            '  //   조건에 가려 읽히지 않은 값은 추적되지 않는다',
            '  //   → 필요한 값은 콜백 본문에서 반드시 읽는다',
            '',
            '  // 함정 3: 룬 전환 — 한 파일에서 섞지 말 것',
            '  //   $: 와 $derived 혼용 금지',
            '  //   $state 를 쓰면 파생·이펙트도 룬으로 통일',
            '',
            '  // ✅ 올바른 분리',
            '  let doubled = $derived(count * 2);   // 파생',
            '  $effect(() => console.log(doubled));  // 행동',
            '<\/script>',
            '',
            '<p>{count} → {doubled}</p>',
          ],
          highlight: [4, 5, 7, 8, 9, 11, 12, 13, 15, 16, 17],
        },
      },
    ];

    const API_BADGE = {
      concept:  { label: '반응형 개념', color: '#FF3E00' },
      derived4: { label: '$: 파생', color: '#F59E0B' },
      effect4:  { label: '$: { } 이펙트', color: '#D97706' },
      derived5: { label: '$derived', color: '#9A3412' },
      effect5:  { label: '$effect', color: '#059669' },
      pitfall:  { label: '실무 함정', color: '#DC2626' },
    };

    function DependencyGraph({ state, animKey }) {
      const isRune = state.api === 'derived5' || state.api === 'effect5' || state.api === 'pitfall';
      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>의존성 그래프 (원본 → 파생 → 이펙트)</span>
            <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{isRune ? 'Svelte 5 룬' : 'Svelte 4 $:'}</span>
          </div>
          <div className="p-4 bg-orange-50 flex flex-col items-center gap-1">
            <div className="text-[10px] font-bold mb-1" style={{ color: '#9A3412' }}>원본 상태 (source)</div>
            <div className="w-full flex flex-wrap justify-center gap-2">
              {state.sources.map((s) => (
                <div key={s.name} className="rounded-lg border-2 bg-white px-3 py-2 text-center pulse-glow" style={{ borderColor: '#9A3412' }}>
                  <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>{s.name}</div>
                  <div className="text-sm font-mono" style={{ color: '#7C2D12' }}>{String(s.value)}</div>
                </div>
              ))}
            </div>

            <div className="flex flex-col items-center text-[10px]" style={{ color: '#FF3E00' }}>
              <span className="text-lg leading-none">↓</span>
              <span>{isRune ? '$derived(...)' : '$: 자동 재계산'}</span>
            </div>

            <div className="text-[10px] font-bold mb-1" style={{ color: '#9A3412' }}>파생값 (derived)</div>
            <div className="w-full flex flex-wrap justify-center gap-2">
              {state.deriveds.map((d) => (
                <div key={d.name} className="rounded-lg border-2 px-3 py-2 text-center recalc-pop" style={{ borderColor: '#FF3E00' }} key2={'d' + animKey}>
                  <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>{d.name}</div>
                  <div className="text-[10px] font-mono" style={{ color: '#B45309' }}>= {d.expr}</div>
                  <div className="text-sm font-mono" style={{ color: '#7C2D12' }}>{String(d.value)}</div>
                </div>
              ))}
            </div>

            {state.effect && (
              <React.Fragment>
                <div className="flex flex-col items-center text-[10px]" style={{ color: state.effect.kind === 'danger' ? '#DC2626' : '#059669' }}>
                  <span className="text-lg leading-none">↓</span>
                  <span>{isRune ? '$effect(() => ...)' : '$: { } 사이드이펙트'}</span>
                </div>
                <div
                  className="w-full rounded-lg border-2 px-3 py-2 text-center flow-anim"
                  style={
                    state.effect.kind === 'danger'
                      ? { borderColor: '#FCA5A5', backgroundColor: '#FEF2F2' }
                      : { borderColor: '#6EE7B7', backgroundColor: '#ECFDF5' }
                  }
                  key={'e' + animKey}
                >
                  <div className="text-[10px] font-bold" style={{ color: state.effect.kind === 'danger' ? '#991B1B' : '#047857' }}>사이드이펙트 실행</div>
                  <div className="text-[10px] font-mono mt-0.5" style={{ color: state.effect.kind === 'danger' ? '#B91C1C' : '#065F46' }}>{state.effect.label}</div>
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      );
    }

    function CompareTable() {
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border p-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
            <div className="text-[10px] font-bold text-amber-700">Svelte 4 — $:</div>
            <div className="text-[10px] text-amber-900 mt-1 font-mono">$: doubled = count * 2;</div>
            <div className="text-[10px] text-amber-900 font-mono">$: {'{ document.title = t; }'}</div>
          </div>
          <div className="rounded-lg border p-2" style={{ borderColor: '#FF3E00', backgroundColor: '#FFF7ED' }}>
            <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>Svelte 5 — 룬</div>
            <div className="text-[10px] mt-1 font-mono" style={{ color: '#7C2D12' }}>let d = $derived(count*2)</div>
            <div className="text-[10px] font-mono" style={{ color: '#7C2D12' }}>$effect(() =&gt; ...)</div>
          </div>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state, animKey }) {
      const badge = API_BADGE[state.api] || API_BADGE.concept;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>반응형 선언 — 파생값 자동 재계산</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <DependencyGraph state={state} animKey={animKey} />

          {(state.api === 'derived5' || state.api === 'effect5') && <CompareTable />}

          {state.api === 'pitfall' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#FCA5A5', backgroundColor: '#FEF2F2' }}>
              <div className="text-[10px] font-bold text-red-700 mb-1">기억할 원칙</div>
              <div className="text-[10px] text-red-900">파생은 $derived · 행동은 $effect 로 분리</div>
              <div className="text-[10px] text-red-900">이펙트 안에서 자기 의존 값을 바꾸지 않기</div>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1 text-white" style={{ backgroundColor: '#9A3412' }}>Part I. 기초 · I-2-1</div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>반응형 선언 — $: vs $derived</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>다른 값에서 파생되는 계산값과 사이드이펙트</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} animKey={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                반응형 선언은 원본에서 파생되는 값을 자동으로 최신 상태로 유지한다. Svelte 4 는 $: doubled = count * 2 로 파생값을, $: {'{ ... }'} 블록으로 사이드이펙트를 쓴다. Svelte 5 룬은 파생을 let doubled = $derived(count * 2), 행동을 $effect(() =&gt; ...) 로 나눠 의도를 명시한다. 함정은 이펙트가 자기 의존 값을 바꿔 생기는 무한 루프와 의존성 추적 오해다. 원칙은 하나 — 파생은 $derived, 행동은 $effect 로 분리. 다음 챕터에서 스토어로 컴포넌트 밖 상태를 공유하는 법을 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', '반응형 선언', '$:', '$derived', '$effect', '$state', '파생값', '사이드이펙트', '의존성 추적', '무한 루프'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
