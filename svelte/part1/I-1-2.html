    @media (min-width: 768px) {

      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    Svelte I-1-2 — 반응형 변수: let vs $state rune
    비유: "전광판" — 값(변수)이 바뀌면 전광판(화면)이 자동으로 다시 켜진다.
    단, Svelte 4에서는 "재할당(=)"이라는 스위치를 눌러야만 전광판이 반응한다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 반응성이란? — 값이 바뀌면 화면이 저절로 갱신',
        desc: '반응성(reactivity)은 "상태 값이 바뀌면 그 값을 쓰는 화면이 자동으로 다시 그려지는 것"이다. 명령형 코드라면 값을 바꾼 뒤 직접 DOM을 찾아 innerText 를 갱신해야 하지만, Svelte 는 그 연결을 컴파일 단계에서 자동으로 만들어 준다. 개발자는 값만 바꾸면 되고, 화면 갱신은 프레임워크가 책임진다. 이 자동 연결이 무엇을 "트리거"로 삼는지가 이 장의 핵심이다.',
        source: 'count',
        value: '0',
        updated: true,
        trigger: 'concept',
        api: 'concept',
        flow: true,
        alert: { tone: 'info', text: '반응성 = 상태 변경 → 화면 자동 갱신. 개발자는 값만 바꾸고, DOM 갱신은 Svelte 가 처리.' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte',
          lines: [
            '<!-- 값이 바뀌면 화면이 자동으로 갱신된다 -->',
            '<script>',
            '  // 최상위 let 변수 = 반응 상태 (Svelte 4)',
            '  let count = 0;',
            '',
            '  function increment() {',
            '    // 재할당(=) 이 반응성의 트리거',
            '    count = count + 1;',
            '  }',
            '<\/script>',
            '',
            '<!-- count 가 바뀔 때마다 이 텍스트가 다시 그려진다 -->',
            '<button onclick={increment}>',
            '  클릭 수: {count}',
            '</button>',
            '',
            '<!-- 명령형이라면 직접 이렇게 해야 했다:',
            '  document.querySelector("span").innerText = count;',
            '  → Svelte 는 이 연결을 자동으로 만들어 준다 -->',
          ],
          highlight: [1, 2, 3, 4, 6, 7, 8, 9],
        },
      },
      {
        title: 'Step 2. Svelte 4 규칙 — "재할당(=)" 만이 반응성을 트리거',
        desc: 'Svelte 4의 반응성은 컴파일러가 소스 코드를 정적으로 분석해 만든다. 컴파일러는 "= 왼쪽에 반응 변수가 오는 할당문"을 찾아 그 뒤에 화면 갱신 코드를 심는다. 그래서 count = count + 1, count += 1, count++ 처럼 변수에 "재할당"이 일어나야만 갱신된다. 함수 안에서 다른 값을 계산만 하고 변수에 다시 넣지 않으면, 값이 논리적으로 바뀌어도 화면은 그대로다. 트리거는 "할당"이지 "값의 변화"가 아니라는 점을 기억해야 한다.',
        source: 'count',
        value: '2',
        updated: true,
        trigger: 'assign',
        api: 'legacy',
        flow: true,
        alert: { tone: 'info', text: 'Svelte 4 트리거 = 재할당(=). count++, count += 1 은 OK. "값 계산만" 하면 갱신 안 됨.' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte (Svelte 4)',
          lines: [
            '<script>',
            '  let count = 0;',
            '',
            '  // ✅ 갱신됨 — 모두 "재할당" 이다',
            '  const a = () => count = count + 1;',
            '  const b = () => count += 1;',
            '  const c = () => count++;',
            '',
            '  // ❌ 갱신 안 됨 — 재할당이 없다',
            '  const bad = () => {',
            '    let temp = count + 1;   // 지역 변수만 바뀜',
            '    // count 에 다시 넣지 않았다',
            '  };',
            '<\/script>',
            '',
            '<p>{count}</p>',
            '',
            '<!-- 컴파일러는 "= 왼쪽의 반응 변수" 를 보고',
            '  그 뒤에 화면 갱신 코드를 심는다.',
            '  → 재할당이 없으면 심을 곳이 없다 -->',
          ],
          highlight: [4, 5, 6, 7, 9, 10, 11, 12, 13],
        },
      },
      {
        title: 'Step 3. Svelte 4 함정 — 배열/객체는 재할당해야 갱신',
        desc: '이 규칙 때문에 초보자가 가장 많이 밟는 지뢰가 배열과 객체다. arr.push(4) 는 배열 내용을 바꾸지만 arr 변수 자체에 = 로 재할당하지 않으므로, 컴파일러가 화면 갱신 코드를 심지 않는다. 결과적으로 데이터는 늘었는데 화면은 그대로인 버그가 생긴다. 해결책은 push 뒤에 arr = arr 로 자기 자신을 재할당하거나, arr = [...arr, 4] 처럼 새 배열을 만들어 재할당하는 것이다. 객체도 obj.name = "x" 만으로는 부족하고 obj = obj 또는 obj = { ...obj, name: "x" } 가 필요하다.',
        source: 'todos',
        value: '[할일1, 할일2]',
        updated: false,
        trigger: 'mutate',
        api: 'trap',
        flow: true,
        alert: { tone: 'warn', text: 'arr.push(x) 만으로는 화면 미갱신! 재할당 필요 → arr = arr 또는 arr = [...arr, x].' },
        code: {
          lang: 'html',
          filename: 'TodoList.svelte (Svelte 4)',
          lines: [
            '<script>',
            '  let todos = ["할일1", "할일2"];',
            '',
            '  // ❌ 함정: push 만 하면 화면이 안 바뀐다',
            '  function addBad(text) {',
            '    todos.push(text);   // 내용은 늘지만',
            '    // todos 재할당이 없어 화면 미갱신',
            '  }',
            '',
            '  // ✅ 해결 1: 자기 재할당',
            '  function addFix1(text) {',
            '    todos.push(text);',
            '    todos = todos;      // = 로 트리거',
            '  }',
            '',
            '  // ✅ 해결 2: 새 배열로 재할당 (권장)',
            '  function addFix2(text) {',
            '    todos = [...todos, text];',
            '  }',
            '<\/script>',
            '',
            '<ul>{#each todos as t}<li>{t}</li>{/each}</ul>',
          ],
          highlight: [4, 5, 6, 7, 11, 12, 13, 17, 18],
        },
      },
      {
        title: 'Step 4. Svelte 5 룬 — let count = $state(0) 로 명시적 반응',
        desc: 'Svelte 5는 반응성을 룬(rune)으로 명시한다. let count = $state(0) 라고 쓰면 이 변수는 "반응 상태"임이 코드에 드러난다. 더 이상 컴파일러의 정적 분석에 기대지 않고, 런타임에서 값의 읽기/쓰기를 추적한다. 이 명시성 덕분에 이점이 두 가지다. 첫째, 어떤 변수가 반응 상태인지 한눈에 보인다. 둘째, .svelte 컴포넌트 최상위뿐 아니라 .svelte.js/.svelte.ts 같은 모듈 파일 밖에서도 반응 상태를 만들어 재사용할 수 있다. Svelte 4의 "최상위 let 만 반응" 제약이 풀린다.',
        source: 'count',
        value: '0',
        updated: true,
        trigger: 'rune',
        api: 'runes',
        flow: true,
        alert: { tone: 'good', text: 'Svelte 5: let count = $state(0). 반응 상태를 명시 → 가독성 + 모듈(.svelte.js) 밖에서도 사용.' },
        code: {
          lang: 'html',
          filename: 'Counter.svelte (Svelte 5)',
          lines: [
            '<script>',
            '  // $state 룬으로 "반응 상태" 임을 명시',
            '  let count = $state(0);',
            '',
            '  function increment() {',
            '    count += 1;   // 여전히 재할당으로 갱신',
            '  }',
            '<\/script>',
            '',
            '<button onclick={increment}>클릭 수: {count}</button>',
            '',
            '<!-- 모듈 파일(counter.svelte.js)에서도 가능 -->',
            '<!--',
            '  // counter.svelte.js',
            '  export const store = $state({ count: 0 });',
            '  // 여러 컴포넌트가 import 해서 공유 가능',
            '',
            '  Svelte 4 는 최상위 let 만 반응 → 모듈 밖 불가.',
            '  Svelte 5 는 $state 로 어디서든 반응 상태 생성.',
            '-->',
          ],
          highlight: [1, 2, 3, 5, 6, 7, 12, 14, 15],
        },
      },
      {
        title: 'Step 5. 깊은 반응성 — $state 배열/객체는 push 도 바로 반영',
        desc: '룬의 또 다른 강점은 "깊은 반응성(deep reactivity)"이다. $state 로 만든 배열이나 객체는 내부적으로 프록시(Proxy)로 감싸져, 요소를 추가·수정·삭제하는 것까지 추적한다. 그래서 Svelte 4에서 화면을 안 바꾸던 todos.push(text) 가 Svelte 5의 $state 배열에서는 그대로 화면에 반영된다. 재할당(todos = ...) 을 억지로 하지 않아도 된다는 뜻이다. 다만 프록시가 감싸는 것은 $state 변수가 가리키는 객체 자체이므로, 그 객체를 통째로 다른 곳에 넘기거나 구조 분해로 원시값만 떼어내면 반응성이 끊길 수 있다는 점은 주의한다.',
        source: 'todos',
        value: '[할일1, 할일2, 할일3]',
        updated: true,
        trigger: 'deep',
        api: 'deep',
        flow: true,
        alert: { tone: 'good', text: 'Svelte 5 $state 배열/객체는 프록시라 push/pop/속성변경까지 추적. 재할당 없이도 화면 갱신.' },
        code: {
          lang: 'html',
          filename: 'TodoList.svelte (Svelte 5)',
          lines: [
            '<script>',
            '  // $state 배열은 프록시로 감싸진다 (깊은 반응성)',
            '  let todos = $state(["할일1", "할일2"]);',
            '',
            '  // ✅ push 만 해도 화면이 갱신된다!',
            '  function add(text) {',
            '    todos.push(text);   // 재할당 불필요',
            '  }',
            '',
            '  // ✅ 요소 수정·삭제도 추적됨',
            '  function remove(i) {',
            '    todos.splice(i, 1);',
            '  }',
            '<\/script>',
            '',
            '<ul>{#each todos as t}<li>{t}</li>{/each}</ul>',
            '',
            '<!-- 주의: 반응성이 끊기는 경우',
            '  · 구조 분해로 원시값만 떼면 추적 끊김',
            '  · 파생 값(개수 등)은 $derived — 다음 장에서 -->',
          ],
          highlight: [1, 2, 3, 5, 6, 7, 10, 11, 12],
        },
      },
    ];

    const API_BADGE = {
      concept: { label: '반응성 개념', color: '#FF3E00' },
      legacy:  { label: 'Svelte 4 let', color: '#F59E0B' },
      trap:    { label: '배열 함정', color: '#DC2626' },
      runes:   { label: '$state rune', color: '#9A3412' },
      deep:    { label: '깊은 반응성', color: '#059669' },
    };

    const TRIGGER_LABEL = {
      concept: '값 변경',
      assign:  'count = count + 1  (재할당)',
      mutate:  'todos.push(x)  (메서드만)',
      rune:    'count = $state(0) → 재할당',
      deep:    'todos.push(x)  (프록시 추적)',
    };

    function ReactivityFlow({ state, animKey }) {
      const ok = state.updated;
      const screenColor = ok ? '#059669' : '#DC2626';
      const screenBg = ok ? '#ECFDF5' : '#FEF2F2';
      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>반응성 흐름 (상태 → 화면)</span>
            <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{ok ? '자동 갱신 O' : '미갱신 X'}</span>
          </div>
          <div className="p-4 bg-orange-50 flex flex-col items-center gap-1">
            <div className="w-full rounded-lg border-2 bg-white px-3 py-2 text-center pulse-glow" style={{ borderColor: '#9A3412' }} key={'s' + animKey}>
              <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>상태 변수 (State)</div>
              <div className="text-[11px] font-mono mt-0.5" style={{ color: '#7C2D12' }}>{state.source} = {state.value}</div>
            </div>

            <div className="flex flex-col items-center text-[10px]" style={{ color: ok ? '#FF3E00' : '#DC2626' }}>
              <span className="font-mono text-center px-2">{TRIGGER_LABEL[state.trigger]}</span>
              <span className="text-lg leading-none">{ok ? '↓' : '⤫'}</span>
              <span>{ok ? '반응성 트리거 발동' : '트리거 없음 — 갱신 안 됨'}</span>
            </div>

            <div
              className={`w-full rounded-lg border-2 px-3 py-2 text-center ${ok ? 'flow-anim' : 'shake-x'}`}
              style={{ borderColor: screenColor, backgroundColor: screenBg }}
              key={'v' + animKey}
            >
              <div className="text-[10px] font-bold" style={{ color: screenColor }}>화면 (DOM)</div>
              <div className="text-[11px] font-mono mt-0.5" style={{ color: screenColor }}>
                {ok ? `표시: ${state.value}` : `여전히 옛 값 (미갱신)`}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CompareTable() {
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border p-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
            <div className="text-[10px] font-bold text-amber-700">Svelte 4 — let + 재할당</div>
            <div className="text-[10px] text-amber-900 mt-1 font-mono">let count = 0;</div>
            <div className="text-[10px] text-amber-900 font-mono">count = count + 1;</div>
          </div>
          <div className="rounded-lg border p-2" style={{ borderColor: '#FF3E00', backgroundColor: '#FFF7ED' }}>
            <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>Svelte 5 — $state 룬</div>
            <div className="text-[10px] mt-1 font-mono" style={{ color: '#7C2D12' }}>let count = $state(0);</div>
            <div className="text-[10px] font-mono" style={{ color: '#7C2D12' }}>count += 1;</div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state, animKey }) {
      const badge = API_BADGE[state.api] || API_BADGE.concept;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>반응성 — 값이 바뀌면 화면이 갱신될까?</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <ReactivityFlow state={state} animKey={animKey} />

          {(state.api === 'legacy' || state.api === 'runes') && <CompareTable />}

          {state.api === 'trap' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#FCA5A5', backgroundColor: '#FEF2F2' }}>
              <div className="text-[10px] font-bold text-red-700 mb-1">배열/객체 함정 (Svelte 4)</div>
              <div className="text-[10px] text-red-900">❌ todos.push(x) → 화면 미갱신</div>
              <div className="text-[10px] text-red-900">✅ todos = todos  또는  todos = [...todos, x]</div>
            </div>
          )}

          {state.api === 'deep' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#6EE7B7', backgroundColor: '#ECFDF5' }}>
              <div className="text-[10px] font-bold text-emerald-700 mb-1">깊은 반응성 (Svelte 5 $state)</div>
              <div className="text-[10px] text-emerald-900">✅ push/splice/속성변경까지 프록시가 추적</div>
              <div className="text-[10px] text-emerald-900">재할당 없이도 화면이 바로 갱신</div>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1 text-white" style={{ backgroundColor: '#9A3412' }}>Part I. 기초 · I-1-2</div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>반응형 변수 — let vs $state rune</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>값이 바뀌면 화면이 갱신되는 반응성, Svelte 5 룬 방식</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} animKey={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Svelte 4의 반응성은 컴파일러가 "재할당(=)"을 찾아 화면 갱신을 심는 방식이라, count = count + 1 은 되지만 arr.push(x) 처럼 재할당 없는 변경은 화면을 갱신하지 못한다. 해결은 arr = [...arr, x] 로 재할당하는 것. Svelte 5는 let count = $state(0) 룬으로 반응 상태를 명시하고, 배열/객체는 프록시로 감싸 깊은 반응성을 제공해 push 만으로도 갱신된다. 룬은 명시성과 모듈(.svelte.js) 밖 사용이라는 이점이 있다. 파생 값(개수·합계 등)은 다음 장의 $derived 로 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', '반응성', 'let', '$state', 'rune', '재할당', '깊은 반응성', 'Proxy', '배열 함정', 'Svelte5'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
