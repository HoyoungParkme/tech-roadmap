  -->

            '<!-- 결과 DOM:',
            '  <div class="card">',

            '',

            '  <!-- slot="header" → header 자리 -->',
            '  <h2 slot="header">결제 상세</h2>',

      {

        desc: '부모가 아무것도 안 넘길 수도 있다. slot 태그 안에 기본 내용을 적어 두면 부모가 채우지 않았을 때 그 기본값이 보인다(fallback). 반대 방향도 있다. 자식이 slot 태그에 값을 실어 부모에게 넘길 수 있는데, 이것이 slot props다. 자식은 slot user={u} 처럼 데이터를 붙이고, 부모는 let:user 로 받아 마크업에서 쓴다. 리스트의 각 행을 부모가 자유롭게 렌더링하게 만드는 renderless 패턴의 핵심이다.',
        api: 'slotprops',
        child: { name: 'List.svelte', slots: [
          { key: 'default', label: 'slot item={row} (props ↑)', filled: true },
          { key: 'empty', label: 'slot name="empty" (fallback)', filled: false },
        ] },
        parentContent: [
          { target: 'default', text: 'let:item → {item.name}' },
        ],
        alert: { tone: 'warn', text: 'slot props는 자식 → 부모로 데이터를 올려보낸다. 부모는 let:item 으로 받는다. React의 render props와 같은 목적.' },
        code: {
          lang: 'html',
          filename: 'List.svelte / App.svelte',
          lines: [
            '<!-- List.svelte — 데이터는 자식이, 모양은 부모가 -->',
            '<script>',
            '  export let items = [];',
            '<\/script>',
            '',
            '{#if items.length === 0}',
            '  <!-- fallback: 부모가 안 채우면 이 기본이 보인다 -->',
            '  <slot name="empty">데이터가 없습니다</slot>',
            '{:else}',
            '  <ul>',
            '    {#each items as item}',
            '      <li>',
            '        <!-- slot props: item 을 부모로 올려보낸다 -->',
            '        <slot item={item}>{item.name}</slot>',
            '      </li>',
            '    {/each}',
            '  </ul>',
            '{/if}',
            '',
            '<!-- ===================================== -->',
            '',
            '<!-- App.svelte — let: 로 slot props 받기 -->',
            '<List items={users}>',
            '  <!-- 자식이 올려준 item 을 let:item 으로 받는다 -->',
            '  <span slot="empty">아직 주문이 없어요</span>',
            '',
            '  <!-- 기본 slot: let:item 으로 각 행을 직접 렌더 -->',
            '  <strong let:item>{item.name}</strong>',
            '  <em let:item>({item.age}세)</em>',
            '</List>',
            '',
            '<!-- 문법 함정: 받는 쪽은 반드시 let:item.',
            '     item={item} (프로퍼티 문법)과 헷갈리지 말 것 -->',
          ],
          highlight: [8, 14, 22, 23, 25, 28, 29],
        },
      },
      {
        title: 'Step 4. 합성 패턴 — 레이아웃 · 카드 · 리스트',
        desc: 'slot이 강력한 이유는 "관심사 분리"다. 자식은 구조·간격·테두리 같은 형태만 책임지고, 무엇을 보여줄지는 전부 부모가 결정한다. PageShell(레이아웃)은 header/sidebar/main 자리를 열어두고, 각 페이지가 그 자리를 채운다. 이렇게 하면 레이아웃 코드를 한 번만 쓰고 모든 페이지가 재사용한다. 카드·모달·테이블 행도 같은 원리다. 컴포넌트를 상속이 아니라 합성으로 확장하는 것이 프론트엔드의 정석이다.',
        api: 'pattern',
        child: { name: 'PageShell.svelte', slots: [
          { key: 'nav', label: 'slot name="nav"', filled: true },
          { key: 'aside', label: 'slot name="aside"', filled: true },
          { key: 'default', label: 'slot (main)', filled: true },
        ] },
        parentContent: [
          { target: 'nav', text: '상단 내비게이션' },
          { target: 'aside', text: '좌측 메뉴' },
          { target: 'default', text: '대시보드 본문' },
        ],
        alert: { tone: 'good', text: '상속이 아니라 합성으로 확장한다. 레이아웃 껍데기 하나 → 모든 페이지가 재사용.' },
        code: {
          lang: 'html',
          filename: 'PageShell.svelte / Dashboard.svelte',
          lines: [
            '<!-- PageShell.svelte — 레이아웃 껍데기 (자식) -->',
            '<div class="shell">',
            '  <nav>',
            '    <slot name="nav">기본 메뉴</slot>',
            '  </nav>',
            '  <div class="row">',
            '    <aside>',
            '      <slot name="aside"></slot>',
            '    </aside>',
            '    <main>',
            '      <!-- 페이지 본문이 들어올 기본 자리 -->',
            '      <slot></slot>',
            '    </main>',
            '  </div>',
            '</div>',
            '',
            '<!-- ===================================== -->',
            '',
            '<!-- Dashboard.svelte — 자리만 채우면 페이지 완성 -->',
            '<script>',
            '  import PageShell from "./PageShell.svelte";',
            '<\/script>',
            '',
            '<PageShell>',
            '  <NavBar slot="nav" />',
            '  <SideMenu slot="aside" />',
            '',
            '  <!-- 이름 없는 콘텐츠 = main 자리 -->',
            '  <h1>대시보드</h1>',
            '  <ChartGrid />',
            '</PageShell>',
            '',
            '<!-- 이득: 레이아웃 코드는 PageShell 한 곳.',
            '     페이지는 "무엇을 넣을지"만 신경 쓴다 -->',
          ],
          highlight: [2, 3, 4, 7, 8, 11, 12, 13, 24, 25, 26, 29, 30, 31],
        },
      },
      {
        title: 'Step 5. Svelte 5의 새 방식 — snippet + {@render} + children',
        desc: 'Svelte 5는 slot을 snippet과 {@render}로 대체했다. slot의 한계는 여러 named slot·slot props가 얽히면 문법이 난해했다는 점이다. snippet은 재사용 가능한 마크업 조각을 이름 붙여 정의하고 {@render name(args)}로 호출한다. 기본 slot은 children prop으로 바뀌어 다른 데이터와 똑같이 $props()로 받는다. 인자 전달이 일반 함수 호출처럼 명확해졌다. slot도 당분간 동작하지만, 신규 코드는 snippet 권장이며 레거시와 룬을 한 컴포넌트에서 섞지 않는 것이 안전하다.',
        api: 'snippet',
        child: { name: 'List.svelte (Svelte 5)', slots: [
          { key: 'row', label: 'snippet row(item)', filled: true },
          { key: 'children', label: 'children prop', filled: true },
        ] },
        parentContent: [
          { target: 'row', text: '@render row(item)' },
          { target: 'children', text: '@render children()' },
        ],
        alert: { tone: 'good', text: 'Svelte 5: slot → snippet + {@render}. 기본 slot → children prop. 인자 전달이 함수 호출처럼 명확.' },
        code: {
          lang: 'html',
          filename: 'List.svelte (Svelte 5 runes)',
          lines: [
            '<!-- List.svelte — Svelte 5 snippet 방식 -->',
            '<script lang="ts">',
            '  // Snippet 타입으로 조각을 props 로 받는다',
            '  import type { Snippet } from "svelte";',
            '',
            '  let {',
            '    items = [],',
            '    row,           // 각 행을 그리는 snippet',

            '    items: { name: string }[];',
            '    row: Snippet<[{ name: string }]>;',
            '    children?: Snippet;',
            '  } = $props();',
            '<\/script>',
            '',
            '{@render children?.()}',
            '',
            '<ul>',
            '  {#each items as item}',
            '    <!-- snippet 을 인자와 함께 호출 -->',
            '    <li>{@render row(item)}</li>',
            '  {/each}',
            '</ul>',
            '',

            '',
            '<!-- App.svelte — snippet 정의 후 전달 -->',
            '<List {items}>',
            '  <p>주문 목록</p>              <!-- children -->',
            '',
            '  <!-- 이름난 snippet: row 로 전달됨 -->',
            '  {#snippet row(item)}',
            '    <strong>{item.name}</strong>',
            '  {/snippet}',
            '</List>',
            '',
            '<!-- 마이그레이션: slot → snippet/{@render},',
            '     let:x → snippet 인자. 한 파일에 룬/레거시 혼용 금지 -->',
          ],
          highlight: [7, 8, 9, 12, 17, 21, 22, 29, 32, 33, 34],
        },
      },
    ];

    const API_BADGE = {
      basic:     { label: '기본 slot', color: '#FF3E00' },
      named:     { label: 'named slot', color: '#EA580C' },
      slotprops: { label: 'slot props', color: '#F59E0B' },
      pattern:   { label: '합성 패턴', color: '#6366F1' },
      snippet:   { label: 'Svelte 5 snippet', color: '#9A3412' },
    };

    const SLOT_COLOR = {
      header: '#EA580C', footer: '#EA580C', default: '#FF3E00',
      nav: '#6366F1', aside: '#6366F1', empty: '#94A3B8',
      row: '#9A3412', children: '#FF3E00',
    };

    function SlotSocket({ slot, content, animKey }) {
      const color = SLOT_COLOR[slot.key] || '#FF3E00';
      const filled = slot.filled && content;
      return (
        <div className="rounded-lg border-2 border-dashed p-2" style={{ borderColor: color, backgroundColor: '#FFF7ED' }}>
          <div className="flex items-center gap-1.5 mb-1">
            <span className="w-2 h-2 rounded-full" style={{ backgroundColor: color }}></span>
            <span className="text-[10px] font-mono font-bold" style={{ color: '#9A3412' }}>{slot.label}</span>
          </div>
          {filled ? (
            <div
              key={animKey + slot.key}
              className="slot-flow rounded border bg-white px-2 py-1 text-[11px] font-medium text-slate-700"
              style={{ borderColor: color }}
            >
              📦 {content.text}
            </div>
          ) : (
            <div className="rounded border border-dashed bg-white/60 px-2 py-1 text-[10px] italic text-slate-400">
              (부모가 안 채우면 fallback 표시)
            </div>
          )}
        </div>
      );
    }

    function LiveDataPane({ state, animKey }) {
      const badge = API_BADGE[state.api] || API_BADGE.basic;
      const findContent = (key) => (state.parentContent || []).find((c) => c.target === key);
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>합성 — 부모 콘텐츠가 자식 slot 자리로</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          {/* 부모 콘텐츠 팔레트 */}
          <div className="rounded-lg border p-2 mb-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
            <div className="text-[10px] font-bold text-amber-700 mb-1">부모(App.svelte)가 넘기는 콘텐츠</div>
            <div className="flex flex-wrap gap-1.5">
              {(state.parentContent || []).map((c) => (
                <span key={c.target} className="text-[10px] font-mono bg-white border border-amber-300 rounded px-1.5 py-0.5 text-amber-900">
                  slot="{c.target === 'default' ? '(기본)' : c.target}"
                </span>
              ))}
            </div>
          </div>

          <div className="text-center text-[16px] leading-none" style={{ color: '#FF3E00' }}>↓ 끼워 넣기</div>

          {/* 자식 컴포넌트 (slot 자리 보유) */}
          <div className="rounded-lg border-2 overflow-hidden mt-2 flex-1" style={{ borderColor: '#FF3E00' }}>
            <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
              <span>🔥</span>
              <span>{state.child.name}</span>
              <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">자식 = 껍데기</span>
            </div>
            <div className="p-3 space-y-2 bg-orange-50">
              {state.child.slots.map((slot) => (
                <SlotSocket key={slot.key} slot={slot} content={findContent(slot.key)} animKey={animKey} />
              ))}
            </div>
          </div>

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded text-white" style={{ backgroundColor: '#9A3412' }}>Part II. 컴포넌트 패턴</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded border" style={{ color: '#9A3412', borderColor: '#FED7AA', backgroundColor: '#FFF7ED' }}>II-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>slot — default / named / slot props</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>컴포넌트에 내용을 끼워 넣는 합성, 그리고 Svelte 5의 snippet</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} animKey={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                slot은 "자식은 껍데기, 부모가 내용"으로 합성한다. 기본 slot(=children), name 속성으로 여러 자리 분배, slot 태그 안 기본값은 fallback, slot props는 자식이 부모로 데이터를 올려보내 부모가 let: 으로 받는다. Svelte 5는 이 모든 것을 snippet과 render 호출로 대체해 인자 전달을 함수처럼 명확하게 만들었다. 신규 코드는 snippet 권장, 한 파일에 레거시와 룬을 섞지 말 것.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['slot', 'named-slot', 'slot-props', 'fallback', 'children', 'snippet', 'render', 'composition', 'Svelte5'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
