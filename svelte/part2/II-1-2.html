<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Svelte 학습 — II-1-2. 이벤트 — dispatcher / 콜백 props</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔥</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    .svelte-brand { color: #FF3E00; }
    .svelte-bg { background-color: #FF3E00; }
    .svelte-border { border-color: #FF3E00; }
    @keyframes rise {
      0%   { transform: translateY(0);     opacity: 0.2; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(-104px); opacity: 0.2; }

    .packet-rise { animation: rise 1.8s ease-in-out infinite; }
  </style>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Svelte II-1-2 — 이벤트: dispatcher / 콜백 props
    비유: "택배 반송" — 부모가 준 물건(props)은 아래로, 자식이 부모에게 보내는 신호는 위로
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. 방향 문제 — props는 아래로, 이벤트는 위로',
        desc: 'props는 부모에서 자식으로만 흐른다. 그럼 자식이 "버튼 눌렸어요" 같은 신호를 부모에게 올려보내려면? 자식이 부모 상태를 직접 바꾸면 데이터 흐름이 엉킨다. 그래서 자식은 "알림"만 위로 쏘고, 실제 처리(핸들러)는 부모가 한다. 이 상향 소통을 구현하는 방식이 전통의 createEventDispatcher와 Svelte 5의 콜백 props다.',
        api: 'flow',
        flow: { mode: 'idle', method: 'dispatch', payloadLabel: 'click', handlerRan: false },
        alert: { tone: 'info', text: '데이터는 아래로(props), 알림은 위로(event/callback). 자식이 부모 상태를 직접 만지지 않는다.' },
        code: {
          lang: 'xml',
          filename: 'Parent.svelte',
          lines: [
            '<!-- 부모가 자식에게 주는 것 vs 자식이 부모에게 올리는 것 -->',
            '<script>',
            '  import Child from "./Child.svelte";',
            '',
            '  let count = 0;              // 부모가 소유한 상태',
            '',
            '  function handleClick() {   // 자식의 신호를 받아 처리',
            '    count += 1;',
            '  }',
            '<\/script>',
            '',
            '<!-- label={...} 은 아래로(props)',
            '     on:notify / onNotify 는 위로(이벤트/콜백) -->',
            '<Child label="눌러줘" on:notify={handleClick} />',
            '',
            '<p>부모가 센 횟수: {count}</p>',
            '',
            '<!-- 핵심: 자식은 count 를 직접 못 바꾼다.',
            '     "눌렸다"는 사실만 위로 알리고, 계산은 부모가 한다. -->',
          ],
          highlight: [5, 7, 8, 9, 14, 18, 19],
        },
      },
      {
        title: 'Step 2. 전통 방식 — createEventDispatcher',
        desc: 'Svelte 4의 표준이다. 자식에서 createEventDispatcher()로 dispatch 함수를 만들고, dispatch("notify", 데이터)로 커스텀 이벤트를 쏜다. 두 번째 인자로 넘긴 데이터는 부모에서 event.detail로 받는다. 부모는 on:notify={handler}로 수신한다. 이벤트명은 문자열이라 오타가 나도 컴파일러가 못 잡는다 — 이게 나중에 함정이 된다.',
        api: 'dispatch',
        flow: { mode: 'run', method: 'dispatch', payloadLabel: 'detail: { id: 7 }', handlerRan: true },
        alert: { tone: 'info', text: 'dispatch("notify", data) → 부모는 on:notify={h}, 데이터는 e.detail. 이벤트명은 문자열(오타 위험).' },
        code: {
          lang: 'xml',
          filename: 'Child.svelte',
          lines: [
            '<!-- Svelte 4 전통: createEventDispatcher -->',
            '<script>',
            '  import { createEventDispatcher } from "svelte";',
            '',
            '  export let label;',
            '  const dispatch = createEventDispatcher();',
            '',
            '  let id = 7;',
            '',
            '  function onButton() {',
            '    // 커스텀 이벤트 "notify" 를 위로 발생',
            '    // 두 번째 인자가 event.detail 로 전달된다',
            '    dispatch("notify", { id });',
            '  }',
            '<\/script>',
            '',
            '<button on:click={onButton}>{label}</button>',
            '',
            '<!-- 부모 쪽 수신',
            '  <Child on:notify={(e) => console.log(e.detail.id)} />',
            '',
            '  주의: "notify" 는 문자열 → 오타가 나도',
            '  컴파일 에러가 아니라 "조용히 아무 일도 안 일어남" -->',
          ],
          highlight: [3, 6, 11, 12, 13, 17, 20],
        },
      },
      {
        title: 'Step 3. DOM 이벤트 수식어(modifier)와 이벤트 포워딩',
        desc: 'on:click 뒤에 |modifier를 붙이면 자주 쓰는 처리를 선언적으로 끝낸다. on:submit|preventDefault는 event.preventDefault() 호출을 대신하고, on:click|once는 한 번만, on:click|stopPropagation은 버블링을 막는다. 값 없이 on:click만 쓰면(핸들러 생략) 그 DOM 이벤트를 부모로 그대로 포워딩한다 — 래퍼 컴포넌트에서 유용하다. (수식어는 Svelte 4 문법이며, 룬 모드에서는 뒤 STEP의 방식으로 대체된다.)',
        api: 'modifier',
        flow: { mode: 'run', method: 'forward', payloadLabel: 'preventDefault · forward', handlerRan: true },
        alert: { tone: 'warn', text: 'on:submit|preventDefault, on:click|once/stopPropagation. 핸들러 없는 on:click 은 부모로 포워딩.' },
        code: {
          lang: 'xml',
          filename: 'Form.svelte',
          lines: [
            '<script>',
            '  function save() {',
            '    console.log("저장!");',
            '  }',
            '<\/script>',
            '',
            '<!-- |preventDefault : e.preventDefault() 자동 호출',
            '     |once           : 한 번만 실행 후 해제',
            '     |stopPropagation: 버블링 중단 -->',
            '<form on:submit|preventDefault={save}>',
            '  <input placeholder="이름" />',
            '  <button type="submit">저장</button>',
            '</form>',
            '',
            '<!-- 이벤트 포워딩: 값 없이 on:click 만 쓰면',
            '     이 컴포넌트가 받은 click 을 부모로 그대로 전달 -->',
            '<!-- FancyButton.svelte 안에서 -->',
            '<button on:click>',
            '  <slot />',
            '</button>',
            '',
            '<!-- 부모: <FancyButton on:click={save} /> 로 바로 수신 -->',
          ],
          highlight: [7, 8, 9, 10, 15, 16, 18, 19, 20],
        },
      },
      {
        title: 'Step 4. Svelte 5 권장 — 콜백 props',
        desc: 'Svelte 5 룬 모드에서는 createEventDispatcher가 사실상 폐기(deprecated) 방향이다. 대신 부모가 함수를 props로 내려주고, 자식이 그 함수를 호출한다. onNotify 같은 함수를 $props()로 받아 자식에서 onNotify({ id })로 부른다. 장점: 이벤트명이 문자열이 아니라 실제 변수 → 오타를 타입스크립트가 잡는다. 데이터도 e.detail 껍데기 없이 인자로 바로 온다.',
        api: 'callback',
        flow: { mode: 'run', method: 'callback', payloadLabel: 'onNotify({ id: 7 })', handlerRan: true },
        alert: { tone: 'good', text: '룬 모드 표준: 함수를 props로 전달 → 자식이 호출. 타입 안전, e.detail 껍데기 없음.' },
        code: {
          lang: 'xml',
          filename: 'Child5.svelte',
          lines: [
            '<!-- Svelte 5 룬 모드: 콜백 props -->',
            '<script lang="ts">',
            '  // 부모가 내려준 함수를 props 로 받는다',
            '  let { label, onNotify } = $props();',
            '',
            '  let id = 7;',
            '',
            '  function onButton() {',
            '    // 이벤트 대신 그냥 함수 호출',
            '    onNotify?.({ id });   // ?. 로 미전달 대비',
            '  }',
            '<\/script>',
            '',
            '<button onclick={onButton}>{label}</button>',
            '',
            '<!-- 부모 (Parent5.svelte)',
            '  <script lang="ts">',
            '    import Child5 from "./Child5.svelte";',
            '    let count = 0;',
            '    const handle = (p) => count += p.id;  // p 는 인자로 직접',
            '  <\/script>',
            '',
            '  <Child5 label="눌러줘" onNotify={handle} />',
            '',
            '  이점: onNotify 는 진짜 변수 → 오타 시 컴파일 에러 -->',
          ],
          highlight: [2, 4, 8, 10, 14, 19, 23, 25],
        },
      },
      {
        title: 'Step 5. dispatcher vs 콜백 — 언제 무엇을',
        desc: '둘은 목적이 같고 문법이 다르다. Svelte 4 코드베이스거나 여러 리스너가 한 이벤트를 동시에 들어야 하면 dispatcher가 자연스럽다. 신규 Svelte 5 룬 프로젝트, 타입 안전이 중요한 곳, 데이터를 인자로 깔끔히 넘기고 싶은 곳은 콜백 props가 표준이다. 실무 함정: (1) 룬 모드에서 dispatcher 습관적 사용 금지, (2) 이벤트명 문자열 오타, (3) e.detail 구조를 부모/자식이 서로 다르게 가정.',
        api: 'compare',
        flow: { mode: 'run', method: 'callback', payloadLabel: '표준 = 콜백 props', handlerRan: true },
        alert: { tone: 'good', text: '신규(Svelte 5)=콜백 props 표준. 다중 리스너/기존 Svelte 4 코드=dispatcher. 룬 모드 dispatcher 습관 주의.' },
        code: {
          lang: 'markdown',
          filename: 'events-cheatsheet.md',
          lines: [
            '# 자식 → 부모 소통: dispatcher vs 콜백 props',
            '',
            '## createEventDispatcher (Svelte 4 전통)',
            '```svelte',
            '<!-- child --><script>',
            '  import { createEventDispatcher } from "svelte";',
            '  const dispatch = createEventDispatcher();',
            '<\/script>',
            '<button on:click={() => dispatch("save", { id: 7 })} />',
            '<!-- parent -->',
            '<Child on:save={(e) => save(e.detail.id)} />',
            '```',
            '',
            '## 콜백 props (Svelte 5 룬, 권장)',
            '```svelte',
            '<!-- child --><script>',
            '  let { onSave } = $props();',
            '<\/script>',
            '<button onclick={() => onSave({ id: 7 })} />',
            '<!-- parent -->',
            '<Child onSave={(p) => save(p.id)} />',
            '```',
            '',
            '## 비교표',
            '| 항목 | dispatcher | 콜백 props |',
            '|:--|:--|:--|',
            '| 버전 | Svelte 4 표준 | Svelte 5 표준(권장) |',
            '| 이벤트명 | 문자열(오타 위험) | 변수(타입 안전) |',
            '| 데이터 | e.detail | 인자로 직접 |',
            '| 다중 리스너 | 쉬움 | 배열/합성 필요 |',
            '| DOM 이벤트 | on:click | onclick |',
            '',
            '## 실무 함정',
            '- 룬 모드에서 dispatcher 를 습관적으로 쓰지 말 것',
            '- 이벤트/콜백 이름 규칙: onXxx (예: onSave, onNotify)',
            '- e.detail 구조를 부모/자식이 다르게 가정하면 런타임 버그',
            '- 콜백은 optional 일 수 있으니 onSave?.() 로 방어',
          ],
          highlight: [5, 6, 7, 9, 11, 16, 17, 19, 21, 27, 28, 29],
        },
      },
    ];

    const API_BADGE = {
      flow:     { label: '상향 흐름', color: '#FF3E00' },
      dispatch: { label: 'dispatcher', color: '#F59E0B' },
      modifier: { label: 'modifier', color: '#6366F1' },
      callback: { label: '콜백 props', color: '#FF3E00' },
      compare:  { label: '비교', color: '#9A3412' },
    };

    const METHOD_LABEL = {
      dispatch: 'dispatch("notify", data)',
      forward:  'on:click (포워딩)',
      callback: 'onNotify(data)',
    };

    function FlowDiagram({ flow }) {
      const running = flow.mode === 'run';
      const isCallback = flow.method === 'callback';
      const arrowColor = isCallback ? '#FF3E00' : '#F59E0B';
      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>자식 → 부모 상향 소통</span>
            <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{METHOD_LABEL[flow.method] || 'signal'}</span>
          </div>
          <div className="p-4 bg-orange-50">
            {/* 부모 (위) */}
            <div className="rounded-lg border-2 px-3 py-2 text-center" style={{ borderColor: '#9A3412', backgroundColor: flow.handlerRan && running ? '#FFEDD5' : '#FFFFFF' }}>
              <div className="text-[11px] font-bold" style={{ color: '#9A3412' }}>Parent.svelte</div>
              <div className="text-[10px] mt-0.5" style={{ color: '#7C2D12' }}>
                핸들러 실행 {flow.handlerRan && running ? '✅ count += 1' : '… 대기'}
              </div>
            </div>

            {/* 상향 화살표 통로 */}
            <div className="relative h-28 my-1 flex items-center justify-center">
              <div className="absolute inset-y-0 w-0.5" style={{ backgroundColor: '#FED7AA' }}></div>
              <div className="absolute left-1/2 -translate-x-1/2 text-lg" style={{ color: arrowColor, top: 0 }}>▲</div>
              {running && (
                <div
                  className="packet-rise absolute px-2 py-0.5 rounded text-[10px] font-mono text-white shadow"
                  style={{ backgroundColor: arrowColor, bottom: 8 }}
                >
                  {flow.payloadLabel}
                </div>
              )}
              {!running && (
                <div className="absolute px-2 py-0.5 rounded text-[10px] font-mono" style={{ color: '#9A3412', backgroundColor: '#FFF7ED', border: '1px solid #FED7AA' }}>
                  {flow.payloadLabel}
                </div>
              )}
              <div className="absolute -right-1 top-1/2 -translate-y-1/2 text-[9px] px-1.5 py-0.5 rounded" style={{ color: arrowColor, border: `1px solid ${arrowColor}` }}>
                {isCallback ? '콜백' : '이벤트'}
              </div>
            </div>

            {/* 자식 (아래) */}
            <div className="rounded-lg border-2 px-3 py-2 text-center" style={{ borderColor: '#FF3E00', backgroundColor: '#FFFFFF' }}>
              <div className="text-[11px] font-bold" style={{ color: '#9A3412' }}>Child.svelte</div>
              <div className="text-[10px] mt-0.5" style={{ color: '#7C2D12' }}>버튼 클릭 → 신호 발생</div>
            </div>
          </div>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const badge = API_BADGE[state.api] || API_BADGE.flow;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>이벤트 흐름 — 자식에서 부모로</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <FlowDiagram flow={state.flow} />

          {state.api === 'compare' && (
            <div className="mt-3 grid grid-cols-2 gap-2">
              <div className="rounded-lg border p-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
                <div className="text-[10px] font-bold text-amber-700">dispatcher (Svelte 4)</div>
                <div className="text-[10px] text-amber-900 mt-1">on:notify · e.detail</div>
                <div className="text-[10px] text-amber-900">문자열 이벤트명</div>
              </div>
              <div className="rounded-lg border p-2" style={{ borderColor: '#FF3E00', backgroundColor: '#FFF7ED' }}>
                <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>콜백 props (Svelte 5)</div>
                <div className="text-[10px] mt-1" style={{ color: '#7C2D12' }}>onNotify · 인자 직접</div>
                <div className="text-[10px]" style={{ color: '#7C2D12' }}>타입 안전(권장)</div>
              </div>
            </div>
          )}

          {state.api === 'modifier' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#C7D2FE', backgroundColor: '#EEF2FF' }}>
              <div className="text-[10px] font-bold text-indigo-700 mb-1">자주 쓰는 수식어</div>
              <div className="text-[10px] text-indigo-900">on:submit|preventDefault → 기본 동작 차단</div>
              <div className="text-[10px] text-indigo-900">on:click|once → 1회만</div>
              <div className="text-[10px] text-indigo-900">on:click|stopPropagation → 버블링 중단</div>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{ backgroundColor: '#9A3412' }}>Part II. 컴포넌트 패턴</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full border font-mono" style={{ color: '#9A3412', borderColor: '#FED7AA', backgroundColor: '#FFF7ED' }}>II-1-2</span>
                </div>
                <h1 className="text-2xl font-bold mt-1" style={{ color: '#9A3412' }}>이벤트 — dispatcher / 콜백 props</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>자식에서 부모로 소통, 이벤트와 콜백 두 방식</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                자식에서 부모로의 소통은 두 방식이다. Svelte 4는 createEventDispatcher로 커스텀 이벤트를 쏘고 부모가 on:event로 받아 e.detail을 읽는다. Svelte 5 룬 모드 표준은 콜백 props — 함수를 props로 내려 자식이 호출하며 타입 안전하고 데이터가 인자로 바로 온다. 신규 프로젝트는 콜백 props, 기존 Svelte 4·다중 리스너는 dispatcher. 다음 챕터에서 상태 공유 패턴으로 넘어간다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'events', 'createEventDispatcher', 'callback-props', 'event.detail', 'on:click', 'modifier', 'forwarding', '$props'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
