<!DOCTYPE html>

<body>
  <div id="root"></div>

  <!--
    Svelte II-1-1 — props: export let vs $props rune
    비유: "택배 상자" — 부모가 자식에게 상자(props)를 내려보낸다. 자식은 상자를 열어 쓰되, 상자에 낙서(직접 변경)하면 안 된다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. props란? — 부모가 자식에게 내려보내는 데이터',
        desc: 'props(properties)는 부모 컴포넌트가 자식에게 넘겨주는 값이다. React의 props, Vue의 props와 같은 개념이다. 부모가 자식 태그에 속성처럼 name="주니어" 를 붙이면, 자식은 그 값을 받아 화면에 쓴다. 핵심은 "방향"이다 — 데이터는 항상 부모에서 자식으로 흐른다(단방향). 자식이 받은 값을 마음대로 바꿔 부모로 되돌릴 수는 없다.',
        parent: '주니어',
        childReceives: '주니어',
        api: 'concept',
        flow: true,
        alert: { tone: 'info', text: 'props = 부모 → 자식 단방향 데이터 전달. 자식은 받아서 쓰기만, 소유권은 부모에게.' },
        code: {
          lang: 'html',
          filename: 'App.svelte',
          lines: [
            '<!-- 부모 컴포넌트: 자식에게 props를 내려보낸다 -->',
            '<script>',
            '  import Hello from "./Hello.svelte";',
            '  let userName = "주니어";',
            '<\/script>',
            '',
            '<!-- name 속성으로 값을 자식에게 전달 -->',
            '<Hello name={userName} />',
            '',
            '<!-- 단축 문법: 변수명 = 속성명 이면 {userName} 만 -->',
            '<!-- <Hello {userName} />  ← 속성 이름도 userName 이 된다 -->',
            '',
            '<!-- 데이터 흐름',
            '  부모(userName="주니어")',
            '        │  props 로 전달',
            '        ▼',
            '  자식(name 으로 받음) → 화면에 "주니어"',
            '  ※ 자식이 name 을 바꿔도 부모 userName 은 안 변한다',
            '-->',
          ],
          highlight: [1, 2, 3, 4, 5, 8],
        },
      },
      {
        title: 'Step 2. 전통 방식 — export let (Svelte 4)',
        desc: 'Svelte 4까지의 표준은 export let 이다. 자식 컴포넌트의 script 안에서 export let name 이라고 선언하면, 그 변수가 "부모에게서 받는 props"가 된다. export 키워드지만 모듈을 내보내는 게 아니라 "이 변수는 밖(부모)에서 주입받는다"는 표시다. = 뒤에 기본값을 주면 부모가 값을 안 넘겼을 때 그 값이 쓰인다. 기본값이 없으면 필수는 아니지만 undefined 로 들어온다.',
        parent: '주니어',
        childReceives: '주니어',
        api: 'legacy',
        flow: true,
        alert: { tone: 'info', text: 'Svelte 4: export let name = "기본값". export 는 "밖에서 주입받음" 표시일 뿐, 모듈 export 아님.' },
        code: {
          lang: 'html',
          filename: 'Hello.svelte (Svelte 4)',
          lines: [
            '<!-- 자식 컴포넌트: export let 으로 props 선언 -->',
            '<script>',
            '  // 부모가 넘긴 name 을 받는다',
            '  export let name;',
            '',
            '  // 기본값: 부모가 안 넘기면 "게스트"',
            '  export let greeting = "안녕";',
            '',
            '  // 안 넘겨도 되는 선택 props',
            '  export let emoji = "👋";',
            '<\/script>',
            '',
            '<p>{greeting}, {name}! {emoji}</p>',
            '',
            '<!-- 부모 사용 예',
            '  <Hello name="주니어" />',
            '     → "안녕, 주니어! 👋"  (greeting/emoji 는 기본값)',
            '  <Hello name="시니어" greeting="반가워" emoji="🔥" />',
            '     → "반가워, 시니어! 🔥"',
            '-->',
          ],
          highlight: [2, 3, 4, 6, 7, 9, 10, 11, 13],
        },
      },
      {
        title: 'Step 3. Svelte 5 룬 방식 — $props()',
        desc: 'Svelte 5의 표준은 $props() 룬이다. let { name } = $props() 처럼 한 번에 구조 분해로 받는다. 여러 props를 한 객체에서 꺼내므로 "이 컴포넌트가 받는 props 목록"이 한 줄에 모여 보기 좋다. 기본값은 구조 분해 기본값 문법(= "안녕")으로 준다. 나머지를 한꺼번에 받는 rest 문법(...rest)도 그대로 쓸 수 있어, 받지 않은 속성을 다시 하위 요소로 넘길 때 유용하다.',
        parent: '주니어',
        childReceives: '주니어',
        api: 'runes',
        flow: true,
        alert: { tone: 'good', text: 'Svelte 5: let { name, greeting = "안녕", ...rest } = $props(). 받는 props가 한 줄에 모여 명시적.' },
        code: {
          lang: 'html',
          filename: 'Hello.svelte (Svelte 5)',
          lines: [
            '<!-- 자식 컴포넌트: $props() 룬으로 한 번에 구조 분해 -->',
            '<script>',
            '  // 기본값은 구조 분해 기본값으로 지정',
            '  let {',
            '    name,',
            '    greeting = "안녕",',
            '    emoji = "👋",',
            '    ...rest            // 나머지 속성 모으기',
            '  } = $props();',
            '<\/script>',
            '',
            '<p>{greeting}, {name}! {emoji}</p>',
            '',
            '<!-- rest 는 하위 요소로 그대로 넘길 때 유용',
            '  <button {...rest}>버튼</button> -->',
            '',
            '<!-- export let (Svelte 4) 와 비교',
            '  · Svelte 4: export let name; export let greeting = "안녕";',
            '  · Svelte 5: let { name, greeting = "안녕" } = $props();',
            '  → 받는 props 가 한 곳에 모여 가독성이 좋다',
            '-->',
          ],
          highlight: [2, 3, 4, 5, 6, 7, 8, 9, 10, 12],
        },
      },
      {
        title: 'Step 4. 반응형 props — 부모가 바꾸면 자식이 다시 그려진다',
        desc: 'props는 정적인 초기값이 아니라 반응형이다. 부모의 상태가 바뀌어 자식에게 넘기는 값이 변하면, 자식은 자동으로 다시 렌더링되어 새 값을 보여준다. 이 "부모 변경 → 자식 갱신"이 단방향 흐름의 핵심 이점이다. 반대로 자식이 받은 props를 직접 바꾸는 것은 안티패턴이다 — Svelte 5는 props를 재할당하면 경고를 내고, 부모가 다음에 렌더링하면 그 변경이 덮어써진다. 값을 바꾸고 싶으면 부모에게 이벤트/콜백으로 알려야 한다.',
        parent: '시니어',
        childReceives: '시니어',
        api: 'reactive',
        flow: true,
        alert: { tone: 'warn', text: '자식이 props 를 직접 재할당하면 경고 + 부모 리렌더 시 덮어써짐. 바꾸려면 부모에게 콜백으로 알린다.' },
        code: {
          lang: 'html',
          filename: 'ReactiveProps.svelte',
          lines: [
            '<!-- 부모: 상태를 바꾸면 자식 props 도 따라 바뀐다 -->',
            '<script>',
            '  import Badge from "./Badge.svelte";',
            '  let level = $state("주니어");',
            '<\/script>',
            '',
            '<button onclick={() => level = "시니어"}>승급</button>',
            '',
            '<!-- level 이 바뀌면 Badge 가 자동으로 다시 그려진다 -->',
            '<Badge role={level} />',
            '',
            '<!-- ---- 자식 Badge.svelte ---- -->',
            '<script>',
            '  let { role } = $props();',
            '',
            '  // ❌ 안티패턴: props 직접 변경 (경고 발생)',
            '  // function bad() { role = "관리자"; }',
            '  //   → 부모가 다시 렌더링하면 덮어써진다',
            '<\/script>',
            '',
            '<span class="badge">{role}</span>',
          ],
          highlight: [3, 4, 7, 10, 13, 14, 16, 17, 18],
        },
      },
      {
        title: 'Step 5. bind: 양방향 예외 — 자식이 부모 값을 바꿔야 할 때',
        desc: '단방향이 원칙이지만, 폼 입력처럼 자식이 값을 부모로 되돌려야 하는 경우가 있다. 이때 Svelte는 bind: 를 제공한다. 자식이 $props() 대신 $bindable() 로 선언한 props는 부모가 bind:value 로 묶으면 양방향이 된다. 자식이 그 값을 바꾸면 부모 변수도 함께 바뀐다. 강력하지만 데이터 흐름을 흐리므로 정말 필요한 경우(입력 컴포넌트 등)에만 쓴다. 나머지는 콜백 props(onChange 등)로 부모에게 알리는 편이 추적하기 쉽다.',
        parent: '홍길동',
        childReceives: '홍길동',
        api: 'bind',
        flow: true,
        alert: { tone: 'good', text: '양방향은 $bindable() + bind: 로 명시적으로. 남용 금지 — 폼/입력 컴포넌트 등 꼭 필요할 때만.' },
        code: {
          lang: 'html',
          filename: 'TwoWay.svelte',
          lines: [
            '<!-- 부모: bind:value 로 자식과 양방향 연결 -->',
            '<script lang="ts">',
            '  import TextInput from "./TextInput.svelte";',
            '  let value = $state("홍길동");',
            '<\/script>',
            '',
            '<TextInput bind:value={value} />',
            '<p>부모가 보는 값: {value}</p>',
            '',
            '<!-- ---- 자식 TextInput.svelte ---- -->',
            '<script lang="ts">',
            '  // 타입 + $bindable 로 "양방향 허용" 명시',
            '  let { value = $bindable("") }: { value?: string } = $props();',
            '<\/script>',
            '',
            '<!-- 자식이 입력하면 부모 value 도 함께 바뀐다 -->',
            '<input bind:value={value} />',
            '',
            '<!-- 필수 props 누락·혼용 함정 정리',
            '  · export let 과 $props() 를 한 파일에서 혼용 금지',
            '  · 타입에서 필수(name: string)인데 부모가 누락 → TS 에러',
            '  · 양방향 남용 금지: 대부분은 콜백 props(onSave) 로 충분',
            '-->',
          ],
          highlight: [2, 3, 4, 7, 8, 11, 12, 13, 14, 17],
        },
      },
    ];

    const API_BADGE = {
      concept: { label: 'props 개념', color: '#FF3E00' },
      legacy:  { label: 'export let', color: '#F59E0B' },
      runes:   { label: '$props rune', color: '#9A3412' },
      reactive:{ label: '반응형 props', color: '#6366F1' },
      bind:    { label: 'bind: 양방향', color: '#059669' },
    };

    function FlowDiagram({ state, animKey }) {
      const isTwoWay = state.api === 'bind';
      return (
        <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
          <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
            <span>🔥</span>
            <span>데이터 흐름 (부모 → 자식)</span>
            <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{isTwoWay ? 'bind: 양방향' : '단방향'}</span>
          </div>
          <div className="p-4 bg-orange-50 flex flex-col items-center gap-1">
            <div className="w-full rounded-lg border-2 bg-white px-3 py-2 text-center pulse-glow" style={{ borderColor: '#9A3412' }} key={'p' + animKey}>
              <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>부모 컴포넌트 (Parent)</div>
              <div className="text-[11px] font-mono mt-0.5" style={{ color: '#7C2D12' }}>let userName = "{state.parent}"</div>
            </div>

            <div className="flex flex-col items-center text-[10px]" style={{ color: '#FF3E00' }}>
              <span className="font-mono">{'name={userName}'}</span>
              <span className="text-lg leading-none">↓</span>
              <span>props 전달</span>
              {isTwoWay && (
                <span className="text-[10px] mt-0.5" style={{ color: '#059669' }}>↑ bind: 로 값 되돌림</span>
              )}
            </div>

            <div className="w-full rounded-lg border-2 bg-white px-3 py-2 text-center flow-anim" style={{ borderColor: '#FF3E00' }} key={'c' + animKey}>
              <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>자식 컴포넌트 (Child)</div>
              <div className="text-[11px] font-mono mt-0.5" style={{ color: '#7C2D12' }}>받은 값: "{state.childReceives}"</div>
            </div>
          </div>
        </div>
      );
    }

    function CompareTable() {
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border p-2" style={{ borderColor: '#FCD34D', backgroundColor: '#FFFBEB' }}>
            <div className="text-[10px] font-bold text-amber-700">Svelte 4 — export let</div>
            <div className="text-[10px] text-amber-900 mt-1 font-mono">export let name;</div>
            <div className="text-[10px] text-amber-900 font-mono">export let x = 1;</div>
          </div>
          <div className="rounded-lg border p-2" style={{ borderColor: '#FF3E00', backgroundColor: '#FFF7ED' }}>
            <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>Svelte 5 — $props()</div>
            <div className="text-[10px] mt-1 font-mono" style={{ color: '#7C2D12' }}>let {'{ name, x = 1 }'}</div>
            <div className="text-[10px] font-mono" style={{ color: '#7C2D12' }}>= $props();</div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state, animKey }) {
      const badge = API_BADGE[state.api] || API_BADGE.concept;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>props 전달 — 부모에서 자식으로</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <FlowDiagram state={state} animKey={animKey} />

          {(state.api === 'legacy' || state.api === 'runes') && <CompareTable />}

          {state.api === 'reactive' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#C7D2FE', backgroundColor: '#EEF2FF' }}>
              <div className="text-[10px] font-bold text-indigo-700 mb-1">부모 변경 → 자식 자동 갱신</div>
              <div className="text-[10px] text-indigo-900">✅ 부모 상태 변경 시 자식 리렌더</div>
              <div className="text-[10px] text-indigo-900">❌ 자식이 props 직접 재할당 (경고)</div>
            </div>
          )}

          {state.api === 'bind' && (
            <div className="mt-3 rounded-lg border p-2" style={{ borderColor: '#6EE7B7', backgroundColor: '#ECFDF5' }}>
              <div className="text-[10px] font-bold text-emerald-700 mb-1">양방향은 예외적으로</div>
              <div className="text-[10px] text-emerald-900">✅ $bindable() + bind:value</div>
              <div className="text-[10px] text-emerald-900">권장: 대부분 콜백 props(onSave)로 해결</div>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1 text-white" style={{ backgroundColor: '#9A3412' }}>Part II. 컴포넌트 패턴 · II-1-1</div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>props — export let vs $props rune</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>부모에서 자식으로 데이터 전달, 구버전과 Svelte 5 룬 방식</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} animKey={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                props는 부모에서 자식으로 흐르는 단방향 데이터다. Svelte 4는 export let name, Svelte 5는 let {'{ name }'} = $props()로 구조 분해해 받는다. 기본값·rest·타입을 지원하고, 부모가 값을 바꾸면 자식이 자동 갱신된다. 자식이 props를 직접 바꾸는 건 안티패턴 — 정말 양방향이 필요하면 $bindable() + bind:로 명시하되 남용하지 않는다. 다음 챕터에서 이벤트로 자식이 부모에게 알리는 방법을 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'props', 'export let', '$props', 'rune', '단방향', 'bind', '$bindable', 'rest props', 'TypeScript'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
