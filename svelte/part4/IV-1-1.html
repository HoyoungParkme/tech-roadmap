<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Svelte 학습 — IV-1-1. transition — in / out</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔥</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    .svelte-brand { color: #FF3E00; }
    .svelte-bg { background-color: #FF3E00; }
    .svelte-border { border-color: #FF3E00; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    Svelte IV-1-1 — transition — in / out
    비유: "무대의 등장·퇴장 연출" — 배우(요소)가 갑자기 튀어나오지 않고
    조명과 함께 걸어 들어오고(in), 서서히 페이드아웃하며 나간다(out).
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 트랜지션별 "숨김/보임" 상태 스타일 — React로 Svelte 트랜지션을 재현
    const TRANSITIONS = {
      fade:  { hidden: { opacity: 0 }, shown: { opacity: 1 } },
      fly:   { hidden: { opacity: 0, transform: 'translateX(120px)' }, shown: { opacity: 1, transform: 'translateX(0)' } },
      flyUp: { hidden: { opacity: 0, transform: 'translateY(28px)' }, shown: { opacity: 1, transform: 'translateY(0)' } },
      slide: { hidden: { opacity: 0, transform: 'scaleY(0)' }, shown: { opacity: 1, transform: 'scaleY(1)' } },
      scale: { hidden: { opacity: 0, transform: 'scale(0.55)' }, shown: { opacity: 1, transform: 'scale(1)' } },
      blur:  { hidden: { opacity: 0, filter: 'blur(8px)' }, shown: { opacity: 1, filter: 'blur(0px)' } },
    };

    const STEPS = [
      {
        title: 'Step 1. transition 디렉티브 — 나타남·사라짐을 한 번에',
        desc: '조건부 블록 안의 요소에 transition 디렉티브를 붙이면, 그 요소가 마운트될 때와 언마운트될 때 애니메이션이 자동으로 재생된다. svelte/transition에서 fade를 import 한 뒤 요소에 transition:fade 만 적으면 끝이다. 직접 CSS 클래스를 토글하거나 setTimeout으로 DOM 제거를 미룰 필요가 없다. Svelte 컴파일러가 "언마운트를 애니메이션이 끝날 때까지 지연"시키는 배관을 대신 깔아준다.',
        api: 'fade',
        demo: { inType: 'fade', outType: 'fade', inDur: 400, outDur: 400, label: '알림 배너', accent: '#FF3E00' },
        params: ['transition:fade', '기본 duration 400ms'],
        alert: { tone: 'info', text: 'transition:fade 하나로 등장·퇴장 둘 다 처리. 언마운트 지연은 컴파일러가 담당한다.' },
        code: {
          lang: 'xml',
          filename: 'Toast.svelte',
          lines: [
            '<script>',
            "  import { fade } from 'svelte/transition';",
            '  let visible = true;',
            '<\/script>',
            '',
            '<label>',
            '  <input type="checkbox" bind:checked={visible} />',
            '  배너 보이기',
            '</label>',
            '',
            '<!-- visible 이 true 가 되면 in, false 가 되면 out 재생 -->',
            '{#if visible}',
            '  <p class="toast" transition:fade>',
            '    저장되었습니다',
            '  </p>',
            '{/if}',
            '',
            '<style>',
            '  .toast {',
            '    padding: 12px 16px;',
            '    background: #FFF7ED;',
            '    border: 2px solid #FF3E00;',
            '    border-radius: 8px;',
            '  }',
            '</style>',
            '',
            '<!-- 핵심: transition 은 "조건부 블록"(#if/#each) 안에서만 동작.',
            '     그냥 항상 떠 있는 요소에는 발동할 계기가 없다. -->',
          ],
          highlight: [1, 2, 3, 4, 12, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 2. 내장 트랜지션 & 파라미터 — fly · slide · scale · blur',
        desc: 'svelte/transition은 fade 외에도 fly, slide, scale, blur를 기본 제공한다. 각 트랜지션은 객체 파라미터로 세부 조정한다. duration(재생 시간), delay(시작 지연), easing(가감속 곡선), 그리고 fly의 x·y(이동 거리)까지. easing은 svelte/easing에서 quintOut처럼 가져온다. 파라미터로 "얼마나 멀리서, 얼마나 빠르게, 어떤 리듬으로" 등장할지를 디자인한다.',
        api: 'params',
        demo: { inType: 'flyUp', outType: 'flyUp', inDur: 500, outDur: 400, label: '카드 (fly y:28)', accent: '#9A3412' },
        params: ['y: 28', 'duration: 500', 'delay: 100', 'easing: quintOut'],
        alert: { tone: 'info', text: 'fly는 x·y 이동 + 페이드, slide는 높이 접기, scale는 확대, blur는 흐림. 파라미터로 리듬을 만든다.' },
        code: {
          lang: 'xml',
          filename: 'Panel.svelte',
          lines: [
            '<script>',
            "  import { fly, slide, scale, blur } from 'svelte/transition';",
            "  import { quintOut } from 'svelte/easing';",
            '  let open = true;',
            '<\/script>',
            '',
            '{#if open}',
            '  <!-- 아래에서 위로 28px 이동하며 페이드 -->',
            '  <div',
            '    class="card"',
            '    transition:fly={{ y: 28, duration: 500, delay: 100, easing: quintOut }}',
            '  >',
            '    fly 로 등장하는 카드',
            '  </div>',
            '{/if}',
            '',
            '{#if open}',
            '  <section transition:slide={{ duration: 300 }}>펼침/접힘 (slide)</section>',
            '  <span transition:scale={{ start: 0.6 }}>확대 (scale)</span>',
            '  <img transition:blur={{ amount: 8 }} src="/hero.png" alt="" />',
            '{/if}',
            '',
            '<!-- duration=재생시간, delay=시작 지연, easing=가감속 곡선.',
            "     easing 은 'svelte/easing' 에서 가져온다 (quintOut, cubicInOut...). -->",
          ],
          highlight: [2, 3, 9, 10, 11, 18, 19, 20],
        },
      },
      {
        title: 'Step 3. in: / out: — 들어올 때와 나갈 때를 다르게',
        desc: 'transition은 등장·퇴장에 같은 효과를 쓴다. 하지만 실무에선 "들어올 땐 오른쪽에서 미끄러져 들어오고, 나갈 땐 조용히 페이드아웃"처럼 방향을 다르게 하고 싶을 때가 많다. 이때 transition 대신 in:과 out:을 따로 지정한다. 알림 토스트가 대표 사례다. 눈길을 끌며 등장(fly)하고, 사라질 땐 시선을 뺏지 않게 페이드(fade)로 빠진다.',
        api: 'inout',
        demo: { inType: 'fly', outType: 'fade', inDur: 350, outDur: 300, label: '토스트 (in:fly · out:fade)', accent: '#FF3E00' },
        params: ['in:fly x:200', 'out:fade', 'each key (item.id)'],
        alert: { tone: 'good', text: 'in:fly / out:fade 처럼 등장과 퇴장을 분리. 토스트·모달의 자연스러운 UX 패턴.' },
        code: {
          lang: 'xml',
          filename: 'Notifications.svelte',
          lines: [
            '<script>',
            "  import { fly, fade } from 'svelte/transition';",
            '  let toasts = [];',
            '  let seq = 0;',
            '',
            '  function push(text) {',
            '    toasts = [...toasts, { id: seq++, text }];',
            '  }',
            '  function dismiss(id) {',
            '    toasts = toasts.filter((t) => t.id !== id);',
            '  }',
            '<\/script>',
            '',
            '<!-- key (t.id) 가 있어야 each 항목이 정확히 in/out 된다 -->',
            '{#each toasts as t (t.id)}',
            '  <div',
            '    class="toast"',
            '    in:fly={{ x: 200, duration: 350 }}',
            '    out:fade={{ duration: 300 }}',
            '  >',
            '    {t.text}',
            '    <button on:click={() => dismiss(t.id)}>×</button>',
            '  </div>',
            '{/each}',
            '',
            '<!-- 들어올 땐 오른쪽에서 슬라이드(fly), 나갈 땐 조용히 fade. -->',
          ],
          highlight: [2, 15, 16, 17, 18, 19, 20],
        },
      },
      {
        title: 'Step 4. 블록과의 결합 — {#if} 마운트, {#each} 리스트',
        desc: '트랜지션은 요소가 실제로 마운트·언마운트될 때 발동한다. 그 계기를 만드는 것이 조건부 블록이다. #if 블록은 조건이 바뀔 때 한 요소를, #each 블록은 배열이 바뀔 때 항목들을 넣고 뺀다. #each에 key를 붙이면(항목의 고유 id) 어떤 항목이 추가·삭제됐는지 Svelte가 정확히 추적해 해당 항목만 애니메이션한다. key가 없으면 인덱스 기준이라 엉뚱한 항목이 사라지는 것처럼 보인다.',
        api: 'block',
        demo: { inType: 'flyUp', outType: 'scale', inDur: 400, outDur: 350, label: '리스트 항목 (#each + key)', accent: '#9A3412' },
        params: ['{#if selected}', '{#each rows as r (r.id)}', 'key 필수'],
        alert: { tone: 'warn', text: '#each에 key(고유 id)가 없으면 인덱스 기준이라 엉뚱한 항목이 사라지는 듯 보인다.' },
        code: {
          lang: 'xml',
          filename: 'TodoList.svelte',
          lines: [
            '<script>',
            "  import { fly, scale } from 'svelte/transition';",
            '  let rows = [{ id: 1, name: "우유" }, { id: 2, name: "계란" }];',
            '  let selected = null;',
            '<\/script>',
            '',
            '<!-- #if: 조건이 true 로 바뀌는 순간 마운트 → in 재생 -->',
            '{#if selected}',
            '  <article transition:fly={{ y: 12 }}>',
            '    {selected.name} 상세',
            '  </article>',
            '{/if}',
            '',
            '<!-- #each: key (r.id) 로 추가/삭제된 항목만 정확히 애니메이션 -->',
            '<ul>',
            '  {#each rows as r (r.id)}',
            '    <li in:fly={{ y: 12 }} out:scale={{ start: 0.6 }}>',
            '      {r.name}',
            '    </li>',
            '  {/each}',
            '</ul>',
            '',
            '<!-- 함정: {#each rows as r} 처럼 key 를 빼면 인덱스 기준.',
            '     중간 항목을 지우면 마지막 항목이 사라지는 것처럼 보인다. -->',
          ],
          highlight: [8, 9, 10, 11, 12, 16, 17, 18, 19, 20],
        },
      },
      {
        title: 'Step 5. local vs global · 과한 애니메이션·reduce-motion',
        desc: '기본 트랜지션은 local이다. 부모 블록이 통째로 들어오고 나갈 때, 자식의 개별 트랜지션은 재생하지 않는다(중첩 애니메이션 폭발을 막는 안전장치). 부모가 바뀔 때도 재생하려면 transition:fade|global처럼 global을 명시한다. 실무 함정 셋을 기억하자. 첫째, 트랜지션은 조건부 블록에서만 동작한다. 둘째, transform·opacity는 GPU가 싸게 처리하지만 width·top 같은 레이아웃 속성 애니메이션은 버벅인다. 셋째, prefers-reduced-motion 사용자를 위해 애니메이션을 꺼줘야 한다 — 접근성 필수.',
        api: 'scope',
        demo: { inType: 'blur', outType: 'fade', inDur: 400, outDur: 350, label: 'local / global 비교', accent: '#FF3E00', dual: true },
        params: ['fade|local (기본)', 'fade|global', 'prefers-reduced-motion'],
        alert: { tone: 'danger', text: '레이아웃 속성(width/top) 애니메이션은 버벅임. transform·opacity만 쓰고, reduce-motion을 존중하라.' },
        code: {
          lang: 'xml',
          filename: 'ScopeDemo.svelte',
          lines: [
            '<script>',
            "  import { fade } from 'svelte/transition';",
            '  let show = true;',
            '  let parent = true;',
            '<\/script>',
            '',
            '{#if parent}',
            '  <div>',
            '    <!-- local(기본): 부모(parent)가 사라질 때 이 자식은 재생 안 함 -->',
            '    {#if show}',
            '      <p transition:fade|local>local 트랜지션</p>',
            '    {/if}',
            '',
            '    <!-- global: 부모가 마운트/언마운트될 때도 재생 -->',
            '    {#if show}',
            '      <p transition:fade|global>global 트랜지션</p>',
            '    {/if}',
            '  </div>',
            '{/if}',
            '',
            '<style>',
            '  /* 접근성: 움직임 최소화 설정을 존중 */',
            '  @media (prefers-reduced-motion: reduce) {',
            '    * { transition-duration: 0.01ms !important; }',
            '  }',
            '</style>',
          ],
          highlight: [9, 10, 11, 14, 15, 16, 22, 23, 24, 25],
        },
      },
    ];

    const API_BADGE = {
      fade:   { label: 'transition', color: '#FF3E00' },
      params: { label: '파라미터', color: '#9A3412' },
      inout:  { label: 'in / out', color: '#F59E0B' },
      block:  { label: '#if / #each', color: '#6366F1' },
      scope:  { label: 'local / global', color: '#DC2626' },
    };

    // Svelte 트랜지션 재현: on 이 바뀌면 in/out 애니메이션 재생
    function TransitionBox({ on, config }) {
      const [render, setRender] = useState(on);
      const [shown, setShown] = useState(on);
      const [phase, setPhase] = useState(on ? 'in' : 'out');

      useEffect(() => {
        if (on) {
          setPhase('in');
          setRender(true);
          const id = requestAnimationFrame(() =>
            requestAnimationFrame(() => setShown(true))
          );
          return () => cancelAnimationFrame(id);
        } else {
          setPhase('out');
          setShown(false);
          const t = setTimeout(() => setRender(false), config.outDur);
          return () => clearTimeout(t);
        }
      }, [on]);

      if (!render) return null;

      const type = phase === 'in' ? config.inType : config.outType;
      const dur = phase === 'in' ? config.inDur : config.outDur;
      const t = TRANSITIONS[type] || TRANSITIONS.fade;
      const style = {
        transition: `all ${dur}ms cubic-bezier(0.22, 1, 0.36, 1)`,
        transformOrigin: 'top center',
        ...(shown ? t.shown : t.hidden),
      };

      return (
        <div className="rounded-lg px-4 py-3 text-sm font-bold text-white shadow" style={{ ...style, backgroundColor: config.accent }}>
          {config.label}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const badge = API_BADGE[state.api] || API_BADGE.fade;
      const [on, setOn] = useState(true);

      // 자동 토글 루프 — 등장/퇴장을 반복 재생
      useEffect(() => {
        setOn(true);
        const id = setInterval(() => setOn((v) => !v), 1900);
        return () => clearInterval(id);
      }, [state.api]);

      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>브라우저 미리보기 — 트랜지션 재생</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>

          <div className="rounded-lg border-2 overflow-hidden" style={{ borderColor: '#FF3E00' }}>
            <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
              <span>🔥</span>
              <span>preview</span>
              <span className="ml-auto text-[10px] bg-white/20 px-2 py-0.5 rounded">{on ? '보임 (in)' : '사라짐 (out)'}</span>
            </div>

            <div className="p-4 bg-orange-50 min-h-[150px] flex flex-col items-center justify-center gap-3">
              {state.demo.dual ? (
                <div className="flex gap-3 w-full justify-center">
                  <div className="flex flex-col items-center gap-1">
                    <TransitionBox on={on} config={{ ...state.demo, label: 'local', accent: '#9A3412' }} />
                    <span className="text-[10px] text-amber-800">부모 유지 시만 재생</span>
                  </div>
                  <div className="flex flex-col items-center gap-1">
                    <TransitionBox on={on} config={{ ...state.demo, label: 'global', accent: '#FF3E00' }} />
                    <span className="text-[10px] text-amber-800">부모 변화에도 재생</span>
                  </div>
                </div>
              ) : (
                <TransitionBox on={on} config={state.demo} />
              )}
              <div className="text-[10px] text-amber-700">조건부 블록의 참/거짓이 1.9초마다 토글됩니다</div>
            </div>
          </div>

          {/* 파라미터 칩 */}
          <div className="mt-3 flex flex-wrap gap-1.5">
            {state.params.map((p) => (
              <span key={p} className="text-[10px] font-mono px-2 py-0.5 rounded border" style={{ backgroundColor: '#FFFBEB', borderColor: '#FCD34D', color: '#92400E' }}>{p}</span>
            ))}
          </div>

          <button
            onClick={() => setOn((v) => !v)}
            className="mt-3 self-start text-[11px] px-3 py-1 rounded font-bold text-white"
            style={{ backgroundColor: '#FF3E00' }}
          >수동 토글 (in / out 직접 보기)</button>

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{ backgroundColor: '#9A3412' }}>Part IV. 트랜지션 + 액션</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full border" style={{ borderColor: '#FED7AA', color: '#9A3412' }}>IV-1-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>transition — in / out</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>요소가 나타나고 사라질 때의 자연스러운 애니메이션</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                transition 디렉티브는 조건부 블록 안 요소의 마운트·언마운트를 애니메이션한다. fade·fly·slide·scale·blur를 svelte/transition에서 가져오고 duration·delay·easing으로 조율한다. 등장과 퇴장을 다르게 하려면 in:과 out:을 따로 지정한다. 기본은 local, 부모 변화에도 재생하려면 global. transform·opacity만 애니메이션하고 reduce-motion을 존중하는 것이 성능·접근성의 핵심이다. 다음 장에서는 커스텀 트랜지션과 액션을 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'transition', 'fade', 'fly', 'slide', 'scale', 'blur', 'in-out', 'easing', 'reduce-motion'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
