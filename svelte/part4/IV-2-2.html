  <!--
    Svelte IV-2-2 — spring / tweened (모션 스토어)
    비유: "tweened = 자로 잰 이사, spring = 스프링 침대 위 착지"
    tweened는 정해진 시간에 정확히 도착, spring은 물리 법칙으로 출렁이며 정착한다.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 이징 함수 (tweened 시각화용) ──────────────────────────────
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    const STEPS = [
      {

        mode: 'tweened',
        badge: { label: 'tweened', color: '#FF3E00' },
        alert: { tone: 'info', text: 'tweened = 시간이 주인. duration·easing으로 "언제 도착할지"를 통제. 오버슈트 없음 → 수치 표시에 적합.' },
        code: {
          lang: 'html',
          filename: 'Progress.svelte',
          lines: [

            '  import { tweened } from "svelte/motion";',

            '',

            '  const progress = tweened(0, {',
            '    duration: 400,      // 목표까지 걸리는 시간(ms)',

        mode: 'spring',

        mode: 'store',
        badge: { label: '스토어 API', color: '#6366F1' },
        alert: { tone: 'good', text: '$값 구독 · .set(목표) · .update(fn). 숫자·객체·배열 모두 보간. .set(v, { hard:true })로 즉시 점프.' },
        code: {
          lang: 'javascript',
          filename: 'motion-store.js',
          lines: [
            'import { tweened } from "svelte/motion";',
            'import { spring }  from "svelte/motion";',
            'import { cubicOut } from "svelte/easing";',
            '',
            '// 1) 숫자 보간',
            'const score = tweened(0, { duration: 500, easing: cubicOut });',
            'score.set(1200);              // 0 → 1200 을 500ms 동안',
            'score.update((n) => n + 100); // 이전 값 기반 목표',
            '',
            '// 2) 객체 보간 — 각 숫자 필드를 동시에',
            'const box = spring(',
            '  { x: 0, y: 0, scale: 1 },',

        mode: 'both',
        badge: { label: '선택 기준', color: '#0891B2' },
        alert: { tone: 'good', text: '시간이 의미면 tweened(프로그레스·카운터·차트). 입력을 따라가면 spring(드래그·추적·튕김). 수치엔 오버슈트 금물.' },
        code: {
          lang: 'html',
          filename: 'choose.svelte',
          lines: [
            '<script>',
            '  import { tweened, spring } from "svelte/motion";',
            '  import { cubicOut } from "svelte/easing";',
            '',
            '  // ✅ tweened: "이 시간 안에 이 값" — 정보 전달',

            '',
            '<!-- 숫자는 tweened: 오버슈트 없이 딱 멈춤 -->',

            '',
            '<!-- 노브 위치는 spring: 손맛 있는 반응 -->',

            '</div>',

            '<!-- 규칙 한 줄: 시간이 의미면 tweened, 손맛이면 spring -->',
          ],

        },
      },

        mode: 'pitfall',
        badge: { label: '함정', color: '#DC2626' },
        alert: { tone: 'warn', text: '① 낮은 damping = 멀미 → 큰 이동엔 damping↑/tweened. ② 큰 객체 통째 보간 비용 → 움직일 값만. ③ reduce-motion 감지해 duration 0.' },
        code: {
          lang: 'html',
          filename: 'safe-motion.svelte',

            '<script>',

            '  const reduce =',
            '    typeof window !== "undefined" &&',
            '    window.matchMedia("(prefers-reduced-motion: reduce)").matches;',
            '',
            '  // 켜져 있으면 duration 0 → 애니메이션 사실상 off',
            '  const y = tweened(0, { duration: reduce ? 0 : 400 });',
            '',
            '  // ── ① 멀미 방지: 큰 이동엔 damping 높게 ─────',
            '  // ❌ 과한 스프링(오래 출렁 → 멀미)',
            '  const bad  = spring(0, { stiffness: 0.05, damping: 0.15 });',
            '  // ✅ 차분한 스프링(빠르게 정착)',
            '  const good = spring(0, { stiffness: 0.2,  damping: 0.8 });',
            '',
            '  // ── ② 비용: 움직일 값만 스토어에 담기 ───────',
            '  // ❌ 필드 수백 개 객체를 통째로 보간 → 매 프레임 부담',
            '  // ✅ 실제로 변하는 x 만 보간',
            '  const x = spring(0, { stiffness: 0.15, damping: 0.7 });',
            '<\/script>',
            '',
            '<div class="panel" style="transform: translateY({$y}px)">',
            '  콘텐츠',
            '</div>',
            '',
            '<!-- 핵심: 큰 이동엔 damping↑, 큰 객체 통째 보간 금지,',
            '     reduce-motion 이면 duration 0 으로 애니메이션 끄기 -->',
          ],
          highlight: [4, 5, 6, 7, 9, 10, 13, 14, 15, 16, 19, 20, 21],
        },
      },
    ];

    // ── 파라미터 프리셋 (좌측 애니메이션 구동) ──────────────────────
    const MODE_PARAM = {
      tweened: { duration: 400, stiffness: 0.15, damping: 0.7 },
      spring:  { duration: 600, stiffness: 0.15, damping: 0.35 },
      store:   { duration: 500, stiffness: 0.12, damping: 0.5 },
      both:    { duration: 800, stiffness: 0.2,  damping: 0.4 },
      pitfall: { duration: 400, stiffness: 0.05, damping: 0.15 },
    };

    // ── 값을 목표로 애니메이션하는 훅 (tweened + spring 대비) ─────────
    function useMotionRace(param, mode) {
      const [tw, setTw] = useState(0.15);   // tweened 위치(0~1)
      const [sp, setSp] = useState(0.15);   // spring 위치(0~1)
      const stateRef = useRef({
        target: 0.85,
        twStart: 0.15, twStartT: 0, twFrom: 0.15,
        spPos: 0.15, spVel: 0,
        lastFlip: 0,
      });

      useEffect(() => {
        let raf;
        const s = stateRef.current;
        s.lastFlip = performance.now();
        s.twStartT = performance.now();
        s.twFrom = s.spPos; // 현재 위치에서 다시 출발

        const tick = (now) => {
          // 일정 간격마다 목표를 반대편으로 뒤집어 반복 시연
          if (now - s.lastFlip > 1900) {
            s.lastFlip = now;
            s.target = s.target > 0.5 ? 0.15 : 0.85;
            s.twFrom = tw;
            s.twStartT = now;
          }

          // tweened: 시간 기반 (정해진 duration + easing)
          const dur = Math.max(1, param.duration);
          const t = Math.min(1, (now - s.twStartT) / dur);
          const eased = easeInOutCubic(t);
          const twPos = s.twFrom + (s.target - s.twFrom) * eased;

          // spring: 물리 기반 (stiffness / damping)
          const dt = 1; // 프레임 단위 근사
          const force = param.stiffness * (s.target - s.spPos);
          s.spVel = (s.spVel + force) * (1 - param.damping);
          s.spPos = s.spPos + s.spVel * dt;

          setTw(twPos);
          setSp(s.spPos);
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [param.duration, param.stiffness, param.damping, mode]);

      return { tw, sp, target: stateRef.current.target };
    }

    function MoverTrack({ label, color, pos, target, tag, showTarget }) {
      const pct = Math.max(0, Math.min(100, pos * 100));
      const tpct = Math.max(0, Math.min(100, target * 100));
      return (
        <div className="rounded-lg border p-3" style={{ borderColor: '#FED7AA', backgroundColor: '#FFF7ED' }}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-[11px] font-bold" style={{ color: '#7C2D12' }}>{label}</span>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: color }}>{tag}</span>
          </div>
          <div className="relative h-9 rounded-full" style={{ backgroundColor: '#FDE8D5' }}>
            {showTarget && (
              <div className="absolute top-0 bottom-0 w-0.5" style={{ left: `${tpct}%`, backgroundColor: '#94A3B8' }} />
            )}
            <div
              className="absolute top-1/2 w-7 h-7 rounded-full shadow -translate-y-1/2"
              style={{ left: `calc(${pct}% - 14px)`, backgroundColor: color, transition: 'none' }}
            />
          </div>
          <div className="mt-1 text-right text-[10px] font-mono" style={{ color: '#9A3412' }}>{pct.toFixed(1)}</div>
        </div>
      );
    }

    function ParamCard({ title, rows, accent }) {
      return (
        <div className="rounded-lg border p-2" style={{ borderColor: accent, backgroundColor: '#FFFDFB' }}>
          <div className="text-[10px] font-bold mb-1" style={{ color: accent }}>{title}</div>
          {rows.map((r, i) => (
            <div key={i} className="flex justify-between text-[10px]" style={{ color: '#7C2D12' }}>
              <span>{r.k}</span>
              <span className="font-mono">{r.v}</span>
            </div>
          ))}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const param = MODE_PARAM[state.mode] || MODE_PARAM.tweened;
      const { tw, sp, target } = useMotionRace(param, state.mode);
      const showTween = state.mode !== 'spring';
      const showSpring = state.mode !== 'tweened';

      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>모션 스토어 — 목표값 도달 궤적</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: state.badge.color }}>{state.badge.label}</span>
          </div>

          <div className="rounded-lg border-2 overflow-hidden mb-3" style={{ borderColor: '#FF3E00' }}>
            <div className="text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2" style={{ background: 'linear-gradient(90deg, #FF3E00, #9A3412)' }}>
              <span>🔥</span>
              <span>svelte/motion — 목표가 회색선으로 이동하면 두 방식이 따라간다</span>
            </div>
            <div className="p-3 space-y-2 bg-orange-50">
              {showTween && (
                <MoverTrack label="tweened (시간 기반 · easing)" color="#FF3E00" pos={tw} target={target} tag="선형 도착" showTarget />
              )}
              {showSpring && (
                <MoverTrack label="spring (물리 기반 · 오버슈트)" color="#9A3412" pos={sp} target={target} tag="출렁 정착" showTarget />
              )}
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 mb-1">
            <ParamCard
              title="tweened 파라미터"
              accent="#FF3E00"
              rows={[
                { k: 'duration', v: `${param.duration}ms` },
                { k: 'easing', v: 'cubicOut' },
                { k: '오버슈트', v: '없음' },
              ]}
            />
            <ParamCard
              title="spring 파라미터"
              accent="#9A3412"
              rows={[
                { k: 'stiffness', v: param.stiffness.toFixed(2) },
                { k: 'damping', v: param.damping.toFixed(2) },
                { k: '오버슈트', v: param.damping < 0.4 ? '큼 (멀미 주의)' : '적음' },
              ]}
            />
          </div>

          {state.mode === 'both' && (
            <div className="mt-2 grid grid-cols-2 gap-2">
              <div className="rounded-lg border p-2" style={{ borderColor: '#FF3E00', backgroundColor: '#FFF7ED' }}>
                <div className="text-[10px] font-bold" style={{ color: '#FF3E00' }}>tweened 를 써라</div>
                <div className="text-[10px]" style={{ color: '#7C2D12' }}>프로그레스 · 카운터 · 차트 · 슬라이드</div>
              </div>
              <div className="rounded-lg border p-2" style={{ borderColor: '#9A3412', backgroundColor: '#FFF7ED' }}>
                <div className="text-[10px] font-bold" style={{ color: '#9A3412' }}>spring 을 써라</div>
                <div className="text-[10px]" style={{ color: '#7C2D12' }}>드래그 · 마우스 추적 · 튕김 · 재정렬</div>
              </div>
            </div>
          )}

          {state.mode === 'pitfall' && (
            <div className="mt-2 rounded-lg border p-2" style={{ borderColor: '#FCA5A5', backgroundColor: '#FEF2F2' }}>
              <div className="text-[10px] font-bold text-red-700 mb-1">지금 spring 이 오래 출렁이는 이유</div>
              <div className="text-[10px] text-red-800">damping 0.15 로 감쇠가 약함 → 큰 이동에선 멀미. damping 을 0.7 이상으로 올리거나 tweened 로 교체.</div>
            </div>
          )}

          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#FF3E00', text: '#9A3412', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2" style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? { backgroundColor: 'rgba(255,62,0,0.15)', borderColor: '#FF3E00' } : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#FF3E00' }}>S</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold text-white px-2 py-0.5 rounded" style={{ backgroundColor: '#9A3412' }}>Part IV. 트랜지션 + 액션</span>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded border" style={{ color: '#9A3412', borderColor: '#FED7AA', backgroundColor: '#FFF7ED' }}>IV-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>spring / tweened — 모션 스토어</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>물리 기반 부드러운 값 애니메이션 — 시간이 주인이냐, 물리가 주인이냐</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#FF3E00' : '#FED7AA' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #FF3E00)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? '#9A3412' : '#FF3E00' }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40"
                style={{ borderColor: '#FF3E00', color: '#9A3412' }}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계 · 좌측 궤적은 실시간 애니메이션</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#FF3E00', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                tweened는 시간이 주인(duration·easing, 오버슈트 없음) → 프로그레스·카운터·차트. spring은 물리가 주인(stiffness·damping, 오버슈트) → 드래그·추적·튕김. 둘 다 스토어라 $구독·.set·.update로 다루고 숫자·객체·배열을 보간한다. 함정은 과한 스프링(멀미)·큰 객체 보간 비용·reduce-motion 미대응. Part IV의 마지막 — 다음 Part V로 이어진다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Svelte', 'motion', 'tweened', 'spring', 'easing', 'stiffness', 'damping', 'store', 'reduce-motion', 'a11y'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#9A3412' }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
