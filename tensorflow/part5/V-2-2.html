  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    TensorFlow V-2-2 — 실무 선택 가이드 — 연구 vs 서빙 인프라 (졸업 · 캡스톤)
    학습 목표: 20장 과정 전체를 "실무 의사결정"으로 재소집한다. 두 방식(고수준 fit ↔
              저수준 GradientTape)과 프레임워크(TF ↔ PyTorch) 선택을 상황이 결정한다는
              관점으로 정리한다. ① 과정 전체 지도 → ② 방식 스펙트럼 다이얼 → ③ 프레임워크
              결정 트리 5제 → ④ PyTorch↔TF 대응표 → ⑤ 졸업 체크리스트 + 다음 경로.
    패턴: fastapi v1 — 좌(LiveDataPane: 과정 아이콘 맵 · 방식 다이얼 · 결정 트리 ·
          대응표 · 졸업 체크리스트) / 우(VSCode CodeViewer: graduation.py 캡스톤)
    색상: orange (TF 브랜드 #FF6F00)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 과정 복습 → 방식 다이얼 → 결정 트리 → 대응표 → 졸업
    //   mode : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //          'coursemap'(과정 전체 아이콘 맵) | 'dial'(방식 스펙트럼 다이얼)
    //          'decision'(시나리오 결정 트리) | 'bridge'(PyTorch↔TF 대응표)
    //          'graduate'(졸업 체크리스트 + 다음 경로)
    //   code : 우측 CodeViewer 파일 (graduation.py 캡스톤)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 과정 복습 지도 — 20장에서 배운 전부를 한 장으로',
        desc: '졸업 전에 우리가 통과한 길을 통째로 되돌아본다. 이 과정은 "두 방식의 기원"에서 출발했다 — TF1 정적 그래프의 고통과 TF2의 대전환(eager 기본·Keras 흡수). 거기서 방식 1(Sequential·compile·fit·콜백)로 표준 학습의 근육을 키우고, 방식 2(GradientTape·커스텀 루프·서브클래싱)로 내려가 fit이 대신 해주던 것을 손으로 짰다. 그다음 규모(tf.data 파이프라인·분산 학습·AMP 혼합정밀도)로 현실의 데이터·GPU를 감당하는 법을, 마지막으로 배포(SavedModel·TF Serving·TFLite·TF.js)로 학습된 모델을 실제 사용자에게 내보내는 법을 배웠다. 핵심은 이 다섯 덩어리가 따로 노는 지식이 아니라 "문제 → 방식 → 규모 → 배포"라는 하나의 흐름이라는 점이다. 지금부터 이 지식을 실무 의사결정으로 재조립한다.',
        mode: 'coursemap',
        era: '졸업 복습 · Part Ⅰ~Ⅴ',
        engineDetail: '기원 → 방식1 → 방식2 → 규모 → 배포',
        courseMap: [
          { part: 'Ⅰ', icon: '🌱', title: '두 방식의 기원', items: ['TF1 정적 그래프', 'TF2 eager 대전환', 'Keras 공식 흡수'], tone: 'seed' },
          { part: 'Ⅱ', icon: '🧱', title: '방식 1 · 고수준', items: ['Sequential·Functional', 'compile·fit', '콜백·조기종료'], tone: 'high' },
          { part: 'Ⅲ', icon: '🔧', title: '방식 2 · 저수준', items: ['GradientTape', '커스텀 루프', '서브클래싱·tf.function'], tone: 'low' },
          { part: 'Ⅳ', icon: '📈', title: '규모', items: ['tf.data 파이프라인', '분산(MirroredStrategy)', 'AMP 혼합정밀도'], tone: 'scale' },
          { part: 'Ⅴ', icon: '🚀', title: '배포', items: ['SavedModel', 'TF Serving', 'TFLite·TF.js'], tone: 'deploy' },
        ],
        alert: { tone: 'info', text: '다섯 덩어리는 따로 노는 지식이 아니라 "문제 → 방식 → 규모 → 배포" 하나의 흐름이다. 졸업 페이지는 이 흐름을 의사결정으로 다시 묶는다.' },
        code: {
          lang: 'python',

          { icon: '🔥', name: 'PyTorch 과정', why: '대응표 덕에 빠르게 흡수' },
          { icon: '📐', name: '딥러닝 이론', why: '왜 되는지를 파고든다' },
          { icon: '⚙️', name: 'MLOps', why: '모델을 파이프라인·시스템으로' },
          { icon: '🤖', name: 'LLMOps', why: '거대 모델의 서빙·운영' },
        ],
        finalWord: '프레임워크는 도구, 문제가 먼저다.',
        alert: { tone: 'good', text: 'TF든 PyTorch든, fit이든 tape든 — 모든 선택은 "무슨 문제를, 어디에 배포하는가" 뒤에 온다. 도구보다 문제를 먼저 보는 사람이 좋은 엔지니어가 된다. 졸업을 축하한다. 🎓' },
        code: {
          lang: 'python',
          filename: 'graduation.py — ⑤ 졸업 체크리스트 + 다음 경로',
          lines: [
            '"""',
            'graduation.py — ⑤ 실무 투입 체크리스트 & 다음 학습 경로',
            '"""',
            '',
            '# ── 실무 투입 전 손풀기 3종 (직접 코드로 확인) ──',
            'CHECKLIST = [',
            '    "같은 모델을 fit 과 GradientTape 로 각각 구현",',
            '    "SavedModel 로 export → 서빙까지 최소 1회",',
            '    "커스텀 루프로 GAN 스케치 (tape 2개 번갈아)",',
            ']',
            '',
            '# ── 여기서 갈라지는 다음 경로 ──',
            'NEXT_PATHS = {',
            '    "pytorch": "대응표 덕에 빠르게 — 개념은 이미 안다",',
            '    "dl-theory": "왜 되는지(역전파·최적화)를 파고든다",',
            '    "mlops": "모델을 파이프라인·시스템으로 운영",',
            '    "llmops": "거대 모델의 서빙·비용·운영",',
            '}',
            '',
            'for item in CHECKLIST:',
            '    print("[ ]", item)   # 하나씩 체크하며 졸업하자',
            '',
            '# ────────────────────────────────────────────',
            '# 졸업하며 새길 단 한 문장:',
            '#',
            '#     "프레임워크는 도구, 문제가 먼저다."',
            '#',
            '# 도구를 고르기 전에 문제를 정확히 보는 사람이',
            '# 결국 좋은 엔지니어가 된다. 졸업을 축하한다. 🎓',
          ],
          highlight: [5, 6, 7, 8, 9, 12, 13, 14, 15, 16, 17, 20, 21, 24, 25, 26, 27, 28, 29],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 색 톤 헬퍼 — 과정 지도 파트별
    // ─────────────────────────────────────────────────────
    const PART_TONE = {
      seed:   { border: 'border-emerald-300', bg: 'bg-emerald-50', head: 'text-emerald-800', chip: 'border-emerald-300 text-emerald-800' },
      high:   { border: 'border-orange-300',  bg: 'bg-orange-50',  head: 'text-orange-800',  chip: 'border-orange-300 text-orange-800' },
      low:    { border: 'border-slate-400',   bg: 'bg-slate-50',   head: 'text-slate-800',   chip: 'border-slate-300 text-slate-700' },
      scale:  { border: 'border-sky-300',     bg: 'bg-sky-50',     head: 'text-sky-800',     chip: 'border-sky-300 text-sky-800' },
      deploy: { border: 'border-violet-300',  bg: 'bg-violet-50',  head: 'text-violet-800',  chip: 'border-violet-300 text-violet-800' },
    };

    // ─────────────────────────────────────────────────────
    // 과정 전체 아이콘 맵 (Step 1)
    // ─────────────────────────────────────────────────────
    function CourseMapBox({ items }) {
      if (!items) return null;
      return (
        <div className="mt-1 space-y-1.5">
          {items.map((it, i) => {
            const t = PART_TONE[it.tone] || PART_TONE.high;
            return (
              <div key={i} className={`rounded-lg border-2 ${t.border} ${t.bg} p-2.5 flex items-start gap-2.5`}>
                <div className="flex flex-col items-center gap-0.5 w-8">
                  <span className="text-xl leading-none">{it.icon}</span>
                  <span className="text-[9px] font-bold text-orange-700">Part {it.part}</span>
                </div>
                <div className="min-w-0 flex-1">
                  <div className={`text-[12px] font-bold ${t.head}`}>{it.title}</div>
                  <div className="mt-1 flex flex-wrap gap-1">
                    {it.items.map((x, j) => (
                      <span key={j} className={`text-[9px] px-1.5 py-0.5 rounded border bg-white ${t.chip}`}>{x}</span>
                    ))}
                  </div>
                </div>
                {i < items.length - 1 && <span className="text-orange-300 text-xs self-center">▾</span>}
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 방식 스펙트럼 다이얼 (Step 2) — 상황별 각도로 회전
    // ─────────────────────────────────────────────────────
    function DialBox({ dial }) {
      // 훅은 조기 반환보다 앞에 있어야 한다.
      const [sel, setSel] = useState(0);
      if (!dial) return null;
      // 다이얼 눈금 수가 beat 마다 달라질 수 있어 범위를 자른다.
      const pos = dial.positions[Math.min(sel, dial.positions.length - 1)];
      // pct(0~100) → 각도(-80° ~ +80°)
      const angle = (pos.pct / 100) * 160 - 80;
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            {/* 게이지 */}
            <div className="relative h-24 mb-1">
              <div className="absolute inset-x-6 bottom-2 h-2 rounded-full bg-gradient-to-r from-emerald-300 via-amber-300 to-red-400"></div>
              {/* 바늘 */}
              <div
                className="absolute left-1/2 bottom-2 origin-bottom w-1 h-16 bg-orange-700 rounded-full transition-transform duration-500"
                style={{ transform: `translateX(-50%) rotate(${angle}deg)` }}
              ></div>
              <span className="absolute left-1/2 bottom-1 -translate-x-1/2 w-3 h-3 rounded-full bg-orange-800 border-2 border-white"></span>
            </div>
            <div className="flex justify-between text-[10px] px-1 mb-2">
              <div className="text-left">
                <div className="font-bold text-emerald-700">◀ {dial.leftLabel}</div>
                <div className="text-slate-500">{dial.leftSub}</div>
              </div>
              <div className="text-right">
                <div className="font-bold text-red-700">{dial.rightLabel} ▶</div>
                <div className="text-slate-500">{dial.rightSub}</div>
              </div>
            </div>
            {/* 현재 선택 설명 */}
            <div className="rounded-lg bg-orange-50 border border-orange-300 px-2.5 py-1.5">
              <div className="text-[11px] font-bold text-orange-900">📍 {pos.who} → {pos.pick}</div>
              <div className="text-[10px] text-orange-800 mt-0.5">{pos.why}</div>
            </div>
          </div>
          {/* 상황 버튼 */}
          <div className="mt-2 grid grid-cols-2 gap-1.5">
            {dial.positions.map((p, i) => (
              <button
                key={i}
                onClick={() => setSel(i)}
                className={`text-[10px] px-2 py-1.5 rounded border text-left transition ${i === sel ? 'bg-orange-600 text-white border-orange-600 font-bold' : 'bg-white text-orange-800 border-orange-300 hover:bg-orange-50'}`}
              >
                {p.who}
              </button>
            ))}
          </div>
          <div className="mt-1 text-center text-[9px] text-slate-500">상황 버튼을 눌러 다이얼을 돌려보세요</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 시나리오 결정 트리 (Step 3) — 클릭해서 펼치기
    // ─────────────────────────────────────────────────────
    const SCN_TONE = {
      tf: { border: 'border-orange-400', bg: 'bg-orange-50', badge: 'bg-orange-600', text: 'text-orange-900' },
      pt: { border: 'border-red-400',    bg: 'bg-red-50',    badge: 'bg-red-600',    text: 'text-red-900' },
    };
    function DecisionBox({ scenarios }) {
      // 훅은 조기 반환보다 앞에 있어야 한다.
      const [open, setOpen] = useState(0);
      if (!scenarios) return null;
      return (
        <div className="mt-1 space-y-1.5">
          {scenarios.map((s, i) => {
            const t = SCN_TONE[s.tone] || SCN_TONE.tf;
            const isOpen = i === open;
            return (
              <div key={i} className={`rounded-lg border-2 ${t.border} ${isOpen ? t.bg : 'bg-white'} overflow-hidden`}>
                <button onClick={() => setOpen(i)} className="w-full flex items-center gap-2 px-2.5 py-1.5 text-left">
                  <span className="text-base">{s.icon}</span>
                  <span className="text-[11px] font-bold text-slate-800 flex-1">{s.name}</span>
                  <span className="text-[9px] text-slate-500 font-mono">{s.q}</span>
                  <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded text-white ${t.badge}`}>{s.pick}</span>
                </button>
                {isOpen && (
                  <div className="px-2.5 pb-2 pt-0.5 flex items-center gap-2">
                    <span className="text-orange-400 text-[10px]">└▶</span>
                    <span className={`text-[10px] ${t.text}`}>{s.why}</span>
                  </div>
                )}
              </div>
            );
          })}
          <div className="text-center text-[9px] text-slate-500">시나리오를 눌러 결정 이유를 펼쳐보세요</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // PyTorch ↔ TF 대응표 (Step 4)
    // ─────────────────────────────────────────────────────
    function BridgeBox({ bridge }) {
      if (!bridge) return null;
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="flex items-center text-[10px] font-bold mb-1.5 px-1">
              <span className="w-20 text-slate-600">개념</span>
              <span className="flex-1 text-red-700">🔥 PyTorch</span>
              <span className="flex-1 text-orange-700">🔶 TensorFlow</span>
            </div>
            <div className="space-y-1">
              {bridge.rows.map((r, i) => (
                <div key={i} className="flex items-center text-[10px] rounded bg-orange-50/60 border border-orange-100 px-1 py-1">
                  <span className="w-20 font-bold text-slate-700">{r.concept}</span>
                  <span className="flex-1 font-mono text-red-800 truncate pr-1">{r.pt}</span>
                  <span className="text-orange-400 px-0.5">↔</span>
                  <span className="flex-1 font-mono text-orange-800 truncate pl-1">{r.tf}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="mt-2 rounded-lg border-2 border-orange-300 bg-gradient-to-br from-orange-50 to-amber-50 px-2.5 py-2 text-[10px] text-orange-900 font-bold text-center">
            🌉 {bridge.keras3}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 졸업 체크리스트 + 다음 경로 (Step 5)
    // ─────────────────────────────────────────────────────
    function GraduateBox({ checklist, nextPaths, finalWord }) {
      if (!checklist) return null;
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">✅ 실무 투입 체크리스트</div>
            <div className="space-y-1.5">
              {checklist.map((c, i) => (
                <div key={i} className="flex items-start gap-2 rounded border border-orange-200 bg-orange-50 px-2 py-1.5">
                  <span className="text-base leading-none">{c.icon}</span>
                  <div className="flex-1 min-w-0">
                    <div className="text-[11px] font-bold text-orange-900">{c.task}</div>
                    <div className="text-[10px] text-slate-600">🎯 {c.gain}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="mt-2 rounded-xl border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧭 다음 학습 경로</div>
            <div className="grid grid-cols-2 gap-1.5">
              {nextPaths.map((p, i) => (
                <div key={i} className="rounded border border-orange-200 bg-orange-50 px-2 py-1.5">
                  <div className="text-[11px] font-bold text-orange-900">{p.icon} {p.name}</div>
                  <div className="text-[9px] text-slate-600">{p.why}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="mt-2 rounded-xl border-2 border-orange-500 bg-gradient-to-br from-orange-100 to-amber-100 px-3 py-3 text-center">
            <div className="text-sm font-bold text-orange-900">🎓 “{finalWord}”</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 지도/다이얼/트리/대응표/졸업 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      coursemap: { icon: '🗺', label: '과정 전체 지도' },
      dial:      { icon: '🎛', label: '방식 스펙트럼 다이얼' },
      decision:  { icon: '🌳', label: '프레임워크 결정 트리' },
      bridge:    { icon: '🌉', label: 'PyTorch↔TF 대응표' },
      graduate:  { icon: '🎓', label: '졸업과 다음 경로' },
    };

    function LiveDataPane({ beat, state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.coursemap;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>실무 의사결정 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.era}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            흐름: {state.engineDetail}
          </div>

          {state.mode === 'coursemap' && <CourseMapBox items={state.courseMap} />}
          {state.mode === 'dial'      && <DialBox dial={state.dial} />}
          {state.mode === 'decision'  && <DecisionBox scenarios={state.scenarios} />}
          {state.mode === 'bridge'    && <BridgeBox bridge={state.bridge} />}
          {state.mode === 'graduate'  && <GraduateBox checklist={state.checklist} nextPaths={state.nextPaths} finalWord={state.finalWord} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🎓</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-orange-200 text-orange-900 mb-1">Part Ⅴ · 졸업 캡스톤</span>
                <h1 className="text-2xl font-bold text-orange-900">V-2-2. 실무 선택 가이드 — 연구 vs 서빙 인프라</h1>
                <p className="text-sm text-orange-800/80">두 방식을 다 배운 당신에게 — 상황이 프레임워크와 방식을 고른다 (졸업)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">🎓 졸업 정리 — 20장을 관통하는 한 문장</div>
                이 과정은 두 방식의 기원(TF1→TF2)에서 시작해 방식 1(fit)·방식 2(GradientTape)·규모(tf.data·분산·AMP)·배포(SavedModel·Serving·TFLite·TF.js)를 지나왔다.
                졸업하며 남는 것은 "TensorFlow 사용법"이 아니라 실무 의사결정의 눈이다 — 방식은 "그냥 호출↔전부 지정" 다이얼을 상황(MVP·캐글·논문·프로덕션)에 맞게 돌리고,
                프레임워크는 "어디에 배포되는가"를 첫 질문으로 고른다. PyTorch와는 개념이 1:1로 대응하고 Keras 3로 경계마저 흐려지니, 하나를 깊게 알면 둘 다 쓴다.
                마지막 원칙: <b>프레임워크는 도구, 문제가 먼저다.</b> 다음 경로(PyTorch·딥러닝 이론·MLOps·LLMOps)로 나아가자. 졸업을 축하한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['TensorFlow', '졸업', '방식선택', 'fit', 'GradientTape', '프레임워크결정', 'TFLite', 'TF.js', 'TF-Serving', 'PyTorch대응', 'Keras3', '문제가먼저'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./V-2-1.html" className="underline hover:no-underline">← 이전: V-2-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
