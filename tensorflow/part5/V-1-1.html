  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    TensorFlow V-1-1 — SavedModel·서명
    학습 목표: 학습이 끝난 모델을 "파이썬 없이도 실행되는" 배포 아티팩트로 만드는 법.
              세 가지 저장 형식(.keras / SavedModel 디렉토리 / .weights.h5)의 용도 구분 →
              SavedModel 디렉토리 해부(saved_model.pb·variables·assets)와 파이썬 클래스
              없이 로드되는 원리(tf.function 그래프 통째 저장) → serving_default 서명이라는
              입출력 계약 → 로드·추론 API와 custom_objects → 전처리 내장 export 로
              train-serve skew 를 차단하는 실전 패턴까지 5단계로 정리한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 3형식 비교 카드 / 디렉토리 트리 탐색기 /
          서명 입출력 계약 다이어그램 / 로드 경로 / 전처리 내장 export 파이프라인)
          우(VSCode CodeViewer: saved_model.py 진행)
    색상: orange (TF 브랜드 #FF6F00)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 저장 형식 지도 → SavedModel 해부 → 서명 → 로드·추론 → 배포 준비
    //   mode : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //          'formats'(3형식 비교 카드) | 'anatomy'(디렉토리 트리 탐색기)
    //          'signature'(입출력 계약 다이어그램) | 'load'(로드 경로 분기)
    //          'deploy'(전처리 내장 export 파이프라인 + 형식 선택 플로차트)
    //   code : 우측 CodeViewer 파일 (saved_model.py 진행)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 저장 형식 지도 — .keras · SavedModel · .weights.h5 는 용도가 다르다',
        desc: '학습이 끝난 모델을 저장한다고 할 때, TF/Keras 에는 목적이 다른 세 형식이 있다. .keras 는 Keras 네이티브 단일 파일로 아키텍처·가중치·컴파일 상태(옵티마이저·손실)까지 담아 "학습을 그대로 이어가기" 좋다 — 연구·재개용 기본값이다. SavedModel 은 파일이 아니라 디렉토리로, 그래프+가중치+서명을 담아 파이썬 코드 없이 서빙 엔진(TF Serving·TFLite·TF.js)이 바로 실행할 수 있다 — 배포용이다. .weights.h5 는 가중치만 담아 모델 코드가 이미 있을 때 파라미터만 갈아끼우는 용도다. PyTorch 로 치면 .keras 는 전체 체크포인트, SavedModel 은 TorchScript/ONNX 익스포트, .weights.h5 는 state_dict 에 대응한다. 형식을 잘못 고르면 "재학습은 되는데 서빙이 안 되거나", 반대로 "서빙은 되는데 옵티마이저 상태가 날아가는" 사고가 난다.',
        mode: 'formats',
        era: '저장 형식 지도 · 무엇을 언제',
        engineDetail: 'model.save(...) 확장자·경로가 형식을 결정',
        formats: [
          { name: '.keras', badge: 'Keras 네이티브', tone: 'high', holds: ['아키텍처', '가중치', '컴파일 상태(옵티마이저)'], torch: 'torch.save(전체 checkpoint)', use: '학습 재개·연구 기본값', ok: true },
          { name: 'SavedModel/', badge: '디렉토리 · 서빙용', tone: 'serve', holds: ['그래프(tf.function)', '가중치', '서명(signature)'], torch: 'TorchScript / ONNX export', use: 'TF Serving·TFLite·TF.js 배포', ok: true },

          { when: '학습 재개·연구 완성본', pick: '.keras', why: '옵티마이저 상태까지 보존', tone: 'high' },
          { when: '실제 배포', pick: 'SavedModel/', why: '파이썬 없이 서빙 엔진이 실행', tone: 'serve' },
        ],
        alert: { tone: 'good', text: '전처리를 서명에 내장하면 학습/서빙 경계가 사라져 skew 가 원천 차단된다. 형식은 배타 선택이 아니라 단계별 도구: 체크포인트→.keras→SavedModel.' },
        code: {
          lang: 'python',
          filename: 'saved_model.py — ⑤ 배포 패턴 완성',
          lines: [
            '"""',
            'saved_model.py — ⑤ 전처리 내장 export 패턴 (train-serve skew 차단)',
            '형식 선택: 체크포인트 → .keras → SavedModel (단계별 도구)',
            '"""',
            'import tensorflow as tf',
            'from tensorflow import keras',
            '',
            '# 1) 학습 (여기선 완료됐다고 가정)',
            '# model.fit(x_train, y_train, epochs=10)',
            '',
            '# 2) 전처리를 "포함" 하는 서빙 함수 정의',
            'norm_mean = tf.constant([5.8, 3.0, 3.7, 1.2])',
            'norm_std  = tf.constant([0.8, 0.4, 1.7, 0.7])',
            '',
            '@tf.function(input_signature=[',
            '    tf.TensorSpec([None, 4], tf.float32, name="raw_features")])',
            'def serve(raw_features):',
            '    x = (raw_features - norm_mean) / norm_std   # 정규화 내장',
            '    return {"probs": model(x)}',
            '',
            '# 3) 버전 디렉토리로 export (서명 지정)',
            'model.export("iris_app/1/", signatures={"serving_default": serve})',
            '',
            '# 4) 배포 전 서명 검증 (CLI)',
            '#   $ saved_model_cli show --dir iris_app/1 \\',
            '#         --tag_set serve --signature_def serving_default',
            '#   inputs["raw_features"]: float32 (-1, 4)   ← 원본을 받는다!',
            '#   outputs["probs"]      : float32 (-1, 3)',
            '',
            '# → 클라이언트는 원본만 던지고 전처리는 모델이 책임진다.',
            '# 다음 장: 이 SavedModel 을 TF Serving / TFLite / TF.js 로 서빙.',
          ],
          highlight: [5, 6, 12, 13, 15, 16, 17, 18, 19, 22, 25, 26, 27, 31],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 형식 톤 (고수준/서빙/저수준)
    // ─────────────────────────────────────────────────────
    const FMT_TONE = {
      high:  { border: 'border-orange-400', bg: 'bg-orange-50',  chip: 'bg-orange-600 text-white',  text: 'text-orange-900' },
      serve: { border: 'border-emerald-400', bg: 'bg-emerald-50', chip: 'bg-emerald-600 text-white', text: 'text-emerald-900' },
      low:   { border: 'border-slate-400',  bg: 'bg-slate-50',   chip: 'bg-slate-500 text-white',   text: 'text-slate-800' },
    };

    // ─────────────────────────────────────────────────────
    // Step 1 — 3형식 비교 카드
    // ─────────────────────────────────────────────────────
    function FormatCardsPane({ formats }) {
      return (
        <div className="space-y-2">
          {formats.map((f, i) => {
            const t = FMT_TONE[f.tone] || FMT_TONE.low;
            return (
              <div key={i} className={`rounded-lg border-2 ${t.border} ${t.bg} p-2.5`}>
                <div className="flex items-center gap-2 mb-1.5">
                  <span className={`text-[11px] font-mono font-bold px-2 py-0.5 rounded ${t.chip}`}>{f.name}</span>
                  <span className={`text-[10px] font-bold ${t.text}`}>{f.badge}</span>
                  <span className="ml-auto text-sm">{f.ok ? '🎯' : '🧩'}</span>
                </div>
                <div className="flex flex-wrap gap-1 mb-1.5">
                  {f.holds.map((h, j) => (
                    <span key={j} className="text-[9px] px-1.5 py-0.5 rounded bg-white border border-current/20 text-slate-700">{h}</span>
                  ))}
                </div>
                <div className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono text-slate-500">🐍 {f.torch}</span>
                </div>
                <div className={`text-[10px] mt-0.5 ${t.text}`}>👉 {f.use}</div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 디렉토리 트리 탐색기 + PyTorch 대조
    // ─────────────────────────────────────────────────────
    const NODE_ICON = { dir: '📁', graph: '🧠', file: '📄' };
    function TreePane({ tree, contrast }) {
      const [sel, setSel] = useState(1); // 기본 선택: saved_model.pb
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">🗂 SavedModel 디렉토리 — 노드를 눌러 역할 보기</div>
            <div className="font-mono text-[11px]">
              {tree.map((n, i) => {
                const isGraph = n.kind === 'graph';
                const active = sel === i;
                return (
                  <div
                    key={i}
                    onClick={() => setSel(i)}
                    style={{ paddingLeft: `${n.depth * 16 + 4}px` }}
                    className={`cursor-pointer rounded px-1.5 py-1 flex items-center gap-1.5 ${active ? 'bg-orange-100 border border-orange-300' : 'hover:bg-orange-50 border border-transparent'}`}
                  >
                    <span>{NODE_ICON[n.kind] || '📄'}</span>
                    <span className={`${isGraph ? 'font-bold text-orange-800' : 'text-slate-700'} truncate`}>{n.path}</span>
                    {isGraph && <span className="ml-auto text-[8px] font-bold px-1 py-0.5 rounded bg-orange-600 text-white whitespace-nowrap">핵심</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="mt-2 rounded-lg border border-orange-300 bg-orange-50 px-2.5 py-1.5 text-[10px] text-orange-900">
            <span className="font-bold">{tree[sel].path}</span> — {tree[sel].note}
          </div>
          <div className="mt-2 grid grid-cols-1 gap-1.5">
            <div className="rounded border border-slate-300 bg-slate-50 px-2.5 py-1.5 text-[10px] text-slate-700">
              <span className="font-bold">🐍 PyTorch</span> · {contrast.torch}
            </div>
            <div className="rounded border border-emerald-300 bg-emerald-50 px-2.5 py-1.5 text-[10px] text-emerald-900">
              <span className="font-bold">🔶 TF SavedModel</span> · {contrast.tf}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 서명 입출력 계약 다이어그램
    // ─────────────────────────────────────────────────────
    function SignaturePane({ contract }) {
      const Spec = ({ s, tone }) => (
        <div className={`rounded border px-2 py-1.5 ${tone === 'in' ? 'border-sky-300 bg-sky-50' : 'border-emerald-300 bg-emerald-50'}`}>
          <div className="flex items-center gap-1.5">
            <span className="text-[10px] font-mono font-bold text-slate-800">{s.key}</span>
            <span className="text-[9px] px-1 py-0.5 rounded bg-white border border-slate-300 text-slate-600">{s.dtype}</span>
            <span className="text-[9px] font-mono text-slate-500">{s.shape}</span>
          </div>
          <div className="text-[9px] text-slate-500 mt-0.5">{s.note}</div>
        </div>
      );
      return (
        <div>
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">📜 서명 <span className="font-mono">{contract.name}</span> — 입출력 계약</div>
            <div className="flex items-stretch gap-2">
              <div className="flex-1 space-y-1.5">
                <div className="text-[9px] font-bold text-sky-700">INPUTS</div>
                {contract.inputs.map((s, i) => <Spec key={i} s={s} tone="in" />)}
              </div>
              <div className="flex items-center text-orange-500 font-bold">▶</div>
              <div className="flex-1 space-y-1.5">
                <div className="text-[9px] font-bold text-emerald-700">OUTPUTS</div>
                {contract.outputs.map((s, i) => <Spec key={i} s={s} tone="out" />)}
              </div>
            </div>
          </div>
          <div className="mt-2 rounded-xl border-2 border-orange-300 bg-orange-50 p-2.5">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🛡 커스텀 서명 — 전처리 내장 (<span className="font-mono">{contract.custom.name}</span>)</div>
            <div className="flex items-center gap-1.5 text-[10px]">
              <span className="px-1.5 py-1 rounded bg-white border border-orange-300 font-mono text-slate-700">{contract.custom.in}</span>
              <span className="text-orange-500">▶</span>
              <span className="px-1.5 py-1 rounded bg-amber-200 border border-amber-400 text-amber-900 font-bold">{contract.custom.step}</span>
              <span className="text-orange-500">▶</span>
              <span className="px-1.5 py-1 rounded bg-white border border-emerald-300 font-mono text-emerald-800">{contract.custom.out}</span>
            </div>
            <div className="text-[9px] text-orange-700 mt-1.5">클라이언트는 원본만 던진다 → 전처리 불일치(skew) 원천 차단</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 두 로더 경로 + 버전 디렉토리
    // ─────────────────────────────────────────────────────
    function LoadPane({ loaders, versions }) {
      return (
        <div>
          <div className="grid grid-cols-1 gap-2">
            {loaders.map((l, i) => {
              const t = FMT_TONE[l.tone] || FMT_TONE.low;
              return (
                <div key={i} className={`rounded-lg border-2 ${t.border} ${t.bg} p-2.5`}>
                  <div className="rounded bg-[#282c34] text-orange-200 font-mono text-[10px] px-2 py-1 mb-1.5 overflow-x-auto">{l.api}</div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className={`text-[10px] font-bold ${t.text}`}>→ {l.gives}</span>
                    <span className="ml-auto text-[9px] px-1.5 py-0.5 rounded bg-white border border-current/20 text-slate-600">{l.use}</span>
                  </div>
                  <div className="flex flex-wrap gap-1 mb-1">
                    {l.can.map((c, j) => (
                      <span key={j} className="text-[9px] px-1.5 py-0.5 rounded bg-white border border-slate-300 text-slate-700">✓ {c}</span>
                    ))}
                  </div>
                  <div className="text-[9px] text-slate-500">필요: {l.need}</div>
                </div>
              );
            })}
          </div>
          <div className="mt-2 rounded-lg border-2 border-orange-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">📦 버전 디렉토리 관행 (TF Serving 대비)</div>
            <div className="flex items-center gap-2">
              {versions.map((v, i) => (
                <div key={i} className={`flex-1 rounded border-2 px-2 py-1.5 text-center ${v.active ? 'border-orange-500 bg-orange-50' : 'border-slate-300 bg-slate-50'}`}>
                  <div className={`text-[11px] font-mono font-bold ${v.active ? 'text-orange-900' : 'text-slate-600'}`}>{v.dir}</div>
                  <div className={`text-[9px] mt-0.5 ${v.active ? 'text-orange-700' : 'text-slate-500'}`}>{v.note}</div>
                </div>
              ))}
            </div>
            <div className="text-[9px] text-slate-500 mt-1.5 text-center">Serving 은 더 큰 번호를 무중단으로 승격한다</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — export 파이프라인 + 형식 선택 플로차트
    // ─────────────────────────────────────────────────────
    const PIPE_KIND = {
      run:    { bg: 'bg-orange-50',  border: 'border-orange-400',  icon: '⚙️' },
      result: { bg: 'bg-emerald-50', border: 'border-emerald-400', icon: '✓' },
    };
    function DeployPane({ pipeline, flow }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">🚀 전처리 내장 export 파이프라인</div>
            <div className="space-y-1">
              {pipeline.map((p, i) => {
                const k = PIPE_KIND[p.kind] || PIPE_KIND.run;
                return (
                  <div key={i}>
                    <div className={`rounded border ${k.bg} ${k.border} px-2 py-1.5 flex items-center gap-2`}>
                      <span className="text-[9px] font-bold w-12 text-slate-500">{p.step}</span>
                      <span className="text-[11px] font-mono font-bold text-slate-800 flex-1 truncate">{p.label}</span>
                      <span className="text-sm">{k.icon}</span>
                    </div>
                    <div className="text-[9px] text-slate-500 pl-14">{p.note}</div>
                    {i < pipeline.length - 1 && <div className="text-center text-orange-400 text-[10px] leading-none">↓</div>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="mt-2 rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🧭 형식 선택 플로차트 — 단계별 도구</div>
            <div className="space-y-1.5">
              {flow.map((f, i) => {
                const t = FMT_TONE[f.tone] || FMT_TONE.low;
                return (
                  <div key={i} className="flex items-center gap-2 text-[10px]">
                    <span className="flex-1 text-slate-700">{f.when}</span>
                    <span className={`font-mono font-bold px-2 py-0.5 rounded whitespace-nowrap ${t.chip}`}>{f.pick}</span>
                    <span className="flex-1 text-slate-500">{f.why}</span>
                  </div>
                );
              })}
            </div>
          </div>

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 형식/트리/서명/로드/배포 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      formats:   { icon: '🗺', label: '저장 형식 지도' },
      anatomy:   { icon: '🔬', label: 'SavedModel 해부' },
      signature: { icon: '📜', label: '서명 계약' },
      load:      { icon: '📥', label: '로드와 추론' },
      deploy:    { icon: '🚀', label: '배포 준비' },
    };

    function LiveDataPane({ beat, state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.formats;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>모델 저장·배포 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.era}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            엔진: {state.engineDetail}
          </div>

          {state.mode === 'formats' && <FormatCardsPane formats={state.formats} />}
          {state.mode === 'anatomy' && <TreePane tree={state.tree} contrast={state.contrast} />}
          {state.mode === 'signature' && <SignaturePane contract={state.contract} />}
          {state.mode === 'load' && <LoadPane loaders={state.loaders} versions={state.versions} />}
          {state.mode === 'deploy' && <DeployPane pipeline={state.pipeline} flow={state.flow} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">V-1-1. SavedModel·서명</h1>
                <p className="text-sm text-orange-800/80">파이썬 없이도 실행되는 모델 — 그래프 통째 저장이라는 TF의 배포 무기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                저장 형식은 셋이다 — .keras(아키텍처+가중치+컴파일 상태, 재학습용), SavedModel 디렉토리(그래프+가중치+서명, 배포용), .weights.h5(가중치만).
                SavedModel 이 파이썬 없이 실행되는 이유는 saved_model.pb 에 tf.function 그래프가 통째로 담기기 때문(state_dict 와의 결정적 차이).
                serving_default 서명은 입출력 계약이고, 전처리를 서명에 내장하면 train-serve skew 가 사라진다.
                로드는 keras.models.load_model(재구성·재학습)과 tf.saved_model.load(순수 실행)로 갈리며, 커스텀 레이어는 custom_objects/get_config 가 필요하다.
                배포 서빙 디렉토리는 1/, 2/ 버전 관행을 따른다. 다음 장: TF Serving·TFLite·TF.js.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['SavedModel', '.keras', 'weights.h5', 'saved_model.pb', 'signature', 'serving_default', 'tf.function', 'saved_model_cli', 'load_model', 'custom_objects', 'train-serve-skew', '버전디렉토리'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
