    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->

    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    TensorFlow III-1-1 — GradientTape 해부 — fit의 내부 공개
    학습 목표: 방식 2(저수준 제어)의 문을 연다. model.fit() 한 줄이 사실 5개의 단계
              (① forward ② loss ③ gradient ④ apply ⑤ metric)를 감싼 포장임을 열어 보이고,
              그 핵심 도구인 tf.GradientTape 가 "연산을 녹화 → 미분" 하는 원리를 y=x² 최소
              예제부터 손으로 짠 한 스텝, tape의 세부 규칙(persistent·watch·중첩·stop_gradient),
              그리고 train_step 오버라이드(하이브리드)까지 5단계로 해부한다.
    패턴: fastapi v1 — 좌(LiveDataPane: fit 블랙박스 개봉 애니메이션 + tape 녹화 릴 +
          한 스텝 데이터 흐름 실계산 + pytorch 3박자 대응표 + tape 규칙 카드 + 관문 통과)
          / 우(VSCode CodeViewer: gradient_tape.py 진화)
    색상: orange (TF 브랜드 #FF6F00) — I-1-1 과 동일 스킨/액센트
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — fit 블랙박스 → tape 기본 → 한 스텝 → 세부 규칙 → 관문 통과
    //   mode : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //          'blackbox'(fit 5단계 개봉) | 'record'(tape 녹화 릴 + y=x² 미분)
    //          'onestep'(한 스텝 데이터 흐름 + pytorch 대응표)
    //          'rules'(tape 세부 규칙 카드) | 'gateway'(관문 통과 + 커스텀 필수 사례)
    //   code : 우측 CodeViewer 파일 (gradient_tape.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      blackbox: { lang: "python", filename: "gradient_tape.py — ① fit 이 감춘 5단계", lines: [
        "\"\"\"",
        "gradient_tape.py — ① model.fit() 한 스텝의 정체",
        "",
        "fit(x, y) 는 매 스텝 아래 5단계를 순서대로 실행한다.",
        "방식 2(저수준)는 이 5단계를 fit 에게 맡기지 않고 직접 쓴다.",
        "\"\"\"",
        "import tensorflow as tf",
        "",
        "model = tf.keras.Sequential([tf.keras.layers.Dense(3)])",
        "optimizer = tf.keras.optimizers.Adam()",
        "loss_fn = tf.keras.losses.SparseCategoricalCrossentropy()",
        "acc = tf.keras.metrics.SparseCategoricalAccuracy()",
        "",
        "# ── model.fit(x, y) 가 한 스텝마다 하는 일 (의사코드) ──",
        "def what_fit_does(x, y):",
        "    # ① forward — 순전파로 예측을 구한다",
        "    pred = model(x, training=True)",
        "    # ② loss — 예측이 정답과 얼마나 다른지",
        "    loss = loss_fn(y, pred)",
        "    # ③ gradient — 손실을 가중치로 미분 (← GradientTape 담당)",
        "    grads = compute_gradients(loss, model.trainable_variables)",
        "    # ④ apply — 옵티마이저가 기울기로 가중치를 갱신",
        "    optimizer.apply_gradients(zip(grads, model.trainable_variables))",
        "    # ⑤ metric — 정확도 등 지표 갱신",
        "    acc.update_state(y, pred)",
        "    return loss",
        "",
        "# 이 5단계 중 ③을 실제로 가능케 하는 도구가 tf.GradientTape.",
        "# 다음 단계에서 그 정체를 y=x² 최소 예제로 해부한다.",
      ] },
      record: { lang: "python", filename: "gradient_tape.py — ② y=x² 자동미분", lines: [
        "\"\"\"",
        "gradient_tape.py — ② GradientTape 기본: 녹화 → 미분",
        "with 블록 안 연산을 녹화하고 tape.gradient 로 되감아 미분한다.",
        "\"\"\"",
        "import tensorflow as tf",
        "",
        "# Variable 은 \"학습되는 값\" — 테이프가 자동으로 추적한다",
        "x = tf.Variable(3.0)",
        "",
        "# ── with 블록 안의 연산이 테이프에 \"녹화\" 된다 ──",

    // ─────────────────────────────────────────────────────
    // fit 5단계 개봉 스타일 (Step 1)
    // ─────────────────────────────────────────────────────
    const STAGE_STYLE = {
      fwd:    { bg: 'bg-orange-50',  border: 'border-orange-400',  text: 'text-orange-800',  dot: 'bg-orange-500' },
      loss:   { bg: 'bg-amber-50',   border: 'border-amber-400',   text: 'text-amber-800',   dot: 'bg-amber-500' },
      grad:   { bg: 'bg-rose-50',    border: 'border-rose-400',    text: 'text-rose-800',    dot: 'bg-rose-500' },
      apply:  { bg: 'bg-emerald-50', border: 'border-emerald-400', text: 'text-emerald-800', dot: 'bg-emerald-500' },
      metric: { bg: 'bg-sky-50',     border: 'border-sky-400',     text: 'text-sky-800',     dot: 'bg-sky-500' },
    };

    function BlackboxPane({ state }) {
      const [open, setOpen] = useState(false);
      // 단계 진입 시 뚜껑이 열리는 애니메이션
      useEffect(() => { setOpen(false); const t = setTimeout(() => setOpen(true), 250); return () => clearTimeout(t); }, [state]);
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2 flex items-center gap-2">
            <span className="text-lg">{open ? '📂' : '📦'}</span>
            <div className="text-[11px] font-bold text-orange-800">
              model.fit(x, y) — {open ? '뚜껑을 열었더니 5단계가 있었다' : '겉보기엔 한 줄...'}
            </div>
          </div>
          <div className="rounded-lg border border-orange-200 bg-white p-2">
            <div className="text-center text-[10px] text-slate-500 font-mono mb-2">model.fit(x, y)  ↓ 한 스텝 내부</div>
            <div className="space-y-1.5">
              {state.stages.map((s, i) => {
                const st = STAGE_STYLE[s.kind];

                  <div

                    className={`rounded border ${st.bg} ${st.border} px-2.5 py-1.5 flex items-center gap-2.5 transition-all duration-300`}

                    <span className={`w-6 h-6 rounded-full ${st.dot} text-white text-xs font-bold flex items-center justify-center flex-shrink-0`}>{s.n}</span>
                    <div className="min-w-0 flex-1">
                      <div className={`text-[11px] font-mono font-bold ${st.text}`}>{s.label}</div>
                      <div className="text-[10px] text-slate-500 truncate">{s.desc}</div>
                    </div>
                    {i < state.stages.length - 1 && <span className="text-slate-300 text-xs">↓</span>}
                  </div>
                );
              })}

          </div>
          <div className="mt-2 text-center text-[10px] text-orange-700 font-bold">
            방식 2 = 이 다섯을 fit 에게 맡기지 않고 직접 쓰기

        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // tape 녹화 릴 + y=x² 미분 결과 (Step 2)
    // ─────────────────────────────────────────────────────
    function RecordPane({ box }) {
      // 훅은 조기 반환보다 앞에 있어야 한다. box 가 없는 beat 를 지나면 훅 순서가 어긋난다.
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        if (!box) return;
        const id = setInterval(() => setTick((t) => (t + 1) % (box.reel.length + 2)), 550);
        return () => clearInterval(id);
      }, [box]);
      if (!box) return null;
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2 flex items-center justify-between">
            <div className="text-[11px] font-bold text-orange-800 flex items-center gap-1.5">
              <span className="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
              REC — 테이프가 연산을 녹화 중
            </div>
            <span className="text-[11px] font-mono text-orange-900 font-bold">{box.expr}</span>
          </div>
          {/* 녹화 릴 */}
          <div className="rounded-lg border border-slate-300 bg-[#282c34] p-2.5 space-y-1">
            {box.reel.map((r, i) => {
              const active = tick > i;
              return (
                <div key={i} className={`rounded px-2 py-1 flex items-center gap-2 transition-all ${active ? 'bg-orange-400/20 border-l-2 border-orange-400' : 'bg-slate-700/30 border-l-2 border-transparent'}`}>
                  <span className="text-[10px] text-slate-500 w-4 text-right">{i + 1}</span>
                  <span className="text-[10px] font-mono text-orange-100 flex-1 truncate">{r.op}</span>
                  {r.watched
                    ? <span className="text-[8px] px-1 py-0.5 rounded bg-orange-500/30 text-orange-200 border border-orange-400/40 whitespace-nowrap">추적</span>
                    : <span className="text-[8px] px-1 py-0.5 rounded bg-emerald-500/30 text-emerald-200 border border-emerald-400/40 whitespace-nowrap">되감기</span>}
                </div>
              );
            })}
          </div>
          {/* 각 줄 설명 */}
          <div className="mt-2 space-y-1">
            {box.reel.map((r, i) => (
              <div key={i} className="text-[10px] text-slate-600 flex gap-1.5">
                <span className="text-orange-400">•</span><span className="font-mono text-slate-500">{r.op.trim().split(' ')[0]}</span>
                <span>{r.note}</span>
              </div>
            ))}
          </div>
          {/* 결과 */}
          <div className="mt-2 rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3 text-center">
            <div className="text-[10px] text-emerald-700 mb-0.5">{box.result.formula}</div>
            <div className="text-2xl font-bold text-emerald-800 font-mono">= {box.result.value}</div>
            <div className="text-[9px] text-emerald-600 mt-0.5">미분 공식을 넣지 않았는데 녹화만으로 도함수가 나온다 (autodiff)</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 한 스텝 데이터 흐름 + PyTorch 대응표 (Step 3)
    // ─────────────────────────────────────────────────────
    const ROLE_TONE = {
      forward:  'bg-orange-500',
      loss:     'bg-amber-500',
      gradient: 'bg-rose-500',
      apply:    'bg-emerald-500',
    };

    function OneStepPane({ flow, compare }) {
      if (!flow) return null;
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2 text-[11px] font-bold text-orange-800">
            🧮 한 스텝 데이터 흐름 (실계산 값) — 회색 영역이 tape 녹화 구간
          </div>
          <div className="rounded-lg border border-orange-200 bg-white p-2.5 space-y-1.5">
            {flow.map((f, i) => (
              <div key={i} className={`rounded border px-2.5 py-1.5 flex items-center gap-2 ${f.inside ? 'border-slate-300 bg-slate-50' : 'border-orange-300 bg-orange-50'}`}>
                <span className={`w-6 h-6 rounded-full ${ROLE_TONE[f.role]} text-white text-xs font-bold flex items-center justify-center flex-shrink-0`}>{f.n}</span>
                <div className="min-w-0 flex-1">
                  <div className="text-[11px] font-mono font-bold text-slate-800 truncate">{f.code}</div>

                  <span className="text-orange-500 mx-1">→</span>
                  <span className="text-emerald-700 font-bold">{f.out}</span>

              </div>

          {/* PyTorch 대응표 */}
          {compare && (
            <div className="mt-2 rounded-lg border-2 border-orange-400 bg-white p-2.5">
              <div className="text-[11px] font-bold text-orange-900 mb-1.5">🔗 {compare.title}</div>
              <div className="space-y-1">
                <div className="flex items-center gap-1.5 text-[8px] font-bold text-slate-400 uppercase px-1">
                  <span className="flex-1">TensorFlow (tape)</span>
                  <span className="w-16 text-center">공통 개념</span>
                  <span className="flex-1 text-right">PyTorch</span>
                </div>
                {compare.rows.map((r, i) => (
                  <div key={i} className="flex items-center gap-1.5 text-[9px]">

                    <span className="flex-1 font-mono text-slate-600 text-right truncate">{r.pt}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

    }

    // ─────────────────────────────────────────────────────
    // tape 세부 규칙 카드 (Step 4)
    // ─────────────────────────────────────────────────────
    function RulesPane({ rules }) {
      if (!rules) return null;
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 text-[11px] font-bold text-orange-800">
            🛠 기본 동작만으론 막히는 순간 — 4가지 규칙과 "언제"
          </div>
          {rules.map((r, i) => (
            <div key={i} className={`rounded-lg border-2 p-2.5 ${r.danger ? 'border-red-300 bg-red-50' : 'border-orange-200 bg-white'}`}>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-base">{r.icon}</span>
                <span className="text-[12px] font-mono font-bold text-orange-900">{r.name}</span>
                <span className={`ml-auto text-[9px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap ${r.danger ? 'bg-red-200 text-red-800' : 'bg-orange-100 text-orange-800 border border-orange-300'}`}>

    // ─────────────────────────────────────────────────────
    // 관문 통과 — 하이브리드 & 커스텀 필수 사례 (Step 5)
    // ─────────────────────────────────────────────────────
    function GatewayPane({ box }) {
      if (!box) return null;
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-500 bg-orange-100 p-2.5 text-center text-[12px] font-bold text-orange-900">
            🚪 방식 2의 관문 통과 — fit 도 결국 tape 를 감싼 것
          </div>
          {/* 하이브리드 */}
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🧩 {box.hybrid.title}</div>
            <div className="flex flex-wrap gap-1.5">
              {box.hybrid.points.map((p, i) => (
                <span key={i} className="text-[10px] px-2 py-0.5 rounded-full bg-orange-50 border border-orange-300 text-orange-800">{p}</span>
              ))}
            </div>
          </div>
          {/* 커스텀 필수 사례 */}
          <div className="rounded-lg border-2 border-rose-300 bg-rose-50 p-3">
            <div className="text-[11px] font-bold text-rose-900 mb-2">🔥 {box.custom.title}</div>
            <div className="space-y-1.5">
              {box.custom.cases.map((c, i) => (
                <div key={i} className="flex items-start gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-600 text-white w-20 text-center flex-shrink-0">{c.name}</span>
                  <span className="text-[10px] text-slate-600 flex-1">{c.why}</span>

          <div className="rounded-lg bg-orange-800 text-orange-50 px-2.5 py-2 text-[10px] text-center font-bold">
            🔗 {box.relation}
          </div>
        </div>

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 개봉/녹화/흐름/규칙/관문 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      blackbox: { icon: '📦', label: 'fit 블랙박스 개봉' },
      record:   { icon: '🔴', label: 'tape 연산 녹화' },
      onestep:  { icon: '🧮', label: '한 스텝 데이터 흐름' },
      rules:    { icon: '🛠', label: 'tape 세부 규칙' },
      gateway:  { icon: '🚪', label: '방식 2 관문 통과' },
    };

    function LiveDataPane({ beat, state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.blackbox;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>GradientTape 해부 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.badge}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            흐름: {state.engineDetail}
          </div>

          {state.mode === 'blackbox' && <BlackboxPane state={state} />}
          {state.mode === 'record' && <RecordPane box={state.record} />}
          {state.mode === 'onestep' && <OneStepPane flow={state.flow} compare={state.compare} />}
          {state.mode === 'rules' && <RulesPane rules={state.rules} />}
          {state.mode === 'gateway' && <GatewayPane box={state.gateway} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-orange-200 text-orange-900 mb-1">Part Ⅲ · 방식 2 (저수준 제어)</span>
                <h1 className="text-2xl font-bold text-orange-900">III-1-1. GradientTape 해부 — fit의 내부 공개</h1>
                <p className="text-sm text-orange-800/80">방식 2의 문을 연다 — fit() 한 줄이 감추고 있던 다섯 단계를 손으로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                model.fit() 한 스텝은 사실 ①forward ②loss ③gradient ④apply ⑤metric 다섯 단계다.
                그 중 ③을 담당하는 tf.GradientTape 는 with 블록 안 연산을 "녹화" 하고 tape.gradient() 로 되감아 자동미분한다 —
                Variable 은 자동 추적, constant 는 watch 로 명시. tape 로 한 스텝을 손으로 짜면 fit 의 ①~④가 네 줄로 드러나고,
                이는 PyTorch 의 forward → backward → step 3박자와 대응된다. 실전 규칙(persistent·watch·중첩·stop_gradient)까지 익히면,
                train_step 오버라이드로 "fit 의 편리함 + tape 의 자유"를 동시에 가진다. 구조가 완전히 다른 GAN·강화학습은 다음 장에서 완전한 커스텀 루프로.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['GradientTape', '자동미분', 'autodiff', 'tape.gradient', 'apply_gradients', 'trainable_variables', 'persistent', 'watch', 'stop_gradient', 'train_step', 'fit내부', 'PyTorch3박자'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
