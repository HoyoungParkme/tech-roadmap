  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    TensorFlow III-1-2 — 커스텀 학습 루프 완성
    학습 목표: fit() 없이 학습 루프를 처음부터 끝까지 손으로 짠다. GradientTape 한 스텝(III-1-1)을
              @tf.function 으로 감싼 train_step 으로 캡슐화하고(I-2-1 그래프 모드 회수), 에폭·배치
              이중 순회 → 메트릭 수동 집계(update_state/result/reset_state) → 검증 루프(training=False)
              → 조기 종료·수동 체크포인트(콜백 II-2-2 재현) 까지 5단계로 조립한다. 마지막에 fit vs
              커스텀 루프를 비교하고 "언제 커스텀을 여는가"의 실무 기준으로 닫는다.
    패턴: fastapi v1 — 좌(LiveDataPane: 루프 청사진 블록 조립 + 에폭·배치 카운터·loss/acc 게이지 +
          메트릭 생명주기 다이어그램 + 조기 종료 발동 시각화) / 우(VSCode CodeViewer: custom_loop.py 진화)
    색상: orange (TF 브랜드 #FF6F00)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 청사진 → train_step → 메트릭 → 검증·조기종료 → 완성
    //   mode      : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //               'blueprint'(루프 청사진 블록) | 'trainstep'(@tf.function 한 스텝)
    //               'metrics'(메트릭 생명주기) | 'validate'(검증 루프 + 조기 종료)
    //               'complete'(완성 루프 + fit vs custom 비교)
    //   code      : 우측 CodeViewer 파일 (custom_loop.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 루프 설계도 — fit() 이 대신 돌리던 전체를 손으로 그린다',
        desc: 'model.fit() 한 줄은 사실 정해진 순서의 반복문이다: 에폭을 바깥에서 돌고, 그 안에서 배치를 돌고, 배치마다 순전파·손실·역전파·가중치 갱신(= train_step)을 하고, 에폭 끝에서 검증하고 로그를 찍는다. 커스텀 루프를 짜는 첫걸음은 이 "이중 순회 + 한 스텝"을 청사진으로 분해하는 것이다. III-1-1에서 익힌 GradientTape 한 스텝이 바로 안쪽 블록에 들어간다. 왜 그림부터 그리나 — 루프를 코드로 바로 쓰면 메트릭 리셋 위치·검증 시점 같은 순서 버그가 숨기 쉽기 때문이다. 청사진이 있으면 각 블록을 어디에 끼울지가 명확해진다.',
        mode: 'blueprint',
        stage: '설계 · fit() 해부',
        detail: 'for epoch → for batch → train_step → validate → log',
        blueprint: [
          { id: 'epoch', label: 'for epoch in range(EPOCHS)', role: '바깥 순회 — 데이터셋 전체를 EPOCHS번', tone: 'outer', done: false },
          { id: 'reset', label: 'metric.reset_state()', role: '에폭 시작 — 지난 에폭 집계를 0으로', tone: 'reset', done: false },
          { id: 'batch', label: 'for x, y in train_ds', role: '안쪽 순회 — 배치 단위로', tone: 'inner', done: false },
          { id: 'step', label: 'loss = train_step(x, y)', role: '한 스텝 — tape→grad→apply (III-1-1)', tone: 'step', done: false },
          { id: 'val', label: 'for x, y in val_ds: eval', role: '에폭 끝 — 검증 메트릭 계산', tone: 'val', done: false },
          { id: 'log', label: 'print(loss, acc, val_acc)', role: '로깅 — 진행 상황을 손으로 출력', tone: 'log', done: false },
        ],
        alert: { tone: 'info', text: 'fit() 은 이 6블록을 자동으로 조립해 돌린 것이다. 커스텀 루프는 같은 블록을 내 손으로 배치한다 — 그래서 순서(특히 reset 위치)가 곧 정확성이다.' },
        code: {
          lang: 'python',
          filename: 'custom_loop.py — ① 루프 청사진',
          lines: [
            '"""',
            'custom_loop.py — ① fit() 을 해부한 청사진',
            'model.fit(x, y, epochs, validation_data) 한 줄의 "속" 을 펼치면',
            '아래 이중 순회가 된다. 이 골격에 살을 붙여 완성해 간다.',
            '"""',
            'import tensorflow as tf',
            '',
            '# 준비물 (III-1-1 에서 이어짐)',
            'model     = build_model()                     # tf.keras.Model',
            'optimizer = tf.keras.optimizers.Adam(1e-3)',
            'loss_fn   = tf.keras.losses.SparseCategoricalCrossentropy()',
            'train_ds  = make_dataset(x_train, y_train)    # tf.data.Dataset',
            'val_ds    = make_dataset(x_val, y_val)',
            'EPOCHS    = 20',

            '이 train() 하나가 fit(validation_data, callbacks=[...]) 를 대체한다.',
            '"""',
            'def train(model, train_ds, val_ds, epochs=20, patience_limit=3):',
            '    best_val_acc, patience = 0.0, 0',
            '    for epoch in range(epochs):',
            '        # ── 에폭 시작: 메트릭 리셋 (Step 3) ──',
            '        for m in (train_loss, train_acc): m.reset_state()',
            '        # ── 학습: 배치 순회 + train_step (Step 1·2) ──',
            '        for x, y in train_ds:',
            '            loss, logits = train_step(x, y)      # @tf.function',
            '            train_loss.update_state(loss)',
            '            train_acc.update_state(y, logits)',
            '        # ── 검증 (Step 4) ──',
            '        for m in (val_loss, val_acc): m.reset_state()',
            '        for x, y in val_ds:',
            '            loss, logits = eval_step(x, y)        # training=False',
            '            val_loss.update_state(loss)',
            '            val_acc.update_state(y, logits)',
            '        # ── 로깅 + 조기 종료 (Step 3·4) ──',
            '        v = val_acc.result().numpy()',
            '        print(f"e{epoch} loss={train_loss.result():.3f} "',
            '              f"acc={train_acc.result():.3f} val={v:.3f}")',
            '        if v > best_val_acc:',
            '            best_val_acc, patience = v, 0',
            '            model.save_weights("best.weights.h5")',
            '        elif (patience := patience + 1) >= patience_limit:',
            '            print(f"조기 종료 @ e{epoch}"); break',
            '    model.load_weights("best.weights.h5")',
            '    return best_val_acc',
            '',
            '# 결론: 표준이면 fit(). GAN·RL·다중 옵티마이저·특수 로깅이면 커스텀.',
            '# 다음 장 → 같은 모델을 fit vs 커스텀으로 나란히 비교한다.',
          ],
          highlight: [5, 6, 7, 8, 9, 11, 12, 13, 14, 16, 17, 18, 19, 20, 22, 23, 25, 26, 27, 28, 29, 30, 31],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 청사진 블록 스타일 (Step 1)
    // ─────────────────────────────────────────────────────
    const BP_TONE = {
      outer: { bg: 'bg-orange-50',  border: 'border-orange-400', text: 'text-orange-900', icon: '🔁' },
      reset: { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-900',  icon: '♻️' },
      inner: { bg: 'bg-orange-50',  border: 'border-orange-300', text: 'text-orange-800', icon: '🔂' },
      step:  { bg: 'bg-emerald-50', border: 'border-emerald-400', text: 'text-emerald-800', icon: '⚡' },
      val:   { bg: 'bg-sky-50',     border: 'border-sky-400',    text: 'text-sky-800',    icon: '🔍' },
      log:   { bg: 'bg-slate-50',   border: 'border-slate-300',  text: 'text-slate-700',  icon: '🖨' },
    };

    function BlueprintPane({ blueprint }) {
      const [built, setBuilt] = React.useState(0);
      React.useEffect(() => {
        setBuilt(0);
        const id = setInterval(() => {
          setBuilt((b) => {
            if (b >= blueprint.length) { clearInterval(id); return b; }
            return b + 1;
          });
        }, 320);
        return () => clearInterval(id);
      }, [blueprint]);
      return (
        <div className="space-y-1.5">
          <div className="text-[10px] text-slate-500 mb-1">📐 블록이 위→아래로 조립되며 fit() 골격이 완성된다</div>
          {blueprint.map((b, i) => {
            const t = BP_TONE[b.tone] || BP_TONE.log;
            const on = i < built;
            const indent = b.tone === 'inner' || b.tone === 'step' ? 'ml-4' : b.tone === 'reset' ? 'ml-2' : '';
            return (
              <div
                key={b.id}
                className={`rounded border-2 px-2.5 py-1.5 flex items-start gap-2 transition-all duration-300 ${indent} ${on ? `${t.bg} ${t.border} opacity-100` : 'border-dashed border-slate-200 bg-white opacity-40'}`}
              >
                <span className="text-sm leading-none mt-0.5">{on ? t.icon : '⬚'}</span>
                <div className="min-w-0 flex-1">
                  <div className={`text-[11px] font-mono font-bold ${on ? t.text : 'text-slate-400'} truncate`}>{b.label}</div>
                  <div className="text-[10px] text-slate-500">{b.role}</div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // train_step 흐름 + trace 노트 (Step 2)
    // ─────────────────────────────────────────────────────
    const SF_TONE = {
      tape:  { dot: 'bg-orange-500', text: 'text-orange-800' },
      fwd:   { dot: 'bg-orange-400', text: 'text-orange-800' },
      loss:  { dot: 'bg-amber-500',  text: 'text-amber-800' },
      grad:  { dot: 'bg-emerald-500', text: 'text-emerald-800' },
      apply: { dot: 'bg-emerald-600', text: 'text-emerald-800' },
      ret:   { dot: 'bg-slate-400',  text: 'text-slate-700' },
    };

    function TrainStepPane({ flow, traceNote }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2">
            <div className="text-[11px] font-bold text-orange-900">@tf.function def train_step(x, y) — 매 배치 반복되는 한 스텝</div>
          </div>
          <div className="relative pl-4">
            <div className="absolute left-[6px] top-1 bottom-1 w-0.5 bg-orange-200"></div>
            {flow.map((f, i) => {
              const t = SF_TONE[f.kind] || SF_TONE.ret;
              return (
                <div key={i} className="relative mb-1.5 last:mb-0 flex items-start gap-2">
                  <span className={`absolute -left-4 top-1 w-2.5 h-2.5 rounded-full ${t.dot} border-2 border-white`}></span>
                  <span className="text-[10px] font-mono text-slate-400 w-3">{f.n}</span>
                  <div className="min-w-0 flex-1">
                    <div className={`text-[11px] font-mono font-bold ${t.text} truncate`}>{f.label}</div>
                    <div className="text-[10px] text-slate-500">{f.detail}</div>
                  </div>
                </div>
              );
            })}
          </div>
          {traceNote && (
            <div className="mt-3 rounded-lg border-2 border-orange-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-orange-900 mb-1.5">🧭 @tf.function 추적(trace) 동작</div>
              <div className="flex items-center gap-1.5 text-[10px]">
                <span className="flex-1 rounded bg-amber-100 border border-amber-300 text-amber-900 px-2 py-1.5 text-center">{traceNote.first}</span>
                <span className="text-orange-500 font-bold">▶</span>
                <span className="flex-1 rounded bg-emerald-100 border border-emerald-300 text-emerald-900 px-2 py-1.5 text-center">{traceNote.rest}</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 메트릭 생명주기 다이어그램 (Step 3)
    // ─────────────────────────────────────────────────────
    const LC_TONE = {
      reset:  { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-900',  icon: '♻️' },
      update: { bg: 'bg-orange-50',  border: 'border-orange-400', text: 'text-orange-900', icon: '➕' },
      result: { bg: 'bg-emerald-50', border: 'border-emerald-400', text: 'text-emerald-800', icon: '📊' },
    };

    function MetricsPane({ lifecycle, metricsUsed, bug }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3 mb-2">
            <div className="text-xs font-bold text-orange-900 mb-2">🔄 메트릭 객체 생명주기 (매 에폭 순환)</div>
            <div className="space-y-1.5">
              {lifecycle.map((l, i) => {
                const t = LC_TONE[l.tone];
                return (
                  <React.Fragment key={i}>
                    <div className={`rounded border-2 ${t.bg} ${t.border} px-2.5 py-1.5 flex items-center gap-2`}>
                      <span>{t.icon}</span>
                      <div className="min-w-0 flex-1">
                        <span className={`text-[11px] font-mono font-bold ${t.text}`}>{l.call}</span>
                        <div className="text-[10px] text-slate-500">{l.role}</div>
                      </div>
                      <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${t.text} bg-white/70 border-current/20 whitespace-nowrap`}>{l.phase}</span>
                    </div>
                    {i < lifecycle.length - 1 && <div className="text-center text-orange-400 text-xs leading-none">↓</div>}
                  </React.Fragment>
                );
              })}
            </div>
            <div className="mt-1.5 text-center text-[10px] text-amber-700">⟲ result 후 다음 에폭 시작에 reset 으로 순환</div>
          </div>
          <div className="rounded-lg border border-orange-200 bg-orange-50 p-2.5 mb-2">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🧰 쓰는 메트릭</div>
            {metricsUsed.map((m, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px] mb-1 last:mb-0">
                <span className="font-mono font-bold text-orange-800 w-40 truncate">{m.name}</span>
                <span className="text-slate-600 flex-1">{m.use}</span>
              </div>
            ))}
          </div>
          {bug && (
            <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
              <div className="text-[11px] font-bold text-red-900 mb-1">🐛 reset 누락 버그</div>
              <div className="flex items-center gap-2 text-[10px]">
                <span className="flex-1 font-mono text-red-700 line-through">{bug.wrong}</span>
                <span className="text-orange-500">▶</span>
                <span className="flex-1 font-mono font-bold text-emerald-700">✓ {bug.right}</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 검증 루프 + 조기 종료 발동 시각화 (Step 4)
    // ─────────────────────────────────────────────────────
    const VF_TONE = {
      infer:  { bg: 'bg-sky-50',     border: 'border-sky-400',    text: 'text-sky-800' },
      metric: { bg: 'bg-orange-50',  border: 'border-orange-300', text: 'text-orange-800' },
      best:   { bg: 'bg-emerald-50', border: 'border-emerald-400', text: 'text-emerald-800' },
      wait:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800' },
      stop:   { bg: 'bg-red-50',     border: 'border-red-400',    text: 'text-red-800' },
    };

    function ValidatePane({ valFlow, mapping, earlyStop }) {
      const [shown, setShown] = React.useState(0);
      React.useEffect(() => {
        setShown(0);
        const id = setInterval(() => {
          setShown((s) => {
            if (s >= earlyStop.series.length) { clearInterval(id); return s; }
            return s + 1;
          });
        }, 400);
        return () => clearInterval(id);
      }, [earlyStop]);
      const maxVal = 1.0;
      return (
        <div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5 mb-2">
            <div className="text-[11px] font-bold text-sky-900 mb-1.5">🔍 검증 루프 한 에폭 (갱신 없음)</div>
            <div className="space-y-1">
              {valFlow.map((v, i) => {
                const t = VF_TONE[v.kind];
                return (
                  <div key={i} className={`rounded border ${t.bg} ${t.border} px-2 py-1 flex items-center gap-2`}>
                    <span className="text-[10px] font-mono text-slate-400 w-3">{i + 1}</span>
                    <span className={`text-[11px] font-mono font-bold ${t.text} flex-1 truncate`}>{v.label}</span>
                    <span className="text-[9px] text-slate-500 truncate w-40 text-right">{v.detail}</span>
                  </div>
                );
              })}
            </div>
          </div>
          {/* 조기 종료 발동 시각화 — val_acc 막대 + patience 카운터 */}
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2">
            <div className="text-[11px] font-bold text-orange-900 mb-2">⏱ 조기 종료 발동 (patience 한계 {earlyStop.patienceLimit})</div>
            <div className="flex items-end gap-1 h-24 mb-1">
              {earlyStop.series.slice(0, shown).map((s, i) => (
                <div key={i} className="flex-1 flex flex-col items-center justify-end">
                  <span className={`text-[9px] font-bold mb-0.5 ${s.fired ? 'text-red-700' : s.best ? 'text-emerald-700' : 'text-amber-700'}`}>{s.val.toFixed(2)}</span>
                  <div
                    className={`w-full rounded-t ${s.fired ? 'bg-red-400' : s.best ? 'bg-emerald-400' : 'bg-amber-300'}`}
                    style={{ height: `${(s.val / maxVal) * 100}%` }}
                  ></div>
                  <span className="text-[9px] text-slate-500 mt-0.5">e{s.epoch}</span>
                </div>
              ))}
              {Array.from({ length: earlyStop.series.length - shown }).map((_, i) => (
                <div key={`ph${i}`} className="flex-1"></div>
              ))}
            </div>
            <div className="flex gap-1 flex-wrap">
              {earlyStop.series.slice(0, shown).map((s, i) => (
                <span
                  key={i}
                  className={`text-[9px] px-1.5 py-0.5 rounded border ${s.fired ? 'bg-red-100 border-red-400 text-red-800 font-bold' : s.best ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-amber-100 border-amber-300 text-amber-800'}`}
                >
                  {s.best ? '★best' : s.fired ? `🛑 break p=${s.patience}` : `p=${s.patience}`}
                </span>
              ))}
            </div>
            <div className="text-[9px] text-slate-500 mt-1.5">초록=개선(best 갱신·체크포인트) · 노랑=정체(patience↑) · 빨강=조기 종료 발동</div>
          </div>
          {mapping && (
            <div className="rounded-lg border-2 border-orange-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-orange-900 mb-1.5">🔗 수동 코드 ↔ 콜백(II-2-2) 대응</div>
              {mapping.map((m, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] mb-1 last:mb-0">
                  <span className="flex-1 font-mono text-slate-700 truncate">{m.manual}</span>
                  <span className="text-orange-500">≡</span>
                  <span className="flex-1 font-mono font-bold text-orange-800 truncate text-right">{m.callback}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 완성 — fit vs custom 비교표 + 선택 기준 (Step 5)
    // ─────────────────────────────────────────────────────
    function CompletePane({ compare, pickList }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3 mb-2">
            <div className="text-xs font-bold text-orange-900 mb-2">⚖️ fit() vs 커스텀 루프</div>
            <div className="grid grid-cols-[auto_1fr_1fr] gap-1 text-[10px]">
              <div className="font-bold text-slate-500 px-1"></div>
              <div className="font-bold text-center text-orange-800 bg-orange-100 rounded px-1 py-0.5">model.fit()</div>
              <div className="font-bold text-center text-emerald-800 bg-emerald-100 rounded px-1 py-0.5">커스텀 루프</div>
              {compare.rows.map((r, i) => (
                <React.Fragment key={i}>
                  <div className="font-bold text-slate-600 px-1 py-1 flex items-center">{r.axis}</div>
                  <div className={`rounded px-1.5 py-1 border ${r.fitWin ? 'bg-orange-50 border-orange-300 text-orange-900 font-semibold' : 'bg-white border-slate-200 text-slate-600'}`}>{r.fit}</div>
                  <div className={`rounded px-1.5 py-1 border ${!r.fitWin ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold' : 'bg-white border-slate-200 text-slate-600'}`}>{r.custom}</div>
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-orange-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧭 무엇을 언제 — 실무 선택 기준</div>
            <div className="space-y-1.5">
              {pickList.map((p, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="flex-1 text-slate-700">{p.when}</span>
                  <span className={`font-bold px-2 py-0.5 rounded text-white whitespace-nowrap ${p.tone === 'fit' ? 'bg-orange-600' : 'bg-emerald-600'}`}>{p.pick}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 청사진/스텝/메트릭/검증/완성 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      blueprint: { icon: '📐', label: '루프 청사진' },
      trainstep: { icon: '⚡', label: 'train_step (@tf.function)' },
      metrics:   { icon: '📊', label: '메트릭 생명주기' },
      validate:  { icon: '🔍', label: '검증 + 조기 종료' },
      complete:  { icon: '🏁', label: '완성 + 선택 기준' },
    };

    function LiveDataPane({ state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.blueprint;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>커스텀 루프 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.stage}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            흐름: {state.detail}
          </div>

          {state.mode === 'blueprint' && <BlueprintPane blueprint={state.blueprint} />}
          {state.mode === 'trainstep' && <TrainStepPane flow={state.stepFlow} traceNote={state.traceNote} />}
          {state.mode === 'metrics' && <MetricsPane lifecycle={state.lifecycle} metricsUsed={state.metricsUsed} bug={state.bug} />}
          {state.mode === 'validate' && <ValidatePane valFlow={state.valFlow} mapping={state.mapping} earlyStop={state.earlyStop} />}
          {state.mode === 'complete' && <CompletePane compare={state.compare} pickList={state.pickList} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-orange-200 text-orange-900">Part Ⅲ · 저수준 제어</span>
                <h1 className="text-2xl font-bold text-orange-900">III-1-2. 커스텀 학습 루프 완성</h1>
                <p className="text-sm text-orange-800/80">fit 없이 처음부터 끝까지 — 에폭·배치·검증·메트릭 전부 내 손으로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                커스텀 학습 루프는 fit() 이 자동으로 돌리던 6블록을 손으로 조립한 것이다 — 청사진(에폭·배치 이중 순회)에
                @tf.function train_step(tape→gradient→apply, I-2-1 그래프 가속)을 끼우고, keras.metrics 를
                update_state/result/reset_state 생명주기로 직접 집계한다(에폭 경계 reset 누락이 대표 버그).
                검증은 training=False 추론으로 돌리고 best 추적·patience·수동 체크포인트로 조기 종료를 재현한다 —
                이는 EarlyStopping·ModelCheckpoint 콜백과 1:1 대응한다. 결론: 표준이면 fit(),
                GAN·강화학습·다중 옵티마이저·특수 로깅이면 커스텀 루프를 연다. 다음 장에서 같은 모델을 두 방식으로 비교한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['커스텀학습루프', 'train_step', 'tf.function', 'GradientTape', 'apply_gradients', 'keras.metrics', 'update_state', 'reset_state', 'training=False', '조기종료', 'EarlyStopping', '체크포인트', 'fit vs custom'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./III-1-1.html" className="underline hover:no-underline">← 이전: III-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./III-1-3.html" className="underline hover:no-underline">다음: III-1-3 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
