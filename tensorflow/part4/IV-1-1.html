        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2">
            <div className="text-[11px] font-bold text-orange-800">📂 디스크 파일 → 픽셀 텐서 파이프라인</div>
          </div>
          <div className="space-y-1">
            {state.pipeline.map((p, i) => (
              <div key={i}>
                <div className="flex items-center gap-2 rounded border border-slate-300 bg-white px-2 py-1.5">
                  <span className="text-sm">{p.icon}</span>
                  <span className="text-[10px] font-mono font-bold text-orange-700 flex-1 truncate">{p.op}</span>
                  <span className="text-[9px] text-slate-500 w-32 text-right">{p.role}</span>
                </div>
                {i < state.pipeline.length - 1 && <div className="text-center text-orange-400 text-xs leading-none">▼</div>}
              </div>
            ))}
          </div>
          <div className="mt-2 rounded-lg border-2 border-orange-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">💾 cache() 의 효과</div>
            <div className="flex items-center gap-2 rounded bg-red-50 border border-red-200 px-2 py-1 mb-1">
              <span className="text-[9px] font-bold text-red-700 w-16">1 epoch</span>
              <span className="text-[10px] text-slate-600 flex-1">{state.cacheNote.first}</span>
            </div>
            <div className="flex items-center gap-2 rounded bg-emerald-50 border border-emerald-200 px-2 py-1">
              <span className="text-[9px] font-bold text-emerald-700 w-16">2 epoch~</span>
              <span className="text-[10px] text-slate-600 flex-1">{state.cacheNote.rest}</span>
            </div>
            <div className="text-[9px] text-amber-700 mt-1.5">⚠ {state.cacheNote.warn}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 표준 순서 조립도 + 병목 진단 + 두 sink
    // ─────────────────────────────────────────────────────
    function RecipePane({ state }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2">
            <div className="text-[11px] font-bold text-orange-800">🧩 표준 조립 순서 — 이걸 기본값으로</div>
          </div>
          {/* 조립도 */}
          <div className="flex items-center gap-1 mb-2">
            {state.recipe.map((r, i) => (
              <React.Fragment key={i}>
                <div className="flex-1 rounded-lg border-2 border-orange-400 bg-white p-1.5 text-center">
                  <div className="text-[11px] font-bold text-orange-800">{r.step}</div>
                </div>
                {i < state.recipe.length - 1 && <span className="text-orange-500 text-xs">→</span>}
              </React.Fragment>
            ))}
          </div>
          <div className="space-y-1 mb-2">
            {state.recipe.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <span className="font-mono font-bold text-orange-700 w-16">{r.step}</span>
                <span className="text-slate-600 flex-1">{r.why}</span>
              </div>
            ))}
          </div>
          {/* 병목 진단 */}
          <div className="rounded-lg border-2 border-orange-300 bg-white p-2.5 mb-2">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🔍 병목 진단</div>
            <div className="space-y-1">
              {state.diagnose.map((d, i) => (
                <div key={i} className="flex items-center gap-1.5 text-[9px]">
                  <span className="text-red-700 w-28">{d.symptom}</span>
                  <span className="text-slate-400">→</span>
                  <span className="font-bold text-amber-700 w-16">{d.cause}</span>
                  <span className="text-emerald-700 flex-1">{d.fix}</span>
                </div>
              ))}
            </div>
          </div>
          {/* 두 sink */}
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🔌 같은 ds 를 두 방식에 꽂기</div>
            <div className="grid grid-cols-2 gap-2">
              {state.sinks.map((s, i) => (
                <div key={i} className="rounded border border-orange-300 bg-white p-2">
                  <div className="text-[10px] font-bold text-orange-800 mb-1">{s.name}</div>
                  <div className="rounded bg-[#282c34] text-orange-200 font-mono text-[9px] px-1.5 py-1 mb-1 overflow-x-auto">{s.api}</div>
                  <div className="text-[9px] text-slate-500">{s.note}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 생성/체인/prefetch/파일/레시피 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      create:   { icon: '📦', label: 'Dataset 만들기' },
      chain:    { icon: '🔗', label: '변환 체인' },
      prefetch: { icon: '⚡', label: 'prefetch·병렬' },
      files:    { icon: '📂', label: '파일 파이프라인' },
      recipe:   { icon: '🧩', label: '표준 레시피' },
    };

    function LiveDataPane({ state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.create;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>데이터 파이프라인 — {md.label}</span>
            </h3>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200 overflow-x-auto whitespace-nowrap">
            체인: {state.stage}
          </div>

          {state.mode === 'create' && <CreatePane state={state} />}
          {state.mode === 'chain' && <ChainPane state={state} />}
          {state.mode === 'prefetch' && <PrefetchPane state={state} />}
          {state.mode === 'files' && <FilesPane state={state} />}
          {state.mode === 'recipe' && <RecipePane state={state} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">IV-1-1. tf.data 파이프라인 — map·batch·prefetch</h1>
                <p className="text-sm text-orange-800/80">GPU를 굶기지 마라 — 데이터 파이프라인이 학습 속도의 절반이다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                tf.data 는 데이터를 "하나씩 흐르는 스트림"으로 다룬다 — from_tensor_slices 로 만들고 map·shuffle·batch·repeat 를 체인으로 붙인다.
                shuffle 은 buffer_size 만큼만 섞는다는 것, 그리고 shuffle→batch 순서(정석)를 반드시 기억하라.
                prefetch(AUTOTUNE) 로 CPU 준비와 GPU 학습을 겹쳐 GPU 유휴를 없애고, 무거운 map 은 num_parallel_calls 로 병렬화한다.
                파일은 list_files→map(decode) 로 읽거나 image_dataset_from_directory 지름길을 쓰고, cache() 로 두 번째 epoch 부터 디코딩을 건너뛴다.
                표준 순서는 shuffle→map→batch→prefetch. 같은 Dataset 이 model.fit 과 커스텀 루프 양쪽에 그대로 들어간다. 다음은 TFRecord(IV-1-2).
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['tf.data', 'from_tensor_slices', 'map', 'shuffle', 'buffer_size', 'batch', 'repeat', 'prefetch', 'AUTOTUNE', 'num_parallel_calls', 'cache', 'image_dataset_from_directory'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 (TFRecord) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
