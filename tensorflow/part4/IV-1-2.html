  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */

      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    TensorFlow IV-1-2 — TFRecord·대용량 처리
    학습 목표: 이미지 100만 장을 학습시킬 때 "작은 파일 지옥"이 왜 병목인지 이해하고,
              TFRecord 라는 TF 표준 컨테이너로 그것을 어떻게 푸는지 5단계로 익힌다.
              작은 파일 문제(파일 열기·랜덤 IO·클라우드 요청 비용) → tf.train.Example
              직렬화 구조 → TFRecordWriter 로 샤드 쓰기 → TFRecordDataset+interleave
              병렬 읽기 → 규모별 실무 판단(과한 경우·대안 지도)까지.
    패턴: fastapi v1 — 좌(LiveDataPane: 작은 파일→샤드 묶기 애니메이션 + Example
          직렬화 구조도 + 샤드 interleave 병렬 읽기 타임라인 + 규모별 판단 가이드)
          / 우(VSCode CodeViewer: tfrecord_pipeline.py 진화)
    색상: orange (TF 브랜드 #FF6F00)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 작은 파일 문제 → Example 구조 → 샤드 쓰기 → interleave 읽기 → 규모 판단
    //   mode      : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //               'smallfiles'(작은 파일 무더기 → 샤드 묶기 + 오버헤드 표)
    //               'example'(tf.train.Example 직렬화 구조도)
    //               'write'(TFRecordWriter 샤드 쓰기)
    //               'read'(TFRecordDataset + interleave 병렬 읽기 타임라인)
    //               'judge'(규모별 판단 가이드 + 대안 지도)
    //   code      : 우측 CodeViewer 파일 (tfrecord_pipeline.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 작은 파일 지옥 — 100만 개 개별 JPEG 가 왜 병목인가',
        desc: '이미지 100만 장을 폴더에 그대로 두고 학습하면, GPU 는 놀고 디스크만 헐떡인다. 문제의 본질은 "파일 하나당 붙는 고정 비용"이다 — 파일을 열 때마다 OS 는 디렉터리를 뒤져 inode 를 찾고(open/stat 시스템 콜), 그 위치로 디스크 헤드를 옮긴다(랜덤 IO). 셔플 학습에서는 매 스텝 무작위 순서로 접근하니 순차 읽기의 이점도 사라진다. 클라우드(S3·GCS)라면 더 아프다 — 객체 하나가 곧 GET 요청 하나라, 100만 장이면 100만 번의 네트워크 왕복과 요청 과금이 된다. 3KB 짜리 썸네일을 읽으려고 수 ms 의 요청 지연을 매번 내는 셈이다. 해법의 방향은 단순하다: "작은 파일 100만 개를, 큰 파일 몇 개로 묶자." 이 큰 컨테이너가 바로 TFRecord 다.',
        mode: 'smallfiles',
        scene: '문제 · 작은 파일 100만 개',
        engineDetail: '개별 파일 = open + 랜덤 IO + 요청 과금',
        pileNote: '3KB~200KB 짜리 이미지 파일이 폴더에 흩뿌려져 있다',
        overhead: [
          { item: '파일 열기', detail: 'open/stat 시스템 콜 · inode 탐색', cost: '고정비 ×100만', tone: 'bad' },
          { item: '랜덤 IO', detail: '셔플 → 매 스텝 무작위 위치 접근', cost: '순차 읽기 이점 상실', tone: 'bad' },
          { item: '클라우드 요청', detail: 'S3/GCS 객체 1개 = GET 1회', cost: '왕복 지연 + 요청 과금', tone: 'bad' },
          { item: '메타데이터', detail: '파일마다 디렉터리 엔트리', cost: '목록 조회도 느려짐', tone: 'warn' },
        ],
        alert: { tone: 'danger', text: '병목은 이미지 "크기"가 아니라 파일 "개수"다. 3KB 를 읽는 데도 open·seek·요청 지연이라는 고정비가 100만 번 붙는다. 큰 파일 몇 개로 묶으면 이 고정비가 통째로 사라진다.' },
        code: {
          lang: 'python',
          filename: 'tfrecord_pipeline.py — ① 작은 파일 문제',
          lines: [
            '"""',
            'tfrecord_pipeline.py — ① 왜 개별 파일이 병목인가',
            '',
            '데이터셋: images/000001.jpg ... images/1000000.jpg  (100만 장)',
            '문제: 파일 "개수" 가 병목이다 — 크기가 아니라.',
            '"""',
            'import glob, time',
            'import tensorflow as tf',
            '',
            '# ── 순진한 방식: 개별 파일을 그대로 읽는다 ──',
            'paths = glob.glob("images/*.jpg")   # 100만 개 경로',
            '',
            'def load(path):',
            '    raw = tf.io.read_file(path)     # 파일마다 open + seek',
            '    img = tf.io.decode_jpeg(raw)',
            '    return img',
            '',
            'ds = tf.data.Dataset.from_tensor_slices(paths)',
            'ds = ds.shuffle(10000)              # 셔플 → 랜덤 IO 발생',
            'ds = ds.map(load).batch(32)',
            '',
            '# 무엇이 느린가?',
            '#  - open/stat 시스템 콜이 파일당 1번 (100만 번)',
            '#  - shuffle 이 접근을 무작위로 흩어 디스크 seek 폭증',
            '#  - S3/GCS 라면 파일 1개 = GET 요청 1개 → 왕복 지연·과금',

      // 작은 파일 무더기 → 샤드로 묶이는 것을 암시하는 정적 그리드 + 오버헤드 표
      const tiles = Array.from({ length: 48 });
      return (
        <div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5 mb-2">
            <div className="text-[11px] font-bold text-red-800 mb-1.5">🗂 개별 파일 100만 개 — {state.pileNote}</div>
            <div className="grid grid-cols-12 gap-0.5">
              {tiles.map((_, i) => (
                <span key={i} className="aspect-square rounded-[2px] bg-red-300/70 border border-red-400/50" title="tiny image file"></span>
              ))}
            </div>
            <div className="mt-1.5 text-center text-[10px] text-red-700">… 파일 하나하나마다 open · seek · 요청 지연이 붙는다 …</div>
          </div>
          <div className="flex items-center justify-center gap-2 text-[10px] text-slate-500 my-1.5">
            <span className="px-2 py-0.5 rounded bg-red-100 border border-red-300 text-red-800">작은 파일 100만 개</span>
            <span className="text-orange-500 font-bold">──▶ 묶자 ──▶</span>
            <span className="px-2 py-0.5 rounded bg-orange-100 border border-orange-300 text-orange-800">큰 파일 몇 개 (TFRecord)</span>
          </div>
          <div className="space-y-1">
            {state.overhead.map((o, i) => {
              const t = OH_TONE[o.tone] || OH_TONE.bad;
              return (
                <div key={i} className={`rounded border ${t.bg} ${t.border} px-2.5 py-1.5 flex items-center gap-2`}>
                  <span className="text-sm">{t.icon}</span>
                  <div className="min-w-0 flex-1">
                    <div className={`text-[11px] font-bold ${t.text}`}>{o.item}</div>
                    <div className="text-[10px] text-slate-500">{o.detail}</div>
                  </div>
                  <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-white/70 border border-current/20 text-red-700 whitespace-nowrap">{o.cost}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // tf.train.Example 직렬화 구조도 (Step 2)
    // ─────────────────────────────────────────────────────
    const FIELD_TONE = {
      bytes: { bg: 'bg-orange-50', border: 'border-orange-400', text: 'text-orange-900', chip: 'bg-orange-600' },
      int:   { bg: 'bg-sky-50',    border: 'border-sky-400',    text: 'text-sky-900',    chip: 'bg-sky-600' },
      float: { bg: 'bg-violet-50', border: 'border-violet-400', text: 'text-violet-900', chip: 'bg-violet-600' },
    };

    function ExampleBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">📦 {box.title}</div>
            <div className="rounded-lg border-2 border-orange-300 bg-orange-50/60 p-2">
              <div className="text-[10px] font-mono font-bold text-orange-800 mb-1.5 text-center">tf.train.Example · Features 딕셔너리</div>
              <div className="space-y-1.5">
                {box.fields.map((f, i) => {
                  const t = FIELD_TONE[f.tone] || FIELD_TONE.int;
                  return (
                    <div key={i} className={`rounded border ${t.bg} ${t.border} px-2 py-1.5`}>
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] font-mono font-bold text-slate-800 w-14">"{f.key}"</span>
                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded text-white ${t.chip}`}>{f.type}</span>
                        <span className="text-[10px] font-mono text-slate-600 flex-1 truncate text-right">{f.value}</span>
                      </div>
                      <div className={`text-[10px] mt-0.5 ${t.text}`}>👉 {f.note}</div>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="mt-2 flex items-center justify-center gap-2">
              <span className="text-orange-500 font-bold text-lg">↓</span>
            </div>
            <div className="rounded-lg bg-[#282c34] text-orange-200 font-mono text-[10px] px-2.5 py-2 overflow-x-auto">
              {box.serialize}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 샤드 쓰기 (Step 3)
    // ─────────────────────────────────────────────────────
    function WriteBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">💾 TFRecordWriter — 샤드로 나눠 쓰기</div>
            <div className="flex items-center justify-between text-[10px] mb-2">
              <span className="px-2 py-0.5 rounded bg-slate-100 border border-slate-300 text-slate-700">{box.totalNote}</span>
              <span className="px-2 py-0.5 rounded bg-orange-100 border border-orange-300 text-orange-800 font-bold">{box.shardSize}</span>
            </div>
            <div className="space-y-1">
              {box.shards.map((s, i) => (
                s.dots ? (
                  <div key={i} className="text-center text-slate-400 text-[11px] py-0.5">⋮ (중간 샤드 생략) ⋮</div>
                ) : (
                  <div key={i} className="flex items-center gap-2">
                    <span className="text-[10px] font-mono text-slate-600 w-40 truncate">{s.name}.tfrecord</span>
                    <div className="flex-1 h-3 rounded bg-orange-100 border border-orange-200 overflow-hidden">
                      <div className="h-full bg-orange-500" style={{ width: s.fill + '%' }}></div>
                    </div>
                    <span className="text-[9px] font-mono text-orange-700 w-10 text-right">≈128MB</span>
                  </div>
                )
              ))}
            </div>
          </div>
          <div className="mt-2 rounded-lg border-2 border-orange-300 bg-orange-50 p-2.5">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">📏 샤드 크기 감각</div>
            <div className="space-y-1">
              {box.rules.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className={r.good ? 'text-emerald-600 font-bold' : 'text-red-600 font-bold'}>{r.good ? '✓' : '✗'}</span>
                  <span className={r.good ? 'text-emerald-800' : 'text-slate-600'}>{r.text}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // interleave 병렬 읽기 타임라인 + 스키마 + 파이프라인 (Step 4)
    // ─────────────────────────────────────────────────────
    function ReadBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🔑 {box.schemaTitle}</div>
            <div className="space-y-1 mb-3">
              {box.schema.map((s, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold text-slate-800 w-14">"{s.key}"</span>
                  <span className="text-slate-400">→</span>
                  <span className="font-mono text-orange-700 flex-1">{s.spec}</span>
                </div>
              ))}
            </div>
            <div className="text-xs font-bold text-orange-900 mb-1.5">⏱ interleave — 샤드를 동시에 열어 번갈아 읽기</div>
            <div className="space-y-1">
              {box.lanes.map((lane, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono text-slate-600 w-14">{lane.name}</span>
                  <div className="flex-1 flex gap-1">
                    {lane.blocks.map((b, j) => (
                      <span key={j} className="flex-1 h-4 rounded bg-orange-400/80 border border-orange-500 flex items-center justify-center text-[8px] text-white font-mono">rec</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-1 text-center text-[9px] text-slate-500">→ 세 샤드를 순서대로가 아니라 "동시에" 읽어 GPU 를 굶기지 않는다</div>
          </div>
          <div className="mt-2 rounded-lg border-2 border-orange-300 bg-orange-50 p-2.5">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🔗 읽기 파이프라인 (IV-1-1 표준 레시피에 접속)</div>
            <div className="flex flex-wrap items-center gap-1">
              {box.pipeline.map((p, i) => (
                <React.Fragment key={i}>
                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-white border border-orange-300 text-orange-800 font-mono">{p}</span>
                  {i < box.pipeline.length - 1 && <span className="text-orange-400 text-[10px]">▶</span>}
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 규모별 판단 가이드 + 대안 지도 (Step 5)
    // ─────────────────────────────────────────────────────
    function JudgeBox({ box }) {
      if (!box) return null;
      const Col = ({ d, good }) => (
        <div className={`flex-1 rounded-lg border-2 p-2.5 ${good ? 'border-emerald-400 bg-emerald-50' : 'border-slate-400 bg-slate-50'}`}>
          <div className={`text-[11px] font-bold mb-1.5 ${good ? 'text-emerald-900' : 'text-slate-700'}`}>{d.title}</div>
          <ul className="space-y-1">
            {d.items.map((it, i) => (
              <li key={i} className={`text-[10px] flex items-start gap-1 ${good ? 'text-emerald-800' : 'text-slate-600'}`}>
                <span>{good ? '•' : '–'}</span><span>{it}</span>
              </li>
            ))}
          </ul>
        </div>
      );
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-500 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">⚖️ 규모로 판단하기</div>
            <div className="flex gap-2 items-stretch">
              <Col d={box.use} good={true} />
              <Col d={box.skip} good={false} />
            </div>
          </div>
          <div className="mt-2 rounded-lg border-2 border-orange-300 bg-orange-50 p-2.5">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">🗺 생태계 대안 지도</div>
            <div className="flex flex-wrap gap-1.5">
              {box.alts.map((a, i) => (
                <span key={i} className="text-[10px] px-2 py-1 rounded bg-white border border-orange-300">
                  <b className="text-orange-800">{a.name}</b>
                  <span className="text-slate-500"> · {a.where}</span>
                </span>
              ))}
            </div>
          </div>
          <div className="mt-2 rounded-lg bg-orange-100 border border-orange-300 px-2.5 py-1.5 text-[10px] text-orange-900">
            ➡️ {box.next}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 작은파일/Example/쓰기/읽기/판단 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      smallfiles: { icon: '🗂', label: '작은 파일 문제' },
      example:    { icon: '📦', label: 'Example 구조' },
      write:      { icon: '💾', label: '샤드 쓰기' },
      read:       { icon: '⏱', label: 'interleave 읽기' },
      judge:      { icon: '⚖️', label: '규모 판단' },
    };

    function LiveDataPane({ state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.smallfiles;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>대용량 파이프라인 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.scene}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            핵심: {state.engineDetail}
          </div>

          {state.mode === 'smallfiles' && <SmallFilesPane state={state} />}
          {state.mode === 'example' && <ExampleBox box={state.example} />}
          {state.mode === 'write' && <WriteBox box={state.write} />}
          {state.mode === 'read' && <ReadBox box={state.read} />}
          {state.mode === 'judge' && <JudgeBox box={state.judge} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">IV-1-2. TFRecord·대용량 처리</h1>
                <p className="text-sm text-orange-800/80">이미지 100만 장을 학습시키려면 — 작은 파일 지옥에서 벗어나는 TF의 답</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                병목은 이미지 크기가 아니라 파일 "개수"다 — open·seek·클라우드 요청 고정비가 100만 번 붙는다.
                해법은 작은 파일을 큰 파일로 묶는 TFRecord: 한 장을 tf.train.Example(bytes/float/int64)로 직렬화하고,
                이미지는 JPEG 바이트 그대로 담아(디코딩은 읽을 때) TFRecordWriter 로 100~200MB 샤드에 나눠 쓴다.
                읽을 땐 TFRecordDataset→interleave(병렬)→parse_single_example(스키마 필수)→decode_jpeg 로 풀어
                IV-1-1 표준 레시피에 접속한다. 단 규모로 판단하라 — 수천 장은 폴더로 충분하고, 수십만 장↑·클라우드에서 진가가 난다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['TensorFlow', 'TFRecord', 'tf.train.Example', 'BytesList', 'Int64List', 'TFRecordWriter', '샤드', 'TFRecordDataset', 'parse_single_example', 'interleave', 'decode_jpeg', 'AUTOTUNE'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./IV-1-1.html" className="underline hover:no-underline">← 이전: IV-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
