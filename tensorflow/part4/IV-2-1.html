  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    TensorFlow IV-2-1 — 분산 전략 — MirroredStrategy
    학습 목표: GPU가 여러 장일 때 학습을 어떻게 나눠 태우는가를 데이터 병렬의 관점에서 이해한다.
              왜 분산이 필요한가(데이터·모델이 커지면 한 장으로는 며칠) → MirroredStrategy 를
              단 3줄로 붙이는 법(scope 안에서 모델·옵티마이저 생성) → 내부 동작(각 GPU가 배치
              조각을 forward/backward → all-reduce 로 기울기 평균 → 동기 갱신, 글로벌 배치·lr
              선형 스케일링) → 커스텀 루프에서의 분산(strategy.run·per-replica 손실 리덕션) →
              전략 지도(Mirrored·MultiWorker·TPU·ParameterServer 비교)까지 5단계로 정리한다.
    패턴: fastapi v1 — 좌(LiveDataPane: GPU 복제·배치 분할·all-reduce 애니메이션 + 처리량 게이지
          + 전략 비교표) / 우(VSCode CodeViewer: distributed_tf.py 진화)
    색상: orange (TF 브랜드 #FF6F00)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 왜 분산 → 3줄 → 내부 동작(all-reduce) → 커스텀 루프 → 전략 지도
    //   mode      : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //               'why'(단일 vs 데이터 병렬 개념도) | 'threelines'(3줄 변환)
    //               'allreduce'(GPU 복제·배치 분할·all-reduce 애니메이션 + 처리량 게이지)
    //               'custom'(커스텀 루프 분산 흐름) | 'map'(전략 비교표)
    //   code      : 우측 CodeViewer 파일 (distributed_tf.py 진화)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 왜 분산인가 — 한 장으로 며칠 걸리는 학습을 나눠 태운다',
        desc: '데이터가 수백만 장으로 커지거나 모델이 무거워지면 GPU 한 장으로는 한 epoch에 몇 시간, 전체 학습에 며칠이 걸린다. 가장 쉬운 해법은 "데이터 병렬(data parallelism)" — 똑같은 모델을 GPU마다 복제해두고, 미니배치를 GPU 수만큼 조각내 각자 처리한 뒤 결과(기울기)만 합치는 방식이다. 모델은 그대로 두고 데이터만 쪼개므로 대부분의 학습에 바로 통한다(모델 자체가 한 장에 안 들어가는 초거대 모델일 때만 모델 병렬을 고민한다). 이는 PyTorch의 DDP(dl V-2-1)와 정확히 같은 아이디어이며, TensorFlow에서는 이것을 tf.distribute의 Strategy로 추상화한다.',
        mode: 'why',
        scope: '개념 · 데이터 병렬(data parallelism)',
        engineDetail: '같은 모델 복제 · 배치 분할 · 기울기 합산',
        why: {
          single: { title: 'GPU 1장', batch: '배치 256 전부', time: '≈ 4일', tone: 'slow' },
          parallel: { title: 'GPU 4장 (데이터 병렬)', batch: '각 64씩 병렬', time: '≈ 1일', tone: 'fast' },
          note: '모델은 그대로, 데이터만 쪼갠다 → PyTorch DDP(dl V-2-1)와 같은 발상',
        },
        alert: { tone: 'info', text: '먼저 데이터 병렬을 떠올려라. 모델을 복제하고 배치를 나누는 것만으로 대부분의 학습이 GPU 수에 비례해 빨라진다. 모델 병렬은 모델이 한 장에 안 들어갈 때만.' },
        code: {
          lang: 'python',
          filename: 'distributed_tf.py — ① 문제: 한 장으로는 느리다',
          lines: [
            '"""',
            'distributed_tf.py — ① 왜 분산 학습인가',
            '데이터 병렬: 같은 모델을 GPU마다 복제하고 배치를 쪼갠다.',
            '"""',
            'import tensorflow as tf',
            '',
            '# 사용 가능한 GPU 확인',
            'gpus = tf.config.list_physical_devices("GPU")',
            'print(f"GPU {len(gpus)}장 사용 가능")   # 예: GPU 4장 사용 가능',
            '',
            '# ── 단일 GPU 학습 (지금까지의 방식) ──',
            '# 배치 256을 GPU 한 장이 통째로 처리 → 한 epoch에 수 시간',
            'model = tf.keras.Sequential([',
            '    tf.keras.layers.Dense(256, activation="relu"),',
            '    tf.keras.layers.Dense(10, activation="softmax"),',
            '])',
            'model.compile(optimizer="adam",',
            '              loss="sparse_categorical_crossentropy",',
            '              metrics=["accuracy"])',
            'model.fit(train_ds, epochs=10)   # GPU 1장 → 며칠',
            '',
            '# 목표: 모델은 그대로 두고, 데이터를 GPU 수만큼 나눠',
            '#       병렬로 태워 학습 시간을 1/N 에 가깝게 줄인다.',

          ],

        },
      },

      if (!box) return null;
      const Card = ({ d }) => (
        <div className={`flex-1 rounded-lg border-2 p-3 ${d.tone === 'fast' ? 'border-orange-400 bg-orange-50' : 'border-slate-400 bg-slate-50'}`}>
          <div className={`text-[11px] font-bold mb-2 ${d.tone === 'fast' ? 'text-orange-900' : 'text-slate-700'}`}>{d.title}</div>
          <div className="flex gap-1 mb-2">
            {(d.tone === 'fast' ? [0,1,2,3] : [0]).map((g) => (
              <div key={g} className={`flex-1 rounded text-center text-[9px] font-bold py-2 border ${d.tone === 'fast' ? 'bg-orange-100 border-orange-300 text-orange-800' : 'bg-slate-100 border-slate-300 text-slate-600'}`}>
                GPU{g}
              </div>
            ))}
          </div>
          <div className="text-[10px] text-slate-600 mb-1">📦 {d.batch}</div>
          <div className={`text-sm font-bold ${d.tone === 'fast' ? 'text-orange-700' : 'text-slate-500'}`}>⏱ {d.time}</div>
        </div>
      );
      return (
        <div className="mt-1">
          <div className="flex gap-2 items-stretch">
            <Card d={box.single} />
            <div className="flex items-center text-orange-400 text-2xl">▶</div>
            <Card d={box.parallel} />
          </div>
          <div className="mt-2 rounded-lg bg-orange-100 border border-orange-300 px-2.5 py-1.5 text-[10px] text-orange-900 text-center font-bold">
            💡 {box.note}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 3줄 변환 + scope 안/밖 구분
    // ─────────────────────────────────────────────────────
    const LINE_TONE = {
      add:    { bg: 'bg-orange-50',  border: 'border-orange-400', text: 'text-orange-800', badge: '추가' },
      inside: { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-900',  badge: 'scope 안' },
      same:   { bg: 'bg-slate-50',   border: 'border-slate-300',  text: 'text-slate-600',  badge: '그대로' },
    };

    function ThreeLinesPane({ lines, inside, outside }) {
      if (!lines) return null;
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-800 mb-2">✂️ 기존 코드에서 바뀌는 부분</div>
            <div className="space-y-1.5">
              {lines.map((l) => {
                const t = LINE_TONE[l.tone] || LINE_TONE.same;
                return (
                  <div key={l.n} className={`rounded border ${t.bg} ${t.border} px-2 py-1.5 flex items-start gap-2`}>
                    <span className="text-[10px] font-mono text-slate-400 w-4 text-right mt-0.5">{l.n}</span>
                    <div className="min-w-0 flex-1">
                      <div className="text-[11px] font-mono font-bold text-slate-800 truncate">{l.code}</div>
                      <div className="text-[10px] text-slate-500">{l.note}</div>
                    </div>
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap ${t.text} bg-white/70 border border-current/20`}>{t.badge}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="mt-2 flex gap-2">
            <div className="flex-1 rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5">
              <div className="text-[11px] font-bold text-amber-900 mb-1">🔒 scope 안에서 만든다</div>
              <div className="flex flex-wrap gap-1">
                {inside.map((e, i) => (
                  <span key={i} className="text-[9px] px-1.5 py-0.5 rounded bg-white border border-amber-300 text-amber-800">{e}</span>
                ))}
              </div>
            </div>
            <div className="flex-1 rounded-lg border-2 border-slate-300 bg-slate-50 p-2.5">
              <div className="text-[11px] font-bold text-slate-700 mb-1">🔓 scope 밖이어도 OK</div>
              <div className="flex flex-wrap gap-1">
                {outside.map((e, i) => (
                  <span key={i} className="text-[9px] px-1.5 py-0.5 rounded bg-white border border-slate-300 text-slate-700">{e}</span>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — GPU 복제·배치 분할·all-reduce 애니메이션 + 처리량 게이지 + 스케일링 표
    // ─────────────────────────────────────────────────────
    function AllReducePane({ box, scaling, tick }) {
      if (!box) return null;
      const { globalBatch, replicas, perReplica } = box;
      // tick: 0 split → 1 compute → 2 all-reduce → 3 sync (반복)
      const phase = tick % 4;
      const phaseLabel = ['① 배치 분할', '② forward/backward', '③ all-reduce 평균', '④ 동기 갱신'][phase];
      const gpuActive = phase === 1;
      const merging = phase === 2;
      const synced = phase === 3;
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-xs font-bold text-orange-900">🔁 매 스텝 내부 · {phaseLabel}</div>
              <span className="text-[10px] font-mono text-slate-500">글로벌 배치 {globalBatch} → 각 {perReplica}</span>
            </div>
            {/* 글로벌 배치 박스 */}
            <div className={`rounded text-center text-[10px] font-bold py-1 mb-1.5 border ${phase === 0 ? 'bg-orange-200 border-orange-400 text-orange-900' : 'bg-slate-100 border-slate-300 text-slate-500'}`}>
              📦 글로벌 배치 {globalBatch}
            </div>
            <div className="text-center text-orange-400 text-xs mb-1.5">
              {phase === 0 ? '▼ 4조각으로 분할 ▼' : '│'}
            </div>
            {/* GPU 복제본 4개 */}
            <div className="flex gap-1.5 mb-1.5">
              {Array.from({ length: replicas }).map((_, g) => (
                <div key={g} className={`flex-1 rounded border-2 px-1 py-1.5 text-center transition ${
                  synced ? 'bg-emerald-100 border-emerald-400' :
                  gpuActive ? 'bg-orange-100 border-orange-400' :
                  'bg-slate-50 border-slate-300'}`}>
                  <div className="text-[9px] font-bold text-slate-700">GPU{g}</div>
                  <div className="text-[8px] text-slate-500 font-mono">배치 {perReplica}</div>
                  <div className="text-[10px] mt-0.5">
                    {synced ? '✓ 동일' : gpuActive ? '∇ 기울기' : '·'}
                  </div>
                </div>
              ))}
            </div>
            {/* all-reduce 화살표 */}
            <div className={`rounded text-center text-[10px] font-bold py-1 border transition ${
              merging ? 'bg-orange-500 border-orange-600 text-white' : 'bg-slate-100 border-slate-300 text-slate-400'}`}>
              {merging ? '◀━ ➕ all-reduce: 기울기 합산 후 평균 ➕ ━▶' : '─ all-reduce ─'}
            </div>
          </div>

          {/* 처리량 스케일 게이지 */}
          <div className="mt-2 rounded-lg border-2 border-orange-300 bg-orange-50 p-2.5">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[11px] font-bold text-orange-900">📈 처리량 스케일</span>
              <span className="text-[10px] font-mono text-orange-700">~{replicas}× (이상적)</span>
            </div>
            <div className="h-3 rounded-full bg-white border border-orange-200 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-orange-400 to-orange-600 transition-all duration-500"
                   style={{ width: `${Math.min(100, ((phase + 1) / 4) * 100)}%` }}></div>
            </div>
            <div className="text-[9px] text-orange-700 mt-1">GPU {replicas}장 → 이론상 학습 시간 1/{replicas} (통신 비용만큼 손해)</div>
          </div>

          {/* 글로벌 배치·lr 스케일링 표 */}
          {scaling && (
            <div className="mt-2 rounded-lg border-2 border-orange-400 bg-white p-2.5">
              <div className="text-[11px] font-bold text-orange-900 mb-1.5">⚖️ 배치·lr 조정 (linear scaling)</div>
              <div className="space-y-1">
                {scaling.map((r, i) => (
                  <div key={i} className="flex items-center gap-2 text-[10px]">
                    <span className="w-20 font-bold text-slate-700">{r.label}</span>
                    <span className="font-mono text-slate-400 line-through w-24 text-right">{r.single}</span>
                    <span className="text-orange-500">▶</span>
                    <span className="font-mono font-bold text-orange-800 flex-1">{r.multi}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 커스텀 루프 분산 흐름 + 손실 리덕션 함정
    // ─────────────────────────────────────────────────────
    function CustomPane({ flow, pitfall }) {
      if (!flow) return null;
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-800 mb-2">🔧 커스텀 루프에 분산 접목</div>
            <div className="space-y-1.5">
              {flow.map((it, i) => <FlowRow key={i} item={it} idx={i} />)}
            </div>
          </div>
          {pitfall && (
            <div className="mt-2 rounded-lg border-2 border-red-400 bg-red-50 p-3">
              <div className="text-xs font-bold text-red-900 mb-2">🚨 손실 리덕션 함정 (per-replica)</div>
              <div className="space-y-1.5">
                <div className="rounded bg-white border border-red-300 px-2 py-1.5">
                  <div className="text-[10px] font-mono text-red-700">✗ {pitfall.bad}</div>
                </div>
                <div className="rounded bg-white border border-emerald-300 px-2 py-1.5">
                  <div className="text-[10px] font-mono text-emerald-700">✓ {pitfall.good}</div>
                </div>
              </div>
              <div className="text-[10px] text-red-800 mt-2 font-bold">👉 {pitfall.note}</div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 전략 비교표 + 다음 장 예고
    // ─────────────────────────────────────────────────────
    const STRAT_TONE = {
      primary: 'bg-orange-100 border-orange-400 text-orange-900',
      multi:   'bg-amber-100 border-amber-400 text-amber-900',
      tpu:     'bg-rose-100 border-rose-300 text-rose-800',
      ps:      'bg-slate-100 border-slate-300 text-slate-700',
    };

    function StrategyMapPane({ table, next }) {
      if (!table) return null;
      return (
        <div className="mt-1">
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🗺 tf.distribute 전략 지도</div>
            <div className="space-y-1.5">
              {table.map((r, i) => (
                <div key={i} className={`rounded-lg border px-2 py-1.5 ${STRAT_TONE[r.tone] || STRAT_TONE.ps}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-mono font-bold">{r.name}</span>
                    <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-white/70 border border-current/20">{r.sync}</span>
                  </div>
                  <div className="flex items-center justify-between mt-0.5">
                    <span className="text-[10px]">{r.scope}</span>
                    <span className="text-[9px] font-bold">👉 {r.when}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
          {next && (
            <div className="mt-2 rounded-xl border-2 border-orange-300 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
              <div className="text-xs font-bold text-orange-900 mb-2">🔮 다음 장 예고 — 분산 위에 얹는 속도 무기</div>
              <div className="space-y-1.5">
                {next.map((n, i) => (
                  <div key={i} className="flex items-center gap-2 text-[10px]">
                    <span className="font-bold px-2 py-0.5 rounded bg-orange-600 text-white whitespace-nowrap">{n.tag}</span>
                    <span className="text-slate-600 flex-1">{n.what}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 개념도/3줄/all-reduce/커스텀/지도 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      why:        { icon: '🧩', label: '데이터 병렬 개념' },
      threelines: { icon: '✂️', label: 'MirroredStrategy 3줄' },
      allreduce:  { icon: '🔁', label: 'all-reduce 내부 동작' },
      custom:     { icon: '🔧', label: '커스텀 루프 분산' },
      map:        { icon: '🗺', label: '전략 지도' },
    };

    function LiveDataPane({ state, tick }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.why;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>분산 학습 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.scope}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            엔진: {state.engineDetail}
          </div>

          {state.mode === 'why' && <WhyPane box={state.why} />}
          {state.mode === 'threelines' && <ThreeLinesPane lines={state.threelines} inside={state.insideScope} outside={state.outsideScope} />}
          {state.mode === 'allreduce' && <AllReducePane box={state.allreduce} scaling={state.scaling} tick={tick} />}
          {state.mode === 'custom' && <CustomPane flow={state.customFlow} pitfall={state.pitfall} />}
          {state.mode === 'map' && <StrategyMapPane table={state.strategyTable} next={state.nextTopics} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [tick, setTick] = useState(0);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // all-reduce 애니메이션 틱 (Step 3 에서만 의미) — 900ms마다 위상 전환
      useEffect(() => {
        const id = setInterval(() => setTick((t) => t + 1), 900);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-orange-200 text-orange-900 mb-1">Part Ⅳ · 확장과 최적화</span>
                <h1 className="text-2xl font-bold text-orange-900">IV-2-1. 분산 전략 — MirroredStrategy</h1>
                <p className="text-sm text-orange-800/80">GPU 4장을 코드 세 줄로 — Strategy 스코프가 처리하는 동기화의 마법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} tick={tick} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                데이터가 커지면 데이터 병렬 — 같은 모델을 GPU마다 복제하고 배치를 쪼개 병렬로 태운다(PyTorch DDP와 같은 발상).
                TensorFlow에서는 MirroredStrategy를 3줄로 붙인다 — 전략 생성, scope 안에서 모델·옵티마이저 생성, fit은 그대로.
                매 스텝 내부에서는 각 GPU가 배치 조각을 forward/backward하고 all-reduce로 기울기를 평균낸 뒤 동기 갱신한다 — 배치를 키운 만큼 lr도 선형으로 키운다.
                커스텀 루프에는 strategy.run과 distribute_datasets_from_function으로 접목하되, per-replica 손실은 반드시 글로벌 배치로 나눈다.
                한 머신 멀티 GPU면 MirroredStrategy, 멀티 노드면 MultiWorkerMirrored, 그리고 TPU·ParameterServer가 있다. 다음은 혼합 정밀·XLA로 이 분산을 더 빠르게.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['TensorFlow', 'tf.distribute', 'MirroredStrategy', '데이터병렬', 'strategy.scope', 'all-reduce', '글로벌배치', 'linear-scaling', 'strategy.run', 'per-replica손실', 'MultiWorkerMirrored', 'TPUStrategy'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
