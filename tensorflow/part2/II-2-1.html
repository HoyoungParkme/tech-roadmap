            <div className="rounded-lg border-2 border-orange-500 bg-orange-100 px-3 py-1.5 text-center">
              <div className="text-[11px] font-mono font-bold text-orange-900">{m.merge}</div>
              <div className="text-[9px] text-orange-700">두 브랜치를 하나로</div>
            </div>
          </div>
          <Arrow dir="down" label="Dense(64)" />
          {/* 출력 헤드 2개 + loss */}
          <div className="grid grid-cols-2 gap-2">
            {m.outputs.map((o, i) => (
              <div key={i} className={`rounded-lg border-2 p-2 ${o.tone === 'price' ? 'border-emerald-400 bg-emerald-50' : 'border-violet-400 bg-violet-50'}`}>
                <div className="flex items-center justify-between mb-1">
                  <span className={`text-[11px] font-mono font-bold ${o.tone === 'price' ? 'text-emerald-900' : 'text-violet-900'}`}>🎯 {o.name}</span>
                  <span className="text-[9px] text-slate-500 font-mono">{o.head}</span>
                </div>
                <div className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white border border-slate-200 text-slate-700 mb-1 truncate">loss: {o.loss}</div>
                <div className="text-[9px] text-slate-600">weight: <span className="font-bold font-mono">{o.weight}</span></div>
              </div>
            ))}
          </div>
          <div className="mt-2 rounded-lg bg-orange-100 border border-orange-300 px-2.5 py-1.5 text-[10px] text-orange-900 text-center">
            🔗 compile 3인방이 출력별로 확장: <span className="font-mono">loss=&#123;...&#125;</span> · <span className="font-mono">loss_weights=&#123;...&#125;</span> · <span className="font-mono">metrics=&#123;...&#125;</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 세 방식 선택표
    // ─────────────────────────────────────────────────────
    const WAY_TONE = {
      seq:  'border-slate-400 bg-slate-50',
      func: 'border-orange-500 bg-orange-50',
      sub:  'border-violet-400 bg-violet-50',
    };

    function MapPane({ state }) {
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-3">
            <div className="text-[11px] font-bold text-orange-800">🗺 Keras 모델 만드는 세 갈래 — 무엇을 언제?</div>
          </div>
          <div className="space-y-2">
            {state.ways.map((w, i) => (
              <div key={i} className={`rounded-lg border-2 p-2.5 ${WAY_TONE[w.tone]}`}>
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="text-[12px] font-bold text-slate-800">{w.name}</span>
                  <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white border border-slate-300 text-slate-600">{w.shape}</span>
                  {w.tone === 'func' && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-orange-600 text-white">Keras 주력</span>}
                </div>
                <div className="grid grid-cols-2 gap-x-2 gap-y-0.5 text-[10px]">
                  <div className="text-slate-600">🎯 <span className="font-bold">쓸 때:</span> {w.when}</div>
                  <div className="text-emerald-700">👍 {w.pros}</div>
                  <div className="text-slate-500 col-span-2">👎 {w.cons}</div>
                </div>
                <div className="mt-1 text-[9px] text-slate-500 border-t border-slate-200 pt-1">
                  🔥 PyTorch 대응: <span className="font-mono">{w.pt}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 벽/문법/분기/다중/지도 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      wall:   { icon: '🚧', label: 'Sequential의 벽' },
      syntax: { icon: '⚡', label: '함수형 문법' },
      branch: { icon: '🔀', label: '분기와 병합' },
      multi:  { icon: '🏗', label: '다중 입력·출력' },
      map:    { icon: '🗺', label: '세 방식 지도' },
    };

    function LiveDataPane({ state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.wall;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>모델 구조 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.era}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            핵심: {state.engineDetail}
          </div>

          {state.mode === 'wall'   && <WallPane state={state} />}
          {state.mode === 'syntax' && <SyntaxPane state={state} />}
          {state.mode === 'branch' && <BranchPane state={state} />}
          {state.mode === 'multi'  && <MultiPane state={state} />}
          {state.mode === 'map'    && <MapPane state={state} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">II-2-1. 함수형 API — 다중 입력·출력·분기</h1>
                <p className="text-sm text-orange-800/80">Sequential이 일직선이라면 함수형은 지도 — 층을 함수처럼 연결해 그래프를 그린다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Sequential은 입력 1·출력 1의 일직선 스택이라 다중 입출력·분기·공유 층을 표현할 수 없다.
                함수형 API는 "층을 텐서에 함수처럼 호출한다"는 발상으로 텐서를 이어붙여 그래프(DAG)를 그리고, Model(inputs, outputs)로 사이 경로를 자동 완성한다.
                concatenate(옆으로 잇기)·add(잔차로 더하기)로 갈래를 합쳐 skip connection·와이드&딥을 만들고,
                입력 2·출력 2 모델은 compile에서 loss를 층 이름 딕셔너리로 주고 loss_weights로 균형을 맞춘다.
                원칙: 일직선이면 Sequential, 그래프면 함수형(Keras 주력·시각화·직렬화), 진짜 동적 구조에서만 서브클래싱(Part Ⅲ). 함수형은 PyTorch nn.Module을 미리 만들고 forward에서 연결하는 것과 닮았다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['TensorFlow', 'Keras', '함수형API', 'Functional', 'Input', 'Model', '다중입력', '다중출력', 'concatenate', 'add', 'skip connection', '와이드&딥', 'loss_weights', 'plot_model', '서브클래싱'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
