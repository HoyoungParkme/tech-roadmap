    function LossCurve({ loss, valLoss }) {
      const W = 260, H = 110, padL = 28, padB = 20, padT = 8, padR = 8;
      const all = [...loss, ...valLoss];
      const maxY = Math.max(...all), minY = Math.min(...all);
      const n = loss.length;
      const xOf = (i) => padL + (i / (n - 1)) * (W - padL - padR);
      const yOf = (v) => padT + (1 - (v - minY) / (maxY - minY || 1)) * (H - padT - padB);
      const path = (arr) => arr.map((v, i) => `${i === 0 ? 'M' : 'L'}${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 130 }}>
          {/* 축 */}
          <line x1={padL} y1={padT} x2={padL} y2={H - padB} stroke="#cfc9ba" strokeWidth="1" />
          <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke="#cfc9ba" strokeWidth="1" />
          {/* 곡선 */}
          <path d={path(loss)} fill="none" stroke="#ea580c" strokeWidth="2" />
          <path d={path(valLoss)} fill="none" stroke="#64748b" strokeWidth="2" strokeDasharray="4 3" />
          {loss.map((v, i) => <circle key={'l' + i} cx={xOf(i)} cy={yOf(v)} r="2.5" fill="#ea580c" />)}
          {valLoss.map((v, i) => <circle key={'v' + i} cx={xOf(i)} cy={yOf(v)} r="2.5" fill="#64748b" />)}
          {/* 라벨 */}
          <text x={padL - 4} y={yOf(maxY) + 3} textAnchor="end" fontSize="8" fill="#8a8578">{maxY.toFixed(2)}</text>
          <text x={padL - 4} y={yOf(minY) + 3} textAnchor="end" fontSize="8" fill="#8a8578">{minY.toFixed(2)}</text>
          <text x={W / 2} y={H - 4} textAnchor="middle" fontSize="8" fill="#8a8578">epoch →</text>
        </svg>
      );
    }

                <tr className="bg-orange-50 border-t-2 border-orange-300">
                  <td colSpan="2" className="px-2 py-1.5 font-bold text-orange-900">Total params</td>
                  <td className="px-2 py-1.5 text-right font-mono font-bold text-orange-900">{fmt(s.total)}</td>
                </tr>
              </tfoot>
            </table>
          </div>
          {/* 파라미터 공식 */}
          <div className="rounded-lg border-2 border-orange-300 bg-gradient-to-br from-orange-50 to-amber-50 p-3">
            <div className="text-xs font-bold text-orange-900 mb-1.5">🧮 Dense 파라미터 공식</div>
            <div className="text-center font-mono text-[12px] text-orange-900 bg-white rounded border border-orange-200 py-2">
              (입력 뉴런 × 출력 뉴런) + 출력 뉴런<span className="text-slate-400 text-[10px]"> (편향)</span>
            </div>
            <div className="mt-1.5 text-[10px] text-slate-600 font-mono text-center">
              784 × 128 + 128 = 100,480 &nbsp;·&nbsp; 128 × 10 + 10 = 1,290
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 방식 1 지도 — 커버 범위 + 로드맵 (Step 5)
    // ─────────────────────────────────────────────────────
    function RoadmapPane({ state }) {
      const c = state.coverage;
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-2.5 mb-2">
            <div className="text-[11px] font-bold text-orange-800">🗺 Sequential 이 커버하는 범위</div>
          </div>
          <div className="grid grid-cols-2 gap-2 mb-3">
            <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5">
              <div className="text-[11px] font-bold text-emerald-900 mb-1.5">✅ 된다 (순차 모델)</div>
              <div className="space-y-1">
                {c.can.map((x, i) => (
                  <div key={i} className="text-[10px] text-emerald-800 flex items-center gap-1">
                    <span className="text-emerald-500">✓</span>{x}
                  </div>
                ))}
              </div>
            </div>
            <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
              <div className="text-[11px] font-bold text-red-900 mb-1.5">❌ 안 된다 → 함수형 API</div>
              <div className="space-y-1">
                {c.cannot.map((x, i) => (
                  <div key={i} className="text-[10px] text-red-800 flex items-center gap-1">
                    <span className="text-red-500">✗</span>{x}
                  </div>
                ))}
              </div>
            </div>
          </div>
          {/* 다음 단계 로드맵 */}
          <div className="rounded-xl border-2 border-orange-400 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧭 다음 단계 예고</div>
            <div className="space-y-1.5">
              {state.roadmap.map((r, i) => (
                <div key={i} className="flex items-stretch gap-2">
                  <span className="text-[10px] font-bold px-2 py-1 rounded bg-orange-600 text-white w-16 flex items-center justify-center text-center">{r.part}</span>
                  <div className="flex-1 rounded border border-orange-200 bg-orange-50 px-2 py-1">
                    <div className="text-[11px] font-bold text-orange-900">{r.way}</div>
                    <div className="text-[10px] text-slate-600 font-mono">{r.focus}</div>
                  </div>
                  <span className="text-[9px] text-slate-500 w-24 flex items-center">🎯 {r.goal}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 조립/fit/추론/검사/지도 (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      build:   { icon: '🧱', label: '5줄로 조립·학습' },
      fit:     { icon: '🔁', label: 'fit 자동 처리' },
      infer:   { icon: '🎯', label: '3형제 역할' },
      inspect: { icon: '🔬', label: 'summary 해부' },
      roadmap: { icon: '🗺', label: '방식 1 지도' },
    };

    function LiveDataPane({ state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.build;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>Keras 방식 1 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.phase}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-2 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            핵심: {state.engineDetail}
          </div>

          {state.mode === 'build' && <BuildPane state={state} />}
          {state.mode === 'fit' && <FitPane state={state} />}
          {state.mode === 'infer' && <InferPane state={state} />}
          {state.mode === 'inspect' && <InspectPane state={state} />}
          {state.mode === 'roadmap' && <RoadmapPane state={state} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">II-1-1. Sequential — 층 쌓고 compile·fit 끝</h1>
                <p className="text-sm text-orange-800/80">방식 1의 정수 — 5줄로 학습까지, "그냥 호출해서 쓴다"의 실체</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                방식 1의 정수는 5줄이다 — Sequential 로 층을 쌓고, compile 로 옵티마이저·손실·메트릭을 장착하고, fit 한 줄로 MNIST 가 실제 학습된다.
                fit 은 배치·셔플·에폭 루프·역전파·집계·진행바까지 대신하고, History 로 학습 곡선을, validation_split 로 검증 손실을 공짜로 준다.
                다루는 메서드는 fit(학습)·evaluate(평가·가중치 불변, 테스트셋)·predict(추론·배치·argmax) 3형제로 역할이 분명하다.
                summary() 는 층별 shape·파라미터((입력×출력)+편향)를 보여주므로 Sequential 은 블랙박스가 아니다.
                순차 모델이면 여기까지로 충분하고, 분기가 필요하면 함수형 API(II-2-1), fit 내부가 궁금하면 GradientTape(Part Ⅲ)로 내려간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Sequential', 'compile', 'fit', 'MNIST', 'History', 'validation_split', 'evaluate', 'predict', 'argmax', 'summary', 'params', '함수형API'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
