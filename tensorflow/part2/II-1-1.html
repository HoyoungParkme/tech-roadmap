  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    TensorFlow II-1-1 — Sequential — 층 쌓고 compile·fit 끝
    학습 목표: 방식 1(Keras 고수준 API)의 정수를 손에 쥔다. Sequential 로 층을 쌓고,
              compile 로 옵티마이저·손실·메트릭을 장착하고, fit 한 줄로 MNIST 가 실제로
              학습되는 전 과정을 본다. fit 이 자동으로 해주는 일(배치·셔플·에폭 루프·역전파·
              메트릭 집계·진행바)과 History, validation_split, evaluate/predict 3형제,
              summary() 로 모델을 해부하는 법까지 5단계로 정리한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 5줄 실행 애니메이션 + 층 스택 조립 + fit 진행바·
          loss 곡선 + 3형제 역할표 + summary 해부도 + 방식 1 지도) / 우(VSCode CodeViewer:
          keras_sequential.py 진화)
    색상: orange (TF 브랜드 #FF6F00)
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 5줄의 전력 → fit이 하는 일 → 3형제 → 모델 검사 → 방식 1 지도
    //   mode : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //          'build'(5줄 실행 + 층 스택 조립 + fit 진행바) |
    //          'fit'(fit 자동 처리 목록 + loss 곡선 + validation) |
    //          'infer'(fit/evaluate/predict 3형제 역할) |
    //          'inspect'(summary 해부도) | 'roadmap'(방식 1 지도)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      build: {lang:"python", filename:"keras_sequential.py — ① 5줄로 학습까지", lines:[
        "\"\"\"",
        "keras_sequential.py — ① 방식 1의 정수: 5줄로 학습 끝",
        "Sequential 로 층을 쌓고 → compile 로 장착 → fit 으로 학습.",
        "\"\"\"",
        "from tensorflow import keras",
        "from tensorflow.keras import layers",
        "",
        "# ── 데이터: MNIST 손글씨 숫자 (28×28 흑백) ──",
        "(x_train, y_train), _ = keras.datasets.mnist.load_data()",
        "x_train = x_train / 255.0        # 0~255 → 0~1 정규화",
        "",

    const S1 = { title:"Step 1. 5줄의 전력 — Sequential → compile → fit, MNIST가 진짜 학습된다", desc:"방식 1의 정수는 \"그냥 호출해서 쓴다\"이다. 층을 리스트로 쌓아 keras.Sequential 을 만들고, compile 로 옵티마이저·손실·메트릭 세 가지를 붙이고, fit 을 한 번 부르면 손글씨 숫자(MNIST)가 실제로 분류된다 — 여기까지 딱 5줄이다. 왜 이렇게 짧은가? placeholder·Session·수동 역전파 같은 저수준 배관을 Keras 가 전부 기본값 뒤로 감췄기 때문이다. optimizer=\"adam\" 문자열 하나가 옵티마이저 객체 생성을, loss 문자열 하나가 손실 함수 선택을 대신한다. 초보자가 \"기본값이 다 해준다\"를 몸으로 느끼는 지점이 바로 이 5줄이며, 정확도가 첫 에폭부터 90%를 넘기는 걸 보면 그 실감이 확실해진다." };
    const S2 = { title:"Step 2. fit이 대신 해주는 일들 — 그리고 History·validation_split", desc:"fit 한 줄이 짧다고 하는 일이 적은 건 아니다 — 오히려 학습 루프의 거의 전부를 대신한다. 데이터를 batch_size(기본 32)로 잘라 미니배치를 만들고, 에폭마다 셔플하고, 각 배치에서 순전파→손실 계산→역전파→가중치 갱신을 돌리고, loss·accuracy 를 집계해 진행바로 보여준다. 이걸 손으로 짜면 수십 줄인데 fit 은 인자 몇 개로 통제한다. 반환값 History 객체에는 에폭별 loss 가 리스트로 쌓여 있어 history.history[\"loss\"] 로 학습 곡선을 그릴 수 있고, validation_split=0.2 한 줄이면 훈련 데이터의 20%를 자동으로 떼어 매 에폭 검증 손실까지 재준다. 학습 곡선이 우하향하다 검증 손실이 다시 올라가면 그게 과적합 신호다 — fit 이 그 데이터를 공짜로 준다." };
    const S3 = { title:"Step 3. evaluate와 predict — 학습·평가·추론 3형제의 역할 구분", desc:"모델을 다루는 메서드는 셋이며 역할이 분명히 다르다. fit 은 정답을 주고 가중치를 바꾼다(학습). evaluate 는 정답을 주지만 가중치를 바꾸지 않고 손실·정확도만 되돌린다(평가) — 반드시 학습에 쓰지 않은 테스트셋으로 불러야 진짜 성능이다. predict 는 정답 없이 입력만 받아 확률 벡터를 반환한다(추론). 실무 함정 하나: predict 는 한 장을 넣어도 \"배치\" 를 기대하므로 (28,28) 이미지를 (1,28,28) 로 감싸 넣어야 한다. 그리고 softmax 출력은 10개 확률이라 argmax 로 가장 큰 인덱스를 뽑아야 \"이 숫자는 7\" 같은 최종 답이 된다. 세 메서드를 헷갈리면 \"평가한다면서 fit 을 부르는\" 실수로 테스트셋에까지 학습이 새어 들어간다." };
    const S4 = { title:"Step 4. 모델 검사 — summary()로 shape·파라미터를 읽는다", desc:"Sequential 은 블랙박스가 아니다. model.summary() 는 층마다 출력 shape 와 파라미터 수를 표로 보여준다. 파라미터 계산이 핵심인데, Dense 층의 가중치 수는 (입력 뉴런 × 출력 뉴런) + 출력 뉴런(편향)이다. 예를 들어 Flatten 후 784차원이 Dense(128) 로 가면 784×128 + 128 = 100,480 개, 다음 Dense(10) 은 128×10 + 10 = 1,290 개다(dl II-1-2 의 계산과 정확히 연결된다). Flatten 은 모양만 바꾸므로 파라미터가 0 이다. 이 숫자가 왜 중요한가? 총 파라미터가 데이터 양에 비해 지나치게 많으면 과적합 위험이 크고, 메모리·속도도 여기서 가늠된다. 더 깊이 들여다보려면 model.layers 로 층에 접근하고 layer.get_weights() 로 실제 가중치 배열을 꺼낼 수 있다 — 값이 눈에 보이는 순간 블랙박스라는 느낌이 사라진다." };
    const S5 = { title:"Step 5. 방식 1의 지도 — Sequential이 커버하는 범위와 다음 단계", desc:"Sequential 은 \"입력 → 층 → 층 → 출력\" 으로 한 줄로 흐르는 순차 모델 전부를 커버한다 — MLP, 기본 CNN, 단순 RNN 대부분이 여기 들어온다. 하지만 한 입력을 두 갈래로 나누거나(분기), 여러 입력을 합치거나(다중 입력), 층을 건너뛰는 잔차 연결(skip connection)이 필요하면 Sequential 로는 표현할 수 없다 — 그때 함수형 API(II-2-1)로 넘어간다. 지금 당장의 다음 장(다음 절)은 compile 3인방을 깊게 판다: optimizer·loss·metrics 를 문자열로 줄 때와 객체로 줄 때의 차이(학습률 조정, 커스텀 손실 등)를 다룬다. 그리고 fit 이 내부에서 정확히 무엇을 대신했는지 — 배치 루프와 역전파를 손으로 짜는 것 — 이 궁금해지면 그건 방식 2(GradientTape), Part Ⅲ의 영역이다. 순서 원칙은 하나다: 표준이면 Sequential+fit 으로 결과부터 얻고, 구조가 복잡해지거나 루프를 통제해야 할 때만 아래로 내려간다." };

    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

            <tr><td>2</td><td><code>x / 255.0</code></td><td>픽셀 0~255 → 0~1 정규화</td></tr>
            <tr><td>3</td><td><code>keras.Sequential([...])</code></td><td>Flatten → Dense(128, relu) → Dense(10, softmax)</td></tr>
            <tr><td>4</td><td><code>compile("adam", loss, ["accuracy"])</code></td><td>옵티마이저·손실·지표 장착</td></tr>
            <tr><td>5</td><td><code>fit(x, y, epochs=5)</code></td><td>배치·셔플·역전파·집계까지 전부</td></tr>
          </tbody></table>
          <p className="mt-2">에폭별 실행값 (TF 2.21 · Keras 3.15, seed 0): accuracy 0.930 · 0.968 · 0.978 · 0.984 · 0.989, loss 0.251 · 0.111 · 0.075 · 0.055 · 0.040. 시드와 버전에 따라 소수 셋째 자리는 조금씩 달라진다.</p>
        </div>
      );
      if (m === 'fit') return (
        <div>
          <h4>fit 이 대신 하는 일</h4>
          <ul>
            <li>배치 나누기 — batch_size=32 (기본값)</li>
            <li>에폭마다 섞기 — shuffle=True (기본값)</li>
            <li>에폭 루프 — epochs 번 전체 데이터 반복</li>
            <li>순전파 → 손실 → 역전파 → 가중치 갱신</li>
            <li>loss·accuracy 배치 평균 집계, 진행바 출력 (검증 20%를 떼면 1500/1500)</li>
            <li>validation_split=0.2 — 셔플 전에 데이터 끝 20%를 검증으로 뗀다</li>
          </ul>
          <h4 className="mt-2">history.history (validation_split=0.2 실행값)</h4>
          <table><thead><tr><th>epoch</th><th>loss</th><th>val_loss</th><th>accuracy</th><th>val_accuracy</th></tr></thead><tbody>
            {[[1, 0.2821, 0.1656, 0.9199, 0.9511], [2, 0.1269, 0.1265, 0.9622, 0.9631], [3, 0.0856, 0.1163, 0.9750, 0.9653], [4, 0.0624, 0.1102, 0.9824, 0.9665], [5, 0.0469, 0.1022, 0.9871, 0.9689]].map((r) => (
              <tr key={r[0]}>{r.map((v, i) => <td key={i}>{i ? v.toFixed(4) : v}</td>)}</tr>))}
          </tbody></table>
        </div>
      );
      if (m === 'infer') return (
        <div>
          <h4>학습·평가·추론 3형제</h4>
          <table><thead><tr><th>메서드</th><th>역할</th><th>입력</th><th>출력</th><th>가중치</th></tr></thead><tbody>
            <tr><td><code>fit</code></td><td>학습</td><td>x + y(정답)</td><td>History</td><td>바꾼다</td></tr>
            <tr><td><code>evaluate</code></td><td>평가</td><td>x + y(정답)</td><td>loss·acc (0.080 · 0.975)</td><td>그대로 · 테스트셋으로만</td></tr>
            <tr><td><code>predict</code></td><td>추론</td><td>x (입력만, 배치)</td><td>확률 벡터 (1, 10)</td><td>그대로 · argmax 필요</td></tr>
          </tbody></table>
        </div>
      );
      if (m === 'inspect') return (
        <div>
          <h4>summary() 를 공식으로 다시 계산</h4>
          <table><thead><tr><th>층</th><th>Output Shape</th><th>Param #</th><th>계산</th></tr></thead><tbody>
            <tr><td>flatten (Flatten)</td><td>(None, 784)</td><td>0</td><td>모양만 바꾼다</td></tr>
            <tr><td>dense (Dense)</td><td>(None, 128)</td><td>100,480</td><td>784×128 + 128</td></tr>
            <tr><td>dense_1 (Dense)</td><td>(None, 10)</td><td>1,290</td><td>128×10 + 10</td></tr>
            <tr><th>Total</th><td></td><th>101,770</th><td></td></tr>
          </tbody></table>
          <p className="mt-2">총합이 데이터 양에 비해 지나치게 크면 과적합을 의심할 지점이다.</p>
        </div>
      );
      if (m === 'roadmap') return (
        <div>
          <h4>Sequential 이 되는 것 / 안 되는 것</h4>
          <table><tbody>
            <tr><th>된다</th><td>MLP(완전연결) · 기본 CNN · 단순 RNN · 입력→출력 한 줄 흐름</td></tr>
            <tr><th>안 된다</th><td>분기(한 입력 두 갈래) · 다중 입력·출력 · skip connection(잔차)</td></tr>
          </tbody></table>
          <h4 className="mt-2">다음 단계</h4>
          <table><thead><tr><th>어디로</th><th>방식</th><th>다루는 것</th></tr></thead><tbody>
            <tr><td><a href="./II-1-2.html">II-1-2</a></td><td>compile 3인방 상세</td><td>optimizer·loss·metrics 문자열 vs 객체, 학습률·커스텀 손실</td></tr>
            <tr><td><a href="./II-2-1.html">II-2-1</a></td><td>함수형 API</td><td>분기·다중 입력·skip connection</td></tr>
            <tr><td><a href="../part3/III-1-1.html">III-1-1</a></td><td>방식 2 · GradientTape</td><td>fit 안의 배치 루프를 손으로</td></tr>
          </tbody></table>
        </div>
      );
      return null;
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
