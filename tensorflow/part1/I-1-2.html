  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    TensorFlow I-1-2 — 텐서·변수·즉시 실행(eager)
    학습 목표: tf.constant(불변)와 tf.Variable(가변)의 구분이 왜 "학습"의 출발점인지 이해한다.
              즉시 실행 시대에 텐서는 만들면 바로 값이 보인다(TF1과의 결정적 차이 재확인).
              numpy 왕복 → Variable(assign으로 갱신되는 상태, 모델 가중치가 전부 Variable인 이유)
              → 연산·브로드캐스팅(axis 감각, PyTorch 표기 대응) → GradientTape 자동 미분 맛보기
              (Variable은 자동 추적, constant는 watch 필요) → 실무 감각(eager 오버헤드·Variable 생성 비용)
              을 5단계로 정리한다.
    패턴: fastapi v1 — 좌(LiveDataPane: constant 잠긴 박스 vs Variable assign 애니메이션,
          GradientTape 추적 다이어그램, 연산 대응표) / 우(VSCode CodeViewer: tf_tensors.py)
    색상: orange (TF 브랜드 #FF6F00)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — constant → Variable → 연산/브로드캐스팅 → 자동 미분 → 실무 감각
    //   mode : 좌측 LiveDataPane 이 무엇을 그릴지 결정
    //          'constant'(잠긴 불변 박스 + numpy 왕복) | 'variable'(assign 갱신 애니메이션)
    //          'ops'(연산·브로드캐스팅 + PyTorch/TF 대응표) | 'grad'(GradientTape 추적 다이어그램)
    //          'practice'(실무 체크리스트)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      constant: {lang: "python", filename: "tf_tensors.py — ① tf.constant 와 numpy 왕복", lines: [
        "\"\"\"",
        "tf_tensors.py — ① 즉시 실행(eager) 시대의 텐서",
        "tf.constant: 만들면 바로 값이 보이는 \"불변\" 텐서",
        "\"\"\"",
        "import numpy as np",
        "import tensorflow as tf",
        "",
        "# ── 만드는 즉시 값이 계산된다 (Session 불필요) ──",
        "x = tf.constant([[1., 2.], [3., 4.]])",
        "print(x)",
        "# → tf.Tensor([[1. 2.] [3. 4.]], shape=(2, 2), dtype=float32)",
        "print(x.shape)   # (2, 2)   ← 항상 shape 를 같이 본다",
        "print(x.dtype)   # <dtype: \"float32\">",
        "",
        "# ── numpy 왕복: 텐서 ↔ 넘파이 세계 ──",
        "arr = x.numpy()               # tf.Tensor → np.ndarray",
        "print(type(arr))              # <class \"numpy.ndarray\">",
        "y = tf.convert_to_tensor(arr) # np.ndarray → tf.Tensor",
        "",
        "# ── dtype 함정: 정수와 실수를 섞으면 에러 ──",
        "a = tf.constant(3)     # int32  (정수 리터럴)",
        "b = tf.constant(3.0)   # float32(실수 리터럴)",
        "# a + b  →  InvalidArgumentError (int32 vs float32)",
        "c = tf.cast(a, tf.float32) + b   # cast 로 맞춰야 안전",
        "print(c)               # → tf.Tensor(6.0, ...)",
      ]},
      variable: {lang: "python", filename: "tf_tensors.py — ② tf.Variable 과 assign", lines: [
        "\"\"\"",
        "tf_tensors.py — ② 학습되는 상태, tf.Variable",
        "constant 는 불변 / Variable 은 assign 으로 갱신 가능",
        "\"\"\"",
        "import tensorflow as tf",
        "",
        "# ── 가변 상태: 값을 \"바꿀 수 있다\" ──",
        "w = tf.Variable([0.5, -0.2])",
        "print(w)          # <tf.Variable ... numpy=[ 0.5 -0.2]>",
        "",
        "w.assign([0.9, 0.1])        # 통째로 교체",
        "w.assign_add([-0.3, 0.05])  # 현재값에 더하기(= 갱신 스텝)",
        "print(w.numpy())            # → [0.6  0.15]",
        "",
        "# ── constant 는 바꿀 수 없다 ──",
        "c = tf.constant([1.0, 2.0])",
        "# c.assign(...)   →  AttributeError (불변이라 assign 없음)",
        "",
        "# ── 그래서 모델 가중치는 전부 Variable 이다 ──",
        "layer = tf.keras.layers.Dense(3)",
        "layer.build(input_shape=(None, 4))",

                           "good": "w = tf.Variable(0.0)       # ✓ 루프 밖 1회\nfor step in range(N):\n    w.assign_add(grad)"
                         },
          "debug": [
                     {"cmd":"print(x.shape)","why":"행렬곱 안쪽 차원 불일치 1순위 원인"},
                     {"cmd":"print(x.dtype)","why":"int32 vs float32 혼합 에러 잡기"},
                     {"cmd":"print(x.numpy())","why":"eager 라 값이 그냥 보인다 — 눈으로 확인"}
                   ]
        },
        alert: {
          "tone": "warn",
          "text": "Variable 을 루프 안에서 만들지 말 것(느리고 학습이 누적 안 됨). 디버깅은 shape → dtype → 값 순서로 print. eager 오버헤드는 다음 장 @tf.function 으로 해결한다."
        },
        code: {...CODE.practice, highlight: [26,27]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 텐서 격자 (constant / variable 값 표시)
    // ─────────────────────────────────────────────────────
    function Cell({ v, tone }) {
      return (
        <span className={`inline-flex items-center justify-center w-11 h-9 rounded font-mono text-[11px] font-bold border ${tone}`}>
          {typeof v === 'number' ? v.toFixed(2) : v}
        </span>
      );
    }

    function Grid({ values, tone }) {
      const rows = Array.isArray(values[0]) ? values : [values];
      return (
        <div className="inline-flex flex-col gap-1">
          {rows.map((row, r) => (
            <div key={r} className="flex gap-1">
              {row.map((v, c) => <Cell key={c} v={v} tone={tone} />)}
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — constant: 잠긴 불변 박스 + numpy 왕복
    // ─────────────────────────────────────────────────────
    function ConstantPane({ state }) {
      const t = state.tensor;
      return (
        <div>
          <div className="rounded-lg border-2 border-slate-400 bg-slate-50 p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[11px] font-mono font-bold text-slate-700">{t.name}</span>
              <span className="text-sm">🔒</span>
            </div>
            <div className="flex items-center gap-3">
              <Grid values={t.values} tone="bg-white border-slate-400 text-slate-800" />
              <div className="text-[10px] text-slate-600 font-mono leading-5">
                <div>shape = <b className="text-orange-700">{t.shape}</b></div>
                <div>dtype = <b className="text-orange-700">{t.dtype}</b></div>
              </div>
            </div>
            <div className="mt-2 text-[10px] text-slate-500">{t.note}</div>
          </div>

          <div className="mt-3 rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🔁 numpy 왕복 — 텐서 ↔ 넘파이</div>
            <div className="space-y-1.5">
              {state.roundtrip.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold px-1.5 py-0.5 rounded bg-slate-100 border border-slate-300 text-slate-700 whitespace-nowrap">{r.from}</span>
                  <span className="text-orange-500">▶</span>
                  <span className="font-mono font-bold px-1.5 py-0.5 rounded bg-orange-100 border border-orange-300 text-orange-800 whitespace-nowrap">{r.to}</span>
                  <span className="text-slate-500 flex-1">{r.out}</span>
                </div>
              ))}
              <div className="text-[10px] font-mono text-slate-600 mt-1">
                x.numpy() · tf.convert_to_tensor(arr)
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — Variable: assign 으로 값이 바뀌는 애니메이션
    // ─────────────────────────────────────────────────────
    function VariablePane({ state }) {
      const v = state.variable;
      const [phase, setPhase] = useState(0);
      // 단계 진입 시 자동으로 assign 시퀀스를 재생
      useEffect(() => {
        setPhase(0);
        let i = 0;
        const id = setInterval(() => {
          i += 1;
          if (i >= v.steps.length) { clearInterval(id); return; }
          setPhase(i);
        }, 900);
        return () => clearInterval(id);
      }, [state]);
      const cur = v.steps[phase];
      return (
        <div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[11px] font-mono font-bold text-orange-800">{v.name}</span>
              <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-orange-600 text-white">trainable = {String(v.trainable)}</span>
            </div>
            <div className="flex items-center gap-3">
              <Grid values={cur.values} tone="bg-white border-orange-400 text-orange-800" />
              <div className="text-[10px] font-mono text-orange-700">
                <div className="font-bold">{cur.label}</div>
                <div className="text-slate-500">{cur.op}</div>
              </div>
            </div>
          </div>

          <div className="mt-3 space-y-1">
            {v.steps.map((s, i) => (
              <div key={i} className={`flex items-center gap-2 rounded border px-2 py-1 text-[10px] transition ${i === phase ? 'bg-orange-100 border-orange-400' : i < phase ? 'bg-slate-50 border-slate-200 opacity-70' : 'bg-white border-slate-200 opacity-50'}`}>
                <span className={`w-4 text-center ${i <= phase ? 'text-orange-600' : 'text-slate-300'}`}>{i < phase ? '✓' : i === phase ? '▶' : '·'}</span>
                <span className="font-mono font-bold text-slate-700 w-24">{s.label}</span>
                <span className="font-mono text-slate-500 flex-1 truncate">{s.op}</span>
                <span className="font-mono text-orange-700">[{s.values.map((n) => n.toFixed(2)).join(', ')}]</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-center text-slate-500">🔓 constant 와 달리 값이 <b className="text-orange-700">바뀐다</b> — 이게 "학습되는 상태"</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 연산·브로드캐스팅 + PyTorch/TF 대응표
    // ─────────────────────────────────────────────────────
    function OpsPane({ state }) {
      const o = state.ops;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🧮 {o.reduce.title}</div>
            <div className="flex items-center gap-3 flex-wrap">
              <div>
                <div className="text-[9px] text-slate-500 mb-1 font-mono">A (2, 3)</div>
                <Grid values={o.reduce.matrix} tone="bg-slate-50 border-slate-300 text-slate-700" />
              </div>
              <div className="text-[10px] space-y-1.5">
                <div className="flex items-center gap-2">
                  <span className="font-mono font-bold text-orange-700 w-14">axis=0</span>
                  <span className="text-slate-400">↓ 열별 합</span>
                  <span className="font-mono font-bold text-orange-800">[{o.reduce.axis0.join(', ')}]</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="font-mono font-bold text-orange-700 w-14">axis=1</span>
                  <span className="text-slate-400">→ 행별 합</span>
                  <span className="font-mono font-bold text-orange-800">[{o.reduce.axis1.join(', ')}]</span>
                </div>
              </div>
            </div>
          </div>

          <div className="rounded-lg border border-orange-200 bg-orange-50 p-2.5 text-[10px] text-orange-900">
            <b>📡 {o.broadcast.title}</b>
            <div className="mt-1 font-mono text-slate-600 leading-5">
              <div>{o.broadcast.a}</div>
              <div>+ {o.broadcast.b}</div>
              <div className="text-orange-700 font-bold">= {o.broadcast.out}</div>
            </div>
          </div>

          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🔀 PyTorch ↔ TensorFlow 표기 대응</div>
            <div className="space-y-1">
              {o.mapping.map((m, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="text-slate-600 w-16">{m.concept}</span>
                  <span className="flex-1 text-right font-mono text-slate-500">{m.torch}</span>
                  <span className="text-orange-500">▶</span>
                  <span className="flex-1 font-mono font-bold text-orange-800">{m.tf}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — GradientTape 추적 다이어그램
    // ─────────────────────────────────────────────────────
    function GradPane({ state }) {
      const g = state.grad;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-3 text-center">
            <span className="text-sm font-mono font-bold text-orange-900">{g.expr}</span>
            <span className="mx-2 text-orange-400">→</span>
            <span className="text-sm font-mono font-bold text-emerald-700">{g.derivative}</span>
          </div>

          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🎞 테이프가 기록하고 되감는다</div>
            <div className="space-y-1.5">
              {g.flow.map((f, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-orange-300 font-mono text-xs w-3">{i < g.flow.length - 1 ? '│' : '└'}</span>
                  <div className={`flex-1 rounded border px-2 py-1 ${f.tracked ? 'bg-orange-50 border-orange-400' : 'bg-slate-50 border-slate-300'}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-mono font-bold text-slate-800">{f.node}</span>
                      {f.tracked && <span className="text-[8px] font-bold px-1 py-0.5 rounded bg-orange-600 text-white whitespace-nowrap">자동 추적</span>}
                    </div>
                    <div className="text-[9px] text-slate-500">{f.why}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">⚖️ 추적 규칙: Variable vs constant</div>
            <div className="space-y-1.5">
              {g.contrast.map((c, i) => (
                <div key={i} className={`flex items-center gap-2 rounded border px-2 py-1.5 text-[10px] ${c.auto ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                  <span className="text-sm">{c.auto ? '✅' : '👀'}</span>
                  <span className={`font-mono font-bold w-16 ${c.auto ? 'text-emerald-800' : 'text-red-800'}`}>{c.kind}</span>
                  <span className="flex-1 text-slate-600">{c.text}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 체크리스트 (대가 · 안티패턴 · 디버깅)
    // ─────────────────────────────────────────────────────
    function PracticePane({ state }) {
      const p = state.practice;
      return (
        <div className="space-y-3">
          <div className="grid grid-cols-2 gap-2">
            {p.cost.map((c, i) => (
              <div key={i} className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
                <div className="text-[11px] font-bold text-amber-900 flex items-center gap-1"><span>{c.icon}</span>{c.title}</div>
                <div className="text-[10px] text-amber-800 mt-1 leading-4">{c.text}</div>
              </div>
            ))}
          </div>

          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">♻️ 안티패턴 → 수정 (루프 내 Variable 생성)</div>
            <div className="grid grid-cols-1 gap-2">
              <div className="rounded border border-red-300 bg-red-50 p-2">
                <div className="text-[9px] font-bold text-red-700 mb-1">✗ BAD — 매번 새로 생성</div>
                <pre className="text-[10px] font-mono text-red-800 whitespace-pre-wrap">{p.antipattern.bad}</pre>
              </div>
              <div className="rounded border border-emerald-300 bg-emerald-50 p-2">
                <div className="text-[9px] font-bold text-emerald-700 mb-1">✓ GOOD — 밖에서 1회, assign 갱신</div>
                <pre className="text-[10px] font-mono text-emerald-800 whitespace-pre-wrap">{p.antipattern.good}</pre>
              </div>
            </div>
          </div>

          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-xs font-bold text-orange-900 mb-2">🔍 디버깅 루틴 — shape → dtype → 값</div>
            <div className="space-y-1">
              {p.debug.map((d, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold px-1.5 py-0.5 rounded bg-slate-800 text-orange-200 whitespace-nowrap">{d.cmd}</span>
                  <span className="text-slate-600 flex-1">{d.why}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 모드에 따라 constant/variable/ops/grad/practice (orange 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      constant: { icon: '🔒', label: 'tf.constant (불변)' },
      variable: { icon: '🔓', label: 'tf.Variable (가변)' },
      ops:      { icon: '🧮', label: '연산·브로드캐스팅' },
      grad:     { icon: '🎞', label: 'GradientTape' },
      practice: { icon: '🛠', label: '실무 감각' },
    };

    function LiveDataPane({ beat, state }) {
      const md = MODE_BADGE[state.mode] || MODE_BADGE.constant;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{md.icon}</span>
              <span>텐서 상태 — {md.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.badge}</span>
          </div>

          {state.mode === 'constant' && <ConstantPane state={state} />}
          {state.mode === 'variable' && <VariablePane state={state} />}
          {state.mode === 'ops' && <OpsPane state={state} />}
          {state.mode === 'grad' && <GradPane state={state} />}
          {state.mode === 'practice' && <PracticePane state={state} />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">TF</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">I-1-2. 텐서·변수·즉시 실행(eager)</h1>
                <p className="text-sm text-orange-800/80">tf.constant와 tf.Variable — 불변과 가변의 구분이 학습을 만든다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-500' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-800 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-orange-800 hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                tf.constant는 "값이 박힌" 불변 텐서 — 즉시 실행이라 만들면 바로 값·shape·dtype이 보인다.
                tf.Variable은 assign으로 갱신되는 가변 상태라서 모델 가중치가 전부 Variable이고, 옵티마이저는
                trainable=True인 Variable만 골라 갱신한다. 연산은 요소별·matmul·reduce(axis) 세 갈래로 정리되고
                브로드캐스팅은 넘파이와 같다. GradientTape는 Variable을 자동 추적(constant는 watch 필요)하며,
                이 구분이 Part Ⅲ 커스텀 루프의 복선이다. eager 오버헤드는 다음 장 @tf.function으로 해결하고,
                Variable은 루프 밖에서 한 번만 만든다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['tf.constant', 'tf.Variable', 'assign', 'eager', 'numpy왕복', 'dtype', 'broadcasting', 'reduce_sum', 'axis', 'GradientTape', 'trainable', 'tf.function'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-800">
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
