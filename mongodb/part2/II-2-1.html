    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:'javascript', filename:'01-add-field.js', lines:[
        '// Step 1. 새 필드 그냥 추가',
        '',
        '// 기존 문서들',
        '// { _id: 1, name: "Alice" }',
        '// { _id: 2, name: "Bob" }',
        '// { _id: 3, name: "Carol" }',
        '',
        '// 신규 사용자만 phone 포함',
        'db.users.insertOne({',
        '  _id: 4,',
        '  name: "Dave",',
        '  phone: "010-1234-5678"   // 새 필드',
        '});',
        '',
        '// 기존 사용자 일부에만 추가',
        'db.users.updateOne(',
        '  { _id: 1 },',
        '  { $set: { phone: "010-1111" } }',
        ');',
        '',
        '// 결과 — 같은 collection 안에 모양이 다른 문서들',
        '// { _id: 1, name: "Alice", phone: "010-1111" }',
        '// { _id: 2, name: "Bob" }                       ← phone 없음',
        '// { _id: 3, name: "Carol" }                     ← phone 없음',
        '// { _id: 4, name: "Dave", phone: "010-1234-5678" }',
        '',
        '// 쿼리 호환성',
        'db.users.find({ phone: { $exists: true } });',
        '// → phone 있는 문서만',
        '',
        'db.users.find({ phone: null });',
        '// → null 이거나 필드 없는 문서',
        '',
        '// 신경 쓸 점',
        '//  - 코드에서 user.phone 이 undefined 가능 → 가드',
        '//  - 검색을 phone 으로 한다면 인덱스 필요',
        '//    db.users.createIndex({phone: 1}, {sparse: true})',
        '',
        '// RDB 와의 결정적 차이',
        '//  - ALTER TABLE 없음',
        '//  - 잠금 없음',
        '//  - 다운타임 없음',
      ]},
      s2: {lang:'javascript', filename:'02-lazy-migration.js', lines:[
        '// Step 2. Lazy migration — 읽을 때 변환',
        '',
        '// 코드 (Node.js driver)',
        'async function getUser(id) {',
        '  const u = await db.collection("users").findOne({ _id: id });',
        '  // 마이그레이션 — phone 없는 옛 문서 변환',
        '  return {',
        '    ...u,',
        '    phone: u.phone ?? null,   // 기본값',
        '  };',
        '}',
        '',
        '// 호출하는 쪽은 항상 phone 가 있는 객체 받는다',
        'const user = await getUser(1);',
        'console.log(user.phone);   // 항상 string 또는 null',
        '',
        '// 더 적극적: 읽으면 DB 도 갱신',
        'async function getUserAndMigrate(id) {',
        '  const u = await db.collection("users").findOne({ _id: id });',
        '  if (u.phone === undefined) {',
        '    await db.collection("users").updateOne(',
        '      { _id: id },',
        '      { $set: { phone: null } }',
        '    );',
        '    u.phone = null;',
        '  }',
        '  return u;',
        '}',
        '',
        '// 장점',
        '//  - 대량 마이그레이션 불필요',
        '//  - 활성 데이터부터 자연스럽게 갱신',
        '//  - 운영 부담 거의 zero',
        '',
        '// 단점',
        '//  - 코드가 변환 로직을 알아야 함',
        '//  - 검색에서 옛 문서 누락 위험',
        '//    db.users.find({ phone: "010-1234" })',
        '//    → phone 없는 옛 문서는 안 잡힘',
        '//',
        '//    해결: $or 로 두 조건',
        '//    { $or: [ {phone: "010-1234"}, {phone: {$exists:false}} ] }',
      ]},
      s3: {lang:'javascript', filename:'03-version-field.js', lines:[
        '// Step 3. schema_version 패턴',
        '',
        '// 옛 문서 (v1)',
        '// { _id: 1, name: "Alice", phone: "010-1234" }',
        '',
        '// 새 문서 (v2) — phone 을 phones 배열로',
        '// { _id: 4, name: "Dave", schema_version: 2, phones: [',
        '//     { number: "010-1234", type: "mobile", primary: true }',
        '// ]}',
        '',
        '// 읽을 때 코드 분기',
        'function normalize(user) {',
        '  if (user.schema_version === 2) return user;',
        '  // v1 → v2 변환',
        '  return {',
        '    ...user,',
        '    schema_version: 2,',
        '    phones: user.phone',
        '      ? [{ number: user.phone, type: "mobile", primary: true }]',
        '      : []',
        '  };',
        '}',
        '',
        '// 신규 작성은 처음부터 v2',
        'db.users.insertOne({',
        '  _id: 5,',
        '  schema_version: 2,',
        '  name: "Eve",',

                        {mark:'read', text:'normalize(u) 재사용'}] },
        version: 2, migrated: 'ops 1000',
        verdict: 'Background', verdictTone: 'good',
        keyPoint: 'Step 3 의 normalize 를 그대로 쓴다. 변환 규칙은 한 곳에만 둔다.',
        code:{...CODE.s4, highlight:[15,16,17,18,19,20]},
      },
      { ...S4,
        beat:{ label:'bulkWrite 로 한 번에 반영', at:'04-background-migration.js L22–24',
               caption:'1000건을 한 번의 왕복으로 보내고, 누적 건수를 로그로 남긴다.',
               changes:[{mark:'changed', text:'DB 문서 1000건 v2'},
                        {mark:'new', text:'진행률 로그'}] },
        version: 2, migrated: '1000건 반영',
        verdict: 'Background', verdictTone: 'good',
        keyPoint: 'ordered:false 라 한 건 실패해도 나머지가 넘어간다.',
        code:{...CODE.s4, highlight:[22,23,24]},
      },
      { ...S4,
        beat:{ label:'쉬었다 다음 배치', at:'04-background-migration.js L26–30',
               caption:'100ms 쉬어 부하를 낮추고 루프를 돈다. 남은 문서가 없으면 done.',
               changes:[{mark:'new', text:'sleep 100ms'},
                        {mark:'changed', text:'루프 반복 → 종료'}] },
        version: 2, migrated: '반복',
        verdict: 'Background', verdictTone: 'warn',
        keyPoint: '쉬는 시간이 운영 서비스를 지킨다. 최대 속도로 돌리지 않는다.',
        code:{...CODE.s4, highlight:[26,27,28,29,30]},
      },
      { ...S4,
        beat:{ label:'운영에서 지킬 것', at:'04-background-migration.js L35–40',
               caption:'야간·배치 1000~5000·진행률 로깅·재시작 가능·인덱스 활용.',
               changes:[{mark:'read', text:'재시작 기준 = 필터'},
                        {mark:'new', text:'schema_version 인덱스'}] },
        version: 2, migrated: '백그라운드',
        verdict: 'Background', verdictTone: 'good',
        keyPoint: '필터에 인덱스가 없으면 배치마다 COLLSCAN 이 돈다.',
        code:{...CODE.s4, highlight:[35,36,37,38,39,40]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'1) 즉시 — $set', at:'05-evolution-summary.md L5–8',
               caption:'단순 필드 추가는 그 자리에서 끝난다. 대신 코드에 undefined 가드가 필요하다.',
               changes:[{mark:'new', text:'필드 추가 = $set'},
                        {mark:'read', text:'undefined 가드'}] },
        version: 2, migrated: '즉시',
        verdict: '정리', verdictTone: 'good',
        keyPoint: '변경이 작을수록 앞쪽 전략으로 충분하다.',
        code:{...CODE.s5, highlight:[5,6,7,8]},
      },
      { ...S5,
        beat:{ label:'2) Lazy — 읽을 때', at:'05-evolution-summary.md L10–13',
               caption:'읽는 경로에서 변환하고, 원하면 DB 도 같이 고친다.',
               changes:[{mark:'changed', text:'활성 데이터부터 이동'}] },
        version: 2, migrated: '읽을 때',
        verdict: '정리', verdictTone: 'good',
        keyPoint: '안 읽히는 문서는 계속 옛 모양이라는 점을 감수한다.',
        code:{...CODE.s5, highlight:[10,11,12,13]},
      },
      { ...S5,
        beat:{ label:'3) Versioning — 명시', at:'05-evolution-summary.md L15–18',
               caption:'schema_version 과 normalize() 로 어느 모양인지 데이터가 스스로 말한다.',
               changes:[{mark:'new', text:'schema_version 필드'},
                        {mark:'read', text:'normalize() 한 곳'}] },
        version: 2, migrated: '버전 분기',
        verdict: '정리', verdictTone: 'good',
        keyPoint: '구조가 바뀌는 변경이면 버전 필드를 먼저 넣는다.',
        code:{...CODE.s5, highlight:[15,16,17,18]},
      },
      { ...S5,
        beat:{ label:'4) Background — 워커', at:'05-evolution-summary.md L20–23',
               caption:'별도 스크립트가 야간에 1000~5000건씩 남은 문서를 정리한다.',
               changes:[{mark:'changed', text:'남은 v1 일괄 소진'}] },
        version: 2, migrated: '백그라운드',
        verdict: '정리', verdictTone: 'good',
        keyPoint: 'Versioning 으로 표시해 두면 Background 는 필터 한 줄이면 된다.',
        code:{...CODE.s5, highlight:[20,21,22,23]},
      },
      { ...S5,
        beat:{ label:'변경 크기로 고른다', at:'05-evolution-summary.md L25–31',
               caption:'단순 추가는 $set, 옵셔널은 Lazy, 구조 변경은 Versioning, 전건은 Background.',
               changes:[{mark:'read', text:'변경 → 전략 대응표'}] },
        version: 2, migrated: '선택',
        verdict: '가이드', verdictTone: 'good',
        keyPoint: '전략은 배타적이지 않다. Versioning + Background 는 보통 같이 쓴다.',
        code:{...CODE.s5, highlight:[25,26,27,28,29,30,31]},
      },
      { ...S5,
        beat:{ label:'무중단의 조건', at:'05-evolution-summary.md L33–36',
               caption:'잠금이 없다는 것만으로는 부족하다. 코드가 두 버전을 다 읽어야 한다.',
               changes:[{mark:'read', text:'코드가 v1·v2 모두 처리'},
                        {mark:'gone', text:'"한꺼번에 모두" 금지'}] },
        version: 2, migrated: '무중단',
        verdict: '원칙', verdictTone: 'good',
        keyPoint: '무중단의 병목은 DB 가 아니라 코드의 호환성이다.',
        code:{...CODE.s5, highlight:[33,34,35,36]},
      },
      { ...S5,
        beat:{ label:'남는 함정', at:'05-evolution-summary.md L38–41',
               caption:'검색 누락, 인덱스 없는 새 필드, 너무 오래 공존하는 버전들.',
               changes:[{mark:'gone', text:'옛 문서 검색 누락'},
                        {mark:'new', text:'새 필드 인덱스 필요'}] },
        version: 2, migrated: '종합',
        verdict: '진화', verdictTone: 'good',
        summary: {
          title: '스키마 진화 4가지 전략',
          rows: [
            { metric: '필드 추가', before: '$set', after: '즉시', delta: 'DDL 없음' },
            { metric: 'Lazy', before: '읽을 때 변환', after: '점진', delta: '부담 최소' },
            { metric: 'Versioning', before: 'schema_version', after: '명시', delta: '분기 명확' },
            { metric: 'Background', before: '워커 배치', after: '일괄 정리', delta: '운영 부담' },
            { metric: '검증', before: '$jsonSchema', after: '다음 챕터', delta: '→ II-2-2' },
          ],
        },
        keyPoint: '진화는 3가지. 작은 변경 = lazy, 큰 변경 = versioning + background. 운영 무중단이 핵심.',
        code:{...CODE.s5, highlight:[38,39,40,41]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function VersionTimeline({ version, migrated }) {
      return (
        <div className="rounded-lg border p-3 bg-emerald-50 border-emerald-200 text-xs">
          <div className="font-bold mb-2" style={{ color: '#13aa52' }}>스키마 버전 진행</div>
          <div className="flex items-center gap-2">
            <div className={`px-2 py-1 rounded ${version === 1 ? 'text-white font-bold' : 'bg-zinc-100 text-zinc-500'}`} style={version === 1 ? { backgroundColor: '#13aa52' } : {}}>v1</div>
            <span className="text-zinc-400">→</span>
            <div className={`px-2 py-1 rounded ${version === 2 ? 'text-white font-bold' : 'bg-zinc-100 text-zinc-500'}`} style={version === 2 ? { backgroundColor: '#13aa52' } : {}}>v2</div>
          </div>
          <div className="mt-2 text-zinc-700">마이그레이션: <b>{migrated}</b></div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{ borderColor: '#13aa52' }}>
          <div className="text-sm font-bold mb-2" style={{ color: '#13aa52' }}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-zinc-500 border-b border-zinc-200">
                <th className="py-1 pr-2">전략</th><th className="py-1 pr-2">방법</th><th className="py-1 pr-2">시점</th><th className="py-1">특징</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-zinc-700">{r.after}</td>
                  <td className="py-1 font-bold" style={{ color: '#13aa52' }}>{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#13aa5240' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#13aa52' }}>스키마 진화 흐름</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <VersionTimeline version={state.version} migrated={state.migrated} />

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs rounded p-2 border bg-emerald-50 border-emerald-200" style={{ color: '#0f7a3a' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-emerald-500/25 border-l-2 border-emerald-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6 bg-gradient-to-br from-emerald-50 to-green-50">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap p-4 rounded-xl text-white shadow" style={{ backgroundColor: '#13aa52' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white font-bold" style={{ color: '#13aa52' }}>🍃</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter II-2-1. 스키마 진화 — Versioning</h1>
                <p className="text-sm text-emerald-50">필드 추가 · Lazy · Versioning · Background migration</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-white underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? '' : 'bg-emerald-100'}`} style={i <= stepIdx ? { backgroundColor: '#13aa52' } : {}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-emerald-800 text-white px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-emerald-50 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#0f7a3a' : '#13aa52' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-emerald-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 px-4 py-3 text-sm bg-white" style={{ borderColor: '#13aa52', color: '#0f7a3a' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                스키마 진화는 4가지. 즉시 추가 / Lazy / Versioning / Background. 다운타임 없는 점진 진화가 MongoDB 의 강점.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Schema', 'Migration', 'Versioning', 'Lazy', 'Background'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border bg-emerald-50 border-emerald-300" style={{ color: '#13aa52' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#13aa52' }}>
              <a href="./II-1-2.html" className="underline hover:no-underline">← 이전: II-1-2 Embedded vs Referenced</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 Schema Validation →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
