  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

            'const os = db.orders.find({ user_id: 1 }).sort({ _id: -1 }).limit(20).toArray();',
            '// 페이지네이션으로 일부만',
            '',
            '// $lookup 으로 한 번에도 가능 (무거움)',
            'db.users.aggregate([',
            '  { $match: { _id: 1 } },',
            '  { $lookup: {',
            '      from: "orders",',
            '      localField: "_id",',
            '      foreignField: "user_id",',
            '      as: "orders"',
            '  }}',
            ']);',
            '// 대량이면 비싸다 — 보통은 두 번 쿼리가 단순',
            '',
            '// 결론',
            '//  - 배열이 끝없이 자라면 → 참조',
            '//  - "이 사용자의 최근 20건" 같은 페이지네이션 필요',
            '//  - 16MB 문서 한계 의식',
          ],
          highlight: [4, 5, 6, 7, 8, 11, 12, 13, 14, 15, 16, 19, 22, 23, 27, 28, 29, 30, 31, 32, 33, 34, 35],
        },
      },
      {
        title: 'Step 4. many:many — 참조 (양쪽 또는 한쪽)',
        desc: '학생-수업, 사용자-역할처럼 다대다는 참조. 양쪽에 ID 배열을 두거나, 적게 변하는 쪽만 가지거나. RDB 의 조인 테이블은 필요 없다.',
        rel: 'many:many',
        choice: 'Referenced',
        verdict: '다대다',
        verdictTone: 'warn',
        keyPoint: 'many:many 는 양쪽 ID 배열. 또는 한쪽만 가지고 다른 쪽은 역방향 쿼리.',
        code: {
          lang: 'javascript',
          filename: '04-many-to-many.js',
          lines: [
            '// Step 4. many:many — 참조',
            '',
            '// 학생 - 수업 (n:m)',
            '',
            '// 방법 ① 양쪽에 ID 배열',
            'db.students.insertOne({',
            '  _id: 1,',
            '  name: "Alice",',
            '  class_ids: ["MATH-101", "CS-201"]',
            '});',
            '',
            'db.classes.insertOne({',
            '  _id: "MATH-101",',
            '  title: "수학 입문",',
            '  student_ids: [1, 2, 3]',
            '});',
            '',
            '// 조회',
            '// "Alice 의 수업 리스트"',
            'const alice = db.students.findOne({ _id: 1 });',
            'db.classes.find({ _id: { $in: alice.class_ids } });',
            '',
            '// 방법 ② 한쪽만 가짐 — 적게 변하는 쪽',
            'db.users.insertOne({',
            '  _id: 1,',
            '  name: "Alice",',
            '  role_ids: ["admin", "auditor"]   // 역할은 user 가 가짐',
            '});',
            '',
            'db.roles.insertOne({',
            '  _id: "admin",',
            '  name: "관리자",',
            '  permissions: ["read", "write", "delete"]',
            '  // user_ids 안 가짐 — 사용자가 1000명이면 배열이 크다',
            '});',
            '',
            '// "admin 역할의 사용자들" → 역방향 쿼리',
            'db.users.find({ role_ids: "admin" });',
            'db.users.createIndex({ role_ids: 1 });',
            '',
            '// RDB 와 차이',
            '//  - 조인 테이블 (user_roles) 불필요',
            '//  - JS 배열로 표현',
            '//  - $lookup 또는 두 번 쿼리',
            '',
            '// 주의',
            '//  - 양쪽에 ID 배열 → 동기화 부담',
            '//  - 한쪽만 가지면 단순하지만 역방향이 느림 (인덱스 필수)',
          ],
          highlight: [6, 7, 8, 9, 10, 12, 13, 14, 15, 16, 20, 21, 24, 25, 26, 27, 28, 30, 31, 32, 33, 34, 35, 39, 40],
        },
      },
      {
        title: 'Step 5. 의사결정 트리 — 같이? 자주? 큰가?',
        desc: '판단은 3가지 질문. (1) 함께 읽는가? (2) 함께 변하는가? (3) 배열이 무한히 자라는가? 다 YES + NO + NO → embed. 자라는 게 있으면 → ref.',
        rel: 'Decision',
        choice: 'Tree',
        verdict: '결정',
        verdictTone: 'good',
        summary: {
          title: '관계별 선택 매트릭스',
          rows: [
            { metric: '1:1', before: '같이 읽음', after: 'Embedded', delta: '단순' },
            { metric: '1:few', before: '작은 배열', after: 'Embedded[]', delta: '한 fetch' },
            { metric: '1:many', before: '큰 배열', after: 'Referenced', delta: '인덱스+lookup' },
            { metric: 'm:n', before: '양쪽 큼', after: 'Ref + ID[]', delta: '한쪽만 가짐 가능' },
            { metric: '16MB', before: '문서 한계', after: 'overflow → ref', delta: '대용량 주의' },
          ],
        },
        keyPoint: '"함께 읽고, 함께 변하고, 크지 않다" → embed. 하나라도 NO → ref.',
        code: {
          lang: 'javascript',
          filename: '05-decision-tree.js',
          lines: [
            '// Step 5. 의사결정 트리',
            '',
            '// Q1. 같이 읽는가?',
            '//   YES → 임베디드 후보',
            '//   NO  → 참조',
            '',
            '// Q2. 같이 변하는가?',
            '//   YES → 임베디드 후보',
            '//   NO  → 참조 (락 분리)',
            '',
            '// Q3. 배열이 무한히 자라는가?',
            '//   NO  → 임베디드',
            '//   YES → 참조 (16MB 위험)',
            '',
            '// 결합',
            '// ┌─────────────┬─────┬─────┬────────────┐',
            '// │ 관계        │ Q1  │ Q3  │ 추천       │',
            '// ├─────────────┼─────┼─────┼────────────┤',
            '// │ user-profile│ YES │ NO  │ Embedded   │',
            '// │ order-items │ YES │ NO  │ Embedded[] │',
            '// │ user-orders │ N/A │ YES │ Referenced │',
            '// │ student-cls │ N/A │ YES │ Referenced │',
            '// └─────────────┴─────┴─────┴────────────┘',
            '',
            '// 자주 실수하는 안티패턴',
            '',
            '// ❌ 무한 배열',
            'db.users.updateOne(',
            '  { _id: 1 },',
            '  { $push: { all_orders: { ... } } }   // 무한 자람',
            ');',
            '',
            '// ❌ 너무 정규화 (RDB 습관)',
            'db.users.findOne({_id:1});',
            'db.profiles.findOne({user_id:1});',
            'db.contacts.findOne({user_id:1});  // 한 번에 갈 수 있는데 분리',
            '',
            '// ✅ 균형',
            '//  - 함께 쓰는 작은 데이터는 embed',
            '//  - 무한 자라는 것은 ref',
            '//  - 다른 시스템과 공유는 ref',
          ],
          highlight: [4, 5, 8, 9, 12, 13, 18, 19, 20, 21, 22, 23, 28, 29, 30, 31, 39, 40, 41],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function ChoiceCard({ rel, choice, tone }) {
      const t = TONE[tone] || TONE.good;
      return (
        <div className={`rounded-lg border-2 p-3 ${t.bg} ${t.border}`}>
          <div className="text-[10px] text-zinc-500">관계</div>
          <div className="text-xl font-bold font-mono" style={{ color: '#13aa52' }}>{rel}</div>
          <div className="text-xs text-zinc-700 mt-1">선택: <b>{choice}</b></div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{ borderColor: '#13aa52' }}>
          <div className="text-sm font-bold mb-2" style={{ color: '#13aa52' }}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-zinc-500 border-b border-zinc-200">
                <th className="py-1 pr-2">관계</th><th className="py-1 pr-2">조건</th><th className="py-1 pr-2">선택</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-zinc-700">{r.after}</td>
                  <td className="py-1 font-bold" style={{ color: '#13aa52' }}>{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#13aa5240' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#13aa52' }}>Embedded vs Referenced</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <ChoiceCard rel={state.rel} choice={state.choice} tone={state.verdictTone} />

          <div className="mt-3 rounded-lg border p-3 bg-emerald-50 border-emerald-200 text-xs">
            <div className="font-bold mb-1" style={{ color: '#13aa52' }}>판단 체크</div>
            <div className="text-zinc-700">• 함께 읽는가?</div>
            <div className="text-zinc-700">• 함께 변하는가?</div>
            <div className="text-zinc-700">• 배열이 자라는가?</div>
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs rounded p-2 border bg-emerald-50 border-emerald-200" style={{ color: '#0f7a3a' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-emerald-500/25 border-l-2 border-emerald-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6 bg-gradient-to-br from-emerald-50 to-green-50">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap p-4 rounded-xl text-white shadow" style={{ backgroundColor: '#13aa52' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white font-bold" style={{ color: '#13aa52' }}>🍃</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter II-1-2. Embedded vs Referenced</h1>
                <p className="text-sm text-emerald-50">1:1 · 1:few · 1:many · m:n — 언제 어느 쪽</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-white underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? '' : 'bg-emerald-100'}`} style={i <= stepIdx ? { backgroundColor: '#13aa52' } : {}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-emerald-800 text-white px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-emerald-50 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50" aria-label="처음으로">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40" aria-label="이전 단계">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#0f7a3a' : '#13aa52' }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40" aria-label="다음 단계">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-emerald-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 px-4 py-3 text-sm bg-white" style={{ borderColor: '#13aa52', color: '#0f7a3a' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                1:1/1:few 는 embed, 1:many/m:n 은 ref. 함께 읽고 변하고 크지 않다 → embed. 자라거나 독립이면 → ref. 16MB 한계 의식.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Embedded', 'Referenced', '1:1', '1:few', '1:many', 'm:n', '16MB'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border bg-emerald-50 border-emerald-300" style={{ color: '#13aa52' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#13aa52' }}>
              <a href="./II-1-1.html" className="underline hover:no-underline">← 이전: II-1-1 Collection/Document/_id</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 스키마 진화 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
