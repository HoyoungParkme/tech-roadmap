  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:'javascript', filename:'01-insert-one.js', lines:[
        '// Step 1. insertOne — 단건',
        '',
        'const result = db.users.insertOne({',
        '  name: "Alice",',
        '  email: "alice@example.com",',
        '  age: 30,',
        '  tags: ["vip"]',
        '});',
        '',
        '// 결과',
        '// {',
        '//   acknowledged: true,',
        '//   insertedId: ObjectId("664a8e2a...")',
        '// }',
        '',
        '// _id 직접 지정',
        'db.users.insertOne({ _id: "u-001", name: "Bob" });',
        '',
        '// 중복 시 에러',
        'db.users.insertOne({ _id: "u-001", name: "Carol" });',
        '// → MongoServerError: E11000 duplicate key error',
        '',
        '// 옵션 — writeConcern',
        'db.users.insertOne(',
        '  { name: "Dave" },',
        '  { writeConcern: { w: "majority" } }',
        ');',
        '// w:"majority" → 과반수 secondary 까지 복제 후 ACK',
        '// w:1 → primary 만 (기본, 빠름)',
        '// w:0 → fire-and-forget (위험, 거의 안 씀)',
        '',
        '// Node.js driver',
        '// const r = await users.insertOne({name:"Alice"});',
        '// console.log(r.insertedId);',
        '',
        '// Python pymongo',
        '// r = users.insert_one({"name":"Alice"})',
        '// print(r.inserted_id)',
        '',
        '// 트랜잭션 안에서도 사용 가능 (v4.0+)',
        '//   session.startTransaction()',
        '//   users.insertOne({...}, {session})',
        '//   session.commitTransaction()',
      ]},
      s2: {lang:'javascript', filename:'02-insert-many.js', lines:[
        '// Step 2. insertMany — 일괄',
        '',
        'const docs = [',
        '  { name: "Alice", age: 30 },',
        '  { name: "Bob",   age: 25 },',
        '  { name: "Carol", age: 28 },',
        '];',
        '',
        'const result = db.users.insertMany(docs);',
        '',
        '// 결과',
        '// {',
        '//   acknowledged: true,',
        '//   insertedIds: {',
        '//     "0": ObjectId(...),',
        '//     "1": ObjectId(...),',
        '//     "2": ObjectId(...)',
        '//   }',
        '// }',
        '',
        '// 대량 삽입 — 배치 처리',
        'const BATCH = 1000;',
        'for (let i = 0; i < bigArray.length; i += BATCH) {',
        '  await users.insertMany(bigArray.slice(i, i + BATCH));',
        '}',
        '',
        '// 성능 비교 (10000건)',
        '// insertOne × 10000      → 약 60초 (네트워크 RTT 누적)',
        '// insertMany 1000 × 10   → 약 2초',
        '// 30배 차이',
        '',
        '// 메모리 주의',
        '//  - 너무 큰 배치 (10만+) → 메모리 부담',
        '//  - 적당: 1000~5000',
        '',
        '// 옵션',
        'db.users.insertMany(docs, {',
        '  ordered: true,                       // 기본',
        '  writeConcern: { w: "majority" }',
        '});',
        '',
        '// MongoDB 단일 BSON 메시지 제한',
        '//  - 16 MB 문서 한계',
        '//  - 한 insertMany 도 48 MB 정도까지',
        '//  - 그 이상은 알아서 나눠야 함',
      ]},
      s3: {lang:'javascript', filename:'03-ordered.js', lines:[
        '// Step 3. ordered vs unordered',
        '',
        '// 문서 5건 중 3번째가 _id 중복',
        'const docs = [',
        '  { _id: 1, name: "Alice" },',
        '  { _id: 2, name: "Bob" },',
        '  { _id: 1, name: "Carol" },   // ← 중복',
        '  { _id: 3, name: "Dave" },',
        '  { _id: 4, name: "Eve" }',
        '];',
        '',
        '// (1) ordered: true (기본)',
        'db.users.insertMany(docs);',
        '// 결과: 1,2 까지 삽입 → 3에서 에러 → 4,5 진행 안 됨',
        '',
        '// (2) ordered: false',
        'db.users.insertMany(docs, { ordered: false });',
        '// 결과: 1,2,4,5 삽입 → 3은 에러 로그만',
        '// 4건 들어가고 1건 실패',
        '',
        '// 선택 기준',
        '// ordered: true',
        '//  - 순서가 의미 (시계열 로그)',
        '//  - 첫 실패에서 모두 중단 (트랜잭션처럼)',
        '',
        '// ordered: false',
        '//  - 독립 문서 (사용자 일괄 import)',
        '//  - 부분 성공 OK',
        '//  - 빠름 (병렬 처리 가능)',
        '',
        '// 에러 처리',
        'try {',

        op: 'bulkWrite', rows: 3,

      { ...S4,
        beat:{ label:'deleteOne 도 같은 배열에', at:'04-bulk-write.js L20–21',
               caption:'삭제까지 한 요청 안에 넣는다.',
               changes:[{mark:'gone', text:'_id 99 삭제 예약'}] },
        op: 'bulkWrite', rows: 4,
        verdict: 'Mixed', verdictTone: 'good',
        keyPoint: '정리 작업에서 삽입·갱신·삭제를 따로 돌 필요가 없다.',

      },
      { ...S4,
        beat:{ label:'replaceOne — 통째 교체', at:'04-bulk-write.js L23–28',
               caption:'update 와 달리 문서 전체를 replacement 로 바꾼다. 없던 필드는 사라진다.',
               changes:[{mark:'changed', text:'_id 2 문서 전체 교체'},
                        {mark:'gone', text:'replacement 에 없는 필드'}] },
        op: 'bulkWrite', rows: 5,
        verdict: 'Replace', verdictTone: 'warn',
        keyPoint: 'replaceOne 은 부분 수정이 아니다. 빠뜨린 필드는 그대로 없어진다.',
        code:{...CODE.s4, highlight:[23,24,25,26,27,28]},
      },
      { ...S4,
        beat:{ label:'5개 작업을 한 번에', at:'04-bulk-write.js L30',
               caption:'종류가 다른 5개 작업이 한 번의 왕복으로 나간다. ordered: false 로.',
               changes:[{mark:'changed', text:'왕복 5회 → 1회'},
                        {mark:'read', text:'실패해도 나머지 진행'}] },
        op: 'bulkWrite', rows: 5,
        verdict: 'Mixed', verdictTone: 'good',
        keyPoint: 'Step 3 의 ordered 규칙이 bulkWrite 에도 그대로 적용된다.',
        code:{...CODE.s4, highlight:[30]},
      },
      { ...S4,
        beat:{ label:'결과는 종류별 카운터', at:'04-bulk-write.js L33–40',
               caption:'insert·match·modify·delete·upsert 건수가 따로 돌아온다.',
               changes:[{mark:'read', text:'insertedCount 1 · deletedCount 1'},
                        {mark:'read', text:'matched 2 / modified 2'}] },
        op: 'bulkWrite', rows: 5,
        verdict: 'ACK', verdictTone: 'good',
        keyPoint: 'matchedCount 와 modifiedCount 가 다르면 값이 이미 같았다는 뜻이다.',
        code:{...CODE.s4, highlight:[33,34,35,36,37,38,39,40]},
      },
      { ...S4,
        beat:{ label:'CSV 동기화에 그대로 쓴다', at:'04-bulk-write.js L45–52',
               caption:'들어온 행마다 email 기준 upsert 작업을 만들어 한 번에 보낸다.',
               changes:[{mark:'new', text:'행 수만큼 upsert ops'},
                        {mark:'changed', text:'있으면 갱신, 없으면 추가'}] },
        op: 'bulkWrite', rows: 5,
        verdict: '동기화', verdictTone: 'good',
        keyPoint: '조회 후 분기하는 코드가 upsert 한 줄로 사라진다.',
        code:{...CODE.s4, highlight:[45,46,47,48,49,50,51,52]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'w: 1 — primary 까지', at:'05-write-concern.js L3–7',
               caption:'primary 가 받으면 바로 ACK 한다. 가장 빠르고 기본값이다.',
               changes:[{mark:'read', text:'ACK 시점 = primary'},
                        {mark:'gone', text:'primary 장애 시 손실 가능'}] },
        op: 'w:1', rows: 1,
        verdict: '속도', verdictTone: 'warn',
        keyPoint: '기본값은 빠른 쪽이다. 안전이 필요하면 직접 올려야 한다.',
        code:{...CODE.s5, highlight:[3,4,5,6,7]},
      },
      { ...S5,
        beat:{ label:'w: "majority" 의 뜻', at:'05-write-concern.js L9–12',
               caption:'과반수 노드까지 복제된 뒤에 ACK 한다. 대신 복제 대기가 붙는다.',
               changes:[{mark:'changed', text:'ACK 시점 = 과반수 복제'},
                        {mark:'read', text:'지연 증가'}] },
        op: 'w:majority', rows: 1,
        verdict: '안전', verdictTone: 'good',
        keyPoint: 'primary 가 죽어도 살아남는 기준선이 majority 다.',
        code:{...CODE.s5, highlight:[9,10,11,12]},
      },
      { ...S5,
        beat:{ label:'실제 호출은 옵션 한 줄', at:'05-write-concern.js L13–16',
               caption:'insertOne 두 번째 인자에 writeConcern 을 넣는 것이 전부다.',
               changes:[{mark:'new', text:'writeConcern: { w: "majority" }'}] },
        op: 'w:majority', rows: 1,
        verdict: '적용', verdictTone: 'good',
        keyPoint: '연산 단위로도, 클라이언트 기본값으로도 지정할 수 있다.',
        code:{...CODE.s5, highlight:[13,14,15,16]},
      },
      { ...S5,
        beat:{ label:'w: 0 — 기다리지 않는다', at:'05-write-concern.js L18–22',
               caption:'ACK 를 아예 안 받는다. 빠르지만 실패해도 알 수 없다.',
               changes:[{mark:'gone', text:'ACK · 에러 통보 없음'},
                        {mark:'read', text:'로그/메트릭 전용'}] },
        op: 'w:0', rows: 1,
        verdict: '위험', verdictTone: 'warn',
        keyPoint: '손실을 감당할 수 있는 데이터에만 쓴다. 사용자 데이터에는 금물이다.',
        code:{...CODE.s5, highlight:[18,19,20,21,22]},
      },
      { ...S5,
        beat:{ label:'j: true — 디스크까지', at:'05-write-concern.js L24–30',
               caption:'메모리가 아니라 journal 이 디스크에 내려간 뒤 ACK 한다.',
               changes:[{mark:'new', text:'j: true 추가'},
                        {mark:'changed', text:'서버 크래시에도 보존'}] },
        op: 'j:true', rows: 1,
        verdict: '최강', verdictTone: 'good',
        keyPoint: 'w 는 몇 대까지, j 는 디스크까지 — 축이 다르다. 같이 쓴다.',
        code:{...CODE.s5, highlight:[24,25,26,27,28,29,30]},
      },
      { ...S5,
        beat:{ label:'wtimeout 으로 무한 대기 방지', at:'05-write-concern.js L32–37',
               caption:'과반수 응답을 5초 안에 못 받으면 에러로 끊는다.',
               changes:[{mark:'new', text:'wtimeout: 5000'},
                        {mark:'read', text:'타임아웃 시 에러'}] },
        op: 'wtimeout', rows: 1,
        verdict: '방어', verdictTone: 'warn',
        keyPoint: '타임아웃이 났다고 쓰기가 취소된 것은 아니다. 나중에 반영될 수 있다.',
        code:{...CODE.s5, highlight:[32,33,34,35,36,37]},
      },
      { ...S5,
        beat:{ label:'데이터 성격별 기준', at:'05-write-concern.js L39–42',
               caption:'결제·예약은 majority + j, 일반 데이터는 majority, 로그는 w:1.',
               changes:[{mark:'read', text:'중요도 → w 값 대응'}] },
        op: 'writeConcern', rows: 1,
        verdict: '정책', verdictTone: 'good',
        keyPoint: '전 collection 을 같은 값으로 두지 않는다. 데이터마다 다르게 정한다.',
        code:{...CODE.s5, highlight:[39,40,41,42]},
      },
      { ...S5,
        beat:{ label:'읽기 쪽에는 readConcern', at:'05-write-concern.js L44–47',
               caption:'쓰기의 w 에 대응하는 개념이 읽기에도 있다. local·majority·linearizable.',
               changes:[{mark:'new', text:'readConcern 축'},
                        {mark:'read', text:'local / majority / linearizable'}] },
        op: 'writeConcern', rows: 0,
        verdict: '균형', verdictTone: 'good',
        summary: {
          title: 'insert 종류와 writeConcern',
          rows: [
            { metric: 'insertOne', before: '단건', after: 'ACK + _id', delta: '1 RTT' },
            { metric: 'insertMany', before: '배열', after: '일괄', delta: 'N RTT 절감' },
            { metric: 'ordered', before: 'true/false', after: '실패 시 동작', delta: '비즈니스 결정' },
            { metric: 'bulkWrite', before: '혼합', after: 'I/U/D 한 번에', delta: '복잡 작업' },
            { metric: 'writeConcern', before: 'w:1/majority', after: '안전 vs 속도', delta: '운영 정책' },
          ],
        },
        keyPoint: '안전이 중요하면 w:"majority", 속도가 중요하면 w:1. 금융/예약은 majority.',
        code:{...CODE.s5, highlight:[44,45,46,47]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function OpCard({ op, rows }) {
      return (
        <div className="rounded-lg border p-3 bg-emerald-50 border-emerald-200 text-xs">
          <div className="font-bold mb-1" style={{ color: '#13aa52' }}>현재 작업</div>
          <div className="text-zinc-700">연산: <code className="font-mono bg-white px-1 rounded">{op}</code></div>
          <div className="text-zinc-700">건수: <b>{rows}</b></div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{ borderColor: '#13aa52' }}>
          <div className="text-sm font-bold mb-2" style={{ color: '#13aa52' }}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-zinc-500 border-b border-zinc-200">
                <th className="py-1 pr-2">연산</th><th className="py-1 pr-2">대상</th><th className="py-1 pr-2">결과</th><th className="py-1">특징</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-zinc-700">{r.after}</td>
                  <td className="py-1 font-bold" style={{ color: '#13aa52' }}>{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#13aa5240' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#13aa52' }}>Insert / Bulk 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <OpCard op={state.op} rows={state.rows} />

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs rounded p-2 border bg-emerald-50 border-emerald-200" style={{ color: '#0f7a3a' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-emerald-500/25 border-l-2 border-emerald-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6 bg-gradient-to-br from-emerald-50 to-green-50">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap p-4 rounded-xl text-white shadow" style={{ backgroundColor: '#13aa52' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white font-bold" style={{ color: '#13aa52' }}>🍃</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter III-1-1. insert + Bulk</h1>
                <p className="text-sm text-emerald-50">insertOne · insertMany · ordered · bulkWrite · writeConcern</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-white underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? '' : 'bg-emerald-100'}`} style={i <= stepIdx ? { backgroundColor: '#13aa52' } : {}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-emerald-800 text-white px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-emerald-50 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#0f7a3a' : '#13aa52' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-emerald-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 px-4 py-3 text-sm bg-white" style={{ borderColor: '#13aa52', color: '#0f7a3a' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                단건은 insertOne, 일괄은 insertMany, 혼합은 bulkWrite. ordered + writeConcern 으로 안전 vs 속도 균형.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['insertOne', 'insertMany', 'bulkWrite', 'ordered', 'writeConcern'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border bg-emerald-50 border-emerald-300" style={{ color: '#13aa52' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#13aa52' }}>
              <a href="../part2/II-2-2.html" className="underline hover:no-underline">← 이전: II-2-2 Schema Validation</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 find →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
