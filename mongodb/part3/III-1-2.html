    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      equality: {lang:'javascript', filename:'01-equality.js', lines:[
            '// Step 1. equality $eq',
            '',
            '// 데이터',
            '// { _id:1, name:"Alice", age:30, role:"admin" }',
            '// { _id:2, name:"Bob",   age:25, role:"user" }',
            '// { _id:3, name:"Carol", age:30, role:"user" }',
            '',
            '// 단순 equality',
            'db.users.find({ age: 30 });',
            '// → Alice, Carol',
            '',
            '// 명시적 $eq (위와 동일)',
            'db.users.find({ age: { $eq: 30 } });',
            '',
            '// 중첩 필드 — dot notation',
            'db.users.find({ "address.city": "Seoul" });',
            '',
            '// 배열 안 매칭',
            'db.users.find({ tags: "vip" });',
            '// tags 배열에 "vip" 가 있는 문서',
            '',
            '// 배열 정확히 매칭 — 순서까지',
            'db.users.find({ tags: ["vip", "admin"] });',
            '// → 순서까지 정확히 ["vip","admin"]',
            '',
            '// 여러 조건 AND',
            'db.users.find({ age: 30, role: "admin" });',
            '// → Alice 만',
            '',
            '// findOne — 첫 한 건',
            'db.users.findOne({ age: 30 });',
            '',
            '// countDocuments',
            'db.users.countDocuments({ role: "admin" });',
            '',
            '// distinct — 고유 값',
            'db.users.distinct("role");',
            '// → ["admin", "user"]',
            '',
            '// 인덱스',
            '//  - { age: 1 } 단일 필드 인덱스로 가속',
            '//  - { age: 1, role: 1 } compound 로 두 조건 같이',
      ]},
      comparison: {lang:'javascript', filename:'02-comparison.js', lines:[
            '// Step 2. 비교 연산자',
            '',
            '// 30세 이상',
            'db.users.find({ age: { $gte: 30 } });',
            '',
            '// 25 < age < 35',
            'db.users.find({ age: { $gt: 25, $lt: 35 } });',
            '',
            '// 28세 아닌 사람',
            'db.users.find({ age: { $ne: 28 } });',
            '',
            '// 날짜',
            'db.orders.find({',
            '  createdAt: { $gte: ISODate("2026-01-01") }',
            '});',
            '',
            '// 가격대 검색',
            'db.products.find({',
            '  price: { $gte: 10000, $lte: 50000 }',
            '});',
            '',
            '// 문자열 lexicographic 비교',
            'db.users.find({ name: { $gte: "A", $lt: "C" } });',
            '// A 로 시작 ~ B 로 시작',
            '',
            '// 인덱스 활용',
            'db.products.createIndex({ price: 1 });',
            '// 위 가격대 검색이 IXSCAN range 로 빠름',
            '',
            '// 페이지네이션 (cursor pagination)',
            '// 최근 만들어진 게시글 페이지',
            'const lastId = ObjectId("664a..."); // 직전 페이지 마지막',
            'db.posts.find({ _id: { $lt: lastId } })',
            '  .sort({ _id: -1 })',
            '  .limit(20);',
            '',
            '// skip 보다 cursor pagination 권장',
            '//  - skip 은 깊을수록 느려짐',
            '//  - cursor 는 일정한 비용',
            '',
            '// 비교 가능 타입',
            '//  - Int / Long / Double / Decimal128',
            '//  - Date',
            '//  - String',
            '//  - ObjectId',
            '//  - Array (사전순)',
      ]},
      inOp: {lang:'javascript', filename:'03-in.js', lines:[
            '// Step 3. $in / $nin',
            '',
            '// 데이터',
            '// { _id:1, name:"Alice", role:"admin" }',
            '// { _id:2, name:"Bob",   role:"user" }',
            '// { _id:3, name:"Carol", role:"guest" }',
            '',
            '// admin 또는 guest',
            'db.users.find({ role: { $in: ["admin", "guest"] } });',
            '// → Alice, Carol',
            '',
            '// admin/guest 아님',
            'db.users.find({ role: { $nin: ["admin", "guest"] } });',
            '// → Bob',
            '',
            '// _id 여러 개 조회',
            'db.users.find({ _id: { $in: [1, 2, 3] } });',
            '',
            '// 배열 필드 + $in',
            '// tags 배열에 "vip" 또는 "admin" 중 하나라도',
            'db.users.find({ tags: { $in: ["vip", "admin"] } });',
            '',
            '// $or 와 차이',
            'db.users.find({ $or: [',
            '  { role: "admin" },',
            '  { role: "guest" }',
            ']});',
            '// 위 두 코드는 같은 결과. 단순할 때 $in 이 더 빠름.',
            '',
            '// $or 는 서로 다른 필드 조합에 씀',
            'db.users.find({ $or: [',

        keyPoint: '정규식 중 인덱스를 쓰는 건 ^ 로 시작이 고정된 형태뿐이다.',
        code:{...CODE.regex, highlight:[14, 15, 16]},
      },
      { ...S4,
        beat:{ label:'중간·끝 매칭은 풀스캔', at:'04-regex.js L19–24',
               caption:'/li/ 처럼 앞이 열려 있거나 /...$/ 처럼 끝만 맞추면 전 문서를 읽는다.',
               changes:[{mark: 'changed', text: 'IXSCAN → COLLSCAN'}, {mark: 'gone', text: '인덱스 사용 불가'}] },
        op: '/li/, /…$/',
        matched: 2,
        verdict: 'COLLSCAN',
        verdictTone: 'danger',
        keyPoint: '$regex 는 가벼운 패턴 매칭. prefix 정규식만 인덱스 활용.',
        code:{...CODE.regex, highlight:[19, 20, 23, 24]},
      },
      { ...S4,
        beat:{ label:'어디에 쓸지 가른다', at:'04-regex.js L26–29',
               caption:'자동완성은 prefix 정규식으로 충분하고, 본문 키워드 검색은 정규식의 일이 아니다.',
               changes:[{mark: 'read', text: '자동완성 → /^Al/'}, {mark: 'gone', text: '본문 검색은 부적합'}] },
        op: '사용 가이드',
        matched: 1,
        verdict: '선택',
        verdictTone: 'warn',
        keyPoint: '정규식이 복잡할수록 문서마다 비용이 커진다.',
        code:{...CODE.regex, highlight:[26, 27, 28, 29]},
      },
      { ...S4,
        beat:{ label:'text 인덱스로 넘긴다', at:'04-regex.js L31–34',
               caption:'title/body 에 text 인덱스를 만들고 $text 로 검색하면 형태소 처리와 점수가 붙는다.',
               changes:[{mark: 'new', text: 'text 인덱스'}, {mark: 'new', text: '$text $search'}] },
        op: '$text',
        matched: 5,
        verdict: '검색',
        verdictTone: 'good',
        keyPoint: '본격 검색은 text index 또는 Atlas Search 로.',
        code:{...CODE.regex, highlight:[31, 32, 33, 34]},
      },
      { ...S4,
        beat:{ label:'입력을 그대로 넣지 않는다', at:'04-regex.js L37–40',
               caption:'사용자 입력을 정규식으로 바로 쓰면 ReDoS 가 된다. escape 한 뒤 RegExp 를 만든다.',
               changes:[{mark: 'new', text: 'escape() 통과'}, {mark: 'gone', text: 'ReDoS 위험 제거'}] },
        op: 'RegExp(escape)',
        matched: 2,
        verdict: '안전',
        verdictTone: 'warn',
        keyPoint: '정규식 메타문자를 escape 하거나 입력 형식을 먼저 검증한다.',
        code:{...CODE.regex, highlight:[37, 38, 39, 40]},
      },
      // ── Step 5 ──────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'필요한 필드만 받는다', at:'05-projection-sort.js L3–8',
               caption:'두 번째 인자가 projection. 1 은 포함, 0 은 제외. _id 만 예외적으로 따로 꺼야 한다.',
               changes:[{mark: 'new', text: 'projection { name, age }'}, {mark: 'gone', text: '_id 제외'}] },
        op: 'projection (include)',
        matched: 2,
        verdict: '선택',
        verdictTone: 'good',
        keyPoint: '필요한 필드만 받으면 네트워크와 메모리를 함께 아낀다.',
        code:{...CODE.projection, highlight:[3, 4, 5, 6, 7, 8]},
      },
      { ...S5,
        beat:{ label:'민감 필드를 뺀다', at:'05-projection-sort.js L11–14',
               caption:'0 만 나열하면 제외 형태다. password, ssn 처럼 절대 나가면 안 되는 필드를 막는다.',
               changes:[{mark: 'gone', text: 'password, ssn 제외'}, {mark: 'changed', text: 'include → exclude 형태'}] },
        op: 'projection (exclude)',
        matched: 3,
        verdict: '차단',
        verdictTone: 'good',
        keyPoint: 'include 와 exclude 를 한 projection 에 섞을 수 없다 (_id 제외).',
        code:{...CODE.projection, highlight:[11, 12, 13, 14]},
      },
      { ...S5,
        beat:{ label:'정렬을 붙인다', at:'05-projection-sort.js L17–22',
               caption:'1 이 오름차순, -1 이 내림차순. 여러 필드를 주면 앞에서부터 순서대로 적용된다.',
               changes:[{mark: 'new', text: 'sort({age:-1})'}, {mark: 'new', text: 'role → age 복합 정렬'}] },
        op: 'sort',
        matched: 3,
        verdict: '정렬',
        verdictTone: 'good',
        keyPoint: '정렬 필드와 인덱스 순서가 맞아야 메모리 정렬을 피한다.',
        code:{...CODE.projection, highlight:[17, 18, 21, 22]},
      },
      { ...S5,
        beat:{ label:'페이지로 자른다', at:'05-projection-sort.js L24–29',
               caption:'skip(20).limit(10) 이면 21번째부터 10건. sort 가 있어야 페이지가 안정된다.',
               changes:[{mark: 'new', text: 'skip 20 / limit 10'}, {mark: 'read', text: '21~30번째 문서'}] },
        op: 'skip + limit',
        matched: 10,
        verdict: '페이지',
        verdictTone: 'good',
        keyPoint: 'sort 없이 skip/limit 을 쓰면 페이지마다 순서가 달라질 수 있다.',
        code:{...CODE.projection, highlight:[24, 25, 26, 27, 28, 29]},
      },
      { ...S5,
        beat:{ label:'skip 의 함정', at:'05-projection-sort.js L31–34',
               caption:'skip(10000) 은 앞 1만 건을 읽고 버린다. 깊은 페이지일수록 느려진다.',
               changes:[{mark: 'gone', text: '깊은 skip 은 비용 누적'}, {mark: 'read', text: '대안: $gt lastId'}] },
        op: 'skip 주의',
        matched: 10,
        verdict: '주의',
        verdictTone: 'warn',
        keyPoint: '깊은 페이지는 cursor pagination 으로 바꾼다.',
        code:{...CODE.projection, highlight:[31, 32, 33, 34]},
      },
      { ...S5,
        beat:{ label:'한 줄로 이어 쓴다', at:'05-projection-sort.js L36–40',
               caption:'filter + projection 뒤에 sort 와 limit 을 체이닝한다. 실무에서 가장 흔한 한 세트.',
               changes:[{mark: 'new', text: 'filter+projection+sort+limit'}, {mark: 'read', text: '책 20권'}] },
        op: '체이닝',
        matched: 20,
        verdict: '결합',
        verdictTone: 'good',
        keyPoint: 'find = 매칭 + 결과 다듬기. projection/sort/limit/skip 을 한 묶음으로 사용.',
        code:{...CODE.projection, highlight:[36, 37, 38, 39, 40]},
      },
      { ...S5,
        beat:{ label:'실행 계획을 확인한다', at:'05-projection-sort.js L42–50',
               caption:'explain("executionStats") 로 IXSCAN 인지 COLLSCAN 인지 본다. 드라이버에서는 커서를 그대로 순회한다.',
               changes:[{mark: 'new', text: 'explain 실행 계획'}, {mark: 'read', text: 'driver cursor 순회'}] },
        op: 'explain',
        matched: 20,
        verdict: '검증',
        verdictTone: 'good',
        summary: {title: 'find 도구 정리', rows: [{metric: 'equality', before: '{age:30}', after: '$eq', delta: '단순'}, {metric: 'comparison', before: '$gt/$lt', after: '범위', delta: 'IXSCAN'}, {metric: '$in', before: '다중 값', after: 'OR 최적', delta: '인덱스'}, {metric: '$regex', before: '패턴', after: 'prefix 만 빠름', delta: '주의'}, {metric: 'projection', before: '필드 선택', after: '+sort+limit', delta: '필수 묶음'}]},
        keyPoint: '느리면 추측하지 말고 explain 으로 스캔 방식을 먼저 확인한다.',
        code:{...CODE.projection, highlight:[42, 43, 44, 45, 46, 49, 50]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function OpCard({ op, matched }) {
      return (
        <div className="rounded-lg border p-3 bg-emerald-50 border-emerald-200 text-xs">
          <div className="font-bold mb-1" style={{ color: '#13aa52' }}>현재 연산자</div>
          <div className="text-zinc-700">연산: <code className="font-mono bg-white px-1 rounded">{op}</code></div>
          <div className="text-zinc-700">매칭 문서 (예시): <b>{matched}</b></div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-3 bg-white" style={{ borderColor: '#13aa52' }}>
          <div className="text-sm font-bold mb-2" style={{ color: '#13aa52' }}>📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-zinc-500 border-b border-zinc-200">
                <th className="py-1 pr-2">도구</th><th className="py-1 pr-2">형태</th><th className="py-1 pr-2">결과</th><th className="py-1">특징</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-zinc-700">{r.after}</td>
                  <td className="py-1 font-bold" style={{ color: '#13aa52' }}>{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#13aa5240' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#13aa52' }}>find 연산자</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <OpCard op={state.op} matched={state.matched} />

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs rounded p-2 border bg-emerald-50 border-emerald-200" style={{ color: '#0f7a3a' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-emerald-500/25 border-l-2 border-emerald-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6 bg-gradient-to-br from-emerald-50 to-green-50">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap p-4 rounded-xl text-white shadow" style={{ backgroundColor: '#13aa52' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white font-bold" style={{ color: '#13aa52' }}>🍃</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter III-1-2. find</h1>
                <p className="text-sm text-emerald-50">$eq · $gt/$lt · $in · $regex · projection/sort/limit/skip</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-white underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? '' : 'bg-emerald-100'}`} style={i <= stepIdx ? { backgroundColor: '#13aa52' } : {}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-emerald-800 text-white px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-emerald-50 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#0f7a3a' : '#13aa52' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-emerald-300 bg-white text-emerald-700 hover:bg-emerald-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-emerald-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 px-4 py-3 text-sm bg-white" style={{ borderColor: '#13aa52', color: '#0f7a3a' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                find = 매칭 + 결과 다듬기. equality/$gt/$in/$regex 으로 조건, projection/sort/limit/skip 으로 결과 정리.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['$eq', '$gt', '$lt', '$in', '$regex', 'projection', 'sort'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border bg-emerald-50 border-emerald-300" style={{ color: '#13aa52' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#13aa52' }}>
              <a href="./III-1-1.html" className="underline hover:no-underline">← 이전: III-1-1 insert + Bulk</a>
              <a href="./III-2-1.html" className="underline hover:no-underline">다음: III-2-1 update + upsert →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
