  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <div id="root"></div>
  <!--
    Go II-1-2 — channel (비유: 컨베이어 벨트 / 물류 파이프)
    goroutine 사이를 값으로 잇는 파이프. "메모리 공유로 통신하지 말고, 통신으로 공유하라".
    6단계: 개념 → unbuffered 랑데부 → buffered 용량 → close+range → v,ok 감지 → 실무 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#00ADD8';

    const STEPS = [
      {
        title: 'Step 1. channel = 타입 있는 파이프',
        desc: 'goroutine 은 서로 메모리를 직접 만지면 race condition 이 난다. 그래서 Go 는 값을 "보내고 받는" 파이프인 channel 로 통신하게 한다. make(chan int) 로 int 만 흐르는 파이프를 만들고, 송신은 ch 화살표 v, 수신은 v 콜론이퀄 화살표 ch 로 쓴다. 파이프에 타입이 있어 컴파일 타임에 잘못된 값이 막힌다. 핵심 철학은 "메모리 공유로 통신하지 말고, 통신으로 메모리를 공유하라".',
        channel: { capacity: 0, slots: [], sending: true, receiving: true, closed: false, flow: true, senderLabel: '보냄 ch <- 1', receiverLabel: 'v := <-ch', capLabel: 'unbuffered' },
        alert: { tone: 'info', text: 'channel 은 lock 을 직접 쓰지 않아도 안전하게 값을 넘긴다. 값의 "소유권" 이 송신자에서 수신자로 넘어가기 때문이다.' },
        code: {
          lang: 'go', filename: 'basic.go',
          lines: [
            'package main',
            '',
            'import "fmt"',
            '',
            'func main() {',
            '    ch := make(chan int)   // int 만 흐르는 파이프',
            '',
            '    go func() {',
            '        ch <- 42           // 송신: 파이프에 42 를 넣는다',
            '    }()',
            '',
            '    v := <-ch              // 수신: 파이프에서 꺼낸다',
            '    fmt.Println(v)         // => 42',
            '}',
          ],
          highlight: [6, 8, 9, 12, 13],
        },
      },
      {
        title: 'Step 2. unbuffered — 만나야 전달되는 랑데부',
        desc: 'make(chan int) 처럼 용량이 없는 채널은 "손에서 손으로" 넘긴다. 송신 ch 화살표 v 는 받는 사람이 나타날 때까지 그 자리에서 멈춘다(블로킹). 반대로 수신도 보내는 사람이 올 때까지 멈춘다. 그래서 unbuffered 채널은 값 전달 + 두 goroutine 의 타이밍 동기화를 동시에 한다. "지금 이 값을 네가 확실히 받았다" 를 보장해야 할 때 쓴다.',
        channel: { capacity: 0, slots: [], sending: true, receiving: true, closed: false, flow: true, blockedSend: true, senderLabel: '수신자 올 때까지 대기', receiverLabel: '수신 준비', capLabel: 'unbuffered (랑데부)' },
        alert: { tone: 'warn', text: '수신자가 없는데 unbuffered 채널에 송신하면 그 goroutine 은 영원히 멈춘다. 모두 멈추면 deadlock.' },
        code: {
          lang: 'go', filename: 'rendezvous.go',
          lines: [
            'ch := make(chan string)     // 용량 0 = unbuffered',
            '',
            'go func() {',
            '    fmt.Println("보내는 중...")',
            '    ch <- "hello"           // 받는 사람 올 때까지 여기서 멈춤',
            '    fmt.Println("전달 완료")   // 수신된 뒤에야 실행',
            '}()',
            '',
            'time.Sleep(time.Second)     // 일부러 늦게 받아본다',
            'msg := <-ch                 // 이 순간 송신이 풀린다',
            'fmt.Println(msg)            // => hello',
          ],
          highlight: [1, 5, 6, 10],
        },
      },
      {
        title: 'Step 3. buffered — 용량만큼 미리 담는다',
        desc: 'make(chan int, 3) 은 3칸짜리 버퍼가 달린 파이프다. 버퍼가 안 찼으면 송신은 값을 넣고 바로 다음 줄로 간다(블로킹 안 함). 버퍼가 가득 차면 그때부터 송신이 멈춘다. 반대로 버퍼가 비었으면 수신이 멈춘다. 생산 속도와 소비 속도가 들쭉날쭉할 때 버퍼가 충격을 흡수한다. 단, 버퍼는 "임시 여유" 일 뿐 무한 큐가 아니다 — 용량 설계를 잘못하면 결국 막힌다.',
        channel: { capacity: 3, slots: [1, 2], sending: true, receiving: false, closed: false, flow: false, capLabel: 'buffered cap=3 (2칸 참)' },
        alert: { tone: 'good', text: '버퍼가 있으면 송신자가 수신자를 기다리지 않아도 되어 처리량이 오른다. 용량은 부하 테스트로 정한다.' },
        code: {
          lang: 'go', filename: 'buffered.go',
          lines: [
            'ch := make(chan int, 3)     // 3칸 버퍼',
            '',
            'ch <- 1   // 버퍼 [1]      송신 즉시 통과',
            'ch <- 2   // 버퍼 [1 2]    송신 즉시 통과',
            'ch <- 3   // 버퍼 [1 2 3]  아직 통과',
            '// ch <- 4                 // 가득 참 => 여기서 블로킹',
            '',
            'fmt.Println(<-ch)          // => 1  (한 칸 비움)',
            'fmt.Println(len(ch), cap(ch)) // => 2 3',
          ],
          highlight: [1, 3, 4, 5, 6, 8],
        },
      },
      {
        title: 'Step 4. close + range — 끝을 알리고 순회한다',
        desc: 'close(ch) 는 "더 이상 보낼 값이 없다" 는 신호다. 닫은 뒤에도 버퍼에 남은 값은 정상적으로 수신된다. for v := range ch 는 채널이 닫히고 남은 값까지 모두 비면 자동으로 반복을 끝낸다. 그래서 생산자는 다 보낸 뒤 close 하고, 소비자는 range 로 편하게 돈다. 닫는 책임은 항상 "보내는 쪽" 이 진다 — 받는 쪽이 닫으면 송신자가 닫힌 채널에 쓰다 panic 한다.',
        channel: { capacity: 3, slots: [7, 8], sending: false, receiving: true, closed: true, flow: false, capLabel: 'closed — range 로 배수' },
        alert: { tone: 'info', text: 'close 는 값이 아니라 상태다. range 는 close 를 만나면 깔끔히 종료된다 — 종료 조건을 직접 셀 필요가 없다.' },
        code: {
          lang: 'go', filename: 'close_range.go',
          lines: [
            'ch := make(chan int, 3)',
            '',
            'go func() {',
            '    for i := 1; i <= 3; i++ {',
            '        ch <- i',
            '    }',
            '    close(ch)               // 다 보냈다고 알림 (송신자가 닫는다)',
            '}()',
            '',
            'for v := range ch {         // close 되면 자동 종료',
            '    fmt.Println(v)          // => 1, 2, 3',
            '}',
            'fmt.Println("done")         // range 종료 후 실행',
          ],
          highlight: [5, 7, 10, 11, 13],
        },
      },
      {
        title: 'Step 5. v, ok — 닫힘 감지 & 생산자-소비자',
        desc: 'range 대신 직접 받을 때는 v, ok := 화살표 ch 를 쓴다. 채널이 닫혔고 값도 다 빠졌으면 ok 가 false, v 는 그 타입의 zero 값(int 면 0)이 된다. 이걸로 "닫혔는지" 를 값과 구분해 감지한다. 생산자-소비자 패턴에서는 생산자 goroutine 이 결과를 채널로 흘리고, 소비자가 ok 로 종료를 판단한다. 여러 소비자를 붙이면 자연스러운 작업 분배(worker pool)가 된다.',
        channel: { capacity: 3, slots: [9], sending: false, receiving: true, closed: true, flow: false, okFlag: true, capLabel: 'v, ok 로 닫힘 감지' },
        alert: { tone: 'good', text: '값 0 과 "채널 닫힘" 을 헷갈리면 무한 루프가 난다. ok 로 닫힘을 구분하는 습관을 들여라.' },
        code: {
          lang: 'go', filename: 'producer_consumer.go',
          lines: [
            'jobs := make(chan int, 5)',
            '',
            'go func() {                 // 생산자',
            '    for i := 1; i <= 5; i++ {',
            '        jobs <- i * i',
            '    }',
            '    close(jobs)',
            '}()',
            '',
            'for {                       // 소비자',
            '    v, ok := <-jobs',
            '    if !ok {                // 닫혔고 다 비었다',
            '        break',
            '    }',
            '    fmt.Println("처리:", v)  // => 1 4 9 16 25',
            '}',
          ],
          highlight: [5, 7, 11, 12, 13, 15],
        },
      },
      {
        title: 'Step 6. 실무 함정 — panic / nil / deadlock',
        desc: '채널은 강력하지만 규칙을 어기면 런타임이 바로 응징한다. 닫힌 채널에 송신하면 panic 이 난다. close 를 두 번 해도 panic 이다. nil 채널(make 안 한 var ch chan int)은 송신도 수신도 영원히 블로킹된다 — 조용히 멈춰 찾기 어렵다. 그리고 모든 goroutine 이 서로를 기다리면 런타임이 "all goroutines are asleep - deadlock" 로 프로그램을 죽인다. 규칙: 닫는 건 송신자, 한 번만, 받는 쪽은 절대 닫지 않는다.',
        channel: { capacity: 0, slots: [], sending: true, receiving: false, closed: true, flow: false, danger: true, capLabel: '위험 구역' },
        alert: { tone: 'danger', text: '"닫는 책임은 송신자에게, close 는 한 번만" — 이 두 규칙만 지켜도 채널 버그의 대부분이 사라진다.' },
        code: {
          lang: 'go', filename: 'pitfalls.go',
          lines: [
            'ch := make(chan int)',
            'close(ch)',
            'ch <- 1        // panic: send on closed channel',
            'close(ch)      // panic: close of closed channel',
            '',
            'var nilCh chan int      // nil 채널 (make 안 함)',
            'nilCh <- 1     // 영원히 블로킹 (에러도 안 남)',
            '<-nilCh        // 이것도 영원히 블로킹',
            '',
            'done := make(chan bool)',
            '<-done         // 아무도 안 보냄 => fatal error: deadlock',
          ],
          highlight: [2, 3, 4, 7, 11],
        },
      },
    ];

    // 채널 파이프 시각화 — 송신 goroutine → 버퍼 슬롯 → 수신 goroutine
    function ChannelDiagram({ ch }) {
      if (!ch) return null;
      const slotCount = ch.capacity > 0 ? ch.capacity : 1;
      const slots = [];
      for (let i = 0; i < slotCount; i++) {
        slots.push(ch.slots && i < ch.slots.length ? ch.slots[i] : null);
      }
      const pipeColor = ch.danger ? '#ef4444' : BRAND;
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{ border: `2px solid ${pipeColor}` }}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{ background: pipeColor }}>
            <span>🔗</span><span>channel 파이프 — {ch.capLabel}</span>
          </div>
          <div className="p-4">
            <div className="flex items-stretch gap-2">
              {/* 송신 goroutine */}
              <div className="flex-1 rounded-lg p-2 text-center" style={{ background: ch.sending ? '#e6f7fb' : '#f1f5f9', border: `1px solid ${ch.sending ? BRAND : '#cbd5e1'}` }}>
                <div className="text-lg">📤</div>
                <div className="text-[11px] font-bold" style={{ color: '#0a5a6a' }}>송신 goroutine</div>
                <div className={"text-[10px] mt-1 font-mono " + (ch.blockedSend ? 'trn-pulse' : '')} style={{ color: ch.blockedSend ? '#b45309' : '#475569' }}>
                  {ch.senderLabel || (ch.closed ? '완료' : '대기')}
                </div>
                {ch.blockedSend && <div className="text-[9px] mt-0.5" style={{ color: '#b45309' }}>⛔ 블로킹</div>}
              </div>

              {/* 파이프 + 버퍼 */}
              <div className="flex-1 flex flex-col justify-center relative">
                <div className="relative h-8 flex items-center justify-center">
                  {ch.flow && (
                    <div className="trn-token absolute w-4 h-4 rounded-full z-10 flex items-center justify-center text-[8px] font-bold text-white"
                         style={{ background: pipeColor, top: '8px' }}>●</div>
                  )}
                  <div className="w-full h-1.5 rounded-full" style={{ background: `${pipeColor}66` }} />
                </div>
                <div className="flex gap-1 justify-center mt-1">
                  {slots.map((v, i) => (
                    <div key={i} className="w-8 h-8 rounded flex items-center justify-center text-xs font-mono font-bold"
                         style={{ border: `2px ${ch.capacity > 0 ? 'solid' : 'dashed'} ${pipeColor}`, background: v !== null ? `${pipeColor}22` : '#fff', color: '#0a5a6a' }}>
                      {v !== null ? v : ''}
                    </div>
                  ))}
                </div>
                <div className="text-center text-[9px] mt-1" style={{ color: '#64748b' }}>
                  {ch.closed ? '🚫 closed' : ch.capacity > 0 ? `버퍼 ${(ch.slots || []).length}/${ch.capacity}` : '용량 0'}
                </div>
              </div>

              {/* 수신 goroutine */}
              <div className="flex-1 rounded-lg p-2 text-center" style={{ background: ch.receiving ? '#dbf3e6' : '#f1f5f9', border: `1px solid ${ch.receiving ? '#86efac' : '#cbd5e1'}` }}>
                <div className="text-lg">📥</div>
                <div className="text-[11px] font-bold" style={{ color: '#166534' }}>수신 goroutine</div>
                <div className="text-[10px] mt-1 font-mono" style={{ color: '#475569' }}>
                  {ch.receiverLabel || (ch.receiving ? '수신 중' : '대기')}
                </div>
                {ch.okFlag && <div className="text-[9px] mt-0.5 font-mono" style={{ color: '#166534' }}>v, ok := &lt;-ch</div>}
              </div>
            </div>

            {ch.danger && (
              <div className="mt-3 rounded p-2 text-[10px] font-mono" style={{ background: '#fee2e2', color: '#991b1b', border: '1px dashed #fecaca' }}>
                panic: send on closed channel · nil channel = 영원한 블로킹 · deadlock
              </div>
            )}
          </div>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#e6f7fb', bd: '#9bdaea', tx: '#0a5a6a', icon: '💡' },
      warn:   { bg: '#fef3c7', bd: '#fde68a', tx: '#92400e', icon: '⚠️' },
      danger: { bg: '#fee2e2', bd: '#fecaca', tx: '#991b1b', icon: '🚨' },
      good:   { bg: '#dbf3e6', bd: '#86efac', tx: '#166534', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{ background: s.bg, border: `1px solid ${s.bd}`, color: s.tx }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{ border: `1px solid ${BRAND}` }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#0a5a6a' }}>goroutine 사이의 통신</h3>
            <span className="text-[10px] text-slate-500">송신 ▸ 파이프 ▸ 수신</span>
          </div>
          <ChannelDiagram ch={state.channel} />
          <AlertBox alert={state.alert} />
          <div className="mt-auto pt-3 text-[10px] text-slate-400 font-mono">
            share memory by communicating, don't communicate by sharing memory
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? { background: 'rgba(0,173,216,0.18)', borderLeft: `2px solid ${BRAND}` } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg,#e6f7fb 0%,#cdeef6 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ background: BRAND }}>Go</span>
              <div>
                <div className="text-[11px] font-bold mb-0.5" style={{ color: '#00ADD8' }}>Part II. 동시성 · II-1-2</div>
                <h1 className="text-2xl font-bold" style={{ color: '#0a5a6a' }}>channel — 안전한 통신</h1>
                <p className="text-sm" style={{ color: '#00ADD8' }}>goroutine 사이를 값으로 잇는 파이프 — "메모리 공유로 통신하지 말고, 통신으로 공유하라"</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ background: i <= stepIdx ? BRAND : '#9bdaea' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{ background: BRAND }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ background: BRAND }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#00ADD8aa' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{ border: `2px solid ${BRAND}`, color: '#0a5a6a' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                channel 은 goroutine 사이를 값으로 잇는 타입 있는 파이프다. unbuffered 는 랑데부로 동기화하고, buffered 는 용량만큼 충격을 흡수한다. close 로 끝을 알리고 range / v,ok 로 안전하게 소비한다. "닫는 건 송신자, 한 번만" 규칙만 지켜도 panic·deadlock 대부분이 사라진다. 다음에는 select — 여러 채널을 동시에 기다리는 법을 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['channel', 'goroutine', 'unbuffered', 'buffered', 'close', 'range', 'deadlock', 'CSP'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{ background: '#e6f7fb', color: '#0a5a6a', border: '1px solid #9bdaea' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
