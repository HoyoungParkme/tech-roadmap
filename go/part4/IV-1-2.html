  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

      {
        title: 'Step 6. 실무 함정 — 격리·의존·에러 케이스',
        desc: '테스트가 초록불이어도 안심할 수 없는 네 가지가 있다. (1) 테스트 간 상태 공유 — 전역 변수나 공용 DB 레코드를 공유하면 순서·병렬에 따라 간헐적으로 깨진다. 각 케이스는 자기 데이터를 만들고 되돌려야 한다. (2) 실제 외부 의존 — 진짜 HTTP·DB 를 때리면 느리고 불안정하다. 의존을 인터페이스로 받아 테스트에서 가짜(mock/fake)로 주입한다. (3) 에러 케이스 누락 — 정상 경로만 검사하고 에러 반환·경계값을 빼먹는 게 가장 흔한 구멍이다. 표에 err 케이스를 반드시 넣는다. (4) 이름 규칙 위반 — 대문자 Test 로 시작하지 않으면 조용히 스킵된다. 아래 표는 mock 을 주입해 에러 케이스까지 덮은 최종 형태다.',
        legend: '에러 케이스 포함 · mock 주입',
        cases: [
          { name: 'ok/found', input: 'id=1', want: 'user', got: 'user', pass: true },
          { name: 'err/notfound', input: 'id=99', want: 'ErrNotFound', got: 'ErrNotFound', pass: true },
          { name: 'err/db_down', input: 'mock: fail', want: 'ErrDB', got: 'ErrDB', pass: true },
        ],
        runLabel: 'go test -race ./...',
        alert: { tone: 'good', text: '인터페이스로 의존을 받으면 테스트는 mock 을, 운영은 진짜 구현을 주입한다. -race 플래그로 공유 상태 버그까지 잡는다.' },
        code: {
          lang: 'go', filename: 'service_test.go',
          lines: [
            '// 의존을 인터페이스로 받으면 mock 주입이 쉽다',
            'type UserRepo interface {',
            '    Find(id int) (*User, error)',
            '}',
            '',
            'type mockRepo struct{ fail bool }',
            '',
            'func (m mockRepo) Find(id int) (*User, error) {',
            '    if m.fail { return nil, ErrDB }',
            '    if id != 1 { return nil, ErrNotFound }',
            '    return &User{ID: 1, Name: "Alice"}, nil',
            '}',
            '',
            'func TestGetUser(t *testing.T) {',
            '    tests := []struct {',
            '        name    string',
            '        id      int',
            '        fail    bool',
            '        wantErr error',
            '    }{',
            '        {"found", 1, false, nil},',
            '        {"notfound", 99, false, ErrNotFound}, // 에러 케이스',
            '        {"db_down", 1, true, ErrDB},          // 의존 실패',
            '    }',
            '    for _, tc := range tests {',
            '        t.Run(tc.name, func(t *testing.T) {',
            '            svc := NewService(mockRepo{fail: tc.fail})',
            '            _, err := svc.GetUser(tc.id)',
            '            if err != tc.wantErr {',
            '                t.Errorf("err=%v want %v", err, tc.wantErr)',
            '            }',
            '        })',
            '    }',
            '}',
          ],
          highlight: [2, 3, 6, 8, 9, 10, 21, 22, 26, 27, 28],
        },
      },
    ];

    function CoverageGauge({ pct }) {
      if (pct == null) return null;
      return (
        <div className="mt-3 rounded-lg p-3 bg-white" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between text-xs mb-1">
            <span className="font-bold" style={{color:'#0a5a6a'}}>coverage</span>
            <span className="font-mono" style={{color:BRAND}}>{pct}.0%</span>
          </div>
          <div className="h-3 rounded-full bg-slate-200 overflow-hidden">
            <div className="h-full rounded-full transition-all" style={{width:`${pct}%`, background:BRAND}} />
          </div>
          <div className="text-[10px] text-slate-500 mt-1">go tool cover -html 로 안 덮인 줄 확인</div>
        </div>
      );
    }

    // 테스트 케이스 컨베이어 — 케이스가 루프를 돌며 pass/fail 도장을 받는다
    function CaseConveyor({ cases, active, legend, runLabel, lifecycle }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🧪</span>
            <span className="font-mono">{runLabel}</span>
            <span className="ml-auto text-[10px] font-normal opacity-90">{legend}</span>
          </div>
          <div className="p-3 space-y-2">
            {cases.map((c, i) => {
              const isActive = i === active;
              const isPhase = c.phase === 'setup' || c.phase === 'teardown';
              const rowBg = isPhase ? '#eef2ff' : (c.pass ? '#dbf3e6' : '#fee2e2');
              return (
                <div key={i} className="rounded-lg p-2 transition-all"
                  style={{
                    background: rowBg,
                    outline: isActive ? `2px solid ${BRAND}` : '2px solid transparent',
                    transform: isActive ? 'translateX(6px)' : 'none',
                    opacity: active >= 0 && i > active && !lifecycle ? 0.45 : 1,
                  }}>
                  <div className="flex items-center gap-2 text-xs">
                    <span className="w-4 text-center">{isActive ? '▶' : ' '}</span>
                    <span className="font-mono font-bold w-28 truncate" style={{color:'#0a5a6a'}}>{c.name}</span>
                    <span className="font-mono px-2 py-0.5 rounded bg-white/70 text-[10px] text-slate-600">{c.input}</span>
                    <span className="ml-auto text-[10px] font-bold px-2 py-0.5 rounded"
                      style={isPhase
                        ? {background:'#6366f1', color:'#fff'}
                        : (c.pass ? {background:'#16a34a', color:'#fff'} : {background:'#dc2626', color:'#fff'})}>
                      {isPhase ? c.phase.toUpperCase() : (c.pass ? 'PASS' : 'FAIL')}
                    </span>
                  </div>
                  {!c.pass && (
                    <div className="mt-1.5 ml-6 flex items-center gap-2 text-[10px] font-mono">
                      <span className="px-2 py-0.5 rounded" style={{background:'#dcfce7', color:'#166534'}}>want: {c.want}</span>
                      <span className="text-slate-400">vs</span>
                      <span className="px-2 py-0.5 rounded" style={{background:'#fecaca', color:'#991b1b'}}>got: {c.got}</span>
                      <span className="text-red-600">← 불일치</span>
                    </div>
                  )}
                  {c.parallel && (
                    <div className="mt-1 ml-6 text-[10px] text-slate-500">⇉ t.Parallel() — 동시 실행</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#e6f7fb', bd:'#9bdaea', tx:'#0a5a6a', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      // 활성 케이스를 순환시켜 "루프가 표를 도는" 느낌을 준다
      const [active, setActive] = useState(0);
      useEffect(() => {
        setActive(0);
        const total = state.cases.length;
        const t = setInterval(() => {
          setActive((i) => (i + 1) % total);
        }, 900);
        return () => clearInterval(t);
      }, [state]);
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#0a5a6a'}}>테스트 검사 라인</h3>
            <span className="text-[10px] text-slate-500">케이스가 루프를 돌며 판정</span>
          </div>
          <CaseConveyor cases={state.cases} active={active} legend={state.legend} runLabel={state.runLabel} lifecycle={state.lifecycle} />
          <CoverageGauge pct={state.coverage} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(0,173,216,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#e6f7fb 0%,#cdeef6 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Go</span>
              <div>
                <div className="text-[11px] font-bold mb-0.5" style={{color:'#00ADD8'}}>Part IV. 패키지 &amp; 도구 · IV-1-2</div>
                <h1 className="text-2xl font-bold" style={{color:'#0a5a6a'}}>go test — table-driven</h1>
                <p className="text-sm" style={{color:'#00ADD8'}}>표준 testing 패키지와 테이블 주도 테스트, Go 다운 테스트 문화</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#9bdaea'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#00ADD8aa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#0a5a6a'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Go 테스트는 표준 testing + go test 만으로 완결된다. 케이스를 표(슬라이스)로 모아 루프로 돌리고, t.Run 으로 서브테스트를 갈라 실패 지점을 이름으로 보며, t.Parallel 로 빠르게, -cover 로 빠진 경로를 찾는다. 함정은 늘 같다 — 상태 공유, 진짜 외부 의존, 에러 케이스 누락, 이름 규칙 위반. 의존을 인터페이스로 받아 mock 을 주입하면 이 넷을 한 번에 막는다. 다음 장에서는 Part V — 웹 서버와 API 로 넘어간다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['go-test', 'table-driven', 't.Run', 't.Parallel', 'coverage', 'TestMain', 'mock', 'testify'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#e6f7fb', color:'#0a5a6a', border:'1px solid #9bdaea'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
