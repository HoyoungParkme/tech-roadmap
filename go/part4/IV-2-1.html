    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();

    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }

  <!--
    Go IV-2-1 — 벤치마크 (go test -bench)
    추측 대신 측정. 두 구현(문자열 += vs strings.Builder, slice preallocate 유무)을
    벤치마크해서 ns/op · allocs/op 를 막대로 대비한다.
    6단계: 벤치 작성 → 실행/결과읽기 → 할당 최적화 → 함정(죽은 코드) → benchstat 비교 → 실무 감각
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#00ADD8';

    // 벤치 대비 막대 — slow(느린 구현) vs fast(빠른 구현)
    const STEPS = [
      {
        title: 'Step 1. 벤치마크 함수를 쓴다 — 측정의 시작',
        desc: '성능은 눈으로 보는 게 아니라 숫자로 본다. Go 는 testing 패키지에 벤치마크를 내장한다. 함수 이름을 BenchmarkXxx 로 짓고 인자로 b testing.B 를 받으면 된다. 핵심은 for i := 0; i less b.N; i++ 루프 — b.N 은 Go 가 결과가 안정될 때까지 자동으로 늘려주는 반복 횟수다. 우리가 직접 반복 수를 정하지 않는다.',
        bars: null,
        note: { tone: 'info', text: 'BenchmarkXxx(b *testing.B) + for i := 0; i < b.N; i++ 가 벤치의 뼈대다. b.N 은 프레임워크가 자동으로 조정한다.' },
        code: {
          lang: 'go', filename: 'concat_test.go',
          lines: [
            '// 두 구현을 각각 벤치마크한다',
            'package strutil',
            '',
            'import (',
            '    "strings"',
            '    "testing"',
            ')',
            '',
            '// 느린 구현: 문자열 += (매 반복마다 새 문자열 할당)',
            'func BenchmarkConcatPlus(b *testing.B) {',
            '    for i := 0; i < b.N; i++ {',
            '        s := ""',
            '        for j := 0; j < 100; j++ {',
            '            s += "x"',
            '        }',
            '        _ = s',
            '    }',
            '}',
            '',
            '// 빠른 구현: strings.Builder (내부 버퍼 재사용)',
            'func BenchmarkConcatBuilder(b *testing.B) {',
            '    for i := 0; i < b.N; i++ {',
            '        var sb strings.Builder',
            '        for j := 0; j < 100; j++ {',
            '            sb.WriteString("x")',
            '        }',
            '        _ = sb.String()',
            '    }',
            '}',
          ],
          highlight: [9, 10, 11, 12, 13, 14, 15, 16, 17, 20, 21, 22, 23, 24, 25, 26, 27],
        },
      },
      {
        title: 'Step 2. 실행하고 결과를 읽는다 — ns/op·B/op·allocs/op',
        desc: 'go test -bench=. -benchmem 으로 돌린다. -bench 는 정규식으로 실행할 벤치를 고르고(=. 는 전부), -benchmem 은 메모리 통계를 켠다. 결과의 세 숫자가 전부다: ns/op(연산 1회당 나노초, 낮을수록 빠름), B/op(1회당 할당 바이트), allocs/op(1회당 힙 할당 횟수). += 구현은 반복마다 새 문자열을 만들어 allocs 가 폭발한다.',
        bars: { title: 'ns/op — 연산 1회당 나노초 (낮을수록 빠름)', unit: 'ns/op',
          slow: { label: 'ConcatPlus (+=)', value: 1820 }, fast: { label: 'ConcatBuilder', value: 210 } },
        note: { tone: 'warn', text: 'ns/op 만 보지 말고 allocs/op 를 함께 봐라. 할당이 많으면 GC 압력이 커져 실서버에서 더 느려진다.' },
        code: {
          lang: 'bash', filename: 'run.sh',
          lines: [
            '# 현재 패키지의 모든 벤치를 메모리 통계와 함께 실행',
            'go test -bench=. -benchmem',
            '',
            '# 특정 벤치만: 이름 정규식으로 필터',
            'go test -bench=Builder -benchmem',
            '',
            '# 결과 (goos/goarch/cpu 헤더 생략)',
            '# BenchmarkConcatPlus-8      658214   1820 ns/op   2600 B/op   99 allocs/op',
            '# BenchmarkConcatBuilder-8  5721030    210 ns/op    248 B/op    5 allocs/op',
            '#                    ^        ^         ^            ^           ^',
            '#                 GOMAXPROCS  b.N 반복  1회당 시간   1회당 바이트  1회당 할당수',
            '',
            '# => Builder 가 약 8.6배 빠르고, 할당은 99 -> 5 로 급감',
            '# => += 는 매 반복마다 새 문자열을 만들어 allocs/op 가 폭발',
          ],
          highlight: [1, 2, 7, 8, 9, 13, 14],
        },
      },
      {
        title: 'Step 3. 할당을 줄인다 — preallocate + ResetTimer',
        desc: '가장 흔한 최적화는 힙 할당 줄이기다. slice 를 make(T, 0, n) 으로 용량을 미리 잡으면(preallocate) append 가 중간에 재할당·복사하지 않는다. 준비 비용(파일 읽기, 큰 입력 생성)이 있으면 b.ResetTimer() 로 타이머를 리셋해 그 비용을 측정에서 뺀다. b.ReportAllocs() 는 -benchmem 없이도 그 벤치의 할당 통계를 강제로 켠다.',
        bars: { title: 'allocs/op — 연산 1회당 힙 할당 횟수 (낮을수록 좋음)', unit: 'allocs/op',
          slow: { label: 'append (cap 0)', value: 14 }, fast: { label: 'preallocate', value: 1 } },
        note: { tone: 'good', text: 'preallocate 는 재할당·복사를 없애 allocs/op 를 1로 만든다. 준비 비용은 b.ResetTimer() 로 측정에서 제외한다.' },
        code: {
          lang: 'go', filename: 'build_test.go',
          lines: [
            'func BenchmarkBuildNoCap(b *testing.B) {',
            '    b.ReportAllocs()                 // 이 벤치의 할당 통계 강제 ON',
            '    for i := 0; i < b.N; i++ {',
            '        var out []int                // 용량 0 -> append 가 재할당 반복',
            '        for j := 0; j < 1000; j++ {',
            '            out = append(out, j)',
            '        }',
            '        _ = out',
            '    }',
            '}',
            '',
            'func BenchmarkBuildPrealloc(b *testing.B) {',
            '    b.ReportAllocs()',
            '    for i := 0; i < b.N; i++ {',
            '        out := make([]int, 0, 1000)  // 용량 미리 확보 = 재할당 0',
            '        for j := 0; j < 1000; j++ {',
            '            out = append(out, j)',
            '        }',
            '        _ = out',
            '    }',
            '}',
            '',
            '// 준비 비용이 클 때: 타이머 리셋',
            'func BenchmarkParse(b *testing.B) {',
            '    data := makeBigInput()          // 무거운 준비 (측정 제외 대상)',
            '    b.ResetTimer()                  // 여기서부터 시간 측정',
            '    for i := 0; i < b.N; i++ {',
            '        parse(data)',
            '    }',
            '}',
          ],
          highlight: [1, 2, 3, 4, 5, 6, 12, 13, 14, 15, 16, 17, 23, 24, 25, 26, 27, 28],
        },
      },
      {
        title: 'Step 4. 함정 — 컴파일러가 죽은 코드를 지운다',
        desc: '가장 자주 속는 함정이다. 벤치 안에서 계산만 하고 결과를 쓰지 않으면, 컴파일러가 그 계산을 통째로 제거(dead code elimination)해서 "0 ns/op" 같은 거짓 결과가 나온다. 막으려면 결과를 패키지 레벨 변수에 대입한다. 표준 관용구는 sink 변수에 담아 컴파일러가 지우지 못하게 하는 것이다. 결과를 반드시 사용하라.',
        bars: { title: 'ns/op — 함정 vs 올바른 측정', unit: 'ns/op',
          slow: { label: '거짓 (죽은 코드)', value: 0.3 }, fast: { label: '진짜 측정', value: 47 } },
        note: { tone: 'danger', text: '결과를 쓰지 않으면 컴파일러가 계산을 지운다. 0 ns/op·비현실적으로 빠른 값이 나오면 죽은 코드 제거를 의심하라.' },
        code: {
          lang: 'go', filename: 'sink_test.go',
          lines: [
            '// 나쁜 예: 결과를 안 쓴다 -> 컴파일러가 hash() 를 제거할 수 있다',
            'func BenchmarkHashBad(b *testing.B) {',
            '    for i := 0; i < b.N; i++ {',
            '        hash("hello")               // 반환값 버림 = 죽은 코드',
            '    }',
            '}',
            '',
            '// 좋은 예: 결과를 패키지 변수(sink)에 대입해 살려둔다',
            'var sink uint64',
            '',
            'func BenchmarkHashGood(b *testing.B) {',
            '    var h uint64',
            '    for i := 0; i < b.N; i++ {',
            '        h = hash("hello")           // 결과를 지역 변수에',
            '    }',
            '    sink = h                        // 루프 밖에서 패키지 변수로 방출',
            '}',
            '',
            '// 규칙: 벤치 대상의 결과는 반드시 어딘가에 "사용" 되어야 한다',
            '// 증상: 0.3 ns/op 처럼 비현실적으로 빠르면 죽은 코드 제거를 의심',
          ],
          highlight: [1, 2, 3, 4, 5, 6, 8, 9, 11, 12, 13, 14, 15, 16, 17],
        },
      },
      {
        title: 'Step 5. 비교는 benchstat 으로 — 노이즈를 걷어낸다',
        desc: '벤치 한 번의 숫자는 흔들린다(CPU 스로틀, 백그라운드 프로세스). -count=10 으로 여러 번 돌려 파일로 저장하고, golang.org/x/perf/cmd/benchstat 으로 통계 비교한다. benchstat 은 평균과 함께 흔들림(±%)과 유의미성(p-value)을 보여줘 "진짜 빨라졌는지"를 판단하게 한다. before/after 두 파일을 주면 delta(%)를 계산해준다.',
        bars: { title: 'ns/op — before vs after (benchstat delta)', unit: 'ns/op',
          slow: { label: 'before', value: 1820 }, fast: { label: 'after (-88%)', value: 210 } },
        note: { tone: 'good', text: '한 번의 숫자를 믿지 마라. -count=10 + benchstat 으로 흔들림과 p-value 까지 봐야 "실제 개선"을 말할 수 있다.' },
        code: {
          lang: 'bash', filename: 'compare.sh',
          lines: [
            '# 1) benchstat 설치 (한 번만)',
            'go install golang.org/x/perf/cmd/benchstat@latest',
            '',
            '# 2) 개선 전/후를 각각 10회 반복해 파일로 저장',
            'git stash                                  # 최적화 전 코드',
            'go test -bench=Concat -count=10 > old.txt',
            'git stash pop                              # 최적화 후 코드',
            'go test -bench=Concat -count=10 > new.txt',
            '',
            '# 3) 통계 비교',
            'benchstat old.txt new.txt',
            '',
            '# 출력 예시',
            '# name          old time/op   new time/op   delta',
            '# Concat-8       1.82us +-2%   0.21us +-1%   -88.5%  (p=0.000 n=10)',
            '#                                            ^^^^^^   ^^^^^^^^^^^^',
            '#                                            개선폭   통계적으로 유의',
          ],
          highlight: [1, 2, 5, 6, 7, 8, 11, 14, 15, 16, 17],
        },
      },
      {
        title: 'Step 6. 실무 감각 — 측정하고, 한계를 알고, 다음은 pprof',
        desc: '규칙 하나: 병목은 추측하지 말고 측정 후에 고쳐라. 마이크로 벤치(작은 함수 하나)는 빠르고 명확하지만 한계가 있다 — 캐시 상태, 실제 입력 분포, 동시성 부하를 반영하지 못한다. 그래서 최종 판단은 실제 워크로드에 가까운 벤치나 프로파일로 한다. 벤치가 "어느 함수가 느린가"를 좁혀주면, 다음 단계 pprof 가 "그 안에서 어디가 느린가"를 보여준다.',
        bars: null,
        wins: [
          '측정 먼저 — 추측으로 최적화하면 엉뚱한 곳을 고친다',
          'ns/op + B/op + allocs/op 세 숫자를 함께 본다',
          'preallocate·Builder 로 할당을 줄이면 GC 압력이 준다',
          '죽은 코드 함정 — 결과를 sink 로 반드시 사용',
          '-count=10 + benchstat 으로 노이즈·유의성 검증',
          '마이크로 벤치의 한계 -> 실제 워크로드·pprof 로 확인',
        ],
        note: { tone: 'info', text: '벤치는 "어느 함수가 느린가"를 좁힌다. "그 함수 안 어디가 느린가"는 다음 주제 pprof 로 이어진다.' },
        code: {
          lang: 'go', filename: 'workflow.go',
          lines: [
            '// 실무 성능 개선 루프',
            '',
            '// 1) 측정 — 추측 금지, 벤치로 병목 후보를 찾는다',
            '//    go test -bench=. -benchmem -count=10 > base.txt',
            '',
            '// 2) 한 가지만 바꾼다 (Builder / preallocate / sync.Pool ...)',
            '//    한 번에 여러 개 바꾸면 무엇이 효과였는지 모른다',
            '',
            '// 3) 다시 측정 + benchstat 으로 통계 비교',
            '//    개선이 p<0.05 로 유의한지 확인',
            '',
            '// 4) 마이크로 벤치의 한계를 기억한다',
            '//    - 실제 입력 분포/크기와 다를 수 있다',
            '//    - 캐시가 데워진 이상적 상황일 수 있다',
            '//    - 동시성·GC 부하가 빠져 있을 수 있다',
            '',
            '// 5) 함수 내부의 병목은 pprof 로 (다음 주제)',
            '//    go test -bench=. -cpuprofile=cpu.out',
            '//    go tool pprof cpu.out',
          ],
          highlight: [2, 3, 5, 6, 8, 9, 11, 12, 13, 14, 16, 17, 18],
        },
      },
    ];

    function BenchBars({ bars }) {
      if (!bars) return null;
      const max = Math.max(bars.slow.value, bars.fast.value) || 1;
      const rows = [
        { ...bars.slow, tone: '#ef4444', tag: '느림' },
        { ...bars.fast, tone: '#10b981', tag: '빠름' },
      ];
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>📊</span>
            <span>{bars.title}</span>
          </div>
          <div className="p-3 space-y-3">
            {rows.map((r, i) => (
              <div key={i}>
                <div className="flex items-center justify-between text-[11px] mb-1">
                  <span className="font-bold" style={{color:'#0a5a6a'}}>{r.label}</span>
                  <span className="font-mono px-2 py-0.5 rounded text-white text-[10px]" style={{background:r.tone}}>{r.value} {bars.unit}</span>
                </div>
                <div className="h-5 rounded bg-slate-100 overflow-hidden">
                  <div className="h-full rounded flex items-center justify-end pr-2 text-[9px] font-bold text-white transition-all duration-500"
                    style={{width:`${Math.max(6, (r.value / max) * 100)}%`, background:r.tone}}>
                    {r.tag}
                  </div>
                </div>
              </div>
            ))}
            <div className="text-[10px] text-slate-500 pt-1 border-t border-slate-100">
              막대가 짧을수록 좋다 — 초록(빠름)이 목표, 빨강(느림)은 개선 대상.
            </div>
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#e6f7fb'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🐹</span>
            <span className="text-lg font-bold" style={{color:'#0a5a6a'}}>벤치마크 실무 체크리스트</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#0a5a6a'}}>
                <span style={{color:BRAND}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#e6f7fb', bd:'#9bdaea', tx:'#0a5a6a', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#0a5a6a'}}>측정 결과 — 두 구현 대비</h3>
            <span className="text-[10px] text-slate-500">낮을수록 빠름/좋음</span>
          </div>
          {state.bars ? <BenchBars bars={state.bars} /> : <WinsBox wins={state.wins} />}
          {state.bars && state.wins ? <WinsBox wins={state.wins} /> : null}
          <AlertBox alert={state.note} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(0,173,216,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#e6f7fb 0%,#cdeef6 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Go</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:'#0a5a6a'}}>Part IV. 패키지 &amp; 도구</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full" style={{background:'#e6f7fb', color:'#0a5a6a', border:'1px solid #9bdaea'}}>IV-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#0a5a6a'}}>벤치마크 — go test -bench</h1>
                <p className="text-sm" style={{color:'#00ADD8'}}>추측 대신 측정, 표준 도구로 성능을 숫자로 본다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#9bdaea'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#00ADD8aa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#0a5a6a'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                벤치마크는 "추측 대신 측정"의 표준 도구다. BenchmarkXxx + b.N 으로 재고, go test -bench=. -benchmem 의 ns/op·B/op·allocs/op 세 숫자를 함께 읽는다. 할당을 줄이고(preallocate·Builder), 죽은 코드 함정을 피하고(sink), benchstat 으로 노이즈를 걷어낸다. 마이크로 벤치가 "어느 함수"를 좁히면, 다음 주제 pprof 가 "그 안 어디"를 보여준다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['벤치마크', 'go test -bench', 'ns/op', 'allocs/op', 'benchmem', 'benchstat', 'preallocate', '측정우선'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#e6f7fb', color:'#0a5a6a', border:'1px solid #9bdaea'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
