  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

            '',
            '    // SIGTERM / SIGINT 를 채널로 대기',
            '    stop := make(chan os.Signal, 1)',
            '    signal.Notify(stop, syscall.SIGTERM, syscall.SIGINT)',
            '    <-stop                            // => 신호 올 때까지 블록',
            '',
            '    // 최대 25초 동안 진행 중 요청 마무리',
            '    ctx, cancel := context.WithTimeout(context.Background(), 25*time.Second)',
            '    defer cancel()',
            '    if err := srv.Shutdown(ctx); err != nil {',
            '        log.Error("forced shutdown", "err", err)',
            '    }',
            '    // => 진행 중 요청 완료 후 종료 (유실 0건)',
            '}',
          ],
          highlight: [12, 13, 14, 16, 17, 18, 19, 21, 22, 23, 24, 25, 26],
        },
      },
      {
        title: 'Step 6. 분산 추적 & 함정 총정리',
        desc: '마이크로서비스에서는 한 요청이 여러 서비스를 거친다. OpenTelemetry 는 각 구간(span)에 trace_id 를 이어붙여 "이 요청이 gateway → order → payment 중 payment 에서 300ms 걸렸다"를 한 화면(Jaeger)에서 보여준다. 세 기둥(로그·메트릭·추적)을 trace_id 로 연결하면 장애 원인을 분 단위가 아니라 초 단위로 찾는다. 마지막으로 현장 4대 함정을 다시 못박는다 — 민감정보 로깅, 카디널리티 폭발, readiness 없는 배포, shutdown 미처리. 이 넷만 피해도 프로덕션에서 살아남는다.',
        pillars: [],
        traps: [
          '민감정보 로깅 — password·token 을 필드에 넣으면 수집기에 영구 유출',
          '카디널리티 폭발 — 라벨에 user_id·전체 URL 넣으면 시계열 수백만 개로 터짐',
          'readiness 없는 배포 — 준비 안 된 파드로 트래픽 흘러 요청 실패',
          'shutdown 미처리 — 배포마다 진행 중 요청 유실, 사용자는 500',
        ],
        alert: { tone: 'good', text: '로그·메트릭·추적을 trace_id 로 엮으면 관측성이 완성된다. Jaeger·Grafana·Loki 로 세 기둥을 한 화면에서 상관분석.' },
        code: {
          lang: 'go',
          filename: 'tracing.go',
          lines: [
            'package main',
            '',
            'import (',
            '    "context"',
            '    "go.opentelemetry.io/otel"',
            ')',
            '',
            '// 각 함수가 span 을 열어 trace_id 로 이어진다',
            'func handleOrder(ctx context.Context) {',
            '    tracer := otel.Tracer("order-service")',
            '    ctx, span := tracer.Start(ctx, "handleOrder")',
            '    defer span.End()',
            '',
            '    charge(ctx)   // 같은 trace_id 를 물고 내려간다',
            '}',
            '',
            'func charge(ctx context.Context) {',
            '    tracer := otel.Tracer("payment-service")',
            '    _, span := tracer.Start(ctx, "charge")',
            '    defer span.End()',
            '    // => Jaeger: handleOrder → charge (300ms) 한눈에',
            '}',
            '',
            '// 현장 4대 함정 (다시 못박기)',
            '//  1) 민감정보 로깅 금지',
            '//  2) 라벨 카디널리티 폭발 금지',
            '//  3) readiness 없이 배포 금지',
            '//  4) graceful shutdown 미처리 금지',
          ],
          highlight: [8, 9, 10, 11, 12, 14, 17, 18, 19, 20, 21, 24, 25, 26, 27, 28],
        },
      },
    ];

    const ALERT_STYLE = {
      info:   { bg:'#e6f7fb', bd:'#9bdaea', tx:'#0a5a6a', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function PillarBox({ pillars }) {
      if (!pillars || pillars.length === 0) return null;
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🏥</span>
            <span>관측 가능성 — 관제 화면</span>
          </div>
          <div className="p-3 space-y-2">
            {pillars.map((p, i) => (
              <div key={i} className="rounded p-2" style={{background:p.color}}>
                <div className="flex items-center gap-2 text-xs">
                  <span className="font-bold" style={{color:'#0a5a6a'}}>{p.name}</span>
                  <span className="font-mono px-2 py-0.5 rounded bg-white/70 text-[10px]" style={{color:'#0a5a6a'}}>{p.q}</span>
                </div>
                <div className="text-[10px] mt-1 text-slate-600 pl-1">{p.tool}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LogStream({ logs }) {
      if (!logs) return null;
      const tone = { INFO:'#166534', WARN:'#92400e', ERROR:'#991b1b' };
      const tbg = { INFO:'#dbf3e6', WARN:'#fef3c7', ERROR:'#fee2e2' };
      return (
        <div className="mt-3 rounded-lg overflow-hidden" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1 text-[10px] font-bold text-white" style={{background:'#0a5a6a'}}>구조적 로그 스트림 (JSON)</div>
          <div className="bg-slate-900 p-2 space-y-1 font-mono text-[10px]">
            {logs.map((l, i) => (
              <div key={i} className="flex gap-2 items-start">
                <span className="px-1.5 rounded font-bold shrink-0" style={{background:tbg[l.level], color:tone[l.level]}}>{l.level}</span>
                <span className="text-slate-200">{l.msg} <span className="text-slate-400">{l.fields}</span></span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function MetricBoard({ metrics }) {
      if (!metrics) return null;
      const badge = { counter:'#00ADD8', gauge:'#8b5cf6', histogram:'#f59e0b' };
      return (
        <div className="mt-3 rounded-lg p-3" style={{border:`2px solid ${BRAND}`, background:'#e6f7fb'}}>
          <div className="text-xs font-bold mb-2" style={{color:'#0a5a6a'}}>📊 /metrics 노출 값</div>
          <div className="space-y-1.5">
            {metrics.map((m, i) => (
              <div key={i} className="flex items-center gap-2 text-xs bg-white rounded px-2 py-1">
                <span className="text-[9px] px-1.5 py-0.5 rounded text-white font-bold" style={{background:badge[m.type]}}>{m.type}</span>
                <span className="font-mono text-[10px] flex-1" style={{color:'#0a5a6a'}}>{m.name}</span>
                <span className="font-bold" style={{color:BRAND}}>{m.val}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function HealthBoard({ health }) {
      if (!health) return null;
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          {health.map((h, i) => (
            <div key={i} className="rounded-lg p-2 bg-white" style={{border:`2px solid ${h.status==='ok'?'#86efac':'#fecaca'}`}}>
              <div className="flex items-center gap-1.5">
                <span>{h.status==='ok' ? '🟢' : '🔴'}</span>
                <span className="font-mono text-xs font-bold" style={{color:'#0a5a6a'}}>{h.path}</span>
              </div>
              <div className="text-[10px] mt-1 text-slate-500">{h.label}</div>
              <div className="text-[10px] text-slate-600">{h.note}</div>
            </div>
          ))}
        </div>
      );
    }

    function ShutdownFlow({ shutdown }) {
      if (!shutdown) return null;
      return (
        <div className="mt-3 rounded-lg p-3 bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="text-xs font-bold mb-2" style={{color:'#0a5a6a'}}>🔻 Graceful Shutdown 순서</div>
          <div className="space-y-1.5">
            {shutdown.map((s, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold text-white" style={{background:BRAND}}>{i+1}</span>
                <span className="flex-1" style={{color:'#0a5a6a'}}>{s.phase}</span>
                <span>{s.done ? '✅' : '⏳'}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TrapsBox({ traps }) {
      if (!traps) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:'2px solid #fecaca', background:'#fef2f2'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🚨</span>
            <span className="text-lg font-bold" style={{color:'#991b1b'}}>현장 4대 함정</span>
          </div>
          <ul className="space-y-1.5">
            {traps.map((t, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#991b1b'}}>
                <span>✗</span>
                <span>{t}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col overflow-auto" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#0a5a6a'}}>운영 관제 — 관측 가능성의 세 기둥</h3>
            <span className="text-[10px] text-slate-500">logs · metrics · health</span>
          </div>
          <PillarBox pillars={state.pillars} />
          <LogStream logs={state.logs} />
          <MetricBoard metrics={state.metrics} />
          <HealthBoard health={state.health} />
          <ShutdownFlow shutdown={state.shutdown} />
          <TrapsBox traps={state.traps} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(0,173,216,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#e6f7fb 0%,#cdeef6 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Go</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:'#0a5a6a'}}>Part V. 실전</span>
                  <span className="text-[10px] font-mono text-slate-500">V-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#0a5a6a'}}>운영 — 로깅 / 메트릭 / 헬스체크</h1>
                <p className="text-sm" style={{color:'#00ADD8'}}>프로덕션에서 살아남는 서비스, 관측 가능성의 세 기둥</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#9bdaea'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#00ADD8aa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#0a5a6a'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                관측 가능성은 로그(slog 구조적 JSON) · 메트릭(Prometheus RED/USE) · 추적(OpenTelemetry) 세 기둥으로 완성된다. liveness/readiness 를 구분하고 graceful shutdown 으로 요청 유실을 막으면 무중단 배포가 가능하다. 4대 함정(민감정보 로깅 · 카디널리티 폭발 · readiness 없는 배포 · shutdown 미처리)만 피해도 프로덕션에서 살아남는다. 다음에는 성능·부하 관점의 운영을 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['관측가능성', 'slog', 'Prometheus', 'healthz', 'readyz', 'graceful-shutdown', 'OpenTelemetry', 'RED지표'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#e6f7fb', color:'#0a5a6a', border:'1px solid #9bdaea'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
