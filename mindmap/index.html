<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기술 로드맵 지도 · 개발자 학습 노트</title>
  <meta name="description" content="요청 하나가 컴퓨터 안에서 지나가는 길을 그리고, 그 길의 각 지점에서 쓰는 기술 67개를 붙인 지도">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📓</text></svg>" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../anim/platform.css">
  <style>
    /* 화면: 위 머리(pf-nav) + 흐름 고르기 + 기초 노트 줄 + 남은 높이를 다 쓰는 지도 */
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; background: var(--pf-bg); color: var(--pf-ink); font-family: var(--pf-sans); }
    .mm-bar { padding: 10px 24px 0; display: flex; flex-direction: column; gap: 8px; }
    .mm-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .mm-title h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
    .mm-title p { margin: 0; font-size: 14px; color: var(--pf-ink2); }
    .mm-row { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
    .mm-row .lbl { font-size: 12.5px; color: var(--pf-ink3); white-space: nowrap; margin-right: 2px; }
    .fb { font: inherit; font-size: 13px; white-space: nowrap; border: 1px solid var(--pf-line2); background: var(--pf-surface); color: var(--pf-ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
    .fb i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--pf-ink3); }
    .fb.on { background: #e0473c; border-color: #e0473c; color: #fff; }
    .fb.on i { color: #fff; }
    #notes a { font-size: 12.5px; white-space: nowrap; color: var(--pf-ink2); text-decoration: none; border: 1px dashed var(--pf-line2); border-radius: 8px; padding: 3px 9px; background: var(--pf-surface); }
    #notes a:hover, #notes a.on { border-style: solid; border-color: #e0473c; color: #e0473c; }
    .fb:focus-visible, .zb:focus-visible, #notes a:focus-visible, .node:focus-visible { outline: 3px solid var(--pf-brand); outline-offset: 2px; }
    .mapbox { position: relative; flex: 1; min-height: 420px; margin: 10px 24px 16px; border: 1px solid var(--pf-line); border-radius: 14px; overflow: hidden;
      background-color: #fbfaf4; background-image: linear-gradient(#e9e6d8 1px, transparent 1px), linear-gradient(90deg, #e9e6d8 1px, transparent 1px); background-size: 22px 22px; }
    #map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #map.drag { cursor: grabbing; }
    .zoom { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
    .zb { font: inherit; font-size: 14px; font-weight: 700; width: 34px; height: 34px; border-radius: 8px; border: 2px solid #2b2b2b; background: #fff; color: #2b2b2b; cursor: pointer; box-shadow: 2px 2px 0 #2b2b2b; }
    .zb.w { width: auto; padding: 0 10px; font-size: 13px; }
    .legend { position: absolute; left: 12px; top: 12px; font-size: 12px; color: var(--pf-ink2); background: rgba(255,255,255,.9); border: 1px solid var(--pf-line); border-radius: 8px; padding: 6px 9px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 370px); }
    .legend .sw { display: inline-block; width: 18px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; background: #fde68a; border-bottom: 2px solid #7c4a03; }
    .info[hidden] { display: none; }
    .info { position: absolute; right: 12px; top: 12px; width: min(330px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto; background: #fff; border: 2px solid #2b2b2b; border-radius: 12px; box-shadow: 3px 3px 0 #2b2b2b; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }
    .info h3 { margin: 0; font-size: 17px; padding-right: 20px; }
    .info p { margin: 0; color: var(--pf-ink2); line-height: 1.55; }
    .info .chips { display: flex; flex-direction: column; gap: 5px; }
    .info .chips a { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; background: #fde68a; color: #7c4a03; border-bottom: 2px solid #7c4a03; border-radius: 4px; padding: 3px 8px; text-decoration: none; }
    .info .chips small { font-weight: 500; color: #7c4a03; opacity: .8; white-space: nowrap; }
    .info .terms { display: flex; flex-wrap: wrap; gap: 5px; }
    .info .t { font-size: 12px; color: var(--pf-ink3); border: 1px solid var(--pf-line); border-radius: 4px; padding: 0 6px; }
    .info .fl { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--pf-ink3); }
    .info .fl button { font: inherit; font-size: 12px; border: 1px solid var(--pf-line2); background: var(--pf-surface); border-radius: 999px; padding: 2px 9px; cursor: pointer; color: var(--pf-ink); }
    .info .x { position: absolute; right: 8px; top: 4px; background: none; border: 0; font-size: 20px; color: var(--pf-ink3); cursor: pointer; }
    /* 지도 안 글자 */
    .nm { font: 800 17px var(--pf-sans); fill: #24231f; }
    .cp { font: 700 13.5px var(--pf-sans); fill: #7c4a03; }
    .cpb { fill: #fde68a; } .cpu { stroke: #7c4a03; stroke-width: 1.6; }
    .tm { font: 500 12.5px var(--pf-sans); fill: #8c887c; }
    .lsn { font: 800 10px var(--pf-sans); fill: #0f766e; }
    .al { font: 400 21px var(--pf-hand); fill: #24231f; paint-order: stroke; stroke: #fbfaf4; stroke-width: 5px; stroke-linejoin: round; }
    .rl { font: 400 28px var(--pf-hand); fill: #5d5a51; }
    .ic { fill: #fff; stroke: #2b2b2b; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .ic .f { fill: #2b2b2b; } .ic .a { fill: #e0473c; stroke: none; }
    .ar { fill: none; stroke: #2b2b2b; stroke-width: 2; opacity: .75; }
    .ar.map { stroke: #e0473c; stroke-dasharray: 7 6; opacity: .85; }
    .node { cursor: pointer; outline: none; }
    .node:hover .nm { fill: #e0473c; }
    svg a:hover .cpb { fill: #fcd34d; }
    svg.focus .node, svg.focus .rg, svg.focus .arg { opacity: .18; transition: opacity .25s; }
    svg.focus .node.on, svg.focus .arg.on { opacity: 1; }
    svg.focus .rg.on { opacity: .9; }
    .arg.on .ar { stroke: #e0473c; stroke-width: 3.4; opacity: 1; stroke-dasharray: none; }
    .arg.on .al { fill: #e0473c; }
    /* 댓글 패널 (giscus) */
    #comment-toggle { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 51; background: #fff; border: 2px solid #2b2b2b; border-right: none; border-radius: 12px 0 0 12px; padding: 12px 8px; cursor: pointer; font-family: var(--pf-hand); font-size: 20px; box-shadow: -2px 2px 0 #2b2b2b; transition: right .3s ease; writing-mode: vertical-rl; letter-spacing: 2px; }
    #comment-toggle:hover { background: #fef9c3; }
    #comment-panel { position: fixed; top: 0; right: 0; width: 480px; min-width: 320px; max-width: 80vw; height: 100vh; background: #fff; border-left: 2px dashed #2b2b2b; box-shadow: -4px 0 12px rgba(0,0,0,.08); transform: translateX(100%); transition: transform .3s ease; z-index: 50; display: flex; flex-direction: column; }
    #comment-panel.open { transform: translateX(0); }
    #comment-panel.resizing { transition: none; user-select: none; }
    #resize-handle { position: absolute; left: -4px; top: 0; width: 8px; height: 100%; cursor: col-resize; z-index: 52; }
    #resize-handle:hover, #resize-handle.active { background: linear-gradient(90deg, transparent, rgba(19,160,143,.3), transparent); }
    .comment-header { padding: 16px 20px; border-bottom: 2px dashed #ece5d3; display: flex; align-items: center; justify-content: space-between; font-family: var(--pf-hand); font-size: 24px; }
    .comment-header button { background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px; }
    .comment-body { flex: 1; overflow-y: auto; padding: 0 20px; }
    .giscus-placeholder { padding: 40px; text-align: center; color: #a8a29a; }
    @media (max-width: 760px) {
      .mm-bar { padding: 8px 16px 0; } .mapbox { margin: 8px 16px 12px; min-height: 60vh; }
      .legend { display: none; } .mm-title p { display: none; }
      #comment-panel { width: 100vw; max-width: 100vw; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="pf-nav"><div class="in">
    <a class="pf-logo" href="../index.html"><span>개발자 학습 노트</span></a>
    <nav class="pf-links" id="links"></nav><span class="sp"></span>
  </div></header>

  <div class="mm-bar">
    <div class="mm-title">
      <h1>요청 하나가 지나가는 길 위에, 그때 쓰는 기술</h1>
      <p>흐름을 고르면 그 길만 켜지고, 그림을 누르면 하는 일과 주제가 나온다. 끌어서 옮기고 휠로 확대한다.</p>
    </div>
    <div class="mm-row" id="flows"><span class="lbl">흐름</span></div>
    <div class="mm-row" id="notes"><span class="lbl">기초 노트</span></div>
  </div>

  <div class="mapbox">
    <svg id="map" viewBox="0 0 1800 1150" role="img" aria-label="시스템 지도: 요청이 지나가는 길과 각 지점의 기술"></svg>
    <div class="legend"><span><span class="sw"></span><b>형광펜</b> 누르면 그 주제로</span><span><b style="color:#0f766e">레슨</b> 애니메이션 레슨 있음</span><span><b style="color:#e0473c">- - →</b> 안을 들여다보기</span></div>
    <div class="info" id="info" hidden></div>
    <div class="zoom"><button class="zb w" id="zfit" type="button">전체</button><button class="zb" id="zin" type="button" aria-label="확대">+</button><button class="zb" id="zout" type="button" aria-label="축소">−</button></div>
  </div>

  <!-- 댓글 (giscus) -->
  <button id="comment-toggle" type="button" onclick="toggleComments()">💬 댓글</button>
  <div id="comment-panel">
    <div id="resize-handle"></div>
    <div class="comment-header"><span>💬 댓글 / 질문</span><button type="button" onclick="toggleComments()" aria-label="댓글 닫기">✕</button></div>
    <div class="comment-body" id="comment-body"><div class="giscus-placeholder" id="giscus-placeholder">댓글을 불러오는 중…</div></div>
  </div>

  <script src="./topics.js"></script>
  <script src="../anim/icons.js"></script>
  <script>
    document.getElementById('links').innerHTML = `<a href="../index.html">${ICON.grid}주제</a><a class="on" href="./index.html">${ICON.map}지도로 보기</a>`;

    // 댓글 패널 토글 + 리사이즈 (옛 지도와 같은 giscus 스레드 "mindmap")
    var commentLoaded = false, panelWidth = 480;
    function updateTogglePosition(w) { var t = document.getElementById('comment-toggle'), p = document.getElementById('comment-panel'); t.style.right = p.classList.contains('open') ? w + 'px' : '0px'; }
    function toggleComments() {
      var panel = document.getElementById('comment-panel'), isOpen = panel.classList.toggle('open');
      updateTogglePosition(isOpen ? Math.min(panelWidth, innerWidth) : 0);
      if (isOpen && !commentLoaded) { loadGiscus(); commentLoaded = true; }
    }
    (function () {
      var handle = document.getElementById('resize-handle'), panel = document.getElementById('comment-panel'), overlay = null;
      handle.addEventListener('mousedown', function (e) {
        e.preventDefault(); panel.classList.add('resizing'); handle.classList.add('active');
        overlay = document.createElement('div'); overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;cursor:col-resize;'; document.body.appendChild(overlay);
        function onMove(ev) { var w = Math.max(320, Math.min(innerWidth * 0.8, innerWidth - ev.clientX)); panelWidth = w; panel.style.width = w + 'px'; updateTogglePosition(w); }
        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); panel.classList.remove('resizing'); handle.classList.remove('active'); if (overlay) overlay.remove(); overlay = null; }
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
      });
    })();
    function loadGiscus() {
      document.getElementById('giscus-placeholder').remove();
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      var at = { 'data-repo': 'HoyoungParkme/tech-roadmap', 'data-repo-id': 'R_kgDOSIZCtg', 'data-category': 'General', 'data-category-id': 'DIC_kwDOSIZCts4C7lgx',
        'data-mapping': 'specific', 'data-term': 'mindmap', 'data-strict': '0', 'data-reactions-enabled': '1', 'data-emit-metadata': '0',
        'data-input-position': 'top', 'data-theme': 'light', 'data-lang': 'ko', crossorigin: 'anonymous' };
      for (var k in at) s.setAttribute(k, at[k]);
      s.async = true; document.getElementById('comment-body').appendChild(s);
    }
  </script>
  <script src="./map.js"></script>
</body>
</html>
