    VIII-1-2. @Value로 설정 주입
    학습 목표: application.yml/properties 의 값을 Bean 필드에 주입하는
              가장 단순한 방법인 @Value 의 5가지 사용 패턴(기본/기본값/SpEL/주입시점/한계)을
              "설정 파일 → @Value → 필드 주입" 흐름으로 시각화한다.
    핵심 비유: "필드에 값표를 붙여 두면, 컨테이너가 기동 때 값을 끼워 넣어 준다."
    패턴: fastapi v1 — 좌(LiveDataPane: yml/properties → @Value → 필드 주입 흐름)
                       / 우(VSCode CodeViewer 5탭)

    // ─────────────────────────────────────────────────────
    // SourceCard — 좌측 입력 (yml/properties/system-prop)
    // ─────────────────────────────────────────────────────
    function SourceCard({ label, code }) {
      return (
        <div className="rounded-lg border-2 border-lime-300 bg-lime-50 overflow-hidden">
          <div className="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider bg-lime-100 text-lime-700">
            {label}
          </div>
          <pre className="text-[11px] font-mono text-slate-800 leading-snug p-2.5 m-0 whitespace-pre overflow-x-auto">{code}</pre>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // BeanFieldTree — 가운데: @Value 가 붙은 Bean 필드 노드
    //   kind 별 색상
    //     value   → lime    (단순 placeholder)
    //     default → amber   (콜론 디폴트)
    //     spel    → fuchsia (SpEL 표현식)
    //     field   → slate   (필드 선언 줄)
    //     ok      → emerald (성공 사용)
    //     fail    → rose    (실패/오타)
    // ─────────────────────────────────────────────────────
    function BeanFieldTree({ nodes }) {
      const kindMap = {
        value:   { bg: 'bg-lime-100',    text: 'text-lime-800',    border: 'border-lime-300',    tag: '@Value' },
        default: { bg: 'bg-amber-50',    text: 'text-amber-800',   border: 'border-amber-300',   tag: 'default' },
        spel:    { bg: 'bg-fuchsia-50',  text: 'text-fuchsia-800', border: 'border-fuchsia-300', tag: 'SpEL' },
        field:   { bg: 'bg-slate-100',   text: 'text-slate-700',   border: 'border-slate-300',   tag: 'field' },
        ok:      { bg: 'bg-emerald-50',  text: 'text-emerald-800', border: 'border-emerald-300', tag: 'ok' },
        fail:    { bg: 'bg-rose-50',     text: 'text-rose-800',    border: 'border-rose-300',    tag: 'fail' },
      };
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            @Value 가 붙은 Bean 필드
          </div>
          <div className="p-2.5 space-y-1">
            {nodes.map((n) => {
              const c = kindMap[n.kind] || kindMap.value;
              return (
                <div key={n.id} className="flex items-center gap-1.5">
                  <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded ${c.bg} ${c.text} border ${c.border} font-bold uppercase tracking-wide flex-shrink-0`}>
                    {c.tag}
                  </span>
                  <span className="text-[11px] font-mono text-slate-700 leading-tight">{n.label}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // InjectedFieldTable — 마지막 단계: 주입 후 실제 필드값
    // ─────────────────────────────────────────────────────
    function InjectedFieldTable({ rows }) {
      const statusMap = {
        ok:      { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-300', icon: '✓' },
        default: { bg: 'bg-amber-50',   text: 'text-amber-700',   border: 'border-amber-300',   icon: 'd' },
        spel:    { bg: 'bg-fuchsia-50', text: 'text-fuchsia-700', border: 'border-fuchsia-300', icon: '#' },
        warn:    { bg: 'bg-yellow-50',  text: 'text-yellow-700',  border: 'border-yellow-300',  icon: '!' },
        fail:    { bg: 'bg-rose-50',    text: 'text-rose-700',    border: 'border-rose-300',    icon: '✗' },
      };
      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 overflow-hidden">
          <div className="bg-emerald-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-emerald-700 flex items-center justify-between">
            <span>주입 후 필드값 (런타임)</span>
            <span className="text-[9px] font-mono text-emerald-600">runtime</span>
          </div>
          <div className="p-2.5 space-y-1 font-mono text-[11px]">
            {rows.map((r) => {
              const s = statusMap[r.status] || statusMap.ok;
              return (
                <div key={r.id} className="flex items-center gap-2">
                  <span className={`text-[9px] px-1 py-0.5 rounded ${s.bg} ${s.text} border ${s.border} font-bold flex-shrink-0 w-5 text-center`}>
                    {s.icon}
                  </span>
                  <span className="text-slate-700 font-bold flex-shrink-0 min-w-[110px]">{r.name}</span>
                  <span className="text-slate-400 text-[10px] flex-shrink-0 min-w-[80px]">{r.type}</span>
                  <span className="text-slate-800 truncate">{r.value}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 흐름 화살표 (수직)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-lime-700 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-lime-500 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : 설정 소스 (yml/properties)
    //   ↓ Spring 가 키 매핑
    //   중간 : @Value 필드 트리
    //   ↓ 컨테이너가 필드 set
    //   하단 : 주입 후 실제 필드값
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">⚙️ application.yml → @Value → 필드 주입 흐름</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {/* 1) 입력 — 설정 소스 */}
            <SourceCard label={step.sourceLabel} code={step.source} />

            <FlowArrow label={step.arrow.top} />

            {/* 2) 중간 — @Value 필드 트리 */}
            <BeanFieldTree nodes={step.bean} />

            <FlowArrow label={step.arrow.bot} />

            {/* 3) 출력 — 주입 후 필드값 */}
            <InjectedFieldTable rows={step.injected} />
          </div>

          {/* 핵심 포인트 */}
          <div className="mt-3 bg-lime-50 border-l-4 border-lime-500 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-lime-700 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-lime-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-lime-400"></span>@Value
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-400"></span>default
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-fuchsia-400"></span>SpEL
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-400"></span>ok
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-400"></span>fail
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   탭(5개) + 윈도우 dot + 라인 번호 + 강조 라인
    //   - 현재 Step 의 파일은 활성, 다른 파일도 클릭으로 전환 가능
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_KEYS = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ steps, stepIdx, total, onTabChange }) {
      const code = steps[stepIdx].code;
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* 5탭 */}
          <div className="bg-[#21252b] flex border-b border-slate-700 overflow-x-auto">
            {TAB_KEYS.map((key) => (
              <button
                key={key}
                onClick={() => onTabChange(STEPS.findIndex((x) => x.code.filename === key))}
                className={`px-3 py-1.5 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                  key === code.filename
                    ? 'bg-[#282c34] text-lime-300 border-t-2 border-t-lime-400'
                    : 'text-slate-500 hover:text-slate-300 hover:bg-[#2c313a]'
                }`}
              >
                {key}
              </button>
            ))}
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[44rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-lime-500/15 border-l-2 border-lime-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    //   - 좌(LiveDataPane) / 우(CodeViewer 5탭)
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter VIII-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-lime-600 text-white flex items-center justify-center rounded-full font-bold text-sm">VIII</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part VIII. 설정과 자동 구성 &gt; Chapter 1. 외부 설정</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">VIII-1-2. @Value 로 설정 주입</h1>
                  <p className="text-sm text-slate-500 mt-0.5">application.yml 의 값을 가장 단순하게 Bean 필드로 끌어오기</p>
                </div>
                <span className="ml-auto text-xs bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-bold">★★★</span>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer steps={STEPS} stepIdx={stepIdx} total={STEPS.length} onTabChange={setStepIdx} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-lime-50 border-2 border-lime-300 rounded-xl p-3 text-sm text-lime-900">
                💡 정리: <strong>@Value</strong>는 한두 개 값을 빠르게 끌어올 때 가볍고 좋다. 하지만 <strong>같은 prefix 가 반복</strong>되거나 <strong>오타·복합 타입</strong>이 등장하면 부담이 커진다. 다음(VIII-1-3)에서는 <strong>@ConfigurationProperties</strong>로 타입 안전 그룹 매핑을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-lime-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-lime-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-lime-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-lime-600 text-white hover:bg-lime-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['@Value', '${...}', '#{...}', 'SpEL', '기본값', '@PostConstruct', 'placeholder', '한계'].map((kw) => (
                <span key={kw} className="bg-lime-50 text-lime-700 px-3 py-1 rounded-full text-xs font-medium border border-lime-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-08-01-properties-yaml.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; VIII-1-1 properties vs yaml</a>
              <a href="./chapter-08-03-config-properties.html" className="text-lime-700 hover:text-lime-900 font-medium">VIII-1-3 @ConfigurationProperties &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
