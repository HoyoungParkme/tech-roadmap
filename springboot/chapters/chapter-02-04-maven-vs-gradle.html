    // ─────────────────────────────────────────────────────
    // CodeCard — 좌측 짧은 코드 카드 (Maven=in, Gradle=out 톤)
    // ─────────────────────────────────────────────────────
    function CodeCard({ label, code, accent }) {
      const cls = accent === 'in'
        ? { card: 'border-rose-300 bg-rose-50',  head: 'bg-rose-100 text-rose-800' }
        : accent === 'out'
        ? { card: 'border-lime-300 bg-lime-50',  head: 'bg-lime-100 text-lime-800' }
        : { card: 'border-slate-200 bg-slate-50', head: 'bg-slate-100 text-slate-600' };
      return (
        <div className={`rounded-lg border-2 ${cls.card} overflow-hidden`}>
          <div className={`px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider ${cls.head}`}>
            {label}
          </div>
          <pre className="text-[11px] font-mono text-slate-800 leading-snug p-2.5 m-0 whitespace-pre overflow-x-auto">{code}</pre>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // SpeedBars — 빌드 속도 막대
    //   color: 'rose' | 'amber' | 'lime' | 'emerald'
    // ─────────────────────────────────────────────────────
    function SpeedBars({ bars }) {
      const palette = {
        rose:    { bar: 'bg-rose-500',    bg: 'bg-rose-100',    text: 'text-rose-700' },
        amber:   { bar: 'bg-amber-500',   bg: 'bg-amber-100',   text: 'text-amber-700' },
        lime:    { bar: 'bg-lime-500',    bg: 'bg-lime-100',    text: 'text-lime-700' },
        emerald: { bar: 'bg-emerald-500', bg: 'bg-emerald-100', text: 'text-emerald-700' },
      };
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
            <span>빌드 속도 비교 (낮을수록 빠름)</span>
            <span className="text-[9px] font-mono text-slate-500">benchmark</span>
          </div>
          <div className="p-2.5 space-y-2">
            {bars.map((b, i) => {
              const c = palette[b.color] || palette.lime;
              return (
                <div key={i}>
                  <div className="flex justify-between text-[10px] mb-0.5">
                    <span className={`font-bold ${c.text}`}>{b.tool}</span>
                    <span className="text-slate-500 font-mono">{b.percent}%</span>
                  </div>
                  <div className={`h-3 ${c.bg} rounded-full overflow-hidden`}>
                    <div
                      className={`h-full ${c.bar} rounded-full transition-all duration-700`}
                      style={{ width: `${b.percent}%` }}
                    ></div>
                  </div>
                  {b.note && (
                    <div className="text-[9px] text-slate-500 mt-0.5">{b.note}</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 변환 흐름 화살표 (수직)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-lime-700 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-lime-500 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FocusChip — 단계별 강조 칩 (어떤 영역에 집중하는가)
    // ─────────────────────────────────────────────────────
    function FocusChip({ highlight }) {
      const map = {
        maven:     { bg: 'bg-rose-100',    text: 'text-rose-800',    label: 'Maven 포커스' },
        gradle:    { bg: 'bg-lime-100',    text: 'text-lime-800',    label: 'Gradle 포커스' },
        speed:     { bg: 'bg-amber-100',   text: 'text-amber-800',   label: '빌드 속도 포커스' },
        choice:    { bg: 'bg-emerald-100', text: 'text-emerald-800', label: '선택 권고 포커스' },
        migration: { bg: 'bg-sky-100',     text: 'text-sky-800',     label: 'Migration 포커스' },
      };
      const c = map[highlight] || map.maven;
      return (
        <span className={`text-[9px] font-bold px-2 py-0.5 rounded ${c.bg} ${c.text} uppercase tracking-wider`}>
          {c.label}
        </span>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : pom.xml ↔ build.gradle 좌/우 카드
    //   ↓ 같은 의존성, 다른 표현
    //   중간 : 빌드 속도 막대
    //   ↓ 결정으로 이어짐
    //   하단 : 핵심 포인트 + 범례
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">⚙️ Maven ↔ Gradle 같은 프로젝트 비교</h2>
            <div className="flex items-center gap-2">
              <FocusChip highlight={step.highlight} />
              <span className="text-[10px] text-slate-400 font-mono">live</span>
            </div>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {/* 1) 좌/우 코드 카드 — 같은 의존성을 두 도구로 */}
            <div className="grid grid-cols-2 gap-2">
              <CodeCard label={step.leftLabel}  code={step.leftCode}  accent="in" />
              <CodeCard label={step.rightLabel} code={step.rightCode} accent="out" />
            </div>

            <FlowArrow label="같은 의존성, 다른 표현" />

            {/* 2) 빌드 속도 막대 */}
            <SpeedBars bars={step.speed} />

            <FlowArrow label="결과 = 기술 선택" />
          </div>

          {/* 핵심 포인트 박스 */}
          <div className="mt-3 bg-lime-50 border-l-4 border-lime-500 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-lime-700 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-lime-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-500"></span>Maven (XML)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-lime-500"></span>Gradle (DSL)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-500"></span>중간/캐시 없음
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>권장/완료
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — 5탭 + highlight.js + atom-one-dark
    //   탭: pom.xml / build.gradle / compare.md / recommendation.md / migration.md
    //   step 변경 시 자동으로 해당 탭으로 전환
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_KEYS = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ steps, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      const [activeTab, setActiveTab] = useState(stepIdx);
      const code = steps[activeTab].code;

      // 단계 이동 시 해당 탭으로 자동 전환
      useEffect(() => {
        setActiveTab(stepIdx);
      }, [stepIdx]);

      // highlight.js 적용
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code, activeTab]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 5탭 */}
          <div className="bg-[#21252b] px-3 py-2 border-b border-slate-700">
            <div className="flex items-center gap-2 mb-2">
              <div className="flex gap-1.5">
                <span className="w-3 h-3 rounded-full bg-red-500"></span>
                <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span className="w-3 h-3 rounded-full bg-green-500"></span>
              </div>
              <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
            </div>
            <div className="flex gap-1 overflow-x-auto">
              {TAB_KEYS.map((key) => (
                <button
                  key={key}
                  onClick={() => setActiveTab(STEPS.findIndex((x) => x.code.filename === key))}
                  className={`px-2.5 py-1 text-[10px] font-mono rounded-t transition whitespace-nowrap ${
                    key === code.filename
                      ? 'bg-[#282c34] text-lime-300 border-t-2 border-lime-400'
                      : 'bg-[#1b1d22] text-slate-500 hover:text-slate-300'
                  }`}
                >
                  {key}
                </button>
              ))}
            </div>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[42rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-lime-500/15 border-l-2 border-lime-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total} · Tab {activeTab + 1} / {steps.length}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter II-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-lime-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. Spring Boot 기초 &gt; Chapter 2. 빌드 도구</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">II-2-2. Maven과 Gradle 비교</h1>
                  <p className="text-sm text-slate-500 mt-0.5">XML 표준 vs DSL 유연성 — 같은 프로젝트로 비교한다</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer steps={STEPS} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-lime-50 border-2 border-lime-400 rounded-xl p-3 text-sm text-lime-900">
                💡 정리: 신규 프로젝트는 <strong>Gradle Kotlin DSL</strong>이 거의 항상 정답.
                기존 Maven 프로젝트는 <strong>5단계 점진 마이그레이션</strong>(자동변환 → 매핑 → 검증 → CI 동시운영 → 정리)으로 안전하게 옮긴다.
                다음(II-2-3)에서는 Spring 생태계 전반을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-lime-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-lime-100">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-lime-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-lime-600 text-white hover:bg-lime-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['Maven', 'Gradle', 'pom.xml', 'build.gradle.kts', 'Kotlin DSL', 'Incremental Build', 'Build Cache', 'Spring Initializr'].map((kw) => (
                <span key={kw} className="bg-lime-50 text-lime-800 px-3 py-1 rounded-full text-xs font-medium border border-lime-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-02-03-why-build-tool.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; II-2-1 빌드 도구가 왜 필요한가</a>
              <a href="./chapter-02-05-spring-ecosystem.html" className="text-lime-700 hover:text-lime-900 font-medium">II-2-3 Spring 생태계 &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
