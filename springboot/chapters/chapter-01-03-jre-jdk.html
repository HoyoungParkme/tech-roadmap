    const S1 = { title:"Step 1. JRE — 실행만 하는 최소 환경", desc:"JRE(Java Runtime Environment)는 \"Java로 만든 프로그램을 실행만 하는 환경\"이다. 안에 JVM(가상 머신)이 들어 있고, 그 위에 java.lang/java.util 같은 표준 라이브러리가 함께 들어 있다. 이미 빌드된 .jar 파일이라면 JRE만 있어도 java -jar 로 돌아간다. 단, 소스(.java)를 컴파일할 수는 없다." };
    const S2 = { title:"Step 2. JDK — 개발에 필요한 모든 도구", desc:"JDK(Java Development Kit)는 JRE를 통째로 포함하면서 개발 도구를 더 얹은 패키지다. javac(컴파일러), javadoc(문서 생성기), jar(패키징), jdb(디버거), jshell(REPL) 같은 명령들이 들어 있다. 코드를 한 줄이라도 작성한다면 무조건 JDK다. Spring Boot 프로젝트 빌드도 JDK가 있어야 가능하다." };
    const S3 = { title:"Step 3. 비교 다이어그램 — 누가 무엇을 가지는가", desc:"같은 그림을 한 화면에서 비교한다. JVM ⊂ JRE ⊂ JDK 의 동심원 구조. JVM은 \"엔진\", JRE는 \"엔진+기본 부품\", JDK는 \"엔진+부품+공구함\" 이다. 세 묶음은 점점 커지지만 가장 안쪽 JVM은 항상 같다 — 어느 패키지를 설치하든 결국 같은 JVM 위에서 코드가 돈다." };
    const S4 = { title:"Step 4. Java 9+ 모듈 시스템 — JRE 를 잘게 자르다", desc:"Java 9에서 들어온 모듈 시스템(JPMS)은 표준 라이브러리를 java.base, java.sql, java.xml 등 여러 모듈로 쪼갰다. 덕분에 jlink로 \"내 앱에 필요한 모듈만\" 골라 가벼운 커스텀 런타임을 만들 수 있다. Spring Boot 자체는 모듈을 강하게 쓰지 않지만, 컨테이너 이미지를 작게 만들 때 이 개념이 중요해진다." };
    const S5 = { title:"Step 5. 어떤 걸 설치할까 — 개발자는 무조건 JDK", desc:"실무 결론: Spring Boot를 한 줄이라도 짤 거라면 JDK를 설치한다. 2026년 기준 LTS는 JDK 21 (또는 17)이고, 배포판은 Eclipse Temurin이 사실상 표준이다 (Amazon Corretto, Azul Zulu도 무료). 설치 후 java -version과 javac -version으로 확인하고, JAVA_HOME 환경변수를 잡아두면 IDE/빌드 도구가 자동으로 인식한다." };

    // ─────────────────────────────────────────────────────
    // NestingBox — 좌측 핵심 시각: JVM ⊂ JRE ⊂ JDK 박스
    //   kind 별 색상 (lime 계열 + 보조)
    //     jdk  → lime (가장 바깥, 개발자용)
    //     jre  → emerald (실행 환경)
    //     jvm  → amber (핵심 엔진)
    //     tool → fuchsia (개발 도구)
    //     lib  → sky (표준 라이브러리)
    //     mod  → violet (모듈)
    // ─────────────────────────────────────────────────────
    function NestingBox({ box, isOn }) {
      const kindMap = {
        jdk:  { bg: 'bg-lime-50',     border: 'border-lime-400',     text: 'text-lime-900',     tagBg: 'bg-lime-200',     tagText: 'text-lime-900',     tag: 'JDK'  },
        jre:  { bg: 'bg-emerald-50',  border: 'border-emerald-400',  text: 'text-emerald-900',  tagBg: 'bg-emerald-200',  tagText: 'text-emerald-900',  tag: 'JRE'  },
        jvm:  { bg: 'bg-amber-50',    border: 'border-amber-400',    text: 'text-amber-900',    tagBg: 'bg-amber-200',    tagText: 'text-amber-900',    tag: 'JVM'  },
        tool: { bg: 'bg-fuchsia-50',  border: 'border-fuchsia-300',  text: 'text-fuchsia-900',  tagBg: 'bg-fuchsia-200',  tagText: 'text-fuchsia-900',  tag: 'tool' },
        lib:  { bg: 'bg-sky-50',      border: 'border-sky-300',      text: 'text-sky-900',      tagBg: 'bg-sky-200',      tagText: 'text-sky-900',      tag: 'lib'  },
        mod:  { bg: 'bg-violet-50',   border: 'border-violet-300',   text: 'text-violet-900',   tagBg: 'bg-violet-200',   tagText: 'text-violet-900',   tag: 'mod'  },
      };
      const c = kindMap[box.kind] || kindMap.lib;
      const dim = !isOn;
      return (
        <div
          className={`rounded-lg border-2 ${c.border} ${c.bg} px-3 py-2 transition-all duration-300 ${dim ? 'opacity-30 grayscale' : 'shadow-sm'}`}
          style={{ marginLeft: `${box.depth * 18}px` }}
        >
          <div className="flex items-center gap-2">
            <span className={`text-[9px] font-mono font-bold px-1.5 py-0.5 rounded ${c.tagBg} ${c.tagText} uppercase tracking-wider flex-shrink-0`}>
              {c.tag}
            </span>
            <span className={`text-[12px] font-bold ${c.text} leading-tight`}>{box.label}</span>
          </div>
          {box.hint && (
            <div className={`text-[10px] mt-0.5 ml-[44px] ${c.text} opacity-75 font-mono`}>
              {box.hint}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   - 상단 탭 바 : 5 단계 파일명
    //   - 윈도우 dot + 라인 번호 + 강조 라인
    //   - 탭 클릭으로 직접 단계 이동
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_KEYS = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ stepIdx, total, onTabClick }) {
      const code = STEPS[stepIdx].code;
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 탭 바 (5 탭) */}
          <div className="bg-[#21252b] px-3 py-2 flex items-center gap-2 border-b border-slate-700 overflow-x-auto">
            <div className="flex gap-1.5 flex-shrink-0">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <div className="flex gap-1 ml-2">
              {TAB_KEYS.map((key) => (
                <button
                  key={key}
                  onClick={() => onTabClick(STEPS.findIndex((x) => x.code.filename === key))}
                  className={`text-[10px] font-mono px-2 py-1 rounded-t transition flex-shrink-0 ${
                    key === code.filename
                      ? 'bg-[#282c34] text-lime-300 border-b-2 border-lime-400'
                      : 'bg-[#1a1d23] text-slate-500 hover:text-slate-300'
                  }`}
                >
                  {key}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase flex-shrink-0">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-lime-500/15 border-l-2 border-lime-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter I-1-3</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-lime-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Java &amp; Spring 기초 &gt; Chapter 1. Java 입문</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">I-1-3. JRE와 JDK — 실행 환경 vs 개발 도구</h1>
                  <p className="text-sm text-slate-500 mt-0.5">JVM ⊂ JRE ⊂ JDK 포함 관계와 "개발자는 무조건 JDK" 결론까지</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer stepIdx={stepIdx} total={STEPS.length} onTabClick={setStepIdx} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-lime-50 border-2 border-lime-300 rounded-xl p-3 text-sm text-lime-900">
                💡 정리: <strong>JVM ⊂ JRE ⊂ JDK</strong>. 코드를 한 줄이라도 짠다면 <strong>JDK</strong>가 답이고, 2026년 기준 <strong>JDK 21 (Temurin)</strong>이 표준 조합. <code className="bg-lime-200 px-1 rounded">java -version</code>과 <code className="bg-lime-200 px-1 rounded">javac -version</code>으로 설치 확인. 다음(I-1-4)에서는 Servlet에서 Spring으로 이어지는 흐름을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-lime-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-lime-100">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-lime-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-lime-600 text-white hover:bg-lime-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['JVM', 'JRE', 'JDK', 'javac', 'jar', 'jshell', 'jlink', 'JPMS', 'Temurin', 'LTS', 'JAVA_HOME', 'SDKMAN'].map((kw) => (
                <span key={kw} className="bg-lime-50 text-lime-700 px-3 py-1 rounded-full text-xs font-medium border border-lime-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-01-02-jvm.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; I-1-2 JVM</a>
              <a href="./chapter-01-04-servlet-to-spring.html" className="text-lime-700 hover:text-lime-900 font-medium">I-1-4 Servlet → Spring &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
