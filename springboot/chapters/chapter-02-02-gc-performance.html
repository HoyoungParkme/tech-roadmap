    // ─────────────────────────────────────────────────────
    // CodeCard — 좌측 짧은 코드 카드 (라임 액센트)
    // ─────────────────────────────────────────────────────
    function CodeCard({ label, code }) {
      return (
        <div className="rounded-lg border-2 border-lime-300 bg-lime-50 overflow-hidden">
          <div className="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider bg-lime-100 text-lime-800">
            {label}
          </div>
          <pre className="text-[11px] font-mono text-slate-800 leading-snug p-2.5 m-0 whitespace-pre overflow-x-auto">{code}</pre>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // HeapRegions — Heap 시각화 (영역별 막대 + 사용량)
    //   kind 별 색상
    //     eden     → lime    (신규 객체)
    //     survivor → emerald (생존자)
    //     old      → amber   (장기 생존)
    //     meta     → slate   (Heap 바깥)
    //     gc       → rose    (현재 GC 진행/STW 강조)
    // ─────────────────────────────────────────────────────
    function HeapRegions({ regions }) {
      const kindMap = {
        eden:     { bg: 'bg-lime-100',    bar: 'bg-lime-500',    text: 'text-lime-800',    border: 'border-lime-300',    tag: 'EDEN' },
        survivor: { bg: 'bg-emerald-50',  bar: 'bg-emerald-500', text: 'text-emerald-800', border: 'border-emerald-300', tag: 'SURV' },
        old:      { bg: 'bg-amber-50',    bar: 'bg-amber-500',   text: 'text-amber-800',   border: 'border-amber-300',   tag: 'OLD'  },
        meta:     { bg: 'bg-slate-50',    bar: 'bg-slate-400',   text: 'text-slate-700',   border: 'border-slate-300',   tag: 'META' },
        gc:       { bg: 'bg-rose-50',     bar: 'bg-rose-500',    text: 'text-rose-800',    border: 'border-rose-400',    tag: 'GC!'  },
      };
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            Heap 영역 사용량
          </div>
          <div className="p-2.5 space-y-1.5">
            {regions.map((r) => {
              const c = kindMap[r.kind] || kindMap.eden;
              const pct = Math.min(100, Math.round((r.used / r.capacity) * 100));
              return (
                <div key={r.id} className={`rounded border ${c.border} ${c.bg} px-2 py-1.5`}>
                  <div className="flex items-center gap-1.5 mb-1">
                    <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded bg-white ${c.text} border ${c.border} font-bold uppercase tracking-wide flex-shrink-0`}>
                      {c.tag}
                    </span>
                    <span className="text-[11px] font-mono font-bold text-slate-700 flex-1">{r.name}</span>
                    <span className="text-[9px] font-mono text-slate-500">{r.used}/{r.capacity}</span>
                  </div>
                  <div className="h-2 bg-white rounded-full overflow-hidden border border-slate-200">
                    <div className={`h-full ${c.bar} transition-all duration-500`} style={{ width: `${pct}%` }}></div>
                  </div>
                  {r.label && (
                    <div className={`text-[9px] mt-0.5 font-mono ${c.text}`}>{r.label}</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ObjectList — Heap 안의 개별 객체 (이름 + age + 영역)
    // ─────────────────────────────────────────────────────
    function ObjectList({ objects }) {
      const regionColor = {
        eden:     'bg-lime-100 text-lime-800 border-lime-300',
        survivor: 'bg-emerald-100 text-emerald-800 border-emerald-300',
        old:      'bg-amber-100 text-amber-800 border-amber-300',
        meta:     'bg-slate-100 text-slate-700 border-slate-300',
      };
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
            <span>Heap 내 객체 추적</span>
            <span className="text-[9px] font-mono text-slate-500">name · age · region</span>
          </div>
          <div className="p-2.5 space-y-1">
            {objects.map((o) => (
              <div
                key={o.id}
                className={`flex items-center gap-2 px-2 py-1 rounded text-[11px] font-mono border ${regionColor[o.region] || regionColor.eden} ${o.highlight ? 'ring-2 ring-lime-400' : ''}`}
              >
                <span className="font-bold flex-1">{o.name}</span>
                <span className="text-[9px] opacity-70">age={o.age}</span>
                <span className="text-[9px] uppercase font-bold opacity-70">{o.region}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // StwBanner — Stop-The-World 표시 배너
    // ─────────────────────────────────────────────────────
    function StwBanner({ stw, event }) {
      if (!stw.active) {
        return (
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 px-3 py-2 flex items-center gap-2">
            <span className="text-emerald-700 text-base">▶</span>
            <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-700">App Running</span>
            <span className="text-[11px] text-emerald-900 ml-2 font-mono flex-1">{event}</span>
            <span className="text-[9px] font-mono text-emerald-600">STW: 0 ms</span>
          </div>
        );
      }
      const tone = stw.ms < 1
        ? { border: 'border-lime-400', bg: 'bg-lime-50',  text: 'text-lime-800', dot: 'bg-lime-500' }
        : stw.ms < 50
          ? { border: 'border-amber-400', bg: 'bg-amber-50', text: 'text-amber-800', dot: 'bg-amber-500' }
          : { border: 'border-rose-400', bg: 'bg-rose-50', text: 'text-rose-800', dot: 'bg-rose-500' };
      return (
        <div className={`rounded-lg border-2 ${tone.border} ${tone.bg} px-3 py-2 flex items-center gap-2`}>
          <span className={`w-2.5 h-2.5 rounded-full ${tone.dot} animate-pulse flex-shrink-0`}></span>
          <span className={`text-[10px] font-bold uppercase tracking-wider ${tone.text}`}>STOP-THE-WORLD</span>
          <span className={`text-[11px] ${tone.text} ml-2 font-mono flex-1`}>{event}</span>
          <span className={`text-[9px] font-mono ${tone.text} font-bold`}>{stw.ms} ms</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // MetricsBar — 지표 (할당량 / Minor·Major GC 횟수 / STW 누적)
    // ─────────────────────────────────────────────────────
    function MetricsBar({ metric }) {
      const items = [
        { label: 'Allocated', value: metric.allocated, color: 'lime' },
        { label: 'Minor GC',  value: metric.minorGc,    color: 'emerald' },
        { label: 'Major GC',  value: metric.majorGc,    color: 'amber' },
        { label: 'STW Total', value: metric.stwTotal,   color: 'rose' },
      ];
      const colorMap = {
        lime:    'bg-lime-50 text-lime-800 border-lime-200',
        emerald: 'bg-emerald-50 text-emerald-800 border-emerald-200',
        amber:   'bg-amber-50 text-amber-800 border-amber-200',
        rose:    'bg-rose-50 text-rose-800 border-rose-200',
      };
      return (
        <div className="grid grid-cols-4 gap-1.5">
          {items.map((it) => (
            <div key={it.label} className={`rounded border ${colorMap[it.color]} px-2 py-1.5 text-center`}>
              <div className="text-[8px] font-bold uppercase tracking-wider opacity-70">{it.label}</div>
              <div className="text-[11px] font-mono font-bold mt-0.5 truncate">{it.value}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 단계 사이 화살표 (수직, 라임)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex flex-col items-center my-1">
          <div className="text-[9px] text-lime-700 font-mono font-bold tracking-wider uppercase">{label}</div>
          <div className="text-lime-500 text-lg leading-none">↓</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   - 짧은 설명 카드 (CodeCard)
    //   - ↓ 화살표
    //   - Heap 영역 막대
    //   - 객체 추적 리스트
    //   - STW 배너
    //   - 지표
    //   - 핵심 포인트
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">♻️ JVM Heap & GC 진행 상황</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            <CodeCard label={step.leftCardLabel} code={step.leftCardCode} />
            <FlowArrow label="현재 Heap 상태" />
            <HeapRegions regions={step.heap.regions} />
            <FlowArrow label="추적중 객체" />
            <ObjectList objects={step.heap.objects} />
            <FlowArrow label="실행 상태" />
            <StwBanner stw={step.heap.stw} event={step.heap.event} />
            <FlowArrow label="누적 지표" />
            <MetricsBar metric={step.metric} />
          </div>

          {/* 핵심 포인트 박스 */}
          <div className="mt-3 bg-lime-50 border-l-4 border-lime-500 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-lime-700 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-lime-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            {[
              ['Eden', 'bg-lime-500'],
              ['Survivor', 'bg-emerald-500'],
              ['Old', 'bg-amber-500'],
              ['Metaspace', 'bg-slate-400'],
              ['GC / STW', 'bg-rose-500'],
            ].map(([name, bg]) => (
              <span key={name} className="flex items-center gap-1">
                <span className={`w-2 h-2 rounded ${bg}`}></span>{name}
              </span>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   탭 5개: generations.md / minor-major.md / g1.md / zgc.md / tuning.sh
    //   stepIdx 가 곧 활성 탭 인덱스가 된다.
    // ─────────────────────────────────────────────────────
    function CodeViewer({ stepIdx, total, onTab, codes }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      const code = codes[stepIdx];

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 5개 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <div className="flex gap-0.5 ml-2 overflow-x-auto">
              {codes.map((c, i) => {
                const active = i === stepIdx;
                return (
                  <button
                    key={c.filename}
                    onClick={() => onTab(i)}
                    className={`px-2.5 py-1 text-[10px] font-mono rounded-t transition whitespace-nowrap ${
                      active
                        ? 'bg-[#282c34] text-lime-300 border-t border-x border-slate-600'
                        : 'bg-[#21252b] text-slate-500 hover:text-slate-300'
                    }`}
                  >
                    {c.filename}
                  </button>
                );
              })}
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[44rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-lime-500/15 border-l-2 border-lime-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines · {code.filename}</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];
      const codes = STEPS.map((s) => s.code);

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter II-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-lime-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. JVM 기초 &gt; Chapter 1. 메모리와 GC</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">II-1-2. GC와 성능 — Generational / G1 / ZGC</h1>
                  <p className="text-sm text-slate-500 mt-0.5">Heap 세대 구조부터 G1·ZGC, 그리고 실무 GC 튜닝까지</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer stepIdx={stepIdx} total={STEPS.length} codes={codes} onTab={setStepIdx} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-lime-50 border-2 border-lime-300 rounded-xl p-3 text-sm text-lime-900">
                💡 정리: Heap은 <strong>Young (Eden + Survivor) / Old / Metaspace</strong> 로 나뉜다. <strong>Minor GC</strong> 는 빠르고 자주, <strong>Major GC</strong> 는 느리고 드물게. <strong>G1</strong> 은 Region 단위 Garbage-First 로 일정한 짧은 STW 를, <strong>ZGC</strong> 는 Colored Pointer 로 Heap 크기와 무관한 sub-millisecond STW 를 보장한다. 튜닝은 <strong>측정 → 한 옵션 변경 → 재측정</strong> 사이클로.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-lime-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-lime-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-lime-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-lime-600 text-white hover:bg-lime-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['Heap', 'Young/Old', 'Eden', 'Survivor', 'Minor GC', 'Major GC', 'G1', 'ZGC', 'STW', '-Xmx', '-XX:+UseZGC', 'jstat'].map((kw) => (
                <span key={kw} className="bg-lime-50 text-lime-700 px-3 py-1 rounded-full text-xs font-medium border border-lime-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-02-01-classloader-memory.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; II-1-1 ClassLoader & Memory</a>
              <a href="./chapter-02-03-why-build-tool.html" className="text-lime-700 hover:text-lime-900 font-medium">II-1-3 Build Tool &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
