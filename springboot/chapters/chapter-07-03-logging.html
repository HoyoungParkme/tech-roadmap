  <!--
    VII-2-1. SLF4J + Logback 설정
    학습 목표: Spring Boot 기본 로깅 스택(SLF4J + Logback)을
              5단계로 시각화한다.
              (1) Logger 선언 (2) 로그 레벨 (3) logback-spring.xml
              (4) 파일 + 콘솔 (5) JSON 로그 (운영)
    핵심 비유: "방송국의 마이크와 송신탑" — SLF4J가 마이크(인터페이스),
              Logback이 송신탑(실제 전파). 레벨로 누구에게 들릴지 결정.
    패턴: fastapi v1 — 좌(LiveDataPane: 로그 레벨별 메시지 출력 mock)
                       / 우(VSCode CodeViewer 5탭)
    색상: lime
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — SLF4J + Logback 학습 흐름
    //   1) Logger logger = LoggerFactory.getLogger() — 로거 선언
    //   2) 로그 레벨 (TRACE / DEBUG / INFO / WARN / ERROR)
    //   3) logback-spring.xml 설정 — 외부 파일 제어
    //   4) 파일 + 콘솔 Appender 동시 출력
    //   5) JSON 로그 (운영 — ELK/Loki 수집용)
    //
    //   left          : 현재 활성 로그 레벨 (root threshold)
    //   logs          : 출력 시도되는 로그 [{ level, msg, ts, pkg }]
    //                    + visible 플래그 (threshold 비교)
    //   appenders     : 출력 대상 [{ name, kind, dest, color, on }]
    //                    kind: 'console' | 'file' | 'json'
    //   keyPoint      : 한 줄 핵심
    //   code          : 우측 코드 뷰
    // ─────────────────────────────────────────────────────
    const LEVEL_ORDER = ['TRACE', 'DEBUG', 'INFO', 'WARN', 'ERROR'];
    const LEVEL_RANK = Object.fromEntries(LEVEL_ORDER.map((l, i) => [l, i]));

    const LEVEL_STYLE = {
      TRACE: { bg: 'bg-slate-100',   text: 'text-slate-700',   bar: 'bg-slate-400',   tag: 'bg-slate-500' },
      DEBUG: { bg: 'bg-sky-50',      text: 'text-sky-800',     bar: 'bg-sky-400',     tag: 'bg-sky-500' },
      INFO:  { bg: 'bg-emerald-50',  text: 'text-emerald-800', bar: 'bg-emerald-500', tag: 'bg-emerald-600' },
      WARN:  { bg: 'bg-amber-50',    text: 'text-amber-800',   bar: 'bg-amber-500',   tag: 'bg-amber-600' },
      ERROR: { bg: 'bg-rose-50',     text: 'text-rose-800',    bar: 'bg-rose-500',    tag: 'bg-rose-600' },
    };

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      logger: {lang:'java', filename:'logger.java', lines:[
        '// Step 1. Logger 선언 — SLF4J 인터페이스 + Logback 구현체',
        'package com.example.myapp.user;',
        '',
        'import org.slf4j.Logger;',
        'import org.slf4j.LoggerFactory;',
        'import org.springframework.stereotype.Service;',
        '',
        '@Service',
        'public class UserService {',
        '',
        '    // SLF4J 인터페이스 — 실제 구현은 Logback 이 주입',
        '    // private static final 관례: 외부 비공개 + 인스턴스당 1개 + 불변',
        '    private static final Logger log =',
        '        LoggerFactory.getLogger(UserService.class);',
        '',
        '    public User findById(Long id) {',
        '        log.info("사용자 조회 시작: id={}", id);',
        '',
        '        User user = repository.findById(id);',
        '',
        '        // ✅ {} 플레이스홀더 — 안전 + 빠름',
        '        log.info("사용자 조회 완료: id={}, name={}", id, user.getName());',
        '',
        '        // ❌ 문자열 + 연결 — 로그 레벨 OFF 라도 문자열 합성 비용 발생',
        '        // log.info("사용자 조회 완료: id=" + id);',
        '',
        '        return user;',
        '    }',
        '}',
        '',
        '// 💡 Lombok 을 쓰면 한 줄로 끝',
        '// @Slf4j',
        '// @Service',
        '// public class UserService { log.info(...); }',
        '',
        '// 📝 LoggerFactory.getLogger() 는?',
        '//    인터페이스: org.slf4j.Logger',
        '//    실제 구현: ch.qos.logback.classic.Logger',
        '//    SLF4J="마이크", Logback="송신탑"',
        '',
        '// 🎯 SLF4J API 만 보면 → Log4j2 로 바꿔도 코드 그대로.',
      ]},
      levels: {lang:'properties', filename:'levels.md', lines:[
        '# Step 2. 로그 레벨 — application.properties 한 줄로 제어',
        '',
        '# ─── 전역 기본 레벨 (Root Logger) ───',
        '# 아무것도 안 적으면 Spring Boot 기본값 = INFO',
        'logging.level.root=INFO',
        '',
        '# ─── 패키지별 레벨 — 점(.)으로 트리 구조 ───',
        '# 내 코드만 더 자세히 보고 싶을 때',
        'logging.level.com.example.myapp=DEBUG',
        '',
        '# 특정 클래스만 핀포인트로',
        'logging.level.com.example.myapp.user.UserService=TRACE',
        '',
        '# ─── 라이브러리 노이즈 줄이기 ───',
        '# Hibernate SQL 너무 시끄러움 → WARN 으로 올림',
        'logging.level.org.hibernate=WARN',
        'logging.level.org.springframework=INFO',
        '',
        '# ─── 레벨 테이블 (낮음 → 높음) ───',
        '#   TRACE  : 가장 상세 — 메소드 진입/탈출, 변수 값',
        '#   DEBUG  : 개발용 상세 — SQL, 캐시 히트/미스',
        '#   INFO   : 일반 정보 — 요청 처리, 시작/종료      ← 운영 기본',
        '#   WARN   : 경고 — 비정상이지만 동작은 함 (지연, 재시도)',
        '#   ERROR  : 오류 — 즉시 대응 필요 (예외, 실패)',
        '',
        '# ─── 임계값 규칙 ───',
        '#   설정 = INFO  →  INFO / WARN / ERROR 출력, 그 아래 무시',
        '#   설정 = DEBUG →  DEBUG 부터 위로 모두 출력',
        '#   설정 = ERROR →  ERROR 만 출력 (가장 조용)',
        '',
        '# ─── 실무 가이드 ───',
        '#   로컬 개발 : root=INFO, 내 패키지=DEBUG',
        '#   운영      : root=INFO (또는 WARN)',
        '#   장애 시   : 핀포인트 패키지만 일시 DEBUG',
        '',
        '# ─── 환경별 분리 (Spring Profile) ───',
        '# application-dev.properties  → DEBUG',
        '# application-prod.properties → INFO',
        '# 실행:  java -jar app.jar --spring.profiles.active=prod',
        '',
        '# ─── 패턴 (콘솔 출력 형식) ───',
        'logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n',
        '#   %d 날짜  %-5level 레벨  %thread 스레드  %logger 로거명  %msg 메시지  %n 줄바꿈',
      ]},
      logbackXml: {lang:'xml', filename:'logback-xml.xml', lines:[
        '<?xml version="1.0" encoding="UTF-8"?>',
        '<!--',
        '  Step 3. logback-spring.xml',
        '    위치: src/main/resources/logback-spring.xml',
        '    파일명에 "-spring" 이 붙으면 Spring Profile 분기 사용 가능.',
        '-->',
        '<configuration>',
        '',
        '    <!-- ─── 1. 변수 정의 (재사용) ─── -->',
        '    <property name="LOG_PATTERN"',
        '              value="%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"/>',
        '    <property name="LOG_DIR" value="logs"/>',

        '    <springProfile name="dev">',
        '        <root level="INFO">',
        '            <appender-ref ref="CONSOLE"/>',
        '        </root>',
        '        <logger name="com.example.myapp" level="DEBUG"/>',
        '    </springProfile>',
        '',
        '    <!-- 운영 환경: 전체 INFO, Hibernate 시끄러움 차단 -->',
        '    <springProfile name="prod">',
        '        <root level="INFO">',
        '            <appender-ref ref="CONSOLE"/>',
        '        </root>',
        '        <logger name="org.hibernate" level="WARN"/>',
        '        <logger name="org.springframework" level="INFO"/>',
        '    </springProfile>',
        '',
        '    <!-- ─── 4. 기본 (Profile 미지정 시) ─── -->',

        '',
        '<!--',

        '    - logback.xml        : 표준 (Spring 기능 못 씀)',

        '',
        '  📝 인식 우선순위: logback-spring.xml > logback.xml',
        '',
        '  ⚠ logback.xml 은 Spring 컨텍스트 전에 로드 → Profile 사용 불가',
        '-->',
      ]},
      appenderMd: {lang:'xml', filename:'appender.md', lines:[
        '<?xml version="1.0" encoding="UTF-8"?>',
        '<!--',
        '  Step 4. 파일 + 콘솔 동시 출력 (RollingFileAppender)',

        '    - 파일 : 보존 + 검색 + 날짜별 롤링',
        '-->',
        '<configuration>',
        '',
        '    <property name="LOG_DIR" value="logs"/>',
        '    <property name="APP_NAME" value="myapp"/>',

        '',
        '    <!-- ────────────────────────────────────────── -->',
        '    <!-- Appender 1: CONSOLE — 실시간 stdout         -->',
        '    <!-- ────────────────────────────────────────── -->',

        '',
        '    <!-- ────────────────────────────────────────── -->',

        '    <appender name="FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">',
        '        <!-- 현재 활성 로그 파일 -->',
        '        <file>${LOG_DIR}/${APP_NAME}.log</file>',
        '',
        '        <!-- 롤링 정책: 자정마다 파일 분리 -->',
        '        <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">',
        '            <!-- 어제 분 → app.2026-05-10.log 로 이름 변경 -->',
        '            <fileNamePattern>${LOG_DIR}/${APP_NAME}.%d{yyyy-MM-dd}.log</fileNamePattern>',
        '            <!-- 30일 지난 파일 자동 삭제 -->',
        '            <maxHistory>30</maxHistory>',
        '            <!-- 전체 로그 디렉터리 최대 3GB → 초과 시 오래된 것부터 삭제 -->',
        '            <totalSizeCap>3GB</totalSizeCap>',
        '        </rollingPolicy>',
        '',
        '        <encoder>',

        '    </appender>',
        '',
        '    <!-- ────────────────────────────────────────── -->',

        '    <!-- ────────────────────────────────────────── -->',

        '',
        '</configuration>',
        '',
        '<!--',
        '  📁 결과 — logs/ 디렉터리',

    // ─────────────────────────────────────────────────────
    // CodeViewer — VSCode 스타일 + highlight.js (atom-one-dark)
    //   상단 5탭 (Step 별 다른 코드 = 다른 파일명)
    //   라인 번호 + 강조 라인 + 푸터
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_KEYS = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ steps, stepIdx, onTabClick }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      const code = steps[stepIdx].code;

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 5탭 */}
          <div className="bg-[#21252b] border-b border-slate-700">
            <div className="px-4 py-2 flex items-center gap-2 border-b border-slate-700/60">
              <div className="flex gap-1.5">
                <span className="w-3 h-3 rounded-full bg-red-500"></span>
                <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span className="w-3 h-3 rounded-full bg-green-500"></span>
              </div>
              <span className="text-xs text-slate-400 ml-2 font-mono">logging-config/</span>
              <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
            </div>
            <div className="flex overflow-x-auto">
              {TAB_KEYS.map((key) => {
                const active = key === code.filename;
                return (
                  <button
                    key={key}
                    onClick={() => onTabClick(STEPS.findIndex((x) => x.code.filename === key))}
                    className={`px-3 py-1.5 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                      active
                        ? 'bg-[#282c34] text-lime-300 border-t-2 border-t-lime-400'
                        : 'bg-[#21252b] text-slate-400 hover:bg-[#2c313a] hover:text-slate-200'
                    }`}
                  >
                    {key}
                  </button>
                );
              })}
            </div>
          </div>

          {/* hljs 토큰화 (hidden) */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[42rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-lime-500/15 border-l-2 border-lime-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}

                    </div>

            </pre>
          </div>

            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {steps.length}</span>
          </div>
        </div>
      );

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter VII-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-lime-600 text-white flex items-center justify-center rounded-full font-bold text-sm">VII</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part VII. 운영과 모니터링 &gt; Chapter 2. 로깅</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">VII-2-1. SLF4J + Logback 설정</h1>
                  <p className="text-sm text-slate-500 mt-0.5">로거 선언 → 레벨 → logback-spring.xml → 파일+콘솔 → JSON</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer steps={STEPS} stepIdx={stepIdx} onTabClick={(i) => { setStepIdx(i); setIsPlaying(false); }} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-lime-50 border-2 border-lime-300 rounded-xl p-3 text-sm text-lime-900">
                💡 정리: SLF4J 로 로깅 API 통일, Logback 으로 실제 출력. 레벨로 <strong>무엇을</strong>, Appender 로 <strong>어디로</strong>, JSON 인코더로 <strong>운영 수집기에</strong> 보낸다. 다음(VII-2-2)에서는 Actuator 헬스체크/메트릭을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-lime-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-lime-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-lime-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-lime-600 text-white hover:bg-lime-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['SLF4J', 'Logback', '@Slf4j', 'LoggerFactory', 'TRACE/DEBUG/INFO/WARN/ERROR', 'logback-spring.xml', 'RollingFileAppender', 'JSON', 'MDC'].map((kw) => (
                <span key={kw} className="bg-lime-50 text-lime-700 px-3 py-1 rounded-full text-xs font-medium border border-lime-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-07-02-docker.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; VII-1-2 Docker</a>
              <a href="./chapter-07-04-actuator.html" className="text-lime-700 hover:text-lime-900 font-medium">VII-2-2 Actuator &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
