              커스텀 예외 → @ControllerAdvice → 통일 에러 응답 → 로깅/알림
              까지의 5단계 진화 흐름을 시각화한다.
    핵심 비유: "예외는 한 곳에서, 응답은 한 모양으로."
    패턴: fastapi v1 — 좌(LiveDataPane: 예외 발생 → @ControllerAdvice 가로챔

    // ─────────────────────────────────────────────────────
    // RequestFlow — 요청 처리 흐름 (좌상단)
    //   각 레이어가 어떤 상태인지 색으로 표시
    //   throw/catch/log 에 따라 lime/rose/amber 강조
    // ─────────────────────────────────────────────────────
    function RequestFlow({ layers }) {
      const stateMap = {
        normal: { bg: 'bg-slate-50',  border: 'border-slate-200', text: 'text-slate-700', tag: '·',     tagBg: 'bg-slate-200',  tagText: 'text-slate-600'  },
        pass:   { bg: 'bg-sky-50',    border: 'border-sky-300',   text: 'text-sky-800',   tag: 'pass',  tagBg: 'bg-sky-200',    tagText: 'text-sky-800'    },
        throw:  { bg: 'bg-rose-50',   border: 'border-rose-400',  text: 'text-rose-800',  tag: 'throw', tagBg: 'bg-rose-500',   tagText: 'text-white'      },
        catch:  { bg: 'bg-lime-50',   border: 'border-lime-400',  text: 'text-lime-800',  tag: 'catch', tagBg: 'bg-lime-500',   tagText: 'text-white'      },
        log:    { bg: 'bg-amber-50',  border: 'border-amber-400', text: 'text-amber-800', tag: 'log',   tagBg: 'bg-amber-500',  tagText: 'text-white'      },
      };
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            요청 처리 흐름
          </div>
          <div className="p-2.5 space-y-1.5">
            {layers.map((l, i) => {
              const c = stateMap[l.state] || stateMap.normal;
              return (
                <div key={l.id}>
                  <div className={`flex items-center gap-2 px-2 py-1.5 rounded border ${c.bg} ${c.border}`}>
                    <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded ${c.tagBg} ${c.tagText} font-bold uppercase tracking-wider flex-shrink-0`}>
                      {c.tag}
                    </span>
                    <span className={`text-[11px] font-bold ${c.text} flex-shrink-0`}>{l.name}</span>
                    <span className="text-[10px] text-slate-600 font-mono ml-auto truncate">{l.role}</span>
                  </div>
                  {i < layers.length - 1 && (
                    <div className="text-center text-slate-400 text-xs leading-none mt-0.5">↓</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ResponseCard — 클라이언트가 받는 응답 (가운데)
    //   status / code / message + body JSON
    // ─────────────────────────────────────────────────────
    function ResponseCard({ response, focus }) {
      const isError = focus === 'antipattern';
      const isCustom = focus === 'custom-exception';
      const accentBorder = isError
        ? 'border-rose-300'
        : isCustom
        ? 'border-amber-300'
        : 'border-lime-300';
      const accentHeader = isError
        ? 'bg-rose-100 text-rose-700'
        : isCustom
        ? 'bg-amber-100 text-amber-800'
        : 'bg-lime-100 text-lime-800';
      return (
        <div className={`bg-white rounded-lg border-2 ${accentBorder} overflow-hidden`}>
          <div className={`${accentHeader} px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider flex items-center justify-between`}>
            <span>클라이언트 응답</span>
            <span className="font-mono">HTTP {response.status}</span>
          </div>
          <div className="p-2.5 space-y-1.5">
            <div className="grid grid-cols-3 gap-1.5 text-[10px]">
              <div className="bg-slate-50 border border-slate-200 rounded p-1.5">
                <div className="text-[8px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">status</div>
                <div className="font-mono text-slate-800">{response.status}</div>
              </div>
              <div className="bg-slate-50 border border-slate-200 rounded p-1.5">
                <div className="text-[8px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">code</div>
                <div className="font-mono text-slate-800 truncate">{response.code}</div>
              </div>
              <div className="bg-slate-50 border border-slate-200 rounded p-1.5">
                <div className="text-[8px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">message</div>
                <div className="font-mono text-slate-800 text-[9px] truncate" title={response.message}>{response.message}</div>
              </div>
            </div>
            <pre className="bg-slate-900 text-emerald-300 text-[10px] font-mono p-2 rounded overflow-x-auto m-0 leading-snug whitespace-pre">{response.body}</pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // SideEffectList — 부수 작업/메모 (하단)
    // ─────────────────────────────────────────────────────
    function SideEffectList({ items }) {
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            부수 효과 / 운영 영향
          </div>
          <div className="p-2.5 space-y-1">
            {items.map((it) => (
              <div key={it.id} className="flex items-start gap-2 text-[11px]">
                <span className="text-lime-500 font-bold flex-shrink-0">•</span>
                <div className="flex-1">
                  <span className="font-bold text-slate-800">{it.label}</span>
                  <span className="text-slate-500 ml-1.5 font-mono text-[10px]">— {it.target}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 변환 흐름 화살표 (수직)
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-lime-700 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-lime-500 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    //   상단 : 요청 처리 흐름 (Controller → Service → Handler)
    //   ↓ 예외 가로챔
    //   중간 : 클라이언트 응답
    //   ↓ 운영 영향
    //   하단 : 부수 작업 (로깅/알림/유지보수)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">⚡ 예외 발생 → @ControllerAdvice → 통일 응답</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {/* 1) 요청 처리 흐름 */}
            <RequestFlow layers={step.layers} />

            <FlowArrow label="@ControllerAdvice 가로챔" />

            {/* 2) 클라이언트 응답 */}
            <ResponseCard response={step.response} focus={step.focus} />

            <FlowArrow label="운영 영향" />

            {/* 3) 부수 효과 */}
            <SideEffectList items={step.sideEffect} />
          </div>

          {/* 핵심 포인트 박스 */}
          <div className="mt-3 bg-lime-50 border-l-4 border-lime-500 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-lime-700 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-lime-900 leading-snug">{step.keyPoint}</p>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-400"></span>pass (통과)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-500"></span>throw (던짐)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-lime-500"></span>catch (가로챔)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-500"></span>log (로그/알림)
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    //   탭 5개 (각 step의 코드 파일)
    //   탭 클릭 시 해당 step으로 이동 + 코드 렌더
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_KEYS = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ stepIdx, onTabClick, total }) {
      const code = STEPS[stepIdx].code;
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">GlobalExceptionHandler</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* 파일 탭 5개 */}
          <div className="bg-[#21252b] flex border-b border-slate-700 overflow-x-auto">
            {TAB_KEYS.map((key) => {
              const active = key === code.filename;
              return (
                <button
                  key={key}
                  onClick={() => onTabClick(STEPS.findIndex((x) => x.code.filename === key))}
                  className={`px-3 py-1.5 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                    active
                      ? 'bg-[#282c34] text-lime-300 border-t-2 border-t-lime-400'
                      : 'text-slate-500 hover:text-slate-300 hover:bg-slate-800/50'
                  }`}
                >
                  {key}
                </button>
              );
            })}
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[42rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-lime-500/15 border-l-2 border-lime-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    //   - 4 버튼 (처음 / 이전 / 재생 / 다음)
    //   - 키보드 ←/→
    //   - 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; 챕터 목록</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter VI-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-lime-600 text-white flex items-center justify-center rounded-full font-bold text-sm">VI</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part VI. Spring Boot 실전 &gt; Chapter 2. 견고한 백엔드</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">VI-2-2. 전역 예외 처리 — @ControllerAdvice</h1>
                  <p className="text-sm text-slate-500 mt-0.5">try-catch 도배에서 통일 에러 응답·로깅·알림까지 한 곳으로 모으기</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer stepIdx={stepIdx} onTabClick={setStepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-lime-50 border-2 border-lime-400 rounded-xl p-3 text-sm text-lime-900">
                💡 정리: 예외 처리는 <strong>한 통로(@ControllerAdvice)</strong>로 모아라. 응답은 <strong>{'{ status, code, message }'}</strong>로 통일하고, <strong>4xx는 WARN / 5xx는 ERROR + 알림</strong>으로 운영 추적까지 한 번에 책임진다. 다음(VI-2-3)에서는 단위 테스트 작성 패턴을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-lime-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-lime-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-lime-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-lime-600 text-white hover:bg-lime-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['@ControllerAdvice', '@ExceptionHandler', '@RestControllerAdvice', 'RuntimeException', 'ErrorResponse', 'MDC', 'SLF4J', 'traceId'].map((kw) => (
                <span key={kw} className="bg-lime-50 text-lime-700 px-3 py-1 rounded-full text-xs font-medium border border-lime-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./chapter-06-02-three-layer.html" className="text-lime-700 hover:text-lime-900 font-medium">&larr; VI-2-1 3계층 아키텍처</a>
              <a href="./chapter-06-04-unit-test.html" className="text-lime-700 hover:text-lime-900 font-medium">VI-2-3 단위 테스트 &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
