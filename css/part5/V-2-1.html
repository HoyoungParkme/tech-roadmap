<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 학습 — V-2-1. 흔한 CSS 버그 10</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐛</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    CSS V-2-1 — 흔한 CSS 버그 10
    학습 목표: 실무에서 반복되는 CSS 함정 10가지를 증상 → 원인 → 해결책 순서로 잡는다.
              박스 크기 → 쌓임/높이 → 인라인/플렉스 → 뷰포트/좌표 기준 → 잘림/위치 기준.
    패턴: v1 — 좌(LiveDataPane: 깨진 렌더 vs 고친 렌더를 실제 CSS로 나란히/토글 시연)
              우(VSCode CodeViewer: buggy.css → fixed.css 대비, 원인/수정 라인 하이라이트)
    색상: blue/sky (CSS 브랜드 #1572B6 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // BugVisual — 각 버그를 "실제 CSS"로 재현하는 미니 렌더
    //   id      : 버그 식별자
    //   variant : 'broken' | 'fixed'
    //   culprit : true 면 원인이 되는 스타일을 빨간 점선으로 강조
    // 대부분 실제 CSS로 반응하도록 인라인 스타일로 구현했다(개념 왜곡 없이 진짜 재현).
    // ─────────────────────────────────────────────────────
    const IMG_SVG =
      "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='40'><rect width='64' height='40' fill='%231572B6'/><text x='32' y='25' font-size='11' fill='white' text-anchor='middle'>IMG</text></svg>";

    function BugVisual({ id, variant, culprit }) {
      const broken = variant === 'broken';
      const cul = (on) => (on && culprit ? '2px dashed #dc2626' : undefined);

      switch (id) {
        // 1) margin collapse — 자식의 margin-top 이 부모 밖으로 빠져나간다
        case 'margin-collapse':
          return (
            <div style={{ outline: '2px solid #94a3b8', background: '#c7d2fe',
                          overflow: broken ? 'visible' : 'hidden', minHeight: 54 }}>
              <div style={{ marginTop: 18, background: '#1572B6', color: '#fff',
                            padding: '5px 8px', fontSize: 11, textAlign: 'center',
                            outline: cul(broken) }}>
                자식 · margin-top:18px
              </div>
            </div>
          );

        // 2) box-sizing — width:100% + padding/border 가 부모를 넘친다
        case 'box-sizing':
          return (
            <div style={{ width: 160, outline: '2px solid #94a3b8', padding: 2 }}>
              <div style={{
                width: '100%', padding: 14, border: '3px solid #0d5a92',
                background: '#dbeafe', color: '#0d5a92', fontSize: 11, textAlign: 'center',
                boxSizing: broken ? 'content-box' : 'border-box',
                outline: cul(broken),
              }}>
                width:100% + padding 14
              </div>
            </div>
          );

        // 3) z-index — 조상의 transform 이 만든 쌓임 맥락에 갇힌다
        case 'z-index':
          return (
            <div style={{ position: 'relative', height: 84 }}>
              <div style={{ position: 'absolute', inset: 0,
                            transform: broken ? 'translateZ(0)' : 'none',
                            outline: cul(broken) }}>
                <div style={{ position: 'absolute', left: 8, top: 10, width: 96, height: 48,
                              background: '#1572B6', color: '#fff', zIndex: 9999,
                              fontSize: 10, padding: 4 }}>
                  A · z-index:9999
                </div>
              </div>
              <div style={{ position: 'absolute', left: 60, top: 34, width: 96, height: 40,
                            background: '#f59e0b', color: '#3a2a00', zIndex: 1,
                            fontSize: 10, padding: 4 }}>
                B · z-index:1
              </div>
            </div>
          );

        // 4) height:100% — 부모에 높이가 없으면 자식은 콘텐츠 높이로 접힌다
        case 'height-100':
          return (
            <div style={{ height: 96, outline: '2px solid #94a3b8', background: '#faf7ef' }}>
              <div style={{ height: broken ? 'auto' : '100%', outline: cul(broken) }}>
                <div style={{ height: '100%', background: '#1572B6', color: '#fff',
                              fontSize: 11, padding: 6 }}>
                  자식 · height:100% (부모를 채우려 함)
                </div>
              </div>
            </div>
          );

        // 5) flex item 안 줄어듦 — min-width:auto 로 콘텐츠보다 못 줄어든다
        case 'flex-min':
          return (
            <div style={{ display: 'flex', gap: 6, width: 190, outline: '2px solid #94a3b8', padding: 2 }}>
              <div style={{
                flex: 1, minWidth: broken ? 'auto' : 0,
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                background: '#dbeafe', color: '#0d5a92', fontSize: 11, padding: '5px 6px',
                outline: cul(broken),
              }}>
                아주아주긴텍스트가줄바꿈없이한줄로쭉이어집니다
              </div>
              <div style={{ width: 44, flexShrink: 0, background: '#1572B6', color: '#fff',
                            fontSize: 10, padding: '5px 4px', textAlign: 'center' }}>고정</div>
            </div>
          );

        // 6) 이미지 아래 미세 여백 — inline 기준선 때문에 아래 4px 틈
        case 'img-gap':
          return (
            <div style={{ display: 'inline-block', background: '#f59e0b',
                          border: '2px solid #b45309' }}>
              <img src={IMG_SVG} alt="데모 이미지"
                   style={{ display: broken ? 'inline' : 'block', outline: cul(broken) }} />
            </div>
          );

        // 7) 100vw 가로 스크롤 — 100vw 는 스크롤바 폭까지 포함(스키매틱)
        case 'vw-scroll':
          return (
            <div style={{ fontSize: 10 }}>
              <div style={{ position: 'relative', height: 22, background: '#e2e8f0',
                            borderRadius: 4, marginBottom: 6 }}>
                <div style={{ position: 'absolute', right: 0, top: 0, bottom: 0, width: 22,
                              background: '#94a3b8', borderRadius: '0 4px 4px 0',
                              display: 'flex', alignItems: 'center', justifyContent: 'center' }}>▊</div>
                <div style={{ position: 'absolute', left: 6, top: 4, color: '#475569' }}>
                  뷰포트(스크롤바 제외 콘텐츠 폭)
                </div>
              </div>
              <div style={{ position: 'relative', height: 22,
                            background: broken ? '#fecaca' : '#bbf7d0',
                            width: broken ? 'calc(100% + 22px)' : '100%',
                            borderRadius: 4, outline: cul(broken),
                            display: 'flex', alignItems: 'center', paddingLeft: 6,
                            color: broken ? '#7f1d1d' : '#14532d' }}>
                {broken ? 'width:100vw → 스크롤바 22px 만큼 넘침 →' : 'width:100% → 콘텐츠 폭에 딱 맞음'}
              </div>
            </div>
          );

            cause: 'overflow:hidden 은 넘치는 자식(밖으로 나가는 것 포함)을 전부 클리핑한다.',
            fix: '잘리는 부모의 overflow 를 visible 로 두거나, 튀어나오는 요소를 그 부모 밖으로 옮긴다.' },
          { id: 'absolute-ref', name: '⑩ absolute 기준이 엉뚱하다 (relative 누락)',
            symptom: 'absolute 자식이 원하던 부모가 아니라 페이지 구석에 가서 붙는다.',
            cause: '기준으로 삼으려던 부모에 position:relative 가 없어 더 바깥/최상위를 기준으로 잡는다.',
            fix: '기준이 될 부모에 position:relative 를 명시해 좌표 원점을 그 안으로 고정한다.' },
        ],
        code: {
          buggy: [
            '/* buggy.css — 잘림/위치 사고 */',
            '',
            '/* ⑨ overflow:hidden 이 튀어나온 것을 자른다 */',
            '.card {',
            '  overflow: hidden;  /* 툴팁/그림자까지 클리핑 */',
            '}',
            '.card .tooltip {',
            '  position: absolute;',
            '  top: -20px;        /* 위로 나가다 잘림 */',
            '}',
            '',
            '/* ⑩ 기준 부모에 relative 누락 */',
            '.card2 {',
            '  /* position 없음 → static */',
            '}',
            '.card2 .badge {',
            '  position: absolute;  /* 엉뚱한 조상 기준 */',
            '  top: 4px; right: 4px;',
            '}',
          ],
          fixed: [
            '/* fixed.css — 잘림 해제 & 기준 고정 */',
            '',
            '/* ⑨ 튀어나와야 하는 부모는 visible */',
            '.card {',
            '  overflow: visible;  /* 툴팁이 온전히 보인다 */',
            '}',
            '.card .tooltip {',
            '  position: absolute;',
            '  top: -20px;',
            '}',
            '',
            '/* ⑩ 기준 부모에 relative 명시 */',
            '.card2 {',
            '  position: relative;  /* 좌표 원점 = 이 박스 */',
            '}',
            '.card2 .badge {',
            '  position: absolute;  /* 이제 카드 기준 */',
            '  top: 4px; right: 4px;',
            '}',
          ],
          buggyHi: [5, 14],
          fixHi: [5, 14],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 보기 모드 토글 — 나란히 / 깨진 화면 / 고친 화면
    // ─────────────────────────────────────────────────────
    function ViewToggle({ mode, setMode }) {
      const opts = [
        { key: 'both',   label: '나란히 비교' },
        { key: 'broken', label: '깨진 화면' },
        { key: 'fixed',  label: '고친 화면' },
      ];
      return (
        <div className="inline-flex rounded-lg border border-sky-300 overflow-hidden text-[11px]">
          {opts.map((o) => (
            <button
              key={o.key}
              onClick={() => setMode(o.key)}
              className={`px-2.5 py-1 transition ${
                mode === o.key ? 'bg-sky-600 text-white font-bold' : 'bg-white text-sky-800 hover:bg-sky-50'
              }`}
            >{o.label}</button>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 하나의 버그 카드 — 증상/원인/해결 + 깨진·고친 렌더
    // ─────────────────────────────────────────────────────
    function RenderFrame({ tone, title, id, variant, culprit }) {
      const isBroken = tone === 'broken';
      return (
        <div className={`flex-1 rounded-lg border p-2 ${
          isBroken ? 'border-red-300 bg-red-50/60' : 'border-emerald-300 bg-emerald-50/60'
        }`}>
          <div className={`text-[10px] font-bold mb-1.5 flex items-center gap-1 ${
            isBroken ? 'text-red-700' : 'text-emerald-700'
          }`}>
            <span>{isBroken ? '✗' : '✓'}</span><span>{title}</span>
          </div>
          <div className="rounded bg-white p-2 flex items-center justify-center min-h-[104px] overflow-hidden">
            <BugVisual id={id} variant={variant} culprit={culprit} />
          </div>
        </div>
      );
    }

    function BugCard({ bug, mode, culprit }) {
      return (
        <div className="rounded-lg border border-sky-200 bg-white p-3">
          <div className="text-[13px] font-bold text-sky-900 mb-2">{bug.name}</div>

          <div className="flex gap-2 mb-2.5">
            {(mode === 'both' || mode === 'broken') && (
              <RenderFrame tone="broken" title="깨진 렌더" id={bug.id} variant="broken" culprit={culprit} />
            )}
            {(mode === 'both' || mode === 'fixed') && (
              <RenderFrame tone="fixed" title="고친 렌더" id={bug.id} variant="fixed" culprit={false} />
            )}
          </div>

          <dl className="space-y-1 text-[11px]">
            <div className="flex gap-1.5">
              <dt className="shrink-0 w-9 text-red-700 font-bold">증상</dt>
              <dd className="text-slate-700">{bug.symptom}</dd>
            </div>
            <div className="flex gap-1.5">
              <dt className="shrink-0 w-9 text-amber-700 font-bold">원인</dt>
              <dd className="text-slate-700">{bug.cause}</dd>
            </div>
            <div className="flex gap-1.5">
              <dt className="shrink-0 w-9 text-emerald-700 font-bold">해결</dt>
              <dd className="text-slate-700">{bug.fix}</dd>
            </div>
          </dl>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 두 버그의 깨진/고친 렌더를 실제 CSS로 시연
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const [mode, setMode] = useState('both');
      const [culprit, setCulprit] = useState(true);

      // 단계가 바뀌면 기본 보기로 되돌린다
      useEffect(() => { setMode('both'); setCulprit(true); }, [step]);

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{step.icon}</span><span>버그 재현소 — {step.label}</span>
            </h3>
            <ViewToggle mode={mode} setMode={setMode} />
          </div>

          <label className="flex items-center gap-1.5 text-[11px] text-sky-800 mb-3 cursor-pointer select-none">
            <input type="checkbox" checked={culprit} onChange={(e) => setCulprit(e.target.checked)} />
            깨진 렌더에서 <span className="font-bold text-red-700">원인 스타일</span>을 빨간 점선으로 강조
          </label>

          <div className="space-y-3 flex-1">
            {step.bugs.map((b) => (
              <BugCard key={b.id} bug={b} mode={mode} culprit={culprit} />
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: buggy.css → fixed.css 대비
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: buggy, 1: fixed
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: 'buggy.css', lines: step.code.buggy, highlight: step.code.buggyHi, tone: 'red' },
        { name: 'fixed.css', lines: step.code.fixed, highlight: step.code.fixHi,   tone: 'emerald' },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: 'css' }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      const hiBar = file.tone === 'red'
        ? 'bg-red-400/15 border-red-400'
        : 'bg-emerald-400/15 border-emerald-400';

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab
                      ? (f.tone === 'red' ? 'bg-[#282c34] text-red-300 font-bold' : 'bg-[#282c34] text-emerald-300 font-bold')
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {i === 0 ? '🐛 ' : '✅ '}{f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">css</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className="text-slate-200 language-css">
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? `${hiBar} border-l-2 -ml-3 pl-2` : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{tab === 0 ? '버그 CSS — 무엇이 잘못됐나' : '수정 CSS — 근본 해결'}</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅴ. 실무 체계</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">V-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">흔한 CSS 버그 10</h1>
                <p className="text-sm text-sky-800/80">실무에서 반복되는 CSS 함정 10가지 — 증상 → 원인 → 해결</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`} />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측에서 "깨진/고친 화면" 토글과 원인 강조를 켜보라</div>

            {/* 마지막 단계 정리 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 흔한 CSS 버그 10 — 한 줄 처방</div>
                <ol className="list-decimal list-inside space-y-0.5 text-[13px] text-slate-700">
                  <li>margin collapse → 부모에 <span className="font-mono">overflow:hidden</span> 등으로 BFC</li>
                  <li>width 넘침 → 전역 <span className="font-mono">box-sizing:border-box</span></li>
                  <li>z-index 안 먹음 → 조상의 <span className="font-mono">transform/opacity</span> 제거</li>
                  <li>height:100% 안 됨 → 부모에 명시적 높이(또는 flex)</li>
                  <li>flex 안 줄어듦 → 축소 아이템에 <span className="font-mono">min-width:0</span></li>
                  <li>이미지 아래 틈 → <span className="font-mono">img{'{'}display:block{'}'}</span></li>
                  <li>100vw 가로 스크롤 → <span className="font-mono">width:100%</span></li>
                  <li>fixed 깨짐 → transform 조상 밖으로 이동</li>
                  <li>그림자/툴팁 잘림 → 부모 <span className="font-mono">overflow:visible</span></li>
                  <li>absolute 기준 → 기준 부모에 <span className="font-mono">position:relative</span></li>
                </ol>
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['margin collapse', 'box-sizing', 'BFC', 'z-index', '쌓임맥락', 'height100%', 'flex min-width', '이미지baseline', '100vw', 'transform+fixed', 'overflow hidden', 'absolute relative'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
