<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 학습 — V-2-2. 종합: 카드 UI 시스템</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🃏</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    CSS V-2-2 — 종합: 카드 UI 시스템
    학습 목표: 변수·flex·grid·transition·상태를 모두 합쳐 "재사용 가능한 카드 컴포넌트" 하나를 완성한다.
              토큰 정의 → 레이아웃 → hover/focus 상태 → variant → 다크모드를 한 층씩 쌓는다.
    패턴: v1 — 좌(LiveDataPane: 실제 카드 그리드를 진짜 CSS로 렌더, 단계마다 스타일이 누적되어 완성).
              우(VSCode CodeViewer: card.css 진화 + card.html 탭)
    색상: blue/sky (CSS 브랜드 #1572B6 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // card.css — 5개 청크로 쪼갠 카드 시스템. 단계가 오를수록 청크가 "누적"되어
    //   좌측 라이브 카드에 실제로 주입된다(토큰→레이아웃→상태→변형→다크모드).
    //   각 청크는 .card-lab 아래로 스코프되어 페이지 껍데기 스타일과 섞이지 않는다.
    // ─────────────────────────────────────────────────────
    const CSS_CHUNKS = [
      [
        '/* 1) 디자인 토큰 — 색·간격·radius·그림자를 변수로 */',
        '.card-lab {',
        '  --bg: #ffffff;',
        '  --fg: #1f2937;',
        '  --muted: #6b7280;',
        '  --accent: #1572B6;',
        '  --border: #e5e7eb;',
        '  --radius: 12px;',
        '  --gap: 16px;',
        '  --shadow: 0 1px 3px rgba(0,0,0,.12);',
        '  --shadow-hover: 0 10px 24px rgba(21,114,182,.20);',
        '  background: #eef2f7;',
        '  color: var(--fg);',
        '  padding: var(--gap);',
        '  border-radius: var(--radius);',
        '}',
        '.card {',
        '  background: var(--bg);',
        '  color: var(--fg);',
        '  border: 1px solid var(--border);',
        '  border-radius: var(--radius);',
        '  box-shadow: var(--shadow);',
        '  overflow: hidden;',
        '}',
      ],
      [
        '/* 2) 레이아웃 — 반응형 그리드 + 카드 내부 flex */',
        '.card-grid {',
        '  display: grid;',
        '  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));',
        '  gap: var(--gap);',
        '}',
        '.card { display: flex; flex-direction: column; }',
        '.card__media {',
        '  height: 76px;',
        '  background: linear-gradient(135deg, var(--accent), #7cc0f0);',
        '}',
        '.card__body {',
        '  display: flex; flex-direction: column; gap: 6px;',
        '  padding: 14px 14px 0;',
        '}',
        '.card__title { font-weight: 700; font-size: 15px; }',
        '.card__text { color: var(--muted); font-size: 12px; line-height: 1.5; }',
        '.card__actions {',
        '  margin-top: auto;           /* 높이 달라도 버튼은 항상 바닥 */',
        '  display: flex; gap: 8px; padding: 12px 14px;',
        '}',
      ],
      [
        '/* 3) 상태 — hover 상승, focus-visible 접근성 포커스링 */',
        '.card { transition: transform .18s ease, box-shadow .18s ease; }',
        '.card:hover {',
        '  transform: translateY(-4px);',
        '  box-shadow: var(--shadow-hover);',
        '}',
        '.btn {',
        '  border: 1px solid var(--accent);',
        '  background: var(--accent); color: #fff;',
        '  border-radius: 8px; padding: 6px 12px;',
        '  font-size: 12px; cursor: pointer;',
        '  transition: background .15s ease;',
        '}',
        '.btn:hover { background: #0d5a92; }',
        '.btn--ghost { background: transparent; color: var(--accent); }',
        '.btn:focus-visible {           /* 키보드 Tab 에만 링 노출 */',
        '  outline: 3px solid #93c5fd;',
        '  outline-offset: 2px;',
        '}',
      ],
      [
        '/* 4) 변형(modifier) — 변수만 오버라이드해 파생 */',
        '.card--featured {',
        '  --bg: #eef6fd;',
        '  --border: #1572B6;',
        '  --accent: #0d5a92;',
        '  box-shadow: 0 6px 20px rgba(21,114,182,.22);',
        '}',
        '.card--featured .card__media { height: 100px; }',
        '.card--compact { --gap: 8px; }',
        '.card--compact .card__media { height: 52px; }',
        '.badge {',
        '  align-self: flex-start;',
        '  font-size: 10px; font-weight: 700; color: var(--accent);',
        '  background: rgba(21,114,182,.10);',
        '  border-radius: 999px; padding: 2px 8px;',
        '}',
      ],
      [
        '/* 5) 다크모드 — 토큰만 전환, 구조/코드는 그대로 */',
        '.card-lab[data-theme="dark"] {',
        '  --bg: #1e293b;',
        '  --fg: #e2e8f0;',
        '  --muted: #94a3b8;',
        '  --accent: #63b3ed;',
        '  --border: #334155;',
        '  --shadow: 0 1px 3px rgba(0,0,0,.5);',
        '  --shadow-hover: 0 10px 24px rgba(0,0,0,.6);',
        '  background: #0f172a;',
        '}',
        '.card-lab[data-theme="dark"] .card--featured {',
        '  --bg: #24344d; --border: #63b3ed;',
        '}',

    function LayerChecklist({ stepIdx }) {
      const labels = ['토큰', '레이아웃', '상태', '변형', '다크모드'];
      return (
        <div className="flex flex-wrap gap-1.5 mb-3">
          {labels.map((l, i) => {
            const done = i < stepIdx;
            const cur = i === stepIdx;
            return (
              <span
                key={l}
                className={`px-2 py-1 rounded-md border text-[11px] font-bold transition ${
                  cur
                    ? 'bg-sky-600 border-sky-700 text-white shadow'
                    : done
                    ? 'bg-sky-100 border-sky-300 text-sky-800'
                    : 'bg-white border-slate-200 text-slate-400'
                }`}
              >
                {done ? '✓ ' : cur ? '▶ ' : '○ '}{l}
              </span>
            );
          })}
        </div>
      );
    }

    function LiveDataPane({ beat, step, stepIdx, theme, setTheme }) {
      const styleRef = useRef(null);

      // stepIdx 가 바뀔 때마다 누적 CSS 를 재주입 (진짜 CSS 시연)
      useEffect(() => {
        if (!styleRef.current) {
          styleRef.current = document.createElement('style');
          styleRef.current.id = 'card-lab-css';
          document.head.appendChild(styleRef.current);
        }
        styleRef.current.textContent = cumulativeLines(step.cssUpto).join('\n');
      }, [stepIdx]);

      // 페이지를 떠날 때 주입 스타일 정리
      useEffect(() => () => {
        if (styleRef.current) styleRef.current.remove();
      }, []);

      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.token;

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>카드 UI 시스템 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <LayerChecklist stepIdx={step.cssUpto} />

          {/* 라이브 컨트롤: 테마 토글 + hover 안내 */}
          <div className="flex items-center gap-2 mb-2 flex-wrap">
            <button
              onClick={() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))}
              className={`px-2.5 py-1 rounded-md border text-[11px] font-bold transition ${
                theme === 'dark'
                  ? 'bg-slate-800 border-slate-900 text-sky-200'
                  : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'
              }`}
            >
              {theme === 'dark' ? '🌙 다크' : '☀️ 라이트'} · 테마 토글
            </button>
            <span className="text-[10px] text-slate-500">
              {step.cssUpto < 4 ? '다크 토큰은 Step 5에서 정의됨' : '토큰만 갈아끼움 — 구조 코드 그대로'}
            </span>
          </div>

          {/* 진짜 CSS 가 주입되는 라이브 카드 그리드 */}
          <div className="rounded-lg border border-sky-200 overflow-hidden">
            <CardGrid theme={theme} />
          </div>

          <div className="mt-2 text-[10px] text-sky-700">
            위 카드는 실제 <span className="font-mono font-bold">card.css</span> 를 주입해 그린 것 —
            현재 <span className="font-bold">{step.cssUpto + 1}단계</span>까지의 CSS만 적용된 상태다.
            {step.cssUpto >= 2 && ' 카드에 마우스를 올려 hover 를, Tab 키로 focus-visible 링을 확인하라.'}
          </div>

          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: card.css(누적 진화) + card.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      // beat 가 html 쪽을 강조하면 그 탭을 열어 준다 (css 강조가 있으면 css 우선)
      // 강조가 html 쪽에만 있으면 html 탭을 연다
      useEffect(() => {
        const cssHi = ((step.css || {}).highlight || []).length;
        const htmlHi = ((step.css || {}).htmlHi || []).length;
        setTab(!cssHi && htmlHi ? 1 : 0);
      }, [stepIdx]);

      // CSS_CHUNKS 는 5개뿐이다. beat 로 펼친 뒤에는 stepIdx 가 아니라
      // 그 beat 가 속한 청크 번호(step.cssUpto)로 잘라야 한다.
      const cssLines = cumulativeLines(step.cssUpto);
      const cssHi = (step.css && step.css.highlight) || chunkHighlight(step.cssUpto);

      const files = [
        { name: 'card.css',  lang: 'css', display: 'css',  lines: cssLines,  highlight: cssHi },
        { name: 'card.html', lang: 'xml', display: 'html', lines: CARD_HTML, highlight: [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines{tab === 0 ? ' · 누적' : ''}</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [theme, setTheme] = useState('light');
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅴ. 실무 체계</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">V-2-2</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">종합: 카드 UI 시스템</h1>
                <p className="text-sm text-sky-800/80">변수·flex·grid·transition·상태를 모두 합쳐 재사용 가능한 카드 컴포넌트 완성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
              <div className="mt-2 flex flex-wrap gap-1.5">
                {step.adds.map((a) => (
                  <span key={a} className="text-[10px] px-2 py-0.5 rounded bg-sky-700/70 border border-sky-600 text-sky-50">＋ {a}</span>
                ))}
              </div>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} theme={theme} setTheme={setTheme} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 카드에 hover·Tab·테마 토글을 직접 눌러보라</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 카드 UI 시스템 완성</div>
                토큰(변수)으로 설정값을 모으고 → grid/flex로 반응형 레이아웃을 짜고 → transition·:hover·:focus-visible로 상태와 접근성을 넣고 →
                변수 오버라이드로 variant를 파생하고 → data-theme로 다크모드를 공짜로 얻었다.
                이 카드 하나가 목록·상세·그리드 어디든 재사용되며, 색·간격·테마를 바꿀 유지보수 포인트는 오직 상단 토큰 블록 한 곳이다 —
                이것이 앞서 배운 CSS 개념을 "합쳐서" 컴포넌트를 만드는 실무의 결론이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['카드컴포넌트', '디자인토큰', 'CSS변수', 'grid', 'auto-fit', 'minmax', 'flex', 'transition', 'hover', 'focus-visible', '접근성', 'modifier', 'variant', '다크모드', '재사용'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록으로 (CSS 마지막 장) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
