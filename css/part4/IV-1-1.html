<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 학습 — IV-1-1. transition</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎞️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    CSS IV-1-1 — transition
    학습 목표: 상태가 바뀔 때 두 값 사이를 "부드럽게" 잇는 4요소(property·duration·timing-function·delay)를
              직접 조작하며 익히고, 무엇을 애니메이트해야 60fps가 나오는지(transform/opacity vs width/left)를 몸으로 안다.
    패턴: v1 — 좌(LiveDataPane: 슬라이더/토글로 4요소를 바꾸면 실제 박스가 그 설정대로 움직이는 라이브 시연 +
              timing-function 곡선 그래프 + transform vs left 성능 대비)
              우(VSCode CodeViewer: transition.css 진화 + demo.html 탭)
    색상: blue #1572B6 (CSS 브랜드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // timing-function 프리셋 — cubic-bezier 제어점(p1x,p1y,p2x,p2y)으로 곡선을 그린다
    //   steps 는 계단형이라 별도 플래그(stepped)로 처리한다
    // ─────────────────────────────────────────────────────
    const TIMINGS = [
      { key: 'linear',      css: 'linear',                       cp: [0, 0, 1, 1],          note: '등속 — 기계적, 로딩바에' },
      { key: 'ease',        css: 'ease',                         cp: [0.25, 0.1, 0.25, 1],  note: '기본값 — 빠르게 출발해 부드럽게 감속' },
      { key: 'ease-in',     css: 'ease-in',                      cp: [0.42, 0, 1, 1],       note: '천천히 출발 — 사라질 때(exit)' },
      { key: 'ease-out',    css: 'ease-out',                     cp: [0, 0, 0.58, 1],       note: '빠르게 출발해 착지 — 등장(enter)에 최적' },
      { key: 'ease-in-out', css: 'ease-in-out',                  cp: [0.42, 0, 0.58, 1],    note: '대칭 S자 — 왕복/이동에 자연스러움' },
      { key: 'bounce',      css: 'cubic-bezier(.34,1.56,.64,1)', cp: [0.34, 1.56, 0.64, 1], note: '오버슈트 — 통통 튀는 맛(1 초과)' },
      { key: 'steps(4)',    css: 'steps(4, end)',                cp: [0, 0, 1, 1],          note: '계단형 — 스프라이트/타이핑 효과', stepped: 4 },
    ];
    const timingByKey = (k) => TIMINGS.find((t) => t.key === k) || TIMINGS[1];

    // ─────────────────────────────────────────────────────
    // 애니메이트 대상 property — GPU 합성 vs 레이아웃 리플로우
    // ─────────────────────────────────────────────────────
    const PROPS = {
      transform: { label: 'transform: translateX', css: 'transform', reflow: false, tag: 'GPU 합성', desc: '레이아웃을 건드리지 않아 60fps' },
      left:      { label: 'left (position)',        css: 'left',      reflow: true,  tag: '레이아웃 리플로우', desc: '매 프레임 위치 재계산 → 버벅임' },
    };

    // ─────────────────────────────────────────────────────
    // 5단계 — 각 STEP 은 좌측 라이브 컨트롤의 "기본값"과 강조 포인트를 정한다
    //   preset : { dur, timing, delay, prop } — 슬라이더/토글 초기값
    //   focus  : 이 단계에서 특히 만져볼 컨트롤 key
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CSS = {
      basics: { filename: "transition.css", lines: [
        "/* 1) transition 4요소 — 한 줄 shorthand vs 개별 속성 */",
        "",
        ".box {",
        "  /* 개별 속성으로 쓰면 의미가 또렷하다 */",
        "  transition-property: transform;      /* 무엇을 */",
        "  transition-duration: 0.6s;           /* 얼마나 */",
        "  transition-timing-function: ease;    /* 어떤 곡선 */",
        "  transition-delay: 0s;                /* 언제 시작 */",
        "}",
        "",
        "/* 실무에서는 shorthand 한 줄로 합쳐 쓴다 */",
        ".box {",
        "  transition: transform 0.6s ease 0s;",
        "}",
        "",
        "/* 상태가 바뀌면(:hover) 그 사이를 자동으로 채운다 */",
        ".box:hover {",
        "  transform: translateX(220px);",
        "}",
        "",
        "/* ⚠ duration 이 0s 면 애니메이션 없이 즉시 점프한다 */",
      ] },
      timing: { filename: "transition.css", lines: [
        "/* 2) timing-function — 같은 시간, 다른 체감 */",
        "",
        "/* 등속: 로딩바·회전 등 \"일정 속도\" 전용 */",

    // ─────────────────────────────────────────────────────
    // timing-function 곡선 그래프 — cubic-bezier 제어점을 SVG로 그린다
    //   x축=진행시간(0→1), y축=변화량(0→1, 위로 갈수록 1). y가 1을 넘으면 오버슈트.
    // ─────────────────────────────────────────────────────
    function TimingCurve({ timing }) {
      const t = timingByKey(timing);
      const W = 150, H = 110, pad = 12;
      const gx = (u) => pad + u * (W - 2 * pad);
      const gy = (v) => (H - pad) - v * (H - 2 * pad); // v=0 바닥, v=1 위
      let path;
      if (t.stepped) {
        // 계단형 경로 (steps end)
        const n = t.stepped;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const x0 = i / n, x1 = (i + 1) / n, y = (i + 1) / n;
          pts.push(`M ${gx(x0)} ${gy(i / n)} L ${gx(x1)} ${gy(i / n)} L ${gx(x1)} ${gy(y)}`);
        }
        path = pts.join(' ');
      } else {
        const [p1x, p1y, p2x, p2y] = t.cp;
        path = `M ${gx(0)} ${gy(0)} C ${gx(p1x)} ${gy(p1y)} ${gx(p2x)} ${gy(p2y)} ${gx(1)} ${gy(1)}`;
      }
      return (
        <div className="rounded-lg border border-sky-200 bg-white p-2">
          <div className="text-[10px] font-bold text-sky-900 mb-1">가속 곡선 — <span className="font-mono">{t.css}</span></div>
          <svg width={W} height={H} className="mx-auto block">
            {/* 격자 */}
            <rect x={pad} y={pad} width={W - 2 * pad} height={H - 2 * pad} fill="#f8fafc" stroke="#e2e8f0" />
            <line x1={pad} y1={gy(1)} x2={W - pad} y2={gy(1)} stroke="#e2e8f0" strokeDasharray="3 3" />
            {/* 제어선 (bezier 만) */}
            {!t.stepped && (
              <g>
                <line x1={gx(0)} y1={gy(0)} x2={gx(t.cp[0])} y2={gy(t.cp[1])} stroke="#93c5fd" strokeWidth="1" strokeDasharray="2 2" />
                <line x1={gx(1)} y1={gy(1)} x2={gx(t.cp[2])} y2={gy(t.cp[3])} stroke="#93c5fd" strokeWidth="1" strokeDasharray="2 2" />
                <circle cx={gx(t.cp[0])} cy={gy(t.cp[1])} r="3" fill="#1572B6" />
                <circle cx={gx(t.cp[2])} cy={gy(t.cp[3])} r="3" fill="#1572B6" />
              </g>
            )}
            <path d={path} fill="none" stroke="#1572B6" strokeWidth="2.5" strokeLinejoin="round" />
            <text x={pad} y={H - 1} fontSize="7" fill="#94a3b8">시간→</text>
            <text x={W - pad - 2} y={pad + 6} fontSize="7" fill="#94a3b8" textAnchor="end">값1.0</text>
          </svg>
          <div className="text-[9px] text-slate-500 text-center mt-0.5">{t.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 렌더링 파이프라인 배지 — 선택한 property가 어디까지 다시 도나
    // ─────────────────────────────────────────────────────
    function PipelineBadge({ prop }) {
      const p = PROPS[prop];
      const stages = [
        { name: 'Layout', hit: p.reflow },
        { name: 'Paint',  hit: p.reflow },
        { name: 'Composite', hit: true },
      ];
      return (
        <div className={`rounded-lg border-2 p-2 ${p.reflow ? 'border-red-300 bg-red-50' : 'border-emerald-300 bg-emerald-50'}`}>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[10px] font-bold text-slate-800 font-mono">{p.label}</span>
            <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${p.reflow ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}`}>{p.tag}</span>
          </div>
          <div className="flex items-center gap-1">
            {stages.map((s, i) => (
              <React.Fragment key={s.name}>
                <div className={`flex-1 text-center text-[9px] py-1 rounded font-bold ${s.hit ? (p.reflow ? 'bg-red-200 text-red-900' : 'bg-emerald-200 text-emerald-900') : 'bg-slate-100 text-slate-400 line-through'}`}>{s.name}</div>
                {i < stages.length - 1 && <span className="text-slate-400 text-[9px]">→</span>}
              </React.Fragment>
            ))}
          </div>
          <div className={`text-[9px] mt-1 ${p.reflow ? 'text-red-800' : 'text-emerald-800'}`}>{p.desc} {p.reflow ? '(Layout부터 재계산)' : '(Composite만 — 리플로우 없음)'}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 라이브 시연 박스 — 슬라이더/토글 설정을 실제 transition 으로 재생
    //   moved 상태를 토글하면 CSS transition 이 두 값 사이를 채운다
    // ─────────────────────────────────────────────────────
    function LiveBox({ dur, timing, delay, prop }) {
      const [moved, setMoved] = useState(false);
      const t = timingByKey(timing);
      const p = PROPS[prop];
      // 대상 property 에 맞춰 이동 스타일을 구성한다
      const moveStyle = prop === 'transform'
        ? { transform: moved ? 'translateX(220px)' : 'translateX(0px)' }
        : { left: moved ? '220px' : '0px' };
      const boxStyle = {
        position: 'absolute',
        top: '50%',
        marginTop: -18,
        transitionProperty: p.css,
        transitionDuration: `${dur}ms`,
        transitionTimingFunction: t.css,
        transitionDelay: `${delay}ms`,
        ...moveStyle,
      };
      return (
        <div className="rounded-lg border border-sky-200 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[10px] font-bold text-sky-900">🎬 라이브 시연 — 재생하면 이 설정대로 움직인다</span>
            <button
              onClick={() => setMoved((m) => !m)}
              className="px-3 py-1 text-[11px] rounded bg-sky-600 text-white font-bold hover:bg-sky-700"
            >{moved ? '↺ 되돌리기' : '▶ 재생'}</button>
          </div>
          <div className="relative h-16 rounded bg-gradient-to-r from-sky-50 to-blue-50 border border-dashed border-sky-300 overflow-hidden">
            {/* 출발/도착 가이드 */}
            <div className="absolute left-2 top-1 text-[8px] text-slate-400">start</div>
            <div className="absolute right-2 top-1 text-[8px] text-slate-400">+220px</div>
            <div className="relative h-full ml-2">
              <div
                style={boxStyle}
                className="w-9 h-9 rounded-md bg-sky-600 text-white text-sm flex items-center justify-center shadow font-bold"
              >▶</div>
            </div>
          </div>
          <div className="mt-2 font-mono text-[10px] text-slate-600 bg-slate-50 rounded px-2 py-1 border border-slate-200">
            transition: <span className="text-sky-700 font-bold">{p.css} {(dur/1000).toFixed(2)}s {t.css}{delay ? ` ${(delay/1000).toFixed(2)}s` : ''}</span>;
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 4요소 컨트롤 — 슬라이더/토글. focus 인 컨트롤은 강조 테두리.
    // ─────────────────────────────────────────────────────
    function ControlPanel({ dur, setDur, timing, setTiming, delay, setDelay, prop, setProp, focus }) {
      const ring = (key) => focus === key ? 'ring-2 ring-amber-400 border-amber-300' : 'border-sky-200';
      return (
        <div className="space-y-2">
          {/* duration */}
          <div className={`rounded-lg border bg-white px-2.5 py-2 ${ring('dur')}`}>
            <div className="flex items-center justify-between mb-1">
              <span className="text-[10px] font-bold text-sky-900">duration <span className="text-slate-400 font-normal">얼마나</span></span>
              <span className="font-mono text-[10px] text-sky-700 font-bold">{(dur/1000).toFixed(2)}s</span>
            </div>
            <input type="range" min="0" max="2000" step="50" value={dur} onChange={(e) => setDur(+e.target.value)} className="w-full accent-sky-600" />
          </div>
          {/* delay */}
          <div className={`rounded-lg border bg-white px-2.5 py-2 ${ring('delay')}`}>
            <div className="flex items-center justify-between mb-1">
              <span className="text-[10px] font-bold text-sky-900">delay <span className="text-slate-400 font-normal">언제 시작</span></span>
              <span className="font-mono text-[10px] text-sky-700 font-bold">{(delay/1000).toFixed(2)}s</span>
            </div>
            <input type="range" min="0" max="1000" step="50" value={delay} onChange={(e) => setDelay(+e.target.value)} className="w-full accent-sky-600" />
          </div>
          {/* timing-function */}
          <div className={`rounded-lg border bg-white px-2.5 py-2 ${ring('timing')}`}>
            <div className="text-[10px] font-bold text-sky-900 mb-1">timing-function <span className="text-slate-400 font-normal">가속 곡선</span></div>
            <div className="flex flex-wrap gap-1">
              {TIMINGS.map((t) => (
                <button
                  key={t.key}
                  onClick={() => setTiming(t.key)}
                  className={`px-1.5 py-0.5 rounded text-[9px] font-mono border transition ${timing === t.key ? 'bg-sky-600 border-sky-700 text-white font-bold' : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'}`}
                >{t.key}</button>
              ))}
            </div>
          </div>
          {/* property */}
          <div className={`rounded-lg border bg-white px-2.5 py-2 ${ring('prop')}`}>
            <div className="text-[10px] font-bold text-sky-900 mb-1">대상 property <span className="text-slate-400 font-normal">무엇을</span></div>
            <div className="flex gap-1">
              {Object.keys(PROPS).map((k) => (
                <button
                  key={k}
                  onClick={() => setProp(k)}
                  className={`flex-1 px-1.5 py-1 rounded text-[9px] font-mono border transition ${prop === k ? (PROPS[k].reflow ? 'bg-red-600 border-red-700 text-white font-bold' : 'bg-emerald-600 border-emerald-700 text-white font-bold') : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'}`}
                >{PROPS[k].label}</button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info: { bg: 'bg-sky-50', border: 'border-sky-300', text: 'text-sky-900', icon: '💡' },
      warn: { bg: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      good: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 4요소 컨트롤 + 라이브 박스 + 곡선 그래프 + 파이프라인 배지
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      basics:  { icon: '🎞️', label: '4요소' },
      timing:  { icon: '📈', label: '가속 곡선' },
      perf:    { icon: '⚡', label: '성능(리플로우)' },
      trigger: { icon: '🖱️', label: '상태 트리거' },
      a11y:    { icon: '♿', label: '함정·접근성' },
    };

    function LiveDataPane({ beat, step }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.basics;
      const [dur, setDur] = useState(step.preset.dur);
      const [timing, setTiming] = useState(step.preset.timing);
      const [delay, setDelay] = useState(step.preset.delay);
      const [prop, setProp] = useState(step.preset.prop);

      // 단계가 바뀌면 그 단계의 기본값으로 컨트롤을 초기화한다
      useEffect(() => {
        setDur(step.preset.dur);
        setTiming(step.preset.timing);
        setDelay(step.preset.delay);
        setProp(step.preset.prop);
      }, [step]);

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>transition 플레이그라운드 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <LiveBox dur={dur} timing={timing} delay={delay} prop={prop} />

          <div className="mt-3 grid grid-cols-2 gap-2">
            <ControlPanel
              dur={dur} setDur={setDur}
              timing={timing} setTiming={setTiming}
              delay={delay} setDelay={setDelay}
              prop={prop} setProp={setProp}
              focus={step.focus}
            />
            <div className="space-y-2">
              <TimingCurve timing={timing} />
              <PipelineBadge prop={prop} />
            </div>
          </div>

          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: transition.css(진화) + demo.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      // beat 가 html 쪽을 강조하면 그 탭을 열어 준다 (css 강조가 있으면 css 우선)
      useEffect(() => {
        const cssHi = (step.css.highlight || []).length;
        const htmlHi = (step.css.htmlHi || []).length;
        setTab(!cssHi && htmlHi ? 1 : 0);
      }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'demo.html', lang: 'xml', display: 'html', lines: DEMO_HTML, highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅳ. 동작과 변화</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">IV-1-1</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">transition</h1>
                <p className="text-sm text-sky-800/80">property·duration·timing-function·delay로 상태 변화를 부드럽게 — 무엇을 언제 애니메이트하나</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 슬라이더·토글을 바꾸고 ▶재생으로 실제 움직임을 비교</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                transition 은 상태가 바뀔 때 두 값 사이의 중간 프레임을 채워준다 — property·duration·timing-function·delay 네 요소로 정의한다.
                곡선은 등장 ease-out·퇴장 ease-in 이 기본이고, 애니메이트 대상은 transform·opacity(GPU 합성, 60fps)를 우선하고 width·top·left(리플로우)는 피한다.
                transition 은 기본 상태에 선언하고 all 남용을 삼가며, display 는 전환 불가라 opacity+visibility 로 대체한다.
                마지막으로 prefers-reduced-motion 을 존중하면 부드럽고 안전하게 배포할 수 있다. 다음 장 IV-1-2 에서 키프레임 animation 으로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['transition', 'duration', 'timing-function', 'delay', 'ease-out', 'cubic-bezier', 'steps', 'transform', 'opacity', '리플로우', 'GPU합성', 'hover·focus', 'transition:all주의', 'prefers-reduced-motion'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 animation →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
