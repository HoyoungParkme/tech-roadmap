  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

            '.flip-scene { perspective: 800px; }',
            '',
            '/* 카드: 자식을 3D 공간에 유지(필수!) */',
            '.flip-card {',
            '  transform-style: preserve-3d;',
            '  transition: transform .6s;',
            '}',
            '.flip-card.is-flipped {',
            '  transform: rotateY(180deg);',
            '}',
            '',
            '/* 앞·뒷면: 뒤통수는 숨긴다 */',
            '.face { backface-visibility: hidden; }',
            '.back { transform: rotateY(180deg); }',
          ],
          highlight: [4, 7, 8, 9, 11, 12, 13, 16, 17],
          htmlHi: [14, 15, 16, 17, 18, 19],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 슬라이더 한 줄 — 값 라벨 + range
    // ─────────────────────────────────────────────────────
    function Slider({ label, unit, min, max, step, value, onChange, dim }) {
      return (
        <div className={`transition ${dim ? 'opacity-40' : ''}`}>
          <div className="flex items-center justify-between text-[11px] mb-0.5">
            <span className="font-mono font-bold text-sky-800">{label}</span>
            <span className="font-mono text-slate-600">{value}{unit}</span>
          </div>
          <input
            type="range"
            min={min} max={max} step={step} value={value}
            onChange={(e) => onChange(parseFloat(e.target.value))}
            className="w-full accent-sky-600 h-1.5"
            aria-label={label}
          />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // transform-origin 3×3 격자 선택기
    // ─────────────────────────────────────────────────────
    function OriginGrid({ value, onChange }) {
      const keys = Object.keys(ORIGINS);
      return (
        <div className="grid grid-cols-3 gap-1 w-max">
          {keys.map((k) => (
            <button
              key={k}
              onClick={() => onChange(k)}
              title={k}
              aria-label={`transform-origin ${k}`}
              className={`w-7 h-7 rounded border flex items-center justify-center transition ${
                value === k
                  ? 'bg-sky-600 border-sky-700'
                  : 'bg-white border-sky-300 hover:bg-sky-50'
              }`}
            >
              <span className={`w-2 h-2 rounded-full ${value === k ? 'bg-white' : 'bg-sky-400'}`}></span>
            </button>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 변형 무대 — 원본(고스트) 위에 실제 변형된 카드를 겹쳐 그린다
    //   합성 순서(order)에 따라 transform 문자열을 바꾼다
    //   origin 위치를 빨간 점으로 표시(고정축)
    // ─────────────────────────────────────────────────────
    function TransformStage({ st }) {
      const parts = [];
      const tf = (name) => {
        if (name === 'T') parts.push(`translate(${st.tx}px, ${st.ty}px)`);
        if (name === 'R') parts.push(`rotate(${st.rotate}deg)`);
      };
      // 순서 토글: TR = translate→rotate, RT = rotate→translate
      st.order === 'TR' ? (tf('T'), tf('R')) : (tf('R'), tf('T'));
      if (st.scale !== 1) parts.push(`scale(${st.scale})`);
      if (st.skew !== 0) parts.push(`skew(${st.skew}deg)`);
      const transform = parts.join(' ');
      const og = ORIGINS[st.origin];

      return (
        <div className="rounded-lg border border-sky-200 bg-[repeating-linear-gradient(45deg,#f4f8fc,#f4f8fc_10px,#eef4fa_10px,#eef4fa_20px)] p-3">
          <div className="flex items-center gap-2 mb-2">
            <div className="flex flex-col text-[10px] text-slate-500 leading-tight">
              <span>이웃 A</span>
            </div>
            <div className="relative flex-1 h-40 flex items-center justify-center overflow-hidden">
              {/* 원본 자리(리플로우 없음을 보여주는 고스트) */}
              <div
                className="absolute flex items-center justify-center text-[10px] text-slate-400 border-2 border-dashed border-slate-300 rounded"
                style={{ width: 120, height: 80 }}
              >
                원래 자리
              </div>
              {/* 실제 변형된 카드 */}
              <div
                className="absolute flex items-center justify-center text-white text-xs font-bold rounded shadow-lg"
                style={{
                  width: 120,
                  height: 80,
                  background: '#1572B6',
                  transform,
                  transformOrigin: st.origin,
                  transition: 'transform .35s ease',
                }}
              >
                변형 대상
                {/* origin 고정축 점 */}
                <span
                  className="absolute w-2.5 h-2.5 rounded-full bg-red-500 ring-2 ring-white"
                  style={{ left: `${og.x}%`, top: `${og.y}%`, transform: 'translate(-50%,-50%)' }}
                ></span>
              </div>
            </div>
            <div className="flex flex-col text-[10px] text-slate-500 leading-tight">
              <span>이웃 B</span>
            </div>
          </div>
          <div className="text-[10px] font-mono text-sky-800 bg-white/70 rounded px-2 py-1 border border-sky-200 break-all">
            transform: <span className="font-bold">{transform || 'none'}</span>;
            <br />
            transform-origin: <span className="font-bold">{st.origin}</span>; <span className="text-red-500">● 고정축</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 3D 카드 뒤집기 데모 (Step 5) — perspective + preserve-3d
    // ─────────────────────────────────────────────────────
    function FlipCard({ flipped, onToggle }) {
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[11px] font-bold text-sky-900">🃏 3D 카드 뒤집기 — preserve-3d</span>
            <button
              onClick={onToggle}
              aria-pressed={flipped}
              className="px-3 py-1 text-[11px] rounded bg-sky-600 text-white font-bold hover:bg-sky-700"
            >
              {flipped ? '↩ 앞면으로' : '🔄 카드 뒤집기'}
            </button>
          </div>
          <div className="flex justify-center py-2" style={{ perspective: '800px' }}>
            <div
              className="relative"
              style={{
                width: 150,
                height: 96,
                transformStyle: 'preserve-3d',
                transform: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)',
                transition: 'transform .6s',
              }}
            >
              <div
                className="absolute inset-0 flex items-center justify-center rounded-lg text-white font-bold text-sm shadow-lg"
                style={{ background: '#1572B6', backfaceVisibility: 'hidden' }}
              >앞면 (front)</div>
              <div
                className="absolute inset-0 flex items-center justify-center rounded-lg text-white font-bold text-sm shadow-lg"
                style={{ background: '#0d5a92', backfaceVisibility: 'hidden', transform: 'rotateY(180deg)' }}
              >뒷면 (back)</div>
            </div>
          </div>
          <div className="text-[10px] text-sky-800 mt-1">
            부모 <span className="font-mono">perspective</span> + 카드 <span className="font-mono">preserve-3d</span> + 뒷면 <span className="font-mono">rotateY(180deg)</span> 조합. preserve-3d 를 빼면 평면으로 눌려 안 뒤집힌다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 합성 순서 비교 배지 (Step 2)
    // ─────────────────────────────────────────────────────
    function OrderToggle({ order, onChange }) {
      const opts = [
        { k: 'TR', label: 'translate → rotate', note: '자리 먼저, 회전 나중' },
        { k: 'RT', label: 'rotate → translate', note: '축이 돌아간 뒤 이동' },
      ];
      return (
        <div className="grid grid-cols-2 gap-1.5">
          {opts.map((o) => (
            <button
              key={o.k}
              onClick={() => onChange(o.k)}
              aria-pressed={order === o.k}
              className={`rounded-lg border px-2 py-1.5 text-left transition ${
                order === o.k ? 'bg-sky-600 border-sky-700 text-white' : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'
              }`}
            >
              <div className="font-mono text-[10px] font-bold">{o.label}</div>
              <div className={`text-[9px] ${order === o.k ? 'text-sky-100' : 'text-slate-500'}`}>{o.note}</div>
            </button>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 슬라이더/토글로 실제 요소를 변형 (sky/blue 톤)
    //   단계가 바뀌면 preset 으로 상태를 초기화하고, focus 외 컨트롤은 흐리게
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      basic:  { icon: '🎯', label: '2D 변형' },
      order:  { icon: '🔀', label: '합성 순서' },
      origin: { icon: '📍', label: '기준점' },
      perf:   { icon: '⚡', label: '합성·성능' },
      threeD: { icon: '🧊', label: '3D 변형' },
    };

    function LiveDataPane({ step, stepIdx }) {
      const [st, setSt] = useState(step.preset);

      // 단계 진입 시 preset 으로 초기화
      useEffect(() => { setSt(step.preset); }, [stepIdx]);

      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.basic;
      const set = (k) => (v) => setSt((s) => ({ ...s, [k]: v }));
      const focused = (k) => step.focus.includes(k);

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>transform 실습 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <TransformStage st={st} />

          {/* 합성 순서 토글 — order 단계에서 강조 */}
          {step.engine === 'order' && (
            <div className="mt-3">
              <div className="text-[11px] font-bold text-sky-900 mb-1.5">합성 순서 — 같은 값, 다른 결과</div>
              <OrderToggle order={st.order} onChange={set('order')} />
            </div>
          )}

          {/* transform-origin 격자 — origin 단계에서 강조 */}
          {step.engine === 'origin' && (
            <div className="mt-3 flex items-start gap-3">
              <div>
                <div className="text-[11px] font-bold text-sky-900 mb-1.5">transform-origin</div>
                <OriginGrid value={st.origin} onChange={set('origin')} />
              </div>
              <div className="flex-1 text-[10px] text-slate-600 pt-4">
                <span className="text-red-500 font-bold">● 빨간 점</span>이 고정축이다. 이 점을 중심으로 rotate·scale 이 일어난다. 격자에서 위치를 바꿔 보라.
              </div>
            </div>
          )}

          {/* 3D 카드 뒤집기 — threeD 단계 */}
          {step.engine === 'threeD' && (
            <FlipCard flipped={st.flip} onToggle={() => setSt((s) => ({ ...s, flip: !s.flip }))} />
          )}

          {/* 공통 슬라이더 — focus 에 든 것만 진하게 */}
          {step.engine !== 'threeD' && (
            <div className="mt-3 grid grid-cols-2 gap-x-4 gap-y-2">
              <Slider label="translateX" unit="px" min={-80} max={80} step={1} value={st.tx} onChange={set('tx')} dim={!focused('tx')} />
              <Slider label="translateY" unit="px" min={-60} max={60} step={1} value={st.ty} onChange={set('ty')} dim={!focused('ty')} />
              <Slider label="scale" unit="" min={0.4} max={1.8} step={0.05} value={st.scale} onChange={set('scale')} dim={!focused('scale')} />
              <Slider label="rotate" unit="°" min={-180} max={180} step={1} value={st.rotate} onChange={set('rotate')} dim={!focused('rotate')} />
              <Slider label="skew" unit="°" min={-45} max={45} step={1} value={st.skew} onChange={set('skew')} dim={!focused('skew')} />
              <div className="flex items-end">
                <button
                  onClick={() => setSt(step.preset)}
                  className="text-[10px] px-2 py-1 rounded border border-sky-300 bg-white text-sky-700 hover:bg-sky-50"
                >↺ 이 단계 값으로 리셋</button>
              </div>
            </div>
          )}

          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: style.css(진화) + index.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'index.html',      lang: 'xml', display: 'html', lines: DEMO_HTML,      highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅳ. 동작과 변화</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">IV-1-2</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">transform</h1>
                <p className="text-sm text-sky-800/80">translate·scale·rotate·skew와 transform-origin·3D — 레이아웃 안 건드리고 GPU로 변형</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 슬라이더·토글을 움직여 실제 변형을 확인</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                transform은 레이아웃 흐름을 건드리지 않고 요소의 위치·크기·각도만 바꾼다(리플로우 없음 → GPU 합성 → 부드러움).
                2D 4형제(translate·scale·rotate·skew)는 왼쪽부터 합성되고, transform-origin이 rotate·scale의 기준점을 정한다.
                움직임은 top/left 대신 transform으로, will-change는 자주 움직이는 요소에만.
                3D는 부모 perspective + 카드 preserve-3d + 뒷면 rotateY(180deg)가 정석이며 preserve-3d 누락이 최대 함정이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['transform', 'translate', 'scale', 'rotate', 'skew', '합성순서', 'transform-origin', '리플로우없음', 'GPU합성', 'will-change', 'perspective', 'rotateX·Y', 'preserve-3d', '카드뒤집기'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
