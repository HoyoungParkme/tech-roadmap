<body>
  <div id="root"></div>

  <!--
    CSS III-1-1 — 상대 단위 (rem·em·%·vw)
    학습 목표: px(절대) vs 상대 단위가 "무엇을 기준으로" 계산되는지 슬라이더로 직접 확인한다.
              rem(루트) → em(부모·중첩 누적 함정) → %(부모 대비) → vw/vh(뷰포트) → clamp 유동 타이포 → line-height 무단위.
    패턴: v1 — 좌(LiveDataPane: 루트/부모/뷰포트 슬라이더 → 각 단위의 계산식과 결과 px 실시간 표시, em 중첩 누적 상자)
              우(VSCode CodeViewer: styles.css 진화 + index.html 공통 마크업)
    색상: blue/sky (CSS 브랜드 #1572B6)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단위 계산 헬퍼 — 슬라이더 상태(root/parent/viewport)를 받아
    // 각 단위가 몇 px로 "해석"되는지 계산한다. 이것이 이 페이지의 핵심.
    //   round1: 소수 첫째 자리 반올림(픽셀 감각 유지)
    // ─────────────────────────────────────────────────────
    const round1 = (n) => Math.round(n * 10) / 10;

    // 단위 카탈로그 — key 로 각 STEP 이 필요한 행만 골라 쓴다.
    //   expr    : CSS 에 쓰는 표기
    //   base    : 무엇을 기준으로 하는가(레이블)
    //   factor  : 계수(expr 의 숫자)
    //   pick    : 상태에서 기준값을 꺼내는 함수 (px)
    // ─────────────────────────────────────────────────────
    const UNIT_ROWS = {
      rem:  { expr: '1.5rem', base: '루트 font-size', factor: 1.5,  pick: (s) => s.root,  color: 'sky' },
      em:   { expr: '2em',    base: '부모 font-size', factor: 2,    pick: (s) => s.parent, color: 'amber' },
      pct:  { expr: '75%',    base: '부모 width',     factor: 0.75, pick: (s) => s.pwidth, color: 'emerald' },
      vw:   { expr: '20vw',   base: '뷰포트 너비',    factor: 0.20, pick: (s) => s.vw,     color: 'indigo' },
      vh:   { expr: '50vh',   base: '뷰포트 높이',    factor: 0.50, pick: (s) => s.vh,     color: 'violet' },
      vmin: { expr: '10vmin', base: 'min(너비,높이)', factor: 0.10, pick: (s) => Math.min(s.vw, s.vh), color: 'rose' },
      px:   { expr: '24px',   base: '절대값(고정)',   factor: 1,    pick: () => 24,        color: 'slate' },
    };

    const COLOR_MAP = {
      sky:     { chip: 'bg-sky-100 text-sky-900 border-sky-300',       bar: 'bg-sky-500' },
      amber:   { chip: 'bg-amber-100 text-amber-900 border-amber-300', bar: 'bg-amber-500' },
      emerald: { chip: 'bg-emerald-100 text-emerald-900 border-emerald-300', bar: 'bg-emerald-500' },
      indigo:  { chip: 'bg-indigo-100 text-indigo-900 border-indigo-300', bar: 'bg-indigo-500' },
      violet:  { chip: 'bg-violet-100 text-violet-900 border-violet-300', bar: 'bg-violet-500' },
      rose:    { chip: 'bg-rose-100 text-rose-900 border-rose-300',    bar: 'bg-rose-500' },
      slate:   { chip: 'bg-slate-200 text-slate-700 border-slate-300', bar: 'bg-slate-400' },
    };

    // ─────────────────────────────────────────────────────
    // index.html — 모든 단계 공통 마크업. CodeViewer 두 번째 탭.
    // ─────────────────────────────────────────────────────
    const DEMO_HTML = [
      '<!DOCTYPE html>',
      '<html lang="ko">',
      '<head>',
      '  <link rel="stylesheet" href="styles.css" />',
      '</head>',
      '<body>',
      '  <article class="card">',
      '    <h2 class="card-title">유동 카드</h2>',
      '    <p class="card-text">',
      '      상대 단위는 화면·글꼴 설정에 따라',
      '      스스로 크기를 다시 계산한다.',
      '    </p>',
      '    <blockquote class="quote">',
      '      <p>em 은 부모를 기준으로 한다 —',
      '         중첩되면 눈덩이처럼 커진다.</p>',
      '    </blockquote>',
      '    <a class="btn" href="#">자세히 보기</a>',
      '  </article>',
      '</body>',
      '</html>',
    ];

    // ─────────────────────────────────────────────────────
    // 6단계 — 상대 단위
    //   focus  : LiveDataPane 계산표에 띄울 단위 key 배열
    //   extra  : 단계별 보조 시각화 플래그
    //   css    : styles.css 코드(진화) + 하이라이트 라인 / htmlHi = index.html 강조 라인
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. px vs 상대 단위 — 무엇을 기준으로 계산되나',

        engine: 'intro',
        engineDetail: 'px(고정) vs rem(비례)',
        focus: ['px', 'rem'],
        extra: { pxVsRem: true },

        css: {
          filename: 'styles.css',

            '}',

            '}',

            '.card-title {',

            '',
            '/* 테두리처럼 "정말 1px" 여야 하는 값만 px 유지 */',

            '}',
          ],

        },
      },
      {

        engine: 'remem',
        engineDetail: 'rem=루트 · em=부모(누적)',
        focus: ['rem', 'em'],
        extra: { emNesting: true },

        css: {
          filename: 'styles.css',
          lines: [
            '/* 2) rem(루트) vs em(부모) — 기준이 다르다 */',

            '/* ✅ em 의 좋은 쓰임: 글자에 "비례하는" 여백 */',

            '}',
          ],

      {

        desc: '% 는 대개 부모 요소의 같은 속성을 기준으로 한 비율이다. width:75% 면 부모 너비의 0.75배, height:100% 면 부모 높이만큼이다. 다만 세로는 함정이 있다 — height:% 는 부모에게 명시적 높이가 있어야 계산되고, 없으면 auto 로 무시돼 "높이가 안 먹는" 흔한 버그가 된다. 폰트에서 % 는 rem 과 사실상 같은 계열(루트/부모 글꼴 비율)이라 레이아웃 폭에 주로 쓴다. 아래에서 부모 너비 슬라이더를 움직이면 75% 자식이 항상 3/4 를 유지하며 함께 늘고 주는 걸 확인하라.',
        engine: 'percent',
        engineDetail: '% = 부모 대비 비율',
        focus: ['pct', 'rem'],
        extra: { percentBox: true },
        alert: { tone: 'info', text: 'width:% 는 부모 너비 기준으로 잘 동작하지만, height:% 는 부모에 높이가 없으면 무시된다. "높이가 왜 안 먹지?" 의 90%는 부모 높이 미지정 문제 — 그럴 땐 부모에 높이를 주거나 vh / flex 를 쓴다.' },
        css: {
          filename: 'styles.css',
          lines: [
            '/* 3) % — 부모의 같은 속성을 기준으로 한 비율 */',
            '',
            '.card {',
            '  width: 75%;          /* 부모 너비의 0.75배 */',
            '  max-width: 640px;    /* 너무 커지지 않게 상한 */',
            '  margin: 0 auto;      /* 남는 폭을 좌우로 나눠 가운데 */',

            '}',

            '/* ❌ 함정: 부모에 높이가 없으면 %가 무시된다 */',

            '  height: 100%;   /* 부모 height 미지정 → auto 로 무효 */',
            '}',
          ],
          highlight: [4, 5, 6, 11, 12],

        },
      },
      {

        desc: '뷰포트 단위는 화면(뷰포트) 크기의 1% 를 1 로 센다. 10vw 는 화면 너비의 10%, 50vh 는 높이의 50%, vmin/vmax 는 너비·높이 중 작은/큰 쪽 기준이라 가로·세로 회전에도 안정적이다. 강력하지만 함정이 둘 있다. 첫째, 100vw 는 세로 스크롤바 폭을 포함해서 세로 콘텐츠가 있으면 화면보다 살짝 넓어져 가로 스크롤이 생긴다 — 전체 폭엔 width:100% 를 쓰는 게 안전하다. 둘째, 모바일에서 100vh 는 주소창이 접히기 전 큰 화면 기준이라 실제보다 커 보이고 잘리는데, 요즘은 dvh(동적 뷰포트 높이) 로 해결한다. 아래 뷰포트 슬라이더로 값이 실시간으로 다시 계산되는 걸 보라.',

    // ─────────────────────────────────────────────────────
    // 슬라이더 하나 — 라벨 + range + 현재값
    // ─────────────────────────────────────────────────────
    function Slider({ label, value, min, max, step, unit, onChange, accent }) {
      return (
        <div className="flex items-center gap-2">
          <label className="w-24 shrink-0 text-[10px] font-bold text-slate-600">{label}</label>
          <input
            type="range"
            min={min} max={max} step={step} value={value}
            onChange={(e) => onChange(Number(e.target.value))}
            aria-label={label}
            className="flex-1 accent-sky-600 h-1"
          />
          <span className={`w-16 shrink-0 text-right font-mono text-[11px] font-bold ${accent}`}>{value}{unit}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 단위 계산표 — 슬라이더 값으로 "계산식 = 결과 px" 를 동시에 보여준다.
    //   각 행의 막대 길이는 결과 px 에 비례(시각적 감각).
    // ─────────────────────────────────────────────────────
    function UnitTable({ state, focus }) {
      const maxPx = Math.max(
        ...focus.map((k) => UNIT_ROWS[k].factor * UNIT_ROWS[k].pick(state)),
        1
      );
      return (
        <div className="rounded-lg border border-sky-200 bg-white p-2.5 space-y-2">
          {focus.map((k) => {
            const u = UNIT_ROWS[k];
            const basePx = u.pick(state);
            const px = round1(u.factor * basePx);
            const c = COLOR_MAP[u.color];
            const pctBar = Math.min(100, (px / maxPx) * 100);
            const formula = k === 'px'
              ? '고정값 — 기준 없음'
              : `${u.factor} × ${round1(basePx)}px`;
            return (
              <div key={k}>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className={`font-mono text-[11px] font-bold px-1.5 py-0.5 rounded border ${c.chip}`}>{u.expr}</span>
                  <span className="text-[9px] text-slate-500">기준: {u.base}</span>
                  <span className="ml-auto font-mono text-[11px] text-slate-600">{formula}</span>
                  <span className="font-mono text-xs font-bold text-slate-900">= {px}px</span>
                </div>
                <div className="h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full ${c.bar} transition-all`} style={{ width: pctBar + '%' }} />
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — px vs rem 나란히 비교(루트를 바꾸면 rem 만 반응)
    // ─────────────────────────────────────────────────────
    function PxVsRem({ state }) {
      const remPx = round1(1.5 * state.root);
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border-2 border-slate-300 bg-white p-2 text-center">
            <div className="text-[9px] text-slate-500 mb-1">font-size: 14px (고정)</div>
            <div style={{ fontSize: 14 }} className="font-bold text-slate-800">고정 글자</div>
            <div className="mt-1 text-[10px] font-mono text-red-600">항상 14px</div>
          </div>
          <div className="rounded-lg border-2 border-sky-400 bg-sky-50 p-2 text-center">
            <div className="text-[9px] text-sky-700 mb-1">font-size: 1.5rem (비례)</div>
            <div style={{ fontSize: Math.min(remPx, 34) }} className="font-bold text-sky-900">비례 글자</div>
            <div className="mt-1 text-[10px] font-mono text-sky-700">= {remPx}px (루트 {state.root})</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — em 중첩 누적 상자(눈덩이). 각 단계 1.25배.
    // ─────────────────────────────────────────────────────
    function EmNesting({ state }) {
      const factor = 1.25;
      const levels = [0, 1, 2, 3, 4].map((i) => ({
        depth: i,
        px: round1(state.root * Math.pow(factor, i)),
      }));
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="text-[11px] font-bold text-amber-900 mb-2">🌨 em 중첩 누적 — 같은 1.25em 인데 깊이마다 폭주</div>
          <div className="space-y-1">
            {levels.map((l) => (
              <div
                key={l.depth}
                style={{ marginLeft: l.depth * 12 }}
                className="flex items-center gap-2 rounded border border-amber-300 bg-white px-2 py-1"
              >
                <span className="font-mono text-[10px] text-amber-700">깊이 {l.depth}</span>
                <span className="font-mono text-[10px] text-slate-500">1.25<sup>{l.depth}</sup> ×{state.root}</span>
                <span className="ml-auto font-mono text-xs font-bold text-amber-900">{l.px}px</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-amber-900">rem 이라면 어느 깊이든 <span className="font-mono font-bold">{round1(1.25 * state.root)}px</span> 로 일정 — 이 예측 가능성이 rem 의 강점.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — % 부모 대비 비율 상자
    // ─────────────────────────────────────────────────────
    function PercentBox({ state }) {
      const childPx = round1(state.pwidth * 0.75);
      return (
        <div className="mt-3 rounded-lg border-2 border-emerald-300 bg-emerald-50 p-3">
          <div className="text-[11px] font-bold text-emerald-900 mb-2">📦 width:75% — 부모가 늘고 줄어도 항상 3/4</div>
          <div className="rounded border-2 border-dashed border-emerald-400 bg-white p-1.5" style={{ width: Math.min(state.pwidth, 340) }}>
            <div className="text-[9px] text-emerald-700 mb-1 font-mono">부모 {state.pwidth}px</div>
            <div className="rounded bg-emerald-500 text-white text-center py-1.5 text-[11px] font-bold font-mono" style={{ width: '75%' }}>
              자식 75% = {childPx}px
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 100vw 가로 스크롤 함정 다이어그램
    // ─────────────────────────────────────────────────────
    function VwWarning({ state }) {
      const scrollbar = 15; // 대표적 스크롤바 폭
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-indigo-50 p-3 space-y-2">
          <div className="text-[11px] font-bold text-indigo-900">⚠️ 100vw 함정 — 스크롤바 폭만큼 넘친다</div>
          <div className="relative rounded border border-indigo-300 bg-white overflow-hidden" style={{ height: 34 }}>
            <div className="absolute inset-y-0 left-0 bg-emerald-400/70 flex items-center justify-center text-[9px] font-bold text-emerald-900" style={{ right: scrollbar }}>
              width:100% (안전)
            </div>
            <div className="absolute inset-y-0 right-0 bg-red-400 flex items-center justify-center text-[8px] font-bold text-white" style={{ width: scrollbar }}>
              ↔
            </div>
          </div>
          <div className="text-[9px] text-indigo-800 font-mono">100vw = 뷰포트 {state.vw}px 전체 · 100% = 스크롤바({scrollbar}px) 뺀 {state.vw - scrollbar}px</div>
          <div className="rounded border border-violet-300 bg-violet-50 px-2 py-1 text-[10px] text-violet-900">
            📱 모바일 <span className="font-mono font-bold">100vh</span> 은 주소창 접히기 전 큰 값 → 하단 잘림. <span className="font-mono font-bold">100dvh</span> 로 해결.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — clamp() 채택값 시각화(min/선호/max 중 무엇이 이기나)
    // ─────────────────────────────────────────────────────
    function ClampViz({ state }) {
      const minRem = 1.25, maxRem = 2.5;
      const minPx = round1(minRem * state.root);
      const maxPx = round1(maxRem * state.root);
      const prefPx = round1(0.5 * state.root + 0.03 * state.vw); // 0.5rem + 3vw
      const chosen = Math.min(maxPx, Math.max(minPx, prefPx));
      const which = chosen === prefPx ? '선호(rem+vw)' : chosen === minPx ? 'min(바닥)' : 'max(천장)';
      const whichColor = chosen === prefPx ? 'text-sky-700' : chosen === minPx ? 'text-emerald-700' : 'text-red-700';
      // 막대: minPx~maxPx 범위에서 chosen 위치
      const range = Math.max(maxPx - minPx, 1);
      const pos = Math.max(0, Math.min(100, ((chosen - minPx) / range) * 100));
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-1">📐 clamp(1.25rem, 0.5rem + 3vw, 2.5rem)</div>
          <div className="text-[10px] font-mono text-slate-600 mb-2">
            min {minPx}px · 선호 {prefPx}px · max {maxPx}px → 채택 <span className={`font-bold ${whichColor}`}>{chosen}px ({which})</span>
          </div>
          <div className="relative h-3 rounded-full bg-gradient-to-r from-emerald-200 via-sky-200 to-red-200">
            <div className="absolute -top-0.5 w-1.5 h-4 rounded bg-sky-700" style={{ left: `calc(${pos}% - 3px)` }} />
          </div>
          <div className="flex justify-between text-[8px] text-slate-500 font-mono mt-0.5">
            <span>min {minPx}</span><span>max {maxPx}</span>
          </div>
          <div className="mt-2 text-center rounded bg-sky-50 border border-sky-200 py-1">
            <span style={{ fontSize: Math.min(chosen, 30) }} className="font-bold text-sky-900">유동 카드</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — line-height 무단위 vs 단위 비교
    // ─────────────────────────────────────────────────────
    function LineHeightDemo() {
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2">
            <div className="text-[9px] font-bold text-emerald-800 mb-1">✅ line-height: 1.5 (무단위)</div>
            <p style={{ lineHeight: 1.5 }} className="text-[11px] text-slate-800">
              부모 <span style={{ fontSize: 18 }} className="font-bold">큰 자식</span> 도 자기
              크기×1.5 로 계산돼 줄이 안 겹친다.
            </p>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2">
            <div className="text-[9px] font-bold text-red-800 mb-1">❌ line-height: 1em (계산값 상속)</div>
            <p style={{ lineHeight: '1em' }} className="text-[11px] text-slate-800">
              부모 <span style={{ fontSize: 18 }} className="font-bold">큰 자식</span> 은 물려받은
              고정 줄높이라 겹칠 수 있다.
            </p>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 단위 선택 전략표
    // ─────────────────────────────────────────────────────
    function StrategyTable() {
      const rows = [
        { need: '무엇을 따라 변하나', unit: '권장 단위', ex: '예시', head: true },
        { need: '사용자 글꼴 설정', unit: 'rem', ex: 'font-size, 여백' },
        { need: '자기 글자 크기에 비례', unit: 'em', ex: 'button padding' },
        { need: '부모 폭', unit: '%', ex: 'width' },
        { need: '화면(뷰포트)', unit: 'vw / vh / dvh', ex: 'hero, full-screen' },
        { need: '유동 + 접근성 바닥', unit: 'clamp(rem+vw)', ex: '제목' },
        { need: '줄 간격', unit: '무단위 숫자', ex: 'line-height: 1.6' },
      ];
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-400 bg-gradient-to-br from-sky-50 to-emerald-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-1.5">🧭 단위 선택 치트시트</div>
          <table className="w-full text-[10px]">
            <tbody>
              {rows.map((r, i) => r.head ? (
                <tr key={i} className="text-sky-900 border-b-2 border-sky-300 font-bold">
                  <td className="py-1">{r.need}</td>
                  <td className="py-1 pl-2">{r.unit}</td>
                  <td className="py-1 pl-2">{r.ex}</td>
                </tr>
              ) : (
                <tr key={i} className="border-t border-sky-200">
                  <td className="py-1 text-slate-800">{r.need}</td>
                  <td className="py-1 pl-2 font-mono font-bold text-sky-700">{r.unit}</td>
                  <td className="py-1 pl-2 text-slate-500 font-mono">{r.ex}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 슬라이더 + 단위 계산표 + 단계별 보조 시각화
    //   슬라이더 상태(root/parent/pwidth/vw/vh)는 여기서 유지 → 단계 이동에도 보존
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      intro:    { icon: '📏', label: 'px vs 상대' },
      remem:    { icon: '🌨', label: 'rem vs em' },
      percent:  { icon: '📦', label: '% 비율' },
      viewport: { icon: '🖥', label: '뷰포트 단위' },
      clamp:    { icon: '📐', label: 'clamp 유동' },
      strategy: { icon: '🧭', label: '단위 전략' },
    };

    function LiveDataPane({ step }) {
      const [root, setRoot] = useState(16);
      const [parent, setParent] = useState(20);
      const [pwidth, setPwidth] = useState(320);
      const [vw, setVw] = useState(1280);
      const [vh, setVh] = useState(800);
      const state = { root, parent, pwidth, vw, vh };
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.intro;

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>단위 계산기 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          {/* 슬라이더 — "무엇을 기준으로" 하는 값들을 직접 조절 */}
          <div className="rounded-lg border border-slate-200 bg-slate-50 p-2.5 space-y-1.5 mb-3">
            <Slider label="루트 font-size" value={root} min={12} max={24} step={1} unit="px" onChange={setRoot} accent="text-sky-700" />
            <Slider label="부모 font-size" value={parent} min={12} max={40} step={1} unit="px" onChange={setParent} accent="text-amber-700" />
            <Slider label="부모 width" value={pwidth} min={160} max={480} step={10} unit="px" onChange={setPwidth} accent="text-emerald-700" />
            <Slider label="뷰포트 너비" value={vw} min={360} max={1920} step={20} unit="px" onChange={setVw} accent="text-indigo-700" />
            <Slider label="뷰포트 높이" value={vh} min={480} max={1200} step={20} unit="px" onChange={setVh} accent="text-violet-700" />
          </div>

          {/* 계산식 = 결과 px */}
          <UnitTable state={state} focus={step.focus} />

          {step.extra.pxVsRem && <PxVsRem state={state} />}
          {step.extra.emNesting && <EmNesting state={state} />}
          {step.extra.percentBox && <PercentBox state={state} />}
          {step.extra.vwWarning && <VwWarning state={state} />}
          {step.extra.clampViz && <ClampViz state={state} />}
          {step.extra.lineHeight && <LineHeightDemo />}
          {step.extra.strategyTable && <StrategyTable />}
          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: styles.css(진화) + index.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'index.html',      lang: 'xml', display: 'html', lines: DEMO_HTML,      highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅲ. 반응형·단위</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">III-1-1</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">상대 단위 (rem·em·%·vw)</h1>
                <p className="text-sm text-sky-800/80">px vs 상대 단위 — rem·em·%·vw/vh가 무엇을 기준으로 계산되는지와 반응형·접근성 선택 기준</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 슬라이더로 기준값을 바꿔 계산 결과를 비교</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                상대 단위는 "무엇을 기준으로" 계산되는지가 전부다. rem 은 루트(사용자 글꼴 설정)를,
                em 은 부모를(중첩 시 누적 주의), % 는 부모 폭을, vw/vh 는 화면을 기준으로 한다.
                유동 크기는 clamp(rem+vw) 로 접근성 바닥을 깔고, line-height 는 무단위로 둔다.
                기준을 먼저 정하면 단위는 저절로 정해진다 — 이게 반응형·접근성의 뼈대다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['상대단위', 'rem', 'em', '중첩누적', '퍼센트', 'vw·vh', 'vmin·vmax', 'dvh', 'clamp', '유동타이포', 'ch', 'line-height무단위', '접근성', '반응형'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
