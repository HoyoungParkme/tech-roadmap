  <!--
    CSS III-2-1 — 모바일 퍼스트
    학습 목표: 왜 작은 화면부터 설계하고 min-width로 확장하는가.
              모바일 기본 → min-width 규칙 누적(점진적 향상) → 콘텐츠 우선순위 → 성능(srcset) → 실전 패턴 → 실패 사례.
    패턴: v1 — 좌(LiveDataPane: 뷰포트 폭 슬라이더 + 규칙 스택 누적 시연)
              우(VSCode CodeViewer: styles.css 모바일 퍼스트 진화 + index.html 탭)
    색상: blue/sky (CSS 브랜드 #1572B6 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 브레이크포인트 정의 — 모바일 기본 위에 min-width 규칙을 "쌓는다"
    //   min   : 이 폭 이상에서 규칙이 활성화 (0 = 기본/모바일)
    //   cols  : 카드 그리드 열 수
    //   nav   : 내비 형태 ('hamburger' | 'inline')
    //   scale : 폰트/여백 배율(상대감)
    // ─────────────────────────────────────────────────────
    const RULES = [
      { min: 0,   cols: 1, nav: 'hamburger', scale: 1.0,  aside: false, label: '기본 (모바일)',      note: '미디어쿼리 밖 — 가장 작은 화면 기준' },
      { min: 600, cols: 2, nav: 'hamburger', scale: 1.05, aside: false, label: '@min-width: 600px',  note: '태블릿 — 카드 2열로 확장' },
      { min: 900, cols: 3, nav: 'inline',    scale: 1.1,  aside: true,  label: '@min-width: 900px',  note: '데스크톱 — 3열 + 가로 내비 + 사이드바' },
    ];

    // 현재 뷰포트 폭에서 활성화된 규칙들(누적)을 아래→위 순으로 반환
    function activeRules(width) {
      return RULES.filter((r) => width >= r.min);
    }
    // 누적 적용 후 최종 레이아웃 상태 = 활성 규칙들을 순서대로 덮어쓴 결과
    function resolveLayout(width) {
      const on = activeRules(width);
      return on.reduce((acc, r) => ({ ...acc, ...r }), {});
    }

    // ─────────────────────────────────────────────────────
    // index.html — 모든 단계 공통 마크업(변하지 않는다). CodeViewer 두 번째 탭.
    //   모바일 퍼스트의 핵심: HTML 순서 = 콘텐츠 우선순위. 위에서부터 중요한 것.
    // ─────────────────────────────────────────────────────
    const INDEX_HTML = [
      '<!DOCTYPE html>',
      '<html lang="ko">',
      '<head>',
      '  <meta charset="UTF-8" />',

      '  <link rel="stylesheet" href="styles.css" />',
      '</head>',
      '<body>',
      '  <header class="site-header">',
      '    <h1 class="logo">Shop</h1>',
      '    <!-- 모바일: 햄버거 / 넓은 화면: 가로로 펼침 -->',

      '    <nav class="nav">',

      '      <a href="#">베스트</a>',

      '  </header>',

      '      <article class="card">상품 C</article>',
      '    </section>',

      '    <aside class="promo">추천 · 배너</aside>',
      '  </main>',
      '</body>',
      '</html>',

    // ─────────────────────────────────────────────────────

    // ─────────────────────────────────────────────────────

            '  .site-header { padding: 20px 32px; } /* 스케일업 */',
            '}',
          ],
          highlight: [4, 5, 6, 7, 13, 14, 15, 16],
          htmlHi: [11, 12, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 6. 실패 사례 — override 지옥과 기기명 하드코딩',
        desc: '모바일 퍼스트를 어기면 대가가 분명하다. 데스크톱을 먼저 완성하고 모바일에서 마구 덮어쓰기 시작하면, 곧 !important 없이는 이길 수 없는 명시도 전쟁이 벌어진다 — 이게 "override 지옥"이다. 또 하나는 브레이크포인트를 "iPhone은 375px"처럼 기기명으로 하드코딩하는 것. 기기는 매년 바뀌고 폴더블·태블릿이 그 사이를 채우므로, 브레이크포인트는 기기가 아니라 "레이아웃이 깨지는 지점(콘텐츠 기준)"에서 잡아야 한다. 아래에서 나쁜 코드와 그 결과를 확인하고, 왜 min-width 누적이 이 함정을 피하는지 되짚어 보라.',
        vw: 1200,
        engine: 'pitfall',
        engineDetail: '!important 전쟁 · 기기명 하드코딩',
        alert: { tone: 'warn', text: '두 함정: ① 데스크톱 먼저 → 모바일 override → !important 지옥. ② 브레이크포인트를 기기명(375/414)으로 고정 → 신기종·폴더블에서 깨짐. 해법은 "모바일 기본 + 콘텐츠가 깨지는 지점의 min-width".' },
        css: {
          filename: 'styles.css',
          lines: [
            '/* 6) 안티패턴 — 이렇게 하면 유지보수가 무너진다 */',
            '',
            '/* ❌ 데스크톱 먼저 만들고 모바일서 되돌리기 */',
            '.products { grid-template-columns: repeat(3, 1fr); }',
            '@media (max-width: 899px) {',
            '  .products { grid-template-columns: 1fr !important; } /* 전쟁 시작 */',
            '}',
            '',
            '/* ❌ 브레이크포인트를 기기명으로 하드코딩 */',
            '@media (max-width: 375px) { /* "iPhone" — 신기종서 깨짐 */ }',
            '@media (max-width: 414px) { /* "iPhone Plus" ...끝없다 */ }',
            '',
            '/* ✅ 대신: 콘텐츠가 깨지는 폭에서 min-width */',
            '@media (min-width: 600px) { /* 카드가 좁아지는 지점 */ }',
          ],
          highlight: [4, 5, 6, 10, 11],
          htmlHi: [20, 21, 22, 23],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 엔진(단계) 배지
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      philosophy: { icon: '📱', label: '기본은 모바일' },
      compare:    { icon: '⚖️', label: 'min vs max' },
      priority:   { icon: '🎯', label: '콘텐츠 우선순위' },
      perf:       { icon: '⚡', label: '성능·이미지' },
      pattern:    { icon: '🧩', label: '실전 패턴' },
      pitfall:    { icon: '🚧', label: '안티패턴' },
    };

    // ─────────────────────────────────────────────────────
    // 뷰포트 미리보기 — 현재 폭에서 해결된 레이아웃을 기기 프레임으로 그린다
    // ─────────────────────────────────────────────────────
    function DevicePreview({ width }) {
      const L = resolveLayout(width);
      const cols = L.cols || 1;
      const cards = ['A', 'B', 'C'];
      const frameW = Math.max(150, Math.min(360, width / 3.4));
      return (
        <div className="flex justify-center">
          <div
            className="rounded-lg border-2 border-sky-400 bg-white overflow-hidden shadow"
            style={{ width: frameW, transition: 'width .25s' }}
          >
            {/* 헤더 */}
            <div
              className="flex items-center gap-1.5 bg-sky-700 text-white"
              style={{ padding: L.nav === 'inline' ? '8px 12px' : '6px 8px' }}
            >
              <span className="font-bold" style={{ fontSize: 11 * (L.scale || 1) }}>Shop</span>
              {L.nav === 'inline' ? (
                <div className="ml-auto flex gap-2 text-[9px] text-sky-100">
                  <span>신상품</span><span>베스트</span><span>세일</span>
                </div>
              ) : (
                <span className="ml-auto text-[13px]">☰</span>
              )}
            </div>
            {/* 본문 */}
            <div className="p-1.5 flex gap-1.5">
              <div className="flex-1">
                <div className="grid gap-1" style={{ gridTemplateColumns: `repeat(${cols}, 1fr)` }}>
                  {cards.map((c) => (
                    <div
                      key={c}
                      className="rounded bg-sky-100 border border-sky-300 text-sky-800 text-[9px] font-bold flex items-center justify-center"
                      style={{ height: 30 }}
                    >{c}</div>
                  ))}
                </div>
              </div>
              {L.aside && (
                <div className="w-12 rounded bg-amber-100 border border-amber-300 text-amber-800 text-[8px] font-bold flex items-center justify-center text-center leading-tight">
                  추천<br />배너
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 규칙 스택 — 활성 규칙을 아래(기본)→위(고폭)로 "쌓아" 표시
    // ─────────────────────────────────────────────────────
    function RuleStack({ width }) {
      const on = activeRules(width).map((r) => r.min);
      // 위에서부터 그리려면 역순(고폭이 위)
      const ordered = [...RULES].reverse();
      return (
        <div className="mt-3 rounded-lg border border-sky-200 bg-white p-2">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">규칙 스택 — 아래(기본)부터 위로 쌓인다</div>
          <div className="space-y-1">
            {ordered.map((r) => {
              const isOn = on.includes(r.min);
              return (
                <div
                  key={r.min}
                  className={`rounded px-2 py-1 border transition flex items-center gap-2 ${
                    isOn
                      ? 'bg-sky-50 border-sky-400'
                      : 'bg-slate-50 border-dashed border-slate-300 opacity-50'
                  }`}
                >
                  <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${isOn ? 'bg-sky-600 text-white' : 'bg-slate-300 text-slate-600'}`}>
                    {isOn ? '켜짐' : '대기'}
                  </span>
                  <span className="font-mono text-[11px] font-bold text-sky-900">{r.label}</span>
                  <span className="ml-auto text-[9px] text-slate-500">{r.note}</span>
                </div>
              );
            })}
          </div>
          <div className="mt-1.5 text-[9px] text-sky-700">
            활성 규칙 <span className="font-bold">{on.length}개</span> — min-width 는 이전 규칙을 지우지 않고 <span className="font-bold">덧칠</span>한다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 성능(Step 4) — srcset 후보 선택 시각화
    // ─────────────────────────────────────────────────────
    function SrcsetDemo({ width }) {
      const L = resolveLayout(width);
      // sizes: 3열=33vw, 2열=50vw, 1열=100vw → 실제 이미지 표시 폭
      const frac = L.cols === 3 ? 0.33 : L.cols === 2 ? 0.5 : 1.0;
      const displayW = Math.round(width * frac);
      const candidates = [480, 960, 1440];
      // 표시폭 이상인 가장 작은 후보 선택(대략적 브라우저 규칙)
      const chosen = candidates.find((c) => c >= displayW) || 1440;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-2">⚡ srcset 선택 — 뷰포트에 맞는 파일만 내려받기</div>
          <div className="text-[10px] text-slate-600 mb-2">
            뷰포트 <span className="font-mono font-bold text-sky-800">{width}px</span> · 이미지 표시폭 ≈
            <span className="font-mono font-bold text-sky-800"> {displayW}px</span> ({Math.round(frac * 100)}vw, {L.cols || 1}열)
          </div>
          <div className="flex gap-1.5">
            {candidates.map((c) => (
              <div
                key={c}
                className={`flex-1 rounded px-2 py-1.5 text-center border transition ${
                  c === chosen
                    ? 'bg-sky-600 border-sky-700 text-white font-bold shadow'
                    : 'bg-slate-50 border-slate-300 text-slate-500'
                }`}
              >
                <div className="text-[11px] font-mono font-bold">{c}w</div>
                <div className="text-[8px]">a-{c}.jpg</div>
                {c === chosen && <div className="text-[8px] mt-0.5">✓ 선택</div>}
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-sky-800">
            폰이면 작은 파일, 데스크톱이면 큰 파일 — 브라우저가 자동으로 고른다. 4K 이미지를 폰에 밀어 넣는 낭비가 사라진다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // min vs max 비교(Step 2)
    // ─────────────────────────────────────────────────────
    function CompareStacks() {
      return (
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2">
            <div className="text-[11px] font-bold text-emerald-800 mb-1">✅ min-width (덧셈)</div>
            <div className="space-y-1 text-[9px]">
              <div className="rounded bg-white border border-emerald-200 px-1.5 py-1 font-mono">+ 3열 @900</div>
              <div className="rounded bg-white border border-emerald-200 px-1.5 py-1 font-mono">+ 2열 @600</div>
              <div className="rounded bg-emerald-100 border border-emerald-300 px-1.5 py-1 font-mono font-bold">기본 1열</div>
            </div>
            <div className="mt-1.5 text-[9px] text-emerald-700">더하기만 — 충돌 적음</div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2">
            <div className="text-[11px] font-bold text-red-800 mb-1">❌ max-width (뺄셈)</div>
            <div className="space-y-1 text-[9px]">
              <div className="rounded bg-red-100 border border-red-300 px-1.5 py-1 font-mono font-bold">기본 3열</div>
              <div className="rounded bg-white border border-red-200 px-1.5 py-1 font-mono">↩ 2열 @899</div>
              <div className="rounded bg-white border border-red-200 px-1.5 py-1 font-mono">↩ 1열 @599</div>
            </div>
            <div className="mt-1.5 text-[9px] text-red-700">되돌리기 — override 누적</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 안티패턴(Step 6)
    // ─────────────────────────────────────────────────────
    function PitfallDemo() {
      const rows = [
        { bad: '데스크톱 먼저 → 모바일 override', pain: '!important 명시도 전쟁', fix: '모바일 기본 + min-width 덧셈' },
        { bad: 'max-width: 375px (iPhone)', pain: '신기종·폴더블서 깨짐', fix: '콘텐츠가 깨지는 폭 기준' },
        { bad: '브레이크포인트 난립', pain: '어디서 뭐가 켜지는지 미궁', fix: '2~3개 핵심 지점으로 압축' },
      ];
      return (
        <div className="mt-3 rounded-xl border-2 border-red-300 bg-gradient-to-br from-red-50 to-amber-50 p-3">
          <div className="text-sm font-bold text-red-800 mb-2">🚧 실패 사례 → 해법</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-slate-700 border-b-2 border-red-200">
                <th className="text-left py-1">안티패턴</th>
                <th className="text-left py-1 pl-1">증상</th>
                <th className="text-left py-1 pl-1">해법</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.bad} className="border-t border-red-100">
                  <td className="py-1 text-red-700 font-bold">{r.bad}</td>
                  <td className="py-1 pl-1 text-slate-600">{r.pain}</td>
                  <td className="py-1 pl-1 text-emerald-700 font-bold">{r.fix}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info: { bg: 'bg-sky-50', border: 'border-sky-300', text: 'text-sky-900', icon: '💡' },
      warn: { bg: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      good: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 뷰포트 폭 슬라이더 + 규칙 스택 누적 시연
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step, width, setWidth }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.philosophy;
      const bp = width >= 900 ? '데스크톱' : width >= 600 ? '태블릿' : '모바일';
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>모바일 퍼스트 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          {/* 뷰포트 폭 슬라이더 */}
          <div className="mb-3 rounded-lg border border-sky-200 bg-sky-50 px-3 py-2">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[11px] font-bold text-sky-900">뷰포트 폭 — 좁게서 넓게 밀어보라</span>
              <span className="text-[11px] font-mono font-bold text-sky-800">{width}px · {bp}</span>
            </div>
            <input
              type="range"
              min="320" max="1280" step="10"
              value={width}
              onChange={(e) => setWidth(Number(e.target.value))}
              aria-label="뷰포트 폭 조절"
              className="w-full accent-sky-600"
            />
            <div className="flex justify-between text-[9px] text-slate-500 mt-0.5">
              <span>320</span>
              <span className={width >= 600 ? 'text-sky-700 font-bold' : ''}>▲600</span>
              <span className={width >= 900 ? 'text-sky-700 font-bold' : ''}>▲900</span>
              <span>1280</span>
            </div>
          </div>

          {/* 기기 프레임 미리보기 */}
          <DevicePreview width={width} />

          {/* 규칙 스택 */}
          <RuleStack width={width} />

          {/* 단계별 보조 시각화 */}
          {step.engine === 'compare' && <CompareStacks />}
          {step.engine === 'perf' && <SrcsetDemo width={width} />}
          {step.engine === 'pitfall' && <PitfallDemo />}

          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: styles.css(진화) + index.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'index.html', lang: 'xml', display: 'html', lines: INDEX_HTML, highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [width, setWidth] = useState(STEPS[0].vw);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      // 단계 이동 시 해당 단계의 권장 뷰포트로 초기화
      useEffect(() => { setWidth(STEPS[stepIdx].vw); }, [stepIdx]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅲ. 반응형·단위</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">III-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">모바일 퍼스트</h1>
                <p className="text-sm text-sky-800/80">왜 작은 화면부터 설계하고 min-width로 확장하나 — 점진적 향상과 성능·유지보수 이점</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} width={width} setWidth={setWidth} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 슬라이더로 뷰포트 폭을 직접 조절</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                모바일 퍼스트는 "가장 작은 화면을 기본값으로 두고 min-width로 규칙을 쌓아 올리는" 설계다.
                덧셈 방향이라 override 충돌이 적고, 자연스레 콘텐츠 우선순위가 잡히며, 무거운 데스크톱 자원이 폰에 실리지 않는다.
                실전은 1열→다열 그리드, 햄버거→가로 내비, 여백 스케일업의 세 패턴으로 요약된다.
                브레이크포인트는 기기명이 아니라 "콘텐츠가 깨지는 지점"에서 잡아라 — 다음 장 III-2-2에서 미디어쿼리를 더 깊게 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['모바일퍼스트', 'min-width', '점진적향상', 'max-width비교', '콘텐츠우선순위', 'display-none', 'srcset', 'sizes', '반응형이미지', '햄버거메뉴', '그리드확장', '스케일업', '브레이크포인트', 'override지옥'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
