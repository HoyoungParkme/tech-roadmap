  <!--
    CSS III-1-2 — 미디어쿼리 전략
    학습 목표: 뷰포트 폭에 따라 어떤 @media 규칙이 켜지고 레이아웃이 어떻게 바뀌는지
              직접 슬라이더로 시연하며, 모바일 퍼스트(min-width) 누적 설계·콘텐츠 기준

    패턴: v1 — 좌(LiveDataPane: 뷰포트 폭 슬라이더 → 레이아웃 라이브 미리보기 + 활성 @media 규칙 강조)
              우(VSCode CodeViewer: responsive.css 진화 + index.html 탭)
    색상: blue/sky (CSS 브랜드 #1572B6 감각)

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 브레이크포인트 사다리 (모바일 퍼스트 — min-width 누적)
    //   min  : 이 폭 이상에서 규칙이 켜진다
    //   cols : 카드 그리드 열 수
    //   nav  : 'hamburger'(햄버거) | 'inline'(가로 메뉴)
    // ─────────────────────────────────────────────────────
    const BREAKPOINTS = [
      { name: 'base', min: 0,    cols: 1, nav: 'hamburger', label: '모바일 (기본)',   rule: '기본 스타일 (미디어쿼리 없음)' },
      { name: 'sm',   min: 640,  cols: 2, nav: 'hamburger', label: '작은 태블릿',     rule: '@media (min-width: 640px)' },
      { name: 'lg',   min: 1024, cols: 3, nav: 'inline',    label: '데스크톱',        rule: '@media (min-width: 1024px)' },
    ];
    const MIN_W = 320;
    const MAX_W = 1440;

    // 폭에 대해 "적용된" 브레이크포인트 배열 (min <= width). 마지막이 최종 효과.
    function appliedBreakpoints(width) {
      return BREAKPOINTS.filter((b) => width >= b.min);
    }
    function activeBreakpoint(width) {
      const applied = appliedBreakpoints(width);
      return applied[applied.length - 1];
    }

    // ─────────────────────────────────────────────────────
    // index.html — 모든 단계 공통(변하지 않는 마크업). CodeViewer 두 번째 탭.
    // ─────────────────────────────────────────────────────

      '  <header class="site-header">',
      '    <div class="logo">Shop</div>',
      '    <button class="nav-toggle">☰</button>',

        desc: '미디어쿼리 사고는 대부분 세 가지에서 온다. 첫째, min-width와 max-width를 뒤섞으면 여러 구간이 동시에 걸쳐 규칙이 충돌하고 "어느 폭에서 무엇이 이기는지" 추적 불가능해진다 — 한 프로젝트는 한 방향(권장: min-width)으로 통일한다. 둘째, 기기 폭을 하드코딩하면 새 기기·폴더블·창 분할에서 곧바로 깨진다 — 콘텐츠 기준으로 끊는다. 셋째, prefers-reduced-motion을 무시하면 접근성 위반이자 실제 사용자에게 멀미를 유발한다. 아래 사례를 눌러 "무엇이 문제이고 어떻게 고치는지"를 확인하라. 다음 장에서는 이 규칙들을 컨테이너 쿼리로 한 단계 더 정교하게 다룬다.',
        engine: 'pitfall',
        engineDetail: '혼용 충돌 · 하드코딩 · reduced-motion 무시',
        extra: { pitfalls: true },
        alert: { tone: 'warn', text: '핵심 원칙 3줄: ① 한 프로젝트는 min-width로 방향 통일(혼용 금지) ② 브레이크포인트는 기기가 아니라 콘텐츠 기준 ③ prefers-reduced-motion은 반드시 존중. 이 셋만 지켜도 반응형 사고의 대부분이 사라진다.' },
        css: {
          filename: 'responsive.css',
          lines: [
            '/* 5) 흔한 실패와 수정 — 세 가지만 피하면 된다 */',
            '',
            '/* ❌ 혼용 충돌: min과 max가 겹쳐 규칙이 포갠다 */',
            '@media (min-width: 600px) { .box { color: red; } }',
            '@media (max-width: 800px) { .box { color: blue; } }',
            '/*   600~800px 구간에서 둘 다 걸린다 → 순서에 좌우 */',
            '',
            '/* ✅ 수정: 한 방향(min-width)으로 통일 */',
            '@media (min-width: 600px) { .box { color: red; } }',
            '@media (min-width: 800px) { .box { color: blue; } }',
            '',
            '/* ❌ 하드코딩: 특정 기기 폭만 겨냥 → 새 기기서 깨짐 */',
            '/* @media (width: 768px) { ... } */',
            '',
            '/* ✅ 접근성: 동작 줄이기를 반드시 존중 */',
            '@media (prefers-reduced-motion: reduce) {',
            '  * { animation: none !important; transition: none !important; }',
            '}',
          ],
          highlight: [4, 5, 6, 9, 10, 16, 17, 18],
          htmlHi: [9, 10, 11, 12],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 뷰포트 폭 슬라이더 — LiveDataPane의 핵심 컨트롤
    // ─────────────────────────────────────────────────────
    function ViewportSlider({ width, setWidth }) {
      const active = activeBreakpoint(width);
      return (
        <div className="rounded-lg border border-sky-200 bg-sky-50 p-3">
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[11px] font-bold text-sky-900">🖥 뷰포트 폭 — 슬라이더를 움직여 보라</span>
            <span className="text-[11px] font-mono font-bold text-sky-800">{width}px</span>
          </div>
          <input
            type="range"
            min={MIN_W}
            max={MAX_W}
            step={1}
            value={width}
            onChange={(e) => setWidth(Number(e.target.value))}
            aria-label="뷰포트 폭 조절 슬라이더"
            className="w-full accent-sky-600"
          />
          <div className="mt-1 flex justify-between text-[9px] text-slate-500 font-mono">
            <span>{MIN_W}</span>
            <span className="text-sky-700">640</span>
            <span className="text-sky-700">1024</span>
            <span>{MAX_W}</span>
          </div>
          <div className="mt-2 text-[10px] text-sky-800">
            현재 활성 구간: <span className="font-bold">{active.label}</span>
            <span className="ml-1 font-mono text-sky-600">({active.cols}열 · {active.nav === 'inline' ? '가로 메뉴' : '햄버거'})</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 레이아웃 라이브 미리보기 — 폭에 따라 열 수·내비가 바뀐다
    // ─────────────────────────────────────────────────────
    function LayoutPreview({ width }) {
      const bp = activeBreakpoint(width);
      const cols = bp.cols;
      const inline = bp.nav === 'inline';
      const cards = [1, 2, 3, 4, 5, 6];
      // 미리보기 폭을 뷰포트 폭에 비례해 축소(최대 100%) — 실제 폭 감각 전달
      const previewPct = Math.round((width / MAX_W) * 100);
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-sky-900 mb-2">📱 레이아웃 미리보기 (폭에 반응)</div>
          <div
            className="mx-auto rounded border border-slate-300 bg-slate-50 overflow-hidden transition-all"
            style={{ width: previewPct + '%', minWidth: 200 }}
          >
            {/* 헤더 / 내비 */}
            <div className="flex items-center gap-2 px-2 py-1.5 bg-sky-600 text-white text-[10px]">
              <span className="font-bold">Shop</span>
              {inline ? (
                <div className="ml-auto flex gap-2">
                  <span>홈</span><span>신상</span><span>장바구니</span>
                </div>
              ) : (
                <span className="ml-auto text-base leading-none" title="햄버거 메뉴">☰</span>
              )}
            </div>
            {/* 카드 그리드 */}
            <div
              className="p-2 grid gap-1.5"
              style={{ gridTemplateColumns: `repeat(${cols}, 1fr)` }}
            >
              {cards.map((c) => (
                <div key={c} className="rounded bg-sky-100 border border-sky-300 text-sky-800 text-[10px] text-center py-2 font-mono">
                  상품 {c}
                </div>
              ))}
            </div>
          </div>
          <div className="mt-1.5 text-center text-[9px] text-slate-500">
            {cols}열 그리드 · {inline ? '가로 메뉴 노출' : '햄버거로 접힘'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // @media 규칙 사다리 — 현재 폭에서 적용된 규칙을 강조 (Step 2·3)
    // ─────────────────────────────────────────────────────
    function RuleLadder({ width }) {
      const applied = new Set(appliedBreakpoints(width).map((b) => b.name));
      const active = activeBreakpoint(width);
      return (
        <div className="mt-3 rounded-lg border border-sky-200 bg-white p-2.5">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">📶 활성 @media 규칙 (아래로 누적)</div>
          <div className="space-y-1">
            {BREAKPOINTS.map((b) => {
              const on = applied.has(b.name);
              const isActive = active.name === b.name;
              return (
                <div
                  key={b.name}
                  className={`flex items-center gap-2 rounded px-2 py-1 border text-[10px] font-mono transition ${
                    isActive
                      ? 'bg-sky-100 border-sky-500 text-sky-900 font-bold'
                      : on
                      ? 'bg-sky-50 border-sky-200 text-sky-700'
                      : 'bg-slate-50 border-slate-200 text-slate-400'
                  }`}
                >
                  <span className={`w-2 h-2 rounded-full ${on ? 'bg-sky-500' : 'bg-slate-300'}`}></span>
                  <span className="flex-1">{b.rule}</span>
                  <span className="text-[9px]">{on ? `✓ ${b.cols}열` : '대기'}</span>
                  {isActive && <span className="text-[9px] px-1 rounded bg-sky-600 text-white font-sans">최종</span>}
                </div>
              );
            })}
          </div>
          <div className="mt-1.5 text-[9px] text-slate-500">min-width는 위→아래 한 방향으로만 켜진다 — 겹침·충돌이 없다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // @media 문법 해부 (Step 1)
    // ─────────────────────────────────────────────────────
    function MediaAnatomy() {
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-2">🔬 @media 문법 해부</div>
          <div className="font-mono text-[12px] bg-slate-900 rounded p-2 text-slate-200 overflow-x-auto">
            <span className="text-pink-400">@media</span>{' '}
            <span className="text-amber-300">screen</span>{' '}
            <span className="text-sky-300">and</span>{' '}
            <span className="text-emerald-300">(min-width: 640px)</span>{' '}
            <span className="text-slate-400">{'{ ... }'}</span>
          </div>
          <div className="mt-2 grid grid-cols-1 gap-1 text-[10px]">
            <div><span className="font-mono text-amber-600 font-bold">screen</span> <span className="text-slate-600">→ 미디어 타입 (화면·인쇄 등, 생략 시 all)</span></div>
            <div><span className="font-mono text-sky-600 font-bold">and</span> <span className="text-slate-600">→ 논리 연산자 (그리고 / 쉼표=또는 / not=부정)</span></div>
            <div><span className="font-mono text-emerald-600 font-bold">(min-width: 640px)</span> <span className="text-slate-600">→ 기능 조건 (폭·방향·해상도)</span></div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // min vs max 방향 비교 (Step 2)
    // ─────────────────────────────────────────────────────
    function DirectionCompare() {
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-400 bg-gradient-to-br from-sky-50 to-emerald-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">⚖️ min-width vs max-width</div>
          <div className="grid grid-cols-2 gap-2 text-[10px]">
            <div className="rounded-lg border border-emerald-300 bg-white p-2">
              <div className="font-bold text-emerald-700 mb-1">min-width (모바일 퍼스트) ✅</div>
              <div className="text-slate-600">기본 = 모바일 · 폭이 커질수록 규칙을 <b>더한다</b></div>
              <div className="mt-1 text-slate-500">→ 한 방향 누적, 겹침 없음, 유지보수 쉬움</div>
            </div>
            <div className="rounded-lg border border-red-300 bg-white p-2">
              <div className="font-bold text-red-700 mb-1">max-width (데스크톱 퍼스트)</div>
              <div className="text-slate-600">기본 = 데스크톱 · 폭이 작아질수록 <b>덮어쓴다</b></div>
              <div className="mt-1 text-slate-500">→ 구간 포갬, 순서·명시도 충돌 잦음</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 흔한 브레이크포인트 값 (Step 3)
    // ─────────────────────────────────────────────────────
    function CommonValues({ width }) {
      const rows = [
        { v: 640,  name: 'sm', use: '휴대폰 가로 / 작은 태블릿 — 1→2열' },
        { v: 768,  name: 'md', use: '태블릿 세로 — 사이드바 등장' },
        { v: 1024, name: 'lg', use: '데스크톱 — 3열 + 가로 메뉴' },
        { v: 1280, name: 'xl', use: '넓은 데스크톱 — 최대 폭 제한' },
      ];
      return (
        <div className="mt-3 rounded-lg border border-dashed border-sky-400 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">📏 흔한 관용값 — 출발점일 뿐, 콘텐츠 보며 조정</div>
          <table className="w-full text-[10px]">
            <tbody>
              {rows.map((r) => {
                const passed = width >= r.v;
                return (
                  <tr key={r.v} className="border-t border-sky-100">
                    <td className={`py-1 font-mono font-bold ${passed ? 'text-sky-700' : 'text-slate-400'}`}>{r.v}px</td>
                    <td className={`py-1 pl-2 font-mono ${passed ? 'text-sky-600' : 'text-slate-400'}`}>{r.name}</td>
                    <td className="py-1 pl-2 text-slate-600">{r.use}</td>
                    <td className="py-1 pl-1 text-right">{passed ? <span className="text-[9px] px-1 rounded bg-sky-600 text-white">넘음</span> : ''}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // prefers-* 라이브 데모 (Step 4) — 다크모드·동작줄이기 스위치
    // ─────────────────────────────────────────────────────
    function PrefersDemo() {
      const [dark, setDark] = useState(false);
      const [reduce, setReduce] = useState(false);
      const [hover, setHover] = useState(false);
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-2">🌗 라이브 데모 — 두 스위치를 켜고 꺼 보라</div>
          <div className="flex gap-2 mb-3 flex-wrap">
            <button
              onClick={() => setDark((d) => !d)}
              aria-pressed={dark}
              className={`px-2.5 py-1 rounded text-[10px] font-bold border transition ${dark ? 'bg-slate-800 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-300'}`}
            >
              prefers-color-scheme: {dark ? 'dark' : 'light'}
            </button>
            <button
              onClick={() => setReduce((r) => !r)}
              aria-pressed={reduce}
              className={`px-2.5 py-1 rounded text-[10px] font-bold border transition ${reduce ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-white text-slate-700 border-slate-300'}`}
            >
              reduced-motion: {reduce ? 'reduce' : 'no-preference'}
            </button>
          </div>
          <div
            className="rounded-lg p-3 transition-colors"
            style={{ background: dark ? '#0f172a' : '#ffffff', border: '1px solid ' + (dark ? '#334155' : '#cfc9ba') }}
          >
            <div
              onMouseEnter={() => setHover(true)}
              onMouseLeave={() => setHover(false)}
              className="inline-block rounded px-3 py-2 text-[11px] font-bold cursor-pointer"
              style={{
                background: dark ? '#1572B6' : '#e0f2fe',
                color: dark ? '#e2e8f0' : '#075985',
                transform: !reduce && hover ? 'translateY(-4px)' : 'none',
                transition: reduce ? 'none' : 'transform .3s ease, background .3s',
              }}
            >
              상품 카드 (마우스를 올려보라)
            </div>
            <div className="mt-2 text-[10px]" style={{ color: dark ? '#94a3b8' : '#64748b' }}>
              {reduce ? '동작 줄이기 ON — 호버해도 움직이지 않는다 (멀미 방지)' : '호버 시 살짝 떠오른다 (기본 애니메이션)'}
            </div>
          </div>
          <div className="mt-2 text-[10px] text-sky-800">색과 움직임 모두 CSS 미디어쿼리로 분기한다 — JS 없이 OS 설정을 그대로 존중.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 실패 사례 카드 (Step 5)
    // ─────────────────────────────────────────────────────
    function Pitfalls() {
      const [pick, setPick] = useState(0);
      const cases = [
        {
          tag: 'min/max 혼용 충돌',
          bad: '@media (min-width:600px){…red}\n@media (max-width:800px){…blue}',
          why: '600~800px 구간에서 두 규칙이 동시에 걸려 선언 순서에 따라 색이 뒤집힌다. 어느 폭에서 뭐가 이기는지 추적 불가.',
          fix: '한 프로젝트는 min-width 한 방향으로 통일한다.',
        },
        {
          tag: '기기 폭 하드코딩',
          bad: '@media (width: 768px){ … }',
          why: '딱 768px일 때만 적용 — 폴더블·창 분할·새 기기 폭에서 즉시 깨진다.',
          fix: '콘텐츠가 어색해지는 폭(min-width 범위)에서 끊는다.',
        },
        {
          tag: 'reduced-motion 무시',
          bad: '.hero{ animation: parallax 2s infinite; }',
          why: '동작 줄이기를 켠 사용자에게 큰 움직임·패럴랙스는 멀미·현기증을 유발한다. 접근성 위반.',
          fix: '(prefers-reduced-motion: reduce)에서 animation/transition을 없앤다.',
        },
      ];
      const c = cases[pick];
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-[11px] font-bold text-red-900 mb-2">🚨 실패 사례 — 카드를 눌러 원인·수정 확인</div>
          <div className="flex gap-1.5 mb-2 flex-wrap">
            {cases.map((cc, i) => (
              <button
                key={cc.tag}
                onClick={() => setPick(i)}
                className={`px-2 py-1 rounded text-[10px] font-bold border transition ${i === pick ? 'bg-red-600 text-white border-red-700' : 'bg-white text-red-700 border-red-300 hover:bg-red-100'}`}
              >
                {cc.tag}
              </button>
            ))}
          </div>
          <pre className="rounded bg-slate-900 text-red-200 text-[10px] font-mono p-2 overflow-x-auto whitespace-pre-wrap">{c.bad}</pre>
          <div className="mt-2 text-[10px] text-red-900"><span className="font-bold">왜 문제인가:</span> {c.why}</div>
          <div className="mt-1 text-[10px] text-emerald-800"><span className="font-bold">✅ 수정:</span> {c.fix}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info: { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn: { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      good: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 뷰포트 슬라이더 + 레이아웃 미리보기 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      anatomy: { icon: '🔬', label: '@media 문법' },
      ladder:  { icon: '📶', label: 'min-width 누적' },
      design:  { icon: '📏', label: '브레이크포인트 설계' },
      prefers: { icon: '🌗', label: '사용자 선호 쿼리' },
      pitfall: { icon: '🚨', label: '실패 사례' },
    };

    function LiveDataPane({ step, width, setWidth }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.anatomy;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>미디어쿼리 시연 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <ViewportSlider width={width} setWidth={setWidth} />
          <LayoutPreview width={width} />

          {step.extra.anatomy && <MediaAnatomy />}
          {step.extra.ladder && <RuleLadder width={width} />}
          {step.extra.direction && <DirectionCompare />}
          {step.extra.commonValues && <CommonValues width={width} />}
          {step.extra.prefersDemo && <PrefersDemo />}
          {step.extra.pitfalls && <Pitfalls />}
          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: responsive.css(진화) + index.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'index.html',      lang: 'xml', display: 'html', lines: DEMO_HTML,      highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [width, setWidth] = useState(420); // 뷰포트 폭(모바일에서 시작)
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅲ. 반응형·단위</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">III-1-2</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">미디어쿼리 전략</h1>
                <p className="text-sm text-sky-800/80">@media 문법 · 브레이크포인트 설계 · min-width vs max-width · 기능 쿼리(prefers-*)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} width={width} setWidth={setWidth} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 슬라이더로 뷰포트 폭을 바꿔 규칙 활성화를 비교</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                미디어쿼리는 "조건이 참일 때만 켜지는 CSS 스위치"다. 문법은 [타입] and ([조건]) 하나면 대부분 충분하고,
                실무 표준은 <b>모바일 퍼스트(min-width) 누적</b> — 규칙이 한 방향으로만 쌓여 겹침이 없다.
                브레이크포인트는 기기가 아니라 <b>콘텐츠가 어색해지는 폭</b>에서 끊고, prefers-color-scheme·prefers-reduced-motion으로
                사용자의 취향·필요까지 존중한다. min/max 혼용, 기기 하드코딩, reduced-motion 무시 — 이 셋만 피하면 반응형 사고는 거의 사라진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['미디어쿼리', '@media', 'min-width', 'max-width', '모바일퍼스트', '브레이크포인트', 'orientation', 'and·쉼표·not', 'prefers-color-scheme', '다크모드', 'prefers-reduced-motion', '접근성', '콘텐츠기준'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-1.html" className="underline hover:no-underline">다음: III-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
