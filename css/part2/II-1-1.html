<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 학습 — II-1-1. Flexbox 축 모델</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧭</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    CSS II-1-1 — Flexbox 축 모델
    학습 목표: main axis(주축)·cross axis(교차축)가 무엇이고, flex-direction 이 두 축을 어떻게 바꾸는지,
              그 축 위에서 justify-content(주축)·align-items(교차축)이 어떻게 정렬을 결정하는지 눈으로 익힌다.
    패턴: v1 — 좌(LiveDataPane: 실제 flexbox 컨테이너 + 주축/교차축 화살표를 함께 그려 축 개념을 시각화)
              우(VSCode CodeViewer: layout.css 진화 + index.html 마크업 탭)
    색상: blue/sky (CSS 브랜드 #1572B6). 주축=블루, 교차축=앰버로 구분.
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공통 아이템 3개 — 대부분의 단계가 이 세 박스를 공유한다.
    //   lines : 내부 텍스트 줄 수 → 자연 높이를 다르게 만들어 교차축 정렬 차이를 눈으로 본다
    // ─────────────────────────────────────────────────────
    const ITEMS = [
      { id: 'A', lines: 1 },
      { id: 'B', lines: 3 },
      { id: 'C', lines: 2 },
    ];
    // wrap 데모용 — 폭이 넉넉한 아이템 6개(줄바꿈이 일어난다)
    const WRAP_ITEMS = [
      { id: '1', lines: 1 }, { id: '2', lines: 1 }, { id: '3', lines: 1 },
      { id: '4', lines: 1 }, { id: '5', lines: 1 }, { id: '6', lines: 1 },
    ];

    // ─────────────────────────────────────────────────────
    // index.html — 모든 단계 공통(변하지 않는 마크업). CodeViewer 두 번째 탭.
    // ─────────────────────────────────────────────────────
    const DEMO_HTML = [
      '<!DOCTYPE html>',
      '<html lang="ko">',
      '<head>',
      '  <link rel="stylesheet" href="layout.css" />',
      '</head>',
      '<body>',
      '  <!-- 컨테이너에 display:flex 를 주면 자식들이 flex item 이 된다 -->',
      '  <div class="stage">',
      '    <div class="box">A</div>',
      '    <div class="box">B</div>',
      '    <div class="box">C</div>',
      '  </div>',
      '</body>',
      '</html>',
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 — Flexbox 축 모델
    //   각 selector 칩은 "한 속성의 값"을 바꾼다.
    //   container : 컨테이너 style 에 덮어쓸 값 / items : 아이템별 flex 값(선택)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. flex-direction — 주축과 교차축이 통째로 바뀐다',
        desc: 'Flexbox의 모든 정렬은 "두 개의 축" 위에서 일어난다. 주축(main axis)은 아이템이 흐르는 방향이고, 교차축(cross axis)은 거기에 수직인 방향이다. 핵심은 flex-direction이 이 두 축의 방향 자체를 바꾼다는 것 — row면 주축이 가로, column이면 주축이 세로가 되고 교차축도 함께 90도 돈다. 이 사실을 놓치면 뒤에 나올 justify-content·align-items의 의미가 통째로 헷갈린다. 아래 칩을 눌러 방향을 바꾸면 파란 화살표(주축)와 주황 화살표(교차축)가 어떻게 회전하는지 직접 확인하라.',
        engine: 'direction',
        engineDetail: 'row · row-reverse · column · column-reverse',
        selectors: [
          { sel: 'row',            kind: '가로',   note: '주축 →(가로), 교차축 ↓(세로) — 기본값', container: { flexDirection: 'row' } },
          { sel: 'row-reverse',    kind: '가로역', note: '주축이 ←로 뒤집힘(끝→시작)', container: { flexDirection: 'row-reverse' } },
          { sel: 'column',         kind: '세로',   note: '주축 ↓(세로)로 회전, 교차축 →(가로)', container: { flexDirection: 'column' } },
          { sel: 'column-reverse', kind: '세로역', note: '주축이 ↑로 뒤집힘', container: { flexDirection: 'column-reverse' } },
        ],
        defaultSel: 0,
        base: { justifyContent: 'flex-start', alignItems: 'flex-start' },
        extra: { axisLegend: true },
        alert: { tone: 'warn', text: 'column 으로 바꾸는 순간 "가로 가운데"는 align-items 가, "세로 가운데"는 justify-content 가 맡게 된다 — row 일 때와 정반대다. 축이 돌면 두 속성의 역할이 서로 뒤바뀐다는 걸 먼저 몸에 익혀야 뒤 단계가 쉽다.' },
        css: {
          filename: 'layout.css',
          lines: [
            '/* 1) display:flex + flex-direction — 두 축의 방향을 정한다 */',
            '',
            '.stage {',
            '  display: flex;              /* 자식이 flex item 이 된다 */',
            '  flex-direction: row;        /* 주축 = 가로(→) */',
            '  /* row       : 주축 → , 교차축 ↓ (기본) */',
            '  /* column    : 주축 ↓ , 교차축 → (90도 회전) */',
            '  /* *-reverse : 주축의 시작·끝이 뒤집힌다 */',
            '  min-height: 210px;',
            '  border: 2px dashed #9cc4e4;',
            '}',
            '',
            '.box {',
            '  background: #1572B6;',
            '  color: #fff;',
            '  padding: 10px 16px;',
            '  border-radius: 6px;',
            '}',
          ],
          highlight: [3, 4, 5, 6, 7, 8],
          htmlHi: [8, 9, 10, 11],
        },
      },

    // 선택자(속성값) 칩 목록 — 클릭으로 라이브 컨테이너 값을 바꾼다
    // ─────────────────────────────────────────────────────
    function ValueChips({ selectors, active, onPick }) {
      return (
        <div className="flex flex-wrap gap-1.5 mb-3">
          {selectors.map((s, i) => (
            <button
              key={s.sel}
              onClick={() => onPick(i)}
              className={`px-2 py-1 rounded-md border text-[11px] font-mono transition ${
                i === active
                  ? 'bg-sky-600 border-sky-700 text-white font-bold shadow'
                  : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'
              }`}
            >
              {s.sel}
              <span className={`ml-1 text-[9px] font-sans ${i === active ? 'text-sky-100' : 'text-slate-400'}`}>{s.kind}</span>
            </button>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 축 화살표 — 주축(파랑) / 교차축(주황). 방향에 따라 가로·세로가 뒤바뀐다.
    //   role : 'main'(주축) | 'cross'(교차축)
    //   dir  : 'normal' | 'reverse'
    //   orient : 'h'(가로) | 'v'(세로)
    // ─────────────────────────────────────────────────────
    function AxisArrow({ role, orient, dir }) {
      const isMain = role === 'main';
      const color = isMain ? '#1572B6' : '#d97706';
      const bg = isMain ? '#e8f2fb' : '#fdf3e3';
      const label = isMain ? '주축 main' : '교차축 cross';
      const prop = isMain ? 'justify-content' : 'align-items';
      const arrow = orient === 'h'
        ? (dir === 'reverse' ? '◄─────' : '─────►')
        : (dir === 'reverse' ? '▲' : '▼');
      if (orient === 'h') {
        return (
          <div className="flex items-center gap-2 mb-1">
            <span className="font-mono font-bold tracking-widest text-sm" style={{ color }}>{arrow}</span>
            <span className="text-[10px] font-bold px-1.5 py-0.5 rounded" style={{ color, background: bg }}>
              {label} · {prop}
            </span>
          </div>
        );
      }
      // 세로 축 — 왼쪽 세로 레일
      return (
        <div className="flex flex-col items-center justify-center pr-2" style={{ minWidth: 74 }}>
          <span className="text-[9px] font-bold px-1 py-0.5 rounded mb-1 text-center leading-tight"
                style={{ color, background: bg, writingMode: 'horizontal-tb' }}>
            {label}<br/><span className="font-mono">{prop}</span>
          </span>
          <span className="font-mono font-bold text-lg" style={{ color }}>{dir === 'reverse' ? '▲' : '▼'}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 하나의 flex item 박스 — lines 만큼 텍스트 줄을 넣어 자연 높이를 다르게
    // ─────────────────────────────────────────────────────
    function FlexBox({ item, flex, marginTrick, isLast, tone }) {
      const style = {
        background: tone || '#1572B6',
        color: '#fff',
        borderRadius: 6,
        padding: '8px 14px',
        boxShadow: '2px 2px 0 rgba(0,0,0,.15)',
      };
      if (flex) style.flex = flex;
      if (marginTrick && !isLast) style.marginRight = '12px';
      return (
        <div style={style} className="text-center">
          <div className="font-bold text-sm">{item.id}</div>
          {Array.from({ length: item.lines - 1 }).map((_, i) => (
            <div key={i} className="text-[9px] opacity-80 leading-tight">line</div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 라이브 flexbox 무대 — "진짜" CSS flexbox 로 그린다(자기 자신을 시연)
    // ─────────────────────────────────────────────────────
    function FlexStage({ containerStyle, itemsData }) {
      const dirVal = containerStyle.flexDirection || 'row';
      const isRow = dirVal.startsWith('row');
      const isReverse = dirVal.endsWith('reverse');
      // 주축: row => 가로, column => 세로. 교차축은 반대.
      const mainOrient = isRow ? 'h' : 'v';
      const crossOrient = isRow ? 'v' : 'h';

      const stage = (
        <div
          style={{
            display: 'flex',
            border: '2px dashed #9cc4e4',
            borderRadius: 8,
            background: '#f4f9fd',
            padding: 12,
            minHeight: 200,
            width: '100%',
            ...containerStyle,
          }}
        >
          {itemsData.map((d, i) => (
            <FlexBox
              key={d.item.id + i}
              item={d.item}
              flex={d.flex}
              marginTrick={d.marginTrick}
              isLast={i === itemsData.length - 1}
              tone={d.tone}
            />
          ))}
        </div>
      );

      return (
        <div className="rounded-lg border border-sky-200 bg-white p-3">
          {/* 상단 가로 축 라벨: row면 주축, column이면 교차축 */}
          <AxisArrow role={isRow ? 'main' : 'cross'} orient="h" dir={isReverse && isRow ? 'reverse' : 'normal'} />
          <div className="flex items-stretch">
            {/* 왼쪽 세로 축 라벨: row면 교차축, column이면 주축 */}
            <AxisArrow role={isRow ? 'cross' : 'main'} orient="v" dir={isReverse && !isRow ? 'reverse' : 'normal'} />
            <div className="flex-1">{stage}</div>
          </div>
        </div>
      );
    }

        { c: '#d97706', name: '교차축 (cross axis)', desc: '주축에 수직인 방향 · align-items 담당' },

      return (
        <div className="mt-3 grid grid-cols-1 gap-1.5">
          {rows.map((r) => (
            <div key={r.name} className="rounded-lg border bg-white px-2 py-1.5" style={{ borderColor: r.c }}>

                <span className="w-3 h-3 rounded-sm" style={{ background: r.c }} />
                <span className="text-[11px] font-bold" style={{ color: r.c }}>{r.name}</span>
              </div>
              <div className="text-[10px] text-slate-600 mt-0.5">{r.desc}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    function JustifyLegend() {
      const rows = [
        { sym: 'flex-start', desc: '주축 시작으로 몰기(기본)' },
        { sym: 'center', desc: '주축 가운데' },
        { sym: 'space-between', desc: '양끝 붙이고 사이 균등' },
        { sym: 'space-around', desc: '아이템 좌우 같은 여백' },
        { sym: 'space-evenly', desc: '모든 틈 완전 동일' },
      ];
      return (
        <div className="mt-3 rounded-lg border border-sky-200 bg-white p-2">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">justify-content — 주축 분배 5종</div>
          <div className="grid grid-cols-1 gap-1">
            {rows.map((r) => (
              <div key={r.sym} className="flex items-center gap-2 rounded border border-sky-100 bg-sky-50 px-2 py-1">
                <span className="font-mono text-[10px] font-bold text-sky-800 w-28">{r.sym}</span>
                <span className="text-[10px] text-slate-600">{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // align-items 범례 (Step 3)
    // ─────────────────────────────────────────────────────
    function AlignLegend() {
      const rows = [
        { sym: 'stretch', desc: '높이를 컨테이너에 맞춰 늘림(기본)' },
        { sym: 'flex-start / center / flex-end', desc: '위 / 가운데 / 아래' },
        { sym: 'baseline', desc: '글자 기준선 맞춤' },
        { sym: 'align-self', desc: '한 아이템만 예외로 정렬' },
        { sym: 'align-content', desc: '여러 줄(wrap)일 때 줄 전체 분배' },
      ];
      return (
        <div className="mt-3 rounded-lg border border-amber-300 bg-white p-2">
          <div className="text-[11px] font-bold text-amber-800 mb-1.5">교차축 정렬 — items / self / content</div>
          <div className="grid grid-cols-1 gap-1">
            {rows.map((r) => (
              <div key={r.sym} className="flex items-center gap-2 rounded border border-amber-100 bg-amber-50 px-2 py-1">
                <span className="font-mono text-[10px] font-bold text-amber-700 w-52">{r.sym}</span>
                <span className="text-[10px] text-slate-600">{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // flex 단축 범례 (Step 4)
    // ─────────────────────────────────────────────────────
    function FlexLegend() {
      const rows = [
        { sym: 'flex: 1', eq: '1 1 0', desc: 'basis 0 → 폭 완전 균등 분배' },
        { sym: 'flex: auto', eq: '1 1 auto', desc: 'basis 콘텐츠 → 넓은 게 더 넓게' },
        { sym: 'flex: none', eq: '0 0 auto', desc: '안 늘고 안 줆 — 고정 크기' },
        { sym: 'flex-grow: 2', eq: '가중치', desc: '남는 공간을 2배로 차지' },
      ];
      return (
        <div className="mt-3 rounded-lg border border-sky-300 bg-white p-2">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">flex 단축 = grow · shrink · basis</div>
          <table className="w-full text-[10px]">
            <tbody>
              {rows.map((r) => (
                <tr key={r.sym} className="border-t border-sky-100">
                  <td className="py-1 font-mono font-bold text-sky-800 w-24">{r.sym}</td>
                  <td className="py-1 font-mono text-slate-500 w-20">{r.eq}</td>
                  <td className="py-1 text-slate-600">{r.desc}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // gap vs margin 비교표 (Step 5)
    // ─────────────────────────────────────────────────────
    function GapCompare() {
      const rows = [
        { crit: '마지막 예외 처리', gap: '◎ 불필요', mar: '✗ margin:0 매번' },
        { crit: 'row↔column 전환', gap: '◎ 그대로', mar: '✗ 방향 코드 수정' },
        { crit: 'wrap 줄 사이 간격', gap: '◎ 자동', mar: '✗ 따로 처리' },
        { crit: '값 변경', gap: '◎ 한 줄', mar: '✗ 여러 규칙' },
      ];
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-400 bg-gradient-to-br from-sky-50 to-emerald-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">⚖️ gap vs margin 트릭</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b-2 border-sky-300">
                <th className="text-left py-1">기준</th>
                <th className="text-left py-1 pl-2 w-24 font-mono">gap</th>
                <th className="text-left py-1 pl-2 w-28 font-mono">margin 트릭</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.crit} className="border-t border-sky-200">
                  <td className="py-1 text-slate-800">{r.crit}</td>
                  <td className="py-1 pl-2 font-bold text-emerald-700">{r.gap}</td>
                  <td className="py-1 pl-2 font-bold text-red-700">{r.mar}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 축 모델 총정리 (Step 5)
    // ─────────────────────────────────────────────────────
    function Recap() {
      const rows = [
        { q: '주축 분배', a: 'justify-content', c: '#1572B6' },
        { q: '교차축 정렬', a: 'align-items / align-self', c: '#d97706' },
        { q: '크기 분배', a: 'flex: grow shrink basis', c: '#0d9488' },
        { q: '사이 간격', a: 'gap', c: '#7c3aed' },
      ];
      return (
        <div className="mt-3 rounded-lg border border-dashed border-sky-400 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">🧭 헷갈리지 않는 순서: "먼저 주축이 어디인가?"</div>
          <table className="w-full text-[10px]">
            <tbody>
              {rows.map((r) => (
                <tr key={r.q} className="border-t border-sky-100">
                  <td className="py-1 text-slate-700 w-24">{r.q}</td>
                  <td className="py-1 font-mono font-bold" style={{ color: r.c }}>{r.a}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info: { bg: 'bg-sky-50', border: 'border-sky-300', text: 'text-sky-900', icon: '💡' },
      warn: { bg: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      good: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 진짜 flexbox 무대 + 축 화살표 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      direction: { icon: '🧭', label: 'flex-direction' },
      justify:   { icon: '↔️', label: 'justify-content' },
      align:     { icon: '↕️', label: 'align-items' },
      flex:      { icon: '📐', label: 'flex 단축' },
      gap:       { icon: '📏', label: 'gap' },
    };

    function LiveDataPane({ step, activeSel }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.direction;
      const sel = step.selectors[activeSel];

      // 컨테이너 style 조립: base + 선택된 값
      const containerStyle = { ...step.base, ...(sel.container || {}) };

      // 아이템 데이터 조립
      const baseList = sel.useWrapItems ? WRAP_ITEMS : ITEMS;
      const itemsData = baseList.map((item, i) => {
        const data = { item };
        if (sel.items && sel.items[i]) data.flex = sel.items[i];
        if (sel.wrapBasis) data.flex = '0 0 120px';      // wrap 데모: 넓은 basis로 줄바꿈 유도
        if (sel.marginTrick) data.marginTrick = true;
        return data;
      });

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>축 모델 라이브 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <ValueChips selectors={step.selectors} active={activeSel} onPick={() => {}} />

          <div className="text-[10px] text-sky-700 mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            <span className="font-mono font-bold">{sel.sel}</span> — {sel.note}
          </div>

          <FlexStage containerStyle={containerStyle} itemsData={itemsData} />

          {step.extra.axisLegend && <AxisLegend />}
          {step.extra.justifyLegend && <JustifyLegend />}
          {step.extra.alignLegend && <AlignLegend />}
          {step.extra.flexLegend && <FlexLegend />}
          {step.extra.gapCompare && <GapCompare />}
          {step.extra.recap && <Recap />}
          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: layout.css(진화) + index.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'index.html', lang: 'xml', display: 'html', lines: DEMO_HTML, highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [activeSel, setActiveSel] = useState(STEPS[0].defaultSel);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      // 단계 이동 시 해당 단계의 기본 값으로 초기화
      useEffect(() => { setActiveSel(STEPS[stepIdx].defaultSel); }, [stepIdx]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅱ. 레이아웃 양대산맥</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">II-1-1</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">Flexbox 축 모델</h1>
                <p className="text-sm text-sky-800/80">main axis·cross axis와 justify-content·align-items가 정렬을 결정하는 원리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} activeSel={activeSel} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 단계별 값 선택 안내 — 좌측 칩은 현재 단계 값을 나타낸다 */}
            <div className="mt-3 flex flex-wrap gap-1.5 justify-center">
              {step.selectors.map((s, i) => (
                <button
                  key={s.sel}
                  onClick={() => setActiveSel(i)}
                  aria-pressed={i === activeSel}
                  className={`px-2.5 py-1 rounded-md border text-[11px] font-mono transition ${
                    i === activeSel
                      ? 'bg-sky-600 border-sky-700 text-white font-bold shadow'
                      : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'
                  }`}
                >
                  {s.sel}
                </button>
              ))}
            </div>

            {/* 컨트롤 */}
            <div className="mt-4 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 위 값 칩을 눌러 라이브 컨테이너를 직접 바꿔보라</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Flexbox는 언제나 "두 축" 위에서 움직인다. flex-direction이 주축·교차축의 방향을 정하고,
                주축 분배는 justify-content, 교차축 정렬은 align-items(예외는 align-self, 여러 줄은 align-content),
                크기 분배는 flex(grow·shrink·basis), 사이 간격은 gap이 맡는다.
                방향을 바꾸면 justify와 align의 역할이 뒤바뀐다는 것만 기억하면 "세로 가운데가 안 돼요" 같은 사고는 사라진다.
                다음 장에서는 또 하나의 축(Grid)으로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Flexbox', 'main-axis', 'cross-axis', 'flex-direction', 'justify-content', 'align-items', 'align-self', 'align-content', 'flex-grow', 'flex-shrink', 'flex-basis', 'flex:1', 'flex-wrap', 'gap'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
