              </div>
            </div>
          </div>
          <div style={{ display: 'flex', justifyContent: jc, alignItems: ai, height: 170 }}

          <div className="mt-2 text-[10px] text-sky-800 font-mono">justify: {jc} · align: {ai}

          </div>

    // Step 2: 양끝 내비바
    function NavbarDemo({ width }) {

          <div style={{ width }} className="mx-auto transition-all duration-300">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
              className="rounded-lg border-2 border-sky-400 bg-white px-3 py-2 shadow">
              <div className="px-2 py-1 rounded bg-sky-600 text-white font-bold text-sm">LOGO</div>
              <div style={{ display: 'flex', gap: 14, alignItems: 'center' }} className="text-[12px] text-sky-800 font-bold">
                <span>홈</span><span>소개</span><span>문의</span>
                <span className="px-2 py-1 rounded bg-sky-100 border border-sky-300 text-[11px]">로그인</span>
              </div>
            </div>
          </div>
          <div className="mt-2 flex items-center justify-center gap-1 text-[10px] text-slate-500">
            <span className="px-1.5 py-0.5 rounded bg-sky-100 text-sky-800 font-mono">첫 자식 → 왼쪽 끝</span>
            <span className="text-slate-400">·</span>
            <span className="px-1.5 py-0.5 rounded bg-sky-100 text-sky-800 font-mono">마지막 자식 → 오른쪽 끝</span>
          </div>
        </div>
      );
    }

    // Step 3: 반응형 카드 — 폭에 따라 열 수가 접힘
    function CardsDemo({ width }) {
      const cards = [
        { t: 'flex-wrap', d: '넘치면 다음 줄' },
        { t: 'gap', d: '카드 간격' },
        { t: 'flex-basis', d: '기본 목표 폭' },
        { t: 'grow/shrink', d: '늘고 줄고' },
      ];
      // 대략적인 열 수 계산(시각 보조용): basis 200 + gap 12
      const cols = Math.max(1, Math.floor((width + 12) / 212));
      return (
        <div>
          <div style={{ width }} className="mx-auto transition-all duration-300">
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12 }}
              className="rounded-lg border-2 border-dashed border-sky-400 bg-sky-50 p-2">
              {cards.map((c) => (
                <article key={c.t} style={{ flex: '1 1 200px' }}
                  className="rounded-lg border border-sky-300 bg-white px-3 py-2.5 shadow-sm">
                  <div className="font-mono text-[12px] font-bold text-sky-800">{c.t}</div>
                  <div className="text-[10px] text-slate-500 mt-0.5">{c.d}</div>
                </article>
              ))}
            </div>
          </div>
          <div className="mt-2 text-center text-[10px] text-sky-800">
            현재 폭 <span className="font-mono font-bold">{width}px</span> → 약 <span className="font-mono font-bold text-emerald-700">{cols}열</span>로 자동 배치 (미디어쿼리 0줄)
          </div>
        </div>
      );
    }

    // Step 4: 미디어 오브젝트 — shrink 고정 여부를 토글해 찌그러짐 재현
    function MediaDemo() {
      const [fixed, setFixed] = useState(true);
      return (
        <div>
          <div className="flex items-center gap-2 mb-2 text-[11px]">
            <span className="text-sky-800 font-bold">아바타 flex-shrink</span>
            <button onClick={() => setFixed(true)}
              className={`px-2 py-0.5 rounded border font-mono text-[10px] ${fixed ? 'bg-emerald-600 border-emerald-700 text-white' : 'bg-white border-slate-300 text-slate-600'}`}>0 (고정)</button>
            <button onClick={() => setFixed(false)}
              className={`px-2 py-0.5 rounded border font-mono text-[10px] ${!fixed ? 'bg-red-600 border-red-700 text-white' : 'bg-white border-slate-300 text-slate-600'}`}>1 (기본·찌그러짐)</button>
          </div>
          <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start', width: 300 }}
            className="mx-auto rounded-lg border-2 border-sky-400 bg-white p-3 shadow">
            <div style={{ flex: fixed ? '0 0 48px' : '1 1 48px', height: 48 }}
              className={`rounded-full flex items-center justify-center text-white font-bold text-sm ${fixed ? 'bg-sky-600' : 'bg-red-500'}`}>
              🙂
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="text-sm font-bold text-slate-800">홍길동 <span className="text-[10px] text-slate-400 font-normal">· 방금</span></div>
              <p className="text-[11px] text-slate-600 mt-0.5">본문만 flex:1 로 남는 폭을 전부 차지한다. 긴 텍스트도 min-width:0 덕에 정상 줄바꿈된다.</p>
            </div>
          </div>
          <div className={`mt-2 text-[10px] font-bold ${fixed ? 'text-emerald-700' : 'text-red-600'}`}>
            {fixed ? '✔ flex-shrink:0 → 원형 아바타 유지' : '✗ shrink 기본값 → 아바타가 타원으로 눌림(본문이 밀어냄)'}
          </div>
        </div>
      );
    }

    // Step 5: 스티키 푸터 — 콘텐츠 양을 늘렸다 줄이며 푸터 위치 확인
    function StickyDemo() {
      const [lines, setLines] = useState(1);
      const tall = lines >= 4;
      return (
        <div>
          <div className="flex items-center gap-2 mb-2 text-[11px]">
            <span className="text-sky-800 font-bold">본문 콘텐츠</span>
            <button onClick={() => setLines((n) => Math.max(1, n - 1))}
              className="px-2 py-0.5 rounded border border-sky-300 bg-white text-sky-800 font-mono text-[11px]">−</button>
            <span className="font-mono text-sky-900 font-bold w-6 text-center">{lines}</span>
            <button onClick={() => setLines((n) => Math.min(8, n + 1))}
              className="px-2 py-0.5 rounded border border-sky-300 bg-white text-sky-800 font-mono text-[11px]">+</button>
            <span className="text-[10px] text-slate-500">문단</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', height: 240, overflow: 'auto' }}
            className="rounded-lg border-2 border-dashed border-sky-400 bg-sky-50 mx-auto" >
            <div style={{ flex: '0 0 auto' }} className="bg-sky-700 text-white text-center text-[11px] font-bold py-1.5">헤더</div>
            <main style={{ flex: 1 }} className="p-2 space-y-1">
              {Array.from({ length: lines }).map((_, i) => (
                <p key={i} className="text-[10px] text-slate-600 bg-white rounded border border-sky-200 px-2 py-1">본문 문단 {i + 1} — main 이 남는 세로 공간을 밀어낸다</p>
              ))}
            </main>
            <div style={{ flex: '0 0 auto' }} className="bg-sky-900 text-white text-center text-[11px] font-bold py-1.5">푸터 (항상 바닥)</div>
          </div>
          <div className="mt-2 text-[10px] font-bold text-emerald-700">
            {tall ? '콘텐츠가 길어짐 → 푸터가 아래로 밀려 정상 스크롤(내용 안 가림)' : '콘텐츠가 짧아도 → main flex:1 이 밀어내 푸터가 바닥에 고정 ✔'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 컨테이너 폭 슬라이더 — navbar/cards 단계에서 반응형 재배치 시연
    // ─────────────────────────────────────────────────────
    function WidthSlider({ width, setWidth }) {
      return (
        <div className="mb-3 rounded-lg border border-sky-200 bg-sky-50 px-3 py-2">
          <div className="flex items-center gap-2">
            <span className="text-[11px] font-bold text-sky-900">📏 컨테이너 폭</span>
            <input type="range" min="220" max="560" value={width}
              onChange={(e) => setWidth(Number(e.target.value))}
              className="flex-1 accent-sky-600" aria-label="컨테이너 폭 조절" />
            <span className="text-[11px] font-mono font-bold text-sky-800 w-14 text-right">{width}px</span>
          </div>
          <div className="text-[10px] text-slate-500 mt-1">폭을 줄이면 flex 가 미디어쿼리 없이 알아서 재배치한다</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 각 실전 패턴을 실제 flex 로 렌더
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      center:  { icon: '🎯', label: '완전 센터링' },
      navbar:  { icon: '🧭', label: '양끝 내비바' },
      cards:   { icon: '🗂', label: '반응형 카드' },
      media:   { icon: '💬', label: '미디어 오브젝트' },
      sticky:  { icon: '📌', label: '스티키 푸터' },
    };

    function LiveDataPane({ step, width, setWidth }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.center;
      const useSlider = step.engine === 'navbar' || step.engine === 'cards';
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>Flex 실전 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          {useSlider && <WidthSlider width={width} setWidth={setWidth} />}

          {step.engine === 'center' && <CenterDemo />}
          {step.engine === 'navbar' && <NavbarDemo width={width} />}
          {step.engine === 'cards'  && <CardsDemo width={width} />}
          {step.engine === 'media'  && <MediaDemo />}
          {step.engine === 'sticky' && <StickyDemo />}

          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: patterns.css(진화) + demo.html(패턴 마크업)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'demo.html',       lang: 'xml', display: 'html', lines: DEMO_HTML,      highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [width, setWidth] = useState(STEPS[0].width);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      // 단계 이동 시 해당 단계의 기본 폭으로 초기화
      useEffect(() => { setWidth(STEPS[stepIdx].width); }, [stepIdx]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅱ. 레이아웃 양대산맥</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">II-1-2</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">Flex 실전 패턴</h1>
                <p className="text-sm text-sky-800/80">실무에서 매일 쓰는 flexbox 조합 — 내비바·카드·센터링·미디어오브젝트·스티키 푸터</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} width={width} setWidth={setWidth} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측에서 값·폭을 직접 바꿔 flex 동작을 확인</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리 — Flex 5대 실전 패턴</div>
                ① 완전 센터링 = justify-content:center + align-items:center. ② 양끝 내비바 = space-between + align-items:center.
                ③ 반응형 카드 = flex-wrap + gap + flex:1 1 &lt;basis&gt;(미디어쿼리 없이 열 수 자동). ④ 미디어 오브젝트 = 본문 flex:1 + 아이콘 flex-shrink:0(찌그러짐 방지).
                ⑤ 스티키 푸터 = min-height:100vh + flex-direction:column + main flex:1. 공통 함정은 gap 대신 margin, shrink 방치, 자손 공백 — 다음 장에서 Grid 로 2차원 레이아웃으로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['flexbox', '완전센터링', 'justify-content', 'align-items', 'space-between', '내비바', 'flex-wrap', 'gap', 'flex-basis', '반응형카드', '미디어오브젝트', 'flex-shrink', '스티키푸터', '100vh'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
