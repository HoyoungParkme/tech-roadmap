<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 학습 — I-1-1. 선택자 지도</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎯</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    CSS I-1-1 — 선택자 지도
    학습 목표: 같은 DOM 트리 위에서 "무엇을 꾸밀지" 가리키는 4가지 도구를 순서대로 익힌다.
              기본 선택자 → 결합자(관계) → 속성·가상클래스(상태/조건) → 가상요소(생성) → 선택자 전략.
    패턴: v1 — 좌(LiveDataPane: DOM 트리 + 선택자 클릭 시 매칭 노드 하이라이트, 라이브 hover/focus 데모)
              우(VSCode CodeViewer: selectors.css 진화 + demo.html 탭)
    색상: blue/sky (CSS 브랜드 #1572B6 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공통 DOM 트리 — 카드 컴포넌트 페이지 (모든 단계가 이 트리 하나를 공유한다)
    //   key   : 노드 식별자 (선택자 매칭 결과가 가리키는 대상)
    //   depth : 들여쓰기 깊이
    //   sel   : 트리에 표시할 CSS 표기 (예: a.link.active)
    // ─────────────────────────────────────────────────────
    const TREE = [
      { key: 'body',   depth: 0, sel: 'body',                  text: '' },
      { key: 'header', depth: 1, sel: 'header#header',         text: '' },
      { key: 'h1',     depth: 2, sel: 'h1.title',              text: 'CSS 지도' },
      { key: 'nav',    depth: 2, sel: 'nav.nav',               text: '' },
      { key: 'aHome',  depth: 3, sel: 'a.link',                text: '홈' },
      { key: 'aDocs',  depth: 3, sel: 'a.link.active',         text: '문서' },
      { key: 'main',   depth: 1, sel: 'main.content',          text: '' },
      { key: 'section',depth: 2, sel: 'section.cards',         text: '' },
      { key: 'art1',   depth: 3, sel: 'article.card',          text: '' },
      { key: 't1',     depth: 4, sel: 'h2.card-title',         text: '기본' },
      { key: 'p1',     depth: 4, sel: 'p.card-text',           text: '가장 많이…' },
      { key: 'b1',     depth: 4, sel: 'a.btn',                 text: '자세히' },
      { key: 'art2',   depth: 3, sel: 'article.card.featured', text: '' },
      { key: 't2',     depth: 4, sel: 'h2.card-title',         text: '추천' },
      { key: 'p2',     depth: 4, sel: 'p.card-text',           text: '주력으로…' },
      { key: 'b2',     depth: 4, sel: 'a.btn.primary',         text: '구매' },
      { key: 'form',   depth: 2, sel: 'form.search',           text: '' },
      { key: 'inp',    depth: 3, sel: 'input[type="text"]',    text: '' },
      { key: 'b3',     depth: 3, sel: 'button.btn',            text: '검색' },
      { key: 'footer', depth: 1, sel: 'footer.footer',         text: '' },
      { key: 'copy',   depth: 2, sel: 'p.copy',                text: '© 2026' },
    ];
    const ALL = TREE.map((n) => n.key);

    // ─────────────────────────────────────────────────────
    // demo.html — 모든 단계 공통(변하지 않는 마크업). CodeViewer 두 번째 탭.
    // ─────────────────────────────────────────────────────
    const DEMO_HTML = [
      '<!DOCTYPE html>',
      '<html lang="ko">',
      '<head>',
      '  <link rel="stylesheet" href="selectors.css" />',
      '</head>',
      '<body>',
      '  <header id="header">',
      '    <h1 class="title">CSS 지도</h1>',
      '    <nav class="nav">',
      '      <a class="link" href="#">홈</a>',
      '      <a class="link active" href="#">문서</a>',
      '    </nav>',
      '  </header>',
      '  <main class="content">',
      '    <section class="cards">',
      '      <article class="card">',
      '        <h2 class="card-title">기본</h2>',
      '        <p class="card-text">가장 많이 쓰는 선택자</p>',
      '        <a class="btn" href="#">자세히</a>',
      '      </article>',
      '      <article class="card featured">',
      '        <h2 class="card-title">추천</h2>',
      '        <p class="card-text">주력으로 쓰는 클래스</p>',
      '        <a class="btn primary" href="#">구매</a>',
      '      </article>',
      '    </section>',
      '    <form class="search">',
      '      <input type="text" placeholder="검색어" />',
      '      <button class="btn">검색</button>',
      '    </form>',
      '  </main>',
      '  <footer class="footer">',
      '    <p class="copy">© 2026 CSS Study</p>',
      '  </footer>',
      '</body>',
      '</html>',
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 — 선택자 지도
    //   selectors : 좌측에서 클릭 가능한 선택자 칩. matches = 하이라이트할 key 배열
    //   extra     : 단계별 보조 시각화 플래그
    //   css       : selectors.css 코드(진화) + 하이라이트 라인 / htmlHi = demo.html 강조 라인
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },

          caption: '클래스를 겹쳐 붙이면 조건이 된다. 추천 카드 안의 주력 버튼 하나만 정확히 걸린다.',
          changes: [
            { mark: 'new', text: '.card.featured .btn.primary 규칙' },
            { mark: 'changed', text: '매칭 2개 → 1개' },
          ],
        },
        defaultSel: 2,
        extra: { strategyCompare: true },
        alert: { tone: 'good', text: '.card.featured 처럼 클래스를 붙여 쓰면 "둘 다 가진 요소"라는 뜻이다 — 공백과 혼동하지 않도록 주의한다.' },
        css: { ...CSS.s5, highlight: [8, 9, 10, 11], htmlHi: [] },
      },
      { ...S5,
        beat: {
          label: '겨냥한 요소 확인',
          at: 'demo.html L21–25',
          caption: 'featured 카드 안의 primary 버튼이 목표다. 두 이름표가 겹쳐 있어 한 요소만 특정된다.',
          changes: [
            { mark: 'read', text: 'class="card featured" 확인' },
            { mark: 'read', text: 'class="btn primary" 확인' },
          ],
        },
        defaultSel: 2,
        extra: { strategyCompare: true },
        alert: { tone: 'info', text: '겨냥이 어려우면 선택자를 늘리기 전에 이름표를 하나 더 붙이는 편이 낫다.' },
        css: { ...CSS.s5, highlight: [], htmlHi: [21, 22, 23, 24, 25] },
      },
      { ...S5,
        beat: {
          label: '남는 문제 — 누가 이기나',
          at: 'selectors.css L18–22',
          caption: '같은 버튼을 여러 선택자가 노리면 승부는 명시도로 갈린다. 계산법은 다음 장에서 다룬다.',
          changes: [
            { mark: 'new', text: '명시도 예고 표시' },
            { mark: 'read', text: '아이디가 클래스를 압도' },
          ],
        },
        defaultSel: 2,
        extra: { strategyCompare: true, specificityPreview: true },
        alert: { tone: 'good', text: '갈림길: "이 요소에 클래스 이름표를 붙여 직접 겨냥할 수 있는가?" — 대부분 Yes 다. 구조를 타고 내려가는 긴 선택자 대신 컴포넌트마다 클래스를 두면, 성능·가독성·유지보수가 동시에 좋아진다. 남는 문제는 "명시도" 뿐이다.' },
        css: { ...CSS.s5, highlight: [18, 19, 20, 21, 22], htmlHi: [] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 선택자 칩 목록 — 클릭으로 매칭 대상을 바꾼다 (인터랙티브 핵심)
    // ─────────────────────────────────────────────────────
    function SelectorChips({ selectors, active, onPick }) {
      return (
        <div className="flex flex-wrap gap-1.5 mb-3">
          {selectors.map((s, i) => (
            <button
              key={s.sel}
              onClick={() => onPick(i)}
              className={`px-2 py-1 rounded-md border text-[11px] font-mono transition ${
                i === active
                  ? 'bg-sky-600 border-sky-700 text-white font-bold shadow'
                  : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'
              }`}
            >
              {s.sel}
              <span className={`ml-1 text-[9px] font-sans ${i === active ? 'text-sky-100' : 'text-slate-400'}`}>{s.kind}</span>
            </button>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // DOM 트리 — 활성 선택자가 고른 노드를 파랗게 하이라이트
    //   pseudo : 가상요소 단계에서 생성 조각(배지)을 함께 그린다
    // ─────────────────────────────────────────────────────
    function DomTree({ matchSet, activeSel }) {
      const badge = activeSel && activeSel.badge;
      const pos = activeSel && activeSel.pos;
      return (
        <div className="rounded-lg border border-sky-200 bg-white p-2.5 font-mono text-[11px] leading-6">
          {TREE.map((n) => {
            const on = matchSet.has(n.key);
            return (
              <div
                key={n.key}
                style={{ marginLeft: n.depth * 14 }}
                className={`flex items-center gap-1.5 rounded px-1.5 my-px transition ${
                  on
                    ? 'bg-sky-100 border border-sky-500 text-sky-900 font-bold'
                    : 'border border-transparent text-slate-400'
                }`}
              >
                <span className="text-slate-300">{'└'}</span>
                <span>
                  {on && pos === 'before' && badge && <span className="text-amber-600">{badge}</span>}
                  {n.sel}
                  {on && pos === 'after' && badge && <span className="text-amber-600">{badge}</span>}
                </span>
                {n.text && <span className="text-[9px] text-slate-400 font-sans">“{n.text}”</span>}
                {on && pos === 'line' && badge && (
                  <span className="text-[9px] px-1 rounded bg-amber-100 text-amber-800 border border-amber-300">{badge} 첫 줄</span>
                )}
                {on && (
                  <span className="ml-auto text-[9px] px-1 rounded bg-sky-600 text-white">✓ 매칭</span>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 기본 선택자 4종 범례 (Step 1)
    // ─────────────────────────────────────────────────────
    function BasicLegend() {
      const rows = [
        { sym: 'div',   name: '타입',   desc: '태그 이름 — 넓고 재사용 안 됨' },
        { sym: '.btn',  name: '클래스', desc: '이름표 — 실무 주력, 재사용' },
        { sym: '#id',   name: '아이디', desc: '하나뿐 — 명시도 높아 신중히' },
        { sym: '*',     name: '전체',   desc: '모두 — reset 외엔 지양' },
      ];
      return (
        <div className="mt-3 grid grid-cols-2 gap-1.5">
          {rows.map((r) => (
            <div key={r.name} className="rounded-lg border border-sky-200 bg-sky-50 px-2 py-1.5">
              <div className="flex items-center gap-1.5">
                <span className="font-mono text-[11px] font-bold text-sky-800">{r.sym}</span>
                <span className="text-[10px] text-sky-900 font-bold">{r.name}</span>
              </div>
              <div className="text-[10px] text-slate-600 mt-0.5">{r.desc}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 결합자 범례 (Step 2)
    // ─────────────────────────────────────────────────────
    function ComboLegend() {
      const rows = [
        { sym: 'A B',   name: '자손',     desc: 'A 아래 어디든 (깊이 무관)' },
        { sym: 'A > B', name: '자식',     desc: '바로 한 칸 아래만' },
        { sym: 'A + B', name: '인접형제', desc: 'A 바로 뒤 형제 하나' },
        { sym: 'A ~ B', name: '일반형제', desc: 'A 뒤 형제 전부' },
      ];
      return (
        <div className="mt-3 rounded-lg border border-sky-200 bg-white p-2">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">결합자 4종 — 공백과 &gt; 의 차이가 핵심</div>
          <div className="grid grid-cols-2 gap-1.5">
            {rows.map((r) => (
              <div key={r.name} className="rounded border border-sky-200 bg-sky-50 px-2 py-1">
                <span className="font-mono text-[11px] font-bold text-sky-800">{r.sym}</span>
                <span className="ml-1.5 text-[10px] text-sky-900 font-bold">{r.name}</span>
                <div className="text-[9px] text-slate-600">{r.desc}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 라이브 hover/focus 데모 (Step 3) — 실제 상호작용
    // ─────────────────────────────────────────────────────
    function LiveDemo() {
      const [hovered, setHovered] = useState(false);
      const [focused, setFocused] = useState(false);
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-2">🖱 라이브 데모 — 직접 올려보고 클릭해보라</div>
          <div className="flex items-center gap-3 flex-wrap">
            <button
              onMouseEnter={() => setHovered(true)}
              onMouseLeave={() => setHovered(false)}
              className="px-4 py-1.5 rounded text-sm font-bold transition"
              style={{
                background: hovered ? '#0d5a92' : '#1572B6',
                color: '#fff',
                textDecoration: hovered ? 'underline' : 'none',
              }}
            >
              구매 {hovered ? '(:hover ✔)' : ''}
            </button>
            <input
              onFocus={() => setFocused(true)}
              onBlur={() => setFocused(false)}
              placeholder="여기를 클릭"
              className="px-3 py-1.5 rounded text-sm"
              style={{
                border: focused ? '2px solid #1572B6' : '1px solid #cfc9ba',
                outline: 'none',
              }}
            />
            <span className="text-[10px] text-slate-500">
              {focused ? 'input:focus ✔ 켜짐' : hovered ? 'a:hover ✔ 켜짐' : '상태: idle'}
            </span>
          </div>
          <div className="mt-2 text-[10px] text-sky-800">JS 이벤트 없이 CSS :hover / :focus 만으로도 정확히 이 효과를 낸다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 가상요소 생성 데모 (Step 4)
    // ─────────────────────────────────────────────────────
    function PseudoDemo({ activeSel }) {
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="text-[11px] font-bold text-amber-900 mb-2">✨ 생성된 조각 미리보기 — HTML엔 없는 내용</div>
          <div className="space-y-1.5">
            <div className="rounded border border-slate-300 bg-white px-2 py-1 text-sm">
              <span className="text-amber-600 font-bold">📌 </span>
              <span className="font-bold">추천</span>
              <span className="ml-2 text-[9px] text-slate-400 font-mono">.card-title::before {'{'} content:"📌 " {'}'}</span>
            </div>
            <div className="rounded border border-slate-300 bg-white px-2 py-1 text-sm">
              <span className="inline-block px-2 py-0.5 rounded bg-sky-600 text-white text-xs">구매<span className="text-amber-200 font-bold"> →</span></span>
              <span className="ml-2 text-[9px] text-slate-400 font-mono">.btn::after {'{'} content:" →" {'}'}</span>
            </div>
            <div className="rounded border border-slate-300 bg-white px-2 py-1 text-sm">
              <span className="font-bold">주력으로 쓰는</span> 클래스로 카드를 만든다
              <span className="ml-2 text-[9px] text-slate-400 font-mono">::first-line {'{'} font-weight:700 {'}'}</span>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-amber-900">현재 선택: <span className="font-mono font-bold">{activeSel.sel}</span> — content 가 없으면 ::before/::after 는 그려지지 않는다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좋은/나쁜 선택자 비교 (Step 5)
    // ─────────────────────────────────────────────────────
    function StrategyCompare() {
      const rows = [
        { crit: '읽기 쉬움', good: '◎ 한눈에', bad: '✗ 구조 추적' },
        { crit: '성능(매칭 속도)', good: '◎ 얕음', bad: '✗ 우→좌 역추적' },
        { crit: '마크업 변경 내성', good: '◎ 강함', bad: '✗ 쉽게 깨짐' },
        { crit: '재사용', good: '◎ 클래스', bad: '✗ 위치 고정' },
      ];
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-400 bg-gradient-to-br from-sky-50 to-emerald-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">⚖️ 좋은 선택자 vs 나쁜 선택자</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b-2 border-sky-300">
                <th className="text-left py-1">기준</th>
                <th className="text-left py-1 pl-2 w-28 font-mono">.card .btn</th>
                <th className="text-left py-1 pl-2 w-28 font-mono">body … a span</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.crit} className="border-t border-sky-200">
                  <td className="py-1 text-slate-800">{r.crit}</td>
                  <td className="py-1 pl-2 font-bold text-emerald-700">{r.good}</td>
                  <td className="py-1 pl-2 font-bold text-red-700">{r.bad}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 명시도 예고 (Step 5) — 다음 장 I-1-2 티저
    // ─────────────────────────────────────────────────────
    function SpecificityPreview() {
      const rows = [
        { sel: '.btn',                w: '(0,0,1,0)', note: '클래스 1' },
        { sel: '.card.featured .btn', w: '(0,0,3,0)', note: '클래스 3 — 더 강함' },
        { sel: '#header .btn',        w: '(0,1,1,0)', note: '아이디가 압도' },
      ];
      return (
        <div className="mt-3 rounded-lg border border-dashed border-sky-400 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">🔜 명시도 미리보기 — 같은 요소를 여러 선택자가 노리면?</div>
          <table className="w-full text-[10px]">
            <tbody>
              {rows.map((r) => (
                <tr key={r.sel} className="border-t border-sky-100">
                  <td className="py-1 font-mono text-sky-800">{r.sel}</td>
                  <td className="py-1 pl-2 font-mono font-bold text-slate-700">{r.w}</td>
                  <td className="py-1 pl-2 text-slate-500">{r.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-sky-800">“누가 이기나”의 규칙 = 명시도. 다음 장 <span className="font-mono font-bold">I-1-2</span> 에서 계산법을 다룬다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — DOM 트리 + 선택자 하이라이트 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      basic:    { icon: '🎯', label: '기본 선택자' },
      combo:    { icon: '🔗', label: '결합자' },
      state:    { icon: '⚡', label: '상태·조건' },
      pseudo:   { icon: '✨', label: '가상요소' },
      strategy: { icon: '🧭', label: '선택자 전략' },
    };

    function LiveDataPane({ beat, step, activeSel, setActiveSel }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.basic;
      const sel = step.selectors[activeSel];
      const matchSet = new Set(sel ? sel.matches : []);
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>선택자 지도 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <SelectorChips selectors={step.selectors} active={activeSel} onPick={setActiveSel} />

          <div className="text-[10px] text-sky-700 mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            <span className="font-mono font-bold">{sel.sel}</span> — {sel.note} · <span className="font-bold">{sel.matches.length}개</span> 매칭
          </div>

          <DomTree matchSet={matchSet} activeSel={sel} />

          {step.extra.basicLegend && <BasicLegend />}
          {step.extra.comboLegend && <ComboLegend />}
          {step.extra.liveDemo && <LiveDemo />}
          {step.extra.pseudoDemo && <PseudoDemo activeSel={sel} />}
          {step.extra.strategyCompare && <StrategyCompare />}
          {step.extra.specificityPreview && <SpecificityPreview />}
          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: selectors.css(진화) + demo.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      // 단계가 바뀌면 css 탭으로 되돌린다
      // beat 가 html 쪽을 강조하면 그 탭을 열어 준다 (css 강조가 있으면 css 우선)
      useEffect(() => {
        const cssHi = (step.css.highlight || []).length;
        const htmlHi = (step.css.htmlHi || []).length;
        setTab(!cssHi && htmlHi ? 1 : 0);
      }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'demo.html',       lang: 'xml', display: 'html', lines: DEMO_HTML,      highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 현재 탭 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [activeSel, setActiveSel] = useState(STEPS[0].defaultSel);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      // 단계 이동 시 해당 단계의 기본 선택자로 초기화
      useEffect(() => { setActiveSel(STEPS[stepIdx].defaultSel); }, [stepIdx]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Part 1</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">I-1-1</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">선택자 지도</h1>
                <p className="text-sm text-sky-800/80">무엇을 꾸밀지 정확히 가리키는 법 — 선택자를 알면 CSS의 절반이 끝난다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} step={step} activeSel={activeSel} setActiveSel={setActiveSel} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 선택자 칩을 눌러 매칭을 비교</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                선택자는 스타일을 "어디에 바를지" 가리키는 주소다. 기본(타입·클래스·아이디·전체)으로 대상을 고르고,
                결합자로 관계를 좁히고, 속성·가상클래스로 상태·조건을 잡고, 가상요소로 없는 조각을 생성한다.
                실무 원칙은 "클래스 중심, 얕게" — 성능·가독성·유지보수가 함께 좋아진다.
                남는 문제는 여러 선택자가 같은 요소를 노릴 때 "누가 이기나" 인데 — 다음 장 I-1-2에서 명시도로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['선택자', '타입선택자', '클래스', '아이디', '결합자', '자손·자식', '가상클래스', 'hover', 'nth-child', '가상요소', 'before·after', '선택자전략', '명시도예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 명시도 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
