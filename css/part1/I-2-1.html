<body>
  <div id="root"></div>

  <!--
    CSS I-2-1 — 상속과 초기값
    학습 목표: 어떤 CSS 속성은 자식에게 "흐르고"(상속) 어떤 건 안 흐르는지,
              그 경계가 왜 텍스트/박스로 나뉘는지, 그리고 inherit·initial·unset·revert 로
              흐름을 어떻게 제어하는지 익힌다. 초기값 vs 브라우저(UA) 기본의 차이와 reset 이유까지.
    패턴: v1 — 좌(LiveDataPane: DOM 트리에서 속성이 아래로 흐르는지 시각화 + 제어 키워드/다크모드 데모)
              우(VSCode CodeViewer: inheritance.css 진화 + demo.html 탭)
    색상: blue/sky (CSS 브랜드 #1572B6 감각) — I-1-1 과 동일 계열
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공통 DOM 트리 — 카드 페이지. 모든 단계가 이 트리 하나를 공유한다.
    //   key   : 노드 식별자 (상속이 닿는 대상)
    //   parent: 부모 key (상속의 "흐름"을 계산할 때 쓴다)
    //   depth : 들여쓰기 깊이
    //   tag   : 트리에 표시할 표기
    // ─────────────────────────────────────────────────────
    const TREE = [
      { key: 'body',   parent: null,   depth: 0, tag: 'body',          text: '' },
      { key: 'header', parent: 'body', depth: 1, tag: 'header',        text: '' },
      { key: 'h1',     parent: 'header', depth: 2, tag: 'h1',          text: '문서 제목' },
      { key: 'main',   parent: 'body', depth: 1, tag: 'main',          text: '' },
      { key: 'card',   parent: 'main', depth: 2, tag: 'article.card',  text: '' },
      { key: 'h2',     parent: 'card', depth: 3, tag: 'h2',            text: '카드 제목' },
      { key: 'p',      parent: 'card', depth: 3, tag: 'p',             text: '본문 문장' },
      { key: 'btn',    parent: 'card', depth: 3, tag: 'a.btn',         text: '버튼' },
      { key: 'footer', parent: 'body', depth: 1, tag: 'footer',        text: '' },
      { key: 'small',  parent: 'footer', depth: 2, tag: 'small',       text: '© 2026' },
    ];
    const ALL = TREE.map((n) => n.key);
    const CARD = ['card', 'h2', 'p', 'btn'];

    // ─────────────────────────────────────────────────────
    // demo.html — 모든 단계 공통(변하지 않는 마크업). CodeViewer 두 번째 탭.
    // ─────────────────────────────────────────────────────
    const DEMO_HTML = [
      '<!DOCTYPE html>',
      '<html lang="ko">',
      '<head>',
      '  <link rel="stylesheet" href="inheritance.css" />',
      '</head>',
      '<body>',
      '  <header>',
      '    <h1>문서 제목</h1>',
      '  </header>',
      '  <main>',
      '    <article class="card">',
      '      <h2>카드 제목</h2>',
      '      <p>카드 본문 문장입니다.</p>',
      '      <a class="btn" href="#">버튼</a>',
      '    </article>',
      '  </main>',
      '  <footer>',
      '    <small>© 2026 CSS Study</small>',
      '  </footer>',
      '</body>',
      '</html>',
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 — 상속과 초기값
    //   props : 좌측에서 클릭 가능한 속성/키워드 칩.
    //           matches = 값이 닿는(적용되는) 노드, inherited = 상속으로 흐르는가,
    //           setAt = 선언한 노드, origin = 'author' | 'ua'
    //   extra : 단계별 보조 시각화 플래그
    //   css   : inheritance.css 코드(진화) + 하이라이트 라인 / htmlHi = demo.html 강조 라인
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 상속의 발견 — 흐르는 속성 vs 멈추는 속성',
        desc: 'body 에 color 를 한 번 줬을 뿐인데 h1·h2·p·버튼까지 전부 그 색이 된다. 반면 .card 에 준 border 나 background 는 자식에게 조금도 흐르지 않는다. 이것이 상속이다 — 어떤 속성은 명세가 "부모 값을 자식이 물려받는다"고 정해 두었고, 어떤 속성은 그렇지 않다. 대체로 글자(텍스트) 관련 속성은 흐르고, 박스(레이아웃) 관련 속성은 멈춘다. 아래 트리에서 속성을 눌러 값이 어디까지 흘러 내려가는지 직접 비교해 보라.',
        engine: 'flow',
        engineDetail: 'color · font-family (흐름) vs border · background (멈춤)',
        props: [
          { name: 'color',            inherited: true,  setAt: 'body', origin: 'author', note: '텍스트 색 — 자손 전부로 흐른다', matches: ALL },
          { name: 'font-family',      inherited: true,  setAt: 'body', origin: 'author', note: '글꼴 — 역시 전부로 흐른다',       matches: ALL },
          { name: 'border',           inherited: false, setAt: 'card', origin: 'author', note: '테두리 — .card 에만, 안 흐른다',  matches: ['card'] },
          { name: 'background-color', inherited: false, setAt: 'card', origin: 'author', note: '배경 — 역시 흐르지 않는다',       matches: ['card'] },
        ],
        defaultSel: 0,
        extra: { flowLegend: true },
        alert: { tone: 'info', text: 'color·font 를 body 에 한 번만 선언하면 페이지 전체 텍스트가 통일된다 — 매 요소마다 다시 쓸 필요가 없다. 반대로 border 가 상속됐다면 카드 안 모든 글자·버튼에 테두리가 겹겹이 생겼을 것이다. "흐름"의 유무 자체가 설계 도구다.' },
        css: {
          filename: 'inheritance.css',
          lines: [
            '/* 1) 상속의 발견 — 무엇이 아래로 흐르나 */',

            '/* body 에 한 번 준 값이 자손 "전부" 로 흐른다 */',
            'body {',
            '  color: #1e3a5f;           /* 상속 O → 모든 텍스트 */',
            '  font-family: Pretendard;  /* 상속 O → 모든 텍스트 */',
            '}',
            '',
            '/* border/background 는 자식에게 "흐르지 않는다" */',

            '}',
            '',
            '/* h2·p·a 에 color 를 다시 안 줘도 남색이다 (상속 덕분) */',
            'h2, p, .btn {',
            '  /* color 선언 없음 — body 값을 물려받는다 */',
            '}',
          ],
          highlight: [4, 5, 6, 10, 11, 12, 13],
          htmlHi: [12, 13, 14, 11],
        },
      },
      {
        title: 'Step 2. 왜 이렇게 나뉘나 — 텍스트는 흐르고, 박스는 멈춘다',
        desc: '경계는 우연이 아니라 "편리함"과 "재앙 방지"의 설계다. 글자 색·글꼴·줄간격·정렬 같은 텍스트 속성이 흐르는 이유는, 한 번 정하면 문서 전체가 같은 톤을 유지해 매번 다시 쓰지 않아도 되기 때문이다. 반대로 margin·padding·width·border 같은 박스 속성이 흐른다면 어떻게 될까? 부모의 16px 여백을 자식이 물려받고, 그 손자가 또 물려받아 여백이 겹겹이 쌓이는 재앙이 벌어진다. 그래서 레이아웃 속성은 각자 자기 것만 갖도록 상속을 끊어 둔 것이다.',
        engine: 'why',
        engineDetail: '텍스트 속성 = 상속 O · 박스 속성 = 상속 X',
        props: [
          { name: 'line-height', inherited: true,  setAt: 'body', origin: 'author', note: '줄간격 — 문서 전체 리듬을 통일',   matches: ALL },
          { name: 'text-align',  inherited: true,  setAt: 'body', origin: 'author', note: '정렬 — 흐르면 편하다',            matches: ALL },
          { name: 'margin',      inherited: false, setAt: 'card', origin: 'author', note: '여백 — 흐르면 겹겹이 쌓이는 재앙', matches: ['card'] },
          { name: 'width',       inherited: false, setAt: 'card', origin: 'author', note: '너비 — 자식이 물려받으면 무의미',  matches: ['card'] },
        ],
        defaultSel: 0,
        extra: { categoryLegend: true },
        alert: { tone: 'warn', text: '상상해 보라: margin 이 상속된다면 .card 의 16px 을 h2·p·버튼이 각각 물려받고, 그 안의 요소가 또 물려받아 여백이 눈덩이처럼 불어난다. 레이아웃이 완전히 무너진다. 박스 속성의 "비상속"은 버그가 아니라 안전장치다.' },
        css: {
          filename: 'inheritance.css',
          lines: [
            '/* 2) 왜 나뉘나 — 텍스트는 흐르고 박스는 멈춘다 */',
            '',
            '/* 텍스트(글자) 관련 → 상속 O : 통일이 편하다 */',
            'body {',

            '  line-height: 1.7;',
            '  text-align: left;',
            '  font-size: 16px;',
            '}',
            '',
            '/* 박스(레이아웃) 관련 → 상속 X : 안 그러면 재앙 */',
            '.card {',
            '  margin: 16px;   /* 자식이 물려받으면 겹겹이 쌓임 */',
            '  padding: 20px;',
            '  width: 320px;',
            '  border: 1px solid #cfe3f3;',
            '}',
            '',
            '/* 만약 margin 이 상속됐다면 손자마다 16px 이 중첩된다 */',
          ],
          highlight: [4, 5, 6, 7, 8, 12, 13, 14, 15, 16],
          htmlHi: [11, 12, 13, 14],
        },
      },
      {
        title: 'Step 3. 상속 제어 4형제 — inherit · initial · unset · revert',
        desc: '상속은 자동이지만, 원할 때 손으로 켜고 끌 수 있다. inherit 는 상속이 안 되는 속성이라도 "부모 값을 강제로" 가져온다. initial 은 그 속성의 CSS 명세 초기값으로 되돌린다(color 라면 검정). unset 은 똑똑해서 상속 속성이면 inherit 처럼, 아니면 initial 처럼 행동한다. revert 는 내가 쓴 CSS 를 걷어내고 브라우저 기본(UA)까지 되돌린다. 아래에서 같은 color 에 네 키워드를 각각 적용했을 때 결과가 어떻게 갈리는지 눌러 보라.',
        engine: 'control',
        engineDetail: 'inherit · initial · unset · revert',
        props: [
          { name: 'inherit', inherited: true,  setAt: 'p', origin: 'author', note: '부모 값을 강제로 → 남색',            matches: ['p'] },
          { name: 'initial', inherited: false, setAt: 'p', origin: 'author', note: 'CSS 초기값으로 → color 는 검정',     matches: ['p'] },
          { name: 'unset',   inherited: true,  setAt: 'p', origin: 'author', note: '상속속성이라 inherit 처럼 → 남색',   matches: ['p'] },
          { name: 'revert',  inherited: true,  setAt: 'p', origin: 'author', note: 'UA 기본으로 (color 는 결국 상속) → 남색', matches: ['p'] },
        ],
        defaultSel: 0,
        extra: { keywordDemo: true },
        alert: { tone: 'good', text: '실무 순서 감각: 컴포넌트 안에서 "부모 톤을 그대로 받고 싶다"면 inherit, "완전 백지에서 시작"이면 initial, "잘 모르겠고 자연스럽게"면 unset, "내가 덧댄 스타일만 취소"면 revert. 버튼·인풋의 폰트가 부모를 안 따를 때 font: inherit 로 맞추는 게 대표 사례다.' },
        css: {
          filename: 'inheritance.css',
          lines: [
            '/* 3) 상속 제어 4형제 — inherit·initial·unset·revert */',
            '',
            'body { color: #1e3a5f; }   /* 부모: 남색 */',
            '',
            '/* inherit: 부모 값을 "강제로" 가져온다 → 남색 */',
            '.force  { color: inherit; }',
            '',
            '/* initial: CSS 명세의 초기값으로 → color 는 검정 */',
            '.reset  { color: initial; }',
            '',
            '/* unset: 상속속성이면 inherit, 아니면 initial 처럼 */',
            '.smart  { color: unset; }   /* color 는 상속속성 → 남색 */',
            '',
            '/* revert: 작성자 CSS 를 걷어내고 UA 기본으로 */',
            '.ua     { color: revert; }  /* color 는 UA 도 상속 → 남색 */',
            '',
            '/* 대표 실무: 버튼 폰트가 부모를 안 따를 때 */',

          ],
          highlight: [3, 5, 6, 8, 9, 11, 12, 14, 15],
          htmlHi: [13, 12, 14, 13],
        },
      },
      {
        title: 'Step 4. 초기값 vs 브라우저 기본 — reset 이 필요한 이유',
        desc: '흔한 오해: "속성의 초기값 = 화면에 보이는 기본 모습"이라고 생각한다. 아니다. margin 의 CSS 초기값은 0 이다. 그런데도 h1 이나 p 는 위아래에 여백을 갖고 태어난다 — 그 여백은 브라우저가 몰래 적용하는 UA 스타일시트(User-Agent stylesheet) 때문이다. 즉 화면의 기본 모습은 "CSS 초기값"이 아니라 "UA 시트가 덮어쓴 값"이다. 브라우저마다 이 UA 값이 조금씩 달라서 같은 코드가 다르게 보인다. 그래서 reset/normalize 로 출발선을 먼저 0 에 맞추는 것이다.',
        engine: 'ua',
        engineDetail: 'CSS 초기값 vs UA 스타일시트',
        props: [
          { name: 'margin',      inherited: false, origin: 'ua', note: 'UA 가 body·h1·p 에 여백을 넣는다', matches: ['body', 'h1', 'p'] },
          { name: 'font-size',   inherited: true,  origin: 'ua', note: 'UA 가 h1·h2 를 크게 만든다',       matches: ['h1', 'h2'] },
          { name: 'font-weight', inherited: true,  origin: 'ua', note: 'UA 가 h1·h2 를 굵게 만든다',       matches: ['h1', 'h2'] },
        ],
        defaultSel: 0,
        extra: { uaTable: true },
        alert: { tone: 'info', text: '초기값(initial value)은 명세가 정한 "속성의 태생값"이고, UA 스타일시트는 브라우저가 그 위에 덮어쓴 "기본 화면"이다. 둘을 헷갈리면 "margin 을 안 줬는데 왜 여백이 있지?"에서 막힌다. reset(전부 0) 은 공격적, normalize(브라우저 차이만 보정) 는 온건 — 요즘은 필요한 부분만 직접 0 처리하는 방식이 흔하다.' },
        css: {
          filename: 'inheritance.css',
          lines: [
            '/* 4) 초기값 vs 브라우저 기본(UA 스타일시트) */',
            '',
            '/* 오해: "초기값" 은 화면에 보이는 기본이 아니다 */',
            '/*   margin 의 CSS 초기값 = 0                       */',
            '/*   그런데 h1/p 엔 여백이 보인다 → UA 시트 때문   */',

            '/* 브라우저(UA)가 몰래 넣는 기본값 예시 */',
            '/*   body { margin: 8px; }                         */',
            '/*   h1   { margin-block: .67em; font-size: 2em; } */',
            '/*   h2   { margin-block: .83em; font-size: 1.5em;}*/',
            '/*   ul   { padding-inline-start: 40px; }          */',
            '',
            '/* 그래서 reset 으로 출발선을 0 에 맞춘다 */',
            '* {',
            '  margin: 0;',
            '  padding: 0;',
            '  box-sizing: border-box;',
            '}',
          ],
          highlight: [4, 5, 8, 9, 10, 14, 15, 16, 17],
          htmlHi: [7, 8, 12, 13],
        },
      },
      {
        title: 'Step 5. 실무 활용 — 상속을 설계로 쓰기 (+ 다크모드·박스 예고)',
        desc: '상속은 "외우는 규칙"이 아니라 "쓰는 도구"다. 첫째, 폰트·색·줄간격을 body 에 한 번만 선언하면 페이지 전체가 상속으로 통일된다 — 반복이 사라진다. 둘째, CSS 변수(커스텀 속성)도 상속된다. :root 에 --text 를 정의하면 모든 자손이 var(--text) 로 그 값을 받는다. 그래서 뿌리의 변수 하나만 바꾸면 페이지 전체 색이 따라 바뀐다 — 이것이 다크모드의 원리다. 아래 토글로 :root 변수 하나가 바뀔 때 자손 전체가 어떻게 함께 변하는지 확인하라. 다음 장은 박스 속성이 "안 흐르는" 그 세계, 박스 모델이다.',
        engine: 'practice',
        engineDetail: 'body 한 번 선언 · CSS 변수 상속 · 다크모드',
        props: [
          { name: 'font-family',  inherited: true, setAt: 'body', origin: 'author', note: 'body 한 번 → 전 페이지 상속',        matches: ALL },
          { name: '--text (변수)', inherited: true, setAt: 'body', origin: 'author', note: '변수도 상속된다 → 테마의 뿌리',      matches: ALL },
          { name: 'color: var()',  inherited: true, setAt: 'body', origin: 'author', note: '뿌리 변수만 바꾸면 전체가 따라온다', matches: ALL },
        ],
        defaultSel: 1,
        extra: { themeDemo: true },
        alert: { tone: 'good', text: '설계 습관: 텍스트 톤(폰트·색·줄간격)은 body 에서 한 번, 테마 값은 :root 변수로 한 번. 그러면 개별 컴포넌트는 값을 다시 쓰지 않고 상속만 받으면 된다. 다크모드는 자손을 하나하나 고치는 게 아니라 뿌리 변수 몇 개만 교체하는 일이 된다 — 자세히는 V-1-1(테마·다크모드).' },
        css: {
          filename: 'inheritance.css',
          lines: [
            '/* 5) 실무 활용 — 상속을 "설계" 로 쓴다 */',
            '',
            '/* (1) 폰트·색은 body 에 한 번 → 전 페이지 상속 */',
            'body {',
            '  font-family: Pretendard, system-ui, sans-serif;',
            '  line-height: 1.7;',
            '  color: var(--text);',
            '  background: var(--bg);',
            '}',
            '',
            '/* (2) CSS 변수도 "상속" 된다 → 테마의 뿌리 */',
            ':root {',
            '  --text: #1e3a5f;',
            '  --bg:   #ffffff;',
            '}',
            '',
            '/* (3) 다크모드: 뿌리 변수만 바꾸면 전체가 따라온다 */',
            ':root[data-theme="dark"] {',
            '  --text: #e5e7eb;',
            '  --bg:   #0f172a;',
            '}',
            '/* → 다음 장 I-2-2: 박스 모델(margin·padding·border) */',
          ],
          highlight: [4, 5, 6, 7, 8, 12, 13, 14, 18, 19, 20],
          htmlHi: [6, 12, 13, 14],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 속성/키워드 칩 목록 — 클릭으로 "무엇이 흐르나" 를 바꾼다 (인터랙티브 핵심)
    // ─────────────────────────────────────────────────────
    function PropChips({ props, active, onPick }) {
      return (
        <div className="flex flex-wrap gap-1.5 mb-3">
          {props.map((p, i) => (
            <button
              key={p.name}
              onClick={() => onPick(i)}
              className={`px-2 py-1 rounded-md border text-[11px] font-mono transition ${
                i === active
                  ? 'bg-sky-600 border-sky-700 text-white font-bold shadow'
                  : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'
              }`}
            >
              {p.name}
              <span className={`ml-1 text-[9px] font-sans ${i === active ? 'text-sky-100' : 'text-slate-400'}`}>
                {p.inherited ? '흐름' : '멈춤'}
              </span>
            </button>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // DOM 트리 — 활성 속성 값이 닿는 노드를 파랗게 하이라이트
    //   선언 노드는 "선언", 상속으로 닿은 노드는 "상속 ↓", UA 는 "UA" 배지
    // ─────────────────────────────────────────────────────
    function FlowTree({ matchSet, prop }) {
      return (
        <div className="rounded-lg border border-sky-200 bg-white p-2.5 font-mono text-[11px] leading-6">
          {TREE.map((n) => {
            const on = matchSet.has(n.key);
            const isDecl = prop && prop.setAt === n.key;
            let badge = null;
            if (on) {
              if (isDecl) badge = { txt: '선언', cls: 'bg-amber-500 text-white' };
              else if (prop && prop.origin === 'ua') badge = { txt: 'UA 기본', cls: 'bg-slate-600 text-white' };
              else if (prop && prop.inherited) badge = { txt: '상속 ↓', cls: 'bg-sky-600 text-white' };
              else badge = { txt: '적용', cls: 'bg-sky-600 text-white' };
            }
            return (
              <div
                key={n.key}
                style={{ marginLeft: n.depth * 14 }}
                className={`flex items-center gap-1.5 rounded px-1.5 my-px transition ${
                  on
                    ? 'bg-sky-100 border border-sky-500 text-sky-900 font-bold'
                    : 'border border-transparent text-slate-400'
                }`}
              >
                <span className="text-slate-300">{'└'}</span>
                <span>{n.tag}</span>
                {n.text && <span className="text-[9px] text-slate-400 font-sans">“{n.text}”</span>}
                {badge && (
                  <span className={`ml-auto text-[9px] px-1 rounded ${badge.cls}`}>{badge.txt}</span>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 상속 흐름 범례 (Step 1)
    // ─────────────────────────────────────────────────────
    function FlowLegend() {
      const rows = [
        { sym: 'color',       flow: true,  desc: '글자 색 — 자손 전부로 흐른다' },
        { sym: 'font-family', flow: true,  desc: '글꼴 — 역시 흐른다' },
        { sym: 'border',      flow: false, desc: '테두리 — 선언한 곳에만' },
        { sym: 'background',  flow: false, desc: '배경 — 흐르지 않는다' },
      ];
      return (
        <div className="mt-3 grid grid-cols-2 gap-1.5">
          {rows.map((r) => (
            <div key={r.sym} className={`rounded-lg border px-2 py-1.5 ${r.flow ? 'border-sky-300 bg-sky-50' : 'border-slate-300 bg-white'}`}>
              <div className="flex items-center gap-1.5">
                <span className="font-mono text-[11px] font-bold text-sky-800">{r.sym}</span>
                <span className={`text-[10px] font-bold ${r.flow ? 'text-sky-700' : 'text-slate-500'}`}>{r.flow ? '흐름 O' : '멈춤 X'}</span>
              </div>
              <div className="text-[10px] text-slate-600 mt-0.5">{r.desc}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 상속/비상속 분류 범례 (Step 2)
    // ─────────────────────────────────────────────────────
    function CategoryLegend() {
      return (
        <div className="mt-3 rounded-lg border border-sky-200 bg-white p-2">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5">경계선 — 텍스트는 흐르고, 박스는 멈춘다</div>
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded border border-sky-300 bg-sky-50 p-2">
              <div className="text-[10px] font-bold text-sky-800 mb-1">✅ 상속 O (텍스트)</div>
              <div className="text-[10px] text-slate-600 font-mono leading-5">
                color · font · line-height<br />text-align · visibility · cursor
              </div>
            </div>
            <div className="rounded border border-slate-300 bg-white p-2">
              <div className="text-[10px] font-bold text-slate-600 mb-1">🚫 상속 X (박스)</div>
              <div className="text-[10px] text-slate-600 font-mono leading-5">
                margin · padding · border<br />width · height · background
              </div>
            </div>
          </div>
          <div className="mt-1.5 text-[9px] text-slate-500">규칙 감각: "글자에 관한 것은 흐르고, 상자 크기·여백은 각자 갖는다"</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 제어 키워드 데모 (Step 3) — 같은 color 에 4키워드 적용 결과
    // ─────────────────────────────────────────────────────
    function KeywordDemo({ prop }) {
      const cards = [
        { kw: 'inherit', color: '#1e3a5f', label: '부모 값 강제',        result: '남색 (부모)' },
        { kw: 'initial', color: '#000000', label: 'CSS 초기값으로',       result: '검정 (초기값)' },
        { kw: 'unset',   color: '#1e3a5f', label: '상속속성→inherit 처럼', result: '남색 (상속)' },
        { kw: 'revert',  color: '#1e3a5f', label: 'UA 기본으로',          result: '남색 (UA도 상속)' },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-2">
            🎛 부모 <span className="font-mono">body{'{color:남색}'}</span> 안의 <span className="font-mono">p</span> 에 각 키워드 적용
          </div>
          <div className="grid grid-cols-2 gap-1.5">
            {cards.map((c) => {
              const on = prop && prop.name === c.kw;
              return (
                <div
                  key={c.kw}
                  className={`rounded border p-2 transition ${on ? 'border-sky-500 bg-sky-50 shadow' : 'border-slate-200 bg-white'}`}
                >
                  <div className="flex items-center gap-1.5">
                    <span className="font-mono text-[11px] font-bold text-sky-800">{c.kw}</span>
                    {on && <span className="text-[8px] px-1 rounded bg-sky-600 text-white">선택</span>}
                  </div>
                  <div className="mt-1 flex items-center gap-1.5">
                    <span className="w-4 h-4 rounded border border-slate-300" style={{ background: c.color }}></span>
                    <span className="text-sm font-bold" style={{ color: c.color }}>본문 문장</span>
                  </div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{c.label} → {c.result}</div>
                </div>
              );
            })}
          </div>
          <div className="mt-2 text-[10px] text-sky-800">
            핵심: 상속 속성인 color 는 initial(검정) 만 부모와 갈라지고, 나머지 셋은 결국 남색으로 수렴한다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 초기값 vs UA 표 (Step 4)
    // ─────────────────────────────────────────────────────
    function UaTable() {
      const rows = [
        { prop: 'margin',    init: '0',      ua: 'body 8px, h1 .67em' },
        { prop: 'font-size', init: 'medium', ua: 'h1 2em, h2 1.5em' },
        { prop: 'display',   init: 'inline', ua: 'div/p → block' },
        { prop: 'padding',   init: '0',      ua: 'ul 40px' },
      ];
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-400 bg-gradient-to-br from-sky-50 to-slate-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">📏 CSS 초기값 vs 브라우저(UA) 기본</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b-2 border-sky-300">
                <th className="text-left py-1 font-mono">속성</th>
                <th className="text-left py-1 pl-2">CSS 초기값</th>
                <th className="text-left py-1 pl-2">UA 시트가 덮는 값</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.prop} className="border-t border-sky-200">
                  <td className="py-1 font-mono font-bold text-sky-800">{r.prop}</td>
                  <td className="py-1 pl-2 font-mono text-emerald-700">{r.init}</td>
                  <td className="py-1 pl-2 font-mono text-slate-700">{r.ua}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 text-[10px] text-sky-800">화면에 보이는 건 대개 "UA 값" 이다. reset 은 이 UA 값을 0 으로 밀어 브라우저 차이를 없앤다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 다크모드 변수 상속 데모 (Step 5) — 뿌리 변수 하나가 자손 전체를 바꾼다
    // ─────────────────────────────────────────────────────
    function ThemeDemo() {
      const [dark, setDark] = useState(false);
      const text = dark ? '#e5e7eb' : '#1e3a5f';
      const bg = dark ? '#0f172a' : '#ffffff';
      const sub = dark ? '#94a3b8' : '#64748b';
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-[11px] font-bold text-sky-900">🌗 :root 변수 하나로 전체가 바뀐다</div>
            <button
              onClick={() => setDark((d) => !d)}
              className="px-3 py-1 rounded text-[11px] font-bold bg-sky-600 text-white hover:bg-sky-700 transition"
            >
              {dark ? '☀️ 라이트로' : '🌙 다크로'} 전환
            </button>
          </div>
          <div className="rounded-lg border border-slate-300 p-3 transition-colors" style={{ background: bg, color: text }}>
            <div className="text-base font-bold" style={{ color: text }}>문서 제목</div>
            <div className="text-sm mt-1" style={{ color: text }}>카드 본문 문장입니다. — 색을 다시 안 줬는데 함께 바뀐다.</div>
            <div className="text-[11px] mt-1" style={{ color: sub }}>© 2026 CSS Study</div>
          </div>
          <div className="mt-2 text-[10px] text-sky-800 font-mono">
            :root {'{ --text: '}<span className="font-bold">{text}</span>{' }'} → 모든 자손이 var(--text) 로 상속받는다
          </div>
          <div className="mt-1 text-[10px] text-slate-500">
            자손을 하나하나 고친 게 아니다 — 뿌리 변수 1개만 교체했다. 이것이 상속 기반 테마 설계다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info: { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn: { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      good: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — DOM 트리 + 상속 흐름 하이라이트 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      flow:     { icon: '🌊', label: '상속의 흐름' },
      why:      { icon: '🧩', label: '경계의 이유' },
      control:  { icon: '🎛', label: '제어 키워드' },
      ua:       { icon: '📏', label: '초기값과 UA' },
      practice: { icon: '🎨', label: '실무 활용' },
    };

    function LiveDataPane({ step, activeSel, setActiveSel }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.flow;
      const prop = step.props[activeSel];
      const matchSet = new Set(prop ? prop.matches : []);
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>상속 지도 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <PropChips props={step.props} active={activeSel} onPick={setActiveSel} />

          <div className="text-[10px] text-sky-700 mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            <span className="font-mono font-bold">{prop.name}</span> — {prop.note} · 닿는 노드 <span className="font-bold">{prop.matches.length}개</span>
          </div>

          <FlowTree matchSet={matchSet} prop={prop} />

          {step.extra.flowLegend && <FlowLegend />}
          {step.extra.categoryLegend && <CategoryLegend />}
          {step.extra.keywordDemo && <KeywordDemo prop={prop} />}
          {step.extra.uaTable && <UaTable />}
          {step.extra.themeDemo && <ThemeDemo />}
          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: inheritance.css(진화) + demo.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      // 단계가 바뀌면 css 탭으로 되돌린다
      useEffect(() => { setTab(0); }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'demo.html',       lang: 'xml', display: 'html', lines: DEMO_HTML,      highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 현재 탭 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [activeSel, setActiveSel] = useState(STEPS[0].defaultSel);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      // 단계 이동 시 해당 단계의 기본 속성으로 초기화
      useEffect(() => { setActiveSel(STEPS[stepIdx].defaultSel); }, [stepIdx]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Part 1</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">I-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">상속과 초기값</h1>
                <p className="text-sm text-sky-800/80">어떤 속성은 자식에게 흐르고 어떤 건 안 흐른다 — 그 규칙과 제어법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane step={step} activeSel={activeSel} setActiveSel={setActiveSel} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 속성 칩을 눌러 "무엇이 흐르나" 를 비교</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                텍스트 속성(color·font·line-height)은 자식에게 흐르고, 박스 속성(margin·padding·border)은 멈춘다 — 여백 중첩 재앙을 막기 위한 설계다.
                흐름은 inherit(강제 상속)·initial(초기값)·unset(똑똑하게)·revert(UA로) 로 제어한다.
                화면의 기본 모습은 "CSS 초기값" 이 아니라 "UA 스타일시트" 가 덮은 값이라, reset 으로 출발선을 맞춘다.
                실무에선 폰트·색을 body 에 한 번, 테마 값을 :root 변수로 한 번 — 상속이 나머지를 퍼뜨린다(다음 장 I-2-2 박스 모델).
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['상속', '비상속', '텍스트속성', '박스속성', 'inherit', 'initial', 'unset', 'revert', '초기값', 'UA스타일시트', 'reset·normalize', 'CSS변수', '다크모드예고', '박스모델예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 박스 모델 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
