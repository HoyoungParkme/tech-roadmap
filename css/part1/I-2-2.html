<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS 학습 — I-2-2. 박스 모델</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    CSS I-2-2 — 박스 모델
    학습 목표: content·padding·border·margin 4겹과 box-sizing이 요소의 "실제 크기"를 어떻게 결정하는지 익힌다.
              4겹 시각화 → content-box vs border-box → margin collapsing → width:100% 넘침/overflow → inline·block·inline-block.
    패턴: v1 — 좌(LiveDataPane: 4겹 박스 + 슬라이더로 padding/border/margin 조절, 총 점유 폭 게이지, box-sizing 토글)
              우(VSCode CodeViewer: box.css 진화 + demo.html 공통)
    색상: blue/sky (CSS 브랜드 #1572B6 감각)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 겹(layer) 색상 — 크롬 devtools 관례에 가깝게
    //   content: 하늘 / padding: 초록 / border: 노랑 / margin: 주황
    // ─────────────────────────────────────────────────────
    const LAYER = {
      margin:  { fill: '#fde3c4', line: '#f59e0b', label: 'margin',  ko: '바깥 여백' },
      border:  { fill: '#fde68a', line: '#ca8a04', label: 'border',  ko: '테두리' },
      padding: { fill: '#bbf7d0', line: '#16a34a', label: 'padding', ko: '안쪽 여백' },
      content: { fill: '#bae6fd', line: '#0284c7', label: 'content', ko: '내용' },
    };

    // ─────────────────────────────────────────────────────
    // demo.html — 모든 단계 공통 마크업 (CodeViewer 두 번째 탭)
    // ─────────────────────────────────────────────────────
    const DEMO_HTML = [
      '<!DOCTYPE html>',
      '<html lang="ko">',
      '<head>',
      '  <link rel="stylesheet" href="box.css" />',
      '</head>',
      '<body>',
      '  <section class="wrap">',
      '    <div class="card">',
      '      <h2 class="card-title">가격 플랜</h2>',
      '      <p class="card-text">한 달에 커피 한 잔 값</p>',
      '    </div>',
      '    <div class="card">',
      '      <h2 class="card-title">가격 플랜</h2>',
      '      <p class="card-text">한 달에 커피 한 잔 값</p>',
      '    </div>',
      '  </section>',
      '  <p class="tag">inline 요소</p>',
      '  <span class="badge">NEW</span>',
      '</body>',
      '</html>',
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 — 박스 모델
    //   box   : 좌측 박스 시각화 초기값(px). sliders = 조절 가능한 겹 목록
    //   sizing: 'content-box' | 'border-box' (Step 2에서 토글 노출)
    //   extra : 단계별 보조 시각화 플래그
    //   css   : box.css 코드(진화) + 하이라이트 라인 / htmlHi = demo.html 강조 라인
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 박스 4겹 — content · padding · border · margin',
        desc: '모든 요소는 사각형 박스 4겹으로 그려진다. 안쪽부터 내용(content) → 안쪽 여백(padding) → 테두리(border) → 바깥 여백(margin) 순이다. padding 은 배경색이 칠해지는 "내부" 공간이고, margin 은 배경이 비치지 않는 "이웃과의 거리"다. 이 둘을 헷갈리면 "왜 배경이 여기까지 칠해지지?" 같은 혼란이 생긴다. 아래 슬라이더로 각 겹을 키워 보면 박스가 바깥으로 어떻게 부풀어 오르는지, 그리고 요소가 실제로 차지하는 총 폭이 어떻게 커지는지 눈으로 확인할 수 있다.',
        engine: 'layers',
        engineDetail: 'content · padding · border · margin',
        box: { content: 160, padding: 20, border: 6, margin: 16 },
        sizing: 'content-box',
        sliders: ['padding', 'border', 'margin'],
        defaultSlider: 'padding',
        extra: { layerLegend: true },
        alert: { tone: 'info', text: 'padding 은 배경·클릭영역에 포함되는 "내부" 여백이고, margin 은 배경이 비치지 않는 "이웃과의 거리"다. 버튼을 크게 눌리게 만들려면 padding 을, 요소끼리 띄우려면 margin 을 쓴다 — 목적이 다르다.' },
        css: {
          filename: 'box.css',
          lines: [
            '/* 1) 박스 4겹 — 안쪽부터 바깥으로 쌓인다 */',
            '',
            '.card {',
            '  /* content: 내용이 들어가는 실제 영역 */',
            '  width: 160px;',
            '',
            '  /* padding: 배경이 칠해지는 "안쪽" 여백 */',
            '  padding: 20px;',
            '',
            '  /* border: 내용과 이웃 사이의 테두리 */',

    // ─────────────────────────────────────────────────────
    // 겹 슬라이더 — 활성 겹의 px 값을 바꾼다 (인터랙티브 핵심)
    // ─────────────────────────────────────────────────────
    function LayerSliders({ box, setBox, keys, active, setActive }) {
      const ranges = { padding: [0, 60], border: [0, 24], margin: [0, 60] };
      if (!keys.length) return null;
      return (
        <div className="rounded-lg border border-sky-200 bg-sky-50 p-2.5 mb-3 space-y-2">

            return (
              <div key={k} className="flex items-center gap-2">
                <button
                  onClick={() => setActive(k)}
                  className={`w-24 shrink-0 text-left px-1.5 py-0.5 rounded text-[11px] font-mono transition border ${
                    active === k ? 'bg-white border-sky-500 font-bold' : 'border-transparent'
                  }`}
                  style={{ color: L.line }}
                >
                  {L.label}
                </button>
                <input
                  type="range"
                  min={min}
                  max={max}
                  value={box[k]}
                  onChange={(e) => { setActive(k); setBox({ ...box, [k]: Number(e.target.value) }); }}
                  className="flex-1 accent-sky-600"
                  aria-label={`${L.label} 값 조절`}
                />
                <span className="w-12 text-right text-[11px] font-mono font-bold text-sky-800">{box[k]}px</span>
              </div>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 4겹 박스 그림 — content 를 중심으로 padding→border→margin 을 겹으로 그린다
    //   sizing 에 따라 content 폭을 조정해 총 폭 게이지를 계산
    // ─────────────────────────────────────────────────────
    function BoxDiagram({ box, sizing, active }) {
      // border-box: width 는 content+padding+border 를 포함 → content 는 그만큼 줄어든다
      const declaredWidth = box.content;
      const contentW =
        sizing === 'border-box'
          ? Math.max(0, declaredWidth - box.padding * 2 - box.border * 2)
          : declaredWidth;
      const innerW = contentW + box.padding * 2 + box.border * 2; // 배경이 칠해지는 폭(테두리까지)
      const totalW = innerW + box.margin * 2;                     // margin 포함 총 점유 폭

      const isActive = (k) => active === k;
      const ring = (k) => (isActive(k) ? `0 0 0 2px ${LAYER[k].line}` : 'none');

      return (
        <div>
          {/* 박스 그림 */}
          <div className="rounded-lg border border-sky-200 bg-white p-3 overflow-x-auto">
            <div className="inline-block" style={{
              background: LAYER.margin.fill,
              padding: box.margin,
              boxShadow: ring('margin'),
              borderRadius: 4,
            }}>
              <div className="relative" style={{ boxShadow: ring('border') }}>
                <span className="absolute -top-4 left-0 text-[9px] font-mono" style={{ color: LAYER.margin.line }}>margin {box.margin}</span>
                <div style={{
                  border: `${box.border}px solid ${LAYER.border.line}`,
                  background: LAYER.padding.fill,
                  padding: box.padding,
                  borderRadius: 3,
                }}>
                  <div className="relative">
                    <span className="absolute -top-4 left-0 text-[9px] font-mono" style={{ color: LAYER.border.line }}>border {box.border} · padding {box.padding}</span>
                    <div style={{
                      background: LAYER.content.fill,
                      width: contentW,
                      minWidth: 8,
                      boxShadow: ring('content'),
                      borderRadius: 2,
                    }} className="h-14 flex items-center justify-center text-[10px] font-mono text-sky-900">
                      content {Math.round(contentW)}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* 총 점유 폭 게이지 */}
          <div className="mt-3 rounded-lg border border-sky-200 bg-white p-2.5">
            <div className="flex items-center justify-between text-[10px] mb-1">
              <span className="font-bold text-sky-900">총 점유 폭 (margin 포함)</span>
              <span className="font-mono font-bold text-sky-800">{Math.round(totalW)}px</span>
            </div>
            <div className="flex h-5 rounded overflow-hidden border border-slate-300 text-[8px] font-mono text-slate-700">
              <Seg w={box.margin} total={totalW} color={LAYER.margin.fill} label="m" />
              <Seg w={box.border} total={totalW} color={LAYER.border.line} label="b" dark />
              <Seg w={box.padding} total={totalW} color={LAYER.padding.fill} label="p" />
              <Seg w={contentW} total={totalW} color={LAYER.content.fill} label="content" />
              <Seg w={box.padding} total={totalW} color={LAYER.padding.fill} label="p" />
              <Seg w={box.border} total={totalW} color={LAYER.border.line} label="b" dark />
              <Seg w={box.margin} total={totalW} color={LAYER.margin.fill} label="m" />
            </div>
            <div className="mt-1.5 text-[10px] text-slate-600 font-mono">
              선언 width: <b>{declaredWidth}px</b> · box-sizing: <b className="text-sky-800">{sizing}</b> → 배경 칠 폭(테두리까지): <b>{Math.round(innerW)}px</b>
            </div>
          </div>
        </div>
      );
    }

    function Seg({ w, total, color, label, dark }) {
      const pct = total > 0 ? (w / total) * 100 : 0;
      if (w <= 0) return null;
      return (
        <div
          className="flex items-center justify-center overflow-hidden"
          style={{ width: pct + '%', background: color, color: dark ? '#fff' : '#57534a' }}
          title={`${label} ${w}px`}
        >
          {pct > 6 ? label : ''}
        </div>
      );
    }

    // 4겹 범례 (Step 1)
    // ─────────────────────────────────────────────────────

      const order = ['content', 'padding', 'border', 'margin'];

    // ─────────────────────────────────────────────────────
    // content-box vs border-box 픽셀 비교 (Step 2)
    // ─────────────────────────────────────────────────────
    function SizingCompare({ box }) {
      const w = box.content, p = box.padding, b = box.border;
      const contentBoxTotal = w + p * 2 + b * 2;

              </tr>
              <tr>
                <td className="py-1 font-mono text-slate-800">border-box</td>
                <td className="py-1 text-slate-700">내용 <b>{borderBoxContent}</b> 로 줄고 총 폭 유지</td>
                <td className="py-1 text-right font-mono font-bold text-emerald-700">실제 {w}px</td>
              </tr>
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-sky-900">border-box 는 선언한 <b>{w}px</b> 를 그대로 지켜준다 — 그래서 그리드·레이아웃 계산이 예측 가능해진다.</div>
        </div>
      );
    }

          <div className="flex items-center gap-3 mb-2 text-[10px] font-mono">
            <label className="flex items-center gap-1">위 margin-bottom
              <input type="range" min="0" max="48" value={mb} onChange={(e) => setMb(Number(e.target.value))} className="accent-amber-600" aria-label="위 상자 margin-bottom" />
              <b>{mb}</b>
            </label>
            <label className="flex items-center gap-1">아래 margin-top
              <input type="range" min="0" max="48" value={mt} onChange={(e) => setMt(Number(e.target.value))} className="accent-amber-600" aria-label="아래 상자 margin-top" />
              <b>{mt}</b>
            </label>
          </div>
          <div className="bg-white rounded border border-slate-300 p-2">
            <div className="bg-sky-100 border border-sky-400 text-center text-[10px] py-1 rounded" style={{ marginBottom: mb }}>위 문단 (margin-bottom {mb})</div>
            <div className="bg-emerald-100 border border-emerald-400 text-center text-[10px] py-1 rounded" style={{ marginTop: mt }}>아래 문단 (margin-top {mt})</div>
          </div>
          <div className="mt-2 text-[10px] text-amber-900">
            산술 합이면 <span className="line-through">{sum}px</span> 이지만 실제 간격 = <b className="font-mono">max({mb},{mt}) = {gap}px</b>. 세로 margin 은 겹친다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // width:100% 넘침 데모 (Step 4) — 부모 폭 대비 자식 넘침
    // ─────────────────────────────────────────────────────
    function OverflowDemo({ box, sizing }) {
      const parent = 260;
      const childTotal = sizing === 'border-box' ? parent : parent + box.padding * 2;
      const overflow = childTotal - parent;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-[11px] font-bold text-sky-900 mb-2">📐 width:100% + padding:{box.padding} — 부모(260px)를 넘치는가</div>
          <div className="relative border-2 border-dashed border-slate-400 rounded" style={{ width: parent }}>
            <div className="absolute -top-3 right-0 text-[9px] font-mono text-slate-500">부모 260px</div>
            <div className="text-[10px] text-center py-2 rounded" style={{
              width: '100%',
              padding: box.padding + 'px',
              boxSizing: sizing,
              background: overflow > 0 ? '#fee2e2' : '#dcfce7',
              border: '1px solid ' + (overflow > 0 ? '#dc2626' : '#16a34a'),
            }}>
              자식 width:100%
            </div>
          </div>
          <div className="mt-2 text-[10px]">
            {overflow > 0
              ? <span className="text-red-700 font-bold">⚠ {overflow}px 넘침 — content-box 라 padding 이 100% 밖에 더해졌다.</span>
              : <span className="text-emerald-700 font-bold">✔ 딱 맞음 — border-box 가 padding 을 100% 안으로 흡수했다.</span>}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // display 비교 데모 (Step 5)
    // ─────────────────────────────────────────────────────
    function DisplayDemo() {
      const [mode, setMode] = useState('inline-block');
      const rows = {
        block:          { w: '◎ 먹음', h: '◎ 먹음', flow: '한 줄 독차지', vmargin: '◎ 먹음' },
        inline:         { w: '✗ 무시', h: '✗ 무시', flow: '옆으로 흐름', vmargin: '✗ 자리 안 밀림' },
        'inline-block': { w: '◎ 먹음', h: '◎ 먹음', flow: '옆으로 흐름', vmargin: '◎ 먹음' },
      };
      const r = rows[mode];
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="flex items-center gap-1.5 mb-2">
            {Object.keys(rows).map((m) => (
              <button
                key={m}
                onClick={() => setMode(m)}
                className={`px-2 py-1 rounded text-[11px] font-mono border transition ${
                  mode === m ? 'bg-sky-600 border-sky-700 text-white font-bold' : 'bg-white border-sky-300 text-sky-800 hover:bg-sky-50'
                }`}
              >{m}</button>
            ))}
          </div>
          {/* 실제 흐름 미리보기 */}
          <div className="bg-slate-50 border border-slate-300 rounded p-2 mb-2 text-[11px] leading-6">
            글 안에{' '}
            <span style={{ display: mode, width: 90, height: 20, background: '#1572B6', color: '#fff', padding: '2px 6px', margin: '8px 4px', borderRadius: 3 }}>박스</span>
            {' '}가 이렇게 흐른다.
          </div>
          <table className="w-full text-[10px]">
            <tbody>
              {[['width', r.w], ['height', r.h], ['상하 margin', r.vmargin], ['배치', r.flow]].map(([k, v]) => (
                <tr key={k} className="border-t border-sky-100">
                  <td className="py-1 font-mono text-slate-700">{k}</td>
                  <td className={`py-1 font-bold ${v.startsWith('✗') ? 'text-red-700' : 'text-emerald-700'}`}>{v}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 박스 4겹 + 슬라이더 + 게이지 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      layers:   { icon: '📦', label: '박스 4겹' },
      sizing:   { icon: '📏', label: 'box-sizing' },
      collapse: { icon: '🧲', label: 'margin 상쇄' },
      overflow: { icon: '📐', label: 'width·overflow' },
      display:  { icon: '🔤', label: 'display 박스' },
    };

    function LiveDataPane({ beat, step }) {
      const eng = ENGINE_BADGE[step.engine] || ENGINE_BADGE.layers;
      const [box, setBox] = useState(step.box);
      const [sizing, setSizing] = useState(step.sizing);
      const [active, setActive] = useState(step.defaultSlider);

      // 단계가 바뀌면 초기값으로 리셋
      useEffect(() => {
        setBox(step.box);
        setSizing(step.sizing);
        setActive(step.defaultSlider);
      }, [step]);

      const showBox = step.engine !== 'collapse' && step.engine !== 'display';

      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>박스 모델 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">{step.engineDetail}</span>
          </div>

          <LayerSliders box={box} setBox={setBox} keys={step.sliders} active={active} setActive={setActive} />

          {step.extra.sizingToggle && <div className="mb-3"><SizingToggle sizing={sizing} setSizing={setSizing} /></div>}

          {showBox && <BoxDiagram box={box} sizing={sizing} active={active} />}

          {step.extra.layerLegend && <LayerLegend />}
          {step.extra.sizingCompare && <SizingCompare box={box} />}
          {step.extra.collapseDemo && <CollapseDemo />}
          {step.extra.overflowDemo && <OverflowDemo box={box} sizing={sizing} />}
          {step.extra.displayDemo && <DisplayDemo />}
          <AlertBox alert={step.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    //   탭 2개: box.css(진화) + demo.html(공통)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ step, stepIdx, total }) {
      const [tab, setTab] = useState(0); // 0: css, 1: html
      // beat 가 html 쪽을 강조하면 그 탭을 열어 준다 (css 강조가 있으면 css 우선)
      useEffect(() => {
        const cssHi = (step.css.highlight || []).length;
        const htmlHi = (step.css.htmlHi || []).length;
        setTab(!cssHi && htmlHi ? 1 : 0);
      }, [stepIdx]);

      const files = [
        { name: step.css.filename, lang: 'css', display: 'css', lines: step.css.lines, highlight: step.css.highlight },
        { name: 'demo.html',       lang: 'xml', display: 'html', lines: DEMO_HTML,      highlight: step.css.htmlHi || [] },
      ];
      const file = files[tab];
      const highlightSet = new Set(file.highlight);

      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(file.lines.join('\n'), { language: file.lang }).value;
          const split = html.split('\n');
          return file.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return file.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [file]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {files.map((f, i) => (
                <button
                  key={f.name}
                  onClick={() => setTab(i)}
                  className={`px-2 py-0.5 rounded-t text-[11px] font-mono transition ${
                    i === tab ? 'bg-[#282c34] text-sky-300 font-bold' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {f.name}
                </button>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{file.display}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${file.lang}`}>
              {file.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{file.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-sky-600 text-white font-bold">CSS</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-800 border border-sky-200 font-bold">Ⅰ. 선택자와 캐스케이드</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200 font-mono">I-2-2</span>
                </div>
                <h1 className="text-2xl font-bold text-sky-900 mt-0.5">박스 모델</h1>
                <p className="text-sm text-sky-800/80">content·padding·border·margin과 box-sizing이 실제 크기를 결정하는 원리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 좌측 슬라이더·토글을 움직여 실제 크기 변화를 확인</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                모든 요소는 content·padding·border·margin 4겹이며, box-sizing 이 width 를 "어디까지" 재는지 정한다.
                실무는 <span className="font-mono">* {'{'} box-sizing: border-box {'}'}</span> 를 전역으로 깔아 padding·border 를 width 안으로 흡수시켜 그리드 계산을 예측 가능하게 만든다.
                세로 margin 은 상쇄되고, width:100%+padding 넘침은 border-box·overflow·min/max-width 로 다스리며,
                inline·block·inline-block 은 같은 박스라도 width·상하 여백이 먹히는 규칙이 다르다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['박스모델', 'content', 'padding', 'border', 'margin', 'box-sizing', 'border-box', 'content-box', 'margin상쇄', 'collapsing', 'overflow', 'min-max-width', 'inline-block', '전역리셋'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
