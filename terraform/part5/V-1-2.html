  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌬️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Terraform V-1-2 — Drift 감지와 Sentinel 정책
    학습 목표: state와 실제 인프라 사이에 발생하는 drift를 감지하고,
              Sentinel/OPA 같은 정책 엔진으로 사고를 사전에 차단하는 방법을 5단계로 본다.
    핵심 비유: "지도에 그려둔 길 vs 실제 길" — 누군가 콘솔에서 길을 바꿔놓으면 지도가 거짓말이 된다.
    패턴: fastapi v1 — 좌(LiveDataPane: state vs 실제 다이어그램) / 우(VSCode CodeViewer 5탭)
    색상: pink (terraform Part V — 운영/거버넌스)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — drift 감지 → 정책 차단 흐름
    //   stateRes  : Terraform state가 알고 있는 리소스
    //   liveRes   : 클라우드 콘솔의 실제 리소스
    //   alerts    : 화면 우측 상단에 표시할 알람 [{level, msg}]
    //   policy    : Sentinel 정책 차단 박스 (Step 4부터 활성)
    //   ciBox     : CI 자동 점검 박스 (Step 5만 활성)
    //   code      : 우측 CodeViewer 파일 (lang, filename, lines, highlight)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      drift: {lang: 'markdown', filename: 'drift.md', lines:[
        '# Drift 란 무엇인가',
        '',
        '## 정의',
        'Terraform이 관리하는 "state(상태 파일)"와',
        '실제 클라우드 콘솔의 리소스가 서로 다른 상태.',
        '',
        '## 어떻게 발생하는가',
        '',
        '1. 운영자가 트래픽 폭주 때문에 콘솔에서 직접 인스턴스 크기 변경',
        '2. 보안팀이 콘솔에서 보안그룹 규칙 추가',
        '3. 다른 팀이 같은 계정에서 리소스를 손댐',
        '4. 자동 스케일링이 인스턴스를 늘리거나 줄임',
        '',
        '## 왜 위험한가',
        '',
        '- 다음 번 `terraform apply` 가 콘솔 변경을 "되돌려" 버린다',
        '- "왜 우리 인스턴스가 작아졌지?" 같은 사고가 발생',
        '- 코드 리뷰를 거치지 않은 변경이 운영에 들어가 있음',
        '- 감사 추적(audit trail) 이 불가능해진다',
        '',
        '## 핵심 원칙',
        '',
        '> 인프라 변경은 모두 코드(Terraform) 를 거쳐야 한다.',
        '> 콘솔에서의 직접 수정은 "긴급 상황 + 사후 코드 반영" 으로만 허용한다.',
        '',
        '## 이 챕터에서 배울 것',
        '',
        '- Step 2: `terraform plan` 으로 drift 감지하기',
        '- Step 3: refresh-only 모드로 state만 동기화',
        '- Step 4: Sentinel/OPA 정책으로 위험한 변경 차단',
        '- Step 5: CI 에서 정기적으로 drift 점검',
      ]},
      planDetect: {lang: 'bash', filename: 'plan-detect.sh', lines:[
        '#!/usr/bin/env bash',
        '# plan-detect.sh — 매일 새벽 한 번씩 drift 감지',
        '',
        'set -euo pipefail',
        '',
        'cd "$(dirname "$0")/.."',
        '',
        '# ── 1) 최신 state 로 plan 실행 (변경하지 않고 비교만)',
        'terraform init -input=false -no-color > /tmp/init.log',
        '',
        'terraform plan \\',
        '  -detailed-exitcode \\',
        '  -no-color \\',
        '  -out=/tmp/plan.bin > /tmp/plan.out',
        '',
        'EXIT=$?',
        '',
        '# ── 2) -detailed-exitcode 의 의미',
        '#   0 = 변경 없음 (drift 없음)',
        '#   1 = 에러',
        '#   2 = 변경 있음 (drift 가능성!)',
        '',
        'if [ $EXIT -eq 0 ]; then',
        '  echo "✅ 변경 없음 — drift 없음"',
        '  exit 0',
        'fi',
        '',
        'if [ $EXIT -eq 1 ]; then',
        '  echo "❌ terraform 에러"',
        '  cat /tmp/plan.out',
        '  exit 1',

        beat: {"label":"정책 검사 (Conftest)","at":"ci-cron.yaml L42–46","caption":"exit 이 2 일 때만 plan 을 JSON 으로 바꿔 OPA 정책으로 검사한다.","changes":[{"mark":"new","text":"plan.json 변환"},{"mark":"read","text":"conftest 정책 검사"}]},
        stateRes: {"type":"aws_instance","name":"web","instanceType":"t3.small","status":"정책 검사 중"},
        liveRes: {"type":"aws_instance","name":"web","instanceType":"t3.large","status":"콘솔에서 수정됨","drifted":true},
        alerts: [{"level":"block","msg":"🛑 정책 위반이면 워크플로우가 실패로 끝난다"}],
        ciBox: {"title":"정책 검사","steps":["03:02 — 변경 있으면 Sentinel/OPA 검사","plan 을 JSON 으로 변환해 conftest 로 검사"]},
        keyPoint: "변경이 있을 때만 검사하면 매일 도는 워크플로우가 가볍다.",
        code:{...CODE.ciCron, highlight:[42,43,44,45,46]},
      },
      { ...S5,
        beat: {"label":"Slack 으로 알린다","at":"ci-cron.yaml L48–55","caption":"drift 가 있으면 webhook 으로 메시지를 보낸다. URL 은 secrets 로 주입한다.","changes":[{"mark":"new","text":"Slack 알림 스텝"},{"mark":"read","text":"secrets 주입"}]},
        stateRes: {"type":"aws_instance","name":"web","instanceType":"t3.small","status":"코드 그대로"},
        liveRes: {"type":"aws_instance","name":"web","instanceType":"t3.large","status":"콘솔에서 수정됨","drifted":true},
        alerts: [{"level":"warn","msg":"⚠ Slack #infra-drift 로 알림 발송"},{"level":"todo","msg":"📝 아침에 코드/콘솔 중 어느 쪽에 맞출지 결정한다"}],
        ciBox: {"title":"알림","steps":["03:03 — 결과를 슬랙 #infra-drift 채널로","webhook URL 은 secrets 로 주입"]},
        keyPoint: "알림은 \"누가 언제 무엇을 판단할지\"까지 정해져 있어야 의미가 있다.",
        code:{...CODE.ciCron, highlight:[48,49,50,51,52,53,54,55]},
      },
      { ...S5,
        beat: {"label":"항상 요약을 남긴다","at":"ci-cron.yaml L57–61","caption":"if: always() 라 실패해도 종료 코드와 의미가 로그에 남는다.","changes":[{"mark":"new","text":"결과 요약 스텝"},{"mark":"changed","text":"점검 통과 상태"}]},
        stateRes: {"type":"aws_instance","name":"web","instanceType":"t3.small","status":"CI 점검 통과"},
        liveRes: {"type":"aws_instance","name":"web","instanceType":"t3.small","status":"코드와 일치"},
        alerts: [{"level":"ok","msg":"✅ 매일 03:00 KST drift 점검 통과"},{"level":"ok","msg":"✅ 정책 점검 통과 (Sentinel 0 violations)"}],
        ciBox: {"title":"자동 운영 흐름","steps":["03:00 — GitHub Actions 스케줄 트리거","03:01 — terraform init + plan -detailed-exitcode","03:02 — 변경 있으면 Sentinel/OPA 검사","03:03 — 결과를 슬랙 #infra-drift 채널로","PR 시점 — 같은 정책이 PR check 로 실행됨"]},
        keyPoint: "CI 정기 점검 + 정책 게이트 = 사람의 개입 없이 인프라가 코드 기준을 유지한다.",
        code:{...CODE.ciCron, highlight:[57,58,59,60,61]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — pink 톤
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      ok:    { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800' },
      info:  { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-800' },
      warn:  { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-800' },
      block: { bg: 'bg-rose-50',    border: 'border-rose-400',    text: 'text-rose-800' },
      todo:  { bg: 'bg-slate-50',   border: 'border-slate-300',   text: 'text-slate-700' },
    };

    function ResourceCard({ res, side }) {
      const drift = res.drifted;
      const synced = res.synced;
      const sideColor = side === 'state'
        ? 'border-pink-300 bg-pink-50'
        : drift ? 'border-rose-400 bg-rose-50' : synced ? 'border-emerald-300 bg-emerald-50' : 'border-slate-300 bg-slate-50';
      const sideTitle = side === 'state' ? '🗺️ Terraform State' : '☁️ 실제 클라우드';
      return (
        <div className={`rounded-lg border-2 ${sideColor} p-3`}>
          <div className="text-[10px] font-bold text-slate-600 mb-2">{sideTitle}</div>
          <div className="space-y-1.5 text-xs">
            <div className="flex justify-between">
              <span className="text-slate-500">type</span>
              <span className="font-mono text-slate-800">{res.type}</span>
            </div>
            <div className="flex justify-between">
              <span className="text-slate-500">name</span>
              <span className="font-mono text-slate-800">{res.name}</span>
            </div>
            <div className="flex justify-between items-center">
              <span className="text-slate-500">instance_type</span>
              <span className={`font-mono font-bold ${drift ? 'text-rose-700' : synced ? 'text-emerald-700' : 'text-pink-800'}`}>
                {res.instanceType}
              </span>
            </div>
            <div className={`mt-2 text-[10px] px-2 py-1 rounded text-center ${drift ? 'bg-rose-200 text-rose-800' : synced ? 'bg-emerald-200 text-emerald-800' : side === 'state' ? 'bg-pink-200 text-pink-800' : 'bg-slate-200 text-slate-700'}`}>
              {res.status}
            </div>
          </div>
        </div>
      );
    }

    function AlertList({ alerts }) {
      if (!alerts || alerts.length === 0) return null;
      return (
        <div className="space-y-1.5">
          {alerts.map((a, i) => {
            const s = ALERT_STYLE[a.level] || ALERT_STYLE.info;
            return (
              <div key={i} className={`text-xs px-3 py-2 rounded border ${s.bg} ${s.border} ${s.text}`}>
                {a.msg}
              </div>
            );
          })}
        </div>
      );
    }

    function PolicyBox({ policy }) {
      if (!policy) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-400 bg-rose-50 p-3">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-lg">🛑</span>
            <span className="text-sm font-bold text-rose-800">{policy.title}</span>
          </div>
          <div className="font-mono text-[11px] bg-white border border-rose-200 rounded px-2 py-1 mb-2 text-rose-900">
            {policy.rule}
          </div>
          <ul className="space-y-1">
            {policy.actions.map((a, i) => (
              <li key={i} className="text-xs text-rose-900 flex gap-2">
                <span className="text-rose-500">▸</span>
                <span>{a}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function CiBox({ ci }) {
      if (!ci) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-pink-500 bg-gradient-to-br from-pink-50 to-rose-50 p-4">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🤖</span>
            <span className="text-lg font-bold text-pink-800">{ci.title}</span>
          </div>
          <ol className="space-y-1.5">
            {ci.steps.map((s, i) => (
              <li key={i} className="text-xs text-pink-900 flex gap-2">
                <span className="text-pink-500 mt-0.5">{i + 1}.</span>
                <span>{s}</span>
              </li>
            ))}
          </ol>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      return (
        <div className="rounded-xl border border-pink-200 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-pink-800">State vs 실제 인프라</h3>
            <span className="text-[10px] text-slate-500">drift 감지 시뮬레이션</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* state vs live 다이어그램 */}
          <div className="grid grid-cols-2 gap-2 mb-3">
            <ResourceCard res={state.stateRes} side="state" />
            <ResourceCard res={state.liveRes} side="live" />
          </div>

          {/* drift 비교 화살표 */}
          <div className="text-center text-xs font-bold py-2 mb-3 rounded bg-pink-50 border border-pink-200 text-pink-700">
            {state.stateRes.instanceType === state.liveRes.instanceType
              ? '↔ state ↔ 실제 = 일치'
              : '✕ state ≠ 실제 = DRIFT'}
          </div>

          {/* 알람 리스트 */}
          <AlertList alerts={state.alerts} />

          {/* 정책 차단 박스 */}
          <PolicyBox policy={state.policy} />

          {/* CI 자동화 박스 */}
          <CiBox ci={state.ciBox} />

          {/* 핵심 포인트 */}
          <div className="mt-3 text-xs text-pink-900 bg-pink-50 border border-pink-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-pink-500/15 border-l-2 border-pink-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 4버튼 + 키보드 + 자동재생 3000ms
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-pink-50 to-rose-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-pink-600 text-white font-bold">V</span>
              <div>
                <h1 className="text-2xl font-bold text-pink-900">V-1-2. Drift 감지와 Sentinel 정책</h1>
                <p className="text-sm text-pink-800/80">콘솔 수정 → plan 감지 → refresh-only → 정책 차단 → CI 정기 점검</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-pink-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-pink-600' : 'bg-pink-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-pink-700 text-pink-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-pink-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 (4버튼) */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-pink-300 bg-white text-pink-700 hover:bg-pink-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-pink-300 bg-white text-pink-700 hover:bg-pink-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-pink-700 text-white' : 'bg-pink-600 text-white hover:bg-pink-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-pink-300 bg-white text-pink-700 hover:bg-pink-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-pink-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-pink-400 bg-white px-4 py-3 text-sm text-pink-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                drift는 콘솔 수정 같은 "코드 밖 변경"으로 무조건 생긴다. plan으로 감지하고, refresh-only로 흡수하고, Sentinel/OPA로 위험 변경을 차단하고, CI로 매일 점검하는 4중 방어선을 갖추면 인프라가 코드 기준에서 벗어나지 않는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['drift', 'terraform plan', 'refresh-only', 'Sentinel', 'OPA', 'Conftest', 'CI', 'GitHub Actions'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-pink-100 text-pink-800 border border-pink-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-pink-700">
              <a href="./V-1-1.html" className="underline hover:no-underline">← 이전: V-1-1</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 secret 관리 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
