  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-2-2. Resource Limits & Requests
    학습 목표: requests=보장 / limits=상한 — Pod별 자원 예약과 폭주 방지로 노드 안정성 확보.
    핵심 비유: "예약 좌석 + 최대 사용량" — requests=좌석 예약(스케줄링), limits=상한(폭주 방지)
    구조: 5단계 (미설정 / requests / limits / QoS 클래스 / 실전 우상향)
    패턴: fastapi v1 — 좌(SVG 막대 차트: CPU/Memory) / 우(VSCode CodeViewer: yaml 탭)
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — 3 Pod (web / worker / cron) 의 CPU·Memory
    //   request : 점선 / limit : 실선 / usage : 채워진 막대
    //   단위는 노드 1개 기준 (CPU 4 core = 4000m, Memory 8 GiB = 8192 Mi)
    // ─────────────────────────────────────────────────────
    const NODE_CPU_TOTAL = 4000;   // 4 core (m 단위)
    const NODE_MEM_TOTAL = 8192;   // 8 GiB (Mi 단위)

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      noLimits: {lang:'yaml', filename:'pod-no-limits.yaml', lines:[
        '# 위험 — resources 섹션 자체가 없음',
        'apiVersion: v1',
        'kind: Pod',
        'metadata:',
        '  name: web',
        '  labels:',
        '    app: web',
        '    tier: frontend',
        'spec:',
        '  containers:',
        '    - name: app',
        '      image: myapp:v1',
        '      ports:',
        '        - containerPort: 8080',
        '      # ❌ resources 미설정 → 노드 자원 무제한 가정',
        '      # ❌ requests 없음 → 스케줄러가 자원 예약 못함',
        '      # ❌ limits 없음 → 폭주해도 막을 방법 없음',
        '',
        '# 결과 (kubectl top 으로 본 노드)',
        '#   NAME    CPU    MEMORY',
        '#   web     3200m  7400Mi   ← 노드 거의 다 먹음',
        '#   worker  600m   500Mi    ← starving',
        '#   cron    100m   100Mi    ← scheduled but slow',
        '',
        '# 발생할 일',
        '#  1) web 메모리 누수 → 노드 OOMKiller 발동',
        '#  2) BestEffort = 가장 먼저 강제 종료',
        '#  3) 같은 노드의 worker / cron 까지 도미노',
        '#  4) 노드 자체가 NotReady — 페이저 새벽 호출',
        '',
        '# 진단 명령어 (장애 시점)',
        '#   kubectl describe node node-1',
        '#     Conditions:',
        '#       MemoryPressure   True   ← 노드 메모리 압박',
        '#       DiskPressure     False',
        '#   kubectl get events --sort-by=.lastTimestamp',
        '#     SystemOOM   killed process web pid=1234',
        '#     Evicted     The node was low on resource: memory',
      ]},
      requests: {lang:'yaml', filename:'pod-with-requests.yaml', lines:[
        '# requests = 예약 좌석 (스케줄링 보장)',
        'apiVersion: v1',
        'kind: Pod',
        'metadata:',
        '  name: web',
        '  labels:',
        '    app: web',
        'spec:',
        '  containers:',
        '    - name: app',
        '      image: myapp:v1',
        '      resources:',
        '        requests:',
        '          cpu: "250m"        # 0.25 core 예약',
        '          memory: "512Mi"    # 512 MiB 예약',
        '        # ⚠ limits 없음 — 여유 시 더 사용 가능',
        '',
        '# 단위 표기법',
        '#   CPU  : "1"=1 core, "500m"=0.5 core, "100m"=0.1 core',
        '#   MEM  : "Mi"=1024^2, "Gi"=1024^3 (소문자 m 와 다름)',

                caption: 'describe pod의 Last State가 Terminated / OOMKilled / Exit Code 137이면 메모리 상한을 넘었다는 뜻이다.',
                changes: [ { mark: 'changed', text: 'web mem 1024Mi = limit 도달' },
                           { mark: 'new', text: 'web 상태 OOMKilled (Exit 137)' } ] },
        nodeWarning: '🚨 web Pod 메모리 limit(1Gi) 도달 → OOMKilled, 자동 재시작됨',
        pods: [
          pod('web',    'Burstable', 250, 500, 480, 512, 1024, 1024, 'oomkilled', true),
          pod('worker', 'Burstable', 200, 400, 180, 256, 512,  240,  'running'),
          pod('cron',   'Burstable', 100, 200, 150, 128, 256,  100,  'running'),
        ],
        code: { ...CODE.limits, highlight: [29, 30, 31, 32, 33, 34] },
      },
      { ...S3,
        beat: { label: '노드는 살아남는다', at: 'pod-with-limits.yaml L36–37',
                caption: 'Step 1과 달리 죽은 것은 web 컨테이너 하나뿐이다. 재시작 직후 로그는 --previous로 본다.',
                changes: [ { mark: 'changed', text: 'web 재시작 — mem 300Mi' },
                           { mark: 'read', text: 'worker / cron 무사' } ] },
        nodeWarning: '✓ web 만 재시작됐고 worker / cron 은 무사 — 노드는 정상',
        pods: [
          pod('web',    'Burstable', 250, 500, 180, 512, 1024, 300, 'running'),
          pod('worker', 'Burstable', 200, 400, 180, 256, 512,  240, 'running'),
          pod('cron',   'Burstable', 100, 200, 150, 128, 256,  100, 'running'),
        ],
        code: { ...CODE.limits, highlight: [36, 37] },
      },

      // ── Step 4. QoS ───────────────────────────────────────────────────
      { ...S4,
        beat: { label: 'db에 requests를 크게', at: 'pod-guaranteed.yaml L10–13',
                caption: 'DB는 1 core / 2Gi를 예약한다. 아직 limits가 없어 Burstable이다.',
                changes: [ { mark: 'new', text: 'db req 1000m / 2048Mi' },
                           { mark: 'changed', text: 'db QoS → Burstable' } ] },
        nodeWarning: '⚠ db 는 아직 Burstable — 노드가 부족하면 중간 순위로 밀린다',
        pods: [
          pod('db',   'Burstable',  1000, 0,   700, 2048, 0,    1600, 'running'),
          pod('web',  'Burstable',  250,  500, 220, 512,  1024, 480,  'running'),
          pod('cron', 'BestEffort', 0,    0,   80,  0,    0,    60,   'running'),
        ],
        code: { ...CODE.guaranteed, highlight: [10, 11, 12, 13] },
      },
      { ...S4,
        beat: { label: 'limits를 requests와 똑같이', at: 'pod-guaranteed.yaml L14–16',
                caption: 'requests와 limits가 모든 자원에서 정확히 같으면 QoS가 Guaranteed로 올라간다.',
                changes: [ { mark: 'new', text: 'db lim 1000m / 2048Mi' },
                           { mark: 'changed', text: 'db QoS → Guaranteed' } ] },
        nodeWarning: '✓ db = Guaranteed (1 core / 2Gi 정확히 동일) — 노드 부족 시 마지막에 죽음',
        pods: [
          pod('db',   'Guaranteed', 1000, 1000, 700, 2048, 2048, 1600, 'running'),
          pod('web',  'Burstable',  250,  500,  220, 512,  1024, 480,  'running'),
          pod('cron', 'BestEffort', 0,    0,    80,  0,    0,    60,   'running'),
        ],
        code: { ...CODE.guaranteed, highlight: [14, 15, 16] },
      },
      { ...S4,
        beat: { label: 'eviction 순서가 정해진다', at: 'pod-guaranteed.yaml L18–25',
                caption: '노드가 부족하면 kubelet은 requests를 넘겨 쓰는 Pod부터 우선순위와 초과량 순으로 쫓아낸다. 그래서 대체로 BestEffort → Burstable → Guaranteed 순이 되고 cron이 1순위다.',
                changes: [ { mark: 'changed', text: 'cron 상태 → Evict 1순위' },
                           { mark: 'read', text: 'web은 중간, db는 마지막' } ] },
        nodeWarning: '⚠ 노드 부족 시 cron(BestEffort) 이 가장 먼저 evict 된다',
        pods: [
          pod('db',   'Guaranteed', 1000, 1000, 700, 2048, 2048, 1600, 'running'),
          pod('web',  'Burstable',  250,  500,  220, 512,  1024, 480,  'running'),
          pod('cron', 'BestEffort', 0,    0,    80,  0,    0,    60,   'evict-first'),
        ],
        code: { ...CODE.guaranteed, highlight: [18, 19, 20, 21, 22, 23, 24, 25] },
      },
      { ...S4,
        beat: { label: '역할별로 클래스를 고른다', at: 'pod-guaranteed.yaml L27–30',
                caption: 'DB·결제·인증은 Guaranteed, 일반 web / worker는 Burstable, 임시 cron은 BestEffort로 둔다.',
                changes: [ { mark: 'read', text: 'db=Guaranteed / web=Burstable' },
                           { mark: 'read', text: 'cron=BestEffort는 의도된 선택' } ] },
        nodeWarning: '✓ 세 Pod 가 각자 역할에 맞는 QoS — critical 은 마지막까지 산다',
        pods: [
          pod('db',   'Guaranteed', 1000, 1000, 750, 2048, 2048, 1650, 'running'),
          pod('web',  'Burstable',  250,  500,  240, 512,  1024, 500,  'running'),
          pod('cron', 'BestEffort', 0,    0,    80,  0,    0,    60,   'evict-first'),
        ],
        code: { ...CODE.guaranteed, highlight: [27, 28, 29, 30] },
      },

      // ── Step 5. 실전 튜닝 ─────────────────────────────────────────────
      { ...S5,
        beat: { label: 'kubectl top으로 측정', at: 'tune-resources.sh L1–6',
                caption: '값을 정하기 전에 1~2주 실제 사용량을 본다. 지금 값은 감으로 잡아 둔 예전 값이다.',
                changes: [ { mark: 'read', text: 'web 실사용 380m / 700Mi' },
                           { mark: 'read', text: 'worker 250m / 500Mi' } ] },
        nodeWarning: '⚠ web 실사용(380m/700Mi)이 예전 request(250m/512Mi) 를 넘는다',
        pods: [
          pod('db',     'Guaranteed', 1000, 1000, 850, 2048, 2048, 1700, 'running'),
          pod('web',    'Burstable',  250,  500,  380, 512,  1024, 700,  'running'),
          pod('worker', 'Burstable',  200,  400,  250, 256,  512,  500,  'running'),
        ],
        code: { ...CODE.tuning, highlight: [1, 2, 3, 4, 5, 6] },
      },
      { ...S5,
        beat: { label: 'Prometheus로 분포를 본다', at: 'tune-resources.sh L8–10',
                caption: 'top은 한 시점 값이라 부족하다. rate와 working_set으로 P50 / P95 / P99를 뽑는다.',
                changes: [ { mark: 'new', text: 'web P50 270m · P95 480m' },
                           { mark: 'new', text: 'worker P50 180m · P95 330m' } ] },
        nodeWarning: '✓ 2주치 분포 확보 — 이제 감이 아니라 숫자로 정한다',
        pods: [
          pod('db',     'Guaranteed', 1000, 1000, 850, 2048, 2048, 1700, 'running'),
          pod('web',    'Burstable',  250,  500,  480, 512,  1024, 780,  'running'),
          pod('worker', 'Burstable',  200,  400,  330, 256,  512,  520,  'running'),
        ],
        code: { ...CODE.tuning, highlight: [8, 9, 10] },
      },
      { ...S5,
        beat: { label: '경험칙으로 값을 계산', at: 'tune-resources.sh L12–15',
                caption: 'request는 P50 × 1.1, limit은 P95 × 1.2. 메모리 limit만 P99 × 1.3으로 넉넉히 잡는다.',
                changes: [ { mark: 'changed', text: 'web req 250→300m, lim 500→600m' },
                           { mark: 'changed', text: 'worker mem req 256→384Mi' } ] },
        nodeWarning: '✓ 계산값 반영 — web 300m/600m, worker 200m/400m',
        pods: [
          pod('db',     'Guaranteed', 1000, 1000, 850, 2048, 2048, 1700, 'running'),
          pod('web',    'Burstable',  300,  600,  380, 512,  1024, 700,  'running'),
          pod('worker', 'Burstable',  200,  400,  250, 384,  768,  500,  'running'),
        ],
        code: { ...CODE.tuning, highlight: [12, 13, 14, 15] },
      },
      { ...S5,
        beat: { label: 'VPA 권장값과 대조', at: 'tune-resources.sh L17–18',
                caption: 'CPU는 VPA 290m과 계산값 300m이 3% 차이라 맞다. 메모리는 VPA가 660Mi를 권해, 512Mi로 둔 request를 올려야 한다는 신호다.',
                changes: [ { mark: 'read', text: 'VPA 권장 web 290m / 660Mi' },
                           { mark: 'changed', text: 'CPU 차이 3% / 메모리 512Mi는 낮음' } ] },
        nodeWarning: '⚠ CPU 는 VPA 와 3% 차이, 메모리 request 512Mi 는 VPA 660Mi 보다 낮다',
        pods: [
          pod('db',     'Guaranteed', 1000, 1000, 850, 2048, 2048, 1700, 'running'),
          pod('web',    'Burstable',  300,  600,  390, 512,  1024, 710,  'running'),
          pod('worker', 'Burstable',  200,  400,  250, 384,  768,  500,  'running'),
        ],
        code: { ...CODE.tuning, highlight: [17, 18] },
      },
      { ...S5,
        beat: { label: '비즈니스 우선순위로 매핑', at: 'tune-resources.sh L20–23',
                caption: 'SLO가 높은 db는 Guaranteed, 일반 서비스는 Burstable로 둔다.',
                changes: [ { mark: 'read', text: 'db → Guaranteed 유지' },
                           { mark: 'read', text: 'web / worker → Burstable' },
                           { mark: 'changed', text: 'web mem req 512 → 660Mi (VPA)' } ] },
        nodeWarning: '✓ db=Guaranteed, web/worker=Burstable — 클래스 배치 완료',
        pods: [
          pod('db',     'Guaranteed', 1000, 1000, 850, 2048, 2048, 1700, 'running'),
          pod('web',    'Burstable',  300,  600,  380, 660,  1024, 700,  'running'),
          pod('worker', 'Burstable',  200,  400,  250, 384,  768,  500,  'running'),
        ],
        code: { ...CODE.tuning, highlight: [20, 21, 22, 23] },
      },
      { ...S5,
        beat: { label: '하지 말아야 할 3가지', at: 'tune-resources.sh L25–28',
                caption: '전부 미설정(Step 1), 무지성 request=limit, limit만 설정 — 셋 다 흔한 사고 원인이다.',
                changes: [ { mark: 'gone', text: '미설정 Pod 0개' },
                           { mark: 'read', text: '모든 사용량이 req~lim 사이' } ] },
        nodeWarning: '✓ 모든 Pod 사용량이 request~limit 범위 내 — 노드 안정',
        pods: [
          pod('db',     'Guaranteed', 1000, 1000, 850, 2048, 2048, 1700, 'running'),
          pod('web',    'Burstable',  300,  600,  380, 660,  1024, 700,  'running'),
          pod('worker', 'Burstable',  200,  400,  250, 384,  768,  500,  'running'),
        ],
        code: { ...CODE.tuning, highlight: [25, 26, 27, 28] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // QoS 색상 (정적 — Tailwind purge 안전)
    // ── RefPanel: 그림 아래 "표·정리 보기" (훅 없는 함수) ──
    function RefPanel({ step, stepIdx }) {
      const g = raGroupOf(stepIdx).g;
      if (g === 1) return (
        <div>
          <h4>단위 표기</h4>
          <ul>
            <li>CPU: "1" = 1 core, "500m" = 0.5 core, "100m" = 0.1 core. "0.5" 보다 "500m" 를 권한다.</li>
            <li>메모리: "Mi" = 1024², "Gi" = 1024³. 소문자 m은 메모리에서 전혀 다른 뜻(1/1000 바이트)이다.</li>
          </ul>
        </div>);
      if (g === 2) return (
        <div>
          <h4>limit을 넘었을 때</h4>
          <table>
            <thead><tr><th>자원</th><th>결과</th><th>확인</th></tr></thead>
            <tbody>
              <tr><td>CPU</td><td>throttle, 느려질 뿐 죽지 않는다</td><td>응답 지연, CPU 사용량이 limit에 붙음</td></tr>
              <tr><td>메모리</td><td>OOMKilled (SIGKILL), 컨테이너 재시작</td><td className="font-mono">Last State: OOMKilled, Exit Code 137</td></tr>
            </tbody>
          </table>
          <p className="mt-1">죽기 직전 로그는 kubectl logs web --previous로 본다.</p>
        </div>);
      if (g === 3) return (
        <div>
          <h4>QoS 3 클래스</h4>
          <table>
            <thead><tr><th>클래스</th><th>조건</th><th>쓰임</th></tr></thead>
            <tbody>
              <tr><td>Guaranteed</td><td>모든 컨테이너가 CPU·메모리 req == lim</td><td>DB, 결제, 인증</td></tr>
              <tr><td>Burstable</td><td>req가 있지만 Guaranteed 조건은 아님</td><td>일반 web, worker</td></tr>
              <tr><td>BestEffort</td><td>req와 lim 모두 없음</td><td>임시 cron, debug</td></tr>
            </tbody>
          </table>
          <p className="mt-1">kubelet은 QoS 클래스를 직접 보지 않는다. 사용량이 requests를 넘는지, Pod 우선순위, 초과량 순으로 고르며 그 결과가 QoS 순서와 대체로 같다.</p>
        </div>);
      if (g === 4) return (
        <div>
          <h4>경험칙 (tune-resources.sh)</h4>
          <table>
            <thead><tr><th>값</th><th>계산</th></tr></thead>
            <tbody>
              <tr><td>request</td><td>P50 × 1.1</td></tr>
              <tr><td>limit</td><td>P95 × 1.2</td></tr>
              <tr><td>메모리 limit</td><td>P99 × 1.3</td></tr>
            </tbody>
          </table>
          <p className="mt-1">클래스 매핑: Guaranteed는 DB, payment-api, auth. Burstable은 web, worker, batch-processor. BestEffort는 cron-cleanup, log-rotator.</p>
          <p className="mt-1">다음 장: <a href="../part5/V-1-1.html">V-1-1 kubectl 핵심 명령어</a></p>
        </div>);
      return null;
    }
    // ── /RefPanel ──

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + 라인 번호 + 강조
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        codeRef.current.removeAttribute('data-highlighted');
        codeRef.current.className = `language-${code.lang}`;
        codeRef.current.textContent = code.lines.join('\n');
        window.hljs.highlightElement(codeRef.current);
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-300 ml-2 font-mono bg-[#282c34] px-2 py-0.5 rounded-t border-t border-l border-r border-cyan-600">
              {code.filename}
            </span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 라인 번호 + 강조 라인 렌더링 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-cyan-500/10 border-l-2 border-cyan-400' : 'border-l-2 border-transparent'}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
