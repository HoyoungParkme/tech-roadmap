    @media (min-width: 768px) {

      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }

  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

  <!--
    V-1-1. kubectl 핵심 명령어 (get / describe / logs / exec / apply / delete)
    학습 목표: 6 명령어가 어떻게 API server → etcd → kubelet → 컨테이너로 흘러가는지 본다.
    핵심 비유: "스위스 군도 6종" — 각 명령어가 통과하는 경로가 다르다 (read / event / log / shell / write / delete)
    패턴: fastapi v1 — 좌(LiveDataPane: 흐름 다이어그램 + 출력 박스) / 우(VSCode CodeViewer)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 컨트롤 플레인 + 노드 노드 정의 (좌 → 우 데이터 흐름)
    //   kubectl → API server → etcd ↘
    //                              ↘ kubelet → container
    // ─────────────────────────────────────────────────────
    const NODES = [
      { key: 'kubectl',   name: 'kubectl',     sub: 'CLI 클라이언트',    col: 0, row: 0 },
      { key: 'apiserver', name: 'API server',  sub: '인증/인가/admission', col: 1, row: 0 },
      { key: 'etcd',      name: 'etcd',        sub: '클러스터 상태 DB',   col: 2, row: 0 },
      { key: 'kubelet',   name: 'kubelet',     sub: '노드 에이전트',     col: 1, row: 1 },
      { key: 'container', name: 'container',   sub: 'Pod 안 컨테이너',   col: 2, row: 1 },
    ];

    // 단계별 활성 경로 (cyan glow 적용 노드/엣지)
    // edge key: "from->to"
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. kubectl get pods — 목록 조회 (read)',
        desc: 'kubectl이 가장 많이 치는 명령. API server는 인증/인가만 통과시키고 etcd에서 Pod 목록을 읽어 그대로 응답한다. kubelet은 거치지 않는 가장 짧은 경로 — read-only 트래픽이라 빠르고 가볍다.',
        activeNodes: ['kubectl', 'apiserver', 'etcd'],
        activeEdges: ['kubectl->apiserver', 'apiserver->etcd', 'etcd->apiserver', 'apiserver->kubectl'],
        outputKind: 'table',
        output: {
          headers: ['NAME', 'READY', 'STATUS', 'RESTARTS', 'AGE'],
          rows: [
            ['web-7d9f8c5b-aa1', '1/1', 'Running',  '0', '2d'],
            ['web-7d9f8c5b-bb2', '1/1', 'Running',  '0', '2d'],
            ['api-6c4f9e2a-cc3', '1/1', 'Running',  '1', '5h'],
            ['db-0',              '1/1', 'Running',  '0', '12d'],
          ],
        },
        code: {
          lang: 'bash',
          filename: 'get-pods.sh',
          lines: [
            '#!/bin/bash',
            '# Step 1. kubectl get — 리소스 목록 조회 (가장 자주 치는 명령)',
            '#   경로: kubectl → API server → etcd → 응답',
            '#   특징: read-only, kubelet 안 거침, 가볍고 빠름',
            '',
            '# 기본',
            'kubectl get pods',
            '#   NAME              READY   STATUS    RESTARTS   AGE',
            '#   web-7d9f8c5b-aa1  1/1     Running   0          2d',
            '',
            '# 자주 쓰는 옵션',
            'kubectl get pods -A             # 모든 namespace',
            'kubectl get pods -o wide        # 노드 / Pod IP까지',
            'kubectl get pods -w             # watch (실시간 변화)',
            'kubectl get pods -l app=web     # 라벨 필터',
            'kubectl get pod web-aa1 -o yaml # 한 Pod 전체 YAML',
            '',
            '# 단축 별칭 (외워두면 빠름)',
            'kubectl get po                  # = pods',
            'kubectl get svc                 # = services',
            'kubectl get deploy              # = deployments',
            'kubectl get ns                  # = namespaces',
            '',
            '# 내부에서 일어나는 일',
            '#  1) kubectl이 ~/.kube/config 읽고 API server 주소 + token 확인',

            '#  3) etcd에서 /registry/pods/<ns>/* 읽기',
            '#  4) JSON 직렬화 → kubectl이 표 형식 출력',
          ],
          highlight: [7, 12, 13, 14, 25, 26, 27, 28],
        },
      },
      {
        title: 'Step 2. kubectl describe pod — 상세 + Events 히스토리',
        desc: 'get으로 STATUS가 이상하면 describe로 깊이 파고든다. API server는 Pod 본문 + Event 리소스 두 가지를 etcd에서 함께 읽어 합쳐 보여준다. 마지막 Events 섹션이 "왜 안 되나"의 답 — ImagePullBackOff / OOMKilled 진단 1순위.',
        activeNodes: ['kubectl', 'apiserver', 'etcd'],

        output: {

                stroke={stroke}
                strokeWidth={isActive ? 2.5 : 1.5}
                strokeDasharray={e.dashed ? '5 4' : '0'}
                markerEnd={marker}
                style={isActive ? { filter: 'url(#cyan-glow)' } : {}}
              />
            );
          })}

          {/* 노드 박스 */}
          {NODES.map((n) => {
            const p = NODE_POS[n.key];
            const isActive = activeNodes && activeNodes.includes(n.key);
            return (
              <g key={n.key} style={isActive ? { filter: 'url(#cyan-glow)' } : {}}>
                <rect
                  x={p.x} y={p.y} width={p.w} height={p.h}
                  rx="8"
                  fill={isActive ? '#cffafe' : '#ffffff'}
                  stroke={isActive ? '#06b6d4' : '#cbd5e1'}
                  strokeWidth={isActive ? 2.5 : 1.5}
                />
                <text
                  x={p.x + p.w / 2} y={p.y + 24}
                  textAnchor="middle"
                  fontSize="13"
                  fontWeight="bold"
                  fill={isActive ? '#0e7490' : '#334155'}
                  fontFamily="monospace"
                >
                  {n.name}
                </text>
                <text
                  x={p.x + p.w / 2} y={p.y + 42}
                  textAnchor="middle"
                  fontSize="9.5"
                  fill={isActive ? '#0e7490' : '#64748b'}
                >
                  {n.sub}
                </text>
              </g>
            );
          })}
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // OutputBox — step별 출력 내용 (table/describe/logs/shell/apply/delete)
    // ─────────────────────────────────────────────────────
    function OutputBox({ kind, output }) {
      // 1) get pods 표
      if (kind === 'table') {
        return (
          <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
            <div className="bg-slate-800 px-3 py-1.5 text-[10px] text-slate-400 font-mono flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
              <span>$ kubectl get pods</span>
            </div>
            <div className="p-3 overflow-x-auto">
              <table className="w-full text-[11px] font-mono text-slate-200">
                <thead>
                  <tr className="text-cyan-400 border-b border-slate-700">
                    {output.headers.map((h) => (
                      <th key={h} className="text-left py-1 px-2 font-bold">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {output.rows.map((row, i) => (
                    <tr key={i} className="border-b border-slate-800 hover:bg-slate-800/50">
                      {row.map((cell, j) => (
                        <td key={j} className="py-1 px-2 whitespace-nowrap">
                          {j === 2 && cell === 'Running' ? (
                            <span className="text-emerald-400">{cell}</span>
                          ) : cell}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      // 2) describe pod
      if (kind === 'describe') {
        return (
          <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
            <div className="bg-slate-800 px-3 py-1.5 text-[10px] text-slate-400 font-mono flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
              <span>$ kubectl describe pod {output.name}</span>
            </div>
            <div className="p-3 text-[11px] font-mono leading-5">
              <div className="text-slate-200">
                <span className="text-cyan-400">Name:</span>      {output.name}
              </div>
              <div className="text-slate-200">
                <span className="text-cyan-400">Status:</span>    <span className="text-emerald-400">{output.status}</span>
              </div>
              <div className="text-slate-200">
                <span className="text-cyan-400">Last Reason:</span> <span className="text-red-400">{output.lastReason}</span>
              </div>
              <div className="text-cyan-400 mt-2 mb-1">Events:</div>
              <div className="space-y-0.5">
                {output.events.map((ev, i) => (
                  <div key={i} className="flex gap-2 text-slate-200">
                    <span className={`w-14 ${ev.type === 'Warning' ? 'text-yellow-400' : 'text-slate-400'}`}>
                      {ev.type}
                    </span>
                    <span className="w-20 text-cyan-300">{ev.reason}</span>
                    <span className="w-16 text-slate-500">{ev.from}</span>
                    <span className={ev.type === 'Warning' ? 'text-yellow-200' : 'text-slate-300'}>
                      {ev.msg}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      // 3) logs -f 스트림
      if (kind === 'logs') {
        const lvlColor = { INFO: 'text-cyan-300', WARN: 'text-yellow-400', ERROR: 'text-red-400' };
        return (
          <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
            <div className="bg-slate-800 px-3 py-1.5 text-[10px] text-slate-400 font-mono flex items-center justify-between">
              <span className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                <span>$ kubectl logs -f web-aa1</span>
              </span>
              <span className="text-cyan-400">▍ live</span>
            </div>
            <div className="p-3 text-[11px] font-mono leading-5 space-y-0.5">
              {output.lines.map((l, i) => (
                <div key={i} className="text-slate-200 flex gap-2">
                  <span className="text-slate-500 whitespace-nowrap">{l.ts}</span>
                  <span className={`font-bold w-12 ${lvlColor[l.lvl]}`}>{l.lvl}</span>
                  <span className="text-slate-200 flex-1">{l.msg}</span>
                </div>
              ))}
              <div className="text-cyan-400 animate-pulse">▍</div>
            </div>
          </div>
        );
      }

      // 4) exec shell 인터랙티브
      if (kind === 'shell') {
        return (
          <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
            <div className="bg-slate-800 px-3 py-1.5 text-[10px] text-slate-400 font-mono flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
              <span>$ kubectl exec -it web-aa1 -- bash</span>
            </div>
            <div className="p-3 text-[11px] font-mono leading-5">
              {output.history.map((h, i) => {
                if (h.type === 'cmd') {
                  return (
                    <div key={i} className="text-slate-200">
                      <span className="text-cyan-400">{output.prompt}</span> {h.text}
                    </div>
                  );
                }
                return (
                  <div key={i} className="text-slate-300 whitespace-pre-line pl-1">
                    {h.text}
                  </div>
                );
              })}
              <div className="text-cyan-400 mt-1">{output.prompt} <span className="animate-pulse">▍</span></div>
            </div>
          </div>
        );
      }

      // 5) apply cascade
      if (kind === 'apply') {
        const kindColor = {
          cmd:  'text-slate-200',
          ok:   'text-emerald-400',
          info: 'text-slate-500',
          evt:  'text-cyan-300',
        };
        return (
          <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
            <div className="bg-slate-800 px-3 py-1.5 text-[10px] text-slate-400 font-mono flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
              <span>$ kubectl apply -f deployment.yaml</span>
            </div>
            <div className="p-3 text-[11px] font-mono leading-5 space-y-0.5">
              {output.lines.map((l, i) => (
                <div key={i} className={kindColor[l.kind]}>
                  {l.kind === 'evt' && <span className="text-slate-500 mr-1">›</span>}
                  {l.text}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // 6) delete timeline
      if (kind === 'delete') {
        const stateBadge = {
          cmd:     { color: 'text-slate-200',   label: '명령'   },
          mark:    { color: 'text-cyan-300',    label: '마킹'   },
          sigterm: { color: 'text-yellow-400',  label: 'SIGTERM' },
          hook:    { color: 'text-cyan-300',    label: 'hook'   },
          drain:   { color: 'text-cyan-300',    label: 'drain'  },
          sigkill: { color: 'text-red-400',     label: 'SIGKILL' },
          gone:    { color: 'text-slate-400',   label: '삭제완료' },
          reborn:  { color: 'text-emerald-400', label: '재생성' },
        };
        return (
          <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
            <div className="bg-slate-800 px-3 py-1.5 text-[10px] text-slate-400 font-mono flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
              <span>$ kubectl delete pod web-aa1   (graceful timeline)</span>
            </div>
            <div className="p-3 text-[11px] font-mono leading-5 space-y-0.5">
              {output.timeline.map((t, i) => {
                const b = stateBadge[t.state];
                return (
                  <div key={i} className="flex gap-2 items-baseline">
                    <span className="w-12 text-slate-500 text-right">{t.t}</span>
                    <span className={`w-16 font-bold ${b.color}`}>[{b.label}]</span>
                    <span className="text-slate-200 flex-1">{t.text}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      return null;
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측: 흐름 다이어그램 + 출력 박스
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🔄 kubectl 트래픽 경로</h2>
            <span className="text-[10px] text-slate-400 font-mono">control plane → node</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 흐름 다이어그램 */}
          <div className="bg-slate-50 rounded-lg border border-slate-200 p-2 mb-3">
            <FlowDiagram activeNodes={step.activeNodes} activeEdges={step.activeEdges} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mb-3 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5 bg-cyan-500"></span>활성 경로
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5 bg-slate-300"></span>비활성
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-3 h-0.5 border-t border-dashed border-slate-400"></span>응답
            </span>
          </div>

          {/* 출력 박스 */}
          <div className="mt-2">
            <div className="text-[10px] text-slate-500 font-mono mb-1.5">▼ 응답 출력</div>
            <OutputBox kind={step.outputKind} output={step.output} />
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js (cyan 강조)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[36rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-cyan-500/15 border-l-2 border-cyan-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-cyan-700 hover:text-cyan-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-cyan-600 text-white flex items-center justify-center rounded-full font-bold text-sm">V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. Kubernetes 운영 &gt; Chapter 1. kubectl 일상 도구</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">kubectl 핵심 명령어</h1>
                  <p className="text-sm text-slate-500 mt-0.5">스위스 군도 6종 — get / describe / logs / exec / apply / delete가 통과하는 경로</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-cyan-50 border-2 border-cyan-300 rounded-xl p-3 text-sm text-cyan-900">
                💡 다음(V-1-2)에서는 <strong>Helm</strong> — yaml 묶음을 패키지(Chart + values.yaml)로 관리
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-cyan-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-cyan-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-cyan-600 text-white hover:bg-cyan-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./V-1-2.html" className="text-cyan-700 hover:text-cyan-900 font-medium">V-1-2 Helm &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
