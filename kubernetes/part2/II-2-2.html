  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-2-2. DaemonSet & Job & CronJob — 노드별 1개 / 1회성 / 스케줄
    학습 목표: Deployment 외 3가지 워크로드 — DaemonSet(노드별 상주), Job(1회성), CronJob(주기 스케줄).
    핵심 비유: "직무 종류" — 청소부(DaemonSet, 모든 층 상주) / 출장(Job, 1회) / 통근(CronJob, 매일 정해진 시간)
    패턴: fastapi v1 — 좌(LiveDataPane: 3 영역 분할) / 우(VSCode CodeViewer · highlight.js)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — DaemonSet / Job / CronJob 시뮬레이션
    //   focus     : 'daemonset' | 'job' | 'cronjob' — 좌측 패널 활성 영역
    //   daemonset : { nodes: [{ id, role, hasPod, isNew }] }
    //   job       : { parallelism, completions, slots: [{ id, state }], succeeded, failed }
    //   cronjob   : { schedule, scheduleHuman, timeline: [{ ts, state }], history: [{ ts, state, dur }] }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang: 'yaml', filename: 'daemonset.yaml', lines: [
            '# DaemonSet — 모든 노드에 log-collector 1개씩',
            'apiVersion: apps/v1',
            'kind: DaemonSet',
            'metadata:',
            '  name: log-collector',
            '  namespace: kube-system',
            'spec:',
            '  selector:',
            '    matchLabels:',
            '      app: log-collector',
            '  template:',
            '    metadata:',
            '      labels:',
            '        app: log-collector',
            '    spec:',
            '      tolerations:                      # control-plane 노드도 허용',
            '        - key: node-role.kubernetes.io/control-plane',
            '          operator: Exists',
            '          effect: NoSchedule',
            '      containers:',
            '        - name: fluentd',
            '          image: fluent/fluentd:v1.16',
            '          volumeMounts:',
            '            - name: varlog',
            '              mountPath: /var/log     # 노드 호스트 로그 마운트',
            '      volumes:',
            '        - name: varlog',
            '          hostPath: { path: /var/log }',
            '',
            '# kubectl get ds -n kube-system',
            '# NAME            DESIRED   CURRENT   READY   NODE-SELECTOR',
            '# log-collector   3         3         3       <none>',
            '#  → 노드 3개 = Pod 3개 (replicas 지정 X)',
      ]},
      s2: {lang: 'shell', filename: 'scale-out.sh', lines: [
            '# 1) 새 워커 노드를 클러스터에 join',
            '$ kubeadm token create --print-join-command',
            'kubeadm join 10.0.0.1:6443 --token abc.xyz \\',
            '   --discovery-token-ca-cert-hash sha256:...',
            '',
            '# 2) node-4 에서 위 명령 실행',
            'node-4 $ sudo kubeadm join 10.0.0.1:6443 --token abc.xyz ...',
            '',
            '# 3) 컨트롤 플레인에서 확인',
            '$ kubectl get nodes',
            'NAME     STATUS   ROLES    AGE   VERSION',
            'node-1   Ready    worker   30d   v1.30.0',
            'node-2   Ready    worker   30d   v1.30.0',
            'node-3   Ready    worker   30d   v1.30.0',
            'node-4   Ready    worker   12s   v1.30.0   ← NEW',
            '',
            '# 4) DaemonSet 자동 반응 (수동 조작 0)',
            '$ kubectl get ds -n kube-system log-collector',
            'NAME            DESIRED   CURRENT   READY',
            'log-collector   4         4         4       ← 3 → 4 자동',
            '',
            '$ kubectl get pods -o wide -n kube-system | grep log-collector',
            'log-collector-aa11   Running   node-1',
            'log-collector-bb22   Running   node-2',
            'log-collector-cc33   Running   node-3',
            'log-collector-dd44   Running   node-4   ← 자동 생성',
      ]},
      s3: {lang: 'yaml', filename: 'job.yaml', lines: [
            '# Job — DB 스키마 마이그레이션 1회 실행',
            'apiVersion: batch/v1',
            'kind: Job',
            'metadata:',
            '  name: db-migration',
            'spec:',
            '  completions: 1            # 1회 성공해야 종료',
            '  parallelism: 1            # 동시 실행 1개',
            '  backoffLimit: 3           # 실패 시 재시도 3회',
            '  ttlSecondsAfterFinished: 3600   # 완료 1시간 후 자동 정리',
            '  template:',
            '    spec:',
            '      restartPolicy: OnFailure',
            '      containers:',
            '        - name: migrate',
            '          image: myapp:v1.4.0',
            '          command: ["python", "manage.py", "migrate"]',
            '',
            '# kubectl apply -f job.yaml',
            '# kubectl get pods',
            '# NAME                  READY   STATUS      AGE',
            '# db-migration-x7q2k    0/1     Completed   42s   ← 보존',
            '',

    // 영역별 활성 스타일 (focus가 가리키는 영역만 강조)
    const SECTION_STYLE = {
      active:   'border-cyan-400 bg-cyan-50 ring-2 ring-cyan-200',
      inactive: 'border-slate-200 bg-slate-50/50 opacity-60',
    };

    function DaemonSetSection({ data, isActive }) {
      const style = isActive ? SECTION_STYLE.active : SECTION_STYLE.inactive;
      return (
        <div className={`rounded-lg border-2 p-3 transition-all duration-500 ${style}`}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span aria-hidden="true">🧹</span>
              <span className="text-xs font-bold text-slate-700">DaemonSet · 노드 토폴로지</span>
            </div>
            <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyan-100 text-cyan-700 font-bold">
              노드 {data.nodes.length} = Pod {data.nodes.filter((n) => n.hasPod).length}
            </span>
          </div>

          <div className="grid grid-cols-4 gap-2">
            {data.nodes.map((n) => (
              <div
                key={n.id}
                className={`rounded-md border p-2 text-center transition-all duration-500 ${
                  n.isNew
                    ? 'bg-cyan-100 border-cyan-500 ring-2 ring-cyan-300 scale-105'
                    : 'bg-white border-slate-300'
                }`}
              >
                <div className="text-[10px] font-mono text-slate-500">{n.id}</div>
                <div className="text-lg leading-none my-1">🖥️</div>
                {n.hasPod ? (
                  <div className="inline-flex items-center gap-1 text-[9px] font-bold px-1.5 py-0.5 rounded bg-cyan-500 text-white">
                    <span>📦</span><span>Pod</span>
                  </div>
                ) : (
                  <div className="text-[9px] text-slate-400">no pod</div>
                )}
                {n.isNew && (
                  <div className="mt-1 text-[9px] font-bold text-cyan-700">NEW ✨</div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function JobSection({ data, isActive }) {
      const style = isActive ? SECTION_STYLE.active : SECTION_STYLE.inactive;
      const total = data.completions || 0;
      const done = data.succeeded || 0;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      const slotStyle = {
        succeeded: 'bg-emerald-500 text-white border-emerald-600',
        running:   'bg-cyan-500 text-white border-cyan-600 animate-pulse',
        failed:    'bg-red-500 text-white border-red-600',
        pending:   'bg-slate-200 text-slate-500 border-slate-300',
      };

      return (
        <div className={`rounded-lg border-2 p-3 transition-all duration-500 ${style}`}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span aria-hidden="true">✈️</span>
              <span className="text-xs font-bold text-slate-700">Job · 실행 progress</span>
            </div>
            {total > 0 ? (
              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyan-100 text-cyan-700 font-bold">
                {data.name || 'job'} · p={data.parallelism}/c={data.completions}
              </span>
            ) : (
              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-200 text-slate-500">idle</span>
            )}
          </div>

          {total > 0 ? (
            <>
              {/* progress bar */}
              <div className="relative h-3 bg-slate-100 rounded-full overflow-hidden mb-2 border border-slate-200">
                <div
                  className="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 transition-all duration-700"
                  style={{ width: `${pct}%` }}
                />
                <div className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-slate-700">
                  {done} / {total} ({pct}%)
                </div>
              </div>

              {/* slot grid */}
              <div className="grid grid-cols-6 gap-1.5">
                {data.slots.map((s) => (
                  <div
                    key={s.id}
                    className={`rounded border text-[10px] font-bold py-1.5 text-center ${slotStyle[s.state]}`}
                  >
                    #{s.id}
                  </div>
                ))}
              </div>

              <div className="flex gap-3 text-[10px] mt-2 text-slate-600">
                <span className="font-mono">✓ succeeded {data.succeeded}</span>
                <span className="font-mono">▶ running {data.running}</span>
                <span className="font-mono">✗ failed {data.failed}</span>
              </div>
            </>
          ) : (
            <div className="text-[11px] text-slate-400 text-center py-4">
              Job 미실행 (Step 3, 4 에서 동작)
            </div>
          )}
        </div>
      );
    }

    function CronJobSection({ data, isActive }) {
      const style = isActive ? SECTION_STYLE.active : SECTION_STYLE.inactive;
      const hasSchedule = !!data.schedule;

      const tickStyle = {
        success: 'bg-emerald-500 border-emerald-600 text-white',
        failed:  'bg-red-500 border-red-600 text-white',
        running: 'bg-cyan-500 border-cyan-600 text-white animate-pulse',
        pending: 'bg-slate-200 border-slate-300 text-slate-600',
      };

      const rowStyle = {
        success: 'bg-emerald-50 border-emerald-200',
        failed:  'bg-red-50 border-red-300',
        running: 'bg-cyan-50 border-cyan-300',
      };

      return (
        <div className={`rounded-lg border-2 p-3 transition-all duration-500 ${style}`}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span aria-hidden="true">⏰</span>
              <span className="text-xs font-bold text-slate-700">CronJob · 스케줄 timeline</span>
            </div>
            {hasSchedule ? (
              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-cyan-100 text-cyan-700 font-bold">
                {data.schedule} · {data.scheduleHuman}
              </span>
            ) : (
              <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-200 text-slate-500">idle</span>
            )}
          </div>

          {hasSchedule ? (
            <>
              {/* timeline ticks */}
              <div className="bg-white rounded-md border border-slate-200 p-2 mb-2">
                <div className="text-[9px] text-slate-500 font-mono mb-1">
                  ─── 02:00 매일 ───────────────────────→
                </div>
                <div className="flex items-end gap-1.5">
                  {data.timeline.map((t, i) => (
                    <div key={i} className="flex flex-col items-center gap-0.5 flex-1 min-w-0">
                      <div
                        className={`w-full h-7 rounded border flex items-center justify-center text-[9px] font-bold ${tickStyle[t.state]}`}
                        title={`${t.label} ${t.state}`}
                      >
                        {t.state === 'success' && '✓'}
                        {t.state === 'failed' && '✗'}
                        {t.state === 'running' && '▶'}
                        {t.state === 'pending' && '·'}
                      </div>
                      <div className="text-[9px] text-slate-500 font-mono truncate">{t.label}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* history rows */}
              {data.history.length > 0 && (
                <div className="space-y-1">
                  <div className="text-[10px] font-bold text-slate-600 mb-1">📜 Job history</div>
                  {data.history.map((h, i) => (
                    <div
                      key={i}
                      className={`flex items-center justify-between text-[10px] font-mono px-2 py-1 rounded border ${rowStyle[h.state]}`}
                    >
                      <span className="truncate flex-1 text-slate-700">{h.name}</span>
                      <span className="text-slate-500 mx-2">{h.ts}</span>
                      <span className="text-slate-500 mx-1">{h.dur}</span>
                      <span className={`font-bold px-1.5 rounded ${
                        h.state === 'success' ? 'text-emerald-700' :
                        h.state === 'failed' ? 'text-red-700' : 'text-cyan-700'
                      }`}>
                        {h.state === 'success' && '✓ ok'}
                        {h.state === 'failed' && '✗ failed'}
                        {h.state === 'running' && '▶ running'}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </>
          ) : (
            <div className="text-[11px] text-slate-400 text-center py-4">
              CronJob 미생성 (Step 5, 6 에서 동작)
            </div>
          )}
        </div>
      );
    }

    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📦 3 워크로드 라이브 시뮬레이션</h2>
            <span className="text-[10px] text-slate-400 font-mono">DaemonSet · Job · CronJob</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-3">
            <DaemonSetSection data={step.daemonset} isActive={step.focus === 'daemonset'} />
            <JobSection       data={step.job}       isActive={step.focus === 'job'} />
            <CronJobSection   data={step.cronjob}   isActive={step.focus === 'cronjob'} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-cyan-500"></span>실행/활성</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>성공</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-red-500"></span>실패</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-300"></span>대기/idle</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js (atom-one-dark)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code (innerHTML 추출) */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[36rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-cyan-500/15 border-l-2 border-cyan-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 — 라인 수 + 단계 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-cyan-700 hover:text-cyan-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-cyan-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 워크로드 &gt; Chapter 2. DaemonSet / Job / CronJob</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">DaemonSet &amp; Job &amp; CronJob</h1>
                  <p className="text-sm text-slate-500 mt-0.5">노드별 1개 상주 / 1회성 작업 / 스케줄 작업 — 3 워크로드 라이브 시뮬레이션</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-cyan-50 border-2 border-cyan-300 rounded-xl p-3 text-sm text-cyan-900">
                💡 Part II Workload 끝! 다음(III-1-1)부터는 <strong>Service 4 타입</strong> — Pod에 안정적인 진입점을 만든다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-cyan-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-cyan-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-cyan-600 text-white hover:bg-cyan-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-2-1.html" className="text-slate-500 hover:text-slate-700">&larr; II-2-1 StatefulSet</a>
              <a href="../part3/III-1-1.html" className="text-cyan-700 hover:text-cyan-900 font-medium">III-1-1 Service 4 타입 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
