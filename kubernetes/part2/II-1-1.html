  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-1-1. Deployment & ReplicaSet — replicas 관리 / 자동 복구 / scale
    학습 목표: Pod를 N개로 복제하고 항상 유지하며 1줄로 scale 하는 표준 패턴 이해
    핵심 비유: 공장 생산라인 — desired N개 자동 유지, 1개 결함 시 즉시 새것 투입
    패턴: fastapi v1 — 좌(LiveDataPane: SVG Pod 박스 + ReplicaSet/Deployment 그룹) / 우(VSCode CodeViewer)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — Pod 상태(running/dying/spawning) + desired/actual + 컨트롤러 표시
    //   pods 배열의 각 항목: { id, state }
    //     state: 'running' | 'dying' | 'spawning'
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 원본 HTML 의 code 블록을 그대로 옮긴 상수 (한 글자도 바꾸지 않았다)
    const CODE = {
      s1: {lang:'yaml', filename:'deployment.yaml', lines:[
        '# Deployment — 표준 진입점 (replicas 3 선언)',
        'apiVersion: apps/v1',
        'kind: Deployment',
        'metadata:',
        '  name: web',
        '  labels:',
        '    app: web',
        'spec:',
        '  replicas: 3              # ← 항상 3개 유지',
        '  selector:',
        '    matchLabels:',
        '      app: web             # ← 이 라벨의 Pod를 관리',
        '  template:',
        '    metadata:',
        '      labels:',
        '        app: web           # ← Pod에 붙는 라벨',
        '    spec:',
        '      containers:',
        '        - name: app',
        '          image: myapp:v1',
        '          ports:',
        '            - containerPort: 8080',
        '',
        '# 적용',
        '# kubectl apply -f deployment.yaml',
        '# → Deployment 생성 → ReplicaSet 자동 생성 → Pod 3개 생성',
      ]},
      s2: {lang:'shell', filename:'auto-heal.sh', lines:[
        '# 1. 정상 상태 확인',
        'kubectl get pods -l app=web',
        '# NAME              READY   STATUS    AGE',
        '# web-7d9-aa1       1/1     Running   10m',
        '# web-7d9-aa2       1/1     Running   10m',
        '# web-7d9-aa3       1/1     Running   10m',
        '',
        '# 2. Pod 1개 강제 삭제 (장애 시뮬레이션)',
        'kubectl delete pod web-7d9-aa2',
        '# pod "web-7d9-aa2" deleted',
        '',
        '# 3. 몇 초 후 다시 조회 — 새 Pod가 자동 생성됨',
        'kubectl get pods -l app=web',
        '# NAME              READY   STATUS              AGE',
        '# web-7d9-aa1       1/1     Running             10m',
        '# web-7d9-aa3       1/1     Running             10m',
        '# web-7d9-bb4       0/1     ContainerCreating   3s   ← 새 Pod',
        '',
        '# 핵심: Deployment에 손대지 않았는데 actual=3 복원됨',
        '# → ReplicaSet 컨트롤러가 desired vs actual 차이를 감지해 재생성',
      ]},
      s3: {lang:'shell', filename:'kubectl-scale.sh', lines:[
        '# 방법 A — kubectl scale 한 줄',
        'kubectl scale deployment/web --replicas=5',
        '# deployment.apps/web scaled',
        '',
        '# 방법 B — yaml 수정 후 apply (권장: GitOps 흐름)',
        '# spec:',
        '#   replicas: 5            ← 3에서 5로 변경',
        'kubectl apply -f deployment.yaml',
        '',
        '# 결과 확인',
        'kubectl get pods -l app=web',
        '# NAME              READY   STATUS              AGE',
        '# web-7d9-aa1       1/1     Running             20m',
        '# web-7d9-aa2       1/1     Running             20m',
        '# web-7d9-aa3       1/1     Running             20m',
        '# web-7d9-cc5       0/1     ContainerCreating   2s   ← 추가',
        '# web-7d9-cc6       0/1     ContainerCreating   2s   ← 추가',
        '',
        '# 축소도 동일: kubectl scale ... --replicas=2',
        '# → 초과분 3개의 Pod를 graceful shutdown',
      ]},
      s4: {lang:'yaml', filename:'replicaset-internal.yaml', lines:[
        '# Deployment가 자동으로 생성한 ReplicaSet (보통 직접 안 만짐)',
        'apiVersion: apps/v1',
        'kind: ReplicaSet',
        'metadata:',
        '  name: web-7d9f8c5b           # Deployment-hash',
        '  ownerReferences:',
        '    - kind: Deployment',
        '      name: web                # ← Deployment가 부모',
        'spec:',
        '  replicas: 5',
        '  selector:',
        '    matchLabels:',
        '      app: web                 # ← 이 라벨 매칭',
        '  template:',
        '    metadata:',
        '      labels:',
        '        app: web               # ← Pod에 동일 라벨 부여',
        '    spec:',
        '      containers:',
        '        - name: app',
        '          image: myapp:v1',
        '',

            { mark: 'read', text: 'replicas 유지 / 즉시 재생성' },
            { mark: 'read', text: 'Deployment가 자동 생성·관리' },
          ],
        },
        showDeployment: true,
        showReplicaSet: true,
        desired: 5,
        pods: [
          { id: 'web-7d9-aa1', state: 'running' },
          { id: 'web-7d9-aa2', state: 'running' },
          { id: 'web-7d9-aa3', state: 'running' },
          { id: 'web-7d9-cc5', state: 'running' },
          { id: 'web-7d9-dd7', state: 'running' },
        ],
        showAlert: false,

      },
      { ...S5,
        beat: {

          at: 'responsibility-map.sh L15–18',
          caption: '세 명령 모두 대상이 deployment다. 갯수를 바꿀 때도, 버전을 되돌릴 때도 입구는 Deployment 하나뿐이다.',
          changes: [

        },
        showDeployment: true,
        showReplicaSet: true,
        desired: 5,
        pods: [
          { id: 'web-7d9-aa1', state: 'running' },
          { id: 'web-7d9-aa2', state: 'running' },
          { id: 'web-7d9-aa3', state: 'running' },
          { id: 'web-7d9-cc5', state: 'running' },
          { id: 'web-7d9-dd7', state: 'running' },
        ],
        showAlert: false,
        code: { ...CODE.s5, highlight: [15, 16, 17, 18] },
      },
      { ...S5,
        beat: {
          label: 'ReplicaSet은 조회만',
          at: 'responsibility-map.sh L20–21',
          caption: 'get rs로 상태를 들여다볼 뿐, 직접 수정하지 않는다. 손대면 Deployment가 다시 덮어쓴다.',
          changes: [
            { mark: 'read', text: 'kubectl get rs (읽기 전용)' },
            { mark: 'gone', text: 'ReplicaSet 직접 수정은 무의미' },
          ],
        },
        showDeployment: true,
        showReplicaSet: true,
        desired: 5,
        pods: [
          { id: 'web-7d9-aa1', state: 'running' },
          { id: 'web-7d9-aa2', state: 'running' },
          { id: 'web-7d9-aa3', state: 'running' },
          { id: 'web-7d9-cc5', state: 'running' },
          { id: 'web-7d9-dd7', state: 'running' },
        ],
        showAlert: false,
        code: { ...CODE.s5, highlight: [20, 21] },
      },
      { ...S5,
        beat: {
          label: '다음 — 갯수는 그대로, 버전만 교체',
          at: 'responsibility-map.sh L23–24',
          caption: 'II-1-2에서는 replicas 5를 유지한 채 image를 v1에서 v2로 바꾼다. Deployment가 새 ReplicaSet을 띄우고 옛 것을 0으로 줄이는 방식이다.',
          changes: [
            { mark: 'new',  text: '책임 분리 정리 완료' },
            { mark: 'read', text: '다음: 새 RS 등장 / 옛 RS 0으로' },
          ],
        },
        showDeployment: true,
        showReplicaSet: true,
        desired: 5,
        pods: [
          { id: 'web-7d9-aa1', state: 'running' },
          { id: 'web-7d9-aa2', state: 'running' },
          { id: 'web-7d9-aa3', state: 'running' },
          { id: 'web-7d9-cc5', state: 'running' },
          { id: 'web-7d9-dd7', state: 'running' },

        showAlert: true,
        code: { ...CODE.s5, highlight: [23, 24] },

    // ─────────────────────────────────────────────────────
    // Pod 상태별 스타일 (정적 Tailwind 클래스 — purge 안전)
    // ─────────────────────────────────────────────────────
    const POD_STYLE = {
      running:  { fill: '#cffafe', stroke: '#06b6d4', text: '#0e7490', label: 'Running'  },
      dying:    { fill: '#fee2e2', stroke: '#ef4444', text: '#991b1b', label: 'Terminating' },
      spawning: { fill: '#fef3c7', stroke: '#f59e0b', text: '#92400e', label: 'Creating' },
    };

    // ─────────────────────────────────────────────────────
    // LiveDataPane — Pod 박스 SVG (Deployment / ReplicaSet 그룹화)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, pods, desired, showDeployment, showReplicaSet, showAlert }) {
      const actual = pods.filter((p) => p.state === 'running').length;
      const matchOk = actual === desired;

      // SVG 좌표 계산 — 한 행에 최대 5개, 박스 크기 고정
      const POD_W = 88;
      const POD_H = 64;
      const POD_GAP = 12;
      const PER_ROW = 5;
      const rowCount = Math.ceil(pods.length / PER_ROW);
      const innerW = PER_ROW * POD_W + (PER_ROW - 1) * POD_GAP;
      const podsAreaH = rowCount * POD_H + (rowCount - 1) * POD_GAP;

      // 그룹 박스 패딩
      const RS_PAD_X = 16, RS_PAD_TOP = 30, RS_PAD_BOTTOM = 16;
      const DEP_PAD_X = 14, DEP_PAD_TOP = 28, DEP_PAD_BOTTOM = 14;

      const rsW = innerW + RS_PAD_X * 2;
      const rsH = podsAreaH + RS_PAD_TOP + RS_PAD_BOTTOM;
      const depW = rsW + DEP_PAD_X * 2;
      const depH = rsH + DEP_PAD_TOP + DEP_PAD_BOTTOM;

      const SVG_PAD = 14;
      const svgW = depW + SVG_PAD * 2;
      const svgH = depH + SVG_PAD * 2;

      const depX = SVG_PAD;
      const depY = SVG_PAD;
      const rsX = depX + DEP_PAD_X;
      const rsY = depY + DEP_PAD_TOP;
      const podsX = rsX + RS_PAD_X;
      const podsY = rsY + RS_PAD_TOP;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {/* 상단 타이틀 + desired/actual 카운터 */}
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🏭 공장 생산라인 — Pod 자동 유지</h2>
            <div className="flex gap-1.5 text-[10px] font-mono">
              <span className="px-1.5 py-0.5 rounded bg-cyan-100 text-cyan-700 font-bold">
                desired {desired}
              </span>
              <span className={`px-1.5 py-0.5 rounded font-bold ${
                matchOk ? 'bg-emerald-100 text-emerald-700' : 'bg-yellow-100 text-yellow-700'
              }`}>
                actual {actual}
              </span>
            </div>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* SVG — Deployment 박스 → ReplicaSet 박스 → Pod 박스들 */}
          <div className="bg-slate-50 rounded-lg border border-slate-200 p-2 overflow-x-auto">
            <svg
              viewBox={`0 0 ${svgW} ${svgH}`}
              width="100%"
              style={{ minWidth: svgW }}
              role="img"
              aria-label="Deployment 안에 ReplicaSet, 그 안에 Pod 박스들"
            >
              {/* Deployment 박스 (sky-500 외곽) */}
              {showDeployment && (
                <g>
                  <rect
                    x={depX} y={depY} width={depW} height={depH}
                    rx="10" ry="10"
                    fill="#f0f9ff"
                    stroke="#0284c7"
                    strokeWidth="2"
                    strokeDasharray="6 3"
                  />
                  <rect
                    x={depX + 8} y={depY - 1}
                    width="118" height="20"
                    rx="4" ry="4"
                    fill="#0284c7"
                  />
                  <text
                    x={depX + 14} y={depY + 13}
                    fontSize="11" fontWeight="bold" fill="white"
                    fontFamily="ui-monospace, monospace"
                  >
                    Deployment / web
                  </text>
                </g>
              )}

              {/* ReplicaSet 박스 (cyan-600 외곽) */}
              {showReplicaSet && (
                <g>
                  <rect
                    x={rsX} y={rsY} width={rsW} height={rsH}
                    rx="8" ry="8"
                    fill="#ecfeff"
                    stroke="#0891b2"
                    strokeWidth="2"
                  />
                  <rect
                    x={rsX + 8} y={rsY - 1}
                    width="170" height="20"
                    rx="4" ry="4"
                    fill="#0891b2"
                  />
                  <text
                    x={rsX + 14} y={rsY + 13}
                    fontSize="11" fontWeight="bold" fill="white"
                    fontFamily="ui-monospace, monospace"
                  >
                    ReplicaSet · selector app=web
                  </text>
                </g>
              )}

              {/* Pod 박스들 */}
              {pods.map((pod, i) => {
                const row = Math.floor(i / PER_ROW);
                const col = i % PER_ROW;
                const x = podsX + col * (POD_W + POD_GAP);
                const y = podsY + row * (POD_H + POD_GAP);
                const s = POD_STYLE[pod.state];
                const isFading = pod.state === 'dying';
                const isSpawning = pod.state === 'spawning';
                return (
                  <g
                    key={pod.id}
                    style={{
                      transition: 'opacity 0.6s, transform 0.6s',
                      transformOrigin: `${x + POD_W / 2}px ${y + POD_H / 2}px`,
                      opacity: isFading ? 0.45 : 1,
                    }}
                  >
                    <rect
                      x={x} y={y} width={POD_W} height={POD_H}
                      rx="6" ry="6"
                      fill={s.fill}
                      stroke={s.stroke}
                      strokeWidth="2"
                      strokeDasharray={isSpawning ? '4 2' : 'none'}
                    >
                      {isSpawning && (
                        <animate
                          attributeName="opacity"
                          values="0.4;1;0.4"
                          dur="1.4s"
                          repeatCount="indefinite"
                        />
                      )}
                    </rect>
                    <text
                      x={x + POD_W / 2} y={y + 22}
                      fontSize="14"
                      textAnchor="middle"
                    >
                      📦
                    </text>
                    <text
                      x={x + POD_W / 2} y={y + 40}
                      fontSize="10" fontWeight="bold" fill={s.text}
                      textAnchor="middle"
                      fontFamily="ui-monospace, monospace"
                    >
                      Pod {i + 1}
                    </text>
                    <text
                      x={x + POD_W / 2} y={y + 54}
                      fontSize="9" fill={s.text}
                      textAnchor="middle"
                      fontFamily="ui-monospace, monospace"
                    >
                      {s.label}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-3 h-3 rounded border-2" style={{ background: '#cffafe', borderColor: '#06b6d4' }}></span>
              Running
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-3 rounded border-2" style={{ background: '#fef3c7', borderColor: '#f59e0b' }}></span>
              Creating (자동 생성 중)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-3 rounded border-2" style={{ background: '#fee2e2', borderColor: '#ef4444' }}></span>
              Terminating
            </span>
            <span className="ml-auto flex items-center gap-1 font-mono">
              <span className="w-3 h-0.5 bg-sky-600"></span>Deployment
              <span className="w-3 h-0.5 bg-cyan-600 ml-2"></span>ReplicaSet
            </span>
          </div>

          {/* 마지막 단계 알람 박스 */}
          {showAlert && (
            <div className="mt-4 p-3 rounded-lg bg-cyan-50 border-2 border-cyan-400">
              <div className="flex items-center gap-2 text-cyan-800 font-bold text-sm">
                <span className="text-lg">✅</span>
                <span>책임 분리 완성 — Deployment(버전) / ReplicaSet(갯수)</span>
              </div>
              <div className="text-[11px] text-cyan-700 mt-1">
                사용자는 Deployment만 다룬다. ReplicaSet은 자동으로 살아 움직인다.
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-cyan-500/15 border-l-2 border-cyan-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-cyan-700 hover:text-cyan-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-cyan-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 워크로드 &gt; Chapter 1. Deployment 패턴</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Deployment &amp; ReplicaSet</h1>
                  <p className="text-sm text-slate-500 mt-0.5">공장 생산라인 — replicas N개 자동 유지 / 1개 죽으면 즉시 복구 / 1줄 scale</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat}
                pods={step.pods}
                desired={step.desired}
                showDeployment={step.showDeployment}
                showReplicaSet={step.showReplicaSet}
                showAlert={step.showAlert}
              />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 안내 */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-cyan-50 border-2 border-cyan-300 rounded-xl p-3 text-sm text-cyan-900">
                💡 다음(II-1-2)에서는 replicas는 그대로 두고 <strong>image v1 → v2 무중단 교체</strong> — 롤링 업데이트 / Recreate 전략
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-cyan-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-cyan-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-cyan-600 text-white hover:bg-cyan-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./II-1-2.html" className="text-cyan-700 hover:text-cyan-900 font-medium">II-1-2 롤링 업데이트 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
