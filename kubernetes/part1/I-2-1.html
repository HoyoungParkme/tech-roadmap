  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-2-1. Cluster, Node, Control Plane
    학습 목표: Kubernetes 클러스터의 토폴로지(Master + Worker N개)와 Control Plane 4 컴포넌트(apiserver/etcd/scheduler/controller-manager) + Worker 3 컴포넌트(kubelet/proxy/runtime)를 단계별로 시각화한다. Pod 배치 흐름과 etcd의 단일 진실 원천 역할까지 추적한다.
    핵심 비유: 시청(Master) + 공장(Worker) — 시청 안에 4개 부서, 공장 안에 작업반장 3개 역할
    패턴: fastapi v1 — 좌(LiveDataPane: SVG 클러스터 토폴로지) / 우(VSCode CodeViewer)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // Control Plane / Worker 컴포넌트 메타
    // ─────────────────────────────────────────────────────
    const CP_COMPONENTS = [
      { key: 'apiserver',  name: 'kube-apiserver',          short: 'API Server',  role: '모든 명령의 출입문 / REST API' },
      { key: 'etcd',       name: 'etcd',                    short: 'etcd',        role: '클러스터 상태 키-값 DB (Raft)' },
      { key: 'scheduler',  name: 'kube-scheduler',          short: 'Scheduler',   role: 'Pod를 어느 Worker에 둘지 결정' },
      { key: 'controller', name: 'kube-controller-manager', short: 'Controller',  role: '원하는 상태 vs 현재 상태 차이 좁힘' },
    ];

    const WORKER_COMPONENTS = [
      { key: 'kubelet', name: 'kubelet',          role: 'API Server와 통신, Pod 생성/감시' },
      { key: 'proxy',   name: 'kube-proxy',       role: 'Service IP → Pod IP 라우팅' },
      { key: 'runtime', name: 'container runtime', role: 'containerd / CRI-O — 실제 컨테이너 실행' },
    ];

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — 컴포넌트 표시 / 활성화 / 화살표
    // ─────────────────────────────────────────────────────
    //   showCp[key]:     해당 컴포넌트가 화면에 등장했는지
    //   activeCp[key]:   현재 step에서 cyan glow로 강조되는지
    //   showWorkers:     Worker 노드 3개를 그렸는지
    //   activeWorker:    glow 줄 worker 인덱스 (0~2, null이면 없음)
    //   showWorkerComps: Worker 내부 3 컴포넌트를 보여주는지
    //   pods:            Worker별 Pod 개수 (배치 시뮬레이션)
    //   flow:            그릴 화살표 배열
    //   etcdHighlight:   etcd 박스에 "Single Source of Truth" 라벨
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      getNodes: {lang:"bash", filename:"kubectl-get-nodes.sh", lines:[
        "# 클러스터에 어떤 노드가 있는지 확인",
        "$ kubectl get nodes",
        "",
        "NAME       STATUS   ROLES           AGE   VERSION",
        "master-1   Ready    control-plane   30d   v1.29.0",
        "worker-1   Ready    <none>          30d   v1.29.0",
        "worker-2   Ready    <none>          30d   v1.29.0",
        "worker-3   Ready    <none>          30d   v1.29.0",
        "",
        "# Master 1개 + Worker 3개 = 한 클러스터",
        "#   - Master: 통제(스케줄링/상태 관리)",
        "#   - Worker: 실행(실제 컨테이너 구동)",
        "",
        "# 노드의 정체는 결국 리눅스 머신",
        "$ ssh master-1 \"uname -a\"",
        "Linux master-1 5.15.0-92-generic #102-Ubuntu SMP x86_64",
        "",
        "# 노드는 VM일 수도, 베어메탈일 수도, EC2 인스턴스일 수도 있다.",
        "# Kubernetes는 그 위에서 컨테이너 오케스트레이션 레이어를 얹는다.",
      ]},
      clusterInfo: {lang:"yaml", filename:"cluster-info.yaml", lines:[
        "# Master(Control Plane) 4 컴포넌트",
        "",
        "controlPlane:",
        "  - name: kube-apiserver",
        "    role: \"모든 kubectl 명령의 출입문\"",
        "    detail: |",
        "      - REST API 제공 (HTTPS :6443)",
        "      - 인증/인가/Admission Webhook",

    // ─────────────────────────────────────────────────────
    // SVG ClusterDiagram — 토폴로지 시각화
    // ─────────────────────────────────────────────────────
    function ClusterDiagram({ beat, step }) {
      const { showCp, activeCp, showWorkers, activeWorker, showWorkerComps, pods, flow, etcdHighlight } = step;

      // 좌표 정리
      // viewBox 600 x 460
      // Cluster outer: (10, 10) ~ (590, 450)
      // Master: (60, 40) ~ (540, 180)
      // Worker boxes: y=240, w=160 each, gaps
      const masterBox = { x: 60, y: 40, w: 480, h: 140 };
      const cpPositions = {
        apiserver:  { x: 100,  y: 80, w: 180, h: 36, label: 'kube-apiserver' },
        etcd:       { x: 320,  y: 80, w: 180, h: 36, label: 'etcd' },
        scheduler:  { x: 100,  y: 130, w: 180, h: 36, label: 'kube-scheduler' },
        controller: { x: 320,  y: 130, w: 180, h: 36, label: 'kube-controller-manager' },
      };
      const workerBoxes = [
        { x: 30,  y: 240, w: 170, h: 180, label: 'worker-1' },
        { x: 215, y: 240, w: 170, h: 180, label: 'worker-2' },
        { x: 400, y: 240, w: 170, h: 180, label: 'worker-3' },
      ];

      // 화살표 시작/끝점 lookup
      const anchorOf = (key) => {
        if (key === 'kubectl')    return { x: 30,  y: 30 };
        if (key === 'apiserver')  return { x: cpPositions.apiserver.x + 90,  y: cpPositions.apiserver.y + 18 };
        if (key === 'etcd')       return { x: cpPositions.etcd.x + 90,       y: cpPositions.etcd.y + 18 };
        if (key === 'scheduler')  return { x: cpPositions.scheduler.x + 90,  y: cpPositions.scheduler.y + 18 };
        if (key === 'controller') return { x: cpPositions.controller.x + 90, y: cpPositions.controller.y + 18 };
        if (key === 'worker0')    return { x: workerBoxes[0].x + 85, y: workerBoxes[0].y + 20 };
        if (key === 'worker1')    return { x: workerBoxes[1].x + 85, y: workerBoxes[1].y + 20 };
        if (key === 'worker2')    return { x: workerBoxes[2].x + 85, y: workerBoxes[2].y + 20 };
        if (key === 'pod1')       return { x: workerBoxes[1].x + 85, y: workerBoxes[1].y + 130 };
        return { x: 300, y: 230 };
      };

      const cyan = '#22d3ee';
      const cyanDim = '#0e7490';
      const slate = '#475569';
      const slateLight = '#cbd5e1';

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🏙️ Cluster 토폴로지</h2>
            <span className="text-[10px] text-slate-400 font-mono">SVG · live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <svg viewBox="0 0 600 460" className="w-full" style={{ background: '#f8fafc', borderRadius: 8 }}>
            <defs>
              <marker id="arr-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill={cyan} />
              </marker>
              <marker id="arr-slate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill={slate} />
              </marker>
            </defs>

            {/* Cluster 외곽 */}
            <rect x="10" y="10" width="580" height="440" rx="14" ry="14"
                  fill="none" stroke={slateLight} strokeWidth="2" strokeDasharray="6 4" />
            <text x="22" y="28" fontSize="11" fill={slate} fontFamily="monospace" fontWeight="bold">
              Kubernetes Cluster
            </text>

            {/* Master 박스 */}
            <rect x={masterBox.x} y={masterBox.y} width={masterBox.w} height={masterBox.h}
                  rx="10" ry="10"
                  fill="#ecfeff" stroke={cyanDim} strokeWidth="2" />
            <text x={masterBox.x + 12} y={masterBox.y + 18} fontSize="11" fill={cyanDim} fontFamily="monospace" fontWeight="bold">
              🏛️ Master Node (Control Plane)
            </text>

            {/* CP 4 컴포넌트 */}
            {CP_COMPONENTS.map((c) => {
              if (!showCp[c.key]) return null;
              const p = cpPositions[c.key];
              const isActive = activeCp[c.key];
              const isEtcdHL = c.key === 'etcd' && etcdHighlight;
              return (
                <g key={c.key} className={isActive ? 'cyan-glow' : ''}>
                  <rect x={p.x} y={p.y} width={p.w} height={p.h} rx="6" ry="6"
                        fill={isActive ? '#cffafe' : '#ffffff'}
                        stroke={isActive ? cyan : cyanDim}
                        strokeWidth={isActive ? '2.5' : '1.5'} />
                  <text x={p.x + p.w / 2} y={p.y + 16} fontSize="11" fontFamily="monospace"
                        fill={isActive ? '#0e7490' : '#334155'} fontWeight="bold" textAnchor="middle">
                    {c.short}
                  </text>
                  <text x={p.x + p.w / 2} y={p.y + 30} fontSize="9" fontFamily="monospace"
                        fill="#64748b" textAnchor="middle">
                    {c.key === 'apiserver'  && 'REST :6443'}
                    {c.key === 'etcd'       && (isEtcdHL ? '★ Single Source of Truth' : 'kv DB / Raft')}
                    {c.key === 'scheduler'  && 'Pod 배치 결정'}
                    {c.key === 'controller' && 'reconcile loop'}
                  </text>
                </g>
              );
            })}

            {/* Worker 박스 + 컴포넌트 */}
            {showWorkers && workerBoxes.map((w, idx) => {
              const isActive = activeWorker === idx;
              return (
                <g key={idx} className={isActive ? 'cyan-glow' : ''}>
                  <rect x={w.x} y={w.y} width={w.w} height={w.h} rx="10" ry="10"
                        fill={isActive ? '#cffafe' : '#fef3c7'}
                        stroke={isActive ? cyan : '#d97706'}
                        strokeWidth={isActive ? '2.5' : '1.5'} />
                  <text x={w.x + 10} y={w.y + 16} fontSize="11" fill="#92400e" fontFamily="monospace" fontWeight="bold">
                    🏭 {w.label}
                  </text>

                  {showWorkerComps && WORKER_COMPONENTS.map((wc, ci) => {
                    const cy = w.y + 36 + ci * 22;
                    return (
                      <g key={wc.key}>
                        <rect x={w.x + 10} y={cy} width={w.w - 20} height={18} rx="4" ry="4"
                              fill="#ffffff" stroke="#a3a3a3" strokeWidth="1" />
                        <text x={w.x + 16} y={cy + 13} fontSize="9.5" fontFamily="monospace" fill="#334155">
                          {wc.name}
                        </text>
                      </g>
                    );
                  })}

                  {/* Pod 시각화 — 작은 원 */}
                  {Array.from({ length: pods[idx] || 0 }).map((_, pi) => (
                    <g key={`pod-${idx}-${pi}`}>
                      <circle cx={w.x + 30 + pi * 28} cy={w.y + 130} r="9"
                              fill="#22d3ee" stroke="#0e7490" strokeWidth="1.5" className="cyan-glow" />
                      <text x={w.x + 30 + pi * 28} y={w.y + 134} fontSize="8" textAnchor="middle"
                            fill="#0c4a6e" fontFamily="monospace" fontWeight="bold">
                        Pod
                      </text>
                    </g>
                  ))}

                  {showWorkerComps && (
                    <text x={w.x + w.w / 2} y={w.y + w.h - 8} fontSize="8" textAnchor="middle"
                          fill="#92400e" fontFamily="monospace">
                      Pods: {pods[idx] || 0}
                    </text>
                  )}
                </g>
              );
            })}

            {/* 흐름 화살표 */}
            {flow.map((f, i) => {
              const from = anchorOf(f.from);
              const to   = anchorOf(f.to);
              const midX = (from.x + to.x) / 2;
              const midY = (from.y + to.y) / 2;
              return (
                <g key={i}>
                  <line x1={from.x} y1={from.y} x2={to.x} y2={to.y}
                        stroke={cyan} strokeWidth="2"
                        markerEnd="url(#arr-cyan)"
                        className="flow-arrow" />
                  <rect x={midX - 38} y={midY - 9} width="76" height="14" rx="3" ry="3"
                        fill="#0e7490" opacity="0.92" />
                  <text x={midX} y={midY + 1} fontSize="9" fill="#ffffff" fontFamily="monospace"
                        textAnchor="middle" dominantBaseline="middle">
                    {f.label}
                  </text>
                </g>
              );
            })}

            {/* User 입구 (Step 4 흐름이 있을 때) */}
            {flow.some(f => f.from === 'kubectl') && (
              <g>
                <text x="20" y="36" fontSize="11" fontFamily="monospace" fill="#0e7490" fontWeight="bold">
                  💻 kubectl
                </text>
              </g>
            )}
          </svg>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-3 h-3 rounded bg-cyan-100 border border-cyan-500"></span>Master(Control Plane)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-3 rounded bg-amber-100 border border-amber-500"></span>Worker Node
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-3 rounded-full bg-cyan-400"></span>Pod
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5 bg-cyan-400"></span>활성 흐름
            </span>
          </div>

          {/* 하단 카운트 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-3 font-mono">
            <span className="px-2 py-0.5 rounded bg-cyan-100 text-cyan-800 font-bold">
              CP {Object.values(showCp).filter(Boolean).length} / 4
            </span>
            <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-bold">
              Workers {showWorkers ? 3 : 0}
            </span>
            <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-bold">
              Pods {pods.reduce((a, b) => a + b, 0)}
            </span>
            {etcdHighlight && (
              <span className="px-2 py-0.5 rounded bg-cyan-700 text-white font-bold">
                ★ etcd = Single Source of Truth
              </span>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-cyan-500/15 border-l-2 border-cyan-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}

              <a href="../index.html" className="text-cyan-700 hover:text-cyan-900 font-medium">&larr; 허브로</a>

            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-cyan-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Kubernetes 기초 &gt; Chapter 2. 클러스터 구성</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Cluster, Node, Control Plane</h1>
                  <p className="text-sm text-slate-500 mt-0.5">시청(Master) + 공장(Worker) — Control Plane 4 컴포넌트와 Pod 배치 흐름</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <ClusterDiagram beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컴포넌트 한눈에 정리 카드 */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-white rounded-xl border border-cyan-200 p-4 shadow-sm">
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-lg">🏛️</span>
                  <h3 className="text-sm font-bold text-cyan-800">Control Plane (Master) 4 컴포넌트</h3>
                </div>
                <ul className="space-y-2">
                  {CP_COMPONENTS.map((c) => (
                    <li key={c.key} className="flex flex-col text-xs">
                      <span className="font-mono font-bold text-slate-800">{c.name}</span>
                      <span className="text-slate-500 leading-snug">{c.role}</span>
                    </li>
                  ))}
                </ul>
              </div>
              <div className="bg-white rounded-xl border border-amber-200 p-4 shadow-sm">
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-lg">🏭</span>
                  <h3 className="text-sm font-bold text-amber-800">Worker Node 3 컴포넌트</h3>
                </div>
                <ul className="space-y-2">
                  {WORKER_COMPONENTS.map((wc) => (
                    <li key={wc.key} className="flex flex-col text-xs">
                      <span className="font-mono font-bold text-slate-800">{wc.name}</span>
                      <span className="text-slate-500 leading-snug">{wc.role}</span>
                    </li>
                  ))}
                </ul>
                <div className="mt-3 pt-3 border-t border-slate-100 text-[10px] text-slate-500 leading-snug">
                  통신: <span className="font-mono">kubelet → CRI(gRPC) → containerd → runc → 컨테이너</span>
                </div>
              </div>
            </div>

            {/* 핵심 비유 정리 */}
            <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
              <h3 className="text-sm font-bold text-slate-700 mb-2">🧠 핵심 비유 — "도시"</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-slate-600">
                <div>
                  <p className="leading-relaxed">
                    Master = 시청. 안에는 4개 부서가 있다 — 민원실(apiserver) / 기록 보관소(etcd) /
                    배치 부서(scheduler) / 감독실(controller-manager). 시청은 절대 직접 일을 하지 않고
                    공장에 명령만 내린다.
                  </p>
                </div>
                <div>
                  <p className="leading-relaxed">
                    Worker = 공장. 작업반장(kubelet)이 시청 명령을 받아 작업자(container runtime)를 부린다.
                    물류(kube-proxy)는 공장 사이/내부 라우팅을 담당한다. 공장은 시청 없이는 새 일을 시작할 수
                    없지만, 시청이 잠깐 죽어도 이미 돌아가던 작업은 계속된다.
                  </p>
                </div>
              </div>
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-cyan-50 border-2 border-cyan-300 rounded-xl p-3 text-sm text-cyan-900">
                💡 다음(I-2-2)에서는 <strong>YAML 매니페스트 + kubectl apply</strong> — 사용자가 "원하는 상태"를 선언하는 방법과 idempotent 동작을 본다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-cyan-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-cyan-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-cyan-600 text-white hover:bg-cyan-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./I-2-2.html" className="text-cyan-700 hover:text-cyan-900 font-medium">I-2-2 YAML 매니페스트 &amp; kubectl apply &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
