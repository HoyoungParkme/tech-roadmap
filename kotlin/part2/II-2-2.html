<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotlin 학습 — II-2-2. sealed class — 닫힌 계층 + when</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    Kotlin II-2-2 — sealed class (닫힌 계층 + when)
    하위 타입이 같은 모듈에 한정 → 컴파일러가 전부 안다 → when 완전성 검사
    5단계: 닫힌 계층 → 상태별 데이터(enum보다 유연) → when 완전성+스마트캐스트 → 하위 타입 추가 시 누락 감지 → 실무 함정과 기본값
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    const STEPS = [
      {
        title: 'Step 1. sealed class — 하위 타입을 봉인한 닫힌 계층',
        desc: 'sealed class 는 "이 타입의 자식은 여기 있는 게 전부다" 라고 봉인하는 선언이다. 하위 타입은 같은 모듈(과거엔 같은 파일)에만 정의할 수 있어, 컴파일러가 자식 목록을 완전히 안다. 일반 abstract class 는 어디서든 상속할 수 있어 컴파일러가 전체를 모른다 — 그래서 when 을 완전하게 검사하지 못한다. sealed 는 "확장은 닫고, 대신 안전을 얻는" 트레이드오프다.',
        rootName: 'sealed class UiState',
        subtypes: [
          { name: 'Loading', kind: 'object', active: false },
          { name: 'Success', kind: 'data class', active: false },
          { name: 'Error', kind: 'data class', active: false },
        ],
        value: null,
        branches: [],
        exhaustive: { ok: true, text: '컴파일러가 하위 타입 3개를 전부 안다 (봉인 완료)' },
        alert: { tone: 'info', text: 'sealed = 자식 목록을 컴파일러가 아는 닫힌 계층. abstract 는 열려 있어 이 보장이 없다.' },
        code: {
          lang: 'kotlin',
          filename: 'UiState.kt',
          lines: [
            '// 화면 상태를 한 타입으로 봉인한다',
            'sealed class UiState {',
            '    object Loading : UiState()               // 데이터 없는 상태',
            '    data class Success(val user: User) : UiState()',
            '    data class Error(val message: String) : UiState()',
            '}',
            '',
            'data class User(val id: Long, val name: String)',
            '',
            '// 하위 타입은 같은 파일/모듈에만 둘 수 있다',
            '// → 컴파일러가 "자식은 이 셋뿐" 이라고 확신한다',
            '',
            '// 비교: abstract class 는 외부에서도 상속 가능 →',
            '//       컴파일러가 전체 목록을 알 수 없다',
          ],
          highlight: [1, 2, 3, 4, 5, 6],
        },
      },
      {
        title: 'Step 2. enum 보다 유연 — 갈래마다 다른 데이터를 담는다',
        desc: 'enum 은 "정해진 상수 목록" 이라 각 값이 똑같은 모양이다. 하지만 실제 상태는 갈래마다 담을 데이터가 다르다: 성공은 결과 객체, 실패는 에러 메시지, 로딩은 아무것도 없다. sealed class 는 자식마다 다른 프로퍼티를 가질 수 있어 이 차이를 타입으로 표현한다. object Loading 은 상태가 하나뿐이라 싱글턴, data class 는 값을 담으므로 인스턴스마다 다르다.',
        rootName: 'sealed class UiState',
        subtypes: [
          { name: 'Loading', kind: 'object', active: false, payload: '(없음)' },
          { name: 'Success', kind: 'data class', active: false, payload: 'user: User' },
          { name: 'Error', kind: 'data class', active: false, payload: 'message: String' },
        ],
        value: null,
        branches: [],
        exhaustive: { ok: true, text: 'enum 이라면 데이터를 못 담아 별도 필드를 덧대야 한다' },
        alert: { tone: 'good', text: '갈래마다 다른 데이터가 필요하면 enum 이 아니라 sealed class 다.' },
        code: {
          lang: 'kotlin',
          filename: 'why-not-enum.kt',
          lines: [
            '// enum 은 갈래마다 데이터를 못 담는다 (모양이 같음)',
            'enum class Status { LOADING, SUCCESS, ERROR }',
            '// → user 와 message 를 어디에 담지?',
            '//    억지로 nullable 필드를 덧대게 된다',
            '',
            '// sealed class 는 갈래마다 다른 데이터를 가진다',
            'sealed class UiState {',
            '    object Loading : UiState()                     // 값 없음 → object',
            '    data class Success(val user: User) : UiState() // 결과를 담는다',
            '    data class Error(val message: String) : UiState()',
            '}',
            '',
            '// object = 상태가 하나뿐 → 싱글턴 하나면 충분',
            '// data class = 인스턴스마다 다른 값 → equals/copy 무료',
          ],
          highlight: [1, 2, 3, 4, 6, 7, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 3. when 완전성 검사 + 스마트 캐스트 — else 가 필요 없다',
        desc: 'sealed 타입을 when 식(값으로 쓰는 when)에 넣으면 컴파일러가 "모든 하위 타입을 처리했는가" 를 검사한다. 셋을 다 다루면 else 가지가 필요 없다. 각 is 가지 안에서는 스마트 캐스트가 걸려 state 가 자동으로 Success 로 좁혀져 state.user 에 바로 접근한다. 캐스팅 코드도, 놓친 상태도 없다 — 상태 처리가 타입으로 강제된다.',
        rootName: 'sealed class UiState',
        subtypes: [
          { name: 'Loading', kind: 'object', active: false, payload: '(없음)' },
          { name: 'Success', kind: 'data class', active: true, payload: 'user = User(1, "Park")' },
          { name: 'Error', kind: 'data class', active: false, payload: 'message: String' },
        ],
        value: 'Success(user = User(1, "Park"))',
        branches: [
          { pattern: 'is Loading', action: 'showSpinner()', active: false },
          { pattern: 'is Success', action: 'render(state.user)  // 스마트 캐스트', active: true },
          { pattern: 'is Error', action: 'showToast(state.message)', active: false },
        ],
        exhaustive: { ok: true, text: '3/3 처리됨 → else 불필요, 완전성 만족' },
        alert: { tone: 'good', text: 'when 식은 모든 하위 타입을 강제한다. is 가지 안에서는 스마트 캐스트가 자동으로 걸린다.' },
        code: {
          lang: 'kotlin',
          filename: 'render.kt',
          lines: [
            '// when 을 "식" 으로 쓰면 완전성 검사가 켜진다',
            'fun render(state: UiState): String = when (state) {',
            '    is UiState.Loading -> "로딩 중..."',
            '    is UiState.Success -> "환영합니다, ${state.user.name}"',
            '    //                     스마트 캐스트: state 가 Success 로 좁혀짐',
            '    is UiState.Error   -> "오류: ${state.message}"',
            '    // else 가지가 없다 — 셋을 다 다뤘으므로 필요 없다',
            '}',
            '',
            'render(UiState.Success(User(1, "Park")))',
            '// => 환영합니다, Park',
            'render(UiState.Loading)',
            '// => 로딩 중...',
          ],
          highlight: [1, 2, 3, 4, 5, 6, 7, 8],
        },
      },
      {
        title: 'Step 4. 하위 타입 추가 → when 누락을 컴파일 에러로 잡는다',
        desc: '이게 sealed class 의 진짜 값어치다. 새 상태 Empty 를 계층에 추가하면, 그 상태를 처리하지 않은 모든 when 식이 즉시 컴파일 에러가 난다. "빈 결과 처리를 어디서 빠뜨렸지?" 를 사람이 찾을 필요가 없다 — 컴파일러가 놓친 지점을 전부 지목한다. 요구사항이 늘어날수록 안전망이 커지는 구조다. 이것이 enum + else 조합으로는 얻을 수 없는 보장이다.',
        rootName: 'sealed class UiState',
        subtypes: [
          { name: 'Loading', kind: 'object', active: false, payload: '(없음)' },
          { name: 'Success', kind: 'data class', active: false, payload: 'user: User' },
          { name: 'Error', kind: 'data class', active: false, payload: 'message: String' },
          { name: 'Empty', kind: 'object', active: true, payload: '새로 추가됨', added: true },
        ],
        value: null,
        branches: [
          { pattern: 'is Loading', action: 'showSpinner()', active: false },
          { pattern: 'is Success', action: 'render(state.user)', active: false },
          { pattern: 'is Error', action: 'showToast(state.message)', active: false },
          { pattern: 'is Empty', action: '??? 처리 없음', active: true, missing: true },
        ],
        exhaustive: { ok: false, text: "컴파일 에러: 'when' expression must be exhaustive, add 'is Empty' branch" },
        alert: { tone: 'danger', text: '하위 타입을 추가하면 처리를 빠뜨린 when 이 전부 컴파일 에러로 드러난다 — 런타임이 아니라 빌드에서.' },
        code: {
          lang: 'kotlin',
          filename: 'add-subtype.kt',
          lines: [
            '// 새 상태를 계층에 추가한다',
            'sealed class UiState {',
            '    object Loading : UiState()',
            '    data class Success(val user: User) : UiState()',
            '    data class Error(val message: String) : UiState()',
            '    object Empty : UiState()          // ← 새로 추가',
            '}',
            '',
            'fun render(state: UiState): String = when (state) {',
            '    is UiState.Loading -> "로딩 중..."',
            '    is UiState.Success -> "환영합니다"',
            '    is UiState.Error   -> "오류"',
            '    // Empty 를 처리하지 않았다',
            '}',
            "// => 컴파일 에러: 'when' expression must be exhaustive,",
            "//    add 'is Empty' branch or 'else' branch",
            '// → 놓친 곳을 컴파일러가 전부 짚어 준다',
          ],
          highlight: [6, 9, 10, 11, 12, 13, 15, 16],
        },
      },
      {
        title: 'Step 5. 실무 함정과 기본값 — else 로 안전망을 끄지 마라',
        desc: 'when 에 else 를 붙이면 편해 보이지만, 그 순간 완전성 검사가 꺼진다. 이후 하위 타입을 추가해도 컴파일러가 침묵하고, 새 상태가 else 로 조용히 흘러 런타임 버그가 된다. 실무 기본값은 sealed 타입 when 에 else 를 쓰지 않는 것이다. 남은 갈래를 정말 묶고 싶다면 else 대신 명시적으로 처리하거나, when 을 식으로 두어 검사를 유지한다. UI 상태·Result·파싱 결과 모델링의 표준 패턴이다.',
        rootName: 'sealed class UiState',
        subtypes: [
          { name: 'Loading', kind: 'object', active: false, payload: '(없음)' },
          { name: 'Success', kind: 'data class', active: false, payload: 'user: User' },
          { name: 'Error', kind: 'data class', active: false, payload: 'message: String' },
        ],
        value: null,
        branches: [],
        exhaustive: { ok: true, text: 'else 없이 유지 → 미래의 하위 타입 추가가 안전망을 다시 켠다' },
        wins: [
          'sealed + when 식 → 상태 처리 누락을 빌드 타임에 차단',
          'else 금지 → 하위 타입 추가 시 컴파일러가 다시 경고',
          'data class 조합 → 갈래별 데이터 + equals/copy 무료',
          'UI 상태 · Result · 파싱 결과 모델링의 표준 패턴',
        ],
        alert: { tone: 'warn', text: 'sealed when 에 else 를 붙이면 완전성 검사가 꺼진다 — 미래의 버그를 스스로 심는 셈.' },
        code: {
          lang: 'kotlin',
          filename: 'best-practice.kt',
          lines: [
            '// ✗ 안티 패턴 — else 가 완전성 검사를 꺼 버린다',
            'fun renderBad(state: UiState) = when (state) {',
            '    is UiState.Success -> render(state.user)',
            '    else -> Unit          // 새 상태가 여기로 조용히 샌다',
            '}',
            '',
            '// ✓ 권장 — else 없이 모든 갈래를 명시',
            'fun render(state: UiState): String = when (state) {',
            '    is UiState.Loading -> "로딩"',
            '    is UiState.Success -> "성공: ${state.user.name}"',
            '    is UiState.Error   -> "실패: ${state.message}"',
            '}',
            '',
            '// 같은 패턴은 Result 모델링에도 그대로',
            'sealed interface ApiResult<out T> {',
            '    data class Ok<T>(val value: T) : ApiResult<T>',
            '    data class Fail(val code: Int) : ApiResult<Nothing>',
            '}',
            '// 체크리스트: ✓ when 은 식으로  ✓ else 금지  ✓ 갈래별 data class',
          ],
          highlight: [1, 2, 3, 4, 5, 7, 8, 9, 10, 11, 12, 19],
        },
      },
    ];

    function HierarchyPane({ state }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{ border: `2px solid ${BRAND}` }}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{ background: BRAND }}>
            <span>🧬</span>
            <span>봉인된 계층 — 컴파일러가 아는 하위 타입 전부</span>
          </div>
          <div className="p-3">
            <div className="text-center text-xs font-mono font-bold mb-2 px-2 py-1 rounded" style={{ background: '#3d2070', color: '#fff' }}>
              {state.rootName}
            </div>
            <div className="text-center text-[10px] mb-2" style={{ color: BRAND }}>│ 하위 타입 (같은 모듈에 봉인)</div>
            <div className="space-y-1.5">
              {state.subtypes.map((s, i) => (
                <div key={i} className="flex items-center gap-2 text-xs rounded px-2 py-1"
                  style={{
                    background: s.added ? '#ede9fe' : '#f3eeff',
                    border: s.active ? `2px solid ${BRAND}` : '1px solid #d4c2ff',
                    boxShadow: s.active ? '0 0 0 3px rgba(127,82,255,0.12)' : 'none',
                  }}>
                  <span className="text-[10px] w-16 font-bold" style={{ color: '#b45309' }}>{s.kind}</span>
                  <span className="w-20 font-mono font-bold" style={{ color: '#3d2070' }}>{s.name}</span>
                  {s.payload && (
                    <span className="flex-1 font-mono text-[10px] px-2 py-0.5 rounded" style={{ background: '#fff', color: '#7c3aed' }}>{s.payload}</span>
                  )}
                  {s.added && <span className="text-[10px] font-bold px-1.5 rounded" style={{ background: BRAND, color: '#fff' }}>NEW</span>}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function WhenPane({ state }) {
      if (!state.branches || state.branches.length === 0) return null;
      return (
        <div className="mt-3 rounded-lg overflow-hidden bg-white" style={{ border: `2px solid ${BRAND}` }}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{ background: '#3d2070' }}>
            <span>🔀</span>
            <span>when (state) — 값이 갈래로 흐른다</span>
          </div>
          <div className="p-3">
            {state.value && (
              <div className="text-center mb-2">
                <span className="font-mono text-[11px] px-2 py-1 rounded" style={{ background: '#dbf3e6', color: '#166534' }}>
                  값: {state.value}
                </span>
                <div className="text-[10px]" style={{ color: BRAND }}>▼ 매칭</div>
              </div>
            )}
            <div className="space-y-1.5">
              {state.branches.map((b, i) => (
                <div key={i} className="flex items-center gap-2 text-[11px] rounded px-2 py-1"
                  style={{
                    background: b.missing ? '#fee2e2' : b.active ? '#dbf3e6' : '#f8f7fc',
                    border: b.active ? `2px solid ${b.missing ? '#ef4444' : '#22c55e'}` : '1px solid #e5e0f0',
                    opacity: b.active || b.missing ? 1 : 0.55,
                  }}>
                  <span className="w-24 font-mono font-bold" style={{ color: b.missing ? '#991b1b' : '#3d2070' }}>{b.pattern}</span>
                  <span className="text-slate-400">→</span>
                  <span className="flex-1 font-mono" style={{ color: b.missing ? '#991b1b' : '#166534' }}>{b.action}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ExhaustiveBadge({ ex }) {
      if (!ex) return null;
      const ok = ex.ok;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex items-center gap-2"
          style={{
            background: ok ? '#dbf3e6' : '#fee2e2',
            border: `1px solid ${ok ? '#86efac' : '#fecaca'}`,
            color: ok ? '#166534' : '#991b1b',
          }}>
          <span className="font-bold">{ok ? '완전성 ✓' : '완전성 ✗'}</span>
          <span className="font-mono text-[10px]">{ex.text}</span>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{ border: `2px solid ${BRAND}`, background: '#f3eeff' }}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🟣</span>
            <span className="text-lg font-bold" style={{ color: '#3d2070' }}>sealed class + when 의 실무 효과</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{ color: '#3d2070' }}>
                <span style={{ color: BRAND }}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info: { bg: '#f3eeff', bd: '#d4c2ff', tx: '#3d2070', icon: '💡' },
      warn: { bg: '#fef3c7', bd: '#fde68a', tx: '#92400e', icon: '⚠️' },
      danger: { bg: '#fee2e2', bd: '#fecaca', tx: '#991b1b', icon: '🚨' },
      good: { bg: '#dbf3e6', bd: '#86efac', tx: '#166534', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{ background: s.bg, border: `1px solid ${s.bd}`, color: s.tx }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{ border: `1px solid ${BRAND}` }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#3d2070' }}>봉인 계층 → when 완전성</h3>
            <span className="text-[10px] text-slate-500">닫힌 자식 목록 = 컴파일러가 강제</span>
          </div>
          <HierarchyPane state={state} />
          <WhenPane state={state} />
          <ExhaustiveBadge ex={state.exhaustive} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? { background: 'rgba(127,82,255,0.18)', borderLeft: `2px solid ${BRAND}` } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg,#f3eeff 0%,#e4d6ff 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ background: BRAND }}>KT</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ background: '#3d2070', color: '#fff' }}>Part II. 함수형</span>
                  <span className="text-[10px] font-mono" style={{ color: BRAND }}>II-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#3d2070' }}>sealed class — 닫힌 계층 + when</h1>
                <p className="text-sm" style={{ color: '#7F52FF' }}>하위 타입을 컴파일러가 모두 아는 봉인 계층, 완전한 when</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ background: i <= stepIdx ? BRAND : '#d4c2ff' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{ background: BRAND }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ background: BRAND }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#7F52FFaa' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{ border: `2px solid ${BRAND}`, color: '#3d2070' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                sealed class 는 하위 타입을 봉인해 컴파일러가 자식 전부를 알게 만든다. 그래서 when 식이 완전성을 검사하고, 상태를 추가하면 처리 누락이 빌드 타임에 드러난다. enum 과 달리 갈래마다 다른 데이터를 담을 수 있어 UI 상태·Result·파싱 결과 모델링의 표준이 된다. 단 하나의 규칙 — else 를 붙여 안전망을 끄지 마라. 이것으로 Part II 함수형을 마치고, 다음 장에서 코루틴 기반 비동기로 넘어간다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kotlin', 'sealed class', 'when', '완전성 검사', '스마트 캐스트', 'UI 상태', 'Result'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{ background: '#f3eeff', color: '#3d2070', border: '1px solid #d4c2ff' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
