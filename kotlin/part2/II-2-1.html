<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotlin 학습 — II-2-1. extension function</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🟣</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    Kotlin II-2-1 — extension function (외부 타입 확장)
    비유: 남의 집(String) 벽에 밖에서 새 창문을 다는 것 — 집 설계도는 안 건드린다
    5단계: 정의 → 멤버처럼 호출·표준 라이브러리 → 정적 디스패치 vs 동적 → nullable/확장 프로퍼티 → 실무 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    const STEPS = [
      {
        title: 'Step 1. 확장 함수 정의 — 밖에서 메서드를 더한다',
        desc: '확장 함수는 원본 타입의 소스를 열지 않고, 그 타입에 새 함수를 "밖에서" 붙이는 도구다. fun String.lastChar() 처럼 함수 이름 앞에 수신 타입(String)을 점으로 붙인다. 함수 본문에서 this 는 그 String 인스턴스 자신을 가리킨다. 자바처럼 StringUtils.lastChar(s) 라는 유틸 클래스를 만들 필요 없이, 마치 String 이 원래부터 가진 메서드처럼 s.lastChar() 로 부른다.',
        recv: 'String',
        members: ['length', 'substring', 'uppercase'],
        exts: [{ name: 'lastChar()', ret: 'Char', active: true }],
        callSite: 's.lastChar()',
        dispatch: null,
        alert: { tone: 'info', text: 'fun 수신타입.함수명() — 점 앞의 타입이 "확장 대상", this 는 그 인스턴스.' },
        code: {
          lang: 'kotlin',
          filename: 'extension-basic.kt',
          lines: [
            '// 확장 함수 — String 에 lastChar 를 밖에서 더한다',
            '// (String 의 소스는 전혀 건드리지 않는다)',
            'fun String.lastChar(): Char = this[length - 1]',
            '//  ^^^^^^ 수신 타입     ^^^^ 수신 객체(this) 생략도 가능',
            '',
            'fun main() {',
            '    val s = "Kotlin"',
            '    println(s.lastChar())   // => n',
            '    //        멤버 함수처럼 점으로 호출된다',
            '}',
            '',
            '// this 는 String 인스턴스 자신 → length, get 등 멤버 접근 가능',
            '// this[length - 1] 은 this.get(this.length - 1) 과 같다',
          ],
          highlight: [1, 2, 3, 7, 8],
        },
      },
      {
        title: 'Step 2. 멤버처럼 호출 — 표준 라이브러리가 확장으로 가득',
        desc: '호출부만 보면 확장 함수와 진짜 멤버 함수를 구분할 수 없다. 바로 이 점이 가독성을 끌어올린다. 코틀린 표준 라이브러리 자체가 확장 함수 덩어리다. let, apply, also, filter, map, first 는 모두 확장으로 정의돼 있다. 덕분에 List, String 같은 기존 타입에 새 기능을 계속 얹으면서도 언어 코어는 작게 유지한다. IDE 자동완성 목록에도 멤버와 나란히 뜬다.',
        recv: 'List&lt;Int&gt;',
        members: ['size', 'get', 'iterator'],
        exts: [
          { name: 'filter { }', ret: 'List', active: true },
          { name: 'map { }', ret: 'List', active: true },
          { name: 'first()', ret: 'Int', active: false },
        ],
        callSite: 'nums.filter { it > 2 }',
        dispatch: null,
        alert: { tone: 'good', text: 'filter·map·let·apply 전부 확장 함수. 언어 코어는 작게, 기능은 확장으로 넓게.' },
        code: {
          lang: 'kotlin',
          filename: 'stdlib-extensions.kt',
          lines: [
            '// 표준 라이브러리 함수 대부분이 사실 확장 함수다',
            'fun main() {',
            '    val nums = listOf(1, 2, 3, 4)',
            '',
            '    // filter / map — List 에 붙은 확장 함수',
            '    val big = nums.filter { it > 2 }      // => [3, 4]',
            '    val doubled = nums.map { it * 2 }     // => [2, 4, 6, 8]',
            '',
            '    // let / apply — 모든 타입 T 에 붙은 확장 함수',
            '    val len = "Kotlin".let { it.length }  // => 6',
            '',
            '    // 호출부만 보면 멤버인지 확장인지 구분 불가 → 그래서 자연스럽다',
            '    println("$big $doubled $len")',
            '}',
          ],
          highlight: [5, 6, 7, 9, 10],
        },
      },
      {
        title: 'Step 3. 정적 디스패치 — 선언 타입 기준, 오버라이드가 아니다',
        desc: '확장 함수는 오버라이드되지 않는다. 어떤 확장이 호출될지는 런타임 실제 타입이 아니라, 컴파일 시점의 "변수 선언 타입"으로 결정된다. 이를 정적 디스패치라고 한다. 멤버 함수는 반대로 실제 타입을 따라가는 동적 디스패치다. 그래서 Parent 타입 변수에 Child 인스턴스를 담고 확장을 부르면 Parent 쪽 확장이 실행된다 — 다형성을 기대하고 확장을 쓰면 버그가 된다.',
        recv: 'View (선언) ← Button (실제)',
        members: [],
        exts: [],
        dispatch: {
          declared: 'View',
          actual: 'Button',
          extResult: 'View.describe() 실행',
          memberResult: 'Button.render() 실행',
        },
        alert: { tone: 'warn', text: '확장은 선언 타입(정적)으로, 멤버는 실제 타입(동적)으로 뽑힌다 — 헷갈리면 버그.' },
        code: {
          lang: 'kotlin',
          filename: 'static-dispatch.kt',
          lines: [
            'open class View',
            'class Button : View()',
            '',
            '// 확장 함수 — 각각 다른 수신 타입에 정의',
            'fun View.describe() = "I am a View"',
            'fun Button.describe() = "I am a Button"',
            '',
            'fun main() {',
            '    val v: View = Button()   // 선언=View, 실제=Button',
            '',
            '    // 확장 = 정적 디스패치 → 선언 타입(View) 기준',
            '    println(v.describe())    // => I am a View  (!)',
            '',
            '    // 멤버였다면 동적 디스패치 → 실제 타입(Button) 기준이었을 것',
            '    // 확장은 오버라이드가 아니다 — 다형성 기대 금지',
            '}',
          ],
          highlight: [5, 6, 9, 12],
        },
      },
      {
        title: 'Step 4. nullable 수신자 · 확장 프로퍼티',
        desc: '수신 타입을 String? 처럼 nullable 로 잡으면, null 인 참조에도 안전하게 호출할 수 있다. 함수 안에서 this 가 null 인지 직접 검사하면 되므로 호출부에 물음표 지옥을 줄인다. 표준 isNullOrEmpty() 가 대표 예다. 또 backing field 가 없는 조건에서 확장 프로퍼티도 만들 수 있다 — val String.lastIndex get() = length - 1 처럼 계산형 프로퍼티를 밖에서 붙인다.',
        recv: 'String?',
        members: [],
        exts: [
          { name: 'orEmpty()', ret: 'String', active: true },
          { name: 'val lastIndex', ret: 'Int (prop)', active: true },
        ],
        callSite: 'name.orEmpty()  // name = null 도 안전',
        dispatch: null,
        alert: { tone: 'info', text: 'String? 수신자 → null 에도 호출 가능. 확장 프로퍼티는 계산형(get)만, 저장 필드 없음.' },
        code: {
          lang: 'kotlin',
          filename: 'nullable-and-prop.kt',
          lines: [
            '// 1) nullable 수신자 — this 가 null 일 수 있다',
            'fun String?.orEmpty2(): String = this ?: ""',
            '',
            '// 2) 확장 프로퍼티 — 계산형(get)만 가능, 저장 필드는 못 만든다',
            'val String.lastIndex: Int',
            '    get() = length - 1',
            '',
            'fun main() {',
            '    val name: String? = null',
            '    println(name.orEmpty2())    // => (빈 문자열, NPE 없음)',
            '',
            '    println("Kotlin".lastIndex) // => 5',
            '',
            '    // 표준에도 같은 패턴: name.isNullOrEmpty()',
            '}',
          ],
          highlight: [2, 5, 6, 10, 12],
        },
      },
      {
        title: 'Step 5. 실무 함정 — 멤버 우선 · 캡슐화 착각 · 남용',
        desc: '확장은 강력하지만 함정도 분명하다. 첫째, 멤버 함수와 시그니처가 같으면 언제나 멤버가 이긴다 — 내가 만든 확장이 조용히 무시된다. 둘째, 확장은 클래스 밖 코드라 private/protected 멤버에 접근하지 못한다 — 캡슐화를 뚫는 게 아니다. 셋째, 정적 디스패치를 오버라이드로 착각하기 쉽다(Step 3). 넷째, 아무 데나 확장을 달면 자동완성이 오염되고 발견성이 떨어진다 — 유틸·가독성·DSL 목적이 분명할 때만 쓴다.',
        recv: 'Best Practice',
        members: [],
        exts: [],
        dispatch: null,
        wins: [
          '멤버와 시그니처 충돌 시 → 멤버가 우선, 내 확장은 무시된다',
          '확장은 private/protected 멤버 접근 불가 (캡슐화는 그대로)',
          '정적 디스패치 → 다형성/오버라이드 목적엔 확장 쓰지 않는다',
          '유틸·가독성·DSL 목적이 뚜렷할 때만, 좁은 범위로 선언한다',
        ],
        alert: { tone: 'good', text: '"확장은 겉을 넓히는 도구지 캡슐화를 뚫는 문이 아니다" — 목적이 분명할 때만.' },
        code: {
          lang: 'kotlin',
          filename: 'pitfalls.kt',
          lines: [
            'class Repo {',
            '    private val secret = 42',
            '    fun ping() = "member ping"',
            '}',
            '',
            '// 함정 1) 멤버와 이름·시그니처가 같으면 → 멤버가 이긴다',
            'fun Repo.ping() = "extension ping"',
            '',
            '// 함정 2) 확장은 private 멤버에 접근 불가',
            '// fun Repo.leak() = secret   // ❌ 컴파일 에러: secret 안 보임',
            '',
            'fun main() {',
            '    val r = Repo()',
            '    println(r.ping())   // => member ping  (확장은 무시됨!)',
            '',
            '    // 확장은 유틸·가독성·DSL 목적이 분명할 때만 — 남용은 발견성 저하',
            '}',
          ],
          highlight: [6, 7, 9, 10, 14],
        },
      },
    ];

    function DispatchMock({ dispatch }) {
      if (!dispatch) return null;
      return (
        <div className="rounded-lg overflow-hidden bg-white mt-3" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>
            정적 디스패치 vs 동적 디스패치
          </div>
          <div className="p-3 space-y-2 text-xs">
            <div className="flex items-center gap-2">
              <span className="w-24 font-bold" style={{color:'#3d2070'}}>선언 타입</span>
              <span className="font-mono px-2 py-0.5 rounded" style={{background:'#f3eeff', color:'#3d2070'}}>{dispatch.declared}</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-24 font-bold" style={{color:'#b45309'}}>실제 타입</span>
              <span className="font-mono px-2 py-0.5 rounded" style={{background:'#fef3c7', color:'#92400e'}}>{dispatch.actual}</span>
            </div>
            <div className="border-t pt-2 mt-1" style={{borderColor:'#d4c2ff'}}>
              <div className="flex items-center gap-2 mb-1.5">
                <span className="w-24 font-bold" style={{color:BRAND}}>확장(정적)</span>
                <span className="flex-1 font-mono px-2 py-0.5 rounded" style={{background:'#f3eeff', color:'#3d2070'}}>선언 타입 → {dispatch.extResult}</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-24 font-bold" style={{color:'#166534'}}>멤버(동적)</span>
                <span className="flex-1 font-mono px-2 py-0.5 rounded" style={{background:'#dbf3e6', color:'#166534'}}>실제 타입 → {dispatch.memberResult}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ExtendMock({ recv, members, exts, callSite }) {
      if (!recv) return null;
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🧩</span>
            <span dangerouslySetInnerHTML={{ __html: `기존 타입 <b>${recv}</b> — 안(멤버) vs 밖(확장)` }} />
          </div>
          <div className="p-3">
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded-lg p-2" style={{background:'#f8f5ff', border:'1px dashed #b8a3f0'}}>
                <div className="text-[10px] font-bold mb-1" style={{color:'#7c6bb0'}}>원본 안에 있던 멤버</div>
                {(members && members.length) ? members.map((m, i) => (
                  <div key={i} className="text-[11px] font-mono px-2 py-0.5 my-0.5 rounded" style={{background:'#eee7ff', color:'#3d2070'}}>{m}</div>
                )) : <div className="text-[11px] text-slate-400">—</div>}
              </div>
              <div className="rounded-lg p-2" style={{background:'#fff7ed', border:'1px solid #fdba74'}}>
                <div className="text-[10px] font-bold mb-1" style={{color:'#b45309'}}>밖에서 더한 확장 ⤵</div>
                {(exts && exts.length) ? exts.map((e, i) => (
                  <div key={i} className="text-[11px] font-mono px-2 py-0.5 my-0.5 rounded flex justify-between" style={{background: e.active ? '#ffedd5' : '#fef3c7', color:'#92400e', opacity: e.active ? 1 : 0.55}}>
                    <span>{e.name}</span><span className="text-[10px]">: {e.ret}</span>
                  </div>
                )) : <div className="text-[11px] text-slate-400">—</div>}
              </div>
            </div>
            {callSite && (
              <div className="mt-2 flex items-center gap-2">
                <span className="text-[10px] font-bold" style={{color:'#3d2070'}}>호출부</span>
                <span className="flex-1 font-mono text-[11px] px-2 py-1 rounded text-center" style={{background:'#282c34', color:'#98c379'}}>{callSite}</span>
              </div>
            )}
            <div className="mt-1 text-center text-[10px]" style={{color:'#7c6bb0'}}>확장도 멤버처럼 점(.)으로 호출된다 — 겉으론 구분 불가</div>
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f3eeff'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🟣</span>
            <span className="text-lg font-bold" style={{color:'#3d2070'}}>확장 함수 실무 체크리스트</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#3d2070'}}>
                <span style={{color:BRAND}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f3eeff', bd:'#d4c2ff', tx:'#3d2070', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#3d2070'}}>밖에서 붙이는 확장 함수</h3>
            <span className="text-[10px] text-slate-500">원본 소스는 그대로</span>
          </div>
          <ExtendMock recv={state.recv} members={state.members} exts={state.exts} callSite={state.callSite} />
          <DispatchMock dispatch={state.dispatch} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(127,82,255,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f3eeff 0%,#e4d6ff 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-2.5 h-10 rounded-lg text-white font-bold text-xs" style={{background:BRAND}}>Part II. 함수형</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#3d2070'}}>II-2-1. extension function — 외부 타입 확장</h1>
                <p className="text-sm" style={{color:'#7F52FF'}}>원본을 수정하지 않고 기존 타입에 메서드를 더하는 코틀린의 핵심 도구</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#d4c2ff'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#7F52FFaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#3d2070'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                확장 함수는 원본 소스를 열지 않고 기존 타입에 메서드를 "밖에서" 붙여, 멤버처럼 점(.)으로 호출하게 해준다. 표준 라이브러리의 filter·let·apply 가 모두 이 방식이다. 다만 정적 디스패치라 오버라이드가 아니고, 멤버와 충돌하면 멤버가 이기며, private 멤버엔 손댈 수 없다. 유틸·가독성·DSL 목적이 분명할 때만 좁게 쓰는 것이 실무의 기준이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kotlin', 'extension function', '수신 객체', '정적 디스패치', '확장 프로퍼티', 'nullable 수신자'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f3eeff', color:'#3d2070', border:'1px solid #d4c2ff'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
