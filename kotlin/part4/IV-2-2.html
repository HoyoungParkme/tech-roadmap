  <div id="root"></div>
  <!--
    Kotlin IV-2-2 — Retrofit + 코루틴 (타입 안전 HTTP 클라이언트)
    비유: 주문서(인터페이스)를 내면 주방(코루틴)이 IO 스레드에서 요리해 접시(객체)로 돌려준다
    5단계: 인터페이스 선언 → suspend·코루틴 → Response 상태처리 → OkHttp 인터셉터 → 레이어 통합
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    // 파이프라인 단계 정의 — 좌측 패널이 이 흐름을 하이라이트한다
    const STAGES = [
      { key: 'api',   icon: '📝', label: 'API 인터페이스' },
      { key: 'coro',  icon: '🔀', label: '코루틴 (IO)' },
      { key: 'okhttp',icon: '🌐', label: 'OkHttp 요청' },
      { key: 'json',  icon: '🔁', label: 'JSON→객체' },
      { key: 'repo',  icon: '📦', label: 'Repository' },
      { key: 'vm',    icon: '🧠', label: 'ViewModel' },
      { key: 'ui',    icon: '🖥️', label: 'UI' },
    ];

    const STEPS = [
      {
        title: 'Step 1. 인터페이스로 API를 선언한다 — 타입 안전 HTTP',
        desc: 'Retrofit 은 URL 을 문자열로 조립하지 않는다. 대신 인터페이스의 메서드 하나가 엔드포인트 하나에 대응한다. @GET·@POST 로 HTTP 메서드를, @Path 로 경로 변수를, @Query 로 쿼리스트링을, @Body 로 요청 본문을 선언한다. 이렇게 하면 오타나 잘못된 파라미터가 컴파일 타임에 잡히고, 응답 타입도 코드에 명시되어 "이 API 가 무엇을 주는가" 가 시그니처만 봐도 드러난다.',
        active: ['api'],
        status: 'idle',
        endpoint: 'GET /posts/{id}',
        rows: [
          { k: '@GET/@POST',  v: 'HTTP 메서드를 애노테이션으로 지정' },
          { k: '@Path("id")', v: '경로 변수 — /posts/42 로 치환' },
          { k: '@Query',      v: '쿼리스트링 — ?userId=7&page=2' },
          { k: '@Body',       v: '요청 본문 객체를 JSON 으로 직렬화' },
        ],
        alert: { tone: 'info', text: '인터페이스 메서드 = 엔드포인트 1개. 오타는 컴파일 타임에 잡힌다.' },
        code: {
          lang: 'kotlin',
          filename: 'PostApi.kt',
          lines: [
            'import retrofit2.Response',
            'import retrofit2.http.*',
            '',
            '// 인터페이스 하나가 API 명세가 된다',
            'interface PostApi {',
            '',
            '    // GET /posts/42  — 경로 변수 치환',
            '    @GET("posts/{id}")',
            '    suspend fun getPost(@Path("id") id: Long): Response<Post>',
            '',
            '    // GET /posts?userId=7&page=2  — 쿼리스트링',
            '    @GET("posts")',
            '    suspend fun getPosts(',
            '        @Query("userId") userId: Long,',
            '        @Query("page") page: Int = 1,',
            '    ): Response<List<Post>>',
            '',
            '    // POST /posts  — 본문을 JSON 으로 전송',
            '    @POST("posts")',
            '    suspend fun createPost(@Body post: NewPost): Response<Post>',
            '}',
          ],
          highlight: [5, 8, 9, 12, 13, 14, 15, 16, 19, 20],
        },
      },
      {
        title: 'Step 2. suspend 함수 — 코루틴이 IO 스레드에서 기다린다',
        desc: '네트워크는 느리다. 메인(UI) 스레드에서 응답을 기다리면 화면이 얼어붙는다. Retrofit 은 함수에 suspend 만 붙이면 코루틴과 통합된다 — 호출부는 동기 코드처럼 한 줄로 읽히지만, 실제로는 응답을 기다리는 동안 스레드를 반납한다. Retrofit 은 내부적으로 요청을 IO 디스패처에서 처리하므로, viewModelScope 에서 그냥 호출해도 메인 스레드가 막히지 않는다. 콜백 지옥이 사라지고 try/catch 로 예외를 잡을 수 있게 된다.',
        active: ['api', 'coro', 'okhttp'],
        status: 'loading',
        endpoint: 'GET /posts/42  … 대기 중',
        rows: [
          { k: 'suspend',       v: '중단 가능 — 대기 동안 스레드를 반납' },
          { k: 'viewModelScope',v: 'ViewModel 생명주기에 묶인 코루틴 범위' },
          { k: 'Dispatchers.IO', v: 'Retrofit 이 내부에서 IO 스레드 사용' },
          { k: '동기처럼 읽힘',  v: '콜백 중첩 없이 한 줄 — try/catch 가능' },
        ],
        alert: { tone: 'warn', text: '메인 스레드에서 blocking 호출은 금지. suspend + 코루틴이 UI 프리징을 막는다.' },
        code: {
          lang: 'kotlin',
          filename: 'LoadPost.kt',
          lines: [
            'import kotlinx.coroutines.launch',
            'import androidx.lifecycle.viewModelScope',
            '',
            '// ViewModel 안에서 — 메인 스레드를 막지 않는다',
            'fun loadPost(id: Long) {',
            '    viewModelScope.launch {          // 코루틴 시작',
            '        _state.value = UiState.Loading',
            '        // suspend 호출: 응답을 기다리는 동안 스레드 반납',
            '        val response = api.getPost(id)',
            '        // 여기부터는 응답이 도착한 뒤 이어서 실행',
            '        handle(response)',
            '    }',
            '}',
            '',
            '// 잘못된 예 — 메인 스레드 blocking (ANR 유발)',
            '// val response = runBlocking { api.getPost(id) }  // ❌',
          ],
          highlight: [5, 6, 7, 9, 10, 11],
        },
      },
      {
        title: 'Step 3. Response 래퍼 — 상태코드와 에러를 직접 다룬다',
        desc: '요청이 도착했다고 성공이 아니다. 404, 401, 500 은 예외를 던지지 않고 정상 응답으로 온다. 반환 타입을 Response 로 감싸면 isSuccessful, code(), body(), errorBody() 로 HTTP 상태를 직접 확인할 수 있다. body() 만 꺼내 쓰면 실패 응답에서 null 이 튀어나와 NPE 로 이어진다. 성공/실패를 Result 같은 sealed 타입으로 좁혀서 ViewModel 로 넘기면, UI 는 성공·에러·로딩 세 상태만 그리면 된다.',
        active: ['okhttp', 'json', 'repo'],
        status: 'error',
        endpoint: 'HTTP 404 Not Found',
        rows: [
          { k: 'isSuccessful',  v: '2xx 여부 — true 라야 body() 안전' },
          { k: 'code()',        v: '상태코드 — 401/404/500 분기' },
          { k: 'errorBody()',   v: '실패 시 서버가 준 에러 본문' },
          { k: 'sealed Result', v: '성공/실패를 타입으로 좁혀 UI 로 전달' },
        ],
        alert: { tone: 'danger', text: 'body() 를 곧바로 쓰면 실패 응답에서 null → NPE. 반드시 상태코드부터 확인.' },
        code: {
          lang: 'kotlin',
          filename: 'ApiResult.kt',
          lines: [
            '// 성공/실패를 타입으로 좁힌다',
            'sealed interface ApiResult<out T> {',
            '    data class Ok<T>(val data: T) : ApiResult<T>',
            '    data class Fail(val code: Int, val msg: String) : ApiResult<Nothing>',
            '}',
            '',
            'fun <T> Response<T>.toResult(): ApiResult<T> {',
            '    return if (isSuccessful) {',
            '        val body = body()',
            '        if (body != null) ApiResult.Ok(body)',
            '        else ApiResult.Fail(code(), "빈 응답 본문")',
            '    } else {',
            '        // 실패 응답 — errorBody 로 원인 파악',
            '        val detail = errorBody()?.string() ?: "unknown"',
            '        ApiResult.Fail(code(), detail)   // 404, 401, 500 …',
            '    }',
            '}',
          ],
          highlight: [2, 3, 4, 8, 9, 10, 11, 13, 14, 15],
        },
      },
      {
        title: 'Step 4. OkHttp 인터셉터 — 로깅과 인증을 한 곳에서',
        desc: 'Retrofit 은 실제 전송을 OkHttp 에 위임한다. 인터셉터는 모든 요청·응답이 지나가는 관문이다. 로깅 인터셉터로 요청 URL·헤더·바디를 콘솔에서 확인하고, 인증 인터셉터로 Authorization 헤더를 매 요청에 자동으로 붙인다. 토큰을 API 함수마다 넘기면 빠뜨리기 쉽지만, 인터셉터 한 곳에 모으면 누락이 없다. 401 이 오면 여기서 토큰을 갱신(refresh)하고 재요청하는 흐름도 구성한다. JSON 변환기(kotlinx.serialization / Moshi)도 이 단계에서 함께 등록한다.',
        active: ['okhttp', 'json'],
        status: 'loading',
        endpoint: 'Authorization: Bearer … 자동 부착',
        rows: [
          { k: 'HttpLoggingInterceptor', v: '요청/응답 로그 — 개발 중 디버깅' },
          { k: 'Auth Interceptor',       v: '토큰 헤더를 매 요청에 자동 부착' },
          { k: 'timeout 설정',           v: 'connect/read/write 타임아웃 명시' },
          { k: 'Converter',              v: 'kotlinx.serialization / Moshi 등록' },
        ],
        alert: { tone: 'warn', text: '토큰을 함수마다 넘기면 누락된다. 인터셉터 한 곳에서 처리하고 타임아웃도 반드시 설정.' },
        code: {
          lang: 'kotlin',
          filename: 'HttpClient.kt',
          lines: [
            'import okhttp3.OkHttpClient',
            'import okhttp3.Interceptor',
            'import java.util.concurrent.TimeUnit',
            '',
            '// 인증 토큰을 매 요청에 자동으로 붙인다',
            'class AuthInterceptor(val token: () -> String?) : Interceptor {',
            '    override fun intercept(chain: Interceptor.Chain) = chain.run {',
            '        val req = request().newBuilder().apply {',
            '            token()?.let { header("Authorization", "Bearer $it") }',
            '        }.build()',
            '        proceed(req)',
            '    }',
            '}',
            '',
            'val client = OkHttpClient.Builder()',
            '    .addInterceptor(AuthInterceptor { tokenStore.access })',
            '    .addInterceptor(HttpLoggingInterceptor().apply {',
            '        level = HttpLoggingInterceptor.Level.BODY   // 디버그 전용',
            '    })',
            '    .connectTimeout(10, TimeUnit.SECONDS)',
            '    .readTimeout(15, TimeUnit.SECONDS)',
            '    .build()',
          ],
          highlight: [6, 7, 8, 9, 10, 11, 16, 17, 18, 20, 21],
        },
      },
      {
        title: 'Step 5. 레이어 통합 — Repository → ViewModel → UI',
        desc: 'API 호출은 UI 에서 직접 하지 않는다. Repository 가 네트워크 접근을 감추고 도메인 결과(ApiResult)를 돌려준다. ViewModel 은 Repository 를 호출해 UiState(로딩·성공·에러)로 변환하고, UI 는 그 상태만 구독해 그린다. try/catch 로 IOException(오프라인)·타임아웃을 잡아 사용자에게 보여줄 에러로 바꾼다. 이 분리 덕분에 화면은 네트워크 세부사항을 모른 채 세 상태만 다루면 되고, 테스트에서는 Repository 를 가짜로 갈아끼울 수 있다.',
        active: ['repo', 'vm', 'ui'],
        status: 'success',
        endpoint: 'HTTP 200 OK  →  UiState.Success',
        rows: [
          { k: 'Repository',  v: '네트워크 접근을 감추고 도메인 결과 반환' },
          { k: 'ViewModel',   v: 'ApiResult → UiState(로딩·성공·에러)' },
          { k: 'try/catch',   v: 'IOException·타임아웃을 에러 상태로 변환' },
          { k: 'UI 구독',     v: '상태 3종만 그림 — 네트워크 세부 은닉' },
        ],
        wins: [
          'Repository 분리 → 테스트에서 가짜 구현으로 교체 가능',
          'UiState 3종(로딩/성공/에러) → 화면 코드가 단순해진다',
          '인터셉터로 토큰·로깅 일원화 → 누락과 중복 제거',
          'Response 상태코드 확인 → NPE 대신 명시적 에러 처리',
        ],
        alert: { tone: 'good', text: '네트워크는 Repository 뒤로. UI 는 로딩·성공·에러 세 상태만 그린다.' },
        code: {
          lang: 'kotlin',
          filename: 'PostRepository.kt',
          lines: [
            'class PostRepository(val api: PostApi) {',
            '    // 네트워크 예외까지 여기서 흡수해 도메인 결과로 변환',
            '    suspend fun post(id: Long): ApiResult<Post> = try {',
            '        api.getPost(id).toResult()',
            '    } catch (e: java.io.IOException) {',
            '        ApiResult.Fail(-1, "네트워크 오류: ${e.message}")',
            '    }',
            '}',
            '',
            'class PostViewModel(val repo: PostRepository) : ViewModel() {',
            '    val state = MutableStateFlow<UiState>(UiState.Loading)',
            '    fun load(id: Long) = viewModelScope.launch {',
            '        state.value = UiState.Loading',
            '        state.value = when (val r = repo.post(id)) {',
            '            is ApiResult.Ok   -> UiState.Success(r.data)',
            '            is ApiResult.Fail -> UiState.Error(r.msg)',
            '        }',
            '    }',
            '}',
          ],
          highlight: [1, 3, 4, 5, 6, 11, 12, 13, 14, 15, 16],
        },
      },
    ];

    const STATUS_STYLE = {
      idle:    { bg: '#f3eeff', tx: '#3d2070', label: '대기' },
      loading: { bg: '#fef3c7', tx: '#92400e', label: '요청 중…' },
      success: { bg: '#dbf3e6', tx: '#166534', label: '성공 200' },
      error:   { bg: '#fee2e2', tx: '#991b1b', label: '에러 4xx/5xx' },
    };

    function StatusBadge({ status }) {
      const s = STATUS_STYLE[status] || STATUS_STYLE.idle;
      const pulse = status === 'loading';
      return (
        <span
          className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${pulse ? 'animate-pulse' : ''}`}
          style={{ background: s.bg, color: s.tx }}
        >
          {s.label}
        </span>
      );
    }

    // 데이터 파이프라인 — 이번 단계에서 활성화된 stage 를 강조
    function Pipeline({ active, status }) {
      const activeSet = new Set(active);
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{ border: `2px solid ${BRAND}` }}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{ background: BRAND }}>
            <span>🔗</span>
            <span>요청 흐름 — suspend 함수에서 UI 까지</span>
          </div>
          <div className="p-3 flex flex-col gap-1.5">
            {STAGES.map((st, i) => {
              const on = activeSet.has(st.key);
              const isErr = status === 'error' && on && (st.key === 'json' || st.key === 'repo');
              return (
                <div key={st.key} className="flex flex-col items-stretch">
                  <div
                    className="flex items-center gap-2 rounded px-2 py-1.5 text-xs transition"
                    style={{
                      background: isErr ? '#fee2e2' : on ? '#f3eeff' : '#faf8ff',
                      border: `1px solid ${isErr ? '#fecaca' : on ? BRAND : '#ece4ff'}`,
                      opacity: on ? 1 : 0.55,
                      boxShadow: on ? `0 0 0 2px rgba(127,82,255,0.12)` : 'none',
                    }}
                  >
                    <span className="text-base">{st.icon}</span>
                    <span className="font-mono font-bold" style={{ color: isErr ? '#991b1b' : on ? '#3d2070' : '#8b7fb0' }}>
                      {st.label}
                    </span>
                    {on && (
                      <span className="ml-auto text-[10px]" style={{ color: BRAND }}>
                        {status === 'loading' ? '흐르는 중' : status === 'error' && isErr ? '중단' : '활성'}
                      </span>
                    )}
                  </div>
                  {i < STAGES.length - 1 && (
                    <div className="flex justify-center">
                      <span className="text-[10px] leading-3" style={{ color: on ? BRAND : '#d4c2ff' }}>▼</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function RowsBox({ rows }) {
      if (!rows) return null;
      return (
        <div className="mt-3 rounded-lg overflow-hidden bg-white" style={{ border: '1px solid #d4c2ff' }}>
          <div className="px-3 py-1.5 text-[11px] font-bold" style={{ background: '#f3eeff', color: '#3d2070' }}>
            이번 단계의 핵심 도구
          </div>
          <div className="p-2 space-y-1">
            {rows.map((r, i) => (
              <div key={i} className="flex items-start gap-2 text-[11px]">
                <span className="w-40 font-mono font-bold shrink-0" style={{ color: BRAND }}>{r.k}</span>
                <span className="flex-1" style={{ color: '#3d2070' }}>{r.v}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{ border: `2px solid ${BRAND}`, background: '#f3eeff' }}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🟣</span>
            <span className="text-base font-bold" style={{ color: '#3d2070' }}>레이어 분리가 주는 실무 효과</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{ color: '#3d2070' }}>
                <span style={{ color: BRAND }}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#f3eeff', bd: '#d4c2ff', tx: '#3d2070', icon: '💡' },
      warn:   { bg: '#fef3c7', bd: '#fde68a', tx: '#92400e', icon: '⚠️' },
      danger: { bg: '#fee2e2', bd: '#fecaca', tx: '#991b1b', icon: '🚨' },
      good:   { bg: '#dbf3e6', bd: '#86efac', tx: '#166534', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{ background: s.bg, border: `1px solid ${s.bd}`, color: s.tx }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{ border: `1px solid ${BRAND}` }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#3d2070' }}>네트워크 파이프라인</h3>
            <div className="flex items-center gap-2">
              <span className="font-mono text-[10px]" style={{ color: '#7F52FF' }}>{state.endpoint}</span>
              <StatusBadge status={state.status} />
            </div>
          </div>
          <Pipeline active={state.active} status={state.status} />
          <RowsBox rows={state.rows} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? { background: 'rgba(127,82,255,0.18)', borderLeft: `2px solid ${BRAND}` } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg,#f3eeff 0%,#e4d6ff 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ background: BRAND }}>KT</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold text-white" style={{ background: '#3d2070' }}>Part IV. 안드로이드</span>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold" style={{ background: '#f3eeff', color: '#3d2070', border: '1px solid #d4c2ff' }}>IV-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#3d2070' }}>Retrofit + 코루틴</h1>
                <p className="text-sm" style={{ color: '#7F52FF' }}>타입 안전 HTTP 클라이언트, suspend 함수로 네트워크 호출</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ background: i <= stepIdx ? BRAND : '#d4c2ff' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{ background: BRAND }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ background: BRAND }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#7F52FFaa' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{ border: `2px solid ${BRAND}`, color: '#3d2070' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Retrofit 은 인터페이스 하나로 API 를 타입 안전하게 선언하고, suspend 함수가 코루틴 위에서 네트워크를 IO 스레드로 밀어 UI 프리징을 막는다. Response 로 상태코드를 직접 확인해 NPE 대신 명시적 에러로 다루고, OkHttp 인터셉터로 로깅과 토큰을 한 곳에 모은다. 마지막으로 Repository → ViewModel → UI 로 흐름을 나누면, 화면은 로딩·성공·에러 세 상태만 그리고 네트워크 세부는 뒤로 숨는다. 이것이 안드로이드 네트워킹의 실무 기본형이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Retrofit', 'Coroutine', 'suspend', 'OkHttp', 'Interceptor', 'Response', 'Repository', 'ViewModel'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{ background: '#f3eeff', color: '#3d2070', border: '1px solid #d4c2ff' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
