  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🟣</text></svg>" />

<body>
  <div id="root"></div>
  <!--
    Kotlin IV-2-1 — Room + 코루틴/Flow (비유: DB 창고 + 실시간 방송)
    Room = SQLite 타입 안전 추상화 / suspend = 비동기 접근 / Flow = 데이터 변경 자동 방송
    5단계: Room 3요소 → suspend DAO → Flow 쿼리 → ViewModel 수집→UI → 실무 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    const STEPS = [
      {
        title: 'Step 1. Room 3요소 — @Entity · @Dao · @Database',
        desc: 'Room 은 SQLite 를 감싼 타입 안전 추상화 레이어다. 테이블은 @Entity 데이터 클래스, 쿼리는 @Dao 인터페이스, 진입점은 @Database 로 선언한다. 핵심은 컴파일 타임 검증 — @Query 문자열의 SQL 을 빌드 시점에 파싱해 오타나 잘못된 컬럼을 즉시 에러로 잡는다. 손으로 짜던 Cursor·ContentValues 보일러플레이트가 사라진다.',
        thread: null,
        emit: null,
        rows: [
          { id: 1, title: '우유 사기', done: false },
          { id: 2, title: 'PR 리뷰', done: true },
        ],
        ui: null,
        alert: { tone: 'info', text: '@Query 의 SQL 은 컴파일 타임에 검증된다 — 오타는 런타임이 아니라 빌드에서 터진다.' },
        code: {
          lang: 'kotlin',
          filename: 'TaskEntity.kt',
          lines: [
            '// 1) 테이블 = 데이터 클래스에 @Entity',
            '@Entity(tableName = "tasks")',
            'data class Task(',
            '    @PrimaryKey(autoGenerate = true) val id: Long = 0,',
            '    val title: String,',
            '    val done: Boolean = false,',
            ')',
            '',
            '// 2) 쿼리 모음 = 인터페이스에 @Dao',
            '@Dao',
            'interface TaskDao {',
            '    @Query("SELECT * FROM tasks ORDER BY id DESC")',
            '    fun observeAll(): List<Task>   // SQL 은 빌드 시 검증됨',
            '}',
            '',
            '// 3) 진입점 = @Database',
            '@Database(entities = [Task::class], version = 1)',
            'abstract class AppDb : RoomDatabase() {',
            '    abstract fun taskDao(): TaskDao',
            '}',
          ],
          highlight: [1,2,3,4,9,10,11,12,16,17,18],
        },
      },
      {
        title: 'Step 2. suspend DAO — 코루틴으로 비동기 DB 접근',
        desc: 'DB I/O 를 메인 스레드에서 하면 앱이 멈추고, Room 은 아예 크래시로 막는다. DAO 함수에 suspend 를 붙이면 Room 이 자동으로 IO 디스패처에서 실행해 준다. 호출부는 viewModelScope.launch 안에서 평범하게 순차 코드처럼 쓰면 되고, 콜백 지옥이나 스레드 관리가 사라진다. 일회성 읽기·쓰기(insert, 단건 조회)는 suspend 로 두는 것이 기본이다.',
        thread: 'IO (Room 자동 전환)',
        emit: null,
        rows: [
          { id: 1, title: '우유 사기', done: false },
          { id: 2, title: 'PR 리뷰', done: true },
          { id: 3, title: '배포 점검', done: false },
        ],
        ui: null,
        alert: { tone: 'good', text: 'suspend 를 붙이면 Room 이 알아서 IO 스레드에서 실행 — 메인 스레드는 자유롭다.' },
        code: {
          lang: 'kotlin',
          filename: 'TaskDao.kt',
          lines: [
            '@Dao',
            'interface TaskDao {',
            '    // 일회성 쓰기 — suspend 로 비동기',
            '    @Insert',
            '    suspend fun insert(task: Task): Long',
            '',
            '    // 일회성 읽기 — suspend',
            '    @Query("SELECT * FROM tasks WHERE id = :id")',
            '    suspend fun findById(id: Long): Task?',
            '}',
            '',
            '// 호출부 — 코루틴 안에서 순차 코드처럼',
            'viewModelScope.launch {',
            '    val newId = dao.insert(Task(title = "배포 점검"))',
            '    val saved = dao.findById(newId)',
            '    // => Room 이 IO 디스패처에서 실행, 메인 스레드 안 막음',
            '}',
          ],
          highlight: [3,4,5,7,8,9,13,14,15],
        },
      },
      {
        title: 'Step 3. Flow 쿼리 — 데이터가 바뀌면 새 리스트를 자동 방출',
        desc: '반환 타입을 Flow<List<Task>> 로 두면 상황이 달라진다. 이 쿼리는 한 번만 실행되는 게 아니라, 테이블이 변경될 때마다 Room 이 쿼리를 다시 돌려 새 리스트를 방출(emit)하는 살아있는 스트림이 된다. insert·update·delete 어디서 일어나든 관찰자는 최신 목록을 자동으로 받는다. "다시 조회" 코드를 직접 짤 필요가 없다 — 이것이 Flow 쿼리의 핵심 가치다.',
        thread: 'IO (Room 자동 전환)',
        emit: { count: 3, active: true },
        rows: [
          { id: 1, title: '우유 사기', done: false },
          { id: 2, title: 'PR 리뷰', done: true },
          { id: 3, title: '배포 점검', done: false },
          { id: 4, title: '회의 준비', done: false },
        ],
        ui: null,
        alert: { tone: 'info', text: 'Flow 쿼리는 한 번 실행이 아니라 구독 — 테이블이 바뀔 때마다 새 리스트를 방출한다.' },
        code: {
          lang: 'kotlin',
          filename: 'TaskDao.kt',
          lines: [
            '@Dao',
            'interface TaskDao {',
            '    // 반환을 Flow 로 — 살아있는 쿼리',
            '    @Query("SELECT * FROM tasks ORDER BY id DESC")',
            '    fun observeAll(): Flow<List<Task>>',
            '',
            '    @Insert',
            '    suspend fun insert(task: Task): Long',
            '}',
            '',
            '// 어디선가 insert 가 일어나면...',
            'dao.insert(Task(title = "회의 준비"))',
            '',
            '// observeAll() 을 구독 중인 모든 곳이',
            '// 다시 조회 없이 새 리스트를 자동으로 받는다',
            '// => emit [우유, PR, 배포]  → 변경 후 →  emit [우유, PR, 배포, 회의]',
          ],
          highlight: [3,4,5,11,12,14,15,16],
        },
      },
      {
        title: 'Step 4. ViewModel 에서 수집 → UI 갱신',
        desc: 'Flow 는 ViewModel 에서 수집(collect)해 UI 상태로 바꾼다. stateIn 으로 StateFlow 로 변환하면 화면 회전 같은 재구독에도 마지막 값을 즉시 돌려줘 깜빡임이 없다. Compose 는 collectAsStateWithLifecycle 로 구독하고, 목록이 방출될 때마다 그 부분만 다시 그린다. 여러 건을 한 트랜잭션으로 묶어야 할 땐 @Transaction 을, 스키마가 바뀌면 version 을 올리고 Migration 을 등록한다.',
        thread: 'IO → Main (수집은 UI 스코프)',
        emit: { count: 4, active: true },
        rows: [
          { id: 1, title: '우유 사기', done: false },
          { id: 2, title: 'PR 리뷰', done: true },
          { id: 3, title: '배포 점검', done: false },
          { id: 4, title: '회의 준비', done: false },
        ],
        ui: ['우유 사기', 'PR 리뷰 ✓', '배포 점검', '회의 준비'],
        alert: { tone: 'good', text: 'stateIn 으로 StateFlow 화 → 재구독에도 마지막 값 즉시 제공, 화면 깜빡임 없음.' },
        code: {
          lang: 'kotlin',
          filename: 'TaskViewModel.kt',
          lines: [
            'class TaskViewModel(private val dao: TaskDao) : ViewModel() {',
            '    // Flow -> StateFlow 로 변환해 UI 가 즉시 구독',
            '    val tasks: StateFlow<List<Task>> =',
            '        dao.observeAll()',
            '            .stateIn(',
            '                scope = viewModelScope,',
            '                started = SharingStarted.WhileSubscribed(5_000),',
            '                initialValue = emptyList(),',
            '            )',
            '',
            '    fun add(title: String) = viewModelScope.launch {',
            '        dao.insert(Task(title = title))  // 방출은 Flow 가 알아서',
            '    }',
            '}',
            '',
            '// Compose UI',
            '@Composable',
            'fun TaskScreen(vm: TaskViewModel) {',
            '    val tasks by vm.tasks.collectAsStateWithLifecycle()',
            '    LazyColumn { items(tasks) { Text(it.title) } }',
            '}',
          ],
          highlight: [3,4,5,6,7,8,18,19,20],
        },
      },
      {
        title: 'Step 5. 실무 함정 — 크래시·마이그레이션·중복 수집',
        desc: '현장에서 반복되는 사고 네 가지다. 메인 스레드에서 동기 DB 접근하면 즉시 크래시(suspend/Flow 로 해결), version 올리고 Migration 을 빠뜨리면 사용자 기기에서 크래시(테스트로 마이그레이션 검증), 같은 Flow 를 여러 곳에서 수집하면 쿼리가 중복 실행(state, WhileSubscribed 로 공유), 수만 행을 List 로 한 번에 로드하면 OOM(Paging 3 로 페이지 단위 로드). 함정의 공통점은 "스레드와 데이터 양"이다.',
        thread: 'Main 동기 접근 = ❌ 크래시',
        emit: null,
        rows: [
          { id: 1, title: '우유 사기', done: false },
          { id: 2, title: 'PR 리뷰', done: true },
        ],
        ui: null,
        pitfalls: [
          { bad: '메인 스레드 동기 DB 접근', fix: 'suspend / Flow 로 IO 전환', ok: false },
          { bad: 'version 올리고 Migration 누락', fix: 'Migration 등록 + 테스트 검증', ok: false },
          { bad: '같은 Flow 여러 곳 중복 수집', fix: 'stateIn + WhileSubscribed 공유', ok: false },
          { bad: '수만 행을 List 로 일괄 로드', fix: 'Paging 3 로 페이지 단위 로드', ok: false },
        ],
        alert: { tone: 'danger', text: '함정의 공통 뿌리는 "어느 스레드에서, 얼마나 많은 데이터를" — 이 둘만 지키면 대부분 예방된다.' },
        code: {
          lang: 'kotlin',
          filename: 'pitfalls.kt',
          lines: [
            '// ✗ 1. 메인 스레드 동기 접근 — IllegalStateException 크래시',
            '// val list = dao.observeAllBlocking()  // 절대 금지',
            '// ✓ suspend / Flow 로 IO 위임',
            '',
            '// ✗ 2. 스키마 바꾸며 version 만 올리고 Migration 누락',
            'val MIGRATION_1_2 = object : Migration(1, 2) {',
            '    override fun migrate(db: SupportSQLiteDatabase) {',
            '        db.execSQL("ALTER TABLE tasks ADD COLUMN due INTEGER")',
            '    }',
            '}',
            'Room.databaseBuilder(ctx, AppDb::class.java, "app.db")',
            '    .addMigrations(MIGRATION_1_2)   // 빠뜨리면 기기에서 크래시',
            '    .build()',
            '',
            '// ✗ 3. 같은 Flow 중복 수집 → 쿼리 중복 실행',
            '//    stateIn(WhileSubscribed) 로 하나로 공유',
            '',
            '// ✗ 4. 수만 행 일괄 로드 → OOM',
            '@Query("SELECT * FROM tasks ORDER BY id DESC")',
            'fun pagedAll(): PagingSource<Int, Task>   // Paging 3',
          ],
          highlight: [1,2,3,5,6,7,8,11,12,18,19,20],
        },
      },
    ];

    const ALERT_STYLE = {
      info:   { bg:'#f3eeff', bd:'#d4c2ff', tx:'#3d2070', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function DbTable({ rows, thread }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🗄️</span>
            <span>SQLite 테이블 · tasks (@Entity)</span>
            {thread && (
              <span className="ml-auto text-[10px] px-2 py-0.5 rounded-full bg-white/20">
                {thread}
              </span>
            )}
          </div>
          <div className="p-2 space-y-1">
            <div className="flex text-[10px] font-bold px-2" style={{color:'#3d2070'}}>
              <span className="w-8">id</span>
              <span className="flex-1">title</span>
              <span className="w-14 text-right">done</span>
            </div>
            {rows.map((r) => (
              <div key={r.id} className="flex items-center text-xs font-mono px-2 py-1 rounded" style={{background:'#f3eeff', color:'#3d2070'}}>
                <span className="w-8">{r.id}</span>
                <span className="flex-1">{r.title}</span>
                <span className="w-14 text-right">{r.done ? '✅ true' : '⬜ false'}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FlowStream({ emit }) {
      if (!emit) return null;
      return (
        <div className="mt-3 rounded-lg p-3" style={{border:`2px dashed ${BRAND}`, background:'#faf7ff'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-lg">📡</span>
            <span className="text-xs font-bold" style={{color:'#3d2070'}}>observeAll() : Flow — 변경 감지 시 재방출</span>
            <span className="ml-auto text-[10px] font-mono px-2 py-0.5 rounded-full" style={{background:'#e4d6ff', color:'#3d2070'}}>
              emit #{emit.count}
            </span>
          </div>
          <div className="flex items-center gap-1">
            {[0,1,2,3].map((i) => (
              <div key={i} className="flex items-center gap-1">
                <span
                  className={`w-3 h-3 rounded-full ${emit.active ? 'animate-pulse' : ''}`}
                  style={{background: i <= (emit.count % 5) ? BRAND : '#d4c2ff'}}
                />
                {i < 3 && <span style={{color:'#d4c2ff'}}>→</span>}
              </div>
            ))}
            <span className="ml-2 text-[10px]" style={{color:'#7F52FF'}}>새 List&lt;Task&gt; 방출</span>
          </div>
        </div>
      );
    }

    function UiList({ ui }) {
      if (!ui) return null;
      return (
        <div className="mt-3 rounded-lg overflow-hidden bg-white" style={{border:`2px solid #86efac`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:'#22a06b'}}>
            <span>📱</span>
            <span>Compose UI · collectAsStateWithLifecycle</span>
          </div>
          <div className="p-2 space-y-1">
            {ui.map((t, i) => (
              <div key={i} className="text-xs px-2 py-1 rounded" style={{background:'#dbf3e6', color:'#166534'}}>{t}</div>
            ))}
          </div>
        </div>
      );
    }

    function PitfallBox({ pitfalls }) {
      if (!pitfalls) return null;
      return (
        <div className="mt-3 space-y-1.5">
          {pitfalls.map((p, i) => (
            <div key={i} className="flex items-center gap-2 text-[11px]">
              <span className="px-2 py-1 rounded flex-1" style={{background:'#fee2e2', color:'#991b1b'}}>✗ {p.bad}</span>
              <span style={{color:'#d4c2ff'}}>→</span>
              <span className="px-2 py-1 rounded flex-1" style={{background:'#dbf3e6', color:'#166534'}}>✓ {p.fix}</span>
            </div>
          ))}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#3d2070'}}>DB 창고 → Flow 방송 → UI</h3>
            <span className="text-[10px] text-slate-500">코루틴이 DB에 접근, 변경 시 Flow 자동 방출</span>
          </div>
          <DbTable rows={state.rows} thread={state.thread} />
          <FlowStream emit={state.emit} />
          <UiList ui={state.ui} />
          <PitfallBox pitfalls={state.pitfalls} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(127,82,255,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f3eeff 0%,#e4d6ff 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>KT</span>
              <div>
                <div className="text-[11px] font-bold mb-0.5" style={{color:'#7F52FF'}}>Part IV. 안드로이드 · IV-2-1</div>
                <h1 className="text-2xl font-bold" style={{color:'#3d2070'}}>Room + 코루틴/Flow</h1>
                <p className="text-sm" style={{color:'#7F52FF'}}>로컬 DB를 타입 안전하게, 쿼리 결과를 Flow로 실시간 관찰</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#d4c2ff'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#7F52FFaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#3d2070'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Room 은 SQLite 를 타입 안전하게 감싸고 SQL 을 컴파일 타임에 검증한다. 일회성 접근은 suspend 로 IO 에 위임하고, 목록은 Flow 로 반환해 데이터가 바뀔 때마다 자동으로 새 리스트를 방출한다. ViewModel 에서 stateIn 으로 수집해 UI 로 흘리면 "다시 조회" 코드 없이 화면이 최신 상태를 유지한다. 남는 건 스레드와 데이터 양 — 이 둘만 지키면 크래시와 OOM 대부분을 예방한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kotlin', 'Room', 'Coroutine', 'Flow', 'suspend', 'StateFlow', 'Migration', 'Paging'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f3eeff', color:'#3d2070', border:'1px solid #d4c2ff'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
