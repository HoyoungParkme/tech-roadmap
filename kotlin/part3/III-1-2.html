  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">

</head>
<body>
  <div id="root"></div>
  <!--
    Kotlin III-1-2 — async/await 병렬 처리 (비유: 세 가지 음료를 동시에 주문)
    순차 호출 = 한 잔씩 직렬, async/await = 동시 주문 후 한꺼번에 수령
    5단계: 순차문제 → async 시작 → await 회수 → 예외 전파 → awaitAll/coroutineScope
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    const STEPS = [
      {
        title: 'Step 1. 순차 호출의 함정 — "한 잔 받고 다음 잔 주문"',
        desc: '3개의 외부 API 를 모두 호출해야 한다. 각각 100ms 가 걸린다. suspend 함수를 그냥 순서대로 호출하면? 100 + 100 + 100 = 300ms. 일시중단은 일어나지만, 다음 호출은 이전 결과를 기다린 뒤에야 시작된다. 카페에서 라떼 받은 뒤에야 아메리카노를 주문하는 것과 같다.',
        scene: 'sequential',
        bars: [
          { name: 'fetchUser',    start: 0,   width: 33, tone: 'a' },
          { name: 'fetchOrder',   start: 33,  width: 33, tone: 'b' },
          { name: 'fetchPayment', start: 66,  width: 34, tone: 'c' },
        ],
        total: '총 300ms (순차)',
        alert: { tone: 'warn', text: '독립적인 호출인데도 순차로 실행 — 시간 낭비.' },
        code: {
          lang: 'kotlin',
          filename: 'Sequential.kt',
          lines: [
            'suspend fun loadAll(userId: Long): Triple<User, Order, Payment> {',
            '    val user    = fetchUser(userId)        // 100ms 기다림',
            '    val order   = fetchOrder(userId)       // 100ms 더 기다림',
            '    val payment = fetchPayment(userId)     // 100ms 또 기다림',
            '    return Triple(user, order, payment)',
            '}',
            '',
            '// 총 300ms — 그런데 세 호출은 서로 독립적이다',
            '// "user 가 와야 order 를 시작할 수 있는" 의존성이 없음',
            '',
            '// 의존성이 있는 경우는 순차가 맞다',
            'suspend fun loadOrder(userId: Long): Order {',
            '    val user = fetchUser(userId)           // user 가 있어야',
            '    return fetchOrderForUser(user)         // order 를 조회 가능',
            '}',
          ],
          highlight: [1, 2, 3, 4, 5, 6, 8, 9, 11, 12, 13, 14, 15],
        },
      },
      {
        title: 'Step 2. async — "주문서 3장을 한꺼번에 던진다"',
        desc: 'async 빌더는 코루틴을 즉시 시작하고 Deferred<T> 를 반환한다. Deferred 는 "나중에 결과를 받을 약속(영수증 번호표)". 3개를 async 로 시작하면 세 작업이 동시에 진행된다. 카페에서 라떼, 아메리카노, 카푸치노를 한꺼번에 주문하고 번호표 3장을 받은 셈이다.',
        scene: 'async-start',
        bars: [
          { name: 'fetchUser',    start: 0, width: 100, tone: 'a' },
          { name: 'fetchOrder',   start: 0, width: 100, tone: 'b' },
          { name: 'fetchPayment', start: 0, width: 100, tone: 'c' },
        ],
        total: '세 호출이 동시에 시작 (await 전)',
        alert: { tone: 'info', text: 'async = 코루틴 시작. 결과는 Deferred — 영수증 번호표.' },
        code: {
          lang: 'kotlin',
          filename: 'AsyncStart.kt',
          lines: [
            'import kotlinx.coroutines.*',
            '',
            'suspend fun loadAll(userId: Long) = coroutineScope {',
            '    // 세 호출을 즉시 동시에 시작',
            '    val userDef:    Deferred<User>    = async { fetchUser(userId) }',
            '    val orderDef:   Deferred<Order>   = async { fetchOrder(userId) }',
            '    val paymentDef: Deferred<Payment> = async { fetchPayment(userId) }',
            '',
            '    // 이 시점에 세 작업이 백그라운드에서 동시에 진행 중',
            '    // userDef.await() 를 호출하지 않으면 결과를 꺼낼 수 없다',
            '}',
            '',
            '// async = "지금 시작해서 결과를 나중에 약속"',
            '// 반환 타입 Deferred<T> = "T 가 될 약속"',
          ],
          highlight: [3, 4, 5, 6, 7, 9, 10, 13, 14],
        },
      },
      {
        title: 'Step 3. await — "번호표를 들고 결과를 받으러 간다"',
        desc: 'await() 는 Deferred 의 결과가 준비될 때까지 일시중단한다. 세 await 을 차례로 호출해도, 코루틴들은 이미 동시에 진행 중이므로 가장 오래 걸리는 작업(max) 만큼만 걸린다. 100 + 100 + 100 = 300ms 가 max(100, 100, 100) = 100ms 로 줄어든다. 3배 빨라진다.',
        scene: 'await',
        bars: [
          { name: 'fetchUser',    start: 0, width: 33, tone: 'a' },
          { name: 'fetchOrder',   start: 0, width: 33, tone: 'b' },
          { name: 'fetchPayment', start: 0, width: 33, tone: 'c' },
        ],
        total: '총 100ms (병렬 — 3배 빠름)',
        alert: { tone: 'good', text: 'await = 결과 수령. 세 작업은 동시 진행 → 가장 긴 작업 시간만 든다.' },
        code: {
          lang: 'kotlin',
          filename: 'Await.kt',
          lines: [
            'suspend fun loadAll(userId: Long) = coroutineScope {',
            '    val userDef    = async { fetchUser(userId) }      // 100ms 시작',
            '    val orderDef   = async { fetchOrder(userId) }     // 100ms 시작',
            '    val paymentDef = async { fetchPayment(userId) }   // 100ms 시작',
            '',
            '    // 세 작업은 이미 동시에 진행 중',
            '    // await() 는 "다 끝났으면 결과 줘" — 일시중단 가능',
            '    val user    = userDef.await()',
            '    val order   = orderDef.await()',
            '    val payment = paymentDef.await()',
            '',
            '    Triple(user, order, payment)',
            '}',
            '',
            '// 총 시간 = max(100, 100, 100) = 100ms',
            '// 순차 300ms → 병렬 100ms (3배 향상)',
            '',
            '// 주의: async { ... }.await() 를 같은 줄에 쓰면 직렬이 된다',
            '// val u = async { fetchUser(id) }.await()  ← await 가 다음 시작을 막음',
          ],
          highlight: [2, 3, 4, 7, 8, 9, 10, 11, 15, 16, 18, 19],
        },
      },
      {
        title: 'Step 4. 예외 전파 — "한 잔이 떨어지면 전부 취소"',
        desc: 'async 안에서 예외가 발생하면 부모 스코프로 즉시 전파되고, 같은 스코프의 다른 자식 코루틴은 자동 취소된다. await() 에서 예외가 다시 throw 된다. 카페에서 라떼 만들다 실패하면 다른 음료 만드는 바리스타도 작업을 멈춘다 — 어차피 손님은 셋 다 받아야 했으므로 의미가 없다.',
        scene: 'exception',
        bars: [
          { name: 'fetchUser ✓',     start: 0,  width: 80,  tone: 'a' },
          { name: 'fetchOrder 💥',   start: 0,  width: 40,  tone: 'err' },
          { name: 'fetchPayment 취소', start: 40, width: 40,  tone: 'cancel' },
        ],
        total: '예외 발생 → 형제 코루틴 자동 취소',
        alert: { tone: 'danger', text: '하나가 깨지면 전부 취소 — "구조화된 동시성"의 핵심 보장.' },
        code: {
          lang: 'kotlin',
          filename: 'AsyncException.kt',
          lines: [
            'suspend fun loadAll(userId: Long) = coroutineScope {',
            '    val userDef    = async { fetchUser(userId) }',
            '    val orderDef   = async {',
            '        delay(40)',
            '        throw IOException("주문 조회 실패")    // 💥',
            '    }',
            '    val paymentDef = async { fetchPayment(userId) }',
            '',
            '    // orderDef 의 예외가 부모 스코프로 전파',
            '    // → userDef, paymentDef 도 자동으로 취소된다',
            '    val user    = userDef.await()',
            '    val order   = orderDef.await()      // 여기서 IOException 재발생',
            '    val payment = paymentDef.await()',
            '',
            '    Triple(user, order, payment)',
            '}',
            '',
            '// 호출하는 쪽',
            'try {',
            '    val r = loadAll(1)',
            '} catch (e: IOException) {',
            '    log.error("주문 조회 실패", e)',
            '}',
            '',
            '// 일부 실패만 허용하고 싶다면 supervisorScope 사용',
            '// (Step 5 의 awaitAll 도 보세요)',
          ],
          highlight: [3, 4, 5, 6, 9, 10, 11, 12, 13, 14, 25, 26, 27],
        },
      },
      {
        title: 'Step 5. awaitAll & coroutineScope — 깔끔한 병렬 패턴',
        desc: 'List<Deferred<T>>.awaitAll() 로 N 개의 작업을 한 번에 기다릴 수 있다. coroutineScope { ... } 는 안에서 시작한 코루틴이 모두 끝날 때까지 일시중단하는 안전한 스코프. supervisorScope 는 일부 실패를 허용하고 싶을 때 사용. 이 두 패턴을 익히면 대부분 병렬 시나리오를 해결할 수 있다.',
        scene: 'awaitAll',
        bars: [
          { name: 'item 1', start: 0, width: 25, tone: 'a' },
          { name: 'item 2', start: 0, width: 25, tone: 'b' },
          { name: 'item 3', start: 0, width: 25, tone: 'c' },
          { name: 'item 4', start: 0, width: 25, tone: 'a' },
        ],
        total: 'List<Deferred>.awaitAll() — N 개를 한 번에',
        wins: [
          'async + await = 독립 작업의 병렬화 (시간 단축)',
          'coroutineScope = "안에서 시작한 모든 코루틴 완료 보장"',
          'awaitAll = 컬렉션을 한꺼번에 await',
          'supervisorScope = 일부 실패 허용 (개별 try/catch)',
        ],
        alert: { tone: 'good', text: '병렬은 async, 안전한 경계는 coroutineScope — 두 짝으로 기억한다.' },
        code: {
          lang: 'kotlin',
          filename: 'AwaitAll.kt',
          lines: [
            'import kotlinx.coroutines.*',
            '',
            '// 1) N 개를 awaitAll',
            'suspend fun loadUsers(ids: List<Long>): List<User> = coroutineScope {',
            '    ids.map { id -> async { fetchUser(id) } }   // 모두 동시 시작',
            '       .awaitAll()                              // 모두 기다림',
            '}',
            '',
            '// 2) supervisorScope — 일부 실패 허용',
            'suspend fun loadUsersTolerant(ids: List<Long>): List<User?> =',
            '    supervisorScope {',
            '        ids.map { id ->',
            '            async {',
            '                try { fetchUser(id) }',
            '                catch (e: Exception) { null }   // 개별 실패는 null',
            '            }',
            '        }.awaitAll()',
            '    }',
            '',
            '// 3) 헷갈리지 말 것',
            '//   - coroutineScope:  자식 하나 실패 = 전체 취소 + 예외 재던짐',
            '//   - supervisorScope: 자식 실패 = 다른 자식은 계속, 개별 처리',
            '',
            '// 운영 팁',
            '//   "전부 성공해야 의미 있음" → coroutineScope',
            '//   "가능한 많이 모으기"     → supervisorScope + try/catch',
          ],
          highlight: [4, 5, 6, 7, 10, 11, 12, 13, 14, 15, 16, 17, 18, 20, 21, 22, 24, 25, 26],
        },
      },
    ];

    function GanttMock({ bars, total }) {
      const TONE = {
        a:      { bg: '#a78bfa' },
        b:      { bg: '#34d399' },
        c:      { bg: '#f59e0b' },
        err:    { bg: '#ef4444' },
        cancel: { bg: '#94a3b8' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>📊</span>
            <span>실행 타임라인 (0–100%)</span>
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-white/20">{total}</span>
          </div>
          <div className="p-3 space-y-2">
            {bars.map((b, i) => {
              const s = TONE[b.tone] || TONE.a;
              return (
                <div key={i} className="flex items-center gap-2 text-xs">
                  <span className="w-32 font-mono text-slate-700 truncate">{b.name}</span>
                  <div className="flex-1 relative h-5 bg-slate-100 rounded">
                    <div className="absolute h-5 rounded" style={{left:`${b.start}%`, width:`${b.width}%`, background:s.bg}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f5f0ff'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🟪</span>
            <span className="text-lg font-bold" style={{color:'#4c1d95'}}>병렬 처리 4가지 도구</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#4c1d95'}}>
                <span style={{color:BRAND}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f5f0ff', bd:'#ddd6fe', tx:'#5b21b6', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#4c1d95'}}>순차 vs 병렬 실행</h3>
            <span className="text-[10px] text-slate-500">scene</span>
          </div>
          <GanttMock bars={state.bars} total={state.total} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(127,82,255,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f5f0ff 0%,#e9d5ff 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>KT</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#4c1d95'}}>III-1-2. async와 await — 병렬 처리</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 세 가지 음료를 동시 주문 — 가장 오래 걸리는 잔만큼만 기다림</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#ddd6fe'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:BRAND}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#4c1d95'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                독립적인 비동기 호출은 async 로 동시에 시작하고, 결과를 awaitAll 로 한꺼번에 모은다. 예외는 부모 스코프로 전파되어 형제까지 자동 취소 — 이게 구조화된 동시성. 일부 실패를 허용하려면 supervisorScope. 다음에는 Flow 로 "여러 값이 시간 차로 흐르는" 시나리오를 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kotlin', '코루틴', 'async', 'await', 'awaitAll', '구조화된동시성'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f5f0ff', color:'#4c1d95', border:'1px solid #ddd6fe'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./III-1-1.html" className="underline hover:no-underline">← III-1-1</a>
              <a href="./III-2-1.html" className="underline hover:no-underline">다음: III-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
