<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotlin 학습 — I-1-2. null safety</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🟣</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    Kotlin I-1-2 — null safety (비유: 상자 안 내용물)
    String = 무조건 들어있다 / String? = 비어있을 수도 있다
    5단계: Java NPE 폭탄 → Kotlin 타입 분리 → ?. 안전 호출 → ?: 엘비스 → let/!! 실무
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    const STEPS = [
      {
        title: 'Step 1. Java 의 NPE — 모든 변수가 null 일 수 있다',
        desc: 'Java 는 모든 객체 참조가 null 일 수 있다. user.getName() 을 호출하기 전에는 user 가 null 인지 알 길이 없다. 그래서 어디서나 if (user != null) 방어 코드가 깔린다. 깜빡 한 줄이 NPE — Null Pointer Exception 으로 터진다. 이것이 Tony Hoare 가 "10억 달러의 실수" 라고 부른 그 문제다.',
        boxes: [
          { name: 'String name', label: '보장 없음', state: 'ambiguous' },
          { name: 'User user',   label: '? null 인지 모름', state: 'ambiguous' },
          { name: 'List items',  label: '? null 인지 모름', state: 'ambiguous' },
        ],
        alert: { tone: 'danger', text: 'Java 의 타입 시스템은 "null 일 수도 있다" 를 구분할 방법이 없다.' },
        code: {
          lang: 'kotlin',
          filename: 'java-style-npe.kt',
          lines: [
            '// Java 스타일 — 모든 참조가 null 가능',
            '// public String greet(User user) {',
            '//   return "Hello, " + user.getName();',
            '// }',
            '// greet(null);  // 💥 NullPointerException',
            '',
            '// 방어 코드가 코드의 30% 를 차지',
            '// if (user != null) {',
            '//   if (user.getProfile() != null) {',
            '//     if (user.getProfile().getName() != null) {',
            '//       return user.getProfile().getName();',
            '//     }',
            '//   }',
            '// }',
            '// return "(unknown)";',
            '',
            '// "한 곳만 깜빡 = 운영 장애" 가 일상이다',
          ],
          highlight: [1,2,3,4,5,7,8,9,10,11,12,13,14,15,17],
        },
      },
      {
        title: 'Step 2. Kotlin 의 분리 — String 과 String? 은 다른 타입',
        desc: 'Kotlin 은 타입 자체에 "null 가능성" 을 새긴다. String 은 null 이 절대 들어올 수 없다. String? 은 null 이 들어올 수 있다. 같은 String 자리에 null 을 대입하려 하면 컴파일러가 즉시 막는다. NPE 의 근본 원인 — "런타임에야 알 수 있다" — 가 사라진다.',
        boxes: [
          { name: 'val a: String',  label: '"hello" 보장', state: 'safe' },
          { name: 'val b: String?', label: '값 또는 null',  state: 'nullable' },
          { name: 'val c: String = null', label: '❌ 컴파일 에러', state: 'forbidden' },
        ],
        alert: { tone: 'good', text: 'String vs String? — 타입 한 글자(?) 가 모든 차이를 만든다.' },
        code: {
          lang: 'kotlin',
          filename: 'nullable-type.kt',
          lines: [
            '// 1) Non-null 타입 — null 자체가 들어올 수 없다',
            'val name: String = "Hoyoung"',
            '// val bad: String = null',
            '// → ❌ Null can not be a value of a non-null type String',
            '',
            '// 2) Nullable 타입 — null 이 들어올 수 있다',
            'val nickname: String? = null',
            '',
            '// 3) 함수 시그니처가 곧 명세',
            'fun greet(user: String): String = "Hello, $user"',
            '//                ^ null 절대 안 들어옴',
            '',
            'fun maybeName(): String? = null  // 호출자가 반드시 null 처리해야 함',
            '',
            '// 컴파일러가 강제',
            '// val n: String = maybeName()  // ❌ String? 를 String 에 못 넣는다',
          ],
          highlight: [1,2,3,4,6,7,9,10,11,13,15,16],
        },
      },
      {
        title: 'Step 3. ?. 안전 호출 — null 이면 그냥 null',
        desc: 'String? 을 다룰 때 가장 자주 쓰는 도구가 ?. (safe call). user?.name 은 "user 가 null 이면 전체 식이 null, 아니면 user.name 호출". 중첩되어도 자연스럽다. user?.profile?.address?.city — 어디 한 곳이라도 null 이면 그 자리에서 식이 null 로 종결.',
        boxes: [
          { name: 'user?.name',                  label: 'user=null → null',   state: 'safe' },
          { name: 'user?.profile?.address?.city', label: 'address=null → null', state: 'safe' },
          { name: 'list?.size',                  label: 'list=null → null',    state: 'safe' },
        ],
        alert: { tone: 'info', text: '?. 는 null 일 때 호출 자체를 건너뛴다. 결과 타입은 자동으로 nullable.' },
        code: {
          lang: 'kotlin',
          filename: 'safe-call.kt',
          lines: [
            'data class Address(val city: String)',
            'data class Profile(val address: Address?)',
            'data class User(val name: String, val profile: Profile?)',
            '',
            'val u: User? = User("Hoyoung", Profile(Address("Seoul")))',
            '',
            '// ?. — 안전 호출',
            'val name1: String? = u?.name             // "Hoyoung"',
            'val city1: String? = u?.profile?.address?.city  // "Seoul"',
            '',
            '// 어디 한 곳이라도 null 이면 식 전체가 null',
            'val u2: User? = null',
            'val name2: String? = u2?.name            // null (NPE 아님)',
            '',
            '// 자바의 if/else 5겹이 한 줄로 줄어든다',
            '// — 그리고 컴파일러가 "null 무시" 같은 실수를 막아준다',
          ],
          highlight: [1,2,3,5,7,8,9,11,12,13,15,16],
        },
      },
      {
        title: 'Step 4. ?: 엘비스 연산자 — null 일 때 기본값',
        desc: '?. 의 결과가 null 일 때 기본값을 주고 싶다 → ?: (Elvis 연산자, 엘비스 프레슬리의 헤어스타일을 닮았다). user?.name ?: "Guest" 는 "user.name 이 null 이면 \'Guest\' 사용". return / throw 와 결합해 "필수 값 없으면 에러" 도 한 줄로 표현 가능.',
        boxes: [
          { name: 'u?.name ?: "Guest"',             label: 'null → "Guest"',         state: 'safe' },
          { name: 'u?.age ?: 0',                    label: 'null → 0',                state: 'safe' },
          { name: 'id ?: throw IllegalState(...)',  label: 'null → 예외 던지기',      state: 'forbidden' },
        ],
        alert: { tone: 'info', text: '?: 는 "왼쪽이 null 이면 오른쪽" — 기본값/return/throw 어디든 쓴다.' },
        code: {
          lang: 'kotlin',
          filename: 'elvis.kt',
          lines: [
            '// 1) 기본값',
            'val name = user?.name ?: "Guest"',
            'val score = user?.score ?: 0',
            '',
            '// 2) return 과 결합 — 가드 패턴',
            'fun process(user: User?) {',
            '    val id = user?.id ?: return  // user 가 null 이면 즉시 종료',
            '    println("processing $id")',
            '}',
            '',
            '// 3) throw 와 결합 — 필수값 검증',
            'fun chargeCard(userId: Long?): Receipt {',
            '    val uid = userId ?: throw IllegalArgumentException("userId 필요")',
            '    return charge(uid)',
            '}',
            '',
            '// ?: 한 글자로 분기 한 단계가 사라진다',
          ],
          highlight: [1,2,3,5,6,7,8,9,11,12,13,14,15,17],
        },
      },
      {
        title: 'Step 5. let / !! — 안전한 블록, 그리고 마지막 비상구',
        desc: '?.let { ... } 는 "null 이 아니면 블록 실행". 변수에 일시 할당하면서 안전하게 사용. !! (non-null assertion) 은 "내가 책임진다, null 이면 NPE 던져라" — 극히 제한적으로만 사용. 실무 규칙: !! 는 PR 리뷰에서 거의 항상 빨간불.',
        boxes: [
          { name: '?.let { it.use() }',  label: 'null 아니면 블록 실행',      state: 'safe' },
          { name: 'name!!',              label: '@ null 이면 NPE — 최후 수단', state: 'forbidden' },
          { name: 'requireNotNull(x)',   label: 'null → IllegalArgumentException', state: 'forbidden' },
          { name: '체크리스트',           label: 'String? 도입 → ?. → ?: → !!금지', state: 'safe' },
        ],
        wins: [
          'NPE 가 컴파일 타임에 잡힌다 (런타임 사고 70%↓)',
          '?. ?: let 로 방어 코드가 짧고 명확해진다',
          '함수 시그니처가 곧 "null 가능 여부" 명세',
          '!! 는 PR 리뷰에서 잡는 마지막 빨간불',
        ],
        alert: { tone: 'good', text: '실무 규칙: ?. ?: let 으로 표현하고, !! 는 "정말 다른 방법이 없을 때" 만.' },
        code: {
          lang: 'kotlin',
          filename: 'let-and-bang.kt',
          lines: [
            '// 1) ?.let — null 아니면 블록 실행',
            'user?.let {',
            '    println("환영합니다, ${it.name}")',
            '    log.info("user_login id=${it.id}")',
            '}',
            '',
            '// 2) ?. + ?: 조합 (대부분의 실무 코드는 여기서 끝난다)',
            'val display: String = user?.nickname ?: user?.name ?: "Guest"',
            '',
            '// 3) requireNotNull / checkNotNull — 진입점 검증',
            'fun handle(req: Request) {',
            '    val userId = requireNotNull(req.userId) { "userId 필요" }',
            '    // 이후 userId 는 Long (non-null) 로 스마트 캐스트',
            '}',
            '',
            '// 4) !! 는 비상구',
            '// val name = user!!.name   // ⚠️ null 이면 NPE',
            '// PR 리뷰에서 "다른 방법 없나요?" 라는 질문을 받게 된다',
            '',
            '// 핵심 사고법: "null 일 수 있는가" 를 타입에 그대로 표현',
          ],
          highlight: [1,2,3,4,5,7,8,10,11,12,13,14,16,17,18,20],
        },
      },
    ];

    function BoxesMock({ boxes }) {
      const COLOR = {
        safe:      { bg:'#dbf3e6', tx:'#166534', ic:'✓' },
        nullable:  { bg:'#fef3c7', tx:'#92400e', ic:'?' },
        ambiguous: { bg:'#fee2e2', tx:'#991b1b', ic:'⚠' },
        forbidden: { bg:'#fecaca', tx:'#7f1d1d', ic:'✗' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>📦</span>
            <span>변수 상자 — 안에 무엇이 들어있나</span>
          </div>
          <div className="p-3 space-y-2">
            {boxes.map((b, i) => {
              const c = COLOR[b.state] || COLOR.ambiguous;
              return (
                <div key={i} className="flex items-center gap-2 text-xs">
                  <span className="w-6 text-center font-bold" style={{color:c.tx}}>{c.ic}</span>
                  <span className="w-48 font-mono font-bold" style={{color:'#3d2070'}}>{b.name}</span>
                  <span className="flex-1 font-mono px-2 py-0.5 rounded" style={{background:c.bg, color:c.tx}}>{b.label}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#f3eeff'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🟣</span>
            <span className="text-lg font-bold" style={{color:'#3d2070'}}>Kotlin null safety 가 푸는 문제</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#3d2070'}}>
                <span style={{color:BRAND}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#f3eeff', bd:'#d4c2ff', tx:'#3d2070', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#3d2070'}}>String vs String? — 타입의 분리</h3>
            <span className="text-[10px] text-slate-500">? = null 가능</span>
          </div>
          <BoxesMock boxes={state.boxes} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(127,82,255,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f3eeff 0%,#e4d6ff 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>KT</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#3d2070'}}>I-1-2. null safety</h1>
                <p className="text-sm" style={{color:'#7F52FF'}}>비유: 상자 안 내용물 — 보장된 값 vs 비어있을 수도 있는 값</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#d4c2ff'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#7F52FFaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#3d2070'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                NPE 는 "런타임에야 알 수 있다" 가 본질이다. Kotlin 은 String 과 String? 을 다른 타입으로 두어 컴파일러가 "null 가능성" 을 강제 추적한다. ?. ?: let 으로 안전하게 다루고, !! 는 마지막 비상구. 다음에는 if/else 와 switch 를 한 식으로 통합하는 when 을 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kotlin', 'null-safety', 'NPE', 'safe-call', 'Elvis', 'let'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f3eeff', color:'#3d2070', border:'1px solid #d4c2ff'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
