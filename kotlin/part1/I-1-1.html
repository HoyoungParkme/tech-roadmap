  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

<body>
  <div id="root"></div>
  <!--
    Kotlin I-1-1 — val vs var (비유: 자물쇠 vs 회전문)
    val = 한 번 잠그면 안 바뀐다 / var = 누구나 들락날락 가능
    5단계: 변수 기본 → var의 함정 → val의 안전 → 컬렉션 불변/가변 → 실무 기본값
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    const STEPS = [
      {
        title: 'Step 1. 변수 두 종류 — val 과 var',
        desc: 'Kotlin 의 변수는 두 키워드로 시작한다. val (value) 은 한 번 대입하면 다시 바꿀 수 없다 — 자물쇠가 채워진다. var (variable) 은 자유롭게 재할당 가능 — 회전문이다. Java 는 final 을 붙여야 불변, Kotlin 은 기본 사고가 반대다 — "기본은 잠금, 풀어야 할 때만 var".',
        cells: [
          { name: 'val name', value: '"Hoyoung"', locked: true },
          { name: 'val age',  value: '30',         locked: true },
          { name: 'var count', value: '0',         locked: false },
        ],
        attempts: [],
        alert: { tone: 'info', text: 'val = 잠긴 칸, var = 열린 칸. 컴파일러가 잠금을 강제한다.' },
        code: {
          lang: 'kotlin',
          filename: 'basics.kt',
          lines: [
            '// Kotlin 변수 — 키워드부터 의도를 드러낸다',
            'val name: String = "Hoyoung"   // 잠금 (재할당 불가)',
            'val age: Int = 30              // 잠금',
            'var count: Int = 0             // 열림 (재할당 가능)',
            '',
            '// 타입 추론 — 우변으로 충분하면 타입 생략',
            'val city = "Seoul"             // String 으로 추론',
            'var score = 0                  // Int 로 추론',
            '',
            '// Java 와 비교',
            '// final String name = "Hoyoung"; // val 과 동치',
            '// String city = "Seoul";          // var 과 동치 — 그러나 Java 는 기본이 가변',
            '',
            '// Kotlin 의 기본 사고: "기본은 val, 꼭 필요할 때만 var"',
          ],
          highlight: [1,2,3,5,6,7,12],
        },
      },
      {
        title: 'Step 2. var 의 함정 — 멀리서 누군가 바꾼다',
        desc: 'var 로 둔 변수는 어디서든 재할당 가능하다. 함수가 깊게 호출되면 "이 값이 지금 무엇인가" 를 추적하기 어렵다. 멀티스레드에서는 더 심각하다. var 가 곳곳에 깔린 코드는 시간이 갈수록 "동시 수정 버그" 가 쌓인다. 이것이 Java 코드에서 흔히 보던 디버깅의 늪이다.',
        cells: [
          { name: 'var balance', value: '1,000', locked: false },
          { name: 'var balance', value: '800',   locked: false },
          { name: 'var balance', value: '???',   locked: false },
        ],
        attempts: [
          { who: 'thread A', op: 'balance -= 200', ok: true },
          { who: 'thread B', op: 'balance += 500', ok: true },
          { who: '결과',    op: '1,000 또는 1,300 ?', ok: false },
        ],
        alert: { tone: 'danger', text: 'var 는 누구든 바꿀 수 있다. 동시 수정에서 결과가 비결정적이다.' },
        code: {
          lang: 'kotlin',
          filename: 'mutable-trap.kt',
          lines: [
            '// 가변 변수 — 멀리서 바뀔 수 있다',
            'class Account {',
            '    var balance: Int = 1_000   // 누가 언제 바꿀지 모른다',
            '}',
            '',
            '// 두 스레드가 동시에 다른 메서드를 호출',
            'val a = Account()',
            '',
            '// Thread A 에서',
            'a.balance = a.balance - 200',
            '',
            '// Thread B 에서 (거의 동시에)',
            'a.balance = a.balance + 500',
            '',
            '// 최종 balance = ?',
            '//   1,000 또는 1,300 또는 그 중 무엇이든',
            '//   순서가 보장되지 않는다 (race condition)',
            '',
            '// "디버깅이 안 된다" 의 시작',
          ],
          highlight: [1,2,3,9,10,12,13,15,16,17,18],
        },
      },
      {
        title: 'Step 3. val 의 안전 — 컴파일러가 막아준다',
        desc: '같은 코드를 val 로 모델링하면? balance 가 한 번 대입된 후 변하지 않는다. 잔액이 바뀌어야 한다면 "새 Account 인스턴스를 만든다" 로 표현한다. 코드가 늘어나는 게 아니라 "변화 시점이 분명해진다". 컴파일러가 모든 재할당 시도를 막아준다 — 런타임 race condition 자체가 사라진다.',
        cells: [
          { name: 'val balance₁', value: '1,000', locked: true },
          { name: 'val balance₂', value: '800',   locked: true },
          { name: 'val balance₃', value: '1,300', locked: true },
        ],
        attempts: [
          { who: '컴파일러', op: 'a.balance = … // ✗ Val cannot be reassigned', ok: false },
          { who: '대안',    op: 'a.copy(balance = 800)', ok: true },
        ],
        alert: { tone: 'good', text: 'val 은 "변화" 를 새 인스턴스로 표현한다. 동시성 버그가 원천 차단된다.' },
        code: {
          lang: 'kotlin',
          filename: 'immutable-safe.kt',
          lines: [
            '// 불변 모델링',
            'data class Account(val balance: Int)',
            '',
            'val a1 = Account(balance = 1_000)',
            '// a1.balance = 800',
            '// → ❌ Val cannot be reassigned',
            '',
            '// "변화" 는 새 인스턴스로 표현',
            'val a2 = a1.copy(balance = a1.balance - 200)  // 800',
            'val a3 = a2.copy(balance = a2.balance + 500)  // 1,300',
            '',
            '// 두 스레드가 동시에 호출해도',
            '// 각자 자기 결과만 받는다 — 공유 가변 상태가 없다',
            '',
            '// "Kotlin 에서 데이터는 불변이 기본" — 이 한 줄이 동시성 버그의 큰 부분을 없앤다',
          ],
          highlight: [1,2,4,5,6,8,9,10,12,13,15],
        },
      },
      {
        title: 'Step 4. 컬렉션도 불변/가변 분리 — List vs MutableList',
        desc: 'val 로 선언해도, 가리키는 컬렉션 자체가 가변이면 내부 원소는 바뀐다. Kotlin 은 인터페이스 레벨에서 분리해 둔다: List (읽기 전용), MutableList (수정 가능). val list: List<Int> = mutableListOf(1,2) 도 가능 — 변수는 재할당 불가, 그러나 캐스팅 시 원소 추가 가능. 진짜 안전은 listOf(...) 처럼 불변 컬렉션을 쓰는 것.',
        cells: [
          { name: 'val nums = listOf(1,2,3)',         value: 'List<Int> — add() 없음',          locked: true },
          { name: 'val xs   = mutableListOf(1,2,3)',  value: 'MutableList<Int> — xs.add(4) ✓', locked: false },
          { name: 'val ys: List<Int> = mutableListOf(1,2,3)', value: '겉은 List, 속은 mutable — 캐스팅 위험', locked: false },
        ],
        attempts: [
          { who: 'nums.add(4)', op: '❌ 컴파일 에러 — List 에는 add 없음', ok: false },
          { who: 'xs.add(4)',   op: '✓ [1,2,3,4]', ok: true },
        ],
        alert: { tone: 'warn', text: 'val 은 변수 자체의 잠금. 컬렉션 원소의 잠금은 List(읽기 전용)/MutableList 선택이 정한다.' },
        code: {
          lang: 'kotlin',
          filename: 'collections.kt',
          lines: [
            '// 1) 불변 컬렉션 — 가장 안전한 기본값',
            'val nums = listOf(1, 2, 3)            // List<Int>',
            '// nums.add(4)                        // ❌ Unresolved reference',
            '',
            '// 2) 가변 컬렉션 — 명시적으로 필요할 때만',
            'val xs = mutableListOf(1, 2, 3)       // MutableList<Int>',
            'xs.add(4)                             // ✓ [1,2,3,4]',
            '',
            '// 3) 함수 매개변수도 List 로 선언 — 호출자가 가변/불변 어느 쪽을 줘도 안전',
            'fun sum(xs: List<Int>): Int = xs.sum()',
            '',
            '// 4) 변환은 항상 새 컬렉션',
            'val doubled = nums.map { it * 2 }     // List<Int> [2,4,6]',
            '// nums 자체는 그대로',
            '',
            '// 핵심: "공개되는 곳은 List, 내부에서만 MutableList"',
          ],
          highlight: [1,2,3,5,6,7,9,10,12,13,15],
        },
      },
      {
        title: 'Step 5. 실무 기본값 — val 먼저, var 는 명백할 때만',
        desc: '코틀린 공식 스타일 가이드와 거의 모든 실무 팀의 합의: 기본은 val, 진짜 재할당이 필요할 때만 var. 컬렉션은 List 먼저, 추가/삭제가 명확할 때만 MutableList. data class 는 모든 프로퍼티를 val 로 두고 변화는 copy() 로. 이 세 줄짜리 규칙이 NPE 와 동시성 버그의 큰 부분을 막는다.',
        cells: [
          { name: '✓ val 기본',          value: '재할당 자체가 필요한지 먼저 묻는다', locked: true },
          { name: '✓ List 기본',         value: '읽기 전용이 디폴트, MutableList 는 예외', locked: true },
          { name: '✓ data class + copy', value: '"변화" 를 새 인스턴스로 표현', locked: true },
          { name: '✗ var 남용',          value: '디버깅과 동시성 문제의 근원', locked: false },
        ],
        attempts: [],
        wins: [
          'val 기본 → 재할당 시점이 줄어 디버깅이 쉽다',
          'val + copy → 불변 데이터로 동시성 안전',
          'List(읽기 전용) → 외부에 새는 가변 상태 차단',
          'IDE 가 var → val 로 자동 변환 제안 (실제로 매우 자주 발생)',
        ],
        alert: { tone: 'good', text: '"기본은 val" — 이 한 줄을 지키면 Kotlin 의 안전성 절반을 가진다.' },
        code: {
          lang: 'kotlin',
          filename: 'best-practice.kt',
          lines: [
            '// ✗ 안티 패턴 — Java 습관 그대로',
            'var name: String = "A"',
            'var users: MutableList<String> = mutableListOf()',
            'fun rename(newName: String) { name = newName }',
            '',
            '// ✓ Kotlin 스타일',
            'data class User(val id: Long, val name: String, val email: String)',
            '',
            'class UserRepository {',
            '    private val users = mutableListOf<User>()  // 내부만 가변',
            '    fun all(): List<User> = users.toList()     // 외부엔 읽기 전용',

            '// 체크리스트',
            '//   ✓ val 먼저',

    function CellsMock({ cells, attempts }) {

          <div className="p-3 space-y-2">

              <div key={i} className="flex items-center gap-2 text-xs">

      return (

    const ALERT_STYLE = {
      info:   { bg:'#f3eeff', bd:'#d4c2ff', tx:'#3d2070', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#3d2070'}}>val(자물쇠) vs var(회전문)</h3>
            <span className="text-[10px] text-slate-500">잠금 = 컴파일러 강제</span>
          </div>
          <CellsMock cells={state.cells} attempts={state.attempts} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(127,82,255,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#f3eeff 0%,#e4d6ff 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>KT</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#3d2070'}}>I-1-1. val vs var</h1>
                <p className="text-sm" style={{color:'#7F52FF'}}>비유: 자물쇠(val) vs 회전문(var) — 누가 들어가서 바꾸느냐</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#d4c2ff'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#7F52FFaa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#3d2070'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Kotlin 의 첫 줄은 키워드부터 의도를 드러낸다. val 은 "이 값은 바뀌지 않는다" 라는 약속, var 는 "여기서는 바뀐다" 라는 명시. 기본을 val 로 두는 한 줄 규칙이 동시성 버그와 디버깅 시간을 큰 폭으로 줄인다. 다음에는 또 다른 NPE 의 늪을 어떻게 닫는지 — null safety 를 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kotlin', 'val', 'var', '불변성', 'data class', 'List vs MutableList'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#f3eeff', color:'#3d2070', border:'1px solid #d4c2ff'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
