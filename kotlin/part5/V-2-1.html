  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!--
    Kotlin V-2-1 — 코루틴 운영: 취소와 예외
    협력적 취소(isActive/ensureActive/yield) · CancellationException은 정상 흐름
    구조적 동시성(자식 실패 → 부모 취소 → 형제 취소) vs SupervisorJob(형제 격리)
    5단계: 협력적 취소 → 취소 예외 정리 → 예외 전파 → 형제 격리 → 실무 정리
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#7F52FF';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      c1: {lang:'kotlin', filename:'cooperative-cancel.kt', lines:[
            'import kotlinx.coroutines.*',
            '',
            'fun main() = runBlocking {',
            '    val job = launch(Dispatchers.Default) {',
            '        var i = 0',
            '        // 취소를 무시하는 루프 — 정지 지점이 없다',
            '        while (i < 1_000_000) {',
            '            heavyCompute(i)   // 취소 확인 안 함 → 끝까지 돈다',
            '            i++',
            '        }',
            '    }',
            '    delay(50)',
            '    job.cancelAndJoin()       // 취소 요청 후 종료 대기',
            '',
            '    // 해결 — 루프에 취소 지점을 넣는다',
            '    val safe = launch(Dispatchers.Default) {',
            '        var i = 0',
            '        while (isActive) {     // 취소되면 false → 협력적 종료',
            '            heavyCompute(i)',
            '            i++',
            '            if (i % 1000 == 0) ensureActive()  // 즉시 예외로 중단',
            '        }',
            '    }',
            '    delay(50)',
            '    safe.cancelAndJoin()',
            '    // => safe 는 즉시 멈추고, 첫 job 은 계산이 끝나야 멈춘다',
            '}',
      ]},
      c2: {lang:'kotlin', filename:'cancellation-cleanup.kt', lines:[
            'import kotlinx.coroutines.*',
            '',
            '// 안티 패턴 — 취소 신호를 삼켜 코루틴이 안 죽는다',
            'suspend fun badWork() {',
            '    try {',
            '        while (true) { delay(100); poll() }',
            '    } catch (e: Exception) {   // CancellationException 까지 잡힘',
            '        log("무시")            // => 취소가 무효화 → 누수',
            '    }',
            '}',
            '',
            '// 올바른 정리 — finally + NonCancellable',
            'suspend fun goodWork() {',
            '    val conn = openConnection()',
            '    try {',
            '        while (true) { delay(100); poll() }',
            '    } catch (e: CancellationException) {',
            '        throw e                // 취소는 반드시 다시 던진다',
            '    } finally {',
            '        withContext(NonCancellable) {',
            '            conn.flush()       // 취소된 스코프에서도 정지 함수 실행',
            '            conn.close()',
            '        }',
            '        // => 자원 정리 후 CancellationException 이 계속 전파',
            '    }',
            '}',
      ]},
      c3: {lang:'kotlin', filename:'exception-propagation.kt', lines:[
            'import kotlinx.coroutines.*',
            '',
            'suspend fun loadScreen() = coroutineScope {',
            '    val user  = async { loadUser() }',
            '    val posts = async { loadPosts() }  // 여기서 IOException',
            '    val ads   = async { loadAds() }',
            '',
            '    // posts 가 실패하면:',
            '    //   1) 예외가 부모(coroutineScope)로 전파',
            '    //   2) 부모가 취소되며 user·ads 도 함께 취소',
            '    //   3) await() 호출부에서 예외가 다시 던져진다',
            '    UiState(user.await(), posts.await(), ads.await())',
            '}',
            '',
            'suspend fun main() {',
            '    try {',
            '        loadScreen()',
            '    } catch (e: IOException) {',
            '        // => posts 실패 하나로 화면 전체 로딩이 무너진다',
            '        showError(e)',
            '    }',
            '}',
      ]},
      c4: {lang:'kotlin', filename:'supervisor-isolation.kt', lines:[
            'import kotlinx.coroutines.*',
            '',
            'suspend fun loadScreen() = supervisorScope {',
            '    val handler = CoroutineExceptionHandler { _, e ->',
            '        log("위젯 실패: ${e.message}")  // 자식이 직접 처리',
            '    }',
            '',
            '    launch(handler) { renderUser(loadUser()) }',
            '    launch(handler) { renderPosts(loadPosts()) }  // 실패해도',
            '    launch(handler) { renderAds(loadAds()) }      // 나머지는 산다',
            '',
            '    // async 를 쓸 땐 await 를 try/catch 로 감싼다',
            '    val ads = async { loadAds() }',
            '    val adResult = try { ads.await() } catch (e: Exception) { null }',
            '    // => posts 하나만 비고, user·ads 는 정상 렌더링',
            '}',

               caption:'스코프가 취소되면 그 안의 코루틴도 전부 정리된다. 누수 없이 끝나는 것이 운영 코루틴의 목표다.',
               changes:[{mark:'changed', text:'scope 취소 → 코루틴 전부 정리'},
                        {mark:'gone', text:'코루틴 누수'}] },
        tree: {
          root: { label: '운영 코루틴 3원칙', status: 'running', note: '취소=협력 · 취소예외=정상 · 전파=스코프가 결정' },
          arrow: '아래는 리뷰에서 반드시 잡아야 할 4대 함정',
          children: [
            { label: 'catch 로 취소 예외 삼킴', status: 'done', note: 'CancellationException 을 먼저 rethrow' },
            { label: 'GlobalScope 남용', status: 'done', note: '구조적 스코프로 교체 완료' },
            { label: 'isActive 미확인 무한 루프', status: 'done', note: 'ensureActive()·yield() 로 취소 지점 주입' },
            { label: 'async 예외 유실', status: 'done', note: 'await 로 반드시 결과를 받는다' },
          ],
        },
        wins: [
          '기본은 val 스코프 — GlobalScope 대신 viewModelScope·lifecycleScope',
          '순수 계산 루프엔 ensureActive() 또는 yield() 로 취소 지점 주입',
          'CancellationException 은 잡았으면 rethrow, 정리는 finally + NonCancellable',
          '형제 독립이면 supervisorScope, 전부 실패해야 하면 coroutineScope',
        ],
        alert: { tone: 'good', text: '취소=협력, 취소예외=정상, 전파=스코프가 결정. 이 세 줄이 운영 코루틴의 핵심이다.' },
        code:{...CODE.c5, highlight:[24]},
      },
    ];

    const NODE_STYLE = {
      running:    { bg: '#f3eeff', bd: '#7F52FF', tx: '#3d2070', icon: '▶', label: '실행 중' },
      cancelling: { bg: '#fef3c7', bd: '#f59e0b', tx: '#92400e', icon: '⏳', label: '취소 진행' },
      cancelled:  { bg: '#f1f5f9', bd: '#94a3b8', tx: '#475569', icon: '⊗', label: '취소됨' },
      failed:     { bg: '#fee2e2', bd: '#ef4444', tx: '#991b1b', icon: '✗', label: '실패' },
      done:       { bg: '#dbf3e6', bd: '#22c55e', tx: '#166534', icon: '✓', label: '완료' },
      ignoring:   { bg: '#fee2e2', bd: '#ef4444', tx: '#991b1b', icon: '∞', label: '취소 무시' },
    };

    function TreeNode({ node, wide }) {
      const s = NODE_STYLE[node.status] || NODE_STYLE.running;
      return (
        <div className={`rounded-lg px-3 py-2 ${wide ? 'w-full' : 'flex-1 min-w-0'}`} style={{ background: s.bg, border: `2px solid ${s.bd}` }}>
          <div className="flex items-center gap-1.5">
            <span className="text-sm" style={{ color: s.tx }}>{s.icon}</span>
            <span className="font-mono text-[11px] font-bold truncate" style={{ color: s.tx }}>{node.label}</span>
            <span className="ml-auto text-[9px] px-1.5 py-0.5 rounded-full" style={{ background: s.bd, color: '#fff' }}>{s.label}</span>
          </div>
          {node.note && <div className="mt-1 text-[10px] leading-snug" style={{ color: s.tx }}>{node.note}</div>}
        </div>
      );
    }

    function TreeMock({ tree }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{ border: `2px solid ${BRAND}` }}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{ background: BRAND }}>
            <span>🌳</span>
            <span>코루틴 트리 — 취소·예외 전파</span>
          </div>
          <div className="p-3 space-y-2">
            <TreeNode node={tree.root} wide />
            <div className="flex items-center gap-2 text-[10px] font-bold py-0.5" style={{ color: BRAND }}>
              <span className="flex-1 h-px" style={{ background: '#d4c2ff' }}></span>
              <span>↓ {tree.arrow}</span>
              <span className="flex-1 h-px" style={{ background: '#d4c2ff' }}></span>
            </div>
            <div className="flex flex-col sm:flex-row gap-2">
              {tree.children.map((c, i) => (
                <TreeNode key={i} node={c} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{ border: `2px solid ${BRAND}`, background: '#f3eeff' }}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🟣</span>
            <span className="text-lg font-bold" style={{ color: '#3d2070' }}>운영 코루틴 — 실무 기본기</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{ color: '#3d2070' }}>
                <span style={{ color: BRAND }}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#f3eeff', bd: '#d4c2ff', tx: '#3d2070', icon: '💡' },
      warn:   { bg: '#fef3c7', bd: '#fde68a', tx: '#92400e', icon: '⚠️' },
      danger: { bg: '#fee2e2', bd: '#fecaca', tx: '#991b1b', icon: '🚨' },
      good:   { bg: '#dbf3e6', bd: '#86efac', tx: '#166534', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{ background: s.bg, border: `1px solid ${s.bd}`, color: s.tx }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{ border: `1px solid ${BRAND}` }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#3d2070' }}>취소는 아래로, 예외는 위로</h3>
            <span className="text-[10px] text-slate-500">구조적 동시성 vs Supervisor</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <TreeMock tree={state.tree} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? { background: 'rgba(127,82,255,0.18)', borderLeft: `2px solid ${BRAND}` } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg,#f3eeff 0%,#e4d6ff 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ background: BRAND }}>KT</span>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="px-2 py-0.5 rounded text-[10px] font-bold text-white" style={{ background: '#3d2070' }}>Part V. 실전</span>
                  <span className="px-2 py-0.5 rounded text-[10px] font-bold" style={{ background: '#d4c2ff', color: '#3d2070' }}>V-2-1</span>
                </div>
                <h1 className="text-2xl font-bold mt-1" style={{ color: '#3d2070' }}>코루틴 운영 — 취소와 예외</h1>
                <p className="text-sm" style={{ color: '#7F52FF' }}>프로덕션 코루틴의 핵심, 협력적 취소와 구조적 예외 처리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ background: i <= stepIdx ? BRAND : '#d4c2ff' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{ background: BRAND }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ background: BRAND }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#7F52FFaa' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{ border: `2px solid ${BRAND}`, color: '#3d2070' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                코루틴 운영의 전부는 세 줄이다. 취소는 강제 종료가 아니라 협력이며(isActive·ensureActive), CancellationException 은 삼키지 말아야 할 정상 신호이고, 예외 전파 범위는 coroutineScope(전원 취소)냐 supervisorScope(형제 격리)냐가 정한다. GlobalScope 대신 구조적 스코프를 쓰면 누수가 사라진다. 다음에는 Flow 로 넘어가 스트림을 다룬다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kotlin', 'Coroutine', '협력적 취소', 'CancellationException', '구조적 동시성', 'SupervisorJob', 'CoroutineExceptionHandler'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{ background: '#f3eeff', color: '#3d2070', border: '1px solid #d4c2ff' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
