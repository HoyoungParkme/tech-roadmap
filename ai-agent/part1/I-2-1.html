  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-2-1. Agent 아키텍처 전체 지도
    학습 목표: User → Agent Core(LLM) → Tools / Memory → Output 흐름을 5단계로 이해한다.
    핵심 비유: 회사의 사장 — 비서(User 입력) → 사장(Core 판단) → 도구함(Tools) + 수첩(Memory) → 결과 보고
    패턴: fastapi v1 — 좌(LiveDataPane: 5 컴포넌트 다이어그램 + 화살표) / 우(VSCode CodeViewer 5탭)
    색상: ai-agent amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5개 컴포넌트 정의 — 위치/라벨 고정
    //   id 기준으로 step별 active / 흐름선이 그려짐
    // ─────────────────────────────────────────────────────
    const COMPONENTS = [
      { id: 'user',   icon: '👤', label: 'User',         sub: '사용자 질문',          x: 70,  y: 130 },
      { id: 'core',   icon: '🧠', label: 'Agent Core',   sub: 'LLM + Prompt',        x: 270, y: 130 },
      { id: 'tools',  icon: '🔧', label: 'Tools',        sub: 'Search / DB / API',   x: 470, y: 60  },
      { id: 'memory', icon: '📝', label: 'Memory',       sub: 'Short + Long-term',    x: 470, y: 200 },
      { id: 'output', icon: '📤', label: 'Output',       sub: '응답 / 외부 작업',     x: 670, y: 130 },
    ];

    // 데이터 흐름 선 — step 별 active 화살표
    //   from → to 방향, label 은 화살표 중간에 표시됨
    const FLOWS = [
      { id: 'u-c',  from: 'user',   to: 'core',   label: 'request' },
      { id: 'c-t',  from: 'core',   to: 'tools',  label: 'tool_call' },
      { id: 't-c',  from: 'tools',  to: 'core',   label: 'tool_result', curved: true },
      { id: 'c-m',  from: 'core',   to: 'memory', label: 'read/write' },
      { id: 'm-c',  from: 'memory', to: 'core',   label: 'context', curved: true },
      { id: 'c-o',  from: 'core',   to: 'output', label: 'response' },
    ];

    // ─────────────────────────────────────────────────────
    // STEPS — 단계별 active 컴포넌트 + active 흐름선 + 코드 파일
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      user1: {lang:"python", filename:"user.py", lines:[
        "\"\"\"사용자 입력 진입점 (FastAPI 라우터).",
        "",
        "경로: app/routers/user.py",
        "목적: 사용자 자연어 → AgentCore 로 전달",
        "\"\"\"",
        "from fastapi import APIRouter, Depends",
        "from pydantic import BaseModel",
        "from app.services.core import AgentCore",
        "",
        "router = APIRouter(prefix=\"/agent\", tags=[\"agent\"])",
        "",
        "",
        "class ChatRequest(BaseModel):",
        "    session_id: str",
        "    message: str   # 사용자 자연어 입력",
        "",
        "",
        "class ChatResponse(BaseModel):",
        "    answer: str",
        "    used_tools: list[str] = []",
        "",
        "",
        "@router.post(\"/chat\", response_model=ChatResponse)",
        "async def chat(",
        "    req: ChatRequest,",
        "    core: AgentCore = Depends(AgentCore),",
        ") -> ChatResponse:",
        "    \"\"\"사용자 메시지 1건을 Agent Core 에 위임.",
        "",
        "    Args:",
        "        req: session_id + 사용자 자연어",
        "    Returns:",
        "        Agent 가 만든 최종 응답",
        "    \"\"\"",
        "    result = await core.run(req.session_id, req.message)",
        "    return ChatResponse(",
        "        answer=result.answer,",
        "        used_tools=result.used_tools,",
        "    )",
      ]},
      core2: {lang:"python", filename:"core.py", lines:[
        "\"\"\"Agent Core — LLM 추론 + Tool 호출 루프.",
        "",
        "경로: app/services/core.py",
        "목적: ReAct 루프 (Reason → Act → Observe → Reason ...)",
        "\"\"\"",
        "from openai import AsyncOpenAI",
        "from app.services.tools import ToolRegistry",
        "from app.services.memory import MemoryStore",
        "",
        "",
        "SYSTEM_PROMPT = \"\"\"너는 출장 준비를 돕는 AI Agent 다.",
        "필요하면 도구(search_web, query_db, call_api)를 사용해라.",
        "도구가 필요 없으면 바로 답해라.\"\"\"",
        "",
        "",
        "class AgentCore:",
        "    \"\"\"LLM + Tool 호출을 한 사이클로 묶는 추론 엔진.\"\"\"",
        "",
        "    def __init__(self):",
        "        self.llm = AsyncOpenAI()",
        "        self.tools = ToolRegistry()",
        "        self.memory = MemoryStore()",
        "",
        "    async def run(self, session_id: str, message: str):",
        "        \"\"\"ReAct 루프 — 도구 호출이 끝날 때까지 반복.\"\"\"",
        "        # 1) Memory 에서 이전 컨텍스트 로드",
        "        history = await self.memory.load(session_id)",
        "",
        "        # 2) LLM 입력 메시지 구성",
        "        messages = [",
        "            {\"role\": \"system\", \"content\": SYSTEM_PROMPT},",
        "            *history,",
        "            {\"role\": \"user\", \"content\": message},",
        "        ]",
        "",
        "        # 3) ReAct 루프 (max 5 step)",
        "        used = []",
        "        for _ in range(5):",
        "            resp = await self.llm.chat.completions.create(",
        "                model=\"gpt-4o-mini\",",
        "                messages=messages,",
        "                tools=self.tools.schemas(),",
        "            )",
        "            choice = resp.choices[0].message",
        "            if not choice.tool_calls:",
        "                break  # 더 부를 도구 없음 → 답 완성",
        "            # 도구 호출 + 결과 추가는 다음 단계",
        "            used += await self._exec_tools(choice, messages)",
        "",
        "        return RunResult(answer=choice.content, used_tools=used)",
      ]},

        "\"\"\"도구 레지스트리 — Agent 가 부를 수 있는 함수 모음.",

        "\"\"\"",
        "import httpx",
        "from typing import Any",
        "",
        "",
        "class ToolRegistry:",
        "    \"\"\"OpenAI tool calling 스펙용 함수 레지스트리.\"\"\"",
        "    def __init__(self):",
        "        self._tools = {",

        "        \"\"\"LLM 에게 보낼 도구 스펙 (JSON Schema).\"\"\"",
        "        return [",
        "            {\"type\": \"function\", \"function\": {",
        "                \"name\": \"search_web\",",
        "                \"description\": \"웹 검색 — 최신 정보가 필요할 때\",",
        "                \"parameters\": {\"type\": \"object\", \"properties\": {",
        "                    \"query\": {\"type\": \"string\"}}}}},",
        "            {\"type\": \"function\", \"function\": {",
        "                \"name\": \"query_db\",",
        "                \"description\": \"사내 DB 조회\",",
        "                \"parameters\": {\"type\": \"object\", \"properties\": {",
        "                    \"sql\": {\"type\": \"string\"}}}}},",
        "        ]",
        "    async def dispatch(self, name: str, args: dict) -> Any:",
        "        return await self._tools[name](**args)",
        "",
        "    # ── 실제 도구 구현 ─────────────────────────────",
        "    async def search_web(self, query: str) -> dict:",
        "        async with httpx.AsyncClient() as cli:",
        "            r = await cli.get(\"https://api.search/q\",",
        "                              params={\"q\": query})",

        "    async def query_db(self, sql: str) -> list[dict]:",
        "        # asyncpg/SQLAlchemy 로 안전 실행 (예시)",
        "        return [{\"city\": \"Busan\", \"rain_pct\": 60}]",

        "    async def call_api(self, url: str, payload: dict) -> dict:",

      memory4: {lang:"python", filename:"memory.py", lines:[
        "\"\"\"Agent Memory — 단기(세션) + 장기(벡터) 이중 저장소.",
        "",
        "경로: app/services/memory.py",
        "목적: 대화 컨텍스트 유지 + 과거 정보 검색",
        "\"\"\"",
        "import redis.asyncio as redis",
        "import json",
        "from openai import AsyncOpenAI",
        "",
        "",
        "class MemoryStore:",
        "    \"\"\"Short-term(Redis) + Long-term(벡터 DB) 통합.\"\"\"",
        "",
        "    def __init__(self):",
        "        self.short = redis.from_url(\"redis://localhost\")",
        "        self.embedder = AsyncOpenAI()",
        "        # 실제론 Pinecone/Qdrant/pgvector — 여기선 인메모리",
        "        self.long: list[tuple[list[float], str]] = []",
        "",
        "    # ── Short-term: 세션 대화 ──────────────────",
        "    async def load(self, session_id: str) -> list[dict]:",
        "        \"\"\"현재 세션의 최근 N 턴 로드.\"\"\"",
        "        raw = await self.short.lrange(f\"chat:{session_id}\", -20, -1)",
        "        return [json.loads(r) for r in raw]",
        "",
        "    async def append(self, session_id: str, msg: dict) -> None:",
        "        \"\"\"새 메시지를 세션 히스토리에 push.\"\"\"",
        "        await self.short.rpush(",
        "            f\"chat:{session_id}\", json.dumps(msg))",
        "",
        "    # ── Long-term: 벡터 검색 ────────────────────",
        "    async def remember(self, text: str) -> None:",
        "        \"\"\"중요 정보를 임베딩으로 영구 저장.\"\"\"",
        "        vec = await self._embed(text)",
        "        self.long.append((vec, text))",
        "",
        "    async def recall(self, query: str, k: int = 3) -> list[str]:",
        "        \"\"\"과거 정보 중 질문과 유사한 top-k 회수.\"\"\"",
        "        qv = await self._embed(query)",
        "        scored = [(self._cos(qv, v), t) for v, t in self.long]",
        "        scored.sort(reverse=True)",
        "        return [t for _, t in scored[:k]]",
        "",
        "    async def _embed(self, text: str) -> list[float]:",
        "        r = await self.embedder.embeddings.create(",
        "            model=\"text-embedding-3-small\", input=text)",
        "        return r.data[0].embedding",
        "",
        "    @staticmethod",
        "    def _cos(a: list[float], b: list[float]) -> float:",
        "        # 코사인 유사도 (실전은 numpy/벡터DB 가 처리)",
        "        dot = sum(x * y for x, y in zip(a, b))",
        "        return dot  # 정규화 생략",
      ]},

        "    answer: str            # 사용자에게 보낼 텍스트",

        "    side_effects: list[dict] = None  # 외부 작업 로그",

        "",
        "class OutputHandler:",
        "    \"\"\"최종 답변 생성 + 부수효과 도구 실행.\"\"\"",
        "",
        "    def __init__(self, tools: ToolRegistry):",
        "        self.tools = tools",
        "",
        "    async def finalize(",
        "        self,",
        "        answer: str,",
        "        actions: list[dict] | None = None,",
        "    ) -> RunResult:",
        "        \"\"\"LLM 답변 + 부수효과 도구 실행.",
        "",
        "        Args:",
        "            answer: LLM 자연어 응답",
        "            actions: 마지막 실행할 도구 호출 목록",
        "        Returns:",
        "            RunResult — 라우터가 ChatResponse 로 직렬화",
        "        \"\"\"",
        "        side: list[dict] = []",
        "        for act in actions or []:",
        "            await self.tools.dispatch(act[\"name\"], act[\"args\"])",
        "            side.append({\"action\": act[\"name\"], \"ok\": True})",
        "",
        "        return RunResult(",
        "            answer=answer,",
        "            used_tools=[a[\"name\"] for a in actions or []],",
        "            side_effects=side,",
        "        )",
        "",
        "",
        "# user.py → core.py → tools.py / memory.py → output.py",

    // ─────────────────────────────────────────────────────
    // 컴포넌트 id → 좌표/메타 lookup

    function buildCompMap() {
      return Object.fromEntries(COMPONENTS.map((c) => [c.id, c]));
    }

    // ─────────────────────────────────────────────────────
    // 좌측 SVG: 5 컴포넌트 다이어그램
    //   active 컴포넌트 amber highlight, 나머지는 dim
    //   active 흐름선만 진한 amber + 화살표
    // ─────────────────────────────────────────────────────
    function ArchDiagram({ activeComponents, activeFlows }) {
      const w = 760;
      const h = 280;
      const compMap = buildCompMap();
      const activeSet = new Set(activeComponents || []);
      const flowSet = new Set(activeFlows || []);

      return (
        <div className="rounded-lg bg-gradient-to-br from-amber-50 to-amber-100 border-2 border-amber-200 p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1">
            <span>🗺️</span>
            <span>Agent 아키텍처 — 5 컴포넌트 데이터 흐름</span>
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            {/* 격자 */}
            <defs>
              <pattern id="grid-arch" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fde68a" strokeWidth="0.5" />
              </pattern>
              <marker id="arrow-dim" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 Z" fill="#fcd34d" />
              </marker>
              <marker id="arrow-hot" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
                <path d="M0,0 L10,5 L0,10 Z" fill="#d97706" />
              </marker>
            </defs>
            <rect width={w} height={h} fill="url(#grid-arch)" />

            {/* 흐름선 (먼저 그려야 노드 아래로 깔림) */}
            {FLOWS.map((f) => {
              const a = compMap[f.from];
              const b = compMap[f.to];
              const hot = flowSet.has(f.id);
              const stroke = hot ? '#d97706' : '#fcd34d';
              const strokeW = hot ? 2.6 : 1.4;
              const opacity = hot ? 1 : 0.45;
              const marker = hot ? 'url(#arrow-hot)' : 'url(#arrow-dim)';

              // 곡선 (return path) vs 직선
              if (f.curved) {
                // 약간 위/아래로 휘게
                const midX = (a.x + b.x) / 2;
                const midY = (a.y + b.y) / 2 - 22;
                const path = `M ${a.x} ${a.y} Q ${midX} ${midY} ${b.x} ${b.y}`;
                return (
                  <g key={f.id} className="transition-all duration-700">
                    <path
                      d={path}
                      fill="none"
                      stroke={stroke}
                      strokeWidth={strokeW}
                      strokeDasharray={hot ? '0' : '4 3'}
                      opacity={opacity}
                      markerEnd={marker}
                    />
                    {hot && (
                      <text
                        x={midX}
                        y={midY - 4}
                        textAnchor="middle"
                        fontSize="10"
                        fontWeight="bold"
                        fill="#92400e"
                        fontFamily="monospace"
                      >
                        {f.label}
                      </text>
                    )}
                  </g>
                );
              }

              const midX = (a.x + b.x) / 2;
              const midY = (a.y + b.y) / 2;
              return (
                <g key={f.id} className="transition-all duration-700">
                  <line
                    x1={a.x}
                    y1={a.y}
                    x2={b.x}
                    y2={b.y}
                    stroke={stroke}
                    strokeWidth={strokeW}
                    strokeDasharray={hot ? '0' : '4 3'}
                    opacity={opacity}
                    markerEnd={marker}
                  />
                  {hot && (
                    <text
                      x={midX}
                      y={midY - 6}
                      textAnchor="middle"
                      fontSize="10"
                      fontWeight="bold"
                      fill="#92400e"
                      fontFamily="monospace"
                    >
                      {f.label}
                    </text>
                  )}
                </g>
              );
            })}

            {/* 5 컴포넌트 노드 */}
            {COMPONENTS.map((c) => {
              const isActive = activeSet.has(c.id);
              const fill = isActive ? '#fbbf24' : '#fef3c7';
              const stroke = isActive ? '#b45309' : '#fcd34d';
              const textColor = isActive ? '#451a03' : '#92400e';
              const r = isActive ? 38 : 32;
              const opacity = isActive ? 1 : 0.55;

              return (
                <g key={c.id} className="transition-all duration-700" opacity={opacity}>
                  {isActive && (
                    <circle
                      cx={c.x}
                      cy={c.y}
                      r={r + 8}
                      fill="none"
                      stroke="#d97706"
                      strokeWidth="2"
                      opacity="0.5"
                    >
                      <animate attributeName="r" from={r + 4} to={r + 16} dur="1.6s" repeatCount="indefinite" />
                      <animate attributeName="opacity" from="0.6" to="0" dur="1.6s" repeatCount="indefinite" />
                    </circle>
                  )}
                  <circle
                    cx={c.x}
                    cy={c.y}
                    r={r}
                    fill={fill}
                    stroke={stroke}
                    strokeWidth="2.5"
                  />
                  <text
                    x={c.x}
                    y={c.y - 6}
                    textAnchor="middle"
                    fontSize="20"
                    pointerEvents="none"
                  >
                    {c.icon}
                  </text>
                  <text
                    x={c.x}
                    y={c.y + 14}
                    textAnchor="middle"
                    fontSize="10"
                    fontWeight="bold"
                    fill={textColor}
                    fontFamily="monospace"
                    pointerEvents="none"
                  >
                    {c.label}
                  </text>
                  <text
                    x={c.x}
                    y={c.y + r + 14}
                    textAnchor="middle"
                    fontSize="9"
                    fill={textColor}
                    fontFamily="monospace"
                    opacity="0.85"
                    pointerEvents="none"
                  >
                    {c.sub}
                  </text>
                </g>
              );
            })}
          </svg>
          <div className="text-[9px] text-amber-700 mt-2 text-center font-mono">
            진한 화살표 = 이번 단계 데이터 흐름 · 활성 노드 = amber 강조
          </div>
        </div>
      );
    }

          )}

          <div className="flex items-center justify-between">
            <h2 className="text-sm font-bold text-slate-700">🏢 회사 비유 — 사장 + 도구함 + 수첩</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>

          <ArchDiagram
            activeComponents={step.activeComponents}
            activeFlows={step.activeFlows}
          />

          <RunLog log={step.log} />

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#fbbf24' }}></span>
              활성 컴포넌트
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#fef3c7', border: '1px solid #fcd34d' }}></span>
              비활성
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5" style={{ background: '#d97706' }}></span>
              현재 흐름
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="text-amber-700 font-bold">FastAPI 패턴</span>
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — 파일명 탭(5개) + highlight.js
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const ALL_TABS = [...new Set(STEPS.map((s) => s.code.filename))]
      .map((filename) => ({ filename, idx: STEPS.findIndex((s) => s.code.filename === filename) }));
    function CodeViewer({ code, stepIdx, total, onTabClick }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      // 파일명 탭 — 5개 step 의 파일명을 모두 표시, 현재 step 강조
      const allTabs = ALL_TABS;

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot */}
          <div className="bg-[#21252b] px-3 py-1.5 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="ml-2 text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* 파일명 탭 (5개) */}
          <div className="bg-[#21252b] flex items-center border-b border-slate-700 overflow-x-auto">
            {allTabs.map((t) => {
              const isActive = t.filename === code.filename;
              return (
                <button
                  key={t.filename}
                  onClick={() => onTabClick && onTabClick(t.idx)}
                  className={`px-3 py-1.5 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                    isActive
                      ? 'bg-[#282c34] text-amber-400 border-t-2 border-t-amber-400'
                      : 'text-slate-500 hover:text-slate-300 hover:bg-[#2c313a]'
                  }`}
                >
                  {t.filename}
                </button>
              );
            })}
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[36rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/15 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-3 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. AI Agent란 무엇인가 &gt; Chapter 2. Agent의 구성요소</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Agent 아키텍처 전체 지도</h1>
                  <p className="text-sm text-slate-500 mt-0.5">User → Agent Core → Tools / Memory → Output 5 단계 흐름</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer
                code={step.code}
                stepIdx={stepIdx}
                total={STEPS.length}
                onTabClick={(i) => { setStepIdx(i); setIsPlaying(false); }}
              />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                💡 다음(I-2-2)에서는 <strong>자율성 스펙트럼</strong> — Agent 가 얼마나 스스로 판단/행동하는지의 단계를 다룬다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[110px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-1-3.html" className="text-slate-500 hover:text-slate-700">&larr; I-1-3 왜 Agent 가 필요한가</a>
              <a href="./I-2-2.html" className="text-amber-700 hover:text-amber-900 font-medium">I-2-2 자율성 스펙트럼 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
