    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-1-1. 챗봇 vs AI Agent — 단순 응답 vs 자율 행동
    학습 목표: LLM만 가진 챗봇과 LLM + Tool + Memory + Loop 까지 가진 AI Agent의
              구조적 차이를 5단계 메시지 흐름으로 이해한다.
    핵심 비유: 무전기(챗봇 — 말만 전달) vs 비서(Agent — 도구 사용 + 행동)
    패턴: fastapi v1 — 좌(LiveDataPane: 챗봇 박스 + Agent 박스 + Tool 외부 박스) / 우(VSCode CodeViewer)
    색상: ai-agent amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   chatbot      : 챗봇 박스 상태 { messages, status, hasLLM }
    //   agent        : Agent 박스 상태 { messages, status, tools, memory, loop }
    //   toolCall     : Tool 외부 박스 호출 시각화 { name, payload, response, active }
    //   showCompare  : Step 5 비교 표 표시 여부
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 챗봇 — "내일 서울 날씨?" → 학습 데이터 기반 답',
        desc: '사용자가 "내일 서울 날씨?"라고 묻는다. 챗봇은 LLM 하나뿐 — 외부에 전화할 수단이 없다. 학습 시점(예: 2024년)까지의 일반 지식으로만 답하니 "보통 11월 서울은 평균 8°C 정도입니다"라는 두루뭉실한 응답을 내놓는다. 실제 내일 날씨는 모른다.',
        chatbot: {
          status: 'reply',
          messages: [
            { role: 'user', text: '내일 서울 날씨?' },
            { role: 'bot', text: '11월 서울은 보통 평균 8°C 정도이고 가끔 비가 옵니다. (※ 실시간 데이터 없음)' },
          ],
        },
        agent: {
          status: 'idle',
          messages: [],
          tools: false,
          memory: false,
          loop: false,
        },
        toolCall: null,
        showCompare: false,
        code: {
          lang: 'python',
          filename: 'chatbot.py',
          lines: [
            '# 챗봇 — LLM 하나만 사용. 외부 API 호출 없음.',
            'from openai import OpenAI',
            '',
            'client = OpenAI()',
            '',
            'def chatbot(user_message: str) -> str:',
            '    """단일 LLM 호출로 응답 — 학습 데이터 범위 안에서만."""',
            '    response = client.chat.completions.create(',
            '        model="gpt-4o-mini",',
            '        messages=[',
            '            {"role": "system",',
            '             "content": "친절한 챗봇이다. 학습 데이터로만 답한다."},',
            '            {"role": "user", "content": user_message},',
            '        ],',
            '    )',
            '    return response.choices[0].message.content',
            '',
            '# 사용 예',
            'answer = chatbot("내일 서울 날씨?")',
            '# → "11월 서울은 보통 평균 8°C 정도입니다."',
            '#   (실시간 정보 X — 학습 시점 기준 일반론만)',
            '',
            '# 핵심: input → LLM → output. 한 사이클로 끝.',
            '#       외부 도구도 없고, 메모리도 없고, 행동도 없다.',
          ],
          highlight: [1, 6, 7, 8, 9, 13, 19, 20, 21, 23, 24],
        },
      },
      {
        title: 'Step 2. 챗봇의 한계 — 외부 도구 호출 불가, 행동 못함',
        desc: '"실제 날씨를 알려줘"라고 다시 부탁해도 챗봇은 답할 길이 없다. weather API를 부를 수단이 없고, 캘린더를 열 수도 없고, 알림을 보낼 수도 없다. LLM 한 대만 있으니 모든 게 "말"로 끝난다. 이게 챗봇의 구조적 천장이다 — 정보 전달기일 뿐.',
        chatbot: {
          status: 'limit',
          messages: [
            { role: 'user', text: '내일 서울 날씨?' },
            { role: 'bot', text: '11월 서울은 보통 평균 8°C 정도이고 가끔 비가 옵니다.' },
            { role: 'user', text: '실제 내일 날씨를 확인해줘' },
            { role: 'bot', text: '죄송합니다. 저는 외부 API에 접근할 수 없어서 실시간 날씨를 확인할 수 없습니다.' },
          ],
        },
        agent: {
          status: 'idle',
          messages: [],
          tools: false,
          memory: false,
          loop: false,

    // ─────────────────────────────────────────────────────
    // 좌측 패널: 챗봇 박스 (LLM만)
    // ─────────────────────────────────────────────────────
    function ChatbotBox({ chatbot }) {
      const active = chatbot.status === 'reply' || chatbot.status === 'limit';
      const isLimit = chatbot.status === 'limit';
      return (
        <div className={`rounded-lg border-2 p-2 transition-all duration-500 ${
          active
            ? (isLimit ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-300')
            : 'bg-slate-50 border-slate-200 opacity-50'
        }`}>
          <div className="flex items-center gap-1.5 mb-2">
            <span className="text-base">📟</span>
            <div className="flex-1">
              <div className="text-[11px] font-bold text-slate-700">챗봇</div>
              <div className="text-[9px] text-slate-500 font-mono">LLM only</div>
            </div>
            {isLimit && (
              <span className="text-[9px] bg-red-600 text-white px-1.5 py-0.5 rounded font-bold">LIMIT</span>
            )}
          </div>

          {/* 내부 구조 — LLM 박스만 */}
          <div className="bg-white rounded border border-slate-200 p-2 mb-2 flex items-center justify-center gap-1.5">
            <div className="bg-gradient-to-br from-slate-200 to-slate-300 px-2 py-1 rounded text-[10px] font-mono font-bold text-slate-700">LLM</div>
            <span className="text-slate-400 text-[10px]">↻</span>
            <span className="text-[9px] text-slate-500 font-mono">텍스트만</span>
          </div>

          {/* 메시지 흐름 */}
          <div className="space-y-1.5 min-h-[80px]">
            {chatbot.messages.length === 0 && (
              <div className="text-center text-[10px] text-slate-400 italic py-3">대기 중...</div>
            )}
            {chatbot.messages.map((m, i) => {
              const isUser = m.role === 'user';
              return (
                <div key={i} className={`flex ${isUser ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[88%] px-2 py-1 rounded text-[10px] leading-tight ${
                    isUser
                      ? 'bg-slate-600 text-white'
                      : isLimit && i === chatbot.messages.length - 1
                        ? 'bg-red-100 text-red-800 border border-red-300'
                        : 'bg-white text-slate-700 border border-slate-200'
                  }`}>
                    {m.text}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 패널: AI Agent 박스 (LLM + Tool + Memory + Loop)
    // ─────────────────────────────────────────────────────
    function AgentBox({ agent }) {
      const active = agent.status !== 'idle';
      return (
        <div className={`rounded-lg border-2 p-2 transition-all duration-500 ${
          active
            ? 'bg-gradient-to-br from-amber-50 to-amber-100 border-amber-300 shadow-sm'
            : 'bg-amber-50/40 border-amber-200 opacity-50'
        }`}>
          <div className="flex items-center gap-1.5 mb-2">
            <span className="text-base">🤖</span>
            <div className="flex-1">
              <div className="text-[11px] font-bold text-amber-800">AI Agent</div>
              <div className="text-[9px] text-amber-700 font-mono">LLM + Tool + Memory + Loop</div>
            </div>
            {agent.status === 'loop' && (
              <span className="text-[9px] bg-amber-600 text-white px-1.5 py-0.5 rounded font-bold animate-pulse">REACT</span>
            )}
            {agent.status === 'tool_call' && (
              <span className="text-[9px] bg-amber-600 text-white px-1.5 py-0.5 rounded font-bold">TOOL</span>
            )}
          </div>

          {/* 내부 구조 — LLM + Tool + Memory + Loop */}
          <div className="bg-white rounded border border-amber-200 p-2 mb-2">
            <div className="grid grid-cols-4 gap-1 text-center">
              <div className="bg-amber-200 px-1 py-1 rounded text-[9px] font-mono font-bold text-amber-900">LLM</div>
              <div className={`px-1 py-1 rounded text-[9px] font-mono font-bold transition-all ${
                agent.tools ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-400'
              }`}>Tool</div>
              <div className={`px-1 py-1 rounded text-[9px] font-mono font-bold transition-all ${
                agent.memory ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-400'
              }`}>Memory</div>
              <div className={`px-1 py-1 rounded text-[9px] font-mono font-bold transition-all ${
                agent.loop ? 'bg-amber-500 text-white animate-pulse' : 'bg-slate-100 text-slate-400'
              }`}>Loop</div>
            </div>
          </div>

          {/* 메시지 흐름 */}
          <div className="space-y-1.5 min-h-[80px]">
            {agent.messages.length === 0 && (
              <div className="text-center text-[10px] text-amber-400 italic py-3">대기 중...</div>
            )}
            {agent.messages.map((m, i) => {
              const isUser = m.role === 'user';
              return (
                <div key={i} className={`flex ${isUser ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[88%] px-2 py-1 rounded text-[10px] leading-tight whitespace-pre-line ${
                    isUser
                      ? 'bg-amber-700 text-white'
                      : 'bg-white text-amber-900 border border-amber-300 font-medium'
                  }`}>
                    {m.text}
                  </div>
                </div>
              );
            })}
          </div>

          {/* ReAct 루프 단계 (Step 4 전용) */}
          {agent.loopSteps && (
            <div className="mt-2 pt-2 border-t border-amber-200">
              <div className="text-[9px] font-bold text-amber-800 uppercase tracking-wider mb-1">ReAct 루프</div>
              <div className="space-y-0.5">
                {agent.loopSteps.map((s) => {
                  const labelColor = s.label === 'Reason'
                    ? 'bg-blue-500 text-white'
                    : s.label === 'Act'
                      ? 'bg-amber-600 text-white'
                      : 'bg-emerald-500 text-white';
                  return (
                    <div key={s.n} className="flex items-center gap-1 text-[9px] font-mono">
                      <span className="text-amber-600 font-bold w-4">#{s.n}</span>
                      <span className={`px-1.5 py-0.5 rounded font-bold w-12 text-center ${labelColor}`}>{s.label}</span>
                      <span className="text-slate-700 flex-1">{s.text}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Tool 외부 박스 — Agent → 외부 API 호출 시각화
    // ─────────────────────────────────────────────────────
    function ToolCallPane({ toolCall }) {
      if (!toolCall) {
        return (
          <div className="rounded-lg bg-slate-50 border border-dashed border-slate-300 p-2 text-center">
            <div className="text-[10px] text-slate-400 font-mono italic">(외부 도구 호출 없음 — 챗봇은 도구를 부를 수단이 없다)</div>
          </div>
        );
      }
      return (
        <div className="rounded-lg bg-white border-2 border-amber-400 p-2 shadow-sm">
          <div className="flex items-center justify-between mb-1.5">
            <div className="flex items-center gap-1.5">
              <span className="text-sm">🔧</span>
              <span className="text-[11px] font-bold text-amber-800">외부 도구 호출</span>
            </div>
            <span className="text-[9px] bg-amber-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">{toolCall.name}</span>
          </div>

          {/* 화살표 흐름: Agent → Tool → Response */}
          <div className="grid grid-cols-[1fr_auto_1fr] gap-2 items-center text-[9px] font-mono">
            {/* request */}
            <div className="bg-amber-50 border border-amber-200 rounded px-1.5 py-1">
              <div className="text-[8px] uppercase font-bold text-amber-700 mb-0.5">request</div>
              <div className="text-amber-900 whitespace-pre-line leading-tight">{toolCall.payload}</div>
            </div>
            {/* arrow */}
            <div className="flex flex-col items-center text-amber-600">
              <span className="text-base leading-none">→</span>
              <span className="text-base leading-none mt-1">←</span>
            </div>
            {/* response */}
            <div className="bg-emerald-50 border border-emerald-200 rounded px-1.5 py-1">
              <div className="text-[8px] uppercase font-bold text-emerald-700 mb-0.5">response</div>
              <div className="text-emerald-900 whitespace-pre-line leading-tight">{toolCall.response}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 비교 표 (Step 5)
    // ─────────────────────────────────────────────────────
    function CompareTable() {
      const rows = [
        { k: '동작 방식',   bot: '정적 (1 사이클)',           agent: '동적 (Reason↔Act 루프)' },
        { k: '도구 사용',   bot: '✗ 외부 API 불가',           agent: '✓ tool_calls (weather, db 등)' },
        { k: '메모리',      bot: '짧은 컨텍스트',             agent: '누적 messages + 외부 메모리' },
        { k: '자율성',      bot: '입력 1번 = 답 1번',         agent: '목표만 주면 다단계 자율 실행' },
        { k: '결과 형태',   bot: '텍스트만',                  agent: '텍스트 + 실제 효과 (예약/등록)' },
        { k: '적합 용도',   bot: 'FAQ · 안내 · 상담',         agent: '예약 · 자동화 · 워크플로' },
        { k: '비유',        bot: '📟 무전기',                 agent: '🤵 비서' },
      ];

      return (
        <div className="rounded-lg bg-white border-2 border-amber-300 overflow-hidden">
          <div className="bg-amber-100 px-3 py-2 border-b border-amber-200">
            <div className="text-xs font-bold text-amber-900">📊 챗봇 vs AI Agent</div>
          </div>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="bg-amber-50 text-left">
                <th className="px-3 py-2 font-bold text-amber-700 w-1/4">기준</th>
                <th className="px-3 py-2 font-bold text-slate-700">챗봇</th>
                <th className="px-3 py-2 font-bold text-amber-700">AI Agent</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={r.k} className={i % 2 === 0 ? 'bg-white' : 'bg-amber-50/40'}>
                  <td className="px-3 py-1.5 font-bold text-slate-700 border-r border-slate-100">{r.k}</td>
                  <td className="px-3 py-1.5 text-slate-700 font-mono">{r.bot}</td>
                  <td className="px-3 py-1.5 text-amber-800 font-mono font-semibold">{r.agent}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌(챗봇) + 우(Agent) + 하단(Tool 외부 박스)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📟🤖 무전기 vs 비서 — 메시지 흐름</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {step.showCompare ? (
            <CompareTable />
          ) : (
            <>
              {/* 좌(챗봇) + 우(Agent) */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mb-2">
                <ChatbotBox chatbot={step.chatbot} />
                <AgentBox agent={step.agent} />
              </div>
              {/* Tool 외부 박스 (Agent에서 화살표) */}
              <ToolCallPane toolCall={step.toolCall} />
            </>
          )}

          {/* 범례 */}
          {!step.showCompare && (
            <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded bg-slate-400"></span>
                챗봇 (LLM only)
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded bg-amber-500"></span>
                Agent (4 컴포넌트)
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded bg-emerald-500"></span>
                Tool 응답
              </span>
              <span className="flex items-center gap-1 ml-auto">
                <span className="w-2.5 h-2.5 rounded bg-red-400"></span>
                LIMIT (못함)
              </span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/15 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. AI Agent란 무엇인가 &gt; Chapter 1. 에이전트의 탄생</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">챗봇 vs AI Agent — 단순 응답에서 자율 행동으로</h1>
                  <p className="text-sm text-slate-500 mt-0.5">무전기(챗봇) vs 비서(Agent) — LLM에 Tool + Memory + Loop를 더하면?</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                💡 다음(I-1-2)에서는 <strong>Agent의 3요소</strong> — 관찰(Perception) · 사고(Reasoning) · 행동(Action)의 동작 사이클을 자세히 다룬다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./I-1-2.html" className="text-amber-700 hover:text-amber-900 font-medium">I-1-2 Agent의 3요소 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
