  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-2-2. API 호출 기본 — OpenAI/Anthropic SDK 사용법, error handling, streaming
    학습 목표: 5단계로 LLM API 호출의 핵심 패턴을 익힌다.
              (1) 기본 호출 (2) 응답 파싱 (3) Streaming (4) Error handling (5) 비용 모니터링
    핵심 비유: 식당 주문 → 배달 → 실시간 조각 배달 → 재시도 → 영수증 비용 합산
    패턴: fastapi v1 — 좌(LiveDataPane: API sequence diagram + 토큰 애니메이션 + retry counter)
                    / 우(VSCode CodeViewer: basic.py / parse.py / stream.py / error-handle.py / cost-track.py)
    색상: ai-agent amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   sequence    : API sequence diagram 활성 단계
    //                 (request / processing / response / streaming / retry / billing)
    //   tokens      : streaming 단계에서 한 글자씩 도착할 토큰 배열
    //   retryCount  : 현재 재시도 시도 횟수 (Step 4)
    //   retryStatus : 'idle' | 'rate-limit' | 'timeout' | 'success'
    //   usage       : { input, output, model, cost } — Step 5 비용
    //   parsed      : Step 2 응답 파싱 분해
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      basic: {lang: "python", filename: "basic.py", lines: [
        "\"\"\"기본 API 호출 — OpenAI SDK 동기 호출 (examples/basic.py)\"\"\"",
        "from openai import OpenAI",
        "",
        "# 1) client 생성 — API 키는 환경 변수 OPENAI_API_KEY에서 자동 로드",
        "client = OpenAI()",
        "",
        "# 2) 요청 — model + messages + max_tokens",
        "response = client.chat.completions.create(",
        "    model=\"gpt-4o-mini\",",
        "    messages=[",
        "        {\"role\": \"system\", \"content\": \"당신은 친절한 요리사입니다.\"},",
        "        {\"role\": \"user\",   \"content\": \"파스타 레시피를 알려줘\"},",
        "    ],",
        "    max_tokens=512,",
        "    temperature=0.7,",
        ")",
        "",
        "# 3) 응답 — 동기 호출이라 도착할 때까지 block",
        "print(response.choices[0].message.content)",
        "",
        "# 핵심:",
        "#   - client.chat.completions.create() = 식당에 주문서 제출",
        "#   - 응답 객체(response)는 한 덩어리로 도착",
        "#   - 다음 단계(Step 2)에서 응답 객체를 분해한다",
      ]},
      parse: {lang: "python", filename: "parse.py", lines: [
        "\"\"\"응답 객체 파싱 — choices / message / finish_reason / usage (examples/parse.py)\"\"\"",
        "response = client.chat.completions.create(",
        "    model=\"gpt-4o-mini\",",
        "    messages=[{\"role\": \"user\", \"content\": \"파스타 레시피\"}],",
        "    max_tokens=512,",
        ")",
        "",
        "# 1) 본문 — 가장 자주 쓰는 필드",
        "text = response.choices[0].message.content",
        "print(\"응답 본문:\", text)",
        "",
        "# 2) 종료 사유 — 길이 초과 감지에 필수",
        "finish_reason = response.choices[0].finish_reason",
        "#   - \"stop\"           : 모델이 정상 종료",
        "#   - \"length\"         : max_tokens 도달 → 잘렸음 (재호출 필요)",
        "#   - \"content_filter\" : 안전 필터에 걸림",
        "#   - \"tool_calls\"     : 함수 호출 모드",
        "",
        "# 3) usage — 비용 계산 핵심",
        "usage = response.usage",
        "print(f\"입력 토큰: {usage.prompt_tokens}\")",
        "print(f\"출력 토큰: {usage.completion_tokens}\")",
        "print(f\"전체    : {usage.total_tokens}\")",
        "",
        "# 4) 메타 — 모델/생성 ID",
        "print(\"model:\", response.model, \"| id:\", response.id)",
        "",
        "# 핵심:",
        "#   - text만 보지 말고 finish_reason=\"length\"는 잘림 경고",
        "#   - usage는 Step 5 비용 모니터링의 입력이 된다",
      ]},
      stream: {lang: "python", filename: "stream.py", lines: [
        "\"\"\"Streaming 호출 — stream=True로 chunk 단위 응답 처리 (examples/stream.py)\"\"\"",
        "from openai import OpenAI",
        "",
        "client = OpenAI()",
        "",
        "stream = client.chat.completions.create(",
        "    model=\"gpt-4o-mini\",",

    // ─────────────────────────────────────────────────────
    // Token Stream — Streaming 단계에서 한 글자씩 도착하는 애니메이션
    // ─────────────────────────────────────────────────────
    function TokenStream({ tokens }) {
      const [visibleCount, setVisibleCount] = useState(0);

      useEffect(() => {
        setVisibleCount(0);
        if (!tokens) return;
        let i = 0;
        const t = setInterval(() => {
          i += 1;
          if (i > tokens.length) {
            clearInterval(t);
            return;
          }
          setVisibleCount(i);
        }, 140);
        return () => clearInterval(t);
      }, [tokens]);

      if (!tokens) return null;

      return (
        <div className="rounded-lg bg-slate-900 border border-amber-300 p-3 mt-2 shadow-inner">
          <div className="flex items-center justify-between mb-1.5">
            <div className="text-[10px] font-bold text-amber-300 font-mono uppercase tracking-wider">
              📡 Streaming Output
            </div>
            <div className="text-[9px] text-amber-200 font-mono">
              {visibleCount} / {tokens.length} tokens
            </div>
          </div>
          <div className="font-mono text-sm text-amber-100 min-h-[2.5rem] leading-relaxed">
            {tokens.slice(0, visibleCount).join('')}
            {visibleCount < tokens.length && (
              <span className="inline-block w-2 h-4 bg-amber-300 ml-0.5 align-middle animate-pulse" />
            )}
            {visibleCount === tokens.length && (
              <span className="text-emerald-400 ml-2">✓ done</span>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Retry Counter — Step 4 시도 횟수 시각화
    // ─────────────────────────────────────────────────────
    function RetryCounter({ count, status }) {
      if (count === 0) return null;
      const attempts = Array.from({ length: count }, (_, i) => i + 1);

      return (
        <div className="rounded-lg bg-amber-50 border-2 border-amber-300 p-3 mt-2">
          <div className="flex items-center justify-between mb-2">
            <div className="text-[10px] font-bold text-amber-900 font-mono uppercase tracking-wider">
              🔁 Retry Counter
            </div>
            <div className="text-[10px] text-amber-700 font-mono">
              백오프: 1s → 2s → 4s
            </div>
          </div>
          <div className="flex items-center gap-2">
            {attempts.map((n) => {
              const isLast = n === count;
              const success = isLast && status === 'success';
              return (
                <div key={n} className="flex items-center gap-1">
                  <div
                    className={`w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold border-2 ${
                      success
                        ? 'bg-emerald-500 border-emerald-700 text-white'
                        : 'bg-red-100 border-red-400 text-red-700'
                    }`}
                  >
                    {success ? '✓' : '✗'}
                  </div>
                  {n < count && <div className="text-amber-400 text-lg">→</div>}
                </div>
              );
            })}
            <div className="ml-auto text-xs font-mono text-amber-900">
              총 {count}회 시도 · {status === 'success' ? '성공' : '진행중'}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Parsed Response Card — Step 2 응답 분해
    // ─────────────────────────────────────────────────────
    function ParsedCard({ parsed }) {
      if (!parsed) return null;
      const rows = [
        { k: 'choices',         v: parsed.choices,        color: 'text-amber-700' },
        { k: 'message.role',    v: parsed.role,           color: 'text-amber-700' },
        { k: 'message.content', v: parsed.content,        color: 'text-slate-800' },
        { k: 'finish_reason',   v: parsed.finishReason,   color: 'text-emerald-700' },
        { k: 'model',           v: parsed.model,          color: 'text-slate-700' },
        { k: 'usage.prompt',    v: `${parsed.inputTokens} tokens`,  color: 'text-amber-700' },
        { k: 'usage.completion',v: `${parsed.outputTokens} tokens`, color: 'text-amber-700' },
      ];
      return (
        <div className="rounded-lg bg-white border-2 border-amber-300 overflow-hidden mt-2">
          <div className="bg-amber-100 px-3 py-1.5 border-b border-amber-200">
            <div className="text-xs font-bold text-amber-900 font-mono">📦 Response Object</div>
          </div>
          <table className="w-full text-[11px]">
            <tbody>
              {rows.map((r, i) => (
                <tr key={r.k} className={i % 2 === 0 ? 'bg-white' : 'bg-amber-50/40'}>
                  <td className="px-3 py-1.5 font-mono text-slate-500 w-2/5 border-r border-slate-100">
                    {r.k}
                  </td>
                  <td className={`px-3 py-1.5 font-mono font-semibold ${r.color}`}>{r.v}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    function CostCard({ usage }) {
      if (!usage) return null;
      const inputCost  = (usage.input  * usage.inputPrice)  / 1_000_000;
      const outputCost = (usage.output * usage.outputPrice) / 1_000_000;
      const total = inputCost + outputCost;

      return (
        <div className="rounded-lg bg-white border-2 border-amber-300 overflow-hidden mt-2 shadow-sm">
          <div className="bg-amber-100 px-3 py-1.5 border-b border-amber-200 flex items-center justify-between">
            <div className="text-xs font-bold text-amber-900 font-mono">💰 비용 영수증</div>
            <div className="text-[10px] text-amber-700 font-mono">{usage.model}</div>
          </div>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="bg-amber-50">
                <th className="px-3 py-1.5 text-left font-bold text-amber-900">항목</th>
                <th className="px-3 py-1.5 text-right font-bold text-amber-900">tokens</th>
                <th className="px-3 py-1.5 text-right font-bold text-amber-900">단가/1M</th>
                <th className="px-3 py-1.5 text-right font-bold text-amber-900">USD</th>
              </tr>
            </thead>
            <tbody>
              <tr className="bg-white">
                <td className="px-3 py-1.5 font-mono text-slate-700">입력</td>
                <td className="px-3 py-1.5 font-mono text-right text-slate-700">{usage.input.toLocaleString()}</td>
                <td className="px-3 py-1.5 font-mono text-right text-slate-700">${usage.inputPrice.toFixed(2)}</td>
                <td className="px-3 py-1.5 font-mono text-right text-amber-800 font-semibold">${inputCost.toFixed(6)}</td>
              </tr>
              <tr className="bg-amber-50/40">
                <td className="px-3 py-1.5 font-mono text-slate-700">출력</td>
                <td className="px-3 py-1.5 font-mono text-right text-slate-700">{usage.output.toLocaleString()}</td>
                <td className="px-3 py-1.5 font-mono text-right text-slate-700">${usage.outputPrice.toFixed(2)}</td>
                <td className="px-3 py-1.5 font-mono text-right text-amber-800 font-semibold">${outputCost.toFixed(6)}</td>
              </tr>
              <tr className="bg-amber-100 border-t-2 border-amber-300">
                <td colSpan="3" className="px-3 py-1.5 font-mono text-right font-bold text-amber-900">이번 호출 합계</td>
                <td className="px-3 py-1.5 font-mono text-right font-bold text-amber-900">${total.toFixed(6)}</td>
              </tr>
              <tr className="bg-amber-200/60">
                <td colSpan="3" className="px-3 py-1.5 font-mono text-right font-bold text-amber-900">📅 오늘 누적</td>
                <td className="px-3 py-1.5 font-mono text-right font-bold text-amber-900">${usage.totalCost.toFixed(4)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 메인 시각화
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🍝 식당 주문서 — LLM API 호출 흐름</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 시퀀스 다이어그램 */}
          <ApiSequence
            sequence={step.sequence}
            retryCount={step.retryCount}
            retryStatus={step.retryStatus}
          />

          {/* 단계별 보조 시각화 */}
          <TokenStream tokens={step.tokens} />
          <RetryCounter count={step.retryCount} status={step.retryStatus} />
          <ParsedCard parsed={step.parsed} />
          <CostCard usage={step.usage} />

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-full" style={{ background: '#d97706' }}></span>
              활성 단계
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5" style={{ background: '#dc2626' }}></span>
              실패/재시도
            </span>
            <span className="flex items-center gap-1">
              <span className="w-3 h-0.5" style={{ background: '#15803d' }}></span>
              성공
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2.5 h-2.5 rounded-full bg-amber-200"></span>
              대기
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/15 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. LLM 기초 &gt; Chapter 2. 프롬프트 엔지니어링</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">II-2-2. API 호출 기본</h1>
                  <p className="text-sm text-slate-500 mt-0.5">OpenAI/Anthropic SDK · 응답 파싱 · streaming · error handling · 비용 모니터링</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                💡 다음(II-3-1)에서는 LLM의 한계 — <strong>환각, 지식 단절, 행동 불가</strong>를 다룬다.
                Agent가 왜 필요한지에 대한 동기로 이어진다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 칩 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['client', 'messages', 'choices', 'finish_reason', 'stream=True', 'RateLimitError', 'usage', 'cost'].map(kw => (
                <span key={kw} className="bg-amber-50 text-amber-800 px-3 py-1 rounded-full text-xs font-mono border border-amber-200">{kw}</span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2 border-t border-slate-200">
              <a href="./II-2-1.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; II-2-1. 프롬프트 구조</a>
              <a href="./II-3-1.html" className="text-amber-700 hover:text-amber-900 font-medium">II-3-1. 환각, 지식 단절, 행동 불가 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
