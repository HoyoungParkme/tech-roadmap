  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-3-1. MCP Server 만들기 — TypeScript SDK로 직접 만들기
    학습 목표: MCP Server를 처음부터 끝까지 만들고 Claude Desktop에 등록해
              호출되는 흐름을 5단계로 이해한다.
    핵심 비유: 레스토랑 오픈 — 인테리어(npm init) → 주방장 채용(import sdk)
              → 메뉴판(register tools) → 문 열기(stdio connect) → 손님 받기(Claude Desktop)
    패턴: fastapi v1 — 좌(LiveDataPane: server build 단계 + Claude Desktop mock)
                    / 우(VSCode CodeViewer: 5개 파일 탭)
    색상: ai-agent amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 빌드 단계 5개 — 좌측 LiveDataPane이 단계별로 highlight
    //   stages: [{ id, icon, label, sub, status }]
    //     status: 'pending' | 'active' | 'done'
    //   hostMock: Claude Desktop 호출 흐름 시각화 여부
    // ─────────────────────────────────────────────────────
    const STAGE_DEFS = [
      { id: 'init',     icon: '📦', label: '프로젝트 초기화',  sub: 'npm init + tsconfig' },
      { id: 'sdk',      icon: '🧰', label: 'SDK import',     sub: '@modelcontextprotocol/sdk' },
      { id: 'tools',    icon: '🛠️', label: 'Tool 등록',       sub: 'tools/list + tools/call' },
      { id: 'connect',  icon: '🔌', label: 'Transport 연결',  sub: 'StdioServerTransport' },
      { id: 'host',     icon: '🖥️', label: 'Host 등록',       sub: 'claude_desktop_config.json' },
    ];

    function makeStages(activeIdx) {
      // activeIdx === -1 이면 전체 pending, length면 전체 done
      return STAGE_DEFS.map((s, i) => ({
        ...s,
        status: i < activeIdx ? 'done' : i === activeIdx ? 'active' : 'pending',
      }));
    }

    // ─────────────────────────────────────────────────────
    // 5개 파일 탭 — 우측 CodeViewer가 step.activeFile에 따라 표시
    // ─────────────────────────────────────────────────────
    const FILES = {
      pkg: {
        lang: 'json',
        filename: 'package.json',
        lines: [
          '{',
          '  "name": "weather-mcp-server",',
          '  "version": "0.1.0",',
          '  "description": "MCP Server — 도시 날씨 조회 도구 제공",',
          '  "type": "module",',
          '  "bin": {',
          '    "weather-mcp-server": "dist/server.js"',
          '  },',
          '  "scripts": {',
          '    "build": "tsc",',
          '    "start": "node dist/server.js"',
          '  },',
          '  "dependencies": {',
          '    "@modelcontextprotocol/sdk": "^1.0.0",',
          '    "zod": "^3.23.8"',
          '  },',
          '  "devDependencies": {',
          '    "@types/node": "^20.0.0",',
          '    "typescript": "^5.4.0"',
          '  }',
          '}',
        ],
        highlight: [],
      },
      server: {
        lang: 'typescript',
        filename: 'src/server.ts',
        lines: [
          '/**',
          ' * weather-mcp-server — entrypoint',
          ' * Server 인스턴스 생성 + Transport 연결',
          ' */',
          'import { Server } from "@modelcontextprotocol/sdk/server/index.js";',
          'import { StdioServerTransport }',
          '  from "@modelcontextprotocol/sdk/server/stdio.js";',
          'import { registerWeatherTools } from "./register-tools.js";',
          '',
          '// 1) Server 인스턴스 — name + version + capabilities',
          'const server = new Server(',
          '  {',
          '    name: "weather-mcp-server",',
          '    version: "0.1.0",',
          '  },',
          '  {',
          '    capabilities: {',
          '      tools: {},        // tools 기능 사용한다고 선언',
          '    },',
          '  },',
          ');',
          '',
          '// 2) Tool 핸들러 등록 (별도 모듈로 분리)',
          'registerWeatherTools(server);',
          '',
          '// 3) Transport — 표준입출력으로 Claude Desktop과 통신',
          'const transport = new StdioServerTransport();',
          'await server.connect(transport);',
          '',
          'console.error("[weather-mcp] server started on stdio");',
        ],
        highlight: [],
      },
      register: {
        lang: 'typescript',
        filename: 'src/register-tools.ts',
        lines: [
          '/**',
          ' * Tool 등록 — tools/list, tools/call 두 핸들러를 정의한다',
          ' * Tool 1개: get_weather(city) → 도시 날씨 텍스트 반환',
          ' */',
          'import type { Server } from "@modelcontextprotocol/sdk/server/index.js";',
          'import {',
          '  ListToolsRequestSchema,',
          '  CallToolRequestSchema,',
          '} from "@modelcontextprotocol/sdk/types.js";',
          '',
          'export function registerWeatherTools(server: Server) {',
          '  // (a) tools/list — 어떤 도구들이 있는지 알린다',
          '  server.setRequestHandler(ListToolsRequestSchema, async () => ({',
          '    tools: [',
          '      {',
          '        name: "get_weather",',
          '        description: "도시 이름을 받아 현재 날씨를 반환한다",',
          '        inputSchema: {',
          '          type: "object",',
          '          properties: {',
          '            city: { type: "string", description: "도시 이름 (예: Seoul)" },',
          '          },',
          '          required: ["city"],',
          '        },',
          '      },',
          '    ],',
          '  }));',
          '',
          '  // (b) tools/call — 실제 도구 실행 핸들러',
          '  server.setRequestHandler(CallToolRequestSchema, async (req) => {',
          '    const { name, arguments: args } = req.params;',
          '    if (name !== "get_weather") {',
          '      throw new Error(`unknown tool: ${name}`);',

      { ...S5,
        beat: {
          label: '비밀값은 env로', at: 'claude_desktop_config.json L10–13',
          caption: 'API 키는 코드가 아니라 여기에 둔다. Claude Desktop이 프로세스를 띄울 때 넣어 준다.',
          changes: [{ mark: 'new', text: 'WEATHER_API_KEY' }],
        },
        activeStage: 4,
        hostMock: null,
        ...onFile('config', [10, 11, 12, 13]),
      },
      { ...S5,
        beat: {
          label: '완전 재시작', at: 'claude_desktop_config.json L17–19',
          caption: '설정은 시작할 때만 읽는다. 완전히 종료했다 켜야 우하단에 weather가 나타난다.',
          changes: [{ mark: 'changed', text: 'Claude Desktop 재시작' },
                    { mark: 'new', text: '🔌 weather 표시' }],
        },
        activeStage: 4,
        hostMock: null,
        ...onFile('config', [17, 18, 19]),
      },
      { ...S5,
        beat: {
          label: '첫 호출이 오간다', at: 'claude_desktop_config.json L20–21',
          caption: '"서울 날씨 알려줘"라고 물으면 Claude가 알아서 tools/call을 부르고 답이 채팅에 뜬다.',
          changes: [{ mark: 'new', text: 'tools/call 자동 호출' },
                    { mark: 'read', text: 'Seoul: 맑음, 18°C' }],
        },
        activeStage: 4,
        hostMock: {
          phase: 'connected',
          query: '서울 날씨 알려줘',
          request: 'tools/call { name: "get_weather", arguments: { city: "Seoul" } }',
          response: 'Seoul: 맑음, 18°C',
        },
        ...onFile('config', [20, 21]),
      },
    ];

    // ─────────────────────────────────────────────────────
    // BuildPipeline — 5개 빌드 단계를 가로로 시각화
    //   pending : 회색
    //   active  : amber 강조 + 펄스
    //   done    : amber 채움 + 체크
    // ─────────────────────────────────────────────────────
    function BuildPipeline({ stages }) {
      return (
        <div className="rounded-lg bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 p-3">
          <div className="text-[11px] font-bold text-amber-900 mb-2 flex items-center gap-1">
            <span>🏗️</span>
            <span>MCP Server 빌드 파이프라인</span>
          </div>
          <div className="flex items-stretch gap-1">
            {stages.map((s, i) => {
              const isActive = s.status === 'active';
              const isDone = s.status === 'done';
              const bg = isActive ? 'bg-amber-500 text-white border-amber-700'
                       : isDone   ? 'bg-amber-200 text-amber-900 border-amber-400'
                                  : 'bg-white text-slate-400 border-slate-200';
              return (
                <React.Fragment key={s.id}>
                  <div className={`flex-1 rounded-md border-2 p-2 transition-all duration-500 ${bg} ${isActive ? 'scale-105 shadow-lg' : ''}`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-base leading-none">{s.icon}</span>
                      <span className="text-[9px] font-mono">{i + 1}/5</span>
                    </div>
                    <div className="text-[10px] font-bold leading-tight">{s.label}</div>
                    <div className="text-[8px] mt-0.5 font-mono opacity-80 leading-tight">{s.sub}</div>
                    {isDone && <div className="text-[10px] mt-1 font-bold">✓ done</div>}
                    {isActive && (
                      <div className="text-[10px] mt-1 font-bold flex items-center gap-1">
                        <span className="inline-block w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                        running
                      </div>
                    )}
                  </div>
                  {i < stages.length - 1 && (
                    <div className="flex items-center">
                      <div className={`w-2 h-0.5 ${isDone || isActive ? 'bg-amber-500' : 'bg-slate-300'}`}></div>
                    </div>
                  )}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ServerProcessBox — 현재 빌드 중인 server 프로세스 상태
    // ─────────────────────────────────────────────────────
    function ServerProcessBox({ activeStage }) {
      const labels = [
        { line: 'package.json', state: activeStage >= 0 ? 'ok' : 'pending' },
        { line: 'src/server.ts', state: activeStage >= 1 ? 'ok' : 'pending' },
        { line: 'src/register-tools.ts', state: activeStage >= 2 ? 'ok' : 'pending' },
        { line: 'StdioServerTransport', state: activeStage >= 3 ? 'ok' : 'pending' },
        { line: 'connected to Claude Desktop', state: activeStage >= 4 ? 'ok' : 'pending' },
      ];
      return (
        <div className="rounded-lg bg-slate-900 border border-slate-700 p-3 font-mono text-[11px]">
          <div className="text-amber-400 mb-2 flex items-center gap-1">
            <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>weather-mcp-server :: build status</span>
          </div>
          <div className="space-y-1">
            {labels.map((l, i) => (
              <div key={i} className="flex items-center gap-2">
                <span className={l.state === 'ok' ? 'text-emerald-400' : 'text-slate-500'}>
                  {l.state === 'ok' ? '✓' : '·'}
                </span>
                <span className={l.state === 'ok' ? 'text-slate-200' : 'text-slate-600'}>
                  {l.line}
                </span>
              </div>
            ))}
          </div>
          <div className="mt-2 pt-2 border-t border-slate-700 text-slate-500">
            stage {activeStage + 1} / 5 · {activeStage >= 4 ? 'ready' : 'building...'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ClaudeDesktopMock — Step 5에서 호출 흐름 시각화
    // ─────────────────────────────────────────────────────
    function ClaudeDesktopMock({ mock }) {
      return (
        <div className="rounded-lg bg-white border-2 border-amber-300 overflow-hidden shadow-md">
          {/* mock 윈도우 헤더 */}
          <div className="bg-slate-100 px-3 py-1.5 border-b border-slate-200 flex items-center gap-2">
            <div className="flex gap-1">
              <span className="w-2.5 h-2.5 rounded-full bg-red-400"></span>
              <span className="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
              <span className="w-2.5 h-2.5 rounded-full bg-green-400"></span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono ml-1">Claude Desktop</span>
            <span className="ml-auto flex items-center gap-1 text-[10px] text-emerald-700 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">
              🔌 weather connected
            </span>
          </div>

          <div className="p-3 space-y-2">
            {/* user query */}
            <div className="flex justify-end">
              <div className="bg-amber-500 text-white px-3 py-1.5 rounded-lg rounded-br-none max-w-[85%] shadow-sm">
                <div className="text-[9px] uppercase tracking-wider text-amber-100 font-bold">user</div>
                <div className="text-xs font-medium">{mock.query}</div>
              </div>
            </div>

            {/* tools/call request */}
            <div className="bg-slate-900 text-amber-300 rounded-md p-2 font-mono text-[10px] border border-amber-400">
              <div className="text-[9px] text-amber-400 uppercase tracking-wider mb-0.5">→ MCP Server (stdio)</div>
              <div className="text-amber-200">{mock.request}</div>
            </div>

            {/* server response */}
            <div className="bg-slate-900 text-emerald-300 rounded-md p-2 font-mono text-[10px] border border-emerald-400">
              <div className="text-[9px] text-emerald-400 uppercase tracking-wider mb-0.5">← MCP Server response</div>
              <div className="text-emerald-200">content: [{`{ type: "text", text: "${mock.response}" }`}]</div>
            </div>

            {/* claude reply */}
            <div className="flex justify-start">
              <div className="bg-slate-100 text-slate-800 px-3 py-1.5 rounded-lg rounded-bl-none max-w-[85%] border border-slate-200">
                <div className="text-[9px] uppercase tracking-wider text-slate-500 font-bold">claude</div>
                <div className="text-xs">현재 서울 날씨는 <b>{mock.response.split(': ')[1]}</b>입니다.</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 통합 패널
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      const stages = makeStages(step.activeStage);
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-3">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between">
            <h2 className="text-sm font-bold text-slate-700">🍳 레스토랑 오픈 — MCP Server 빌드</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>

          <BuildPipeline stages={stages} />
          <ServerProcessBox activeStage={step.activeStage} />

          {step.hostMock && <ClaudeDesktopMock mock={step.hostMock} />}

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm bg-amber-500"></span>
              실행 중
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm bg-amber-200 border border-amber-400"></span>
              완료
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm bg-white border border-slate-200"></span>
              대기
            </span>
            <span className="ml-auto font-mono">stdio JSON-RPC 2.0</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + 파일 탭
    //   step.activeFile : 현재 표시 파일 key
    //   step.fileOverride: highlight 등 덮어쓰기
    //   tabs : 클릭으로 다른 파일 임시 보기 (manual override)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ step, stepIdx, total }) {
      const [manualFile, setManualFile] = useState(null);
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      // 단계가 바뀌면 manual override 해제
      useEffect(() => { setManualFile(null); }, [stepIdx]);

      const fileKey = manualFile ?? step.activeFile;
      // 강조는 스텝(=beat)이 든다. 탭을 손으로 옮긴 동안에는 그 파일 기본값을 쓴다.
      const baseCode = manualFile ? FILES[manualFile] : (step.fileOverride || FILES[step.activeFile]);
      const stepHi = !manualFile && step.highlight && step.highlight.length ? step.highlight : null;
      // 새 객체를 매 렌더 만들면 아래 useEffect([code]) 가 무한히 돈다.
      const code = React.useMemo(
        () => (stepHi ? { ...baseCode, highlight: stepHi } : baseCode),
        [baseCode, stepHi],
      );

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      const tabKeys = ['pkg', 'server', 'register', 'transport', 'config'];

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 row */}
          <div className="bg-[#21252b] px-3 pt-2 border-b border-slate-700">
            <div className="flex items-center gap-2 mb-2">
              <div className="flex gap-1.5">
                <span className="w-3 h-3 rounded-full bg-red-500"></span>
                <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span className="w-3 h-3 rounded-full bg-green-500"></span>
              </div>
              <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
            </div>
            <div className="flex gap-1 overflow-x-auto">
              {tabKeys.map((k) => {
                const isActive = k === fileKey;
                const isStepFile = k === step.activeFile;
                return (
                  <button
                    key={k}
                    onClick={() => setManualFile(k === step.activeFile ? null : k)}
                    className={`text-[10px] px-2 py-1 rounded-t-md font-mono whitespace-nowrap transition-colors ${
                      isActive
                        ? 'bg-[#282c34] text-amber-300 border-t-2 border-l border-r border-amber-400'
                        : isStepFile
                        ? 'bg-[#21252b] text-amber-200 border-b border-amber-500'
                        : 'bg-[#1e2227] text-slate-500 hover:text-slate-300'
                    }`}
                  >
                    {FILES[k].filename.split('/').pop()}
                  </button>
                );
              })}
            </div>
          </div>

          {/* hidden code for hljs */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* rendered lines + line numbers + highlight */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/15 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.filename} · {code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}{manualFile ? ' · 수동 보기' : ''}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-3-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-500 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. MCP &gt; Chapter 3. MCP 실전</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">MCP Server 만들기</h1>
                  <p className="text-sm text-slate-500 mt-0.5">레스토랑 오픈 — TypeScript SDK로 Server 5단계 빌드 + Claude Desktop 등록</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer step={step} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                💡 다음(Part V)에서는 Server + Client + 외부 도구를 합쳐 <strong>실전 에이전트</strong>를 구축한다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-600 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 키워드 칩 */}
            <div className="flex flex-wrap gap-2">
              {['npm init', '@modelcontextprotocol/sdk', 'setRequestHandler', 'tools/call', 'StdioServerTransport', 'claude_desktop_config.json'].map(kw => (
                <span key={kw} className="bg-amber-50 text-amber-800 px-3 py-1 rounded-full text-xs font-medium border border-amber-200 font-mono">{kw}</span>
              ))}
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[110px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./IV-2-2.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; IV-2-2 MCP 통신 흐름</a>
              <a href="../part5/V-1-1.html" className="text-emerald-700 hover:text-emerald-900 font-medium">Part V. 실전 에이전트 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
