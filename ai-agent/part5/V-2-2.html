  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }

  <!--
    V-2-2. AI Agent — Multi-Agent 개요 (협업 패턴 + 운영 체크리스트)
    학습 목표: Single → Multi 전환 시점, 3 협업 패턴(Supervisor/Hierarchy/Network),
              협업 메커니즘(Hand-off / Memory share / Task split),
              12 운영 체크리스트(loop guard, cost cap, observability)
    핵심 비유: 회사 조직도 — 1인 → 팀장+팀원 → 사업부 → 셀(Network)
    패턴: fastapi v1 — 좌(LiveDataPane: 3 패턴 다이어그램 + 12 체크리스트 누적) / 우(VSCode CodeViewer)
    색상: amber (마지막 자료 — ai-agent 100% 통일 축하)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 3 협업 패턴 메타 — Supervisor / Hierarchy / Network
    // ─────────────────────────────────────────────────────
    const PATTERNS = [
      {
        key: 'supervisor',
        emoji: '👨‍💼',
        name: 'Supervisor',
        sub: '팀장 → 팀원 (1:N)',
        when: '단순/중간 복잡도, 결정권 집중',
        example: 'PM → Researcher / Coder / Reviewer',
        nodes: ['PM', 'Researcher', 'Coder', 'Reviewer'],
        edges: [
          { from: 'PM', to: 'Researcher' },
          { from: 'PM', to: 'Coder' },
          { from: 'PM', to: 'Reviewer' },
        ],
      },
      {
        key: 'hierarchy',
        emoji: '🏢',
        name: 'Hierarchy',
        sub: '사업부 → 팀 → 팀원 (다단계)',
        when: '대규모, 도메인별 분할',
        example: 'CEO → Frontend Lead / Backend Lead → 각 팀원',
        nodes: ['CEO', 'FE Lead', 'BE Lead', 'FE-1', 'FE-2', 'BE-1', 'BE-2'],
        edges: [
          { from: 'CEO', to: 'FE Lead' },
          { from: 'CEO', to: 'BE Lead' },
          { from: 'FE Lead', to: 'FE-1' },
          { from: 'FE Lead', to: 'FE-2' },
          { from: 'BE Lead', to: 'BE-1' },
          { from: 'BE Lead', to: 'BE-2' },
        ],
      },
      {
        key: 'network',
        emoji: '🕸️',
        name: 'Network',
        sub: '셀 ↔ 셀 (M:N)',
        when: '검증/토론, 다양한 의견',
        example: 'Critic ↔ Writer ↔ Researcher 자유 hand-off',
        nodes: ['Writer', 'Critic', 'Researcher', 'Tester'],
        edges: [
          { from: 'Writer', to: 'Critic' },
          { from: 'Critic', to: 'Writer' },
          { from: 'Writer', to: 'Researcher' },
          { from: 'Researcher', to: 'Tester' },
          { from: 'Tester', to: 'Critic' },
          { from: 'Critic', to: 'Researcher' },
        ],
      },
    ];

    // ─────────────────────────────────────────────────────
    // 12 운영 체크리스트 (3 그룹 × 4 항목)
    // ─────────────────────────────────────────────────────
    const CHECKLIST = [
      // Loop Guard (4)
      { group: 'loop', text: 'max_iterations 상한 (≤25)' },
      { group: 'loop', text: 'no-progress 감지 (3턴 동일 응답 → break)' },
      { group: 'loop', text: 'tool error 누적 cap (≥3회 → escalate)' },
      { group: 'loop', text: 'wall-clock timeout (예: 5min)' },
      // Cost Cap (4)
      { group: 'cost', text: '세션 token cap (예: 200k)' },
      { group: 'cost', text: '일일/유저 호출 한도 + 80% 알람' },
      { group: 'cost', text: 'sub-agent 모델 라우팅 (small/large)' },
      { group: 'cost', text: 'tool call 최대 횟수 (예: 30)' },
      // Observability (4)
      { group: 'obs', text: 'trace_id 모든 sub-agent 전파' },
      { group: 'obs', text: 'hand-off 로그 (from/to/payload)' },
      { group: 'obs', text: 'p50/p95 latency + error rate 대시' },
      { group: 'obs', text: 'human-in-the-loop 게이트 (위험 작업)' },
    ];

    const GROUP_META = {
      loop: { emoji: '🔁', name: 'Loop Guard', color: 'amber' },
      cost: { emoji: '💰', name: 'Cost Cap', color: 'amber' },
      obs:  { emoji: '📡', name: 'Observability', color: 'amber' },
    };

    // ─────────────────────────────────────────────────────
    // STEPS — 4 단계
    // Step 1: Single → Multi 전환 + 3 패턴 소개
    // Step 2: 협업 메커니즘 (Hand-off / Memory / Task split)
    // Step 3: 운영 체크리스트 12 항목 누적
    // Step 4: 종합 — Multi-Agent 시작 가이드 (ai-agent 100% 축하)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      supervisor: {lang:"python", filename:"supervisor.py", lines:[
        "\"\"\"Supervisor 패턴 — PM Agent가 sub-agent에게 task 분배.",
        "",
        "가장 흔한 시작점. LangGraph supervisor 노드 1개 + worker N개.",
        "\"\"\"",
        "from langgraph.graph import StateGraph, END",

        "\"\"\"",
        "from typing import TypedDict",
        "from langgraph.graph import StateGraph, END",
        "from langchain_openai import ChatOpenAI",
        "",
        "# ── 공유 state — 모든 agent가 읽고 쓴다 (memory share)",
        "class SharedState(TypedDict):",
        "    feature_request: str",
        "    fe_subtasks: list[str]",
        "    be_subtasks: list[str]",
        "    fe_results: list[str]",
        "    be_results: list[str]",

        "    \"\"\"기능 요구사항 → FE/BE 두 갈래로 hand-off.\"\"\"",
        "    plan = llm.invoke(f\"분리: FE/BE? — {state['feature_request']}\")",
        "    return {\"fe_subtasks\": [\"UI\"], \"be_subtasks\": [\"API\", \"DB\"]}",
        "",
        "# ── 2. Task split — Lead가 자식 worker로 작업 분해",
        "def fe_lead_split(state: SharedState) -> dict:",
        "    \"\"\"FE Lead — 자식 worker N개에 병렬 분배.\"\"\"",
        "    results = [run_fe_worker(t) for t in state[\"fe_subtasks\"]]",
        "    return {\"fe_results\": results}",
        "",
        "def be_lead_split(state: SharedState) -> dict:",
        "    \"\"\"BE Lead — DB worker + API worker로 분해.\"\"\"",
        "    results = [run_be_worker(t) for t in state[\"be_subtasks\"]]",
        "    return {\"be_results\": results}",

        activePatterns: [
          "supervisor",
          "hierarchy",
          "network"
        ],
        focusPattern: "network",
        messageFlow: [
          {
            "from": "Writer",
            "to": "Critic",
            "label": "review"
          },
          {
            "from": "Critic",
            "to": "Writer",
            "label": "feedback"
          }
        ],
        checklistDone: 12,
        code: { ...CODE.checklist, highlight: [28,29,30,31,32] },
      },
      { ...S4,
        beat: {
          "label": "볼 수 있게 만든다",
          "at": "checklist.md L34–38",
          "caption": "trace_id 전파·hand-off 로그·지연/에러 대시·사람 게이트. 관측이 없으면 개선도 없다.",
          "changes": [
            {
              "mark": "read",
              "text": "obs 가드 4항목"
            },
            {
              "mark": "new",
              "text": "p50/p95 대시"
            }
          ]
        },
        activePatterns: [
          "supervisor",
          "hierarchy",
          "network"
        ],
        focusPattern: "network",
        messageFlow: [
          {
            "from": "Writer",
            "to": "Researcher",
            "label": "lookup"
          }
        ],
        checklistDone: 12,
        code: { ...CODE.checklist, highlight: [34,35,36,37,38] },
      },
      { ...S4,
        beat: {
          "label": "PoC 하나로 시작한다",
          "at": "checklist.md L40–44",
          "caption": "Supervisor + 도구 3개 + 12 가드로 1주일. 측정한 뒤에 Hierarchy 나 Network 로 넓힌다.",
          "changes": [
            {
              "mark": "new",
              "text": "PoC 범위 확정"
            },
            {
              "mark": "read",
              "text": "확장은 측정 후에"
            }
          ]
        },
        activePatterns: [
          "supervisor",
          "hierarchy",
          "network"
        ],
        focusPattern: "supervisor",
        messageFlow: [
          {
            "from": "PM",
            "to": "Researcher",
            "label": "PoC"
          },
          {
            "from": "PM",
            "to": "Coder",
            "label": "PoC"
          }
        ],
        checklistDone: 12,
        code: { ...CODE.checklist, highlight: [40,41,42,43,44] },
      },
      { ...S4,
        beat: {
          "label": "26/26 마무리",
          "at": "checklist.md L46–53",
          "caption": "세 패턴과 12 가드가 시작 가이드의 전부다. 이제 직접 만들어 볼 차례다.",
          "changes": [
            {
              "mark": "new",
              "text": "3 패턴 + 12 가드 완성"
            },
            {
              "mark": "read",
              "text": "다음은 직접 구현"
            }
          ]
        },
        activePatterns: [
          "supervisor",
          "hierarchy",
          "network"
        ],
        focusPattern: null,
        messageFlow: [],
        checklistDone: 12,
        code: { ...CODE.checklist, highlight: [46,47,48,49,50,51,52,53] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 패턴 카드 노드 위치 — 다이어그램용 (절대 좌표 %)
    // ─────────────────────────────────────────────────────
    const NODE_POS = {
      supervisor: {
        PM:         { x: 50, y: 18 },
        Researcher: { x: 18, y: 75 },
        Coder:      { x: 50, y: 75 },
        Reviewer:   { x: 82, y: 75 },
      },
      hierarchy: {
        CEO:       { x: 50, y: 12 },
        'FE Lead': { x: 25, y: 45 },
        'BE Lead': { x: 75, y: 45 },
        'FE-1':    { x: 12, y: 80 },
        'FE-2':    { x: 38, y: 80 },
        'BE-1':    { x: 62, y: 80 },
        'BE-2':    { x: 88, y: 80 },
      },
      network: {
        Writer:     { x: 25, y: 25 },
        Critic:     { x: 75, y: 25 },
        Researcher: { x: 25, y: 75 },
        Tester:     { x: 75, y: 75 },
      },
    };

    // ─────────────────────────────────────────────────────
    // 한 패턴의 다이어그램 (SVG + 노드)
    // ─────────────────────────────────────────────────────
    function PatternDiagram({ pattern, isActive, isFocus, messageFlow }) {
      const positions = NODE_POS[pattern.key];
      const flowEdges = (messageFlow || []).filter((m) =>
        positions[m.from] && positions[m.to]
      );
      return (
        <div
          className={`relative rounded-lg border-2 p-3 transition-all duration-500 ${
            isActive
              ? isFocus
                ? 'bg-amber-50 border-amber-500 ring-2 ring-amber-300 ring-offset-1 shadow-md'
                : 'bg-amber-50/60 border-amber-300'
              : 'bg-slate-50 border-slate-200 opacity-50'
          }`}
        >
          <div className="flex items-center gap-1.5 mb-1">
            <span className="text-base" aria-hidden="true">{pattern.emoji}</span>
            <span className={`text-xs font-bold ${isActive ? 'text-amber-800' : 'text-slate-500'}`}>
              {pattern.name}
            </span>
          </div>
          <div className={`text-[10px] mb-2 ${isActive ? 'text-amber-700' : 'text-slate-400'}`}>
            {pattern.sub}
          </div>

          {/* SVG 다이어그램 */}
          <div className="relative w-full" style={{ height: '160px' }}>
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full">
              {/* 정적 엣지 */}
              {pattern.edges.map((e, i) => {
                const a = positions[e.from];
                const b = positions[e.to];
                if (!a || !b) return null;
                return (
                  <line
                    key={`edge-${i}`}
                    x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                    stroke={isActive ? '#f59e0b' : '#cbd5e1'}
                    strokeWidth="0.5"
                    opacity={isActive ? 0.6 : 0.4}
                  />
                );
              })}
              {/* 메시지 흐름 (animated) */}
              {isFocus && flowEdges.map((m, i) => {
                const a = positions[m.from];
                const b = positions[m.to];
                return (
                  <g key={`flow-${i}`}>
                    <line
                      x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                      stroke="#d97706"
                      strokeWidth="1.2"
                      strokeDasharray="3 2"
                      opacity="0.9"
                    >
                      <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1.2s" repeatCount="indefinite" />
                    </line>
                  </g>
                );
              })}
            </svg>
            {/* 노드 — 절대 위치 */}
            {Object.entries(positions).map(([name, pos]) => (
              <div
                key={name}
                className={`absolute -translate-x-1/2 -translate-y-1/2 px-1.5 py-0.5 rounded text-[9px] font-bold border whitespace-nowrap transition-colors duration-500 ${
                  isActive
                    ? 'bg-white border-amber-400 text-amber-800 shadow-sm'
                    : 'bg-white border-slate-300 text-slate-500'
                }`}
                style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
              >
                {name}
              </div>
            ))}
          </div>

          <div className={`mt-2 text-[10px] leading-tight ${isActive ? 'text-amber-700' : 'text-slate-400'}`}>
            <div><span className="font-semibold">언제:</span> {pattern.when}</div>
            <div><span className="font-semibold">예:</span> {pattern.example}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측: 3 패턴 다이어그램 + 12 체크리스트
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, activePatterns, focusPattern, messageFlow, checklistDone, isFinal }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🤝 Multi-Agent 협업 패턴</h2>
            <span className="text-[10px] text-slate-400 font-mono">3 패턴 · 12 가드</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 3 패턴 다이어그램 (1열로 쌓아 다이어그램이 잘 보이도록) */}
          <div className="grid grid-cols-1 gap-2.5 mb-4">
            {PATTERNS.map((p) => (
              <PatternDiagram
                key={p.key}
                pattern={p}
                isActive={activePatterns.includes(p.key)}
                isFocus={focusPattern === p.key}
                messageFlow={focusPattern === p.key ? messageFlow : []}
              />
            ))}
          </div>

          {/* 12 운영 체크리스트 — Step 3+에서 활성화 */}
          <div
            className={`rounded-lg border-2 p-3 transition-all duration-500 ${
              checklistDone === 12
                ? isFinal
                  ? 'bg-amber-100 border-amber-500 animate-pulse'
                  : 'bg-amber-50 border-amber-400'
                : 'bg-slate-50 border-slate-300'
            }`}
          >
            <div className="flex items-baseline justify-between mb-1.5">
              <span className="text-xs font-bold text-slate-700">12 운영 가드</span>
              <span
                className={`text-lg font-extrabold tabular-nums ${
                  checklistDone === 12 ? 'text-amber-700' : 'text-slate-500'
                }`}
              >
                {checklistDone}<span className="text-xs text-slate-500"> / 12</span>
                {checklistDone === 12 && <span className="ml-1.5">✓</span>}
              </span>
            </div>

            {/* 12 항목 — 3 그룹 × 4 */}
            <div className="grid grid-cols-3 gap-2">
              {(['loop', 'cost', 'obs']).map((g) => {
                const meta = GROUP_META[g];
                const items = CHECKLIST.filter((c) => c.group === g);
                return (
                  <div key={g} className="space-y-1">
                    <div className="flex items-center gap-1 text-[10px] font-bold text-slate-700">
                      <span aria-hidden="true">{meta.emoji}</span>
                      <span>{meta.name}</span>
                    </div>
                    <ul className="space-y-0.5">
                      {items.map((it, i) => {
                        const done = checklistDone === 12;
                        return (
                          <li
                            key={i}
                            className={`text-[9.5px] leading-tight flex items-start gap-1 transition-colors duration-500 ${
                              done ? 'text-amber-800' : 'text-slate-400'
                            }`}
                          >
                            <span className={done ? 'text-amber-600 font-bold' : 'text-slate-300'}>
                              {done ? '✓' : '○'}
                            </span>
                            <span className="flex-1">{it.text}</span>
                          </li>
                        );
                      })}
                    </ul>
                  </div>
                );
              })}
            </div>

            {checklistDone === 12 && isFinal && (
              <div className="mt-2 pt-2 border-t border-amber-300 text-xs font-bold text-amber-800">
                ai-agent 26/26 완성 — 100% fastapi 패턴 통일 🎉
              </div>
            )}
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[10px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-amber-400"></span>활성 패턴
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-slate-300"></span>비활성
            </span>
            <span className="ml-auto font-mono">3 + 12 = 시작 가이드</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        const html = codeRef.current.innerHTML;
        setRenderedLines(html.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화 hidden */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 */}
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/10 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];
      const isFinal = stepIdx === STEPS.length - 1;

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-600 text-white flex items-center justify-center rounded-full font-bold text-sm">V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. 실전 에이전트 구축 &gt; Chapter 2. 실전 구현</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Multi-Agent 개요 — 협업 패턴 + 운영 체크리스트</h1>
                  <p className="text-sm text-slate-500 mt-0.5">Single → Supervisor / Hierarchy / Network · 12 운영 가드</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat}
                activePatterns={step.activePatterns}
                focusPattern={step.focusPattern}
                messageFlow={step.messageFlow}
                checklistDone={step.checklistDone}
                isFinal={isFinal}
              />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {isFinal && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                🎉 ai-agent 100% fastapi 패턴 통일 — Part I~V 26/26 자료 모두 완성. 다음 단계는 작은 PoC 한 번 직접 돌려보는 것
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./V-2-1.html" className="text-slate-500 hover:text-slate-700">&larr; V-2-1</a>
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">허브로 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
