    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-1-2. Few-shot CoT — 예시 추론을 미리 보여주는 4가지 reasoning 기법 비교
    학습 목표: Zero-shot / Few-shot CoT / Self-consistency / Tree of Thoughts 4가지를
              같은 문제에 적용해 정확도와 비용 트레이드오프를 5단계로 이해한다.
    핵심 비유: 시험 문제 풀이 — 그냥 풀기(Zero) vs 예제 보고 풀기(Few) vs 여러 번 풀고 다수결(Self-consistency) vs 가지치기 탐색(ToT)
    패턴: fastapi v1 — 좌(LiveDataPane: 4 기법 카드 + 추론 트리/체인 + 정확도 막대) / 우(VSCode CodeViewer)
    색상: ai-agent amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공통 문제 (모든 기법이 같은 문제를 푼다)
    //   "연필 12자루, 4자루 나눠주고 3자루 더 사면?"
    //   정답: 11자루
    // ─────────────────────────────────────────────────────
    const PROBLEM = '연필 12자루가 있다. 4자루를 친구에게 나눠주고, 3자루를 더 사면 몇 자루?';
    const ANSWER  = '11자루';

    // ─────────────────────────────────────────────────────
    // 기법별 메타 (4 기법 카드용)
    //   accuracy : 1000회 평가 시 정확도 (%) — 학습용 예시값
    //   cost     : 호출 1회당 토큰 비용 배수 (Zero-shot=1배 기준)
    //   latency  : 응답 시간 (ms)
    // ─────────────────────────────────────────────────────
    const TECHS = {
      zero: {
        id: 'zero',
        name: 'Zero-shot',
        icon: '🎲',
        desc: '예시 없이 바로 질문',
        accuracy: 62,
        cost: 1,
        latency: 800,
      },
      few: {
        id: 'few',
        name: 'Few-shot CoT',
        icon: '📝',
        desc: '예시 2~3개 + 단계별 풀이',
        accuracy: 84,
        cost: 3,
        latency: 1100,
      },
      sc: {
        id: 'sc',
        name: 'Self-consistency',
        icon: '🗳️',
        desc: '여러 번 호출 → 다수결',
        accuracy: 91,
        cost: 5,
        latency: 3000,
      },
      tot: {
        id: 'tot',
        name: 'Tree of Thoughts',
        icon: '🌳',
        desc: '여러 추론 가지 탐색 + 평가',
        accuracy: 94,
        cost: 8,
        latency: 4500,
      },
    };

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   activeTech : 활성 기법 ID ('zero'|'few'|'sc'|'tot'|null)
    //   chain      : 단일 추론 체인 [{ step, text, ok }]
    //   votes      : Self-consistency 투표 [{ id, answer, ok }]
    //   tree       : ToT 트리 { root, branches: [{ id, label, score, picked, leaves: [{ text, score }] }] }
    //   showCompare: 마지막 비교 막대 표시
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      zeroShot: {lang: "python", filename: "zero-shot.py", lines: [
        "# Zero-shot — 예시 없이 바로 질문",
        "from openai import OpenAI",
        "client = OpenAI()",
        "",
        "# 메시지 = 사용자 질문 1개. 끝.",
        "messages = [",
        "    {\"role\": \"user\",",
        "     \"content\": \"연필 12자루. 4자루 나눠주고\"",
        "                \" 3자루 더 사면 몇 자루?\"},",
        "]",
        "",
        "res = client.chat.completions.create(",
        "    model=\"gpt-4o-mini\",",
        "    messages=messages,",
        "    temperature=0)",
        "",
        "print(res.choices[0].message.content)",
        "",
        "# 결과: \"9자루입니다\" (틀림)",
        "#  → 12-4+3=11 인데 한 번에 추측해 자주 오답",
        "# 평균 정확도: 약 62%",
        "# 장점: 가장 싸고 빠르다 (토큰 1배)",
        "# 단점: 다단계 추론이 약함",
      ]},
      fewShotCot: {lang: "python", filename: "few-shot-cot.py", lines: [
        "# Few-shot CoT — 풀이 예시 2~3개를 먼저 보여주기",
        "from openai import OpenAI",
        "client = OpenAI()",
        "",
        "messages = [",
        "    {\"role\": \"system\", \"content\": \"단계별로 풀어라\"},",

    function TechCards({ activeTech }) {
      const techList = [TECHS.zero, TECHS.few, TECHS.sc, TECHS.tot];
      return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
          {techList.map((t) => {
            const active = t.id === activeTech;
            const cls = active ? 'bg-amber-100 border-amber-500 shadow-md scale-105' : 'bg-slate-50 border-slate-200 opacity-60';
            const stat = active ? 'text-amber-700 font-mono font-bold' : 'text-slate-500 font-mono';
            return (
              <div key={t.id} className={`rounded-lg border-2 p-2 transition-all duration-500 ${cls}`}>
                <div className="flex items-center gap-1.5 mb-1">
                  <span className="text-base">{t.icon}</span>

                <div className="flex justify-between text-[9px] mt-1.5 pt-1.5 border-t border-amber-200">
                  <span className={stat}>{t.accuracy}%</span>
                  <span className={stat}>×{t.cost}</span>
                </div>
              </div>
            );
          })}
        </div>
      );

    // ─────────────────────────────────────────────────────
    // 추론 체인 시각화 (Step 1, 2 — Zero-shot, Few-shot)

    function ReasoningChain({ chain }) {
      if (!chain) return null;
      return (
        <div className="rounded-lg bg-gradient-to-br from-amber-50 to-amber-100 border border-amber-200 p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1">
            <span>🔗</span>
            <span>추론 체인 (단일 경로)</span>
          </div>
          <div className="space-y-1.5">
            {chain.map((c, i) => {
              const isQ = c.step === 'Q';
              const isA = c.step === 'A';
              const okStyle = c.ok === false
                ? 'bg-red-100 border-red-400 text-red-900'
                : c.ok === true
                ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                : 'bg-white border-amber-300 text-amber-900';
              const labelStyle = isQ
                ? 'bg-violet-600 text-white'
                : isA
                ? c.ok ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'
                : 'bg-amber-500 text-white';
              return (
                <div key={i} className="flex items-start gap-2">
                  <div className={`rounded px-2 py-0.5 text-[10px] font-bold font-mono shrink-0 min-w-[42px] text-center ${labelStyle}`}>
                    {c.step}
                  </div>
                  <div className={`flex-1 rounded border px-2 py-1 text-[11px] font-mono ${okStyle}`}>
                    {c.text}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

              <div key={v.id} className={`rounded border-2 p-1.5 text-center transition-all duration-500 ${v.ok ? 'bg-emerald-50 border-emerald-400' : 'bg-red-50 border-red-400'}`}>
                <div className="text-[9px] text-slate-500 font-mono">호출 {v.id}</div>
                <div className={`text-[11px] font-bold font-mono ${v.ok ? 'text-emerald-800' : 'text-red-800'}`}>{v.answer}</div>
                <div className="text-[10px] mt-0.5">{v.ok ? '✓' : '✗'}</div>
              </div>
            ))}
          </div>
          {finalVote && (
            <div className="rounded-lg bg-amber-600 text-white p-2.5 flex items-center justify-between shadow-sm">
              <div>
                <div className="text-[9px] uppercase tracking-wider text-amber-200 font-bold">최종 (다수결)</div>
                <div className="text-base font-bold font-mono mt-0.5">{finalVote.answer}</div>
              </div>
              <div className="text-right">
                <div className="text-2xl font-bold font-mono">{finalVote.count}</div>
                <div className="text-[10px] text-amber-200">/ {finalVote.total} 표</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Tree of Thoughts 트리 시각화 (Step 4)
    // ─────────────────────────────────────────────────────
    function ThoughtTree({ tree }) {
      if (!tree) return null;
      const w = 400, h = 260;
      // 라인 (root → branch, branch → leaf)
      const lines = [];
      tree.branches.forEach((b) => {
        lines.push({ x1: tree.root.x, y1: tree.root.y + 14, x2: b.x, y2: b.y - 14, picked: b.picked });
        b.leaves.forEach((l) => {
          lines.push({ x1: b.x, y1: b.y + 14, x2: l.x, y2: l.y - 14, picked: b.picked && l.picked });
        });
      });
      return (
        <div className="rounded-lg bg-gradient-to-br from-amber-50 to-amber-100 border border-amber-200 p-3">
          <div className="text-[11px] font-bold text-amber-800 mb-2 flex items-center gap-1">
            <span>🌳</span><span>추론 가지 탐색 (점수 top 채택)</span>
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            <defs>
              <pattern id="grid-tot" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#fde68a" strokeWidth="0.5" />
              </pattern>
            </defs>
            <rect width={w} height={h} fill="url(#grid-tot)" />
            {lines.map((ln, i) => (
              <line key={`ln${i}`} x1={ln.x1} y1={ln.y1} x2={ln.x2} y2={ln.y2}
                stroke={ln.picked ? '#d97706' : '#cbd5e1'} strokeWidth={ln.picked ? 2.5 : 1.5}
                strokeDasharray={ln.picked ? 'none' : '4,3'} opacity={ln.picked ? 1 : 0.5} />
            ))}
            {/* 루트 */}
            <g>
              <rect x={tree.root.x - 90} y={tree.root.y - 14} width={180} height={28} rx={6}
                fill="#7c3aed" stroke="#5b21b6" strokeWidth="1.5" />
              <text x={tree.root.x} y={tree.root.y + 4} textAnchor="middle" fontSize="9"
                fontWeight="bold" fill="white" fontFamily="monospace">문제</text>
            </g>
            {/* 가지 */}
            {tree.branches.map((b) => {
              const fill = b.picked ? '#f59e0b' : '#e2e8f0';
              const stroke = b.picked ? '#b45309' : '#94a3b8';
              const tc = b.picked ? 'white' : '#475569';
              return (
                <g key={b.id}>
                  <rect x={b.x - 55} y={b.y - 14} width={110} height={28} rx={5}
                    fill={fill} stroke={stroke} strokeWidth={b.picked ? 2 : 1} />
                  <text x={b.x} y={b.y - 1} textAnchor="middle" fontSize="8.5"
                    fontWeight="bold" fill={tc} fontFamily="monospace">{b.label}</text>
                  <text x={b.x} y={b.y + 9} textAnchor="middle" fontSize="8"
                    fill={tc} fontFamily="monospace">score: {b.score}/10</text>
                </g>
              );
            })}
            {/* 리프 */}
            {tree.branches.flatMap((b) => b.leaves.map((l) => {
              const picked = b.picked && l.picked;
              const fill = picked ? '#10b981' : (b.picked ? '#fef3c7' : '#f1f5f9');
              const stroke = picked ? '#047857' : (b.picked ? '#d97706' : '#cbd5e1');
              const tc = picked ? 'white' : '#475569';
              return (
                <g key={l.id}>
                  <rect x={l.x - 60} y={l.y - 14} width={120} height={28} rx={5}
                    fill={fill} stroke={stroke} strokeWidth={picked ? 2 : 1} opacity={!b.picked ? 0.6 : 1} />
                  <text x={l.x} y={l.y - 1} textAnchor="middle" fontSize="8.5"
                    fontWeight={picked ? 'bold' : 'normal'} fill={tc} fontFamily="monospace">{l.text}</text>
                  <text x={l.x} y={l.y + 9} textAnchor="middle" fontSize="8"
                    fill={tc} fontFamily="monospace">score: {l.score}/10</text>
                  {picked && (
                    <circle cx={l.x + 55} cy={l.y - 7} r={6} fill="#fbbf24" stroke="white" strokeWidth="1.5">
                      <animate attributeName="r" from="5" to="9" dur="1.4s" repeatCount="indefinite" />
                      <animate attributeName="opacity" from="1" to="0.3" dur="1.4s" repeatCount="indefinite" />
                    </circle>
                  )}
                </g>
              );
            }))}
          </svg>
          {tree.finalAnswer && (
            <div className="mt-2 rounded bg-emerald-100 border border-emerald-400 p-2 text-center">
              <div className="text-[9px] text-emerald-700 uppercase tracking-wider font-bold">최종 채택</div>
              <div className="text-xs font-bold text-emerald-900 font-mono mt-0.5">{tree.finalAnswer}</div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 정확도 막대 비교 (Step 5)
    // ─────────────────────────────────────────────────────
    function CompareBar() {
      const techList = [TECHS.zero, TECHS.few, TECHS.sc, TECHS.tot];
      const useCases = {
        zero: '분류, FAQ 단답, 짧은 답변',
        few:  '일반 챗봇, 요약, 번역, 가벼운 추론',
        sc:   '의료/법률/금융 등 critical 도메인',
        tot:  '수학 올림피아드, 알고리즘, 게임 AI',
      };
      const renderBars = (label, icon, key, max, gradient, suffix) => (
        <div className="rounded-lg bg-white border-2 border-amber-300 p-3">
          <div className="text-xs font-bold text-amber-900 mb-2 flex items-center gap-1">
            <span>{icon}</span><span>{label}</span>
          </div>
          <div className="space-y-1.5">
            {techList.map((t) => (
              <div key={t.id} className="flex items-center gap-2">
                <div className="w-32 shrink-0 flex items-center gap-1 text-[11px]">
                  <span>{t.icon}</span>
                  <span className="font-bold text-slate-700">{t.name}</span>
                </div>
                <div className="flex-1 h-5 bg-slate-100 rounded overflow-hidden relative">
                  <div className={`h-full bg-gradient-to-r ${gradient} transition-all duration-1000 flex items-center justify-end pr-1.5`}
                    style={{ width: `${(t[key] / max) * 100}%` }}>
                    <span className="text-[10px] font-bold text-white font-mono">{suffix(t[key])}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
      return (
        <div className="space-y-3">
          {renderBars('정확도 비교 (GSM8K 수학 벤치마크 기준)', '🎯', 'accuracy', 100, 'from-amber-400 to-amber-600', (v) => `${v}%`)}
          {renderBars('비용 비교 (Zero-shot=1배 기준)', '💸', 'cost', 10, 'from-red-400 to-red-600', (v) => `×${v}`)}
          <div className="rounded-lg bg-white border-2 border-amber-300 overflow-hidden">
            <div className="bg-amber-100 px-3 py-1.5 border-b border-amber-200">
              <div className="text-xs font-bold text-amber-900">📋 실무 권장 사용처</div>
            </div>
            <table className="w-full text-[11px]">
              <tbody>
                {techList.map((t, i) => (
                  <tr key={t.id} className={i % 2 === 0 ? 'bg-white' : 'bg-amber-50/40'}>
                    <td className="px-3 py-1.5 font-bold text-amber-900 border-r border-slate-100 w-1/3">
                      {t.icon} {t.name}
                    </td>
                    <td className="px-3 py-1.5 text-slate-700 font-mono">{useCases[t.id]}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 4 카드 + (체인|투표|트리|비교)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🧠 Reasoning 4 기법 비교</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 4 기법 카드 */}
          <TechCards activeTech={step.activeTech} />

          {/* 단계별 시각화 */}
          {step.chain    && <ReasoningChain chain={step.chain} />}
          {step.votes    && <VoteBoard votes={step.votes} finalVote={step.finalVote} />}
          {step.tree     && <ThoughtTree tree={step.tree} />}
          {step.showCompare && <CompareBar />}

          {/* 범례 */}
          {!step.showCompare && (
            <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                활성 기법
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                정답
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                오답
              </span>
              <span className="flex items-center gap-1 ml-auto">
                <span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
                미사용
              </span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/15 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 핵심 패턴 &gt; Chapter 1. Chain of Thought</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Few-shot CoT — 예시 추론을 미리 보여줌</h1>
                  <p className="text-sm text-slate-500 mt-0.5">Zero-shot · Few-shot · Self-consistency · Tree of Thoughts 4 기법 비교</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                💡 다음(III-2-1)에서는 <strong>ReAct</strong> — 추론 + 도구 호출(Tool use)을 결합해 외부 세계와 상호작용하는 에이전트 패턴을 다룬다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[110px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-1-1.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; III-1-1. Chain of Thought</a>
              <a href="./III-2-1.html" className="text-amber-700 hover:text-amber-900 font-medium">III-2-1. ReAct란 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
