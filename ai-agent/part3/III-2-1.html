  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <div id="root"></div>

  <!--
    III-2-1. ReAct란 — Reasoning + Acting (추론과 행동의 결합)
    학습 목표: CoT(추론만)와 Tool Use(행동만)의 한계를 본 뒤,
              둘을 결합한 ReAct 루프(Thought → Action → Observation)가
              왜 hallucination을 줄이고 다단계 검증을 가능하게 하는지 5단계로 이해한다.
    핵심 비유: 형사의 수사 — 추리(Thought) → 조사(Action) → 단서(Observation) → 다시 추리
    패턴: fastapi v1 — 좌(LiveDataPane: ReAct 루프 SVG + 메시지 박스) / 우(VSCode CodeViewer)
    색상: ai-agent amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   mode      : 'cot' | 'tool' | 'react' | 'example' | 'compare'
    //   loop      : { thought, action, observation, cycle } — 활성 사이클 데이터
    //   messages  : [{ role, text }] — 좌측 메시지 박스에 누적
    //   answer    : 최종 답변 (있으면 표시)
    //   answerType: 'unknown' | 'fail' | 'success'
    //   activePhase: 'thought' | 'action' | 'observation' | null — 다이어그램 강조
    //   showCompare: boolean — Step 5에서 비교 표 표시
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 순수 CoT — 추론만, 외부 도구 없음',
        desc: 'CoT(Chain-of-Thought)는 LLM이 머릿속으로만 단계별 추론을 한다. 외부 검색/도구를 쓰지 않으니 학습 시점 데이터에만 의존 → 최신 정보나 사실 확인이 필요한 질문에 hallucination 발생 위험이 크다.',
        mode: 'cot',
        question: '2024 카타르 월드컵 우승국의 인구는?',
        activePhase: 'thought',
        messages: [
          { role: 'thought', text: '2024 카타르 월드컵... 음, 카타르 월드컵은 2022년이었던 것 같은데, 사용자가 2024라고 했으니 그렇게 가정하자.' },
          { role: 'thought', text: '우승국은 아르헨티나였던 걸로 기억한다. 인구는 약 4500만명?' },
        ],
        answer: '2024 카타르 월드컵 우승국 아르헨티나의 인구는 약 4500만명입니다. (실제로는 월드컵은 2022년이고 인구도 부정확 — hallucination)',
        answerType: 'fail',
        showCompare: false,
        code: {
          lang: 'python',
          filename: 'cot-only.py',
          lines: [
            '# 순수 CoT — 추론만, 외부 도구 호출 없음',
            'from openai import OpenAI',
            '',
            'client = OpenAI()',
            '',
            'prompt = """질문에 답하기 전에 단계별로 생각해라.',
            '',
            'Q: 2024 카타르 월드컵 우승국의 인구는?',
            'A: 단계별 추론:',
            '"""',
            '',
            'response = client.chat.completions.create(',
            '    model="gpt-4o",',
            '    messages=[{"role": "user", "content": prompt}],',
            ')',
            '',
            'print(response.choices[0].message.content)',
            '# 출력 예시:',
            '#   1) 2024 카타르 월드컵 우승국은 아르헨티나',
            '#   2) 아르헨티나 인구는 약 4500만명',
            '#   결론: 약 4500만명',
            '',
            '# 문제점',
            '#   - 외부 검색을 안 하니 사실 확인이 안 됨',
            '#   - 학습 시점 이후 데이터는 모름 (knowledge cutoff)',
            '#   - 모델이 모르는 사실도 그럴듯하게 지어냄 → hallucination',
            '#   - 카타르 월드컵은 2022년인데 사용자 오류를 못 바로잡음',
          ],
          highlight: [12, 13, 14, 15, 24, 25, 26, 27],
        },
      },
      {
        title: 'Step 2. 순수 Tool Use — Tool 호출만, 추론 없이 직진',
        desc: 'Tool Use는 도구를 부를 줄은 안다. 하지만 "왜 이 도구를 부르는지" 추론 단계가 없으면 잘못된 도구를 부르거나, 결과를 잘못 해석하거나, 결과를 결합하지 못한다. "검색 → 끝" — 후속 추론이 없다.',
        mode: 'tool',
        question: '2024 카타르 월드컵 우승국의 인구는?',
        activePhase: 'action',
        messages: [
          { role: 'action', text: 'search("2024 카타르 월드컵 우승국 인구")' },

    // ─────────────────────────────────────────────────────
    // 좌측 SVG: ReAct 루프 다이어그램 (3노드 순환)
    // ─────────────────────────────────────────────────────
    function ReactLoopDiagram({ activePhase, mode }) {
      const w = 360;
      const h = 240;
      const cx = w / 2;
      const cy = h / 2;
      const r = 80;
      // 3개 노드 위치 (정삼각형 — 위, 우하, 좌하)
      const positions = {
        thought:     { x: cx,         y: cy - r,        icon: '💭', label: 'Thought',     short: '추론' },
        action:      { x: cx + r * 0.87, y: cy + r * 0.5,  icon: '⚡', label: 'Action',      short: '행동' },
        observation: { x: cx - r * 0.87, y: cy + r * 0.5,  icon: '👁', label: 'Observation', short: '관찰' },
      };
      // 화살표 순서: thought → action → observation → thought
      const arrows = [
        { from: 'thought',     to: 'action' },
        { from: 'action',      to: 'observation' },
        { from: 'observation', to: 'thought' },
      ];

      // 모드별 강조
      const showAll = mode === 'react' || mode === 'example';
      const isCotOnly = mode === 'cot';
      const isToolOnly = mode === 'tool';

      // 활성 노드 판정
      const isActive = (key) => {
        if (activePhase === key) return true;
        return false;
      };

      // 노드 dim 처리
      const isDimmed = (key) => {
        if (isCotOnly) return key !== 'thought';
        if (isToolOnly) return key === 'thought';
        return false;
      };

      return (
        <div className="rounded-lg bg-gradient-to-br from-amber-50 to-amber-100 border border-amber-200 p-2">
          <div className="text-[11px] font-bold text-amber-800 mb-1 flex items-center gap-1">
            <span>🔁</span>
            <span>ReAct 루프 — Thought → Action → Observation</span>
          </div>
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            <defs>
              <pattern id="grid-react" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#fde68a" strokeWidth="0.5" />
              </pattern>
              <marker id="arrow-react" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto">
                <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706" />
              </marker>
              <marker id="arrow-dim" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                <path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1" />
              </marker>
            </defs>
            <rect width={w} height={h} fill="url(#grid-react)" />

            {/* 화살표 (호로 그려서 순환 느낌) */}
            {arrows.map((arr, i) => {
              const a = positions[arr.from];
              const b = positions[arr.to];
              const dimmed = isDimmed(arr.from) || isDimmed(arr.to);
              const stroke = dimmed ? '#cbd5e1' : '#d97706';
              const sw = dimmed ? 1.5 : 2.5;
              // 노드 가장자리에서 시작하도록 거리 보정
              const nodeR = 28;
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const len = Math.sqrt(dx * dx + dy * dy);
              const ux = dx / len;
              const uy = dy / len;
              const x1 = a.x + ux * nodeR;
              const y1 = a.y + uy * nodeR;
              const x2 = b.x - ux * nodeR;
              const y2 = b.y - uy * nodeR;
              // 곡선 컨트롤 포인트 (살짝 바깥으로)
              const mx = (x1 + x2) / 2;
              const my = (y1 + y2) / 2;
              const ctrlX = mx + uy * 25;
              const ctrlY = my - ux * 25;
              return (
                <path
                  key={`arr${i}`}
                  d={`M ${x1} ${y1} Q ${ctrlX} ${ctrlY} ${x2} ${y2}`}
                  fill="none"
                  stroke={stroke}
                  strokeWidth={sw}
                  opacity={dimmed ? 0.4 : 0.85}
                  markerEnd={dimmed ? 'url(#arrow-dim)' : 'url(#arrow-react)'}
                  className="transition-all duration-500"
                />
              );
            })}

            {/* 3 노드 */}
            {Object.entries(positions).map(([key, p]) => {
              const active = isActive(key);
              const dimmed = isDimmed(key);
              const fill = active ? '#d97706' : (dimmed ? '#e2e8f0' : '#fed7aa');
              const stroke = active ? '#92400e' : (dimmed ? '#94a3b8' : '#d97706');
              const textColor = active ? '#fff' : (dimmed ? '#94a3b8' : '#7c2d12');
              const nodeR = active ? 30 : 26;
              return (
                <g key={key} className="transition-all duration-500">
                  {active && (
                    <circle cx={p.x} cy={p.y} r={nodeR + 8} fill="none" stroke="#d97706" strokeWidth="2" opacity="0.5">
                      <animate attributeName="r" from={nodeR + 4} to={nodeR + 14} dur="1.4s" repeatCount="indefinite" />
                      <animate attributeName="opacity" from="0.6" to="0" dur="1.4s" repeatCount="indefinite" />
                    </circle>
                  )}
                  <circle cx={p.x} cy={p.y} r={nodeR} fill={fill} stroke={stroke} strokeWidth="2.5" opacity={dimmed ? 0.5 : 1} />
                  <text x={p.x} y={p.y - 2} textAnchor="middle" fontSize="14" pointerEvents="none">{p.icon}</text>
                  <text x={p.x} y={p.y + 14} textAnchor="middle" fontSize="9" fontWeight="bold" fill={textColor} fontFamily="monospace" pointerEvents="none">{p.short}</text>
                </g>
              );
            })}

            {/* 모드 라벨 */}
            <text x={cx} y={h - 8} textAnchor="middle" fontSize="9" fill="#92400e" fontFamily="monospace" fontWeight="bold">
              {isCotOnly && 'CoT only — 추론만 활성'}
              {isToolOnly && 'Tool Use only — 행동만 활성'}
              {showAll && 'ReAct — 전체 루프 활성'}
              {mode === 'compare' && '3가지 패턴 비교'}
            </text>
          </svg>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 메시지 박스 — Thought / Action / Observation 누적
    // ─────────────────────────────────────────────────────
    function MessageStack({ messages, question, answer, answerType }) {
      const styles = {
        thought:     { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   label: 'text-amber-700',   icon: '💭', name: 'Thought' },

        observation: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', label: 'text-emerald-700', icon: '👁', name: 'Observation' },
      };

      const ansStyle = {
        unknown: 'bg-slate-50 border-slate-300 text-slate-700',
        fail:    'bg-red-50 border-red-400 text-red-800',
        success: 'bg-emerald-50 border-emerald-400 text-emerald-800',
      };

      return (
        <div className="space-y-2">
          {question && (
            <div className="rounded-lg bg-amber-600 text-white p-2.5 flex items-start gap-2 shadow-sm">
              <span className="text-base leading-none">❓</span>
              <div className="flex-1">
                <div className="text-[9px] uppercase tracking-wider text-amber-100 font-bold">사용자 질문</div>
                <div className="text-xs font-bold mt-0.5">{question}</div>
              </div>
            </div>
          )}

          {messages && messages.length > 0 && (
            <div className="space-y-1.5 max-h-[260px] overflow-y-auto pr-1">
              {messages.map((m, i) => {
                const s = styles[m.role] || styles.thought;
                return (
                  <div key={i} className={`rounded-md border ${s.bg} ${s.border} p-2 flex items-start gap-2 transition-all duration-300`}>
                    <span className="text-sm leading-none mt-0.5">{s.icon}</span>
                    <div className="flex-1 min-w-0">
                      <div className={`text-[9px] uppercase tracking-wider font-bold ${s.label}`}>{s.name}</div>
                      <div className={`text-[11px] mt-0.5 ${s.text} ${m.role === 'action' ? 'font-mono' : 'leading-relaxed'} break-words`}>{m.text}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {answer && (
            <div className={`rounded-lg border-2 ${ansStyle[answerType]} p-2.5 flex items-start gap-2`}>
              <span className="text-base leading-none">
                {answerType === 'success' ? '✅' : answerType === 'fail' ? '⚠️' : '💬'}
              </span>
              <div className="flex-1">
                <div className="text-[9px] uppercase tracking-wider font-bold opacity-70">최종 답변</div>
                <div className="text-xs font-medium mt-0.5 leading-relaxed">{answer}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 비교 표 (Step 5)
    // ─────────────────────────────────────────────────────
    function CompareTable() {
      const rows = [
        { k: '추론(Reasoning)',     cot: 'O',   tool: 'X',   react: 'O' },
        { k: '행동(Acting)',        cot: 'X',   tool: 'O',   react: 'O' },
        { k: '다단계 검증',         cot: 'X',   tool: 'X',   react: 'O' },
        { k: '실시간 데이터',       cot: 'X',   tool: 'O',   react: 'O' },
        { k: 'Hallucination 위험', cot: '높음', tool: '중간', react: '낮음' },
        { k: '추론 투명성',         cot: '중간', tool: '낮음', react: '높음' },
        { k: 'LLM 호출 비용',       cot: '1회', tool: '1~2회', react: 'N회' },
      ];

      const cellStyle = (v) => {
        if (v === 'O' || v === '낮음' || v === '높음 (좋음)') return 'text-emerald-700 font-bold';
        if (v === 'X' || v === '높음') return 'text-red-700 font-bold';
        return 'text-slate-700';
      };

      return (
        <div className="rounded-lg bg-white border-2 border-amber-300 overflow-hidden">
          <div className="bg-amber-100 px-3 py-2 border-b border-amber-200">
            <div className="text-xs font-bold text-amber-900">📊 CoT vs Tool Use vs ReAct</div>
          </div>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="bg-amber-50 text-left">
                <th className="px-3 py-2 font-bold text-amber-700 w-1/3">기준</th>
                <th className="px-3 py-2 font-bold text-slate-600 text-center">CoT</th>
                <th className="px-3 py-2 font-bold text-slate-600 text-center">Tool Use</th>
                <th className="px-3 py-2 font-bold text-amber-700 text-center">ReAct</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={r.k} className={i % 2 === 0 ? 'bg-white' : 'bg-amber-50/40'}>
                  <td className="px-3 py-1.5 font-bold text-slate-700 border-r border-slate-100">{r.k}</td>
                  <td className={`px-3 py-1.5 text-center font-mono ${cellStyle(r.cot)}`}>{r.cot}</td>
                  <td className={`px-3 py-1.5 text-center font-mono ${cellStyle(r.tool)}`}>{r.tool}</td>
                  <td className={`px-3 py-1.5 text-center font-mono ${cellStyle(r.react)}`}>{r.react}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌(루프 다이어그램) + 메시지 박스
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🕵️ 형사의 수사 — 추론 + 행동의 결합</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>

          {step.showCompare ? (
            <CompareTable />
          ) : (
            <>
              <ReactLoopDiagram activePhase={step.activePhase} mode={step.mode} />
              <div className="mt-3">
                <MessageStack
                  messages={step.messages}
                  question={step.question}
                  answer={step.answer}
                  answerType={step.answerType}
                />
              </div>
            </>
          )}

          {/* 범례 */}
          {!step.showCompare && (
            <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full bg-amber-300"></span>
                Thought (추론)
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full bg-sky-300"></span>
                Action (도구 호출)
              </span>
              <span className="flex items-center gap-1">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-300"></span>
                Observation (결과)
              </span>
              <span className="flex items-center gap-1 ml-auto">
                <span className="w-2.5 h-2.5 rounded-full bg-slate-300"></span>
                미사용
              </span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + 라인 번호
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      // 5개 파일 탭 (모든 단계에서 표시 — 현재 파일 강조)
      const FILE_TABS = [
        { idx: 0, filename: 'cot-only.py' },
        { idx: 1, filename: 'tool-only.py' },
        { idx: 2, filename: 'react.py' },
        { idx: 3, filename: 'example.py' },
        { idx: 4, filename: 'compare.md' },
      ];

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot */}
          <div className="bg-[#21252b] px-4 py-1.5 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* 파일 탭 (5개) */}
          <div className="bg-[#21252b] flex items-center border-b border-slate-700 overflow-x-auto">
            {FILE_TABS.map((tab) => {
              const active = tab.filename === code.filename;
              return (
                <div
                  key={tab.filename}
                  className={`px-3 py-1.5 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                    active
                      ? 'bg-[#282c34] text-amber-300 border-t-2 border-t-amber-500'
                      : 'text-slate-500 hover:text-slate-300'
                  }`}
                >
                  {tab.filename}
                </div>
              );
            })}
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[32rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/15 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines · {code.filename}</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 핵심 패턴 &gt; Chapter 2. ReAct 패턴</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">III-2-1. ReAct란 — Reasoning + Acting</h1>
                  <p className="text-sm text-slate-500 mt-0.5">형사의 수사 — 추리(Thought) → 조사(Action) → 단서(Observation) → 다시 추리</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                💡 다음(III-2-2)에서는 <strong>ReAct 실행 흐름</strong>을 직접 따라가며 LangChain AgentExecutor가 내부적으로 어떻게 루프를 돌리는지 본다
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 키워드 칩 */}
            <div className="flex flex-wrap gap-2">
              {['ReAct', 'Reasoning', 'Acting', 'Thought-Action-Observation', '추론-행동 루프', 'Hallucination 감소'].map(kw => (
                <span key={kw} className="bg-amber-50 text-amber-700 px-3 py-1 rounded-full text-sm font-medium border border-amber-200">{kw}</span>
              ))}
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[110px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-1-2.html" className="text-amber-600 hover:text-amber-800 font-medium">&larr; III-1-2 Few-shot CoT</a>
              <a href="./III-2-2.html" className="text-amber-700 hover:text-amber-900 font-medium">III-2-2 ReAct 실행 흐름 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
