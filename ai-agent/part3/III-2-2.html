    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-2-2. ReAct 실행 흐름 (실제 코드 단계별)
    학습 목표: ReAct 루프가 실제로 어떻게 돌아가는지 사이클(Thought→Action→Observation)
              누적 + 종료 조건 체크까지 5단계로 이해한다.
    핵심 비유: 회의 메모 — 매 사이클마다 "내 생각 / 내가 한 행동 / 결과"를 차곡차곡 적는다.
    패턴: fastapi v1 — 좌(LiveDataPane: 사이클 누적 메모) / 우(VSCode CodeViewer 5 파일 탭)
    색상: ai-agent amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5개 파일의 코드 정의 (CodeViewer 탭별)
    //   각 파일은 ReAct 루프의 한 책임을 담당
    // ─────────────────────────────────────────────────────
    const FILES = {
      'agent-loop.py': {
        lang: 'python',
        filename: 'agent-loop.py',
        lines: [
          '"""ReAct 메인 루프 — Thought → Action → Observation 사이클을 반복한다.',
          '',
          '파일 경로: src/react/agent_loop.py',
          '주요 의존성: thought.py, action.py, observation.py, terminate.py',
          '"""',
          'from thought import generate_thought',
          'from action import execute_action',
          'from observation import build_observation',
          'from terminate import should_terminate',
          '',
          '',
          'def run_react(question: str, tools: dict, max_iter: int = 5) -> str:',
          '    """ReAct 루프 실행 — 사용자 질문에 답할 때까지 사이클을 돈다."""',
          '    history = [{"role": "user", "content": question}]',
          '',
          '    for i in range(max_iter):',
          '        # 1) Thought + Action 생성 (LLM 호출)',
          '        thought, action = generate_thought(history)',
          '        history.append({"role": "assistant",',
          '                        "thought": thought, "action": action})',
          '',
          '        # 2) 종료 조건 체크 — Final Answer면 즉시 반환',
          '        done, final = should_terminate(action, i, max_iter)',
          '        if done:',
          '            return final',
          '',
          '        # 3) Action 실행 → Observation',
          '        result = execute_action(action, tools)',
          '        observation = build_observation(result)',
          '        history.append({"role": "tool", "content": observation})',
          '',
          '    return "[max_iter 초과] 답을 찾지 못했습니다"',
        ],
        highlight: [12, 13, 16],
      },
      'thought.py': {
        lang: 'python',
        filename: 'thought.py',
        lines: [
          '"""Thought 생성 — LLM이 현재 상황을 보고 다음 행동을 결정한다."""',
          'from llm import call_llm',
          '',
          'REACT_SYSTEM = """당신은 ReAct 에이전트입니다.',
          '아래 형식으로만 응답하세요:',
          '',
          'Thought: <지금 무엇을 알고 있고, 다음에 무엇이 필요한지>',
          'Action: <도구이름>(<인자>)        # 도구 호출이 필요할 때',
          'Final Answer: <최종 답>           # 충분한 정보를 모았을 때',
          '"""',
          '',
          '',
          'def generate_thought(history: list) -> tuple[str, dict]:',
          '    """대화 history → LLM → Thought + Action(또는 Final Answer) 파싱."""',
          '    messages = [{"role": "system", "content": REACT_SYSTEM}, *history]',
          '    raw = call_llm(messages, temperature=0.0)',
          '',
          '    # 파싱: "Thought: ...\\nAction: ..." 또는 "...Final Answer: ..."',
          '    thought = _extract(raw, "Thought:")',
          '    if "Final Answer:" in raw:',
          '        action = {"type": "final", "answer": _extract(raw, "Final Answer:")}',
          '    else:',
          '        action = _parse_tool_call(_extract(raw, "Action:"))',
          '    return thought, action',
          '',
          '',
          'def _parse_tool_call(line: str) -> dict:',
          '    """\'search("쿼리")\' → {"type": "tool", "name": "search", "args": ...}"""',
          '    name, args = line.split("(", 1)',
          '    return {"type": "tool", "name": name.strip(),',
          '            "args": args.rstrip(")").strip().strip("\\"")}',
        ],
        highlight: [13, 14, 15, 16],
      },
      'action.py': {
        lang: 'python',
        filename: 'action.py',
        lines: [
          '"""Action 실행 — LLM이 결정한 도구를 실제로 호출한다."""',
          '',
          '',
          'def execute_action(action: dict, tools: dict) -> any:',
          '    """tools 레지스트리에서 함수를 찾아 호출하고 결과 반환.',
          '',
          '    Args:',
          '        action: {"type": "tool", "name": "search", "args": "..."}',
          '        tools: {"search": <fn>, "read_page": <fn>, ...}',
          '    Returns:',
          '        도구 실행 결과 (문자열, dict, 리스트 등 도구마다 다름)',
          '    Raises:',
          '        KeyError: 등록되지 않은 도구를 호출하면 발생',
          '    """',
          '    if action["type"] != "tool":',
          '        raise ValueError("execute_action은 tool action만 처리합니다")',
          '',
          '    tool_fn = tools[action["name"]]    # KeyError 가능 — 의도된 fail-fast',
          '    return tool_fn(action["args"])',
          '',
          '',

        beat:{ label:'"Final Answer:" 를 잡아낸다', at:'thought.py L20–21',
               caption:'이번엔 이 분기가 참이다. action이 type="final" 로 만들어지고 answer가 실린다.',
               changes:[{mark:'new', text:'사이클 3 — FINAL'},
                        {mark:'changed', text:'finalAns 채워짐'}] },
        question:QUESTION, cycles:CYC, finalAns:FA, terminate:null,
        activeFile:'thought.py', code:{...FILES['thought.py'], highlight:[20,21]},
      },
      { ...S4,
        beat:{ label:'tool 분기는 타지 않는다', at:'thought.py L22–23',
               caption:'else 로 내려가지 않으니 _parse_tool_call 도 실행되지 않는다.',
               changes:[{mark:'gone', text:'도구 파싱 건너뜀'},
                        {mark:'gone', text:'Observation 3 없음'}] },
        question:QUESTION, cycles:CYC, finalAns:FA, terminate:null,
        activeFile:'thought.py', code:{...FILES['thought.py'], highlight:[22,23]},
      },
      { ...S4,
        beat:{ label:'루프로 돌려보낸다', at:'thought.py L24',
               caption:'thought 와 final action 을 반환한다. 판정은 다음 파일이 한다.',
               changes:[{mark:'read', text:'action → should_terminate'}] },
        question:QUESTION, cycles:CYC, finalAns:FA, terminate:null,
        activeFile:'thought.py', code:{...FILES['thought.py'], highlight:[24]},
      },

      // ── Step 5. 종료 조건 (terminate.py) ──────────────────────────────
      { ...S5,
        beat:{ label:'판정에 필요한 세 가지', at:'terminate.py L4–5',
               caption:'action, 현재 회차, 상한. 이 셋만으로 계속할지 멈출지 정한다.',
               changes:[{mark:'changed', text:'탭 → terminate.py'},
                        {mark:'read', text:'action / iter_idx / max_iter'}] },
        question:QUESTION, cycles:CYC5, finalAns:FA, terminate:null,
        activeFile:'terminate.py', code:{...FILES['terminate.py'], highlight:[4,5]},
      },
      { ...S5,
        beat:{ label:'종료 조건은 두 개뿐', at:'terminate.py L14–16',
               caption:'정상 종료와 안전장치. 이 둘 말고는 루프를 멈추는 길이 없다.',
               changes:[{mark:'new', text:'종료 조건 패널 등장'}] },
        question:QUESTION, cycles:CYC5, finalAns:FA,
        terminate:{ conditions: TERM.conditions.slice(0,2).map(c => ({ ...c, hit:false })),
                    result: '판정 전 — 두 조건 모두 미발동' },
        activeFile:'terminate.py', code:{...FILES['terminate.py'], highlight:[14,15,16]},
      },
      { ...S5,
        beat:{ label:'정상 종료 — final 토큰', at:'terminate.py L18–20',
               caption:'action.type 이 "final" 이라 이 자리에서 답을 들고 나간다. 이번 케이스가 여기다.',
               changes:[{mark:'changed', text:'final 조건 hit'},
                        {mark:'read', text:'action["answer"] 반환'}] },
        question:QUESTION, cycles:CYC5, finalAns:FA,
        terminate:{ conditions: TERM.conditions.slice(0,2),
                    result: '✓ action.type == "final" → 답을 반환' },
        activeFile:'terminate.py', code:{...FILES['terminate.py'], highlight:[18,19,20]},
      },
      { ...S5,
        beat:{ label:'안전장치는 이번엔 안 걸린다', at:'terminate.py L22–24',
               caption:'iter=2 라 max_iter-1=4 에 못 미친다. 답을 못 찾았을 때만 발동하는 가드다.',
               changes:[{mark:'gone', text:'max_iter 가드 미발동'}] },
        question:QUESTION, cycles:CYC5, finalAns:FA,
        terminate:{ conditions: TERM.conditions.slice(0,2),
                    result: '✓ final 감지 · max_iter 가드는 미발동' },
        activeFile:'terminate.py', code:{...FILES['terminate.py'], highlight:[22,23,24]},
      },
      { ...S5,
        beat:{ label:'둘 다 아니면 계속', at:'terminate.py L26',
               caption:'False, None 을 돌려주면 루프는 다음 사이클로 넘어간다.',
               changes:[{mark:'read', text:'(False, None) → 루프 계속'}] },
        question:QUESTION, cycles:CYC5, finalAns:FA,
        terminate:{ conditions: TERM.conditions.slice(0,3),
                    result: '3 사이클 만에 정상 종료 — 계속 분기는 타지 않음' },
        activeFile:'terminate.py', code:{...FILES['terminate.py'], highlight:[26]},
      },
      { ...S5,
        beat:{ label:'실전에서 더 붙이는 가드', at:'terminate.py L29–33',
               caption:'토큰 예산, 시간 제한, 같은 Action 반복 감지. 무한 루프를 막는 층이 더 필요하다.',
               changes:[{mark:'new', text:'예산 가드 추가'},
                        {mark:'new', text:'반복 감지 추가'}] },
        question:QUESTION, cycles:CYC5, finalAns:FA, terminate:TERM,
        activeFile:'terminate.py', code:{...FILES['terminate.py'], highlight:[29,30,31,32,33]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // CycleCard — 한 사이클(Thought / Action / Observation)
    // ─────────────────────────────────────────────────────
    function CycleCard({ cycle, isFinalCycle }) {
      const isFinal = cycle.action.name === 'FINAL';

      return (
        <div className="rounded-lg border-2 border-amber-300 bg-white shadow-sm overflow-hidden">
          {/* 사이클 헤더 */}
          <div className="bg-amber-100 px-3 py-1.5 border-b border-amber-200 flex items-center justify-between">
            <div className="text-[11px] font-bold text-amber-900 font-mono">
              ▸ Cycle {cycle.n} (iter={cycle.n - 1})
            </div>
            {isFinal && (
              <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">
                FINAL
              </span>
            )}
          </div>

          {/* Thought */}
          <div className="px-3 py-2 border-b border-slate-100 flex items-start gap-2">
            <span className="text-base leading-none mt-0.5">🧠</span>
            <div className="flex-1">
              <div className="text-[10px] uppercase tracking-wider font-bold text-sky-700">Thought</div>
              <div className="text-xs text-slate-700 mt-0.5 leading-relaxed">{cycle.thought}</div>
            </div>
          </div>

          {/* Action */}
          <div className={`px-3 py-2 ${cycle.observation ? 'border-b border-slate-100' : ''} flex items-start gap-2`}>
            <span className="text-base leading-none mt-0.5">{isFinal ? '🏁' : '🔧'}</span>
            <div className="flex-1">
              <div className={`text-[10px] uppercase tracking-wider font-bold ${isFinal ? 'text-emerald-700' : 'text-amber-700'}`}>
                {isFinal ? 'Final Answer' : 'Action'}
              </div>
              {isFinal ? (
                <div className="text-xs text-emerald-800 mt-0.5 font-medium">{cycle.action.args}</div>
              ) : (
                <div className="text-xs text-slate-700 mt-0.5 font-mono">
                  <span className="text-amber-700 font-bold">{cycle.action.name}</span>
                  <span className="text-slate-500">(</span>
                  <span className="text-violet-700">{cycle.action.args}</span>
                  <span className="text-slate-500">)</span>
                </div>
              )}
            </div>
          </div>

          {/* Observation (FINAL이 아닐 때만) */}
          {cycle.observation && (
            <div className="px-3 py-2 bg-slate-50 flex items-start gap-2">
              <span className="text-base leading-none mt-0.5">👁️</span>
              <div className="flex-1 min-w-0">
                <div className="text-[10px] uppercase tracking-wider font-bold text-violet-700">Observation</div>
                <pre className="text-[11px] text-slate-700 mt-0.5 whitespace-pre-wrap font-mono leading-snug max-h-24 overflow-y-auto">
                  {cycle.observation}
                </pre>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // TerminatePanel — Step 5 종료 조건 시각화
    // ─────────────────────────────────────────────────────
    function TerminatePanel({ terminate }) {
      return (
        <div className="rounded-lg border-2 border-amber-400 bg-gradient-to-br from-amber-50 to-orange-50 p-3 shadow-sm">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-base">🛡️</span>
            <div className="text-xs font-bold text-amber-900">should_terminate() — 종료 조건 체크</div>
          </div>

          <div className="space-y-1.5">
            {terminate.conditions.map((c) => (
              <div
                key={c.id}
                className={`px-3 py-2 rounded-lg border-2 flex items-start gap-2 transition-all ${
                  c.hit
                    ? 'bg-emerald-100 border-emerald-400 shadow-sm'
                    : 'bg-white border-slate-200 opacity-70'
                }`}
              >
                <span className="text-sm mt-0.5">{c.hit ? '✅' : '⚪'}</span>
                <div className="flex-1">
                  <div className={`text-[11px] font-mono font-bold ${c.hit ? 'text-emerald-900' : 'text-slate-600'}`}>
                    {c.label}
                  </div>
                  <div className={`text-[10px] mt-0.5 ${c.hit ? 'text-emerald-700' : 'text-slate-500'}`}>
                    {c.desc}
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="mt-2 px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold flex items-center gap-2">
            <span>🎯</span>
            <span>{terminate.result}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 사이클 누적 표시
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📋 ReAct 실행 메모 (history)</h2>
            <span className="text-[10px] text-slate-400 font-mono">live · cycles={step.cycles.length}</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 사용자 질문 */}
          <div className="rounded-lg bg-amber-600 text-white p-3 flex items-start gap-2 shadow-sm mb-3">
            <span className="text-lg leading-none">❓</span>
            <div className="flex-1">
              <div className="text-[10px] uppercase tracking-wider text-amber-200 font-bold">사용자 질문 (history[0])</div>
              <div className="text-sm font-bold mt-0.5">{step.question}</div>
            </div>
          </div>

          {/* 사이클 누적 */}
          {step.cycles.length === 0 ? (
            <div className="rounded-lg border-2 border-dashed border-slate-300 p-6 text-center text-slate-400 text-xs font-mono">
              for 루프 진입 직전 — 아직 사이클 없음
            </div>
          ) : (
            <div className="space-y-2 max-h-[26rem] overflow-y-auto pr-1">
              {step.cycles.map((c) => (
                <CycleCard key={c.n} cycle={c} isFinalCycle={c.n === step.cycles.length} />
              ))}
            </div>
          )}

          {/* 종료 조건 패널 (Step 5 전용) */}
          {step.terminate && (
            <div className="mt-3">
              <TerminatePanel terminate={step.terminate} />
            </div>
          )}

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-3 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span>🧠</span> Thought (LLM 추론)</span>
            <span className="flex items-center gap-1"><span>🔧</span> Action (도구 호출)</span>
            <span className="flex items-center gap-1"><span>👁️</span> Observation (결과)</span>
            <span className="flex items-center gap-1"><span>🏁</span> Final Answer</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FileTabs — CodeViewer 상단 5개 파일 탭
    // ─────────────────────────────────────────────────────
    function FileTabs({ activeFile, onSelect }) {
      const tabs = Object.keys(FILES);
      return (
        <div className="bg-[#21252b] border-b border-slate-700 flex overflow-x-auto">
          {tabs.map((name) => {
            const isActive = name === activeFile;
            return (
              <button
                key={name}
                onClick={() => onSelect(name)}
                className={`px-3 py-2 text-[11px] font-mono whitespace-nowrap border-r border-slate-700 transition ${
                  isActive
                    ? 'bg-[#282c34] text-amber-300 border-b-2 border-b-amber-400'
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                }`}
              >
                {name}
              </button>
            );
          })}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // CodeViewer — VSCode 스타일 + highlight.js + 파일 탭
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, activeFile, onSelectFile, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot */}
          <div className="bg-[#1c1f24] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">react-agent/</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* 파일 탭 */}
          <FileTabs activeFile={activeFile} onSelect={onSelectFile} />

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-amber-500/15 border-l-2 border-amber-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#1c1f24] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.filename} · {code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [activeFile, setActiveFile] = useState(STEPS[0].activeFile);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      // step 변경 시 step.activeFile에 맞춰 탭도 자동 전환
      useEffect(() => {
        setActiveFile(step.activeFile);
      }, [stepIdx]);

      // 현재 표시할 코드 (탭 수동 변경 시는 그 탭 우선)
      // 강조는 스텝(=beat)이 든다. 파일 본문만 FILES 에서 가져오고 강조는 갈아 끼운다.
      const baseCode = FILES[activeFile] || step.code;
      const currentCode = activeFile === step.activeFile && step.code
        ? { ...baseCode, highlight: step.code.highlight }
        : baseCode;

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-amber-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 핵심 패턴 &gt; Chapter 2. ReAct 패턴</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">ReAct 실행 흐름</h1>
                  <p className="text-sm text-slate-500 mt-0.5">실제 코드 단계별 — Thought → Action → Observation 사이클 누적</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer
                code={currentCode}
                activeFile={activeFile}
                onSelectFile={setActiveFile}
                stepIdx={stepIdx}
                total={STEPS.length}
              />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-amber-50 border-2 border-amber-300 rounded-xl p-3 text-sm text-amber-900">
                💡 다음(III-3-1)에서는 <strong>Tool Use</strong>의 정의와 LLM이 도구를 어떻게 호출하는지 살펴봅니다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-amber-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-amber-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-amber-200">키보드 &larr;/&rarr; · 파일 탭 클릭으로 코드 비교</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 키워드 칩 */}
            <div className="flex flex-wrap gap-2">
              {['for 루프', 'Thought', 'Action', 'Observation', 'Final Answer', 'max_iter', 'history'].map(kw => (
                <span key={kw} className="bg-amber-50 text-amber-700 px-3 py-1 rounded-full text-xs font-medium border border-amber-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-amber-600 text-white hover:bg-amber-700 transition min-w-[110px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-2-1.html" className="text-amber-700 hover:text-amber-900 font-medium">&larr; III-2-1. ReAct란</a>
              <a href="./III-3-1.html" className="text-amber-700 hover:text-amber-900 font-medium">III-3-1. Tool Use란 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
