<!DOCTYPE html>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧠</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    ML V-1-1 — 피처 엔지니어링과 데이터 누수 (해지 예측 시나리오, 5단계)
    패턴: fastapi v1 — 좌(LiveDataPane: 피처 테이블 + 누수 경고 + 시점 다이어그램) / 우(CodeViewer: feature_engineering.py 진화) / 색상: violet
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 5단계 시나리오 — 해지 예측 프로젝트의 피처 여정
    //   table    : { cols: [{key,label,kind}], rows: [...] }
    //              kind: 'raw' | 'derived' | 'leak' (leak = 빨간 경고)
    //   metric   : AUC 비교 막대 { title, rows: [{name, auc, tone, note}] }
    //   timeline : 시점 차단선 다이어그램 (Step 3)
    //   pipeline : fit/transform 흐름 (Step 4)
    //   checklist: 실무 점검 목록 (Step 5)
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // ── 원본 코드 본문 (한 글자도 바꾸지 않음) ──
    const CODE = {
      s1: {lang: "python", filename: "feature_engineering.py (v1 — 파생 피처)", lines: [
        "\"\"\"",
        "feature_engineering.py — v1: raw timestamp를 의미 있는 피처로",
        "",
        "모델은 1719843600 이라는 정수에서 \"주말\"을 발명하지 못한다.",
        "도메인 지식을 컬럼으로 번역하는 것이 피처 엔지니어링이다.",
        "\"\"\"",
        "import pandas as pd",
        "",
        "df = pd.read_csv(\"users.csv\", parse_dates=[\"signup_ts\"])",
        "NOW = pd.Timestamp(\"2026-08-06\")",
        "",
        "# 1) 경과일 — \"오래된 유저일수록 이탈 패턴이 다르다\"",
        "df[\"days_since_signup\"] = (NOW - df[\"signup_ts\"]).dt.days",
        "",
        "# 2) 주말 가입 — \"주말 충동 가입은 해지율이 높다\" (도메인 가설)",
        "df[\"is_weekend_signup\"] = (df[\"signup_ts\"].dt.dayofweek >= 5).astype(int)",
        "",
        "# 3) 가입 시간대 — 연속값 hour를 의미 단위로 구간화",
        "df[\"signup_hour_band\"] = pd.cut(",
        "    df[\"signup_ts\"].dt.hour,",
        "    bins=[0, 6, 12, 18, 24],",
        "    labels=[\"night\", \"morning\", \"day\", \"evening\"],",
        "    right=False,",
        ")",
        "",
        "# 4) 결제일까지 남은 일수 — \"해지는 결제일 직전에 몰린다\"",
        "df[\"days_to_billing\"] = (",
        "    df[\"next_billing_date\"] - NOW",
        ").dt.days.clip(lower=0)",
        "",
        "# 같은 모델로 재대결:",
        "#   raw 2컬럼            → AUC 0.62",
        "#   raw + XGBoost        → AUC 0.64 (모델 교체는 미미)",
        "#   파생 4컬럼 + 로지스틱 → AUC 0.79 (피처가 성능을 만든다)",
        "#",
        "# 교훈: 성능이 안 나오면 모델을 바꾸기 전에",
        "#       \"모델이 볼 수 있는 정보\"를 먼저 늘려라.",
      ]},
      s2: {lang: "python", filename: "feature_engineering.py (v2 — 기법 카탈로그)", lines: [
        "\"\"\"",
        "feature_engineering.py — v2: 수치 · 범주 · 집계 기법",
        "각 기법은 \"언제 쓰는지\"가 핵심이다 (주석의 선택 기준 참고)",
        "\"\"\"",
        "import numpy as np",
        "import pandas as pd",
        "",
        "# ── 수치형 ──────────────────────────────────",
        "# 로그 변환: 결제액은 소수 헤비유저 쪽으로 꼬리가 길다",
        "df[\"log_payment\"] = np.log1p(df[\"monthly_payment\"])",
        "",
        "# 구간화: 나이의 비선형 효과를 선형 모델도 잡게",
        "df[\"age_band\"] = pd.cut(df[\"age\"], bins=[0, 25, 40, 60, 120],",
        "                        labels=[\"young\", \"mid\", \"senior\", \"elder\"])",
        "",
        "# ── 범주형 ──────────────────────────────────",
        "# 원핫: 요금제 3종 — 카디널리티 낮을 때의 기본기",
        "df = pd.get_dummies(df, columns=[\"plan\"], prefix=\"plan\")",
        "",
        "# 타깃 인코딩: 도시 500개 → 도시별 평균 해지율 1컬럼",
        "# ⚠ 주의: 정답 y를 재료로 쓴다. 반드시 train 통계만 사용하고",

    // 피처 테이블 — 컬럼 종류별 색 (raw/derived/leak/target)
    const COL_STYLE = {
      raw:     { head: 'bg-slate-100 text-slate-700 border-slate-300', cell: 'text-slate-600', tag: 'raw' },
      derived: { head: 'bg-violet-100 text-violet-900 border-violet-300', cell: 'text-violet-900 font-bold', tag: '파생' },
      leak:    { head: 'bg-red-100 text-red-800 border-red-400', cell: 'text-red-700 font-bold', tag: '누수!' },
      target:  { head: 'bg-amber-100 text-amber-900 border-amber-400', cell: 'text-amber-900 font-bold', tag: '정답' },
    };

    function FeatureTable({ table }) {
      if (!table) return null;
      const hasLeak = table.cols.some((c) => c.kind === 'leak');
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-2.5 overflow-x-auto">
          <div className="text-[11px] font-bold text-violet-900 mb-1.5">🗂 {table.caption}</div>
          <table className="w-full text-[9px] font-mono">
            <thead>
              <tr>
                {table.cols.map((c) => {
                  const s = COL_STYLE[c.kind] || COL_STYLE.raw;
                  return (
                    <th key={c.key} className={`border ${s.head} px-1.5 py-1 text-left whitespace-nowrap`}>
                      <div>{c.label}</div>
                      <div className={`text-[8px] font-sans ${c.kind === 'leak' ? 'text-red-600' : 'opacity-60'}`}>
                        {c.kind === 'leak' ? '🚨 ' : ''}{s.tag}
                      </div>
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {table.rows.map((r, ri) => (
                <tr key={ri}>
                  {table.cols.map((c) => {
                    const s = COL_STYLE[c.kind] || COL_STYLE.raw;
                    return (
                      <td key={c.key} className={`border border-slate-200 px-1.5 py-1 whitespace-nowrap ${s.cell} ${c.kind === 'leak' ? 'bg-red-50' : ''}`}>
                        {r[c.key]}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
          {hasLeak && (
            <div className="mt-1.5 text-[9px] text-red-700 font-bold">🚨 빨간 컬럼 = 예측 시점 이후의 미래 정보 — 학습에 넣는 순간 점수가 거짓이 된다</div>
          )}
        </div>
      );
    }

    // AUC 비교 막대 — fake(부풀려진 점수)는 줄무늬 경고 톤
    const METRIC_TONE = {
      good: { bar: 'bg-emerald-500', text: 'text-emerald-800', icon: '✓' },
      bad:  { bar: 'bg-red-400', text: 'text-red-800', icon: '▼' },
      fake: { bar: 'bg-red-500', text: 'text-red-800', icon: '🚨' },
    };

    function MetricBox({ metric }) {
      if (!metric) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-2">📊 {metric.title}</div>
          <div className="space-y-1.5">
            {metric.rows.map((r) => {
              const t = METRIC_TONE[r.tone] || METRIC_TONE.good;
              return (
                <div key={r.name}>
                  <div className="flex items-center justify-between text-[10px] mb-0.5">
                    <span className="text-slate-700">{t.icon} {r.name}</span>
                    <span className={`font-mono font-bold ${t.text}`}>AUC {r.auc.toFixed(2)}{r.tone === 'fake' ? ' ⚠' : ''}</span>
                  </div>
                  <div className="h-2 rounded-full bg-violet-100 overflow-hidden">
                    <div
                      className={`h-full ${t.bar} transition-all duration-700`}
                      style={{ width: `${Math.round(((r.auc - 0.5) / 0.5) * 100)}%`, opacity: r.tone === 'fake' ? 0.65 : 1 }}
                    />
                  </div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{r.note}</div>
                </div>
              );
            })}
          </div>
          <div className="mt-1 text-[9px] text-slate-500">막대 기준: AUC 0.5(무작위) ~ 1.0 · ⚠ = 누수로 부풀려진 거짓 점수</div>
        </div>
      );
    }

    // 시점 차단선 다이어그램 (Step 3)
    function TimelineBox({ timeline }) {
      if (!timeline) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-400 bg-white p-3">
          <div className="text-xs font-bold text-red-800 mb-2">⏱ {timeline.title}</div>
          <div className="flex items-stretch gap-0">
            <div className="flex-1 rounded-l-lg border-2 border-emerald-300 bg-emerald-50 p-2">
              <div className="text-[10px] font-bold text-emerald-800 mb-1">◀ {timeline.left.label}</div>
              {timeline.left.items.map((it) => (
                <div key={it} className="text-[9px] text-emerald-900 bg-white border border-emerald-200 rounded px-1.5 py-0.5 mb-1 font-mono">✓ {it}</div>
              ))}
            </div>
            <div className="w-8 flex flex-col items-center justify-center relative">
              <div className="absolute inset-y-0 left-1/2 w-1 -ml-0.5 bg-red-500" style={{ backgroundImage: 'repeating-linear-gradient(180deg, #ef4444 0 6px, transparent 6px 10px)' }} />
              <div className="relative z-10 bg-red-600 text-white text-[8px] font-bold px-1 py-0.5 rounded rotate-0 whitespace-nowrap" style={{ writingMode: 'vertical-rl' }}>
                차단선
              </div>
            </div>
            <div className="flex-1 rounded-r-lg border-2 border-red-300 bg-red-50 p-2">
              <div className="text-[10px] font-bold text-red-800 mb-1">{timeline.right.label} ▶</div>
              {timeline.right.items.map((it) => (
                <div key={it} className="text-[9px] text-red-900 bg-white border border-red-300 rounded px-1.5 py-0.5 mb-1 font-mono line-through decoration-red-400">🚫 {it}</div>
              ))}
            </div>
          </div>
          <div className="mt-1.5 text-center text-[10px] font-bold text-red-700">▲ {timeline.cutoffLabel} — 이 선 이후의 정보는 피처가 될 수 없다</div>
        </div>
      );
    }

    // 기법 카탈로그 표 (Step 2)
    function CatalogBox({ catalog }) {
      if (!catalog) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-violet-50 p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">📚 {catalog.title}</div>
          <table className="w-full text-[9px]">
            <thead>
              <tr className="text-violet-900 border-b-2 border-violet-300">
                <th className="text-left py-0.5 pr-1">기법</th>
                <th className="text-left py-0.5 pr-1">언제 쓰나</th>
                <th className="text-left py-0.5">주의</th>
              </tr>
            </thead>
            <tbody>
              {catalog.rows.map((r) => (
                <tr key={r.cat} className="border-t border-violet-200">
                  <td className="py-1 pr-1 font-bold text-violet-900 whitespace-nowrap">{r.cat}</td>
                  <td className="py-1 pr-1 text-slate-700">{r.when}</td>
                  <td className={`py-1 ${r.warn.startsWith('⚠') ? 'text-red-700 font-bold' : 'text-slate-500'}`}>{r.warn}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // 전처리 fit/transform 흐름 (Step 4) — 잘못 vs 올바름
    function PipelineBox({ pipeline }) {
      if (!pipeline) return null;
      const Col = ({ data, tone }) => (
        <div className={`flex-1 rounded-lg border-2 p-2 ${tone === 'wrong' ? 'border-red-400 bg-red-50' : 'border-emerald-400 bg-emerald-50'}`}>
          <div className={`text-[10px] font-bold mb-1.5 ${tone === 'wrong' ? 'text-red-800' : 'text-emerald-800'}`}>{data.label}</div>
          {data.steps.map((s, i) => (
            <React.Fragment key={i}>
              {i > 0 && <div className={`text-center text-[10px] ${tone === 'wrong' ? 'text-red-400' : 'text-emerald-500'}`}>▼</div>}
              <div className={`rounded border px-2 py-1 text-[9px] text-center font-mono ${tone === 'wrong' ? 'border-red-300 bg-white text-red-900' : 'border-emerald-300 bg-white text-emerald-900 font-bold'}`}>
                {s}
              </div>
            </React.Fragment>
          ))}
          <div className={`mt-1.5 text-[9px] ${tone === 'wrong' ? 'text-red-800' : 'text-emerald-800'}`}>{data.note}</div>
        </div>
      );
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🔒 {pipeline.title}</div>
          <div className="flex gap-2 items-stretch">
            <Col data={pipeline.wrong} tone="wrong" />
            <div className="flex items-center text-violet-500 text-lg">⇢</div>
            <Col data={pipeline.right} tone="right" />
          </div>
          <div className="mt-2 text-[10px] text-violet-900">Pipeline에 전처리를 넣으면 이 "올바른 순서"를 코드가 강제한다 — 사람의 기억력에 의존하지 않는다.</div>
        </div>
      );
    }

    // 실무 체크리스트 (Step 5)
    function ChecklistBox({ checklist }) {
      if (!checklist) return null;
      return (
        <div className="rounded-lg border-2 border-violet-500 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">✅ {checklist.title}</div>
          <div className="space-y-1.5">
            {checklist.items.map((it, i) => (
              <div key={i} className={`rounded border px-2 py-1.5 ${it.tone === 'signal' ? 'border-red-300 bg-red-50' : 'border-emerald-300 bg-emerald-50'}`}>
                <div className="flex items-start gap-1.5">
                  <span className="text-[10px]">{it.tone === 'signal' ? '🚨' : '🛡'}</span>
                  <div className="min-w-0">
                    <div className={`text-[10px] font-bold ${it.tone === 'signal' ? 'text-red-900' : 'text-emerald-900'}`}>{it.q}</div>
                    <div className="text-[9px] text-slate-600">{it.hint}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-1.5 flex gap-3 text-[9px] text-slate-500">
            <span>🚨 = 누수 탐지 신호</span>
            <span>🛡 = 구조적 방어 장치</span>
          </div>
        </div>
      );
    }

    // 이어지는 주제 링크 (Step 5)
    function LinksBox({ links }) {
      if (!links) return null;
      return (
        <div className="mt-3 rounded-lg border border-violet-300 bg-violet-50 p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1">🔗 {links.title}</div>
          {links.items.map((it) => (
            <div key={it} className="text-[10px] text-violet-800 mb-0.5">• {it}</div>
          ))}
        </div>
      );
    }

    // 경고/알림 박스
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // 좌측 LiveDataPane — 피처 테이블 + 누수 경고 + 다이어그램 (violet 톤)
    function LiveDataPane({ beat, state }) {
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{state.badge.icon}</span>
              <span>해지 예측 피처 작업대 — {state.badge.label}</span>
            </h3>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            {state.actor}
          </div>
          <FeatureTable table={state.table} />
          <CatalogBox catalog={state.catalog} />
          <TimelineBox timeline={state.timeline} />
          <PipelineBox pipeline={state.pipeline} />
          <ChecklistBox checklist={state.checklist} />
          <MetricBox metric={state.metric} />
          <LinksBox links={state.links} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // App
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">V-1-1. 피처 엔지니어링과 데이터 누수</h1>
                <p className="text-sm text-violet-800/80">모델보다 피처가 성적을 좌우한다 — 그리고 성적이 "너무 좋으면" 의심하라</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                성능 개선의 첫 순서는 모델 교체가 아니라 "모델이 볼 수 있는 정보"를 늘리는 피처 설계다.
                단, 피처가 강력해질수록 누수의 문도 넓어진다 — 예측 시점 이후의 미래 정보(target leakage)와
                전체 데이터에 fit하는 전처리 누수가 두 축이다.
                방어는 기억력이 아니라 구조로 한다: 피처 함수에 as_of를 강제하고, 전처리를 Pipeline에 가두고,
                학습과 서빙이 같은 피처 코드를 공유하게 하라(→ 피처 스토어, mlops).
                오프라인 0.99보다 배포 후에도 재현되는 0.81이 실무의 승자다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['피처엔지니어링', '데이터누수', 'TargetLeakage', '타깃인코딩', '집계피처', '시점차단선', 'Pipeline', 'ColumnTransformer', 'fit-transform', '피처스토어'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
