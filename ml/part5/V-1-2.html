  <!--

    학습 목표: 단일 split 평가가 시드에 따라 ±5% 요동치는 것을 실감하고 →

  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    //   paramBox    : Step 3 — 파라미터 vs 하이퍼파라미터 + XGBoost 주요 하이퍼
    //   searchViz   : Step 4 — Grid/Random/Optuna 탐색 공간 산점도
    //   protocol    : Step 5 — train/valid/test 3분할 프로토콜
    // ─────────────────────────────────────────────────────

    // Step 4 탐색 공간 좌표 (0~100 정규화, x=learning_rate, y=max_depth)
    // 최적 지대: (72, 30) 부근 — 점수는 최적점에서 멀수록 낮게 하드코딩
    const GRID_POINTS = [];
    [12, 37, 62, 87].forEach((x) => [12, 37, 62, 87].forEach((y) => {
      const d = Math.hypot(x - 72, y - 30);
      GRID_POINTS.push({ x, y, score: Math.max(0.62, 0.91 - d / 260) });
    }));
    const RANDOM_POINTS = [
      { x: 8, y: 81 }, { x: 91, y: 64 }, { x: 33, y: 12 }, { x: 68, y: 35 },
      { x: 21, y: 55 }, { x: 77, y: 22 }, { x: 49, y: 90 }, { x: 84, y: 41 },
      { x: 14, y: 28 }, { x: 58, y: 70 }, { x: 95, y: 9 }, { x: 41, y: 47 },
      { x: 70, y: 27 }, { x: 27, y: 74 }, { x: 63, y: 16 }, { x: 88, y: 86 },
    ].map((p) => {
      const d = Math.hypot(p.x - 72, p.y - 30);
      return { ...p, score: Math.max(0.62, 0.91 - d / 260) };
    });
    const OPTUNA_POINTS = [
      // 초반 4개: 넓게 탐색(explore) → 이후: 좋았던 지대 근처로 수렴(exploit)
      { x: 15, y: 80 }, { x: 85, y: 15 }, { x: 45, y: 50 }, { x: 90, y: 75 },
      { x: 66, y: 38 }, { x: 78, y: 24 }, { x: 60, y: 30 }, { x: 74, y: 42 },
      { x: 69, y: 26 }, { x: 76, y: 33 }, { x: 71, y: 29 }, { x: 73, y: 31 },
    ].map((p, i) => {
      const d = Math.hypot(p.x - 72, p.y - 30);
      return { ...p, score: Math.max(0.62, 0.91 - d / 260), phase: i < 4 ? 'explore' : 'exploit' };
    });

    const STEPS = [
      {
        title: 'Step 1. 단일 split의 함정 — 시드가 성적을 정한다',
        desc: '같은 데이터, 같은 모델, 같은 코드인데 train_test_split의 random_state만 바꿨더니 정확도가 79%에서 89%까지 요동친다. 어느 샘플이 test에 들어가느냐는 순전히 운이고, 작은 데이터일수록 그 운의 영향이 커진다. 문제는 실무에서 이 함정이 "성과"로 둔갑한다는 것 — 시드 42에서 89%가 나오면 그 숫자로 보고하고 싶어지고, 배포 후 실제 성능은 84% 근처로 내려앉는다. 즉 단일 split 점수는 "모델 실력"이 아니라 "실력 + 분할 운"의 합이며, 우리에게 필요한 건 운을 평균 내서 지워버리는 장치다.',

          spread: '79.3% ~ 89.2% (폭 9.9%p)',

    // ─────────────────────────────────────────────────────
    // Step 1 — 시드별 단일 split 정확도 표

    // ─────────────────────────────────────────────────────
    // Step 2 — 5-fold 회전 애니메이션 + 평균±σ 게이지
    //   activeFold 를 1200ms 간격으로 순환. 지나간 fold 는 점수 확정 표시.
    // ─────────────────────────────────────────────────────
    function FoldAnimBox({ box }) {
      const [activeFold, setActiveFold] = useState(0);
      useEffect(() => {
        if (!box) return;
        setActiveFold(0);
        const t = setInterval(() => setActiveFold((f) => (f + 1) % (box.k + 1)), 1200);
        return () => clearInterval(t);
      }, [box]);
      if (!box) return null;

      const done = activeFold >= box.k; // 마지막 프레임: 전체 완료 요약
      const revealed = done ? box.k : activeFold; // 점수가 확정된 fold 수
      const partialScores = box.scores.slice(0, done ? box.k : activeFold + 1);
      const runMean = partialScores.length
        ? partialScores.reduce((a, b) => a + b, 0) / partialScores.length : 0;

      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold text-violet-900">🔄 5-Fold 회전 — 검증 블록이 한 칸씩 이동</span>
            <span className="text-[10px] font-mono text-violet-700">{done ? '완료 ✓' : `Round ${activeFold + 1}/${box.k}`}</span>
          </div>
          <div className="space-y-1">
            {Array.from({ length: box.k }).map((_, row) => {
              const isActive = !done && row === activeFold;
              const isDone = done || row < activeFold;
              return (
                <div key={row} className={`flex items-center gap-1.5 rounded px-1 py-0.5 ${isActive ? 'bg-violet-50 ring-1 ring-violet-400' : ''}`}>
                  <span className="w-12 text-[9px] font-mono text-slate-500">fold {row + 1}</span>
                  <div className="flex-1 flex gap-0.5">
                    {Array.from({ length: box.k }).map((_, col) => {
                      const isValid = col === row;
                      return (
                        <div key={col}
                          className={`flex-1 h-4 rounded-sm text-[8px] flex items-center justify-center font-bold transition-all duration-500
                            ${isValid
                              ? (isActive ? 'bg-amber-400 text-amber-950 scale-y-125' : 'bg-amber-200 text-amber-900')
                              : (isActive ? 'bg-violet-500 text-white' : 'bg-violet-200 text-violet-800')}`}
                        >{isValid ? '검증' : '학습'}</div>
                      );
                    })}
                  </div>
                  <span className={`w-12 text-right text-[10px] font-mono ${isDone || isActive ? 'text-slate-800 font-bold' : 'text-slate-300'}`}>{isDone ? box.scores[row].toFixed(3) : isActive ? '측정중' : '—'}</span>
                </div>
              );
            })}
          </div>
          {/* 평균 ± 표준편차 게이지 */}
          <div className="mt-2.5 rounded border border-violet-300 bg-violet-50 p-2">
            <div className="flex items-center justify-between text-[10px] font-bold text-violet-900 mb-1">
              <span>누적 평균 ({revealed + (done ? 0 : 1)}개 fold 반영)</span>
              <span className="font-mono">{done ? `${box.mean.toFixed(3)} ± ${box.std.toFixed(3)}` : runMean.toFixed(3)}</span>
            </div>
            <div className="relative h-3 rounded-full bg-white border border-violet-200 overflow-hidden">
              {/* ±σ 밴드 (완료 시) */}
              {done && (
                <div className="absolute top-0 h-full bg-amber-200"
                  style={{ left: `${((box.mean - box.std - 0.8) / 0.12) * 100}%`, width: `${((2 * box.std) / 0.12) * 100}%` }} />
              )}
              <div className="absolute top-0 h-full w-0.5 bg-violet-700 transition-all duration-500"
                style={{ left: `${(((done ? box.mean : runMean) - 0.8) / 0.12) * 100}%` }} />
            </div>
            <div className="flex justify-between text-[8px] text-slate-500 mt-0.5 font-mono"><span>0.80</span><span>0.86</span><span>0.92</span></div>
            {done && (
              <div className="mt-1 text-[10px] text-violet-900">노란 밴드 = ±1σ. 폭이 좁을수록 "어떤 데이터가 와도 비슷하게 한다"는 뜻 — 평균만큼 중요한 정보다.</div>
            )}
          </div>
        </div>
      );
    }

    function HyperTableBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-1.5">📐 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-violet-900 border-b border-violet-200">
                <th className="text-left py-0.5 w-24">하이퍼</th><th className="text-left py-0.5 pl-2">낮으면</th><th className="text-left py-0.5 pl-2">높으면</th><th className="text-left py-0.5 pl-2">실무 감각</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.name} className="border-t border-violet-100 align-top">
                  <td className="py-1 font-mono font-bold text-violet-900">{r.name}</td><td className="py-1 pl-2 text-sky-800">{r.low}</td><td className="py-1 pl-2 text-red-800">{r.high}</td><td className="py-1 pl-2 text-slate-700">{r.tip}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 탐색 공간 산점도 3패널 (SVG 100×100 좌표계)
    //   ★ = 진짜 최적 지대 (72, 30). 점 색 = 점수(진할수록 높음)
    // ─────────────────────────────────────────────────────
    function SearchSpacePanel({ panel }) {
      const scoreColor = (s) =>
        s >= 0.88 ? '#7c3aed' : s >= 0.82 ? '#a78bfa' : s >= 0.74 ? '#d8b4fe' : '#e9d5ff';
      return (
        <div className="flex-1 min-w-0">
          <div className="text-[10px] font-bold text-violet-900 text-center">{panel.name}</div><div className="text-[8px] text-slate-500 text-center mb-1">{panel.sub}</div>
          <svg viewBox="0 0 100 100" className="w-full aspect-square rounded border-2 border-violet-200 bg-white">
            {/* 최적 지대 표시 */}
            <circle cx="72" cy="70" r="13" fill="#fde68a" opacity="0.55" /><text x="72" y="73" textAnchor="middle" fontSize="9">★</text>
            {panel.points.map((p, i) => (
              <circle key={i} cx={p.x} cy={100 - p.y} r={p.phase === 'exploit' ? 3.2 : 2.6}
                fill={scoreColor(p.score)} stroke={p.phase === 'exploit' ? '#7c3aed' : 'none'} strokeWidth="0.7" />
            ))}
          </svg>
          <div className="text-[9px] text-center mt-1 font-mono font-bold text-violet-800">best {panel.best.toFixed(3)}</div><div className="text-[8px] text-center text-slate-600 leading-tight">{panel.note}</div>
        </div>
      );
    }

    function SearchVizBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-1">🗺 탐색 공간 (x=learning_rate, y=max_depth) — ★=진짜 최적 지대</div>
          <div className="flex gap-2">
            {box.panels.map((p) => <SearchSpacePanel key={p.name} panel={p} />)}
          </div>
          <div className="mt-2 text-[10px] text-slate-700 space-y-0.5">
            <div>• <b>Grid</b>: 격자만 밟는다 — ★가 격자 사이에 있으면 영영 못 찾는다</div>
            <div>• <b>Random</b>: 예산이 같아도 각 축에서 16개의 서로 다른 값을 시도 → 중요한 축 커버리지 ↑</div>
            <div>• <b>Optuna</b>: 테두리 있는 점 = 후반 시도. 좋았던 지대 근처로 몰리는 게 보인다 (explore → exploit)</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 3분할 프로토콜 + 우선순위 표
    // ─────────────────────────────────────────────────────
    const ZONE_TONE = {
      violet: 'border-violet-400 bg-violet-50 text-violet-900',
      sky: 'border-sky-400 bg-sky-50 text-sky-900',
      red: 'border-red-400 bg-red-50 text-red-900',
    };

    function ProtocolBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🔐 {box.title}</div>
          <div className="flex gap-1 mb-2">
            {box.zones.map((z, i) => (
              <div key={z.name} className={`rounded border-2 px-1 py-1.5 text-center ${ZONE_TONE[z.tone]}`} style={{ flex: i === 0 ? 3 : 1 }}><div className="text-[10px] font-bold">{z.name}</div></div>
            ))}
          </div>
          <div className="space-y-1">
            {box.zones.map((z) => (
              <div key={z.name} className="flex gap-2 text-[10px]">
                <span className={`w-20 shrink-0 font-mono font-bold ${z.tone === 'red' ? 'text-red-800' : z.tone === 'sky' ? 'text-sky-800' : 'text-violet-800'}`}>{z.name}</span><span className="text-slate-700">{z.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PriorityBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-amber-50 p-3">
          <div className="text-xs font-bold text-violet-900 mb-1.5">🥇 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-violet-900 border-b-2 border-violet-300">
                <th className="text-left py-0.5 w-6">#</th><th className="text-left py-0.5">작업</th><th className="text-left py-0.5 pl-2 w-16">기대 이득</th><th className="text-left py-0.5 pl-2">비고</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.rank} className={`border-t border-violet-200 ${r.rank === '4' ? 'bg-amber-50' : ''}`}>
                  <td className="py-1 font-bold text-violet-800">{r.rank}</td><td className="py-1 text-slate-800">{r.what}</td><td className="py-1 pl-2 font-mono font-bold text-emerald-700">{r.gain}</td><td className="py-1 pl-2 text-slate-600">{r.cost}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-violet-900 font-bold">튜닝은 마지막 1~3%p를 짜내는 도구다 — 피처·데이터가 먼저다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 시각화 조립 (violet 톤)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{state.badge.icon}</span>
              <span>{state.badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">{state.detail}</div>
          <SplitTrialsBox box={state.splitTrials} />
          <FoldAnimBox box={state.foldAnim} />
          <VariantsBox box={state.variants} />
          <ParamBox box={state.paramBox} />
          <HyperTableBox box={state.hyperTable} />
          <SearchVizBox box={state.searchViz} />
          <ProtocolBox box={state.protocol} />
          <PriorityBox box={state.priority} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">V-1-2. 교차검증·하이퍼파라미터 튜닝</h1>
                <p className="text-sm text-violet-800/80">한 번의 운 좋은 split에 속지 않는 법 — 체계적으로 최적 설정 찾기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`} />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                단일 split 점수는 "실력 + 분할 운"이다 — K-fold 교차검증은 모든 샘플을 한 번씩 검증에 참여시켜 운을 평균으로 지우고,
                평균±표준편차로 실력과 신뢰도를 함께 보고한다 (불균형은 Stratified, 시계열은 TimeSeriesSplit).
                하이퍼파라미터는 사람이 정하는 손잡이이며 심판은 CV 점수다: Grid는 전수조사(조합 폭발), Random은 같은 예산에 넓은 커버리지,
                Optuna는 이전 결과로 다음 후보를 고른다. 프로토콜은 test 선격리 → train 안에서 CV 튜닝 → test 단 한 번.
                그리고 튜닝의 이득(1~3%p)보다 피처·데이터 정리(5~10%p)가 항상 먼저다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['교차검증', 'K-fold', 'StratifiedKFold', 'TimeSeriesSplit', '하이퍼파라미터', 'GridSearchCV', 'RandomizedSearchCV', 'Optuna', '차원의저주', '3분할프로토콜'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./V-1-1.html" className="underline hover:no-underline">← 이전: V-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
