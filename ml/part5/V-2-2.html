  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧠</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!-- ML V-2-2 — 운영 체크리스트 — 드리프트·재학습
       패턴: fastapi v1 — 좌 LiveDataPane(성능 타임라인·히스토그램·PSI 게이지·챔피언-챌린저) / 우 CodeViewer(drift_monitor.py 진화) / violet -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 5단계 — 조용한 저하 → 데이터 드리프트 → 컨셉 드리프트 → 재학습 전략 → 운영 체크리스트
    // 각 단계 = { title, desc, 좌측 패널 데이터(timeline/histogram/psi/...), code(우측 CodeViewer) }
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: { lang: "python", filename: "drift_monitor.py (v1 — 지연 성능 추적)", lines: [
        "\"\"\"drift_monitor.py — v1: 지연 라벨로라도 성능을 추적한다",
        "이탈 라벨은 30일 뒤 확정 → 실시간 정확도는 존재하지 않는다\"\"\"",
        "import pandas as pd",
        "from sklearn.metrics import accuracy_score, roc_auc_score",
        "",
        "LABEL_DELAY_DAYS = 30  # 이탈 여부는 30일 뒤에야 확정된다",
        "",
        "",
        "def score_matured_predictions(pred_log: pd.DataFrame) -> pd.DataFrame:",
        "    \"\"\"라벨이 확정된(30일 지난) 예측만 골라 월별 성능 계산.",
        "",
        "    pred_log: [user_id, pred_date, churn_prob, actual_churn]",
        "    actual_churn 은 30일 뒤 배치가 채운다 (그 전엔 NaN)",
        "    \"\"\"",
        "    matured = pred_log.dropna(subset=[\"actual_churn\"])",
        "    matured[\"month\"] = matured[\"pred_date\"].dt.to_period(\"M\")",
        "    rows = []",
        "    for month, g in matured.groupby(\"month\"):",
        "        rows.append({",
        "            \"month\": str(month), \"n\": len(g),",
        "            \"accuracy\": accuracy_score(g[\"actual_churn\"],",
        "                                       g[\"churn_prob\"] >= 0.5),",
        "            \"auc\": roc_auc_score(g[\"actual_churn\"], g[\"churn_prob\"]),",
        "        })",
        "    return pd.DataFrame(rows)",
        "",
        "",
        "perf = score_matured_predictions(pd.read_parquet(\"pred_log.parquet\"))",
        "print(perf.tail(4))",
        "#   month     n  accuracy   auc",
        "#   2026-01  9.2k   0.84    0.88   <- 배포 직후",
        "#   2026-05 11.3k   0.74    0.79",
        "#   2026-06 12.1k   0.71    0.76   <- 조용한 붕괴, 한 달 늦게 발견",
        "",
        "# 한계: 이 성적표는 항상 30일 늦다.",
        "# 다음 단계 — 라벨 없이 \"입력 분포\"만 보고 조기 탐지한다.",
      ] },
      s2: { lang: "python", filename: "drift_monitor.py (v2 — PSI·KS 탐지)", lines: [
        "\"\"\"",
        "drift_monitor.py — v2: 라벨 없이 입력 분포로 드리프트 조기 탐지",
        "PSI = sum( (now% - train%) * ln(now% / train%) )",
        "  < 0.10 안정 / 0.10~0.25 주의 / >= 0.25 드리프트 확정 (실무 관례)",
        "\"\"\"",
        "import numpy as np",
        "import pandas as pd",
        "from scipy.stats import ks_2samp",
        "",
        "",
        "def psi(train: np.ndarray, now: np.ndarray, bins: int = 10) -> float:",
        "    \"\"\"두 분포의 Population Stability Index — 클수록 많이 변했다.\"\"\"",
        "    # 구간 경계는 반드시 \"학습 분포\" 기준으로 고정한다",
        "    edges = np.quantile(train, np.linspace(0, 1, bins + 1))",
        "    edges[0], edges[-1] = -np.inf, np.inf",
        "    t_pct = np.histogram(train, bins=edges)[0] / len(train)",
        "    n_pct = np.histogram(now, bins=edges)[0] / len(now)",
        "    # 0% 구간의 log(0) 방지 — 아주 작은 값으로 치환",
        "    t_pct = np.clip(t_pct, 1e-6, None)",
        "    n_pct = np.clip(n_pct, 1e-6, None)",
        "    return float(np.sum((n_pct - t_pct) * np.log(n_pct / t_pct)))",
        "",
        "",
        "def scan_features(train_df, now_df, features) -> pd.DataFrame:",
        "    \"\"\"매일 배치 — 피처별 PSI + KS 검정으로 드리프트 스캔.\"\"\"",
        "    rows = []",
        "    for f in features:",
        "        p = psi(train_df[f].values, now_df[f].values)",

    // 성능 타임라인 (Step 1) — 월별 정확도 하락 바
    function PerfTimeline({ rows }) {
      if (!rows) return null;
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">📉 월별 정확도 — 코드는 그대로, 성능만 하락</div>
          <div className="flex items-end gap-2 h-32">
            {rows.map((r) => {
              const color = r.acc >= 82 ? 'bg-emerald-500' : r.acc >= 76 ? 'bg-amber-500' : 'bg-red-500';
              return (
                <div key={r.label} className="flex-1 flex flex-col items-center gap-0.5 h-full justify-end">
                  <span className="text-[9px] font-mono font-bold text-slate-700">{r.acc}%</span>
                  <div className={`w-full rounded-t ${color} transition-all duration-700`} style={{ height: `${(r.acc - 55) * 3}%` }} />
                  <span className="text-[9px] text-slate-600 font-bold">{r.label}</span>
                </div>
              );
            })}
          </div>
          <div className="mt-1.5 grid grid-cols-3 gap-1 text-[9px] text-slate-600">
            {rows.filter((r) => r.event).map((r) => (
              <div key={r.label} className="rounded border border-slate-200 bg-slate-50 px-1 py-0.5">
                <span className="font-bold">{r.label}</span> {r.event}
              </div>
            ))}
          </div>
          <div className="mt-1.5 rounded border border-amber-300 bg-amber-50 px-2 py-1 text-[10px] text-amber-900">
            ⏳ 라벨 지연: 오늘 예측 → +30일 이탈 확정 → +31일에야 채점 가능 — 이 그래프는 항상 한 달 늦다.
          </div>
        </div>
      );
    }

    // 분포 히스토그램 겹침 (Step 2) — 학습 vs 현재
    function HistogramCompare({ box }) {
      if (!box) return null;
      const max = Math.max(...box.bins.flatMap((b) => [b.train, b.now]));
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-1">📊 {box.title}</div>
          <div className="flex gap-3 text-[9px] mb-2">
            <span className="flex items-center gap-1"><span className="w-3 h-2 rounded-sm bg-violet-500 inline-block" /> 학습 시점</span>
            <span className="flex items-center gap-1"><span className="w-3 h-2 rounded-sm bg-orange-400 inline-block" /> 최근 7일</span>
          </div>
          <div className="flex items-end gap-2 h-28">
            {box.bins.map((b) => (
              <div key={b.label} className="flex-1 flex flex-col items-center h-full justify-end">
                <div className="w-full flex items-end justify-center gap-0.5 h-full">
                  <div className="w-1/2 rounded-t bg-violet-500 transition-all duration-700" style={{ height: `${(b.train / max) * 100}%` }} title={`학습 ${b.train}%`} />
                  <div className="w-1/2 rounded-t bg-orange-400 transition-all duration-700" style={{ height: `${(b.now / max) * 100}%` }} title={`현재 ${b.now}%`} />
                </div>
                <span className="text-[9px] text-slate-600 font-bold mt-0.5">{b.label}</span>
              </div>
            ))}
          </div>
          <div className="mt-1 text-[10px] text-slate-600">20대 구간이 14% → 38% — 모델이 학습 때 거의 못 본 유저가 주력이 됐다.</div>
        </div>
      );
    }

    // PSI 게이지 (Step 2)
    function PsiGauge({ psi }) {
      if (!psi) return null;
      const pct = Math.min(100, (psi.value / 0.5) * 100);
      const zone = psi.value >= 0.25 ? { color: 'bg-red-500', label: '드리프트 확정 🚨' }
                 : psi.value >= 0.10 ? { color: 'bg-amber-500', label: '주의' }
                 : { color: 'bg-emerald-500', label: '안정' };
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-white p-3">
          <div className="flex items-center justify-between text-xs font-bold text-red-900 mb-1">
            <span>🌡 {psi.label}</span>
            <span className="font-mono">{psi.value.toFixed(2)} — {zone.label}</span>
          </div>
          <div className="relative h-3 rounded-full bg-slate-100 overflow-hidden">
            <div className={`h-full ${zone.color} transition-all duration-700`} style={{ width: `${pct}%` }} />
            {/* 임계선 0.10 / 0.25 */}
            <div className="absolute top-0 bottom-0 border-l border-amber-500" style={{ left: '20%' }} />
            <div className="absolute top-0 bottom-0 border-l-2 border-red-500" style={{ left: '50%' }} />
          </div>
          <div className="flex justify-between text-[9px] text-slate-500 mt-0.5">
            <span>0</span><span>0.10 주의</span><span>0.25 확정</span><span>0.50</span>
          </div>
        </div>
      );
    }

    // 컨셉 드리프트 — 같은 행동 다른 의미 (Step 3)
    function ConceptCompareBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🔄 {box.title}</div>
          {box.rows.map((r) => (
            <div key={r.era} className="mb-1.5">
              <div className="flex justify-between text-[10px] text-slate-700 mb-0.5">
                <span className="font-bold">{r.era}</span>
                <span className="font-mono">이탈률 {r.rate}%</span>
              </div>
              <div className="h-2.5 rounded-full bg-slate-100 overflow-hidden">
                <div className={`h-full transition-all duration-700 ${r.rate >= 50 ? 'bg-red-500' : 'bg-emerald-500'}`} style={{ width: `${r.rate}%` }} />
              </div>
              <div className="text-[9px] text-slate-500 mt-0.5">{r.note}</div>
            </div>
          ))}
          <div className="text-[10px] text-violet-900 mt-1">입력(방문 횟수)은 그대로인데, 그 입력이 가리키는 정답이 변했다 — X→y 관계의 붕괴.</div>
        </div>
      );
    }

    function DriftMatrix({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-1.5">⚖️ {box.title}</div>
          <table className="w-full text-[9px]">
            <thead>
              <tr className="text-violet-900 border-b border-violet-200">
                <th className="text-left py-0.5">종류</th>
                <th className="text-left py-0.5 pl-1">입력</th>
                <th className="text-left py-0.5 pl-1">관계</th>
                <th className="text-left py-0.5 pl-1">탐지</th>
                <th className="text-left py-0.5 pl-1">처방</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.kind} className="border-t border-violet-100 align-top">
                  <td className="py-1 font-bold text-violet-900">{r.kind}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.input}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.rel}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.detect}</td>
                  <td className="py-1 pl-1 font-bold text-emerald-700">{r.fix}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // 재학습 트리거 로그 + 챔피언-챌린저 대결 (Step 4)
    function TriggerLog({ box }) {
      if (!box) return null;
      const TONE = {
        alert: 'border-red-300 bg-red-50 text-red-900',
        run:   'border-violet-300 bg-violet-50 text-violet-900',
        win:   'border-emerald-300 bg-emerald-50 text-emerald-900',

      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🔔 {box.title}</div>
          <div className="space-y-1">
            {box.items.map((it, i) => (
              <div key={i} className={`rounded border px-2 py-1 text-[10px] flex gap-2 ${TONE[it.tone]}`}>
                <span className="font-mono font-bold w-9 shrink-0">{it.t}</span>
                <span>{it.msg}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BattleBox({ box }) {
      if (!box) return null;
      const Card = ({ m, win }) => (
        <div className={`flex-1 rounded-lg border-2 p-2 ${win ? 'border-emerald-400 bg-emerald-50' : 'border-slate-300 bg-slate-50'}`}>
          <div className={`text-[10px] font-bold mb-1 ${win ? 'text-emerald-800' : 'text-slate-700'}`}>
            {win ? '🏆 ' : ''}{m.name}
          </div>
          <div className="text-[10px] font-mono">AUC <span className="font-bold">{m.auc.toFixed(2)}</span> · Acc {m.acc}%</div>
          <div className="h-1.5 rounded-full bg-white overflow-hidden mt-1 border border-slate-200">
            <div className={`h-full ${win ? 'bg-emerald-500' : 'bg-slate-400'}`} style={{ width: `${m.auc * 100}%` }} />
          </div>
          <div className="text-[9px] text-slate-600 mt-1">{m.note}</div>
        </div>
      );
      return (
        <div className="mt-3 rounded-lg border-2 border-emerald-400 bg-white p-3">
          <div className="text-xs font-bold text-emerald-900 mb-2">⚔️ {box.title}</div>
          <div className="flex gap-2 items-stretch">
            <Card m={box.champion} win={false} />
            <div className="flex items-center text-slate-400 text-sm font-bold">vs</div>
            <Card m={box.challenger} win={true} />
          </div>
          <div className="text-[10px] text-emerald-900 mt-1.5">섀도 2주간 실전 트래픽을 나란히 예측 → 지연 라벨 채점에서 이긴 쪽만 승격.</div>
        </div>
      );
    }

    // 운영 대시보드 + 체크리스트 + 졸업 (Step 5)
    function DashboardBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-1.5">🖥 {box.title}</div>
          <table className="w-full text-[9px]">
            <thead>
              <tr className="text-violet-900 border-b border-violet-200">
                <th className="text-left py-0.5">층</th>
                <th className="text-left py-0.5 pl-1">지표</th>
                <th className="text-left py-0.5 pl-1">지연</th>
                <th className="text-left py-0.5 pl-1">현재</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.layer} className="border-t border-violet-100">
                  <td className="py-1 font-bold text-violet-900 whitespace-nowrap">{r.layer}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.metric}</td>
                  <td className="py-1 pl-1 font-mono text-slate-600">{r.lag}</td>
                  <td className="py-1 pl-1 text-emerald-700 font-bold">{r.now}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function OpsChecklist({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-white p-3">
          <div className="text-xs font-bold text-amber-900 mb-1.5">✅ {box.title}</div>
          <div className="space-y-1">
            {box.items.map((it, i) => (
              <div key={i} className="rounded border border-amber-200 bg-amber-50 px-2 py-1 text-[10px] flex gap-2 text-slate-800">
                <span>{it.icon}</span><span>{it.text}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function GraduateBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-3">
          <div className="text-sm font-bold text-violet-900 mb-2">{box.title}</div>
          <div className="space-y-1.5">
            {box.items.map((it) => (
              <a key={it.name} href={it.to} className="block rounded-lg border border-violet-300 bg-white px-2.5 py-1.5 text-[10px] hover:bg-violet-50">
                <span className="font-bold text-violet-800 font-mono">{it.name}</span>
                <span className="text-slate-700"> — {it.desc}</span>
              </a>
            ))}
          </div>
        </div>
      );
    }

    // 경고/알림 박스
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // 좌측 LiveDataPane — 드리프트 모니터링 시뮬레이션 (violet 톤)
    const PHASE_BADGE = {
      'decay':         { icon: '📉', label: '조용한 성능 저하' },
      'data-drift':    { icon: '📊', label: '데이터 드리프트' },
      'concept-drift': { icon: '🔄', label: '컨셉 드리프트' },
      'retrain':       { icon: '🏆', label: '재학습·교체' },
      'checklist':     { icon: '🎓', label: '운영 체크리스트' },
    };

    function LiveDataPane({ beat, state }) {
      const ph = PHASE_BADGE[state.phase] || PHASE_BADGE['decay'];
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{ph.icon}</span>
              <span>이탈 예측 모델 운영실 — {ph.label}</span>
            </h3>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200 flex justify-between">
            <span>{state.phaseDetail}</span>
            <span className="text-slate-500">{state.actor}</span>
          </div>
          <PerfTimeline rows={state.timeline} />
          <HistogramCompare box={state.histogram} />
          <PsiGauge psi={state.psi} />
          <ConceptCompareBox box={state.conceptCompare} />
          <DriftMatrix box={state.driftMatrix} />
          <TriggerLog box={state.triggerLog} />
          <BattleBox box={state.battle} />
          <DashboardBox box={state.dashboard} />
          <OpsChecklist box={state.opsChecklist} />
          <GraduateBox box={state.graduate} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // App
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <div className="text-[10px] font-bold text-violet-500 tracking-wide">PART V — 실무 투입</div>
                <h1 className="text-2xl font-bold text-violet-900">V-2-2. 운영 체크리스트 — 드리프트·재학습</h1>
                <p className="text-sm text-violet-800/80">배포한 날이 가장 똑똑한 날 — 모델은 방치하면 반드시 늙는다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">🎓 핵심 정리 — ML 과정 졸업</div>
                모델은 배포한 날이 가장 똑똑하다 — 세상이 변하기 때문이다. 입력 분포가 변하면 데이터 드리프트(PSI·KS로 라벨 없이 즉시 탐지),
                입력은 그대로인데 X→y 관계가 변하면 컨셉 드리프트(예측 분포·지연 백테스트 프록시로 감시)다.
                재학습은 드리프트 트리거로 발동하고, 슬라이딩 윈도우로 죽은 관계를 잊게 하고,
                챔피언-챌린저 + 섀도 배포로 이긴 쪽만 안전하게 승격한다.
                이 루프를 파이프라인으로 자동화하는 것이 mlops, 서비스 전체 관측으로 넓히는 것이 observability — 다음 여정에서 만난다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['데이터드리프트', '컨셉드리프트', 'PSI', 'KS검정', '지연라벨', '예측분포', '재학습트리거', '슬라이딩윈도우', '챔피언챌린저', '섀도배포', '롤백'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./V-2-1.html" className="underline hover:no-underline">← 이전: V-2-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 — ML 과정 완주 🎓</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
