  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    ML II-1-1 — 선형·로지스틱 회귀 — OLS와 MLE
    학습 목표: 집값 산점도에 "가장 좋은 직선"을 긋는 문제에서 출발해
              OLS(잔차 제곱합 최소화) → 분류에서 직선이 무너지는 지점 → 시그모이드 →
              MLE(로그 우도 최대화)까지, 두 추정 원리가 사실 한 지도 위에 있음을 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 산점도 피팅 시뮬레이션 + 잔차 막대·우도 게이지) / 우(VSCode CodeViewer: regression_demo.py 진화)
    색상: violet (ml 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 데이터셋 (고정) — 매 렌더 동일해야 잔차·우도 수치가 재현된다
    //   HOUSE  : 집 크기(평) → 매매가(억원). 회귀용 10점
    //   EXAM   : 공부 시간 → 합격(1)/불합격(0). 분류용 12점
    // ─────────────────────────────────────────────────────
    const HOUSE = [
      { x: 12, y: 2.1 }, { x: 16, y: 2.8 }, { x: 20, y: 3.2 }, { x: 24, y: 3.4 },
      { x: 28, y: 4.1 }, { x: 33, y: 4.6 }, { x: 38, y: 5.3 }, { x: 42, y: 5.5 },
      { x: 47, y: 6.4 }, { x: 52, y: 6.6 },
    ];
    const EXAM = [
      { x: 1.0, y: 0 }, { x: 1.8, y: 0 }, { x: 2.4, y: 0 }, { x: 3.0, y: 0 },
      { x: 3.6, y: 1 }, { x: 4.0, y: 0 }, { x: 4.5, y: 1 }, { x: 5.0, y: 1 },
      { x: 5.6, y: 1 }, { x: 6.4, y: 1 }, { x: 7.2, y: 1 }, { x: 8.0, y: 1 },
    ];

    // OLS 닫힌 해 — 시각화가 "진짜 최소제곱 직선"을 그리도록 런타임에 직접 계산
    function olsFit(pts) {
      const n = pts.length;
      const mx = pts.reduce((s, p) => s + p.x, 0) / n;
      const my = pts.reduce((s, p) => s + p.y, 0) / n;
      let num = 0, den = 0;
      pts.forEach((p) => { num += (p.x - mx) * (p.y - my); den += (p.x - mx) ** 2; });
      const b1 = num / den;
      return { b0: my - b1 * mx, b1 };
    }
    const OLS = olsFit(HOUSE);                       // 최적 직선
    const NAIVE = { b0: 1.9, b1: 0.075 };            // Step 1 의 "눈대중" 직선
    const sse = (pts, f) => pts.reduce((s, p) => s + (p.y - f.b0 - f.b1 * p.x) ** 2, 0);
    const SSE_NAIVE = sse(HOUSE, NAIVE);
    const SSE_OLS = sse(HOUSE, OLS);

    // 로지스틱 (경사하강 결과를 고정값으로) + 로그 우도
    const sigmoid = (z) => 1 / (1 + Math.exp(-z));
    const LOGIT = { w: 1.7, b: -6.6 };               // p(합격) = σ(1.7h − 6.6), 결정 경계 ≈ 3.9h
    const logLik = (pts, m) => pts.reduce((s, p) => {
      const q = sigmoid(m.w * p.x + m.b);
      return s + (p.y === 1 ? Math.log(q) : Math.log(1 - q));
    }, 0);
    const LL_FIT = logLik(EXAM, LOGIT);              // ≈ -2.6 (좋음)
    const LL_BAD = logLik(EXAM, { w: 0.35, b: -1.2 }); // 덜 학습된 모델 비교용

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   pane: 좌측 LiveDataPane 렌더 모드 + 보조 박스 데이터
    //   code: 우측 CodeViewer (regression_demo.py 진화)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      v1: { lang: "python", filename: "regression_demo.py (v1 — 문제 정의)", lines: [
        "\"\"\"",
        "regression_demo.py — v1: 집값 예측, 문제 정의",
        "\"가장 좋은 직선\"을 고르려면 먼저 오차(잔차)를 정의해야 한다",
        "\"\"\"",
        "import numpy as np",
        "import matplotlib.pyplot as plt",
        "",
        "# 집 크기(평) → 매매가(억원) — 관측 데이터 10건",
        "x = np.array([12, 16, 20, 24, 28, 33, 38, 42, 47, 52])",

    // ─────────────────────────────────────────────────────
    // SVG 산점도 + 직선/시그모이드 차트
    //   HOUSE: x 0~60(평), y 0~8(억) / EXAM: x 0~9(h), y -0.35~1.35
    // ─────────────────────────────────────────────────────
    const W = 340, H = 210, PAD = { l: 34, r: 10, t: 12, b: 24 };

    function makeScale(chart) {
      const dom = chart === 'house'
        ? { x0: 0, x1: 60, y0: 0, y1: 8 }
        : { x0: 0, x1: 9, y0: -0.35, y1: 1.35 };
      const sx = (v) => PAD.l + ((v - dom.x0) / (dom.x1 - dom.x0)) * (W - PAD.l - PAD.r);
      const sy = (v) => H - PAD.b - ((v - dom.y0) / (dom.y1 - dom.y0)) * (H - PAD.t - PAD.b);
      return { dom, sx, sy };
    }

    function linePath(f, dom, sx, sy) {
      return `M ${sx(dom.x0)} ${sy(f.b0 + f.b1 * dom.x0)} L ${sx(dom.x1)} ${sy(f.b0 + f.b1 * dom.x1)}`;
    }

    function sigmoidPath(m, dom, sx, sy) {
      const pts = [];
      for (let i = 0; i <= 60; i++) {
        const x = dom.x0 + (i / 60) * (dom.x1 - dom.x0);
        pts.push(`${i === 0 ? 'M' : 'L'} ${sx(x).toFixed(1)} ${sy(sigmoid(m.w * x + m.b)).toFixed(1)}`);
      }
      return pts.join(' ');
    }

    function FitChart({ pane }) {
      const { chart, mode, line, ghostLine, badLine, curve, squares, likelihood } = pane;
      const { dom, sx, sy } = makeScale(chart);
      const pts = chart === 'house' ? HOUSE : EXAM;
      const xLabel = chart === 'house' ? '집 크기 (평)' : '공부 시간 (h)';
      const yLabel = chart === 'house' ? '가격 (억)' : 'p(합격)';
      // 눈금
      const xTicks = chart === 'house' ? [0, 20, 40, 60] : [0, 3, 6, 9];
      const yTicks = chart === 'house' ? [0, 2, 4, 6, 8] : [0, 0.5, 1];

      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full rounded-lg border border-violet-200 bg-white" role="img" aria-label={`${xLabel} 대 ${yLabel} 산점도와 모델 곡선`}>
          {/* 축 */}
          <line x1={PAD.l} y1={sy(dom.y0)} x2={W - PAD.r} y2={sy(dom.y0)} stroke="#cfc9ba" strokeWidth="1" />
          <line x1={PAD.l} y1={sy(dom.y0)} x2={PAD.l} y2={PAD.t} stroke="#cfc9ba" strokeWidth="1" />
          {xTicks.map((t) => (
            <text key={`xt${t}`} x={sx(t)} y={H - 8} fontSize="8" fill="#8a8578" textAnchor="middle">{t}</text>
          ))}
          {yTicks.map((t) => (
            <text key={`yt${t}`} x={PAD.l - 5} y={sy(t) + 3} fontSize="8" fill="#8a8578" textAnchor="end">{t}</text>
          ))}
          <text x={W - PAD.r} y={H - 8} fontSize="8" fill="#57534a" textAnchor="end">{xLabel}</text>
          <text x={PAD.l + 4} y={PAD.t + 6} fontSize="8" fill="#57534a">{yLabel}</text>

          {/* 분류: 확률 유효 범위 밖(>1, <0)을 붉은 워시로 */}
          {mode === 'classify' && (
            <g>
              <rect x={PAD.l} y={PAD.t} width={W - PAD.l - PAD.r} height={sy(1) - PAD.t} fill="#fee2e2" opacity="0.55" />
              <rect x={PAD.l} y={sy(0)} width={W - PAD.l - PAD.r} height={sy(dom.y0) - sy(0)} fill="#fee2e2" opacity="0.55" />
              <text x={W - PAD.r - 4} y={sy(1) - 4} fontSize="7.5" fill="#b91c1c" textAnchor="end">p &gt; 1 — 확률이 아님</text>
              <text x={W - PAD.r - 4} y={sy(0) + 10} fontSize="7.5" fill="#b91c1c" textAnchor="end">p &lt; 0 — 확률이 아님</text>
            </g>
          )}

          {/* 잔차 (세로선 + 제곱 정사각형) */}
          {(mode === 'residual' || mode === 'ols') && line && pts.map((p, i) => {
            const yh = line.b0 + line.b1 * p.x;
            const r = p.y - yh;
            const side = Math.abs(sy(p.y) - sy(yh));
            return (
              <g key={`res${i}`}>
                {squares && (
                  <rect
                    x={r >= 0 ? sx(p.x) - side : sx(p.x)}
                    y={Math.min(sy(p.y), sy(yh))}
                    width={side} height={side}
                    fill="#f59e0b" opacity="0.18" stroke="#f59e0b" strokeWidth="0.6"
                  />
                )}
                <line x1={sx(p.x)} y1={sy(p.y)} x2={sx(p.x)} y2={sy(yh)} stroke="#ea580c" strokeWidth="1.6" opacity="0.85" />
              </g>
            );
          })}

          {/* 우도 막대 (MLE): 각 점의 likelihood = 합격이면 p, 불합격이면 1-p */}
          {mode === 'mle' && curve && pts.map((p, i) => {
            const q = sigmoid(curve.w * p.x + curve.b);
            const lik = p.y === 1 ? q : 1 - q;
            const barH = lik * 46;
            const low = lik < 0.5;
            return (
              <g key={`lik${i}`}>
                <rect x={sx(p.x) - 3} y={sy(dom.y0) - barH} width={6} height={barH}
                      fill={low ? '#ef4444' : '#10b981'} opacity="0.55" />
                {low && <text x={sx(p.x)} y={sy(dom.y0) - barH - 3} fontSize="7" fill="#b91c1c" textAnchor="middle">{lik.toFixed(2)}</text>}
              </g>
            );
          })}

          {/* 직선들 */}
          {ghostLine && <path d={linePath(ghostLine, dom, sx, sy)} stroke="#a8a29e" strokeWidth="1.4" strokeDasharray="5 4" fill="none" />}
          {badLine && <path d={linePath(badLine, dom, sx, sy)} stroke="#78716c" strokeWidth="1.6" strokeDasharray="6 3" fill="none" />}
          {line && <path d={linePath(line, dom, sx, sy)} stroke="#7c3aed" strokeWidth="2.2" fill="none" />}

          {/* 시그모이드 곡선 + 결정 경계 */}
          {curve && (
            <g>
              <path d={sigmoidPath(curve, dom, sx, sy)} stroke="#7c3aed" strokeWidth="2.4" fill="none" />
              <line x1={sx(-curve.b / curve.w)} y1={sy(dom.y0)} x2={sx(-curve.b / curve.w)} y2={PAD.t}
                    stroke="#7c3aed" strokeWidth="1" strokeDasharray="3 3" opacity="0.6" />
              <text x={sx(-curve.b / curve.w) + 3} y={PAD.t + 14} fontSize="7.5" fill="#6d28d9">경계 {(-curve.b / curve.w).toFixed(1)}h (p=0.5)</text>
            </g>
          )}

          {/* 데이터 점 */}
          {pts.map((p, i) => (
            <circle key={`pt${i}`} cx={sx(p.x)} cy={sy(p.y)} r="3.4"
                    fill={chart === 'exam' ? (p.y === 1 ? '#10b981' : '#ef4444') : '#7c3aed'}
                    stroke="#fffdf7" strokeWidth="1" />
          ))}

          {/* 범례 */}
          {chart === 'exam' && (
            <g fontSize="7.5">
              <circle cx={PAD.l + 8} cy={PAD.t + 4} r="3" fill="#10b981" />
              <text x={PAD.l + 14} y={PAD.t + 7} fill="#57534a">합격(1)</text>
              <circle cx={PAD.l + 52} cy={PAD.t + 4} r="3" fill="#ef4444" />
              <text x={PAD.l + 58} y={PAD.t + 7} fill="#57534a">불합격(0)</text>
            </g>
          )}
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // 게이지 — SSE(작을수록 좋음) / 로그 우도(0에 가까울수록 좋음)
    // ─────────────────────────────────────────────────────
    function Gauge({ gauge }) {
      if (!gauge) return null;
      const fmt = gauge.fmt || ((v) => v.toFixed(2));
      const min = gauge.min !== undefined ? gauge.min : 0;
      const pct = Math.max(4, Math.min(100, ((gauge.value - min) / (gauge.max - min)) * 100));
      const prevPct = gauge.prev !== undefined ? Math.max(4, Math.min(100, ((gauge.prev - min) / (gauge.max - min)) * 100)) : null;
      const barColor = gauge.tone === 'good' ? 'bg-emerald-500' : gauge.tone === 'warn' ? 'bg-amber-500' : 'bg-violet-500';
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="flex items-center justify-between text-[11px] font-bold text-violet-900 mb-1">
            <span>{gauge.label}</span>
            <span className="font-mono">
              {gauge.prev !== undefined && <span className="text-slate-400 line-through mr-1.5">{fmt(gauge.prev)}</span>}
              {fmt(gauge.value)}
            </span>
          </div>
          <div className="relative h-2.5 rounded-full bg-violet-100 overflow-hidden">
            {prevPct !== null && <div className="absolute h-full bg-slate-300" style={{ width: `${prevPct}%` }} />}
            <div className={`absolute h-full ${barColor} transition-all duration-700`} style={{ width: `${pct}%` }} />
          </div>
          {gauge.prev !== undefined && (
            <div className="mt-1 text-[10px] text-slate-500">회색 = 이전 모델, 컬러 = 현재 모델</div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 노이즈→손실 지도 + OLS vs MLE 비교표 + 실무 팁
    // ─────────────────────────────────────────────────────
    function MapBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🗺 {box.title}</div>
          {box.rows.map((r) => (
            <div key={r.model} className="flex items-stretch gap-1.5 mb-1.5 text-[10px]">
              <div className="w-20 shrink-0 rounded border border-violet-300 bg-violet-50 px-1.5 py-1 font-bold text-violet-900 flex items-center">{r.model}</div>
              <div className="flex items-center text-violet-400">＋</div>
              <div className="flex-1 rounded border border-sky-300 bg-sky-50 px-1.5 py-1 text-sky-900 flex items-center">{r.noise}</div>
              <div className="flex items-center text-violet-400">⇒</div>
              <div className="flex-1 rounded border border-emerald-300 bg-emerald-50 px-1.5 py-1 text-emerald-900 font-bold flex items-center">{r.loss}</div>
            </div>
          ))}
          <div className="mt-1.5 text-[10px] text-violet-900">손실 함수는 취향이 아니라 <b>노이즈 가정의 수학적 결론</b>이다 — 가정이 바뀌면 손실이 바뀐다.</div>
        </div>
      );
    }

    function CompareBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-3">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xl">⚖️</span>
            <span className="text-sm font-bold text-violet-900">{box.title}</span>
          </div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-violet-900 border-b-2 border-violet-300">
                <th className="text-left py-1 w-10">관점</th>
                <th className="text-left py-1 pl-2">OLS (최소제곱)</th>
                <th className="text-left py-1 pl-2">MLE (최대우도)</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.crit} className="border-t border-violet-200 align-top">
                  <td className="py-1 font-bold text-violet-800">{r.crit}</td>
                  <td className="py-1 pl-2 text-slate-800">{r.ols}</td>
                  <td className="py-1 pl-2 text-slate-800">{r.mle}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function TipsBox({ tips }) {
      if (!tips) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-1.5">🛠 실무 팁 — 스케일링 · 규제 프리뷰</div>
          <ul className="space-y-1 text-[10px] text-amber-900">
            {tips.map((t, i) => <li key={i} className="flex gap-1.5"><span>▸</span><span>{t}</span></li>)}
          </ul>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 산점도 피팅 시뮬레이션 (violet 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      residual: { icon: '📐', label: '잔차 정의' },
      ols:      { icon: '🎯', label: 'OLS 피팅' },
      classify: { icon: '🪃', label: '직선의 붕괴 → σ' },
      mle:      { icon: '🎲', label: '우도 계산' },
      map:      { icon: '🗺', label: '통합 지도' },
    };

    function LiveDataPane({ beat, state }) {
      const pane = state.pane;
      const badge = MODE_BADGE[pane.mode] || MODE_BADGE.residual;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>피팅 시뮬레이션 — {badge.label}</span>
            </h3>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            {state.actor}
          </div>
          {pane.chart && <FitChart pane={pane} />}
          {pane.lineLabel && (
            <div className="mt-2 text-[10px] font-mono text-violet-800 px-2 py-1 rounded bg-violet-50 border border-violet-200 inline-block">
              {pane.lineLabel}
            </div>
          )}
          {pane.mode === 'classify' && (
            <div className="mt-2 flex gap-2 text-[10px]">
              <span className="flex-1 rounded border border-slate-300 bg-slate-50 px-2 py-1 text-slate-600">─ ─ 회색 점선: 0/1에 OLS 직선 → 범위 이탈</span>
              <span className="flex-1 rounded border border-violet-300 bg-violet-50 px-2 py-1 text-violet-800 font-bold">━ 보라 S곡선: σ(wx+b) → 항상 (0,1)</span>
            </div>
          )}
          {pane.mode === 'mle' && (
            <div className="mt-2 flex gap-2 text-[10px]">
              <span className="flex-1 rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-emerald-800">▮ 초록 막대: 그 점의 우도 (예측이 정답과 맞음)</span>
              <span className="flex-1 rounded border border-red-300 bg-red-50 px-2 py-1 text-red-800">▮ 빨강 막대: 우도 &lt; 0.5 — 로그 우도를 깎는 점</span>
            </div>
          )}
          <Gauge gauge={pane.gauge} />
          <MapBox box={pane.mapBox} />
          <CompareBox box={pane.compareBox} />
          <TipsBox tips={pane.tips} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">II-1-1. 선형·로지스틱 회귀 — OLS와 MLE</h1>
                <p className="text-sm text-violet-800/80">직선 하나로 시작하는 통계적 학습 — 최소제곱과 최대우도는 뭐가 다른가</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                OLS는 "잔차 제곱합이 최소인 직선"을 닫힌 해로 찾고, MLE는 "관측 데이터가 가장 그럴듯해지는 파라미터"를 찾는다.
                둘은 경쟁 관계가 아니다 — 가우시안 노이즈를 가정하면 MLE가 정확히 OLS로 정리되고,
                베르누이(0/1)를 가정하면 크로스엔트로피(로지스틱 회귀)가 유도된다.
                즉 손실 함수는 취향이 아니라 노이즈 가정의 결론이다.
                다음 챕터(II-1-2)에서는 계수 폭주를 막는 규제 — Ridge(L2)와 Lasso(L1)를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['선형회귀', '로지스틱회귀', '잔차', 'OLS', '정규방정식', '시그모이드', 'MLE', '로그우도', '크로스엔트로피', 'statsmodels', 'StandardScaler', 'Ridge/Lasso'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
