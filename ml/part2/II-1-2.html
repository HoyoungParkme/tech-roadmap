          {/* 축 */}
          <line x1={CHART.x0} y1={CHART.y0} x2={CHART.x1} y2={CHART.y0} stroke="#8a8578" strokeWidth="1" />
          <line x1={CHART.x0} y1={CHART.y0} x2={CHART.x0} y2={CHART.y1} stroke="#8a8578" strokeWidth="1" />
          <text x={(CHART.x0 + CHART.x1) / 2} y={CHART.h - 4} textAnchor="middle" fontSize="8" fill="#57534a">연소득 (천만원)</text>
          <text x={9} y={(CHART.y0 + CHART.y1) / 2} textAnchor="middle" fontSize="8" fill="#57534a" transform={`rotate(-90 9 ${(CHART.y0 + CHART.y1) / 2})`}>나이 (세)</text>
          {[0, 2, 4, 6, 8, 10].map((v) => <text key={v} x={sx(v)} y={CHART.y0 + 10} textAnchor="middle" fontSize="7" fill="#8a8578">{v}</text>)}
          {[20, 35, 50, 65].map((v) => <text key={v} x={CHART.x0 - 4} y={sy(v) + 2.5} textAnchor="end" fontSize="7" fill="#8a8578">{v}</text>)}
          {/* 분할선 */}
          {(scatter.splits || []).map((s, i) => {
            const st = SPLIT_STYLE[s.tone] || SPLIT_STYLE.win;
            if (s.type === 'v') {
              return (
                <g key={i}>
                  <line x1={sx(s.at)} y1={CHART.y1} x2={sx(s.at)} y2={CHART.y0} stroke={st.stroke} strokeWidth={st.width} strokeDasharray={st.dash} />
                  {s.label && <text x={sx(s.at) + 3} y={CHART.y1 + 8} fontSize="7.5" fontWeight="bold" fill={st.stroke}>{s.label}</text>}
                </g>
              );
            }
            const rx1 = sx(s.x1 !== undefined ? s.x1 : CHART.xMin);
            const rx2 = sx(s.x2 !== undefined ? s.x2 : CHART.xMax);
            return (
              <g key={i}>
                <line x1={rx1} y1={sy(s.at)} x2={rx2} y2={sy(s.at)} stroke={st.stroke} strokeWidth={st.width} strokeDasharray={st.dash} />
                {s.label && <text x={rx1 + 3} y={sy(s.at) - 3} fontSize="7.5" fontWeight="bold" fill={st.stroke}>{s.label}</text>}
              </g>
            );
          })}
          {/* 데이터 점 */}
          {pts.map((p) => (
            <g key={p.id}>
              <circle cx={sx(p.x)} cy={sy(p.y)} r={p.noise ? 5.5 : 4.5}
                fill={p.label === 'approve' ? '#10b981' : '#ef4444'}
                stroke={p.noise ? '#dc2626' : '#fffdf7'} strokeWidth={p.noise ? 1.6 : 1}
                strokeDasharray={p.noise ? '2 1.5' : ''} opacity="0.9" />
              <text x={sx(p.x)} y={sy(p.y) + 2.6} textAnchor="middle" fontSize="6.5" fill="#fff" fontWeight="bold">
                {p.label === 'approve' ? '✓' : '✗'}
              </text>
            </g>
          ))}
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 시각화 2 — 트리 다이어그램 (SVG, 단계별 성장)
    // ─────────────────────────────────────────────────────
    const NODE_TONE = {
      root:    { fill: '#7c3aed', stroke: '#6d28d9', text: '#fff' },
      cand:    { fill: '#faf7ef', stroke: '#8b5cf6', text: '#5b21b6', dash: '4 3' },
      mid:     { fill: '#ede9fe', stroke: '#8b5cf6', text: '#5b21b6' },
      impure:  { fill: '#fee2e2', stroke: '#ef4444', text: '#991b1b' },
      pure:    { fill: '#d1fae5', stroke: '#10b981', text: '#065f46' },
      approve: { fill: '#10b981', stroke: '#059669', text: '#fff' },
      reject:  { fill: '#ef4444', stroke: '#dc2626', text: '#fff' },
    };

    function TreeDiagram({ tree }) {
      const byId = Object.fromEntries(tree.nodes.map((n) => [n.id, n]));
      return (
        <svg viewBox="0 0 264 172" className="w-full" role="img" aria-label="결정트리 다이어그램 — 질문 노드와 승인/거절 잎 노드">
          {tree.edges.map(([a, b, label], i) => {
            const na = byId[a], nb = byId[b];
            if (!na || !nb) return null;
            const midX = (na.x + nb.x) / 2, midY = (na.y + 15 + nb.y - 12) / 2;
            return (
              <g key={i}>
                <line x1={na.x} y1={na.y + 15} x2={nb.x} y2={nb.y - 12} stroke="#a78bfa" strokeWidth="1.4" />
                {label && <text x={midX + (nb.x < na.x ? -4 : 4)} y={midY} textAnchor={nb.x < na.x ? 'end' : 'start'} fontSize="7" fill="#7c3aed" fontWeight="bold">{label}</text>}
              </g>
            );
          })}
          {tree.nodes.map((n) => {
            const t = NODE_TONE[n.tone] || NODE_TONE.mid;
            return (
              <g key={n.id}>
                <rect x={n.x - n.w / 2} y={n.y - 12} width={n.w} height={30} rx="5"
                  fill={t.fill} stroke={t.stroke} strokeWidth="1.4" strokeDasharray={t.dash || ''} />
                <text x={n.x} y={n.y - 1} textAnchor="middle" fontSize="8.5" fontWeight="bold" fill={t.text}>{n.label}</text>
                <text x={n.x} y={n.y + 10} textAnchor="middle" fontSize="6.8" fill={t.text} opacity="0.85">{n.sub}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // 불순도 게이지 — 엔트로피·지니 막대 (0 = 순수, 최대 = 반반)
    // ─────────────────────────────────────────────────────
    function ImpurityGauge({ gauges }) {
      if (!gauges || gauges.length === 0) return null;
      const Bar = ({ label, value, max, color }) => (
        <div className="flex items-center gap-1.5">
          <span className="w-14 text-[9px] text-slate-600 font-mono">{label}</span>
          <div className="flex-1 h-2 rounded-full bg-violet-100 overflow-hidden">
            <div className={`h-full ${color} transition-all duration-700`} style={{ width: `${(value / max) * 100}%` }} />
          </div>
          <span className="w-10 text-right text-[9px] font-mono font-bold text-slate-800">{value.toFixed(3)}</span>
        </div>
      );
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1.5">🌡 불순도 게이지 — 0 이면 순수, 반반이면 최대</div>
          <div className="space-y-2">
            {gauges.map((g) => (
              <div key={g.name} className={`rounded border p-1.5 ${g.win ? 'border-emerald-400 bg-emerald-50' : g.bad ? 'border-red-300 bg-red-50' : 'border-violet-200'}`}>
                <div className="flex items-center justify-between text-[10px] mb-1">
                  <span className="font-bold text-slate-800">{g.name}{g.win ? ' 🏆' : ''}</span>
                  <span className="font-mono text-slate-600">
                    {g.gain !== undefined ? `이득 ${g.gain.toFixed(3)}` : g.acc !== undefined ? `정확도 ${g.acc}` : `승인 ${g.approve} · 거절 ${g.reject}`}
                  </span>
                </div>
                <Bar label="Entropy" value={g.entropy} max={1.0} color="bg-violet-500" />
                <Bar label="Gini" value={g.gini} max={0.5} color="bg-fuchsia-500" />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 트리의 가치/한계 박스 (Step 5)
    // ─────────────────────────────────────────────────────
    function ValueBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">📋 {box.title}</div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div className="rounded border border-emerald-300 bg-white p-2">
              <div className="text-[10px] font-bold text-emerald-800 mb-1">◎ 강점</div>
              {box.pros.map((p) => (
                <div key={p} className="text-[9.5px] text-slate-700 mb-0.5">• {p}</div>
              ))}
            </div>
            <div className="rounded border border-red-300 bg-white p-2">
              <div className="text-[10px] font-bold text-red-800 mb-1">✗ 약점</div>
              {box.cons.map((c) => (
                <div key={c} className="text-[9.5px] text-slate-700 mb-0.5">• {c}</div>
              ))}
            </div>
          </div>
          <div className="mt-2 text-[10px] font-bold text-violet-900">{box.next}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 산점도 분할 + 트리 성장 + 불순도 게이지
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>🌳</span>
              <span>대출 심사 시뮬레이션</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            {state.engineDetail}
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 items-start">
            <div className="rounded-lg border border-violet-200 bg-violet-50/40 p-1.5">
              <div className="text-[10px] font-bold text-violet-900 px-1 mb-0.5">📊 특징 공간 (축 정렬 분할)</div>
              <ScatterPlot scatter={state.scatter} />
              <div className="flex gap-2 px-1 text-[9px] text-slate-600">
                <span><span className="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-0.5"></span>승인</span>
                <span><span className="inline-block w-2 h-2 rounded-full bg-red-500 mr-0.5"></span>거절</span>
                {state.scatter.showNoise && <span className="text-red-700 font-bold">◌ 점선 테두리 = 노이즈</span>}
              </div>
            </div>
            <div className="rounded-lg border border-violet-200 bg-violet-50/40 p-1.5">
              <div className="text-[10px] font-bold text-violet-900 px-1 mb-0.5">🌲 트리 (동시에 자란다)</div>
              <TreeDiagram tree={state.tree} />
            </div>
          </div>
          <ImpurityGauge gauges={state.gauges} />
          <ValueBox box={state.valueBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">II-1-2. 결정트리 — 엔트로피·지니 불순도</h1>
                <p className="text-sm text-violet-800/80">스무고개로 배우는 분할 학습 — "어떤 질문이 가장 좋은 질문인가"를 수치로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                결정트리는 스무고개다 — "어떤 질문이 좋은가"를 불순도(엔트로피·지니)로 수치화하고,
                정보 이득이 최대인 질문을 greedy 로 골라 재귀 분할한다. 깊이 제한이 없으면 노이즈까지
                암기하므로 max_depth·min_samples_leaf 로 가지치기하는 것이 튜닝의 핵심이다.
                트리의 진짜 가치는 해석 가능성(규칙 추출·feature_importances_)과 전처리 자유(스케일링 불필요)이고,
                치명적 약점은 불안정성 — 이 예민한 나무 한 그루의 분산을 수백 그루의 투표로 잠재우는 것이
                다음 장의 앙상블(랜덤 포레스트·그래디언트 부스팅)이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['결정트리', '엔트로피', '지니불순도', '정보이득', 'greedy분할', '축정렬분할', '과적합', 'max_depth', 'min_samples_leaf', 'plot_tree', 'feature_importances_', '앙상블예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./II-1-1.html" className="underline hover:no-underline">← 이전: II-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
