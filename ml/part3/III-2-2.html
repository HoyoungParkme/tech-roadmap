  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    ML III-2-2 — 이상 탐지 — Isolation Forest·OC-SVM
    학습 목표: 라벨 없는 사기 거래 탐지 문제에서 지도학습이 왜 무너지는지 →
              z-score/IQR 단변량 탐지의 한계 → Isolation Forest 고립 원리(분할 애니메이션) →
              One-Class SVM 경계 학습(nu) → 실무 운영(contamination·알림 피로도·평가)까지 5단계.
    패턴: fastapi v1 — 좌(LiveDataPane: 산점도 분할/경계 시뮬레이션 + 경로 길이 게이지)
          / 우(VSCode CodeViewer: anomaly_demo.py 진화)
    색상: violet (ml 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 산점도 공통 데이터 (SVG 좌표계 0~100, y 아래 방향)
    //   x축: 거래 금액(정규화) / y축: 계정 사용 기간(정규화)
    //   클러스터는 우하향 대각선(상관 관계 있음)
    //   offDiag : 각 변수는 정상 범위인데 "조합"이 이상 (나이 20 · 연봉 5억 유형)
    //   extreme : 두 변수 모두 극단 — 단변량으로도 잡히는 명백한 이상
    // ─────────────────────────────────────────────────────
    const NORMAL_PTS = [
      [18, 70], [22, 66], [25, 68], [28, 62], [32, 60], [35, 63], [38, 56],
      [42, 58], [45, 52], [48, 54], [52, 48], [55, 50], [58, 44], [62, 46],
      [65, 40], [68, 42], [72, 36], [75, 38], [30, 58], [50, 45],
    ];
    const OFF_DIAG = [24, 38];   // 단변량 통과, 조합 이상
    const EXTREME  = [88, 14];   // 단변량으로도 극단

    // Isolation Forest 분할선 — extreme 을 3번 만에 고립
    const IFOREST_SPLITS = [
      { type: 'v', at: 80, label: '분할 1: x > 80 ?' },
      { type: 'h', at: 25, from: 80, label: '분할 2: y < 25 ?' },
      { type: 'v', at: 84, yTo: 25, label: '분할 3: x > 84 → 고립!' },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   viz.mode : 'table' | 'stats' | 'iforest' | 'ocsvm' | 'ops'
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 이상 탐지 문제의 특수성 — 사기는 0.1%뿐이고, 형태도 계속 변한다',
        desc: '카드사 백만 건 거래 중 사기는 약 천 건 — 0.1%다. 지도학습으로 접근하면 두 벽에 부딪힌다: 첫째, 라벨이 극도로 적고 그마저 "과거에 적발된" 수법뿐이라 모델은 옛 사기 패턴을 암기할 뿐이다. 둘째, 사기범은 탐지를 회피하려고 수법을 계속 바꾸므로, 다음 달의 신종 수법은 학습 데이터에 존재하지 않아 전부 미탐이 된다. 그래서 발상을 뒤집는다 — 희소하고 변덕스러운 "이상"을 배우는 대신, 99.9%를 차지해 사실상 무한한 "정상"을 모델링하고, 거기서 벗어나는 것을 이상으로 판정하는 것이다. 이것이 비지도 이상 탐지의 출발점이다.',
        actor: '💳 오늘 거래 8건 — 어떤 게 사기인지 라벨이 없다',
        engine: 'problem',
        engineDetail: '지도학습의 한계 진단',
        viz: { mode: 'table' },
        alert: { tone: 'danger', text: '지도학습은 "본 적 있는 사기"만 잡는다. 신종 수법 앞에서는 라벨 자체가 없다 → "정상을 배우자"로 관점을 뒤집는다.' },
        code: {
          lang: 'python',
          filename: 'anomaly_demo.py (v0 — 지도학습 시도)',
          lines: [
            '"""',
            'anomaly_demo.py — v0: 지도학습으로 사기 탐지를 시도하다',
            '문제: 라벨이 0.1%뿐이고, 사기 수법은 계속 바뀐다',
            '"""',
            'import pandas as pd',
            'from sklearn.ensemble import RandomForestClassifier',
            'from sklearn.model_selection import train_test_split',
            '',
            'df = pd.read_csv("transactions.csv")   # 1,000,000건',
            'print(df["is_fraud"].value_counts())',
            '# 0 (정상)  998,973',
            '# 1 (사기)    1,027   ← 0.1% — 극단적 클래스 불균형',
            '',
            'X = df[["amount", "hour", "n_tx_1h", "account_age"]]',
            'y = df["is_fraud"]',
            '',
            'X_tr, X_te, y_tr, y_te = train_test_split(',
            '    X, y, test_size=0.2, stratify=y, random_state=42)',
            '',
            'clf = RandomForestClassifier(class_weight="balanced")',
            'clf.fit(X_tr, y_tr)',
            'print("acc:", clf.score(X_te, y_te))  # 0.999 !',

    function TxTablePane() {

          <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-2.5">

              그 1,027건조차 "과거에 적발된" 수법. 다음 달 신종 수법의 라벨은 <b>존재하지 않는다</b>.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 산점도 — 모드별 오버레이 (stats / iforest / ocsvm / ops)
    // ─────────────────────────────────────────────────────
    function ScatterViz({ mode, splitCount }) {
      const showSplits = mode === 'iforest';
      const visibleSplits = showSplits ? IFOREST_SPLITS.slice(0, splitCount) : [];
      const isolated = showSplits && splitCount >= 3;

      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-2">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-bold text-violet-900">
              {mode === 'stats' && '📐 축마다 따로 보면 — 단변량 검사'}
              {mode === 'iforest' && `🌲 무작위 분할 — ${splitCount}번째 분할 중`}
              {mode === 'ocsvm' && '🫧 정상 영역을 감싸는 경계 (nu 비교)'}
              {mode === 'ops' && '🚨 이상 점수 상위만 알림 큐로'}
            </span>
            <span className="text-[9px] text-slate-500">x: 거래 금액 / y: 계정 사용 기간</span>
          </div>
          <svg viewBox="0 0 100 100" className="w-full" style={{ maxHeight: 230 }} role="img">
            {/* 축 */}
            <line x1="6" y1="94" x2="98" y2="94" stroke="#cfc9ba" strokeWidth="0.6" />
            <line x1="6" y1="94" x2="6" y2="2" stroke="#cfc9ba" strokeWidth="0.6" />

            {/* stats 모드: 각 축의 "정상 범위" 밴드 */}
            {mode === 'stats' && (
              <g>
                <rect x="16" y="90" width="61" height="4" fill="#a78bfa" opacity="0.35" />
                <rect x="2" y="34" width="4" height="38" fill="#a78bfa" opacity="0.35" />
                <text x="46" y="99" fontSize="3.6" fill="#6d28d9" textAnchor="middle">x 정상 범위 (|z| ≤ 3)</text>
                <text x="4" y="30" fontSize="3.6" fill="#6d28d9">y 정상 범위</text>
                {/* offDiag 투영선 — 두 축 모두 밴드 안 */}
                <line x1={OFF_DIAG[0]} y1={OFF_DIAG[1]} x2={OFF_DIAG[0]} y2="92" stroke="#f59e0b" strokeWidth="0.4" strokeDasharray="1.5,1.5" />
                <line x1={OFF_DIAG[0]} y1={OFF_DIAG[1]} x2="6" y2={OFF_DIAG[1]} stroke="#f59e0b" strokeWidth="0.4" strokeDasharray="1.5,1.5" />
                <text x={OFF_DIAG[0] + 2} y="90" fontSize="3.4" fill="#b45309">✓통과</text>
                <text x="8" y={OFF_DIAG[1] - 1.5} fontSize="3.4" fill="#b45309">✓통과</text>
                {/* extreme 은 밴드 밖 */}
                <line x1={EXTREME[0]} y1={EXTREME[1]} x2={EXTREME[0]} y2="92" stroke="#ef4444" strokeWidth="0.4" strokeDasharray="1.5,1.5" />
                <text x={EXTREME[0] - 14} y="90" fontSize="3.4" fill="#dc2626">✗범위 밖</text>
              </g>
            )}

            {/* ocsvm 모드: 정상 영역을 감싸는 경계 2종 */}
            {mode === 'ocsvm' && (
              <g>
                <ellipse cx="46" cy="53" rx="40" ry="17" transform="rotate(-31 46 53)"
                  fill="#8b5cf6" opacity="0.10" />
                <ellipse cx="46" cy="53" rx="40" ry="17" transform="rotate(-31 46 53)"
                  fill="none" stroke="#7c3aed" strokeWidth="1" />
                <ellipse cx="46" cy="53" rx="34" ry="12" transform="rotate(-31 46 53)"
                  fill="none" stroke="#ec4899" strokeWidth="0.7" strokeDasharray="2.5,2" />
                <text x="63" y="16" fontSize="3.6" fill="#7c3aed">nu=0.01 (여유)</text>
                <text x="63" y="21" fontSize="3.6" fill="#db2777">nu=0.1 (조임)</text>
              </g>
            )}

            {/* iforest 모드: 분할선 애니메이션 */}
            {visibleSplits.map((s, i) => (
              <g key={i}>
                {s.type === 'v'
                  ? <line x1={s.at} y1={s.yTo ? 2 : 2} x2={s.at} y2={s.yTo ? s.yTo : 94} stroke="#7c3aed" strokeWidth="0.8" strokeDasharray="2,1.5" />
                  : <line x1={s.from || 6} y1={s.at} x2="98" y2={s.at} stroke="#7c3aed" strokeWidth="0.8" strokeDasharray="2,1.5" />}
                <text x={s.type === 'v' ? s.at - 1 : 60} y={s.type === 'v' ? 7 : s.at - 1.5} fontSize="3.4" fill="#6d28d9" textAnchor={s.type === 'v' ? 'end' : 'start'}>{s.label}</text>
              </g>
            ))}
            {isolated && (
              <g>
                <rect x="84" y="25" width="14" height="69" fill="#ef4444" opacity="0.12" />
                <circle cx={EXTREME[0]} cy={EXTREME[1]} r="6" fill="none" stroke="#ef4444" strokeWidth="0.8" strokeDasharray="1.5,1" />
                <text x={EXTREME[0] - 24} y={EXTREME[1] - 5} fontSize="3.6" fill="#dc2626" fontWeight="bold">3번 만에 고립!</text>
                {/* 정상점 주변 — 아직 이웃과 함께 */}
                <circle cx="48" cy="54" r="9" fill="none" stroke="#10b981" strokeWidth="0.5" strokeDasharray="1,1" />
                <text x="30" y="76" fontSize="3.4" fill="#047857">정상점: 12번 분할에도 이웃과 함께</text>
              </g>
            )}

            {/* 정상 클러스터 */}
            {NORMAL_PTS.map(([x, y], i) => (
              <circle key={i} cx={x} cy={y} r="1.6"
                fill={mode === 'ops' ? '#a8a29e' : '#8b5cf6'} opacity={mode === 'ops' ? 0.6 : 0.85} />
            ))}

            {/* offDiag 이상점 (조합 이상) */}
            <circle cx={OFF_DIAG[0]} cy={OFF_DIAG[1]} r="2.2" fill="#f59e0b" stroke="#b45309" strokeWidth="0.5" />
            {(mode === 'ocsvm' || mode === 'ops') && (
              <text x={OFF_DIAG[0] + 3.5} y={OFF_DIAG[1] + 1} fontSize="3.4" fill="#b45309">경계 밖 → 이상</text>
            )}
            {mode === 'stats' && (
              <text x={OFF_DIAG[0] + 3.5} y={OFF_DIAG[1] + 1} fontSize="3.4" fill="#b45309">조합 이상 — 미탐!</text>
            )}

            {/* extreme 이상점 */}
            <circle cx={EXTREME[0]} cy={EXTREME[1]} r="2.2" fill="#ef4444" stroke="#b91c1c" strokeWidth="0.5" />

            {/* ops 모드: 알림 표시 */}
            {mode === 'ops' && (
              <g>
                <circle cx={EXTREME[0]} cy={EXTREME[1]} r="4.5" fill="none" stroke="#ef4444" strokeWidth="0.7" />
                <circle cx={OFF_DIAG[0]} cy={OFF_DIAG[1]} r="4.5" fill="none" stroke="#f59e0b" strokeWidth="0.7" />
                <text x={EXTREME[0] - 26} y={EXTREME[1] - 5} fontSize="3.6" fill="#dc2626" fontWeight="bold">score -0.71 → 알림 #1</text>
                <text x={OFF_DIAG[0] + 3} y={OFF_DIAG[1] - 5} fontSize="3.6" fill="#b45309" fontWeight="bold">score -0.58 → 알림 #2</text>
              </g>
            )}
          </svg>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경로 길이 게이지 — 정상 12번 vs 이상 3번 (iforest 전용)
    // ─────────────────────────────────────────────────────
    function PathGauge({ splitCount }) {
      const rows = [
        { name: '🔴 외딴 이상점', len: 3, max: 14, color: 'bg-red-500', note: 'score_samples ↓ (매우 이상)' },
        { name: '🟣 클러스터 정상점', len: 12, max: 14, color: 'bg-violet-500', note: 'score_samples ↑ (정상)' },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1.5">📏 평균 경로 길이(분할 횟수) = 이상 점수의 원천</div>
          {rows.map((r) => (
            <div key={r.name} className="mb-1.5">
              <div className="flex justify-between text-[10px] text-slate-700">
                <span>{r.name}</span>
                <span className="font-mono font-bold">{r.len}번</span>
              </div>
              <div className="h-2 rounded-full bg-violet-100 overflow-hidden">
                <div className={`h-full ${r.color} transition-all duration-700`} style={{ width: `${(r.len / r.max) * 100}%` }} />
              </div>
              <div className="text-[9px] text-slate-500">{r.note}</div>
            </div>
          ))}
          <div className="text-[10px] text-violet-900 mt-1">
            분할 {splitCount}/3 진행 중 — 짧은 경로 = 쉽게 고립 = 이상. 트리 200그루의 평균이라 우연이 상쇄된다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — nu 트레이드오프 미니 표
    // ─────────────────────────────────────────────────────
    function NuBox() {
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1.5">🎛 nu — "훈련 데이터 몇 %까지 경계 밖에 둘까"</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-violet-900 border-b border-violet-200">
                <th className="text-left py-0.5">nu</th>
                <th className="text-left py-0.5 pl-2">경계</th>
                <th className="text-left py-0.5 pl-2">탐지</th>
                <th className="text-left py-0.5 pl-2">오탐</th>
              </tr>
            </thead>
            <tbody>
              <tr className="border-t border-violet-100">
                <td className="py-1 font-mono font-bold">0.01</td>
                <td className="py-1 pl-2">여유 있게 감쌈 (실선)</td>
                <td className="py-1 pl-2 text-amber-700">미탐 위험</td>
                <td className="py-1 pl-2 text-emerald-700">적음</td>
              </tr>
              <tr className="border-t border-violet-100">
                <td className="py-1 font-mono font-bold">0.1</td>
                <td className="py-1 pl-2">바짝 조임 (점선)</td>
                <td className="py-1 pl-2 text-emerald-700">민감</td>
                <td className="py-1 pl-2 text-red-700">폭증</td>
              </tr>
            </tbody>
          </table>
          <div className="mt-1 text-[10px] text-slate-600">RBF 커널이라 경계가 곡선 — 구부러진 정상 영역도 감싼다. 단 스케일링 필수, 학습은 O(n²)급.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 알림 큐 / 임계값 운영 박스
    // ─────────────────────────────────────────────────────
    function OpsBox() {
      const rows = [
        { th: '상위 0.5% (5,000건/일)', fatigue: '🔥 조사팀 마비 — 전부 무시', catch: '의미 없음' },
        { th: '상위 50건/일 (예산 기준)', fatigue: '✅ 전건 검토 가능', catch: 'precision@50 추적' },
        { th: '상위 5건/일', fatigue: '여유', catch: '미탐 다수 — 너무 보수적' },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1.5">📮 임계값 = 모델 지표가 아니라 운영 결정</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-violet-900 border-b border-violet-200">
                <th className="text-left py-0.5">임계값</th>
                <th className="text-left py-0.5 pl-2">알림 피로도</th>
                <th className="text-left py-0.5 pl-2">평가</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.th} className="border-t border-violet-100">
                  <td className="py-1">{r.th}</td>
                  <td className="py-1 pl-2">{r.fatigue}</td>
                  <td className="py-1 pl-2">{r.catch}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-slate-600">
            라벨 없는 평가: 상위 N건 검토 → precision@N / 사후 확인 사기의 점수 순위 역검증 / 점수 분포 drift 감시.
            밀도가 지역마다 다르면 LOF(주변 대비 밀도)도 후보.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 이상 탐지 시뮬레이션 (violet 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      problem: { icon: '💳', label: '문제 정의' },
      stats:   { icon: '📐', label: '단변량 통계' },
      iforest: { icon: '🌲', label: 'Isolation Forest' },
      ocsvm:   { icon: '🫧', label: 'One-Class SVM' },
      ops:     { icon: '🚨', label: '운영 파이프라인' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.problem;
      const mode = state.viz.mode;

      // Isolation Forest 분할 애니메이션 — 0 → 3 반복 (900ms 간격)
      const [splitCount, setSplitCount] = useState(0);
      useEffect(() => {
        if (mode !== 'iforest') return;
        setSplitCount(0);
        const t = setInterval(() => {
          setSplitCount((c) => (c >= 3 ? 0 : c + 1));
        }, 900);
        return () => clearInterval(t);
      }, [mode]);

      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>거래 모니터 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            탐지기: {state.engineDetail}
          </div>

          {mode === 'table' ? <TxTablePane /> : <ScatterViz mode={mode} splitCount={splitCount} />}
          {mode === 'iforest' && <PathGauge splitCount={splitCount} />}
          {mode === 'ocsvm' && <NuBox />}
          {mode === 'ops' && <OpsBox />}
          {mode === 'stats' && (
            <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5 text-[10px] text-amber-900">
              <b>사각지대 재현</b> — 주황 점: x축 투영도 정상 범위 ✓, y축 투영도 정상 범위 ✓.
              그러나 클러스터의 상관 패턴(금액↑ ↔ 사용 기간↑)에서 완전히 이탈.
              "나이 20 · 연봉 5억"처럼 <b>조합</b>이 이상한 케이스는 단변량 통계가 구조적으로 못 잡는다.
            </div>
          )}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 동기 호출 — 렌더 시점에 항상 현재 단계 코드가 하이라이트됨
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">III-2-2. 이상 탐지 — Isolation Forest·OC-SVM</h1>
                <p className="text-sm text-violet-800/80">라벨 없는 사기 거래 찾기 — "정상"을 배우면 "이상"이 보인다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                이상 탐지는 희소하고 계속 변하는 "이상"을 배우는 대신 "정상"을 모델링해서 이탈을 잡는다.
                단변량 통계(z-score·IQR)는 변수 조합의 이상을 못 잡고,
                Isolation Forest는 "무작위 분할에서 경로 길이가 짧으면 이상"이라는 원리로 대규모에 강하며,
                One-Class SVM은 정상 영역을 감싸는 정밀한 경계를 nu로 조절한다.
                운영에서는 contamination 비율 강제 대신 연속 점수 + 조사팀 예산 기반 임계값을 쓰고,
                precision@N·사후 역검증·점수 drift로 라벨 없이 평가한다 —
                카드 사기, 서버 메트릭 이상(observability), 제조 불량 검출이 전부 이 패턴이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['이상탐지', 'z-score', 'IQR', 'IsolationForest', '경로길이', 'contamination', 'OneClassSVM', 'nu', '알림피로도', 'LOF', 'precision@N'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./III-2-1.html" className="underline hover:no-underline">← 이전: III-2-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
