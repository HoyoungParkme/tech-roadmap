    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    ML III-1-2 — DBSCAN — 밀도 기반 군집
    5단계: K-means 실패 재현 → 밀도 발상(eps/minPts, core/border/noise) → DBSCAN 확산
           → k-distance로 eps 고르기 → K-means vs DBSCAN 선택 기준 (+HDBSCAN)
    패턴: fastapi v1 — 좌(LiveDataPane: JS로 진짜 계산한 산점도) / 우(CodeViewer: dbscan_demo.py)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 데이터 생성 — 결정적(deterministic) two moons + 노이즈 6점
    //   시연용이지만 아래 K-means / DBSCAN 은 전부 진짜로 계산한다.
    // ─────────────────────────────────────────────────────
    const jr = (i) => {
      const s = Math.sin((i + 1) * 127.1) * 43758.5453;
      return (s - Math.floor(s)) - 0.5; // -0.5 ~ 0.5
    };

    const POINTS = (() => {
      const pts = [];
      const N = 40;
      for (let i = 0; i < N; i++) {
        const t = (Math.PI * i) / (N - 1);
        pts.push({ x: Math.cos(t) + jr(i) * 0.18, y: Math.sin(t) + jr(i + 100) * 0.18 });
      }
      for (let i = 0; i < N; i++) {
        const t = (Math.PI * i) / (N - 1);
        pts.push({ x: 1 - Math.cos(t) + jr(i + 200) * 0.18, y: 0.5 - Math.sin(t) + jr(i + 300) * 0.18 });
      }
      // 진짜 이상치 6점 — 어느 초승달에도 속하지 않는다
      [[-1.3, 1.25], [2.3, 1.05], [0.5, 1.5], [-1.25, -0.65], [2.25, -0.75], [0.5, -0.95]]
        .forEach(([x, y]) => pts.push({ x, y }));
      return pts;
    })();

    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    // K-means (Lloyd, k=2, 결정적 초기화) — 실제로 돌려서 실패를 "재현"한다
    function kmeans(points, iters = 12) {
      let c = [{ x: -1, y: 0.5 }, { x: 2, y: 0 }];
      let labels = points.map(() => 0);
      for (let it = 0; it < iters; it++) {
        labels = points.map((p) => (dist(p, c[0]) <= dist(p, c[1]) ? 0 : 1));
        c = [0, 1].map((k) => {
          const grp = points.filter((_, i) => labels[i] === k);
          if (!grp.length) return c[k];
          return {
            x: grp.reduce((s, p) => s + p.x, 0) / grp.length,
            y: grp.reduce((s, p) => s + p.y, 0) / grp.length,
          };
        });
      }
      return { labels, centroids: c };
    }

    // DBSCAN — labels(-1=noise), kind(core/border/noise), BFS 방문 순서(order)
    function dbscan(points, eps, minPts) {
      const n = points.length;
      const nbrs = points.map((p) => {
        const arr = [];
        points.forEach((q, j) => { if (dist(p, q) <= eps) arr.push(j); });
        return arr; // 자기 자신 포함 — sklearn min_samples 와 동일 규약
      });
      const isCore = nbrs.map((a) => a.length >= minPts);
      const labels = new Array(n).fill(-1);
      const order = [];
      let cid = -1;
      for (let i = 0; i < n; i++) {
        if (labels[i] !== -1 || !isCore[i]) continue;
        cid += 1;
        const queue = [i];
        labels[i] = cid;
        while (queue.length) {
          const cur = queue.shift();
          order.push(cur);
          if (!isCore[cur]) continue; // border 는 흡수만 되고 확장하지 않는다
          nbrs[cur].forEach((j) => {
            if (labels[j] === -1) {
              labels[j] = cid;
              queue.push(j);
            }
          });
        }
      }
      const kind = labels.map((l, i) => (l === -1 ? 'noise' : isCore[i] ? 'core' : 'border'));
      return { labels, kind, order, nClusters: cid + 1, nNoise: labels.filter((l) => l === -1).length };
    }

    // k-distance — 각 점의 k번째 최근접 이웃 거리(자기 제외), 오름차순 정렬
    function kDistance(points, k) {
      return points
        .map((p) => points.map((q) => dist(p, q)).sort((a, b) => a - b)[k])
        .sort((a, b) => a - b);
    }

    // 전 단계 공용 계산 결과 (모듈 로드 시 1회)
    const EPS = 0.25, MINPTS = 4;
    const KM = kmeans(POINTS);
    const DB = dbscan(POINTS, EPS, MINPTS);
    const DB_SMALL = dbscan(POINTS, 0.1, MINPTS);   // eps 너무 작음
    const DB_BIG = dbscan(POINTS, 0.9, MINPTS);     // eps 너무 큼
    const KDIST = kDistance(POINTS, MINPTS - 1);    // min_samples-1 번째 이웃 거리

    // 데이터 좌표 → SVG 좌표
    const W = 340, H = 232;
    const sx = (x) => ((x + 1.55) / 4.1) * W;
    const sy = (y) => H - ((y + 1.15) / 2.95) * H;

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },

    // 산점도 색상 팔레트
    const CLUSTER_FILL = ['#10b981', '#0ea5e9', '#a855f7', '#f59e0b']; // emerald/sky/purple/amber
    const KM_FILL = ['#0ea5e9', '#f59e0b'];
    const NOISE_FILL = '#ef4444';

    // 점 하나 (noise 는 ✕ 모양으로 구분 — 색약 대응)
    function Dot({ p, fill, noise, dim, r = 4 }) {
      const cx = sx(p.x), cy = sy(p.y);
      if (noise) {
        return (
          <g opacity={dim ? 0.15 : 1}>
            <line x1={cx - 3.5} y1={cy - 3.5} x2={cx + 3.5} y2={cy + 3.5} stroke={NOISE_FILL} strokeWidth="2" />
            <line x1={cx - 3.5} y1={cy + 3.5} x2={cx + 3.5} y2={cy - 3.5} stroke={NOISE_FILL} strokeWidth="2" />
          </g>
        );
      }
      return <circle cx={cx} cy={cy} r={r} fill={fill} opacity={dim ? 0.15 : 0.9} stroke="#ffffff" strokeWidth="0.8" />;
    }

    // ─────────────────────────────────────────────────────
    // 산점도 패널들 (단계별)
    // ─────────────────────────────────────────────────────
    function KmeansPlot() {
      const [c0, c1] = KM.centroids;
      // 수직이등분선: 두 중심의 중점 통과, 방향은 중심 연결선에 수직
      const mx = (c0.x + c1.x) / 2, my = (c0.y + c1.y) / 2;
      const dx = c1.x - c0.x, dy = c1.y - c0.y;
      const L = 3.2;
      const nx = -dy / Math.hypot(dx, dy), ny = dx / Math.hypot(dx, dy);
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full rounded border border-slate-300 bg-white" role="img" aria-label="K-means가 초승달 데이터를 수직이등분선으로 반 토막 내는 산점도">
          <line x1={sx(mx - nx * L)} y1={sy(my - ny * L)} x2={sx(mx + nx * L)} y2={sy(my + ny * L)} stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="5 4" />
          {POINTS.map((p, i) => <Dot key={i} p={p} fill={KM_FILL[KM.labels[i]]} />)}
          {KM.centroids.map((c, i) => (
            <g key={i}>
              <line x1={sx(c.x) - 6} y1={sy(c.y) - 6} x2={sx(c.x) + 6} y2={sy(c.y) + 6} stroke="#1e293b" strokeWidth="3" />
              <line x1={sx(c.x) - 6} y1={sy(c.y) + 6} x2={sx(c.x) + 6} y2={sy(c.y) - 6} stroke="#1e293b" strokeWidth="3" />
            </g>
          ))}
          <text x={sx(mx) + 8} y={18} fontSize="9" fill="#64748b">← 경계 = 두 중심의 수직이등분선</text>
        </svg>
      );
    }

    function DensityPlot() {
      const kindFill = { core: '#7c3aed', border: '#c4b5fd', noise: NOISE_FILL };
      // eps 원을 보여줄 대표 점: core 1 / border 1 / noise 1 (실제 분류에서 선택)
      const sampleIdx = ['core', 'border', 'noise'].map((k) => DB.kind.findIndex((x) => x === k)).filter((i) => i >= 0);
      const rPx = (EPS / 4.1) * W; // eps 를 SVG 반지름으로 (x축 스케일 기준)
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full rounded border border-slate-300 bg-white" role="img" aria-label="eps 반경과 minPts로 core, border, noise를 분류한 산점도">
          {sampleIdx.map((i) => (
            <circle key={`c${i}`} cx={sx(POINTS[i].x)} cy={sy(POINTS[i].y)} r={rPx} fill="#7c3aed" fillOpacity="0.07" stroke="#7c3aed" strokeWidth="1" strokeDasharray="3 3" />
          ))}
          {POINTS.map((p, i) => <Dot key={i} p={p} noise={DB.kind[i] === 'noise'} fill={kindFill[DB.kind[i]]} />)}
          <text x={6} y={14} fontSize="9" fill="#7c3aed">점선 원 = eps(0.25) 반경 — 이 안의 이웃 수를 센다</text>
        </svg>
      );
    }

    // Step 3 — BFS 방문 순서대로 물드는 애니메이션
    function DbscanPlot() {
      const [reveal, setReveal] = useState(0);
      useEffect(() => {
        setReveal(0);
        const t = setInterval(() => {
          setReveal((r) => {
            if (r >= DB.order.length) { clearInterval(t); return r; }
            return r + 3;
          });
        }, 60);
        return () => clearInterval(t);
      }, []);
      const revealed = new Set(DB.order.slice(0, reveal));
      const done = reveal >= DB.order.length;
      return (
        <div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full rounded border border-slate-300 bg-white" role="img" aria-label="core 점에서 밀도 연결로 클러스터가 번져나가는 DBSCAN 애니메이션">
            {POINTS.map((p, i) => {
              const isNoise = DB.labels[i] === -1;
              if (isNoise) return <Dot key={i} p={p} noise dim={!done} />;
              const on = revealed.has(i);
              return <Dot key={i} p={p} fill={on ? CLUSTER_FILL[DB.labels[i]] : '#d6d3cb'} dim={false} r={on && DB.kind[i] === 'core' ? 4.5 : 3.5} />;
            })}
            <text x={6} y={14} fontSize="9" fill="#57534a">
              {done ? `확산 완료 — 클러스터 ${DB.nClusters}개 + noise ${DB.nNoise}점` : 'core에서 eps 이웃으로 번지는 중… (BFS 방문 순서)'}
            </text>
          </svg>
          <button
            onClick={() => { setReveal(0); const t = setInterval(() => setReveal((r) => { if (r >= DB.order.length) { clearInterval(t); return r; } return r + 3; }), 60); }}
            className="mt-1.5 text-[10px] px-2 py-0.5 rounded border border-violet-400 text-violet-800 bg-white hover:bg-violet-50"
          >▶ 확산 애니메이션 다시 재생</button>
        </div>
      );
    }

    function MiniPlot({ result, caption, tone }) {
      return (
        <div className="flex-1 min-w-0">
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full rounded border border-slate-300 bg-white" role="img" aria-label={caption}>
            {POINTS.map((p, i) => (
              <Dot key={i} p={p} noise={result.labels[i] === -1} fill={CLUSTER_FILL[result.labels[i] % CLUSTER_FILL.length]} r={3} />
            ))}
          </svg>
          <div className={`text-[9px] mt-0.5 text-center font-bold ${tone}`}>{caption}</div>
        </div>
      );
    }

    function KDistChart() {
      const cw = 340, ch = 110, pad = 24;
      const maxD = Math.max(...KDIST);
      const px = (i) => pad + (i / (KDIST.length - 1)) * (cw - pad - 6);
      const py = (d) => ch - 14 - (d / maxD) * (ch - 26);
      const pathD = KDIST.map((d, i) => `${i === 0 ? 'M' : 'L'}${px(i).toFixed(1)},${py(d).toFixed(1)}`).join(' ');
      return (
        <svg viewBox={`0 0 ${cw} ${ch}`} className="w-full rounded border border-slate-300 bg-white" role="img" aria-label="정렬된 k-distance 곡선과 elbow 지점에서 eps를 고르는 그래프">
          <line x1={pad} y1={py(EPS)} x2={cw - 6} y2={py(EPS)} stroke="#ef4444" strokeWidth="1" strokeDasharray="4 3" />
          <path d={pathD} fill="none" stroke="#7c3aed" strokeWidth="2" />
          <text x={pad} y={py(EPS) - 3} fontSize="8" fill="#ef4444">elbow ≈ eps 0.25</text>
          <text x={pad} y={ch - 3} fontSize="8" fill="#8a8578">점 인덱스 (3번째 이웃 거리 오름차순)</text>
          <text x={cw - 118} y={16} fontSize="8" fill="#8a8578">꺾인 뒤 꼬리 = 이상치들의 이웃 거리</text>
        </svg>
      );
    }

    function ComparePlot() {
      return (
        <div className="flex gap-2">
          <MiniPlot result={{ labels: KM.labels.map((l) => l) }} caption="K-means — 반 토막 💥" tone="text-amber-700" />
          <MiniPlot result={DB} caption="DBSCAN — 모양 그대로 + noise ✓" tone="text-emerald-700" />
        </div>
      );
    }

    // 비교표 (Step 5)
    function CompareBox({ box }) {
      if (!box) return null;
      const mark = (v) => (
        <span className={`font-bold ${v.startsWith('◎') ? 'text-emerald-700' : v.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{v}</span>
      );
      return (
        <div className="mt-3 rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-3">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xl">⚖️</span>
            <span className="text-sm font-bold text-violet-900">{box.title}</span>
          </div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-violet-900 border-b-2 border-violet-300">
                <th className="text-left py-1">상황</th>
                <th className="text-left py-1 pl-2 w-24">K-means</th>
                <th className="text-left py-1 pl-2 w-24">DBSCAN</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.crit} className="border-t border-violet-200">
                  <td className="py-1 text-slate-800">{r.crit}</td>
                  <td className="py-1 pl-2">{mark(r.km)}</td>
                  <td className="py-1 pl-2">{mark(r.db)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-violet-900">마지막 행이 DBSCAN의 아킬레스건 — 밀도 편차가 크면 HDBSCAN(eps 없음, min_cluster_size만)으로.</div>
        </div>
      );
    }

    // 경고/알림 박스
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 군집 실험실 (violet 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      kmeans:  { icon: '📐', label: 'K-means 실패 재현' },
      density: { icon: '🔍', label: '밀도로 점 분류' },
      dbscan:  { icon: '🔥', label: 'DBSCAN 확산' },
      params:  { icon: '🎛', label: 'eps 튜닝 실험' },
      compare: { icon: '⚖️', label: '나란히 비교' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = MODE_BADGE[state.mode];
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>군집 실험실 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">two moons 80점 + 이상치 6점</span>
          </div>

          {/* 단계별 플롯 (같은 데이터, 같은 계산 결과를 다른 관점으로) */}
          {state.mode === 'kmeans' && <KmeansPlot />}
          {state.mode === 'density' && <DensityPlot />}
          {state.mode === 'dbscan' && <DbscanPlot />}
          {state.mode === 'params' && (
            <div>
              <div className="flex gap-2">
                <MiniPlot result={DB_SMALL} caption="eps=0.10 — 거의 전부 noise" tone="text-red-700" />
                <MiniPlot result={DB} caption="eps=0.25 — 적정 ✓" tone="text-emerald-700" />
                <MiniPlot result={DB_BIG} caption="eps=0.90 — 한 덩어리" tone="text-amber-700" />
              </div>
              <div className="mt-2 text-[10px] font-bold text-violet-900">k-distance 그래프 — eps를 고르는 눈금자</div>
              <KDistChart />
            </div>
          )}
          {state.mode === 'compare' && <ComparePlot />}

          {/* 범례 */}
          <div className="mt-2 flex flex-wrap gap-x-3 gap-y-1">
            {state.legend.map((l) => (
              <span key={l.label} className="inline-flex items-center gap-1 text-[10px] text-slate-700">
                <span className={`w-2.5 h-2.5 rounded-full inline-block ${l.swatch}`}></span>
                {l.label}
              </span>
            ))}
          </div>

          {/* 핵심 지표 */}
          <div className="mt-3 rounded-lg border-2 border-violet-300 bg-violet-50 p-2.5">
            <div className="text-[11px] font-bold text-violet-900 mb-1">📋 이 단계의 핵심 지표</div>
            <table className="w-full text-[10px]">
              <tbody>
                {state.metrics.map((m) => (
                  <tr key={m.k} className="border-t border-violet-200 first:border-t-0">
                    <td className="py-0.5 pr-2 text-violet-900 font-bold whitespace-nowrap">{m.k}</td>
                    <td className="py-0.5 text-slate-700">{m.v}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <CompareBox box={state.compareBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">III-1-2. DBSCAN — 밀도 기반 군집</h1>
                <p className="text-sm text-violet-800/80">도넛 모양 데이터에서 K-means가 무너질 때 — "밀도"로 다시 정의하는 클러스터</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                DBSCAN은 클러스터를 "중심까지 가까운 점들"이 아니라 "밀도 연결로 이어진 빽빽한 영역"으로 다시 정의한다.
                eps 반경과 minPts로 core/border/noise를 나누고, core에서 산불처럼 번져 임의 모양의 클러스터를 개수 지정 없이 찾아내며,
                어디에도 흡수되지 않은 noise는 공짜 이상치 탐지가 된다. eps는 감이 아니라 k-distance 그래프의 팔꿈치로 고르고,
                클러스터마다 밀도가 다른 데이터는 DBSCAN의 약점이므로 HDBSCAN을 꺼낸다.
                볼록한 덩어리 + 개수를 아는 문제는 여전히 K-means가 빠르고 안정적이다 — 데이터 모양이 알고리즘을 고른다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['DBSCAN', '밀도기반군집', 'eps', 'minPts', 'core', 'border', 'noise', 'k-distance', 'HDBSCAN', 'two-moons'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./III-1-1.html" className="underline hover:no-underline">← 이전: III-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./III-2-1.html" className="underline hover:no-underline">다음: III-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
