              → PCA의 한계(비선형 구조 붕괴) → t-SNE/UMAP(이웃 확률 보존) → 실무 선택표까지
              5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 2D 타원 사영 애니메이션·스크리 플롯·스위스롤 비교) /
          우(VSCode CodeViewer: dim_reduction_demo.py 진화)
    색상: violet (ml 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 좌측 시각화용 데이터 (결정적 의사난수 — 매 렌더 동일)
    // ─────────────────────────────────────────────────────
    const jitter = (i, k) => Math.sin(i * 12.9898 + k * 78.233) * 0.5; // -0.5~0.5 결정적 노이즈

    // 2D 타원형 데이터 (상관 있는 키·몸무게 느낌) — 30도 회전한 타원
    const ELLIPSE_POINTS = (() => {
      const pts = [];
      const cos = Math.cos(Math.PI / 6), sin = Math.sin(Math.PI / 6);
      for (let i = 0; i < 26; i++) {
        const t = (i / 26) * Math.PI * 2;
        const a = 42 * Math.cos(t) + jitter(i, 1) * 14;   // 장축 방향 (분산 큼)
        const b = 13 * Math.sin(t) + jitter(i, 2) * 8;    // 단축 방향 (분산 작음)
        pts.push({ x: a * cos - b * sin, y: a * sin + b * cos, u: a }); // u = PC1 좌표
      }
      return pts;
    })();

    // 스위스롤(2D 나선) — t 순서가 "진짜 이웃" 관계
    const SPIRAL_POINTS = (() => {
      const pts = [];
      for (let i = 0; i < 34; i++) {
        const t = 1.2 + (i / 33) * 2.4 * Math.PI;
        pts.push({ x: t * Math.cos(t) * 6.2, y: t * Math.sin(t) * 6.2, frac: i / 33 });
      }
      return pts;
    })();
    const spiralColor = (frac) => `hsl(${Math.round(265 - frac * 205)}, 78%, 52%)`; // 보라→주황 그라데이션

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    //   pane: 좌측 LiveDataPane 모드 { mode, ... }
    //   code: 우측 CodeViewer (dim_reduction_demo.py 진화)
    // ─────────────────────────────────────────────────────

      {
        title: 'Step 2. PCA의 원리 — 분산이 최대인 방향을 새 축으로',

        pane: {

            <SpiralPanel title="원본 (나선)" mode="spiral" tone="neutral" />
            <SpiralPanel title={step4 ? 'PCA — 색 뒤섞임' : 'PCA 사영 — 실패'} mode="pcafail" tone="bad" />
            {step4 && <SpiralPanel title="t-SNE/UMAP — 펴짐" mode="unrolled" tone="good" />}
          </div>
          {!step4 && (
            <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-2.5 text-[10px] text-red-900">
              <div className="font-bold mb-1">왜 실패하는가</div>
              PCA의 질문은 "어느 <b>직선</b> 방향이 분산이 큰가"다. 나선의 안쪽 보라와 바깥쪽 주황은
              유클리드 거리로는 가깝지만, 말린 종이 위 거리로는 한 바퀴 차이 — 직선 자로 누르면
              이 둘이 같은 자리에 겹친다. 필요한 건 "누가 누구의 진짜 이웃인가"를 지키는 도구다.
            </div>
          )}
          {step4 && (
            <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-violet-900 mb-1.5">🎛 파라미터 감각 — perplexity / n_neighbors</div>
              <div className="grid grid-cols-2 gap-2 text-[10px]">
                <div className="rounded border border-violet-200 bg-violet-50 p-1.5">
                  <div className="font-bold text-violet-900">작게 (5~10)</div>
                  <div className="text-slate-700 mt-0.5">국소 디테일 극대화 — 작은 군집이 잘게 쪼개져 보임 (과해석 위험)</div>
                </div>
                <div className="rounded border border-violet-200 bg-violet-50 p-1.5">
                  <div className="font-bold text-violet-900">크게 (30~100)</div>
                  <div className="text-slate-700 mt-0.5">전역 구조 위주 — 큰 그림은 안정, 미세 구조는 뭉개짐</div>
                </div>
              </div>
              <div className="mt-1.5 text-[10px] text-slate-600">
                한 값만 보고 결론 내리지 말 것 — 여러 값을 돌려 <b>공통으로 남는 구조</b>만 믿는다.
                UMAP은 t-SNE보다 수십 배 빠르고(k-이웃 그래프 최적화) 군집 간 상대 배치도 비교적 보존한다.
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 선택표
    // ─────────────────────────────────────────────────────
    function ChoiceTable({ pane }) {
      return (
        <div>
          <div className="rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-xl">⚖️</span>
              <span className="text-sm font-bold text-violet-900">PCA vs t-SNE/UMAP — 선택 기준표</span>
            </div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-violet-900 border-b-2 border-violet-300">
                  <th className="text-left py-1">상황</th>
                  <th className="text-left py-1 pl-2 w-24">PCA</th>
                  <th className="text-left py-1 pl-2 w-28">t-SNE / UMAP</th>
                </tr>
              </thead>
              <tbody>
                {pane.rows.map((r) => (
                  <tr key={r.crit} className="border-t border-violet-200">
                    <td className="py-1 text-slate-800">{r.crit}</td>
                    <td className={`py-1 pl-2 font-bold ${r.pca.startsWith('◎') ? 'text-emerald-700' : r.pca.startsWith('✗') ? 'text-red-700' : 'text-slate-600'}`}>{r.pca}</td>
                    <td className={`py-1 pl-2 font-bold ${r.tu.startsWith('◎') ? 'text-emerald-700' : r.tu.startsWith('✗') ? 'text-red-700' : 'text-slate-600'}`}>{r.tu}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-violet-900 mb-1.5">🗺 실무 최빈 파이프라인 — 임베딩 시각화</div>
            <div className="flex items-center gap-1.5 text-[10px] flex-wrap">
              {['문장/이미지 임베딩 (384D)', 'UMAP fit_transform', '2D 산점도 (카테고리 색)'].map((s, i) => (
                <React.Fragment key={s}>
                  {i > 0 && <span className="text-violet-400 font-bold">→</span>}
                  <span className="px-2 py-1 rounded border border-violet-300 bg-violet-50 text-violet-900 font-bold">{s}</span>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-1.5 text-[10px] text-slate-600">
              vector-db 주제에서 다룬 임베딩 검색의 품질 디버깅도 이 지도로 시작한다 —
              같은 카테고리가 뭉치면 임베딩이 의미를 잡은 것, 엉뚱한 섬은 라벨 오류·신규 토픽 신호다.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 모드 스위칭 (violet 톤)
    // ─────────────────────────────────────────────────────
    const MODE_BADGE = {
      curse:    { icon: '📏', label: '차원의 저주' },
      pca:      { icon: '🎯', label: 'PCA — 최대 분산 사영' },
      nonlinear:{ icon: '🌀', label: 'PCA의 한계' },
      neighbor: { icon: '🕸', label: '이웃 보존 — t-SNE/UMAP' },
      table:    { icon: '⚖️', label: '실무 선택' },
    };

    function LiveDataPane({ pane, stepIdx }) {
      const badge = MODE_BADGE[pane.mode] || MODE_BADGE.curse;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2.5">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>{badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">100D → 2D lab</span>
          </div>
          {pane.mode === 'curse' && <CurseView pane={pane} />}
          {pane.mode === 'pca' && <PcaView pane={pane} />}
          {pane.mode === 'nonlinear' && <NonlinearView step4={false} />}
          {pane.mode === 'neighbor' && <NonlinearView step4={true} />}
          {pane.mode === 'table' && <ChoiceTable pane={pane} />}
          <AlertBox alert={pane.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">III-2-1. 차원 축소 — PCA·t-SNE·UMAP</h1>
                <p className="text-sm text-violet-800/80">100차원 데이터를 2차원 종이에 그리는 세 가지 철학</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane pane={step.pane} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                고차원에서는 거리가 무의미해지고 눈으로 볼 수도 없다(차원의 저주).
                PCA는 "분산 최대 방향"을 새 축으로 삼는 선형 사영 — 결정적이고 재현 가능해서 전처리·압축(모델 입력)의 정답이지만,
                스위스롤 같은 비선형 구조는 눌러 뭉갠다.
                t-SNE/UMAP은 "이웃 확률"을 보존하는 비선형 배치라 탐색·시각화에 강하지만,
                군집 간 거리·크기는 믿으면 안 되고 좌표를 모델 피처로 쓰는 것도 비권장이다.
                실무 최빈 조합은 "고차원 임베딩 → UMAP → 산점도" — vector-db 검색 품질 디버깅의 첫 도구다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['차원의저주', 'PCA', '주성분', 'explained variance', '스크리플롯', '스위스롤', 't-SNE', 'perplexity', 'UMAP', 'n_neighbors', '임베딩시각화'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./III-1-2.html" className="underline hover:no-underline">← 이전: III-1-2</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
