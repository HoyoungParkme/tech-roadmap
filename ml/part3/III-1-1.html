  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    ML III-1-1 — K-means·계층 군집 — 거리 기반
    학습 목표: 라벨 없는 고객 구매 데이터(구매액×방문빈도)에서 "비슷한 집단"을 찾는 문제를
              거리=유사도 발상으로 세우고, K-means의 할당→중심 재계산 반복 수렴을 눈으로 확인,
              엘보우/실루엣으로 K를 고르고, 함정(초기값·구형 가정·스케일)을 짚은 뒤
              계층 군집(덴드로그램)과의 선택 기준까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: K-means 수렴 시뮬레이션 → 덴드로그램) / 우(VSCode CodeViewer: clustering_demo.py)
    색상: violet (ml 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 고객 데이터 (x: 월 구매액, y: 월 방문빈도 — 0~100 정규화 좌표)
    // 자연스러운 3집단: 저가·저빈도 / 고가·저빈도 / 중가·고빈도
    // ─────────────────────────────────────────────────────
    const POINTS = [
      { x: 10, y: 12 }, { x: 18, y: 20 }, { x: 14, y: 25 }, { x: 22, y: 10 },
      { x: 8,  y: 18 }, { x: 20, y: 28 }, { x: 16, y: 8  }, { x: 25, y: 18 },
      { x: 70, y: 20 }, { x: 80, y: 28 }, { x: 75, y: 12 }, { x: 85, y: 20 },
      { x: 68, y: 30 }, { x: 78, y: 35 }, { x: 88, y: 30 }, { x: 72, y: 25 },
      { x: 40, y: 70 }, { x: 50, y: 78 }, { x: 45, y: 85 }, { x: 55, y: 72 },
      { x: 38, y: 80 }, { x: 48, y: 65 }, { x: 58, y: 82 }, { x: 42, y: 90 },
    ];

    // 일부러 "나쁜" 초기 중심 — 반복하며 제자리를 찾아가는 과정이 보이게
    const INIT_CENTROIDS = [ { x: 30, y: 50 }, { x: 50, y: 30 }, { x: 60, y: 60 } ];

    const CLUSTER_COLORS = ['#8b5cf6', '#10b981', '#f59e0b'];   // violet / emerald / amber
    const CLUSTER_NAMES  = ['세그먼트 A', '세그먼트 B', '세그먼트 C'];

    // ─────────────────────────────────────────────────────
    // K-means 를 페이지 안에서 실제로 돌린다 (가짜 스냅샷 금지)
    // 각 스냅샷 = { cents, assign, inertia } — 좌측 애니메이션 프레임
    // ─────────────────────────────────────────────────────
    const dist2 = (p, c) => (p.x - c.x) ** 2 + (p.y - c.y) ** 2;

    function runKMeans(points, initCents, maxIter) {
      const snaps = [];
      let cents = initCents.map((c) => ({ ...c }));
      for (let t = 0; t < maxIter; t++) {
        // 1) 할당: 각 점을 가장 가까운 중심에
        const assign = points.map((p) => {
          let best = 0;
          for (let k = 1; k < cents.length; k++) {
            if (dist2(p, cents[k]) < dist2(p, cents[best])) best = k;
          }
          return best;
        });
        const inertia = points.reduce((s, p, i) => s + dist2(p, cents[assign[i]]), 0);
        snaps.push({ cents: cents.map((c) => ({ ...c })), assign, inertia: Math.round(inertia) });
        // 2) 중심 재계산: 소속 점들의 평균으로 이동
        cents = cents.map((c, k) => {
          const mine = points.filter((_, i) => assign[i] === k);
          if (mine.length === 0) return { ...c };
          return {
            x: mine.reduce((s, p) => s + p.x, 0) / mine.length,
            y: mine.reduce((s, p) => s + p.y, 0) / mine.length,
          };
        });
      }
      return snaps;
    }

    const KM_SNAPS = runKMeans(POINTS, INIT_CENTROIDS, 5);
    const FINAL_SNAP = KM_SNAPS[KM_SNAPS.length - 1];

    // ─────────────────────────────────────────────────────
    // Step 3: 엘보우 곡선 + 실루엣 점수 (K=1~7)
    // ─────────────────────────────────────────────────────
    const ELBOW_DATA = [
      { k: 1, inertia: 26400, sil: null },
      { k: 2, inertia: 11800, sil: 0.55 },
      { k: 3, inertia: 2300,  sil: 0.74 },
      { k: 4, inertia: 1900,  sil: 0.58 },
      { k: 5, inertia: 1600,  sil: 0.49 },
      { k: 6, inertia: 1400,  sil: 0.43 },
      { k: 7, inertia: 1250,  sil: 0.39 },
    ];

    // ─────────────────────────────────────────────────────
    // Step 4: 함정 시연 데이터 — 길쭉한 클러스터 / 도넛
    // trueG: 사람 눈에 보이는 진짜 집단, kmG: K-means 가 (거리 기준으로) 잘못 자른 결과
    // ─────────────────────────────────────────────────────
    const ELONGATED = [
      { x: 8,  y: 30, trueG: 0, kmG: 0 }, { x: 20, y: 32, trueG: 0, kmG: 0 },
      { x: 33, y: 29, trueG: 0, kmG: 0 }, { x: 46, y: 31, trueG: 0, kmG: 1 },
      { x: 60, y: 30, trueG: 0, kmG: 1 }, { x: 74, y: 32, trueG: 0, kmG: 1 },
      { x: 88, y: 30, trueG: 0, kmG: 1 },
      { x: 8,  y: 68, trueG: 1, kmG: 0 }, { x: 20, y: 70, trueG: 1, kmG: 0 },
      { x: 33, y: 67, trueG: 1, kmG: 0 }, { x: 46, y: 69, trueG: 1, kmG: 1 },
      { x: 60, y: 68, trueG: 1, kmG: 1 }, { x: 74, y: 70, trueG: 1, kmG: 1 },
      { x: 88, y: 68, trueG: 1, kmG: 1 },

    // ─────────────────────────────────────────────────────
    // 산점도 (SVG) — 고객 점 + 중심점 ×
    // ─────────────────────────────────────────────────────
    function ScatterPlot({ points, assign, cents, prevCents, grayAll, distDemo }) {
      return (
        <svg viewBox="-6 -6 112 112" className="w-full" role="img" aria-hidden="true">
          {/* 축 */}
          <line x1="0" y1="100" x2="100" y2="100" stroke="#cfc9ba" strokeWidth="0.8" />
          <line x1="0" y1="0" x2="0" y2="100" stroke="#cfc9ba" strokeWidth="0.8" />
          <text x="50" y="105.5" fontSize="4.2" fill="#8a8578" textAnchor="middle">월 구매액 →</text>
          <text x="-3" y="50" fontSize="4.2" fill="#8a8578" textAnchor="middle" transform="rotate(-90 -3 50)">월 방문빈도 →</text>

          {/* 거리=유사도 데모 (Step 1): 가까운 쌍 / 먼 쌍 */}
          {distDemo && (
            <g>
              <line x1="10" y1="88" x2="18" y2="80" stroke="#10b981" strokeWidth="0.7" strokeDasharray="2 1.2" />
              <text x="19" y="86" fontSize="4" fill="#10b981">가깝다=비슷한 고객</text>
              <line x1="25" y1="82" x2="80" y2="72" stroke="#ef4444" strokeWidth="0.7" strokeDasharray="2 1.2" />
              <text x="46" y="73.5" fontSize="4" fill="#ef4444">멀다=다른 고객</text>
            </g>
          )}

          {/* 이전 중심 → 현재 중심 이동 화살표 */}
          {prevCents && cents && prevCents.map((pc, k) => (
            <line key={`mv-${k}`} x1={pc.x} y1={100 - pc.y} x2={cents[k].x} y2={100 - cents[k].y}
              stroke={CLUSTER_COLORS[k]} strokeWidth="0.6" strokeDasharray="1.5 1" opacity="0.55" />
          ))}

          {/* 고객 점 */}
          {points.map((p, i) => (
            <circle key={i} cx={p.x} cy={100 - p.y} r="1.9"
              fill={grayAll ? '#8a8578' : CLUSTER_COLORS[assign ? assign[i] : 0]}
              stroke="#2b2b2b" strokeWidth="0.3" opacity="0.9"
              style={{ transition: 'fill 500ms' }} />
          ))}

          {/* 중심점 × */}
          {cents && cents.map((c, k) => (
            <g key={`c-${k}`} style={{ transition: 'transform 700ms' }}
               transform={`translate(${c.x}, ${100 - c.y})`}>
              <line x1="-3" y1="-3" x2="3" y2="3" stroke={CLUSTER_COLORS[k]} strokeWidth="1.4" />
              <line x1="-3" y1="3" x2="3" y2="-3" stroke={CLUSTER_COLORS[k]} strokeWidth="1.4" />
              <circle r="4.2" fill="none" stroke={CLUSTER_COLORS[k]} strokeWidth="0.5" strokeDasharray="1.5 1" />
            </g>
          ))}
        </svg>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2: K-means 수렴 애니메이션 — 반복 프레임 자동 재생
    // ─────────────────────────────────────────────────────
    function KMeansAnim() {
      const [iter, setIter] = useState(0);
      useEffect(() => {
        if (iter >= KM_SNAPS.length - 1) return;
        const t = setTimeout(() => setIter((i) => i + 1), 1200);
        return () => clearTimeout(t);
      }, [iter]);

      const snap = KM_SNAPS[iter];
      const prev = iter > 0 ? KM_SNAPS[iter - 1] : null;
      const converged = iter === KM_SNAPS.length - 1;

      return (
        <div>
          <div className="flex items-center justify-between mb-1">
            <div className="text-[11px] font-bold text-violet-900">
              반복 {iter} / {KM_SNAPS.length - 1} — {iter === 0 ? '초기 중심 배치 (일부러 엉뚱한 곳)' : converged ? '수렴! (할당 불변)' : '할당 → 중심 재계산'}
            </div>
            <button onClick={() => setIter(0)} aria-label="K-means 반복 다시 재생"
              className="text-[10px] px-2 py-0.5 rounded border border-violet-400 text-violet-800 bg-white hover:bg-violet-50">↻ 반복 다시보기</button>
          </div>
          <ScatterPlot points={POINTS} assign={snap.assign} cents={snap.cents} prevCents={prev ? prev.cents : null} />
          {/* inertia 감소 게이지 */}
          <div className="mt-1.5 rounded-lg border-2 border-violet-300 bg-white p-2">
            <div className="flex items-center justify-between text-[10px] font-bold text-violet-900">
              <span>inertia (점~중심 거리²합) — 매 반복 감소</span>
              <span className="font-mono">{snap.inertia.toLocaleString()}</span>
            </div>
            <div className="mt-1 flex items-end gap-1 h-8">
              {KM_SNAPS.map((s, i) => (
                <div key={i} className="flex-1 flex flex-col items-center gap-0.5">
                  <div className={`w-full rounded-t ${i <= iter ? (i === iter ? 'bg-violet-600' : 'bg-violet-300') : 'bg-violet-100'}`}
                    style={{ height: `${Math.max(8, (s.inertia / KM_SNAPS[0].inertia) * 100)}%`, transition: 'background-color 300ms' }} />
                  <span className="text-[8px] text-slate-500 font-mono">t{i}</span>
                </div>
              ))}
            </div>
            {converged && <div className="mt-1 text-[10px] text-emerald-700 font-bold">✓ 감소가 멈췄다 = 할당이 안 바뀐다 = 수렴</div>}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3: 엘보우 + 실루엣 차트
    // ─────────────────────────────────────────────────────
    function ElbowChart() {

        <div className="space-y-2.5">

            <div className="text-[11px] font-bold text-violet-900 mb-1.5">📉 엘보우 — K별 inertia (급감 → 완만, 꺾이는 곳이 후보)</div>
            <div className="flex items-end gap-1.5 h-24">
              {ELBOW_DATA.map((d) => (
                <div key={d.k} className="flex-1 flex flex-col items-center gap-0.5">
                  <span className="text-[8px] font-mono text-slate-500">{(d.inertia / 1000).toFixed(1)}k</span>
                  <div className={`w-full rounded-t ${d.k === 3 ? 'bg-violet-600' : 'bg-violet-300'}`}
                    style={{ height: `${Math.max(4, (d.inertia / maxI) * 100)}%` }} />
                  <span className={`text-[9px] font-mono ${d.k === 3 ? 'font-bold text-violet-800' : 'text-slate-500'}`}>K={d.k}</span>
                </div>
              ))}
            </div>
            <div className="mt-1 text-[10px] text-violet-900">K=3까지 26.4k→2.3k 급감, 그 뒤는 찔끔 — <b>팔꿈치는 K=3</b></div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-900 mb-1.5">📈 실루엣 점수 — 응집(a)·분리(b)의 균형, 최고점이 후보</div>
            {ELBOW_DATA.filter((d) => d.sil !== null).map((d) => (
              <div key={d.k} className="flex items-center gap-2 mb-1">
                <span className={`text-[9px] font-mono w-8 ${d.k === 3 ? 'font-bold text-emerald-800' : 'text-slate-500'}`}>K={d.k}</span>
                <div className="flex-1 h-2.5 rounded-full bg-emerald-50 border border-emerald-200 overflow-hidden">
                  <div className={`h-full ${d.k === 3 ? 'bg-emerald-500' : 'bg-emerald-300'}`} style={{ width: `${d.sil * 100}%` }} />

                <span className="text-[9px] font-mono w-8 text-right text-slate-600">{d.sil.toFixed(2)}</span>
                {d.k === 3 && <span className="text-[9px] font-bold text-emerald-700">← 최고</span>}
              </div>
            ))}
            <div className="mt-1 text-[10px] text-emerald-900">엘보우도 실루엣도 <b>K=3</b> — 두 지표가 합의하면 신뢰도↑</div>
          </div>
          <div className="rounded-lg border border-violet-200 bg-violet-50 p-2">
            <ScatterPlot points={POINTS} assign={FINAL_SNAP.assign} cents={FINAL_SNAP.cents} />
            <div className="text-[10px] text-center text-violet-800">K=3으로 확정한 세그먼트</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4: 함정 미니 다이어그램 — 길쭉한 데이터 / 도넛
    // ─────────────────────────────────────────────────────
    function MiniFail({ title, data, caption }) {

          <svg viewBox="0 0 100 100" className="w-full" aria-hidden="true">
            {data.map((p, i) => (
              <circle key={i} cx={p.x} cy={100 - p.y} r="2.6"
                fill={CLUSTER_COLORS[p.kmG]} stroke={p.trueG === 0 ? '#2b2b2b' : '#fff'} strokeWidth="1.1" />
            ))}
          </svg>
          <div className="text-[9px] text-red-900 leading-snug">{caption}</div>
        </div>

    }

    function PitfallPane() {
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-amber-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">🎲 함정 1 — 초기값 민감: n_init=1 랜덤 vs k-means++ ×10</div>
            <div className="flex gap-3 text-[10px]">
              <div className="flex-1 rounded border border-red-300 bg-red-50 p-1.5">
                <div className="font-bold text-red-800">랜덤 1벌</div>
                <div className="text-red-900">한 덩어리에 중심 2개가 몰림 → 지역 최적, inertia 4100</div>
              </div>

                <div className="font-bold text-emerald-800">k-means++ ×10벌</div>
                <div className="text-emerald-900">먼 점 우선 초기화 + 최선 채택 → inertia 2300</div>
              </div>
            </div>
          </div>
          <div>
            <div className="text-[11px] font-bold text-red-800 mb-1">⭕ 함정 2 — 구형 가정: 색=K-means 결과 / 테두리=진짜 집단</div>

    // ─────────────────────────────────────────────────────
    // Step 5: 덴드로그램 + 선택 기준표
    // ─────────────────────────────────────────────────────
    function DendroPane() {

                <text key={l.id} x={l.x} y="96" fontSize="4.2" fill="#57534a" textAnchor="middle" fontFamily="monospace">{l.id}</text>
              ))}
              <text x="50" y="101" fontSize="3.8" fill="#8a8578" textAnchor="middle">고객 (잎) — 가까운 것부터 아래에서 병합</text>
            </svg>
            <div className="text-[10px] text-violet-900 mt-0.5">빨간 선을 <b>아래로 내리면 5개</b>, 위로 올리면 2개 — 재학습 없이 높이만 바꾼다.</div>

              <thead>
                <tr className="text-violet-900 border-b-2 border-violet-300">
                  <th className="text-left py-0.5">상황</th>
                  <th className="text-left py-0.5 pl-2 w-24">K-means</th>

                  { crit: 'K를 아직 모른다 (탐색 단계)', a: '△ 엘보우 반복', b: '◎ 높이만 조절' },
                  { crit: '묶이는 구조 자체가 궁금하다', a: '✗ 결과만 나옴', b: '◎ 병합 역사 보임' },
                  { crit: '온라인 재학습·배포 파이프라인', a: '◎ 빠르고 단순', b: '△ 무겁다' },
                ].map((r) => (
                  <tr key={r.crit} className="border-t border-violet-200">
                    <td className="py-1 text-slate-800">{r.crit}</td>
                    <td className={`py-1 pl-2 font-bold ${r.a.startsWith('◎') ? 'text-emerald-700' : r.a.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.a}</td>
                    <td className={`py-1 pl-2 font-bold ${r.b.startsWith('◎') ? 'text-emerald-700' : r.b.startsWith('✗') ? 'text-red-700' : 'text-slate-500'}`}>{r.b}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-emerald-900 mb-1">🎯 세그먼트 → 마케팅 액션</div>
            <div className="space-y-1 text-[10px]">
              {[
                { c: CLUSTER_COLORS[1], name: '고가·저빈도 (VIP)', act: '리텐션 쿠폰 — 이탈하면 손실이 가장 크다' },
                { c: CLUSTER_COLORS[2], name: '중가·고빈도 (단골)', act: '객단가 업셀 번들 — 자주 오니 장바구니를 키운다' },
                { c: CLUSTER_COLORS[0], name: '저가·저빈도 (휴면 위험)', act: '휴면 방지 리마인드 — 저비용 푸시부터' },
              ].map((s) => (
                <div key={s.name} className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full border border-slate-400" style={{ backgroundColor: s.c }} />
                  <span className="font-bold text-slate-800 w-40">{s.name}</span>
                  <span className="text-slate-600">{s.act}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 시뮬레이션 스위치
    // ─────────────────────────────────────────────────────
    const PANE_BADGE = {
      problem: { icon: '❓', label: '문제 설정 — 라벨 없는 고객 24명' },
      kmeans:  { icon: '🔄', label: 'K-means 수렴 시뮬레이션' },
      elbow:   { icon: '📐', label: 'K 선택 — 엘보우 · 실루엣' },
      pitfall: { icon: '🕳️', label: '함정 3종 실패 사례' },
      dendro:  { icon: '🌳', label: '계층 군집 — 덴드로그램' },
    };

    function LiveDataPane({ state, stepIdx }) {
      const badge = PANE_BADGE[state.pane] || PANE_BADGE.problem;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>{badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500 font-mono">customers.csv · n=24</span>
          </div>

          {state.pane === 'problem' && (
            <div>
              <ScatterPlot points={POINTS} grayAll distDemo />
              <div className="mt-1.5 rounded-lg border-2 border-violet-300 bg-white p-2 text-[10px] text-slate-700 leading-snug">
                <b className="text-violet-900">라벨이 없다</b> — 점 24개에 색(정답)이 없다. 사람 눈엔 덩어리 3개가 보이지만,
                기계에게 알려주려면 <b>"가깝다 = 비슷하다"</b>를 유클리드 거리로 정의해야 한다.
                그러면 군집화는 "가까운 점 덩어리 찾기"라는 계산 가능한 문제가 된다.
              </div>
            </div>
          )}

          {state.pane === 'kmeans' && <KMeansAnim key={stepIdx} />}
          {state.pane === 'elbow' && <ElbowChart />}
          {state.pane === 'pitfall' && <PitfallPane />}
          {state.pane === 'dendro' && <DendroPane />}

          {/* 범례 (문제 설정·함정 단계 제외) */}
          {(state.pane === 'kmeans' || state.pane === 'elbow') && (
            <div className="mt-2 flex gap-3 text-[10px] text-slate-600">
              {CLUSTER_NAMES.map((n, k) => (
                <span key={n} className="flex items-center gap-1">
                  <span className="w-2.5 h-2.5 rounded-full border border-slate-400" style={{ backgroundColor: CLUSTER_COLORS[k] }} />{n}
                </span>
              ))}
              <span className="flex items-center gap-1 text-violet-800 font-bold">× 중심점</span>
            </div>
          )}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">III-1-1. K-means·계층 군집 — 거리 기반</h1>
                <p className="text-sm text-violet-800/80">라벨 없는 고객 데이터에서 세그먼트를 찾아내는 법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                거리 기반 군집화는 "가깝다 = 비슷하다"라는 정의 하나에서 출발한다.
                K-means는 할당→중심 재계산 반복으로 inertia를 단조 감소시켜 반드시 수렴하지만,
                K는 엘보우·실루엣으로 사람이 골라야 하고, 초기값(k-means++·n_init)·구형 가정(아니면 DBSCAN)·스케일링(StandardScaler) 세 함정을 피해야 한다.
                계층 군집은 병합 역사를 덴드로그램으로 남겨 "자르는 높이 = 클러스터 수"라는 유연함을 주는 대신 O(n²) 이상으로 무겁다.
                실무 콤보는 샘플로 덴드로그램 탐색 → K 확정 → 전체 고객에 K-means → 세그먼트별 마케팅 액션이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['비지도학습', 'K-means', 'inertia', '엘보우', '실루엣', 'k-means++', 'StandardScaler', 'DBSCAN', '계층군집', '덴드로그램', 'linkage', '고객세그먼트'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
