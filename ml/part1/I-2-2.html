  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    ML I-2-2 — 평가지표 — 정밀도·재현율·F1·ROC
    학습 목표: "정확도 99%" 암 진단 모델의 함정에서 출발해 혼동행렬 → 정밀도/재현율 트레이드오프 →
              임계값·ROC·AUC → 실무 지표 선택 가이드까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 혼동행렬 + 임계값 바 + 지표 게이지 + ROC 곡선) /
          우(VSCode CodeViewer: metrics_demo.py — confusion_matrix, classification_report, roc_curve, auc)
    색상: violet (ml 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 정확도의 함정 → 혼동행렬 → P vs R → 임계값·ROC → 선택 가이드
    //   matrix    : { tp, fp, fn, tn } — 검진 대상 1,000명, 실제 암 환자 10명(1%)
    //   metrics   : { acc, precision, recall, f1 } — %(소수 1자리). null 이면 계산 불가 표시
    //   threshold : 판단 임계값(스팸 확률/암 확률이 이 값 이상이면 양성 판정)
    //   roc       : true 면 ROC 곡선 표시 (Step 4)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 정확도의 함정 — "전부 정상"이라 답해도 99%',
        desc: '병원에서 암 조기 검진 모델을 발주했다. 검진 대상 1,000명 중 실제 암 환자는 10명(1%) — 현실 데이터는 대부분 이렇게 불균형하다. 그런데 아무것도 배우지 않고 무조건 "정상"만 출력하는 깡통 모델의 정확도가 99%다. 1,000명 중 990명(정상)을 맞혔으니 수식상으로는 틀린 게 없지만, 정작 찾아야 할 암 환자 10명을 전원 놓쳤다. 정확도(accuracy)는 "전체 중 맞힌 비율"이라 다수 클래스만 잘 맞혀도 높게 나오는 지표이기 때문이다. 이 실패를 해부하려면 예측 결과를 4칸으로 쪼개서 보는 표 — 혼동행렬(confusion matrix)이 필요하다.',
        actor: '🏥 검진 1,000명 · 실제 암 10명(1%) — 깡통 모델',
        engine: 'trap',
        engineDetail: '무조건 "정상" 출력 — DummyClassifier',
        threshold: null,
        matrix: { tp: 0, fp: 0, fn: 10, tn: 990 },
        metrics: { acc: 99.0, precision: null, recall: 0.0, f1: null },
        alert: { tone: 'danger', text: '정확도 99%인데 암 환자 검출 0명. 클래스가 불균형하면(암 1%) 정확도는 모델 실력을 전혀 말해주지 않는다. 재현율(recall) 0%가 진짜 성적표다.' },
        code: {
          lang: 'python',
          filename: 'metrics_demo.py — 1) 정확도의 함정',
          lines: [
            '"""',
            'metrics_demo.py — 평가지표 데모: 정확도의 함정부터 ROC 까지',
            '데이터: 검진 대상 1,000명, 실제 암 환자 10명 (양성 비율 1%)',
            '"""',
            'import numpy as np',
            'from sklearn.dummy import DummyClassifier',
            'from sklearn.linear_model import LogisticRegression',
            'from sklearn.metrics import (accuracy_score, confusion_matrix,',
            '                             classification_report, roc_curve, auc)',
            'from sklearn.model_selection import train_test_split',
            '',
            '# y=1 이 암(양성). 1,000명 중 10명만 1 — 극단적 클래스 불균형',
            'X, y = load_screening_data()          # (1000, 30), (1000,)',
            'X_tr, X_te, y_tr, y_te = train_test_split(',
            '    X, y, test_size=0.5, stratify=y, random_state=42)',
            '',
            '# ── 깡통 모델: 아무것도 안 배우고 무조건 다수 클래스("정상") ──',
            'dummy = DummyClassifier(strategy="most_frequent")',
            'dummy.fit(X_tr, y_tr)',
            'y_pred = dummy.predict(X_te)          # 전부 0 (정상)',
            '',
            'print(accuracy_score(y_te, y_pred))   # 0.99  ← 함정!',
            '',
            '# 정확도 = (맞힌 수) / (전체)',
            '#        = 990 / 1000 = 99%',
            '# 그런데 암 환자 10명은 전원 "정상" 판정 — 검출 0명',
            '',
            '# 왜 이런 일이? 정확도는 클래스를 구분하지 않는다.',
            '# 다수 클래스(정상 99%)만 잘 맞혀도 점수가 나온다.',
            '# → 예측을 4칸으로 쪼개서 봐야 한다: 혼동행렬',
            '',
            'cm = confusion_matrix(y_te, y_pred)',
            'print(cm)',
            '# [[990   0]     TN=990  FP=0',
            '#  [ 10   0]]    FN=10   TP=0   ← 암 10명 전원 놓침',
          ],
          highlight: [12, 13, 17, 18, 19, 20, 22, 24, 25, 26, 31, 32, 33, 34],
        },
      },

    // ─────────────────────────────────────────────────────
    // 혼동행렬 4칸 — 검진 1,000명 기준
    // ─────────────────────────────────────────────────────
    function ConfusionMatrix({ matrix }) {
      const cells = [
        { key: 'tp', label: 'TP', sub: '암 → 암', desc: '조기 발견', val: matrix.tp, bg: 'bg-emerald-100', border: 'border-emerald-400', text: 'text-emerald-900' },
        { key: 'fn', label: 'FN', sub: '암 → 정상', desc: '놓침 (최악)', val: matrix.fn, bg: 'bg-red-100', border: 'border-red-400', text: 'text-red-900' },
        { key: 'fp', label: 'FP', sub: '정상 → 암', desc: '오진 (재검사)', val: matrix.fp, bg: 'bg-amber-100', border: 'border-amber-400', text: 'text-amber-900' },
        { key: 'tn', label: 'TN', sub: '정상 → 정상', desc: '조용한 정답', val: matrix.tn, bg: 'bg-sky-50', border: 'border-sky-300', text: 'text-sky-900' },
      ];
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[11px] font-bold text-violet-900">혼동행렬 — 검진 1,000명</span>
            <span className="text-[9px] text-slate-500">행: 실제 / 열: 예측</span>
          </div>
          <div className="grid grid-cols-[auto_1fr_1fr] gap-1 text-center">
            <div></div>
            <div className="text-[9px] font-bold text-slate-600 py-0.5">예측: 암 (양성)</div>
            <div className="text-[9px] font-bold text-slate-600 py-0.5">예측: 정상 (음성)</div>
            <div className="text-[9px] font-bold text-slate-600 flex items-center justify-end pr-1">실제<br/>암 10</div>
            <Cell c={cells[0]} />
            <Cell c={cells[1]} />
            <div className="text-[9px] font-bold text-slate-600 flex items-center justify-end pr-1">실제<br/>정상 990</div>
            <Cell c={cells[2]} />
            <Cell c={cells[3]} />
          </div>
        </div>
      );
    }

    function Cell({ c }) {
      return (
        <div className={`rounded border-2 ${c.bg} ${c.border} ${c.text} py-1.5 px-1 transition-all duration-500`}>
          <div className="text-[10px] font-bold">{c.label} <span className="font-normal opacity-70">{c.sub}</span></div>
          <div className="text-xl font-bold font-mono leading-6">{c.val}</div>
          <div className="text-[9px] opacity-80">{c.desc}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 임계값 바 — threshold 위치 표시 (슬라이더 개념)
    // ─────────────────────────────────────────────────────
    function ThresholdBar({ threshold }) {
      if (threshold === null) return null;
      const pct = threshold * 100;
      return (
        <div className="mt-2 rounded-lg border border-violet-300 bg-white p-2.5">
          <div className="flex items-center justify-between text-[10px] font-bold text-violet-900 mb-1">
            <span>🎚 판정 임계값 (암 확률 ≥ th → 양성)</span>
            <span className="font-mono">th = {threshold.toFixed(2)}</span>
          </div>
          <div className="relative h-3 rounded-full bg-gradient-to-r from-red-200 via-amber-200 to-emerald-200">
            <div
              className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 rounded-full bg-violet-600 border-2 border-white shadow transition-all duration-700"
              style={{ left: `${pct}%` }}
            />
          </div>
          <div className="flex justify-between text-[9px] text-slate-500 mt-0.5">
            <span>0.0 — 전원 양성 (재현율 100%, 오진 폭발)</span>
            <span>1.0 — 전원 음성 (오진 0, 전원 놓침)</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 지표 게이지 — 정확도·정밀도·재현율·F1 실시간 갱신
    // ─────────────────────────────────────────────────────
    function MetricGauges({ metrics }) {
      const rows = [
        { name: '정확도', val: metrics.acc, warn: '함정 주의' },
        { name: '정밀도', val: metrics.precision },
        { name: '재현율', val: metrics.recall },
        { name: 'F1', val: metrics.f1 },
      ];
      return (
        <div className="mt-2 rounded-lg border-2 border-violet-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1.5">지표 게이지</div>
          <div className="space-y-1.5">
            {rows.map((r) => {
              const isNull = r.val === null || r.val === undefined;
              const color = isNull ? 'bg-slate-300' : r.val >= 70 ? 'bg-emerald-500' : r.val >= 40 ? 'bg-amber-500' : 'bg-red-500';
              return (
                <div key={r.name} className="flex items-center gap-2">
                  <span className="w-12 text-[10px] font-bold text-slate-700">{r.name}</span>
                  <div className="flex-1 h-2.5 rounded-full bg-violet-100 overflow-hidden">
                    <div className={`h-full ${color} transition-all duration-700`} style={{ width: `${isNull ? 0 : r.val}%` }} />
                  </div>
                  <span className="w-14 text-right text-[10px] font-mono font-bold text-slate-800">
                    {isNull ? '계산불가' : `${r.val.toFixed(1)}%`}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ROC 곡선 (Step 4) — SVG
    // ─────────────────────────────────────────────────────
    function RocCurve({ roc }) {
      if (!roc) return null;
      const W = 100, H = 100;
      const toXY = ([fpr, tpr]) => [fpr * W, H - tpr * H];
      const path = roc.points.map((p, i) => {
        const [x, y] = toXY(p);
        return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const [mx, my] = toXY(roc.marker);
      return (
        <div className="mt-2 rounded-lg border-2 border-violet-400 bg-white p-2.5">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-bold text-violet-900">📈 ROC 곡선 — 모든 임계값의 궤적</span>
            <span className="text-[10px] font-mono font-bold text-violet-700">AUC = {roc.auc.toFixed(2)}</span>
          </div>
          <div className="flex gap-2">
            <svg viewBox="-14 -6 122 122" className="w-40 h-40 flex-shrink-0" role="img" aria-hidden="true">
              <rect x="0" y="0" width={W} height={H} fill="#faf5ff" stroke="#c4b5fd" strokeWidth="1" />
              {/* 대각선 = 동전 던지기 */}
              <line x1="0" y1={H} x2={W} y2="0" stroke="#94a3b8" strokeWidth="1" strokeDasharray="4 3" />
              {/* AUC 면적 */}
              <path d={`${path} L${W},${H} L0,${H} Z`} fill="#8b5cf6" opacity="0.12" />
              {/* ROC 곡선 */}
              <path d={path} fill="none" stroke="#7c3aed" strokeWidth="2.5" strokeLinejoin="round" />
              {/* 현재 임계값 마커 */}
              <circle cx={mx} cy={my} r="3.5" fill="#f59e0b" stroke="#fff" strokeWidth="1.2" />
              <text x={mx + 5} y={my + 1} fontSize="7" fill="#b45309" fontWeight="bold">★ th=0.30</text>
              <text x={W / 2} y={H + 12} fontSize="7" fill="#64748b" textAnchor="middle">FPR (오진율) →</text>
              <text x="-8" y={H / 2} fontSize="7" fill="#64748b" textAnchor="middle" transform={`rotate(-90 -8 ${H / 2})`}>TPR (재현율) →</text>
            </svg>
            <div className="text-[10px] text-slate-700 leading-relaxed self-center">
              <div className="mb-1"><span className="inline-block w-3 h-0.5 bg-violet-600 align-middle mr-1"></span>왼쪽 위에 붙을수록 좋은 모델</div>
              <div className="mb-1"><span className="inline-block w-3 border-t border-dashed border-slate-400 align-middle mr-1"></span>대각선 = 동전 던지기 (AUC 0.5)</div>
              <div><span className="text-amber-600 font-bold">★</span> 지금 임계값(0.30)의 위치 — 임계값을 내리면 곡선 위를 오른쪽 위로 이동</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 임계값 스윕 표 (Step 4)
    // ─────────────────────────────────────────────────────
    function ThresholdTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-lg border border-violet-300 bg-violet-50 p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1">🎚 {box.title}</div>
          <table className="w-full text-[9.5px]">
            <thead>
              <tr className="text-violet-900 border-b border-violet-300">
                <th className="text-left py-0.5">th</th>
                <th className="text-right py-0.5">TP</th>
                <th className="text-right py-0.5">FP</th>
                <th className="text-right py-0.5">FN</th>
                <th className="text-right py-0.5">정밀도</th>
                <th className="text-right py-0.5">재현율</th>
                <th className="text-left py-0.5 pl-2">성격</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.th} className={`border-t border-violet-200 ${r.active ? 'bg-amber-100 font-bold' : ''}`}>
                  <td className="py-0.5 font-mono">{r.th}</td>
                  <td className="py-0.5 text-right font-mono text-emerald-700">{r.tp}</td>
                  <td className="py-0.5 text-right font-mono text-amber-700">{r.fp}</td>
                  <td className="py-0.5 text-right font-mono text-red-700">{r.fn}</td>
                  <td className="py-0.5 text-right font-mono">{r.p.toFixed(1)}%</td>
                  <td className="py-0.5 text-right font-mono">{r.r.toFixed(1)}%</td>
                  <td className="py-0.5 pl-2">{r.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 4칸 비용 표 (Step 2)
    // ─────────────────────────────────────────────────────
    function CostBox({ box }) {
      if (!box) return null;
      const tone = { good: 'text-emerald-700', warn: 'text-amber-700', bad: 'text-red-700 font-bold' };
      return (
        <div className="mt-2 rounded-lg border border-violet-300 bg-violet-50 p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1">💰 {box.title}</div>
          <div className="space-y-0.5">
            {box.rows.map((r) => (
              <div key={r.cell} className="flex gap-2 text-[10px]">
                <span className="w-32 flex-shrink-0 font-mono font-bold text-slate-800">{r.cell}</span>
                <span className={tone[r.tone]}>{r.cost}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 수식 박스 (Step 3)
    // ─────────────────────────────────────────────────────
    function FormulaBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-lg border-2 border-violet-400 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1.5">🧮 {box.title}</div>
          <div className="space-y-1.5">
            {box.rows.map((r) => (
              <div key={r.name} className="rounded border border-violet-200 bg-violet-50 px-2 py-1">
                <div className="flex flex-wrap items-baseline gap-2">
                  <span className="text-[10px] font-bold text-violet-900">{r.name}</span>
                  <span className="text-[10px] font-mono text-slate-800 bg-white px-1 rounded border border-violet-200">{r.formula}</span>
                </div>
                <div className="text-[9.5px] text-slate-600 mt-0.5">{r.mean}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 도메인 우선순위 박스 (Step 3)
    // ─────────────────────────────────────────────────────
    function DomainBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-lg border border-violet-300 bg-violet-50 p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1">⚖️ {box.title}</div>
          <table className="w-full text-[9.5px]">
            <thead>
              <tr className="text-violet-900 border-b border-violet-300">
                <th className="text-left py-0.5">도메인</th>
                <th className="text-left py-0.5 pl-2">비싼 오류</th>
                <th className="text-left py-0.5 pl-2">선택</th>
                <th className="text-left py-0.5 pl-2">이유</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.domain} className="border-t border-violet-200">
                  <td className="py-1 font-bold text-slate-800">{r.domain}</td>
                  <td className="py-1 pl-2 text-red-700">{r.costly}</td>
                  <td className="py-1 pl-2 font-bold text-emerald-700">{r.pick}</td>
                  <td className="py-1 pl-2 text-slate-600">{r.why}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 실무 선택표 + 회귀 지표 (Step 5)
    // ─────────────────────────────────────────────────────
    function GuideTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1">🧭 {box.title}</div>
          <table className="w-full text-[9.5px]">
            <thead>
              <tr className="text-violet-900 border-b-2 border-violet-300">
                <th className="text-left py-0.5">문제</th>
                <th className="text-left py-0.5 pl-2">비싼 오류</th>
                <th className="text-left py-0.5 pl-2">주 지표</th>
                <th className="text-left py-0.5 pl-2">메모</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.task} className="border-t border-violet-200">
                  <td className="py-1 font-bold text-slate-800 whitespace-nowrap">{r.task}</td>
                  <td className="py-1 pl-2 text-red-700">{r.costly}</td>
                  <td className="py-1 pl-2 font-bold text-emerald-700">{r.metric}</td>
                  <td className="py-1 pl-2 text-slate-600">{r.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function RegressionBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-lg border border-violet-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-violet-900 mb-1">📏 {box.title}</div>
          <div className="space-y-1">
            {box.rows.map((r) => (
              <div key={r.name} className="flex flex-wrap items-baseline gap-2 text-[10px]">
                <span className="w-11 font-bold font-mono text-slate-800">{r.name}</span>
                <span className="font-mono text-violet-800 bg-violet-50 px-1 rounded border border-violet-200">{r.formula}</span>
                <span className="text-slate-600">{r.trait}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-2 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 혼동행렬 + 임계값 + 게이지 + ROC (violet 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      trap:      { icon: '🕳', label: '정확도의 함정' },
      model:     { icon: '🔬', label: '혼동행렬 해부' },
      tradeoff:  { icon: '⚖️', label: '정밀도 vs 재현율' },
      threshold: { icon: '🎚', label: '임계값 · ROC' },
      guide:     { icon: '🧭', label: '지표 선택 가이드' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.model;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>암 검진 평가 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            분류기: {state.engineDetail}
          </div>
          <ConfusionMatrix matrix={state.matrix} />
          <ThresholdBar threshold={state.threshold} />
          <MetricGauges metrics={state.metrics} />
          <CostBox box={state.costBox} />
          <FormulaBox box={state.formulaBox} />
          <DomainBox box={state.domainBox} />
          <ThresholdTable box={state.thresholdTable} />
          <RocCurve roc={state.roc} />
          <GuideTable box={state.guideTable} />
          <RegressionBox box={state.regressionBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">I-2-2. 평가지표 — 정밀도·재현율·F1·ROC</h1>
                <p className="text-sm text-violet-800/80">정확도 99%의 함정 — 암 진단 모델이 "전부 정상"이라 답해도 99%</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                정확도는 클래스 불균형 앞에서 거짓말을 한다 — 예측을 TP/FP/FN/TN 4칸으로 쪼갠 혼동행렬이 출발점이다.
                정밀도(양성 판정의 신뢰도)와 재현율(놓치지 않는 능력)은 임계값을 사이에 둔 시소이고,
                어느 쪽에 앉을지는 "가장 비싼 오류가 무엇인가"(스팸=FP, 암 진단=FN)가 정한다.
                임계값 전체를 훑은 궤적이 ROC, 그 면적 AUC는 임계값 무관한 모델끼리의 비교 지표다.
                보고서의 모든 지표 옆에는 "왜 이 지표인가" 한 줄을 적자 — 그게 없는 99%는 함정이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['정확도함정', '혼동행렬', 'TP/FP/FN/TN', '정밀도', '재현율', 'F1', '임계값', 'ROC', 'AUC', 'PR-AUC', 'MAE', 'RMSE'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./I-2-1.html" className="underline hover:no-underline">← 이전: I-2-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
