  <!--
    ML IV-1-2 — Q-learning — 테이블로 배우기
    학습 목표: 전이 확률 P를 모르는 실제 세상에서 "부딪히며(경험으로)" 배우는 model-free 발상 →
              Q(s,a) 테이블 → Q ← Q + α(r + γ·maxQ' − Q) 업데이트 → ε-greedy 탐험/활용 →
              에피소드 반복으로 수렴하는 과정을 2x2 그리드월드 + 실시간 Q 테이블로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 그리드월드 + Q 테이블 4상태x4행동) / 우(VSCode CodeViewer: q_learning.py)
    색상: violet (ml 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 우측 CodeViewer 코드 — q_learning.py (전 단계 공유, 단계별 하이라이트만 변경)
    // ─────────────────────────────────────────────────────
    const CODE_LINES = [
      '"""',
      'q_learning.py — 2x2 그리드월드에서 배우는 Q-learning',
      '모델(전이 확률 P) 없이, 부딪히며 얻은 (s, a, r, s\') 경험만으로',
      'Q 테이블을 채운다 — model-free 강화학습의 출발점',
      '"""',
      'import random',
      '',
      'import numpy as np',
      '',
      '# ── 환경: 2x2 그리드월드 ──────────────────────────',
      '#   S0 S1',
      '#   S2 S3(G)   목표 도달 +10 / 그 외 0 / 벽이면 제자리',
      'N_STATES, N_ACTIONS = 4, 4        # 상태 4 x 행동 4(↑↓←→)',
      'GOAL = 3',
      'MOVES = {  # state -> [↑, ↓, ←, →] 의 다음 상태',
      '    0: [0, 2, 0, 1],',
      '    1: [1, 3, 0, 1],',
      '    2: [0, 2, 2, 3],',
      '    3: [3, 3, 3, 3],   # 종료 상태',
      '}',
      '',
      '',
      'def env_step(state: int, action: int) -> tuple[int, float, bool]:',
      '    """행동을 실행하고 (다음 상태, 보상, 종료 여부)를 관찰한다.',
      '',
      '    에이전트는 이 함수의 내부(전이 확률 P)를 모른다.',
      '    오직 "해보고 나온 결과"만 받는다 — 이것이 model-free.',
      '    """',
      '    next_state = MOVES[state][action]',
      '    if next_state == GOAL:',
      '        return next_state, 10.0, True',
      '    return next_state, 0.0, False',
      '',
      '',
      '# ── 1) Q 테이블 초기화 — 4x4 전부 0에서 시작 ──────',
      'Q = np.zeros((N_STATES, N_ACTIONS))',
      '',
      '',
      '# ── 2) ε-greedy 행동 선택 ─────────────────────────',
      'def choose_action(state: int, epsilon: float) -> int:',
      '    """확률 ε로 무작위 탐험, 나머지는 현재 최선을 활용."""',
      '    if random.random() < epsilon:',
      '        return random.randrange(N_ACTIONS)   # 탐험',
      '    return int(np.argmax(Q[state]))          # 활용',
      '',
      '',
      '# ── 3) 학습 루프 — 핵심은 업데이트 한 줄 ──────────',
      'ALPHA, GAMMA = 0.5, 0.9                  # 학습률 α, 할인율 γ',
      'EPSILON, EPS_DECAY, EPS_MIN = 1.0, 0.995, 0.05',
      '',
      'reward_history = []',
      'for episode in range(300):',
      '    state, total_reward, done = 0, 0.0, False',
      '    while not done:',
      '        action = choose_action(state, EPSILON)',
      '        next_state, reward, done = env_step(state, action)',
      '',
      '        # Q-learning: Q ← Q + α(r + γ·maxQ\' − Q)',
      '        td_target = reward + GAMMA * np.max(Q[next_state])',
      '        td_error = td_target - Q[state, action]',
      '        Q[state, action] += ALPHA * td_error',
      '',
      '        state = next_state',
      '        total_reward += reward',
      '',
      '    # ── 4) ε 감쇠 — 초반엔 탐험, 후반엔 활용 ──────',
      '    EPSILON = max(EPS_MIN, EPSILON * EPS_DECAY)',
      '    reward_history.append(total_reward)',
      '',
      '',
      '# ── 5) 학습 곡선 + 최종 정책 확인 ─────────────────',
      'for ep in (0, 50, 100, 200, 299):',
      '    avg = sum(reward_history[max(0, ep - 9): ep + 1]) / 10',
      '    print(f"episode {ep:3d}  최근 10회 평균 보상 {avg:5.2f}")',
      '',
      'ARROWS = "↑↓←→"',
      'policy = [ARROWS[int(a)] for a in Q.argmax(axis=1)]',
      'print("최종 정책:", policy)    # 예: [\'→\', \'↓\', \'→\', \'·\']',
      'print(np.round(Q, 2))          # 수렴한 Q 테이블',
    ];

          compare: [
            { name: 'ε = 0 (활용만)', result: '먼저 찾은 경로에 고착 — 최적 경로 발견 실패', tone: 'bad' },
            { name: 'ε = 0.9 (탐험만)', result: '다 배우고도 계속 방황 — 평균 보상 낮음', tone: 'bad' },
            { name: 'ε 감쇠 1.0→0.05', result: '초반 탐험으로 전 경로 확인 → 후반 활용', tone: 'good' },
          ],
          schedule: [
            { ep: 'ep 1', eps: 1.0 },
            { ep: 'ep 50', eps: 0.78 },
            { ep: 'ep 150', eps: 0.47 },
            { ep: 'ep 300', eps: 0.22 },
            { ep: '하한', eps: 0.05 },
          ],
        },
        alert: { tone: 'warn', text: '추천 시스템이 인기 상품만 계속 미는 것도 같은 병(활용 고착)이다. 탐험은 낭비가 아니라 "더 좋은 답이 있는지 확인하는 비용"이다.' },
        codeFile: 'q_learning.py — ε-greedy와 감쇠',
        highlight: [39, 40, 41, 42, 43, 44, 49, 66, 67],
      },
      {
        title: 'Step 5. 에피소드 반복 → 수렴 — 그리고 테이블의 한계',
        desc: '에피소드를 300번 돌리면 Q 테이블이 차오르고, 각 상태의 argmax를 이으면 최적 경로가 뚜렷하게 드러난다 — S0에서는 ↓든 →든 9.0으로 같고(두 경로 모두 두 걸음), 목표에 가까울수록 값이 10에 가깝다(γ=0.9 할인 때문). 학습 곡선을 보면 초반엔 방황하느라 도착이 느리다가 후반엔 거의 매번 최단으로 도착한다. 이 기법은 실제로 쓰인다 — 동적 가격 책정(상태=재고·시간대, 행동=가격), 게임 NPC 행동 정책 등 상태·행동이 유한하고 작을 때는 테이블이 가장 단순하고 검증 가능한 답이다. 하지만 바둑판(10^170 상태)이나 카메라 픽셀 입력처럼 상태가 폭발하면 표를 만들 수도, 다 방문할 수도 없다 — 그래서 다음 장에서는 테이블을 신경망으로 근사하는 DQN이 등장한다.',
        actor: '🏁 300 에피소드 후 — 최적 경로 완성',
        phase: '수렴 → 한계(상태 폭발)',
        grid: { agent: 0, goal: 3, policy: ['→', '↓', '→', '·'] },
        qtable: {
          values: [[8.1, 9.0, 8.1, 9.0], [9.0, 10.0, 8.1, 9.0], [8.1, 9.0, 9.0, 10.0], [0, 0, 0, 0]],
          hi: null,
          note: '각 행의 최댓값(진한 칸)을 이으면 = 최적 정책',
        },
        curveBox: {
          title: '학습 곡선 — 에피소드별 평균 보상(10회 이동 평균)',
          bars: [
            { ep: '1', v: 1.2 }, { ep: '30', v: 3.5 }, { ep: '60', v: 5.1 },
            { ep: '100', v: 7.0 }, { ep: '150', v: 8.4 }, { ep: '200', v: 9.3 },
            { ep: '250', v: 9.7 }, { ep: '300', v: 9.9 },
          ],
          max: 10,
        },
        limitBox: {
          title: '테이블의 한계와 실무 사용처',
          good: ['동적 가격 책정 (상태=재고×시간대, 행동=가격 단계)', '게임 NPC 행동 정책 (상태·행동이 수십~수천 개)', '광고 예산 배분 등 이산·소규모 의사결정'],
          bad: ['바둑: 상태 ~10^170 — 표를 만들 수 없다', '카메라 픽셀 입력 — 같은 상태를 두 번 방문할 확률 ≈ 0', '연속 행동(핸들 각도) — 열이 무한 개'],
          next: '→ 다음 장 DQN: Q 테이블을 신경망 Q(s,a;θ)로 근사',
        },
        alert: { tone: 'good', text: '수렴의 조건: 모든 (s,a)를 충분히 방문(탐험) + α가 적절히 작아야 한다. 상태가 폭발하면 "충분히 방문"이 불가능 → 근사(DQN)로 넘어간다.' },
        codeFile: 'q_learning.py — 학습 곡선과 최종 정책',
        highlight: [51, 52, 64, 68, 71, 72, 73, 74, 76, 77, 78, 79],
      },
    ];

    const ACTIONS = ['↑', '↓', '←', '→'];

    // ─────────────────────────────────────────────────────
    // 그리드월드 (2x2) — 에이전트/목표/이동 화살표/최종 정책
    // ─────────────────────────────────────────────────────
    function GridWorld({ grid }) {
      const cells = [0, 1, 2, 3];
      return (
        <div className="rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="text-[11px] font-bold text-violet-900 mb-2">🗺 그리드월드 (2×2 · 시작 S0 · 목표 S3 +10)</div>
          <div className="grid grid-cols-2 gap-1.5 max-w-[220px] mx-auto">
            {cells.map((s) => {
              const isAgent = grid.agent === s;
              const isGoal = grid.goal === s;
              const onPath = grid.arrow && (grid.arrow.from === s || grid.arrow.to === s);
              return (
                <div
                  key={s}
                  className={`relative h-16 rounded border-2 flex flex-col items-center justify-center transition-all duration-500
                    ${isGoal ? 'border-emerald-400 bg-emerald-50' : onPath ? 'border-amber-400 bg-amber-50' : 'border-violet-200 bg-violet-50'}`}
                >
                  <span className="absolute top-0.5 left-1 text-[9px] font-mono text-slate-500">S{s}</span>
                  <span className="text-xl leading-none">
                    {isAgent ? '🤖' : isGoal ? '🏁' : grid.policy ? '' : ''}
                  </span>
                  {grid.policy && !isAgent && (
                    <span className="text-lg font-bold text-violet-700">{grid.policy[s]}</span>
                  )}
                  {grid.policy && isAgent && (
                    <span className="text-sm font-bold text-violet-700">{grid.policy[s]}</span>
                  )}
                  {isGoal && <span className="text-[9px] font-bold text-emerald-700">+10</span>}
                </div>
              );
            })}
          </div>
          {grid.arrow && (
            <div className="mt-2 text-center text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-300 rounded px-2 py-1">
              ⚡ S{grid.arrow.from} → S{grid.arrow.to} : {grid.arrow.label}
            </div>
          )}
          {grid.policy && (
            <div className="mt-2 text-center text-[10px] text-violet-800">
              각 칸의 화살표 = argmax Q — 어느 길로 가도 두 걸음 최단 경로
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Q 테이블 (4상태 × 4행동) — 값 크기에 따라 셀 진하기, 갱신 셀 하이라이트
    // ─────────────────────────────────────────────────────
    function QTable({ qtable }) {
      if (!qtable) return null;
      const cellStyle = (v, isHi, isMax) => {
        if (isHi) return 'bg-amber-200 border-amber-500 text-amber-900 font-bold animate-pulse';
        if (v >= 9.5) return 'bg-violet-600 text-white font-bold border-violet-700';
        if (v >= 8) return isMax ? 'bg-violet-500 text-white font-bold border-violet-600' : 'bg-violet-300 text-violet-950 border-violet-400';
        if (v >= 4) return 'bg-violet-200 text-violet-900 border-violet-300 font-bold';
        if (v > 0) return 'bg-violet-100 text-violet-800 border-violet-200';
        return 'bg-white text-slate-400 border-slate-200';
      };
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-[11px] font-bold text-violet-900 mb-2">📋 Q 테이블 — 행: 상태 / 열: 행동</div>
          <table className="w-full text-[10px] border-collapse">
            <thead>
              <tr>
                <th className="w-10"></th>
                {ACTIONS.map((a) => (
                  <th key={a} className="py-0.5 text-violet-800 font-bold">{a}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {qtable.values.map((row, s) => {
                const rowMax = Math.max(...row);
                return (
                  <tr key={s}>
                    <td className="py-0.5 pr-1 text-right font-mono font-bold text-slate-700">
                      S{s}{s === 3 ? '🏁' : ''}
                    </td>
                    {row.map((v, a) => {
                      const isHi = qtable.hi && qtable.hi[0] === s && qtable.hi[1] === a;
                      const isMax = rowMax > 0 && v === rowMax;
                      return (
                        <td key={a} className="p-0.5">
                          <div className={`rounded border text-center py-1 font-mono transition-all duration-500 ${cellStyle(v, isHi, isMax)}`}>
                            {s === 3 ? '·' : v.toFixed(1)}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-violet-800">{qtable.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1: 모델 기반 vs 모델 프리 비교
    // ─────────────────────────────────────────────────────
    function ModelCompareBox({ box }) {
      if (!box) return null;
      const Col = ({ col, tone }) => (
        <div className={`flex-1 rounded-lg border-2 p-2 ${tone === 'old' ? 'border-slate-300 bg-slate-50' : 'border-violet-400 bg-violet-50'}`}>
          <div className={`text-[11px] font-bold mb-1.5 ${tone === 'old' ? 'text-slate-700' : 'text-violet-900'}`}>{col.name}</div>
          {col.items.map((it, i) => (
            <div key={i} className={`rounded border px-2 py-1 mb-1 text-[10px] ${tone === 'old' ? 'border-slate-300 bg-white text-slate-700' : 'border-violet-300 bg-white text-violet-900 font-bold'}`}>
              {it}
            </div>
          ))}
        </div>
      );
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🧭 {box.title}</div>
          <div className="flex gap-2 items-stretch">
            <Col col={box.left} tone="old" />
            <div className="flex items-center text-violet-500 text-lg">⇄</div>
            <Col col={box.right} tone="new" />
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3: TD 오차 분해 박스
    // ─────────────────────────────────────────────────────
    function TDBox({ box }) {
      if (!box) return null;
      const tone = {
        good:  'text-emerald-700',
        warn:  'text-amber-700 font-bold',
        norm:  'text-slate-600',
        final: 'text-violet-800 font-bold',
      };
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-2">🔍 {box.title}</div>
          <div className="rounded border border-amber-300 bg-white p-2">
            {box.rows.map((r, i) => (
              <div key={i} className={`flex justify-between text-[10px] py-0.5 ${i === 3 || i === 5 ? 'border-t border-amber-200 mt-0.5 pt-1' : ''}`}>
                <span className="text-slate-700">{r.k}</span>
                <span className={`font-mono ${tone[r.tone]}`}>{r.v}</span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-amber-900">
            식 한 줄: <span className="font-mono font-bold">Q ← Q + α(r + γ·maxQ&#39; − Q)</span> — 기대값 계산 없이 "샘플 하나"로 벨만을 흉내 낸다
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4: ε 비교 + 감쇠 스케줄
    // ─────────────────────────────────────────────────────
    function EpsilonBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🎲 {box.title}</div>
          <div className="space-y-1 mb-2">
            {box.compare.map((c) => (
              <div key={c.name} className={`flex gap-2 items-center rounded border px-2 py-1 text-[10px] ${c.tone === 'good' ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                <span className={`font-mono font-bold whitespace-nowrap ${c.tone === 'good' ? 'text-emerald-800' : 'text-red-800'}`}>{c.name}</span>
                <span className="text-slate-700">{c.result}</span>
                <span className="ml-auto">{c.tone === 'good' ? '✅' : '❌'}</span>
              </div>
            ))}
          </div>
          <div className="text-[10px] font-bold text-violet-800 mb-1">감쇠 스케줄 (×0.995 / 에피소드, 하한 0.05)</div>
          <div className="flex items-end gap-1.5 h-14">
            {box.schedule.map((s) => (
              <div key={s.ep} className="flex-1 flex flex-col items-center gap-0.5">
                <span className="text-[9px] font-mono text-violet-800">{s.eps.toFixed(2)}</span>
                <div className="w-full rounded-t bg-violet-400 transition-all duration-700" style={{ height: `${s.eps * 36}px` }} />
                <span className="text-[9px] text-slate-500">{s.ep}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5: 학습 곡선 + 한계/실무 박스
    // ─────────────────────────────────────────────────────
    function CurveBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-emerald-300 bg-white p-3">
          <div className="text-xs font-bold text-emerald-900 mb-2">📈 {box.title}</div>
          <div className="flex items-end gap-1.5 h-20">
            {box.bars.map((b) => (
              <div key={b.ep} className="flex-1 flex flex-col items-center gap-0.5">
                <span className="text-[9px] font-mono text-emerald-800">{b.v.toFixed(1)}</span>
                <div
                  className={`w-full rounded-t transition-all duration-700 ${b.v >= 9 ? 'bg-emerald-500' : b.v >= 5 ? 'bg-emerald-400' : 'bg-amber-400'}`}
                  style={{ height: `${(b.v / box.max) * 56}px` }}
                />
                <span className="text-[9px] text-slate-500">{b.ep}</span>
              </div>
            ))}
          </div>
          <div className="mt-1 text-[10px] text-emerald-900">초반: ε 커서 방황(보상 낮음) → 후반: 감쇠된 ε + 채워진 테이블 = 거의 매번 최단 도착</div>
        </div>
      );
    }

    function LimitBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">⚖️ {box.title}</div>
          <div className="grid grid-cols-2 gap-2 text-[10px]">
            <div>
              <div className="font-bold text-emerald-800 mb-1">✅ 테이블이 통하는 곳</div>
              {box.good.map((g, i) => (
                <div key={i} className="rounded border border-emerald-300 bg-white px-2 py-1 mb-1 text-slate-700">{g}</div>
              ))}
            </div>
            <div>
              <div className="font-bold text-red-800 mb-1">🚫 상태 폭발 — 테이블 불가</div>
              {box.bad.map((b, i) => (
                <div key={i} className="rounded border border-red-300 bg-white px-2 py-1 mb-1 text-slate-700">{b}</div>
              ))}
            </div>
          </div>
          <div className="mt-1 text-[10px] font-bold text-violet-900">{box.next}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 그리드월드 + Q 테이블 시뮬레이션 (violet 톤)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>🤖</span>
              <span>Q-learning 시뮬레이션</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-2 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            현재 국면: {state.phase}
          </div>
          <GridWorld grid={state.grid} />
          <QTable qtable={state.qtable} />
          <ModelCompareBox box={state.modelCompare} />
          <TDBox box={state.tdBox} />
          <EpsilonBox box={state.epsBox} />
          <CurveBox box={state.curveBox} />
          <LimitBox box={state.limitBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      const code = {
        lang: 'python',
        filename: step.codeFile,
        lines: CODE_LINES,
        highlight: step.highlight,
      };

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">IV-1-2. Q-learning — 테이블로 배우기</h1>
                <p className="text-sm text-violet-800/80">환경 모델 없이 부딪히며 배우는 법 — Q 테이블이 채워지는 과정을 눈으로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Q-learning은 전이 확률 P 없이(model-free) 경험 샘플 (s, a, r, s&#39;)만으로
                Q(s,a) 테이블을 채우는 알고리즘이다. 업데이트 한 줄 — Q ← Q + α(r + γ·maxQ&#39; − Q) —
                에서 괄호 안이 "놀란 정도(TD 오차)"이고 α가 그것을 얼마나 믿을지의 다이얼이다.
                ε-greedy 탐험이 없으면 먼저 찾은 경로에 고착되어 최적을 놓치고,
                ε 감쇠 스케줄로 "초반 탐험 → 후반 활용"을 오간다.
                상태·행동이 작을 땐(동적 가격, 게임 NPC) 테이블이 가장 단순한 답이지만,
                상태가 폭발하면 표를 만들 수 없다 — 다음 장 DQN이 테이블을 신경망으로 근사한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Q-learning', 'model-free', 'Q테이블', 'TD오차', '학습률α', '할인율γ', 'ε-greedy', '탐험vs활용', 'ε감쇠', '수렴', '상태폭발', 'DQN예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./IV-1-1.html" className="underline hover:no-underline">← 이전: IV-1-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
