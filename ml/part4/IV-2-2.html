    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    ML IV-2-2 — 정책 경사·PPO — RLHF까지
    학습 목표: Q의 한계 → REINFORCE → Advantage(Actor-Critic) → PPO → RLHF 5단계 계보 추적.
    패턴: fastapi v1 — 좌(LiveDataPane: 확률 막대·AC 구조도·클리핑 곡선·RLHF 파이프라인) / 우(CodeViewer: policy_gradient.py 진화)
    색상: violet (ml 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   policyBars : 행동 확률 분포 시각화 [{ name, prob, delta, reward }]
    //   limitBox   : Step 1 — Q 방식이 막히는 두 지점
    //   acDiagram  : Step 3 — Actor-Critic 구조도
    //   ppoClip    : Step 4 — 클리핑 곡선 데이터
    //   rlhf       : Step 5 — 3단계 파이프라인
    //   compareBox : Step 5 — 가치 기반 vs 정책 기반 선택표
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // ── 원본 코드 본문 (한 글자도 바꾸지 않음) ──
    const CODE = {
      s1: {lang: "python", filename: "policy_net.py — πθ 정의", lines: [
        "\"\"\"",
        "policy_net.py — 가치를 거치지 않고 정책을 직접 표현한다",
        "",
        "가치 기반: s → Q(s,a) 전부 계산 → argmax  (행동 무한이면 불가)",
        "정책 기반: s → πθ(a|s) 분포 출력 → 샘플링 (연속/확률 모두 OK)",
        "\"\"\"",
        "import torch",
        "import torch.nn as nn",
        "",
        "",
        "class DiscretePolicy(nn.Module):",
        "    \"\"\"이산 행동용 정책망 — softmax로 행동 확률 분포 출력.\"\"\"",
        "",
        "    def __init__(self, state_dim: int, n_actions: int):",
        "        super().__init__()",
        "        self.net = nn.Sequential(",
        "            nn.Linear(state_dim, 64), nn.ReLU(),",
        "            nn.Linear(64, n_actions),  # 로짓",
        "        )",
        "",
        "    def forward(self, state: torch.Tensor):",
        "        logits = self.net(state)",
        "        return torch.distributions.Categorical(logits=logits)",
        "",
        "",
        "# 연속 행동(로봇 관절 각도)도 같은 패턴 — 가우시안을 출력한다:",
        "#   Normal(self.mu(state), self.log_std.exp()) 에서 샘플링",
        "# \"전부 나열 후 argmax\" 가 없으므로 무한 행동 공간도 OK",
        "",
        "policy = DiscretePolicy(state_dim=4, n_actions=3)",
        "dist = policy(torch.randn(1, 4))",
        "action = dist.sample()            # 분포에서 \"샘플링\" — 확률적 선택",
        "log_prob = dist.log_prob(action)  # 다음 단계의 학습 재료",
      ]},
      s2: {lang: "python", filename: "policy_gradient.py (v1 — REINFORCE)", lines: [
        "\"\"\"",
        "policy_gradient.py — v1: REINFORCE (1992)",
        "핵심 한 줄: loss = -log_prob × return",
        "\"좋았던 행동의 로그확률을 올려라, 보상만큼 세게\"",
        "\"\"\"",
        "import torch",
        "from policy_net import DiscretePolicy",
        "",
        "GAMMA = 0.99",
        "policy = DiscretePolicy(state_dim=4, n_actions=3)",
        "optimizer = torch.optim.Adam(policy.parameters(), lr=1e-3)",
        "",
        "",
        "def compute_returns(rewards: list[float]) -> torch.Tensor:",
        "    \"\"\"뒤에서부터 감가 누적: Gₜ = rₜ + γ·Gₜ₊₁\"\"\"",
        "    returns, g = [], 0.0",
        "    for r in reversed(rewards):",
        "        g = r + GAMMA * g",
        "        returns.insert(0, g)",
        "    return torch.tensor(returns)",
        "",
        "",
        "def train_one_episode(env) -> float:",
        "    state, _ = env.reset()",
        "    log_probs, rewards, done = [], [], False",
        "    while not done:                      # 1) 끝까지 플레이",
        "        dist = policy(torch.as_tensor(state, dtype=torch.float32))",
        "        action = dist.sample()           #    분포에서 샘플링",
        "        log_probs.append(dist.log_prob(action))",
        "        state, reward, term, trunc, _ = env.step(action.item())",
        "        rewards.append(reward)",
        "        done = term or trunc",
        "",
        "    returns = compute_returns(rewards)   # 2) 각 시점의 G",
        "    # 3) 핵심: 보상 가중 로그확률 — G가 클수록 강하게 밀어올린다",
        "    loss = -(torch.stack(log_probs) * returns).sum()",
        "    optimizer.zero_grad(); loss.backward(); optimizer.step()",

    // ─────────────────────────────────────────────────────
    function PolicyBars({ bars }) {
      if (!bars) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-violet-900">📊 {bars.title}</div>
            {bars.reward && (
              <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded border ${bars.reward.tone === 'good' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-red-50 border-red-300 text-red-800'}`}>
                {bars.reward.label} {bars.reward.value}
              </span>
            )}
          </div>
          <div className="space-y-2">
            {bars.actions.map((a) => (
              <div key={a.name}>
                <div className="flex items-center justify-between text-[10px] mb-0.5">
                  <span className="text-slate-700 font-bold">{a.name}</span>
                  <span className="font-mono text-slate-600">
                    p={a.prob.toFixed(2)}
                    {a.delta !== 0 && (
                      <span className={`ml-1 font-bold ${a.delta > 0 ? 'text-emerald-600' : 'text-red-600'}`}>
                        {a.delta > 0 ? '▲' : '▼'}{Math.abs(a.delta).toFixed(2)}
                      </span>
                    )}
                  </span>
                </div>
                <div className="h-3 rounded-full bg-violet-100 overflow-hidden">
                  <div
                    className={`h-full transition-all duration-700 ${a.delta > 0 ? 'bg-emerald-500' : a.delta < 0 ? 'bg-red-400' : 'bg-violet-400'}`}
                    style={{ width: `${a.prob * 100}%` }}
                  />
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-600">{bars.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────

    function LimitBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">🧱 {box.title}</div>
          <div className="space-y-2">
            {box.walls.map((w) => (
              <div key={w.name} className="rounded border border-red-200 bg-white px-2 py-1.5 flex items-start gap-2">
                <span className="text-base">{w.icon}</span>
                <div className="min-w-0 flex-1">
                  <div className="text-[11px] font-bold text-slate-800">{w.name}</div>
                  <div className="text-[10px] text-slate-600">{w.detail}</div>
                </div>
                <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-800 whitespace-nowrap">{w.verdict}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 rounded border-2 border-violet-400 bg-violet-50 px-2 py-1.5 text-[10px] text-violet-900">
            <span className="font-bold">해법 → </span>{box.answer}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────

    function AdvBox({ box }) {
      if (!box) return null;
      const max = 150;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-1">📉 {box.title} — baseline V(s) = {box.baseline}</div>
          <div className="space-y-1.5 mt-2">
            {box.rows.map((r) => {
              const adv = r.g - box.baseline;
              return (
                <div key={r.ep} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono text-slate-600 w-9">{r.ep}</span>
                  <div className="relative flex-1 h-3 rounded bg-white border border-amber-200 overflow-hidden">
                    <div className="absolute inset-y-0 border-l-2 border-dashed border-slate-500" style={{ left: `${(box.baseline / max) * 100}%` }} />
                    <div className={`h-full transition-all duration-700 ${adv >= 0 ? 'bg-emerald-400' : 'bg-red-400'}`} style={{ width: `${(r.g / max) * 100}%` }} />
                  </div>
                  <span className={`text-[10px] font-mono font-bold w-14 text-right ${adv >= 0 ? 'text-emerald-700' : 'text-red-700'}`}>A={adv > 0 ? '+' : ''}{adv}</span>
                  <span className="text-[9px] text-amber-900 w-40 truncate hidden sm:inline">{r.note}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — Actor-Critic 구조도
    // ─────────────────────────────────────────────────────
    function ACDiagram({ box }) {
      if (!box) return null;
      const Card = ({ data, tone }) => (
        <div className={`flex-1 rounded-lg border-2 p-2 ${tone === 'actor' ? 'border-violet-500 bg-violet-50' : 'border-sky-500 bg-sky-50'}`}>
          <div className={`text-[11px] font-bold ${tone === 'actor' ? 'text-violet-900' : 'text-sky-900'}`}>{tone === 'actor' ? '🎭' : '🧮'} {data.name}</div>
          <div className="text-[10px] text-slate-700 mt-0.5">{data.role}</div>
          <div className={`text-[9px] mt-1 px-1.5 py-0.5 rounded bg-white border ${tone === 'actor' ? 'border-violet-300 text-violet-800' : 'border-sky-300 text-sky-800'}`}>{data.update}</div>
        </div>
      );
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🎭 {box.title}</div>
          <div className="rounded border-2 border-slate-400 bg-slate-50 px-2 py-1 text-[10px] text-center font-bold text-slate-700 mb-1">
            🌍 {box.env}
          </div>
          <div className="flex justify-around text-[10px] text-slate-500 mb-1">
            <span>state·reward ▼</span>
            <span>▲ action</span>
          </div>
          <div className="flex gap-2 items-stretch">
            <Card data={box.actor} tone="actor" />
            <div className="flex flex-col items-center justify-center text-[9px] text-slate-500">
              <span>◀ A=G-V</span>
              <span className="text-lg text-violet-500">⇄</span>
              <span>평가 제공</span>
            </div>
            <Card data={box.critic} tone="critic" />
          </div>
          <div className="mt-2 text-[10px] text-violet-900">Actor는 "무엇을 할지", Critic은 "그게 평균 대비 얼마나 좋았는지" — 분업이 분산을 죽인다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — PPO 클리핑 곡선 (SVG)
    // ─────────────────────────────────────────────────────
    function PPOClipChart({ box }) {
      if (!box) return null;
      const W = 300, H = 130, pad = 26;
      const eps = box.epsilon;
      // x: ratio 0.6 ~ 1.6  /  y: 목적값 (A>0 기준, A=1로 정규화)
      const rMin = 0.6, rMax = 1.6;
      const x = (r) => pad + ((r - rMin) / (rMax - rMin)) * (W - pad - 8);
      const y = (v) => H - pad - ((v - 0.5) / (1.3 - 0.5)) * (H - pad - 10);
      const clipped = (r) => Math.min(r, 1 + eps); // A>0: 위쪽만 클리핑
      const pts = [];
      for (let r = rMin; r <= rMax + 0.001; r += 0.05) pts.push(r);
      const lineOf = (fn) => pts.map((r, i) => `${i === 0 ? 'M' : 'L'}${x(r).toFixed(1)},${y(fn(r)).toFixed(1)}`).join(' ');
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-1">✂️ {box.title}</div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="PPO 클리핑 곡선 — ratio 1+ε 이후 목적 함수가 평평해진다">
            {/* 축 */}
            <line x1={pad} y1={H - pad} x2={W - 4} y2={H - pad} stroke="#8a8578" strokeWidth="1" />
            <line x1={pad} y1={6} x2={pad} y2={H - pad} stroke="#8a8578" strokeWidth="1" />
            <text x={W - 8} y={H - pad + 12} fontSize="8" fill="#57534a" textAnchor="end">ratio = πnew/πold</text>
            <text x={pad - 4} y={12} fontSize="8" fill="#57534a" textAnchor="end">목적</text>
            {/* 기준선 ratio=1, 1±ε */}
            {[1, 1 - eps, 1 + eps].map((r, i) => (
              <g key={i}>
                <line x1={x(r)} y1={10} x2={x(r)} y2={H - pad} stroke={i === 0 ? '#8a8578' : '#f59e0b'} strokeWidth="1" strokeDasharray="3,3" />
                <text x={x(r)} y={H - pad + 10} fontSize="8" fill={i === 0 ? '#57534a' : '#b45309'} textAnchor="middle">{r.toFixed(1)}</text>
              </g>
            ))}
            {/* 클리핑 없는 목적 (점선 회색) */}
            <path d={lineOf((r) => r)} fill="none" stroke="#9ca3af" strokeWidth="1.5" strokeDasharray="4,3" />
            {/* 클리핑된 목적 (violet 실선) */}
            <path d={lineOf(clipped)} fill="none" stroke="#7c3aed" strokeWidth="2.5" />
            {/* 평평 구간 강조 */}
            <rect x={x(1 + eps)} y={10} width={W - 8 - x(1 + eps)} height={H - pad - 10} fill="#fde68a" opacity="0.35" />
            <text x={x(1 + eps) + 6} y={26} fontSize="8" fill="#92400e">경사 = 0</text>
            <text x={x(1 + eps) + 6} y={36} fontSize="8" fill="#92400e">더 못 민다</text>
            <text x={x(0.78)} y={y(0.83)} fontSize="8" fill="#6b7280">클리핑 없음(위험)</text>
            <text x={x(1.02)} y={y(1.24)} fontSize="8" fill="#7c3aed" fontWeight="bold">PPO 목적</text>
          </svg>
          <div className="mt-1 text-[10px] text-slate-600">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — RLHF 3단계 파이프라인
    // ─────────────────────────────────────────────────────
    function RLHFPipeline({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-500 bg-white p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🤖 {box.title}</div>
          <div className="space-y-1">
            {box.stages.map((s, i) => (
              <React.Fragment key={s.no}>
                {i > 0 && <div className="text-center text-[10px] text-violet-400">▼</div>}
                <div className="rounded-lg border-2 border-violet-300 bg-violet-50 px-2.5 py-1.5">
                  <div className="flex items-center gap-1.5">
                    <span className="text-sm font-bold text-violet-700">{s.no}</span>
                    <span className="text-[11px] font-bold text-violet-900">{s.name}</span>
                    <span className="ml-auto text-[9px] font-mono px-1.5 py-0.5 rounded bg-white border border-violet-300 text-violet-800">{s.out}</span>
                  </div>
                  <div className="text-[10px] text-slate-700 mt-0.5">{s.detail}</div>
                </div>
              </React.Fragment>
            ))}
          </div>
          <div className="mt-2 flex flex-wrap gap-1.5">
            {box.links.map((l) => (
              <span key={l} className="text-[9px] px-2 py-0.5 rounded-full bg-fuchsia-50 border border-fuchsia-300 text-fuchsia-800">🔗 {l}</span>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 가치 기반 vs 정책 기반 선택표
    // ─────────────────────────────────────────────────────
    function CompareBox({ box }) {
      if (!box) return null;
      const toneOf = (v) => v.startsWith('◎') ? 'text-emerald-700' : v.startsWith('✗') ? 'text-red-700' : 'text-slate-500';
      return (
        <div className="mt-3 rounded-xl border-2 border-violet-500 bg-gradient-to-br from-violet-50 to-emerald-50 p-3">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xl">⚖️</span>
            <span className="text-sm font-bold text-violet-900">{box.title}</span>
          </div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-violet-900 border-b-2 border-violet-300">
                <th className="text-left py-1">상황</th>
                <th className="text-left py-1 pl-2 w-24">가치 기반(Q)</th>
                <th className="text-left py-1 pl-2 w-24">정책 기반</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.crit} className="border-t border-violet-200">
                  <td className="py-1 text-slate-800">{r.crit}</td>
                  <td className={`py-1 pl-2 font-bold ${toneOf(r.value)}`}>{r.value}</td>
                  <td className={`py-1 pl-2 font-bold ${toneOf(r.policy)}`}>{r.policy}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-violet-50',  border: 'border-violet-300',  text: 'text-violet-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 정책 학습 시뮬레이션 (violet 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      limit:     { icon: '🧱', label: 'Q의 한계' },
      reinforce: { icon: '🔁', label: 'REINFORCE' },
      ac:        { icon: '🎭', label: 'Actor-Critic' },
      ppo:       { icon: '✂️', label: 'PPO' },
      rlhf:      { icon: '🤖', label: 'RLHF' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.limit;
      return (
        <div className="rounded-xl border border-violet-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-violet-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>정책 학습실 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-violet-700 font-mono mb-1 px-2 py-1 rounded bg-violet-50 border border-violet-200">
            핵심 수식: {state.engineDetail}
          </div>
          <LimitBox box={state.limitBox} />
          <PolicyBars bars={state.policyBars} />
          <AdvBox box={state.advBox} />
          <ACDiagram box={state.acDiagram} />
          <PPOClipChart box={state.ppoClip} />
          <RLHFPipeline box={state.rlhf} />
          <CompareBox box={state.compareBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-violet-400/15 border-l-2 border-violet-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-violet-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-violet-600 text-white font-bold">ML</span>
              <div>
                <h1 className="text-2xl font-bold text-violet-900">IV-2-2. 정책 경사·PPO — RLHF까지</h1>
                <p className="text-sm text-violet-800/80">가치를 거치지 않고 정책을 직접 배우기 — ChatGPT를 만든 알고리즘의 정체</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-violet-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-violet-500' : 'bg-violet-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-violet-800 text-violet-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-violet-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-violet-800 text-white' : 'bg-violet-600 text-white hover:bg-violet-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-violet-400 bg-white text-violet-800 hover:bg-violet-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-violet-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-violet-500 bg-white px-4 py-3 text-sm text-violet-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                정책 경사는 "좋았던 행동의 확률을 보상만큼 올려라"는 한 문장에서 출발한다(REINFORCE).
                원시 보상의 요동은 baseline을 빼서 Advantage로 다스리고(Actor-Critic),
                정책 붕괴는 ratio 클리핑으로 한 걸음의 크기를 제한해 막는다(PPO).
                그 안정성 덕분에 PPO는 사람 선호 → 보상 모델 → LLM 미세조정이라는 RLHF 파이프라인의 심장이 되었다 — ChatGPT가 지시를 따르는 이유다.
                연속 행동·확률 전략·LLM 정렬에는 정책 기반, 이산·소수 행동에는 가치 기반이 기본 선택이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['정책경사', 'REINFORCE', 'logprob', 'Advantage', 'baseline', 'ActorCritic', 'PPO', '클리핑', 'RLHF', '보상모델', 'KL페널티', 'ChatGPT'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-violet-100 text-violet-900 border border-violet-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-violet-800">
              <a href="./IV-2-1.html" className="underline hover:no-underline">← 이전: IV-2-1</a>
              <a href="../index.html" className="underline hover:no-underline">챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
