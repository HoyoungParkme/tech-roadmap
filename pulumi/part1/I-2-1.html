      cloud:  'bg-purple-100 text-purple-800 border-purple-300',
      urn:    'bg-indigo-100 text-indigo-800 border-indigo-300',
      out:    'bg-teal-100 text-teal-800 border-teal-300',
      dep:    'bg-amber-100 text-amber-800 border-amber-300',
      secret: 'bg-rose-100 text-rose-800 border-rose-300',

      blockB: 'bg-rose-100 text-rose-800 border-rose-300',
    };

    // 코드 → state → backend 파이프라인
    function StateFlow({ flow }) {
      const active = new Set(flow || []);
      const stages = [
        { id: 'code',    icon: '📝', label: '코드 (desired)' },
        { id: 'state',   icon: '🗂️', label: 'state 기록' },
        { id: 'backend', icon: '🔐', label: 'backend 저장' },
      ];
      return (
        <div className="flex items-stretch gap-1">
          {stages.map((s, i) => {
            const on = active.has(s.id);
            return (
              <React.Fragment key={s.id}>
                <div className={`flex-1 rounded-lg border-2 p-2 text-center transition ${on ? 'bg-purple-50 border-purple-400' : 'bg-slate-50 border-slate-200 opacity-50'}`}>
                  <div className="text-lg">{s.icon}</div>
                  <div className={`text-[10px] font-bold mt-0.5 ${on ? 'text-purple-800' : 'text-slate-400'}`}>{s.label}</div>
                </div>
                {i < stages.length - 1 && (
                  <div className={`flex items-center text-lg ${active.has(stages[i + 1].id) ? 'text-purple-500' : 'text-slate-300'}`}>&rarr;</div>
                )}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    // backend 옵션 비교 카드
    function BackendCards({ backends }) {
      if (!backends || backends.length === 0) {
        return (
          <div className="mt-3 rounded-lg border border-dashed border-purple-300 bg-purple-50/40 p-4 text-center text-xs text-purple-700">
            아직 backend 선택 전 — 다음 step 에서 고른다
          </div>
        );
      }
      return (
        <div className="mt-3 space-y-1.5">
          <div className="text-[11px] font-bold text-purple-800">backend 옵션 (state 저장소)</div>
          {backends.map((b) => (
            <div
              key={b.id}
              className={`flex items-center gap-2 rounded-lg border-2 px-2.5 py-1.5 ${b.selected ? 'bg-purple-50 border-purple-400' : 'bg-white border-slate-200'}`}
            >
              <span className="text-base">{b.icon}</span>
              <div className="min-w-0">
                <div className="flex items-center gap-1.5">
                  <span className={`text-xs font-bold ${b.selected ? 'text-purple-900' : 'text-slate-700'}`}>{b.name}</span>
                  {b.selected && <span className="text-[9px] px-1 py-0.5 rounded bg-purple-200 text-purple-800 font-bold">선택됨</span>}
                </div>
                <div className="text-[10px] text-slate-500 font-mono">{b.kind}</div>
              </div>
              <span className="ml-auto text-[10px] text-slate-500 text-right max-w-[42%]">{b.note}</span>
            </div>
          ))}
        </div>
      );
    }

    // state 에 담기는 항목
    function StateRecord({ record }) {
      if (!record || record.length === 0) return null;
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">state 기록 내용</div>
          <div className="space-y-1">
            {record.map((r, i) => (
              <div key={i} className="flex items-start gap-2 rounded px-2 py-1 border border-slate-100 bg-slate-50/60">
                <span className={`text-[10px] px-1.5 py-0.5 rounded border font-bold shrink-0 ${TAG_STYLE[r.tag] || TAG_STYLE.none}`}>{r.label}</span>
                <span className="text-[10px] font-mono text-slate-700 break-all">{r.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // state 잠금 상태
    function LockStatus({ lock }) {
      if (!lock || !lock.active) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-rose-300 bg-rose-50 p-2.5">
          <div className="text-[11px] font-bold text-rose-800 mb-1.5 flex items-center gap-1">🔒 state 잠금 활성</div>
          <div className="flex items-center gap-2 text-[11px] mb-1">
            <span className="px-1.5 py-0.5 rounded bg-emerald-200 text-emerald-800 font-bold">잠금 보유</span>
            <span className="font-mono text-slate-700">{lock.holder}</span>
            <span className="text-emerald-700">→ 배포 진행 중</span>
          </div>
          {lock.blocked && (
            <div className="flex items-center gap-2 text-[11px]">
              <span className="px-1.5 py-0.5 rounded bg-rose-200 text-rose-800 font-bold">차단됨</span>
              <span className="font-mono text-slate-700">{lock.blocked}</span>
              <span className="text-rose-700">⛔ 동시 배포 거부</span>
            </div>
          )}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">state / backend 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 도메인 상태</span>
          </div>
          <StateFlow flow={state.flow} />
          <BackendCards backends={state.backends} />
          <StateRecord record={state.record} />
          <LockStatus lock={state.lock} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">I</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">I-2-1. state 와 backend — Pulumi 상태 관리</h1>
                <p className="text-sm text-purple-800/80">state = 배포된 실제의 기록 · backend = 그 기록의 저장소 · 잠금으로 동시 배포 방지 · export/import 로 백업·이전</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                state 는 desired(코드) 와 actual(실제) 을 비교하는 기준이고, URN · 출력 · 의존성 그래프 · 암호화된 secret 을 담는다. backend 는 그 state 의 저장소로 Pulumi Cloud(기본, 무료) · 셀프 매니지드(S3/GCS/Azure Blob) · 로컬 파일 중 pulumi login 으로 고른다. 원격 backend 는 state 잠금으로 동시 배포를 막아 팀 작업에 필수이며, checkpoint 로 중단 안전, stack export/import 로 백업·이전·수리를 한다. 다음 (I-2-2) 에서는 stack 과 config 로 dev/prod 환경을 나누는 법을 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['state', 'backend', 'pulumi login', 'Pulumi Cloud', 'S3 backend', 'state lock', 'URN', 'secret 암호화', 'stack export/import', 'checkpoint'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 챕터 목록</a>
              <div className="flex gap-4">
                <a href="./I-1-2.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: I-1-2</a>
                <a href="./I-2-2.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: I-2-2 stack 과 config →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
