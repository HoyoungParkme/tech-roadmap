          program: { name: 'my-infra', lang: 'typescript', file: 'index.ts', resources: 3 },
          stacks: [
            { name: 'dev', region: 'ap-northeast-2', size: 'small', selected: false, state: 'cloud://my-org/my-infra/dev' },
            { name: 'staging', region: 'ap-northeast-2', size: 'medium', selected: false, state: 'cloud://my-org/my-infra/staging' },
            { name: 'prod', region: 'ap-northeast-2', size: 'large', selected: true, state: 'cloud://my-org/my-infra/prod' },
          ],
          resources: [
            { id: 'my-infra-prod-logs',    type: 'aws:s3/Bucket',       stack: 'prod', status: '✓' },
            { id: 'my-infra-prod-jobs',    type: 'aws:sqs/Queue',       stack: 'prod', status: '✓' },
            { id: 'my-infra-prod-worker',  type: 'aws:lambda/Function', stack: 'prod', status: '✓' },
          ],
        },
        summary: {
          title: '핵심 3대 개념 정리',
          items: [
            'program — index.ts / __main__.py 등 코드 파일. 인프라 명세서.',
            'stack — 같은 program 의 배포 인스턴스 (dev/staging/prod). 별도 state, 별도 config.',
            'resource — 실제 클라우드 객체. URN 으로 추적, stack 마다 독립.',
            '관계 — 1 program × N stack = N×M resource. DRY 코드 + 격리 환경.',
          ],
        },
        alert: { tone: 'good', text: '코드 모델이 UI 에 그대로 보인다. 다음 챕터: 언어별 SDK (TS / Python / Go / .NET).' },
        code: {
          lang: 'plaintext',
          filename: 'pulumi-cloud-ui.md',
          lines: [
            '# Pulumi Cloud UI — 3대 개념의 시각적 매핑',
            '',
            '## URL 구조',
            '   https://app.pulumi.com/<org>/<project>/<stack>',
            '   https://app.pulumi.com/my-org/my-infra/prod',
            '              └─ org    └─ project   └─ stack',
            '              조직       program       배포 인스턴스',
            '',
            '## UI 화면 트리',
            '',
            '   Organization: my-org',
            '   └─ Project: my-infra              ← program (코드)',
            '      ├─ Stack: dev                  ← stack 1',
            '      │  ├─ Resources (6)            ← resource 그룹',
            '      │  │  ├─ aws:s3:Bucket "bucket-logs"',
            '      │  │  ├─ aws:sqs:Queue "queue-jobs"',
            '      │  │  ├─ aws:iam:Role "fn-worker-role"',
            '      │  │  ├─ aws:iam:RolePolicy "fn-worker-policy"',
            '      │  │  └─ aws:lambda:Function "fn-worker"',
            '      │  ├─ Outputs                  ← export 값들',
            '      │  ├─ History (12 updates)     ← update 이력 (git 처럼)',
            '      │  └─ Settings (RBAC, secret)',
            '      ├─ Stack: staging              ← stack 2 (동일 구조)',
            '      └─ Stack: prod                 ← stack 3 (동일 구조)',
            '',
            '## 각 화면이 보여주는 것',
            '',
            '| UI 메뉴       | 의미                              | CLI 대응                  |',
            '|:--------------|:----------------------------------|:--------------------------|',
            '| Resources     | 현재 state 의 모든 리소스          | pulumi stack export       |',
            '| Outputs       | export const 로 노출한 값          | pulumi stack output       |',
            '| History       | update 이력 (누가/언제/무엇)       | pulumi history            |',
            '| Settings      | 멤버 권한, secret provider 설정   | pulumi stack init/rm      |',
            '',
            '## 협업 흐름',
            '',
            '   1. 개발자 A — index.ts 수정 + git push',
            '   2. CI — pulumi preview --stack dev 실행',
            '   3. 리뷰어 B — Pulumi Cloud 에서 preview 결과 확인',
            '   4. 승인 후 pulumi up --stack dev 자동 실행',
            '   5. History 에 update 기록 (commit SHA + 변경 리소스)',
            '',
            '## 정리 — Pulumi 가 IaC 를 "프로그램" 으로 다루는 이유',
            '',
            '   - 일반 언어 → 일반 도구(에디터, 디버거, 테스트)가 그대로 쓰임',
            '   - 추상화 자유도 → 함수, 클래스, 패키지로 리소스 묶음',
            '   - 타입 안전 → IDE 가 잘못된 속성을 빨갛게 표시',
            '   - 동일한 정신 모델 → "코드를 짜듯 인프라를 짠다"',
            '',
            '# → 다음: I-1-2. 언어별 SDK (TS / Python / Go / .NET)',
          ],
          highlight: [3, 4, 5, 11, 12, 13, 14, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 41, 42, 43, 44, 45],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 시각화 — program / stack / resource 트리
    // ─────────────────────────────────────────────────────
    function ProgramCard({ program, view }) {
      const dim = view !== 'program';
      return (
        <div className={`rounded-lg border-2 p-3 transition ${dim ? 'opacity-60 border-purple-200 bg-white' : 'border-purple-500 bg-purple-50 shadow'}`}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-lg">📄</span>
            <span className="text-xs font-bold" style={{color:'#5C2266'}}>program</span>
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded font-mono" style={{background:'#8A3391',color:'white'}}>
              {program.lang}
            </span>
          </div>
          <div className="text-sm font-bold text-slate-800">{program.name}</div>
          <div className="text-[10px] text-slate-500 font-mono mt-1">{program.file}</div>
          <div className="text-[10px] mt-2" style={{color:'#8A3391'}}>리소스 정의: {program.resources}개</div>
        </div>
      );
    }

    function StackCard({ stack, view }) {
      const isFocus = view === 'stacks' || view === 'matrix' || view === 'cloud';
      const isSelected = stack.selected;
      const borderColor = isSelected ? '#8A3391' : (isFocus ? '#C49AD0' : '#E5D4EA');
      const bgColor = isSelected ? '#F5EBF6' : 'white';
      return (
        <div className="rounded-lg border-2 p-2 transition" style={{borderColor, background:bgColor}}>
          <div className="flex items-center gap-1 mb-1">
            <span className="text-sm">{isSelected ? '▶' : '○'}</span>
            <span className="text-xs font-bold text-slate-800">{stack.name}</span>
            {isSelected && <span className="ml-auto text-[9px] px-1.5 py-0.5 rounded font-mono" style={{background:'#8A3391',color:'white'}}>selected</span>}
          </div>
          <div className="text-[10px] text-slate-600 font-mono">region: {stack.region}</div>
          <div className="text-[10px] text-slate-600 font-mono">size: {stack.size}</div>
          <div className="text-[9px] text-slate-400 font-mono mt-1 truncate">{stack.state}</div>
        </div>
      );
    }

    function ResourceRow({ res }) {
      const stackColor = {
        dev: '#7E9CC6',
        staging: '#C9A24B',
        prod: '#8A3391',
        '—': '#94a3b8',
      }[res.stack] || '#8A3391';
      return (
        <tr>
          <td className="px-2 py-1 text-[10px] font-mono text-slate-700 border" style={{borderColor:'#E5D4EA'}}>{res.id}</td>
          <td className="px-2 py-1 text-[10px] font-mono text-slate-600 border" style={{borderColor:'#E5D4EA'}}>{res.type}</td>
          <td className="px-2 py-1 text-[10px] font-bold border text-white text-center" style={{borderColor:'#E5D4EA',background:stackColor}}>
            {res.stack}
          </td>
          <td className="px-2 py-1 text-[10px] border" style={{borderColor:'#E5D4EA'}}>{res.status}</td>
        </tr>
      );
    }

    function SummaryBox({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 p-4" style={{borderColor:'#8A3391',background:'linear-gradient(135deg,#F5EBF6,#EADEF0)'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🟣</span>
            <span className="text-lg font-bold" style={{color:'#5C2266'}}>{summary.title}</span>
          </div>
          <ul className="space-y-1.5">
            {summary.items.map((s, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#5C2266'}}>
                <span style={{color:'#8A3391'}}>✓</span>
                <span>{s}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#F5EBF6', border: '#C49AD0', text: '#5C2266', icon: '💡' },
      warn:   { bg: '#FEF3C7', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEE2E2', border: '#F87171', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#D1FAE5', border: '#34D399', text: '#065F46', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2"
             style={{background:s.bg,borderColor:s.border,color:s.text}}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const { tree, view, actor } = state;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{borderColor:'#D9BCE0'}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#5C2266'}}>program / stack / resource</h3>
            <span className="text-[10px] text-slate-500">{actor}</span>
          </div>

          {/* program */}
          <ProgramCard program={tree.program} view={view} />

          {/* stacks */}
          {tree.stacks.length > 0 && (
            <div className="mt-3">
              <div className="text-[10px] font-bold mb-1.5" style={{color:'#5C2266'}}>stacks ({tree.stacks.length})</div>
              <div className="grid grid-cols-3 gap-2">
                {tree.stacks.map((s) => <StackCard key={s.name} stack={s} view={view} />)}
              </div>
            </div>
          )}

          {/* resources */}
          {tree.resources.length > 0 && (
            <div className="mt-3 flex-1 overflow-auto">
              <div className="text-[10px] font-bold mb-1.5" style={{color:'#5C2266'}}>resources ({tree.resources.length})</div>
              <table className="w-full border-collapse">
                <thead>
                  <tr className="text-[10px]" style={{color:'#5C2266'}}>
                    <th className="text-left px-2 py-1 border" style={{borderColor:'#E5D4EA',background:'#F5EBF6'}}>name</th>
                    <th className="text-left px-2 py-1 border" style={{borderColor:'#E5D4EA',background:'#F5EBF6'}}>type</th>
                    <th className="text-left px-2 py-1 border" style={{borderColor:'#E5D4EA',background:'#F5EBF6'}}>stack</th>
                    <th className="text-left px-2 py-1 border" style={{borderColor:'#E5D4EA',background:'#F5EBF6'}}>status</th>
                  </tr>
                </thead>
                <tbody>
                  {tree.resources.map((r, i) => <ResourceRow key={i} res={r} />)}
                </tbody>
              </table>
            </div>
          )}

          <SummaryBox summary={state.summary} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 CodeViewer
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                    style={isHi ? {background:'rgba(138,51,145,0.18)',borderColor:'#C49AD0'} : {}}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#F5EBF6 0%,#EADEF0 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:'#8A3391'}}>P</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#5C2266'}}>I-1-1. program / stack / resource — Pulumi 3대 개념</h1>
                <p className="text-sm" style={{color:'#8A3391'}}>코드 한 벌(program) × 환경 N개(stack) = 클라우드 객체 N×M개(resource)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:'#8A3391'}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{background: i <= stepIdx ? '#8A3391' : '#D9BCE0'}}
                />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow" style={{background:'#5C2266',color:'#F5EBF6'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{color:'#EADEF0'}}>{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-purple-50"
                style={{borderColor:'#C49AD0',color:'#8A3391'}}
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-purple-50 disabled:opacity-40"
                style={{borderColor:'#C49AD0',color:'#8A3391'}}
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{background: playing ? '#5C2266' : '#8A3391'}}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border bg-white hover:bg-purple-50 disabled:opacity-40"
                style={{borderColor:'#C49AD0',color:'#8A3391'}}
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#8A3391'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{borderColor:'#8A3391',color:'#5C2266'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Pulumi 의 3대 개념 — program(코드) / stack(배포 인스턴스) / resource(실제 객체) — 은 "코드 한 벌을 환경 N개에 배포하면 N×M개의 리소스가 생긴다" 로 요약된다. Terraform 의 workspace 와 비슷하지만 stack 이 더 1급 시민이고, 코드는 일반 TS/Python 그대로다. 다음 챕터에서 언어별 SDK 의 모습을 살펴본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Pulumi', 'program', 'stack', 'resource', 'URN', 'TypeScript', 'IaC', 'PulumiCloud'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{background:'#F5EBF6',color:'#5C2266',borderColor:'#D9BCE0'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:'#8A3391'}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
