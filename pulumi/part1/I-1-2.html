  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

      setTimeout(focusFirst, 500);
    });

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 언어 탭 + 4언어→동일 인프라 수렴 뷰

    function LangTabs({ variants, activeId, onSelect }) {
      return (
        <div className="flex flex-wrap gap-1.5">
          {variants.map((v) => {
            const m = LANG_META[v.id];
            const active = v.id === activeId;
            return (
              <button
                key={v.id}
                onClick={() => onSelect(v.id)}
                aria-pressed={active}
                className={`flex items-center gap-1 px-2.5 py-1 rounded-full text-xs border transition ${active ? 'bg-purple-700 text-white border-purple-700' : 'bg-white text-slate-600 border-slate-300 hover:border-purple-300'}`}
              >
                <span>{m.icon}</span>
                <span className="font-semibold">{m.name}</span>
              </button>
            );
          })}
        </div>
      );
    }

    function ActiveLangCard({ variant }) {
      const m = LANG_META[variant.id];
      return (
        <div className={`mt-3 rounded-lg border-2 p-3 ${m.badge}`}>
          <div className="flex items-center gap-2 mb-1.5">
            <span className="text-lg">{m.icon}</span>
            <span className={`text-sm font-bold ${m.cls}`}>{m.name}</span>
            <span className="ml-auto text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/70 text-slate-700">runtime: {m.runtime}</span>
          </div>
          <div className="text-[11px] font-mono text-slate-700">{variant.file} · {variant.pkg}</div>
          <div className="text-xs text-slate-700 mt-1.5">{variant.summary}</div>
        </div>
      );
    }

    function ConvergeBox({ converge }) {
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-3">
          <div className="flex items-center gap-1.5 mb-2">
            {LANG_ORDER.map((id) => (
              <span key={id} className="text-base" title={LANG_META[id].name}>{LANG_META[id].icon}</span>
            ))}
            <span className="mx-1 text-purple-500 font-bold">&rarr;</span>
            <span className="text-[11px] font-bold text-purple-800">{converge.label}</span>
          </div>
          <div className="space-y-1">
            {converge.items.map((it, i) => (

    function LiveDataPane({ state, activeId, onSelect }) {
      const variant = state.variants.find((v) => v.id === activeId) || state.variants[0];
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">언어별 SDK 비교 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">탭 = 언어 전환</span>
          </div>
          <LangTabs variants={state.variants} activeId={variant.id} onSelect={onSelect} />
          <ActiveLangCard variant={variant} />
          <ConvergeBox converge={state.converge} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer — 파일 탭 (언어별) + highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ variants, activeId, onSelect, stepIdx, total }) {
      const variant = variants.find((v) => v.id === activeId) || variants[0];
      const code = variant;
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [activeId, stepIdx]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          {/* 파일 탭 */}
          <div className="flex items-center gap-1 px-2 pt-2 bg-slate-900 border-b border-slate-700 overflow-x-auto">
            {variants.map((v) => {
              const active = v.id === activeId;
              return (
                <button
                  key={v.id}
                  onClick={() => onSelect(v.id)}
                  aria-pressed={active}
                  className={`flex items-center gap-1 px-3 py-1.5 text-xs font-mono rounded-t whitespace-nowrap ${active ? 'bg-[#282c34] text-slate-100 border-t border-x border-slate-700' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                >
                  <span>{LANG_META[v.id].icon}</span>
                  <span>{v.file}</span>
                </button>
              );
            })}
            <span className="ml-auto pr-2 text-[10px] text-slate-500">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines · {LANG_META[code.id].name}</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [activeId, setActiveId] = useState('ts');
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">I</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">I-1-2. 언어별 SDK — TypeScript / Python / Go / .NET</h1>
                <p className="text-sm text-purple-800/80">범용 언어로 IaC · 같은 인프라를 4개 언어로 · SDK 패키지 · 런타임 선택 · 실무 언어 선택</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">&larr; 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} activeId={activeId} onSelect={setActiveId} />
              <CodeViewer variants={step.variants} activeId={activeId} onSelect={setActiveId} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >&larr; 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 &rarr;</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 &larr;/&rarr; · 자동재생 3초/단계 · 언어 탭으로 코드 전환</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Pulumi 는 TypeScript / Python / Go / .NET 같은 범용 언어로 IaC 를 작성한다. 반복·조건·함수·타입을 그대로 쓰고, 같은 인프라를 어떤 언어로 짜도 엔진이 만드는 AWS 리소스와 state 는 동일하다. 언어별로 다른 건 SDK 패키지명(@pulumi/aws · pulumi_aws · pulumi-aws/sdk/v6 · Pulumi.Aws)과 Pulumi.yaml 의 runtime 필드뿐이다. 실무에서는 팀이 잘 쓰는 언어를 고르고, 어떤 언어든 IDE 자동완성·타입 체크의 이점을 누린다. 다음 (I-2-1) 에서는 프로젝트·스택·state 의 개념을 본다.
              </div>
            )}

            {/* 키워드 */}
