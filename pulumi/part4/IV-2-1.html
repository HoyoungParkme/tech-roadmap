    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Pulumi IV-2-1 — CrossGuard: Policy as Code
    학습 목표: 배포 전에 리소스가 조직 정책을 지키는지 검증하고 위반이면 배포를 차단하는 가드레일 5단계
    핵심 비유: 공항 보안검색대 — advisory 는 "주의" 경고, mandatory 는 통과 금지(게이트 차단)
    패턴: fastapi v1 — 좌(LiveDataPane: 리소스가 정책 게이트를 통과/위반하는 흐름) / 우(VSCode CodeViewer TypeScript)
    색상: purple #8A3391 (Pulumi 브랜드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — CrossGuard Policy as Code
    //   policies  : 활성 정책 [{ name, level, rule }]
    //   resources : 검사 대상 [{ id, type, name, checks:[{policy, result}] }]
    //   gate      : 배포 게이트 상태 'pending' | 'open' | 'blocked'
    //   keyPoint  : 한 줄 정리
    //   code      : 우측 CodeViewer 탭
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 왜 Policy as Code 인가 — 배포 전 가드레일',
        desc: '리소스를 만들 수 있다는 것과 만들어도 된다는 것은 다르다. 누군가 S3 버킷을 암호화 없이, 태그 없이, 혹은 초대형 인스턴스로 올리면 컴플라이언스·비용·보안 사고가 된다. 사람이 PR 리뷰로 잡기엔 놓치기 쉽다. CrossGuard 는 이 규칙을 코드로 적어 두고 pulumi preview/up 이 돌 때마다 자동으로 검사한다. 통과하면 배포, 위반이면 경고하거나 아예 차단한다. 즉 배포 파이프라인 앞단의 보안검색대다.',
        policies: [],
        resources: [
          { id: 'r1', type: 'aws:s3:BucketV2', name: 'user-uploads', checks: [] },
          { id: 'r2', type: 'aws:ec2:Instance', name: 'batch-worker', checks: [] },
        ],
        gate: 'pending',
        keyPoint: 'Policy as Code = 조직 규칙을 코드로 적고 배포 전에 자동 검증. CrossGuard 가 그 엔진.',
        code: {
          lang: 'bash',
          filename: 'setup.sh',
          lines: [
            '# CrossGuard 는 "Policy Pack" 단위로 관리한다',
            '# 정책 팩 하나 = 여러 개의 규칙(정책) 묶음',
            '',
            '$ mkdir compliance-policies && cd compliance-policies',
            '$ pulumi policy new aws-typescript   # 템플릿 생성',
            '',
            '# 생성되는 구조',
            '#   index.ts        ← 정책들을 정의하는 곳',
            '#   PulumiPolicy.yaml',
            '#   package.json',
            '',
            '# 스택에 정책 팩을 붙여서 preview 실행',
            '$ pulumi preview --policy-pack ../compliance-policies',
            '',
            '# 앞으로 이 스택의 모든 배포는 정책 검사를 통과해야 한다.',
            '# 규칙 예시:',
            '#   1) S3 는 반드시 서버사이드 암호화',
            '#   2) 모든 리소스에 team 태그 필수',
            '#   3) EC2 인스턴스 타입은 승인된 목록만',
          ],
          highlight: [0, 1, 4, 12, 13],
        },
      },
      {
        title: 'Step 2. Policy Pack 작성 — validateResource',
        desc: '정책은 언어(TypeScript/Python)로 짠다. 가장 흔한 형태가 validateResource — 리소스 하나하나를 받아 속성을 검사하고, 규칙을 어기면 reportViolation 을 호출한다. YAML DSL 이 아니라 진짜 코드라서 조건 분기, 정규식, 외부 데이터 조회까지 마음껏 쓴다. 여기서는 S3 암호화 필수와 team 태그 필수 두 규칙을 만든다. 아직 위반해도 배포는 막지 않는 상태(다음 step 에서 강도를 정한다).',
        policies: [
          { name: 's3-encryption-required', level: 'advisory', rule: 'S3 버킷 서버사이드 암호화 필수' },
          { name: 'require-team-tag', level: 'advisory', rule: '모든 리소스에 team 태그 필수' },
        ],
        resources: [
          { id: 'r1', type: 'aws:s3:BucketV2', name: 'user-uploads', checks: [
            { policy: 's3-encryption-required', result: 'violate' },
            { policy: 'require-team-tag', result: 'pass' },
          ] },
          { id: 'r2', type: 'aws:ec2:Instance', name: 'batch-worker', checks: [
            { policy: 'require-team-tag', result: 'violate' },
          ] },
        ],
        gate: 'pending',
        keyPoint: 'validateResource(리소스 → 검사 → reportViolation). YAML 이 아니라 진짜 코드로 규칙 작성.',
        code: {
          lang: 'typescript',
          filename: 'index.ts',
          lines: [
            'import { PolicyPack, validateResourceOfType } from "@pulumi/policy";',
            'import * as aws from "@pulumi/aws";',
            '',
            'new PolicyPack("compliance-policies", {',
            '  policies: [',
            '    {',
            '      name: "s3-encryption-required",',
            '      description: "S3 버킷은 서버사이드 암호화가 켜져 있어야 한다",',
            '      enforcementLevel: "advisory",',
            '      // 특정 타입만 골라서 검사',
            '      validateResource: validateResourceOfType(',
            '        aws.s3.BucketServerSideEncryptionConfigurationV2,',
            '        (cfg, args, reportViolation) => {',
            '          if (!cfg.rules || cfg.rules.length === 0) {',
            '            reportViolation("암호화 규칙이 설정되지 않았습니다.");',
            '          }',
            '        },',
            '      ),',
            '    },',
            '    {',
            '      name: "require-team-tag",',
            '      description: "모든 리소스에 team 태그가 있어야 한다",',
            '      enforcementLevel: "advisory",',
            '      // 모든 리소스를 받아서 tags 를 검사',
            '      validateResource: (args, reportViolation) => {',
            '        const tags = args.props.tags;',
            '        if (!tags || !tags["team"]) {',
            '          reportViolation("team 태그가 없습니다. 소유 팀을 명시하세요.");',
            '        }',
            '      },',

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — purple #8A3391 톤
    //   리소스가 정책 게이트를 통과/위반하는 흐름
    // ─────────────────────────────────────────────────────
    const LEVEL_STYLE = {
      advisory:  { badge: 'bg-amber-200 text-amber-800', label: 'advisory · 경고' },
      mandatory: { badge: 'bg-red-200 text-red-800',     label: 'mandatory · 차단' },
    };

    const GATE_STYLE = {
      pending: { text: '검사 대기', cls: 'bg-slate-100 border-slate-300 text-slate-600', icon: '⏳' },
      open:    { text: '게이트 OPEN — 배포 허용', cls: 'bg-emerald-50 border-emerald-400 text-emerald-800', icon: '✅' },
      blocked: { text: '게이트 BLOCKED — 배포 차단', cls: 'bg-red-50 border-red-400 text-red-800', icon: '⛔' },
    };

    function PolicyList({ policies }) {
      if (!policies || policies.length === 0) {
        return (
          <div className="rounded-lg border border-dashed border-purple-300 bg-purple-50/40 p-3 text-center text-xs text-purple-700">
            아직 정책 팩 없음 — 다음 step 에서 규칙 작성
          </div>
        );
      }
      return (
        <div className="space-y-1.5">
          {policies.map((p) => {
            const lv = LEVEL_STYLE[p.level] || LEVEL_STYLE.advisory;
            return (
              <div key={p.name} className="rounded-lg border border-purple-200 bg-white px-2.5 py-1.5">
                <div className="flex items-center gap-2">
                  <span className="text-[11px] font-mono font-bold text-purple-800">{p.name}</span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded ml-auto ${lv.badge}`}>{lv.label}</span>
                </div>
                <div className="text-[10px] text-slate-500 mt-0.5">{p.rule}</div>
              </div>
            );
          })}
        </div>
      );
    }

    function ResourceChecks({ resources, policies }) {
      const levelOf = (name) => {
        const p = (policies || []).find((x) => x.name === name);
        return p ? p.level : 'advisory';
      };
      return (
        <div className="space-y-2">
          {resources.map((r) => {
            const hasViolation = r.checks.some((c) => c.result === 'violate');
            const hasMandViolation = r.checks.some(
              (c) => c.result === 'violate' && levelOf(c.policy) === 'mandatory'
            );
            const borderCls = hasMandViolation
              ? 'border-red-400 bg-red-50'
              : hasViolation
              ? 'border-amber-400 bg-amber-50'
              : r.checks.length > 0
              ? 'border-emerald-300 bg-emerald-50'
              : 'border-slate-200 bg-white';
            return (
              <div key={r.id} className={`rounded-lg border-2 ${borderCls} p-2.5`}>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-purple-200 text-purple-800 font-mono">{r.type}</span>
                  <span className="text-[11px] font-bold text-slate-700">{r.name}</span>
                  {hasMandViolation && <span className="ml-auto text-[10px] font-bold text-red-700">⛔ 차단</span>}
                  {!hasMandViolation && hasViolation && <span className="ml-auto text-[10px] font-bold text-amber-700">⚠ 경고</span>}
                  {r.checks.length > 0 && !hasViolation && <span className="ml-auto text-[10px] font-bold text-emerald-700">✓ 통과</span>}
                </div>
                {r.checks.length === 0 ? (
                  <div className="text-[10px] text-slate-400">검사 전</div>
                ) : (
                  <div className="space-y-0.5">
                    {r.checks.map((c, i) => {
                      const ok = c.result === 'pass';
                      const mand = levelOf(c.policy) === 'mandatory';
                      return (
                        <div key={i} className="text-[10px] flex items-center gap-1.5">
                          <span className={ok ? 'text-emerald-600' : mand ? 'text-red-600' : 'text-amber-600'}>
                            {ok ? '✓' : mand ? '✕' : '!'}
                          </span>
                          <span className="font-mono text-slate-600">{c.policy}</span>
                          <span className={`ml-auto text-[9px] px-1 rounded ${ok ? 'bg-emerald-100 text-emerald-700' : mand ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>
                            {ok ? 'pass' : mand ? 'BLOCK' : 'warn'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function DeployGate({ gate }) {
      const g = GATE_STYLE[gate] || GATE_STYLE.pending;
      return (
        <div className={`mt-3 rounded-lg border-2 ${g.cls} px-3 py-2 flex items-center gap-2`}>
          <span className="text-lg">{g.icon}</span>
          <span className="text-xs font-bold">{g.text}</span>
          <span className="ml-auto text-[10px] opacity-70">pulumi up</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">정책 게이트 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">리소스 → 정책 검사 → 게이트</span>
          </div>

          <div className="text-[11px] font-bold text-purple-700 mb-1.5">활성 Policy Pack</div>
          <PolicyList policies={state.policies} />

          <div className="text-[11px] font-bold text-purple-700 mt-3 mb-1.5">검사 대상 리소스</div>
          <ResourceChecks resources={state.resources} policies={state.policies} />

          <DeployGate gate={state.gate} />

          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(i);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">IV</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">IV-2-1. CrossGuard — Policy as Code</h1>
                <p className="text-sm text-purple-800/80">조직 규칙을 코드로 · validateResource · advisory 경고 vs mandatory 차단 · 배포 전 가드레일</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                CrossGuard 는 조직 규칙을 TypeScript/Python 코드로 적어 배포 전에 자동 검증하는 Policy as Code 엔진이다. validateResource 로 리소스를 검사하고, enforcementLevel 로 강도를 정한다 — advisory 는 경고만, mandatory 는 위반 시 preview/up 을 실패시켜 배포를 차단한다. Transformation 은 값을 바꾸는 도구이고 CrossGuard 는 검증·차단만 한다는 점, OPA/Rego 대신 Pulumi 그래프를 언어로 직접 검사한다는 점이 핵심 차이다. pulumi policy publish 로 조직 전체에 같은 가드레일을 배포해 컴플라이언스·보안을 자동화한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['CrossGuard', 'Policy as Code', 'PolicyPack', 'validateResource', 'validateStack', 'advisory', 'mandatory', 'enforcementLevel', 'policy publish', 'vs Transformation', 'vs OPA'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 목차</a>
              <div className="flex gap-4">
                <a href="./IV-1-2.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: IV-1-2</a>
                <a href="./IV-2-2.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: IV-2-2 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
