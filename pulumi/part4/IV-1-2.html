  <!--
    Pulumi IV-1-2 — Pulumi Cloud: 협업 + state lock + RBAC
    학습 목표: 팀 규모에서 관리형 backend(Pulumi Cloud)로 state 를 안전하게 저장·잠금·이력 관리하고,
              조직/팀/스택 계층 + RBAC 으로 권한을 나누고, 감사 로그로 배포 이력을 남기는 법 5단계
    핵심 비유: 여러 사람이 같은 문서를 편집할 때 구글 독스가 "누가 지금 편집 중"을 잠금·표시하듯,
              Pulumi Cloud 가 state 를 잠그고 이력·권한을 관리한다
    패턴: fastapi v1 — 좌(LiveDataPane: 팀 협업 대시보드 — 팀원/잠금/이력/RBAC) / 우(VSCode CodeViewer bash+yaml)
    색상: purple #8A3391 (Pulumi 브랜드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — Pulumi Cloud 협업
    //   members : 팀원 [{ name, role, icon, action }]
    //   lock    : state 잠금 상태 { locked, holder, waiting:[] }
    //   history : 배포 이력 [{ ver, who, action, when, kind }]
    //   keyPoint: 한 줄 정리
    //   code    : 우측 CodeViewer 탭
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 왜 local state 로는 팀 협업이 안 되나',
        desc: '혼자 쓸 때는 `pulumi.<stack>.json` 이 내 노트북에 있으면 됐다. 하지만 팀이 되면 문제가 터진다 — 내 state 는 동료가 못 보고, 두 사람이 동시에 `pulumi up` 을 하면 state 가 깨진다. 해결책은 **관리형 backend**다. Pulumi Cloud(app.pulumi.com) 에 로그인하면 state 가 SaaS 에 저장되고, 잠금·이력·권한이 자동으로 붙는다. Terraform 의 remote backend + state lock 을 별도 셋업 없이 기본 제공한다고 보면 된다.',
        members: [
          { name: '나 (jiwon)', role: 'developer', icon: '🧑‍💻', action: 'pulumi login 준비' },
        ],
        lock: { locked: false, holder: null, waiting: [] },
        history: [],
        keyPoint: 'local state = 팀 협업 불가. Pulumi Cloud 로그인 하나로 저장·잠금·이력·권한이 붙는다.',
        code: {
          lang: 'bash',
          filename: 'pulumi-login.sh',
          lines: [
            '# 1) 지금까지 쓰던 local backend 는 내 노트북에만 있음',
            '$ pulumi whoami -v',
            'User: (none)',
            'Backend: file:///Users/jiwon/.pulumi   # ← 로컬 파일!',
            '',
            '# 문제 — 이 state 는 동료가 못 보고, 동시 up 이면 깨진다.',
            '',
            '# 2) Pulumi Cloud(관리형 backend) 로 로그인',
            '$ pulumi login',
            'Manage your stacks at https://app.pulumi.com/',
            'Logged in to pulumi.com as jiwon (https://app.pulumi.com/jiwon)',
            '',
            '# 3) 이제 backend 가 Pulumi Cloud SaaS 로 바뀐다',
            '$ pulumi whoami -v',
            'User: jiwon',
            'Organizations: jiwon, acme-corp',
            'Backend: https://api.pulumi.com   # ← 관리형!',
            '',
            '# 셀프호스팅이 필요하면 backend URL 만 바꾸면 됨',
            '# $ pulumi login https://pulumi.acme-corp.internal',
            '# (Pulumi Cloud Self-Hosted — 뒤 step 에서 다룸)',
            '',
            '# 로그인 한 번으로 state 저장 + 잠금 + 이력 + RBAC 이',
            '# 전부 자동으로 붙는다. 별도 S3/DynamoDB 셋업 불필요.',
          ],
          highlight: [1, 2, 3, 4, 8, 9, 10, 11, 17, 18],
        },
      },
      {
        title: 'Step 2. 조직 / 팀 / 스택 계층 만들기',
        desc: 'Pulumi Cloud 의 권한 단위는 3계층이다 — **조직(org)** 안에 **팀(team)** 이 있고, 팀이 **스택(stack)** 을 소유한다. 스택 이름은 `org/project/stack` 형태(`acme-corp/payments/prod`)로 완전히 식별된다. 회사 계정(`acme-corp`) 아래 `platform` 팀과 `app-dev` 팀을 나누고, 각 팀에 스택을 배정한다. 이 계층이 그대로 RBAC 의 뼈대가 된다 — 팀에 권한을 주면 그 팀의 스택 전체에 적용된다.',
        members: [
          { name: 'jiwon',  role: 'org admin',   icon: '👑', action: '조직/팀 구성' },
          { name: 'minsu',  role: 'platform',    icon: '🧑‍🔧', action: 'platform 팀' },
          { name: 'sara',   role: 'app-dev',     icon: '🧑‍💻', action: 'app-dev 팀' },
        ],
        lock: { locked: false, holder: null, waiting: [] },
        history: [
          { ver: 1, who: 'jiwon', action: 'stack init acme-corp/payments/prod', when: '방금', kind: 'init' },
        ],
        keyPoint: '조직 > 팀 > 스택 3계층. 스택은 org/project/stack 로 완전 식별. 팀 = RBAC 단위.',
        code: {
          lang: 'yaml',
          filename: 'org-and-stacks.yaml',
          lines: [
            '# Pulumi Cloud 계층 구조 (개념도)',
            '# 조직(org) 하나 안에 팀 여러 개, 팀이 스택을 소유',
            '',
            'organization: acme-corp',
            'teams:',
            '  - name: platform',
            '    members: [minsu, jiwon]',
            '    description: 공용 인프라(VPC, DB, 네트워크)',
            '  - name: app-dev',
            '    members: [sara, jiwon]',
            '    description: 서비스 애플리케이션 스택',
            '',
            'stacks:',
            '  - name: acme-corp/payments/prod   # org/project/stack',
            '    owner-team: platform',
            '  - name: acme-corp/payments/dev',
            '    owner-team: app-dev',
            '  - name: acme-corp/web/prod',
            '    owner-team: app-dev',
            '',
            '# 실제 생성은 CLI 로',
            '# $ pulumi org set-default acme-corp',
            '# $ pulumi stack init acme-corp/payments/prod',
            '# 팀/멤버 관리는 app.pulumi.com > Settings > Teams',
          ],
          highlight: [3, 4, 5, 6, 8, 9, 13, 14, 15],
        },
      },
      {
        title: 'Step 3. RBAC — 팀별 · 스택별 권한 부여',
        desc: 'RBAC(역할 기반 접근제어)로 "누가 무엇을 할 수 있나"를 정한다. 조직 역할은 **admin / member**, 스택 역할은 **admin / write / read** 3단계다. 원칙은 최소 권한 — app-dev 팀은 `dev` 스택에 write, `prod` 스택엔 read 만 준다. prod 배포는 platform 팀만. 이렇게 하면 신입이 실수로 prod 를 밀어버리는 사고를 구조적으로 막는다. 권한은 개인이 아니라 **팀 단위**로 주는 게 관리가 쉽다.',
        members: [
          { name: 'minsu (platform)', role: 'prod: admin', icon: '🧑‍🔧', action: 'prod write 가능' },
          { name: 'sara (app-dev)',   role: 'prod: read',  icon: '🧑‍💻', action: 'prod 조회만' },
          { name: 'sara (app-dev)',   role: 'dev: write',  icon: '🧑‍💻', action: 'dev 배포 가능' },
        ],
        lock: { locked: false, holder: null, waiting: [] },
        history: [
          { ver: 1, who: 'jiwon', action: 'stack init prod', when: '10:02', kind: 'init' },
          { ver: 2, who: 'jiwon', action: 'RBAC: app-dev → prod read', when: '10:05', kind: 'rbac' },
        ],
        keyPoint: '스택 역할 admin/write/read 3단계. 최소 권한 · 팀 단위. prod write 는 platform 만.',
        code: {
          lang: 'yaml',
          filename: 'rbac-policy.yaml',
          lines: [
            '# 스택별 팀 권한 매트릭스',
            '# role: admin(설정변경) > write(배포) > read(조회)',
            '',
            'organization: acme-corp',
            'org-roles:',
            '  jiwon: admin      # 조직 관리자 — 전권',
            '  minsu: member',
            '  sara:  member',
            '',
            'stack-permissions:',
            '  acme-corp/payments/prod:',
            '    platform: admin   # prod 배포는 platform 팀만',
            '    app-dev:  read    # app-dev 는 조회만 (사고 방지)',
            '  acme-corp/payments/dev:',
            '    platform: admin',
            '    app-dev:  write   # dev 에서는 자유롭게 배포',
            '  acme-corp/web/prod:',
            '    app-dev:  admin',
            '',
            '# 원칙 — 최소 권한(least privilege).',
            '# 신입이 실수로 prod 를 up/destroy 하는 사고를',
            '# 권한 구조로 원천 차단한다.',
            '# 개인이 아니라 팀에 권한을 주면 입·퇴사 관리가 쉽다.',
          ],
          highlight: [10, 11, 12, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 4. state lock — 동시 배포를 막는 잠금',
        desc: '팀 협업의 진짜 위험은 **동시 배포**다. minsu 와 sara 가 같은 스택에 동시에 `pulumi up` 을 하면 state 가 꼬인다. Pulumi Cloud 는 배포가 시작되면 그 스택의 state 를 **자동 잠금**한다. 두 번째 사람은 "이미 minsu 가 업데이트 중"이라는 메시지와 함께 대기한다. minsu 가 끝나면 잠금이 풀리고 sara 차례가 된다. 구글 독스에서 "누가 지금 편집 중"이 뜨는 것과 같은 원리 — 아무 설정 없이 기본 동작한다.',
        members: [
          { name: 'minsu',  role: 'prod: admin', icon: '🧑‍🔧', action: 'pulumi up 실행 중 🔒' },
          { name: 'sara',   role: 'prod: read',  icon: '🧑‍💻', action: '잠금 대기 중 ⏳' },
        ],
        lock: { locked: true, holder: 'minsu', waiting: ['sara'] },
        history: [
          { ver: 3, who: 'minsu', action: 'up — DB instance 추가 (진행 중)', when: '지금', kind: 'lock' },
        ],
        keyPoint: 'up 시작 = state 자동 잠금. 두 번째 배포자는 대기. 동시 배포로 인한 state 손상 방지.',
        code: {
          lang: 'bash',
          filename: 'concurrent-up.sh',
          lines: [
            '# [터미널 A] minsu 가 먼저 배포 시작',
            '$ pulumi up --stack acme-corp/payments/prod',
            'Updating (prod):',
            '   + aws:rds:Instance  payments-db  creating...',
            '# → 이 순간 Pulumi Cloud 가 prod state 를 잠근다 🔒',
            '',
            '# [터미널 B] 거의 동시에 sara 가 같은 스택 배포 시도',
            '$ pulumi up --stack acme-corp/payments/prod',
            'error: the stack is currently locked by 1 lock(s).',
            '  acme-corp/payments/prod is locked by:',
            '    minsu on host laptop-minsu (pid 4821)',
            '    started 2026-08-11T10:12:03Z',
            '',
            'To view a running update, visit:',
            '  https://app.pulumi.com/acme-corp/payments/prod/updates/3',
            '',
            '# → sara 는 minsu 가 끝날 때까지 기다린다.',
            '# minsu 의 up 이 완료되면 잠금 자동 해제 → sara 재시도 성공.',
            '',
            '# 잠금이 비정상 종료로 남았을 때만(드물게) 수동 해제:',
            '# $ pulumi cancel --stack acme-corp/payments/prod',
            '# (정말 아무도 실행 중이 아닐 때만! 남용 금지)',
          ],
          highlight: [1, 2, 4, 8, 9, 10, 11, 12, 17, 18],
        },
      },
      {
        title: 'Step 5. 감사 로그 · Deployments · 태그 검색',
        desc: '모든 배포는 **이력(update history)** 으로 남는다 — 누가, 언제, 무엇을 바꿨는지 감사 로그에 기록되고 언제든 이전 버전으로 되돌릴 수 있다. 나아가 **Deployments** 를 켜면 로컬 노트북이 아니라 **Pulumi Cloud 안에서 `pulumi up` 이 실행**된다(git push 시 자동 배포, CI 없이도 가능). 스택이 많아지면 **태그**(env, team, cost-center)를 붙여 검색·필터한다. 규제 산업이면 state 를 사내에 둬야 하니 **Self-Hosted** 로 같은 기능을 온프레미스에 올린다.',
        members: [
          { name: 'minsu',  role: 'prod: admin', icon: '🧑‍🔧', action: 'up 완료 ✅ 잠금 해제' },
          { name: 'sara',   role: 'dev: write',  icon: '🧑‍💻', action: 'dev 배포 성공' },
          { name: 'jiwon',  role: 'org admin',   icon: '👑', action: '감사 로그 검토' },
        ],
        lock: { locked: false, holder: null, waiting: [] },
        history: [
          { ver: 1, who: 'jiwon', action: 'stack init', when: '10:02', kind: 'init' },
          { ver: 2, who: 'jiwon', action: 'RBAC 설정', when: '10:05', kind: 'rbac' },
          { ver: 3, who: 'minsu', action: 'up — DB instance 추가', when: '10:12', kind: 'up' },

          lang: 'bash',
          filename: 'history-and-deployments.sh',
          lines: [
            '# 1) 감사 로그 — 누가 언제 무엇을 바꿨나',

            '# $ pulumi stack export --version 2 > prev.json',
            '# $ pulumi stack import --file prev.json',
            '',
            '# 3) 태그로 스택 검색/필터 (스택이 수십 개일 때)',
            '$ pulumi stack tag set env prod',
            '$ pulumi stack tag set cost-center payments',
            '$ pulumi stack ls --organization acme-corp \\',
            '    --json | jq \'.[] | select(.tags.env=="prod")\'',
            '',
            '# 4) Deployments — 클라우드에서 pulumi up 실행',

            '',
            '# 5) 규제 산업 — state 를 사내에 둬야 하면',
            '#    Pulumi Cloud Self-Hosted 로 같은 기능 온프레 구축',
            '#    $ pulumi login https://pulumi.acme-corp.internal',
          ],
          highlight: [1, 2, 3, 4, 5, 11, 12, 13, 16, 17, 18, 19, 20, 21],

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 팀 협업 대시보드 (purple #8A3391 톤)
    // ─────────────────────────────────────────────────────
    const HISTORY_STYLE = {
      init: { badge: 'bg-slate-200 text-slate-700', dot: 'bg-slate-400' },
      rbac: { badge: 'bg-indigo-200 text-indigo-800', dot: 'bg-indigo-500' },
      up:   { badge: 'bg-emerald-200 text-emerald-800', dot: 'bg-emerald-500' },
      lock: { badge: 'bg-amber-200 text-amber-800', dot: 'bg-amber-500' },
    };

    function TeamCards({ members }) {
      return (
        <div className="space-y-1.5">
          <div className="text-[11px] font-bold text-purple-800">팀원 활동 ({members.length})</div>
          {members.map((m, i) => (
            <div key={i} className="flex items-center gap-2 rounded-lg border border-purple-200 bg-purple-50/50 px-2 py-1.5">
              <span className="text-base">{m.icon}</span>
              <div className="min-w-0">
                <div className="text-xs font-bold text-purple-900 truncate">{m.name}</div>
                <div className="text-[10px] text-slate-500 font-mono">{m.role}</div>
              </div>
              <span className="ml-auto text-[10px] text-purple-700 text-right">{m.action}</span>
            </div>
          ))}
        </div>
      );
    }

    function LockStatus({ lock }) {
      if (!lock.locked) {
        return (
          <div className="mt-3 rounded-lg border-2 border-emerald-300 bg-emerald-50 px-3 py-2 flex items-center gap-2">
            <span className="text-base">🔓</span>
            <span className="text-xs font-bold text-emerald-800">state 잠금 없음 — 배포 가능</span>
          </div>
        );
      }
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 px-3 py-2">
          <div className="flex items-center gap-2">
            <span className="text-base">🔒</span>
            <span className="text-xs font-bold text-amber-800">
              state 잠금 중 — <span className="font-mono">{lock.holder}</span> 배포 실행 중
            </span>
          </div>
          {lock.waiting && lock.waiting.length > 0 && (
            <div className="mt-1.5 text-[10px] text-amber-700">
              ⏳ 대기: {lock.waiting.map((w) => (
                <span key={w} className="font-mono px-1.5 py-0.5 rounded bg-amber-200 text-amber-800 ml-1">{w}</span>
              ))}
            </div>
          )}
        </div>
      );
    }

    function DeployHistory({ history }) {
      if (!history || history.length === 0) {
        return (
          <div className="mt-3 rounded-lg border border-dashed border-purple-300 bg-purple-50/40 p-4 text-center text-xs text-purple-700">
            아직 배포 이력 없음 — 로그인 후부터 기록됨
          </div>
        );
      }
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">배포 이력 / 감사 로그 ({history.length})</div>
          <div className="space-y-1">
            {history.map((h, i) => {
              const s = HISTORY_STYLE[h.kind] || HISTORY_STYLE.init;
              return (
                <div key={i} className="flex items-center gap-2 rounded px-2 py-1 border border-purple-100 bg-purple-50/40">
                  <span className={`w-2 h-2 rounded-full ${s.dot}`}></span>
                  <span className="text-[10px] font-mono text-purple-700">v{h.ver}</span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${s.badge}`}>{h.who}</span>
                  <span className="text-[11px] text-slate-700 truncate">{h.action}</span>
                  <span className="text-[10px] text-slate-400 ml-auto whitespace-nowrap">{h.when}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">Pulumi Cloud 협업 대시보드</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 팀 상태</span>
          </div>
          <TeamCards members={state.members} />
          <LockStatus lock={state.lock} />
          <DeployHistory history={state.history} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">IV</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">IV-1-2. Pulumi Cloud — 협업 + state lock + RBAC</h1>
                <p className="text-sm text-purple-800/80">관리형 backend · 조직/팀/스택 계층 · RBAC 권한 · state 자동 잠금 · 감사 로그/롤백 · Deployments</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Pulumi Cloud 는 `pulumi login` 하나로 state 저장·잠금·이력·권한을 자동으로 붙여 주는 관리형 backend 다. 조직 &gt; 팀 &gt; 스택 3계층 위에 RBAC(admin/write/read)으로 최소 권한을 팀 단위로 부여해 prod 사고를 막고, 배포가 시작되면 state 를 자동 잠금해 동시 배포로 인한 손상을 방지한다. 모든 배포는 감사 로그로 남아 언제든 롤백 가능하고, Deployments 로 클라우드에서 직접 up 을 돌리거나 규제 환경이면 Self-Hosted 로 온프레에 같은 기능을 올린다. 다음 (IV-2-1) 에서는 CI/CD 파이프라인에 Pulumi 를 통합하는 법을 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Pulumi Cloud', '관리형 backend', 'org/team/stack', 'RBAC', 'state lock', '감사 로그', 'rollback', 'Deployments', 'stack tag', 'Self-Hosted'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 목차</a>
              <div className="flex items-center gap-3">
                <a href="./IV-1-1.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: IV-1-1</a>
                <a href="./IV-2-1.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: IV-2-1 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
