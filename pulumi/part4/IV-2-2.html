    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

      setTimeout(focusFirst, 500);
    });

          filename: 'lifecycle.ts',
          lines: [
            '// 테넌트 탈퇴 → 그 stack 만 프로그래매틱하게 정리',
            'app.delete("/tenants/:id", async (req, res) => {',
            '  const stack = await LocalWorkspace.selectStack({',
            '    stackName:   `tenant-${req.params.id}`,',
            '    projectName: "saas-tenants",',
            '    program:     async () => ({}),',
            '  });',
            '',
            '  await stack.destroy({ onOutput: console.log });',
            '  await stack.workspace.removeStack(stack.name);',
            '  res.json({ deleted: req.params.id });',
            '});',
            '',
            '// ── CLI vs Automation API 요약 ─────────────',
            '// CLI          : $ pulumi up  (사람, 터미널, dev/ops)',
            '// Automation   : await stack.up()  (앱, 런타임, 제품 기능)',
            '//',
            '// 같은 엔진, 같은 state, 같은 결과.',
            '// 차이는 "누가 언제 실행하느냐" 뿐이다.',
            '//',
            '// 인프라를 코드로 임베드 = 프로그래매틱 IaC.',
            '// 셀프서비스 포털 · SaaS 테넌트 · 커스텀 CI 의 기반.',
          ],
          highlight: [2, 9, 10, 15, 16, 21, 22],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — purple #8A3391 톤
    // ─────────────────────────────────────────────────────
    const TENANT_STATUS = {
      queued:       { text: '대기', cls: 'bg-slate-200 text-slate-700' },
      provisioning: { text: '생성 중', cls: 'bg-amber-200 text-amber-800' },
      deployed:     { text: '배포 완료', cls: 'bg-emerald-200 text-emerald-800' },
    };

    function PortalCard({ portal }) {
      return (
        <div className="rounded-lg border-2 border-purple-300 bg-purple-50 p-3">
          <div className="flex items-center gap-1.5 mb-2">
            <span className="text-base">🤖</span>
            <span className="text-xs font-bold text-purple-800">앱/포털 → Automation API</span>
          </div>
          <div className="space-y-1">
            {portal.map((p) => (
              <div key={p.label} className="flex items-center gap-2 text-[11px]">
                <span className="text-purple-700 font-semibold w-24 shrink-0">{p.label}</span>
                <span className="font-mono text-slate-700 truncate">{p.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TenantList({ tenants }) {
      if (!tenants || tenants.length === 0) {
        return (
          <div className="mt-3 rounded-lg border border-dashed border-purple-300 bg-purple-50/40 p-4 text-center text-xs text-purple-700">
            아직 stack.up() 호출 전 — 다음 step 부터 테넌트 인프라가 생성됨
          </div>
        );
      }
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">테넌트별 stack ({tenants.length})</div>
          <div className="space-y-1">
            {tenants.map((t) => {
              const st = TENANT_STATUS[t.status] || TENANT_STATUS.queued;
              return (
                <div key={t.id} className="flex items-center gap-2 rounded px-2 py-1 border border-purple-100 bg-purple-50/50">
                  <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-purple-200 text-purple-800 font-mono">tenant-{t.name}</span>
                  <span className="text-[11px] font-mono text-slate-600">{t.plan}</span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded ml-auto ${st.cls}`}>{st.text}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function EventStream({ events }) {
      if (!events || events.length === 0) return null;
      return (
        <div className="mt-3 rounded-lg border border-slate-700 bg-[#1e222a] p-2">
          <div className="text-[10px] font-bold text-slate-400 mb-1">📡 onOutput 이벤트 스트림</div>
          <div className="space-y-0.5 font-mono text-[10px]">
            {events.map((e, i) => {
              const isDel = e.trim().startsWith('-');
              return (
                <div key={i} className={isDel ? 'text-red-300' : 'text-emerald-300'}>{e}</div>
              );
            })}
          </div>
        </div>
      );
    }

    function OutputsBox({ outputs }) {
      if (!outputs || outputs.length === 0) return null;
      return (
        <div className="mt-3 rounded-lg border border-emerald-300 bg-emerald-50 p-2">
          <div className="text-[10px] font-bold text-emerald-800 mb-1">↩ result.outputs — 앱이 바로 사용</div>
          <div className="space-y-0.5">
            {outputs.map((o) => (
              <div key={o.key} className="text-[10px] flex items-center gap-1">
                <span className="font-mono text-emerald-700 font-bold">{o.key}:</span>
                <span className="font-mono text-slate-600 truncate">{o.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">셀프서비스 프로비저닝 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 도메인 상태</span>
          </div>
          <PortalCard portal={state.portal} />
          <TenantList tenants={state.tenants} />
          <EventStream events={state.events} />
          <OutputsBox outputs={state.outputs} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">IV</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">IV-2-2. Automation API — 라이브러리로 호출</h1>
                <p className="text-sm text-purple-800/80">CLI 없이 코드에서 preview/up/destroy · inline vs local program · 셀프서비스 포털 · 테넌트별 프로비저닝 · outputs 반환</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Automation API 는 pulumi CLI 의 preview/up/destroy 를 라이브러리 함수로 노출해, 사람이나 터미널 없이 내 앱 코드에서 인프라를 실행하게 한다. inline program(함수로 정의) 과 local program(폴더 지정) 을 LocalWorkspace 로 stack 을 만들어 구동하고, stack.up() 은 onOutput 으로 로그를 스트리밍하며 result.outputs 를 반환한다. 이 outputs 를 앱이 바로 사용해 셀프서비스 포털, SaaS 테넌트별 프로비저닝, 커스텀 CI 도구를 만든다 — 인프라를 제품 기능으로 임베드하는 프로그래매틱 IaC 다. 다음 (V-1-1) 부터는 테스트/검증 주제로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Automation API', 'LocalWorkspace', 'inline program', 'local program', 'stack.up', 'onOutput', 'outputs', '셀프서비스 포털', '테넌트별 인프라', '프로그래매틱 IaC'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 목차</a>
              <div className="flex gap-3">
                <a href="./IV-2-1.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: IV-2-1</a>
                <a href="../part5/V-1-1.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: V-1-1 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
