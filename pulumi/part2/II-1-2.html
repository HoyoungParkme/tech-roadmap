<body>
  <div id="root"></div>

  <!--
    Pulumi II-1-2 — Dynamic Provider — 내가 만드는 리소스
    학습 목표: 공식 provider 가 없는 리소스를 pulumi.dynamic.ResourceProvider 로 직접 CRUD 구현하는 5단계
    핵심 비유: 기성 부품이 없으면 직접 깎는 선반공 — create/read/update/delete/diff 훅으로 생명주기를 손수 정의
    패턴: fastapi v1 — 좌(LiveDataPane: 훅 호출 → 외부 리소스 생성 → 상태 저장 생명주기) / 우(VSCode CodeViewer TypeScript)
    색상: purple #8A3391 (Pulumi 브랜드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — Dynamic Provider 로 사내 API 리소스 만들기
    //   activeHook : 이번 step 에서 호출되는 생명주기 훅
    //   inputs     : Resource 에 넘긴 입력 props
    //   external   : 외부 시스템의 실제 리소스 상태 { exists, id, data }
    //   stateOuts  : pulumi state 에 저장되는 outs
    //   diff       : diff 훅 결과 (step 4) { changes, replaces, fields }
    //   keyPoint   : 한 줄 정리
    //   code       : 우측 CodeViewer 탭
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 공식 provider 가 없을 때 — 왜 Dynamic Provider 인가',
        desc: 'AWS·GCP 처럼 공식 Pulumi provider 가 있으면 그냥 import 해서 쓰면 된다. 하지만 사내 배포 API, SaaS 대시보드, DB 스키마, 결제사 웹훅 등록처럼 **공식 provider 가 없는 리소스**는 어떻게 IaC 에 편입할까? 방법은 두 갈래다. ComponentResource 는 이미 존재하는 리소스들을 묶어 재사용하는 것이고, Dynamic Provider 는 아예 **새로운 리소스 타입 자체를 정의**해서 create/update/delete 로직을 내 손으로 짠다. 이번 장의 목표는 사내 "Feature Flag API" 를 Pulumi 리소스로 만드는 것이다.',
        activeHook: null,
        inputs: { key: 'checkout-v2', enabled: true, rollout: 25 },
        external: { exists: false, id: null, data: null },
        stateOuts: null,
        diff: null,
        keyPoint: 'Dynamic Provider = 공식 provider 없는 리소스를 새 타입으로 직접 정의. ComponentResource 는 기존 조합, Dynamic 은 신규 타입.',
        code: {
          lang: 'typescript',
          filename: 'featureFlag.ts',
          lines: [
            '// 공식 provider 가 없는 사내 시스템 = Feature Flag API',
            '//   POST   /flags        → 생성 (id 발급)',
            '//   GET    /flags/:id    → 조회',
            '//   PATCH  /flags/:id    → 수정',
            '//   DELETE /flags/:id    → 삭제',
            'import * as pulumi from "@pulumi/pulumi";',
            '',
            '// 이 API 를 Pulumi 리소스로 만들면?',
            '//   - pulumi up   → 플래그 생성',
            '//   - 코드 수정 후 up → 자동으로 PATCH 또는 재생성',
            '//   - pulumi destroy → 플래그 삭제',
            '// 즉 사내 시스템도 IaC 생명주기에 편입된다.',
            '',
            '// vs ComponentResource — 차이 명확히',
            '//   ComponentResource: 기존 리소스(S3+Lambda+...) 를 묶어 재사용',
            '//   DynamicProvider  : create/read/update/delete 를 직접 구현해',
            '//                      "새 리소스 타입" 자체를 만든다',
            '',
            '// 다음 step 에서 ResourceProvider 인터페이스를 구현한다.',
          ],
          highlight: [0, 1, 2, 3, 4, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 2. ResourceProvider 구현 — create 훅이 외부 리소스를 만든다',
        desc: 'pulumi.dynamic.ResourceProvider 인터페이스는 create / read / update / delete / diff 다섯 메서드로 이뤄진다. 가장 먼저 필요한 건 create — Pulumi 가 새 리소스를 만들어야 할 때 호출한다. 이 안에서 실제 외부 API(fetch)를 때리고, 응답으로 받은 **id 와 저장할 outs 를 { id, outs } 로 반환**한다. 반환한 outs 는 Pulumi state 에 그대로 저장되어 다음 실행 때 이전 상태로 쓰인다. create 는 async 라서 네트워크 호출을 자유롭게 할 수 있다.',
        activeHook: 'create',
        inputs: { key: 'checkout-v2', enabled: true, rollout: 25 },
        external: { exists: true, id: 'flag_a1b2c3', data: { key: 'checkout-v2', enabled: true, rollout: 25 } },
        stateOuts: { flagId: 'flag_a1b2c3', key: 'checkout-v2', enabled: true, rollout: 25 },
        diff: null,
        keyPoint: 'create(inputs) → 외부 API 호출 → { id, outs } 반환. outs 는 pulumi state 에 저장된다.',
        code: {
          lang: 'typescript',
          filename: 'featureFlag.ts',
          lines: [
            'const API = "https://flags.internal.acme.io";',
            '',
            '// 리소스의 입력 타입 — 사용자가 넘기는 props',
            'interface FlagInputs {',
            '  key: string;',
            '  enabled: boolean;',
            '  rollout: number;   // 0~100 %',
            '}',
            '',
            '// ResourceProvider 를 구현 — 생명주기 훅 모음',
            'const flagProvider: pulumi.dynamic.ResourceProvider = {',
            '  // Pulumi 가 새 리소스를 만들 때 호출',
            '  async create(inputs: FlagInputs) {',
            '    const res = await fetch(`${API}/flags`, {',
            '      method: "POST",',
            '      headers: { "Content-Type": "application/json" },',
            '      body: JSON.stringify(inputs),',
            '    });',
            '    const body = await res.json();  // { id, ...fields }',
            '',
            '    // id = 이 리소스의 고유 식별자 (필수)',
            '    // outs = state 에 저장할 값 (다음 실행의 olds 가 됨)',
            '    return {',
            '      id: body.id,',
            '      outs: { flagId: body.id, ...inputs },',
            '    };',
            '  },',
            '  // read / update / delete / diff 는 다음 step 에서',
            '};',
          ],
          highlight: [10, 11, 12, 13, 14, 15, 16, 17, 18, 21, 22, 23, 24, 25],
        },
      },
      {
        title: 'Step 3. Resource 클래스로 감싸 사용 — pulumi up 이 create 를 호출',
        desc: 'ResourceProvider 는 로직일 뿐이고, 사용자가 쓰는 건 pulumi.dynamic.Resource 를 상속한 클래스다. 생성자에서 provider 를 넘기고, 출력으로 노출할 필드(flagId)를 선언한다. 이제 index.ts 에서 `new FeatureFlag(...)` 를 쓰면 일반 리소스처럼 보이지만, 내부적으로는 우리가 짠 create 훅이 pulumi up 시 실행되어 외부 API 를 때린다. Pulumi state 에는 outs 가 저장되어 리소스가 "관리 대상"이 된다. 다른 리소스가 flag.flagId 를 참조하는 것도 자연스럽게 된다.',
        activeHook: 'create',
        inputs: { key: 'checkout-v2', enabled: true, rollout: 25 },
        external: { exists: true, id: 'flag_a1b2c3', data: { key: 'checkout-v2', enabled: true, rollout: 25 } },
        stateOuts: { flagId: 'flag_a1b2c3', key: 'checkout-v2', enabled: true, rollout: 25 },
        diff: null,
        keyPoint: 'Resource 클래스가 provider 를 감싼다. new FeatureFlag(...) 는 일반 리소스처럼 쓰이고 up 시 create 훅 실행.',
        code: {
          lang: 'typescript',
          filename: 'featureFlag.ts',
          lines: [
            '// Resource 를 상속해 사용자용 클래스 정의',
            'export class FeatureFlag extends pulumi.dynamic.Resource {',
            '  // 출력으로 노출할 필드 (state 의 outs 와 대응)',
            '  public readonly flagId!: pulumi.Output<string>;',
            '',
            '  constructor(',
            '    name: string,',
            '    args: FlagInputs,',
            '    opts?: pulumi.CustomResourceOptions,',
            '  ) {',
            '    // 3번째 인자: 이 리소스가 가질 출력 필드 초기값',
            '    super(flagProvider, name, { ...args, flagId: undefined }, opts);',
            '  }',
            '}',
            '',
            '// ── index.ts — 실제 사용 예 ──────────────────',
            'import { FeatureFlag } from "./featureFlag";',
            '',
            'const checkoutFlag = new FeatureFlag("checkout-v2", {',
            '  key:     "checkout-v2",',
            '  enabled: true,',
            '  rollout: 25,',
            '});',
            '',
            '// 일반 리소스처럼 출력을 export / 참조 가능',
            'export const flagId = checkoutFlag.flagId;',
          ],
          highlight: [1, 2, 3, 11, 12, 18, 19, 20, 21, 22, 25],
        },
      },
      {
        title: 'Step 4. diff 로 변경 감지 — update 냐 replace 냐',
        desc: '코드에서 rollout 을 25 → 60 으로 바꾼 뒤 다시 pulumi up 하면, Pulumi 는 먼저 diff 훅을 호출한다. diff 는 이전 상태(olds)와 새 입력(news)을 비교해 무엇이 바뀌었는지, 그리고 **그 변경이 update 로 되는지 replace(삭제 후 재생성)가 필요한지**를 알려준다. rollout 은 PATCH 로 고칠 수 있으니 changes 만 표시하고, 만약 key(식별자)가 바뀌면 replaces 에 넣어 리소스를 새로 만들게 한다. diff 가 update 로 판정하면 update 훅이, replace 로 판정하면 delete+create 가 실행된다.',
        activeHook: 'diff',
        inputs: { key: 'checkout-v2', enabled: true, rollout: 60 },
        external: { exists: true, id: 'flag_a1b2c3', data: { key: 'checkout-v2', enabled: true, rollout: 60 } },
        stateOuts: { flagId: 'flag_a1b2c3', key: 'checkout-v2', enabled: true, rollout: 60 },
        diff: { changes: true, fields: ['rollout: 25 → 60'], replaces: [], verdict: 'update (PATCH)' },
        keyPoint: 'diff(id, olds, news) → { changes, replaces }. 일반 필드 변경은 update, 식별자 변경은 replace.',
        code: {
          lang: 'typescript',
          filename: 'featureFlag.ts',
          lines: [
            'const flagProvider: pulumi.dynamic.ResourceProvider = {',
            '  async create(inputs) { /* ...위와 동일... */ },',
            '',
            '  // 변경 감지 — up 마다 create/update 전에 먼저 호출',
            '  async diff(id, olds: FlagInputs, news: FlagInputs) {',
            '    const replaces: string[] = [];',
            '    // key(식별자) 가 바뀌면 같은 리소스가 아니다 → 재생성',
            '    if (olds.key !== news.key) replaces.push("key");',
            '',
            '    const changed =',
            '      olds.enabled !== news.enabled ||',
            '      olds.rollout !== news.rollout ||',
            '      replaces.length > 0;',
            '',
            '    return {',
            '      changes: changed,      // 바뀐 게 있나?',
            '      replaces,              // 이 필드는 replace 필요',
            '      deleteBeforeReplace: true,',
            '    };',
            '  },',
            '',
            '  // diff 가 update 로 판정하면 호출 → PATCH',
            '  async update(id, olds: FlagInputs, news: FlagInputs) {',
            '    await fetch(`${API}/flags/${id}`, {',
            '      method: "PATCH",',
            '      body: JSON.stringify(news),',
            '    });',
            '    return { outs: { flagId: id, ...news } };',
            '  },',
            '};',
          ],
          highlight: [4, 5, 6, 7, 14, 15, 16, 17, 18, 22, 23, 24, 25, 26, 27, 28],
        },
      },
      {
        title: 'Step 5. delete 와 실무 — 시크릿 회전·외부 등록 자동화',
        desc: 'pulumi destroy 를 하거나 리소스를 코드에서 지우면 delete 훅이 호출되어 외부 API 에 DELETE 를 보낸다. 이렇게 create/read/update/delete/diff 다섯 훅이 갖춰지면, 사내 시스템도 AWS 리소스와 똑같이 생성-변경-삭제 생명주기가 코드로 관리된다. 실무 활용은 넓다 — 만료되는 시크릿을 주기적으로 회전(update)시키거나, SaaS 웹훅/도메인/DB 스키마를 자동 등록하고, 데이터 마이그레이션을 리소스로 감싸 up 한 번에 실행한다. 주의: create/update 는 실제 부수효과를 내므로 멱등하게, read 는 드리프트 감지에 쓰인다는 점을 기억하자.',
        activeHook: 'delete',
        inputs: { key: 'checkout-v2', enabled: true, rollout: 60 },
        external: { exists: false, id: null, data: null },
        stateOuts: null,
        diff: null,
        keyPoint: 'delete 훅 = 외부 DELETE. 5개 훅으로 사내 시스템을 IaC 생명주기에 완전 편입. 시크릿 회전·외부 등록 자동화에 활용.',
        code: {
          lang: 'typescript',
          filename: 'featureFlag.ts',
          lines: [
            'const flagProvider: pulumi.dynamic.ResourceProvider = {',
            '  async create(inputs) { /* POST */ },',
            '  async update(id, olds, news) { /* PATCH */ },',
            '  async diff(id, olds, news) { /* 변경 감지 */ },',
            '',
            '  // pulumi destroy / 코드에서 삭제 시 호출',
            '  async delete(id, props: FlagInputs) {',
            '    await fetch(`${API}/flags/${id}`, { method: "DELETE" });',
            '    // 외부 리소스 제거 후 state 에서도 사라진다',
            '  },',
            '',
            '  // drift 감지용 — 외부 실제 상태를 다시 읽어옴',
            '  async read(id, props: FlagInputs) {',
            '    const res = await fetch(`${API}/flags/${id}`);',
            '    const body = await res.json();',
            '    return { id, props: { flagId: id, ...body } };',
            '  },',
            '};',
            '',
            '// 실무 패턴 — 같은 원리로 이런 것들을 리소스화',
            '//   · 시크릿 회전: update 훅에서 새 값 발급 + 만료 폐기',
            '//   · SaaS 웹훅/도메인 등록, 결제사 콜백 URL 등록',
            '//   · DB 스키마 마이그레이션을 up 한 번으로',
            '// 주의: create/update 는 멱등하게, read 는 drift 감지에.',
          ],
          highlight: [5, 6, 7, 8, 9, 19, 20, 21, 22, 23],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — purple #8A3391 톤
    //   Dynamic Provider 생명주기: 훅 호출 → 외부 리소스 → state 저장
    // ─────────────────────────────────────────────────────
    const HOOKS = [
      { key: 'create', label: 'create', icon: '➕' },
      { key: 'read',   label: 'read',   icon: '🔍' },
      { key: 'update', label: 'update', icon: '✏️' },
      { key: 'delete', label: 'delete', icon: '🗑️' },
      { key: 'diff',   label: 'diff',   icon: '🔀' },
    ];

    function HookBar({ activeHook }) {
      return (
        <div>
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">ResourceProvider 생명주기 훅</div>
          <div className="grid grid-cols-5 gap-1.5">
            {HOOKS.map((h) => {
              const on = h.key === activeHook;
              return (
                <div
                  key={h.key}
                  className={`rounded-lg border-2 p-1.5 text-center transition ${on ? 'bg-purple-600 border-purple-700 text-white shadow-md scale-105' : 'bg-purple-50 border-purple-200 text-purple-400'}`}
                >
                  <div className="text-sm leading-none">{h.icon}</div>
                  <div className="text-[10px] font-mono font-bold mt-0.5">{h.label}</div>
                </div>
              );
            })}
          </div>
          <div className="text-[10px] text-slate-500 mt-1">
            {activeHook ? <span>이번 <b className="text-purple-700">pulumi</b> 실행에서 <b className="text-purple-700">{activeHook}</b> 훅이 호출됨</span> : '아직 호출된 훅 없음 — 개념 이해 단계'}
          </div>
        </div>
      );
    }

    function KvBox({ title, obj, tone }) {
      const empty = obj === null || obj === undefined;
      const border = tone === 'ext' ? 'border-fuchsia-300' : 'border-purple-300';
      const head = tone === 'ext' ? 'text-fuchsia-800' : 'text-purple-800';
      const bg = tone === 'ext' ? 'bg-fuchsia-50/60' : 'bg-purple-50/60';
      return (
        <div className={`rounded-lg border ${border} ${bg} p-2 flex-1 min-w-0`}>
          <div className={`text-[11px] font-bold ${head} mb-1`}>{title}</div>
          {empty ? (
            <div className="text-[10px] text-slate-400 italic py-2 text-center">— 비어 있음 —</div>
          ) : (
            <div className="space-y-0.5">
              {Object.entries(obj).map(([k, v]) => (
                <div key={k} className="text-[10px] font-mono flex gap-1">
                  <span className="text-slate-500">{k}:</span>
                  <span className="text-slate-800 truncate">{String(v)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ExternalRow({ external }) {
      return (
        <div className="rounded-lg border border-fuchsia-300 bg-white p-2">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[11px] font-bold text-fuchsia-800">외부 시스템 (Feature Flag API)</span>
            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${external.exists ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
              {external.exists ? '리소스 존재' : '없음'}
            </span>
          </div>
          <div className="text-[10px] font-mono text-slate-700">
            id: <span className="text-fuchsia-700">{external.id || '(미발급)'}</span>
          </div>
          {external.data && (
            <div className="mt-1 grid grid-cols-3 gap-1">
              {Object.entries(external.data).map(([k, v]) => (
                <div key={k} className="text-[9px] font-mono bg-fuchsia-50 rounded px-1 py-0.5 truncate">
                  <span className="text-slate-500">{k}</span>=<span className="text-fuchsia-800">{String(v)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function DiffBox({ diff }) {
      if (!diff) return null;
      return (
        <div className="rounded-lg border-2 border-purple-400 bg-purple-50 p-2">
          <div className="text-[11px] font-bold text-purple-800 mb-1">diff 결과</div>
          <div className="space-y-0.5 text-[10px]">
            <div>changes: <b className={diff.changes ? 'text-amber-700' : 'text-slate-500'}>{String(diff.changes)}</b></div>
            {diff.fields.map((f, i) => (
              <div key={i} className="font-mono text-purple-900">· {f}</div>
            ))}
            <div>replaces: <span className="font-mono text-slate-700">[{diff.replaces.join(', ')}]</span></div>
            <div className="mt-1 inline-block px-2 py-0.5 rounded bg-purple-600 text-white font-bold">판정: {diff.verdict}</div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">Dynamic Provider 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">훅 → 외부 → state</span>
          </div>
          <HookBar activeHook={state.activeHook} />

          <div className="mt-3">
            <ExternalRow external={state.external} />
          </div>

          <div className="mt-2 text-center text-purple-400 text-xs">▲ create/update/delete 가 위 외부 리소스를 바꾼다 · outs 는 아래 state 에 저장 ▼</div>

          <div className="mt-2 flex gap-2">
            <KvBox title="입력 inputs (내 코드)" obj={state.inputs} tone="in" />
            <KvBox title="Pulumi state (저장된 outs)" obj={state.stateOuts} tone="in" />
          </div>

          {state.diff && (
            <div className="mt-2">
              <DiffBox diff={state.diff} />
            </div>
          )}

          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(i);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">II</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">II-1-2. Dynamic Provider — 내가 만드는 리소스</h1>
                <p className="text-sm text-purple-800/80">공식 provider 없는 리소스를 create/read/update/delete/diff 로 직접 구현 · outs 로 상태 저장 · IaC 생명주기 편입</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Dynamic Provider 는 공식 provider 가 없는 리소스를 위해 pulumi.dynamic.ResourceProvider 의 create/read/update/delete/diff 훅을 직접 구현하는 방법이다. create 는 외부 API 를 호출하고 &#123; id, outs &#125; 를 반환해 상태를 Pulumi state 에 저장하며, diff 가 변경을 감지해 update(수정) 또는 replace(재생성)를 결정한다. ComponentResource 가 기존 리소스를 조합하는 것과 달리 Dynamic 은 새 리소스 타입 자체를 정의한다. 시크릿 회전·외부 등록·DB 마이그레이션 같은 사내 시스템을 IaC 생명주기에 편입할 때 쓴다. 다음 (II-2-1) 에서는 Config 와 Secrets 관리를 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['dynamic.ResourceProvider', 'create/read/update/delete', 'diff', 'outs', 'id 반환', 'replace vs update', 'vs ComponentResource', 'IaC 생명주기'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 목차</a>
              <div className="flex gap-3">
                <a href="./II-1-1.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: II-1-1</a>
                <a href="./II-2-1.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: II-2-1 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
