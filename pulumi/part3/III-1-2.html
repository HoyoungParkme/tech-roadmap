      return (
        <div className="rounded-lg border-2 border-purple-300 bg-purple-50 p-3">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">원본 manifest / 접근</div>
          <div className="text-[11px] text-purple-900 mb-2">{approach}</div>
          <pre className="text-[10px] font-mono text-slate-700 bg-white rounded border border-purple-200 p-2 overflow-auto whitespace-pre-wrap">{lines.join('\n')}</pre>
        </div>
      );
    }

    function CompareBar({ compare }) {
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded bg-slate-100 border border-slate-300 px-2 py-1.5 text-center">
              <div className="text-[9px] text-slate-500">manifest 방식</div>
              <div className="text-[11px] font-bold text-slate-700">{compare.left}</div>
            </div>
            <div className="rounded bg-purple-100 border border-purple-300 px-2 py-1.5 text-center">
              <div className="text-[9px] text-purple-500">코드 방식</div>
              <div className="text-[11px] font-bold text-purple-800">{compare.right}</div>
            </div>
          </div>
          <div className="text-[10px] text-purple-700 text-center mt-1.5">↳ {compare.note}</div>
        </div>
      );
    }

    function ClusterView({ resources }) {
      if (!resources || resources.length === 0) {
        return (
          <div className="mt-3 rounded-lg border border-dashed border-purple-300 bg-purple-50/40 p-4 text-center text-xs text-purple-700">
            아직 클러스터에 배포된 리소스 없음 — 다음 step 부터 배포됨
          </div>
        );
      }
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="flex items-center gap-1.5 mb-1.5">
            <span className="text-base">☸️</span>
            <span className="text-[11px] font-bold text-purple-800">클러스터 리소스 ({resources.length})</span>
          </div>
          <div className="space-y-1">
            {resources.map((r) => {
              const st = STATUS_LABEL[r.status] || STATUS_LABEL.planning;
              return (
                <div key={r.id} className="flex items-center gap-2 rounded px-2 py-1 border bg-purple-50 border-purple-200">
                  <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-purple-200 text-purple-800">{r.kind}</span>
                  <span className="text-[11px] font-mono text-slate-700">{r.name}</span>
                  <span className={`text-[9px] px-1.5 py-0.5 rounded ml-auto ${st.cls}`}>{st.text}</span>
                </div>
              );
            })}
          </div>
          <div className="mt-2 pt-2 border-t border-purple-100 space-y-0.5">
            {resources.map((r) => (
              <div key={r.id} className="text-[10px] text-slate-500 flex items-center gap-1">
                <span className="font-mono text-purple-600">{r.name}</span>
                <span>· {r.detail}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">manifest → 코드 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 도메인 상태</span>
          </div>
          <ManifestCard approach={state.approach} lines={state.manifestLines} />
          <CompareBar compare={state.compare} />
          <ClusterView resources={state.k8sResources} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js) — 파일 탭 지원
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const [tabIdx, setTabIdx] = useState(0);
      const codeRef = useRef(null);

      // step 이 바뀌면 첫 탭으로 리셋
      useEffect(() => { setTabIdx(0); }, [stepIdx]);

      const tab = code.tabs[Math.min(tabIdx, code.tabs.length - 1)];

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [tab]);

      const highlightSet = new Set(tab.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return tab.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return tab.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{tab.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{tab.lang}</span>
          </div>
          {/* 파일 탭 */}
          <div className="flex items-center gap-1 px-2 pt-1.5 bg-slate-800 border-b border-slate-700">
            {code.tabs.map((t, i) => (
              <button
                key={t.filename}
                onClick={() => setTabIdx(i)}
                className={`px-2.5 py-1 text-[10px] font-mono rounded-t border-b-2 ${i === tabIdx ? 'bg-[#282c34] text-purple-300 border-purple-400' : 'bg-slate-700/40 text-slate-400 border-transparent hover:text-slate-200'}`}
              >{t.filename}</button>
            ))}
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${tab.lang}`}>{tab.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {tab.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{tab.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">III</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">III-1-2. Kubernetes provider — manifest → 코드</h1>
                <p className="text-sm text-purple-800/80">@pulumi/kubernetes 로 타입 안전한 K8s · ConfigFile/ConfigGroup · Helm/kustomize · 멀티 클러스터 provider · endpoint Output</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                @pulumi/kubernetes 는 K8s manifest 를 타입 안전한 코드로 옮겨 오타·환경분기·값 연결 문제를 해결한다. 새 리소스는 Deployment/Service/Ingress 타입 객체로, 기존 YAML 은 ConfigFile/ConfigGroup 으로 그대로 로드해 점진적으로 마이그레이션한다. 표준 스택은 helm.v3.Chart/Release 와 kustomize.Directory 로 다루고, k8s.Provider 로 여러 클러스터를 대상 삼는다. LoadBalancer endpoint 같은 값은 async Output 이라 .apply()/export 로 다른 리소스와 연결한다 — 앱 인프라와 K8s 워크로드를 한 프로그램에서 타입 안전하게. 다음 (III-2-1) 로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['@pulumi/kubernetes', 'Deployment', 'Service', 'ConfigFile', 'ConfigGroup', 'helm.v3.Chart', 'kustomize', 'k8s.Provider', 'Output.apply'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 챕터 목록</a>
              <div className="flex gap-4">
                <a href="./III-1-1.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: III-1-1</a>
                <a href="./III-2-1.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: III-2-1 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
