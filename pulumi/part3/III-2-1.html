            '        "ap-northeast-1": "web-ap-northeast-1.example.com",',
            '        "us-east-1":      "web-us-east-1.example.com",',
            '    }',
            '',
            'Resources:  + 9 created    Duration: 42s',
            '',
            '# 리전 추가? targetRegions 배열에 한 줄 넣고 다시 up.',
            '# 엔진이 DAG 분석 → 리전 간 독립 리소스는 병렬 생성.',
          ],
          highlight: [7, 8, 9, 22, 23, 24, 25, 39, 40],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — purple #8A3391 톤
    //   리전 그리드 + 리전마다 복제되는 스택 + 글로벌 리소스
    // ─────────────────────────────────────────────────────
    const STATUS_LABEL = {
      planning:  { text: '계획', cls: 'bg-slate-200 text-slate-700' },
      ready:     { text: 'provider 준비', cls: 'bg-amber-200 text-amber-800' },
      deploying: { text: '배포 중', cls: 'bg-sky-200 text-sky-800' },
      deployed:  { text: '배포 완료', cls: 'bg-emerald-200 text-emerald-800' },
      live:      { text: 'LIVE', cls: 'bg-purple-600 text-white' },
    };

    function RegionCard({ region, stack }) {
      const st = STATUS_LABEL[region.status] || STATUS_LABEL.planning;
      const hasStack = stack && stack.length > 0;
      return (
        <div className="rounded-lg border-2 border-purple-300 bg-purple-50 p-2 flex flex-col">
          <div className="flex items-center gap-1.5 mb-1">
            <span className="text-base">{region.icon}</span>
            <span className="text-xs font-bold text-purple-900">{region.name}</span>
            <span className={`ml-auto text-[9px] px-1.5 py-0.5 rounded ${st.cls}`}>{st.text}</span>
          </div>
          <div className="text-[10px] text-slate-600 font-mono mb-1.5">{region.code}</div>
          {hasStack ? (
            <div className="space-y-0.5">
              {stack.map((r, i) => (
                <div key={i} className="flex items-center gap-1 rounded bg-white border border-purple-200 px-1.5 py-0.5">
                  <span className="text-[9px] font-bold text-purple-700 font-mono">{r.kind}</span>
                  <span className="text-[9px] text-slate-500 ml-auto truncate">{r.note}</span>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-[9px] text-purple-400 italic">스택 대기 중</div>
          )}
        </div>
      );
    }

    function RegionGrid({ regions, stack }) {
      const cols = regions.length >= 3 ? 'grid-cols-3' : regions.length === 2 ? 'grid-cols-2' : 'grid-cols-1';
      return (
        <div>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[11px] font-bold text-purple-800">리전 그리드 ({regions.length})</span>
            {stack && stack.length > 0 && (
              <span className="text-[10px] text-purple-600">각 리전 = 동일 스택 {stack.length}개 복제</span>
            )}
          </div>
          <div className={`grid ${cols} gap-2`}>
            {regions.map((r) => (
              <RegionCard key={r.code} region={r} stack={stack} />
            ))}
          </div>
        </div>
      );
    }

    function GlobalResources({ globals }) {
      if (!globals || globals.length === 0) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-fuchsia-300 bg-fuchsia-50 p-2">
          <div className="text-[11px] font-bold text-fuchsia-800 mb-1.5">
            글로벌 리소스 — 리전 무관, 1회만 생성 (모든 리전 공유)
          </div>
          <div className="space-y-1">
            {globals.map((g, i) => (
              <div key={i} className="flex items-center gap-2 rounded bg-white border border-fuchsia-200 px-2 py-1">
                <span className="text-[10px] px-1.5 py-0.5 rounded font-bold bg-fuchsia-200 text-fuchsia-800">GLOBAL</span>
                <span className="text-[11px] font-mono text-slate-700">{g.kind}</span>
                <span className="text-[11px] text-slate-500 ml-auto truncate">{g.label}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">cross-region 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 배포 상태</span>
          </div>
          <RegionGrid regions={state.regions} stack={state.stack} />
          <GlobalResources globals={state.globals} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">III</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">III-2-1. cross-region 배포 — 여러 리전에 동일 인프라</h1>
                <p className="text-sm text-purple-800/80">명시적 provider 로 리전 지정 · 배열을 반복문으로 순회 복제 · 리전별 매핑 vs 글로벌 리소스 · 한 up 으로 N리전 병렬</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                리전은 명시적 provider 인스턴스(new aws.Provider({'{'} region {'}'}))로 지정하고, 리소스에 {'{'} provider {'}'} 옵션으로 넘긴다. 리전 배열을 언어의 반복문(for/map)으로 순회하면 동일 스택을 N개 리전에 그대로 복제할 수 있다 — Terraform 의 count/for_each 같은 특수 문법이 필요 없다. 리전별 차이(AMI·AZ)는 매핑 테이블로, 글로벌 리소스(IAM·Route53)는 반복문 밖에서 1회만 만든다. pulumi up 한 번에 엔진이 DAG 를 분석해 리전 간 독립 리소스를 병렬로 배포하고, Route53 로 active-active / DR 라우팅을 완성한다. 다음 (III-2-2) 로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['cross-region', 'aws.Provider', 'region 지정', 'for...of 복제', 'provider 옵션', 'AMI 매핑', 'AZ 매핑', '글로벌 vs 리전', 'active-active', 'DR', 'DAG 병렬'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 챕터 목록</a>
              <div className="flex items-center gap-4">
                <a href="./III-1-2.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: III-1-2</a>
                <a href="./III-2-2.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: III-2-2 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
