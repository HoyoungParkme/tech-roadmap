    function LoginForms({ forms }) {
      return (
        <div className="rounded-lg overflow-hidden border border-slate-700 bg-[#1e222a]">
          <div className="px-2 py-1 bg-slate-800 text-[10px] text-slate-300">로그인 URL 형식 3종</div>
          <div className="px-3 py-2 space-y-1">
            {forms.map((f) => (
              <div key={f.label} className="font-mono text-[11px] text-emerald-300 flex gap-2">
                <span className="text-purple-300 w-14 shrink-0">{f.label}</span>
                <span><span className="text-slate-500">$ </span>{f.cmd}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function FlowBox({ flow }) {
      return (
        <div className="rounded-lg border border-purple-200 bg-purple-50 p-2 flex items-center gap-2 text-[11px]">
          <span className="font-mono px-2 py-1 rounded bg-white border border-purple-200 text-purple-800">{flow.from}</span>
          <span className="font-bold" style={{ color: BRAND }}>migrate →</span>
          <span className="font-mono px-2 py-1 rounded bg-white border border-purple-300 text-purple-900 font-bold">{flow.to}</span>
        </div>
      );
    }

    function BackendMatrix({ focus }) {
      const focused = new Set(focus || []);
      const dimOthers = focused.size > 0;
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2 overflow-x-auto">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">backend 비교 매트릭스</div>
          <table className="w-full text-[10px] border-collapse">
            <thead>
              <tr className="text-purple-700">
                <th className="text-left px-1.5 py-1">backend</th>
                {COLS.map((c) => (
                  <th key={c.key} className="text-left px-1.5 py-1">{c.label}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {BACKENDS.map((b) => {
                const on = focused.has(b.name);
                const rowCls = on
                  ? 'bg-purple-50 ring-1 ring-purple-400'
                  : dimOthers ? 'opacity-40' : '';
                return (
                  <tr key={b.name} className={`border-t border-purple-100 ${rowCls}`}>
                    <td className="px-1.5 py-1 whitespace-nowrap">
                      <span className="mr-1">{b.icon}</span>
                      <span className="font-bold text-slate-700">{b.name}</span>
                    </td>
                    {COLS.map((c) => (
                      <td key={c.key} className={`px-1.5 py-1 whitespace-nowrap font-medium ${cellClass(b[c.key])}`}>
                        {b[c.key]}
                      </td>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="mt-1.5 flex gap-3 text-[9px] text-slate-500">
            <span><span className="text-emerald-700 font-bold">■</span> 기본 제공/무료</span>
            <span><span className="text-amber-700 font-bold">■</span> 설정 필요/실비</span>
            <span><span className="text-red-600 font-bold">■</span> 없음/제약</span>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">state backend 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 선택 상태</span>
          </div>
          {state.forms && <LoginForms forms={state.forms} />}
          {state.login && <LoginBox login={state.login} />}
          {state.flow && <div className="mt-2"><FlowBox flow={state.flow} /></div>}
          <BackendMatrix focus={state.focus} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js atom-one-dark)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: BRAND_DARK }}>V</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: BRAND_DARK }}>V-1-1. state backend 비교 — 어떤 backend 를 쓸까</h1>
                <p className="text-sm text-purple-800/80">관리형 Pulumi Cloud · DIY 오브젝트 스토리지(s3/gs/azblob) · 로컬 파일 · 잠금·암호화·마이그레이션</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className="h-1.5 flex-1 rounded-full transition"
                  style={{ backgroundColor: i <= stepIdx ? BRAND : '#e9d5ff' }}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl text-purple-50 px-5 py-4 shadow" style={{ backgroundColor: BRAND_DARK }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 text-xs rounded font-bold text-white"
                style={{ backgroundColor: playing ? BRAND_DARK : BRAND }}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm text-purple-900" style={{ borderColor: BRAND }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                state backend 는 로그인 URL 로 정해진다. 관리형 Pulumi Cloud 는 잠금·이력·RBAC·암호화가 기본이라 소규모 팀의 첫 선택이고, 데이터를 사내에 둬야 하면 s3:// gs:// azblob:// DIY 에 KMS 시크릿을 붙인다. Pulumi DIY 는 lock 파일 기반 잠금이 기본이라 Terraform 처럼 DynamoDB 를 따로 만들 필요가 없다. backend 는 pulumi stack migrate 또는 export/import 로 언제든 옮길 수 있고, 이전 후 preview 가 no changes 면 성공이다. 팀이면 잠금은 필수, 로컬 파일 협업은 금지. 다음 (V-1-2) 에서는 state 잠금과 동시성 문제를 더 깊게 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['state backend', 'pulumi login', 's3://', 'gs://', 'azblob://', 'file://', 'state locking', 'secrets provider', 'awskms', 'passphrase', 'stack migrate', 'export/import'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 목차</a>
              <a href="../part4/IV-2-2.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: IV-2-2</a>
              <a href="./V-1-2.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
