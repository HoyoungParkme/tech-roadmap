<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulumi 인터랙티브 학습 — V-1-2. secret — config 암호화</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔒</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!--
    Pulumi V-1-2 — secret · config 암호화
    학습 목표: 평문 config 의 위험 → pulumi config set --secret 암호화 저장 → secret provider(passphrase vs KMS)
               → config.requireSecret 로 복호화 사용 · pulumi.secret() 로 감싸기 → 출력/로그 자동 마스킹
    핵심 비유: 금고에 넣기 — 값을 넣는 순간 암호문이 되고, 프로그램만 잠깐 열어 쓰고, 화면엔 [secret] 으로 가려진다
    패턴: fastapi v1 — 좌(LiveDataPane: 값 변환 박스 + secret 파이프라인 5단계 + provider 비교) / 우(VSCode CodeViewer bash/ts/yaml)
    색상: purple #8A3391 (진한색 #5C2266)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — secret · config 암호화
    //   stage     : 현재 활성 파이프라인 단계 index (0~4)
    //   valueMode : 값 표현 방식 'plain' | 'cipher' | 'decrypt' | 'masked'
    //   provider  : 강조할 secret provider 'passphrase' | 'kms' | 'both'
    //   keyPoint  : 한 줄 정리
    //   code      : 우측 CodeViewer 탭 (bash/typescript/yaml 혼합)
    // ─────────────────────────────────────────────────────
    const STAGES = ['평문 입력', '--secret 암호화', 'state 암호문 저장', 'requireSecret 복호화', '출력 마스킹'];

    const STEPS = [
      {
        title: 'Step 1. 평문 config 의 위험 — DB 비밀번호가 그대로 노출된다',
        desc: 'Pulumi 는 stack 별 설정을 `Pulumi.<stack>.yaml` 파일에 저장한다. 그냥 `pulumi config set dbPassword hunter2` 로 넣으면 이 값이 **평문 그대로** yaml 에 박히고, 그 파일은 보통 git 에 커밋된다. 리뷰어·CI 로그·저장소 히스토리 어디서든 비밀번호가 새어 나간다. API 키·토큰·인증서도 마찬가지다. 실무에서 이렇게 커밋된 시크릿 하나가 사고로 이어지는 일이 흔하다. 그래서 민감 값은 절대 평문 config 로 두지 않는다.',
        stage: 0,
        valueMode: 'plain',
        provider: 'none',
        keyPoint: '평문 config 는 Pulumi.<stack>.yaml 에 그대로 박혀 git 에 노출된다. 시크릿엔 절대 금지.',
        code: {
          lang: 'bash',
          filename: 'config-plain.sh',
          lines: [
            '# ❌ 평문으로 넣으면 — 편하지만 위험하다',
            '$ pulumi config set dbPassword hunter2',
            '',
            '# 결과: Pulumi.dev.yaml 에 그대로 기록됨',
            '$ cat Pulumi.dev.yaml',
            'config:',
            '  myapp:dbHost: db.internal.example.com',
            '  myapp:dbPassword: hunter2   # ← 평문! 이대로 git 에 커밋된다',
            '',
            '# git 히스토리 · PR 리뷰 · CI 로그 어디서든 노출',
            '$ git add Pulumi.dev.yaml && git commit -m "add config"',
            '',
            '# 한 번 커밋되면 히스토리에서 지우기도 어렵다.',
            '# 민감 값(비밀번호 · API 키 · 토큰)은 이렇게 두면 안 된다.',
          ],
          highlight: [1, 2, 8, 9, 10, 11],
        },
      },
      {
        title: 'Step 2. --secret 플래그로 암호화 저장 — yaml 에 암호문만 남는다',
        desc: '똑같은 명령에 `--secret` 만 붙이면 Pulumi 가 값을 **넣는 즉시 암호화**한다. yaml 에는 평문 대신 `secure: v1:...` 형태의 암호문이 저장되고, 원본 값은 파일 어디에도 남지 않는다. 이제 이 파일을 git 에 커밋해도 안전하다 — 복호화 키가 없으면 아무도 못 읽는다. `pulumi config get dbPassword` 로 확인할 땐 자동 복호화되어 잠깐 보여주지만, 저장 상태는 항상 암호문이다. 시크릿을 다루는 가장 기본 습관이다.',
        stage: 2,
        valueMode: 'cipher',
        provider: 'passphrase',
        keyPoint: '--secret 하나로 즉시 암호화. yaml 엔 secure: v1:... 암호문만 남아 커밋해도 안전.',
        code: {
          lang: 'bash',
          filename: 'config-secret.sh',
          lines: [
            '# ✅ --secret 을 붙이면 넣는 즉시 암호화된다',
            '$ pulumi config set --secret dbPassword hunter2',
            '',
            '# 결과: 평문 대신 암호문(secure) 으로 저장됨',
            '$ cat Pulumi.dev.yaml',
            'config:',
            '  myapp:dbHost: db.internal.example.com',
            '  myapp:dbPassword:',
            '    secure: v1:8fK2nQ9r:d4Xx7c2mZp...9aBc==   # ← 암호문!',
            '',
            '# 값을 확인할 땐 자동 복호화 (저장 상태는 계속 암호문)',
            '$ pulumi config get dbPassword',
            'hunter2',
            '',
            '# 이제 이 yaml 은 git 에 커밋해도 안전하다.',
            '# 복호화 키가 없으면 secure 문자열은 의미 없는 암호문일 뿐.',
          ],
          highlight: [1, 2, 8, 9, 15, 16],
        },
      },
      {
        title: 'Step 3. secret provider — passphrase(기본) vs 클라우드 KMS',
        desc: '암호문을 풀 열쇠를 누가 쥐느냐가 secret provider 다. 기본값은 **passphrase** — `PULUMI_CONFIG_PASSPHRASE` 환경변수(암호 하나)로 암호화한다. 혼자 쓰기엔 간단하지만 팀이 그 암호를 공유해야 하고, 암호를 잃으면 복구 불가다. 팀·운영 환경에선 **클라우드 KMS**(awskms / gcpkms / azurekeyvault)를 쓴다. 열쇠를 클라우드가 관리하니 IAM 권한으로 누가 복호화할 수 있는지 통제되고, 암호를 따로 나눠 가질 필요가 없다. stack 을 만들 때 `--secrets-provider` 로 지정한다.',
        stage: 2,
        valueMode: 'cipher',
        provider: 'both',
        keyPoint: 'passphrase = 암호 하나(간단, 공유 부담). KMS = 클라우드가 열쇠 관리(IAM 통제, 팀 공유에 적합).',
        code: {
          lang: 'bash',
          filename: 'secrets-provider.sh',
          lines: [
            '# (A) 기본 — passphrase provider',
            '$ export PULUMI_CONFIG_PASSPHRASE="team-shared-pass"',
            '$ pulumi stack init dev            # 별도 지정 없으면 passphrase',
            '#   장점: 의존성 없음 / 단점: 암호 공유·분실 위험',
            '',
            '# (B) 팀·운영 — AWS KMS 를 열쇠로',
            '$ pulumi stack init prod \\',
            '    --secrets-provider="awskms://alias/pulumi-prod?region=ap-northeast-2"',
            '',
            '# GCP KMS 예시',
            '$ pulumi stack init prod \\',
            '    --secrets-provider="gcpkms://projects/p/locations/global/keyRings/r/cryptoKeys/k"',
            '',
            '# Azure Key Vault 예시',
            '$ pulumi stack init prod \\',
            '    --secrets-provider="azurekeyvault://myvault.vault.azure.net/keys/pulumi-key"',
            '',
            '# KMS 는 열쇠를 클라우드가 보관 → IAM 권한 가진 팀원만 복호화.',
            '# 암호를 사람끼리 나눠 가질 필요가 없다. → 팀 협업의 표준.',
          ],
          highlight: [1, 2, 3, 6, 7, 8, 18, 19],
        },
      },
      {
        title: 'Step 4. 코드에서 읽기 — requireSecret · Output 은 secret 로 전파',
        desc: '프로그램에선 `config.requireSecret("dbPassword")` 로 읽는다. 반환값은 평범한 string 이 아니라 **Output&lt;string&gt; 이면서 secret 표시가 붙은 값**이다. 이 값을 `.apply()` 로 가공하거나 다른 리소스 입력에 연결하면 secret 속성이 **자동으로 전파**된다 — 즉 시크릿에서 파생된 값은 계속 시크릿으로 취급된다. 반대로 코드 안에서 계산한 일반 값을 시크릿으로 만들고 싶으면 `pulumi.secret(value)` 로 감싼다. 이렇게 하면 어디에 쓰이든 로그·출력에서 가려진다.',
        stage: 3,
        valueMode: 'decrypt',
        provider: 'kms',
        keyPoint: 'config.requireSecret → Output<string>(secret). 파생값도 secret 자동 전파. pulumi.secret() 로 감싸기.',
        code: {
          lang: 'typescript',
          filename: 'index.ts',
          lines: [
            'import * as pulumi from "@pulumi/pulumi";',
            'import * as aws from "@pulumi/aws";',
            '',
            'const cfg = new pulumi.Config();',
            '',
            '// requireSecret → Output<string> 이면서 secret 표시가 붙음',
            'const dbPassword = cfg.requireSecret("dbPassword");',
            'const dbHost     = cfg.require("dbHost");   // 이건 평문 config',
            '',
            '// secret 을 리소스 입력에 연결 — secret 속성이 자동 전파',
            'const db = new aws.rds.Instance("app-db", {',
            '  engine:        "postgres",',
            '  instanceClass: "db.t3.micro",',
            '  username:      "appuser",',
            '  password:      dbPassword,   // ← secret Output 그대로 전달',
            '  allocatedStorage: 20,',
            '});',
            '',
            '// 시크릿에서 파생된 값도 계속 secret 로 취급됨',
            'const connString = dbPassword.apply((pw) =>',
            '  `postgres://appuser:${pw}@${dbHost}:5432/app`',
            ');   // ← connString 역시 secret',
            '',
            '// 일반 값을 강제로 secret 로 만들고 싶으면 감싼다',
            'const apiKey = pulumi.secret(process.env.API_KEY ?? "");',
            '',
            '// export 해도 출력 시 자동 마스킹된다 (다음 step)',
            'export const dbConnection = connString;',
            'export const serviceApiKey = apiKey;',
          ],
          highlight: [6, 7, 14, 19, 20, 21, 22, 24, 25],
        },
      },
      {
        title: 'Step 5. 출력·로그에서 자동 마스킹 — 화면엔 [secret] 만',
        desc: '`pulumi up` / `pulumi preview` 를 돌리면 secret 로 표시된 값은 콘솔 출력에서 **`[secret]` 으로 가려진다**. export 한 stack output 도 마찬가지다. 실제로 값을 봐야 하면 `pulumi stack output dbConnection --show-secrets` 로 명시적으로 요청해야만 풀린다. state 파일(`pulumi stack export`)에서도 시크릿은 암호문으로 저장되므로, 백업된 state 가 유출돼도 값은 지켜진다. 정리하면 — **입력은 --secret 으로, 코드에선 requireSecret / pulumi.secret 로, 출력은 자동 마스킹** 이 한 세트다.',
        stage: 4,
        valueMode: 'masked',
        provider: 'kms',
        keyPoint: '출력·로그·state 어디서나 자동 마스킹. 값을 보려면 --show-secrets 를 명시해야만 풀린다.',
        code: {
          lang: 'bash',
          filename: 'pulumi-up.sh',
          lines: [
            '$ pulumi up',
            '',
            'Updating (prod):',
            '     Type                     Name        Status',
            ' +   pulumi:pulumi:Stack      myapp-prod  created',
            ' +   └─ aws:rds:Instance      app-db      created (94s)',
            '',
            'Outputs:',
            '    dbConnection:   [secret]      # ← 자동 마스킹',
            '    serviceApiKey:  [secret]      # ← 자동 마스킹',
            '',
            'Resources:',
            '    + 2 created',
            '',
            '# 값을 정말 봐야 할 때만 명시적으로 요청',
            '$ pulumi stack output dbConnection --show-secrets',
            'postgres://appuser:hunter2@db.internal.example.com:5432/app',
            '',
            '# state 를 내보내도 시크릿은 암호문으로만 존재',
            '$ pulumi stack export | grep dbPassword',
            '  "dbPassword": { "secret": true, "ciphertext": "v1:8fK2..." }',
            '',
            '# 한 세트: 입력 --secret · 코드 requireSecret/pulumi.secret · 출력 자동 마스킹',
          ],
          highlight: [8, 9, 10, 15, 16, 17, 19, 20, 21, 23],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — purple #8A3391 톤
    // ─────────────────────────────────────────────────────
    const VALUE_VIEW = {
      plain:   { label: '평문 그대로', text: 'hunter2', cls: 'bg-red-50 border-red-300 text-red-700', tag: '위험 · 노출', tagCls: 'bg-red-200 text-red-800' },
      cipher:  { label: '암호문으로 저장', text: 'secure: v1:8fK2nQ9r:d4Xx7c2mZp...9aBc==', cls: 'bg-emerald-50 border-emerald-300 text-emerald-800', tag: '안전 · 커밋 가능', tagCls: 'bg-emerald-200 text-emerald-800' },
      decrypt: { label: '프로그램 안에서만 복호화', text: 'Output<string> (secret) → hunter2', cls: 'bg-amber-50 border-amber-300 text-amber-800', tag: '메모리에서만', tagCls: 'bg-amber-200 text-amber-800' },
      masked:  { label: '출력·로그에서 마스킹', text: '[secret]', cls: 'bg-purple-50 border-purple-300 text-purple-800', tag: '자동 가림', tagCls: 'bg-purple-200 text-purple-800' },
    };

    function ValueBox({ mode }) {
      const v = VALUE_VIEW[mode] || VALUE_VIEW.plain;
      return (
        <div className={`rounded-lg border-2 p-3 ${v.cls}`}>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[11px] font-bold">현재 값의 상태 — {v.label}</span>
            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${v.tagCls}`}>{v.tag}</span>
          </div>
          <div className="font-mono text-[12px] break-all bg-white/60 rounded px-2 py-1.5 border border-white">{v.text}</div>
        </div>
      );
    }

    function SecretPipeline({ activeStage }) {
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">secret 라이프사이클</div>
          <div className="space-y-1">
            {STAGES.map((label, i) => {
              const isDone = i < activeStage;
              const isActive = i === activeStage;
              const cls = isActive
                ? 'bg-purple-100 border-purple-400 text-purple-900'
                : isDone
                ? 'bg-purple-50 border-purple-200 text-purple-600'
                : 'bg-slate-50 border-slate-200 text-slate-400';
              const mark = isActive ? '▶' : isDone ? '✓' : '·';
              return (
                <div key={i} className={`flex items-center gap-2 rounded px-2 py-1 border ${cls}`}>
                  <span className="w-4 text-center text-[11px] font-bold">{mark}</span>
                  <span className="text-[11px] font-mono">{i + 1}. {label}</span>
                  {isActive && <span className="ml-auto text-[10px] px-1.5 py-0.5 rounded bg-purple-200 text-purple-800 font-bold">지금 여기</span>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const PROVIDERS = [
      { key: 'passphrase', name: 'passphrase (기본)', desc: '암호 1개로 암호화 · 의존성 0', note: '분실·공유 위험', icon: '🔑' },
      { key: 'kms',        name: '클라우드 KMS',       desc: 'awskms · gcpkms · azurekeyvault', note: 'IAM 통제 · 팀 표준', icon: '☁️' },
    ];

    function ProviderCompare({ provider }) {
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">secret provider (열쇠를 누가 쥐나)</div>
          <div className="grid grid-cols-2 gap-2">
            {PROVIDERS.map((p) => {
              const on = provider === p.key || provider === 'both';
              return (
                <div
                  key={p.key}
                  className={`rounded-lg border-2 p-2 ${on ? 'bg-purple-50 border-purple-400' : 'bg-slate-50 border-slate-200 opacity-60'}`}
                >
                  <div className="flex items-center gap-1.5 mb-1">
                    <span className="text-base">{p.icon}</span>
                    <span className={`text-[11px] font-bold ${on ? 'text-purple-800' : 'text-slate-500'}`}>{p.name}</span>
                  </div>
                  <div className="text-[10px] text-slate-600 font-mono leading-tight">{p.desc}</div>
                  <div className={`mt-1 text-[10px] px-1.5 py-0.5 rounded inline-block ${on ? 'bg-purple-200 text-purple-800' : 'bg-slate-200 text-slate-500'}`}>{p.note}</div>
                </div>
              );
            })}
          </div>
          {provider === 'none' && (
            <div className="mt-2 text-[10px] text-red-600">아직 암호화 전 — provider 는 --secret 을 쓸 때부터 의미가 생긴다.</div>
          )}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">secret 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 값의 안전 상태</span>
          </div>
          <ValueBox mode={state.valueMode} />
          <SecretPipeline activeStage={state.stage} />
          <ProviderCompare provider={state.provider} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">V</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">V-1-2. secret — config 암호화</h1>
                <p className="text-sm text-purple-800/80">--secret 으로 즉시 암호화 · passphrase vs KMS · requireSecret 로 사용 · 출력 자동 마스킹</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                시크릿은 세 지점에서 지킨다. (1) 입력 — `pulumi config set --secret` 으로 넣는 즉시 암호화되어 Pulumi.&lt;stack&gt;.yaml 에 secure 암호문만 남는다. (2) 열쇠 — 혼자면 passphrase, 팀·운영이면 awskms/gcpkms/azurekeyvault 로 IAM 통제. (3) 사용·출력 — 코드에선 `config.requireSecret` 로 읽고 `pulumi.secret()` 로 감싸며, 파생값도 secret 로 전파되어 up/preview/state 어디서나 `[secret]` 으로 자동 마스킹된다. 값을 보려면 `--show-secrets` 를 명시해야만 풀린다. 다음 (V-2-1) 에서는 stack 간 값 공유(StackReference)를 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['--secret', 'config encryption', 'secure ciphertext', 'passphrase', 'awskms', 'gcpkms', 'azurekeyvault', 'requireSecret', 'pulumi.secret', 'output masking', '--show-secrets'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="목차">← 목차</a>
              <div className="flex gap-4">
                <a href="./V-1-1.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: V-1-1</a>
                <a href="./V-2-1.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: V-2-1 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
