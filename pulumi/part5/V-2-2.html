    const PHASE_STYLE = {
      console:   { bg: 'bg-slate-50',   border: 'border-slate-300',   badge: 'bg-slate-200 text-slate-700',     text: '콘솔 수동 · 미관리', icon: '🖐️' },
      importing: { bg: 'bg-amber-50',    border: 'border-amber-300',   badge: 'bg-amber-200 text-amber-800',     text: 'import 중',        icon: '⏳' },
      imported:  { bg: 'bg-purple-50',   border: 'border-purple-300',  badge: 'bg-purple-200 text-purple-800',   text: 'state 등록됨',     icon: '📥' },
      verified:  { bg: 'bg-emerald-50',  border: 'border-emerald-300', badge: 'bg-emerald-200 text-emerald-800', text: 'diff 0 · 편입 완료', icon: '✅' },
    };

    function StateBar({ stateCount, total }) {
      return (
        <div className="rounded-lg border-2 border-purple-300 bg-purple-50 p-2.5">
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold text-purple-800">Pulumi state</span>
            <span className="text-[11px] font-mono text-purple-700">{stateCount} / {total} 등록</span>
          </div>
          <div className="mt-1.5 flex gap-1">
            {Array.from({ length: total }).map((_, i) => (
              <div
                key={i}
                className={`h-2 flex-1 rounded-full ${i < stateCount ? 'bg-purple-700' : 'bg-purple-200'}`}
              />
            ))}
          </div>
        </div>
      );
    }

    function ResourceList({ resources }) {
      return (
        <div className="mt-3 rounded-lg border border-purple-200 bg-white p-2">
          <div className="text-[11px] font-bold text-purple-800 mb-1.5">기존 리소스 ({resources.length})</div>
          <div className="space-y-1">
            {resources.map((r) => {
              const s = PHASE_STYLE[r.phase] || PHASE_STYLE.console;
              return (
                <div key={r.id} className={`flex items-center gap-2 rounded px-2 py-1.5 border ${s.bg} ${s.border}`}>
                  <span className="text-base">{s.icon}</span>
                  <div className="min-w-0">
                    <div className="text-[11px] font-mono text-slate-700">{r.kind}</div>
                    <div className="text-[10px] text-slate-500 truncate">{r.label}</div>
                  </div>
                  <span className={`ml-auto text-[10px] px-1.5 py-0.5 rounded font-bold whitespace-nowrap ${s.badge}`}>{s.text}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function DiffBadge({ diff }) {
      if (diff === null || diff === undefined) {
        return (
          <div className="mt-3 rounded-lg border border-dashed border-purple-300 bg-purple-50/40 p-2.5 text-center text-[11px] text-purple-700">
            아직 preview diff 미확인 — 편입 진행 중
          </div>
        );
      }
      if (diff === 0) {
        return (
          <div className="mt-3 rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2.5 text-center">
            <div className="text-sm font-bold text-emerald-800">preview diff = 0</div>
            <div className="text-[10px] text-emerald-700 mt-0.5">코드 = 실제. 관리 하 편입 완료 ✅</div>
          </div>
        );
      }
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-400 bg-amber-50 p-2.5 text-center">
          <div className="text-sm font-bold text-amber-800">preview diff = {diff}</div>
          <div className="text-[10px] text-amber-700 mt-0.5">코드를 실제에 맞춰 0 으로 만들자</div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">brownfield 편입 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">왼쪽 = 도메인 상태</span>
          </div>
          <StateBar stateCount={state.stateCount} total={state.resources.length} />
          <ResourceList resources={state.resources} />
          <DiffBadge diff={state.diff} />
          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">V</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">V-2-2. brownfield import — 기존 리소스를 코드로 가져오기</h1>
                <p className="text-sm text-purple-800/80">콘솔로 만든 기존 리소스 · pulumi import · state 등록 + 코드 생성 · bulk import.json · preview diff 0</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                brownfield import 는 콘솔로 만든 기존 리소스를 IaC 로 편입하는 절차다. `pulumi import &lt;type&gt; &lt;name&gt; &lt;id&gt;` 가 state 등록과 코드 생성을 동시에 하고, 출력된 코드는 반드시 프로그램에 붙여넣어야 state 와 짝이 맞는다. `protect: true` 로 운영 리소스의 실수 삭제를 막고, 리소스가 많으면 `--file import.json` 으로 일괄 편입한다. 마지막에 `pulumi preview` 의 diff 가 0 이면 코드가 실제와 일치한다는 뜻 — 이때부터 모든 변경은 코드로 추적된다. 레거시를 한 번에 옮기려 하지 말고 점진적으로(greenfield 아닌 brownfield) 편입하는 게 실무 정석이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['brownfield', 'pulumi import', 'state 등록', '코드 생성', 'import.json', 'bulk import', 'protect', 'preview diff 0', 'IaC 편입'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 목차</a>
              <a href="./V-2-1.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: V-2-1</a>
              <a href="../index.html" className="underline hover:no-underline" aria-label="전체 목차로">전체 목차 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
