<body>
  <div id="root"></div>

  <!--
    Pulumi V-2-1 — drift 감지: refresh / preview
    학습 목표: state 기록과 실제 클라우드가 어긋나는 drift 를 refresh/preview 로 감지하고 재수렴시키는 5단계
    핵심 비유: 설계도(코드) · 준공 도면(state) · 실제 건물(클라우드) — 셋이 어긋나면 어느 것을 진실로 삼을지 정한다
    패턴: fastapi v1 — 좌(LiveDataPane: 코드/state/실제 3열 drift 표) / 우(VSCode CodeViewer bash·diff·json)
    색상: purple #8A3391 (Pulumi 브랜드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — drift 감지 → refresh → preview → 재수렴 → 스케줄 감시
    //   phase : 좌측 상태 배지 키
    //   rows  : [{ key, code, state, actual }] 3자 비교표
    //   note  : 흐름 설명 한 줄
    //   keyPoint : 한 줄 정리
    //   code  : 우측 CodeViewer 탭
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. drift 란? — state 기록 ≠ 실제 클라우드',
        desc: 'Pulumi 는 배포할 때마다 "실제로 뭘 만들었는지"를 state(스냅샷)에 기록한다. 그런데 누군가 AWS 콘솔에서 손으로 인스턴스 타입을 바꾸거나, 외부 자동화(오토스케일러·보안팀 스크립트)가 리소스를 건드리면, 실제 클라우드는 바뀌었는데 state 기록은 옛날 값 그대로다. 이렇게 state 와 실제 리소스가 어긋난 상태를 drift 라고 한다. drift 를 방치하면 다음 pulumi up 이 예상 못 한 diff 를 만들거나, 장애 대응이 꼬인다.',
        phase: 'drift',
        note: '콘솔에서 t3.small → t3.large, monitoring on, Env=staging 로 수동 변경됨. state 는 아직 옛 값.',
        rows: [
          { key: 'instanceType', code: 't3.small', state: 't3.small', actual: 't3.large' },
          { key: 'monitoring',   code: 'false',    state: 'false',    actual: 'true' },
          { key: 'tags.Env',     code: 'prod',     state: 'prod',     actual: 'staging' },
        ],
        keyPoint: 'drift = state 기록 ≠ 실제 클라우드. 콘솔 수동 변경이 가장 흔한 원인.',
        code: {
          lang: 'typescript',
          filename: 'index.ts',
          lines: [
            'import * as aws from "@pulumi/aws";',
            '',
            '// 코드가 선언한 "원하는 상태" (desired state)',
            'export const webServer = new aws.ec2.Instance("web-server", {',
            '  ami:          "ami-0abcd1234",',
            '  instanceType: "t3.small",   // 코드 기준',
            '  monitoring:   false,        // 상세 모니터링 off',
            '  tags: {',
            '    Name: "web-server",',
            '    Env:  "prod",             // 코드 기준',
            '  },',
            '});',
            '',
            '// 문제 — 누군가 AWS 콘솔에서 손으로 바꿨다',
            '//   instanceType  t3.small → t3.large  (트래픽 급증 대응)',
            '//   monitoring    off      → on',
            '//   tags.Env      prod     → staging   (실수)',
            '//',
            '// state 파일에는 여전히 t3.small 로 기록돼 있다.',
            '// => state 기록  ≠  실제 클라우드  ==  drift 발생',
          ],
          highlight: [3, 4, 5, 6, 7, 13, 14, 15, 16, 17, 18, 19],
        },
      },
      {
        title: 'Step 2. pulumi refresh — 실제를 읽어 state 에 반영',
        desc: 'pulumi refresh 는 실제 클라우드 API 를 하나하나 조회해서, state 스냅샷을 "지금 실제 값"으로 갱신한다. 중요한 건 refresh 는 실제 리소스를 건드리지 않는다는 것 — 오직 state 기록만 현실에 맞춘다. 실행하면 어떤 리소스가 어떤 속성에서 어긋났는지 ~update diff 로 보여준다. refresh 후에는 state 와 실제가 일치하지만, 이번엔 state 와 코드(index.ts)가 어긋난다. drift 는 "사라진" 게 아니라 감지되어 드러난 것이다.',
        phase: 'refreshed',
        note: 'refresh 후: state = 실제(t3.large / on / staging). 이제 state ≠ 코드. 실제 리소스는 그대로.',
        rows: [
          { key: 'instanceType', code: 't3.small', state: 't3.large', actual: 't3.large' },
          { key: 'monitoring',   code: 'false',    state: 'true',     actual: 'true' },
          { key: 'tags.Env',     code: 'prod',     state: 'staging',  actual: 'staging' },
        ],
        keyPoint: 'pulumi refresh = 실제를 읽어 state 만 갱신. 코드도 실제 리소스도 안 바꾼다.',
        code: {
          lang: 'bash',
          filename: 'refresh.sh',
          lines: [
            '# 실제 클라우드 상태를 읽어 state 에 반영',
            '$ pulumi refresh',
            '',
            'Previewing refresh (prod):',
            '     Type              Name         Plan',
            ' ~   aws:ec2:Instance  web-server   update',
            '         [diff: ~instanceType ~monitoring ~tags]',
            '',
            'Resources:',
            '    ~ 1 to update',
            '',
            'Do you want to perform this refresh? yes',
            '',
            'Refreshing (prod):',
            ' ~   aws:ec2:Instance  web-server   updated (0.9s)',
            '         [diff: ~instanceType ~monitoring ~tags]',
            '',
            'Resources:',
            '    ~ 1 updated',
            '',
            '# refresh 후: state = 실제(t3.large / on / staging)',
            '# 하지만 이제 state != 코드(index.ts) 로 어긋난다.',
            '# 주의 — refresh 는 실제 리소스를 바꾸지 않는다.',
            '#        오직 state 기록만 현실에 맞춘다.',
          ],
          highlight: [1, 2, 5, 6, 7, 20, 21, 22, 23],
        },
      },
      {
        title: 'Step 3. pulumi preview --refresh — 저장 없이 diff 미리보기',
        desc: 'state 를 실제로 덮어쓰기 전에 "만약 지금 up 하면 뭐가 바뀔까"를 안전하게 보고 싶을 때 preview --refresh 를 쓴다. 이건 메모리상에서만 refresh 를 한 뒤, 그 실제 값과 코드를 비교한 diff 를 보여주고 state 파일은 저장하지 않는다. 출력의 각 줄은 "실제 값 => 코드가 원하는 값" 방향이다. 즉 preview 는 up 이 실제 리소스를 어떻게 코드 기준으로 되돌릴지 미리 알려준다. create/update/replace/delete/same 중 여기서는 update 3건이 잡힌다.',
        phase: 'preview',
        note: 'preview 는 읽기 전용 — state 저장 안 함. diff 방향: 실제(콘솔 값) => 코드가 원하는 값.',
        rows: [
          { key: 'instanceType', code: 't3.small', state: 't3.large', actual: 't3.large' },
          { key: 'monitoring',   code: 'false',    state: 'true',     actual: 'true' },
          { key: 'tags.Env',     code: 'prod',     state: 'staging',  actual: 'staging' },
        ],
        keyPoint: 'preview --refresh = 저장 없이 diff 미리보기. update/create/replace/delete/same 을 미리 확인.',
        code: {
          lang: 'diff',
          filename: 'preview.txt',
          lines: [
            '# 메모리상 refresh 후 코드와 비교만 — state 저장 안 함',
            '$ pulumi preview --refresh',
            '',
            'Previewing update (prod):',
            '     Type              Name         Plan',
            ' ~   aws:ec2:Instance  web-server   update',
            '',
            '    ~ instanceType: "t3.large"  => "t3.small"',
            '    ~ monitoring:   true        => false',
            '    ~ tags.Env:     "staging"   => "prod"',
            '',
            'Resources:',
            '    ~ 1 to update',
            '    9 unchanged',
            '',
            '# preview 가 알려주는 것:',
            '#   실제(콘솔에서 바뀐 값)  =>  코드가 원하는 값',
            '# pulumi up 을 하면 코드 기준으로 되돌린다(재수렴).',
            '# Plan 종류: create / update / replace / delete / same',
          ],
          highlight: [1, 2, 7, 8, 9, 15, 16, 17, 18],
        },
      },
      {
        title: 'Step 4. 재수렴 — 코드로 되돌리거나 코드를 고치거나',
        desc: 'drift 를 확인했으면 방향을 정한다. (A) 코드가 진실이면 pulumi up 으로 실제 리소스를 코드 기준으로 되돌린다 — 코드/state/실제 3자가 다시 일치(재수렴)한다. (B) 콘솔 변경이 옳은 영구 변경이었다면 index.ts 를 그 값으로 고친 뒤 up 하면 no-op 이 되어 코드가 진실의 원천으로 유지된다. 판단 기준은 간단하다: 임시 핫픽스였으면 A 로 원복, 의도된 영구 변경이면 B 로 코드에 반영. 어느 쪽이든 최종 목표는 "코드(IaC) = 진실의 원천"을 지키는 것이다.',
        phase: 'converged',
        note: '방법 A(up) 로 실제를 코드로 원복 → 3자 일치. 또는 방법 B 로 코드를 현실에 맞춘다.',
        rows: [
          { key: 'instanceType', code: 't3.small', state: 't3.small', actual: 't3.small' },
          { key: 'monitoring',   code: 'false',    state: 'false',    actual: 'false' },
          { key: 'tags.Env',     code: 'prod',     state: 'prod',     actual: 'prod' },
        ],
        keyPoint: 'up 으로 코드 기준 재수렴 or 코드 수정. 어느 쪽이든 IaC 가 진실의 원천.',
        code: {
          lang: 'bash',
          filename: 'reconverge.sh',
          lines: [
            '# 방법 A) 코드가 진실 — 실제를 코드로 되돌린다',
            '$ pulumi up',
            ' ~   aws:ec2:Instance  web-server  updated (18s)',
            '         instanceType: t3.large => t3.small',
            '         monitoring:   true     => false',
            '         tags.Env:     staging  => prod',
            '# => 코드 / state / 실제 3자가 다시 일치 (재수렴)',
            '',
            '# 방법 B) 콘솔 변경이 옳다 — 코드를 현실에 맞춘다',
            '#   index.ts 를 t3.large / monitoring:true 로 수정 후',
            '$ pulumi up   # 변경 없음(no-op) → 코드가 진실의 원천 유지',
            '',
            '# 판단 기준',
            '#   임시 긴급 변경(핫픽스)  => 방법 A 로 코드 기준 원복',
            '#   의도된 영구 변경        => 방법 B 로 코드에 반영',
            '# 최종 목표: 코드(IaC) = 진실의 원천(single source of truth)',
          ],
          highlight: [1, 2, 7, 9, 11, 15, 16],
        },
      },
      {
        title: 'Step 5. Pulumi Cloud drift detection — 스케줄 + 알림',
        desc: 'drift 를 사람이 매번 refresh 로 확인하긴 어렵다. Pulumi Cloud 는 스택마다 drift 감지를 스케줄(예: 매시간)로 돌려 주고, drift 가 잡히면 Slack/이메일로 알림을 보낸다. auto-remediate 를 켜면 감지 즉시 코드 기준으로 자동 원복까지 하지만, 운영에서는 스테이징부터 신중히 적용한다. 실무 루틴은 이렇다: 정기 refresh/preview 로 drift 를 조기에 발견하고, 알림으로 즉시 원인을 추적하며, 콘솔 수동 변경을 최소화해 IaC 코드를 언제나 진실의 원천으로 유지한다.',
        phase: 'insync',
        note: 'Pulumi Cloud 가 매시간 drift 검사. 어긋나면 Slack/email 알림. 코드가 진실의 원천으로 유지됨.',
        rows: [
          { key: 'instanceType', code: 't3.small', state: 't3.small', actual: 't3.small' },
          { key: 'monitoring',   code: 'false',    state: 'false',    actual: 'false' },
          { key: 'tags.Env',     code: 'prod',     state: 'prod',     actual: 'prod' },
        ],
        keyPoint: 'Pulumi Cloud 스케줄 drift 감지 + 알림으로 조기 발견. 정기 refresh 로 진실의 원천 유지.',
        code: {
          lang: 'json',
          filename: 'drift-schedule.json',
          lines: [
            '{',
            '  "kind": "drift",',
            '  "schedule": {',
            '    "cron": "0 * * * *",',
            '    "comment": "매시간 drift 검사"',
            '  },',
            '  "onDrift": {',
            '    "autoRemediate": false,',
            '    "notifications": {',
            '      "slack": "#infra-alerts",',
            '      "email": "sre@example.com"',
            '    }',
            '  },',
            '  "setup": "Pulumi Cloud > Stack > Settings > Drift 에서 등록",',
            '  "practice": [',
            '    "정기 refresh/preview 로 drift 를 조기 발견",',
            '    "drift 알림을 Slack/email 로 받아 즉시 원인 추적",',
            '    "autoRemediate 는 스테이징부터 신중히 적용",',
            '    "콘솔 수동 변경 최소화 — IaC 를 진실의 원천으로 유지"',
            '  ]',
            '}',
          ],
          highlight: [2, 3, 4, 7, 8, 9, 10, 11, 14, 15, 16, 17, 18],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — purple #8A3391 톤
    //   코드(desired) / state(.pulumi) / 실제(AWS) 3열 비교표
    //   actual != state → actual 셀 빨강(감지된 drift)
    //   state != code   → state 셀 주황(refresh 후 config drift)
    // ─────────────────────────────────────────────────────
    const PHASE = {
      drift:     { label: 'DRIFT 감지됨',            cls: 'bg-red-100 text-red-700 border-red-300',       icon: '⚠️' },
      refreshed: { label: 'refresh 완료 (state=실제)', cls: 'bg-amber-100 text-amber-800 border-amber-300', icon: '🔄' },
      preview:   { label: 'preview --refresh (읽기전용)', cls: 'bg-sky-100 text-sky-800 border-sky-300',    icon: '👁️' },
      converged: { label: '재수렴 완료 (코드=state=실제)', cls: 'bg-emerald-100 text-emerald-800 border-emerald-300', icon: '✅' },
      insync:    { label: 'Pulumi Cloud 감시 중',      cls: 'bg-purple-100 text-purple-800 border-purple-300', icon: '🛰️' },
    };

    function FlowBar() {
      return (
        <div className="flex items-center justify-center gap-2 text-[11px] font-mono mb-3">
          <span className="px-2 py-1 rounded bg-purple-700 text-white">코드 index.ts</span>
          <span className="text-purple-400">→</span>
          <span className="px-2 py-1 rounded bg-purple-200 text-purple-900">state .pulumi</span>
          <span className="text-purple-400">→</span>
          <span className="px-2 py-1 rounded bg-slate-700 text-white">실제 AWS</span>
        </div>
      );
    }

    function DriftTable({ rows }) {
      return (
        <div className="rounded-lg border border-purple-200 bg-white overflow-hidden">
          <div className="grid grid-cols-4 text-[11px] font-bold bg-purple-50 text-purple-800 border-b border-purple-200">
            <div className="px-2 py-1.5">속성</div>
            <div className="px-2 py-1.5">코드 (desired)</div>
            <div className="px-2 py-1.5">state (.pulumi)</div>
            <div className="px-2 py-1.5">실제 (AWS)</div>
          </div>
          {rows.map((r) => {
            const stateDrift = r.actual !== r.state;   // 감지된 drift
            const configDrift = r.state !== r.code;    // refresh 후 코드와 어긋남
            const stateCls = configDrift ? 'bg-amber-100 text-amber-800 font-bold' : 'text-slate-600';
            const actualCls = stateDrift ? 'bg-red-100 text-red-700 font-bold' : 'text-slate-600';
            return (
              <div key={r.key} className="grid grid-cols-4 text-[11px] font-mono border-b border-purple-50 last:border-0">
                <div className="px-2 py-1.5 text-purple-900 font-sans font-semibold">{r.key}</div>
                <div className="px-2 py-1.5 text-purple-800">{r.code}</div>
                <div className={`px-2 py-1.5 ${stateCls}`}>{r.state}</div>
                <div className={`px-2 py-1.5 ${actualCls}`}>{r.actual}</div>
              </div>
            );
          })}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const ph = PHASE[state.phase] || PHASE.drift;
      const driftCount = state.rows.filter((r) => r.actual !== r.state).length;
      const configCount = state.rows.filter((r) => r.state !== r.code).length;
      return (
        <div className="rounded-xl border border-purple-200 bg-white p-4 h-full flex flex-col overflow-auto">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-purple-800">drift 라이브 뷰</h3>
            <span className="text-[10px] text-slate-500">aws.ec2.Instance · web-server</span>
          </div>

          <div className={`inline-flex items-center gap-2 self-start px-2.5 py-1 rounded-full border text-xs font-bold mb-3 ${ph.cls}`}>
            <span>{ph.icon}</span>{ph.label}
          </div>

          <FlowBar />
          <DriftTable rows={state.rows} />

          <div className="mt-3 flex gap-2 text-[11px]">
            <span className="px-2 py-1 rounded bg-red-50 border border-red-200 text-red-700">
              state≠실제 (감지된 drift): <b>{driftCount}</b>
            </span>
            <span className="px-2 py-1 rounded bg-amber-50 border border-amber-200 text-amber-800">
              코드≠state (refresh 후): <b>{configCount}</b>
            </span>
          </div>

          <div className="mt-3 text-[11px] text-purple-900 bg-purple-50/70 border border-purple-200 rounded p-2 leading-relaxed">
            {state.note}
          </div>

          <div className="mt-3 text-xs text-purple-900 bg-purple-50 border border-purple-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js atom-one-dark)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-purple-500/15 border-l-2 border-purple-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 to-fuchsia-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-purple-700 text-white font-bold">V</span>
              <div>
                <h1 className="text-2xl font-bold text-purple-900">V-2-1. drift 감지 — refresh / preview</h1>
                <p className="text-sm text-purple-800/80">state ≠ 실제 리소스 · pulumi refresh 로 state 동기화 · preview --refresh diff · up 으로 재수렴 · Pulumi Cloud 스케줄 감지</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-purple-700 underline hover:no-underline" aria-label="챕터 목록으로">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-purple-700' : 'bg-purple-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-purple-800 text-purple-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-purple-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-purple-800 text-white' : 'bg-purple-700 text-white hover:bg-purple-800'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-purple-300 bg-white text-purple-700 hover:bg-purple-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-purple-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-purple-400 bg-white px-4 py-3 text-sm text-purple-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                drift 는 state 기록과 실제 클라우드가 어긋난 상태다(콘솔 수동 변경·외부 자동화가 원인). pulumi refresh 는 실제를 읽어 state 만 갱신하고, preview --refresh 는 저장 없이 diff 를 미리 보여 준다. 확인 후 up 으로 코드 기준 재수렴하거나 코드를 현실에 맞춰 수정한다 — 어느 쪽이든 IaC 코드를 진실의 원천으로 유지하는 게 목표다. 실무에서는 Pulumi Cloud 스케줄 drift 감지 + Slack/email 알림으로 조기에 발견한다. 다음 (V-2-2) 에서는 리소스 import 로 기존 인프라를 코드로 가져오는 법을 본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['drift', 'pulumi refresh', 'preview --refresh', 'state', 'desired state', '재수렴', 'source of truth', 'Pulumi Cloud', 'drift detection'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 border border-purple-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-purple-700">
              <a href="../index.html" className="underline hover:no-underline" aria-label="챕터 목록">← 챕터 목록</a>
              <div className="flex gap-4">
                <a href="./V-1-2.html" className="underline hover:no-underline" aria-label="이전 챕터로">← 이전: V-1-2</a>
                <a href="./V-2-2.html" className="underline hover:no-underline" aria-label="다음 챕터로">다음: V-2-2 리소스 import →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
