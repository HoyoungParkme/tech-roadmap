  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!-- IV-2-3. Multi-Agent Supervisor — Supervisor가 researcher/coder/writer를 라우팅, FINISH로 종료. A형 레슨 (그림: IV-2-3.anim.js, 전체 코드는 접힘) -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 시나리오: "API 조사 → 코드 작성 → README" — 단계마다 graph active 노드, messages, FINISH 변화
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      overload: {lang:"python", filename:"single-overload.py", lines:[
        "# Step 1. Single Agent — 도구 12개를 모두 가진 만능 Agent",
        "from langgraph.prebuilt import create_react_agent",
        "from langchain_openai import ChatOpenAI",
        "",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\")",
        "",
        "# ⚠ 한 Agent 가 모든 도구를 보유 → 선택 폭증",
        "mono_agent = create_react_agent(",
        "    llm,",
        "    tools=[",
        "        web_search, wiki_lookup, arxiv_search,",
        "        python_repl, file_write, file_read,",
        "        markdown_fmt, html_render, translator,",
        "        calculator, db_query, email_send,",
        "    ],",
        "    prompt=(",
        "        \"당신은 만능 비서입니다. 조사·코딩·문서화·번역·\"",
        "        \"계산·메일까지 모두 처리하세요…\"   # 프롬프트 폭증",
        "    ),",
        ")",
        "",
        "# 사용자 요청",
        "mono_agent.invoke({\"messages\": [",
        "    (\"user\", \"이 API 조사하고 코드 만들고 README 까지 작성\")",
        "]})",
        "",
        "# 😵 결과:",
        "#   - tool_choice 가 갈팡질팡 (search? code? markdown?)",
        "#   - 시스템 프롬프트만 800 토큰쯤 (예시, 도구 설명 누적)",
        "#   - 한 단계 실수 → 다음 단계 망가짐 (책임 미분할)",
        "#   - 디버깅 불가 — 어떤 도구가 잘못 선택됐는지 추적 어려움",
        "",
        "# 💡 해결: 역할별 전문 Agent + Supervisor 라우팅",
      ]},
      split: {lang:"python", filename:"split-roles.py", lines:[
        "# Step 2. 역할별 전문 Agent 3개로 분리",
        "from langgraph.prebuilt import create_react_agent",
        "from langchain_openai import ChatOpenAI",
        "",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\")",
        "",
        "# ── 1) Researcher — 정보 조사 전문 ──",
        "researcher = create_react_agent(",
        "    llm,",
        "    tools=[web_search, wiki_lookup],",
        "    prompt=(",
        "        \"당신은 조사 전문가입니다. \"",
        "        \"주어진 주제에 대해 출처를 인용해 사실만 정리하세요.\"",
        "    ),",
        ")",
        "",
        "# ── 2) Coder — 코드 작성·실행 전문 ──",
        "coder = create_react_agent(",
        "    llm,",
        "    tools=[python_repl, file_write],",
        "    prompt=(",
        "        \"당신은 시니어 파이썬 개발자입니다. \"",
        "        \"조사 결과를 바탕으로 동작하는 코드를 작성하세요.\"",
        "    ),",
        ")",
        "",
        "# ── 3) Writer — 문서화 전문 ──",
        "writer = create_react_agent(",

        "from typing import TypedDict, Annotated",
        "from langgraph.graph import StateGraph, START, END",
        "from langgraph.graph.message import add_messages",
        "from langchain_core.messages import HumanMessage",
        "",
        "# 1) 공통 State — 모든 노드가 messages 를 공유",
        "class AgentState(TypedDict):",
        "    messages: Annotated[list, add_messages]",
        "    next: str",
        "",
        "# 2) sub-agent 노드 래퍼 — Agent 출력 → state.messages 추가",
        "def make_node(agent, name):",
        "    def node(state):",
        "        result = agent.invoke(state)",
        "        return {",
        "            \"messages\": [",
        "                HumanMessage(",
        "                    content=result[\"messages\"][-1].content,",
        "                    name=name,",
        "                )",
        "            ]",
        "        }",
        "    return node",
        "",
        "# 3) StateGraph 조립",
        "graph = StateGraph(AgentState)",
        "graph.add_node(\"supervisor\", supervisor_node)",
        "graph.add_node(\"researcher\", make_node(researcher, \"researcher\"))",
        "graph.add_node(\"coder\",      make_node(coder,      \"coder\"))",
        "graph.add_node(\"writer\",     make_node(writer,     \"writer\"))",
        "",
        "# 4) 엣지 — Supervisor 가 허브",
        "graph.add_edge(START, \"supervisor\")",

        "    {\"researcher\": \"researcher\",",
        "     \"coder\":      \"coder\",",
        "     \"writer\":     \"writer\",",
        "     \"FINISH\":     END},",
        ")",
        "",
        "app = graph.compile()",

        beat:{ label:"compile — 별 완성", at:"multi-graph.py L47–48",
               caption:"compile 하면 별 모양 그래프가 완성된다. get_graph()로 세면 노드 6개(START·END 포함)와 엣지 8개다.",
               changes:[{"mark":"new","text":"app = graph.compile()"},{"mark":"read","text":"노드 6 · 엣지 8"}] },
        mode: "graph",
        active: "researcher",
        finished: false,
        messages: [{"kind":"user","text":"이 API 조사 → 코드 → README"},{"kind":"agent","from":"supervisor","text":"next = \"researcher\""},{"kind":"agent","from":"researcher","text":"🔍 GitHub API v3 조사 완료 — auth, endpoints 정리"},{"kind":"agent","from":"supervisor","text":"next = \"coder\""},{"kind":"agent","from":"coder","text":"💻 fetch_user.py 작성 — requests 호출 코드"}],
        decision: "researcher",
        code:{...CODE.graph, highlight:[47,48]},
      },
      // ── Step 5 ────────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:"초기 State 투입", at:"finish.py L2–8",
               caption:"\"GitHub API 조사 → 코드 → README\" 요청 하나가 공용 messages의 첫 항목이 된다.",
               changes:[{"mark":"new","text":"HumanMessage (복합 요청)"}] },
        mode: "graph",
        active: null,
        finished: false,
        messages: [{"kind":"user","text":"이 API 조사 → 코드 → README"}],
        code:{...CODE.finish, highlight:[2,3,4,5,6,7,8]},
      },
      { ...S5,
        beat:{ label:"invoke — 실행 시작", at:"finish.py L10",
               caption:"START → supervisor. 첫 판단은 next=\"researcher\".",
               changes:[{"mark":"changed","text":"supervisor 활성"},{"mark":"new","text":"next = \"researcher\""}] },
        mode: "graph",
        active: "supervisor",
        finished: false,
        messages: [{"kind":"user","text":"이 API 조사 → 코드 → README"},{"kind":"agent","from":"supervisor","text":"next = \"researcher\""}],
        decision: "researcher",
        code:{...CODE.finish, highlight:[10]},
      },
      { ...S5,
        beat:{ label:"trace 1–4 — 조사·코드", at:"finish.py L12–16",
               caption:"researcher가 조사 후 복귀, supervisor가 next=\"coder\" — coder가 코드를 만든다.",
               changes:[{"mark":"new","text":"researcher · coder 결과 누적"},{"mark":"changed","text":"next = \"coder\""}] },
        mode: "graph",
        active: "coder",
        finished: false,
        messages: [{"kind":"user","text":"이 API 조사 → 코드 → README"},{"kind":"agent","from":"supervisor","text":"next = \"researcher\""},{"kind":"agent","from":"researcher","text":"🔍 GitHub API 조사 완료"},{"kind":"agent","from":"supervisor","text":"next = \"coder\""},{"kind":"agent","from":"coder","text":"💻 fetch_user.py 작성 완료"}],
        decision: "coder",
        code:{...CODE.finish, highlight:[12,13,14,15,16]},
      },
      { ...S5,
        beat:{ label:"trace 5–8 — 문서·종료 판단", at:"finish.py L17–20",
               caption:"supervisor가 next=\"writer\" — writer가 README를 쓰고 복귀한다. 남은 판단은 종료뿐.",
               changes:[{"mark":"new","text":"writer 결과 누적"},{"mark":"changed","text":"next = \"writer\""}] },
        mode: "graph",
        active: "writer",
        finished: false,
        messages: [{"kind":"user","text":"이 API 조사 → 코드 → README"},{"kind":"agent","from":"supervisor","text":"next = \"researcher\""},{"kind":"agent","from":"researcher","text":"🔍 GitHub API 조사 완료"},{"kind":"agent","from":"supervisor","text":"next = \"coder\""},{"kind":"agent","from":"coder","text":"💻 fetch_user.py 작성 완료"},{"kind":"agent","from":"supervisor","text":"next = \"writer\""},{"kind":"agent","from":"writer","text":"✍️ README.md 작성 완료"}],
        decision: "writer",
        code:{...CODE.finish, highlight:[17,18,19,20]},
      },
      { ...S5,
        beat:{ label:"최종 messages 4인분", at:"finish.py L22–28",
               caption:"supervisor가 FINISH를 반환하고, 공용 메모에는 user · researcher · coder · writer 결과가 name 별로 쌓였다.",
               changes:[{"mark":"new","text":"next = \"FINISH\""},{"mark":"read","text":"final_state[\"messages\"] 순회"}] },
        mode: "graph",
        active: "finish",
        finished: false,
        messages: [{"kind":"user","text":"이 API 조사 → 코드 → README"},{"kind":"agent","from":"supervisor","text":"next = \"researcher\""},{"kind":"agent","from":"researcher","text":"🔍 GitHub API 조사 완료"},{"kind":"agent","from":"supervisor","text":"next = \"coder\""},{"kind":"agent","from":"coder","text":"💻 fetch_user.py 작성 완료"},{"kind":"agent","from":"supervisor","text":"next = \"writer\""},{"kind":"agent","from":"writer","text":"✍️ README.md 작성 완료"},{"kind":"agent","from":"supervisor","text":"next = \"FINISH\" — 모든 작업 완료","done":true}],
        decision: "FINISH",
        code:{...CODE.finish, highlight:[22,23,24,25,26,27,28]},
      },
      { ...S5,
        beat:{ label:"✨ 패턴 정리", at:"finish.py L30–34",
               caption:"Supervisor는 라우터 LLM, sub-agent는 전문 ReAct, FINISH가 종료 신호 — END에 도달했다.",
               changes:[{"mark":"changed","text":"FINISH → END 도달"},{"mark":"read","text":"별 모양 loop 완성"}] },
        mode: "graph",
        active: "finish",
        finished: true,
        messages: [{"kind":"user","text":"이 API 조사 → 코드 → README"},{"kind":"agent","from":"supervisor","text":"next = \"researcher\""},{"kind":"agent","from":"researcher","text":"🔍 GitHub API 조사 완료"},{"kind":"agent","from":"supervisor","text":"next = \"coder\""},{"kind":"agent","from":"coder","text":"💻 fetch_user.py 작성 완료"},{"kind":"agent","from":"supervisor","text":"next = \"writer\""},{"kind":"agent","from":"writer","text":"✍️ README.md 작성 완료"},{"kind":"agent","from":"supervisor","text":"next = \"FINISH\" — 모든 작업 완료","done":true}],
        decision: "FINISH",
        code:{...CODE.finish, highlight:[30,31,32,33,34]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 표·정리 보기 (예전 왼쪽 패널의 역할표·설명을 장면별로)
    // ─────────────────────────────────────────────────────
    function RefPanel({ step, stepIdx }) {
      const g = raGroupOf(stepIdx).g;
      if (g === 0 || g === 1) return (
        <div>
          <h4>만능 Agent 하나 vs 역할별 Agent 셋</h4>
          <table><thead><tr><th></th><th>만능 Agent</th><th>역할별 Agent</th></tr></thead><tbody>
            <tr><td>도구</td><td>12개를 한 곳에</td><td>researcher 2 · coder 2 · writer 1</td></tr>
            <tr><td>시스템 프롬프트</td><td>모든 역할 지시 + 도구 설명 전부</td><td>역할 한 문장</td></tr>
            <tr><td>실수했을 때</td><td>어느 단계에서 틀렸는지 찾기 어렵다</td><td>어느 작업자의 출력인지 name으로 보인다</td></tr>
            <tr><td>순서 정하기</td><td>LLM이 한 번에 알아서</td><td>Supervisor가 필요하다 (Step 3)</td></tr>
          </tbody></table>
        </div>
      );
      if (g === 2) return (
        <div>
          <h4>작업자와 도구</h4>
          <table><thead><tr><th>작업자</th><th>도구</th><th>Supervisor가 고르는 때</th></tr></thead><tbody>
            <tr><td>researcher</td><td>web_search, wiki_lookup</td><td>조사가 필요할 때</td></tr>
            <tr><td>coder</td><td>python_repl, file_write</td><td>코드가 필요할 때</td></tr>
            <tr><td>writer</td><td>markdown_fmt</td><td>문서화가 필요할 때</td></tr>
            <tr><td>FINISH</td><td>—</td><td>모든 일이 끝났을 때 (END로)</td></tr>
          </tbody></table>
        </div>
      );
      if (g === 3) return (
        <div>
          <h4>그래프 구성 (get_graph로 확인)</h4>
          <ul>
            <li>노드 6개: __start__ · supervisor · researcher · coder · writer · __end__</li>
            <li>엣지 8개: START→supervisor 1, 작업자→supervisor 복귀 3, supervisor의 조건 분기 4(작업자 3 + FINISH→END)</li>
            <li>make_node는 작업자 내부의 긴 대화 중 마지막 답 한 줄만 name을 붙여 공용 messages에 넣는다.</li>
          </ul>
        </div>
      );
      return (
        <div>
          <h4>실행 순서 (가짜 모델로 실행해 확인)</h4>
          <table><thead><tr><th>#</th><th>노드</th><th>state 변화</th></tr></thead><tbody>
            <tr><td>1</td><td>supervisor</td><td>next = "researcher"</td></tr>
            <tr><td>2</td><td>researcher</td><td>messages 2개</td></tr>
            <tr><td>3</td><td>supervisor</td><td>next = "coder"</td></tr>
            <tr><td>4</td><td>coder</td><td>messages 3개</td></tr>
            <tr><td>5</td><td>supervisor</td><td>next = "writer"</td></tr>
            <tr><td>6</td><td>writer</td><td>messages 4개</td></tr>
            <tr><td>7</td><td>supervisor</td><td>next = "FINISH" → END</td></tr>
          </tbody></table>
          <p className="mt-2">작업자가 쓴 문장은 예시다. 출력 코드의 getattr(m, 'name', 'user')는 사용자 줄에서 [None]을 찍는다. HumanMessage의 name이 None 인 속성으로 늘 있기 때문이라 m.name or 'user'로 고쳤다.</p>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js (atom-one-dark)
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS를 beat로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_FILES2 = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* 파일 탭 (5개) — 현재 step의 filename 강조 */}
          <div className="bg-[#1e2127] px-2 pt-1 flex gap-0.5 border-b border-slate-700 overflow-x-auto">
            {TAB_FILES2.map((filename) => {
              const isCurrent = filename === code.filename;
              return (
                <div
                  key={filename}
                  className={`text-[10px] font-mono px-2.5 py-1 rounded-t border-t border-l border-r whitespace-nowrap ${
                    isCurrent
                      ? 'bg-[#282c34] border-slate-600 text-emerald-300 font-bold'
                      : 'bg-[#1e2127] border-transparent text-slate-500'
                  }`}
                >
                  {filename}
                </div>
              );
            })}
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[34rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
