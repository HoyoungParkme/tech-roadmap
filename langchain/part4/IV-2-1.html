    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-2-1. ReAct Agent (LangGraph 버전 — create_react_agent)
    학습 목표: 수동 그래프 구성의 복잡함 → create_react_agent 한 줄로 단축되는 과정과
              메시지 흐름(AIMessage with tool_calls → ToolMessage → AIMessage)을 5단계로 이해한다.
    핵심 비유: ReAct cycle = Agent ↔ Tools ↔ LLM 의 round-trip 메시지 패스
    패턴: fastapi v1 — 좌(LiveDataPane: Agent/Tools/LLM 박스 + 메시지 박스) / 우(VSCode CodeViewer)
    색상: emerald (langchain 계열)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 시나리오: "서울과 도쿄의 날씨를 비교해줘"
    //   메시지 흐름이 5단계 동안 누적되며 Agent ↔ Tools ↔ LLM 패스 시각화
    //   메시지 타입: human / ai-thinking / ai-toolcall / tool / ai-final
    // ─────────────────────────────────────────────────────

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      manual: {lang:"python", filename:"manual-react.py", lines:[
        "# Step 1. 수동 ReAct — 그래프를 직접 짠다",
        "from langgraph.graph import StateGraph, END, MessagesState",
        "from langgraph.prebuilt import ToolNode",
        "from langchain_openai import ChatOpenAI",
        "from langchain_core.tools import tool",
        "",
        "# 1) 도구 정의",
        "@tool",
        "def get_weather(city: str) -> str:",
        "    \"\"\"도시의 현재 날씨를 가져온다.\"\"\"",
        "    db = {\"서울\": \"25도, 맑음\", \"도쿄\": \"22도, 흐림\"}",
        "    return db.get(city, \"정보 없음\")",
        "",
        "tools = [get_weather]",
        "model = ChatOpenAI(model=\"gpt-4o-mini\").bind_tools(tools)",
        "",
        "# 2) agent 노드 — LLM 호출 (생각/행동 결정)",
        "def agent_node(state: MessagesState):",
        "    response = model.invoke(state[\"messages\"])",
        "    return {\"messages\": [response]}",
        "",
        "# 3) 분기 함수 — tool_calls 있으면 도구 실행, 없으면 종료",
        "def should_continue(state: MessagesState):",
        "    last = state[\"messages\"][-1]",
        "    if last.tool_calls:",
        "        return \"tools\"",
        "    return END",
        "",
        "# 4) 그래프 조립 — 노드 2 + 엣지 3 + 분기 1",
        "graph = StateGraph(MessagesState)",
        "graph.add_node(\"agent\", agent_node)",
        "graph.add_node(\"tools\", ToolNode(tools))",
        "graph.set_entry_point(\"agent\")",
        "graph.add_conditional_edges(",
        "    \"agent\", should_continue, {\"tools\": \"tools\", END: END},",
        ")",
        "graph.add_edge(\"tools\", \"agent\")",
        "app = graph.compile()",
        "",
        "# ⚠ 보일러플레이트가 많고 디테일 누락 위험이 있다.",
        "# → Step 2. create_react_agent 한 줄로 끝",
      ]},
      createAgent: {lang:"python", filename:"create-agent.py", lines:[
        "# Step 2. create_react_agent — 한 줄로 ReAct Agent 완성",
        "from langgraph.prebuilt import create_react_agent",
        "from langchain_openai import ChatOpenAI",
        "from langchain_core.tools import tool",
        "",
        "@tool",
        "def get_weather(city: str) -> str:",
        "    \"\"\"도시의 현재 날씨를 가져온다.\"\"\"",
        "    db = {\"서울\": \"25도, 맑음\", \"도쿄\": \"22도, 흐림\"}",
        "    return db.get(city, \"정보 없음\")",
        "",
        "tools = [get_weather]",
        "model = ChatOpenAI(model=\"gpt-4o-mini\")",
        "",
        "# 🎯 한 줄 — 내부적으로 Step 1 그래프와 동일한 구성",
        "agent = create_react_agent(model, tools)",
        "",
        "# 내부에 자동 포함된 것:",
        "#   ✓ agent_node     (model.bind_tools(tools).invoke)",
        "#   ✓ ToolNode       (tool_calls 자동 파싱·실행)",
        "#   ✓ should_continue (tool_calls 유무로 분기)",
        "#   ✓ START → agent → [tools ↔ agent] → END",
        "",
        "# 옵션도 그대로 받음",
        "# agent = create_react_agent(",
        "#     model, tools,",
        "#     state_modifier=\"당신은 친절한 날씨 비서입니다.\",",
        "#     checkpointer=MemorySaver(),  # 대화 기억",
        "# )",
        "",
        "# → 다음 Step 3 에서 invoke 로 실제 호출해본다.",
      ]},
      invoke: {lang:"python", filename:"invoke.py", lines:[
        "# Step 3. invoke — 사용자 질문을 한 번에 처리",
        "from langchain_core.messages import HumanMessage",
        "",
        "# Step 2 에서 만든 agent 사용",

    // ─────────────────────────────────────────────────────
    // 좌측 위: ReAct cycle 다이어그램
    //   Agent ↔ Tools ↔ LLM 3개 박스 + cycleStage 에 따라
    //   화살표/펄스 애니메이션
    // ─────────────────────────────────────────────────────
    function ReactCycleDiagram({ step }) {
      const boxClass = (state) => {
        if (state === 'idle') return 'bg-slate-100 border-slate-300 text-slate-500';
        if (state === 'ready') return 'bg-emerald-50 border-emerald-300 text-emerald-800';
        if (state === 'pending') return 'bg-amber-50 border-amber-300 text-amber-700';
        if (state === 'active') return 'bg-emerald-100 border-emerald-500 text-emerald-900 ring-2 ring-emerald-300 ring-offset-1';
        if (state === 'streaming') return 'bg-emerald-100 border-emerald-500 text-emerald-900 animate-pulse';
        return 'bg-white border-slate-300';
      };

      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🔄</span>
              <span className="text-[11px] font-bold text-emerald-800">ReAct Cycle (Agent ↔ Tools ↔ LLM)</span>
            </div>
            <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-mono">
              mode: {step.mode}
            </span>
          </div>

          <div className="grid grid-cols-3 gap-2 mb-2">
            {/* Agent 박스 */}
            <div className={`rounded-lg border-2 p-2 transition-all duration-500 ${boxClass(step.agentBox.state)}`}>
              <div className="text-[9px] font-bold uppercase tracking-wider mb-1">🤖 Agent</div>
              <div className="text-[10px] font-mono leading-tight break-words">{step.agentBox.label}</div>
              <div className="text-[8px] mt-1 opacity-70">state={step.agentBox.state}</div>
            </div>

            {/* Tools 박스 */}
            <div className={`rounded-lg border-2 p-2 transition-all duration-500 ${boxClass(step.toolsBox.state)}`}>
              <div className="text-[9px] font-bold uppercase tracking-wider mb-1">🔧 Tools</div>
              <div className="text-[10px] font-mono leading-tight break-words">{step.toolsBox.label}</div>
              <div className="text-[8px] mt-1 opacity-70">state={step.toolsBox.state}</div>
            </div>

            {/* LLM 박스 */}
            <div className={`rounded-lg border-2 p-2 transition-all duration-500 ${boxClass(step.llmBox.state)}`}>
              <div className="text-[9px] font-bold uppercase tracking-wider mb-1">🧠 LLM</div>
              <div className="text-[10px] font-mono leading-tight break-words">{step.llmBox.label}</div>
              <div className="text-[8px] mt-1 opacity-70">state={step.llmBox.state}</div>
            </div>
          </div>

          {/* 엣지 / 단계 정보 */}
          <div className="bg-slate-50 rounded border border-slate-200 p-1.5">
            <div className="text-[9px] font-bold text-slate-600 uppercase tracking-wider mb-0.5">Edges / cycle stage = {step.cycleStage}</div>
            <div className="flex flex-wrap gap-1">
              {step.edges.map((e, i) => (
                <span key={i} className="text-[9px] font-mono bg-white border border-slate-200 px-1.5 py-0.5 rounded text-slate-700">
                  {e}
                </span>
              ))}
            </div>
          </div>

          {/* cycle stage 진행 바 */}
          <div className="mt-2 flex items-center gap-1">
            <span className="text-[9px] text-slate-500 font-mono">cycle</span>
            {[0, 1, 2, 3].map((i) => (
              <div
                key={i}
                className={`flex-1 h-1.5 rounded ${i <= step.cycleStage ? 'bg-emerald-500' : 'bg-slate-200'} transition-all duration-500`}
              />
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 아래: 메시지 박스 — role별 색상
    //   - human       : 파랑
    //   - ai-thinking : 회색 + italic (생각 표시)
    //   - ai-toolcall : 보라 (도구 호출 요청)
    //   - tool        : 노랑 (도구 실행 결과)
    //   - ai-final    : 에메랄드 (최종 답변)
    // ─────────────────────────────────────────────────────
    function MessageBox({ messages, mode }) {
      if (!messages || messages.length === 0) {
        return (
          <div className="bg-slate-50 border-2 border-dashed border-slate-300 rounded-lg p-3">
            <div className="flex items-center gap-1.5 mb-1.5">
              <span className="text-base">💬</span>
              <span className="text-[11px] font-bold text-slate-700">Messages — 아직 비어 있음</span>
            </div>
            <div className="text-[10px] text-slate-500 italic text-center py-3">
              그래프 구조만 정의된 상태. invoke 호출 전.
            </div>
          </div>
        );
      }

      const styleByRole = (role) => {
        switch (role) {
          case 'human':
            return {
              wrap: 'bg-blue-50 border-blue-300',
              badge: 'bg-blue-600 text-white',
              label: 'HumanMessage',
              icon: '👤',
            };
          case 'ai-thinking':
            return {
              wrap: 'bg-slate-100 border-slate-300 italic',
              badge: 'bg-slate-500 text-white',
              label: 'AIMessage (thinking)',
              icon: '💭',
            };
          case 'ai-toolcall':
            return {
              wrap: 'bg-purple-50 border-purple-300',
              badge: 'bg-purple-600 text-white',
              label: 'AIMessage (tool_calls)',
              icon: '🔧',
            };
          case 'tool':
            return {
              wrap: 'bg-amber-50 border-amber-300',
              badge: 'bg-amber-600 text-white',
              label: 'ToolMessage',
              icon: '📦',
            };
          case 'ai-final':
            return {
              wrap: 'bg-emerald-50 border-emerald-400 ring-1 ring-emerald-200',
              badge: 'bg-emerald-600 text-white',
              label: 'AIMessage (final)',
              icon: '✅',
            };
          default:
            return {
              wrap: 'bg-white border-slate-200',
              badge: 'bg-slate-400 text-white',
              label: role,
              icon: '•',
            };
        }
      };

      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">💬</span>
              <span className="text-[11px] font-bold text-emerald-800">Messages — round-trip 시퀀스</span>
            </div>
            <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-mono">
              {messages.length} msgs
            </span>
          </div>

          <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
            {messages.map((m, i) => {
              const s = styleByRole(m.role);
              return (
                <div
                  key={i}
                  className={`p-1.5 rounded border ${s.wrap} transition-all duration-500`}
                >
                  <div className="flex items-center gap-1.5 mb-0.5">
                    <span className="text-[10px]">{s.icon}</span>
                    <span className={`text-[8px] px-1.5 py-0.5 rounded font-bold ${s.badge}`}>
                      [{i}] {s.label}
                    </span>
                    {m.meta && (
                      <span className="text-[8px] text-slate-500 font-mono ml-auto">
                        {m.meta}
                      </span>
                    )}
                  </div>
                  <div className="text-[10px] font-mono leading-tight pl-4 text-slate-800 break-words">
                    {m.text}
                  </div>
                </div>
              );
            })}
          </div>

          {mode === 'stream' && (
            <div className="text-[9px] text-emerald-700 mt-2 font-mono">
              ▶ stream_mode="updates" — 위 메시지가 chunk 단위로 yield 됨
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: ReAct cycle 다이어그램 / 하단: 메시지 박스
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🤖 ReAct Agent — 수동 그래프 → 한 줄 → 메시지 흐름</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-3">
            <ReactCycleDiagram step={step} />
            <MessageBox messages={step.messages} mode={step.mode} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-blue-500"></span>Human
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-slate-400"></span>AI thinking
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-purple-500"></span>AI tool_calls
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-500"></span>Tool result
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>AI final
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js + atom-one-dark
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. LangGraph &gt; Chapter 2. LangGraph 실전</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">IV-2-1. ReAct Agent (LangGraph) — create_react_agent</h1>
                  <p className="text-sm text-slate-500 mt-0.5">수동 그래프 → 한 줄 prebuilt → 메시지 흐름 → 스트리밍 디버깅</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-3 text-sm text-emerald-900">
                💡 정리: <strong>create_react_agent(model, tools)</strong> 한 줄로 Step 1의 모든 보일러플레이트를 대체하고, <strong>agent.invoke / agent.stream</strong> 으로 사용·디버깅한다. 다음(IV-2-2)에서는 실행 중 사람의 승인을 끼워넣는 Human-in-the-Loop 패턴을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-emerald-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-emerald-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['create_react_agent', 'StateGraph', 'ToolNode', 'MessagesState', 'tool_calls', 'agent.invoke', 'agent.stream'].map((kw) => (
                <span key={kw} className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./IV-1-3.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; IV-1-3 Conditional Edge</a>
              <a href="./IV-2-2.html" className="text-emerald-700 hover:text-emerald-900 font-medium">IV-2-2 Human-in-the-Loop &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
