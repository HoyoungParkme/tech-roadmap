  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    V-1-2. 프롬프트 관리 — LangSmith Hub 기반 버전 관리
    학습 목표: 코드에 박힌 프롬프트의 한계를 이해하고
              Hub pull/push, 버전 비교(A/B), 팀 협업으로 진화하는 흐름을 본다.
    핵심 비유: Git for 프롬프트 — 코드 외부에서 버전·공유·실험까지 관리
    패턴: fastapi v1 — 좌(LiveDataPane: Hub 박스 + 버전 트리 / A/B 그래프)
                      우(VSCode CodeViewer)
    색상: emerald
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   stage      : 'hardcoded' | 'pull' | 'push' | 'abtest' | 'collab'
    //   hubBox     : Hub 박스 시각화 데이터
    //   tree       : 버전 트리 [{ ver, label, status, msg, author }]
    //   abChart    : A/B 결과 막대 그래프 데이터 (Step 4)
    //   collab     : 팀 협업 데이터 (Step 5)
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 코드에 박힌 프롬프트 — 버전 추적 어려움',
        desc: '프롬프트를 .py 파일 안에 string으로 박아두면, 수정할 때마다 git diff로 코드 변경과 섞여 추적이 힘들다. 비코더(PM·기획자)는 손도 못 댄다. 폴더에 prompt_v1.txt, prompt_final.txt, prompt_FINAL_real.txt가 쌓이고 어느 게 최신인지 모른다.',
        stage: 'hardcoded',
        hubBox: { kind: 'none' },
        tree: [
          { ver: 'prompt_v1.txt', status: 'orphan', msg: '아무 메모 없음', author: 'dev' },
          { ver: 'prompt_v2_final.txt', status: 'orphan', msg: '???', author: 'dev' },
          { ver: 'prompt_v2_final_real.txt', status: 'orphan', msg: '???', author: 'dev' },
          { ver: 'prompt_FINAL.txt', status: 'orphan', msg: '진짜 최종?', author: 'dev' },
        ],
        abChart: null,
        collab: null,
        code: {
          lang: 'python',
          filename: 'hardcoded.py',
          lines: [
            '# Step 1. 코드 안에 프롬프트를 박아둔 안티패턴',
            'from langchain_openai import ChatOpenAI',
            'from langchain_core.prompts import ChatPromptTemplate',
            '',
            'llm = ChatOpenAI(model="gpt-4o-mini")',
            '',
            '# ❌ 프롬프트가 코드에 하드코딩',
            'PROMPT_TEXT = """',
            '당신은 친절한 고객 상담 챗봇입니다.',
            '다음 문서를 기반으로 질문에 답변해주세요.',
            '문서: {context}',
            '질문: {question}',
            '"""',
            '',
            'prompt = ChatPromptTemplate.from_template(PROMPT_TEXT)',
            'chain = prompt | llm',
            '',
            '# ─── 발생하는 문제들 ───',
            '#  1. 프롬프트 수정 = 코드 변경 → 배포 필요',
            '#  2. PM/기획자가 직접 못 고침',
            '#  3. v1·v2·v3 비교 = git log 뒤지기',
            '#  4. 롤백 = git revert',
            '#  5. 팀원 공유 = 슬랙에 복붙',
            '',
            '# 폴더엔 이런 파일들이 쌓임:',
            '#   prompt_v1.txt / prompt_v2_final.txt',
            '#   prompt_FINAL.txt   ← 어느 게 진짜 최종?',
            '',
            '# 다음 단계: hub.pull 로 외부 저장소에서 가져오기',
          ],
          highlight: [7, 8, 9, 10, 11, 12, 13, 15, 16, 18, 19, 20, 21, 22, 23, 25, 26, 27],
        },
      },
      {
        title: 'Step 2. hub.pull("prompt-name") — Hub에서 가져오기',
        desc: 'LangSmith Hub는 프롬프트 전용 저장소. Docker Hub처럼 pull 한 줄로 검증된 프롬프트를 가져온다. 코드에서 텍스트가 사라지고, 프롬프트는 Hub에 분리되어 산다. "rlm/rag-prompt"는 LangChain팀이 검증한 RAG 표준 프롬프트.',
        stage: 'pull',
        hubBox: {
          kind: 'pull',
          name: 'rlm/rag-prompt',
          version: 'v3 (latest)',
          downloads: 12480,
          stars: 327,
        },
        tree: [
          { ver: 'v1', status: 'old', msg: '초기 버전 — 답변만', author: 'rlm' },
          { ver: 'v2', status: 'old', msg: '근거 인용 추가', author: 'rlm' },
          { ver: 'v3', status: 'pulled', msg: 'context 누락 시 처리', author: 'rlm' },
        ],
        abChart: null,
        collab: null,
        code: {
          lang: 'python',
          filename: 'hub-pull.py',
          lines: [
            '# Step 2. hub.pull — Hub에서 검증된 프롬프트 가져오기',
            'from langchain import hub',
            'from langchain_openai import ChatOpenAI',
            '',
            '# 1) Hub에서 프롬프트 한 줄로 다운로드',
            '#    형식: "<owner>/<name>" 또는 ":<version>" 핀',
            'prompt = hub.pull("rlm/rag-prompt")',
            '',
            '# 2) 가져온 프롬프트 확인',

    // ─────────────────────────────────────────────────────
    // 버전 트리 — Git tree 같이 v1 → v2 → v3 시각화
    //   status: orphan | old | pulled | new | losing | winning
    //           tagged-prod | tagged-stg | review
    // ─────────────────────────────────────────────────────
    function VersionTree({ tree, stage }) {
      const styleMap = {
        orphan: { dot: 'bg-red-400', line: 'border-red-300 border-dashed', label: 'bg-red-100 text-red-700', badge: '???' },
        old: { dot: 'bg-slate-300', line: 'border-slate-300', label: 'bg-slate-100 text-slate-600', badge: 'old' },
        pulled: { dot: 'bg-emerald-500', line: 'border-emerald-400', label: 'bg-emerald-100 text-emerald-800 ring-2 ring-emerald-300', badge: 'PULLED' },
        new: { dot: 'bg-emerald-600', line: 'border-emerald-500', label: 'bg-emerald-100 text-emerald-800 ring-2 ring-emerald-400', badge: 'NEW' },
        losing: { dot: 'bg-amber-400', line: 'border-amber-300', label: 'bg-amber-100 text-amber-800', badge: 'B' },
        winning: { dot: 'bg-emerald-600', line: 'border-emerald-500', label: 'bg-emerald-100 text-emerald-900 ring-2 ring-emerald-400', badge: 'WINNER' },
        'tagged-prod': { dot: 'bg-emerald-600', line: 'border-emerald-500', label: 'bg-emerald-100 text-emerald-900 ring-2 ring-emerald-400', badge: 'production' },
        'tagged-stg': { dot: 'bg-amber-500', line: 'border-amber-400', label: 'bg-amber-100 text-amber-800', badge: 'staging' },
        review: { dot: 'bg-blue-500', line: 'border-blue-400 border-dashed', label: 'bg-blue-100 text-blue-800', badge: 'review' },
      };
      const headerLabel =
        stage === 'hardcoded' ? '폴더 안 파일들 (Git 외부)' :
        stage === 'pull' ? 'rlm/rag-prompt 버전 트리' :
        stage === 'push' ? 'my-org/qa-prompt 버전 트리' :
        stage === 'abtest' ? 'A/B 후보 버전' :
        '태그 부여 + 리뷰 중';

      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🌳</span>
              <span className="text-[11px] font-bold text-emerald-800">{headerLabel}</span>
            </div>
            <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-mono">
              {tree.length} entries
            </span>
          </div>
          <div className="relative pl-2">
            {tree.map((node, idx) => {
              const s = styleMap[node.status] || styleMap.old;
              const isLast = idx === tree.length - 1;
              return (
                <div key={node.ver} className="flex items-start gap-2 relative">
                  <div className="flex flex-col items-center pt-1">
                    <div className={`w-3 h-3 rounded-full ${s.dot} ring-2 ring-white shadow z-10 transition-all duration-500`}></div>
                    {!isLast && (
                      <div className={`w-0 flex-1 border-l-2 ${s.line} min-h-[28px]`}></div>
                    )}
                  </div>
                  <div className="flex-1 pb-3">
                    <div className="flex items-center gap-1.5 mb-0.5">
                      <span className={`text-[10px] px-1.5 py-0.5 rounded font-mono font-bold ${s.label}`}>
                        {node.ver}
                      </span>
                      <span className="text-[8px] bg-slate-700 text-white px-1 py-0.5 rounded font-bold uppercase">
                        {s.badge}
                      </span>
                      <span className="text-[9px] text-slate-500 font-mono ml-auto">@{node.author}</span>
                    </div>
                    <div className="text-[10px] text-slate-700 leading-tight">{node.msg}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // A/B 결과 막대 그래프 (Step 4)
    //   각 metric마다 v2/v3 막대 옆으로 그림
    //   lowerIsBetter면 색깔 반전
    // ─────────────────────────────────────────────────────
    function AbChart({ chart }) {
      return (
        <div className="bg-white rounded-lg border-2 border-amber-300 p-3">
          <div className="flex items-center gap-1.5 mb-3">
            <span className="text-base">📊</span>
            <span className="text-[11px] font-bold text-amber-800">v2 vs v3 — 4 지표 비교</span>
          </div>
          <div className="space-y-2.5">
            {chart.metrics.map((m) => {
              const v2Pct = (m.v2 / m.max) * 100;
              const v3Pct = (m.v3 / m.max) * 100;
              const v3Better = m.lowerIsBetter ? m.v3 < m.v2 : m.v3 > m.v2;
              const v2Color = v3Better ? 'bg-amber-300' : 'bg-emerald-500';
              const v3Color = v3Better ? 'bg-emerald-500' : 'bg-amber-300';
              return (
                <div key={m.name}>
                  <div className="flex items-center justify-between text-[10px] font-bold text-slate-700 mb-1">
                    <span>{m.name}</span>
                    <span className="text-[9px] text-slate-500 font-mono">
                      {v3Better ? 'v3 ✓' : 'v2 ✓'}
                    </span>
                  </div>
                  <div className="space-y-1">
                    <div className="flex items-center gap-1.5">
                      <span className="text-[9px] font-mono text-slate-500 w-5">v2</span>
                      <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden relative">
                        <div className={`h-full ${v2Color} transition-all duration-700`} style={{ width: `${v2Pct}%` }}></div>
                      </div>
                      <span className="text-[9px] font-mono text-slate-700 w-12 text-right">{m.v2}{m.unit}</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-[9px] font-mono text-slate-500 w-5">v3</span>
                      <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden relative">
                        <div className={`h-full ${v3Color} transition-all duration-700`} style={{ width: `${v3Pct}%` }}></div>
                      </div>
                      <span className="text-[9px] font-mono text-slate-700 w-12 text-right">{m.v3}{m.unit}</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="text-[9px] text-amber-700 mt-2.5 pt-2 border-t border-amber-200">
            ✨ 4지표 중 3개 v3 우세 → v3 채택, latest 태그 부여
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 협업 멤버 카드 (Step 5)
    // ─────────────────────────────────────────────────────
    function CollabBox({ collab }) {
      return (
        <div className="bg-white rounded-lg border-2 border-blue-300 p-3">
          <div className="flex items-center gap-1.5 mb-2">
            <span className="text-base">🤝</span>
            <span className="text-[11px] font-bold text-blue-800">팀 멤버별 작업</span>
          </div>
          <div className="grid grid-cols-2 gap-1.5">
            {collab.members.map((m) => (
              <div key={m.name} className="bg-blue-50 rounded p-1.5 border border-blue-200">
                <div className="flex items-center gap-1 mb-0.5">
                  <span className="text-sm">{m.emoji}</span>
                  <span className="text-[10px] font-bold text-blue-900">{m.name}</span>
                  <span className="text-[8px] bg-blue-600 text-white px-1 rounded font-bold">{m.role}</span>
                </div>
                <div className="text-[9px] text-blue-700 font-mono leading-tight">{m.action}</div>
              </div>
            ))}
          </div>
          <div className="text-[9px] text-blue-700 mt-2 pt-1.5 border-t border-blue-100">
            ✨ 코드 배포 0회로 프롬프트 갱신, 30초 롤백
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   Hub 박스 + 버전 트리 (+ 단계별 추가 박스)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🌳 LangSmith Hub — 버전 관리 흐름</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>

          <div className="space-y-3">
            <HubBox box={step.hubBox} />
            <VersionTree tree={step.tree} stage={step.stage} />
            {step.abChart && <AbChart chart={step.abChart} />}
            {step.collab && <CollabBox collab={step.collab} />}
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>active/winner
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-slate-300"></span>old
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-400"></span>compare
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-blue-500"></span>review
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2 h-2 rounded bg-red-400"></span>orphan
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum V-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded-full font-bold text-sm">V</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part V. LangSmith &amp; 평가 &gt; Chapter 1. LangSmith</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">V-1-2. 프롬프트 관리 — LangSmith Hub</h1>
                  <p className="text-sm text-slate-500 mt-0.5">Git for 프롬프트 — pull · push · 버전 비교 · 팀 협업</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-3 text-sm text-emerald-900">
                💡 정리: 프롬프트는 코드와 분리해 <strong>Hub</strong>에서 관리. <strong>pull/push</strong>로 버전 commit, <strong>A/B 평가</strong>로 데이터 기반 결정, <strong>태그·역할 분리</strong>로 비코더도 안전하게 편집. 다음(V-2-1)에서는 LLM-as-Judge 자동 평가를 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-emerald-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-emerald-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['LangSmith Hub', 'hub.pull', 'hub.push', '버전 관리', 'A/B 평가', '태그 전략', '팀 협업'].map((kw) => (
                <span key={kw} className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./V-1-1.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; V-1-1 트레이싱과 디버깅</a>
              <a href="./V-2-1.html" className="text-emerald-700 hover:text-emerald-900 font-medium">V-2-1 LLM-as-Judge &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
