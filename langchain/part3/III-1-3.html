  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-1-3. ConversationChain — 대화 이력 자동 관리 (Memory)
    학습 목표: LLM이 stateless라는 한계를 메모리 종류별로 어떻게 보완하는지를
              5단계 메시지 흐름으로 이해한다.
    핵심 비유: 단골 카페 바리스타의 4가지 노트 — 없음 / 다 적기 / 최근만 / 요약 / 인덱스(RAG)
    패턴: fastapi v1 — 좌(LiveDataPane: 대화 박스 + 메모리 박스) / 우(VSCode CodeViewer)
    색상: langchain emerald
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5턴 대화 시나리오 — 단골 카페 주문 흐름
    //   각 턴에 user(고객) → ai(바리스타)
    //   step에 따라 일부 turn은 보이고/잘리고/요약됨/검색됨
    // ─────────────────────────────────────────────────────
    const FULL_TURNS = [
      { n: 1, user: '아메리카노 한 잔 주세요', ai: '네, 따뜻한 아메리카노 한 잔 준비하겠습니다!' },
      { n: 2, user: '제 이름은 박서연이에요', ai: '박서연님, 반갑습니다. 멤버십에 등록해 드릴까요?' },
      { n: 3, user: '오늘은 디카페인으로 부탁해요', ai: '네, 디카페인 아메리카노로 변경하겠습니다.' },
      { n: 4, user: '아까 그거 아이스로 바꿔주세요', ai: '아이스 디카페인 아메리카노로 준비하겠습니다.' },
      { n: 5, user: '제 이름 기억하세요?', ai: '박서연님이시죠. 다음에도 같은 메뉴로 드릴까요?' },
    ];

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 정의
    //   memoryType  : 'none' | 'buffer' | 'window' | 'summary' | 'vector'
    //   turns       : 화면에 보이는 turn 배열 [{ n, user, ai, state }]
    //                 state: 'visible' | 'dropped' | 'summarized' | 'recalled'
    //   memoryBox   : 메모리 박스 표시 데이터
    //   userInput   : 현재 사용자 질문 (메모리 사용 여부 강조)
    //   aiAnswer    : 응답 결과
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      nomem: {lang:"python", filename:"no-memory.py", lines:[
        "# Step 1. 메모리 없는 기본 LLM — 매 호출이 독립",
        "from langchain_openai import ChatOpenAI",
        "",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\")",
        "",
        "# 1턴: 정상",
        "llm.invoke(\"아메리카노 한 잔 주세요\")",
        "#  → \"네, 따뜻한 아메리카노 준비하겠습니다.\"",
        "",
        "# 2턴: 이름 알려줌",
        "llm.invoke(\"제 이름은 박서연이에요\")",
        "#  → \"반갑습니다, 박서연님.\"",
        "",
        "# 5턴: 이름 기억하는지 물어보면?",
        "llm.invoke(\"제 이름 기억하세요?\")",
        "#  → \"처음 뵙는데요?\" 😱  (실패)",
        "",
        "# ─── 왜? ───",
        "#  LLM API는 stateless 다.",
        "#  각 호출은 완전히 독립이고 이전 호출을 모른다.",
        "#  서버 측에서 history를 누적해 함께 보내야",
        "#  \"대화\"가 성립한다 — 그게 Memory 의 역할.",
        "",
        "# 다음 단계: ConversationBufferMemory 로 history 누적",
      ]},
      buffer: {lang:"python", filename:"buffer.py", lines:[
        "# Step 2. ConversationBufferMemory — 전체 history 그대로 누적",
        "from langchain.memory import ConversationBufferMemory",
        "from langchain.chains import ConversationChain",
        "from langchain_openai import ChatOpenAI",
        "",
        "# 1) 메모리 인스턴스 — 모든 턴을 그대로 보관",
        "memory = ConversationBufferMemory(",
        "    return_messages=True,",
        "    memory_key=\"chat_history\",",
        ")",
        "",
        "# 2) ConversationChain 에 결합",
        "chain = ConversationChain(",
        "    llm=ChatOpenAI(model=\"gpt-4o-mini\"),",
        "    memory=memory,",
        "    verbose=True,",
        ")",

        memoryType:'summary',

        memoryBox:{ kind:'summary', summary:'(아직 요약 없음)', recentSlots:[], tokensOriginal:0, tokensSummary:0 },

      },
      { ...S4,
        beat:{ label:'5턴을 그대로 돌린다', at:'summary.py L16–18',
               caption:'chain 을 만들어 5턴을 진행한다. 아직은 전부 원문 buffer 에 들어 있고 142 토큰이다.',
               changes:[{mark:'new', text:'chain 생성'},
                        {mark:'changed', text:'buffer 5턴 원문 · 142 tok'}] },
        memoryType:'summary',
        turns:[T(1,'visible'), T(2,'visible'), T(3,'visible'), T(4,'visible'), T(5,'visible')],
        memoryBox:{ kind:'summary', summary:'(아직 요약 없음 — 80 토큰 이내)', recentSlots:[SLOT(1), SLOT(2), SLOT(3), SLOT(4), SLOT(5)], tokensOriginal:142, tokensSummary:142 },

        beat:{ label:'1·2·3턴을 한 줄로 압축', at:'summary.py L19–21',

               changes:[{mark:'new', text:'summary 슬롯 채워짐'},
                        {mark:'changed', text:'1·2·3턴 → 요약 (110→32 tok)'},
                        {mark:'read', text:'"박서연" 키워드 생존'}] },
        memoryType:'summary',
        turns:[T(1,'summarized'), T(2,'summarized'), T(3,'summarized'), T(4,'visible'), T(5,'visible')],
        memoryBox:{ kind:'summary', summary:'박서연 고객이 아메리카노를 주문, 디카페인으로 변경 요청. 멤버십 안내함.', recentSlots:[SLOT(4)], tokensOriginal:110, tokensSummary:32 },
        code:{...CODE.summary, highlight:[19,20,21]},
      },
      { ...S4,
        beat:{ label:'최근 4·5턴은 원문 그대로', at:'summary.py L22–27',
               caption:'요약(오래된 것) + 원문(최근 것) 두 층으로 prompt 를 만든다. 요약 안에 이름이 남아 정답이 나온다.',
               changes:[{mark:'changed', text:'recent buffer 4·5턴 원문'},
                        {mark:'read', text:'5턴 응답 정답'},
                        {mark:'new', text:'비용: 요약용 LLM 호출 1회'}] },
        memoryType:'summary',
        turns:[T(1,'summarized'), T(2,'summarized'), T(3,'summarized'), T(4,'visible'), T(5,'visible')],
        memoryBox:{ kind:'summary', summary:'박서연 고객이 아메리카노를 주문, 디카페인으로 변경 요청. 멤버십 안내함.', recentSlots:[SLOT(4), SLOT(5)], tokensOriginal:110, tokensSummary:32 },
        code:{...CODE.summary, highlight:[22,23,24,25,26,27]},
      },

      // ── Step 5. VectorStoreRetrieverMemory ───────────────────────────
      { ...S5,
        beat:{ label:'RAG 메모리를 불러온다', at:'vector-memory.py L2–4',
               caption:'메모리 클래스 + FAISS + 임베딩 모델. 검색 기반 메모리는 이 세 가지가 세트다.',
               changes:[{mark:'read', text:'VectorStoreRetrieverMemory import'},
                        {mark:'gone', text:'저장소 아직 없음'}] },
        memoryType:'none',
        turns:[],
        memoryBox:{ kind:'none' },
        code:{...CODE.vector, highlight:[2,3,4]},
      },
      { ...S5,
        beat:{ label:'빈 스토어 + top-k=2 retriever', at:'vector-memory.py L6–13',
               caption:'임베딩 모델로 문장을 벡터로 바꾸고, retriever 는 질의당 2건만 꺼내도록 고정한다.',
               changes:[{mark:'new', text:'embeddings · vectorstore'},
                        {mark:'new', text:'retriever (k=2)'}] },
        memoryType:'vector',
        turns:[],
        memoryBox:{ kind:'vector', query:'(아직 질의 없음)', recalled:[], totalStored:0 },
        code:{...CODE.vector, highlight:[6,7,8,9,10,11,12,13]},
      },
      { ...S5,
        beat:{ label:'retriever 를 메모리에 연결', at:'vector-memory.py L15–19',
               caption:'메모리가 retriever 를 물었다. 지금 스토어에는 초기화용 시드 1건뿐이다.',
               changes:[{mark:'new', text:'memory 인스턴스'},
                        {mark:'changed', text:'stored 1건 (init 시드)'}] },
        memoryType:'vector',
        turns:[],
        memoryBox:{ kind:'vector', query:'(아직 질의 없음)', recalled:[], totalStored:1 },
        code:{...CODE.vector, highlight:[15,16,17,18,19]},
      },
      { ...S5,
        beat:{ label:'save_context 로 매 턴 저장', at:'vector-memory.py L21–26',
               caption:'턴마다 입력·출력을 임베딩해 스토어에 넣는다. 5턴이 전부 벡터로 남는다.',
               changes:[{mark:'new', text:'5턴 임베딩 저장'},
                        {mark:'changed', text:'stored 5건'},
                        {mark:'read', text:'아직 회수된 건 없음'}] },
        memoryType:'vector',
        turns:[T(1,'stored'), T(2,'stored'), T(3,'stored'), T(4,'stored'), T(5,'stored')],
        memoryBox:{ kind:'vector', query:'(아직 질의 없음)', recalled:[], totalStored:5 },
        code:{...CODE.vector, highlight:[21,22,23,24,25,26]},
      },
      { ...S5,
        beat:{ label:'질문을 벡터로 던진다', at:'vector-memory.py L28–29',
               caption:'load_memory_variables 가 현재 질문을 임베딩해 유사도 검색을 시작한다.',
               changes:[{mark:'new', text:'query = "제 이름 기억하세요?"'},
                        {mark:'read', text:'검색 실행 (top-2)'}] },
        memoryType:'vector',
        turns:[T(1,'stored'), T(2,'stored'), T(3,'stored'), T(4,'stored'), T(5,'stored')],
        memoryBox:{ kind:'vector', query:'제 이름 기억하세요?', recalled:[], totalStored:5 },
        code:{...CODE.vector, highlight:[28,29]},
      },
      { ...S5,
        beat:{ label:'2턴만 회수돼 답이 나온다', at:'vector-memory.py L30–33',
               caption:'의미가 가까운 2턴(0.91)이 1위로 회수된다. 100턴이 쌓여도 prompt 에는 이 2건만 들어간다.',
               changes:[{mark:'changed', text:'2턴 → recalled (0.91)'},
                        {mark:'read', text:'prompt 에 top-2 만 포함'},
                        {mark:'new', text:'토큰이 대화 길이와 무관해짐'}] },
        memoryType:'vector',
        turns:[T(1,'stored'), T(2,'recalled'), T(3,'stored'), T(4,'stored'), T(5,'stored')],
        memoryBox:{ kind:'vector', query:'제 이름 기억하세요?',
          recalled:[
            { n: 2, score: 0.91, text: '박서연이에요 → 반갑습니다, 박서연님' },
            { n: 5, score: 0.74, text: '이름 기억하세요? (현재 질의)' },
          ],
          totalStored:5 },
        code:{...CODE.vector, highlight:[30,31,32,33]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 위: 대화 박스 — 5턴 시나리오 시각화
    //   step의 turns 배열을 받아 각 turn을 상태별로 표시
    //   - visible    : 정상 (emerald 채움)
    //   - dropped    : 회색 + line-through (Step 3 window에서 잘림)
    //   - summarized : 보라 점선 (Step 4 summary로 압축됨)
    //   - recalled   : 파랑 굵은 테두리 (Step 5 vector RAG로 회수)
    //   - stored     : 옅은 회색 (Step 5 저장됐지만 회수 안됨)
    //   - fail       : 빨강 (Step 1)
    // ─────────────────────────────────────────────────────
    function ConversationBox({ turns, memoryType }) {
      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">☕</span>
              <span className="text-[11px] font-bold text-emerald-800">단골 카페 대화 (5턴)</span>
            </div>
            <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-mono">
              {memoryType === 'none' ? 'no-memory' :
               memoryType === 'buffer' ? 'buffer' :
               memoryType === 'window' ? 'window k=2' :
               memoryType === 'summary' ? 'summary+buf' :
               'vector+RAG'}
            </span>
          </div>
          <div className="space-y-1.5">
            {turns.map((t) => {
              let frame = '';
              let userClass = 'bg-slate-600 text-white';
              let aiClass = 'bg-white text-emerald-900 border border-emerald-300';
              let badge = null;
              if (t.state === 'dropped') {
                frame = 'opacity-40';
                userClass = 'bg-slate-300 text-slate-500 line-through';
                aiClass = 'bg-slate-100 text-slate-400 border border-slate-200 line-through';
                badge = <span className="text-[8px] bg-slate-400 text-white px-1 rounded font-bold">DROPPED</span>;
              } else if (t.state === 'summarized') {
                frame = '';
                userClass = 'bg-purple-200 text-purple-800 border border-dashed border-purple-400';
                aiClass = 'bg-purple-50 text-purple-700 border border-dashed border-purple-300 italic';
                badge = <span className="text-[8px] bg-purple-500 text-white px-1 rounded font-bold">SUMMARIZED</span>;
              } else if (t.state === 'recalled') {
                frame = '';
                userClass = 'bg-blue-600 text-white ring-2 ring-blue-300';
                aiClass = 'bg-blue-50 text-blue-900 border-2 border-blue-400 font-medium';
                badge = <span className="text-[8px] bg-blue-600 text-white px-1 rounded font-bold animate-pulse">RECALLED</span>;
              } else if (t.state === 'stored') {
                frame = 'opacity-60';
                userClass = 'bg-slate-400 text-white';
                aiClass = 'bg-white text-slate-600 border border-slate-200';
                badge = <span className="text-[8px] bg-slate-500 text-white px-1 rounded font-bold">stored</span>;
              } else if (t.state === 'fail') {
                userClass = 'bg-slate-600 text-white';
                aiClass = 'bg-red-100 text-red-800 border border-red-300 font-bold';
                badge = <span className="text-[8px] bg-red-600 text-white px-1 rounded font-bold animate-pulse">FAIL</span>;
              }
              return (
                <div key={t.n} className={`p-1.5 rounded border border-slate-100 ${frame} transition-all duration-500`}>
                  <div className="flex items-center gap-1 mb-0.5">
                    <span className="text-[9px] font-mono font-bold text-slate-500 w-5">#{t.n}</span>
                    {badge}
                  </div>
                  <div className="space-y-1 ml-5">
                    <div className="flex justify-end">
                      <div className={`max-w-[85%] px-2 py-0.5 rounded text-[10px] leading-tight ${userClass}`}>
                        {t.user}
                      </div>
                    </div>
                    <div className="flex justify-start">
                      <div className={`max-w-[88%] px-2 py-0.5 rounded text-[10px] leading-tight ${aiClass}`}>
                        {t.ai}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 아래: 메모리 박스 — kind 별로 다른 시각화
    //   - none    : 빈 박스 + 경고
    //   - buffer  : 모든 turn 누적 + 토큰 카운터
    //   - window  : 최근 k turn만 + dropped 카운트
    //   - summary : 요약 박스(보라) + 최근 buffer(emerald) + 토큰 비교
    //   - vector  : 검색 쿼리 + recalled 결과 + score
    // ─────────────────────────────────────────────────────
    function MemoryBox({ box }) {
      if (box.kind === 'none') {
        return (
          <div className="bg-red-50 border-2 border-dashed border-red-300 rounded-lg p-3">
            <div className="flex items-center gap-1.5 mb-2">
              <span className="text-base">🚫</span>
              <span className="text-[11px] font-bold text-red-700">Memory: 없음 (stateless)</span>
            </div>
            <div className="bg-white rounded border border-red-200 p-2 text-center">
              <div className="text-[10px] text-red-600 font-mono italic">chat_history = ∅</div>
              <div className="text-[9px] text-red-500 mt-1">매 호출 후 즉시 휘발 — 다음 턴이 이전을 모른다</div>
            </div>
          </div>
        );
      }

      if (box.kind === 'buffer') {
        return (
          <div className="bg-emerald-50 border-2 border-emerald-300 rounded-lg p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">📒</span>
                <span className="text-[11px] font-bold text-emerald-800">ConversationBufferMemory</span>
              </div>
              <span className="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                {box.tokens} tok
              </span>
            </div>
            <div className="bg-white rounded border border-emerald-200 p-2 max-h-40 overflow-y-auto">
              <div className="text-[9px] font-bold text-emerald-700 mb-1 uppercase tracking-wider">chat_history (전체 누적)</div>
              <div className="space-y-1">
                {box.slots.map((s) => (
                  <div key={s.n} className="text-[9px] font-mono leading-snug">
                    <div className="text-blue-700">[#{s.n}] H: {s.user}</div>
                    <div className="text-emerald-700 ml-3">A: {s.ai}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="text-[9px] text-emerald-700 mt-1.5">
              ⚠ 길어질수록 토큰 선형 증가 → 비용·지연 폭증
            </div>
          </div>
        );
      }

      if (box.kind === 'window') {
        return (
          <div className="bg-amber-50 border-2 border-amber-300 rounded-lg p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">🪟</span>
                <span className="text-[11px] font-bold text-amber-800">BufferWindowMemory (k={box.k})</span>
              </div>
              <span className="text-[9px] bg-amber-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                {box.tokens} tok
              </span>
            </div>
            <div className="bg-white rounded border border-amber-200 p-2">
              <div className="text-[9px] font-bold text-amber-700 mb-1 uppercase tracking-wider">최근 {box.k} 턴만 keep</div>
              <div className="space-y-1">
                {box.slots.map((s) => (
                  <div key={s.n} className="text-[9px] font-mono leading-snug">
                    <div className="text-blue-700">[#{s.n}] H: {s.user}</div>
                    <div className="text-emerald-700 ml-3">A: {s.ai}</div>
                  </div>
                ))}
              </div>
              <div className="border-t border-dashed border-amber-200 mt-2 pt-1.5 text-[9px] text-amber-700 font-mono">
                ✗ {box.dropped}턴 폐기 (1·2·3턴 = 이름·디카페인 정보 유실)
              </div>
            </div>
          </div>
        );
      }

      if (box.kind === 'summary') {
        return (
          <div className="bg-purple-50 border-2 border-purple-300 rounded-lg p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">📝</span>
                <span className="text-[11px] font-bold text-purple-800">SummaryBufferMemory</span>
              </div>
              <span className="text-[9px] bg-purple-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                {box.tokensOriginal}→{box.tokensSummary} tok
              </span>
            </div>

            {/* 요약 슬롯 */}
            <div className="bg-white rounded border-2 border-dashed border-purple-300 p-2 mb-2">
              <div className="text-[9px] font-bold text-purple-700 mb-1 uppercase tracking-wider">📌 summary (1·2·3턴 압축)</div>
              <div className="text-[10px] text-purple-900 italic leading-snug">"{box.summary}"</div>
            </div>

            {/* 최근 turn buffer */}
            <div className="bg-white rounded border border-emerald-200 p-2">
              <div className="text-[9px] font-bold text-emerald-700 mb-1 uppercase tracking-wider">💬 recent buffer (4·5턴 원문)</div>
              <div className="space-y-1">
                {box.recentSlots.map((s) => (
                  <div key={s.n} className="text-[9px] font-mono leading-snug">
                    <div className="text-blue-700">[#{s.n}] H: {s.user}</div>
                    <div className="text-emerald-700 ml-3">A: {s.ai}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="text-[9px] text-purple-700 mt-1.5">
              ✓ 요약 70%↓ + 핵심 키워드("박서연") 살아남음
            </div>
          </div>
        );
      }

      if (box.kind === 'vector') {
        return (
          <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">🔍</span>
                <span className="text-[11px] font-bold text-blue-800">VectorStoreRetrieverMemory</span>
              </div>
              <span className="text-[9px] bg-blue-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                {box.totalStored} stored
              </span>
            </div>

            {/* 쿼리 */}
            <div className="bg-white rounded border border-blue-200 p-2 mb-2">
              <div className="text-[9px] font-bold text-blue-700 mb-0.5 uppercase tracking-wider">query (현재 질문)</div>
              <div className="text-[10px] text-blue-900 font-mono">"{box.query}"</div>
            </div>

            {/* 화살표 */}
            <div className="text-center text-blue-500 text-[10px] font-mono mb-1">↓ embedding · top-k=2 검색 ↓</div>

            {/* 회수 결과 */}
            <div className="bg-white rounded border-2 border-blue-400 p-2">
              <div className="text-[9px] font-bold text-blue-700 mb-1 uppercase tracking-wider">recalled (의미 유사도 순)</div>
              <div className="space-y-1">
                {box.recalled.map((r, i) => (
                  <div key={i} className="flex items-center gap-1.5 text-[9px] font-mono">
                    <span className="bg-blue-600 text-white px-1 py-0.5 rounded font-bold w-12 text-center">
                      {r.score.toFixed(2)}
                    </span>
                    <span className="text-blue-900 flex-1 leading-tight">[#{r.n}] {r.text}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="text-[9px] text-blue-700 mt-1.5">
              ✨ 100턴이어도 prompt 토큰 일정 — 관련 turn 만 골라씀
            </div>
          </div>
        );
      }

      return null;
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: 대화 박스 / 하단: 메모리 박스
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">☕ 단골 카페 — Memory 4종 비교</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-3">
            <ConversationBox turns={step.turns} memoryType={step.memoryType} />
            <MemoryBox box={step.memoryBox} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>visible
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-slate-400"></span>dropped
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-purple-500"></span>summarized
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-blue-500"></span>recalled (RAG)
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2 h-2 rounded bg-red-500"></span>fail
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-3</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 체인 패턴 &gt; Chapter 1. 기본 체인</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">III-1-3. ConversationChain — 대화 이력 자동 관리 (Memory)</h1>
                  <p className="text-sm text-slate-500 mt-0.5">단골 카페 바리스타의 4가지 노트 — Buffer · Window · Summary · Vector</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-3 text-sm text-emerald-900">
                💡 정리: 짧은 대화는 <strong>Buffer</strong>, 비용 민감하면 <strong>Window</strong>, 긴 대화는 <strong>Summary</strong>, 장기 기억은 <strong>Vector</strong>. 다음(III-2-1)에서는 외부 문서 검색 RAG Chain을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-emerald-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-emerald-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['ConversationChain', 'BufferMemory', 'WindowMemory', 'SummaryMemory', 'VectorStoreMemory', 'chat_history'].map((kw) => (
                <span key={kw} className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-1-2.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; III-1-2 RouterChain</a>
              <a href="./III-2-1.html" className="text-emerald-700 hover:text-emerald-900 font-medium">III-2-1 RAG Chain &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
