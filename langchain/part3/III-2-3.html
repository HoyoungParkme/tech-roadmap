  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-2-3. Agent + Tools Chain — LangChain Agent에 도구 등록
    학습 목표: @tool 데코레이터로 만든 도구를 Agent가 자동으로 호출하는 ReAct 흐름을 이해.
    핵심 비유: 똑똑한 비서 — 도구함을 들고 상황에 맞는 도구를 골라 쓴다.
    패턴: fastapi v1 — 좌(Agent ↔ Tools ↔ LLM 흐름 + ReAct Trace) / 우(VSCode CodeViewer)
    색상: langchain emerald
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 도구 카탈로그 — 등록되는 도구 3종
    //   step에 따라 status 가 바뀜:
    //     'idle'      : 등록만 됨
    //     'selected'  : Agent 가 이 도구를 골랐다
    //     'executed'  : 호출 완료, 결과 보유
    // ─────────────────────────────────────────────────────
    const BASE_TOOLS = [
      { name: 'weather_tool', icon: '🌤️', desc: '도시의 현재 날씨를 조회합니다.', signature: '(city: str) -> str' },
      { name: 'search_tool',  icon: '🔍', desc: '웹에서 정보를 검색합니다.',       signature: '(query: str) -> str' },
      { name: 'calc_tool',    icon: '🧮', desc: '수식을 계산해 결과를 반환합니다.', signature: '(expr: str) -> str' },
    ];

    // ─────────────────────────────────────────────────────
    // 5 단계 정의
    //   각 step:
    //     title, desc
    //     dataState:
    //       tools          : [{ name, status, result? }]
    //       agentState     : 'empty' | 'ready' | 'thinking' | 'calling' | 'observing' | 'answering'
    //       userInput?     : 사용자 질문
    //       agentMessage?  : Agent 박스 안 메시지
    //       toolCall?      : { name, args }
    //       toolResult?    : 'string'
    //       finalAnswer?   : string
    //       trace          : [{ kind: 'thought'|'action'|'observation'|'answer', text }]
    //       callbacks?     : [{ event, payload }]
    //     code: { lang, filename, lines, highlight }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      definetool: {lang:"python", filename:"define-tool.py", lines:[
        "# Step 1. @tool 데코레이터 — 함수를 LangChain 도구로 등록",
        "from langchain_core.tools import tool",
        "",
        "@tool",
        "def weather_tool(city: str) -> str:",
        "    \"\"\"도시의 현재 날씨를 조회합니다.\"\"\"",
        "    # 실제로는 외부 날씨 API 호출",
        "    return f\"{city}: 맑음, 24°C\"",
        "",
        "@tool",
        "def search_tool(query: str) -> str:",
        "    \"\"\"웹에서 정보를 검색합니다.\"\"\"",
        "    return \"검색 결과 ...\"",
        "",
        "@tool",
        "def calc_tool(expr: str) -> str:",
        "    \"\"\"수식을 계산해 결과를 반환합니다.\"\"\"",
        "    return str(eval(expr))",
        "",
        "# ─── 핵심 ───",
        "# 1) docstring  → LLM 이 도구 선택 시 읽는 설명",
        "# 2) 타입 힌트   → 인자 스키마(JSON Schema) 자동 생성",
        "# 3) 반환 str   → Observation 으로 ReAct 루프에 들어감",
        "",
        "# 다음 단계: 이 3개 도구를 Agent 에 묶는다.",
      ]},
      createagent: {lang:"python", filename:"create-agent.py", lines:[
        "# Step 2. create_tool_calling_agent — LLM + tools + prompt 결합",
        "from langchain_openai import ChatOpenAI",
        "from langchain_core.prompts import ChatPromptTemplate",
        "from langchain.agents import create_tool_calling_agent",
        "",
        "# 1) LLM — tool calling 을 native 로 지원하는 모델",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\", temperature=0)",
        "",
        "# 2) 도구 리스트 (Step 1 에서 정의한 3개)",
        "tools = [weather_tool, search_tool, calc_tool]",
        "",
        "# 3) prompt — system 메시지 + 사용자 입력 + agent_scratchpad",
        "prompt = ChatPromptTemplate.from_messages([",
        "    (\"system\", \"너는 도구를 잘 활용하는 비서다.\"),",
        "    (\"human\",  \"{input}\"),",
        "    (\"placeholder\", \"{agent_scratchpad}\"),",
        "])",
        "",
        "# 4) Agent 조립",
        "agent = create_tool_calling_agent(",
        "    llm=llm,",
        "    tools=tools,",
        "    prompt=prompt,",
        ")",
        "",
        "# 💡 Agent 자체는 \"다음 행동(tool 호출 or 최종답)을 결정하는\" 함수다.",
        "#    실제 실행 루프는 다음 단계 AgentExecutor 가 담당한다.",

    // ─────────────────────────────────────────────────────
    // ToolBox — Agent 가 들고 있는 도구 카탈로그
    //   각 tool 의 status 에 따라 색상이 변한다.
    // ─────────────────────────────────────────────────────
    function ToolBox({ tools }) {
      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🧰</span>
              <span className="text-[11px] font-bold text-emerald-800">Tools (등록된 도구)</span>
            </div>
            <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-mono">
              {tools.length} 개
            </span>
          </div>
          <div className="space-y-1.5">
            {tools.map((t) => {
              let frame = 'bg-slate-50 border-slate-200';
              let nameColor = 'text-slate-700';
              let badge = null;
              if (t.status === 'selected') {
                frame = 'bg-emerald-50 border-emerald-400 ring-2 ring-emerald-200';
                nameColor = 'text-emerald-800 font-bold';
                badge = <span className="text-[8px] bg-emerald-500 text-white px-1 rounded font-bold animate-pulse">SELECTED</span>;
              } else if (t.status === 'executed') {
                frame = 'bg-emerald-50 border-emerald-300';
                nameColor = 'text-emerald-800 font-bold';
                badge = <span className="text-[8px] bg-emerald-600 text-white px-1 rounded font-bold">EXECUTED</span>;
              } else {
                badge = <span className="text-[8px] bg-slate-300 text-slate-600 px-1 rounded font-mono">idle</span>;
              }
              return (
                <div key={t.name} className={`p-2 rounded border ${frame} transition-all duration-500`}>
                  <div className="flex items-center gap-1.5 mb-0.5">
                    <span className="text-sm">{t.icon}</span>
                    <span className={`text-[11px] font-mono ${nameColor}`}>{t.name}</span>
                    <span className="text-[9px] text-slate-400 font-mono">{t.signature}</span>
                    <span className="ml-auto">{badge}</span>
                  </div>
                  <div className="text-[9px] text-slate-500 ml-5 leading-tight">"{t.desc}"</div>
                  {t.result && (
                    <div className="mt-1 ml-5 bg-white border border-emerald-300 rounded px-1.5 py-0.5 text-[9px] font-mono text-emerald-800">
                      → {t.result}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // AgentFlow — Agent 박스 ↔ Tools ↔ LLM 흐름
    //   agentState 에 따라 화살표 활성화 / Agent 박스 텍스트 변화
    // ─────────────────────────────────────────────────────
    function AgentFlow({ data }) {
      const isReady     = data.agentState !== 'empty';
      const isCalling   = data.agentState === 'calling' || data.agentState === 'answering';
      const isAnswering = data.agentState === 'answering';

      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center gap-1.5 mb-2">
            <span className="text-base">⚡</span>
            <span className="text-[11px] font-bold text-emerald-800">Agent ↔ Tools ↔ LLM 흐름</span>
          </div>

          {/* 사용자 입력 */}
          {data.userInput && (
            <div className="bg-slate-100 border border-slate-200 rounded px-2 py-1 mb-2 text-[10px]">
              <span className="text-[9px] font-bold text-slate-500 mr-1">USER →</span>
              <span className="text-slate-700">"{data.userInput}"</span>
            </div>
          )}

          <div className="grid grid-cols-3 gap-2 items-center">
            {/* Agent 박스 */}
            <div className={`rounded-lg border-2 p-2 text-center transition-all duration-500 ${
              isReady
                ? 'bg-emerald-100 border-emerald-400 shadow-md'
                : 'bg-slate-50 border-dashed border-slate-300 opacity-60'
            }`}>
              <div className="text-2xl mb-0.5">🤖</div>
              <div className={`text-[10px] font-bold ${isReady ? 'text-emerald-800' : 'text-slate-400'}`}>Agent</div>
              <div className="text-[8px] text-slate-500 font-mono mt-0.5">
                {data.agentState === 'empty'     && '미구성'}
                {data.agentState === 'ready'     && 'ready'}
                {data.agentState === 'thinking'  && 'thinking'}
                {data.agentState === 'calling'   && 'calling tool'}
                {data.agentState === 'observing' && 'observing'}
                {data.agentState === 'answering' && 'answering ✓'}
              </div>
            </div>

            {/* 화살표 */}
            <div className="flex flex-col items-center gap-1">
              <div className={`text-xs ${isCalling ? 'text-emerald-600 animate-pulse' : 'text-slate-300'}`}>
                tool_call →
              </div>
              <div className={`text-xs ${isCalling ? 'text-emerald-600 animate-pulse' : 'text-slate-300'}`}>
                ← observation
              </div>
            </div>

            {/* LLM / Tool 박스 */}
            <div className={`rounded-lg border-2 p-2 text-center transition-all duration-500 ${
              isReady
                ? 'bg-emerald-50 border-emerald-300'
                : 'bg-slate-50 border-dashed border-slate-300 opacity-60'
            }`}>
              <div className="text-2xl mb-0.5">🧠</div>
              <div className={`text-[10px] font-bold ${isReady ? 'text-emerald-800' : 'text-slate-400'}`}>LLM (gpt-4o)</div>
              <div className="text-[8px] text-slate-500 font-mono mt-0.5">tool calling</div>
            </div>
          </div>

          {/* tool 호출 결과 박스 (있을 때만 등장) */}
          {data.toolCall && (
            <div className="mt-2 bg-emerald-50 border-2 border-emerald-300 rounded-lg p-2">
              <div className="flex items-center gap-1.5 mb-1">
                <span className="text-[9px] font-bold text-emerald-700 uppercase tracking-wider">tool call</span>
              </div>
              <div className="text-[10px] font-mono text-emerald-900 leading-tight">
                {data.toolCall.name}<span className="text-emerald-600"> ({data.toolCall.args})</span>
              </div>
            </div>
          )}

          {/* 최종 답변 */}
          {isAnswering && data.finalAnswer && (
            <div className="mt-2 bg-emerald-600 text-white rounded-lg p-2 shadow-md">
              <div className="text-[9px] font-bold opacity-80 uppercase tracking-wider mb-0.5">final answer</div>
              <div className="text-[11px] leading-snug">{data.finalAnswer}</div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // ReActTrace — Thought / Action / Observation / Answer 누적
    // ─────────────────────────────────────────────────────
    function ReActTrace({ trace, callbacks }) {
      if (!trace || trace.length === 0) {
        return (
          <div className="bg-slate-50 border-2 border-dashed border-slate-200 rounded-lg p-3 text-center">
            <span className="text-[10px] text-slate-400 font-mono">ReAct trace — 아직 실행 전</span>
          </div>
        );
      }

      const colorOf = (k) => {
        if (k === 'thought')     return { box: 'bg-amber-50 border-amber-300', label: 'bg-amber-500',  ic: '💭' };
        if (k === 'action')      return { box: 'bg-emerald-50 border-emerald-300', label: 'bg-emerald-600', ic: '🔧' };
        if (k === 'observation') return { box: 'bg-blue-50 border-blue-300', label: 'bg-blue-600',     ic: '👀' };
        return                          { box: 'bg-emerald-100 border-emerald-500', label: 'bg-emerald-700', ic: '💬' };
      };

      return (
        <div className="bg-white rounded-lg border-2 border-emerald-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">📜</span>
              <span className="text-[11px] font-bold text-emerald-800">ReAct trace</span>
            </div>
            <span className="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-mono">
              {trace.length} step
            </span>
          </div>

          <div className="space-y-1">
            {trace.map((t, i) => {
              const c = colorOf(t.kind);
              return (
                <div key={i} className={`rounded border ${c.box} px-2 py-1 flex items-start gap-1.5`}>
                  <span className={`${c.label} text-white text-[8px] font-bold uppercase rounded px-1 py-0.5 mt-0.5 w-16 text-center flex-shrink-0`}>
                    {c.ic} {t.kind}
                  </span>
                  <span className="text-[10px] text-slate-700 leading-snug font-mono flex-1">
                    {t.text}
                  </span>
                </div>
              );
            })}
          </div>

          {/* callbacks 이벤트 (Step 5 에서만) */}
          {callbacks && callbacks.length > 0 && (
            <div className="mt-2 pt-2 border-t border-dashed border-emerald-200">
              <div className="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-1">
                🪝 callback events
              </div>
              <div className="bg-slate-900 rounded p-2 max-h-28 overflow-y-auto">
                {callbacks.map((c, i) => (
                  <div key={i} className="text-[9px] font-mono leading-snug">
                    <span className="text-emerald-400">[{c.event}]</span>
                    <span className="text-slate-300 ml-1">{c.payload}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: AgentFlow / 중단: ToolBox / 하단: ReActTrace
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      const d = step.dataState;
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🤖 Agent + Tools — ReAct 실행</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-3">
            <AgentFlow data={d} />
            <ToolBox tools={d.tools} />
            <ReActTrace trace={d.trace} callbacks={d.callbacks} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-500"></span>thought
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-600"></span>action
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-blue-600"></span>observation
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-700"></span>answer
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-2-3</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 체인 패턴 &gt; Chapter 2. 고급 체인</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">III-2-3. Agent + Tools Chain — LangChain Agent 에 도구 등록</h1>
                  <p className="text-sm text-slate-500 mt-0.5">@tool · create_tool_calling_agent · AgentExecutor · ReAct trace · callbacks</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-3 text-sm text-emerald-900">
                💡 정리: <strong>@tool</strong> 로 함수 등록 → <strong>create_tool_calling_agent</strong> 로 LLM 결합 → <strong>AgentExecutor</strong> 가 ReAct 루프 자동화 → <strong>callbacks</strong> 로 모니터링. 다음(IV-1-1)에서는 LangGraph 로 더 복잡한 분기·반복 흐름을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-emerald-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-emerald-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['@tool', 'create_tool_calling_agent', 'AgentExecutor', 'ReAct', 'tool_call', 'callbacks', 'intermediate_steps'].map((kw) => (
                <span key={kw} className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./III-2-2.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; III-2-2 MapReduce Chain</a>
              <a href="../part4/IV-1-1.html" className="text-emerald-700 hover:text-emerald-900 font-medium">IV-1-1 왜 LangGraph 인가 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
