            '    embeddings = OpenAIEmbeddings(model="text-embedding-3-small")',
            '    backend = os.environ.get("VECTOR_STORE", "chroma")',
            '',
            '    if backend == "chroma":',
            '        from langchain_chroma import Chroma',
            '        return Chroma.from_documents(',
            '            documents=docs,',
            '            embedding=embeddings,',
            '            persist_directory="./chroma_db",',
            '        )',
            '',
            '    if backend == "faiss":',
            '        from langchain_community.vectorstores import FAISS',
            '        return FAISS.from_documents(',
            '            documents=docs,',
            '            embedding=embeddings,',
            '        )',
            '',
            '    if backend == "pgvector":',
            '        from langchain_postgres import PGVector',
            '        return PGVector.from_documents(',
            '            documents=docs,',
            '            embedding=embeddings,',
            '            collection_name="study_docs",',
            '            connection=os.environ["PG_DSN"],',
            '            use_jsonb=True,',
            '        )',
            '',
            '    raise ValueError(f"Unknown VECTOR_STORE={backend}")',
            '',
            '# ─── 호출 측은 store 이름을 모른다 ───',
            'store = get_vectorstore(docs)',
            'retriever = store.as_retriever(search_kwargs={"k": 4})',
            '#  ↑ 이 두 줄은 dev/test/prod 어디서 돌든 동일!',
            '',
            '# ✨ fastapi 의 Depends + Settings 패턴과 같은 철학:',
            '#    환경 분기는 factory 한곳에서, 비즈니스 코드는 추상에 의존',
          ],
          highlight: [1, 6, 12, 14, 15, 16, 17, 18, 19, 20, 21, 23, 24, 25, 26, 27, 28, 30, 31, 32, 33, 34, 35, 36, 37, 38, 43, 44, 45],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 위: 3 Vector Store 박스
    //   각 store: Chroma · FAISS · pgvector
    //   step에 따라 하나만 'active' (강조), 나머지는 idle/ready
    //   active 일 때는 docs 리스트도 박스 안에 표시
    // ─────────────────────────────────────────────────────
    function StoreCard({ store }) {
      const palette = {
        Chroma:   { active: 'bg-emerald-50 border-emerald-400 ring-2 ring-emerald-200', ready: 'bg-emerald-50 border-emerald-300', idle: 'bg-slate-50 border-slate-200 opacity-50', text: 'text-emerald-800', accent: 'text-emerald-600', chip: 'bg-emerald-600' },
        FAISS:    { active: 'bg-sky-50 border-sky-400 ring-2 ring-sky-200',                ready: 'bg-sky-50 border-sky-300',         idle: 'bg-slate-50 border-slate-200 opacity-50', text: 'text-sky-800',     accent: 'text-sky-600',     chip: 'bg-sky-600' },
        pgvector: { active: 'bg-purple-50 border-purple-400 ring-2 ring-purple-200',       ready: 'bg-purple-50 border-purple-300',   idle: 'bg-slate-50 border-slate-200 opacity-50', text: 'text-purple-800',  accent: 'text-purple-600',  chip: 'bg-purple-600' },
      };
      const p = palette[store.name];
      const frame =
        store.status === 'active' ? p.active :
        store.status === 'ready'  ? p.ready  : p.idle;

      return (
        <div className={`rounded-lg border-2 p-2.5 transition-all duration-500 ${frame}`}>
          <div className="flex items-center justify-between mb-1.5">
            <div className="flex items-center gap-1.5">
              <span className="text-base">{store.emoji}</span>
              <span className={`text-[11px] font-bold ${p.text}`}>{store.name}</span>
              <span className="text-[9px] text-slate-500 font-mono">· {store.tag}</span>
            </div>
            {store.status === 'active' && (
              <span className={`text-[8px] ${p.chip} text-white px-1 py-0.5 rounded font-bold animate-pulse`}>ACTIVE</span>
            )}
            {store.status === 'ready' && (
              <span className="text-[8px] bg-slate-500 text-white px-1 py-0.5 rounded font-bold">ready</span>
            )}
          </div>

          <div className={`text-[9px] font-mono ${p.accent} mb-1.5 truncate`}>{store.badge}</div>

          {store.docs && store.docs.length > 0 && (
            <div className="bg-white rounded border border-slate-200 p-1.5 max-h-32 overflow-y-auto">
              <div className="text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-1">indexed docs ({store.docs.length})</div>
              <div className="space-y-0.5">
                {store.docs.map((d) => (
                  <div key={d.id} className="flex items-center gap-1 text-[9px]">
                    <span className={`${p.chip} text-white px-1 rounded font-bold w-5 text-center`}>#{d.id}</span>
                    <span className="text-slate-700 flex-1 truncate">{d.text}</span>
                    <span className="bg-slate-100 text-slate-500 px-1 rounded text-[8px]">{d.topic}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {(!store.docs || store.docs.length === 0) && store.status === 'idle' && (
            <div className="bg-white/50 rounded border border-dashed border-slate-300 p-2 text-center">
              <span className="text-[9px] text-slate-400 italic">— 비활성 —</span>
            </div>
          )}

          {(!store.docs || store.docs.length === 0) && store.status === 'ready' && (
            <div className="bg-white rounded border border-slate-200 p-1.5 text-center">
              <span className="text-[9px] text-slate-500 font-mono">VectorStore 추상 구현체</span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 아래: 공통 인터페이스 다이어그램 / 환경 교체 시각화 / 안내
    //   Step 1·2·3 : 간단한 안내 박스
    //   Step 4     : 공통 메서드 시그니처 다이어그램
    //   Step 5     : ENV별 dev/test/prod 매핑 다이어그램
    // ─────────────────────────────────────────────────────
    function BottomPane({ step }) {
      if (step.active === 'interface') {
        return (
          <div className="bg-emerald-50 border-2 border-emerald-300 rounded-lg p-3">
            <div className="flex items-center gap-1.5 mb-2">
              <span className="text-base">🔌</span>
              <span className="text-[11px] font-bold text-emerald-800">VectorStore 추상 — 공통 메서드 (LSP)</span>
            </div>

            {/* 다이어그램 — 부모 추상 → 3 자식 */}
            <div className="bg-white rounded border border-emerald-200 p-2 mb-2">
              <div className="flex items-center justify-center gap-1 mb-1.5">
                <span className="bg-slate-800 text-white px-2 py-0.5 rounded text-[10px] font-mono font-bold">VectorStore (ABC)</span>
              </div>
              <div className="flex items-center justify-center text-emerald-500 text-[10px] mb-1">↓ 상속 ↓</div>
              <div className="flex items-center justify-center gap-1.5">
                <span className="bg-emerald-600 text-white px-1.5 py-0.5 rounded text-[9px] font-mono">Chroma</span>
                <span className="bg-sky-600     text-white px-1.5 py-0.5 rounded text-[9px] font-mono">FAISS</span>
                <span className="bg-purple-600  text-white px-1.5 py-0.5 rounded text-[9px] font-mono">PGVector</span>
              </div>
            </div>

            {/* 메서드 시그니처 리스트 */}
            <div className="bg-white rounded border border-emerald-200 p-2">
              <div className="text-[9px] font-bold text-emerald-700 uppercase tracking-wider mb-1">강제 구현 메서드</div>
              <div className="space-y-0.5">
                {step.interfaceMethods.map((m, i) => (
                  <div key={i} className="text-[9px] font-mono leading-snug">
                    <span className="text-emerald-700 font-bold">▸ {m.sig}</span>
                    <span className="text-slate-500 ml-1">— {m.note}</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="text-[9px] text-emerald-700 mt-1.5">
              ✨ 호출 코드는 어떤 구현체든 동일 — Liskov 치환 원칙 그대로
            </div>
          </div>
        );
      }

      if (step.active === 'swap') {
        const swapColor = (c) => ({
          emerald: { bg: 'bg-emerald-100', border: 'border-emerald-400', text: 'text-emerald-800', chip: 'bg-emerald-600' },
          sky:     { bg: 'bg-sky-100',     border: 'border-sky-400',     text: 'text-sky-800',     chip: 'bg-sky-600' },
          purple:  { bg: 'bg-purple-100',  border: 'border-purple-400',  text: 'text-purple-800',  chip: 'bg-purple-600' },
        })[c];

        return (
          <div className="bg-emerald-50 border-2 border-emerald-300 rounded-lg p-3">
            <div className="flex items-center gap-1.5 mb-2">
              <span className="text-base">🔀</span>
              <span className="text-[11px] font-bold text-emerald-800">환경별 store 매핑 — get_vectorstore() factory</span>
            </div>

            <div className="bg-white rounded border border-emerald-200 p-2 mb-2">
              {/* 비즈니스 코드 → factory → 3 store */}
              <div className="flex items-center justify-center mb-1.5">
                <span className="bg-slate-800 text-white px-2 py-0.5 rounded text-[10px] font-mono">store.similarity_search(...)</span>
              </div>
              <div className="text-center text-emerald-500 text-[10px]">↓ get_vectorstore() ↓</div>
              <div className="text-center text-[9px] text-slate-500 font-mono mb-1.5">os.environ["VECTOR_STORE"]</div>

              <div className="grid grid-cols-3 gap-1.5">
                {step.swap.envs.map((e) => {
                  const c = swapColor(e.color);
                  return (
                    <div key={e.env} className={`${c.bg} ${c.border} border-2 rounded p-1.5 text-center`}>
                      <div className="flex items-center justify-center gap-1 mb-0.5">
                        <span className="text-sm">{e.icon}</span>
                        <span className={`${c.chip} text-white text-[8px] font-bold px-1 rounded uppercase`}>{e.env}</span>
                      </div>
                      <div className={`text-[9px] font-mono font-bold ${c.text}`}>{e.store}</div>
                      <div className="text-[8px] text-slate-600 mt-0.5">{e.why}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="text-[9px] text-emerald-700">
              ✨ 비즈니스 코드는 한 줄도 안 바뀐다 — fastapi Depends · Settings 패턴과 동일
            </div>
          </div>
        );
      }

      // Step 1·2·3 — 활성 store 안내 + 검색 데모
      const storeName = step.active;
      const labelMap = {
        chroma:   { color: 'emerald', icon: '🟢', name: 'Chroma',   one: 'pip install langchain-chroma',                msg: '한 줄 from_documents() — 자동 영속화' },
        faiss:    { color: 'sky',     icon: '🔵', name: 'FAISS',    one: 'pip install faiss-cpu langchain-community',   msg: '인메모리 / save_local() 로 디스크 저장' },
        pgvector: { color: 'purple',  icon: '🟣', name: 'pgvector', one: 'pip install langchain-postgres psycopg',     msg: 'CREATE EXTENSION vector — Postgres 통합' },
      };
      const m = labelMap[storeName];
      const color = m.color;
      const palette = {
        emerald: { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-800', accent: 'text-emerald-700', chip: 'bg-emerald-600' },
        sky:     { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-800',     accent: 'text-sky-700',     chip: 'bg-sky-600' },
        purple:  { bg: 'bg-purple-50',  border: 'border-purple-300',  text: 'text-purple-800',  accent: 'text-purple-700',  chip: 'bg-purple-600' },
      }[color];

      return (
        <div className={`${palette.bg} ${palette.border} border-2 rounded-lg p-3`}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">{m.icon}</span>
              <span className={`text-[11px] font-bold ${palette.text}`}>{m.name} 활성 — 데모 검색</span>
            </div>
            <span className={`text-[9px] ${palette.chip} text-white font-mono px-1.5 py-0.5 rounded`}>step {STEPS.indexOf(step) + 1}/5</span>
          </div>

          {/* 설치 1줄 */}
          <div className="bg-slate-900 rounded p-2 mb-2">
            <div className={`text-[9px] font-bold ${palette.accent} mb-0.5 uppercase tracking-wider`}>install</div>
            <div className="text-[10px] font-mono text-emerald-300">$ {m.one}</div>
          </div>

          {/* 검색 데모 — 공통 인터페이스 강조 */}
          <div className="bg-white rounded border border-slate-200 p-2 mb-1.5">
            <div className={`text-[9px] font-bold ${palette.accent} mb-1 uppercase tracking-wider`}>같은 메서드, 같은 결과</div>
            <div className="text-[10px] font-mono leading-snug space-y-0.5">
              <div className="text-amber-700">▸ query: "AI Agent가 뭐야?"</div>
              <div className="text-slate-700">▸ store.similarity_search(query, k=2)</div>
              <div className={`${palette.accent} pl-3`}>↳ #1 AI Agent는 자율적으로 판단하고 행동한다 <span className="bg-emerald-100 text-emerald-700 px-1 rounded">0.94</span></div>
              <div className={`${palette.accent} pl-3`}>↳ #3 RAG는 검색 + 생성을 결합한 기법이다 <span className="bg-emerald-100 text-emerald-700 px-1 rounded">0.78</span></div>
            </div>
          </div>

          <div className={`text-[9px] ${palette.accent}`}>✨ {m.msg}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: 3 Store 박스 (Chroma · FAISS · pgvector)
    //   하단: 활성 store 안내 / 공통 인터페이스 / ENV 교체
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📚 3 Vector Stores — 같은 인터페이스</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>

          {/* 3 store 박스 (수직 스택) */}
          <div className="space-y-2 mb-3">
            {step.stores.map((s) => (
              <StoreCard key={s.name} store={s} />
            ))}
          </div>

          {/* 단계별 다이어그램 / 안내 */}
          <BottomPane step={step} />

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>Chroma (로컬)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-500"></span>FAISS (인메모리)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-purple-500"></span>pgvector (Postgres)
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2 h-2 rounded bg-slate-800"></span>VectorStore 추상
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    //   파일명 탭 + 라인 번호 + 강조 라인 (emerald)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    //   - 자동재생 3000ms
    //   - 키보드 ←/→
    //   - 4 버튼 (처음/이전/재생/다음)
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. 컴포넌트 &gt; Chapter 2. 저장과 검색</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">II-2-1. Vector Stores — Chroma · FAISS · pgvector</h1>
                  <p className="text-sm text-slate-500 mt-0.5">3가지 wrapper, 같은 인터페이스 — 환경에 따라 store만 갈아끼우는 패턴</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-3 text-sm text-emerald-900">
                💡 정리: dev는 <strong>Chroma</strong>, test는 <strong>FAISS</strong>, prod는 <strong>pgvector</strong>. 추상이 같으니 비즈니스 코드는 그대로 — fastapi의 Depends · Settings 패턴과 동일. 다음(II-2-2)에서는 이 store들을 <strong>Retriever</strong>로 추상화해 Chain에 결합하는 방법을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-emerald-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-200">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-emerald-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['Chroma', 'FAISS', 'pgvector', 'VectorStore', 'from_documents', 'similarity_search', 'as_retriever'].map((kw) => (
                <span key={kw} className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./II-1-3.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; II-1-3 Embeddings</a>
              <a href="./II-2-2.html" className="text-emerald-700 hover:text-emerald-900 font-medium">II-2-2 Retrievers &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
