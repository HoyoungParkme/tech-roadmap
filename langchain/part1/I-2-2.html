<head>

  <title>LangChain 학습 — I-2-2. OutputParser</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📚</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-2-2. OutputParser — JSON / Pydantic / List 구조화 출력
    학습 목표: LLM raw text 를 코드에서 바로 쓸 수 있는 구조화 객체(dict, list, BaseModel)로
              어떻게 변환하는지를 5단계 파싱 흐름으로 이해한다.
    핵심 비유: 세관 검사관 — 자유 텍스트 짐 → 규격 컨테이너 → 타입 X-ray 검증
    패턴: fastapi v1 — 좌(LiveDataPane: LLM raw → parser → 구조화 객체) / 우(VSCode CodeViewer)
    색상: langchain emerald
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 파싱 시나리오 — "Python 언어 정보를 받아온다"
    //   각 단계마다 LLM raw text → parser 박스 → 구조화 결과의
    //   3-stage flow 가 좌측에서 시각적으로 그려진다.
    //
    //   parserState  : 'fail' | 'json' | 'pydantic' | 'fmt' | 'structured'
    //   raw          : LLM 원본 출력 (string)
    //   parser       : { name, icon, color, note } — 가운데 박스
    //   parsed       : 구조화 결과 — { kind, value, fields }
    //                  kind: 'string' | 'dict' | 'object' | 'list'
    //   validation   : Pydantic type check 마크 (있으면 표시)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      stringPy: {lang:"python", filename:"string.py", lines:[
        "# Step 1. 파서 없이 — LLM raw text 만 받는다",
        "from langchain_openai import ChatOpenAI",
        "",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\")",
        "",
        "response = llm.invoke(\"Python 언어를 설명해줘\")",
        "print(type(response))",
        "#  → <class 'langchain_core.messages.AIMessage'>",
        "",
        "print(response.content)",
        "#  → \"Python은 1991년 귀도 반 로섬이 만든",
        "#     범용 프로그래밍 언어입니다.",
        "#     장점은 읽기 쉽고 라이브러리가 풍부하다는 점이며,",
        "#     단점으로는 실행 속도가 느리고 GIL 제약이 있습니다.\"",
        "",
        "# ─── 문제 ───",
        "#  1) AIMessage 객체 — content 를 매번 .content 로 꺼내야 함",
        "#  2) content 는 자유 형식 산문",
        "#     → name, year, pros, cons 를 코드에서 dict 처럼 못 씀",
        "#  3) 정규식·split 으로 파싱? 모델이 형식 바꾸면 즉시 깨짐",
        "",
        "# 코드에서 바로 쓰려면? → 구조화된 출력 필요",
        "# 다음 단계: JsonOutputParser 로 dict 변환",
      ]},
      jsonParser: {lang:"python", filename:"json-parser.py", lines:[
        "# Step 2. JsonOutputParser — markdown fence 자동 제거 + dict 변환",
        "from langchain_openai import ChatOpenAI",
        "from langchain_core.output_parsers import JsonOutputParser",
        "from langchain_core.prompts import ChatPromptTemplate",
        "",
        "llm = ChatOpenAI(model=\"gpt-4o-mini\")",
        "parser = JsonOutputParser()",
        "",
        "# 1) JSON 으로 답하라고 프롬프트에 명시",
        "prompt = ChatPromptTemplate.from_template(",
        "    \"{topic} 언어를 JSON 으로 설명해줘. \"",
        "    \"키: name, year, pros(list), cons(list)\"",
        ")",
        "",
        "# 2) LCEL 로 prompt | llm | parser 체인 구성",
        "chain = prompt | llm | parser",
        "",
        "# 3) 실행 — 결과는 자동으로 dict",
        "data = chain.invoke({\"topic\": \"Python\"})",
        "",
        "print(type(data))",
        "#  → <class 'dict'>          ✓ 더 이상 AIMessage 가 아님",
        "print(data[\"name\"])",
        "#  → \"Python\"                 ✓ 키로 즉시 접근",
        "print(data[\"pros\"][0])",
        "#  → \"읽기 쉬움\"              ✓ 리스트도 그대로",
        "",
        "# ⚠ 한계: 키 오타·타입 틀림(year=\"1991\")이어도 그냥 통과",
        "#         → Step 3 PydanticOutputParser 가 해결",
      ]},
      pydanticParser: {lang:"python", filename:"pydantic-parser.py", lines:[
        "# Step 3. PydanticOutputParser — 스키마 정의 + 타입 검증",
        "from pydantic import BaseModel, Field",
        "from langchain_openai import ChatOpenAI",
        "from langchain_core.output_parsers import PydanticOutputParser",
        "from langchain_core.prompts import ChatPromptTemplate",
        "",

          "note": "리스트 스키마도 같은 방식"
        },
        parsed: {
          "kind": "object",
          "className": "LanguageInfo",
          "fields": [
            {
              "key": "name",
              "value": "\"Python\"",
              "type": "str",
              "ok": true
            },
            {
              "key": "year",
              "value": "1991",
              "type": "int",
              "ok": true
            },
            {
              "key": "pros",
              "value": "[\"읽기 쉬움\", \"라이브러리\"]",
              "type": "list[str]",
              "ok": true
            },
            {
              "key": "cons",
              "value": "[\"속도 느림\", \"GIL\"]",
              "type": "list[str]",
              "ok": true
            }
          ],
          "note": "Top3.languages 는 list[LanguageInfo]"
        },
        code: {...CODE.structuredOutput, highlight: [33,34,35,36,37,38,39,40]},
      },
      { ...S5,
        beat: {
          "label": "신규 코드의 기본값",
          "at": "structured-output.py L42",
          "caption": "prompt · parser · 검증이 한 줄로 합쳐진다. 새로 쓰는 코드는 이걸 먼저 고려한다.",
          "changes": [
            {
              "mark": "changed",
              "text": "PydanticOutputParser 대체"
            },
            {
              "mark": "new",
              "text": "신규 코드 기본 선택지"
            }
          ]
        },
        parserState: "structured",
        raw: {
          "label": "OpenAI function calling (내부 동작)",
          "text": "# 모델이 tool spec 으로 LanguageInfo 스키마를 받음\n#   → 응답을 처음부터 JSON 으로 강제 생성\n#   → markdown fence 없음, 파싱 실패 거의 0\n\n{\"name\":\"Python\",\"year\":1991,\"pros\":[\"읽기 쉬움\",\"라이브러리\"],\"cons\":[\"속도 느림\",\"GIL\"]}"
        },
        parser: {
          "name": "llm.with_structured_output(LanguageInfo)",
          "icon": "✨",
          "color": "blue",
          "note": "parser + prompt + function call 통합"
        },
        parsed: {
          "kind": "object",
          "className": "LanguageInfo",
          "fields": [
            {
              "key": "name",
              "value": "\"Python\"",
              "type": "str",
              "ok": true
            },
            {
              "key": "year",
              "value": "1991",
              "type": "int",
              "ok": true
            },
            {
              "key": "pros",
              "value": "[\"읽기 쉬움\", \"라이브러리\"]",
              "type": "list[str]",
              "ok": true
            },
            {
              "key": "cons",
              "value": "[\"속도 느림\", \"GIL\"]",
              "type": "list[str]",
              "ok": true
            }
          ],
          "note": "한 줄로 prompt · parser · 검증까지 끝"
        },
        code: {...CODE.structuredOutput, highlight: [42]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 위: Raw Text 박스 — LLM 원본 출력
    //   parserState 에 따라 색상 변화 (fail → red, 정상 → slate)
    // ─────────────────────────────────────────────────────
    function RawTextBox({ raw, parserState }) {
      const isFail = parserState === 'fail';
      const labelColor = isFail ? 'text-red-600' : 'text-slate-600';
      const borderColor = isFail ? 'border-red-300' : 'border-slate-300';
      const bgColor = isFail ? 'bg-red-50' : 'bg-slate-50';
      const textColor = isFail ? 'text-red-900' : 'text-slate-800';

      return (
        <div className={`bg-white rounded-lg border-2 ${borderColor} p-3`}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">📨</span>
              <span className={`text-[11px] font-bold ${labelColor}`}>{raw.label}</span>
            </div>
            <span className="text-[9px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono">
              raw text
            </span>
          </div>
          <pre className={`${bgColor} rounded border ${borderColor} p-2 text-[10px] ${textColor} font-mono whitespace-pre-wrap leading-snug max-h-44 overflow-y-auto`}>
            {raw.text}
          </pre>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 가운데: Parser 박스 — 색상별 강조
    //   color: 'red' | 'emerald' | 'purple' | 'amber' | 'blue'
    // ─────────────────────────────────────────────────────
    function ParserBox({ parser }) {
      const colorMap = {
        red: { border: 'border-red-300', bg: 'bg-red-50', text: 'text-red-700', dot: 'bg-red-400' },
        emerald: { border: 'border-emerald-400', bg: 'bg-emerald-50', text: 'text-emerald-800', dot: 'bg-emerald-500' },
        purple: { border: 'border-purple-400', bg: 'bg-purple-50', text: 'text-purple-800', dot: 'bg-purple-500' },
        amber: { border: 'border-amber-400', bg: 'bg-amber-50', text: 'text-amber-800', dot: 'bg-amber-500' },
        blue: { border: 'border-blue-400', bg: 'bg-blue-50', text: 'text-blue-800', dot: 'bg-blue-500' },
      };
      const c = colorMap[parser.color] || colorMap.emerald;

      return (
        <div className="flex flex-col items-center gap-1">
          <div className="text-slate-400 text-sm font-mono">↓</div>
          <div className={`w-full ${c.bg} border-2 ${c.border} rounded-lg px-3 py-2 shadow-sm`}>
            <div className="flex items-center gap-2">
              <span className="text-2xl">{parser.icon}</span>
              <div className="flex-1">
                <div className={`text-[12px] font-bold ${c.text} font-mono leading-tight`}>{parser.name}</div>
                <div className={`text-[9px] ${c.text} opacity-80 mt-0.5`}>{parser.note}</div>
              </div>
              <span className={`w-2 h-2 rounded-full ${c.dot} animate-pulse`}></span>
            </div>
          </div>
          <div className="text-slate-400 text-sm font-mono">↓</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 아래: Parsed 박스 — 구조화 결과
    //   kind 별 다른 시각화
    //   - string : 회색 텍스트 + 경고
    //   - dict   : key/value 표
    //   - object : Pydantic 필드 표 + 타입 컬럼 + ✓ 마크
    // ─────────────────────────────────────────────────────
    function ParsedBox({ parsed, parserState }) {
      // string (실패 케이스)
      if (parsed.kind === 'string') {
        return (
          <div className="bg-white rounded-lg border-2 border-red-300 p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">⚠️</span>
                <span className="text-[11px] font-bold text-red-700">파싱 결과 — string 그대로</span>
              </div>
              <span className="text-[9px] bg-red-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                type: str
              </span>
            </div>
            <div className="bg-slate-50 rounded border border-slate-200 p-2 mb-2">
              <div className="text-[10px] text-slate-700 font-mono">{parsed.value}</div>
            </div>
            <pre className="bg-red-50 border border-red-200 rounded p-2 text-[9px] text-red-700 font-mono whitespace-pre-wrap leading-snug">
              {parsed.warning}
            </pre>
          </div>
        );
      }

      // dict (Step 2 — JsonOutputParser)
      if (parsed.kind === 'dict') {
        const entries = Object.entries(parsed.value);
        return (
          <div className="bg-white rounded-lg border-2 border-emerald-400 p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">✅</span>
                <span className="text-[11px] font-bold text-emerald-800">파싱 결과 — Python dict</span>
              </div>
              <span className="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                type: dict
              </span>
            </div>
            <div className="bg-emerald-50 rounded border border-emerald-200 p-2">
              <div className="text-[9px] font-bold text-emerald-700 mb-1.5 uppercase tracking-wider">key / value</div>
              <div className="space-y-1">
                {entries.map(([k, v]) => (
                  <div key={k} className="flex items-start gap-2 text-[10px] font-mono leading-snug">
                    <span className="text-blue-700 font-bold w-14 flex-shrink-0">"{k}"</span>
                    <span className="text-slate-400">:</span>
                    <span className="text-emerald-900 flex-1 break-all">
                      {Array.isArray(v) ? `[${v.map(s => `"${s}"`).join(', ')}]` : (typeof v === 'string' ? `"${v}"` : String(v))}
                    </span>
                  </div>
                ))}
              </div>
            </div>
            <div className="text-[9px] text-emerald-700 mt-1.5">
              ✓ data["name"] · data["pros"][0] 즉시 사용 가능 — 단 타입 검증은 없음
            </div>
          </div>
        );
      }

      // object (Step 3, 4, 5 — Pydantic)
      if (parsed.kind === 'object') {
        const colorMap = {
          pydantic: { border: 'border-purple-400', bg: 'bg-purple-50', text: 'text-purple-800', tag: 'bg-purple-600' },
          fmt: { border: 'border-amber-400', bg: 'bg-amber-50', text: 'text-amber-800', tag: 'bg-amber-600' },
          structured: { border: 'border-blue-400', bg: 'bg-blue-50', text: 'text-blue-800', tag: 'bg-blue-600' },
        };
        const c = colorMap[parserState] || colorMap.pydantic;

        return (
          <div className={`bg-white rounded-lg border-2 ${c.border} p-3`}>
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">🛡️</span>
                <span className={`text-[11px] font-bold ${c.text}`}>파싱 결과 — {parsed.className} 인스턴스</span>
              </div>
              <span className={`text-[9px] ${c.tag} text-white px-1.5 py-0.5 rounded font-mono font-bold`}>
                type validated
              </span>
            </div>
            <div className={`${c.bg} rounded border ${c.border.replace('400', '200')} p-2`}>
              <div className={`text-[9px] font-bold ${c.text} mb-1.5 uppercase tracking-wider flex items-center gap-1.5`}>
                <span>field</span>
                <span className="opacity-50">/</span>
                <span>value</span>
                <span className="opacity-50">/</span>
                <span>type ✓</span>
              </div>
              <div className="space-y-1">
                {parsed.fields.map((f) => (
                  <div key={f.key} className="grid grid-cols-12 gap-1 text-[10px] font-mono leading-snug items-center">
                    <span className="col-span-3 text-blue-700 font-bold truncate">.{f.key}</span>
                    <span className={`col-span-6 ${c.text} break-all`}>{f.value}</span>
                    <span className="col-span-2 text-[8px] bg-white border border-slate-200 rounded px-1 py-0.5 text-slate-600 text-center font-mono truncate">
                      {f.type}
                    </span>
                    <span className="col-span-1 text-emerald-600 text-center font-bold">{f.ok ? '✓' : '✗'}</span>
                  </div>
                ))}
              </div>
            </div>
            {parsed.note && (
              <div className={`text-[9px] ${c.text} mt-1.5`}>
                ✨ {parsed.note}
              </div>
            )}
          </div>
        );
      }

      return null;
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   raw → parser → parsed 의 3-stage flow 시각화
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🛂 세관 검사관 — LLM raw → 구조화 객체</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            <RawTextBox raw={step.raw} parserState={step.parserState} />
            <ParserBox parser={step.parser} />
            <ParsedBox parsed={step.parsed} parserState={step.parserState} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-red-500"></span>fail (raw)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>dict
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-purple-500"></span>pydantic
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-500"></span>format_inst
            </span>
            <span className="flex items-center gap-1 ml-auto">
              <span className="w-2 h-2 rounded bg-blue-500"></span>structured
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. LangChain이란 &gt; Chapter 2. 핵심 컴포넌트</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">I-2-2. OutputParser — JSON / Pydantic / List 구조화 출력</h1>
                  <p className="text-sm text-slate-500 mt-0.5">세관 검사관 5단계 — raw text → JSON dict → Pydantic 객체 → format_instructions → with_structured_output()</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-3 text-sm text-emerald-900">
                💡 정리: 자유 텍스트는 <strong>raw</strong>, dict 면 충분하면 <strong>JsonOutputParser</strong>, 타입 안전이 필요하면 <strong>PydanticOutputParser</strong>, 신규 코드는 <strong>with_structured_output()</strong>. 다음(II-1-1)에서는 외부 문서를 LLM 에 넣는 Document Loader 를 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-emerald-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-emerald-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['OutputParser', 'JsonOutputParser', 'PydanticOutputParser', 'BaseModel', 'format_instructions', 'with_structured_output'].map((kw) => (
                <span key={kw} className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-2-1.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; I-2-1 PromptTemplate</a>
              <a href="../part2/II-1-1.html" className="text-emerald-700 hover:text-emerald-900 font-medium">II-1-1 Document Loaders &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
