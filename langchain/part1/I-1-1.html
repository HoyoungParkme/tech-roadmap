  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-1-1. LLM 직접 호출 vs LangChain
    학습 목표: LLM 직접 호출의 boilerplate 부담과 LangChain이 이를 어떻게
              컴포넌트 조합으로 줄이는지 5단계로 비교한다.
    핵심 비유: "직접 요리 vs 밀키트" — 30줄 절차 vs 5줄 파이프 체인
    패턴: fastapi v1 — 좌(LiveDataPane: 직접 vs LangChain 코드 박스 + 라인 막대)
                       우(VSCode CodeViewer: 파일 탭 5종)
    색상: langchain emerald
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5 STEP — LLM 호출 진화 시나리오
    //   Step 1. 직접 호출 boilerplate
    //   Step 2. 모델 교체(OpenAI → Anthropic) 시 코드를 다시
    //   Step 3. LangChain 추상화 (ChatOpenAI / ChatAnthropic)
    //   Step 4. LCEL 체이닝 (prompt | model | parser)
    //   Step 5. 라인 수 비교 (30줄 vs 5줄)
    //
    //   각 step의 dataState:
    //     leftBox  : 직접 호출 코드 박스 (라벨/줄목록/줄수/이슈)
    //     rightBox : LangChain 코드 박스 (라벨/줄목록/줄수/혜택)
    //     bar      : 라인수 막대 비교 (left/right 절대값 + 가시화)
    //     verdict  : 단계 한 줄 결론 (하단 노란 띠)
    // ─────────────────────────────────────────────────────

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      direct: { "lang": "python", "filename": "direct.py", "lines": [
        "\"\"\"Step 1. OpenAI HTTP API를 requests 로 직접 호출.\"\"\"",
        "import os, requests",
        "",
        "# 1) 환경 변수에서 키 로드",
        "API_KEY = os.environ[\"OPENAI_API_KEY\"]",
        "URL = \"https://api.openai.com/v1/chat/completions\"",
        "",
        "# 2) 헤더 — Bearer 인증 + JSON Content-Type",
        "headers = {",
        "    \"Authorization\": f\"Bearer {API_KEY}\",",
        "    \"Content-Type\": \"application/json\",",
        "}",
        "",
        "# 3) 바디 — model · messages 스키마를 손으로 맞춤",
        "body = {",
        "    \"model\": \"gpt-4o-mini\",",
        "    \"messages\": [",
        "        {\"role\": \"user\", \"content\": \"이 리뷰를 요약해줘: ...\"},",
        "    ],",
        "}",
        "",
        "# 4) HTTP POST — 타임아웃·재시도 직접",
        "resp = requests.post(URL, headers=headers, json=body, timeout=30)",
        "resp.raise_for_status()",
        "",
        "# 5) 응답 dict 깊이 5단 파싱",
        "data = resp.json()",
        "answer = data[\"choices\"][0][\"message\"][\"content\"]",
        "",
        "# ─── 문제점 ───",
        "#  ⚠ 키 노출 위험 / retry / rate-limit 직접",
        "#  ⚠ 프롬프트가 body 안에 박혀 재사용 불가",
        "#  ⚠ 모델·벤더 바뀌면 URL부터 전부 다시",
      ]},
      vs: { "lang": "python", "filename": "openai-vs-anthropic.py", "lines": [
        "\"\"\"Step 2. 같은 작업, 벤더만 바꿔도 코드 전체가 다르다.\"\"\"",
        "import os, requests",
        "",
        "PROMPT = \"이 리뷰를 요약해줘: ...\"",
        "",
        "# ───── (A) OpenAI ─────",
        "oai_resp = requests.post(",
        "    \"https://api.openai.com/v1/chat/completions\",",
        "    headers={",
        "        \"Authorization\": f\"Bearer {os.environ['OPENAI_API_KEY']}\",",
        "    },",
        "    json={",
        "        \"model\": \"gpt-4o-mini\",",
        "        \"messages\": [{\"role\": \"user\", \"content\": PROMPT}],",
        "    },",
        ")",
        "oai_text = oai_resp.json()[\"choices\"][0][\"message\"][\"content\"]",
        "",
        "# ───── (B) Anthropic — 처음부터 다시 ─────",
        "ant_resp = requests.post(",
        "    \"https://api.anthropic.com/v1/messages\",        # URL 다름",
        "    headers={",
        "        \"x-api-key\": os.environ[\"ANTHROPIC_API_KEY\"],   # 키 이름 다름",
        "        \"anthropic-version\": \"2023-06-01\",              # 버전 헤더 강제",
        "    },",
        "    json={",
        "        \"model\": \"claude-3-5-sonnet-20241022\",",
        "        \"max_tokens\": 1024,                             # 필수 필드",
        "        \"messages\": [{\"role\": \"user\", \"content\": PROMPT}],",

    // ─────────────────────────────────────────────────────
    // 좌측: 코드 박스 한 짝 (직접 호출 / LangChain)
    //   accent: red(문제) / emerald(좋음) / amber(주의) / slate(대기)
    // ─────────────────────────────────────────────────────
    const ACCENT = {
      red:     { border: 'border-red-300',     bg: 'bg-red-50',     title: 'text-red-800',     tag: 'bg-red-100 text-red-700',     code: 'bg-red-900/95 text-red-50' },
      emerald: { border: 'border-emerald-300', bg: 'bg-emerald-50', title: 'text-emerald-800', tag: 'bg-emerald-100 text-emerald-700', code: 'bg-emerald-900/95 text-emerald-50' },
      amber:   { border: 'border-amber-300',   bg: 'bg-amber-50',   title: 'text-amber-800',   tag: 'bg-amber-100 text-amber-700',   code: 'bg-amber-900/95 text-amber-50' },
      slate:   { border: 'border-slate-300',   bg: 'bg-slate-50',   title: 'text-slate-700',   tag: 'bg-slate-100 text-slate-600',   code: 'bg-slate-800 text-slate-200' },
    };

    function MiniCodeBox({ box }) {
      const a = ACCENT[box.accent] || ACCENT.slate;

      // 빈 박스 (Step 1의 우측)
      if (box.empty) {
        return (
          <div className={`${a.bg} border-2 border-dashed ${a.border} rounded-lg p-3 flex flex-col items-center justify-center min-h-[14rem]`}>
            <div className="text-3xl mb-1.5 opacity-60">{box.icon}</div>
            <div className={`text-[11px] font-bold ${a.title}`}>{box.label}</div>
            <div className="text-[10px] text-slate-500 mt-1 italic">{box.empty}</div>
          </div>
        );
      }

      // Step 5 요약 표 박스
      if (box.summaryRows) {
        return (
          <div className={`${a.bg} border-2 ${a.border} rounded-lg p-3`}>
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-base">{box.icon}</span>
                <span className={`text-[11px] font-bold ${a.title}`}>{box.label}</span>
              </div>
              <span className={`text-[9px] ${a.tag} px-1.5 py-0.5 rounded font-mono`}>
                {box.tag}
              </span>
            </div>
            <table className="w-full text-[10px] font-mono">
              <tbody>
                {box.summaryRows.map((r, i) => (
                  <tr
                    key={i}
                    className={`${r.total ? 'border-t-2 ' + a.border + ' font-bold' : 'border-b border-slate-100'}`}
                  >
                    <td className="py-1 pl-1 text-slate-700">{r.what}</td>
                    <td className={`py-1 pr-1 text-right ${r.total ? a.title : 'text-slate-600'}`}>
                      {r.n}줄
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="border-t border-slate-200 mt-2 pt-1.5 text-[9px] space-y-0.5">
              {(box.issues || []).map((s, i) => (
                <div key={i} className="text-red-600">⚠ {s}</div>
              ))}
              {(box.benefits || []).map((s, i) => (
                <div key={i} className="text-emerald-700">✓ {s}</div>
              ))}
            </div>
          </div>
        );
      }

      // 일반 코드 박스 (Step 1~4)
      return (
        <div className={`${a.bg} border-2 ${a.border} rounded-lg p-3`}>
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">{box.icon}</span>
              <span className={`text-[11px] font-bold ${a.title}`}>{box.label}</span>
            </div>
            <span className={`text-[9px] ${a.tag} px-1.5 py-0.5 rounded font-mono`}>
              {box.tag}
            </span>
          </div>
          <pre className={`${a.code} rounded text-[10px] leading-snug p-2 overflow-x-auto font-mono`}>
            {(box.lines || []).map((l, i) => (
              <div key={i}>{l || ' '}</div>
            ))}
          </pre>
          <div className="border-t border-slate-200 mt-2 pt-1.5 text-[9px] space-y-0.5">
            <div className={`font-mono ${a.title}`}>
              <span className="opacity-70">코드 줄 수:</span>{' '}
              <span className="font-bold">{box.lineCount}줄</span>
            </div>
            {(box.issues || []).map((s, i) => (
              <div key={i} className="text-red-600">⚠ {s}</div>
            ))}
            {(box.benefits || []).map((s, i) => (
              <div key={i} className="text-emerald-700">✓ {s}</div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 라인 수 비교 막대 — 좌(red) vs 우(emerald)
    // ─────────────────────────────────────────────────────
    function LineBar({ bar }) {
      const max = bar.max || Math.max(bar.left, bar.right, 1);
      const lw = (bar.left  / max) * 100;
      const rw = (bar.right / max) * 100;
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 p-3">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[11px] font-bold text-slate-700">📏 코드 줄 수 비교</span>
            <span className="text-[9px] text-slate-400 font-mono">
              직접 {bar.left}줄  ·  LangChain {bar.right}줄
            </span>
          </div>

          {/* 좌: 직접 */}
          <div className="mb-2">
            <div className="flex items-center gap-1 mb-0.5">
              <span className="text-[9px] font-mono w-16 text-red-700 font-bold">직접 호출</span>
              <span className="text-[9px] text-slate-500">{bar.left}줄</span>
            </div>
            <div className="h-3.5 bg-slate-100 rounded-full overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-red-400 to-red-600 transition-all duration-700 flex items-center justify-end pr-1.5"
                style={{ width: `${lw}%` }}
              >
                {lw > 18 && (
                  <span className="text-[8px] text-white font-bold font-mono">{bar.left}</span>
                )}
              </div>
            </div>
          </div>

          {/* 우: LangChain */}
          <div>
            <div className="flex items-center gap-1 mb-0.5">
              <span className="text-[9px] font-mono w-16 text-emerald-700 font-bold">LangChain</span>
              <span className="text-[9px] text-slate-500">{bar.right}줄</span>
            </div>
            <div className="h-3.5 bg-slate-100 rounded-full overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-emerald-400 to-emerald-600 transition-all duration-700 flex items-center justify-end pr-1.5"
                style={{ width: `${rw}%` }}
              >
                {rw > 14 && bar.right > 0 && (
                  <span className="text-[8px] text-white font-bold font-mono">{bar.right}</span>
                )}
              </div>
            </div>
          </div>

          {bar.right > 0 && bar.left > 0 && (
            <div className="mt-2 text-center text-[10px] font-mono">
              <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">
                {Math.round((1 - bar.right / bar.left) * 100)}% 감소
              </span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 패널 전체 — LiveDataPane
    //   상단 2단: 직접 호출 박스 / LangChain 박스
    //   하단    : 라인 수 막대 비교
    //   푸터    : 한 줄 결론 (노란 띠)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">🍳 직접 요리 vs 📦 밀키트</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 좌/우 코드 박스 */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
            <MiniCodeBox box={step.leftBox} />
            <MiniCodeBox box={step.rightBox} />
          </div>

          {/* 라인 수 막대 */}
          <LineBar bar={step.bar} />

          {/* 한 줄 결론 */}
          <div className="mt-3 bg-amber-50 border-l-4 border-amber-400 p-2 rounded-r">
            <div className="text-[10px] font-bold text-amber-700 mb-0.5 uppercase tracking-wider">verdict</div>
            <div className="text-[11px] text-amber-900 leading-snug">{step.verdict}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측: VSCode 스타일 CodeViewer — highlight.js
    //   filename 탭 5종 (direct.py / openai-vs-anthropic.py /
    //                    langchain.py / lcel.py / compare.md)
    // ─────────────────────────────────────────────────────
    // 탭은 파일 하나당 하나다. STEPS 를 beat 로 펼치면 같은 파일이 여러 항목에 걸린다.
    const TAB_FILES2 = [...new Set(STEPS.map((s) => s.code.filename))];
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* 파일 탭 미니 (현재 step 의 파일 강조) */}
          <div className="bg-[#1c1f24] px-3 pt-1.5 flex items-center gap-1 border-b border-slate-700 overflow-x-auto">
            {TAB_FILES2.map((filename) => (
              <div
                key={filename}
                className={`px-2 py-1 text-[10px] font-mono rounded-t whitespace-nowrap ${
                  filename === code.filename
                    ? 'bg-[#282c34] text-emerald-300 border-t border-l border-r border-slate-700'
                    : 'text-slate-500'
                }`}
              >
                {filename}
              </div>
            ))}
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-emerald-500/15 border-l-2 border-emerald-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-emerald-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. LangChain이란 &gt; Chapter 1. LangChain 개요</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">I-1-1. LLM 직접 호출 vs LangChain</h1>
                  <p className="text-sm text-slate-500 mt-0.5">직접 요리 vs 밀키트 — 30줄 boilerplate가 5줄 파이프 체인이 되기까지</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-emerald-50 border-2 border-emerald-300 rounded-xl p-3 text-sm text-emerald-900">
                💡 정리: 라인 수 감소(70%↓)는 결과일 뿐, 진짜 이득은 <strong>같은 chain 객체</strong>에 invoke/batch/stream/ainvoke 가 모두 붙는다는 점이다. 다음(I-1-2)에서는 LangChain 전체 아키텍처 지도를 본다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-emerald-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-emerald-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['LangChain', 'ChatOpenAI', 'ChatAnthropic', 'LCEL', 'PromptTemplate', 'OutputParser', 'Runnable', '컴포넌트 조합'].map((kw) => (
                <span key={kw} className="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-medium border border-emerald-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-emerald-700 hover:text-emerald-900 font-medium">&larr; 허브</a>
              <a href="./I-1-2.html" className="text-emerald-700 hover:text-emerald-900 font-medium">I-1-2 LangChain 아키텍처 지도 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
