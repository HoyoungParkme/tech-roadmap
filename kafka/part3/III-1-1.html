  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📬</text></svg>" />

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Kafka III-1-1 — 메시지 전달 보장 3종 (At-most-once / At-least-once / Exactly-once)
    학습 목표: 메시지가 손실되거나 중복될 수 있는 이유, 각 보장 수준의 trade-off, 그리고
              비즈니스 요구사항에 따라 어떤 보장 수준을 선택해야 하는지 5단계로 학습한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 메시지 흐름 시뮬레이션) / 우(VSCode CodeViewer 5탭)
    색상: yellow (Kafka 전달 보장 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — at-most-once → at-least-once → 비교 → exactly-once → 선택
    //   producer  : 프로듀서 상태/설정
    //   broker    : 브로커가 받은 메시지 시각화
    //   consumer  : 컨슈머가 처리한 메시지 시각화
    //   timeline  : 메시지 단위 흐름 (sent / acked / delivered / lost / duplicated)
    //   alert     : 핵심 경고/요약 박스
    //   code      : 우측 CodeViewer 탭
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      amo: {lang:'python', filename:'at-most-once.py', lines:[
            '"""',
            'at-most-once.py — Kafka 메시지 손실 가능 / 중복 없음 패턴',
            '',
            '핵심 설정:',
            '  - acks=0          : 브로커 응답을 기다리지 않는다 (fire-and-forget)',
            '  - retries=0       : 실패해도 재전송하지 않는다',
            '  - 결과            : 손실 가능, 중복 없음',
            '"""',
            'from confluent_kafka import Producer',
            'import json',
            '',
            '# ── 1. Producer 설정 (at-most-once) ─────────────',
            'producer_conf = {',
            '    "bootstrap.servers": "localhost:9092",',
            '    "acks": "0",            # 브로커 ack 안 기다림',
            '    "retries": 0,           # 재전송 없음',
            '    "linger.ms": 0,         # 즉시 전송',
            '}',
            '',
            'producer = Producer(producer_conf)',
            '',
            '',
            '# ── 2. 메시지 전송 (응답 기다리지 않음) ──────────',
            'def send_metric(metric_name: str, value: float) -> None:',
            '    """메트릭을 fire-and-forget 으로 전송한다',
            '',
            '    Args:',
            '        metric_name: 메트릭 이름 (예: cpu_usage)',
            '        value: 메트릭 값',
            '',
            '    Side Effects:',
            '        Kafka 토픽 metrics 로 전송. 네트워크 실패 시 손실됨.',
            '    """',
            '    payload = json.dumps({"name": metric_name, "value": value})',
            '    producer.produce(topic="metrics", value=payload)',
            '    # flush 도 안 함 — 응답 기다리면 acks=0 의 장점이 사라진다',
            '',
            '',
            'if __name__ == "__main__":',
            '    # 메트릭 1000개를 빠르게 보낸다',
            '    for i in range(1000):',
            '        send_metric("cpu_usage", 50.0 + i * 0.01)',
            '    # 마지막에만 큐 비우기',
            '    producer.poll(0)',
            '',
            '',
            '# ── 적합한 유스케이스 ────────────────────────────',
            '#   ✓ 메트릭/로그 수집 (한두 건 빠져도 통계에 영향 없음)',
            '#   ✓ 클릭 이벤트 추적 (대략적인 추세만 보면 됨)',
            '#   ✓ IoT 센서 데이터 (다음 측정값으로 보정됨)',
            '#',
            '# ── 금지 유스케이스 ──────────────────────────────',
            '#   ✗ 결제/주문 (한 건 손실 = 돈/신뢰 손실)',
            '#   ✗ 재고 차감 (재고 불일치)',
            '#   ✗ 사용자 알림 (받지 못한 알림)',
      ]},
      alo: {lang:'python', filename:'at-least-once.py', lines:[
            '"""',
            'at-least-once.py — Kafka 손실 없음 / 중복 가능 패턴 (가장 흔한 기본값)',
            '',
            '핵심 설정:',
            '  - acks=all                : ISR 전체가 받을 때까지 기다림',
            '  - retries=2147483647      : 사실상 무한 재시도',
            '  - enable.idempotence=false: 명시적으로 중복 허용',

      { ...S5,

            { mark: 'read', text: '질문 2 개로 결정' },
            { mark: 'changed', text: '기본값 = ALO + 멱등' },
          ],
        },
        actor: '🧭 도메인에 맞는 보장 수준 선택',
        producer: { config: '도메인별 선택', mode: '가이드' },
        broker: { received: [], note: '' },
        consumer: { processed: [], lost: [], duplicated: [] },
        timeline: [
          { id: 'metric', state: 'amo', label: '메트릭/로그 → at-most-once' },
          { id: 'order', state: 'alo', label: '주문/알림/파이프라인 → at-least-once + 멱등' },
          { id: 'payment', state: 'eos', label: '결제/정산/재고 → exactly-once' },
          { id: 'tradeoff', state: 'note', label: '처리량 ↔ 정확성 trade-off 인식' },
          { id: 'default', state: 'note', label: '의심되면 at-least-once 부터' },
        ],
        chooseBox: {
          title: '도메인 ↔ 보장 수준 매핑',
          rows: [
            { domain: '클릭/뷰 이벤트, CPU/메모리 메트릭', level: 'At-most-once', why: '몇 건 빠져도 통계 영향 없음, 처리량이 최우선' },
            { domain: 'IoT 센서 / 위치 추적', level: 'At-most-once', why: '다음 측정값이 곧 보정됨' },
            { domain: '주문, 알림, 데이터 파이프라인', level: 'At-least-once + 멱등', why: '손실 절대 안 됨, 멱등 키로 중복 무해화' },
            { domain: '이벤트 소싱 (event log)', level: 'At-least-once + 멱등', why: '재처리해도 같은 상태 도출 가능해야' },
            { domain: '결제, 정산, 카운터, 재고 차감', level: 'Exactly-once', why: '손실/중복 모두 금전적 영향' },
            { domain: 'Kafka Streams 처리', level: 'Exactly-once', why: '내장 EOS 모드 (processing.guarantee)' },
          ],
        },
        alert: { tone: 'good', text: '의심되면 at-least-once + 멱등. 진짜 필요할 때만 exactly-once. 메트릭/로그만 at-most-once.' },
        code: { ...CODE.choose, highlight: [19, 20, 21, 22, 23] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 메시지 흐름 시각화 — Producer → Broker → Consumer
    // ─────────────────────────────────────────────────────
    const STATE_STYLE = {
      ok:      { color: 'bg-emerald-100 border-emerald-300 text-emerald-900', icon: '✓', label: '정상' },
      lost:    { color: 'bg-red-100 border-red-300 text-red-900',             icon: '✗', label: '손실' },
      dup:     { color: 'bg-amber-100 border-amber-300 text-amber-900',       icon: '×2', label: '중복' },
      eos:     { color: 'bg-red-100 border-red-400 text-red-900',    icon: '★',  label: '정확히 1회' },
      both:    { color: 'bg-slate-100 border-slate-300 text-slate-800',       icon: '=',  label: '동일' },
      compare: { color: 'bg-purple-100 border-purple-300 text-purple-900',    icon: '⇄', label: '비교' },
      amo:     { color: 'bg-orange-100 border-orange-300 text-orange-900',    icon: 'A',  label: 'AMO' },
      alo:     { color: 'bg-blue-100 border-blue-300 text-blue-900',          icon: 'L',  label: 'ALO' },
      note:    { color: 'bg-red-50 border-red-200 text-red-800',     icon: 'i',  label: '메모' },
    };

    function TimelineItem({ item }) {
      const s = STATE_STYLE[item.state] || STATE_STYLE.note;
      return (
        <li className={`rounded-lg border-2 ${s.color} px-3 py-2 flex items-center gap-3`}>
          <span className="font-mono text-[10px] font-bold w-14 bg-white/60 text-center rounded px-1 py-0.5">{item.id}</span>
          <span className="text-base font-bold w-6 text-center">{s.icon}</span>
          <span className="text-xs flex-1">{item.label}</span>
          <span className="text-[10px] uppercase tracking-wide font-bold opacity-70">{s.label}</span>
        </li>
      );
    }

    // ─────────────────────────────────────────────────────
    // Producer / Broker / Consumer 박스
    // ─────────────────────────────────────────────────────
    function FlowBox({ producer, broker, consumer }) {
      return (
        <div className="rounded-lg border-2 border-red-300 bg-white overflow-hidden">
          <div className="bg-gradient-to-r from-red-500 to-amber-500 text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2">
            <span>📬</span>
            <span>메시지 전달 시뮬레이션 (Producer → Broker → Consumer)</span>
          </div>
          <div className="grid grid-cols-3 gap-2 p-2 text-[10px]">
            <div className="rounded border border-red-200 bg-red-50 p-2">
              <div className="font-bold text-red-800 mb-1">🚀 Producer</div>
              <div className="font-mono text-red-900 break-words">{producer.config}</div>
              <div className="text-red-700 mt-1 italic">mode: {producer.mode}</div>
            </div>
            <div className="rounded border border-red-200 bg-red-50 p-2">
              <div className="font-bold text-red-800 mb-1">🗄️ Broker</div>
              {broker.received.length === 0 ? (
                <div className="text-red-700 italic">—</div>
              ) : (
                <ul className="space-y-0.5">
                  {broker.received.map((m, i) => (
                    <li key={i} className="font-mono text-red-900">• {m}</li>
                  ))}
                </ul>
              )}
              {broker.note && <div className="text-[9px] text-amber-700 mt-1 italic">{broker.note}</div>}
            </div>
            <div className="rounded border border-red-200 bg-red-50 p-2">
              <div className="font-bold text-red-800 mb-1">👤 Consumer</div>
              {consumer.processed.length === 0 ? (
                <div className="text-red-700 italic">—</div>
              ) : (
                <ul className="space-y-0.5">
                  {consumer.processed.map((m, i) => {
                    const isDup = consumer.duplicated.includes(m.split(' ')[0]);
                    return (
                      <li key={i} className={`font-mono ${isDup ? 'text-amber-700' : 'text-red-900'}`}>• {m}</li>
                    );
                  })}
                </ul>
              )}
              {consumer.lost.length > 0 && (
                <div className="text-[9px] text-red-700 mt-1">손실: {consumer.lost.join(', ')}</div>
              )}
              {consumer.duplicated.length > 0 && (
                <div className="text-[9px] text-amber-700 mt-1">중복: {consumer.duplicated.join(', ')}</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 비교 표 박스 (Step 3)
    // ─────────────────────────────────────────────────────
    function CompareBox({ compare }) {
      if (!compare) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-400 bg-white overflow-hidden">
          <div className="bg-red-100 text-red-900 px-3 py-1 text-xs font-bold">📊 At-most-once vs At-least-once</div>
          <table className="w-full border-collapse text-xs">
            <thead>
              <tr className="bg-red-50">
                <th className="text-left py-1 px-2 border border-red-200 text-red-800">지표</th>
                <th className="text-left py-1 px-2 border border-red-200 text-orange-800">At-most-once</th>
                <th className="text-left py-1 px-2 border border-red-200 text-blue-800">At-least-once</th>
              </tr>
            </thead>
            <tbody>
              {compare.rows.map((r, i) => (
                <tr key={i}>
                  <td className="py-1 px-2 border border-red-100 font-bold text-red-800">{r.metric}</td>
                  <td className="py-1 px-2 border border-red-100 font-mono text-orange-900">{r.amo}</td>
                  <td className="py-1 px-2 border border-red-100 font-mono text-blue-900">{r.alo}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // EOS 해결 박스 (Step 4)
    // ─────────────────────────────────────────────────────
    function EosBox({ eos }) {
      if (!eos) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-red-500 bg-gradient-to-br from-red-50 to-amber-50 p-3">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🎯</span>
            <span className="text-base font-bold text-red-800">{eos.title}</span>
          </div>
          <ul className="space-y-1">
            {eos.features.map((f, i) => (
              <li key={i} className="text-xs text-red-900 flex gap-2">
                <span className="text-red-600 mt-0.5">★</span>
                <span>{f}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 도메인 매핑 박스 (Step 5)
    // ─────────────────────────────────────────────────────
    function ChooseBox({ choose }) {
      if (!choose) return null;
      const LEVEL_COLOR = {
        'At-most-once': 'bg-orange-100 text-orange-800 border-orange-300',
        'At-least-once + 멱등': 'bg-blue-100 text-blue-800 border-blue-300',
        'Exactly-once': 'bg-red-100 text-red-800 border-red-400',
      };
      return (
        <div className="mt-3 rounded-xl border-2 border-red-500 bg-white overflow-hidden">
          <div className="bg-gradient-to-r from-red-500 to-amber-500 text-white px-3 py-1.5 text-xs font-bold flex items-center gap-2">
            <span>🧭</span>
            <span>{choose.title}</span>
          </div>
          <table className="w-full border-collapse text-xs">
            <thead>
              <tr className="bg-red-50">
                <th className="text-left py-1 px-2 border border-red-200 text-red-800">도메인</th>
                <th className="text-left py-1 px-2 border border-red-200 text-red-800">보장 수준</th>
                <th className="text-left py-1 px-2 border border-red-200 text-red-800">이유</th>
              </tr>
            </thead>
            <tbody>
              {choose.rows.map((r, i) => (
                <tr key={i}>
                  <td className="py-1 px-2 border border-red-100 text-red-900 font-medium">{r.domain}</td>
                  <td className="py-1 px-2 border border-red-100">
                    <span className={`inline-block text-[10px] px-2 py-0.5 rounded border ${LEVEL_COLOR[r.level] || 'bg-slate-100 border-slate-300'}`}>{r.level}</span>
                  </td>
                  <td className="py-1 px-2 border border-red-100 text-red-800 text-[11px]">{r.why}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-red-50',  border: 'border-red-300',  text: 'text-red-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — yellow 톤
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-red-200 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-red-800">메시지 전달 보장 흐름</h3>
            <span className="text-[10px] text-slate-500">손실 / 중복 / 정확히 한 번</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <FlowBox producer={state.producer} broker={state.broker} consumer={state.consumer} />
          <div className="mt-3 flex-1 overflow-auto">
            <div className="text-[10px] font-bold text-red-700 mb-1.5">메시지 단위 흐름</div>
            <ul className="space-y-1.5">
              {state.timeline.map((t) => <TimelineItem key={t.id} item={t} />)}
            </ul>
          </div>
          <CompareBox compare={state.compare} />
          <EosBox eos={state.eosBox} />
          <ChooseBox choose={state.chooseBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-red-500/15 border-l-2 border-red-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-red-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-red-600 text-white font-bold">K</span>
              <div>
                <h1 className="text-2xl font-bold text-red-900">III-1-1. At-most-once / At-least-once / Exactly-once</h1>
                <p className="text-sm text-red-800/80">손실 / 중복 / 정확히 한 번 — 3가지 메시지 전달 보장 수준과 도메인별 선택</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-red-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-red-600' : 'bg-red-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-red-700 text-red-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-red-100/90 leading-relaxed">{step.desc}</p>
              <div className="mt-2 text-[11px] text-red-200/90 italic">{step.actor}</div>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-red-300 bg-white text-red-700 hover:bg-red-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-red-300 bg-white text-red-700 hover:bg-red-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-red-700 text-white' : 'bg-red-600 text-white hover:bg-red-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-red-300 bg-white text-red-700 hover:bg-red-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-red-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-red-400 bg-white px-4 py-3 text-sm text-red-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Kafka 의 메시지 전달 보장은 도메인 요구사항이 결정한다. 메트릭/로그는 at-most-once, 대부분의 비즈니스 이벤트는 at-least-once + 멱등 컨슈머, 결제/정산처럼 정확성이 결정적일 때만 exactly-once 를 쓴다. 의심되면 ALO 부터 시작하라 — 진짜 필요할 때만 EOS, 메트릭만 AMO 가 베스트 프랙티스다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kafka', 'DeliverySemantics', 'AtMostOnce', 'AtLeastOnce', 'ExactlyOnce', 'Idempotence', 'Transactions', 'Acks', 'Retries', 'Offset', 'ReadCommitted'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-red-100 text-red-800 border border-red-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-red-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
