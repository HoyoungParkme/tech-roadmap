  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Kafka II-1-1 — Topic / Partition / Offset
    학습 목표: Kafka 의 3대 핵심 개념(Topic / Partition / Offset)을 단계별로 시각화한다.
              ① Topic = 메시지 분류 카테고리
              ② Partition = topic 내 병렬 처리 단위
              ③ Offset = 파티션 내 메시지 순서 번호
              ④ 키 기반 파티셔닝 (같은 key → 같은 partition)
              ⑤ 파티션 수 결정 가이드 (처리량 / consumer 수)
    패턴: fastapi v1 — 좌(LiveDataPane: Topic 박스 + Partition 박스 + Consumer Group) / 우(VSCode CodeViewer 5탭)
    색상: yellow (kafka 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    //   topic         : Topic 이름
    //   partitions    : 파티션별 메시지 배열 [{offset, key, value, highlight}]
    //   partitionInfo : 파티션 라벨/설명 (강조 여부 등)
    //   consumers     : Consumer Group 의 consumer 목록
    //   focus         : Step 별 강조 영역 ('topic' | 'partition' | 'offset' | 'key' | 'scale')
    //   alert         : 핵심 메시지
    //   code          : 우측 CodeViewer 파일
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang: 'bash', filename: 'topic.sh', lines: [
            '# Step 1. Topic 생성과 조회 — kafka-topics.sh',
            '',
            '# ── Topic 이란? ─────────────────────────────',
            '# - 메시지를 분류하는 "카테고리" 또는 "이름표"',
            '# - DB 의 테이블, 파일 시스템의 폴더와 비슷',
            '# - 예: orders, payments, user-signups, clicks',
            '',
            '# ── Topic 생성 ─────────────────────────────',
            'kafka-topics.sh --create \\',
            '  --bootstrap-server localhost:9092 \\',
            '  --topic orders \\',
            '  --partitions 3 \\',
            '  --replication-factor 1',
            '',
            '# → Created topic orders.',
            '',
            '# ── Topic 목록 조회 ─────────────────────────',
            'kafka-topics.sh --list \\',
            '  --bootstrap-server localhost:9092',
            '',
            '# → orders',
            '# → payments',
            '# → user-signups',
            '',
            '# ── Topic 상세 조회 ─────────────────────────',
            'kafka-topics.sh --describe \\',
            '  --bootstrap-server localhost:9092 \\',
            '  --topic orders',
            '',
            '# Topic: orders  PartitionCount: 3  ReplicationFactor: 1',
            '#   Partition: 0  Leader: 1  Replicas: 1  Isr: 1',
            '#   Partition: 1  Leader: 1  Replicas: 1  Isr: 1',
            '#   Partition: 2  Leader: 1  Replicas: 1  Isr: 1',
            '',
            '# ── 정리 ─────────────────────────────────────',
            '# - Producer 는 "어느 토픽에 쓸지" 만 지정',
            '# - Consumer 는 "어느 토픽을 읽을지" 만 지정',
            '# - 토픽 이름이 곧 "이 메시지가 무엇인지" 알려준다',
            '',
            '# → Step 2: 그런데 토픽 안에 "Partition" 이 있다?',
      ]},
      s2: {lang: 'markdown', filename: 'partition.md', lines: [
            '# Step 2. Partition — Topic 내부의 병렬 처리 단위',
            '',
            '## 한 줄 요약',
            '- Partition 은 메시지를 실제로 저장하는 "append-only 로그 파일"',
            '- Topic 하나는 여러 Partition 으로 쪼개진다',
            '- Kafka 의 병렬성과 확장성의 근원',
            '',
            '## 구조',
            '```',
            'Topic: orders',
            ' ├── Partition 0  [msg, msg, msg, ...]   ← 로그 파일 1',
            ' ├── Partition 1  [msg, msg, ...]        ← 로그 파일 2',
            ' └── Partition 2  [msg, msg, msg, msg]   ← 로그 파일 3',
            '```',
            '',
            '## 왜 쪼개는가?',
            '1. **병렬성**: 여러 consumer 가 partition 별로 동시 처리',
            '2. **확장성**: 메시지 양이 늘어도 partition 추가로 대응',
            '3. **분산 저장**: 여러 broker 에 partition 을 나누어 배치',
            '',
            '## 중요한 보장',
            '- **partition 내부**: 메시지 순서 보장 (입력 순서대로 저장됨)',
            '- **partition 간**: 순서 보장 안 됨 (서로 독립적)',
            '',
            '## 예시 — orders 토픽',

        code: {...CODE.s5, highlight: [61,62,63,64,65]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Partition 박스 (메시지 cell 가로로 누적)
    // ─────────────────────────────────────────────────────
    function MessageCell({ msg, focus }) {
      const showKey = focus === 'key';
      const showOffset = focus === 'offset' || msg.hi;
      const keyHi = msg.keyHi && focus === 'key';
      return (
        <div className={`flex flex-col items-center min-w-[56px] rounded border-2 ${msg.hi ? 'border-red-500 bg-red-100' : 'border-red-300 bg-white'} px-1.5 py-1`}>
          {showOffset && (
            <span className="text-[9px] text-red-700 font-bold leading-none mb-0.5">off={msg.offset}</span>
          )}
          {showKey && msg.key && (
            <span className={`text-[10px] font-mono leading-tight ${keyHi ? 'text-amber-900 font-bold bg-amber-200 rounded px-1' : 'text-red-800'}`}>
              {msg.key}
            </span>
          )}
          <span className="text-[10px] font-mono text-slate-700 leading-tight">{msg.value}</span>
          {!showOffset && (
            <span className="text-[9px] text-slate-400 leading-none mt-0.5">#{msg.offset}</span>
          )}
        </div>
      );
    }

    function PartitionBox({ partition, focus, highlight }) {
      return (
        <div className={`rounded-lg border-2 ${highlight ? 'border-red-500 bg-red-50' : 'border-red-300 bg-white'} overflow-hidden`}>
          <div className={`px-2 py-1 text-[10px] font-bold ${highlight ? 'bg-red-500 text-white' : 'bg-red-200 text-red-900'}`}>
            {partition.label}
            <span className="ml-2 text-[9px] font-mono opacity-80">(append →)</span>
          </div>
          <div className="p-2 flex gap-1.5 overflow-x-auto items-stretch">
            {partition.messages.length === 0 && (
              <div className="text-[10px] text-slate-400 italic px-2 py-1">empty</div>
            )}
            {partition.messages.map((m) => (
              <MessageCell key={m.offset} msg={m} focus={focus} />
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Topic 박스 (Partition 들을 감싼 상위 컨테이너)
    // ─────────────────────────────────────────────────────
    function TopicBox({ topic, partitions, focus, partitionInfo }) {
      const topicHi = focus === 'topic';
      return (
        <div className={`rounded-xl border-2 ${topicHi ? 'border-red-600 bg-red-50 shadow-lg' : 'border-red-300 bg-white'} overflow-hidden`}>
          <div className={`px-3 py-2 flex items-center gap-2 ${topicHi ? 'bg-red-500 text-white' : 'bg-red-200 text-red-900'}`}>
            <span className="text-sm">📦</span>
            <span className="text-xs font-bold">Topic:</span>
            <span className="text-sm font-mono font-bold">{topic}</span>
            <span className="ml-auto text-[10px] opacity-80">partitions: {partitions.length}</span>
          </div>
          <div className="p-2.5 space-y-2">
            {partitions.map((p, i) => (
              <PartitionBox
                key={i}
                partition={p}
                focus={focus}
                highlight={partitionInfo?.highlight || false}
              />
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Consumer Group 박스
    // ─────────────────────────────────────────────────────
    function ConsumerGroupBox({ consumers }) {
      if (!consumers || consumers.length === 0) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
          <div className="text-xs font-bold text-amber-800 mb-2 flex items-center gap-1">
            <span>👥</span>
            <span>Consumer Group: order-processor</span>
          </div>
          <div className="flex flex-wrap gap-2">
            {consumers.map((c) => (
              <div key={c.id} className="rounded border border-amber-400 bg-white px-2 py-1 text-[10px]">
                <span className="font-bold text-amber-900">{c.id}</span>
                <span className="ml-2 text-slate-600 font-mono">→ {c.reading}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 파티션 수 가이드 박스 (Step 5)
    // ─────────────────────────────────────────────────────
    function GuideBox({ guide }) {
      if (!guide) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-red-600 bg-gradient-to-br from-red-50 to-amber-50 p-3">
          <div className="flex items-center gap-2 mb-2">
            <span className="text-xl">🧭</span>
            <span className="text-sm font-bold text-red-900">{guide.title}</span>
          </div>
          <ul className="space-y-1.5">
            {guide.features.map((f, i) => (
              <li key={i} className="text-xs text-red-900 flex gap-2">
                <span className="text-red-600 mt-0.5">✓</span>
                <span>{f}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-red-50',  border: 'border-red-300',  text: 'text-red-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — yellow 톤
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-red-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-red-900">Kafka Topic 내부 구조</h3>
            <span className="text-[10px] text-slate-500">
              {state.focus === 'topic' && '🟡 Topic 강조'}
              {state.focus === 'partition' && '🟡 Partition 강조'}
              {state.focus === 'offset' && '🟡 Offset 강조'}
              {state.focus === 'key' && '🟡 Key 매핑 강조'}
              {state.focus === 'scale' && '🟡 파티션 수 가이드'}
            </span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <TopicBox
            topic={state.topic}
            partitions={state.partitions}
            focus={state.focus}
            partitionInfo={state.partitionInfo}
          />
          <ConsumerGroupBox consumers={state.consumers} />
          <GuideBox guide={state.guideBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-red-500/15 border-l-2 border-red-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-red-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-red-500 text-white font-bold">K</span>
              <div>
                <h1 className="text-2xl font-bold text-red-900">II-1-1. Topic / Partition / Offset</h1>
                <p className="text-sm text-red-800/80">Kafka 의 3대 핵심 개념 — 메시지를 분류하고, 쪼개고, 순서를 매기는 방법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-red-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-red-500' : 'bg-red-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-red-600 text-red-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-red-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-red-400 bg-white text-red-800 hover:bg-red-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-red-400 bg-white text-red-800 hover:bg-red-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-red-700 text-white' : 'bg-red-500 text-white hover:bg-red-600'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-red-400 bg-white text-red-800 hover:bg-red-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-red-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-red-500 bg-white px-4 py-3 text-sm text-red-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Kafka 의 3대 개념 — <b>Topic</b>(메시지 분류 이름표) / <b>Partition</b>(topic 내 병렬 처리 단위) / <b>Offset</b>(partition 내 순서 번호) — 은 모두 메시지의 "어디에 / 어떤 순서로" 를 결정한다.
                Key 기반 파티셔닝으로 "같은 단위의 순서 보장" 을 설계할 수 있고, 파티션 수는 처리량과 consumer 수의 균형으로 결정한다. 다음 챕터에서는 Producer 와 Consumer 가 이 구조 위에서 실제로 어떻게 동작하는지 살펴본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Kafka', 'Topic', 'Partition', 'Offset', 'KeyPartitioning', 'ConsumerGroup', 'OrderingGuarantee', 'Scalability'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-red-100 text-red-800 border border-red-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-red-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
