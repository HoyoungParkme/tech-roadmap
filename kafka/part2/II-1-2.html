  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <script>window.LESSON = {"topic": "kafka", "topicName": "Apache Kafka", "topicHref": "../index.html", "id": "II-1-2", "title": "Producer — acks 옵션", "sub": "Producer 생성 → send/직렬화 → acks=0 / 1 / all 트레이드오프", "path": "part2/II-1-2.html", "prev": {"id": "II-1-1", "title": "Topic / Partition / Offset", "href": "../part2/II-1-1.html"}, "next": {"id": "II-2-1", "title": "Consumer Group — 분산 소비", "href": "../part2/II-2-1.html"}, "wrap": "Producer는 단순 송신 함수가 아니라 \"버퍼 + Sender 스레드 + 정책\"을 가진 작은 송신 엔진이다. acks=0 / 1 / all은 모두 \"속도 vs 안전성\" 트레이드오프 위의 다른 점이며 — 메트릭은 0, 일반 이벤트는 1, 결제/주문은 all이라는 단순한 원칙으로 시작하면 된다. 다음 챕터에서는 Consumer가 이 메시지를 어떻게 받아 처리하는지 살펴본다."};</script>

  <!--
    Kafka II-1-2 — Producer 발행 흐름과 acks
    학습 목표: ① Producer 객체 생성 ② send() + serializer ③ acks=0 (불-앤-포겟)
              ④ acks=1 (Leader만) ⑤ acks=all (모든 ISR 확인)
              5단계로 "속도 vs 안전성" 트레이드오프를 시각화한다.
    패턴: fastapi v1 — 좌(LiveDataPane: Producer → Leader → ISR 흐름) / 우(CodeViewer 5탭)
    색상: yellow (kafka 도메인)
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — Producer 발행 흐름과 acks 옵션
    //   producer    : Producer 박스 상태 (ready / sending / done)
    //   leader      : Leader 브로커 상태 (idle / receiving / written / ack)
    //   followers   : ISR Follower 브로커 상태 배열
    //   flow        : Producer → Leader → Follower 화살표 활성 단계
    //   speed       : 응답 속도 (★개수)
    //   safety      : 안전성 (★개수)
    //   alert       : 핵심 경고/설명 박스
    //   code        : 우측 CodeViewer 파일
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang: 'python', filename: 'create.py', lines: [
            '"""KafkaProducer 생성 — 발행 흐름의 시작점.',
            '경로: kafka/part2/II-1-2/create.py',
            '주요 의존성: kafka-python (kafka.KafkaProducer)',
            '"""',
            'from kafka import KafkaProducer',
            'import json',
            '',
            '',
            'def create_producer() -> KafkaProducer:',
            '    """Producer 인스턴스를 생성한다 — 버퍼+Sender 스레드 시작."""',
            '    return KafkaProducer(',
            '        # 1) 부트스트랩 브로커 주소',
            '        bootstrap_servers=["broker:9092"],',
            '        # 2) 직렬화 (Step 2)',
            '        key_serializer=lambda k: k.encode("utf-8") if k else None,',
            '        value_serializer=lambda v: json.dumps(v).encode("utf-8"),',
            '        # 3) acks 정책 (Step 3~5, 생략하면 "all")',
            '        acks=1,',
            '        # 4) 재시도/타임아웃',
            '        retries=3,',
            '        request_timeout_ms=30_000,',
            '        # 5) 배치/지연 — 처리량 튜닝 포인트',
            '        linger_ms=5,',
            '        batch_size=16_384,',
            '    )',
            '',
            '',
            'if __name__ == "__main__":',
            '    producer = create_producer()',
            '    print("ready:", producer.config["bootstrap_servers"])',
            '    producer.close()',
      ]},
      s2: {lang: 'python', filename: 'send.py', lines: [
            '"""send() + 직렬화 — Producer 표준 발행 흐름.',
            '경로: kafka/part2/II-1-2/send.py',
            '"""',
            'from create import create_producer',
            '',
            '',
            'def send_order(producer, order: dict) -> None:',
            '    """주문 이벤트 1건을 orders 토픽으로 전송한다.',

        producer: {"state":"sending","label":"Producer (idempotent)","detail":"retries=10 / max_in_flight=5"},
        leader: {"state":"receiving","label":"Broker Leader","detail":"topic=payments / partition=0"},
        followers: [{"state":"idle","label":"ISR Follower 1"},{"state":"idle","label":"ISR Follower 2"}],
        flow: {"producerToLeader":true,"leaderToFollowers":false,"ackFromLeader":false,"ackFromFollowers":false},
        speed: 2,
        safety: 5,
        alert: {"tone":"info","text":"idempotence는 in-flight 5 이하에서만 켤 수 있다. 그 범위에서는 재시도해도 순서가 지켜진다."},
        code: {...CODE.s5, highlight: [26,27,28,29,30]},
      },
      { ...S5,
        beat: { label: "결제 이벤트 발행", at: "acks-all.py L40–44",
                caption: "send()가 나가면 Leader가 쓰고 두 Follower가 동시에 복제를 시작한다.",
                changes: [{"mark":"new","text":"Follower 1, 2 복제 시작"},{"mark":"changed","text":"Leader는 복제 완료를 대기"}] },
        actor: "🔒 publish_payment() 전송",
        producer: {"state":"sending","label":"Producer (모든 ISR ack 대기)","detail":"send → wait ALL"},
        leader: {"state":"receiving","label":"Broker Leader","detail":"로컬 기록 + Follower 복제 대기"},
        followers: [{"state":"receiving","label":"ISR Follower 1","detail":"복제 중"},{"state":"receiving","label":"ISR Follower 2","detail":"복제 중"}],
        flow: {"producerToLeader":true,"leaderToFollowers":true,"ackFromLeader":false,"ackFromFollowers":false},
        speed: 2,
        safety: 5,
        alert: {"tone":"info","text":"복제 지연이 곧 전송 지연이다 — 안전성의 값은 시간으로 치른다."},
        code: {...CODE.s5, highlight: [40,41,42,43,44]},
      },
      { ...S5,
        beat: { label: "전원 ack 수신", at: "acks-all.py L45–47",
                caption: "두 Follower의 ack가 Leader에 모이고, 그제야 Producer가 성공을 돌려받는다.",
                changes: [{"mark":"new","text":"follower ack → leader ack"},{"mark":"read","text":"durable ok: partition/offset"}] },
        actor: "🔒 acks=all — Leader + ISR 모두 확인",
        producer: {"state":"done","label":"Producer (모든 ISR ack 수신)","detail":"send → wait ALL → ack → next"},
        leader: {"state":"ack","label":"Broker Leader","detail":"로컬 기록 + Follower 복제 대기"},
        followers: [{"state":"ack","label":"ISR Follower 1","detail":"✓ 복제 완료 + ack"},{"state":"ack","label":"ISR Follower 2","detail":"✓ 복제 완료 + ack"}],
        flow: {"producerToLeader":true,"leaderToFollowers":true,"ackFromLeader":true,"ackFromFollowers":true},
        speed: 2,
        safety: 5,
        alert: {"tone":"good","text":"이 시점부터는 Leader가 죽어도 Follower가 새 Leader가 되어 메시지가 남는다."},
        code: {...CODE.s5, highlight: [45,46,47]},
      },
      { ...S5,
        beat: { label: "ISR이 부족하면 거부", at: "acks-all.py L48–51",
                caption: "Follower 둘이 모두 ISR에서 빠져 Leader 혼자 남으면 min.insync.replicas=2를 못 채워 NotEnoughReplicasException으로 막는다.",
                changes: [{"mark":"gone","text":"Follower 1, 2 모두 ISR 탈락"},{"mark":"new","text":"NotEnoughReplicasException"}] },
        actor: "🔒 ISR 부족 → 발행 거부",
        producer: {"state":"sending","label":"Producer (발행 거부됨)","detail":"KafkaError → raise"},
        leader: {"state":"receiving","label":"Broker Leader","detail":"ISR 부족 — 기록 거부"},
        followers: [{"state":"idle","label":"ISR Follower 1","detail":"✗ ISR 에서 탈락"},{"state":"idle","label":"ISR Follower 2","detail":"✗ ISR 에서 탈락"}],
        flow: {"producerToLeader":true,"leaderToFollowers":true,"ackFromLeader":false,"ackFromFollowers":false},
        speed: 2,
        safety: 5,
        alert: {"tone":"danger","text":"조용히 잃는 대신 시끄럽게 실패한다 — 결제 데이터에서는 이게 옳은 동작이다."},
        code: {...CODE.s5, highlight: [48,49,50,51]},
      },
      { ...S5,
        beat: { label: "느린 대신 안 잃는다", at: "acks-all.py L67–70",
                caption: "가장 느리지만 ISR이 하나라도 살아 있으면 잃지 않고, 재시도 중복도 없다. 결제·주문·정산의 기본 선택이다.",
                changes: [{"mark":"read","text":"적합: 결제 / 주문 / 정산"},{"mark":"new","text":"min.insync.replicas=2 권장"}] },
        actor: "🔒 acks=all — Leader + ISR 모두 확인",
        producer: {"state":"done","label":"Producer (모든 ISR ack 수신)","detail":"send → wait ALL → ack → next"},
        leader: {"state":"ack","label":"Broker Leader","detail":"로컬 기록 + Follower 복제 대기"},
        followers: [{"state":"ack","label":"ISR Follower 1","detail":"✓ 복제 완료 + ack"},{"state":"ack","label":"ISR Follower 2","detail":"✓ 복제 완료 + ack"}],
        flow: {"producerToLeader":true,"leaderToFollowers":true,"ackFromLeader":true,"ackFromFollowers":true},
        speed: 2,
        safety: 5,
        safeBox: {"title":"acks=all이 만드는 안전성","features":["Leader + min.insync.replicas 만큼의 Follower 가 모두 기록 완료해야 성공","Leader 가 죽어도 Follower 가 새 Leader 가 되어 메시지 보존","enable.idempotence=True 와 함께 쓰면 재시도해도 중복 없음","NotEnoughReplicasException 으로 \"복제본 부족\" 상태에서는 발행을 거부 (조용한 손실 방지)","결제/주문/정산 같은 \"1건도 잃으면 안 되는\" 데이터의 기본 선택"]},
        alert: {"tone":"good","text":"acks=all + idempotence → 가장 안전한 모드. 속도는 느리지만 \"1건도 잃으면 안 되는\" 데이터의 표준."},
        code: {...CODE.s5, highlight: [67,68,69,70]},
      },
    ];

    // ── RefPanel ── 그림에 다 담지 못한 표·목록 (anim/lesson.jsx 가 "표·정리 보기" 상자에 넣는다)
    function RefPanel({ step, stepIdx }) {
      const sn = Number((step.title.match(/^Step (\d+)/) || [])[1]);
      if (sn === 1) return (<div>
        <h4>이 예제 값과 기본값</h4>
        <table>
          <thead><tr><th>설정</th><th>이 예제</th><th>Java 기본 (Kafka 4.0 문서)</th></tr></thead>
          <tbody>
            <tr><td className="font-mono">acks</td><td className="font-mono">1</td><td className="font-mono">all (3.0 전에는 1)</td></tr>
            <tr><td className="font-mono">enable.idempotence</td><td>적지 않음</td><td className="font-mono">true</td></tr>
            <tr><td className="font-mono">retries</td><td className="font-mono">3</td><td className="font-mono">2147483647</td></tr>
            <tr><td className="font-mono">request.timeout.ms</td><td className="font-mono">30000</td><td className="font-mono">30000</td></tr>
            <tr><td className="font-mono">linger.ms</td><td className="font-mono">5</td><td className="font-mono">5 (3.9 까지는 0)</td></tr>
            <tr><td className="font-mono">batch.size</td><td className="font-mono">16384</td><td className="font-mono">16384</td></tr>
          </tbody>
        </table>
        <p className="mt-1">acks를 1로 적으면서 idempotence를 따로 켜지 않으면 idempotence는 조용히 꺼진다.</p>
      </div>);
      if (sn >= 3) return (<div>
        <h4>acks 세 가지 비교</h4>
        <table>
          <thead><tr><th>acks</th><th>기다리는 것</th><th>잃을 수 있는 때</th><th>맞는 데이터</th></tr></thead>
          <tbody>
            <tr><td className="font-mono">0</td><td>아무것도 (offset은 -1)</td><td>Leader 장애, 네트워크 단절, 모른 채로</td><td>메트릭, debug 로그, 클릭스트림</td></tr>
            <tr><td className="font-mono">1</td><td>Leader의 로컬 기록</td><td>ack 직후 복제 전에 Leader가 죽을 때</td><td>사용자 행동 이벤트</td></tr>
            <tr><td className="font-mono">all</td><td>지금 ISR 전부의 기록</td><td>ISR이 하나라도 살아 있으면 잃지 않음</td><td>결제, 주문, 정산</td></tr>
          </tbody>
        </table>
        {step.safeBox && (<div><h4>{step.safeBox.title}</h4><ul>{step.safeBox.features.map((f) => <li key={f}>{f}</li>)}</ul></div>)}
      </div>);
      return null;
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const isHi = highlightSet.has(i + 1);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-red-500/15 border-l-2 border-red-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{i + 1}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
