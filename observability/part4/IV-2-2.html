  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <style id="trn-note-skin">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    IV-2-2. 분산 시스템 디버깅 흐름
    학습 목표: Alert → Isolate → Logs → Root 4단계로 5xx 알람을 추적하는 실전 루틴 체득
    핵심 비유: "병원 내원 기록 역추적" — 활력(Metrics) → 진료기록(Logs) → 동선(Traces)
    패턴: fastapi 표준 — 좌(LiveDataPane: 디버깅 흐름 시각화) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 5개 서비스 (Step 2에서 cart-service만 빨강)
    const SERVICES = [
      { id: 'gateway',  name: 'gateway',       icon: '🌐' },
      { id: 'cart',     name: 'cart-service',  icon: '🛒' },
      { id: 'product',  name: 'product-svc',   icon: '📦' },
      { id: 'payment',  name: 'payment-svc',   icon: '💳' },
      { id: 'user',     name: 'user-service',  icon: '👤' },
    ];

    // 4 STEPS — 디버깅 흐름 (시간순)
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      alertRule: {lang: "yaml", filename: "alertmanager-rule.yml — 5xx 급증 룰", lines: [
        "# Prometheus alert rule — 5xx 급증 감지",
        "groups:",
        "  - name: checkout_slo",
        "    interval: 30s",
        "    rules:",
        "      - alert: CheckoutErrorBudgetBurn",
        "        expr: |",
        "          sum(rate(http_requests_total{",
        "            job=\"checkout\", status=~\"5..\"",
        "          }[5m]))",
        "          /",
        "          sum(rate(http_requests_total{",
        "            job=\"checkout\"",
        "          }[5m])) > 0.05",
        "        for: 2m",
        "        labels:",
        "          severity: critical",
        "          team: payments-oncall",
        "        annotations:",
        "          summary: \"5xx error rate > 5% for 2m\"",
        "          runbook: \"https://wiki/runbook/checkout-5xx\"",
        "",
        "# PagerDuty receiver — Critical 발화 시 전화/SMS",
        "# 03:14 KST — INC-9921 fired",
        "# $ pd ack --incident=INC-9921 --comment \"investigating\"",
      ]},
      explore: {lang: "shell", filename: "grafana-explore.sh — 서비스별 에러율 PromQL", lines: [
        "# Grafana → Explore → Prometheus 데이터소스",
        "# 5개 서비스 동시 에러율 (RED method - Errors)",
        "",
        "sum by (service) (",
        "  rate(http_requests_total{",
        "    cluster=\"prod-asia\",",
        "    status=~\"5..\"",
        "  }[1m])",
        ")",
        "/",
        "sum by (service) (",
        "  rate(http_requests_total{",
        "    cluster=\"prod-asia\"",
        "  }[1m])",
        ")",
        "",
        "# 결과 (분당 평균):",
        "# gateway      : 0.02%  ✓ 정상",
        "# product-svc  : 0.05%  ✓ 정상",
        "# payment-svc  : 0.08%  ✓ 정상",
        "# user-service : 0.01%  ✓ 정상",
        "# cart-service : 18.4%  ✗ 폭발  ← 범인",
        "",
        "# kubectl로 영향 범위 추가 확인",
        "$ kubectl get pods -n prod -l app=cart-service",
        "$ kubectl top pods -n prod -l app=cart-service",
        "# → CPU/MEM 정상. 코드 또는 의존성 문제로 좁힘",
      ]},
      lokiQuery: {lang: "shell", filename: "loki-query.sh — cart-service 5xx 로그 검색", lines: [
        "# Grafana → Explore → Loki",
        "# cart-service의 5xx 로그를 LogQL로 추출",
        "",
        "{app=\"cart-service\", cluster=\"prod-asia\"}",
        "  |~ \"5\\d\\d\"",
        "  | json",
        "  | level=\"ERROR\"",
        "",
        "# 추출된 에러 라인 (JSON 구조화 로그)",
        "{",
        "  \"ts\": \"2026-05-06T03:13:42.187Z\",",
        "  \"level\": \"ERROR\",",
        "  \"service\": \"cart-service\",",
        "  \"endpoint\": \"GET /cart/{user_id}\",",
        "  \"status\": 500,",
        "  \"trace_id\": \"a3f1c8e2d9b04f7a8e1c2d3b4f5a6c7d\",",
        "  \"span_id\":  \"9b04f7a8e1c2d3b4\",",
        "  \"error\": \"DB connection timeout (waited 5000ms for pool)\",",
        "  \"pool.size\": 20,",
        "  \"pool.in_use\": 20,",
        "  \"pool.waiters\": 47",
        "}",
        "",
        "# 패턴: 같은 메시지가 분당 ~150 라인 반복",
        "# - pool.in_use == pool.size (20/20)",
        "# - waiters 계속 누적 (47 → 81 → ...)",
        "# → connection pool 고갈이 강력한 가설",
        "",
        "# 다음 — trace_id로 Tempo 점프 (Step 4)",

                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🩺</span>
              <span className="text-xs font-bold text-slate-700">디버깅 흐름 (시간순)</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">step {stepIdx + 1}/{STEPS.length} — {step.focus}</span>
          </div>

          {/* 4단계 진행 표시 (Stepper) */}
          <div className="px-4 pt-4">
            <div className="flex items-center justify-between">
              {['alert', 'isolate', 'logs', 'root'].map((k, i) => {
                // beat 로 펼치면 stepIdx 가 4를 넘는다. 지금 단계는 step.focus 로 판정한다.
                const phase = ['alert', 'isolate', 'logs', 'root'].indexOf(step.focus);
                const isDone = i < phase;
                const isActive = i === phase;
                return (
                  <React.Fragment key={k}>
                    <div className="flex flex-col items-center">
                      <div className={`w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold border-2 transition-all ${
                        isActive ? 'bg-red-500 border-red-700 text-white scale-110 shadow-lg shadow-red-500/40 pulse-ring' :
                        isDone   ? 'bg-red-200 border-red-400 text-red-800' :
                                   'bg-slate-100 border-slate-300 text-slate-400'
                      }`}>
                        {i + 1}
                      </div>
                      <div className={`text-[10px] mt-1 font-bold ${isActive ? 'text-red-700' : isDone ? 'text-red-500' : 'text-slate-400'}`}>
                        {k}
                      </div>
                    </div>
                    {i < 3 && (
                      <div className={`flex-1 h-0.5 mx-1 ${i < phase ? 'bg-red-300' : 'bg-slate-200'}`} />
                    )}
                  </React.Fragment>
                );
              })}
            </div>
          </div>

          {/* 단계별 상세 시각화 */}
          <div className="p-4 min-h-[320px]" key={`live-${stepIdx}`}>
            {step.liveData === 'alertFiring'   && <AlertFiring />}
            {step.liveData === 'serviceMatrix' && <ServiceMatrix />}
            {step.liveData === 'logSearch'     && <LogSearch />}
            {step.liveData === 'rootCause'     && <RootCause />}
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\.\s*/, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // Step 1 — 알람 발화 (빨간 박스 펄스)
    function AlertFiring() {
      return (
        <div className="space-y-3 fade-in">
          <div className="bg-gradient-to-br from-red-600 to-red-700 rounded-lg p-4 border-4 border-red-800 shadow-xl shadow-red-500/40 alert-pulse">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[11px] font-bold text-red-100 tracking-wider">PAGERDUTY · CRITICAL</span>
              <span className="text-[10px] text-red-200 font-mono">03:14 KST</span>
            </div>
            <div className="text-white font-bold text-lg mb-1">🚨 CheckoutErrorBudgetBurn</div>
            <div className="text-red-100 text-xs leading-relaxed">
              5xx error rate <span className="font-mono bg-red-900/50 px-1 rounded">5.0% → 18.4%</span> for 2m
            </div>
            <div className="mt-2 grid grid-cols-2 gap-2 text-[10px]">
              <div className="bg-red-900/40 rounded px-2 py-1">
                <div className="text-red-300">service</div>
                <div className="text-white font-mono">checkout</div>
              </div>
              <div className="bg-red-900/40 rounded px-2 py-1">
                <div className="text-red-300">cluster</div>
                <div className="text-white font-mono">prod-asia</div>
              </div>
            </div>
          </div>
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="bg-slate-50 border border-slate-200 rounded-lg p-2">
              <div className="text-[10px] text-slate-500">5xx (분당)</div>
              <div className="text-base font-bold text-red-600">187</div>
              <div className="text-[10px] text-slate-400">평소 12</div>
            </div>
            <div className="bg-slate-50 border border-slate-200 rounded-lg p-2">
              <div className="text-[10px] text-slate-500">SLO 잔여</div>
              <div className="text-base font-bold text-red-600">12%</div>
              <div className="text-[10px] text-slate-400">budget burn</div>
            </div>
            <div className="bg-slate-50 border border-slate-200 rounded-lg p-2">
              <div className="text-[10px] text-slate-500">notify</div>
              <div className="text-base font-bold text-red-600">📞</div>
              <div className="text-[10px] text-slate-400">on-call</div>
            </div>
          </div>
          <div className="text-[11px] text-slate-500 italic text-center">
            ack → 큰 그림 (RED dashboard) → 범위 좁히기
          </div>
        </div>
      );
    }

    // Step 2 — 5 서비스 중 cart만 빨강
    function ServiceMatrix() {
      return (
        <div className="space-y-3 fade-in">
          <div className="text-[11px] font-bold text-slate-600 mb-1">RED 대시보드 — 5 서비스 동시 비교</div>
          <div className="space-y-2">
            {SERVICES.map((s, i) => {
              const isCart = s.id === 'cart';
              const errRate = isCart ? 18.4 : [0.02, 0, 0.05, 0.08, 0.01][i];
              return (
                <div
                  key={s.id}
                  className={`flex items-center gap-3 p-2.5 rounded-lg border-2 fade-in transition-all ${
                    isCart ? 'bg-red-50 border-red-400 shadow-md shadow-red-500/30 scale-[1.02]'
                           : 'bg-emerald-50 border-emerald-200'
                  }`}
                  style={{ animationDelay: `${i * 100}ms` }}
                >
                  <span className="text-xl">{s.icon}</span>
                  <div className="flex-1">
                    <div className={`text-xs font-bold font-mono ${isCart ? 'text-red-800' : 'text-slate-700'}`}>{s.name}</div>
                    <div className="mt-1 h-2 bg-slate-200 rounded-full overflow-hidden">
                      <div
                        className={`h-full rounded-full grow-bar ${isCart ? 'bg-red-500' : 'bg-emerald-500'}`}
                        style={{
                          '--target-width': `${Math.min(100, isCart ? 92 : errRate * 100)}%`,
                          animationDelay: `${i * 100 + 200}ms`,
                        }}
                      />
                    </div>
                  </div>
                  <div className={`text-right ${isCart ? 'text-red-700' : 'text-emerald-700'}`}>
                    <div className="text-base font-bold font-mono">{errRate.toFixed(2)}%</div>
                    <div className="text-[10px]">{isCart ? '✗ 범인' : '✓ 정상'}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="text-[11px] text-slate-500 italic text-center pt-1">
            범위 좁힘: cart-service 한 곳 → 다음 로그 검색
          </div>
        </div>
      );
    }

    // Step 3 — 로그 검색 → DB connection timeout
    function LogSearch() {
      const lines = [
        { ts: '03:13:42', msg: 'DB connection timeout (waited 5000ms)', err: true },
        { ts: '03:13:43', msg: 'DB connection timeout (waited 5000ms)', err: true },
        { ts: '03:13:44', msg: 'DB connection timeout (waited 5000ms)', err: true },
        { ts: '03:13:45', msg: 'pool.in_use=20/20  waiters=47', err: true },
        { ts: '03:13:46', msg: 'DB connection timeout (waited 5000ms)', err: true },
        { ts: '03:13:47', msg: 'pool.in_use=20/20  waiters=81', err: true },
      ];
      return (
        <div className="space-y-3 fade-in">
          <div className="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
            <div className="bg-slate-800 px-3 py-1.5 flex items-center gap-2 border-b border-slate-700">
              <span className="text-[10px] text-slate-400 font-mono">Loki · {`{app="cart-service"} |~ "5\\d\\d"`}</span>
              <span className="ml-auto text-[10px] text-red-400 font-mono">hit: 187/min</span>
            </div>
            <div className="p-2 space-y-1 max-h-[200px] overflow-auto">
              {lines.map((l, i) => (
                <div
                  key={i}
                  className="flex items-start gap-2 text-[10px] font-mono fade-in"
                  style={{ animationDelay: `${i * 80}ms` }}
                >
                  <span className="text-slate-500 shrink-0">{l.ts}</span>
                  <span className="text-red-500 shrink-0 font-bold">ERROR</span>
                  <span className="text-red-300">{l.msg}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="bg-amber-50 border-2 border-amber-300 rounded-lg p-3">
            <div className="text-[11px] font-bold text-amber-900 mb-1">🔍 패턴 발견</div>
            <div className="text-[11px] text-amber-800 leading-snug">
              <span className="font-mono bg-amber-100 px-1 rounded">pool.in_use=20/20</span> + waiters 누적 (47→81)
              <br />→ <strong>connection pool 고갈</strong> 가설. trace_id로 Tempo 점프.
            </div>
            <div className="mt-2 text-[10px] font-mono text-amber-700 truncate">
              trace_id: a3f1c8e2d9b04f7a8e1c2d3b4f5a6c7d
            </div>
          </div>
        </div>
      );
    }

    // Step 4 — root span 식별 + 해결책
    function RootCause() {
      const spans = [
        { name: 'cart-service GET /cart/123', dur: 5012, depth: 0, root: true },
        { name: 'db.acquire_connection',       dur: 5000, depth: 1, root: true },
        { name: 'pool.wait',                   dur: 5000, depth: 2, root: true },
      ];
      const MAX = 5012;
      return (
        <div className="space-y-3 fade-in">
          <div className="text-[11px] font-bold text-slate-600">Tempo trace tree</div>
          <div className="bg-slate-50 rounded-lg p-3 space-y-1.5 border border-slate-200">
            {spans.map((s, i) => (
              <div key={i} className="flex items-center gap-2 fade-in" style={{ animationDelay: `${i * 150}ms` }}>
                <div className="w-[160px] shrink-0 text-[10px] font-mono text-slate-700 truncate" style={{ paddingLeft: `${s.depth * 12}px` }}>
                  {s.depth > 0 && <span className="text-slate-300 mr-1">└─</span>}
                  <span className={s.root ? 'text-red-700 font-bold' : ''}>{s.name}</span>
                </div>
                <div className="flex-1 relative h-5 bg-white rounded border border-slate-200">
                  <div
                    className="absolute top-0 left-0 h-full rounded bg-red-500 border border-red-700 shadow shadow-red-500/40 grow-bar"
                    style={{
                      '--target-width': `${(s.dur / MAX) * 100}%`,
                      animationDelay: `${i * 150 + 100}ms`,
                    }}
                  >
                    <span className="absolute inset-0 px-1.5 flex items-center text-[9px] font-bold text-red-50">{s.dur}ms</span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="bg-red-50 border-2 border-red-300 rounded-lg p-3">
            <div className="text-[11px] font-bold text-red-900 mb-1">🎯 Root Cause</div>
            <div className="text-[11px] text-red-800 leading-snug">
              <strong>DB connection pool 고갈</strong> — 어제 배포 <span className="font-mono bg-red-100 px-1 rounded">b7c2f1a</span>에서
              with 블록을 빠뜨려 connection leak 발생. pool size=20인데 in-flight 47개로 timeout 5000ms 발화.
            </div>
          </div>

          <div className="bg-emerald-50 border-2 border-emerald-300 rounded-lg p-3">
            <div className="text-[11px] font-bold text-emerald-900 mb-1">✅ 해결</div>
            <div className="text-[11px] text-emerald-800 leading-snug font-mono">
              with pool.acquire() as conn:  # 자동 release
            </div>
            <div className="text-[10px] text-emerald-700 mt-1">
              배포 후 5분 — pool.in_use 20→4, INC-9921 auto-resolve. MTTR 23분.
            </div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
              opacity: 0;
              animation: fadeIn 360ms ease-out forwards;
            }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar {
              width: 0;
              animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards;
            }
            @keyframes alertPulse {
              0%, 100% { box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5); transform: scale(1); }
              50%      { box-shadow: 0 20px 40px -5px rgba(239, 68, 68, 0.9); transform: scale(1.02); }
            }
            .alert-pulse {
              animation: alertPulse 1.6s ease-in-out infinite;
            }
            @keyframes pulseRing {
              0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
              50%      { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            }
            .pulse-ring {
              animation: pulseRing 1.4s ease-in-out infinite;
            }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-red-600 hover:text-red-800 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-2-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-red-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. Observability &gt; Chapter 2. 디버깅 흐름</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">분산 시스템 디버깅 흐름</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                병원 내원 기록 역추적 — <strong>Alert → Isolate → Logs → Root</strong> 4단계.
                <code className="bg-slate-100 px-1 rounded text-xs mx-1">5xx 알람</code>이 떴을 때
                범위를 좁히고 <code className="bg-slate-100 px-1 rounded text-xs">trace_id</code>로 root span을 잡는 실전 루틴.
              </p>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl bg-red-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-red-200">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-red-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-red-50 border-2 border-red-300 text-red-900 text-sm">
                💡 Part IV 완성. 다음(Part V)에서는 <strong>실전 SRE 운영</strong>
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-red-600 text-white hover:bg-red-700 transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./IV-2-1.html" className="text-slate-500 hover:text-slate-700">&larr; IV-2-1</a>
              <a href="../index.html" className="text-red-600 hover:text-red-800 font-medium">허브 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
