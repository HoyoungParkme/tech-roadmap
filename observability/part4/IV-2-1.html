  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!--
    IV-2-1. Jaeger vs Tempo 비교
    학습 목표: 두 trace 백엔드의 검색/비용 트레이드오프 이해
    핵심 비유: "여행 경로 시각화" — Jaeger는 색인 두꺼운 지도책, Tempo는 trace_id로 펼쳐 보는 여권 도장
    구조: 4단계 (Jaeger UI / Tempo Grafana 통합 / 비용 막대 / 의사결정 표)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── STEPS — 좌측 LiveDataPane 시나리오 + 우측 YAML 코드
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:'yaml', filename:'jaeger.yml — ES 백엔드 + 전수 인덱싱', lines:[
        '# Jaeger Operator — production strategy',
        'apiVersion: jaegertracing.io/v1',
        'kind: Jaeger',
        'metadata:',
        '  name: jaeger-prod',
        'spec:',
        '  strategy: production            # collector/query 분리',
        '  storage:',
        '    type: elasticsearch           # 또는 cassandra',
        '    options:',
        '      es:',
        '        server-urls: http://es:9200',
        '        index-prefix: jaeger',
        '        num-shards: 5',
        '        num-replicas: 1',
        '  collector:',
        '    replicas: 3                   # span 수신',
        '  query:',
        '    replicas: 2                   # UI/API',
        '  ingester:',
        '    replicas: 3                   # Kafka → ES 적재',
        '',
        '# 강점',
        '#  - service/operation/tag 모두 인덱싱 → 임의 검색',
        '#  - "tag.http.status_code=500 AND duration>1s" 즉시 조회',
        '#  - 성숙한 UI, OpenTracing/OTel 호환',
        '# 약점',
        '#  - ES 인덱스가 원본 trace의 2~3배',
        '#  - JVM/샤딩/롤오버 운영 부담',
      ]},
      s2: {lang:'yaml', filename:'tempo.yml — S3 백엔드 + trace_id lookup', lines:[
        '# tempo-config.yaml',
        'server:',
        '  http_listen_port: 3200',
        '',
        'distributor:',
        '  receivers:',
        '    otlp:',
        '      protocols:',
        '        grpc:                       # OTel collector → tempo',
        '        http:',
        '',
        'ingester:',
        '  trace_idle_period: 10s',
        '  max_block_duration: 5m',
        '',
        'storage:',
        '  trace:',
        '    backend: s3                     # object storage (저렴)',
        '    s3:',
        '      bucket: tempo-traces',
        '      endpoint: s3.us-east-1.amazonaws.com',
        '    wal:',
        '      path: /var/tempo/wal',
        '',
        '# 사용 패턴 — 항상 "다른 신호에서 점프"',
        '#  1) Prometheus exemplar 점 클릭 → trace_id 전달',
        '#  2) Loki derived field로 trace_id 정규식 매칭 → 클릭 점프',
        '#',
        '# 강점: 인덱스 거의 없음, S3 비용만, Grafana 통합 자연스러움',
        '# 약점: 임의 tag 검색 약함 (TraceQL 보강 중)',
      ]},
      s3: {lang:'yaml', filename:'cost-compare.yml — 1TB 원본 / 30일 보관', lines:[
        '# 같은 1TB 원본 trace, 30일 보관 가정',
        'compare:',
        '  raw_trace: 1.0 TB',
        '',
        '  jaeger_es:',
        '    inverted_index: 1.0 TB        # 모든 tag 인덱싱',
        '    replica_x1:     1.0 TB        # ES replica',
        '    compression:    none          # 거의 없음',
        '    total_disk:     ~3.0 TB       # 5x 배율',
        '    storage_cost:   ~$300 / month # EBS gp3',
        '    compute:        JVM heap 64GB+',
        '    ops_load:       ES 샤딩/롤오버',
        '',
        '  tempo_s3:',
        '    inverted_index: 0             # trace_id만',
        '    replica:        S3 다중 AZ 기본',
        '    compression:    snappy / zstd',
        '    total_disk:     ~0.3 TB       # 0.5x 미만',
        '    storage_cost:   ~$7 / month   # S3 Standard',
        '    compute:        Go 4~8GB',
        '    ops_load:       거의 무인',
        '',
        '# 핵심 트레이드오프',
        '#  - Jaeger: "비싸지만 무엇이든 검색 가능"',
        '#  - Tempo : "싸지만 다른 신호에서 trace_id로 와야 함"',
      ]},
      s4: {lang:'yaml', filename:'decision.yml — 어느 걸 고를까', lines:[
        '# 의사결정 매트릭스',

                className={`fade-in flex items-center gap-2 px-2 py-1.5 rounded border text-[11px] font-mono ${t.hot ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}
                style={{ animationDelay: `${idx * 120}ms` }}>
                <span className={`w-2 h-2 rounded-full ${t.hot ? 'bg-red-500' : 'bg-slate-400'}`}></span>
                <span className="text-slate-700 w-[88px] shrink-0 truncate">{t.id}</span>
                <span className="text-slate-600 truncate flex-1">{t.svc} · {t.op}</span>
                <span className={`px-1 rounded ${t.status === 500 ? 'bg-red-200 text-red-800' : 'bg-emerald-100 text-emerald-700'}`}>{t.status}</span>
                <span className="text-slate-700">{t.dur}</span>
                <span className="text-slate-400">{t.spans} spans</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Step 2: Tempo + Grafana 통합 — Metrics/Logs → trace_id 점프
    function TempoGrafanaUI() {
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-[#1f1f1f] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">📈</span>
            <span className="text-xs font-bold text-slate-100">Grafana — Explore</span>
            <span className="ml-auto text-[10px] text-orange-300 font-mono">Prom · Loki · Tempo</span>
          </div>
          {/* Prometheus exemplar 패널 */}
          <div className="p-3 border-b border-slate-200">
            <div className="text-[10px] text-slate-500 font-bold mb-1">① Prometheus — http_request_duration_seconds (p99)</div>
            <div className="relative h-16 bg-slate-50 rounded border border-slate-200 overflow-hidden">
              {/* 라인 */}
              <svg viewBox="0 0 200 60" preserveAspectRatio="none" className="absolute inset-0 w-full h-full">
                <polyline points="0,40 30,38 60,30 90,32 120,18 150,22 180,14 200,16"
                  fill="none" stroke="#dc2626" strokeWidth="1.5" />
              </svg>
              {/* exemplar 점들 */}
              <div className="absolute" style={{ left: '60%', top: '30%' }}>
                <div className="w-2.5 h-2.5 rounded-full bg-red-500 ring-2 ring-red-300 fade-in"
                     style={{ animationDelay: '300ms' }}></div>
              </div>
              <div className="absolute" style={{ left: '85%', top: '20%' }}>
                <div className="w-2.5 h-2.5 rounded-full bg-red-500 ring-2 ring-red-300 fade-in"
                     style={{ animationDelay: '600ms' }}></div>
              </div>
              <div className="absolute right-2 bottom-1 text-[9px] text-slate-500 font-mono">▲ exemplar = trace_id</div>
            </div>
          </div>
          {/* Loki 로그 패널 */}
          <div className="p-3 border-b border-slate-200">
            <div className="text-[10px] text-slate-500 font-bold mb-1">② Loki — derived field 매칭</div>
            <div className="font-mono text-[10px] bg-slate-900 text-slate-200 rounded p-2 space-y-0.5">
              <div className="fade-in" style={{ animationDelay: '200ms' }}>
                <span className="text-slate-500">12:04:31</span> level=ERROR msg="checkout failed" <span className="bg-red-500/30 text-red-200 px-1 rounded cursor-pointer">trace_id=a3f2b7c1</span>
              </div>
              <div className="fade-in" style={{ animationDelay: '400ms' }}>
                <span className="text-slate-500">12:04:32</span> level=WARN msg="retry 1/3" <span className="bg-red-500/30 text-red-200 px-1 rounded cursor-pointer">trace_id=a3f2b7c1</span>
              </div>
            </div>
          </div>
          {/* Tempo trace 펼침 */}
          <div className="p-3 bg-slate-50">
            <div className="text-[10px] text-slate-500 font-bold mb-1">③ Tempo — trace_id 클릭 → 같은 화면에서 펼침</div>
            <div className="space-y-1 fade-in" style={{ animationDelay: '900ms' }}>
              {[
                { name: 'checkout-api: POST /checkout', w: 95, c: 'bg-red-500' },
                { name: '└─ cart-svc: GET /cart',        w: 60, c: 'bg-blue-500' },
                { name: '   └─ postgres.SELECT',         w: 38, c: 'bg-cyan-500' },
              ].map((s, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px] font-mono">
                  <span className="w-[150px] truncate text-slate-700">{s.name}</span>
                  <div className="flex-1 h-3 bg-slate-200 rounded overflow-hidden">
                    <div className={`h-full ${s.c}`} style={{ width: `${s.w}%` }}></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Step 3: 스토리지 비용 막대 — Jaeger 5x vs Tempo 0.5x
    function CostBars() {
      const items = [
        { label: 'Jaeger (ES gp3)', mult: 5.0,  cost: '~$300 / mo', color: 'bg-red-500',     pct: 100, sub: '인덱스 1TB + 복제 1TB + 원본 1TB ≈ 3TB' },
        { label: 'Tempo (S3)',      mult: 0.5,  cost: '~$7 / mo',   color: 'bg-emerald-500', pct: 10,  sub: '압축 chunk ~0.3TB, 인덱스 0' },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-800 px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">💰</span>
            <span className="text-xs font-bold text-slate-100">스토리지 비용 비교</span>
            <span className="ml-auto text-[10px] text-slate-400 font-mono">1TB 원본 · 30d 보관</span>
          </div>
          <div className="p-4 space-y-4">
            {items.map((it, i) => (
              <div key={it.label} className="fade-in" style={{ animationDelay: `${i * 250}ms` }}>
                <div className="flex items-end justify-between mb-1">
                  <div>
                    <div className="text-xs font-bold text-slate-800">{it.label}</div>
                    <div className="text-[10px] text-slate-500">{it.sub}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-lg font-bold text-slate-800">{it.mult}x</div>
                    <div className="text-[10px] text-slate-500 font-mono">{it.cost}</div>
                  </div>
                </div>
                <div className="h-6 bg-slate-100 rounded overflow-hidden border border-slate-200">
                  <div className={`h-full ${it.color} grow-bar shadow`}
                       style={{ '--target-width': `${it.pct}%`, animationDelay: `${i * 250 + 200}ms` }}>
                  </div>
                </div>
              </div>
            ))}
            <div className="pt-2 border-t border-slate-100 text-[11px] text-slate-600 leading-relaxed">
              <span className="font-bold text-red-700">자릿수 차이.</span> Jaeger는 ES inverted index가 원본의 1배를 통째로 더 차지한다.
              Tempo는 trace_id만 인덱싱하고 본체를 S3에 압축 저장한다.
            </div>
          </div>
        </div>
      );
    }

    // Step 4: 의사결정 표 — 3축 비교
    function DecisionTable() {
      const rows = [
        { axis: '검색 풍부성',    j: '◎ 임의 tag/duration 모두',    t: '△ trace_id lookup 위주',    win: 'j' },
        { axis: '월 스토리지 비용', j: '✕ ~$300 (ES gp3)',           t: '◎ ~$7 (S3 Standard)',       win: 't' },
        { axis: 'Grafana 통합',  j: '△ 별도 datasource',           t: '◎ exemplar/derived 자연',    win: 't' },
        { axis: '운영 부담',     j: '✕ JVM/샤딩/롤오버',           t: '◎ Go 단일 바이너리',        win: 't' },
        { axis: '보안/감사 임의 검색', j: '◎ 표준 사용',               t: '✕ 보강 중 (TraceQL)',       win: 'j' },
      ];
      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div className="bg-slate-800 px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <span className="text-base">🎯</span>
            <span className="text-xs font-bold text-slate-100">의사결정 표 — 어느 걸 고를까</span>
          </div>
          <div className="p-3">
            <div className="grid grid-cols-[1fr_1fr_1fr] gap-1 text-[11px]">
              <div className="px-2 py-1 bg-slate-100 font-bold text-slate-700 rounded">기준</div>
              <div className="px-2 py-1 bg-red-100 font-bold text-red-800 rounded text-center">🔍 Jaeger</div>
              <div className="px-2 py-1 bg-emerald-100 font-bold text-emerald-800 rounded text-center">📓 Tempo</div>
              {rows.map((r, i) => (
                <React.Fragment key={r.axis}>
                  <div className="px-2 py-1.5 bg-slate-50 border border-slate-200 rounded font-mono text-slate-700 fade-in"
                       style={{ animationDelay: `${i * 150}ms` }}>{r.axis}</div>
                  <div className={`px-2 py-1.5 border rounded fade-in ${r.win === 'j' ? 'bg-red-50 border-red-300 font-bold text-red-800' : 'bg-white border-slate-200 text-slate-600'}`}
                       style={{ animationDelay: `${i * 150 + 80}ms` }}>{r.j}</div>
                  <div className={`px-2 py-1.5 border rounded fade-in ${r.win === 't' ? 'bg-emerald-50 border-emerald-300 font-bold text-emerald-800' : 'bg-white border-slate-200 text-slate-600'}`}
                       style={{ animationDelay: `${i * 150 + 160}ms` }}>{r.t}</div>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-3 pt-2 border-t border-slate-100 text-[11px] text-slate-600 leading-relaxed">
              <span className="font-bold">한 줄.</span> Grafana 스택이면 Tempo, 임의 조건 검색이 필수면 Jaeger. 둘 다 필요하면 OTel Collector로 fan-out.
            </div>
          </div>
        </div>
      );
    }

    // ── 좌측 LiveDataPane: step.key에 따라 분기
    function LiveDataPane({ beat, step }) {
      let inner = null;
      if (step.key === 'jaeger') inner = <JaegerSearchUI />;
      else if (step.key === 'tempo')  inner = <TempoGrafanaUI />;
      else if (step.key === 'cost')   inner = <CostBars />;
      else if (step.key === 'choose') inner = <DecisionTable />;
      return (
        <div className="space-y-2">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {inner}
          <div className="px-3 py-2 bg-slate-50 rounded-lg border border-slate-200 text-[10px] text-slate-500 leading-snug">
            {step.legend}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // 우측: VSCode CodeViewer (highlight.js)
    // ─────────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
              opacity: 0;
              animation: fadeIn 360ms ease-out forwards;
            }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar {
              width: 0;
              animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards;
            }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-red-600 hover:text-red-800 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-2-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-red-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. Observability &gt; Chapter 2. Trace 백엔드</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Jaeger vs Tempo 비교</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                여행 경로 시각화 — <strong>전수 인덱싱의 강력함</strong>(Jaeger) vs <strong>라벨 lookup의 가벼움</strong>(Tempo).
                같은 trace를 다루지만 검색 풍부성 / 비용 / Grafana 통합에서 자릿수가 다른 트레이드오프를 가진다.
              </p>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            <div className="p-4 rounded-xl bg-red-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-red-200">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-red-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-red-50 border-2 border-red-300 text-red-900 text-sm">
                💡 다음(IV-2-2)에서는 <strong>분산 시스템 디버깅</strong>
              </div>
            )}

            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-red-600 text-white hover:bg-red-700 transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./IV-2-2.html" className="text-red-600 hover:text-red-800 font-medium">IV-2-2 분산 시스템 디버깅 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
