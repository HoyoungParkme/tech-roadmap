<!DOCTYPE html>
<html lang="ko">
<head>

  <title>Observability 학습 — I-1-1. Observability란 무엇인가</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🩺</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    I-1-1. Observability란 무엇인가
    학습 목표: 시스템 내부 상태를 외부 출력으로 추론하는 3 pillars(Logs/Metrics/Traces) 이해
    핵심 비유: "의사의 진찰 3종" — Metrics=활력 모니터, Logs=의무 차트, Traces=환자 경로
    패턴: observability 표준 — 좌(LiveDataPane: 3 pillars) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 4 STEPS — 각 단계마다 좌측 LiveDataPane이 점진적으로 활성화
    // focus: 'none' | 'metrics' | 'logs' | 'traces'  (누적 활성화)
    const STEPS = [
      {
        title: 'Step 1. 모니터링 부재 — "사용자 컴플레인이 알람"',
        desc: '대시보드 0개. 로그는 컨테이너 재시작과 함께 휘발. trace는 아예 없음. 사용자 "느려요" 한 마디가 들어와야 운영팀이 어디서부터 봐야 할지 모른 채 헤맨다. MTTR이 시간 단위.',
        focus: 'none',
        active: { metrics: false, logs: false, traces: false },
        legend: '3 pillars 모두 비어있음 — 시스템이 캄캄하다',
        code: {
          lang: 'bash',
          filename: 'incident.sh — 어느 평일 오후',
          lines: [
            '# 운영 환경 — 사고는 사용자가 먼저 알려준다',
            '사용자 A: "결제가 30초째 멈춰있어요"',
            '사용자 B: "장바구니가 사라졌어요"',
            '운영팀: "어… 어디 서버부터 봐야 하지?"',
            '',
            '$ kubectl get pods',
            'NAME                    READY   STATUS    RESTARTS',
            'api-server-7d4f-x9k     1/1     Running   0',
            'api-server-7d4f-z2m     1/1     Running   3   # 재시작됨? 왜?',
            '',
            '$ kubectl logs api-server-7d4f-z2m',
            'Error: previous terminated container log not found',
            '# 휘발됨. 사고 흔적이 사라졌다',
            '',
            '# 우리에게 없는 것',
            '#   X 대시보드 (지금 시스템이 건강한가?)',
            '#   X 영구 로그 (방금 무슨 일이 있었나?)',
            '#   X 분산 추적 (어느 서비스가 느린가?)',
          ],
          highlight: [15, 16, 17, 18],
        },
      },
      {
        title: 'Step 2. Metrics — "활력 모니터" (실시간 수치)',
        desc: 'Prometheus가 각 서비스에서 latency/QPS/에러율을 15초마다 수집. Grafana로 시계열 그래프. 한눈에 "지금 건강한가?"를 본다. 단 "왜?"의 답은 못 한다 — 숫자뿐.',
        focus: 'metrics',
        active: { metrics: true, logs: false, traces: false },
        legend: 'Metrics 활성 — QPS 1,200 / p99 80ms / 에러율 0.1%',
        code: {
          lang: 'python',
          filename: 'metrics.py — FastAPI + prometheus_client',
          lines: [
            '# 4 Golden Signals 중 traffic / latency / errors',
            'from prometheus_client import Counter, Histogram, start_http_server',
            'import time',
            '',
            'request_total = Counter(',
            '    "http_requests_total", "Requests",',
            '    ["method", "path", "status"],',
            ')',
            'request_latency = Histogram(',
            '    "http_request_duration_seconds", "Latency",',
            '    ["path"],',
            ')',
            '',
            '@app.middleware("http")',
            'async def observe(request, call_next):',
            '    start = time.time()',
            '    response = await call_next(request)',
            '    request_total.labels(',
            '        request.method, request.url.path, response.status_code,',
            '    ).inc()',
            '    request_latency.labels(request.url.path).observe(',
            '        time.time() - start,',
            '    )',
            '    return response',
            '',
            'start_http_server(9090)   # /metrics → Prometheus scrape',
            '',
            '# 한계: "QPS 급증" 보지만 "왜 user_id=42가 실패?" 답 못 함',
          ],
          highlight: [5, 9, 14],
        },
      },
      {
        title: 'Step 3. + Logs — "의무 차트" (자세한 기록)',
        desc: '구조화 로그(JSON)를 stdout으로 흘려 Loki/ELK가 수집. request_id로 한 요청의 모든 로그를 한 줄로 묶는다. "왜?"의 답이 여기 있다. 단 분산 환경에서 서비스가 많으면 검색이 무거워진다.',
        focus: 'logs',
        active: { metrics: true, logs: true, traces: false },
        legend: 'Metrics + Logs — 숫자 + 컨텍스트 결합',
        code: {
          lang: 'python',
          filename: 'structured_log.py — JSON 한 줄에 컨텍스트 다 담기',
          lines: [
            '# 구조화 로그 — JSON 한 줄에 context를 다 담는다',
            'import json, logging, uuid',
            '',
            'logger = logging.getLogger("api")',
            '',
            '@app.post("/checkout")',
            'def checkout(payload: dict):',
            '    request_id = str(uuid.uuid4())',
            '    logger.info(json.dumps({',
            '        "request_id": request_id,',
            '        "user_id": payload["user_id"],',
            '        "endpoint": "/checkout",',
            '        "event": "request_started",',
            '    }))',
            '    try:',
            '        result = payment_service.charge(payload)',
            '        return result',
            '    except ConnectionTimeout as e:',
            '        logger.error(json.dumps({',
            '            "request_id": request_id,',
            '            "user_id": payload["user_id"],',
            '            "event": "payment_failed",',
            '            "reason": "ConnectionTimeout",',
            '            "downstream": "payment-service",',
            '        }))',
            '        raise',
            '',
            '# Loki 검색: {service="api"} | json | request_id="abc-123"',
            '# → 해당 요청 전체 흐름이 시간순 한 줄씩 출력',
          ],
          highlight: [9, 19],
        },
      },
      {
        title: 'Step 4. + Traces — "환자 경로" (요청의 흐름)',
        desc: 'OpenTelemetry SDK가 trace_id/span_id를 자동 전파. 4개 마이크로서비스를 거친 한 요청을 폭포수 그래프로 본다. p99 병목이 어느 서비스의 어느 함수인지 즉시 가시화 — 3 pillars 완성.',
        focus: 'traces',
        active: { metrics: true, logs: true, traces: true },
        legend: '3 pillars 완성 — Metrics(언제) + Logs(왜) + Traces(어디서)',
        code: {
          lang: 'python',
          filename: 'tracing.py — OpenTelemetry 자동 계측',
          lines: [
            '# OpenTelemetry — span으로 함수/HTTP 호출을 자동 측정',
            'from opentelemetry import trace',
            'from opentelemetry.sdk.trace import TracerProvider',
            'from opentelemetry.sdk.trace.export import BatchSpanProcessor',
            'from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import (',
            '    OTLPSpanExporter,',
            ')',
            'from opentelemetry.instrumentation.fastapi import FastAPIInstrumentor',
            'from opentelemetry.instrumentation.requests import RequestsInstrumentor',
            '',
            'trace.set_tracer_provider(TracerProvider())',
            'trace.get_tracer_provider().add_span_processor(',
            '    BatchSpanProcessor(OTLPSpanExporter(endpoint="otel-collector:4317")),',
            ')',
            'FastAPIInstrumentor.instrument_app(app)   # 들어오는 HTTP 자동 span',
            'RequestsInstrumentor().instrument()       # 나가는 HTTP 자동 span',
            '',
            'tracer = trace.get_tracer(__name__)',
            '',
            '@app.post("/checkout")',
            'def checkout(payload):',
            '    with tracer.start_as_current_span("validate_cart") as span:',
            '        span.set_attribute("user_id", payload["user_id"])',
            '        validate(payload)',
            '    # → trace_id 하나로 api → cart → payment → ledger 4개 chain',
            '    # → Jaeger UI 폭포수: "payment의 DB query가 800ms" 즉발견',
          ],
          highlight: [15, 16, 22],
        },
      },
    ];

    // ── 좌측: LiveDataPane (3 pillars 시각화)
    function LiveDataPane({ step, stepIdx }) {
      const animKey = `step-${stepIdx}`;
      const a = step.active;

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm" key={animKey}>
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🩺</span>
              <span className="text-xs font-bold text-slate-700">의사의 진찰 3종 — Live Data</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">step {stepIdx + 1}/4</span>
          </div>

          <div className="p-3 space-y-3 min-h-[420px]">

            {/* ① Metrics 카드 */}
            <div className={`rounded-lg border-2 p-3 transition-all duration-300 ${a.metrics ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}>
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-lg">{a.metrics ? '📈' : '❓'}</span>
                  <span className={`text-xs font-bold ${a.metrics ? 'text-red-700' : 'text-slate-400'}`}>Metrics — 활력 모니터</span>
                </div>
                <span className={`text-[9px] px-2 py-0.5 rounded font-mono ${a.metrics ? 'bg-red-200 text-red-800' : 'bg-slate-200 text-slate-500'}`}>
                  {a.metrics ? 'LIVE' : 'OFFLINE'}
                </span>
              </div>
              {a.metrics ? (
                <div className="grid grid-cols-3 gap-2 fade-in">
                  <div className="bg-white rounded border border-red-200 p-2 text-center">
                    <div className="text-[9px] text-slate-500 uppercase tracking-wide">QPS</div>
                    <div className="text-lg font-bold text-red-700 font-mono">1,200</div>
                    <div className="text-[9px] text-slate-400">req/sec</div>
                  </div>
                  <div className="bg-white rounded border border-red-200 p-2 text-center">
                    <div className="text-[9px] text-slate-500 uppercase tracking-wide">p99 latency</div>
                    <div className="text-lg font-bold text-red-700 font-mono">80ms</div>
                    <div className="text-[9px] text-slate-400">last 1m</div>
                  </div>
                  <div className="bg-white rounded border border-red-200 p-2 text-center">
                    <div className="text-[9px] text-slate-500 uppercase tracking-wide">error rate</div>
                    <div className="text-lg font-bold text-red-700 font-mono">0.1%</div>
                    <div className="text-[9px] text-slate-400">5xx / total</div>
                  </div>
                </div>
              ) : (
                <div className="text-center py-3 text-slate-400 text-xs">
                  <span className="text-2xl block">?</span>
                  <span>수치 없음</span>
                </div>
              )}
            </div>

            {/* ② Logs 패널 */}
            <div className={`rounded-lg border-2 p-3 transition-all duration-300 ${a.logs ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}>
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-lg">{a.logs ? '📝' : '❓'}</span>
                  <span className={`text-xs font-bold ${a.logs ? 'text-red-700' : 'text-slate-400'}`}>Logs — 의무 차트</span>
                </div>
                <span className={`text-[9px] px-2 py-0.5 rounded font-mono ${a.logs ? 'bg-red-200 text-red-800' : 'bg-slate-200 text-slate-500'}`}>
                  {a.logs ? 'STREAMING' : 'OFFLINE'}
                </span>
              </div>
              {a.logs ? (
                <div className="bg-slate-900 rounded p-2 font-mono text-[10px] leading-relaxed fade-in">
                  <div className="text-emerald-300">
                    <span className="text-slate-500">12:04:31</span>
                    <span className="text-sky-300 ml-2">[INFO]</span>
                    <span className="text-slate-200 ml-2">request_started</span>
                    <span className="text-slate-400 ml-1">request_id=abc-123</span>
                  </div>
                  <div className="text-emerald-300">
                    <span className="text-slate-500">12:04:31</span>
                    <span className="text-sky-300 ml-2">[INFO]</span>
                    <span className="text-slate-200 ml-2">cart.fetched</span>
                    <span className="text-slate-400 ml-1">items=3</span>
                  </div>
                  <div className="text-emerald-300">
                    <span className="text-slate-500">12:04:31</span>
                    <span className="text-amber-300 ml-2">[WARN]</span>
                    <span className="text-slate-200 ml-2">payment.retry</span>
                    <span className="text-slate-400 ml-1">attempt=2</span>
                  </div>
                  <div className="text-emerald-300">
                    <span className="text-slate-500">12:04:32</span>
                    <span className="text-red-300 ml-2">[ERROR]</span>
                    <span className="text-slate-200 ml-2">payment_failed</span>
                    <span className="text-slate-400 ml-1">reason=Timeout</span>
                  </div>
                </div>
              ) : (
                <div className="text-center py-3 text-slate-400 text-xs">
                  <span className="text-2xl block">?</span>
                  <span>로그 없음</span>
                </div>
              )}
            </div>

            {/* ③ Traces 패널 */}
            <div className={`rounded-lg border-2 p-3 transition-all duration-300 ${a.traces ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}>
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2">
                  <span className="text-lg">{a.traces ? '🔗' : '❓'}</span>
                  <span className={`text-xs font-bold ${a.traces ? 'text-red-700' : 'text-slate-400'}`}>Traces — 환자 경로</span>
                </div>
                <span className={`text-[9px] px-2 py-0.5 rounded font-mono ${a.traces ? 'bg-red-200 text-red-800' : 'bg-slate-200 text-slate-500'}`}>
                  {a.traces ? 'trace_id=X…7c3' : 'OFFLINE'}
                </span>
              </div>
              {a.traces ? (
                <div className="space-y-1 fade-in">
                  {/* 3-span 트리 */}
                  <div className="flex items-center gap-2">
                    <div className="w-[120px] text-[10px] font-mono text-slate-700 truncate">api: /checkout</div>
                    <div className="flex-1 relative h-4 bg-slate-100 rounded">
                      <div className="absolute h-full rounded bg-red-500 border border-red-600" style={{ left: '0%', width: '100%' }}>
                        <span className="absolute inset-0 px-1 flex items-center text-[9px] font-bold text-red-50">250ms</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="w-[120px] text-[10px] font-mono text-slate-700 truncate pl-3">└─ cart.fetch</div>
                    <div className="flex-1 relative h-4 bg-slate-100 rounded">
                      <div className="absolute h-full rounded bg-red-400 border border-red-500" style={{ left: '12%', width: '32%' }}>
                        <span className="absolute inset-0 px-1 flex items-center text-[9px] font-bold text-red-50">80ms</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="w-[120px] text-[10px] font-mono text-slate-700 truncate pl-3">└─ payment.charge</div>
                    <div className="flex-1 relative h-4 bg-slate-100 rounded">
                      <div className="absolute h-full rounded bg-red-300 border border-red-400" style={{ left: '52%', width: '44%' }}>
                        <span className="absolute inset-0 px-1 flex items-center text-[9px] font-bold text-red-700">110ms</span>
                      </div>
                    </div>
                  </div>
                  <div className="text-[9px] text-slate-500 mt-1 font-mono">parent_span_id로 부모-자식 연결 → 폭포수 트리</div>
                </div>
              ) : (
                <div className="text-center py-3 text-slate-400 text-xs">
                  <span className="text-2xl block">?</span>
                  <span>분산 추적 없음</span>
                </div>
              )}
            </div>

          </div>

          {/* 범례/legend */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[10px] text-slate-600 leading-snug font-medium">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
              opacity: 0;
              animation: fadeIn 360ms ease-out forwards;
            }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-red-600 hover:text-red-800 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-red-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Observability 개론 &gt; Chapter 1. 왜 필요한가</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Observability란 무엇인가</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                의사의 진찰 3종 — <strong>3 pillars</strong>로 시스템 내부를 외부 출력만으로 추론한다.
                <code className="bg-slate-100 px-1 rounded text-xs">Metrics</code>(활력 모니터) +
                <code className="bg-slate-100 px-1 rounded text-xs">Logs</code>(의무 차트) +
                <code className="bg-slate-100 px-1 rounded text-xs">Traces</code>(환자 경로).
              </p>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl bg-red-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-red-200">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-red-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-red-50 border-2 border-red-300 text-red-900 text-sm">
                💡 다음(I-1-2)에서는 <strong>Observability vs 모니터링</strong>
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-red-600 text-white hover:bg-red-700 transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./I-1-2.html" className="text-red-600 hover:text-red-800 font-medium">I-1-2 Observability vs 모니터링 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
