  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🕵️</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-1-2. Observability vs 모니터링
    학습 목표: known unknowns(모니터링)과 unknown unknowns(Observability) 차이를 이해
    핵심 비유: "CCTV vs 형사"
      - CCTV(모니터링): 정해진 4 알람만 본다. 안정 녹색.
      - 형사(Observability): high-cardinality 단서(user_id 등)로 임의 질문에 답한다.
    구조: 4단계 (cctv / detective / cardinality / explore)
    패턴: observability 표준 — 좌(LiveDataPane 시각화) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 4 STEPS — 좌측 LiveDataPane이 보여줄 데이터 + 우측 코드
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      cctv: {lang:"yaml", filename:"prometheus-rules.yaml — 사전 정의 4 알람", lines:[
        "# 전통 모니터링 — known unknowns",
        "# \"내가 무엇을 모르는지 알고 있는\" 것만 본다",
        "groups:",
        "- name: classic-4-alarms",
        "  rules:",
        "  - alert: HighCPU",
        "    expr: node_cpu_usage > 0.75",
        "    for: 5m",
        "  - alert: HighMemory",
        "    expr: node_mem_usage > 0.80",
        "    for: 5m",
        "  - alert: DiskFull",
        "    expr: node_disk_usage > 0.85",
        "    for: 5m",
        "  - alert: HighRPS",
        "    expr: rate(http_requests_total[5m]) > 1000",
        "    for: 5m",
        "",
        "# 그러나 새 장애가 발생하면?",
        "# \"user_id=123인 사용자만 결제가 느려요\"",
        "# → dashboard에 그런 항목이 없다",
        "# → 추가하려면 코드 수정 + 재배포",
        "# → CCTV는 새 각도로 못 돌린다",
      ]},
      detective: {lang:"python", filename:"detective.py — 풍부한 attribute 기록", lines:[
        "# Observability — 풍부한 attribute로 span 기록",
        "# 형사처럼 단서를 모은다",
        "from opentelemetry import trace",
        "",
        "tracer = trace.get_tracer(__name__)",
        "",
        "@app.post(\"/checkout\")",
        "def checkout(request):",
        "    with tracer.start_as_current_span(\"checkout\") as span:",
        "        # 임의의 attribute = 미래의 질문을 위한 단서",
        "        span.set_attributes({",
        "            \"user.id\":         request.user_id,",
        "            \"user.tier\":       request.user_tier,",
        "            \"user.country\":    request.country,",
        "            \"device.type\":     request.device,",
        "            \"app.version\":     APP_VERSION,",
        "            \"cart.items\":      len(request.items),",
        "            \"feature_flag.v2\": flags.is_enabled(\"v2\"),",
        "        })",
        "        result = process(request)",
        "        span.set_attribute(\"result.status\", result.status)",
        "        return result",
        "",
        "# 장애 발생 후 — Honeycomb / Tempo 즉시 질의",
        "#   WHERE user.id = 123",
        "#   GROUP BY name",
        "#   PERCENTILE(duration_ms, 0.99)",
        "# → user_id=123 의 p99 = 1200ms (즉시)",
        "# → 새 dashboard X, 재배포 X",
      ]},
      cardinality: {lang:"shell", filename:"cardinality.sh — 고유값 폭발 비교", lines:[
        "# Cardinality 비교 — 1M user_ids",
        "",
        "# 저카디널리티 (Prometheus/Loki label 친화)",
        "http_status:    200, 404, 500           → 고유값 ~10",
        "http_method:    GET, POST, PUT, DELETE  → 고유값 ~5",
        "region:         seoul, tokyo, us-east   → 고유값 ~10",
        "",
        "# 고카디널리티 (전통 메트릭의 적)",
        "user_id:        1, 2, 3, ..., 1,000,000 → 고유값 1M",
        "request_id:     uuid                    → 사실상 무한",
        "trace_id:       hex                     → 사실상 무한",
        "",
        "# Loki에 user_id를 라벨로 붙이면?",
        "{app=\"checkout\", user_id=\"1\"}     ← stream 1개",
        "{app=\"checkout\", user_id=\"2\"}     ← stream 1개",
        "...",
        "{app=\"checkout\", user_id=\"1M\"}    ← stream 1M개",
        "→ ingester 메모리 폭발, OOM (cardinality explosion)",
        "",
        "# Honeycomb/Tempo 는 다르게 처리",
        "Honeycomb:   columnar store, 모든 attribute 인덱싱",
        "Tempo:       trace_id로 인덱싱, attribute 본문 스캔",
        "",
        "→ \"user_id=123\" 쿼리가 1초 안에 끝남",
        "→ 형사가 지문(고카디널리티 단서)으로 범인을 잡는다",
      ]},
      explore: {lang:"shell", filename:"explore.logql — ad-hoc 가설 검증", lines:[
        "# Exploration — 가설이 떠오르면 즉시 쿼리",
        "",

              <span className="text-xs font-bold text-slate-700">
                {step.focus === 'cctv' && '모니터링 — 사전 정의 4 알람'}
                {step.focus === 'detective' && 'Observability — high-cardinality 검색'}
                {step.focus === 'cardinality' && 'Cardinality — Loki vs Honeycomb'}
                {step.focus === 'explore' && 'Exploration — ad-hoc 쿼리 결과'}
              </span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">
              {step.focus === 'cctv' && 'classic-4-alarms'}
              {step.focus === 'detective' && 'honeycomb://prod'}
              {step.focus === 'cardinality' && 'cardinality scan'}
              {step.focus === 'explore' && 'logql://checkout'}
            </span>
          </div>

          <div className="p-4 min-h-[360px]" key={animKey}>
            {/* ── Step 1: CCTV 4 알람 — 임계 안 녹색 */}
            {step.focus === 'cctv' && (
              <div className="space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  {CCTV_ALARMS.map((a, i) => (
                    <div
                      key={a.id}
                      className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-3 fade-in"
                      style={{ animationDelay: `${i * 180}ms` }}
                    >
                      <div className="flex items-center gap-2 mb-2">
                        <span className="text-xl">{a.icon}</span>
                        <span className="text-xs font-bold text-slate-700">{a.label}</span>
                        <span className="ml-auto text-[10px] text-emerald-700 font-bold">● OK</span>
                      </div>
                      <div className="text-2xl font-mono font-bold text-emerald-700">{a.value}</div>
                      <div className="text-[10px] text-slate-500 font-mono mt-1">threshold {a.threshold}</div>
                    </div>
                  ))}
                </div>
                <div className="rounded-lg bg-slate-100 border border-slate-200 p-3 text-[11px] text-slate-600 fade-in" style={{ animationDelay: '720ms' }}>
                  <div className="font-bold text-slate-700 mb-1">📺 CCTV 화면 — 4개 구역 모두 녹색</div>
                  "user_id=123 만 느려요" 같은 질문엔 답할 수 없다. 화면에 그런 칸이 없으니까.
                </div>
              </div>
            )}

            {/* ── Step 2: 형사 high-cardinality 검색 */}
            {step.focus === 'detective' && (
              <div className="space-y-3">
                {/* query input 박스 */}
                <div className="rounded-lg bg-slate-900 border border-red-500/40 p-3 fade-in" style={{ animationDelay: '0ms' }}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-[10px] font-bold text-red-400">QUERY</span>
                    <span className="text-[10px] text-slate-500 font-mono">honeycomb</span>
                    <span className="ml-auto inline-block w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                  </div>
                  <div className="font-mono text-xs text-emerald-300 break-all">
                    {DETECTIVE_QUERIES[queryIdx].q}
                    <span className="inline-block w-1.5 h-3.5 bg-emerald-300 ml-1 align-middle animate-pulse"></span>
                  </div>
                </div>

                {/* 응답 카드 */}
                <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3 fade-in" key={`a-${queryIdx}`} style={{ animationDelay: '120ms' }}>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold text-red-700 uppercase">{DETECTIVE_QUERIES[queryIdx].tag}</span>
                    <span className="text-xs text-slate-700">{DETECTIVE_QUERIES[queryIdx].label}</span>
                  </div>
                  <div className="text-3xl font-mono font-bold text-red-700">
                    {DETECTIVE_QUERIES[queryIdx].answer}
                  </div>
                  <div className="text-[11px] text-slate-600 mt-1">{DETECTIVE_QUERIES[queryIdx].extra}</div>
                </div>

                {/* 다른 쿼리 미리보기 */}
                <div className="space-y-1">
                  {DETECTIVE_QUERIES.map((q, i) => (
                    <div
                      key={i}
                      className={`text-[11px] font-mono px-2 py-1 rounded transition-all ${
                        i === queryIdx ? 'bg-red-100 text-red-800 font-bold' : 'bg-slate-50 text-slate-500'
                      }`}
                    >
                      <span className="mr-1">{i === queryIdx ? '▶' : '·'}</span>
                      {q.label}
                    </div>
                  ))}
                </div>

                <div className="text-[10px] text-slate-500 leading-snug">
                  사전 dashboard 없이도 임의 attribute로 즉시 질문 가능 — unknown unknowns 디버깅
                </div>
              </div>
            )}

            {/* ── Step 3: Cardinality 표 + 1M 카운터 */}
            {step.focus === 'cardinality' && (
              <div className="space-y-3">
                {/* 카운터 — 1M unique user_ids */}
                <div className="rounded-lg bg-slate-900 border border-red-500/40 p-3 fade-in" style={{ animationDelay: '0ms' }}>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold text-red-400">UNIQUE user_id</span>
                    <span className="ml-auto text-[10px] text-slate-500 font-mono">last 24h</span>
                  </div>
                  <div className="text-3xl font-mono font-bold text-red-400">1,000,000</div>
                  <div className="text-[11px] text-slate-400 mt-1">cardinality = 1M (사실상 무한급)</div>
                </div>

                {/* 비교 표 */}
                <div className="rounded-lg border border-slate-200 overflow-hidden">
                  <table className="w-full text-[11px]">
                    <thead>
                      <tr className="bg-slate-100 text-slate-600">
                        <th className="text-left px-2 py-1.5 font-bold">field</th>
                        <th className="text-right px-2 py-1.5 font-bold">unique</th>
                        <th className="text-left px-2 py-1.5 font-bold">tool</th>
                        <th className="text-left px-2 py-1.5 font-bold">verdict</th>
                      </tr>
                    </thead>
                    <tbody>
                      {CARDINALITY_ROWS.map((r, i) => (
                        <tr
                          key={i}
                          className={`border-t border-slate-100 fade-in ${r.ok ? 'bg-white' : 'bg-red-50'}`}
                          style={{ animationDelay: `${120 + i * 80}ms` }}
                        >
                          <td className="px-2 py-1.5 font-mono text-slate-700">{r.field}</td>
                          <td className="px-2 py-1.5 font-mono text-right text-slate-600">{typeof r.unique === 'number' ? r.unique.toLocaleString() : r.unique}</td>
                          <td className="px-2 py-1.5 text-slate-600">{r.tool}</td>
                          <td className={`px-2 py-1.5 ${r.ok ? 'text-emerald-700' : 'text-red-700 font-bold'}`}>
                            {r.ok ? '✓ ' : '✗ '}{r.note}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="text-[10px] text-slate-500 leading-snug">
                  같은 user_id 1M — Loki label 은 OOM, Honeycomb columnar 는 1초. 도구 선택의 핵심.
                </div>
              </div>
            )}

            {/* ── Step 4: ad-hoc query input + 결과 표 */}
            {step.focus === 'explore' && (
              <div className="space-y-3">
                {/* query input */}
                <div className="rounded-lg bg-slate-900 border border-red-500/40 p-3 fade-in" style={{ animationDelay: '0ms' }}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-[10px] font-bold text-red-400">AD-HOC QUERY</span>
                    <span className="text-[10px] text-slate-500 font-mono">LogQL</span>
                    <span className="ml-auto inline-block w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                  </div>
                  <div className="font-mono text-[11px] text-emerald-300 leading-relaxed">
                    {'{app="checkout"} | json | status >= 500'}<br />
                    {'  | line_format "{{.user_agent}}"'}
                    <span className="inline-block w-1.5 h-3 bg-emerald-300 ml-1 align-middle animate-pulse"></span>
                  </div>
                </div>

                {/* 결과 표 — user-agent 분포 */}
                <div className="rounded-lg border border-slate-200 overflow-hidden">
                  <div className="bg-slate-100 px-3 py-1.5 text-[10px] font-bold text-slate-600">5xx 요청의 user-agent 분포 (n=8,200)</div>
                  <div className="divide-y divide-slate-100">
                    {EXPLORE_RESULT.map((r, i) => (
                      <div
                        key={r.ua}
                        className={`px-3 py-2 flex items-center gap-3 fade-in ${r.suspect ? 'bg-red-50' : 'bg-white'}`}
                        style={{ animationDelay: `${200 + i * 160}ms` }}
                      >
                        <div className="w-28 text-[11px] font-mono text-slate-700 truncate">{r.ua}</div>
                        <div className="flex-1 h-4 bg-slate-100 rounded overflow-hidden">
                          <div
                            className={`h-full grow-bar rounded ${r.suspect ? 'bg-red-500' : 'bg-slate-400'}`}
                            style={{ '--target-width': `${r.pct}%`, animationDelay: `${260 + i * 160}ms` }}
                          />
                        </div>
                        <div className={`w-12 text-right text-[11px] font-mono font-bold ${r.suspect ? 'text-red-700' : 'text-slate-600'}`}>{r.pct}%</div>
                        <div className="w-14 text-right text-[10px] font-mono text-slate-500">{r.count.toLocaleString()}</div>
                        {r.suspect && <span className="text-[10px] font-bold text-red-700">◀ 의심</span>}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="text-[10px] text-slate-500 leading-snug">
                  사전 dashboard 없이 30초 안에 범인 후보 발견 — Safari 17.4 의 SSL 핸드셰이크 이슈 의심
                </div>
              </div>
            )}
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어 (highlight.js)
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
              opacity: 0;
              animation: fadeIn 360ms ease-out forwards;
            }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar {
              width: 0;
              animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards;
            }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-red-600 hover:text-red-800 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-1-2</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-red-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Observability 개론 &gt; Chapter 1. 왜 Observability인가</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Observability vs 모니터링</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                CCTV vs 형사 — <strong>known unknowns</strong>(예측된 알람) vs <strong>unknown unknowns</strong>(처음 보는 장애).
                전자는 <code className="bg-slate-100 px-1 rounded text-xs">미리 정한 4 알람</code>만 본다,
                후자는 <code className="bg-slate-100 px-1 rounded text-xs">user_id</code> 같은 high-cardinality 단서로 임의 질문에 답한다.
              </p>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl bg-red-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-red-200">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-red-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-red-50 border-2 border-red-300 text-red-900 text-sm">
                💡 다음(I-2-1)에서는 <strong>SRE 4 Golden Signals — Latency / Traffic / Errors / Saturation</strong>
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-red-600 text-white hover:bg-red-700 transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-1-1.html" className="text-slate-500 hover:text-slate-700">&larr; I-1-1</a>
              <a href="../part1/I-2-1.html" className="text-red-600 hover:text-red-800 font-medium">I-2-1 SRE 4 Golden Signals &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
